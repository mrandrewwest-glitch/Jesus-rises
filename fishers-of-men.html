// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Little extra sounds for the fishing, built from the same tone()/noise helpers
Object.assign(sfx, {
  noiseBurst(freq, type, vol, dur, q = 0.8) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  cast() { this.noiseBurst(700, 'lowpass', 0.5, 0.35); this.tone(320, 0.2, 'sine', 0.12, 0, 130); },
  catchFish(k) { this.tone(520 + Math.min(k, 14) * 45, 0.11, 'triangle', 0.13); },
  gold() { [880, 1175, 1568, 1760].forEach((f, i) => this.tone(f, 0.25, 'sine', 0.13, i * 0.07)); },
  junk(crab) {
    this.tone(200, 0.22, 'square', 0.06, 0, 110);
    if (crab) { this.tone(1500, 0.05, 'square', 0.07, 0.12); this.tone(1500, 0.05, 'square', 0.07, 0.22); }
  },
  creak(s) { this.tone(90 + s * 30, 0.32, 'sawtooth', 0.05, 0, 68); },
  tear(v) { this.noiseBurst(2600, 'highpass', 0.35 * v, 0.3); if (v >= 1) this.thunder(); },
  call() { this.tone(660, 0.14, 'sine', 0.2); this.tone(880, 0.24, 'sine', 0.2, 0.16); },
  haul(h) { if (!this.ctx) return; this.puff(0.2); playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.02, 0.2 + h * 0.6); },
  perfect() {
    if (!this.ctx) return;
    [0.45, 0.7, 1].forEach((h, i) => playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.05 + i * 0.16, h));
  },
  chime() { this.tone(1046, 0.3, 'sine', 0.13); this.tone(1318, 0.4, 'sine', 0.11, 0.12); },
});

// ============================================================
//  Rendering
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(60, 250), w: rand(90, 170), speed: rand(6, 14) }));
const gulls = Array.from({ length: 3 }, () => ({ f: Math.random(), y: rand(120, 260), speed: rand(18, 30), phase: rand(0, TAU) }));

function updateScenery(dt) {
  for (const c of bgClouds) { c.f += (c.speed * dt) / (viewW + 300); if (c.f > 1) c.f -= 1; }
  for (const g of gulls) { g.f += (g.speed * dt) / (viewW + 200); if (g.f > 1) { g.f -= 1; g.y = rand(100, 260); } }
}

// 0 at dawn, 1 when the sun is high
function dayP() { return state === 'title' ? 0.1 : clamp(1 - timeLeft / cfg.time, 0, 1); }

function drawSky() {
  const p = dayP();
  const g = ctx.createLinearGradient(0, -offY, 0, SEA_Y);
  g.addColorStop(0, mix('#f29c7c', '#6fb6ea', p));
  g.addColorStop(0.55, mix('#ffc493', '#a8d8f4', p));
  g.addColorStop(1, mix('#ffe6b0', '#e4f4fb', p));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, SEA_Y + offY + 10);

  // The sun climbs as the morning passes: it is the level timer
  const sx = W * 0.8, sy = lerp(SEA_Y - 45, 95, p);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 140);
  sg.addColorStop(0, `rgba(255,240,180,${0.75 - p * 0.25})`);
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 140, 0, TAU); ctx.fill();
  ctx.fillStyle = mix('#ff9f4a', '#fff3b0', p);
  ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();

  for (const c of bgClouds) {
    drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', mix('#f6d3c4', '#dbe9f5', p));
  }
  // Gulls
  ctx.strokeStyle = 'rgba(70,60,60,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const gl of gulls) {
    const x = -offX - 100 + gl.f * (viewW + 200), y = gl.y + Math.sin(t + gl.phase) * 6;
    const flap = Math.sin(t * 6 + gl.phase) * 4;
    ctx.beginPath();
    ctx.moveTo(x - 10, y - flap); ctx.quadraticCurveTo(x - 5, y - 6 - flap, x, y);
    ctx.quadraticCurveTo(x + 5, y - 6 - flap, x + 10, y - flap);
    ctx.stroke();
  }
}

// Far shore of Galilee: hills, a little fishing village, a palm
function drawShore() {
  const p = dayP();
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  ctx.fillStyle = mix('#b88fa6', '#98b9a0', p);
  ctx.beginPath(); ctx.moveTo(x0, SEA_Y);
  for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, SEA_Y - 70 + Math.sin(x / 150) * 24 + Math.sin(x / 53) * 7);
  ctx.lineTo(x1, SEA_Y); ctx.fill();
  const hy = (x) => SEA_Y - 34 + Math.sin(x / 95 + 1) * 9;
  ctx.fillStyle = mix('#9a9a6e', '#86ad69', p);
  ctx.beginPath(); ctx.moveTo(x0, SEA_Y);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, hy(x));
  ctx.lineTo(x1, SEA_Y); ctx.fill();

  // Village houses
  for (let i = 0; i < 5; i++) {
    const x = W * 0.06 + i * 22, y = hy(x) + 4;
    const h = 14 + (i % 2) * 6;
    ctx.fillStyle = i % 2 ? '#ead7ae' : '#e2c795';
    ctx.fillRect(x, y - h, 18, h);
    ctx.fillStyle = '#b89a66'; ctx.fillRect(x - 1, y - h - 3, 20, 3);
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x + 7, y - 7, 4, 7);
  }
  // Palm
  const px = W * 0.93, py = hy(W * 0.93) + 4;
  ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px - 6, py - 30, px + 4, py - 58); ctx.stroke();
  ctx.strokeStyle = '#4f8a3c'; ctx.lineWidth = 4;
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + (k - 2) * 0.62 + Math.sin(t * 1.2 + k) * 0.04;
    ctx.beginPath(); ctx.moveTo(px + 4, py - 58);
    ctx.quadraticCurveTo(px + 4 + Math.cos(a) * 18, py - 58 + Math.sin(a) * 18 - 8, px + 4 + Math.cos(a) * 30, py - 58 + Math.sin(a) * 26 + 10);
    ctx.stroke();
  }

  // The far lake, catching the morning light
  const g = ctx.createLinearGradient(0, SEA_Y - 22, 0, SEA_Y + 6);
  g.addColorStop(0, mix('#f7c9a2', '#a6d6ef', p));
  g.addColorStop(1, mix('#7fb2d2', '#5aa6d6', p));
  ctx.fillStyle = g;
  ctx.fillRect(x0, SEA_Y - 22, x1 - x0, 30);
  ctx.strokeStyle = 'rgba(255,250,220,0.45)'; ctx.lineWidth = 1.5;
  const sx = W * 0.8;
  for (let i = 0; i < 6; i++) {
    const y = SEA_Y - 18 + i * 3.4, w = 34 - i * 3 + Math.sin(t * 3 + i) * 6;
    ctx.beginPath(); ctx.moveTo(sx - w / 2 + Math.sin(t * 2 + i * 2) * 5, y); ctx.lineTo(sx + w / 2 + Math.sin(t * 2 + i * 2) * 5, y); ctx.stroke();
  }
}

// Fish lying in a boat, peeking over the rail
function drawPile(x0, x1, load, y) {
  const n = Math.round(clamp(load, 0, 1.2) * 12);
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, hsh(i, 9));
    const row = Math.floor(i / 7);
    ctx.save();
    ctx.translate(x, y - 3 - row * 6);
    ctx.rotate((hsh(i, 3) - 0.5) * 0.8);
    ctx.fillStyle = FISH_COLORS[i % FISH_COLORS.length];
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-16, -5); ctx.lineTo(-16, 5); ctx.fill();
    ctx.restore();
  }
}

function lookAt(lxw, lyw, px, py) {
  const dx = lxw - px, dy = lyw - py;
  const len = Math.hypot(dx, dy) || 1;
  return [dx / len, dy / len];
}

function drawPeterBoat() {
  const bx = boatX(), by = boatY();
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(Math.sin(t * 1.1) * 0.015);

  // Mast with the sail furled on its yard
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(-30, -205); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-86, -180); ctx.lineTo(28, -190); ctx.stroke();
  ctx.fillStyle = '#e9dfc4';
  ctx.save(); ctx.translate(-29, -185); ctx.rotate(-0.087);
  roundRect(-54, -2, 108, 11, 5.5); ctx.fill();
  ctx.restore();

  // People: Jesus at the stern, Andrew and Peter
  const win = state === 'win';
  const zx = zoneX(net.side) - bx, zy = NET_TOP + 90 - by;
  const kneelF = win ? clamp(winT / 0.8, 0, 1) : 0;
  const peterX = lerp(8, -40, kneelF), peterY = -6 + kneelF * 12;
  let pose = 'point';
  if (win) pose = winT > 0.8 ? 'bless' : 'open';
  else if (state === 'fail') pose = 'open';
  drawPile(-100, 110, stats.landed / cfg.goal + winSink * 0.3, -36);
  drawJesus(-80, -6, CS, pose, blessed, win ? 'joy' : 'calm');

  const [alx, aly] = lookAt(zx, zy, 64, -64);
  drawDisciple({ d: DISCIPLES[1], x: 64, y: -6, s: CS, lx: alx, ly: aly });
  const [plx, ply] = win ? [-0.9, -0.4] : lookAt(zx, zy, peterX, peterY - 58);
  drawDisciple({ d: DISCIPLES[0], x: peterX, y: peterY, s: CS, lx: plx, ly: ply, kneel: kneelF > 0.5 });

  // Hull
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.moveTo(-140, -40);
  ctx.quadraticCurveTo(0, -30, 142, -46);
  ctx.quadraticCurveTo(130, 10, 80, 22);
  ctx.lineTo(-94, 22);
  ctx.quadraticCurveTo(-138, 12, -140, -40);
  ctx.closePath();
  ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 3;
  for (const y of [-20, -6, 8]) { ctx.beginPath(); ctx.moveTo(-150, y); ctx.lineTo(150, y - 3); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-141, -40); ctx.quadraticCurveTo(0, -30, 143, -46); ctx.stroke();
  // A painted eye on the bow
  ctx.fillStyle = '#f3e6c4'; ctx.beginPath(); ctx.ellipse(112, -24, 7, 4.5, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(113, -24, 2.3, 0, TAU); ctx.fill();

  // Net coiled on the rail when it's empty and aboard
  if (net.phase === 'idle' && net.fish === 0 && net.junk.length === 0 && state !== 'win') {
    const nx = side * 108, ny = side > 0 ? -46 : -42;
    ctx.fillStyle = 'rgba(214,196,150,0.95)';
    ctx.beginPath(); ctx.ellipse(nx, ny, 22, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a58f5c'; ctx.lineWidth = 1.2;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(nx + k * 8 - 4, ny - 8); ctx.lineTo(nx + k * 8 + 4, ny + 8); ctx.stroke(); }
    ctx.fillStyle = '#e0913a';
    ctx.beginPath(); ctx.arc(nx - 14, ny - 5, 3.5, 0, TAU); ctx.arc(nx + 12, ny - 6, 3.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// James and John's boat, drawn a little further away
function drawPartnerBoat() {
  const p = partner;
  if (p.phase === 'away') return;
  const px = p.x, py = partnerY();
  const S = 0.78;
  const moving = p.phase === 'coming' || p.phase === 'leaving';
  if (moving && Math.random() < 0.5) spawn(px - p.dir * 90, SEA_Y + 2, -p.dir * rand(20, 60), rand(-40, -10), 0.5, 'rgba(255,255,255,0.9)', rand(2, 4), 200);
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(S, S);
  ctx.rotate(Math.sin(t * 1.3 + 2) * 0.02);

  // Mast and sail (full when sailing)
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -195); ctx.stroke();
  ctx.fillStyle = '#efe4c8'; ctx.strokeStyle = '#cbbf9c'; ctx.lineWidth = 2;
  const belly = (moving ? 46 : 22) * p.dir + Math.sin(t * 3) * 3;
  ctx.beginPath();
  ctx.moveTo(-4, -188);
  ctx.quadraticCurveTo(belly, -130, -4, -70);
  ctx.lineTo(-58 * p.dir - 4, -86);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.moveTo(0, -195); ctx.lineTo(18 * -p.dir, -190); ctx.lineTo(0, -185); ctx.fill();

  const zx = (zoneX(p.side) - px) / S, zy = (NET_TOP + 60 - py) / S;
  drawPile(-90, 95, stats.landed / cfg.goal + winSink * 0.3, -34);
  const [jlx, jly] = state === 'win' ? [0, -1] : lookAt(zx, zy, -44, -64);
  drawDisciple({ d: DISCIPLES[2], x: -44, y: -6, s: CS, lx: jlx, ly: jly });
  const [olx, oly] = state === 'win' ? [0, -1] : lookAt(zx, zy, 40, -64);
  drawDisciple({ d: DISCIPLES[3], x: 40, y: -6, s: CS, lx: olx, ly: oly });

  ctx.fillStyle = '#7d5230';
  ctx.beginPath();
  ctx.moveTo(-118, -38);
  ctx.quadraticCurveTo(0, -30, 120, -40);
  ctx.quadraticCurveTo(108, 10, 64, 20);
  ctx.lineTo(-74, 20);
  ctx.quadraticCurveTo(-116, 10, -118, -38);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#5f3c1e'; ctx.lineWidth = 3;
  for (const y of [-18, -4, 9]) { ctx.beginPath(); ctx.moveTo(-130, y); ctx.lineTo(130, y); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#9c6a36'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-119, -38); ctx.quadraticCurveTo(0, -30, 121, -40); ctx.stroke();
  ctx.restore();
}

// The underwater cut-away: water, light rays, sandy lake bed
function drawWater() {
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(x0, H + 10);
    for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, surf(x));
    ctx.lineTo(x1, H + 10);
    ctx.closePath();
  };
  path();
  const g = ctx.createLinearGradient(0, SEA_Y - 6, 0, H);
  g.addColorStop(0, 'rgba(110,190,225,0.55)');
  g.addColorStop(0.06, 'rgba(52,138,188,0.95)');
  g.addColorStop(0.5, '#1f6b9c');
  g.addColorStop(1, '#0f3a60');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  path(); ctx.clip();
  // Light rays
  ctx.fillStyle = 'rgba(255,255,220,0.06)';
  for (let i = 0; i < 6; i++) {
    const x = x0 + (x1 - x0) * (i + 0.5) / 6 + Math.sin(t * 0.3 + i * 1.7) * 30;
    ctx.beginPath();
    ctx.moveTo(x - 18, SEA_Y); ctx.lineTo(x + 26, SEA_Y); ctx.lineTo(x + 130, H); ctx.lineTo(x + 30, H);
    ctx.closePath(); ctx.fill();
  }
  // Lake bed
  const bed = (x) => H - 46 + Math.sin(x / 70) * 6 + Math.sin(x / 23) * 3;
  const bg = ctx.createLinearGradient(0, H - 60, 0, H);
  bg.addColorStop(0, '#b99d63'); bg.addColorStop(1, '#7d6440');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, bed(x));
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  // Pebbles and swaying weeds
  for (let i = 0; i < 28; i++) {
    const x = x0 + hsh(i, 1) * (x1 - x0);
    ctx.fillStyle = ['#9c8a6e', '#8a7a64', '#b0a080'][i % 3];
    ctx.beginPath(); ctx.ellipse(x, bed(x) + 8 + hsh(i, 2) * 20, 5 + hsh(i, 3) * 5, 3 + hsh(i, 4) * 3, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#3f7f4a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const x = x0 + hsh(i, 7) * (x1 - x0), y = bed(x) + 4, h = 30 + hsh(i, 8) * 40;
    const sw = Math.sin(t * 1.4 + i) * 8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 8 + sw * 0.5, y - h * 0.5, x + sw, y - h); ctx.stroke();
  }
  ctx.restore();
}

function drawSurfaceLine() {
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, surf(x));
  ctx.stroke();
}

// The two places the net can go, with a glowing hint on the side Jesus points to
function drawZones() {
  if (state !== 'play' && state !== 'title' && state !== 'pause') return;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  for (const s of [-1, 1]) {
    const z = zoneRect(s);
    const isB = s === blessed, sel = s === side && state !== 'title';
    ctx.fillStyle = isB ? `rgba(255,220,120,${0.08 + pulse * 0.06})` : 'rgba(255,255,255,0.03)';
    roundRect(z.x0, z.y0, z.x1 - z.x0, z.y1 - z.y0, 16); ctx.fill();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = sel ? 'rgba(255,255,255,0.7)' : isB ? 'rgba(255,225,140,0.45)' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = sel ? 3 : 2;
    ctx.stroke();
    ctx.setLineDash([]);
    if (isB) {
      const zx = (z.x0 + z.x1) / 2;
      const gl = ctx.createRadialGradient(zx, SEA_Y, 4, zx, SEA_Y, 90);
      gl.addColorStop(0, `rgba(255,236,150,${0.45 + pulse * 0.3})`);
      gl.addColorStop(1, 'rgba(255,236,150,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.ellipse(zx, SEA_Y, 90, 22, 0, 0, TAU); ctx.fill();
      if (net.phase === 'idle' && net.fish === 0) {
        ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,60,100,0.8)'; ctx.lineJoin = 'round';
        const label = blessed > 0 ? 'the right side' : 'cast here!';
        const ly = NET_TOP + 34 + pulse * 3;
        ctx.strokeText(label, zx, ly);
        ctx.fillStyle = '#ffe27a'; ctx.fillText(label, zx, ly);
        ctx.beginPath(); ctx.moveTo(zx - 7, ly + 8); ctx.lineTo(zx + 7, ly + 8); ctx.lineTo(zx, ly + 16); ctx.fill();
      }
    }
  }
}

function drawFish(x, y, size, dir, color, phase, gold) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir * size, size);
  const wag = Math.sin(t * 11 + phase);
  const col = gold ? '#f7c948' : color;
  if (gold) {
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
    g.addColorStop(0, 'rgba(255,236,140,0.7)'); g.addColorStop(1, 'rgba(255,236,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = shade(col, -25);
  ctx.beginPath();
  ctx.moveTo(-12, 0); ctx.lineTo(-24, -9 + wag * 3); ctx.quadraticCurveTo(-20, 0, -24, 9 + wag * 3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.quadraticCurveTo(0, -15, 7, -7); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(1, 3, 11, 3.8, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(col, -45); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(3, 0, 6, -0.9, 0.9); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -2, 2.8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1d1a18'; ctx.beginPath(); ctx.arc(8.8, -2, 1.4, 0, TAU); ctx.fill();
  if (gold && Math.sin(t * 8 + phase) > 0.7) {
    ctx.fillStyle = '#fffbe0';
    ctx.beginPath(); ctx.arc(-4, -4, 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawJunk(kind, x, y, s, phase, dir = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.lineCap = 'round';
  if (kind === 'sandal') {
    ctx.rotate(Math.sin(t * 1.3 + phase) * 0.3);
    ctx.fillStyle = '#8b5a2b'; ctx.strokeStyle = '#5e3b1b'; ctx.lineWidth = 2;
    roundRect(-17, -5, 34, 11, 6); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c08a4a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-3, -3, 7, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -3, 5, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  } else if (kind === 'weed') {
    for (const [dx, c] of [[-7, '#3f8f4f'], [0, '#5fae5f'], [7, '#4a9a52']]) {
      const sw = Math.sin(t * 2 + phase + dx) * 6;
      ctx.strokeStyle = c; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(dx, 14); ctx.bezierCurveTo(dx + 8 + sw, 4, dx - 8 - sw, -6, dx + sw * 0.5, -18); ctx.stroke();
    }
    ctx.fillStyle = '#6fbf6a';
    ctx.beginPath(); ctx.ellipse(-3, -4, 5, 2.5, 0.6, 0, TAU); ctx.ellipse(5, 2, 5, 2.5, -0.6, 0, TAU); ctx.fill();
  } else if (kind === 'crab') {
    const step = Math.sin(t * 12 + phase) * 3;
    ctx.strokeStyle = '#c24a26'; ctx.lineWidth = 3;
    for (const sx of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.moveTo(sx * 10, 2 + k * 3); ctx.lineTo(sx * 20, 6 + k * 4 + (k % 2 ? step : -step)); ctx.lineTo(sx * 23, 12 + k * 3); ctx.stroke();
      }
      // claws
      ctx.beginPath(); ctx.moveTo(sx * 12, -4); ctx.lineTo(sx * 20, -12); ctx.stroke();
      ctx.fillStyle = '#e8643c';
      ctx.beginPath(); ctx.arc(sx * 22, -15, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0f3a60';
      ctx.beginPath(); ctx.moveTo(sx * 22, -15); ctx.lineTo(sx * 29, -19 - step * 0.5); ctx.lineTo(sx * 28, -12); ctx.fill();
    }
    ctx.fillStyle = '#e8643c';
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 11, 0, 0, TAU); ctx.fill();
    // eyes on stalks, grumpy brows
    ctx.strokeStyle = '#c24a26'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(-6, -15); ctx.moveTo(5, -8); ctx.lineTo(6, -15); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-6, -16, 3.2, 0, TAU); ctx.arc(6, -16, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1d1a18'; ctx.beginPath(); ctx.arc(-6 + dir, -15.5, 1.5, 0, TAU); ctx.arc(6 + dir, -15.5, 1.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#7a2412'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -21); ctx.lineTo(-3, -18); ctx.moveTo(10, -21); ctx.lineTo(3, -18); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 5, 4, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawSwimmers() {
  for (const f of swimmers) {
    const bob = Math.sin(t * 3 + f.phase) * 2;
    if (f.kind === 'fish' || f.kind === 'gold') {
      drawFish(f.x, f.y + bob, f.size, Math.sign(f.vx) || 1, f.color || FISH_COLORS[0], f.phase, f.kind === 'gold');
    } else drawJunk(f.kind, f.x, f.y + bob, 1, f.phase, Math.sign(f.vx));
  }
}

function drawArcs() {
  for (const a of arcs) {
    if (a.t < 0) continue;
    const f = clamp(a.t / a.d, 0, 1);
    const x = lerp(a.x0, a.x1, f), y = lerp(a.y0, a.y1, f) - Math.sin(f * Math.PI) * 130;
    if (a.junk) drawJunk(a.junk, x, y, 0.7, 0);
    else drawFish(x, y, 0.7, Math.sign(a.x1 - a.x0) || 1, FISH_COLORS[Math.floor(a.x0) % FISH_COLORS.length], a.x0, a.gold);
  }
}

function netRope(x1, y1, x2, y2) {
  ctx.strokeStyle = '#c8b27a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 10, x2, y2); ctx.stroke();
}

function floatsAlong(L, R, y) {
  ctx.fillStyle = '#e0913a'; ctx.strokeStyle = '#a8621f'; ctx.lineWidth = 1.2;
  const n = Math.max(2, Math.round((R - L) / 18));
  for (let i = 0; i <= n; i++) {
    const x = lerp(L, R, i / n);
    ctx.beginPath(); ctx.ellipse(x, y + Math.sin(t * 3 + x * 0.1) * 1.5, 4.5, 3.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
}

function meshIn(L, R, top, bottom, sp = 16) {
  ctx.strokeStyle = 'rgba(240,230,200,0.5)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let x = L - (bottom - top); x < R + (bottom - top); x += sp) {
    ctx.moveTo(x, top); ctx.lineTo(x + (bottom - top), bottom);
    ctx.moveTo(x, bottom); ctx.lineTo(x + (bottom - top), top);
  }
  ctx.stroke();
}

function drawNet() {
  const n = net, s = n.side, zx = zoneX(s), hw = cfg.zoneHalf;
  const tieX = boatX() + s * 134, tieY = boatY() - 42;
  const top = SEA_Y + 4;
  let depth = null, half = hw;
  if (n.phase === 'drop') { const f = clamp(n.t / DROP_T, 0, 1); depth = lerp(NET_TOP + 40, NET_BOTTOM, 1 - (1 - f) * (1 - f)); }
  else if (n.phase === 'sweep') depth = NET_BOTTOM;
  else if (n.phase === 'lift') { const f = clamp(n.t / LIFT_T, 0, 1); depth = lerp(NET_BOTTOM, top + bagDepth(), f); half = lerp(hw, bagWidth() / 2, f); }

  if (depth !== null) {
    // The net spread wide in the water
    const sway = Math.sin(t * 4) * 6;
    const L = zx - half, R = zx + half, mid = (top + depth) / 2;
    const shape = () => {
      ctx.beginPath();
      ctx.moveTo(L, top); ctx.lineTo(R, top);
      ctx.quadraticCurveTo(R + 6, mid, R - 8 + sway, depth);
      ctx.quadraticCurveTo(zx + sway, depth + 20, L + 8 + sway, depth);
      ctx.quadraticCurveTo(L - 6, mid, L, top);
      ctx.closePath();
    };
    shape();
    ctx.fillStyle = n.phase === 'sweep' ? 'rgba(255,240,190,0.16)' : 'rgba(230,215,170,0.12)';
    ctx.fill();
    ctx.save(); ctx.clip(); meshIn(L - 10, R + 10, top, depth + 20); ctx.restore();
    shape();
    ctx.strokeStyle = '#e2d3a4'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#6d7680';
    for (let i = 0; i <= 6; i++) {
      const x = lerp(L + 8, R - 8, i / 6) + sway;
      ctx.beginPath(); ctx.arc(x, depth + Math.sin((i / 6) * Math.PI) * 14, 3.2, 0, TAU); ctx.fill();
    }
    netRope(tieX, tieY, s > 0 ? L : R, top);
    floatsAlong(L, R, top);
  } else if (n.phase === 'broken') {
    // Torn scraps of net drifting while it's mended
    const L = zx - 40, R = zx + 40;
    ctx.strokeStyle = 'rgba(226,211,164,0.8)'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const x = lerp(L, R, i / 5), len = 20 + hsh(i, 4) * 40;
      const sw = Math.sin(t * 3 + i) * 5;
      ctx.beginPath(); ctx.moveTo(x, top);
      ctx.lineTo(x + sw, top + len * 0.5); ctx.lineTo(x - 4 + sw, top + len * 0.7); ctx.lineTo(x + 3 + sw * 1.5, top + len);
      ctx.stroke();
    }
    netRope(tieX, tieY, s > 0 ? L : R, top);
    floatsAlong(L, R, top);
  } else if (n.fish > 0 || n.junk.length) {
    drawBag(zx, top, tieX, tieY);
  }
}

// The net drawn up into a bag of fish; it bulges, glows gold when it's time to haul, then tears
function drawBag(zx, top, tieX, tieY) {
  const n = net;
  const bw = bagWidth(), bd = bagDepth(), s = strain();
  const wob = s >= PERFECT ? Math.sin(t * 18) * 2.5 * s : 0;
  const L = zx - bw / 2, R = zx + bw / 2;
  const shape = () => {
    ctx.beginPath();
    ctx.moveTo(L, top); ctx.lineTo(R, top);
    ctx.bezierCurveTo(R + bw * 0.25 + wob, top + bd * 0.5, zx + bw * 0.4, top + bd, zx, top + bd);
    ctx.bezierCurveTo(zx - bw * 0.4, top + bd, L - bw * 0.25 - wob, top + bd * 0.5, L, top);
    ctx.closePath();
  };
  shape();
  ctx.fillStyle = 'rgba(230,215,170,0.2)';
  ctx.fill();
  ctx.save(); ctx.clip();
  const k = Math.min(n.fish, 32);
  for (let i = 0; i < k; i++) {
    const fx = zx + (hsh(i) - 0.5) * bw * 0.95, fy = top + 10 + hsh(i, 1) * (bd - 14);
    drawFish(fx + Math.sin(t * 5 + i) * 1.5, fy, 0.55, hsh(i, 2) < 0.5 ? -1 : 1, FISH_COLORS[i % FISH_COLORS.length], i, i < n.gold);
  }
  n.junk.forEach((j, i) => drawJunk(j, zx + (hsh(i, 11) - 0.5) * bw * 0.6, top + bd * (0.45 + hsh(i, 12) * 0.35), 0.6, i));
  meshIn(L - 30, R + 30, top, top + bd + 10, 12);
  ctx.restore();
  shape();
  ctx.strokeStyle = s > 1 ? (Math.sin(t * 14) > 0 ? '#ff6b6b' : '#ffd0d0') : s >= PERFECT ? '#f5c542' : '#e2d3a4';
  ctx.lineWidth = s >= PERFECT ? 4 : 3;
  if (s >= PERFECT && s <= 1) { ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 14; }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Tears
  const tears = Math.ceil(n.tear * 5);
  for (let i = 0; i < tears; i++) {
    const hx = zx + (hsh(i, 5) - 0.5) * bw * 0.7, hy = top + bd * (0.35 + hsh(i, 6) * 0.5);
    const r = 6 + n.tear * 7;
    ctx.fillStyle = 'rgba(12,45,78,0.95)';
    ctx.beginPath();
    for (let a = 0; a < 7; a++) {
      const ang = (a / 7) * TAU, rr = r * (a % 2 ? 0.55 : 1);
      (a ? ctx.lineTo : ctx.moveTo).call(ctx, hx + Math.cos(ang) * rr, hy + Math.sin(ang) * rr * 0.8);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e2d3a4'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let a = 0; a < 4; a++) {
      const ang = a * 1.6 + 0.4;
      ctx.moveTo(hx + Math.cos(ang) * r, hy + Math.sin(ang) * r * 0.8);
      ctx.lineTo(hx + Math.cos(ang) * (r + 5), hy + Math.sin(ang) * (r + 5) * 0.8 + 3);
    }
    ctx.stroke();
  }
  netRope(tieX, tieY, net.side > 0 ? L : R, top);
  floatsAlong(L, R, top);
}

// Speech bubbles from Jesus and Peter
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawSpeech(x, y, text, who) {
  ctx.save();
  ctx.font = '600 15px Fredoka, sans-serif';
  const lines = wrapText(text, Math.min(250, W - 60));
  const lh = 19;
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 24;
  const bh = lines.length * lh + 14;
  const bx = clamp(x - bw / 2, 10, W - 10 - bw), by = y - bh - 16;
  ctx.fillStyle = 'rgba(255,252,240,0.97)';
  ctx.strokeStyle = who === 'jesus' ? 'rgba(224,165,38,0.9)' : 'rgba(63,111,181,0.7)';
  ctx.lineWidth = 2.5;
  roundRect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  const tx = clamp(x, bx + 18, bx + bw - 18);
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh - 1); ctx.lineTo(x, y - 2); ctx.lineTo(tx + 8, by + bh - 1); ctx.closePath();
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh); ctx.lineTo(x, y - 2); ctx.lineTo(tx + 8, by + bh); ctx.stroke();
  ctx.fillStyle = '#3b2f1e'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 12, by + 8 + i * lh));
  ctx.restore();
}

function drawBubbles() {
  const now = state === 'play' || state === 'pause' ? levelT : winT;
  const by = boatY();
  for (const b of bubbles) {
    if (now < b.t0 || now > b.t1) continue;
    // b.text is plain text or a VERSES entry, looked up in the current version
    const text = typeof b.text === 'string' ? b.text : Bible.verse(b.text).text;
    if (b.who === 'jesus') drawSpeech(boatX() - 80, by - 6 - 76 * CS, text, 'jesus');
    else {
      const kneel = state === 'win' ? clamp(winT / 0.8, 0, 1) : 0;
      drawSpeech(boatX() + lerp(8, -40, kneel), by - 6 - 76 * CS + kneel * 12, text, 'peter');
    }
  }
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 26px Fredoka, sans-serif';
  ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.t / 0.5, 0, 1);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#c47f00'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + net strain
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Fishers of Men' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  const s = strain();
  ctx.fillText(net.tear > 0 ? 'TEAR!' : 'NET', 12, 48);
  ctx.shadowBlur = 0;
  const BX = 58, BW = 130, MAXS = 1.3;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(BX, 38, BW, 13, 6.5); ctx.fill();
  // gold band = perfect haul, past the line = breaking
  ctx.fillStyle = 'rgba(245,197,66,0.55)';
  ctx.fillRect(BX + BW * PERFECT / MAXS, 38, BW * (1 - PERFECT) / MAXS, 13);
  const f = clamp(s / MAXS, 0, 1);
  if (f > 0) {
    ctx.fillStyle = s > 1 ? (Math.sin(t * 12) > 0 ? '#ff6b6b' : '#c92a2a') : s >= PERFECT ? '#f5c542' : s >= 0.55 ? '#b8d86b' : '#6cc3e8';
    roundRect(BX, 38, BW * f, 13, 6.5); ctx.fill();
  }
  ctx.strokeStyle = '#c92a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(BX + BW / MAXS, 35); ctx.lineTo(BX + BW / MAXS, 54); ctx.stroke();

  // Pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: time (sun), catch, score
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  const low = state === 'play' && timeLeft < 10;
  ctx.fillStyle = low && Math.sin(t * 8) > 0 ? '#c92a2a' : '#5a4210';
  ctx.font = '700 18px Fredoka, sans-serif';
  ctx.fillText(`${Math.ceil(timeLeft)}s`, rx, 26);
  const tw = ctx.measureText(`${Math.ceil(timeLeft)}s`).width;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f5b82e';
  ctx.beginPath(); ctx.arc(rx - tw - 14, 20, 7, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#f5b82e'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8; ctx.moveTo(rx - tw - 14 + Math.cos(a) * 9.5, 20 + Math.sin(a) * 9.5); ctx.lineTo(rx - tw - 14 + Math.cos(a) * 12.5, 20 + Math.sin(a) * 12.5); }
  ctx.stroke();
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillText(`CATCH ${stats.landed} / ${cfg.goal}`, rx, 46);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(rx - 120, 52, 120, 9, 4.5); ctx.fill();
  const cf = clamp(stats.landed / cfg.goal, 0, 1);
  if (cf > 0) { ctx.fillStyle = '#e0a526'; roundRect(rx - 120, 52, 120 * cf, 9, 4.5); ctx.fill(); }
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText(`SCORE ${totalScore + (state === 'win' ? 0 : stats.points)}`, rx, 78);
  ctx.shadowBlur = 0;

  // HAUL button: call James & John's boat
  if (state === 'play' || state === 'pause') {
    const hb = haulButton();
    const free = partner.phase === 'away' || partner.phase === 'leaving';
    const has = net.fish > 0 || net.junk.length > 0;
    const ready = free && has;
    const urgent = ready && s >= PERFECT;
    const r = hb.r * (urgent ? 1 + 0.06 * Math.sin(t * 10) : 1);
    if (urgent) {
      const gl = ctx.createRadialGradient(hb.x, hb.y, r * 0.8, hb.x, hb.y, r * 1.5);
      gl.addColorStop(0, s > 1 ? 'rgba(255,107,107,0.7)' : 'rgba(255,226,122,0.8)');
      gl.addColorStop(1, 'rgba(255,226,122,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(hb.x, hb.y, r * 1.5, 0, TAU); ctx.fill();
    }
    const bg = ctx.createLinearGradient(0, hb.y - r, 0, hb.y + r);
    if (ready) { bg.addColorStop(0, '#f7c948'); bg.addColorStop(1, '#d9961c'); }
    else { bg.addColorStop(0, 'rgba(255,255,255,0.75)'); bg.addColorStop(1, 'rgba(220,225,230,0.75)'); }
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(hb.x, hb.y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = ready ? '#a8741a' : 'rgba(90,66,16,0.35)'; ctx.lineWidth = 3; ctx.stroke();
    // little boat icon
    const ix = hb.x, iy = hb.y - 8;
    ctx.fillStyle = ready ? '#7a4a1c' : 'rgba(90,66,16,0.5)';
    ctx.beginPath(); ctx.moveTo(ix - 18, iy + 2); ctx.lineTo(ix + 18, iy + 2); ctx.quadraticCurveTo(ix + 14, iy + 12, ix + 8, iy + 12); ctx.lineTo(ix - 10, iy + 12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ix - 2, iy + 2); ctx.lineTo(ix - 2, iy - 20); ctx.stroke();
    ctx.fillStyle = ready ? '#fff8e6' : 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(ix, iy - 19); ctx.quadraticCurveTo(ix + 14, iy - 10, ix, iy - 1); ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillStyle = ready ? '#fff' : 'rgba(90,66,16,0.6)';
    ctx.fillText(free ? 'HAUL' : '...', hb.x, hb.y + 24);
    if (!isTouch()) {
      ctx.font = '600 11px Fredoka, sans-serif';
      ctx.fillStyle = '#5a4210';
      ctx.fillText('B', hb.x + r * 0.72, hb.y - r * 0.62);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const txt = message.text;
  const size = Math.min(24, 24 * (W - 30) / Math.max(1, ctx.measureText(txt).width));
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(txt, W / 2, 155);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(txt, W / 2, 155);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawShore();
  drawPartnerBoat();
  drawPeterBoat();
  drawWater();
  drawZones();
  drawNet();
  drawSwimmers();
  drawArcs();
  drawParticles();
  drawSurfaceLine();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBubbles();
  drawFloaters();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateScenery(dt);
  updateParticles(dt);
  updateDisciples(dt);
  updateArcs(dt);
  boatShift += (side * 16 - boatShift) * Math.min(1, dt * 5);
  if (state === 'play') {
    levelT += dt;
    const before = timeLeft;
    timeLeft = Math.max(0, timeLeft - dt);
    if (before >= 10 && timeLeft < 10) showMessage('The sun is climbing high!');
    updateSpawns(dt);
    updateSwimmers(dt);
    updateNet(dt);
    updatePartner(dt);
    if (state === 'play' && timeLeft <= 0 && partner.phase !== 'coming' && partner.phase !== 'haul') fail();
  } else if (state === 'title') {
    updateSpawns(dt);
    updateSwimmers(dt);
  } else if (state === 'win' || state === 'fail') {
    winT += dt;
    updateSwimmers(dt);
    if (state === 'win') {
      winSink = Math.min(1, winSink + dt * 0.7);
      // water slopping over the rails of both laden boats
      if (Math.random() < dt * 16) {
        const bx = Math.random() < 0.5 ? boatX() + rand(-120, 120) : partner.x + rand(-90, 90);
        spawn(bx, SEA_Y - 22, rand(-40, 40), rand(-120, -50), 0.6, Math.random() < 0.5 ? '#ffffff' : '#bfe6ff', rand(2, 4), 400);
      }
      if (Math.random() < dt * 10) {
        spawn(boatX() - 80 + rand(-40, 40), boatY() - 110 - rand(0, 40), 0, -20, 1, '#fff6d0', 3);
      }
    }
  }
  shockT = Math.max(0, shockT - dt);
  wowT = Math.max(0, wowT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t -= dt; floaters[i].y -= 30 * dt; if (floaters[i].t <= 0) floaters.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
