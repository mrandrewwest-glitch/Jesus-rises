<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Fishers of Men</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin: 8px 0 0;
    line-height: 1.3;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Fishers of Men</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  launchOut: { ref: 'Luke 5:4', KJV: 'Launch out into the deep, and let down your nets for a draught.', NKJV: null, NIV: null, NLT: null },
  catchMen: { ref: 'Luke 5:10', KJV: 'And Jesus said unto Simon, Fear not; from henceforth thou shalt catch men.', NKJV: null, NIV: null, NLT: null },
  toiledAtThyWord: { ref: 'Luke 5:5', KJV: 'Master, we have toiled all the night, and have taken nothing: nevertheless at thy word I will let down the net.', NKJV: null, NIV: null, NLT: null },
  // speech bubbles
  toiled: { ref: 'Luke 5:5', KJV: 'Master, we have toiled all the night, and have taken nothing...', NKJV: null, NIV: null, NLT: null },
  atThyWord: { ref: 'Luke 5:5', KJV: '...nevertheless at thy word I will let down the net.', NKJV: null, NIV: null, NLT: null },
  launchDeep: { ref: 'Luke 5:4', KJV: 'Launch out into the deep.', NKJV: null, NIV: null, NLT: null },
  letDown: { ref: 'Luke 5:4', KJV: 'Let down your nets for a draught.', NKJV: null, NIV: null, NLT: null },
  followMe: { ref: 'Matthew 4:19', KJV: 'Follow me.', NKJV: null, NIV: null, NLT: null },
  fearNot: { ref: 'Luke 5:10', KJV: 'Fear not.', NKJV: null, NIV: null, NLT: null },
  depart: { ref: 'Luke 5:8', KJV: 'Depart from me; for I am a sinful man, O Lord.', NKJV: null, NIV: null, NLT: null },
  henceforth: { ref: 'Luke 5:10', KJV: 'Fear not; from henceforth thou shalt catch men.', NKJV: null, NIV: null, NLT: null },
  // on-screen messages
  multitude: { ref: 'Luke 5:6', KJV: 'A great multitude of fishes!', NKJV: null, NIV: null, NLT: null },
  netBrake: { ref: 'Luke 5:6', KJV: 'Their net brake!', NKJV: null, NIV: null, NLT: null },
  beckoned: { ref: 'Luke 5:7', KJV: 'They beckoned unto their partners...', NKJV: null, NIV: null, NLT: null },
};

// Card markup for a verse and the translation credit, looked up in the current version.
function verseHTML(entry) {
  const v = Bible.verse(entry);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() { return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`; }


// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
// A steady pseudo-random number for index i (so fish in the net don't jitter)
const hsh = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function mix(a, b, f) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, f));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, f));
  const bl = Math.round(lerp(pa & 255, pb & 255, f));
  return `rgb(${r},${g},${bl})`;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
const SEA_Y = 400;              // calm water line
const NET_TOP = SEA_Y + 14;     // top of the net's sweep zone
const NET_BOTTOM = SEA_Y + 365; // how deep the net reaches
const CS = 1.1;                 // character scale
const DROP_T = 0.16;            // net plunging down
const LIFT_T = 0.6;             // net drawn back up and gathered before the next cast
const MEND_T = 1.4;             // mending a broken net
const HAUL_T = 0.9;             // emptying the net into the boats
const PERFECT = 0.8;            // net at least this full (and untorn) = perfect haul
const WEIGHT = { fish: 1, gold: 1, sandal: 3, weed: 2, crab: 4 };
const FISH_COLORS = ['#8fb3c9', '#a3c1ad', '#9aa7c7', '#b7c4cc', '#c2b59b'];

const LEVEL_NAMES = [
  'Dawn at Gennesaret',
  'Launch Out into the Deep',
  'Shoals of Capernaum',
  'Toiled All the Night',
  'The Great Draught',
  'Fishers of Men',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Morning ${n}`,
    time: 60,                                   // seconds until the sun is high
    goal: [20, 28, 34, 40, 44][n - 1] || 48,   // fish to land in the boats
    cap: 14 + Math.min(n - 1, 4),               // net capacity before it strains
    window: [0.75, 0.62, 0.54, 0.48, 0.44][n - 1] || 0.4, // how long the net sweeps
    zoneHalf: Math.max(80 - (n - 1) * 7, 48),   // half width of the net
    speed: 85 + Math.min(n - 1, 6) * 18,                   // shoal swimming speed
    bigGap: Math.max(6.5 - (n - 1) * 0.4, 4.5),
    bigMin: 6, bigMax: 10 + Math.min(n, 3),
    turnBack: Math.max(0.5 - (n - 1) * 0.1, 0.2), // chance a shoal turns back through the net
    smallGap: 5,
    junkGap: n === 1 ? 11 : Math.max(7 - (n - 1) * 1.1, 2.4),
    crabs: n >= 2,
    goldChance: 0.28,
    flip: n >= 3 ? Math.max(16 - (n - 3) * 2, 9) : 0,  // Jesus points to the other side
    scareR: n === 1 ? 50 : Math.min(70 + n * 15, 150), // fish this far outside the net flee a splash
    tearRate: 1 + (n - 1) * 0.25,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('fishersBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;                // global clock
let levelT = 0;           // time since the level began
let timeLeft = 60;
let side = 1;             // which side of the boat the net goes over (-1 left, 1 right)
let blessed = 1;          // the side Jesus points to
let boatShift = 0;
let swimmers = [];        // fish and junk under the water
let particles = [];
let arcs = [];            // fish flying from the net into the boats
let floaters = [];        // "+120" score pop-ups
let ripples = [];
let net, partner, stats;
let message = { text: '', t: 0 };
let bubbles = [];         // speech bubbles { who, text, t0, t1 }
let shockT = 0, wowT = 0, joyT = 0, flashT = 0, shakeT = 0;
let endTimer = 0, winT = 0, winSink = 0;
let lastScore = null;
let spawnT = { big: 0, small: 0, junk: 0, gold: 0, flip: 0 };
let creakT = 0;
let hints = {};

function newNet() {
  return { phase: 'idle', t: 0, side: 1, fish: 0, gold: 0, junk: [], weight: 0, tear: 0, escapeT: 0, caught: 0 };
}
function newPartner() {
  return { phase: 'away', x: W + 300, side: 1, target: 0, speed: 300, t: 0, dir: -1, haul: null };
}
function newStats() {
  return { landed: 0, gold: 0, perfect: 0, points: 0, lost: 0 };
}
net = newNet(); partner = newPartner(); stats = newStats();

const strain = () => net.weight / cfg.cap;

// ============================================================
//  Geometry
// ============================================================
function boatX() { return W / 2 + boatShift; }
function zoneOff() { return Math.min(180, W * 0.29); }
function zoneX(s) { return boatX() + s * zoneOff(); }
function surf(x) { return SEA_Y + 3 * Math.sin(x * 0.028 + t * 1.5) + 2 * Math.sin(x * 0.065 - t * 2.2); }
function sinkAmt() { return clamp(stats.landed / cfg.goal, 0, 1) * 10 + winSink * 8; }
function boatY() { return SEA_Y + 2 + Math.sin(t * 1.4) * 2.5 + sinkAmt(); }
function partnerY() { return SEA_Y - 12 + Math.sin(t * 1.6 + 1) * 2.5 + sinkAmt() * 0.8; }
// How deep the bag of caught fish hangs
function bagDepth() { return 34 + Math.min(net.weight, 30) * 3.1; }
function bagWidth() { return 48 + Math.min(net.fish, 30) * 1.5 + net.junk.length * 6; }

// ============================================================
//  Disciples: Peter & Andrew in Simon's boat, James & John in the partners' boat
// ============================================================
const DISCIPLES = [
  { name: 'Peter',  robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew', robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',  robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',   robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.4),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

function crowdMood(d) {
  if (state === 'title') return 'watch';
  if (state === 'win') return d.name === 'Peter' ? 'wow' : 'joy';
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'shock';
  if (joyT > 0) return 'joy';
  if (net.tear > 0 || strain() >= 0.85) return 'worried';
  if (wowT > 0) return 'wow';
  return 'watch';
}

function updateDisciples(dt) {
  for (const d of DISCIPLES) {
    const want = crowdMood(d);
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

// slot: { d, x, y, s, lx, ly, kneel } — drawn in the current (boat) transform
function drawDisciple(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const lx = slot.lx, ly = slot.ly;

  // Arms raised for joy / pointing in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && !slot.kneel && d.i % 2 === 1) {
    arm(11, -32, 22 + lx * 6, -62);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (slot.kneel || mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  } else if (mood === 'watch' || (mood === 'wow' && d.i % 2 === 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'wow') {
    arm(-11, -32, -15, -12);
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
  ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
  ctx.closePath(); ctx.fill();
  if (d.beard) {
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus (the house drawing, standing in the boat; no cloud)
//  pose: 'point' (toward dir) | 'bless' (hand over kneeling Peter) | 'open'
// ============================================================
function drawJesus(x, y, s, pose, dir, face) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  if (pose === 'bless' || state === 'title') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.5)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms
  let hands = [[-20, -22], [20, -22]];
  if (pose === 'point') {
    const bob = Math.sin(t * 3) * 1.5;
    if (dir > 0) hands[1] = [30, -52 + bob]; else hands[0] = [-30, -52 + bob];
  } else if (pose === 'bless') {
    hands = [[-20, -22], [28, -40]];
  } else if (pose === 'up') {
    hands = [[-21, -66], [21, -66]];
  }
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    const lx = pose === 'point' ? dir * 1.2 : 0;
    ctx.beginPath(); ctx.arc(-4 + lx, -53, 1.5, 0, TAU); ctx.arc(4 + lx, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Fish, junk and shoals
// ============================================================
function addSwimmer(o) {
  swimmers.push({ phase: rand(0, TAU), turned: false, turnX: null, ty: o.y, tvx: o.vx, free: false, size: 1, ...o });
}

// Big shoals come in from the side Jesus points to, swim under the boat and turn back
function spawnBig() {
  const s = blessed;
  const n = randInt(cfg.bigMin, cfg.bigMax);
  const y = rand(470, 700);
  const sp = cfg.speed * rand(0.85, 1.15);
  const x0 = s > 0 ? W + 40 : -40;
  const size = rand(1.0, 1.2);
  const color = FISH_COLORS[randInt(0, FISH_COLORS.length - 1)];
  const turnX = boatX() + s * rand(-10, 30);
  const back = Math.random() < cfg.turnBack;      // otherwise it dives deep, out of the net's reach
  const dive = back ? rand(-50, 60) : 999;
  for (let i = 0; i < n; i++) {
    addSwimmer({ kind: 'fish', x: x0 + s * rand(0, 130), y: clamp(y + rand(-38, 38), 440, 745), vx: -s * sp * rand(0.95, 1.05),
      size: size * rand(0.9, 1.1), color, turnX, dive, back });
  }
  if (Math.random() < cfg.goldChance) {
    addSwimmer({ kind: 'gold', x: x0 + s * rand(20, 110), y: clamp(y + rand(-20, 20), 440, 745), vx: -s * sp, size: 1.05, turnX, dive, back });
  }
}

// Small shoals wander straight across from either side
function spawnSmall() {
  const s = Math.random() < 0.5 ? -1 : 1;
  const n = randInt(2, 4);
  const y = rand(450, 740);
  const sp = cfg.speed * rand(1.0, 1.3);
  const color = FISH_COLORS[randInt(0, FISH_COLORS.length - 1)];
  for (let i = 0; i < n; i++) {
    addSwimmer({ kind: 'fish', x: (s > 0 ? W + 30 : -30) + s * rand(0, 70), y: clamp(y + rand(-22, 22), 440, 750), vx: -s * sp,
      size: rand(0.72, 0.88), color });
  }
}

function spawnGold() {
  const s = Math.random() < 0.5 ? -1 : 1;
  addSwimmer({ kind: 'gold', x: s > 0 ? W + 30 : -30, y: rand(460, 730), vx: -s * cfg.speed * 1.6, size: 0.95 });
}

function spawnJunk() {
  const s = Math.random() < 0.5 ? -1 : 1;
  const kinds = cfg.crabs ? ['weed', 'sandal', 'crab', 'weed', 'sandal', 'crab'] : ['weed', 'sandal', 'weed'];
  const kind = kinds[randInt(0, kinds.length - 1)];
  addSwimmer({ kind, x: s > 0 ? W + 40 : -40, y: rand(450, 735), vx: -s * rand(40, 65) * (1 + (level - 1) * 0.08), size: 1 });
}

function updateSwimmers(dt) {
  for (let i = swimmers.length - 1; i >= 0; i--) {
    const f = swimmers[i];
    // U-turn under the boat
    if (f.turnX !== null && !f.turned && ((f.vx < 0 && f.x < f.turnX) || (f.vx > 0 && f.x > f.turnX))) {
      f.turned = true;
      if (f.back) { f.tvx = -f.vx; f.ty = clamp(f.y + f.dive, 440, 748); }
      else f.ty = rand(800, 825);
    }
    f.vx += (f.tvx - f.vx) * Math.min(1, dt * 3);
    f.y += (f.ty - f.y) * Math.min(1, dt * (f.turned && !f.back ? 3.5 : 1.2));
    if (f.free) f.y += f.vy * dt;
    f.x += f.vx * dt;
    if (f.kind === 'weed' || f.kind === 'sandal') f.y += Math.sin(t * 1.5 + f.phase) * 8 * dt;
    if ((f.x < -160 && f.vx <= 0) || (f.x > W + 160 && f.vx >= 0) || f.y > H + 40) swimmers.splice(i, 1);
  }
}

function updateSpawns(dt) {
  spawnT.big -= dt; spawnT.small -= dt; spawnT.junk -= dt; spawnT.gold -= dt;
  if (spawnT.big <= 0) { spawnBig(); spawnT.big = cfg.bigGap * rand(0.85, 1.15); }
  if (spawnT.small <= 0) { spawnSmall(); spawnT.small = cfg.smallGap * rand(0.7, 1.3); }
  if (state === 'play') {
    if (spawnT.junk <= 0) { spawnJunk(); spawnT.junk = cfg.junkGap * rand(0.75, 1.25); }
    if (spawnT.gold <= 0) { if (Math.random() < 0.5) spawnGold(); spawnT.gold = rand(10, 16); }
    if (cfg.flip) {
      spawnT.flip -= dt;
      if (spawnT.flip <= 0) {
        blessed = -blessed; spawnT.flip = cfg.flip * rand(0.9, 1.1);
        showMessage('Jesus points to the other side!');
        sfx.chime();
      }
    }
  }
}

// ============================================================
//  The net
// ============================================================
function setSide(s) {
  if (state !== 'play') return;
  side = s;
}

function cast(s) {
  if (state !== 'play' || timeLeft <= 0) return;
  if (s !== undefined) side = s;
  if (net.phase === 'broken') { showMessage('Mending the net...'); return; }
  if (partner.phase === 'haul') return;
  if (net.phase !== 'idle') return;   // the net is already in the water
  net.phase = 'drop'; net.t = 0; net.side = side; net.caught = 0;
  sfx.cast();
  splash(zoneX(side), SEA_Y, 14);
  scare(side);
}

// The splash startles fish just outside the net: they dart away and dive deep.
// Cast too early or too late and the shoal is lost, so timing matters.
function scare(s) {
  const z = zoneRect(s), zc = (z.x0 + z.x1) / 2;
  let n = 0;
  for (const f of swimmers) {
    if (f.free || f.kind !== 'fish' && f.kind !== 'gold') continue;
    const inside = f.x > z.x0 && f.x < z.x1;
    if (inside || Math.abs(f.x - zc) > cfg.zoneHalf + cfg.scareR) continue;
    const away = Math.sign(f.x - zc) || 1;
    f.tvx = away * Math.max(Math.abs(f.vx), cfg.speed) * 1.8;
    f.vx = f.tvx * 0.6;
    f.turned = true; f.back = false; f.ty = rand(800, 825);
    n++;
  }
  if (n >= 3 && !hints.scare && level <= 3) { hints.scare = true; hints.miss = true; showMessage('Splash! Fish fled — wait till they are over the net'); }
}

function zoneRect(s) {
  const x = zoneX(s);
  return { x0: x - cfg.zoneHalf, x1: x + cfg.zoneHalf, y0: NET_TOP, y1: NET_BOTTOM };
}

function scoop() {
  const z = zoneRect(net.side);
  const depth = net.phase === 'drop' ? lerp(NET_TOP + 40, NET_BOTTOM, net.t / DROP_T) : NET_BOTTOM;
  for (let i = swimmers.length - 1; i >= 0; i--) {
    const f = swimmers[i];
    if (f.free) continue;
    if (f.x > z.x0 && f.x < z.x1 && f.y > z.y0 && f.y < depth) {
      swimmers.splice(i, 1);
      catchIt(f);
    }
  }
}

function catchIt(f) {
  if (f.kind === 'fish' || f.kind === 'gold') {
    net.caught++;
    net.fish++; net.weight += 1;
    if (f.kind === 'gold') {
      net.gold++;
      showMessage('A golden fish!');
      sfx.gold();
      for (let i = 0; i < 14; i++) spawn(f.x, f.y, rand(-60, 60), rand(-60, 60), rand(0.5, 1), '#ffe27a', rand(2, 4));
    } else sfx.catchFish(net.caught);
    spawn(f.x, f.y, 0, -30, 0.6, 'rgba(255,255,255,0.8)', 3);
  } else {
    net.junk.push(f.kind);
    net.weight += WEIGHT[f.kind];
    showMessage({ sandal: 'An old sandal! It clogs the net', weed: 'Seaweed! It clogs the net', crab: 'Snip! A grumpy crab cut the net!' }[f.kind]);
    sfx.junk(f.kind === 'crab');
    // the crab snips a hole in the net
    if (f.kind === 'crab') { shockT = Math.max(shockT, 0.6); net.tear = Math.min(0.9, net.tear + 0.3); }
  }
}

// After each sweep: a word of encouragement
function afterCast() {
  const c = net.caught;
  if (c >= 8) { showMessage(c >= 12 ? Bible.verse(VERSES.multitude).text : 'What a draught!'); wowT = 1.6; }
  else if (c >= 4) wowT = 1;
  else if (c === 0 && !hints.miss && level <= 2) { hints.miss = true; showMessage('Wait for a shoal to swim over the net'); }
  if (!hints.full && strain() >= 0.6 && level <= 2) {
    hints.full = true;
    showMessage(isTouch() ? 'Net filling! Tap HAUL to call James & John' : 'Net filling! Press B to call James & John');
  }
}

function updateNet(dt) {
  const n = net;
  n.t += dt;
  if (n.phase === 'drop' || n.phase === 'sweep') scoop();
  if (n.phase === 'drop' && n.t >= DROP_T) { n.phase = 'sweep'; n.t = 0; }
  else if (n.phase === 'sweep' && n.t >= cfg.window) { n.phase = 'lift'; n.t = 0; afterCast(); }
  else if (n.phase === 'lift' && n.t >= LIFT_T) { n.phase = 'idle'; n.t = 0; }
  else if (n.phase === 'broken' && n.t >= MEND_T) { n.phase = 'idle'; n.t = 0; showMessage('Net mended — cast again!'); }

  if (n.phase === 'broken' || partner.phase === 'haul') return;
  // Too full: the net strains, tears and lets fish slip away (Luke 5:6)
  const s = strain();
  if (s > 1) {
    if (n.tear === 0) sfx.tear(0.5);
    n.tear += dt * (0.3 + (s - 1) * 1.2) * cfg.tearRate;
    if (n.tear >= 1) { breakNet(); return; }
  }
  if (n.tear > 0 && n.fish > 0) {
    n.escapeT -= dt;
    if (n.escapeT <= 0) { n.escapeT = lerp(0.6, 0.2, n.tear); escapeFish(1); }
  }
  if (s >= PERFECT) {
    creakT -= dt;
    if (creakT <= 0) { sfx.creak(s); creakT = lerp(1.0, 0.35, clamp((s - PERFECT) / 0.5, 0, 1)); }
  }
}

function escapeFish(k) {
  const zx = zoneX(net.side);
  for (let i = 0; i < k && net.fish > 0; i++) {
    const gold = net.gold > 0 && net.fish <= net.gold;
    net.fish--; net.weight--; if (gold) net.gold--;
    stats.lost++;
    const dir = Math.random() < 0.5 ? -1 : 1;
    addSwimmer({ kind: gold ? 'gold' : 'fish', free: true, x: zx + rand(-20, 20), y: SEA_Y + bagDepth() * 0.7, vx: dir * rand(120, 200), vy: rand(10, 50),
      size: rand(0.7, 0.95), color: FISH_COLORS[randInt(0, FISH_COLORS.length - 1)] });
  }
}

function breakNet() {
  const n = net;
  escapeFish(n.fish);
  n.junk = []; n.weight = 0; n.tear = 0; n.fish = 0; n.gold = 0;
  n.phase = 'broken'; n.t = 0;
  shockT = 1.4; shakeT = 0.35;
  const zx = zoneX(n.side);
  for (let i = 0; i < 18; i++) spawn(zx + rand(-40, 40), SEA_Y + rand(10, 60), rand(-60, 60), rand(-80, 20), rand(0.5, 1), 'rgba(230,245,255,0.9)', rand(2, 4));
  showMessage(`${Bible.verse(VERSES.netBrake).text} Too late!`);
  sfx.tear(1);
}

// ============================================================
//  James & John's boat (Luke 5:7)
// ============================================================
// Where James & John's boat stops: just outboard of the net, kept on screen
function partnerSpot(s) { return clamp(zoneX(s) + s * 50, 70, W - 70); }

function callPartner() {
  if (state !== 'play') return;
  if (partner.phase === 'coming' || partner.phase === 'haul') return;
  if (net.fish === 0 && net.junk.length === 0) { showMessage('The net is empty — cast first!'); return; }
  if (partner.phase === 'away') partner.x = net.side > 0 ? W + 170 : -170;
  partner.side = net.side;
  partner.target = partnerSpot(net.side);
  partner.phase = 'coming'; partner.t = 0;
  partner.dir = Math.sign(partner.target - partner.x) || 1;
  partner.speed = Math.max(Math.abs(partner.target - partner.x) / 0.9, 260);
  sfx.call();
  showMessage(Bible.verse(VERSES.beckoned).text);
}

function updatePartner(dt) {
  const p = partner;
  p.t += dt;
  if (p.phase === 'coming') {
    p.target = partnerSpot(p.side);
    const d = p.target - p.x;
    const step = p.speed * dt;
    if (Math.abs(d) <= step) {
      p.x = p.target;
      if (net.phase === 'idle' || net.phase === 'lift' || net.phase === 'broken') startHaul();
    } else p.x += Math.sign(d) * step;
  } else if (p.phase === 'haul') {
    if (p.t >= HAUL_T) finishHaul();
  } else if (p.phase === 'leaving') {
    const out = p.side > 0 ? W + 200 : -200;
    p.dir = Math.sign(out - p.x) || 1;
    p.x += p.dir * 320 * dt;
    if ((p.dir > 0 && p.x >= out) || (p.dir < 0 && p.x <= out)) p.phase = 'away';
  }
}

function startHaul() {
  const p = partner;
  if (net.phase === 'lift') net.phase = 'idle';
  const perfect = net.fish > 0 && strain() >= PERFECT && net.tear === 0;
  p.haul = { fish: net.fish, gold: net.gold, junk: net.junk.length, perfect, close: net.tear > 0 };
  p.phase = 'haul'; p.t = 0;
  // Fish fly from the net into both boats
  const zx = zoneX(net.side);
  const k = Math.min(net.fish, 40);
  for (let i = 0; i < k; i++) {
    const toPartner = i % 2 === 0;
    arcs.push({ x0: zx + rand(-25, 25), y0: SEA_Y + 20, x1: toPartner ? p.x + rand(-50, 50) : boatX() + rand(-60, 60),
      y1: (toPartner ? partnerY() : boatY()) - 36, t: -i * (HAUL_T * 0.7 / Math.max(k, 1)), d: 0.55, gold: i < net.gold, junk: false });
  }
  for (let i = 0; i < net.junk.length; i++) {
    arcs.push({ x0: zx, y0: SEA_Y + 20, x1: zx + rand(-120, 120), y1: SEA_Y + 10, t: -i * 0.1, d: 0.6, gold: false, junk: net.junk[i] });
  }
  net.fish = 0; net.gold = 0; net.junk = []; net.weight = 0; net.tear = 0; net.phase = 'idle';
  sfx.haul(Math.min(1, p.haul.fish / cfg.cap));
}

function finishHaul() {
  const h = partner.haul;
  partner.phase = 'leaving'; partner.t = 0;
  const pts = h.fish * 10 + h.gold * 100 + (h.perfect ? 250 : 0);
  stats.landed += h.fish; stats.gold += h.gold; stats.points += pts;
  if (h.perfect) stats.perfect++;
  if (pts > 0) floaters.push({ x: partner.x, y: SEA_Y - 120, text: `+${pts}`, t: 1.4 });
  if (h.perfect) { joyT = 1.6; showMessage('Perfect haul! +250'); sfx.perfect(); }
  else if (h.close) { wowT = 1.2; showMessage('Just in time!'); }
  else if (h.fish >= 6) wowT = 1.2;
  if (stats.landed >= cfg.goal) win();
}

// ============================================================
//  Particles & splashes
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function splash(x, y, n = 12) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-30, 30), y, rand(-70, 70), rand(-200, -80), rand(0.4, 0.8), Math.random() < 0.5 ? '#ffffff' : '#bfe6ff', rand(2, 4), 500);
  }
}

function updateArcs(dt) {
  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.t += dt;
    if (a.t >= a.d) {
      if (!a.junk) spawn(a.x1, a.y1, 0, -40, 0.4, '#ffffff', 3);
      else splash(a.x1, SEA_Y, 5);
      arcs.splice(i, 1);
    }
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  winT = 0;
  partner.phase = 'rest';
  const levelBonus = level * 300 + Math.ceil(timeLeft) * 10;
  const score = stats.points + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('fishersBest', best); } catch (e) {} }
  lastScore = { fish: stats.landed * 10, gold: stats.gold * 100, perfect: stats.perfect * 250, perfectN: stats.perfect,
    goldN: stats.gold, fishN: stats.landed, levelBonus, score };
  bubbles = [
    { who: 'peter', text: VERSES.depart, t0: 0.6, t1: 2.3 },
    { who: 'jesus', text: VERSES.henceforth, t0: 2.3, t1: 5 },
  ];
  showMessage('Both boats began to sink!');
  for (const x of [boatX(), partner.x]) splash(x, SEA_Y - 20, 22);
  sfx.win();
  endTimer = 4.4;
}

function fail() {
  state = 'fail';
  bubbles = [{ who: 'peter', text: 'We have toiled... and taken so little.', t0: 0.2, t1: 3 }];
  showMessage('The sun is high...');
  sfx.fail();
  endTimer = 2;
}

function showMessage(text) { message = { text, t: 2.2 }; }
function isTouch() { return matchMedia('(pointer: coarse)').matches; }

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function resetScene() {
  swimmers = []; particles = []; arcs = []; floaters = []; ripples = []; bubbles = [];
  net = newNet(); partner = newPartner(); stats = newStats();
  side = 1; blessed = 1; boatShift = 0; winSink = 0; winT = 0;
  shockT = wowT = joyT = flashT = shakeT = 0;
  spawnT = { big: 1.6, small: 2.8, junk: cfg.junkGap * 0.6, gold: rand(9, 14), flip: cfg.flip || 0 };
  // a few fish already swimming so the lake looks alive
  for (let i = 0; i < 2; i++) { spawnSmall(); for (const f of swimmers) f.x = rand(40, W - 40); }
}

function titleScreen() {
  state = 'title';
  cfg = makeConfig(1);
  resetScene();
  showOverlay('Fishers of Men', 'Cast the net on the right side',
    `${verseHTML(VERSES.launchOut)}
     <ul>
       <li>Cast the net just as a <b>shoal of fish</b> swims through it beside Simon Peter's boat.</li>
       <li><b>Touch:</b> <b>tap</b> the left or right side of the boat to cast there. Tap <b>HAUL</b> to call James &amp; John's boat.</li>
       <li><b>Keyboard:</b> <kbd>Space</kbd> cast, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change side, <kbd>B</kbd> call the partner boat.</li>
       <li>Cast on the side <b>Jesus points to</b> &mdash; that's where the big shoals come!</li>
       <li>Too full and the <b>net breaks</b>! Haul when the NET meter reaches <b>gold</b> for a Perfect haul.</li>
       <li>Dodge old sandals, seaweed and grumpy crabs. Land the catch before the sun climbs high.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Launch Out', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel() {
  cfg = makeConfig(level);
  resetScene();
  levelT = 0;
  timeLeft = cfg.time;
  hints = {};
  creakT = 0;
  state = 'play';
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  bubbles = level === 1 ? [
    { who: 'jesus', text: VERSES.launchOut, t0: 0.3, t1: 3.6 },
    { who: 'peter', text: VERSES.toiled, t0: 3.6, t1: 6.8 },
    { who: 'peter', text: VERSES.atThyWord, t0: 6.8, t1: 9.4 },
  ] : [
    { who: 'jesus', text: [VERSES.launchDeep, VERSES.letDown, 'Cast the net where I point.', VERSES.followMe, VERSES.fearNot][(level - 2) % 5], t0: 0.3, t1: 3 },
  ];
  sfx.levelStart();
  if (level === 1) setTimeout(() => { if (state === 'play' && levelT > 2) showMessage(isTouch() ? 'Tap a side of the boat to cast there' : 'Space to cast · ← → change side'); }, 2400);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('A Great Draught!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(VERSES.catchMen)}
       <p class="score">Fish landed (${s.fishN}): <b>${s.fish}</b><br>Golden fish (${s.goldN}): <b>${s.gold}</b><br>Perfect hauls (${s.perfectN}): <b>${s.perfect}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Morning', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Oh… no', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The sun climbed high with <b>${stats.landed}</b> of <b>${cfg.goal}</b> fish landed. Haul the net before it breaks, and cast where Jesus points!</p>
       ${verseHTML(VERSES.toiledAtThyWord)}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (e.repeat) return;
  if (e.code === 'Space') cast();
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') setSide(-1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') setSide(1);
  else if (e.code === 'KeyB') callPartner();
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// The big HAUL button (view coordinates, bottom-right corner)
function haulButton() {
  const r = 46;
  return { x: viewW - r - 16, y: viewH - r - 18, r };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  const hb = haulButton();
  if (Math.hypot(p.vx - hb.x, p.vy - hb.y) < hb.r + 8) { callPartner(); return; }
  cast(p.x < boatX() ? -1 : 1);
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());
