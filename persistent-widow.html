  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, L.gy - 210 + Math.sin(x / 90) * 16 + Math.sin(x / 37) * 5);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#86b95d';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, L.gy - 40 + Math.sin(x / 160) * 10);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#f7f0a0';
  for (let i = 0; i < 18; i++) { const fx = x0 + ((i * 97) % Math.max(1, x1 - x0)); ctx.beginPath(); ctx.arc(fx, L.gy + 40 + (i % 3) * 30, 3, 0, TAU); ctx.fill(); }

  // Listeners look toward Jesus
  const back = listeners.slice(0, 2), front = listeners.slice(2);
  back.forEach((d, k) => { d.x = lerp(L.a + 40, L.b - 40, k); d.y = L.gy - 40; d.s = L.s * 0.85; d.dim = true; });
  front.forEach((d, k) => { d.x = lerp(L.a, L.b, k / 3); d.y = L.gy; d.s = L.s; d.dim = false; });
  for (const d of listeners) {
    const dx = L.jx - d.x, dy = (L.gy - 70) - (d.y - 60);
    const len = Math.hypot(dx, dy) || 1;
    d.lx = dx / len; d.ly = dy / len * 0.4;
  }
  back.forEach(drawPerson);
  front.forEach(drawPerson);
  drawJesus({ x: L.jx, y: L.gy, s: L.s * 1.1, pose: 'teach', face: phaseT > 4.2 ? 'joy' : 'calm' });

  for (const b of bubbles) if (b.who === 'jesus') drawBubble(b, L.jx + 10, L.gy - 80 * L.s * 1.1, 8, W - 8);
  if (phaseT > 1.2) {
    ctx.save();
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 4);
    ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    const txt = isTouch() ? 'Tap to see the story' : 'Tap or press Space to see the story';
    ctx.strokeText(txt, W / 2, H - 40);
    ctx.fillStyle = '#7a5200'; ctx.fillText(txt, W / 2, H - 40);
    ctx.restore();
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHeart(x, y, r, full) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fillStyle = full ? '#e8465a' : 'rgba(90,66,16,0.2)';
  ctx.fill();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const ink = '#5a4210';

  // Left: level + the judge's annoyance
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' || phase === 'frame' ? 'The Persistent Widow' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('JUDGE', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(58, 38, 130, 13, 6.5); ctx.fill();
  if (meterShown > 0.005) {
    const gg = ctx.createLinearGradient(58, 0, 188, 0);
    gg.addColorStop(0, '#ffd43b'); gg.addColorStop(0.5, '#ff922b'); gg.addColorStop(1, '#e03131');
    ctx.fillStyle = gg;
    roundRect(58, 38, 130 * clamp(meterShown, 0, 1), 13, 6.5); ctx.fill();
  }
  ctx.fillStyle = ink; ctx.font = '600 11px Fredoka, sans-serif';
  ctx.fillText(meterShown > 0.67 ? 'fuming!' : meterShown > 0.34 ? 'annoyed' : 'grumpy', 194, 49);

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: day, hearts and score
  if (state !== 'title' && phase !== 'frame') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('DAY', rx, 20);
    ctx.font = '700 20px Fredoka, sans-serif';
    ctx.fillText(`${day}`, rx, 42);
    ctx.shadowBlur = 0;
    for (let i = 0; i < MAX_HOPE; i++) drawHeart(rx - 9 - i * 22, 60, 8, i < hope);
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.fillText(`Score ${totalScore + (state === 'win' ? 0 : levelScore)}`, rx, 90);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const lines = wrapText(message.text, W - 40);
  lines.forEach((l, k) => {
    const y = H * 0.34 + k * 30;
    ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (phase === 'frame' && state !== 'title') drawFrameScene();
  else drawStreet();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (fadeT > 0) {
    ctx.fillStyle = `rgba(255,248,230,${clamp(fadeT / 0.5, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateBubbles(dt);
  updateCrowd(dt);
  for (const c of bgClouds) { c.f += c.speed * dt / (viewW + 300); if (c.f > 1) c.f -= 1; }
  if (widow) blinkTick(widow, dt);
  if (judge) blinkTick(judge, dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win') {
    phaseT += dt;
    doorOpen = Math.min(1, doorOpen + dt * 2.5);
    judge.up = 1;
    if (Math.random() < dt * 10) spawn(widow.x + rand(-40, 40), GROUND - rand(40, 130), 0, -20, 1, '#fff6d0', 3);
  }
  if (state !== 'pause') for (const o of obstacles) updateObstacle(o, dt);

  // The judge's chimney puffs harder the crosser he gets
  if ((state === 'play' || state === 'win') && phase !== 'frame' && meterShown > 0.2 && Math.random() < dt * meterShown * 5) {
    spawn(doorX + 117, GROUND - 520, rand(-6, 6), rand(-45, -25), 2.2, 'rgba(160,160,170,0.55)', rand(9, 14), -4);
  }

  // Camera: follow the widow, show the judge's door while she knocks
  const maxCam = Math.max(0, worldW - W);
  let target = widow ? clamp(widow.x - W * 0.35, 0, maxCam) : 0;
  if (['knock', 'react', 'giveIn'].includes(phase) || state === 'win') target = maxCam;
  if (state === 'title') target = 0;
  camX += (target - camX) * Math.min(1, dt * 3);
  camX = clamp(camX, 0, maxCam);

  shockT = Math.max(0, shockT - dt);
  worryT = Math.max(0, worryT - dt);
  wowT = Math.max(0, wowT - dt);
  shakeT = Math.max(0, shakeT - dt);
  fadeT = Math.max(0, fadeT - dt);
  doorShake = Math.max(0, doorShake - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
