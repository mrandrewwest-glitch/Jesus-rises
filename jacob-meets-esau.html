<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d8fc4">
<title>Jacob Meets Esau</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #3d8fc4;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 60, 90, 0.25);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Jacob Meets Esau</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'jesusLovesMe', instrument: 'harp', accent: 'pipe', ambience: 'sea', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  present: { ref: 'Genesis 32:13', KJV: 'and took of that which came to his hand a present for Esau his brother;', NKJV: 'and took what came to his hand as a present for Esau his brother:', NIV: 'and from what he had with him he selected a gift for his brother Esau:', NLT: 'Then he selected these gifts from his possessions to present to his brother, Esau:' },
  gifts: { ref: 'Genesis 32:14–15', KJV: 'Two hundred she goats, and twenty he goats, two hundred ewes, and twenty rams, Thirty milch camels with their colts, forty kine, and ten bulls, twenty she asses, and ten foals.', NKJV: 'two hundred female goats and twenty male goats, two hundred ewes and twenty rams, thirty milk camels with their colts, forty cows and ten bulls, twenty female donkeys and ten foals.', NIV: 'two hundred female goats and twenty male goats, two hundred ewes and twenty rams, thirty female camels with their young, forty cows and ten bulls, and twenty female donkeys and ten male donkeys.', NLT: '200 female goats, 20 male goats, 200 ewes, 20 rams, 30 female camels with their young, 40 cows, 10 bulls, 20 female donkeys, and 10 male donkeys.' },
  // Level cards and the fail card
  droves: { ref: 'Genesis 32:16', KJV: 'Pass over before me, and put a space betwixt drove and drove.', NKJV: 'Pass over before me, and put some distance between successive droves.', NIV: 'Go ahead of me, and keep some space between the herds.', NLT: 'Go ahead of me with the animals, but keep some distance between the herds.' },
  // Win card
  embraced: { ref: 'Genesis 33:4', KJV: 'And Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.', NKJV: 'But Esau ran to meet him, and embraced him, and fell on his neck and kissed him, and they wept.', NIV: 'But Esau ran to meet Jacob and embraced him; he threw his arms around his neck and kissed him. And they wept.', NLT: 'Then Esau ran to meet him and embraced him, threw his arms around his neck, and kissed him. And they both wept.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  layout();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const HERDS = ['goats', 'sheep', 'camels', 'cows', 'donkeys'];
const HERD_NAME = { goats: 'goats', sheep: 'sheep', camels: 'camels', cows: 'cows', donkeys: 'donkeys' };
const HOP = 0.32;         // seconds a hop takes
const WARN = 0.6;         // seconds a stone wobbles before it sinks
// stones: stepping stones across; bob: which stones sink now and then (never two side by side);
// period/down: a sinking stone's cycle and how long it stays under; logs: drifting logs per second
const LEVELS = [
  { name: 'The Goats Go First',  herds: 2, stones: 4, bob: [1],          period: 4.2, down: 1.4, logs: 0,    logSpeed: 0,   time: 60,  hearts: 3, hint: true },
  { name: 'Camels Next',         herds: 3, stones: 5, bob: [1, 3],       period: 3.6, down: 1.3, logs: 0,    logSpeed: 0,   time: 70,  hearts: 3, hint: true },
  { name: 'Drifting Logs',       herds: 4, stones: 5, bob: [0, 2, 4],    period: 3.2, down: 1.2, logs: 0.22, logSpeed: 110, time: 85,  hearts: 3, hint: false },
  { name: 'All Five Herds',      herds: 5, stones: 6, bob: [0, 2, 4],    period: 2.9, down: 1.15, logs: 0.3, logSpeed: 140, time: 100, hearts: 3, hint: false },
  { name: 'A Wider River',       herds: 5, stones: 7, bob: [0, 2, 4, 6], period: 2.6, down: 1.1, logs: 0.38, logSpeed: 165, time: 110, hearts: 3, hint: false },
  { name: 'The River Runs Fast', herds: 5, stones: 7, bob: [0, 2, 4, 6], period: 2.3, down: 1.0, logs: 0.48, logSpeed: 195, time: 110, hearts: 3, hint: false },
];
const NLEV = LEVELS.length;
function makeConfig(n) { return LEVELS[clamp(n, 1, NLEV) - 1]; }

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | win | fail | pause | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0, levelScore = 0;
let best = 0;
try { best = +localStorage.getItem('esauBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let introduced = 0;       // the level whose card was last shown
let t = 0, playT = 0, winT = 0, failT = 0;
let stones = [], logs = [], logT = 0;
let herd = null;          // the herd crossing now
let herdIndex = 0, delivered = [], waitT = 0;
let hearts = 3, splashes = 0, hops = 0;
let particles = [], popups = [], ripples = [];
let message = { text: '', t: 0 };
let flashT = 0, shakeT = 0, endTimer = 0;
let lastScore = null;
let told = {};
let failWhy = '';

// Layout (playfield coordinates)
const L = { riverTop: 280, riverBot: 730, startY: 800, endY: 222, cx: 300 };
function layout() {
  L.cx = W / 2;
  if (stones.length) placeStones();
}

// ============================================================
//  The ford
// ============================================================
function buildFord() {
  stones = [];
  for (let i = 0; i < cfg.stones; i++) {
    stones.push({ i, x: 0, y: 0, bob: cfg.bob.includes(i), off: 0, r: 34 });
  }
  // sinking stones take turns: each is half a cycle after the one before it
  let k = 0;
  for (const s of stones) if (s.bob) { s.off = (k * 0.5 + rand(-0.05, 0.05)) * cfg.period; k++; }
  placeStones();
}
function placeStones() {
  const n = stones.length;
  const gap = (L.riverBot - L.riverTop) / (n + 1);
  for (const s of stones) {
    s.y = L.riverBot - (s.i + 1) * gap + 6;
    s.x = L.cx + Math.sin(s.i * 1.7 + 0.6) * Math.min(46, W * 0.07);
  }
}

// 0 = up, 1 = wobbling (about to sink), 2 = under water. tt is game time.
function stoneState(s, tt = t) {
  if (!s.bob) return 0;
  const u = ((tt + s.off) % cfg.period + cfg.period) % cfg.period;
  if (u >= cfg.period - cfg.down) return 2;
  if (u >= cfg.period - cfg.down - WARN) return 1;
  return 0;
}
// how far a stone has sunk (0 up .. 1 under), for drawing
function stoneSink(s) {
  if (!s.bob) return 0;
  const u = ((t + s.off) % cfg.period + cfg.period) % cfg.period;
  const d0 = cfg.period - cfg.down;
  if (u >= d0) return clamp((u - d0) / 0.2, 0, 1) * clamp((cfg.period - u) / 0.2, 0, 1);
  return 0;
}

// Positions along the crossing: -1 is Jacob's bank, 0..n-1 the stones, n Esau's bank
function posXY(p) {
  if (p < 0) return { x: L.cx, y: L.startY };
  if (p >= stones.length) return { x: L.cx, y: L.endY };
  return { x: stones[p].x, y: stones[p].y };
}

// Will a log be over stone p at game time tt?
function logOver(p, tt = t) {
  if (p < 0 || p >= stones.length) return false;
  const s = stones[p];
  for (const g of logs) {
    if (g.row !== p) continue;
    const x = g.x + g.v * (tt - t);
    if (Math.abs(x - s.x) < g.len / 2 + 26) return true;
  }
  return false;
}
// Is it safe to be on position p for the whole time span [t+a, t+b]?
function safeSpan(p, a, b) {
  if (p < 0 || p >= stones.length) return true;
  for (let x = a; x <= b + 1e-6; x += 0.04) {
    if (stoneState(stones[p], t + x) === 2 || logOver(p, t + x)) return false;
  }
  return true;
}

function newHerd() {
  const kind = HERDS[herdIndex];
  herd = { kind, pos: -1, hopT: 0, from: -1, x: L.cx, y: L.startY + 30, enter: 0.6, splashT: 0, sx: 0, sy: 0, face: 1, phase: rand(0, TAU), blink: 0, blinkT: 2, mood: 'happy' };
  if (!told[kind]) { told[kind] = true; showMessage(herdIndex === 0 ? `Tap to send the ${HERD_NAME[kind]} across!` : `Now the ${HERD_NAME[kind]}!`, 2); }
}

function hop() {
  if (state !== 'play' || !herd || herd.splashT > 0 || herd.enter > 0) return;
  if (herd.hopT > 0) return;
  herd.from = herd.pos;
  herd.pos++;
  herd.hopT = HOP;
  hops++;
  sfx.hop(herd.pos / (stones.length + 1));
}

function land() {
  const p = herd.pos;
  if (p >= stones.length) { deliver(); return; }
  const s = stones[p];
  if (stoneState(s) === 2) { splash('The stone was under the water!'); return; }
  if (logOver(p)) { splash('Bump! A log floated by.'); return; }
  ripples.push({ x: s.x, y: s.y + 6, t: 0.6 });
  sfx.plop();
  if (s.bob && !told.bob) { told.bob = true; showMessage('This stone sinks! Hop off quickly.', 2.2); }
}

function splash(text) {
  herd.splashT = 1.6;
  herd.sx = herd.x; herd.sy = herd.y;
  hearts--; splashes++;
  shakeT = 0.25;
  sfx.splash();
  for (let i = 0; i < 18; i++) spawn(herd.x + rand(-20, 20), herd.y, rand(-90, 90), rand(-220, -80), rand(0.5, 1), pick(['#bfe6ff', '#ffffff', '#8fcfef']), rand(3, 6), 500);
  ripples.push({ x: herd.x, y: herd.y + 6, t: 1 });
  showMessage(text, 1.8);
  if (hearts <= 0) { failWhy = 'splash'; fail(); }
}

function deliver() {
  delivered.push(herd.kind);
  const pts = 300 + level * 50;
  levelScore += pts;
  popups.push({ x: herd.x, y: herd.y - 60, text: `+${pts}`, t: 1, col: '#fff6c0' });
  sparkleBurst(herd.x, herd.y - 30, 16);
  sfx.deliver(delivered.length / cfg.herds);
  herd = null;
  herdIndex++;
  if (herdIndex >= cfg.herds) { win(); return; }
  waitT = 0.7;        // a space between drove and drove
}

function updateHerd(dt) {
  if (!herd) {
    if (waitT > 0) { waitT -= dt; if (waitT <= 0) newHerd(); }
    return;
  }
  herd.blinkT -= dt;
  if (herd.blinkT <= 0) { herd.blink = 0.12; herd.blinkT = rand(1.5, 4); }
  if (herd.blink > 0) herd.blink -= dt;
  if (herd.enter > 0) {
    herd.enter = Math.max(0, herd.enter - dt);
    herd.y = L.startY + herd.enter * 50;
    return;
  }
  if (herd.splashT > 0) {
    herd.splashT -= dt;
    // swept a little way down the river, then back to Jacob's bank to try again
    const f = 1 - herd.splashT / 1.6;
    herd.x = herd.sx + f * 120;
    herd.y = herd.sy + Math.sin(f * 9) * 3;
    if (herd.splashT <= 0 && state === 'play') {
      herd.pos = -1; herd.hopT = 0; herd.enter = 0.6;
      herd.x = L.cx; herd.y = L.startY + 30;
      for (let i = 0; i < 10; i++) spawn(herd.x + rand(-20, 20), L.startY - 30, rand(-80, 80), rand(-120, -40), 0.6, '#bfe6ff', 3, 300);
    }
    return;
  }
  if (herd.hopT > 0) {
    herd.hopT -= dt;
    const f = clamp(1 - herd.hopT / HOP, 0, 1);
    const a = posXY(herd.from), b = posXY(herd.pos);
    herd.x = lerp(a.x, b.x, f); herd.y = lerp(a.y, b.y, f) - Math.sin(f * Math.PI) * 34;
    herd.face = b.x >= a.x - 2 ? 1 : -1;
    if (herd.hopT <= 0) { herd.x = b.x; herd.y = b.y; land(); }
    return;
  }
  const p = posXY(herd.pos);
  herd.x = p.x; herd.y = p.y;
  // standing on a stone that sinks, or in the way of a log
  if (herd.pos >= 0 && herd.pos < stones.length) {
    if (stoneState(stones[herd.pos]) === 2) splash('Splash! The stone sank.');
    else if (logOver(herd.pos)) splash('Bump! A log floated by.');
  }
}

function updateLogs(dt) {
  if (cfg.logs > 0) {
    logT -= dt;
    if (logT <= 0) {
      logT = 1 / cfg.logs * rand(0.7, 1.3);
      // logs float along a stone's row; mostly the steady stones, so waiting is never forever safe
      const steady = stones.filter((s) => !s.bob), pool = steady.length && Math.random() < 0.7 ? steady : stones;
      const s = pick(pool);
      logs.push({ row: s.i, x: -offX - 90, v: cfg.logSpeed * rand(0.85, 1.15), len: rand(80, 110), rot: rand(0, TAU) });
      if (!told.log) { told.log = true; showMessage('Watch out for floating logs!', 2.2); }
    }
  }
  for (let i = logs.length - 1; i >= 0; i--) {
    logs[i].x += logs[i].v * dt;
    logs[i].rot += dt;
    if (logs[i].x > W + offX + 120) logs.splice(i, 1);
  }
}

// ============================================================
//  People
// ============================================================
const JACOB = { robe: '#2f8a7a', hair: '#4a2f1a', beard: true, skin: '#d9a066', stripe: '#e8d9a0', i: 0, blinkT: 2, blink: 0, phase: 0, staff: true };
const ESAU = { robe: '#b5503f', hair: '#c0582a', beard: true, skin: '#d39a66', stripe: '#f0c96a', i: 1, blinkT: 3, blink: 0, phase: 1 };
const ESAU_MEN = [
  { robe: '#7a6a4a', hair: '#3a2716', beard: true, skin: '#c98d56', stripe: '#d8c7a0', i: 2, blinkT: 2, blink: 0, phase: 2 },
  { robe: '#5a6475', hair: '#2a1a0e', beard: true, skin: '#c88e5a', stripe: '#c9b27a', i: 3, blinkT: 3, blink: 0, phase: 3 },
];

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'joy';
  ctx.lineCap = 'round';
  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) { ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke(); continue; }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (li, lo, ri, ro) => {
    ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-ex - 4, ey + lo); ctx.lineTo(-ex + 3, ey + li); ctx.moveTo(ex - 3, ey + ri); ctx.lineTo(ex + 4, ey + ro); ctx.stroke();
  };
  if (mood === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,0.45)'; ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
    // happy tears (they wept)
    if (state === 'win' || state === 'done') {
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath(); ctx.moveTo(-12, hy + 2); ctx.quadraticCurveTo(-9, hy + 8, -12, hy + 10); ctx.quadraticCurveTo(-15, hy + 8, -12, hy + 2); ctx.fill();
    }
  } else if (mood === 'worried') {
    eyes(3.5, 4.5, 2);
    brows(-10, -6, -10, -6);
    ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, mouthY); ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY); ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY); ctx.stroke();
  } else {
    eyes(3.5, 4.5, 2);
    brows(-7, -7, -7, -7);
    ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
}

// mood: watch | worried | joy | hug (arms reaching towards dir)
function drawPerson(d, x, y, s, mood, dir = 1, walk = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  const jump = mood === 'joy' ? Math.abs(Math.sin(t * 7 + d.phase)) * 8 : walk ? Math.abs(Math.sin(walk)) * 4 : 0;
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (d.staff && mood !== 'hug') {
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-22, -78); ctx.arc(-15, -78, 7, Math.PI, 0); ctx.stroke();
  }
  if (walk) {
    ctx.strokeStyle = shade(d.robe, -50); ctx.lineWidth = 6; ctx.lineCap = 'round';
    const sw = Math.sin(walk) * 7;
    ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(-5 + sw, 2); ctx.moveTo(5, -8); ctx.lineTo(5 - sw, 2); ctx.stroke();
  }
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37); ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = d.stripe; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, -38); ctx.lineTo(-8, 0); ctx.moveTo(6, -38); ctx.lineTo(8, 0); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, d.staff ? -21 : -24 + wave, d.staff ? -50 : -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'hug') {
    arm(-11 * dir, -34, 26 * dir, -44);
    arm(11 * dir, -30, 30 * dir, -30);
  } else if (mood === 'wave') {
    arm(-11, -32, d.staff ? -21 : -15, d.staff ? -45 : -12);
    arm(11, -32, 22 + Math.sin(t * 8) * 4, -66);
  } else {
    arm(-11, -32, d.staff ? -21 : -15, d.staff ? -45 : -12);
    arm(11, -32, 15, -12);
  }
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10); ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
  ctx.closePath(); ctx.fill();
  if (d.beard) {
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2); ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22); ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8); ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood === 'hug' || mood === 'wave' ? 'joy' : mood, hy, dir * 0.5, 0);
  ctx.restore();
}

function updatePerson(d, dt) {
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 4.5); }
  if (d.blink > 0) d.blink -= dt;
}

// ============================================================
//  The animals (side view, facing right)
// ============================================================
const BEAST = {
  goats:   { body: '#f1ece2', edge: '#c9c0b0', leg: '#8c7b6a', face: '#f1ece2', h: 1 },
  sheep:   { body: '#f8f5ec', edge: '#d8d0bf', leg: '#4a3a30', face: '#f0d8be', h: 1 },
  camels:  { body: '#d9b06a', edge: '#a8803e', leg: '#b8904e', face: '#d9b06a', h: 1.3 },
  cows:    { body: '#9a6440', edge: '#6e4428', leg: '#6e4428', face: '#9a6440', h: 1.1 },
  donkeys: { body: '#9c9a9a', edge: '#6f6c6c', leg: '#6f6c6c', face: '#9c9a9a', h: 1 },
};

function drawBeast(kind, x, y, s, face, step, blink, wet) {
  const c = BEAST[kind];
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * face, s);
  const legH = kind === 'camels' ? 30 : 18;
  ctx.strokeStyle = c.leg; ctx.lineWidth = kind === 'camels' ? 5 : 5.5; ctx.lineCap = 'round';
  const sw = Math.sin(step) * 5;
  if (!wet) for (const [lx, ph] of [[-18, 1], [-10, -1], [12, -1], [20, 1]]) {
    ctx.beginPath(); ctx.moveTo(lx, -legH); ctx.lineTo(lx + sw * ph, 0); ctx.stroke();
  }
  const by = -legH - 12;
  // tail
  ctx.strokeStyle = c.edge; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-27, by - 2);
  if (kind === 'goats') ctx.lineTo(-33, by - 12); else ctx.quadraticCurveTo(-36, by + 4, -33, by + 14);
  ctx.stroke();
  ctx.fillStyle = c.body; ctx.strokeStyle = c.edge; ctx.lineWidth = 2;
  if (kind === 'sheep') {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const an = k / 10 * TAU;
      ctx.moveTo(Math.cos(an) * 24 + 9, by + Math.sin(an) * 13);
      ctx.arc(Math.cos(an) * 24, by + Math.sin(an) * 13, 9, 0, TAU);
    }
    ctx.ellipse(0, by, 26, 15, 0, 0, TAU);
    ctx.stroke(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(0, by, 29, kind === 'cows' ? 17 : 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
    if (kind === 'camels') {
      ctx.beginPath(); ctx.ellipse(-4, by - 13, 15, 13, 0, Math.PI, TAU); ctx.fill(); ctx.stroke();
    }
    if (kind === 'cows') {
      ctx.fillStyle = '#f4ece0';
      ctx.beginPath(); ctx.ellipse(-8, by + 6, 10, 7, 0.3, 0, TAU); ctx.fill();
    }
    if (kind === 'donkeys') {
      ctx.fillStyle = '#d6d4d0';
      ctx.beginPath(); ctx.ellipse(2, by + 8, 18, 6, 0, 0, TAU); ctx.fill();
    }
  }
  // neck and head
  let hx = 31, hy = by - 10;
  if (kind === 'camels') {
    ctx.strokeStyle = c.body; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(22, by - 2); ctx.quadraticCurveTo(40, by - 6, 38, by - 34); ctx.stroke();
    hx = 42; hy = by - 38;
  } else if (kind === 'donkeys' || kind === 'cows') {
    ctx.strokeStyle = c.body; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(22, by - 4); ctx.lineTo(31, by - 14); ctx.stroke();
    if (kind === 'donkeys') { ctx.strokeStyle = '#4a4646'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(17, by - 12); ctx.lineTo(28, by - 22); ctx.stroke(); }
  }
  // ears / horns behind the head
  if (kind === 'goats') { ctx.strokeStyle = '#a89270'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hx - 3, hy - 9); ctx.quadraticCurveTo(hx - 12, hy - 24, hx - 18, hy - 14); ctx.stroke(); }
  if (kind === 'donkeys') {
    ctx.fillStyle = c.body; ctx.strokeStyle = c.edge; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(hx - 6, hy - 18, 4.5, 13, -0.35, 0, TAU); ctx.fill(); ctx.stroke();
  }
  if (kind === 'cows') {
    ctx.strokeStyle = '#efe6cc'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(hx - 4, hy - 9); ctx.quadraticCurveTo(hx - 6, hy - 18, hx + 1, hy - 20); ctx.stroke();
  }
  ctx.fillStyle = kind === 'sheep' ? '#e2c6a6' : c.edge;
  ctx.beginPath(); ctx.ellipse(hx - 9, hy - 1, 8, 4, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = c.face; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(hx, hy, 11, 12, 0.35, 0, TAU); ctx.fill(); ctx.stroke();
  // muzzle
  ctx.fillStyle = kind === 'cows' ? '#f0b8a8' : kind === 'donkeys' ? '#d6d4d0' : kind === 'camels' ? '#c89a58' : c.face;
  ctx.beginPath(); ctx.ellipse(hx + 8, hy + 6, kind === 'sheep' || kind === 'goats' ? 7 : 8.5, 6.5, 0.3, 0, TAU); ctx.fill();
  if (kind === 'sheep') { ctx.fillStyle = c.body; ctx.beginPath(); ctx.arc(hx - 3, hy - 11, 6, 0, TAU); ctx.arc(hx + 4, hy - 12, 5, 0, TAU); ctx.fill(); }
  if (kind === 'goats') { ctx.fillStyle = '#d8d0c0'; ctx.beginPath(); ctx.moveTo(hx + 4, hy + 10); ctx.lineTo(hx + 8, hy + 22); ctx.lineTo(hx + 11, hy + 10); ctx.fill(); }
  // eye
  if (blink > 0) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx + 1, hy - 2); ctx.lineTo(hx + 7, hy - 2); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(hx + 4, hy - 2, 4.2, wet ? 5.6 : 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(hx + 5, hy - 1.5, wet ? 1.8 : 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 5.8, hy - 2.6, 0.9, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#5a3022'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (wet) ctx.ellipse(hx + 10, hy + 8, 2, 2.6, 0, 0, TAU);
  else ctx.arc(hx + 10, hy + 7, 3, 0.1 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

// A herd: the big animal with its little one
function drawHerd(kind, x, y, s, face, step, blink, wet) {
  drawBeast(kind, x - 26 * face * s, y + 4, s * 0.62, face, step + 1.3, 0, wet);
  drawBeast(kind, x, y, s, face, step, blink, wet);
}

// ============================================================
//  Particles and popups
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#e0e8f0']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 200);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1.2), cols[i % cols.length], rand(2, 4.5), 60, i % 3 ? 'dot' : 'star');
  }
}
function heartBurst(x, y, n) {
  for (let i = 0; i < n; i++) spawn(x + rand(-20, 20), y, rand(-60, 60), rand(-140, -60), rand(1, 1.8), pick(['#ff7a8a', '#ff9eb0', '#ffd0d8']), rand(5, 8), -10, 'heart');
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; popups[i].y -= 40 * dt; if (popups[i].t <= 0) popups.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t -= dt; if (ripples[i].t <= 0) ripples.splice(i, 1); }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const s = p.size * 1.6;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4, r = k % 2 ? s * 0.35 : s; ctx.lineTo(p.x + Math.cos(an) * r, p.y + Math.sin(an) * r); }
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'heart') {
      const s = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + s * 0.9);
      ctx.bezierCurveTo(p.x - s * 1.4, p.y - s * 0.2, p.x - s * 0.5, p.y - s * 1.3, p.x, p.y - s * 0.4);
      ctx.bezierCurveTo(p.x + s * 0.5, p.y - s * 1.3, p.x + s * 1.4, p.y - s * 0.2, p.x, p.y + s * 0.9);
      ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t * 2, 0, 1);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,30,10,0.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1; cfg = makeConfig(1);
  resetLevel();
  showOverlay('Jacob Meets Esau', 'Send the gifts across the river',
    `${verseHTML('present')}
     <ul>
       <li>Jacob is going home to meet his brother Esau. He sends herds of animals across the river first, as a <b>gift</b>.</li>
       <li><b>Tap</b> to make the herd <b>hop</b> to the next stepping stone. Get every herd to <b>Esau's side</b>, one after another.</li>
       <li>Some stones <b>wobble and sink</b> for a moment: don't hop onto them when they're under, and hop off before they go down!</li>
       <li>Later, <b>logs</b> float down the river. Don't be on their stone when they pass.</li>
       <li>Hurry: <b>Esau is coming!</b> Each splash costs a heart.</li>
       <li><b>Keys:</b> <kbd>Space</kbd> or <kbd>&uarr;</kbd> to hop.</li>
     </ul>
     ${verseHTML('gifts')}
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Start', () => { level = 1; totalScore = 0; introduced = 0; startLevel(); });
}

function resetLevel() {
  cfg = makeConfig(level);
  logs = []; logT = 1.5;
  buildFord();
  herd = null; herdIndex = 0; delivered = []; waitT = 0.4;
  hearts = cfg.hearts; splashes = 0; hops = 0;
  particles = []; popups = []; ripples = [];
  levelScore = 0;
  playT = 0; winT = 0; failT = 0;
  flashT = shakeT = 0; endTimer = 0;
  told = {}; failWhy = '';
}

const LEVEL_TIPS = [
  'Tap to hop from stone to stone. A <b>green glow</b> means the next stone is safe.',
  'Three herds now. Wait for the sinking stones to come back up!',
  'Logs float down the river. <b>Hop on</b> before a log reaches your stone.',
  'All five herds: goats, sheep, camels, cows and donkeys!',
  'A wider river with more sinking stones.',
  'The river runs fast. Be brave and quick!',
];

function startLevel(retry = false) {
  resetLevel();
  sfx.levelStart();
  if (retry || introduced === level) { beginPlay(); return; }
  introduced = level;   // the level card shows once; retries go straight in
  state = 'intro';
  syncAmbience();
  const list = HERDS.slice(0, cfg.herds).join(', ');
  showOverlay(`Level ${level}`, cfg.name,
    `${verseHTML('droves')}
     <p style="text-align:center">${LEVEL_TIPS[level - 1]}</p>
     <p class="score">Send: <b>${list}</b><br>${cfg.stones} stones &middot; ${cfg.time} seconds &middot; ${cfg.hearts} hearts</p>`,
    'Go!', beginPlay);
}

function beginPlay() {
  hideOverlay();
  state = 'play';
  syncAmbience();
  showMessage(`Level ${level}: ${cfg.name}`, 2);
}

function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const timeBonus = Math.round(Math.max(0, cfg.time - playT) * 10);
  const heartBonus = hearts * 150;
  const dry = splashes === 0 ? 300 : 0;
  const levelBonus = level * 200;
  const score = levelScore + timeBonus + heartBonus + dry + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('esauBest', best); } catch (e) {} }
  lastScore = { herdPts: levelScore, timeBonus, heartBonus, dry, levelBonus, score };
  logs = [];
  showMessage('All the gifts are across!', 2);
  sfx.win();
  endTimer = 5;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage(failWhy === 'time' ? 'Esau is here already!' : 'Too many splashes…', 2.2);
  sfx.fail();
  endTimer = 2.4;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= NLEV;
    if (last) state = 'done';
    showOverlay(last ? 'Brothers again!' : 'Esau ran to meet him!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('embraced')}
       <p style="text-align:center">Jacob was afraid, but Esau forgave him. The two brothers hugged and cried for joy!</p>
       <p class="score">Herds across: <b>${s.herdPts}</b><br>Time left: <b>${s.timeBonus}</b><br>Hearts left: <b>${s.heartBonus}</b><br>${s.dry ? `Not one splash: <b>${s.dry}</b><br>` : ''}Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${last ? '<p style="text-align:center"><b>Every herd crossed every river. Wonderful!</b></p>' : ''}
       ${creditHTML()}`,
      last ? 'Play again' : 'Next level', last ? () => { level = 1; totalScore = 0; introduced = 0; startLevel(); } : () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Splash!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${failWhy === 'time' ? 'Esau arrived before all the gifts were across. Hop a little quicker!' : 'Too many animals fell in the water. Wait until the next stone is <b>up and still</b>, then hop!'}</p>
       ${verseHTML('droves')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'play' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') && !e.repeat) hop();
});

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 8) { b.action(); return; }
  }
  if (state === 'play') hop();
});

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.Q.value = 0.8;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  hop(f) { if (this.ctx) Music.tap(clamp(f, 0, 1)); },
  plop() { this.tone(520, 0.1, 'sine', 0.12, 0, 300); },
  splash() { this.noiseBurst(1800, 0.6, 0.45, 300); this.tone(300, 0.3, 'sine', 0.15, 0.05, 120); },
  deliver(f) { [784, 988, 1175].forEach((fr, i) => this.tone(fr * (1 + f * 0.2), 0.3, 'sine', 0.1, i * 0.07)); },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Rendering
// ============================================================
function esauProgress() {
  if (state === 'win' || state === 'done') return 1;
  return clamp(playT / cfg.time, 0, 1);
}

function drawLand() {
  const top = -offY, left = -offX, right = W + offX;
  // sky and far hills
  const sky = ctx.createLinearGradient(0, top, 0, 160);
  sky.addColorStop(0, '#8fd0f5'); sky.addColorStop(1, '#e2f3fb');
  ctx.fillStyle = sky; ctx.fillRect(left, top, right - left, 170 - top);
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(W * 0.85, Math.max(top + 70, 60), 30, 0, TAU); ctx.fill();
  for (const [cx, cy, w] of [[W * 0.25, Math.max(top + 60, 40), 110], [W * 0.6, top + Math.max(60, offY * 0.5), 140]]) {
    ctx.fillStyle = '#fff';
    for (const [dx, dy, rx, ry] of [[0, 0, 0.5, 0.42], [-0.28, 0.08, 0.3, 0.34], [0.3, 0.06, 0.32, 0.36], [0.05, -0.25, 0.28, 0.36]]) {
      ctx.beginPath(); ctx.ellipse(cx + w * dx, cy + 36 * dy, w * rx, 36 * ry, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.fillStyle = '#b9c98a';
  ctx.beginPath(); ctx.moveTo(left, 170);
  for (let x = left; x <= right + 40; x += 40) ctx.lineTo(x, 130 + Math.sin(x * 0.009) * 20 + Math.sin(x * 0.023) * 8);
  ctx.lineTo(right, 200); ctx.lineTo(left, 200); ctx.fill();
  // Esau's bank (far)
  ctx.fillStyle = '#9cc463';
  ctx.beginPath(); ctx.moveTo(left, 160);
  for (let x = left; x <= right + 40; x += 40) ctx.lineTo(x, 156 + Math.sin(x * 0.015) * 6);
  ctx.lineTo(right, L.riverTop + 6); ctx.lineTo(left, L.riverTop + 6); ctx.fill();
  // the river
  const rg = ctx.createLinearGradient(0, L.riverTop, 0, L.riverBot);
  rg.addColorStop(0, '#5fb3dd'); rg.addColorStop(1, '#3d8fc4');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.moveTo(left, L.riverTop);
  for (let x = left; x <= right + 30; x += 30) ctx.lineTo(x, L.riverTop + Math.sin(x * 0.03 + 1) * 4);
  for (let x = right; x >= left - 30; x -= 30) ctx.lineTo(x, L.riverBot + Math.sin(x * 0.025) * 5);
  ctx.closePath(); ctx.fill();
  // flowing lines (the current)
  const flow = 40 + cfg.logSpeed * 0.4 + level * 8;
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const span = right - left + 120;
  for (let i = 0; i < 26; i++) {
    const y = L.riverTop + 20 + hash(i, 1) * (L.riverBot - L.riverTop - 40);
    const x = left - 60 + ((hash(i, 2) * span + t * flow * (0.7 + hash(i, 3) * 0.6)) % span);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 14, y - 4, x + 30, y); ctx.stroke();
  }
  // Jacob's bank (near)
  const g = ctx.createLinearGradient(0, L.riverBot, 0, H);
  g.addColorStop(0, '#a8c96a'); g.addColorStop(1, '#7fae4a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(left, L.riverBot + 10);
  for (let x = left; x <= right + 40; x += 40) ctx.lineTo(x, L.riverBot - 2 + Math.sin(x * 0.02) * 6);
  ctx.lineTo(right, H + 10); ctx.lineTo(left, H + 10); ctx.fill();
  // sandy landing places
  ctx.fillStyle = '#e0c88e';
  ctx.beginPath(); ctx.ellipse(L.cx, L.startY + 6, 70, 22, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(L.cx, L.endY + 6, 70, 20, 0, 0, TAU); ctx.fill();
  // reeds
  ctx.strokeStyle = '#4f8a3a'; ctx.lineWidth = 3;
  for (let i = 0; i < 16; i++) {
    const x = left + hash(i, 5) * (right - left), y = i % 2 ? L.riverBot + 6 : L.riverTop + 2;
    if (Math.abs(x - L.cx) < 110) continue;
    const sw = Math.sin(t * 1.5 + i) * 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 2, y - 16, x + 4 + sw, y - 30); ctx.stroke();
  }
  // Jacob's tents on the near bank
  const tent = (x, y, s, col) => {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(-40, -50); ctx.lineTo(40, -50); ctx.lineTo(60, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(col, -30);
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(0, -40); ctx.lineTo(12, 0); ctx.fill();
    ctx.restore();
  };
  tent(Math.min(L.cx - 170, W * 0.14 + 30), 880, 0.75, '#7a5a3a');
  if (W > 700) tent(W * 0.85, 870, 0.7, '#8a6a4a');
}

function drawStone(s) {
  const st = stoneState(s), sink = stoneSink(s);
  const wob = st === 1 ? Math.sin(t * 40) * 2.5 : 0;
  // hint: the next stone glows green when it is safe to hop onto it
  if (state === 'play' && cfg.hint && herd && herd.splashT <= 0 && herd.hopT <= 0 && herd.enter <= 0 && herd.pos + 1 === s.i) {
    const ok = safeSpan(s.i, HOP, HOP + 0.5);
    ctx.fillStyle = ok ? 'rgba(90,240,140,0.55)' : 'rgba(255,120,100,0.35)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, s.r + 12, 18, 0, 0, TAU); ctx.fill();
  }
  if (sink >= 1) {
    // just ripples where the stone hides
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    for (let k = 0; k < 2; k++) {
      const r = 14 + ((t * 30 + k * 14) % 28);
      ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, r, r * 0.35, 0, 0, TAU); ctx.stroke();
    }
    return;
  }
  ctx.save();
  ctx.translate(s.x + wob, s.y + sink * 12);
  ctx.fillStyle = 'rgba(20,60,90,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 8, s.r + 4, 12, 0, 0, TAU); ctx.fill();
  const col = s.bob ? '#a59a8a' : '#b9ad98';
  ctx.globalAlpha = 1 - sink * 0.6;
  ctx.fillStyle = shade(col, -35);
  ctx.beginPath(); ctx.ellipse(0, 4, s.r, 14, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, -2, s.r - 2, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-8, -5, 12, 4, -0.2, 0, TAU); ctx.fill();
  if (s.bob) {   // little cracks mark the wobbly stones
    ctx.strokeStyle = shade(col, -50); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(6, -8); ctx.lineTo(10, -2); ctx.lineTo(16, -4); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (st === 1) {
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    const r = s.r + 4 + ((t * 40) % 12);
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, r, r * 0.35, 0, 0, TAU); ctx.stroke();
  }
}

function drawLog(g) {
  const s = stones[g.row];
  ctx.save();
  ctx.translate(g.x, s.y + 2 + Math.sin(t * 3 + g.rot) * 2);
  ctx.fillStyle = 'rgba(20,60,90,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 8, g.len / 2 + 6, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8a5a2b';
  roundRect(-g.len / 2, -10, g.len, 18, 9); ctx.fill();
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-g.len / 2 + 14, -3); ctx.lineTo(g.len / 2 - 20, -3); ctx.stroke();
  ctx.fillStyle = '#d9a86a';
  ctx.beginPath(); ctx.ellipse(g.len / 2 - 2, -1, 5, 9, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#a8743a'; ctx.beginPath(); ctx.ellipse(g.len / 2 - 2, -1, 2.5, 5, 0, 0, TAU); ctx.stroke();
  // a leafy twig
  ctx.fillStyle = '#5a9a3a';
  ctx.beginPath(); ctx.ellipse(-g.len / 4, -14, 8, 4, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-3, 3) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawLand();
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${r.t})`; ctx.lineWidth = 2;
    const rr = 50 - r.t * 40;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * 0.35, 0, 0, TAU); ctx.stroke();
  }
  for (const s of stones) drawStone(s);
  for (const g of logs) drawLog(g);

  const won = state === 'win' || state === 'done';
  // herds already delivered wait on Esau's side
  const per = Math.min(70, (W / 2 - 90) / 5);
  delivered.forEach((k, i) => drawHerd(k, L.cx + 90 + i * per, 236 - (i % 2) * 22, 0.55, 1, 0, 0, false));
  // herds still waiting on Jacob's bank, in order
  const waiting = HERDS.slice(herdIndex + (herd ? 1 : 0), cfg.herds);
  waiting.forEach((k, i) => drawHerd(k, L.cx - 100 - i * per, 830 + (i % 2) * 26, 0.6, 1, 0, 0, false));

  // Esau and his men come along the far bank (they are the timer)
  const ep = esauProgress();
  const meetX = L.cx + 30;
  let ex = lerp(W + offX + 40, meetX + 60, ep);
  let jx = L.cx - 150, jy = 790;
  if (won) {
    const k = ease(clamp(winT / 1.6, 0, 1));
    ex = lerp(ex, meetX + 18, k);
    jx = lerp(L.cx - 150, meetX - 18, k); jy = lerp(790, L.endY + 4, k);
  }
  const hugging = won && winT > 1.6;
  ESAU_MEN.forEach((m, i) => drawPerson(m, ex + 56 + i * 44, 206 - i * 6, 0.82, won ? 'joy' : 'watch', -1, state === 'play' ? t * 8 + i : 0));
  drawPerson(ESAU, ex, 214, 0.95, hugging ? 'hug' : won ? 'joy' : 'watch', -1, state === 'play' || (won && !hugging) ? t * 9 : 0);
  if (won) {
    // Jacob walks across the calm ford to his brother
    drawPerson(JACOB, jx, jy, 0.95, hugging ? 'hug' : 'watch', 1, hugging ? 0 : t * 9);
    if (hugging && Math.random() < 0.15) heartBurst(meetX, L.endY - 70, 1);
  } else {
    drawPerson(JACOB, jx, jy, 1, state === 'fail' ? 'worried' : herd && herd.splashT > 0 ? 'worried' : 'wave', 1, 0);
  }

  // the herd crossing now
  if (herd) {
    const wet = herd.splashT > 0;
    if (wet) {
      ctx.save();
      ctx.beginPath(); ctx.rect(herd.x - 80, herd.y - 120, 160, 110); ctx.clip();
      drawHerd(herd.kind, herd.x, herd.y + 14, 0.8, 1, 0, 0, true);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(herd.x, herd.y - 8, 42, 9, 0, 0, TAU); ctx.stroke();
    } else {
      const step = herd.hopT > 0 ? t * 20 : herd.enter > 0 ? t * 12 : 0;
      drawHerd(herd.kind, herd.x, herd.y, 0.8, herd.face, step, herd.blink, false);
    }
  }
  drawParticles();
  if (state === 'fail') { ctx.fillStyle = `rgba(30,40,60,${Math.min(0.3, failT * 0.3)})`; ctx.fillRect(-offX, -offY, viewW, viewH); }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (flashT > 0) { ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`; ctx.fillRect(0, 0, viewW, viewH); }
  drawHUD();
  drawMessage();
}

// ============================================================
//  HUD
// ============================================================
function drawHeart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 6); ctx.bezierCurveTo(-11, -2, -6, -12, 0, -5); ctx.bezierCurveTo(6, -12, 11, -2, 0, 6);
  ctx.fillStyle = full ? '#e8505b' : 'rgba(255,255,255,0.35)'; ctx.fill();
  ctx.strokeStyle = full ? '#a8242f' : 'rgba(90,66,16,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  const bar = ctx.createLinearGradient(0, 0, 0, 110);
  bar.addColorStop(0, 'rgba(255,255,255,0.55)'); bar.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bar; ctx.fillRect(0, 0, viewW, 110);
  ctx.fillStyle = '#4a3410';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Jacob Meets Esau' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.shadowBlur = 0;
    for (let i = 0; i < cfg.hearts; i++) drawHeart(20 + i * 24, 50, 1.1, i < hearts);
    ctx.textAlign = 'right';
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.fillStyle = '#4a3410';
    ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
    ctx.fillText(`Score ${totalScore + levelScore}`, viewW - 12, 26);
    ctx.font = '600 15px Fredoka, sans-serif';
    ctx.fillText(`Herds ${delivered.length} / ${cfg.herds}`, viewW - 12, 48);
    // Esau is coming: time bar
    ctx.shadowBlur = 0;
    const bw = 120, bx = viewW - 12 - bw, byy = 60;
    ctx.fillStyle = 'rgba(90,60,20,0.2)'; roundRect(bx, byy, bw, 12, 6); ctx.fill();
    const ep = esauProgress();
    ctx.fillStyle = ep > 0.8 && state === 'play' && Math.sin(t * 10) > 0 ? '#e8505b' : '#c0582a';
    if (ep > 0) { roundRect(bx, byy, Math.max(12, bw * ep), 12, 6); ctx.fill(); }
    ctx.fillStyle = '#4a3410'; ctx.font = '600 12px Fredoka, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('Esau is coming', viewW - 12, 88);
  }
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, Math.min(viewW - 40, 520));
  const y0 = offY + 880 - (lines.length - 1) * 28;   // along the bottom of Jacob's bank
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#5a3a00';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePerson(JACOB, dt); updatePerson(ESAU, dt);
  ESAU_MEN.forEach((m) => updatePerson(m, dt));
  if (state === 'play') {
    playT += dt;
    updateLogs(dt);
    updateHerd(dt);
    if (state === 'play' && playT >= cfg.time) { failWhy = 'time'; fail(); }
  } else if (state === 'win' || state === 'done') {
    winT += dt;
  } else if (state === 'fail') {
    failT += dt;
    if (herd && herd.splashT > 0) updateHerd(dt);
  } else if (state === 'title') {
    updateLogs(0);
  }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

window.addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
