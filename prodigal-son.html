<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>The Prodigal Son</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Prodigal Son</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'harp', ambience: 'birds', percussion: false };

// Scripture shown in this game, looked up in the player's chosen version.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  wayOff:    { ref: 'Luke 15:20', KJV: 'But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.', NKJV: 'But when he was still a great way off, his father saw him and had compassion, and ran and fell on his neck and kissed him.', NIV: 'But while he was still a long way off, his father saw him and was filled with compassion for him; he ran to his son, threw his arms around him and kissed him.', NLT: 'And while he was still a long way off, his father saw him coming. Filled with love and compassion, he ran to his son, embraced him, and kissed him.' },   // title card
  aliveAgain: { ref: 'Luke 15:24', KJV: 'For this my son was dead, and is alive again; he was lost, and is found.', NKJV: 'For this my son was dead and is alive again; he was lost and is found.', NIV: 'For this son of mine was dead and is alive again; he was lost and is found.', NLT: 'For this son of mine was dead and has now returned to life. He was lost, but now he is found.' },   // win card
  arise:     { ref: 'Luke 15:18', KJV: 'I will arise and go to my father', NKJV: 'I will arise and go to my father', NIV: 'I will set out and go back to my father', NLT: 'I will go home to my father' },   // son's bubble + fail card
  twoSons:   { ref: 'Luke 15:11', KJV: 'A certain man had two sons', NKJV: 'A certain man had two sons', NIV: 'There was a man who had two sons', NLT: 'A man had two sons' },   // Jesus's bubble
  husks:     { ref: 'Luke 15:16', KJV: 'And he would fain have filled his belly with the husks that the swine did eat', NKJV: 'And he would gladly have filled his stomach with the pods that the swine ate', NIV: 'He longed to fill his stomach with the pods that the pigs were eating', NLT: 'Even the pods he was feeding the pigs looked good to him' },   // banner
  cameTo:    { ref: 'Luke 15:17', KJV: 'And when he came to himself', NKJV: 'But when he came to himself', NIV: 'When he came to his senses', NLT: 'When he finally came to his senses' },   // banner
  ran:       { ref: 'Luke 15:20', KJV: 'His father saw him, and had compassion, and ran', NKJV: 'His father saw him and had compassion, and ran', NIV: 'His father saw him and was filled with compassion for him; he ran to his son', NLT: 'Filled with love and compassion, he ran to his son' },   // banner
  embrace:   { ref: 'Luke 15:20', KJV: 'And fell on his neck, and kissed him', NKJV: 'And fell on his neck and kissed him', NIV: 'Threw his arms around him and kissed him', NLT: 'Embraced him, and kissed him' },   // banner
  bestRobe:  { ref: 'Luke 15:22', KJV: 'Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet', NKJV: 'Bring out the best robe and put it on him, and put a ring on his hand and sandals on his feet', NIV: 'Quick! Bring the best robe and put it on him. Put a ring on his finger and sandals on his feet', NLT: 'Quick! Bring the finest robe in the house and put it on him. Get a ring for his finger and sandals for his feet' },   // father's bubble
  merry:     { ref: 'Luke 15:23', KJV: 'Let us eat, and be merry', NKJV: 'Let us eat and be merry', NIV: 'Let’s have a feast and celebrate', NLT: 'We must celebrate with a feast' },   // father's bubble
  music:     { ref: 'Luke 15:25', KJV: 'He heard musick and dancing', NKJV: 'He heard music and dancing', NIV: 'He heard music and dancing', NLT: 'He heard music and dancing in the house' },   // banner
  angry:     { ref: 'Luke 15:28', KJV: 'And he was angry, and would not go in', NKJV: 'But he was angry and would not go in', NIV: 'The older brother became angry and refused to go in', NLT: 'The older brother was angry and wouldn’t go in' },   // banner
  ever:      { ref: 'Luke 15:31', KJV: 'Thou art ever with me, and all that I have is thine', NKJV: 'You are always with me, and all that I have is yours', NIV: 'You are always with me, and everything I have is yours', NLT: 'You have always stayed by me, and everything I have is yours' },   // father's bubble
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => (f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function mix(a, b, f) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const c = (s) => Math.round(lerp((na >> s) & 255, (nb >> s) & 255, f));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

const isTouch = () => matchMedia('(pointer: coarse)').matches;

// ============================================================
//  Tuning
// ============================================================
const CH = 1.55;          // drawing scale for people on the road
const WALK_V = 150;       // the son's walking speed during a stride (px/s)
const STRIDE = 0.75;      // one good tap keeps him walking this long (s)
const STUMBLE_T = 0.9;    // time spent picking himself up after a stumble
const RUN_KICK = 62;      // speed each tap gives the running father
const RUN_MAX = 440;      // the father's top speed
const RUN_DRAG = 1.3;     // he slows down quickly when you stop tapping
const HOP_T = 0.55;       // time in the air for a hop
const HOP_WIN = 150;      // a tap this close before an obstacle is a hop
const SON_SLOW = 24;      // the son still trudges on while the father runs
const MEET_D = 52;        // this close and they embrace
const HUG_TAPS = 3;       // hugs to melt the older brother's frown
const FADE = 0.35;        // scene fade (each way)

const LEVEL_NAMES = [
  'The Road Home',
  'Over the Hills',
  'The Long Valley',
  'Past the Far-Country Inns',
  'Dusty Roads',
  'The Last Mile',
];

function makeConfig(n) {
  const walkLen = Math.min(1500 + (n - 1) * 550, 4800);
  const runLen = Math.min(1200 + (n - 1) * 400, 3400);
  const walkStart = 460;
  const walkEnd = walkStart + walkLen;
  const homeX = walkEnd + runLen + 120;                 // where the father starts running
  const obstacles = n === 1 ? 3 : Math.min(3 + (n - 1) * 2, Math.floor((runLen - 500) / 240));
  return {
    name: LEVEL_NAMES[n - 1] || `Homecoming ${n}`,
    walkStart, walkEnd, homeX, runLen,
    distractions: Math.min(n, 6),
    shakes: Math.min(3 + Math.floor((n - 1) / 2), 6),   // head-shakes needed to say no
    minGap: Math.min(0.26 + (n - 1) * 0.02, 0.36),     // tapping faster than this = stumble
    sitAfter: Math.max(2.6 - (n - 1) * 0.2, 1.6),      // standing still this long = sits down
    idleDrain: 5 + (n - 1) * 1.2,                      // hope per second while standing
    sitDrain: 10 + (n - 1) * 2,                        // ...and while sitting
    lureDrain: 4 + (n - 1) * 1.2,                      // ...and while being tempted
    runDrain: 3 + (n - 1) * 0.9,                       // ...while waiting for the father
    obstacles,
    runPar: runLen / 250 + obstacles * 0.3,
    feeds: 6,                                          // husks to toss before he comes to himself
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('prodigalBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let scene = 'frame';      // frame | pigs | walk | see | run | hug | feast
let sceneT = 0;
let seenIntro = false;    // retrying a level skips the story's opening scenes
const cam = { x: 0 };
let son, father, brother;
let pigs = [], husks = [], distractions = [], obstacles = [], deco = [], guests = [];
let particles = [], ripples = [];
let bubbles = {};         // speech bubbles by speaker
let banner = null;        // narration strip at the top
let hint = null;          // instruction at the bottom
let message = { text: '', t: 0 };
let hope = 100;
let lure = null;          // the distraction tempting him right now
let stats;
let feast;
let drag = null;
let fade = null;
let pigPhase = 'feed', bulbT = 0, feedCount = 0, saidArise = false;
let hugMid = 0;
let shakeT = 0, flashT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let musicT = 0, musicI = 0;

// The people of the story
const SON_LOOK = { robe: '#8a6a44', skin: '#dcaa78', hair: '#5a3a1c', beard: false, messy: true, rag: true, i: 1 };
const FATHER_LOOK = { robe: '#2f5fa8', trim: '#f2c94c', skin: '#d9a070', hair: '#ece8de', brow: '#a39c90', beard: true, longBeard: true, sandals: true, i: 0 };
const BROTHER_LOOK = { robe: '#4f7f3a', skin: '#d8a272', hair: '#3a2616', beard: true, sandals: true, i: 2 };

function person(look, extra) {
  return {
    ...look, x: 0, y: 0, s: CH, mood: 'watch', pose: 'stand', facing: 1,
    walkT: 0, blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU), shake: 0, ...extra,
  };
}

function newSon() {
  return person(SON_LOOK, {
    x: 440, facing: -1, mood: 'longing', stride: 0, idle: 0, sitting: false, stumble: 0,
    lastTap: -9, streak: 0, bulb: 0, toss: 0, fine: false, ring: false, shoes: false,
  });
}
function newFather() {
  return person(FATHER_LOOK, { x: cfg.homeX, facing: -1, v: 0, hop: 0, hopV: 0, stun: 0 });
}
function newBrother() { return person(BROTHER_LOOK, { mood: 'sulk', pose: 'fold', facing: -1 }); }

// Jesus's listeners: tax collectors near Him, Pharisees standing apart
const LISTENERS = [
  { robe: '#b5503f', hair: '#2e1d10', beard: true, skin: '#d7a070', tax: true },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', tax: true },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true, skin: '#c58a55', tax: true, scarf: '#e8dcc0' },
  { robe: '#3d5a8a', hair: '#8a8a8a', beard: true, skin: '#d9a066', tax: false, scarf: '#f4f1e8', tall: true },
  { robe: '#2f4f6f', hair: '#2a1a0e', beard: true, skin: '#c88e5a', tax: false, scarf: '#f4f1e8', tall: true },
  { robe: '#44607f', hair: '#1c120b', beard: true, skin: '#c78f5c', tax: false, scarf: '#f4f1e8', tall: true },
].map((d, i) => person(d, { i, mood: d.tax ? 'wow' : 'doubt', pose: d.tax ? 'stand' : 'fold', delay: rand(0.05, 0.5), switchT: 0 }));

// Friends and servants at the feast
const GUEST_LOOKS = [
  { robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
  { robe: '#3c8f86', hair: '#1f140c', beard: true, skin: '#b87a48', scarf: '#e8dcc0' },
  { robe: '#d9a13a', hair: '#2a1a0e', beard: false, skin: '#e3b184' },
  { robe: '#7a4fa0', hair: '#3a2515', beard: true, skin: '#d39a66' },
  { robe: '#a0673a', hair: '#6b3f1d', beard: true, skin: '#c98d56', lyre: true },   // the musician
];

// ============================================================
//  World (the road from the far country home)
// ============================================================
function groundY(wx) {
  return H - 150 + 34 * Math.sin(wx / 380) + 14 * Math.sin(wx / 150 + 1.3);
}

// 0 in the dusty far country, 1 in the green fields of home
function countryF(wx) {
  return clamp((wx - cfg.walkStart - 300) / Math.max(1, cfg.homeX - cfg.walkStart - 600), 0, 1);
}

const TENT_LINES = ["Come back! The party's just getting started!", 'Hey friend! Stay for one more song?', 'Why go home? The fun is here!'];
const DICE_LINES = ['One more throw of the dice?', 'Feeling lucky? Sit down and play!', 'Just one game, friend!'];
const NO_LINES = ["No thanks. I'm going home!", "Not again. I'm going home!", "No! Home is this way!"];

function makeDistractions() {
  const list = [];
  const n = cfg.distractions;
  const a = cfg.walkStart + 520, b = cfg.walkEnd - 260;
  for (let i = 0; i < n; i++) {
    const x = n === 1 ? (a + b) / 2 : lerp(a, b, i / (n - 1));
    const kind = i % 2 === 0 ? 'tent' : 'dice';
    const folk = kind === 'tent'
      ? [person({ robe: '#e0527a', hair: '#2a1a0e', beard: false, skin: '#dca678', scarf: '#ffd84a' }, { i: 3, pose: 'beckon', mood: 'joy', facing: -1, dx: -64, s: CH * 0.9 })]
      : [person({ robe: '#6b8e3a', hair: '#1c120b', beard: true, skin: '#c58a55' }, { i: 4, pose: 'beckon', mood: 'joy', facing: -1, dx: -58, s: CH * 0.9 }),
         person({ robe: '#b08a2e', hair: '#4a2f1a', beard: true, skin: '#d7a070' }, { i: 5, pose: 'sit', mood: 'watch', facing: -1, dx: 50, s: CH * 0.9 })];
    list.push({ x, kind, done: false, left: cfg.shakes, phase: rand(0, TAU), folk, line: (kind === 'tent' ? TENT_LINES : DICE_LINES)[Math.floor(i / 2) % 3] });
  }
  return list;
}

function makeObstacles() {
  const list = [];
  const n = cfg.obstacles;
  const a = cfg.homeX - 260, b = cfg.walkEnd + 330;
  const kinds = ['fence', 'goat', 'stream'];
  for (let i = 0; i < n; i++) {
    const kind = i < 3 ? kinds[i] : kinds[Math.floor(Math.random() * 3)];
    const x = n === 1 ? (a + b) / 2 : lerp(a, b, i / (n - 1));
    list.push({ x, kind, w: { fence: 34, goat: 54, stream: 100 }[kind], cleared: false, bumped: false, phase: rand(0, TAU), bleat: 0 });
  }
  return list;
}

function makeDeco() {
  const list = [];
  for (let x = -500; x < cfg.homeX + 1100; x += rand(170, 330)) {
    if (x > 60 && x < 560) continue;   // keep the pig pen clear
    list.push({ x, kind: Math.random() < 0.55 ? 'tree' : Math.random() < 0.6 ? 'bush' : 'rock', s: rand(0.7, 1.1), up: rand(18, 40) });
  }
  return list;
}

function makePigs() {
  return [
    { x: 200, f: 1, munch: 0, phase: rand(0, TAU) },
    { x: 262, f: 1, munch: 0, phase: rand(0, TAU), back: true },
    { x: 360, f: -1, munch: 0, phase: rand(0, TAU) },
  ];
}
const TROUGH_X = 285;

function makeGuests() {
  return GUEST_LOOKS.map((g, i) => person(g, { i: i + 6, mood: 'wow', s: 1, dim: true }));
}

function resetLevelState() {
  cfg = makeConfig(level);
  son = newSon();
  father = newFather();
  brother = newBrother();
  pigs = makePigs();
  husks = [];
  distractions = makeDistractions();
  obstacles = makeObstacles();
  deco = makeDeco();
  guests = makeGuests();
  particles = []; ripples = [];
  bubbles = {}; banner = null; hint = null;
  message = { text: '', t: 0 };
  hope = 100;
  lure = null;
  stats = { steady: 0, resisted: 0, runTime: 0, hops: 0, items: 0, hopeAtMeet: 0 };
  feast = {
    step: 'dress', stepT: 0, lamps: 0, food: false, music: false, hugs: 0, hugFx: 0, bro: 0, fwalk: 0,
    items: ['robe', 'ring', 'shoes'].map((kind, k) => ({ kind, k, placed: false, x: 0, y: 0, fly: null, back: null })),
  };
  drag = null; fade = null;
  pigPhase = 'feed'; bulbT = 0; feedCount = 0; saidArise = false;
  shakeT = flashT = 0;
  endTimer = 0;
  musicT = 0; musicI = 0;
}

// ============================================================
//  Speech, banners, hints
// ============================================================
function say(who, text, dur = 3) { bubbles[who] = { text, t: dur }; }
function setBanner(key, dur = 3.5) {
  const v = Bible.verse(VERSES[key]);
  banner = { text: v.text, cite: v.cite, t: dur, age: 0 };
}
function setBannerText(text, dur = 3.5) { banner = { text, cite: '', t: dur, age: 0 }; }
function showHint(text, dur = 3) { hint = { text, t: dur }; }
function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Scenes
// ============================================================
function fadeTo(next) { if (!fade) fade = { t: 0, next, done: false }; }

function setScene(name) {
  scene = name;
  sceneT = 0;
  particles = [];
  bubbles = {};
  hint = null;
  if (name === 'frame') {
    say('jesus', verseText('twoSons'), level === 1 ? 4.4 : 3.2);
    setBannerText('Jesus tells a story to the tax collectors and Pharisees', level === 1 ? 4.4 : 3.2);
  } else if (name === 'pigs') {
    son.x = 440; son.facing = -1; son.mood = 'longing';
    cam.x = 300 - W / 2;
    setBannerText('The younger son spent everything in a far country…', 3);
    showHint(isTouch() ? 'Tap to feed the pigs' : 'Tap / press Space to feed the pigs', 4);
  } else if (name === 'walk') {
    seenIntro = true;
    son.x = cfg.walkStart - 20; son.facing = 1; son.bulb = 0; son.mood = 'watch';
    son.lastTap = t - 1; son.stride = 0; son.idle = 0; son.sitting = false; son.stumble = 0;
    cam.x = son.x - W * 0.35;
    if (!saidArise) say('son', verseText('arise'), 3.2);
    showHint(isTouch() ? 'Tap… tap… tap… a steady walk home' : 'Space… Space… a steady walk home', 4);
  } else if (name === 'see') {
    son.stride = 0; son.pose = 'trudge';
    father.x = cfg.homeX; father.facing = -1; father.mood = 'watch'; father.pose = 'shade';
    hope = Math.min(100, hope + 25);
    setBanner('ran', 4.2);
    sfx.ding();
  } else if (name === 'run') {
    father.pose = 'run'; father.mood = 'joy'; father.v = 0;
    showHint(isTouch() ? 'You are the father! Tap fast to run!' : 'You are the father! Tap Space fast to run! ↑ to hop', 3.5);
  } else if (name === 'hug') {
    hugMid = (father.x + son.x) / 2;
    stats.hopeAtMeet = hope;
    setBanner('embrace', 3.8);
    sfx.levelStart();
  } else if (name === 'feast') {
    son.fine = son.ring = son.shoes = false;
    son.mood = 'worried'; son.lx = son.ly = undefined;
    son.sitting = false; son.stumble = 0;
    say('father', verseText('bestRobe'), 6);
    showHint(isTouch() ? 'Drag the robe, ring and shoes onto your son' : 'Drag the robe, ring and shoes onto him (or press Space)', 6);
  }
}

// ---------- Part 1: the far country ----------
function feedPig() {
  if (pigPhase !== 'feed' || feedCount + husks.length >= cfg.feeds + 2) return;
  const pg = pigs[Math.floor(Math.random() * pigs.length)];
  son.toss = 1;
  husks.push({ x0: son.x - 22, y0: groundY(son.x) - 62, x1: TROUGH_X + (pg.x - TROUGH_X) * 0.5, y1: groundY(TROUGH_X) - 22, t: 0, dur: 0.45, pig: pg, spin: rand(-8, 8) });
  sfx.puff(0.12);
  if (feedCount === 0) setBanner('husks', 4.5);
}

function updatePigs(dt) {
  cam.x += ((300 - W / 2) - cam.x) * Math.min(1, dt * 4);
  son.toss = Math.max(0, son.toss - dt * 3);
  son.pose = 'feed';
  for (const pg of pigs) pg.munch = Math.max(0, pg.munch - dt);
  for (let i = husks.length - 1; i >= 0; i--) {
    const h = husks[i];
    h.t += dt;
    if (h.t >= h.dur) {
      husks.splice(i, 1);
      h.pig.munch = 1.4;
      feedCount++;
      sfx.oink();
      for (let k = 0; k < 5; k++) spawn(h.x1 + rand(-10, 10), h.y1, rand(-40, 40), rand(-90, -30), 0.6, '#c9a15a', rand(2, 3.5), 200);
      hearts(h.pig.x, groundY(h.pig.x) - 60, 2);
      if (feedCount === 3) showMessage('Grumble… grumble… goes his tummy', 2);
    }
  }
  if (pigPhase === 'feed') {
    son.mood = 'longing'; son.facing = -1;
    son.lx = -0.8; son.ly = 0.5;
    if (feedCount >= cfg.feeds && husks.length === 0) {
      pigPhase = 'bulb'; bulbT = 0;
      sfx.ding(); flashT = 0.25;
      setBanner('cameTo', 4);
      son.lx = undefined; son.ly = undefined;
    }
  } else {
    bulbT += dt;
    son.bulb = Math.min(1, bulbT * 3);
    son.mood = bulbT < 1.3 ? 'wow' : 'watch';
    son.pose = 'stand';
    if (bulbT > 1.3 && !saidArise) { saidArise = true; son.facing = 1; say('son', verseText('arise'), 4); }
    if (bulbT > 2.6 && !hint) showHint(isTouch() ? 'Tap to set off for home!' : 'Press Space to set off for home!', 4);
    if (bulbT > 6.5) fadeTo('walk');
  }
}

// ---------- Part 2: the long walk home ----------
function walkTap() {
  const s = son;
  if (lure) { shakeHead(); return; }
  if (s.stumble > 0) return;
  if (s.sitting) {
    s.sitting = false; s.idle = 0; s.lastTap = t;
    sfx.step(0.2);
    showMessage('Up you get!', 1.2);
    return;
  }
  const gap = t - s.lastTap;
  s.lastTap = t;
  if (gap < cfg.minGap) { stumble(); return; }
  if (gap <= STRIDE + 0.35) { stats.steady++; s.streak++; hope = Math.min(100, hope + 1.5); }
  else s.streak = 1;
  s.stride = STRIDE;
  s.idle = 0;
  sfx.step(clamp((s.x - cfg.walkStart) / (cfg.walkEnd - cfg.walkStart), 0, 1));
}

function stumble() {
  const s = son;
  s.stumble = STUMBLE_T; s.stride = 0; s.streak = 0;
  hope = Math.max(0, hope - 6);
  shakeT = 0.2;
  showMessage('Too fast! Steady now…', 1.6);
  sfx.bounce();
  for (let k = 0; k < 8; k++) spawn(s.x + rand(10, 40), groundY(s.x) - 4, rand(-30, 60), rand(-80, -20), 0.6, '#d9c08a', rand(3, 6), 160);
}

function shakeHead() {
  const s = son, d = lure;
  s.shake = 0.35;
  d.left--;
  sfx.no();
  if (d.left <= 0) {
    d.done = true;
    lure = null;
    stats.resisted++;
    hope = Math.min(100, hope + 5);
    say('son', NO_LINES[stats.resisted % NO_LINES.length], 2.2);
    delete bubbles.lure;
    for (const f of d.folk) { f.mood = 'watch'; f.pose = f.pose === 'beckon' ? 'stand' : f.pose; }
    showMessage('Temptation resisted!', 1.6);
    s.lastTap = t - 1;
  }
}

function updateWalk(dt) {
  const s = son;
  const target = s.x - W * 0.35;
  cam.x += (target - cam.x) * Math.min(1, dt * 5);
  s.facing = 1;
  s.shake = Math.max(0, s.shake - dt);

  // A distraction just ahead tries to lure him back
  if (!lure && s.stumble <= 0) {
    for (const d of distractions) {
      if (!d.done && s.x >= d.x - 150 && s.x < d.x) {
        lure = d; s.stride = 0; s.sitting = false;
        say('lure', d.line, 99);
        showHint(isTouch() ? 'Tap to shake your head: No!' : 'Press Space to shake your head: No!', 99);
        break;
      }
    }
  }

  if (s.stumble > 0) {
    s.stumble -= dt;
    s.pose = 'stumble'; s.mood = 'shock';
  } else if (lure) {
    s.pose = 'stand';
    s.mood = lure.left > cfg.shakes / 2 ? 'longing' : 'doubt';
    hope -= cfg.lureDrain * dt;
  } else if (s.stride > 0) {
    s.stride -= dt;
    const ramp = clamp(s.stride / 0.2, 0, 1);
    s.x += WALK_V * dt * ramp;
    s.walkT += dt * 9 * ramp;
    s.pose = 'trudge';
    s.mood = hope > 45 ? 'watch' : 'worried';
    if (hint && hint.t > 50) hint = null;
  } else {
    s.idle += dt;
    if (!s.sitting && s.idle > cfg.sitAfter) {
      s.sitting = true;
      showHint(isTouch() ? 'He sat down, discouraged… tap to help him up!' : 'He sat down, discouraged… press Space!', 3);
    }
    if (s.sitting) { hope -= cfg.sitDrain * dt; s.pose = 'sit'; s.mood = 'sad'; }
    else {
      s.pose = 'stand'; s.mood = 'worried';
      if (s.idle > 0.5) hope -= cfg.idleDrain * dt;
      if (s.idle > 1 && (!hint || hint.t <= 0)) showHint('Keep walking!', 1.5);
    }
  }
  if (!lure && hint && hint.t > 50) hint = null;
  s.y = groundY(s.x);
  if (hope <= 0) { hope = 0; fail('walk'); return; }
  if (s.x >= cfg.walkEnd) setScene('see');
}

// ---------- Part 3: the father runs ----------
function nextObstacle() {
  let best = null;
  for (const o of obstacles) {
    if (o.cleared) continue;
    const ahead = (father.x - 14) - (o.x + o.w / 2);
    if (ahead >= -o.w && (!best || ahead < best.ahead)) best = { o, ahead };
  }
  return best;
}

function runTap(hopOnly = false) {
  const f = father;
  if (f.stun > 0) return;
  const nx = nextObstacle();
  if (f.hop <= 0 && nx && nx.ahead <= HOP_WIN) {
    // Hop over it: always clears once you hop inside the window
    const travel = Math.max(0, nx.ahead) + nx.o.w + 44;
    f.hop = HOP_T; f.hopV = travel / HOP_T;
    nx.o.cleared = true;
    if (!nx.o.bumped) { stats.hops++; showMessage(['Hop!', 'Over the goat!', 'Splash-free!'][['fence', 'goat', 'stream'].indexOf(nx.o.kind)], 1); }
    if (nx.o.kind === 'goat') { nx.o.bleat = 0.6; sfx.bleat(); }
    sfx.hop();
    return;
  }
  if (hopOnly) return;
  f.v = Math.min(RUN_MAX, f.v + RUN_KICK);
  sfx.patter();
  if (Math.random() < 0.5) spawn(f.x + 12, groundY(f.x) - 3, rand(20, 60), rand(-50, -10), 0.5, '#e2cf9c', rand(3, 5), 100);
}

function updateSee(dt) {
  const from = son.x - W * 0.35, to = cfg.homeX - W * 0.62;
  cam.x = lerp(from, to, ease(clamp(sceneT / 1.8, 0, 1)));
  son.x += SON_SLOW * dt; son.y = groundY(son.x); son.walkT += dt * 3; son.pose = 'trudge'; son.mood = 'worried';
  father.y = groundY(father.x);
  if (sceneT > 1.2) { father.pose = 'open'; father.mood = 'wow'; }
  if (sceneT > 2.6) setScene('run');
}

function updateRun(dt) {
  const f = father, s = son;
  stats.runTime += dt;
  f.v *= Math.exp(-RUN_DRAG * dt);
  if (f.stun > 0) { f.stun -= dt; f.v = 0; f.pose = 'stand'; f.mood = 'shock'; }
  if (f.hop > 0) {
    f.hop -= dt;
    f.x -= f.hopV * dt;
    f.pose = 'hop';
    f.lift = Math.sin(Math.PI * (1 - Math.max(0, f.hop) / HOP_T)) * 46;
    if (f.hop <= 0) { f.lift = 0; f.v = Math.max(f.v, 120); }
  } else if (f.stun <= 0) {
    f.x -= f.v * dt;
    f.walkT += dt * (4 + f.v / 22);
    f.pose = f.v > 20 ? 'run' : 'stand';
    f.mood = 'joy';
    // Running into an obstacle without hopping
    for (const o of obstacles) {
      if (o.cleared) continue;
      const ahead = (f.x - 14) - (o.x + o.w / 2);
      if (ahead < 0 && f.x > o.x - o.w / 2) {
        f.x = o.x + o.w / 2 + 15; f.v = 0; f.stun = 0.6; o.bumped = true;
        shakeT = 0.2;
        showMessage(o.kind === 'goat' ? 'Meh-eh-eh! Hop over the goat!' : o.kind === 'stream' ? 'Whoa! Hop over the stream!' : 'Oof! Hop over the fence!', 1.6);
        if (o.kind === 'goat') { o.bleat = 0.8; sfx.bleat(); } else sfx.bounce();
        break;
      }
    }
  }
  f.y = groundY(f.x);

  // The son waits a great way off, losing heart
  hope -= cfg.runDrain * dt;
  const near = f.x - s.x < W * 0.7;
  if (hope > 25) { s.x += SON_SLOW * dt; s.walkT += dt * 3; s.pose = near ? 'stand' : 'trudge'; s.mood = near ? 'wow' : 'worried'; }
  else { s.pose = near ? 'stand' : 'sit'; s.mood = near ? 'wow' : 'sad'; }
  s.y = groundY(s.x);

  const target = f.x - W * 0.62;
  cam.x += (target - cam.x) * Math.min(1, dt * 6);
  for (const o of obstacles) o.bleat = Math.max(0, o.bleat - dt);

  if (hope <= 0) { hope = 0; fail('run'); return; }
  if (f.x - s.x < MEET_D) setScene('hug');
}

function updateHug(dt) {
  const f = father, s = son;
  f.lift = 0;
  f.x = lerp(f.x, hugMid + 13, Math.min(1, dt * 6));
  s.x = lerp(s.x, hugMid - 13, Math.min(1, dt * 6));
  f.y = groundY(f.x); s.y = groundY(s.x);
  f.pose = 'hug'; s.pose = 'hug'; f.facing = -1; s.facing = 1;
  f.mood = 'joy'; s.mood = 'joy';
  cam.x += ((hugMid - W / 2) - cam.x) * Math.min(1, dt * 3);
  if (Math.random() < dt * 9) {
    const who = Math.random() < 0.5 ? f : s;
    spawn(who.x + rand(-9, 9), who.y - 50 * CH, rand(-15, 15), rand(-10, 20), 0.9, '#7cc4f2', 3, 260, 'tear');
  }
  if (Math.random() < dt * 5) spawn(hugMid + rand(-30, 30), s.y - 90 * CH, rand(-20, 20), rand(-60, -30), 1.6, '#ff6b8a', rand(5, 8), 0, 'heart');
  if (sceneT > 3.9) fadeTo('feast');
}

// ---------- Part 4: the celebration ----------
function feastLayout() {
  const narrow = W < 700;
  const gy = H - 150;
  const ps = narrow ? 1.6 : 2.0;
  const sonX = W * 0.5 + (narrow ? 14 : 0);
  return {
    gy, ps, narrow, sonX,
    fatherX0: sonX - (narrow ? 84 : 118),
    panelX: narrow ? 58 : Math.max(96, W * 0.15),
    itemY: narrow ? [gy - 432, gy - 352, gy - 272] : [gy - 400, gy - 300, gy - 200],
    lamps: (narrow ? [0.3, 0.52, 0.74] : [0.22, 0.5, 0.78]).map((f) => W * f), lampY: 300,
    brotherX: W - (narrow ? 62 : 120),
    tableY: gy + 58,
    guestX: [0.32, 0.42, 0.6, 0.7, narrow ? 0.12 : 0.16].map((f) => W * f),
    gs: narrow ? 1.15 : 1.55,
  };
}

function itemHome(it, L) { return { x: L.panelX, y: L.itemY[it.k] }; }
function sonTarget(L) { return { x: L.sonX, y: L.gy - 55 * L.ps }; }

function placeItem(it) {
  it.placed = true; it.fly = null; it.back = null;
  if (it.kind === 'robe') son.fine = true;
  if (it.kind === 'ring') son.ring = true;
  if (it.kind === 'shoes') son.shoes = true;
  stats.items++;
  const L = feastLayout(), tg = sonTarget(L);
  for (let i = 0; i < 24; i++) {
    const a = rand(0, TAU), sp = rand(40, 160);
    spawn(tg.x, tg.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.2), ['#ffe27a', '#fff6d0', '#ffd1e8'][i % 3], rand(2, 4), 40);
  }
  showMessage({ robe: 'The best robe!', ring: 'A ring for his hand!', shoes: 'Shoes for his feet!' }[it.kind], 1.4);
  sfx.chime(0.4 + stats.items * 0.1);
  cheerGuests();
  if (feast.items.every((x) => x.placed)) { feast.step = 'lampsWait'; feast.stepT = 0; hint = null; }
}

function flyItem(it) {
  if (it.placed || it.fly) return;
  it.fly = { t: 0, x0: it.x, y0: it.y };
}

function cheerGuests() {
  const n = stats.items + feast.lamps;
  guests.forEach((g, i) => { if (i < n) g.mood = 'joy'; });
  son.mood = son.fine && son.ring && son.shoes ? 'joy' : son.fine ? 'wow' : 'worried';
}

function feastTap(x, y) {
  const st = feast.step;
  if (st === 'dress') {
    // Tapping an item sends it flying onto him; tapping elsewhere just reminds you
    const next = feast.items.find((it) => !it.placed && !it.fly);
    if (x === null && next) { flyItem(next); return; }
    showHint('Drag the robe, ring and shoes onto your son', 2.5);
  } else if (st === 'lamps') {
    feast.lamps++;
    sfx.chime(0.3 + feast.lamps * 0.15);
    const L = feastLayout();
    const lx = L.lamps[feast.lamps - 1];
    for (let i = 0; i < 14; i++) spawn(lx, L.lampY + 20, rand(-50, 50), rand(-70, 10), 0.8, '#ffd76a', rand(2, 4), 60);
    cheerGuests();
    if (feast.lamps >= 3) { stats.items++; feast.step = 'foodWait'; feast.stepT = 0; hint = null; }
  } else if (st === 'food') {
    feast.food = true; stats.items++;
    sfx.chime(0.7);
    say('father', verseText('merry'), 3.4);
    guests.forEach((g) => (g.mood = 'joy'));
    const L = feastLayout();
    for (let i = 0; i < 20; i++) spawn(rand(W * 0.2, W * 0.8), L.tableY - 10, rand(-30, 30), rand(-90, -30), 0.9, '#fff6d0', rand(2, 4), 80);
    feast.step = 'musicWait'; feast.stepT = 0; hint = null;
  } else if (st === 'music') {
    feast.music = true; stats.items++;
    showMessage('Let the music play!', 1.8);
    feast.step = 'dance'; feast.stepT = 0; hint = null;
  } else if (st === 'hug') {
    feast.hugs++;
    feast.hugFx = 0.6;
    hearts(brother.x - 20, brother.y - 100, 4);
    sfx.chime(0.5 + feast.hugs * 0.15);
    brother.mood = feast.hugs >= HUG_TAPS ? 'smallsmile' : feast.hugs === HUG_TAPS - 1 ? 'doubt' : 'sulk';
    if (feast.hugs >= HUG_TAPS) {
      brother.pose = 'stand';
      showMessage('A small smile!', 1.6);
      feast.step = 'smile'; feast.stepT = 0; hint = null;
    }
  }
}

function updateFeast(dt) {
  const L = feastLayout();
  feast.stepT += dt;
  feast.hugFx = Math.max(0, feast.hugFx - dt);

  // Items: dragged, flying to him, drifting back, or waiting in their slots
  for (const it of feast.items) {
    const home = itemHome(it, L), tg = sonTarget(L);
    if (it.placed) continue;
    if (drag && drag.item === it) continue;
    if (it.fly) {
      it.fly.t += dt / 0.45;
      const f = ease(Math.min(1, it.fly.t));
      it.x = lerp(it.fly.x0, tg.x, f); it.y = lerp(it.fly.y0, tg.y, f) - Math.sin(f * Math.PI) * 60;
      if (it.fly.t >= 1) placeItem(it);
    } else if (it.back) {
      it.back.t += dt / 0.3;
      const f = ease(Math.min(1, it.back.t));
      it.x = lerp(it.back.x0, home.x, f); it.y = lerp(it.back.y0, home.y, f);
      if (it.back.t >= 1) it.back = null;
    } else { it.x = home.x; it.y = home.y + Math.sin(t * 2 + it.k) * 3; }
  }

  // People
  son.x = L.sonX; son.y = L.gy; son.s = L.ps; son.facing = -1;
  const fx0 = L.fatherX0, fx1 = L.brotherX - 36 * L.ps;
  father.x = lerp(fx0, fx1, ease(feast.fwalk)); father.y = L.gy; father.s = L.ps; father.lift = 0;
  guests.forEach((g, i) => { g.x = L.guestX[i]; g.y = L.gy - 70; g.s = L.gs; g.facing = g.x < L.sonX ? 1 : -1; });
  const dancing = feast.music;
  son.pose = dancing ? 'dance' : 'stand';
  guests.forEach((g) => { g.pose = dancing ? (g.lyre ? 'play' : 'dance') : 'stand'; });

  // Steps
  const st = feast.step;
  if (st === 'dress') {
    father.pose = 'open'; father.mood = 'joy'; father.facing = 1;
  } else if (st === 'lampsWait') {
    if (feast.stepT > 0.8) { feast.step = 'lamps'; feast.stepT = 0; showHint(isTouch() ? 'Tap to light the lamps' : 'Tap / Space to light the lamps', 99); }
  } else if (st === 'foodWait') {
    if (feast.stepT > 0.7) { feast.step = 'food'; feast.stepT = 0; showHint(isTouch() ? 'Tap to lay the feast' : 'Tap / Space to lay the feast', 99); }
  } else if (st === 'musicWait') {
    if (feast.stepT > 2.2) { feast.step = 'music'; feast.stepT = 0; showHint(isTouch() ? 'Tap to start the music and dancing!' : 'Tap / Space to start the music and dancing!', 99); }
  } else if (st === 'dance') {
    father.pose = 'dance';
    if (feast.stepT > 3.2) { feast.step = 'brother'; feast.stepT = 0; setBanner('music', 3.2); }
  } else if (st === 'brother') {
    feast.bro = Math.min(1, feast.bro + dt / 1.6);
    if (feast.stepT > 3.2 && feast.stepT - dt <= 3.2) setBanner('angry', 4);
    if (feast.stepT > 4.4) {
      feast.fwalk = Math.min(1, feast.fwalk + dt / 1.4);
      father.pose = feast.fwalk < 1 ? 'walk' : 'open'; father.walkT += dt * 8; father.facing = 1; father.mood = 'watch';
    } else { father.pose = 'dance'; }
    if (feast.fwalk >= 1) {
      feast.step = 'hug'; feast.stepT = 0;
      say('father', verseText('ever'), 5);
      showHint(isTouch() ? 'Tap to give him a hug too!' : 'Tap / Space to give him a hug too!', 99);
    }
  } else if (st === 'hug' || st === 'smile') {
    father.pose = feast.hugFx > 0 || st === 'smile' ? 'hug' : 'open';
    father.facing = 1; father.mood = 'joy';
    if (st === 'smile' && feast.stepT > 1.6 && state === 'play') win();
  }
  if (feast.fwalk >= 1 && (st === 'hug' || st === 'smile')) father.x = lerp(fx1, L.brotherX - 26 * L.ps, feast.hugFx > 0 || st === 'smile' ? 1 : 0);

  // The older brother, sulking outside with folded arms
  brother.x = lerp(W + 60, L.brotherX, ease(feast.bro)); brother.y = L.gy; brother.s = L.ps;
  brother.facing = -1;
  brother.pose = st === 'smile' || state === 'win' ? 'hug' : 'fold';
  brother.walkT += dt * 8;
  if (feast.bro > 0 && feast.bro < 1) brother.pose = 'walk';

  // Music for the dancing
  if (feast.music) {
    musicT -= dt;
    if (musicT <= 0) { musicT = 0.21; sfx.dance(musicI++); }
    if (Math.random() < dt * 3) spawn(rand(W * 0.1, W * 0.9), L.gy - rand(160, 260), rand(-20, 20), -40, 1.6, ['#e0527a', '#4dabf7', '#f2a93b'][Math.floor(rand(0, 3))], 9, 0, 'note');
  }
}

function brotherVisible() { return feast && feast.bro > 0; }

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  const walk = stats.steady * 10;
  const resist = stats.resisted * 150;
  const run = Math.max(0, Math.round((cfg.runPar - stats.runTime) * 80)) + stats.hops * 50;
  const celebrate = stats.items * 150;
  const hopeBonus = Math.round(stats.hopeAtMeet) * 3;
  const levelBonus = level * 500;
  const score = walk + resist + run + celebrate + hopeBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('prodigalBest', best); } catch (e) {} }
  lastScore = { walk, resist, run, celebrate, hopeBonus, levelBonus, score };
  brother.mood = 'joy';
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(W / 2, H * 0.45, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8), ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 2.2;
}

function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  lure = null;
  son.pose = 'sit'; son.mood = 'dismay'; son.stride = 0;
  delete bubbles.lure;
  hint = null;
  if (father) { father.pose = 'stand'; father.mood = 'worried'; father.lift = 0; father.hop = 0; }
  sfx.fail();
  endTimer = 1.6;
}

// ============================================================
//  Particles
// ============================================================
// Particles live in the current scene's coordinates (world x on the road).
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}

function hearts(x, y, n) {
  for (let i = 0; i < n; i++) spawn(x + rand(-16, 16), y + rand(-8, 8), rand(-25, 25), rand(-70, -40), 1.2, '#ff6b8a', rand(5, 7), 0, 'heart');
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function heartPath(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.5);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
}

function drawParticles(ox) {
  for (const p of particles) {
    const a = p.life / p.max;
    const x = p.x - ox;
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.fillStyle = p.color;
    if (p.kind === 'heart') { heartPath(x, p.y, p.size); ctx.fill(); }
    else if (p.kind === 'tear') {
      ctx.beginPath(); ctx.moveTo(x, p.y - p.size * 2);
      ctx.quadraticCurveTo(x + p.size * 1.3, p.y + p.size * 0.6, x, p.y + p.size);
      ctx.quadraticCurveTo(x - p.size * 1.3, p.y + p.size * 0.6, x, p.y - p.size * 2);
      ctx.fill();
    } else if (p.kind === 'note') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(x, p.y, 5, 3.8, -0.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 4.5, p.y - 1); ctx.lineTo(x + 4.5, p.y - 18); ctx.lineTo(x + 11, p.y - 14); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Hallelujah!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('aliveAgain')}

       ${creditHTML()}`,
      'Next Level', () => { level++; seenIntro = false; startLevel(false); });
  } else if (state === 'fail') {
    const line = failReason === 'run'

      : 'He lost heart on the long road. Keep a steady rhythm and say no to the distractions.';
    showOverlay('Oh… no', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${line}</p>
       ${verseHTML('arise')}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    drag = null;
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', restartLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
// One tap = one action. x/y are playfield coordinates (null for the keyboard).
function handleTap(x, y) {
  if (state !== 'play' || fade) return;
  switch (scene) {
    case 'frame': if (sceneT > 0.5) fadeTo('pigs'); break;
    case 'pigs':
      if (pigPhase === 'feed') feedPig();
      else if (bulbT > 1.8) fadeTo('walk');
      break;
    case 'walk': walkTap(); break;
    case 'run': runTap(); break;
    case 'feast': feastTap(x, y); break;
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { restartLevel(); return; }
  if (e.repeat) return;   // holding a key does nothing: every step is a tap
  if (e.code === 'ArrowUp' && scene === 'run' && state === 'play') { runTap(true); return; }
  if (['Space', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'Enter', 'KeyD', 'KeyA'].includes(e.code)) handleTap(null, null);
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  // Pick up a celebration gift to drag onto the son
  if (scene === 'feast' && feast.step === 'dress' && !fade) {
    for (const it of feast.items) {
      if (it.placed || it.fly) continue;
      if (Math.hypot(p.x - it.x, p.y - it.y) < 48) {
        drag = { item: it, ox: it.x - p.x, oy: it.y - p.y, sx: p.x, sy: p.y, moved: false, id: e.pointerId };
        it.back = null;
        return;
      }
    }
  }
  handleTap(p.x, p.y);
});
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = toPlayfield(e);
  drag.item.x = p.x + drag.ox; drag.item.y = p.y + drag.oy;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 12) drag.moved = true;
});
window.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const it = drag.item;
  const moved = drag.moved;
  drag = null;
  if (state !== 'play' || scene !== 'feast') return;
  const tg = sonTarget(feastLayout());
  if (!moved) flyItem(it);                         // a simple tap sends it flying to him
  else if (Math.abs(it.x - tg.x) < 70 && Math.abs(it.y - tg.y) < 110) placeItem(it);
  else it.back = { t: 0, x0: it.x, y0: it.y };     // missed: it drifts back to its place
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);

  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
