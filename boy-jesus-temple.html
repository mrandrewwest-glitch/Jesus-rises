const canvas = document.getElementById('game');
const mainCtx = canvas.getContext('2d');

const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // the search scene fills the whole screen; W/offX/offY kept for parity
}
let resizeTimer = 0;
window.addEventListener('resize', () => {
  resize();
  if (scene) { clampZoom(); clampCam(); }
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (scene && Math.abs(wantRes() / scene.res - 1) > 0.2) prerender(); }, 250);
});
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// Small seeded random numbers so a scene's backdrop redraws identically after a resize
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let q = Math.imul(a ^ (a >>> 15), 1 | a);
    q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
    return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
  };
}

// Difficulty rises through the journey (d = 0..11) and again with each new round
function makeConfig(n) {
  const loc = (n - 1) % LOCS.length, cycle = Math.floor((n - 1) / LOCS.length);
  const L = LOCS[loc];
  const d = loc + cycle * 4;
  return {
    loc, cycle, d, L, name: L.name,
    crowd: Math.round(L.crowd * (1 + 0.15 * cycle)),
    animals: L.animals + cycle * 2,
    extras: L.extras,
    decoys: loc === 0 && cycle === 0 ? 0 : Math.min(14, Math.round(1 + d * 0.9)),
    // Level 1 is a look-alike cousin (Luke 2:43: Jesus had stayed in Jerusalem), so no halo.
    // After that the glow fades a little each place, and is gone from the upper city on.
    halo: loc === 0 ? 0 : clamp(0.95 - (d - 1) * 0.14, 0, 1),
    hints: d < 3 ? 3 : d < 7 ? 2 : 1,
    walkers: d < 2 ? 0 : Math.min(12, d),       // people strolling to and fro
    crossing: d >= 3,                           // one of them walks right in front of Him
    procession: d >= 5 ? Math.min(3 + Math.floor((d - 5) / 2), 7) : 0,   // a passing crowd hides Him now and then
    wrongCost: d < 4 ? 5 : d < 8 ? 6 : 8,
    spam: d < 4 ? 5 : 4,                        // this many taps within 2 seconds = "slow down!"
    timeFactor: Math.max(1.05, lerp(2.0, 1.15, clamp(d / 10, 0, 1)) * Math.pow(0.95, cycle)),
    minTime: Math.max(40, 90 - d * 4),
    time: 90,                                   // worked out from the scene when it is built
    hintR: 170 + d * 12,
    hintA: Math.max(0.25, 0.7 - d * 0.04),
    cousin: loc === 0,
    final: loc === LOCS.length - 1,
  };
}

}

function makePerson(x, y, kind) {
  const male = kind === 'man' || kind === 'elder' || (kind === 'child' && Math.random() < 0.5);
  const p = {
    type: 'person', kind, x, y, i: pid++, male,
    s: kind === 'child' ? rand(0.66, 0.74) : rand(0.93, 1.05),
    robe: pick(ROBES), skin: pick(SKINS),
    hair: kind === 'elder' ? pick(['#d8d8d8', '#bdbdbd', '#e8e8e8']) : pick(HAIRS),
    beard: (kind === 'man' && Math.random() < 0.8) || kind === 'elder',
    scarf: (kind === 'man' || kind === 'elder') && Math.random() < 0.45 ? pick(SCARVES) : null,
    veil: male ? null : pick(VEILS),
    name: pick(male ? NAMES_M : NAMES_F),
    lx: rand(-0.8, 0.8), ly: rand(-0.4, 0.4),
    blink: 0, blinkT: rand(1, 5), phase: rand(0, TAU),
    prop: null,
  };
  if (kind === 'woman' && Math.random() < 0.22) p.prop = 'basket';
  if ((kind === 'man' || kind === 'elder') && Math.random() < 0.18) p.prop = 'staff';
  return sizePerson(p);
}

// The boy Jesus, His look-alike cousin, and decoy boys all share one look
function makeBoy(x, y, role, sash, opts = {}) {
  const p = {
    type: 'person', kind: 'boy', role, x, y, i: pid++, male: true, s: 0.78,
    robe: opts.robe || WHITE, robeLine: WHITE_LINE, skin: opts.skin || '#e0a877',
    hair: opts.hair || '#5b3a1f', longHair: true, sash, beard: false,
    halo: role === 'jesus' ? cfg.halo : 0,
    name: opts.name || pick(NAMES_M),
    lx: rand(-0.6, 0.6), ly: rand(-0.3, 0.3),
    blink: 0, blinkT: rand(1, 5), phase: rand(0, TAU), sit: !!opts.sit,
    // the details that identify Him once the glow has faded
    knot: opts.knot !== undefined ? opts.knot : role !== 'decoy',
    scroll: opts.scroll !== undefined ? opts.scroll : role !== 'decoy',
    sunhat: !!opts.sunhat, brass: !!opts.brass,
  };
  if (p.robe !== WHITE) p.robeLine = shade(p.robe, -45);
  return sizePerson(p);
}

// Look-alike boys get trickier as the search goes on
const JESUS_HAIR = '#5b3a1f';
function decoyLook(d) {
  const colours = ['#3f6fb5', '#2f8f5b', '#e8a33a', '#7a4fa0', '#d9c23a', null];
  const easy = [() => ({ sash: pick(colours), knot: Math.random() < 0.5, scroll: Math.random() < 0.4 })];
  const tricky = [];
  if (d >= 3) {
    tricky.push(() => ({ sash: RED_SASH, knot: true, scroll: Math.random() < 0.5, hair: pick(['#1c120b', '#b5652b']) }));
    tricky.push(() => ({ sash: RED_SASH, knot: Math.random() < 0.5, scroll: true, robe: '#eadcb8' }));
  }
  if (d >= 5) {
    tricky.push(() => ({ sash: RED_SASH, knot: true, scroll: false }));
    tricky.push(() => ({ sash: pick([RED_SASH, '#3f6fb5']), knot: true, scroll: Math.random() < 0.5, sunhat: true }));
  }
  if (d >= 7) {
    tricky.push(() => ({ sash: RED_SASH, knot: false, scroll: true }));
    tricky.push(() => ({ sash: '#7a1f2e', knot: true, scroll: true }));
    tricky.push(() => ({ sash: RED_SASH, knot: true, scroll: false, brass: true }));
  }
  const pool = tricky.length && Math.random() < (d >= 5 ? 0.7 : 0.45) ? tricky : easy;
  const o = pick(pool)();
  o.hair = o.hair || (Math.random() < 0.7 ? JESUS_HAIR : pick(['#3a2716', '#1c120b']));
  // never an exact copy of Him: a decoy always differs in at least one detail
  const same = (!o.robe || o.robe === WHITE) && o.sash === RED_SASH && o.knot && o.scroll && o.hair === JESUS_HAIR;
  if (same) o.scroll = false;
  return o;
}

function makeTeacher(x, y, lookX) {
  const p = makePerson(x, y, 'elder');
  p.teacher = true; p.sit = true; p.name = pick(['Hillel', 'Gamaliel', 'Nicodemus', 'Shammai', 'Annas', 'Simeon', 'Jonathan', 'Joseph']);
  p.robe = pick(['#e9e4d6', '#d9e2ee', '#e7dcc2', '#cfd8c8']);
  p.shawl = true; p.cap = pick(['#3b5ea8', '#7a4fa0', '#f4f1e6']);
  p.scarf = null; p.prop = null;
  p.lx = Math.sign(lookX - x) * 0.85; p.ly = 0.25;
  return sizePerson(p);
}

const MARY = sizePerson({ type: 'person', kind: 'woman', name: 'Mary', i: 1, s: 1, robe: '#5b86c9', veil: '#2e5aa0', skin: '#dca678', hair: '#3a2716', blink: 0, blinkT: 2, phase: 0.3, lx: 0.8, ly: 0 });
const JOSEPH = sizePerson({ type: 'person', kind: 'man', name: 'Joseph', i: 2, s: 1.04, robe: '#8a5a34', skin: '#c98d56', hair: '#4a2f1a', beard: true, scarf: '#d8c7a0', prop: 'staff', blink: 0, blinkT: 3, phase: 1.1, lx: 0.8, ly: 0 });

// ============================================================
//  Drawing people (in the collection's disciple style)
// ============================================================
function drawPerson(p, o = {}) {
  let mood = o.mood || 'watch';
  const s = p.s * (o.pop || 1);
  const sit = !!p.sit;
  let jump = o.jump || 0;
  if (!o.still) {
    if (mood === 'joy') jump += Math.abs(Math.sin(t * 7 + p.phase)) * 8;
    if (mood === 'shock') jump += Math.max(0, Math.sin(t * 30)) * 1.5;
  }
  ctx.save();
  ctx.translate(p.x, p.y - jump * s);
  ctx.scale(s, s);
  if (sit) ctx.translate(0, 14);
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;

  const sleeve = shade(p.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    if (p.robeLine) {
      ctx.strokeStyle = p.robeLine; ctx.lineWidth = 8.5; ctx.stroke();
      ctx.strokeStyle = p.robe; ctx.lineWidth = 6; ctx.stroke();
    } else {
      ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.stroke();
    }
    ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const lx = o.lx !== undefined ? o.lx : p.lx || 0;
  const ly = o.ly !== undefined ? o.ly : p.ly || 0;
  const hy = -53 + (o.headBob || 0);
  const hd = o.hugDir || 0;

  // A soft golden glow and halo (only ever on the boy Jesus)
  const halo = o.halo !== undefined ? o.halo : p.halo || 0;
  if (halo > 0) {
    const g = ctx.createRadialGradient(0, hy - 6, 4, 0, hy - 6, 36);
    g.addColorStop(0, `rgba(255,236,150,${0.55 * halo})`);
    g.addColorStop(1, 'rgba(255,236,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, hy - 6, 36, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(245,197,66,${halo})`; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10 * halo;
    ctx.beginPath(); ctx.arc(0, hy - 8, 21, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Staff held beside the body
  if (p.prop === 'staff') {
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(24, sit ? -14 : 2); ctx.lineTo(25, -86);
    ctx.arc(19, -86, 6, 0, Math.PI, true); ctx.stroke();
  }

  // Arms raised behind the head for joy / pointing up in wonder
  if (mood === 'joy') {
    const wave = o.still ? 0 : Math.sin(t * 9 + p.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && p.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // A glinting brass pot or a straw sunhat behind the head can look like a halo!
  if (p.brass) {
    const g = ctx.createRadialGradient(-6, hy - 12, 3, 0, hy - 6, 24);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(0.35, '#e0b040'); g.addColorStop(1, '#9a6a18');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(4, hy - 6, 23, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a5e14'; ctx.fillRect(-12, hy - 31, 32, 5);
  }
  if (p.sunhat) {
    ctx.fillStyle = '#f0cf6a'; ctx.strokeStyle = '#c9a13a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, hy - 7, 25, 23, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,120,40,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, hy - 7, 19, 17, 0, 0, TAU); ctx.stroke();
  }
  // Long hair (boys) and veils (women) hang behind the head
  if (p.longHair) {
    ctx.fillStyle = p.hair;
    ctx.beginPath(); ctx.ellipse(0, hy + 1, 17.5, 19, 0, 0, TAU); ctx.fill();
    roundRect(-17.5, hy, 35, 19, 8); ctx.fill();
  }
  if (p.veil) {
    ctx.fillStyle = shade(p.veil, -22);
    ctx.beginPath();
    ctx.moveTo(-18, hy - 4); ctx.lineTo(-22, hy + 24);
    ctx.quadraticCurveTo(0, hy + 30, 22, hy + 24); ctx.lineTo(18, hy - 4);
    ctx.closePath(); ctx.fill();
  }

  // Robe
  const rb = sit ? -14 : 0;
  ctx.fillStyle = p.robe;
  ctx.strokeStyle = p.robeLine || shade(p.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, rb);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, rb);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (p.sash) {
    // diagonal sash, like the grown-up Jesus's red sash
    ctx.save(); ctx.clip();
    ctx.strokeStyle = p.sash; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-11, -39); ctx.lineTo(19, -6); ctx.stroke();
    ctx.restore();
    if (p.knot) {
      // a little knot at the hip with two tails
      ctx.fillStyle = shade(p.sash, -30);
      ctx.beginPath(); ctx.arc(12, -13, 3.6, 0, TAU); ctx.fill();
      ctx.strokeStyle = p.sash; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(9, -3); ctx.moveTo(13, -12); ctx.lineTo(16, -3); ctx.stroke();
    }
  } else if (!p.robeLine) {
    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }
  if (p.trim) {
    ctx.strokeStyle = '#e0b040'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-17.5, rb - 4); ctx.lineTo(17.5, rb - 4); ctx.stroke();
  }
  if (p.shawl) {
    ctx.fillStyle = '#f4f1e6';
    ctx.beginPath(); ctx.moveTo(-13, -38); ctx.lineTo(13, -38); ctx.lineTo(15, -18); ctx.lineTo(-15, -18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3b5ea8'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-15, -23); ctx.lineTo(15, -23); ctx.moveTo(-15, -20); ctx.lineTo(15, -20); ctx.stroke();
  }
  if (sit) {
    // lap and feet
    ctx.fillStyle = p.robe; ctx.strokeStyle = p.robeLine || shade(p.robe, -40);
    ctx.beginPath(); ctx.ellipse(0, -15, 21, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a5230';
    ctx.beginPath(); ctx.ellipse(-9, -8, 5, 3, 0, 0, TAU); ctx.ellipse(9, -8, 5, 3, 0, 0, TAU); ctx.fill();
  }

  // Resting arms
  if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && p.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else if (p.prop === 'staff') { arm(-11, -32, -15, -12); arm(11, -32, 23, -34); }
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  } else if (mood === 'talk') {
    arm(-11, -32, -15, -12);
    arm(11, -32, 24, -40 + Math.sin(t * 6) * 3);             // explaining with a hand
  } else if (mood === 'wave') {
    arm(-11, -32, -15, -12);
    arm(11, -32, 25 + Math.sin(t * 10) * 5, -66);
  }

  if (p.prop === 'jar') arm(-11, -32, -21, -50);

  // Head
  ctx.fillStyle = p.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (p.scarf) {
    ctx.fillStyle = p.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(p.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else if (p.veil) {
    ctx.fillStyle = p.veil;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18.5, Math.PI * 0.9, Math.PI * 2.1);
    ctx.arc(0, hy + 3, 14, Math.PI * 1.97, Math.PI * 1.03, true);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (p.prop === 'turban') {
    ctx.fillStyle = p.turbanC || '#e8dcc0';
    ctx.beginPath(); ctx.ellipse(0, hy - 9, 18, 11, 0, Math.PI * 0.95, Math.PI * 2.05); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(p.turbanC || '#e8dcc0', -35); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-15, hy - 12); ctx.quadraticCurveTo(0, hy - 18, 15, hy - 10); ctx.stroke();
  }
  if (p.cap) {
    ctx.fillStyle = p.cap;
    ctx.beginPath(); ctx.arc(0, hy - 11, 10, Math.PI, TAU); ctx.closePath(); ctx.fill();
  }
  // Beard
  if (p.beard) {
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(p, mood === 'hug' ? 'joy' : mood === 'wave' ? 'watch' : mood, hy, lx, ly);

  // Basket carried on the head
  if (p.prop === 'basket') {
    ctx.fillStyle = '#b98a4a';
    ctx.beginPath(); ctx.ellipse(0, hy - 19, 17, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f39a2b';
    ctx.beginPath(); ctx.arc(-6, hy - 25, 4.5, 0, TAU); ctx.arc(3, hy - 26, 4.5, 0, TAU); ctx.arc(10, hy - 23, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6030'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-14, hy - 19); ctx.lineTo(14, hy - 19); ctx.stroke();
  }

  if (p.prop === 'jar') {
    ctx.fillStyle = '#c0683a';
    ctx.beginPath(); ctx.ellipse(-24, -60, 9, 12, -0.2, 0, TAU); ctx.fill();
    ctx.fillRect(-28, -76, 8, 6);
  }
  // His little scroll, held in the left hand
  if (p.scroll && (mood === 'watch' || mood === 'wave' || mood === 'talk' || mood === 'wow')) {
    ctx.fillStyle = '#f3e3b5'; ctx.strokeStyle = '#a58a55'; ctx.lineWidth = 1;
    roundRect(-19, -24, 8, 15, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(-20, -26, 10, 3); ctx.fillRect(-20, -10, 10, 3);
  }
  // Hands over the face / hugging arms come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && p.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = p.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'hug') {
    if (hd === 0) { arm(-11, -32, -28, -36); arm(11, -32, 28, -36); }
    else { arm(-11, -32, hd * 26, -36); arm(11, -32, hd * 32, -30); }
  }
  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'talk':
      eyes(3.5, 4.5, 2);
      brows(-8, -7, -8, -7);
      if (Math.sin(t * 12) > 0) mouthFill(() => ctx.ellipse(0, mouthY - 1, 3, 3.4, 0, 0, TAU));
      else mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function drawSheep(x, y, s, dir, ribbon) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
  ctx.fillStyle = '#3a3029';
  for (const lx of [-13, -5, 6, 13]) ctx.fillRect(lx - 2, -12, 4.5, 12);
  const puffs = [[-16, -21, 9], [-8, -28, 10], [2, -29, 10], [12, -26, 9], [17, -18, 8], [8, -14, 9], [-4, -13, 9], [-15, -14, 8]];
  ctx.fillStyle = '#d8d0bf';
  ctx.beginPath(); for (const [px, py, r] of puffs) { ctx.moveTo(px + r + 1, py + 2); ctx.arc(px, py + 2, r + 1, 0, TAU); } ctx.fill();
  ctx.fillStyle = '#fbf7ee';
  ctx.beginPath(); for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU); } ctx.fill();
  // head
  ctx.fillStyle = '#3a3029';
  ctx.beginPath(); ctx.ellipse(23, -25, 7, 8.5, 0.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(17, -30, 5, 2.5, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fbf7ee';
  ctx.beginPath(); ctx.arc(21, -33, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(25, -27, 1.8, 0, TAU); ctx.fill();
  if (ribbon) {
    ctx.strokeStyle = '#e03131'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(16, -32); ctx.lineTo(18, -16); ctx.stroke();
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(18, -14, 3.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

    ctx.fillStyle = '#d9d9de'; ctx.beginPath(); ctx.ellipse(46, -54, 5, 4, 0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(37, -61, 1.9, 0, TAU); ctx.fill();

const OBJ_DEPTH = { fountain: 46, pen: 30, boat: 26, well: 26 };   // how far a footprint reaches back
function makeObject(x, y, kind) {

  return { type: 'object', kind, x, y, w, h, ow, oh, i: pid++,
    c1: pick(['#e8dcc0', '#d9c39a', '#c9b27a', '#e0cfa8']), c2: pick(['#c0392b', '#3f6fb5', '#7a4fa0', '#2f8f5b', '#d9a13a', '#8a5a34']),
    goods: [pick(['#f39a2b', '#c0392b', '#6b3fa0', '#f2d349', '#6aa84f', '#b5503f']), pick(['#f39a2b', '#c0392b', '#6b3fa0', '#f2d349', '#6aa84f']), pick(['#f39a2b', '#c0392b', '#6b3fa0', '#f2d349', '#6aa84f'])],
    dir: Math.random() < 0.5 ? -1 : 1 };
}

function drawObject(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  const { w, h } = o;
  switch (o.kind) {
    case 'tent': {
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-w / 2 + 18, -h * 0.62); ctx.lineTo(-w / 2 - 16, 0); ctx.moveTo(w / 2 - 18, -h * 0.62); ctx.lineTo(w / 2 + 16, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2 + 18, -h * 0.62); ctx.lineTo(0, -h); ctx.lineTo(w / 2 - 18, -h * 0.62); ctx.lineTo(w / 2, 0);
      ctx.closePath();
      ctx.fillStyle = o.c1; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = o.c2;
      for (let x = -w / 2; x < w / 2; x += 30) ctx.fillRect(x, -h, 13, h);
      ctx.restore();
      ctx.strokeStyle = shade(o.c1, -60); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#4a3322';
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(0, -h * 0.5); ctx.lineTo(20, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(0, -h - 14); ctx.stroke();
      ctx.fillStyle = o.c2; ctx.beginPath(); ctx.moveTo(0, -h - 14); ctx.lineTo(14, -h - 10); ctx.lineTo(0, -h - 6); ctx.fill();
      break;
    }
    case 'palm': {
      ctx.strokeStyle = '#8a6238'; ctx.lineWidth = 13; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-12 * o.dir, -h * 0.5, 8 * o.dir, -h + 20); ctx.stroke();
      ctx.strokeStyle = '#6f4e2c'; ctx.lineWidth = 2;
      for (let k = 1; k < 9; k++) {
        const f = k / 9, yy = -f * (h - 20), xx = lerp(0, 8 * o.dir, f) - 12 * o.dir * Math.sin(f * Math.PI) * 0.5;
        ctx.beginPath(); ctx.moveTo(xx - 6, yy); ctx.lineTo(xx + 6, yy - 3); ctx.stroke();
      }
      const tx = 8 * o.dir, ty = -h + 20;
      for (let k = 0; k < 8; k++) {
        const a = Math.PI + (k / 7) * Math.PI + (k % 2 ? 0.1 : -0.1);
        const ex = tx + Math.cos(a) * 62, ey = ty + Math.sin(a) * 36 + 26;
        ctx.strokeStyle = k % 2 ? '#3f8430' : '#4f9a3a'; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo((tx + ex) / 2, ty + Math.sin(a) * 36 - 12, ex, ey); ctx.stroke();
      }
      ctx.fillStyle = '#b5651d';
      ctx.beginPath(); ctx.arc(tx - 5, ty + 8, 5, 0, TAU); ctx.arc(tx + 5, ty + 9, 5, 0, TAU); ctx.fill();
      break;
    }
    case 'campfire': {
      ctx.fillStyle = '#9a9086';
      for (let k = 0; k < 7; k++) { const a = (k / 7) * TAU; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 22, -6 + Math.sin(a) * 7, 7, 5, 0, 0, TAU); ctx.fill(); }
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(14, -12); ctx.moveTo(14, -2); ctx.lineTo(-14, -12); ctx.stroke();
      ctx.fillStyle = '#f76707';
      ctx.beginPath(); ctx.moveTo(-13, -8); ctx.quadraticCurveTo(-12, -30, 0, -44); ctx.quadraticCurveTo(12, -30, 13, -8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd43b';
      ctx.beginPath(); ctx.moveTo(-7, -8); ctx.quadraticCurveTo(-6, -22, 0, -30); ctx.quadraticCurveTo(6, -22, 7, -8); ctx.closePath(); ctx.fill();
      break;
    }
    case 'bundle': {
      ctx.fillStyle = '#c9a46a'; ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(-14, -15, 17, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-18, -29); ctx.lineTo(-14, -36); ctx.lineTo(-10, -29); ctx.fill(); ctx.stroke();
      ctx.fillStyle = o.c2;
      roundRect(4, -20, 32, 20, 9); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(12, -20); ctx.lineTo(12, 0); ctx.moveTo(26, -20); ctx.lineTo(26, 0); ctx.stroke();
      break;
    }
    case 'stall': {
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 6; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(-w / 2 + 8, 0); ctx.lineTo(-w / 2 + 8, -h + 10); ctx.moveTo(w / 2 - 8, 0); ctx.lineTo(w / 2 - 8, -h + 10); ctx.stroke();
      // striped awning with a scalloped edge
      ctx.fillStyle = o.c1; ctx.fillRect(-w / 2 - 6, -h, w + 12, 28);
      ctx.fillStyle = o.c2;
      for (let x = -w / 2 - 6; x < w / 2 + 6; x += 24) ctx.fillRect(x, -h, 12, 28);
      ctx.beginPath();
      for (let x = -w / 2 - 6; x < w / 2 + 6; x += 12) { ctx.moveTo(x + 12, -h + 28); ctx.arc(x + 6, -h + 28, 6, 0, Math.PI); }
      ctx.fill();
      // hanging onions
      ctx.fillStyle = '#e9c46a';
      for (let x = -w / 2 + 24; x < w / 2 - 20; x += 22) { ctx.beginPath(); ctx.arc(x, -h + 44, 4, 0, TAU); ctx.fill(); }
      // counter
      ctx.fillStyle = '#a8743f'; ctx.fillRect(-w / 2 + 4, -52, w - 8, 52);
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2;
      for (let x = -w / 2 + 30; x < w / 2 - 4; x += 28) { ctx.beginPath(); ctx.moveTo(x, -50); ctx.lineTo(x, 0); ctx.stroke(); }
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-w / 2 + 2, -56, w - 4, 6);
      // piles of produce
      o.goods.forEach((g, k) => {
        const px = -w / 2 + 30 + k * ((w - 60) / 2);
        ctx.fillStyle = g;
        for (const [dx, dy] of [[-10, -61], [0, -61], [10, -61], [-5, -69], [5, -69], [0, -77]]) {
          ctx.beginPath(); ctx.arc(px + dx, dy, 5.5, 0, TAU); ctx.fill();
        }
      });
      break;
    }
    case 'pots': {
      const pot = (px, s, c) => {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.ellipse(px, -18 * s, 15 * s, 18 * s, 0, 0, TAU); ctx.fill();
        ctx.fillRect(px - 7 * s, -44 * s, 14 * s, 12 * s);
        ctx.fillStyle = shade(c, -30); ctx.fillRect(px - 9 * s, -46 * s, 18 * s, 4 * s);
        ctx.strokeStyle = shade(c, 30); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, -18 * s, 10 * s, -2.4, -1.4); ctx.stroke();
      };
      pot(-20, 0.9, '#c0683a'); pot(20, 0.8, '#b5703f'); pot(0, 1.05, '#cf7a45');
      break;
    }
    case 'basket': {
      ctx.fillStyle = o.goods[0];
      for (const [dx, dy] of [[-10, -30], [0, -32], [10, -30], [-5, -36], [5, -36]]) { ctx.beginPath(); ctx.arc(dx, dy, 6, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#b98a4a';
      ctx.beginPath(); ctx.moveTo(-22, -30); ctx.lineTo(22, -30); ctx.lineTo(16, 0); ctx.lineTo(-16, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#8a6030'; ctx.lineWidth = 1.5;
      for (let y = -24; y < 0; y += 6) { ctx.beginPath(); ctx.moveTo(-20, y); ctx.lineTo(20, y); ctx.stroke(); }
      break;
    }
    case 'cage': {
      ctx.fillStyle = '#a8743f'; ctx.fillRect(-30, -6, 60, 6); ctx.fillRect(-30, -50, 60, 6);
      ctx.fillStyle = '#9aa0a8';
      for (const dx of [-14, 0, 14]) {
        ctx.beginPath(); ctx.ellipse(dx, -18, 8, 6, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(dx + 6, -26, 4, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2;
      for (let x = -28; x <= 28; x += 8) { ctx.beginPath(); ctx.moveTo(x, -46); ctx.lineTo(x, -6); ctx.stroke(); }
      break;
    }
    case 'lamp': {
      ctx.fillStyle = '#b8862e'; ctx.fillRect(-14, -6, 28, 6);

      ctx.beginPath(); ctx.moveTo(-32, -30); ctx.lineTo(-32, -88); ctx.lineTo(32, -88); ctx.lineTo(32, -30); ctx.stroke();
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
