      ctx.fillStyle = '#9c907a';
      for (let y = -34, r = 0; y < 0; y += 11, r++) for (let x = -40 + (r % 2) * 10; x < 40; x += 20) ctx.fillRect(x + 1, y + 1, 17, 9);
      ctx.fillStyle = '#b8ab93'; ctx.beginPath(); ctx.ellipse(0, -34, 40, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3d6f8f'; ctx.beginPath(); ctx.ellipse(0, -34, 32, 6, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'trough': {
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-48, -26, 96, 26);
      ctx.fillStyle = '#5aa0d0'; ctx.fillRect(-43, -24, 86, 7);
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2; ctx.strokeRect(-48, -26, 96, 26);
      break;
    }
    case 'kiln': {
      ctx.fillStyle = '#b5703f';
      ctx.beginPath(); ctx.moveTo(-44, 0); ctx.quadraticCurveTo(-46, -78, 0, -80); ctx.quadraticCurveTo(46, -78, 44, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a4f2a'; ctx.fillRect(-8, -92, 16, 16);
      ctx.fillStyle = '#3b2412'; roundRect(-16, -34, 32, 34, [16, 16, 0, 0]); ctx.fill();
      ctx.fillStyle = '#ff9f43'; roundRect(-10, -20, 20, 20, [10, 10, 0, 0]); ctx.fill();
      ctx.fillStyle = 'rgba(200,200,200,0.5)';
      ctx.beginPath(); ctx.arc(-2, -104, 8, 0, TAU); ctx.arc(6, -118, 10, 0, TAU); ctx.fill();
      break;
    }
    case 'wheel': {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-4, -22, 8, 22); ctx.fillRect(-20, -4, 40, 4);
      ctx.fillStyle = '#9a6a3a'; ctx.beginPath(); ctx.ellipse(0, -22, 22, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c0683a';
      ctx.beginPath(); ctx.moveTo(-10, -24); ctx.quadraticCurveTo(-14, -40, -5, -46); ctx.lineTo(5, -46); ctx.quadraticCurveTo(14, -40, 10, -24); ctx.closePath(); ctx.fill();
      break;
    }
    case 'pen': {
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4;
      for (let x = -w / 2; x <= w / 2; x += 35) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, -36); ctx.stroke(); }
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(-w / 2, -30); ctx.lineTo(w / 2, -30); ctx.moveTo(-w / 2, -14); ctx.lineTo(w / 2, -14); ctx.stroke();
      break;
    }
    case 'mat': {
      ctx.fillStyle = o.c1; roundRect(-35, -10, 70, 12, 4); ctx.fill();
      ctx.fillStyle = o.c2; ctx.fillRect(-35, -6, 70, 3);
      ctx.fillStyle = shade(o.c1, -20); ctx.beginPath(); ctx.ellipse(-30, -8, 7, 6, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'washline': {
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-w / 2 + 6, 0); ctx.lineTo(-w / 2 + 6, -110); ctx.moveTo(w / 2 - 6, 0); ctx.lineTo(w / 2 - 6, -110); ctx.stroke();
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-w / 2 + 6, -104); ctx.quadraticCurveTo(0, -90, w / 2 - 6, -104); ctx.stroke();
      [o.c2, '#fff5dc', o.goods[0], '#5aa0d0'].forEach((c, k) => {
        const cx = -w / 2 + 28 + k * ((w - 56) / 3);
        ctx.fillStyle = c; ctx.fillRect(cx - 12, -100 + Math.abs(k - 1.5) * 3, 24, 30);
      });
      break;
    }
    case 'fountain': {
      ctx.fillStyle = '#e8e0cc'; ctx.beginPath(); ctx.ellipse(0, -20, 98, 30, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#d4c8ad'; ctx.fillRect(-98, -20, 196, 18);
      ctx.beginPath(); ctx.ellipse(0, -2, 98, 30, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#6fb3de'; ctx.beginPath(); ctx.ellipse(0, -22, 86, 22, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8e0cc'; ctx.fillRect(-7, -70, 14, 50);
      ctx.beginPath(); ctx.ellipse(0, -70, 22, 6, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(200,235,255,0.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -74); ctx.quadraticCurveTo(-26, -94, -40, -30); ctx.moveTo(0, -74); ctx.quadraticCurveTo(26, -94, 40, -30); ctx.stroke();
      break;
    }
    case 'shrub': {
      ctx.fillStyle = '#c0683a'; ctx.beginPath(); ctx.moveTo(-18, -24); ctx.lineTo(18, -24); ctx.lineTo(13, 0); ctx.lineTo(-13, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4f9a3a';
      ctx.beginPath(); for (const [dx, dy, r] of [[-12, -36, 13], [10, -38, 14], [0, -54, 15], [-4, -30, 11]]) { ctx.moveTo(dx + r, dy); ctx.arc(dx, dy, r, 0, TAU); } ctx.fill();
      ctx.fillStyle = '#e05a7a'; for (const [dx, dy] of [[-10, -44], [8, -50], [2, -34]]) { ctx.beginPath(); ctx.arc(dx, dy, 3, 0, TAU); ctx.fill(); }
      break;
    }
    case 'bench': {
      ctx.fillStyle = '#9a6a3a'; ctx.fillRect(-52, -34, 104, 10);
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-46, -24, 7, 24); ctx.fillRect(39, -24, 7, 24);
      ctx.fillStyle = '#e0c08a'; ctx.fillRect(-40, -44, 70, 10);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(34, -36); ctx.lineTo(48, -48); ctx.stroke();
      ctx.fillStyle = '#8a8a8a'; ctx.fillRect(44, -54, 10, 7);
      break;
    }
    case 'timber': {
      for (const [dx, dy] of [[-30, -10], [0, -10], [30, -10], [-15, -28], [15, -28]]) {
        ctx.fillStyle = '#a0673a'; ctx.beginPath(); ctx.arc(dx, dy, 10, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0b07a'; ctx.beginPath(); ctx.arc(dx, dy, 6, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'net': {
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-44, 0); ctx.lineTo(-44, -68); ctx.moveTo(44, 0); ctx.lineTo(44, -68); ctx.moveTo(-46, -64); ctx.lineTo(46, -64); ctx.stroke();
      ctx.strokeStyle = 'rgba(90,80,60,0.75)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = -40; x <= 40; x += 8) { ctx.moveTo(x, -62); ctx.lineTo(x + 4, -12); }
      for (let y = -58; y <= -14; y += 8) { ctx.moveTo(-40, y); ctx.lineTo(42, y + 2); }
      ctx.stroke();
      ctx.fillStyle = '#f0e0b0'; for (const dx of [-30, 0, 30]) { ctx.beginPath(); ctx.arc(dx, -12, 4, 0, TAU); ctx.fill(); }
      break;
    }
    case 'boat': {
      ctx.fillStyle = '#8a5a2b';
      ctx.beginPath(); ctx.moveTo(-85, -40); ctx.quadraticCurveTo(-60, 0, 0, 0); ctx.quadraticCurveTo(60, 0, 85, -40); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a8743f'; ctx.fillRect(-80, -42, 160, 6);
      ctx.fillStyle = '#3f6fb5'; ctx.fillRect(-70, -30, 140, 5);
      break;
    }
    case 'fishbasket': {
      ctx.fillStyle = '#9aa7b3';
      for (const [dx, dy] of [[-8, -28], [6, -30], [0, -34]]) { ctx.beginPath(); ctx.ellipse(dx, dy, 10, 4, 0.3, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#b98a4a';
      ctx.beginPath(); ctx.moveTo(-21, -28); ctx.lineTo(21, -28); ctx.lineTo(15, 0); ctx.lineTo(-15, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#8a6030'; ctx.lineWidth = 1.5;
      for (let y = -22; y < 0; y += 6) { ctx.beginPath(); ctx.moveTo(-19, y); ctx.lineTo(19, y); ctx.stroke(); }
      break;
    }
    case 'table': {
      ctx.fillStyle = o.c2; ctx.fillRect(-56, -40, 112, 24);
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-50, -16, 7, 16); ctx.fillRect(43, -16, 7, 16);
      ctx.fillStyle = '#a8743f'; ctx.fillRect(-56, -44, 112, 6);
      ctx.fillStyle = '#f2c14e';
      for (const [dx, dy] of [[-30, -47], [-24, -48], [-10, -47], [8, -48], [14, -47], [30, -48]]) { ctx.beginPath(); ctx.arc(dx, dy, 3, 0, TAU); ctx.fill(); }
      break;
    }
  }
  ctx.restore();
}

function drawEntity(e, o = {}) {
  if (e.type === 'person') drawPerson(e, o);
  else if (e.type === 'animal') drawAnimal(e, o);
  else if (e.type === 'object') drawObject(e);
}

// ============================================================
//  Backdrops for each place
// ============================================================
function drawBackdrop(sc) {
  const R = mulberry32(sc.seed);
  const rr = (a, b) => a + R() * (b - a);
  const { WW, WH, top } = sc;
  const sky = (y1, c1, c2) => {
    const g = ctx.createLinearGradient(0, 0, 0, y1);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, WW, y1 + 2);
  };
  const clouds = (n, y0, y1) => {
    for (let i = 0; i < n; i++) drawCloud(rr(0, WW), rr(y0, y1), rr(110, 190), rr(30, 44), 'rgba(255,255,255,0.9)', 'rgba(220,235,250,0.8)');
  };
  const paving = (y0, base, cw, ch, c1, c2) => {
    ctx.fillStyle = base; ctx.fillRect(0, y0, WW, WH - y0);
    for (let y = y0, row = 0; y < WH; y += ch, row++) {
      for (let x = (row % 2) * -cw / 2; x < WW; x += cw) {
        ctx.fillStyle = R() < 0.5 ? c1 : c2;
        roundRect(x + 2, y + 2, cw - 4, ch - 4, 6); ctx.fill();
      }
    }
  };
  const house = (x, w, h, baseY) => {
    const col = ['#e8cf9f', '#dfc08a', '#f0dcb2', '#d9b27a', '#e6c79a', '#ecd6ad'][Math.floor(R() * 6)];
    ctx.fillStyle = col; ctx.fillRect(x, baseY - h, w, h);
    ctx.fillStyle = shade(col, -28); ctx.fillRect(x - 4, baseY - h - 9, w + 8, 10);
    ctx.fillStyle = shade(col, -14); ctx.fillRect(x + w - 8, baseY - h, 8, h);
    ctx.fillStyle = '#5a4630';
    const nwin = 1 + Math.floor(R() * 3);
    for (let k = 0; k < nwin; k++) {
      const wx = x + (w / (nwin + 1)) * (k + 1), wy = baseY - h + 40 + R() * 30;
      roundRect(wx - 9, wy, 18, 24, [9, 9, 1, 1]); ctx.fill();
    }
    const dx = x + rr(30, w - 50);
    ctx.fillStyle = '#6b4a2b';
    roundRect(dx, baseY - 70, 34, 70, [17, 17, 0, 0]); ctx.fill();
    if (R() < 0.5) {
      const c = ['#c0392b', '#3f6fb5', '#2f8f5b', '#d9a13a'][Math.floor(R() * 4)];
      ctx.fillStyle = c; ctx.fillRect(dx - 12, baseY - 92, 58, 14);
      ctx.fillStyle = '#fff5dc';
      for (let k = 0; k < 58; k += 14) ctx.fillRect(dx - 12 + k, baseY - 92, 7, 14);
    }
  };

  const earth = (y0, base, fleck, n, size = 3) => {
    ctx.fillStyle = base; ctx.fillRect(0, y0, WW, WH - y0);
    ctx.fillStyle = fleck;
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.ellipse(rr(0, WW), rr(y0, WH), rr(size, size * 3), rr(size * 0.6, size * 1.4), rr(0, 3), 0, TAU); ctx.fill(); }
  };
  const colonnade = (x0, x1, y, hgt = 282) => {
    ctx.fillStyle = '#efe6d0'; ctx.fillRect(x0, y - 300, x1 - x0, 34);
    ctx.fillStyle = '#d9cdb0'; ctx.fillRect(x0, y - 268, x1 - x0, 6);
    ctx.fillStyle = 'rgba(120,100,60,0.12)'; ctx.fillRect(x0, y - 262, x1 - x0, hgt);
    for (let cx = x0 + 50; cx < x1 - 20; cx += 110) {
      const cg = ctx.createLinearGradient(cx - 15, 0, cx + 15, 0);
      cg.addColorStop(0, '#d8ccb0'); cg.addColorStop(0.45, '#fbf6ea'); cg.addColorStop(1, '#cfc2a4');
      ctx.fillStyle = cg; ctx.fillRect(cx - 15, y - 262, 30, hgt);
      ctx.fillStyle = '#e6dabf'; ctx.fillRect(cx - 21, y - 268, 42, 10); ctx.fillRect(cx - 21, y - 272 + hgt, 42, 10);
    }
  };

  if (sc.key === 'caravan') {
    // Dawn at the camp: a rising sun, hills, a distant Jerusalem
    const hz = top - 90;
    sky(hz, '#f4a98a', '#ffe9c4');
    const sun = ctx.createRadialGradient(WW * 0.3, hz - 30, 10, WW * 0.3, hz - 30, 160);
    sun.addColorStop(0, 'rgba(255,240,170,1)'); sun.addColorStop(0.25, 'rgba(255,214,120,0.9)'); sun.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = sun; ctx.fillRect(WW * 0.3 - 160, hz - 190, 320, 190);
    clouds(4, 50, hz - 150);
    ctx.fillStyle = '#b7d39a';
    ctx.beginPath(); ctx.moveTo(0, hz + 20);
    for (let x = 0; x <= WW; x += 20) ctx.lineTo(x, hz - 40 + Math.sin(x / 260) * 22 + Math.sin(x / 97) * 8);
    ctx.lineTo(WW, hz + 20); ctx.fill();
    const jx = WW * 0.8, jy = hz - 36;
    ctx.fillStyle = '#a9c98a';
    ctx.beginPath(); ctx.ellipse(jx, hz, 250, 70, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#e8d3a0'; ctx.fillRect(jx - 120, jy - 30, 240, 34);
    for (let x = jx - 120; x < jx + 120; x += 12) ctx.fillRect(x, jy - 36, 7, 6);
    ctx.fillRect(jx - 130, jy - 46, 22, 50); ctx.fillRect(jx + 108, jy - 46, 22, 50);
    ctx.fillStyle = '#f6f1e2'; ctx.fillRect(jx - 28, jy - 72, 56, 44);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(jx - 32, jy - 78, 64, 8);
    ctx.fillStyle = '#d9a52a'; ctx.fillRect(jx - 8, jy - 60, 16, 32);
    const g = ctx.createLinearGradient(0, hz, 0, WH);
    g.addColorStop(0, '#e6d19c'); g.addColorStop(1, '#d4b77a');
    ctx.fillStyle = g; ctx.fillRect(0, hz, WW, WH - hz);
    ctx.fillStyle = '#efdfb4';
    ctx.beginPath();
    for (let x = 0; x <= WW; x += 20) ctx.lineTo(x, hz + 200 + Math.sin(x / 380) * 60 - 60);
    for (let x = WW; x >= 0; x -= 20) ctx.lineTo(x, hz + 200 + Math.sin(x / 380) * 60 + 60);
    ctx.fill();
    for (let i = 0; i < 70; i++) {
      const x = rr(0, WW), y = rr(hz + 10, WH);
      ctx.strokeStyle = '#8fb05a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 5, y - 8); ctx.lineTo(x, y); ctx.lineTo(x + 5, y - 9); ctx.moveTo(x, y); ctx.lineTo(x, y - 11); ctx.stroke();
    }
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = '#b8ab93';
      ctx.beginPath(); ctx.ellipse(rr(0, WW), rr(hz + 10, WH), rr(5, 12), rr(3, 7), 0, 0, TAU); ctx.fill();
    }
  } else if (sc.key === 'inn') {
    // An inn: two storeys of rooms and stables round a dusty courtyard
    sky(top - 200, '#9fd3f5', '#e2f3fb');
    clouds(3, 30, top - 340);
    ctx.fillStyle = '#b8956a'; ctx.fillRect(0, top - 274, WW, 16);
    ctx.fillStyle = '#dcc49a'; ctx.fillRect(0, top - 260, WW, 282);
    for (let x = 30; x < WW; x += 124) {
      ctx.fillStyle = '#4a3322'; roundRect(x, top - 112, 74, 132, [37, 37, 0, 0]); ctx.fill();
      ctx.fillStyle = '#e8cf7a'; ctx.fillRect(x + 8, top + 2, 58, 18);
      ctx.fillStyle = '#5a4630'; roundRect(x + 17, top - 234, 40, 70, [20, 20, 0, 0]); ctx.fill();
      if (R() < 0.5) { ctx.fillStyle = ['#c0392b', '#3f6fb5', '#2f8f5b'][Math.floor(R() * 3)]; ctx.fillRect(x + 12, top - 160, 50, 22); }
    }
    ctx.fillStyle = '#c9ad80'; ctx.fillRect(0, top - 142, WW, 12);
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, top - 164); ctx.lineTo(WW, top - 164); ctx.stroke();
    ctx.lineWidth = 2;
    for (let x = 0; x < WW; x += 16) { ctx.beginPath(); ctx.moveTo(x, top - 164); ctx.lineTo(x, top - 142); ctx.stroke(); }
    earth(top + 20, '#d9c29a', '#e8cf7a', 260, 2);
  } else if (sc.key === 'potters') {
    // Potters' street: workshops with pots stacked on every ledge, clay-red ground
    sky(top, '#9fd3f5', '#e2f3fb');
    clouds(4, 40, top - 380);
    let x = -20;
    while (x < WW + 20) {
      const w = rr(130, 210), h = rr(220, 320);
      house(x, w, h, top + 20);
      for (let px = x + 14; px < x + w - 14; px += 22) {
        ctx.fillStyle = ['#c0683a', '#b5703f', '#cf7a45', '#a85a30'][Math.floor(R() * 4)];
        ctx.beginPath(); ctx.ellipse(px, top + 20 - h - 18, 9, 11, 0, 0, TAU); ctx.fill();
      }
      x += w - 2;
    }
    earth(top + 20, '#d6b08a', 'rgba(185,110,70,0.35)', 160, 8);
  } else if (sc.key === 'sheepgate') {
    // The Sheep Gate: a low wall with a small gate, grassy ground and hay
    sky(top, '#9fd3f5', '#e8f5fb');
    clouds(4, 40, top - 330);
    const wy = top - 220;
    ctx.fillStyle = '#b7d39a';
    ctx.beginPath(); ctx.moveTo(0, wy); for (let x = 0; x <= WW; x += 20) ctx.lineTo(x, wy - 40 + Math.sin(x / 200) * 20); ctx.lineTo(WW, wy); ctx.fill();
    ctx.fillStyle = '#d9c092'; ctx.fillRect(0, wy, WW, 240);
    ctx.strokeStyle = '#c4a877'; ctx.lineWidth = 2;
    for (let y = wy + 26, row = 0; y < top + 20; y += 26, row++) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WW, y); ctx.stroke();
      for (let x = (row % 2) * 28; x < WW; x += 56) { ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x, y); ctx.stroke(); }
    }
    ctx.fillStyle = '#d9c092';
    for (let x = 0; x < WW; x += 40) ctx.fillRect(x, wy - 20, 24, 22);
    for (const gx of [WW * 0.28, WW * 0.72]) {
      ctx.fillStyle = '#cfb384'; ctx.fillRect(gx - 100, wy - 70, 200, 70);
      ctx.fillStyle = '#4a3322';
      ctx.beginPath(); ctx.moveTo(gx - 60, top + 20); ctx.lineTo(gx - 60, wy + 90); ctx.arc(gx, wy + 90, 60, Math.PI, TAU); ctx.lineTo(gx + 60, top + 20); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(gx, wy - 40, 22, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3a3029'; ctx.beginPath(); ctx.arc(gx + 20, wy - 44, 7, 0, TAU); ctx.fill();
    }
    earth(top + 20, '#cbbf88', '#a9b86a', 200, 4);
    for (let i = 0; i < 26; i++) { ctx.fillStyle = '#e8cf7a'; ctx.beginPath(); ctx.ellipse(rr(0, WW), rr(top + 40, WH), rr(14, 26), rr(5, 9), 0, 0, TAU); ctx.fill(); }
  } else if (sc.key === 'bethesda') {
    // The pool of Bethesda: porches, stone floor and two blue pools
    sky(top, '#a6d8f6', '#fff4d6');
    clouds(3, 40, top - 420);
    colonnade(0, WW, top);
    for (let y = top + 20, row = 0; y < WH; y += 60, row++) {
      for (let x = 0, col = 0; x < WW; x += 90, col++) {
        ctx.fillStyle = (row + col) % 2 ? '#e8dcc2' : '#ddd0b2';
        ctx.fillRect(x, y, 90, 60);
      }
    }
    for (const pl of sc.pools) {
      ctx.fillStyle = '#c9bb98'; roundRect(pl.x0 - 16, pl.y0 - 16, pl.x1 - pl.x0 + 32, pl.y1 - pl.y0 + 32, 10); ctx.fill();
      const wg = ctx.createLinearGradient(0, pl.y0, 0, pl.y1);
      wg.addColorStop(0, '#6fb8e0'); wg.addColorStop(1, '#3c86b8');
      ctx.fillStyle = wg; ctx.fillRect(pl.x0, pl.y0, pl.x1 - pl.x0, pl.y1 - pl.y0);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      for (let k = 0; k < 14; k++) { const x = rr(pl.x0 + 20, pl.x1 - 40), y = rr(pl.y0 + 10, pl.y1 - 10); ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 4, x + 20, y); ctx.stroke(); }
      ctx.fillStyle = '#d8ccb0';
      for (let k = 0; k < 4; k++) ctx.fillRect(pl.x0 - 10 + k * 14, pl.y0 - 14 + k * 0, 12, pl.y1 - pl.y0 + 28);
    }
  } else if (sc.key === 'rooftops') {
    // Flat rooftops: a skyline beyond, plastered roofs with low parapet walls and stairs
    sky(top, '#9fd3f5', '#e8f5fb');
    clouds(5, 40, top - 300);
    ctx.fillStyle = '#e9dcc0';
    for (let x = -20; x < WW; x += rr(60, 120)) { const h = rr(60, 180); ctx.fillRect(x, top - h, rr(60, 120), h + 20); }
    ctx.fillStyle = '#f6f1e3'; ctx.fillRect(WW * 0.7, top - 260, 140, 180);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(WW * 0.7 - 6, top - 270, 152, 12);
    ctx.fillStyle = '#e6d3ae'; ctx.fillRect(0, top, WW, WH - top);
    for (let y = top + 190; y < WH - 60; y += 250) {
      let x = 0;
      while (x < WW) {
        const len = rr(260, 520);
        ctx.fillStyle = '#d2b98c'; ctx.fillRect(x, y - 16, len, 16);
        ctx.fillStyle = '#c4a877'; ctx.fillRect(x, y, len, 5);
        x += len + rr(70, 120);
        // stairs down through the gap
        ctx.fillStyle = '#cdb48a';
        for (let k = 0; k < 4; k++) ctx.fillRect(x - 60 + k * 4, y - 14 + k * 8, 44 - k * 8, 7);
      }
    }
    ctx.fillStyle = 'rgba(160,130,80,0.18)';
    for (let i = 0; i < 90; i++) { ctx.fillRect(rr(0, WW), rr(top, WH), rr(20, 60), 2); }
  } else if (sc.key === 'upper') {
    // The upper city: fine white houses with columns, gardens and a mosaic pavement
    sky(top, '#a6d8f6', '#fff4d6');
    clouds(3, 40, top - 440);
    let x = -20;
    while (x < WW + 20) {
      const w = rr(200, 300), h = rr(280, 380), by = top + 10;
      ctx.fillStyle = '#f4efe4'; ctx.fillRect(x, by - h, w, h);
      ctx.fillStyle = '#e2dac8'; ctx.fillRect(x + w - 10, by - h, 10, h);
      ctx.fillStyle = '#c9a26a'; ctx.fillRect(x - 6, by - h - 12, w + 12, 14);
      for (let cx = x + 30; cx < x + w - 20; cx += 46) {
        ctx.fillStyle = '#fbf8f0'; ctx.fillRect(cx - 7, by - 150, 14, 150);
        ctx.fillStyle = '#e6dabf'; ctx.fillRect(cx - 10, by - 156, 20, 8);
      }
      ctx.fillStyle = '#e6dabf'; ctx.fillRect(x + 10, by - 164, w - 20, 10);
      ctx.fillStyle = '#6b8fb5';
      for (let wx = x + 30; wx < x + w - 30; wx += 60) { roundRect(wx, by - h + 40, 22, 34, [11, 11, 1, 1]); ctx.fill(); }
      ctx.fillStyle = '#4f9a3a'; roundRect(x + 4, by - 26, w - 8, 30, 12); ctx.fill();
      x += w + rr(10, 40);
    }
    paving(top + 20, '#ddd2bb', 70, 40, '#f1ead8', '#e6dcc6');
    ctx.strokeStyle = '#c9a26a'; ctx.lineWidth = 4;
    for (let y = top + 180; y < WH; y += 360) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WW, y); ctx.stroke(); }
  } else if (sc.key === 'craft') {
    // Carpenters' and fishermen's quarter: open workshops, sawdust and fish stalls
    sky(top, '#9fd3f5', '#e2f3fb');
    clouds(4, 40, top - 380);
    let x = -20;
    while (x < WW + 20) {
      const w = rr(150, 230), h = rr(210, 300);
      house(x, w, h, top + 20);
      ctx.fillStyle = '#3b2a1a'; ctx.fillRect(x + 20, top - 100, w - 40, 110);
      ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 3;
      for (let tx = x + 36; tx < x + w - 36; tx += 26) { ctx.beginPath(); ctx.moveTo(tx, top - 92); ctx.lineTo(tx, top - 60); ctx.stroke(); }
      ctx.fillStyle = '#b98a4a'; ctx.fillRect(x + 20, top - 108, w - 40, 8);
      x += w - 2;
    }
    earth(top + 20, '#cfb58c', '#e8d4a0', 420, 2);
  } else if (sc.key === 'market') {
    // Market: a row of houses and paved ground
    sky(top, '#9fd3f5', '#e2f3fb');
    clouds(4, 40, top - 360);
    let x = -20;
    while (x < WW + 20) { const w = rr(130, 220); house(x, w, rr(230, 340), top + 20); x += w - 2; }
    for (let i = 0; i < 6; i++) {
      const x1 = rr(0, WW - 300), x2 = x1 + rr(160, 280), y = top - rr(170, 220);
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.quadraticCurveTo((x1 + x2) / 2, y + 30, x2, y); ctx.stroke();
      for (let k = 1; k < 4; k++) {
        const f = k / 4, cx = lerp(x1, x2, f), cy = y + 30 * 2 * f * (1 - f) * 1;
        ctx.fillStyle = ['#e05a7a', '#5aa0d0', '#f0d060', '#6fb58a', '#fff5dc'][Math.floor(R() * 5)];
        ctx.fillRect(cx - 10, cy, 20, 26);
      }
    }
    paving(top + 20, '#cbb487', 58, 34, '#d8c49a', '#e2cea5');
  } else if (sc.key === 'gate') {
    // City gate: a great wall with towers, houses and a stone street
    sky(top, '#9fd3f5', '#e8f5fb');
    clouds(4, 40, top - 420);
    const wy = top - 300, gx = WW / 2;
    ctx.fillStyle = '#d9c092'; ctx.fillRect(0, wy, WW, 320);
    ctx.strokeStyle = '#c4a877'; ctx.lineWidth = 2;
    for (let y = wy + 28, row = 0; y < top + 20; y += 28, row++) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WW, y); ctx.stroke();
      for (let x = (row % 2) * 30; x < WW; x += 60) { ctx.beginPath(); ctx.moveTo(x, y - 28); ctx.lineTo(x, y); ctx.stroke(); }
    }
    ctx.fillStyle = '#d9c092';
    for (let x = 0; x < WW; x += 40) ctx.fillRect(x, wy - 22, 24, 24);
    const tower = (tx) => {
      ctx.fillStyle = '#cfb384'; ctx.fillRect(tx, wy - 110, 110, 430);
      for (let x = tx; x < tx + 110; x += 27) ctx.fillRect(x, wy - 130, 17, 22);
      ctx.fillStyle = '#5a4630';
      roundRect(tx + 48, wy - 70, 14, 34, 7); ctx.fill();
      roundRect(tx + 48, wy + 20, 14, 34, 7); ctx.fill();
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(tx + 53, wy - 180, 3, 52);
      ctx.beginPath(); ctx.moveTo(tx + 56, wy - 180); ctx.lineTo(tx + 86, wy - 170); ctx.lineTo(tx + 56, wy - 160); ctx.fill();
    };
    tower(gx - 200); tower(gx + 90);
    const ag = ctx.createLinearGradient(0, wy + 60, 0, top + 20);
    ag.addColorStop(0, '#6b5438'); ag.addColorStop(1, '#3e2f1f');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.moveTo(gx - 90, top + 20); ctx.lineTo(gx - 90, wy + 140); ctx.arc(gx, wy + 140, 90, Math.PI, TAU); ctx.lineTo(gx + 90, top + 20); ctx.fill();
    ctx.strokeStyle = '#b89a66'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(gx, wy + 140, 96, Math.PI, TAU); ctx.stroke();
    let x = -10;
    while (x < gx - 270) { const w = rr(120, 180); house(x, w, rr(140, 200), top + 20); x += w - 2; }
    x = gx + 270;
    while (x < WW + 10) { const w = rr(120, 180); house(x, w, rr(140, 200), top + 20); x += w - 2; }
    paving(top + 20, '#c2ab80', 44, 28, '#cdb892', '#d8c4a0');
  } else {
    // Temple courts: the temple, colonnades and a tiled court.
    // In the Court of the Gentiles the temple rises far off behind a great porch.
    const far = sc.key === 'gentiles';
    sky(top, '#a6d8f6', '#fff4d6');
    clouds(3, 40, top - 520);
    const tx = WW / 2;
    if (far) { ctx.save(); ctx.translate(tx, top - 300); ctx.scale(0.62, 0.62); ctx.translate(-tx, -(top - 300)); }
    const rays = ctx.createRadialGradient(tx, top - 300, 20, tx, top - 300, 500);
    rays.addColorStop(0, 'rgba(255,240,180,0.7)'); rays.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = rays; ctx.fillRect(tx - 500, 0, 1000, top);
    ctx.fillStyle = '#f6f1e3'; ctx.fillRect(tx - 230, top - 470, 460, 400);
    ctx.fillStyle = '#e8e0cc'; ctx.fillRect(tx + 190, top - 470, 40, 400);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(tx - 240, top - 488, 480, 22);
    for (let x = tx - 236; x <= tx + 236; x += 16) { ctx.beginPath(); ctx.moveTo(x - 3, top - 488); ctx.lineTo(x, top - 504); ctx.lineTo(x + 3, top - 488); ctx.fill(); }
    ctx.fillStyle = '#d9a52a'; ctx.fillRect(tx - 78, top - 370, 156, 300);
    ['#3b5ea8', '#7a4fa0', '#c0392b', '#3b5ea8', '#7a4fa0', '#c0392b'].forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(tx - 66 + k * 22, top - 358, 22, 288); });
    ctx.fillStyle = '#c98e3a';
    for (const px of [tx - 118, tx + 104]) { ctx.fillRect(px, top - 380, 14, 310); ctx.beginPath(); ctx.arc(px + 7, top - 384, 13, 0, TAU); ctx.fill(); }
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k % 2 ? '#ece3cc' : '#e2d7bb';
      ctx.fillRect(tx - 260 - k * 24, top - 70 + k * 18, 520 + k * 48, 18);
    }
    if (far) { ctx.restore(); colonnade(0, WW, top); }
    else { colonnade(0, tx - 320, top); colonnade(tx + 320, WW, top); }
    for (let y = top + 20, row = 0; y < WH; y += 60, row++) {
      for (let x = 0, col = 0; x < WW; x += 90, col++) {
        ctx.fillStyle = (row + col) % 2 ? '#f1e8d2' : '#e4d8bc';
        ctx.fillRect(x, y, 90, 60);
      }
    }
  }
}

// ============================================================
//  Building a level's scene
// ============================================================
const inFront = (e, s) => e.y > s.y - 2 && e.y - e.oh < s.y && Math.abs(e.x - s.x) < (e.ow + s.w) / 2 - 4;
const hiddenBehind = (e, o) => e.y < o.y && e.y - e.h * 0.7 > o.y - o.oh && Math.abs(e.x - o.x) < o.ow / 2;
const onFootprint = (e, o) => Math.abs(e.x - o.x) < (o.w + e.w) / 2 - 6 && e.y < o.y + 18 && e.y > o.y - (OBJ_DEPTH[o.kind] || 18);

const RICH_ROBES = ['#7a1f5c', '#1f4f7a', '#5c2a86', '#0f6b5c', '#9c2f2f', '#b8862e', '#2f5f9c'];
const TURBANS = ['#e8dcc0', '#c9b27a', '#3f6fb5', '#c0392b', '#f0d060', '#7a4fa0', '#fff5dc'];

// Give a crowd member the props and clothes that suit the place
function dressFor(e, L) {
  if (L.rich && Math.random() < 0.7) { e.robe = pick(RICH_ROBES); e.trim = Math.random() < 0.6; }
  if (Math.random() < 0.32) {
    const prop = pick(L.props);
    const adult = e.kind !== 'child';
    if (prop === 'basket' && e.kind === 'woman') e.prop = 'basket';
    else if (prop === 'staff' && (e.kind === 'man' || e.kind === 'elder')) e.prop = 'staff';
    else if (prop === 'jar' && adult) e.prop = 'jar';
    else if (prop === 'turban' && (e.kind === 'man' || e.kind === 'elder')) { e.prop = 'turban'; e.scarf = null; e.turbanC = pick(TURBANS); }
  }
  return e;
}

function buildScene() {
  if (scene && scene.bg) { scene.bg.width = 0; scene.bg.height = 0; }   // free the old bitmap (iOS canvas memory)
  const L = cfg.L;
  const sc = {
    loc: cfg.loc, key: L.key, WW: L.w, WH: L.h, top: L.top, seed: Math.floor(Math.random() * 1e9),
    statics: [], specials: [], objects: [], items: [], groups: [], target: null, bg: null, res: 1,
    zones: [], pools: [], lanes: [], walkers: [], procession: null,
  };
  const WW = sc.WW, yMin = L.top + 70, yMax = L.h - 14;

  // Water you can't stand in: the pools of Bethesda
  if (L.key === 'bethesda') {
    const pw = WW * 0.3, py = yMin + 170, ph = 200;
    sc.pools = [{ x0: WW * 0.12, x1: WW * 0.12 + pw, y0: py, y1: py + ph }, { x0: WW * 0.58, x1: WW * 0.58 + pw, y0: py, y1: py + ph }];
    sc.zones = sc.pools;
  }
  const inZone = (x, y, m = 0) => sc.zones.some((z) => x > z.x0 - m && x < z.x1 + m && y > z.y0 - m && y < z.y1 + m + 14);
  const spot = (w, test, tries = 300) => {
    for (let k = 0; k < tries; k++) {
      const x = rand(40 + w / 2, WW - 40 - w / 2), y = rand(yMin, yMax);
      if (!inZone(x, y, w / 2) && test(x, y)) return { x, y };
    }
    return null;
  };

  // 1. Scenery objects
  for (const kind in L.objs) {
    for (let n = 0; n < L.objs[kind]; n++) {
      const [w, h] = OBJ_SIZES[kind];
      const big = kind === 'tent' || kind === 'palm';
      const p = spot(w, (x, y) => {
        if (big && y > yMin + 260) return false;
        return sc.objects.every((o) => Math.abs(o.x - x) > (o.w + w) / 2 + 10 || Math.abs(o.y - y) > Math.max(o.oh, h * 0.6) + 40);
      });
      if (p) sc.objects.push(makeObject(p.x, p.y, kind));
    }
  }

  // A lane is a strip someone walks along; nothing may stand in front of it
  const laneFree = (y, x0, x1) => y > yMin && y < yMax - 8 &&
    sc.objects.every((o) => !(o.x + o.w / 2 > x0 - 20 && o.x - o.w / 2 < x1 + 20 && o.y > y - 30 && o.y - o.oh < y + 4)) &&
    !sc.zones.some((z) => x1 > z.x0 - 20 && x0 < z.x1 + 20 && y > z.y0 - 20 && y < z.y1 + 90);
  const laneX = (x, half) => [Math.max(30, x - half), Math.min(WW - 30, x + half)];
  const PROC_DY = 34, CROSS_DY = 14;   // how far in front of Him the passing crowd / a walker go

  // 2. Live "specials": the boy, decoys, a few animated people, bonus items
  const clearOfObjects = (s) => sc.objects.every((o) => !inFront(o, s) && !onFootprint(s, o) && !hiddenBehind(s, o) &&
    !(s.y < o.y && Math.abs(s.x - o.x) < (o.ow + s.w) / 2 && s.y > o.y - o.oh));
  const farFromSpecials = (x, y, d) => sc.specials.every((q) => Math.hypot(q.x - x, (q.y - y) * 1.4) > d + (q.group ? 110 : 0));
  const placeSpecial = (w, h, d, extra) => spot(w, (x, y) => {
    if (y > yMax - 30) return false;
    const probe = { x, y, w, h, oh: h, ow: w };
    return clearOfObjects(probe) && farFromSpecials(x, y, d) && (!extra || extra(x, y));
  }, 900);

  const cx0 = WW / 2, cy0 = (yMin + yMax) / 2;
  const awayFromStart = (x, y) => cfg.loc === 0 || Math.hypot(x - cx0, y - cy0) > 380;
  // His spot must leave room for the passing crowd and the walker in front of Him
  const targetOk = (x, y, dy = 0) => {
    if (!awayFromStart(x, y)) return false;
    if (cfg.procession && !laneFree(y + dy + PROC_DY, ...laneX(x, 380))) return false;
    if (cfg.crossing && !laneFree(y + dy + CROSS_DY, ...laneX(x, 260))) return false;
    return true;
  };

  let decoysLeft = cfg.decoys;
  if (cfg.final) {
    // Teacher circles in the temple courts: one has the boy Jesus, others a decoy boy
    const nGroups = 1 + Math.min(2, decoysLeft);
    for (let gi = 0; gi < nGroups; gi++) {
      const p = placeSpecial(260, 130, 230, (x, y) => (gi > 0 || targetOk(x, y, 10)) && y > yMin + 60 && x > 160 && x < WW - 160);
      if (!p) continue;
      const g = { x: p.x, y: p.y, w: 250, h: 130, group: true, members: [] };
      let boy;
      if (gi === 0) boy = makeBoy(p.x, p.y, 'jesus', RED_SASH, { sit: true });
      else { const d = decoyLook(cfg.d); boy = makeBoy(p.x, p.y, 'decoy', d.sash, { ...d, sit: true }); decoysLeft--; }
      boy.lx = 0; boy.ly = -0.2;
      const teachers = [[-40, -40], [44, -42], [-74, -4], [76, -6]].map(([dx, dy]) => makeTeacher(p.x + dx, p.y + dy, p.x));
      g.members = [...teachers, boy];
      sc.groups.push(g);
      sc.specials.push(g);
      if (gi === 0) { sc.target = boy; g.jesus = true; }
    }
  } else {
    const role = cfg.cousin ? 'cousin' : 'jesus';
    const p = placeSpecial(34, 70, 100, (x, y) => targetOk(x, y)) || placeSpecial(34, 70, 100, awayFromStart) || { x: WW * 0.7, y: yMax - 60 };
    const boy = makeBoy(p.x, p.y, role, RED_SASH, cfg.cousin ? { name: 'Eli' } : {});
    sc.target = boy; sc.specials.push(boy);
  }
  const tg = sc.target;
  const tgy = tg.y + (cfg.final ? 10 : 0);
  for (let k = 0; k < decoysLeft; k++) {
    const p = placeSpecial(34, 70, 90);
    if (!p) continue;
    const d = decoyLook(cfg.d);
    sc.specials.push(makeBoy(p.x, p.y, 'decoy', d.sash, d));
  }
  for (let k = 0; k < cfg.extras; k++) {
    const p = placeSpecial(40, 76, 80);
    if (!p) continue;
    const e = dressFor(makePerson(p.x, p.y, pick(['man', 'woman', 'woman', 'child', 'elder', 'man'])), L);
    e.anim = true;
    sc.specials.push(e);
  }
  for (const kind of ITEM_TYPES) {
    const p = placeSpecial(36, 30, 90);
    if (!p) continue;
    const it = { type: 'item', kind, x: p.x, y: p.y, w: 36, h: 30, found: false, phase: rand(0, TAU) };
    sc.items.push(it); sc.specials.push(it);
  }

  // 3. People strolling to and fro. One may cross right in front of Him.
  const kinds = ['man', 'man', 'woman', 'woman', 'woman', 'child', 'child', 'elder'];
  for (let k = 0; k < cfg.walkers; k++) {
    let lane = null;
    for (let tries = 0; tries < 80 && !lane; tries++) {
      let y, x0, x1;
      if (k === 0 && cfg.crossing) {
        y = tgy + CROSS_DY; x0 = tg.x - rand(150, 260); x1 = tg.x + rand(150, 260);
      } else {
        y = rand(yMin + 20, yMax - 20); const span = rand(220, 520); x0 = rand(40, WW - 40 - span); x1 = x0 + span;
      }
      x0 = Math.max(30, x0); x1 = Math.min(WW - 30, x1);
      // never pause right in front of Him
      const frontOfHim = y > tgy && y - 74 < tgy;
      if (frontOfHim && (Math.abs(x0 - tg.x) < 80 || Math.abs(x1 - tg.x) < 80)) continue;
      if (x1 - x0 > 120 && laneFree(y, x0, x1) && !inZone(x0, y, 20) && !inZone(x1, y, 20)) lane = { y, x0, x1 };
    }
    if (!lane) continue;
    const w = dressFor(makePerson(rand(lane.x0, lane.x1), lane.y, pick(kinds)), L);
    w.anim = true; w.walker = true;
    w.path = { x0: lane.x0, x1: lane.x1, sp: rand(26, 44), dir: Math.random() < 0.5 ? -1 : 1, wait: rand(0, 2) };
    w.stepT = 0;
    sc.lanes.push(lane); sc.walkers.push(w);
  }

  // 4. A passing crowd (a flock, a string of donkeys or pilgrims) that hides Him for a few seconds
  if (cfg.procession) {
    const y = tgy + PROC_DY;
    const [x0, x1] = laneX(tg.x, 380);
    const kind = L.pass;
    const spacing = kind === 'donkey' ? 72 : kind === 'sheep' ? 40 : 30;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const members = [];
    for (let i = 0; i < cfg.procession; i++) {
      let m;
      if (kind === 'people') m = dressFor(makePerson(x0, y + rand(-4, 4), pick(['man', 'woman', 'elder', 'man', 'woman'])), L);
      else { m = makeAnimal(x0, y + rand(-4, 4), kind); m.dir = dir; }
      m.proc = true; m.hidden = true; m.fade = 0; m.anim = true; m.phase = rand(0, TAU);
      m.blink = 0; m.blinkT = rand(1, 4);
      if (m.type === 'person') m.lx = dir * 0.85;
      members.push(m);
    }
    const sp = 34;
    const pr = { x0, x1, y, dir, sp, spacing, members, tail: (members.length - 1) * spacing, gap: sp * Math.max(4, 9 - cfg.d * 0.4), t: 0 };
    pr.t = rand(0, (x1 - x0 + pr.tail + pr.gap) / sp);
    sc.procession = pr;
    sc.lanes.push({ y, x0, x1 });
  }

  // Flatten groups into individual live people for drawing and tapping
  const live = [];
  for (const s of sc.specials) { if (s.group) live.push(...s.members); else live.push(s); }
  live.push(...sc.walkers);
  if (sc.procession) live.push(...sc.procession.members);
  // (Groups keep their bounding box so the crowd never stands in front of them)
  const blockers = sc.specials;

  // 5. The static crowd and animals
  const people = [];
  const okCrowd = (e) => {
    if (inZone(e.x, e.y, 6)) return false;
    if (blockers.some((s) => inFront(e, s))) return false;
    if (blockers.some((s) => s.group && Math.abs(e.x - s.x) < s.w / 2 && e.y < s.y + 4 && e.y > s.y - s.h)) return false;
    if (live.some((s) => s.type === 'person' && !s.proc && !s.walker && Math.abs(e.x - s.x) < 20 && Math.abs(e.y - s.y) < 14)) return false;
    // keep walkers' lanes clear: no one standing on them or in front of them
    if (sc.lanes.some((l) => e.x > l.x0 - 30 && e.x < l.x1 + 30 && e.y > l.y - 14 && e.y - e.oh < l.y)) return false;
    if (sc.objects.some((o) => hiddenBehind(e, o) || onFootprint(e, o))) return false;
    return true;
  };
  for (let k = 0, placed = 0; k < cfg.crowd * 40 && placed < cfg.crowd; k++) {
    const e = makePerson(rand(30, WW - 30), rand(yMin - 20, yMax), pick(kinds));
    if (!okCrowd(e)) continue;
    if (people.some((q) => ((q.x - e.x) / 25) ** 2 + ((q.y - e.y) / 17) ** 2 < 1)) continue;
    people.push(dressFor(e, L)); placed++;
  }
  const animals = [];
  for (let k = 0, placed = 0; k < cfg.animals * 60 && placed < cfg.animals; k++) {
    const kind = L.beasts[placed % L.beasts.length];
    const a = makeAnimal(rand(60, WW - 60), rand(yMin, yMax), kind);
    if (!okCrowd(a)) continue;
    if ([...people, ...animals].some((q) => Math.abs(q.x - a.x) < (q.w + a.w) / 2 - 8 && Math.abs(q.y - a.y) < 22)) continue;
    animals.push(a); placed++;
  }
  sc.statics = [...sc.objects, ...people, ...animals].sort((a, b) => a.y - b.y);
  sc.live = live;

  // 6. The "three days": long enough for a careful screen-by-screen search on a phone,
  //    and a little stricter as the journey goes on (at least cfg.minTime seconds)
  const screens = Math.ceil(WW / 460) * Math.ceil((sc.WH - sc.top + 60) / 760);
  const nPeople = people.length + live.filter((e) => e.type === 'person').length;
  const perScreen = 2.1 + 0.12 * (nPeople / screens);
  sc.searchTime = screens * perScreen + (sc.procession ? 8 : 0);
  cfg.time = Math.round(Math.max(cfg.minTime, sc.searchTime * cfg.timeFactor));

  scene = sc;
  prerender();
}

// Walkers stroll their lanes; the passing crowd loops along its lane in front of Him
function updateMovers(dt) {
  if (!scene) return;
  for (const w of scene.walkers) {
    const m = w.path;
    if (m.wait > 0) { m.wait -= dt; continue; }
    w.x += m.dir * m.sp * dt; w.stepT += dt;
    if (w.x > m.x1) { w.x = m.x1; m.dir = -1; m.wait = rand(0.8, 2.5); }
    else if (w.x < m.x0) { w.x = m.x0; m.dir = 1; m.wait = rand(0.8, 2.5); }
    w.lx = m.dir * 0.85; w.ly = 0;
  }
  const pr = scene.procession;
  if (pr) {
    pr.t += dt;
    const span = pr.x1 - pr.x0, loop = span + pr.tail + pr.gap;
    const head = (pr.t * pr.sp) % loop;
    pr.members.forEach((m, i) => {
      const along = head - i * pr.spacing;
      const inLane = along >= 0 && along <= span;
      m.x = pr.dir > 0 ? pr.x0 + along : pr.x1 - along;
      m.hidden = !inLane;
      m.fade = inLane ? clamp(Math.min(along, span - along) / 50, 0, 1) : 0;
    });
  }
}

// How much of the boy can be seen right now (0..1): nobody may hide Him for long
function coversPoint(e, x, y) {
  if (e.type === 'person') return Math.abs(x - e.x) < 17 * e.s && y > e.y - e.h && y < e.y;
  if (e.type === 'animal') return Math.abs(x - e.x) < e.w / 2 && y > e.y - e.h * 0.85 && y < e.y;
  if (e.type === 'object') return Math.abs(x - e.x) < e.ow / 2 && y > e.y - e.oh && y < e.y;
  return false;
}
function targetVisibility() {
  const tg = scene.target;
  const s = tg.s, top = tg.y - (tg.sit ? 56 : 72) * s;
  const front = scene.live.concat(scene.statics).filter((e) => e !== tg && e.y > tg.y && !e.hidden && !(e.proc && e.fade < 0.3));
  let vis = 0, n = 0;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 8; j++) {
    const px = tg.x + (i / 4 - 0.5) * 24 * s, py = top + (j / 7) * (tg.y - top);
    n++;
    if (!front.some((e) => coversPoint(e, px, py))) vis++;
  }
  return vis / n;
}

// Pre-render the backdrop and static crowd once per level so panning stays smooth
function wantRes() {
  if (!scene) return 1;
  return Math.min(scale * 1.25, Math.sqrt(12e6 / (scene.WW * scene.WH)));
}
function prerender() {
  const sc = scene;
  const res = wantRes();
  const c = sc.bg || document.createElement('canvas');
  c.width = Math.round(sc.WW * res); c.height = Math.round(sc.WH * res);
  const prev = ctx;
  ctx = c.getContext('2d');
  ctx.setTransform(res, 0, 0, res, 0, 0);
  drawBackdrop(sc);
  for (const e of sc.statics) drawEntity(e);
  ctx = prev;
  sc.bg = c; sc.res = res;
}

// ============================================================
//  Camera
// ============================================================
function clampZoom() {
  if (!scene) return;
  zMin = clamp(Math.max(viewW / (scene.WW + 80), viewH / (scene.WH + 240)), 0.45, 1);
  cam.z = clamp(cam.z, zMin, ZOOM_MAX);
}
function clampCam() {
  if (!scene) return;
  const vw = viewW / cam.z, vh = viewH / cam.z;
  // a cut-scene may look past the edges so the family can be centred
  const loose = state === 'found' || state === 'win';
  const mx = (loose ? viewW * 0.4 : 40) / cam.z, mt = 120 / cam.z, mb = (loose ? viewH * 0.4 : 120) / cam.z;
  if (vw >= scene.WW + 2 * mx) cam.x = (scene.WW - vw) / 2;
  else cam.x = clamp(cam.x, -mx, scene.WW + mx - vw);
  if (vh >= scene.WH + mt + mb) cam.y = (scene.WH - vh) / 2;
  else cam.y = clamp(cam.y, -mt, scene.WH + mb - vh);
}
function centerOn(x, y) {
  cam.x = x - viewW / cam.z / 2;
  cam.y = y - viewH / cam.z / 2;
  clampCam();
}
function zoomAt(sx, sy, f) {
  const wx = cam.x + sx / cam.z, wy = cam.y + sy / cam.z;
  cam.z = clamp(cam.z * f, zMin, ZOOM_MAX);
  cam.x = wx - sx / cam.z; cam.y = wy - sy / cam.z;
  clampCam();
}
const worldToScreen = (x, y) => ({ x: (x - cam.x) * cam.z, y: (y - cam.y) * cam.z });
// For tests and tools: page (CSS pixel) coordinates of a world point
function worldToClient(x, y) {
  const s = worldToScreen(x, y);
  return { x: s.x * scale / dpr, y: s.y * scale / dpr };
}

// ============================================================
//  Particles and floating text
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function addFloat(x, y, text, color) { floats.push({ x, y, text, color, t: 1.4 }); }
function sparkle(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 170);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.4), cols[i % cols.length], rand(2, 4.5), 40);
  }
}
function say(who, text, dur = 2.2) {
  bubbles = bubbles.filter((b) => b.who !== who);
  bubbles.push({ who, text, t: dur });
}

// ============================================================
//  Tapping: checking people
// ============================================================
function hitPerson(e, x, y) {
  if (e.type === 'person') {
    const s = e.s;
    return Math.abs(x - e.x) < 17 * s + 3 && y < e.y + 3 && y > e.y - (e.sit ? 64 : 72) * s;
  }
  if (e.type === 'animal') return Math.abs(x - e.x) < e.w / 2 && y < e.y && y > e.y - e.h * 0.9;
  return false;
}

function checkAt(x, y) {
  if (state !== 'play' || !scene) return;
  // Tapping wildly doesn't work: too many taps too fast and you must wait a moment
  if (lockT > 0) { sfx.bounce(); return; }
  tapTimes = tapTimes.filter((q) => t - q < 2);
  tapTimes.push(t);
  if (tapTimes.length >= cfg.spam) {
    tapTimes = [];
    lockT = 2.5;
    timeLeft -= 3; lastPenalty = 3; penaltyT = 1.2;
    showMessage('Whoa, slow down! Look carefully first.');
    sfx.wrong();
    return;
  }
  // bonus items first (they are small and sit on top)
  for (const it of scene.items) {
    if (!it.found && Math.hypot(x - it.x, y - (it.y - 10)) < 24) { collectItem(it); return; }
  }
  // live people are drawn on top of the pre-rendered crowd
  let hit = null;
  for (const e of scene.live) if (e.type === 'person' && !e.hidden && !(e.proc && e.fade < 0.3) && hitPerson(e, x, y) && (!hit || e.y > hit.y)) hit = e;
  if (!hit) for (const e of scene.statics) if (hitPerson(e, x, y) && (!hit || e.y > hit.y)) hit = e;
  if (!hit) { sfx.puff(0.12); return; }
  if (hit === scene.target) { foundHim(); return; }
  if (hit.type === 'animal') {
    react(hit, pick({ sheep: ['Baa!', 'Baa-aa?'], goat: ['Mehh!', 'Meh-eh-eh!'], camel: ['Hrrmph!', 'Grumble...'], donkey: ['Hee-haw!', 'Hee-HAW!'], chicken: ['Bawk!', 'Cluck?'] }[hit.kind]), null);
    sfx.bounce();
    return;
  }
  // Wrong person: a funny reaction and a few seconds lost
  wrongTaps++;
  timeLeft -= cfg.wrongCost;
  lastPenalty = cfg.wrongCost;
  penaltyT = 1.2;
  addFloat(hit.x, hit.y - hit.h - 10, `-${cfg.wrongCost}s`, '#c92a2a');
  react(hit, reactionLine(hit), pick(hit.kind === 'boy' || hit.kind === 'child' ? ['shock', 'joy', 'wow'] : hit.kind === 'elder' ? ['doubt', 'shock'] : ['shock', 'wow', 'doubt']));
  sfx.wrong();
}

function react(e, text, mood) {
  e.react = { t: 1.8, mood };
  say(e, text, 1.9);
  if (!e.anim && !(scene.live || []).includes(e) && !reacting.includes(e)) {
    // a static person is redrawn live while reacting, along with anyone standing in front of them
    e.occluders = scene.statics.filter((o) => o !== e && inFront(o, { x: e.x, y: e.y, w: e.w }));
    reacting.push(e);
  }
}

function reactionLine(e) {
  const n = e.name;
  if (e.kind === 'boy') {
    const lines = [`I'm not Him, I'm ${n}!`, 'Tee-hee! Wrong boy!'];
    if (!e.sash) lines.push(`Look, no sash! I'm ${n}.`);
    else if (e.sash !== RED_SASH) lines.push(`See? My sash is ${SASH_NAMES[e.sash] || 'not red'}!`);
    if (e.robe !== WHITE) lines.push("My robe's cream, not white!");
    if (e.hair !== JESUS_HAIR) lines.push('Look at my hair! Not brown!');
    if (!e.scroll) lines.push('No scroll in my hand, see?');
    if (e.sash && !e.knot) lines.push('My sash has no knot!');
    if (e.sunhat) lines.push("It's only my sunhat!");
    if (e.brass) lines.push("That's a brass pot, not a halo!");
    return pick(lines);
  }
  if (e.teacher) return pick(['Hush! We are listening!', `I'm Rabbi ${n}, not a boy!`, 'Do I look twelve to you?']);
  const lines = [`I'm not Him, I'm ${n}!`];
  if (e.kind === 'child') lines.push(`I'm ${n}! Want to play?`, "Tag, you're it!", 'No red sash on me!');
  if (e.kind === 'man') lines.push('Do I look twelve to you?', 'Beard! See? A beard!', `Sorry, I'm ${n} the ${pick(TRADES)}.`, 'Mind my figs!');
  if (e.kind === 'woman') lines.push('Goodness, you made me jump!', "I'm somebody's auntie, dear!", `Not me, dear. I'm ${n}.`);
  if (e.kind === 'elder') lines.push('Eh? Twelve? I was, once!', `At my age? I'm old ${n}!`);
  return pick(lines);
}

function collectItem(it) {
  it.found = true;
  itemsFound.push(it.kind);
  addFloat(it.x, it.y - 34, `+200 ${ITEM_NAMES[it.kind]}!`, '#2b8a3e');
  sparkle(it.x, it.y - 12, 26);
  sfx.item(itemsFound.length / 3);
}

function useHint() {
  if (state !== 'play' || hintsLeft <= 0 || hintT > 0) return;
  hintsLeft--;
  hintT = 3;
  const tg = scene.target;
  const a = rand(0, TAU), r = rand(0, cfg.hintR * 0.45);
  hintC = { x: tg.x + Math.cos(a) * r, y: tg.y - 30 + Math.sin(a) * r * 0.7 };
  sfx.hint();
}

// ============================================================
//  Finding Him: the cut-scenes
// ============================================================
const CUTS = {
  cousin:  [1.3, 3.0, 3.6],            // zoom, cousin speaks + parents arrive, back to Jerusalem
  glimpse: [1.5, 2.2, 3.4],            // zoom, a flock of sheep passes, a clue
  final:   [3.0, 2.2, 5.2, 4.6, 4.2],  // zoom + astonished, parents arrive, Mary, Jesus, hug
};

function foundHim() {
  const tg = scene.target;
  state = 'found';
  mag.on = false;
  hintT = 0;
  bubbles = [];
  message.t = 0; msgQueue = []; caption = null;
  const kind = cfg.cousin ? 'cousin' : cfg.final ? 'final' : 'glimpse';
  cut = { kind, beat: 0, t: 0, total: 0, tx: tg.x, ty: tg.y, actors: [], flock: [], jesusA: 1 };
  // camera: zoom in on Him
  cut.z = clamp(Math.min(viewW / 340, viewH / 360), 1.05, 2);
  cut.cx = tg.x - (kind === 'glimpse' ? 0 : 50);
  cut.cy = tg.y - 70;
  // score for this level, frozen now
  const timeBonus = Math.round(Math.max(0, timeLeft) * 10);
  const sharpBonus = wrongTaps === 0 ? 500 : 0;              // challenge: no wrong taps
  const treasureBonus = itemsFound.length === 3 ? 500 : 0;   // challenge: all three hidden items
  const hintBonus = hintsLeft * 150;
  const itemBonus = itemsFound.length * 200;
  const levelBonus = level * 250;
  const score = timeBonus + sharpBonus + treasureBonus + hintBonus + itemBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('boyJesusBest', best); } catch (e) {} }
  lastScore = { timeBonus, sharpBonus, treasureBonus, hintBonus, itemBonus, levelBonus, score, wrong: wrongTaps, items: itemsFound.length };

  sparkle(tg.x, tg.y - 40, 40);
  sfx.found();
  if (kind === 'cousin' || kind === 'final') {
    const m = { ...MARY, x: tg.x - 430, y: tg.y + (kind === 'final' ? 34 : 14), mood: 'worried', walk: 0 };
    const j = { ...JOSEPH, x: tg.x - 490, y: tg.y + (kind === 'final' ? 30 : 10), mood: 'worried', walk: 0 };
    cut.mary = m; cut.joseph = j;
    cut.actors.push(m, j);
  }
  if (kind === 'glimpse') {
    // a helpful passer-by: the nearest grown-up in the crowd
    let near = null, nd = 1e9;
    for (const e of scene.statics) {
      if (e.type !== 'person' || e.kind === 'child') continue;
      const d = Math.hypot(e.x - tg.x, e.y - tg.y);
      if (d > 60 && d < nd) { nd = d; near = e; }
    }
    cut.helper = near;
    if (near) {
      near.occluders = scene.statics.filter((o) => o !== near && inFront(o, { x: near.x, y: near.y, w: near.w }));
      cut.helperEnt = near;
    }
  }
  if (kind === 'final') for (const g of scene.groups) if (g.jesus) cut.group = g;
  enterBeat();
}

function enterBeat() {
  const c = cut, tg = scene.target;
  const b = c.beat;
  if (c.kind === 'cousin') {
    if (b === 1) {
      say(tg, "I'm cousin Eli! Isn't Jesus with you?", 3.2);
      c.mary.goal = tg.x - 70; c.joseph.goal = tg.x - 118;
    } else if (b === 2) {
      c.mary.mood = 'worried';
      say(c.joseph, "He's not with the caravan... Back to Jerusalem!", 3.4);
      caption = { key: 'turnedBack', t: 3.6, where: 'bottom' };
    }
  } else if (c.kind === 'glimpse') {
    if (b === 0) say(tg, pick(['!', '...']), 1);
    if (b === 1) {
      const kind = cfg.L.pass;
      const gapX = kind === 'donkey' ? 80 : kind === 'people' ? 34 : 42;
      for (let k = 0; k < 7; k++) {
        const f = { x: tg.x - 360 - k * gapX - rand(0, 16), y: tg.y + 16 + rand(-8, 8), dir: 1, ph: rand(0, TAU), kind };
        if (kind === 'people') { f.ent = makePerson(f.x, f.y, pick(['man', 'woman', 'elder', 'man'])); f.ent.lx = 0.9; }
        if (kind === 'donkey') f.ent = { ...makeAnimal(f.x, f.y, 'donkey'), dir: 1 };
        c.flock.push(f);
      }
      sfx.bounce();
    } else if (b === 2) {
      const text = `${pick(['A boy in white with a red sash?', 'The boy in white?', 'A twelve-year-old with a scroll?'])} He went ${cfg.L.where}!`;
      if (c.helper) say(c.helper, text, 3.4);
      else showMessage(text);
    }
  } else {
    const g = c.group;
    if (b === 0) {
      for (const m of g.members) if (m.teacher) m.cutMood = 'wow';
      tg.cutMood = 'talk';
      caption = { key: 'astonished', t: 5, where: 'bottom' };
    } else if (b === 1) {
      c.mary.goal = tg.x - 96; c.joseph.goal = tg.x - 150;
      tg.cutMood = 'watch';
    } else if (b === 2) {
      c.mary.mood = 'worried'; c.joseph.mood = 'worried';
      tg.lx = -0.9; tg.ly = 0.1;
      say(c.mary, verseText('sorrowing'), 5.2);
    } else if (b === 3) {
      tg.sit = false; sizePerson(tg);
      tg.y = c.ty + 16;
      tg.cutMood = 'talk';
      say(tg, verseText('wistYe'), 4.6);
    } else if (b === 4) {
      bubbles = [];
      tg.cutMood = 'hug'; tg.hugDir = -1;
      c.mary.goal = tg.x - 30; c.joseph.goal = tg.x - 64;
      c.mary.mood = 'hug'; c.joseph.mood = 'hug';
      c.mary.hugDir = 1; c.joseph.hugDir = 1;
      c.mary.y = tg.y + 8; c.joseph.y = tg.y + 2;
      for (const m of g.members) if (m.teacher) m.cutMood = 'joy';
      showMessage('Together again!');
      sfx.win();
      sparkle(tg.x - 20, tg.y - 50, 60, ['#ffe27a', '#fff6d0', '#ffd1e8', '#ff8fab']);
    }
  }
}

function updateCut(dt) {
  const c = cut;
  // camera glides in
  const k = Math.min(1, dt * 2.5);
  const ccx = cam.x + viewW / cam.z / 2, ccy = cam.y + viewH / cam.z / 2;
  cam.z = lerp(cam.z, c.z, k);
  centerOn(lerp(ccx, c.cx, k), lerp(ccy, c.cy, k));

  for (const a of c.actors) {
    if (a.goal === undefined) continue;
    const d = a.goal - a.x;
    if (Math.abs(d) > 1) { a.x += Math.sign(d) * Math.min(Math.abs(d), 190 * dt); a.walk += dt; }
    else a.walk = 0;
  }
  if (c.flock.length) {
    for (const f of c.flock) f.x += 300 * dt;
    if (c.flock[0].x > c.tx - 40) c.jesusA = Math.max(0, c.jesusA - dt * 2);
    if (Math.random() < dt * 20) { const f = pick(c.flock); spawn(f.x - 20, f.y - 4, rand(-30, 0), rand(-30, -10), 0.8, 'rgba(210,190,150,0.8)', rand(4, 8)); }
  }
  if (c.kind === 'final' && c.beat === 4 && Math.random() < dt * 8) {
    spawn(c.tx + rand(-70, 40), c.ty - rand(20, 90), rand(-10, 10), -30, 1.2, pick(['#ff8fab', '#ffe27a', '#fff6d0']), rand(2.5, 4));
  }

  c.t += dt;
  const beats = CUTS[c.kind];
  if (c.t >= beats[c.beat]) nextBeat();
}

function nextBeat() {
  const c = cut;
  if (!c) return;
  c.t = 0;
  c.beat++;
  if (c.beat >= CUTS[c.kind].length) { finishLevel(); return; }
  enterBeat();
}

function skipBeat() { if (cut && cut.t > 0.5) nextBeat(); }

function finishLevel() {
  state = 'win';
  syncAmbience();
  endKind = cut.kind;
  endTimer = 0.3;
}

function failLevel() {
  state = 'fail';
  syncAmbience();
  timeLeft = 0;
  mag.on = false;
  sfx.fail();
  showMessage('Oh... no!');
  endTimer = 1.6;
}

function showMessage(text) { message = { text, t: 2.4 }; msgQueue = []; }
function queueMessage(text) { msgQueue.push(text); }

// ============================================================
//  Card pictures: Mary and Joseph drawn into the overlay cards
// ============================================================
function portraitHTML(kind) {

  g.addColorStop(1, night ? '#8a7fb0' : '#e8f5fb');

    ctx.fillStyle = night ? '#6d6a8e' : '#b7d39a';

    ctx.fillStyle = night ? '#9c8c78' : '#e6d19c'; ctx.fillRect(0, 78, 280, 37);

  }
  const P = (base, x, y, s, mood, o = {}) => drawPerson({ ...base, x, y, s }, { mood, still: true, ...o });
  if (kind === 'title') {
    const t1 = { ...makeTeacher(0, 0, 1), i: 3 }, t2 = { ...makeTeacher(0, 0, -1), i: 4 };
    t1.lx = 0.9; t2.lx = -0.9;

    P(boy, 150, 101, 1.02, 'hug', { hugDir: 0 });

    P({ ...JOSEPH, i: 4 }, 166, 104, 1, kind === 'dismay' ? 'dismay' : 'worried', { lx: -0.3, ly: -0.2 });
  }
  ctx = prev;
  return `<img class="pic" src="${c.toDataURL()}" alt="">`;
}

const keys = new Set();
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'found' && (e.code === 'Enter' || e.code === 'Space') && !e.repeat) { skipBeat(); return; }
  if (state === 'play' && !e.repeat) {
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') {
      // first press shows the magnifier; pressing again checks whoever is under it
      if (!mag.on) {
        mag.on = true;
        mag.x = cam.x + viewW / cam.z / 2; mag.y = cam.y + viewH / cam.z / 2;
      } else checkAt(mag.x, mag.y);
      mag.idle = 0;
      return;
    }
    if (e.code === 'KeyX' || e.code === 'Backspace') { mag.on = false; return; }
    if (e.code === 'KeyH') { useHint(); return; }
    if (e.code === 'Equal' || e.code === 'NumpadAdd') { zoomAt(viewW / 2, viewH / 2, 1.2); return; }
    if (e.code === 'Minus' || e.code === 'NumpadSubtract') { zoomAt(viewW / 2, viewH / 2, 1 / 1.2); return; }
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toScreen(e) {
  return { x: e.clientX * dpr / scale, y: e.clientY * dpr / scale };
}

// Touch and mouse: drag to pan, tap to check, two fingers to pinch-zoom
const pointers = new Map();
let pinch = null;

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toScreen(e);
  if (pointers.size === 0) {
    for (const b of hudButtons()) {
      if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 6) { b.action(); return; }
    }
    if (state === 'play') {
      const hb = hintButton();
      if (Math.hypot(p.x - hb.x, p.y - hb.y) < hb.r + 6) { useHint(); return; }
    }
  }
  if (state === 'found') { skipBeat(); return; }
  if (state !== 'play') return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    a.moved = b.moved = true;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, wx: cam.x + mx / cam.z, wy: cam.y + my / cam.z };
  }
});

canvas.addEventListener('pointermove', (e) => {
  const q = pointers.get(e.pointerId);
  if (!q) return;
  const p = toScreen(e);
  if (pinch && pointers.size >= 2) {
    q.x = p.x; q.y = p.y;
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.z = clamp(pinch.z * d / pinch.d, zMin, ZOOM_MAX);
    cam.x = pinch.wx - mx / cam.z; cam.y = pinch.wy - my / cam.z;
    clampCam();
    return;
  }
  const dx = p.x - q.x, dy = p.y - q.y;
  if (!q.moved && Math.hypot(p.x - q.sx, p.y - q.sy) * scale / dpr > 9) q.moved = true;
  if (q.moved) {
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    clampCam();
  }
  q.x = p.x; q.y = p.y;
});

function endPointer(e, cancelled) {
  const q = pointers.get(e.pointerId);
  if (!q) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 1) for (const r of pointers.values()) r.moved = true;   // leftover finger after a pinch
  if (cancelled || q.moved || state !== 'play') return;
  const wx = cam.x + q.x / cam.z, wy = cam.y + q.y / cam.z;
  ripples.push({ x: wx, y: wy, t: 0 });
  mag.on = false;
  checkAt(wx, wy);
}
canvas.addEventListener('pointerup', (e) => { sfx.init(); endPointer(e, false); });
canvas.addEventListener('pointercancel', (e) => endPointer(e, true));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (state !== 'play' || !scene) return;
  const p = toScreen(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });
