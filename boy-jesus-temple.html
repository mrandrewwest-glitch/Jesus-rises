const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // extra effects for this game
  wrong() { this.tone(330, 0.12, 'triangle', 0.25, 0, 260); this.tone(260, 0.2, 'triangle', 0.22, 0.1, 180); },
  item(h) { this.tap(0.4 + h * 0.6); this.tone(1320, 0.3, 'sine', 0.12, 0.08); },
  hint() { [880, 1108, 1320, 1760].forEach((f, i) => this.tone(f, 0.35, 'sine', 0.1, i * 0.06)); },
  found() { [587, 740, 880, 1175].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.16, i * 0.08)); this.puff(0.2); },
};

// ============================================================
//  Rendering
// ============================================================
function dayInfo() {
  const f = clamp((cfg.time - Math.max(0, timeLeft)) / cfg.time, 0, 1) * 3;
  const day = Math.min(3, Math.floor(f) + 1);
  const p = f >= 3 ? 0.999 : f % 1;
  // night falls in the last part of each day
  let night = 0;
  if (p > 0.62 && p < 0.72) night = (p - 0.62) / 0.1;
  else if (p >= 0.72 && p < 0.92) night = 1;
  else if (p >= 0.92) night = 1 - (p - 0.92) / 0.08;
  return { day, p, night };
}

// Draws the world (pre-rendered crowd + live people) with the top-left at (cx, cy) and zoom z
function drawWorld(cx, cy, z) {
  const sc = scene;
  ctx.setTransform(scale * z, 0, 0, scale * z, -cx * z * scale, -cy * z * scale);
  const vw = viewW / z, vh = viewH / z;
  ctx.fillStyle = cfg.L.edge; ctx.fillRect(cx, cy, vw, vh);
  if (cy < 0) { ctx.fillStyle = cfg.L.sky; ctx.fillRect(cx, cy, vw, -cy); }
  // only copy the visible part of the pre-rendered bitmap
  const x0 = clamp(cx, 0, sc.WW), y0 = clamp(cy, 0, sc.WH);
  const x1 = clamp(cx + vw, 0, sc.WW), y1 = clamp(cy + vh, 0, sc.WH);
  if (x1 > x0 && y1 > y0) {
    const r = sc.res;
    ctx.drawImage(sc.bg, x0 * r, y0 * r, (x1 - x0) * r, (y1 - y0) * r, x0, y0, x1 - x0, y1 - y0);
  }
  const visible = (e, m = 140) => e.x > cx - m && e.x < cx + vw + m && e.y > cy - 40 && e.y < cy + vh + m * 1.5;

  // statics currently reacting (plus anyone standing in front of them)
  for (const e of reacting) {
    if (!visible(e)) continue;
    const hop = 6 * Math.max(0, Math.sin(e.react.t * 12));
    drawEntity(e, { mood: e.react.mood || 'watch', pop: 1.06, hop, jump: e.type === 'person' ? hop * 0.4 : 0 });
    for (const o of e.occluders) drawEntity(o);
  }
  if (cut && cut.helperEnt && cut.beat >= 2) {
    const e = cut.helperEnt;
    drawEntity(e, { mood: 'talk', pop: 1.05 });
    for (const o of e.occluders) drawEntity(o);
  }

  // live people, sorted by depth
  // in a family cut-scene the boy, Mary and Joseph are drawn last, in front of any bystanders
  const focal = (e) => (cut && cut.kind !== 'glimpse' && (e === sc.target || cut.actors.includes(e)) ? 1e5 : 0);
  const list = [...sc.live, ...(cut ? cut.actors : [])].sort((a, b) => a.y + focal(a) - b.y - focal(b));
  for (const e of list) {
    if (!visible(e)) continue;
    if (e.type === 'item') {
      if (e.found) continue;
      drawItemShape(e.kind, e.x, e.y, 1);
      continue;
    }
    if (e.hidden) continue;
    if (e.type === 'animal') {
      ctx.globalAlpha = e.fade !== undefined ? e.fade : 1;
      drawAnimal(e, { hop: Math.abs(Math.sin(t * 10 + e.phase)) * 3 });
      ctx.globalAlpha = 1;
      continue;
    }
    const o = { headBob: Math.sin(t * 2.2 + e.phase) * 1.3 };
    if (e.path && e.path.wait <= 0) o.jump = Math.abs(Math.sin(e.stepT * 9)) * 3;
    if (e.proc) { o.alpha = e.fade; o.jump = Math.abs(Math.sin(t * 9 + e.phase)) * 3; }
    if (e.react) o.mood = e.react.mood, o.pop = 1.04;
    if (e.cutMood) o.mood = e.cutMood;
    if (e.mood) o.mood = e.mood;
    if (e.hugDir) o.hugDir = e.hugDir;
    if (e.walk) o.jump = Math.abs(Math.sin(e.walk * 10)) * 4;
    if (cut && e === sc.target) {
      if (cut.kind === 'glimpse') { o.alpha = cut.jesusA; if (cut.beat === 0) o.mood = 'wave'; }
      if (cut.kind === 'cousin' && cut.beat >= 1) o.mood = 'joy';
      if (cut.kind === 'final') o.halo = Math.max(e.halo, 0.9);
    }
    if (o.alpha === 0) continue;
    drawPerson(e, o);
  }
  // the flock of sheep that hurries past in a glimpse
  if (cut) for (const f of cut.flock) {
    const bob = Math.abs(Math.sin(t * 14 + f.ph)) * 4;
    if (f.ent) { f.ent.x = f.x; f.ent.y = f.y; drawEntity(f.ent, { jump: bob, hop: bob }); }
    else drawSheep(f.x, f.y - bob, 1, 1, false);
  }

  // hint glow
  if (hintT > 0) {
    const a = cfg.hintA * (0.65 + 0.35 * Math.sin(t * 7)) * Math.min(1, hintT / 0.5);
    const g = ctx.createRadialGradient(hintC.x, hintC.y, 10, hintC.x, hintC.y, cfg.hintR);
    g.addColorStop(0, `rgba(255,230,120,${a})`);
    g.addColorStop(0.7, `rgba(255,230,120,${a * 0.4})`);
    g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(hintC.x, hintC.y, cfg.hintR, 0, TAU); ctx.fill();
  }
  drawParticles();
}

function drawBubble(sx, sy, text, maxW = 250) {
  ctx.font = '600 15px Fredoka, sans-serif';
  const words = text.split(' ');
  const lines = [];
  let line = '';
  const mw = Math.min(maxW, viewW - 40);
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > mw && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  const lh = 19, pad = 10;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + pad * 2;
  const h = lines.length * lh + pad * 2 - 4;
  const bx = clamp(sx - w / 2, 10, viewW - w - 10);
  let by = sy - h - 14;
  if (by < 104) by = 104;
  ctx.fillStyle = 'rgba(255,253,244,0.97)'; ctx.strokeStyle = '#c9a13a'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  // tail toward the speaker
  const tx = clamp(sx, bx + 14, bx + w - 14);
  if (sy > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(sx, Math.min(sy, by + h + 14)); ctx.lineTo(tx + 8, by + h - 1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillRect(tx - 7, by + h - 3, 14, 3);
  }
  ctx.fillStyle = '#4a3512'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh));
  ctx.textBaseline = 'alphabetic';
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawCaption() {
  if (!caption || caption.t <= 0) return;
  const v = Bible.verse(VERSES[caption.key]);
  ctx.save();
  ctx.globalAlpha = clamp(caption.t / 0.5, 0, 1);
  const maxW = Math.min(560, viewW - 40);
  ctx.font = 'italic 600 16px Fredoka, sans-serif';
  const lines = wrapText(`"${v.text}"`, maxW - 28);
  const h = lines.length * 21 + 36;
  const x = (viewW - maxW) / 2;
  const y = caption.where === 'top' ? 112 : viewH - h - 18;
  ctx.fillStyle = 'rgba(255,252,240,0.93)'; ctx.strokeStyle = 'rgba(224,165,38,0.7)'; ctx.lineWidth = 2.5;
  roundRect(x, y, maxW, h, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a5530'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, viewW / 2, y + 10 + i * 21));
  ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a3a';
  ctx.fillText(`— ${v.cite}`, viewW / 2, y + 12 + lines.length * 21);
  ctx.restore();
}

function drawHUDButton(b) {
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
  if (b.icon === 'home') {
    ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
    ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
  } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
  else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
    ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
    ctx.beginPath();
    if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
    else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
    ctx.stroke();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const playing = state === 'play' || state === 'pause' || state === 'found' || state === 'win' || state === 'fail';
  const title = playing ? `Level ${level} · ${cfg.name}` : 'Where Is Jesus?';

  // Left: level name and score on a soft panel
  let fs = 17;
  ctx.font = `700 ${fs}px Fredoka, sans-serif`;
  while (fs > 12 && ctx.measureText(title).width > viewW - 160) { fs--; ctx.font = `700 ${fs}px Fredoka, sans-serif`; }
  const tw = Math.max(ctx.measureText(title).width, 120);
  ctx.fillStyle = 'rgba(255,252,240,0.82)';
  roundRect(4, 5, tw + 18, 52, 12); ctx.fill();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.fillText(title, 12, 26);
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillText(playing ? `Score ${totalScore}  ·  Wrong taps ${wrongTaps}` : (best ? `Best ${best}` : 'Luke 2:41–52'), 12, 47);

  for (const b of hudButtons()) drawHUDButton(b);

  if (playing && scene) {
    // Bonus items tray
    ITEM_TYPES.forEach((k, i) => {
      const x = 146 + i * 36, y = 84;
      const got = itemsFound.includes(k);
      ctx.fillStyle = got ? 'rgba(255,240,180,0.95)' : 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
      ctx.globalAlpha = got ? 1 : 0.4;
      drawItemShape(k, x - 1, y + (k === 'lamb' ? 8 : 8), k === 'lamb' ? 0.85 : 0.9);
      ctx.globalAlpha = 1;
      if (got) {
        ctx.strokeStyle = '#2b8a3e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x + 5, y + 9); ctx.lineTo(x + 9, y + 13); ctx.lineTo(x + 16, y + 3); ctx.stroke();
      }
    });

    // Right: three days as a sun and moon crossing the sky
    const di = dayInfo();
    const pw = 124, ph = 66, px = viewW - pw - 8, py = 6;
    const sky = ctx.createLinearGradient(0, py, 0, py + ph);
    const n = di.night;
    sky.addColorStop(0, n > 0.5 ? '#2e3b78' : '#7cc3f0');
    sky.addColorStop(1, n > 0.5 ? '#6c63a8' : '#fff0c2');
    ctx.fillStyle = sky;
    roundRect(px, py, pw, ph, 12); ctx.fill();
    ctx.save(); roundRect(px, py, pw, ph, 12); ctx.clip();
    ctx.fillStyle = n > 0.5 ? '#4b5a3a' : '#9cc47a';
    ctx.beginPath(); ctx.ellipse(px + pw / 2, py + ph + 6, pw * 0.7, 18, 0, 0, TAU); ctx.fill();
    const isNight = di.p >= 0.7;
    const u = isNight ? (di.p - 0.7) / 0.3 : di.p / 0.7;
    const ang = Math.PI + u * Math.PI;
    const ox = px + pw / 2 + Math.cos(ang) * (pw / 2 - 16), oy = py + ph - 8 + Math.sin(ang) * (ph - 24);
    if (isNight) {
      ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(ox, oy, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = n > 0.5 ? '#2e3b78' : '#7cc3f0'; ctx.beginPath(); ctx.arc(ox + 4, oy - 3, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; for (const [sx, sy] of [[14, 14], [40, 22], [96, 12], [110, 30]]) ctx.fillRect(px + sx, py + sy, 2, 2);
    } else {
      ctx.fillStyle = '#ffd43b'; ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(ox, oy, 9, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.restore();
    ctx.textAlign = 'right';
    ctx.font = '700 15px Fredoka, sans-serif';
    const low = timeLeft < 12 && state === 'play';
    const txt = `Day ${di.day} of 3`;
    ctx.fillStyle = 'rgba(255,252,240,0.82)';
    roundRect(viewW - 112, py + ph + 4, 104, 24, 10); ctx.fill();
    ctx.fillStyle = low && Math.sin(t * 10) > 0 ? '#c92a2a' : '#5a4210';
    ctx.fillText(txt, viewW - 18, py + ph + 22);
    if (penaltyT > 0) {
      ctx.globalAlpha = Math.min(1, penaltyT);
      ctx.fillStyle = '#c92a2a'; ctx.font = '700 16px Fredoka, sans-serif';
      ctx.fillText(`-${lastPenalty}s`, viewW - 18, py + ph + 46 - (1.2 - penaltyT) * 10);
      ctx.globalAlpha = 1;
    }
  }

  if (state === 'play' && scene) {
    // Bottom-left: who to look for
    const fx = 8, fh = 110, fy = viewH - fh - 8;
    ctx.fillStyle = 'rgba(255,252,240,0.88)'; ctx.strokeStyle = 'rgba(224,165,38,0.7)'; ctx.lineWidth = 2;
    roundRect(fx, fy, 82, fh, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a5530'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('FIND HIM', fx + 41, fy + 16);
    const tg = scene.target;
    const clip = { ...tg, x: fx + 41, y: fy + fh - 8, s: 0.95, sit: false, react: null };
    drawPerson(clip, { mood: 'watch', lx: 0, ly: 0, halo: tg.halo, headBob: Math.sin(t * 2) * 1 });

    // Bottom-right: hint button
    const hb = hintButton();
    const on = hintsLeft > 0;
    const hg = ctx.createLinearGradient(0, hb.y - hb.r, 0, hb.y + hb.r);
    hg.addColorStop(0, on ? '#f7c948' : '#d6d0c0'); hg.addColorStop(1, on ? '#d9961c' : '#b0a890');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(hb.x, hb.y, hb.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(hb.x - 4, hb.y - 6, 10, 0, TAU); ctx.moveTo(hb.x + 3, hb.y + 1); ctx.lineTo(hb.x + 11, hb.y + 9); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 12px Fredoka, sans-serif';
    ctx.fillText('HINT', hb.x, hb.y + 23);
    ctx.fillStyle = on ? '#c0392b' : '#8a8270';
    ctx.beginPath(); ctx.arc(hb.x + 23, hb.y - 23, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 13px Fredoka, sans-serif';
    ctx.fillText(`${hintsLeft}`, hb.x + 23, hb.y - 18.5);

    // An arrow at the screen edge when the hint glow is off-screen
    if (hintT > 0) {
      const s = worldToScreen(hintC.x, hintC.y);
      if (s.x < 0 || s.x > viewW || s.y < 0 || s.y > viewH) {
        const cx = viewW / 2, cy = viewH / 2;
        const a = Math.atan2(s.y - cy, s.x - cx);
        const ex = clamp(cx + Math.cos(a) * 1e4, 40, viewW - 40), ey = clamp(cy + Math.sin(a) * 1e4, 130, viewH - 130);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
        ctx.fillStyle = `rgba(245,180,40,${0.7 + 0.3 * Math.sin(t * 8)})`;
        ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-12, -16); ctx.lineTo(-4, 0); ctx.lineTo(-12, 16); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = viewH * 0.42 - (lines.length - 1) * 15;
  lines.forEach((l, i) => {
    ctx.strokeText(l, viewW / 2, y0 + i * 30);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, viewW / 2, y0 + i * 30);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!scene) return;
  drawWorld(cam.x, cam.y, cam.z);

  // world-space extras: tap ripples and floating text
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3 / cam.z;
    ctx.beginPath(); ctx.arc(r.x, r.y, (8 + r.t * 60) / cam.z, 0, TAU); ctx.stroke();
  }
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.t, 0, 1);
    ctx.font = `700 ${18 / Math.max(0.8, cam.z)}px Fredoka, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    const y = f.y - (1.4 - f.t) * 30;
    ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;

  // screen space from here on
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const di = dayInfo();
  if (state === 'play' || state === 'fail' || state === 'pause') {
    if (di.night > 0) { ctx.fillStyle = `rgba(30,40,110,${di.night * 0.22})`; ctx.fillRect(0, 0, viewW, viewH); }
  }
  if (cut) {
    // soft vignette so the eye goes to the family
    const g = ctx.createRadialGradient(viewW / 2, viewH / 2, Math.min(viewW, viewH) * 0.3, viewW / 2, viewH / 2, Math.max(viewW, viewH) * 0.75);
    g.addColorStop(0, 'rgba(40,30,10,0)'); g.addColorStop(1, 'rgba(40,30,10,0.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, viewW, viewH);
  }

  // Magnifier lens (keyboard play)
  if (mag.on && state === 'play') {
    const ms = worldToScreen(mag.x, mag.y);
    ctx.save();
    ctx.beginPath(); ctx.arc(ms.x, ms.y, MAG_R, 0, TAU); ctx.clip();
    const z2 = Math.min(cam.z * 2, 3.5);
    drawWorld(mag.x - ms.x / z2, mag.y - ms.y / z2, z2);
    ctx.restore();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ms.x + MAG_R * 0.72, ms.y + MAG_R * 0.72); ctx.lineTo(ms.x + MAG_R * 1.15, ms.y + MAG_R * 1.15); ctx.stroke();
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(ms.x, ms.y, MAG_R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(122,82,48,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ms.x - 8, ms.y); ctx.lineTo(ms.x + 8, ms.y); ctx.moveTo(ms.x, ms.y - 8); ctx.lineTo(ms.x, ms.y + 8); ctx.stroke();
  }

  // Speech bubbles above whoever is talking
  drawCaption();
  drawMessage();
  for (const b of bubbles) {
    const e = b.who;
    const top = e.y - (e.h || 74) - 6 - (e.sit ? 6 : 0);
    const s = worldToScreen(e.x, top);
    if (s.x < -60 || s.x > viewW + 60 || s.y < -40 || s.y > viewH + 60) continue;
    ctx.globalAlpha = clamp(b.t / 0.3, 0, 1);
    drawBubble(s.x, s.y, b.text, cut && cut.kind === 'final' ? 290 : 230);
    ctx.globalAlpha = 1;
  }
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updateLive(dt) {
  const all = [...scene.live, ...(cut ? cut.actors : [])];
  for (const e of all) {
    if (e.type === 'item') continue;
    e.blinkT -= dt;
    if (e.blinkT <= 0) { e.blink = 0.13; e.blinkT = rand(1.5, 5); }
    if (e.blink > 0) e.blink -= dt;
    if (e.react) { e.react.t -= dt; if (e.react.t <= 0) e.react = null; }
  }
  for (let i = reacting.length - 1; i >= 0; i--) {
    const e = reacting[i];
    if (!e.react) { reacting.splice(i, 1); continue; }
    e.react.t -= dt;
    if (e.react.t <= 0) { e.react = null; reacting.splice(i, 1); }
  }
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  if (scene) updateLive(dt);
  if (state === 'title' || state === 'story') {
    // the title backdrop drifts slowly across the caravan
    if (scene) { cam.x = (scene.WW - viewW / cam.z) / 2 + Math.sin(t * 0.12) * 200; clampCam(); }
  } else if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) failLevel();
    // keyboard: arrows pan the view, or move the magnifier
    let kx = 0, ky = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) ky -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) ky += 1;
    if (kx || ky) {
      const sp = PAN_SPEED * dt / cam.z;
      if (mag.on) {
        mag.x += kx * sp * 0.6; mag.y += ky * sp * 0.6;
        mag.x = clamp(mag.x, 0, scene.WW); mag.y = clamp(mag.y, scene.top - 100, scene.WH);
        const s = worldToScreen(mag.x, mag.y), m = 90;
        if (s.x < m) cam.x -= (m - s.x) / cam.z; if (s.x > viewW - m) cam.x += (s.x - viewW + m) / cam.z;
        if (s.y < m + 60) cam.y -= (m + 60 - s.y) / cam.z; if (s.y > viewH - m) cam.y += (s.y - viewH + m) / cam.z;
        clampCam();
      } else { cam.x += kx * sp; cam.y += ky * sp; clampCam(); }
    }
    hintT = Math.max(0, hintT - dt);
    lockT = Math.max(0, lockT - dt);
    updateMovers(dt);
  } else if (state === 'found') {
    updateCut(dt);
  }
  penaltyT = Math.max(0, penaltyT - dt);
  message.t -= dt;
  if (message.t <= 0 && msgQueue.length && (state === 'play' || state === 'found')) message = { text: msgQueue.shift(), t: 2.6 };
  if (caption) { caption.t -= dt; if (caption.t <= 0) caption = null; }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t -= dt; if (floats[i].t <= 0) floats.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') update(dt);
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
