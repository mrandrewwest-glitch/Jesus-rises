<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9c98f">
<title>Thomas Believes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e9c98f;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Thomas Believes</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound: the shared music engine (music.js) with this game's tune, instruments and ambience
Music.theme = { tune: 'hallelujah', instrument: 'harp', accent: 'pipe', ambience: 'none', percussion: false };

// Scripture shown in this game (John 20:25-29).
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  except:    { ref: 'John 20:25', KJV: 'Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe.', NKJV: 'Unless I see in His hands the print of the nails, and put my finger into the print of the nails, and put my hand into His side, I will not believe.', NIV: 'Unless I see the nail marks in his hands and put my finger where the nails were, and put my hand into his side, I will not believe.', NLT: 'I won’t believe it unless I see the nail wounds in his hands, put my fingers into them, and place my hand into the wound in his side.' },
  seen:      { ref: 'John 20:25', KJV: 'We have seen the Lord.', NKJV: 'We have seen the Lord.', NIV: 'We have seen the Lord!', NLT: 'We have seen the Lord!' },
  peace:     { ref: 'John 20:26', KJV: 'Peace be unto you.', NKJV: 'Peace to you!', NIV: 'Peace be with you!', NLT: 'Peace be with you.' },
  believing: { ref: 'John 20:27', KJV: 'Be not faithless, but believing.', NKJV: 'Do not be unbelieving, but believing.', NIV: 'Stop doubting and believe.', NLT: 'Don’t be faithless any longer. Believe!' },
  lord:      { ref: 'John 20:28', KJV: 'My Lord and my God.', NKJV: 'My Lord and my God!', NIV: 'My Lord and my God!', NLT: 'My Lord and my God!' },
  blessed:   { ref: 'John 20:29', KJV: 'Blessed are they that have not seen, and yet have believed.', NKJV: 'Blessed are those who have not seen and yet have believed.', NIV: 'Blessed are those who have not seen and yet have believed.', NLT: 'Blessed are those who believe without seeing me.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// Always returns a hex colour, so it can be shaded again
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Layout (logical playfield)
// ============================================================
const FRONT_Y = 490;      // feet of the front row
const BACK_Y = 432;       // feet of the back row
const SCENE_BOT = 506;    // bottom of the scene
const TRAY_TOP = 506;     // the table where heard clues are laid
const BOARD_TOP = 666;    // Thomas's evidence board
const BOARD_BOT = 894;
const CW = 84, CH = 62;   // card size (before scaling)

// ============================================================
//  The story: testimonies (in the order they happened) and rumours
// ============================================================
const EVENTS = [
  { id: 'stone',  cap: ['Stone', 'rolled away'],  time: 'Before dawn', who: 'joanna',
    line: 'We came to the tomb very early with our spices. The great stone was already rolled away!' },
  { id: 'cloths', cap: ['Grave cloths', 'folded'], time: 'At sunrise', who: 'peter',
    line: 'John outran me to the tomb! Inside, the linen lay there, and the cloth from His head was folded up by itself.' },
  { id: 'garden', cap: ['Mary meets', 'Jesus'],    time: 'Morning', who: 'mary',
    line: 'I thought He was the gardener. Then He said my name, and I knew Him. It was Jesus, alive!' },
  { id: 'emmaus', cap: ['Walk to', 'Emmaus'],      time: 'Afternoon', who: 'cleopas',
    line: 'A stranger walked with us to Emmaus and explained all the Scriptures about the Messiah. Our hearts were burning!' },
  { id: 'bread',  cap: ['Known in the', 'bread'],  time: 'Evening', who: 'friend',
    line: 'At supper He took the bread, blessed it and broke it, and suddenly we knew Him. It was Jesus!' },
  { id: 'room',   cap: ['Jesus in the', 'locked room'], time: 'That night', who: 'john',
    line: 'The doors were shut tight, yet He stood right among us and showed us His hands and His side!' },
];
const RUMOURS = [
  { id: 'stolen',   cap: ['"Someone took', 'the body"'], who: 'trader', rumour: true,
    line: 'I heard someone must have taken the body away in the night. Probably. I think.' },
  { id: 'gardener', cap: ['"A gardener', 'moved Him"'],  who: 'neighbour', rumour: true,
    line: 'Maybe the gardener just moved Him somewhere else? Gardeners do tidy up...' },
  { id: 'ghost',    cap: ['"Only a', 'ghost"'],          who: 'passer', rumour: true,
    line: 'A ghost, I tell you! They must have seen a ghost!' },
];

const CAST = {
  thomas:    { name: 'Thomas',    robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  joanna:    { name: 'Joanna',    robe: '#c46b8c', hair: '#4a2f1a', beard: false, skin: '#e0ac7c', scarf: '#f3e6c8', woman: true },
  peter:     { name: 'Peter',     robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  mary:      { name: 'Mary',      robe: '#5b7fc7', hair: '#3a2515', beard: false, skin: '#d7a070', scarf: '#e9eefc', woman: true },
  cleopas:   { name: 'Cleopas',   robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56', scarf: '#e8dcc0' },
  friend:    { name: 'Traveller', robe: '#3c8f86', hair: '#2e1d10', beard: false, skin: '#c58a55' },
  john:      { name: 'John',      robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  trader:    { name: 'Trader',    robe: '#8a6d4a', hair: '#1f140c', beard: true,  skin: '#b87a48', scarf: '#c9b27a' },
  neighbour: { name: 'Neighbour', robe: '#7a4fa0', hair: '#2d1b0f', beard: false, skin: '#c88e5a', scarf: '#d8c7a0', woman: true },
  passer:    { name: 'Passer-by', robe: '#5a6475', hair: '#5c3a1c', beard: true,  skin: '#dca678' },
};

const LEVEL_NAMES = ['The Upper Room', 'The Garden Tomb', 'The Road to Emmaus', 'Jerusalem by Night', 'The Eighth Day'];
const SCENES = ['room', 'garden', 'road', 'night'];
const EVENT_SETS = [
  ['stone', 'garden', 'room'],
  ['stone', 'cloths', 'garden', 'room'],
  ['stone', 'cloths', 'garden', 'emmaus', 'room'],
  ['stone', 'cloths', 'garden', 'emmaus', 'bread', 'room'],
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Case ${n}`,
    scene: SCENES[(n - 1) % SCENES.length],
    events: EVENT_SETS[Math.min(n, 4) - 1].map((id) => EVENTS.find((e) => e.id === id)),
    rumours: [0, 1, 1, 2, 3][Math.min(n, 5) - 1],
    hint: n === 1 ? 'icon' : n === 2 ? 'time' : 'number',   // how much the board slots give away
    time: Math.max(75, 150 - (n - 1) * 15),                 // seconds of candle
    mistake: 8 + n * 2,                                      // candle lost for a wrong card
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | appear | win | fail | pause
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('thomasBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let people = [];          // the witnesses in the scene
let thomas = null;
let cards = [];           // clue cards: tray | drag | placed | binned
let slots = [];           // the board: one per event, in order
let candle = 0;
let mistakes = 0;
let bubble = null;        // { who, text, t, dur }
let particles = [];
let message = { text: '', t: 0 };
let selected = null;      // a card chosen by tapping (tap card, then tap its place)
let drag = null;          // { card, sx, sy, moved, ox, oy }
let worriedT = 0, shakeT = 0, flashT = 0;
let endTimer = 0;
let lastScore = null;
let appearT = 0;
let focusIdx = -1;        // keyboard focus
const ripples = [];

function newPerson(key, card) {
  return {
    key, d: CAST[key], card, given: false, x: 0, bx: 0, y: FRONT_Y, s: 1, row: 1,
    mood: 'watch', switchT: 0, delay: rand(0.05, 0.4), blinkT: rand(1, 4), blink: 0,
    phase: rand(0, TAU), speakT: 0, kneel: 0,
  };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Build the level: witnesses, rumour-mongers, an empty board
function buildLevel() {
  cfg = makeConfig(level);
  const list = cfg.events.map((e) => newPerson(e.who, e));
  shuffle(RUMOURS.slice()).slice(0, cfg.rumours).forEach((r) => list.push(newPerson(r.who, r)));
  people = shuffle(list);
  people.forEach((p, i) => { p.i = i; });
  thomas = newPerson('thomas', null);
  thomas.mood = 'doubt';
  placePeople();
  slots = cfg.events.map((e, i) => ({ i, ev: e, card: null }));
  cards = [];
  candle = cfg.time;
  mistakes = 0;
  bubble = null; selected = null; drag = null;
  particles = [];
  worriedT = shakeT = flashT = 0;
  appearT = 0;
  focusIdx = -1;
}

function peopleScale() { return W >= 900 ? 1.3 : 1; }
function placePeople() {
  const ps = peopleScale();
  thomas.bx = thomas.x = clamp(W * 0.08, 62, 120);
  thomas.y = FRONT_Y + 4; thomas.s = 1.2 * ps; thomas.row = 1;
  const x0 = thomas.x + 72, x1 = W - 36;
  const n = people.length;
  people.forEach((p, i) => {
    p.bx = p.x = n === 1 ? (x0 + x1) / 2 : lerp(x0, x1, i / (n - 1));
    p.row = i % 2 === 0 ? 1 : 0;
    p.y = p.row ? FRONT_Y : BACK_Y;
    p.s = (p.row ? 1 : 0.86) * ps;
  });
}

// ============================================================
//  Board geometry
// ============================================================
function cardScale() { return W >= 900 ? 1.25 : 1; }

function boardLayout() {
  const cs = cardScale();
  const cw = CW * cs, ch = CH * cs;
  const basketW = cfg.rumours ? 100 * cs : 0;
  const regionL = 18, regionR = W - 18 - (basketW ? basketW + 14 : 0);
  const gap = 26 * cs;
  const n = slots.length;
  const fits = (k) => k * cw + (k - 1) * gap <= regionR - regionL;
  const perRow = fits(n) ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / perRow);
  const rowY = rows === 1 ? [(BOARD_TOP + 44 + BOARD_BOT - 30) / 2] : [BOARD_TOP + 40 + ch / 2, BOARD_TOP + 40 + ch * 1.5 + 12];
  const rects = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), c = i % perRow;
    const inRow = Math.min(perRow, n - r * perRow);
    const total = inRow * cw + (inRow - 1) * gap;
    const sx = (regionL + regionR) / 2 - total / 2 + c * (cw + gap) + cw / 2;
    rects.push({ x: sx, y: rowY[r], w: cw, h: ch, row: r });
  }
  const basket = basketW ? { x: W - 18 - basketW / 2, y: rows === 1 ? rowY[0] : (rowY[0] + rowY[1]) / 2, w: basketW, h: 96 * cs } : null;
  return { cs, cw, ch, rects, basket };
}

function trayPos(idx) {
  const cs = cardScale();
  const cw = CW * cs, ch = CH * cs;
  const cols = Math.max(1, Math.floor((W - 24 + 6) / (cw + 6)));
  const r = Math.floor(idx / cols), c = idx % cols;
  const inTray = cards.filter((k) => k.state === 'tray' || k.state === 'drag').length;
  const inRow = Math.min(cols, inTray - r * cols);
  const total = inRow * cw + (inRow - 1) * 6;
  return { x: W / 2 - total / 2 + c * (cw + 6) + cw / 2, y: TRAY_TOP + 26 + ch / 2 + r * (ch + 6) };
}

// ============================================================
//  Playing: hearing witnesses, placing cards
// ============================================================
function talkTo(p) {
  if (state !== 'play') return;
  bubble = { who: p, text: p.card.line, t: 0, dur: clamp(p.card.line.length * 0.055, 3, 6) };
  p.speakT = bubble.dur;
  sfx.talk(p.d.woman);
  if (!p.given) {
    p.given = true;
    const cs = cardScale();
    cards.push({ ev: p.card, state: 'tray', x: p.x, y: p.y - 70 * p.s, a: 0, sc: 0.3 * cs, wrong: 0, tries: 0 });
    sfx.puff(0.25);
    if (level === 1 && cards.length === 1) setTimeout(() => { if (state === 'play') showMessage(isTouch() ? 'Drag the card to the board' : 'Drag the card to Thomas\'s board'); }, 1600);
  }
}

// Drop a card on a target: { type: 'slot', i } or { type: 'basket' }
function tryPlace(card, target) {
  selected = null;
  if (!target || state !== 'play') { card.state = 'tray'; return false; }
  let ok = false, why = '';
  if (target.type === 'slot') {
    const s = slots[target.i];
    if (s.card) { card.state = 'tray'; return false; }
    if (card.ev.rumour) why = 'That\'s only a rumour!';
    else if (s.ev.id === card.ev.id) ok = true;
    else why = 'Hmm... that\'s not the right order.';
    if (ok) { s.card = card; card.state = 'placed'; card.slot = target.i; }
  } else {
    if (card.ev.rumour) { ok = true; card.state = 'binned'; card.binT = 0; }
    else why = 'But that\'s a true testimony!';
  }
  const L = boardLayout();
  const tp = target.type === 'slot' ? L.rects[target.i] : L.basket;
  if (ok) {
    const filled = slots.filter((s) => s.card).length;
    for (let i = 0; i < 18; i++) {
      const a = rand(0, TAU), sp = rand(40, 140);
      spawn(tp.x, tp.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1), ['#ffe27a', '#fff6d0', '#ffffff'][i % 3], rand(2, 4), 40);
    }
    sfx.place(filled / slots.length);
    if (card.ev.rumour) showMessage('Into the rumour basket!');
    else if (filled < slots.length) showMessage(['It fits!', 'Yes, that\'s right!', 'Thomas is thinking...', 'Another piece!'][filled % 4]);
    checkComplete();
  } else {
    card.state = 'tray';
    card.wrong = 0.5; card.tries++;
    mistakes++;
    candle = Math.max(0, candle - cfg.mistake);
    worriedT = 1.4; shakeT = 0.25;
    showMessage(why);
    sfx.wrong();
  }
  return ok;
}

function checkComplete() {
  const allHeard = people.every((p) => p.given);
  const trayEmpty = cards.every((c) => c.state === 'placed' || c.state === 'binned');
  if (!allHeard || !trayEmpty || slots.some((s) => !s.card)) return;
  // The board is complete: score it, then eight days later...
  const firstTry = cards.filter((c) => !c.ev.rumour && c.tries === 0).length;
  const s = {
    order: firstTry * 100,
    candle: Math.round(candle) * 5,
    perfect: mistakes === 0 ? 300 : 0,
    levelBonus: level * 400,
  };
  s.score = s.order + s.candle + s.perfect + s.levelBonus;
  lastScore = s;
  state = 'appear';
  syncAmbience();
  appearT = 0;
  bubble = null;
  showMessage('Thomas\'s board is complete!');
}

// ============================================================
//  Eight days later: Jesus appears (John 20:26-29)
// ============================================================
const BEATS = [
  { at: 2.8, who: 'jesus', key: 'peace', dur: 2.6 },
  { at: 5.4, who: 'jesus', key: 'believing', dur: 3.0 },
  { at: 8.4, who: 'thomas', key: 'lord', dur: 2.6 },
];
const APPEAR_END = 11.0;
function jesusX() { return clamp(W * 0.52, thomas.bx + 170, W - 60); }

function updateAppear(dt) {
  const before = appearT;
  appearT += dt;
  if (before < 1.8 && appearT >= 1.8) sfx.levelStart();
  if (before < 2.2 && appearT >= 2.2) { flashT = 0.4; for (let i = 0; i < 40; i++) { const a = rand(0, TAU), sp = rand(30, 120); spawn(jesusX(), FRONT_Y - 45, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.6), '#fff6d0', rand(2, 4)); } }
  for (const b of BEATS) if (before < b.at && appearT >= b.at) sfx.talk(false);
  // Thomas comes close, then kneels
  const walk = clamp((appearT - 5.6) / 1.8, 0, 1);
  thomas.x = lerp(thomas.bx, jesusX() - 64, walk * walk * (3 - 2 * walk));
  thomas.kneel = clamp((appearT - 7.8) / 0.5, 0, 1);
  // Everyone else steps aside
  const jx = jesusX(), step = clamp((appearT - 2.2) / 0.8, 0, 1);
  for (const p of people) {
    const dx = p.bx - jx;
    const push = Math.max(0, 110 - Math.abs(dx)) * (dx < 0 ? -1 : 1);
    p.x = p.bx + push * step;
  }
  if (appearT >= APPEAR_END) finishWin();
}

function skipBeat() {
  const next = BEATS.find((b) => b.at > appearT + 0.01);
  appearT = next ? next.at : APPEAR_END;
}

function currentBeat() {
  if (state !== 'appear') return null;
  return BEATS.find((b) => appearT >= b.at && appearT < b.at + b.dur) || null;
}

function finishWin() {
  state = 'win';
  syncAmbience();
  totalScore += lastScore.score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('thomasBest', best); } catch (e) {} }
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(jesusX(), FRONT_Y - 50, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 1.6;
}

function fail() {
  state = 'fail';
  syncAmbience();
  bubble = null;
  if (drag) { drag.card.state = 'tray'; drag = null; }
  selected = null;
  showMessage('The candle has gone out...');
  sfx.fail();
  endTimer = 1.5;
}

function showMessage(text) { message = { text, t: 2.2 }; }
function isTouch() { return matchMedia('(pointer: coarse)').matches; }

// ============================================================
//  Moods
// ============================================================
function progress() { return slots.length ? slots.filter((s) => s.card).length / slots.length : 0; }

function wantedMood(p) {
  if (state === 'fail') return 'dismay';
  if (state === 'win') return 'joy';
  if (state === 'appear') {
    if (p === thomas) return appearT < 2.2 ? 'doubt' : appearT < 5.4 ? 'shock' : appearT < 7.8 ? 'wow' : 'joy';
    return appearT < 2.2 ? 'watch' : appearT < 4.2 ? 'shock' : 'joy';
  }
  if (p === thomas) {
    if (worriedT > 0) return 'worried';
    const f = progress();
    return f < 0.34 ? 'doubt' : f < 0.67 ? 'watch' : 'wow';
  }
  if (p.speakT > 0) return p.card.rumour ? 'worried' : 'joy';
  if (p.card && p.card.rumour) return 'watch';
  return p.given ? 'watch' : 'wow';
}

function updatePeople(dt) {
  for (const p of [...people, thomas]) {
    if (!p) continue;
    const want = wantedMood(p);
    if (want !== p.mood) {
      p.switchT += dt;
      if (p.switchT > (p === thomas ? 0.05 : p.delay)) { p.mood = want; p.switchT = 0; }
    } else p.switchT = 0;
    p.blinkT -= dt;
    if (p.blinkT <= 0) { p.blink = 0.13; p.blinkT = rand(1.5, 5); }
    if (p.blink > 0) p.blink -= dt;
    p.speakT = Math.max(0, p.speakT - dt);
  }
}

// Cards glide toward wherever they belong
function updateCards(dt) {
  const L = boardLayout();
  const trayCards = cards.filter((c) => c.state === 'tray' || c.state === 'drag');
  for (const c of cards) {
    let tx = c.x, ty = c.y, tsc = L.cs;
    if (c.state === 'tray') { const p = trayPos(trayCards.indexOf(c)); tx = p.x; ty = p.y; }
    else if (c.state === 'drag') { tx = drag.px + drag.ox; ty = drag.py + drag.oy; tsc = L.cs * 1.08; }
    else if (c.state === 'placed') { const r = L.rects[c.slot]; tx = r.x; ty = r.y; }
    else if (c.state === 'binned') { tx = L.basket.x; ty = L.basket.y + 6; tsc = L.cs * 0.35; c.binT += dt; }
    const k = c.state === 'drag' ? 1 : Math.min(1, dt * 11);
    c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
    c.sc += (tsc - c.sc) * Math.min(1, dt * 10);
    c.a = Math.min(1, c.a + dt * 4);
    c.wrong = Math.max(0, c.wrong - dt);
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  People (the house disciple style, with reacting faces)
// ============================================================
function lookTarget(p) {
  if (state === 'appear' && appearT > 2.2) return { x: jesusX(), y: FRONT_Y - 55 };
  if (bubble && bubble.who !== p) return { x: bubble.who.x, y: bubble.who.y - 55 * bubble.who.s };
  if (p === thomas) {
    if (drag) return { x: drag.card.x, y: drag.card.y };
    return { x: W / 2, y: BOARD_TOP + 80 };
  }
  return { x: thomas.x, y: thomas.y - 60 };
}

function drawPerson(p) {
  const s = p.s, mood = p.mood;
  const dim = p.row === 0 ? -14 : 0;             // the back row is a touch darker
  const d = dim ? { ...p.d, robe: shade(p.d.robe, dim), skin: shade(p.d.skin, dim), hair: shade(p.d.hair, dim), scarf: p.d.scarf && shade(p.d.scarf, dim) } : p.d;
  let jump = 0;
  if (mood === 'joy' && p.kneel === 0) jump = Math.abs(Math.sin(t * 7 + p.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(p.x, p.y - jump * s);
  ctx.scale(s, s);
  if (p.kneel > 0) ctx.scale(1, 1 - 0.2 * p.kneel);   // kneeling

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  const lt = lookTarget(p);
  const dx = lt.x - p.x, dy = lt.y - (p.y - 52 * s);
  const len = Math.hypot(dx, dy) || 1;
  const lx = dx / len, ly = dy / len;

  const kneeling = p.kneel > 0.5;
  if (mood === 'joy' && !kneeling) {
    const wave = Math.sin(t * 9 + p.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && p.speakT <= 0 && (p.i || 0) % 2 === 0 && p !== thomas) {
    arm(11, -32, 20 + lx * 6, -62);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (kneeling) { arm(-11, -32, -2, -40); arm(11, -32, 2, -40); }           // hands together
  else if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && !(p.speakT <= 0 && (p.i || 0) % 2 === 0 && p !== thomas))) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else if (p.speakT > 0) { arm(-11, -32, -15, -12); arm(11, -32, 24, -40 + Math.sin(t * 8) * 3); } // talking hands
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    const drop = d.woman ? 22 : 10;           // women's veils fall to the shoulders
    ctx.lineTo(18, hy + drop); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + drop);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(p, d, mood, hy, lx, ly);

  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && (p.i || 0) % 2 === 0) {
    arm(11, -32, 2, hy - 3);
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }
  ctx.restore();
}

function drawFace(p, d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = p.blink > 0 && mood !== 'shock' && mood !== 'joy';
  const odd = (p.i || 0) % 2;
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
    if (d.woman && !blink) {                   // lashes
      ctx.strokeStyle = dark; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-ex - rx, ey - ry + 1); ctx.lineTo(-ex - rx - 2.5, ey - ry - 1);
      ctx.moveTo(ex + rx, ey - ry + 1); ctx.lineTo(ex + rx + 2.5, ey - ry - 1);
      ctx.stroke();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  // Talking: the mouth opens and closes
  if (p.speakT > 0 && mood !== 'shock') {
    eyes(3.5, 4.5, 2);
    brows(-9, -8, -9, -8);
    const o = 1.5 + Math.abs(Math.sin(t * 14)) * 3;
    mouthFill(() => ctx.ellipse(0, mouthY - 1, 4, o, 0, 0, TAU));
    return;
  }
  if (p.kneel > 0.5) {                          // eyes closed in worship, smiling
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
    ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    mouthLine(() => ctx.arc(0, mouthY - 3, 4.5, 0.15 * Math.PI, 0.85 * Math.PI));
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
    return;
  }

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (!odd) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// Thomas's thought cloud: the question marks melt away as the board fills
function drawThought() {
  if (state === 'appear' || state === 'win') return;
  const f = progress();
  const hx = thomas.x + 26, hy = thomas.y - 92 * thomas.s - 22;
  const bob = Math.sin(t * 2) * 3;
  const r = 24 - f * 5;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = 'rgba(120,100,70,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(thomas.x + 12, thomas.y - 78 * thomas.s - 4, 3.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(thomas.x + 18, thomas.y - 78 * thomas.s - 13, 5.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx - r * 0.6, hy + bob, r * 0.75, 0, TAU);
  ctx.arc(hx + r * 0.6, hy + bob, r * 0.75, 0, TAU);
  ctx.arc(hx, hy - r * 0.45 + bob, r * 0.8, 0, TAU);
  ctx.fill();
  const n = f >= 1 ? 0 : f >= 0.67 ? 1 : f >= 0.34 ? 2 : 3;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 20px Fredoka, sans-serif';
  if (n === 0 || worriedT <= 0 && n === 0) {
    ctx.fillStyle = '#e0a526'; ctx.fillText('!', hx, hy - 4 + bob);
  } else {
    ctx.fillStyle = worriedT > 0 ? '#c0392b' : '#7a6640';
    const txt = '?'.repeat(n);
    ctx.fillText(txt, hx, hy - 4 + bob);
  }
  ctx.textBaseline = 'alphabetic';
}

// Name tag with a "!" while a witness still has something to tell
function drawTag(p) {
  if (state === 'appear' || state === 'win') return;
  const y = p.y - 88 * p.s - 6;
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const name = p.d.name;
  const w = ctx.measureText(name).width + 12;
  ctx.globalAlpha = p.given ? 0.6 : 1;
  ctx.fillStyle = 'rgba(255,252,240,0.9)';
  roundRect(p.x - w / 2, y - 8, w, 16, 8); ctx.fill();
  ctx.fillStyle = '#5a4210';
  ctx.fillText(name, p.x, y);
  if (!p.given && state === 'play') {
    const b = Math.sin(t * 4 + p.phase) * 3;
    ctx.fillStyle = '#f7c948'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, y - 20 + b, 9, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 13px Fredoka, sans-serif';
    ctx.fillText('!', p.x, y - 19.5 + b);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

// ============================================================
//  Jesus (house drawJesus, standing, without the cloud)
// ============================================================
function drawJesus(x, y, sc, alpha, pose) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 95);
  g.addColorStop(0, `rgba(255,240,170,${0.75 * alpha})`);
  g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -35, 95, 0, TAU); ctx.fill();
  ctx.globalAlpha = alpha;

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Feet
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(-6, 0, 4.5, 2.4, 0, 0, TAU); ctx.ellipse(6, 0, 4.5, 2.4, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: open and welcoming, or held out to show His hands
  const hands = pose === 'show' ? [[-27, -36], [27, -36]] : [[-20, -22], [20, -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, pose === 'show' ? 4 : 3.3, 0, TAU); ctx.fill();
    if (pose === 'show') {                    // the print of the nails
      ctx.fillStyle = '#b5534a';
      ctx.beginPath(); ctx.arc(hx, hy, 1.2, 0, TAU); ctx.fill();
    }
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face: gentle joy
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
  ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
  ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Clue cards and their little pictures
// ============================================================
function drawIcon(id, x, y, a = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha *= a;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (id) {
    case 'stone':
      ctx.fillStyle = '#c9a36b'; roundRect(-16, -11, 24, 22, [10, 10, 2, 2]); ctx.fill();
      ctx.fillStyle = '#3b2f1e'; roundRect(-10, -4, 12, 15, [6, 6, 0, 0]); ctx.fill();
      ctx.fillStyle = '#9aa0a8'; ctx.strokeStyle = '#6b7078'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(10, 2, 9, 0, TAU); ctx.fill(); ctx.stroke();
      break;
    case 'cloths':
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b8ae98'; ctx.lineWidth = 1.5;
      roundRect(-16, 1, 24, 9, 2); ctx.fill(); ctx.stroke();
      roundRect(-13, -6, 18, 8, 2); ctx.fill(); ctx.stroke();
      roundRect(8, -3, 10, 12, 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, 3); ctx.lineTo(18, 3); ctx.stroke();
      break;
    case 'garden':
      ctx.strokeStyle = '#4f8a3a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.quadraticCurveTo(-2, 4, 0, -2); ctx.stroke();
      ctx.fillStyle = '#6fae4f'; ctx.beginPath(); ctx.ellipse(-6, 6, 5, 2.5, -0.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f48fb1';
      for (let k = 0; k < 5; k++) { const an = k / 5 * TAU; ctx.beginPath(); ctx.arc(Math.cos(an) * 5.5, -6 + Math.sin(an) * 5.5, 4.2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(0, -6, 3.2, 0, TAU); ctx.fill();
      break;
    case 'emmaus':
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(11, -8, 4.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#c9a36b'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-14, 12); ctx.quadraticCurveTo(8, 4, -2, -2); ctx.quadraticCurveTo(-10, -7, 4, -11); ctx.stroke();
      ctx.fillStyle = '#6b4a2b';
      ctx.beginPath(); ctx.arc(-4, 6, 1.6, 0, TAU); ctx.arc(1, 3, 1.6, 0, TAU); ctx.arc(-2, -2, 1.4, 0, TAU); ctx.fill();
      break;
    case 'bread':
      ctx.fillStyle = '#d99a3e'; ctx.strokeStyle = '#a8671f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(-6, 2, 9, 7, -0.2, Math.PI * 0.5, Math.PI * 1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(6, 0, 9, 7, 0.2, -Math.PI * 0.5, Math.PI * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f5deb0';
      ctx.beginPath(); ctx.ellipse(-6, 2, 2.5, 6, -0.2, 0, TAU); ctx.ellipse(6, 0, 2.5, 6, 0.2, 0, TAU); ctx.fill();
      break;
    case 'room':
      ctx.strokeStyle = '#ffd766'; ctx.lineWidth = 2;
      for (let k = 0; k < 8; k++) { const an = k / 8 * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(an) * 12, Math.sin(an) * 12); ctx.lineTo(Math.cos(an) * 16, Math.sin(an) * 16); ctx.stroke(); }
      ctx.fillStyle = '#8a5a2b'; roundRect(-7, -11, 14, 22, [6, 6, 1, 1]); ctx.fill();
      ctx.fillStyle = '#3b2f1e'; ctx.beginPath(); ctx.arc(3, 1, 1.6, 0, TAU); ctx.fill();
      break;
    default: // rumours: a grey whisper cloud
      ctx.fillStyle = '#c5ccd6'; ctx.strokeStyle = '#8a94a3'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, -2, 15, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, 7); ctx.lineTo(-10, 13); ctx.lineTo(0, 7.5); ctx.fill();
      ctx.fillStyle = '#5a6475'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, -1.5);
      ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}

function drawCard(c) {
  const sc = c.sc;
  let x = c.x, y = c.y;
  if (c.wrong > 0) x += Math.sin(c.wrong * 50) * 6 * c.wrong;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.globalAlpha = c.a * (c.state === 'binned' ? clamp(1 - c.binT * 2.5, 0, 1) : 1);
  const w = CW, h = CH;
  if (c.state === 'drag' || c === selected) { ctx.fillStyle = 'rgba(60,40,0,0.25)'; roundRect(-w / 2 + 3, -h / 2 + 5, w, h, 8); ctx.fill(); }
  ctx.fillStyle = c.ev.rumour ? '#eef0f3' : '#fff8e6';
  ctx.strokeStyle = c === selected ? '#e0a526' : c.ev.rumour ? '#9aa4b2' : '#d6b36a';
  ctx.lineWidth = c === selected ? 3.5 : 2;
  roundRect(-w / 2, -h / 2, w, h, 8); ctx.fill(); ctx.stroke();
  drawIcon(c.ev.rumour ? 'rumour' : c.ev.id, 0, -h / 2 + 17);
  ctx.fillStyle = '#4a3a20';
  ctx.textAlign = 'center';
  c.ev.cap.forEach((line, k) => {
    let fs = 12;
    ctx.font = `600 ${fs}px Fredoka, sans-serif`;
    while (ctx.measureText(line).width > w - 8 && fs > 8) { fs -= 0.5; ctx.font = `600 ${fs}px Fredoka, sans-serif`; }
    ctx.fillText(line, 0, h / 2 - 19 + k * 13);
  });
  if (c.state === 'placed') {                  // a red pin
    ctx.fillStyle = '#c0392b';
    ctx.beginPath(); ctx.arc(0, -h / 2 + 2, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-1.3, -h / 2 + 0.7, 1.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  Scenery
// ============================================================
const STARS = Array.from({ length: 40 }, () => ({ f: Math.random(), y: Math.random(), r: rand(0.8, 1.8), p: rand(0, TAU) }));
const CORK = Array.from({ length: 90 }, () => ({ f: Math.random(), g: Math.random(), r: rand(0.8, 2) }));

function sceneId() {
  if (state === 'appear' && appearT > 0.7) return 'room';
  if (state === 'win') return 'room';
  return cfg.scene;
}

function drawScene() {
  const x0 = -offX, x1 = W + offX, top = -offY;
  const id = sceneId();
  if (id === 'room') drawUpperRoom(x0, x1, top);
  else if (id === 'garden') drawGarden(x0, x1, top);
  else if (id === 'road') drawRoad(x0, x1, top);
  else drawNight(x0, x1, top);
}

function drawUpperRoom(x0, x1, top) {
  const g = ctx.createLinearGradient(0, top, 0, 430);
  g.addColorStop(0, '#e9cf9c'); g.addColorStop(1, '#f5e2b8');
  ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, 440);
  // Stone blocks
  ctx.strokeStyle = 'rgba(160,120,70,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = 160; y < 420; y += 44) {
    ctx.moveTo(x0, y); ctx.lineTo(x1, y);
    for (let x = x0 + ((y / 44) % 2) * 45; x < x1; x += 90) { ctx.moveTo(x, y); ctx.lineTo(x, y + 44); }
  }
  ctx.stroke();
  // Ceiling rafters (seen when the screen is tall)
  if (top < 118) {
    ctx.fillStyle = '#e6cc98'; ctx.fillRect(x0, top, x1 - x0, 118 - top);
    ctx.fillStyle = 'rgba(160,110,55,0.35)';
    for (let y = 96; y > top - 20; y -= 60) ctx.fillRect(x0, y, x1 - x0, 7);
  }
  // Beams
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(x0, 118, x1 - x0, 20);
  ctx.fillStyle = '#6b4520';
  ctx.fillRect(x0, 134, x1 - x0, 5);
  // Window with the night sky
  const wx = W * 0.74, wy = 180;
  ctx.fillStyle = '#6b4520'; roundRect(wx - 52, wy - 6, 104, 132, [52, 52, 6, 6]); ctx.fill();
  const sky = ctx.createLinearGradient(0, wy, 0, wy + 120);
  sky.addColorStop(0, '#1f2d5a'); sky.addColorStop(1, '#4a5d9a');
  ctx.fillStyle = sky; roundRect(wx - 44, wy, 88, 118, [44, 44, 3, 3]); ctx.fill();
  ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(wx + 16, wy + 34, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1f2d5a'; ctx.beginPath(); ctx.arc(wx + 21, wy + 30, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffffff';
  for (const [sx, sy] of [[-24, 30], [-10, 60], [-28, 84], [10, 92], [24, 70]]) { ctx.beginPath(); ctx.arc(wx + sx, wy + sy, 1.3 + Math.sin(t * 2 + sx) * 0.4, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#6b4520'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, wy + 118); ctx.moveTo(wx - 44, wy + 62); ctx.lineTo(wx + 44, wy + 62); ctx.stroke();
  // The door, shut and barred
  const dx = W * 0.34;
  ctx.fillStyle = '#7a4f2a'; roundRect(dx - 44, 230, 88, 196, [40, 40, 2, 2]); ctx.fill();
  ctx.fillStyle = '#9a6a3a'; roundRect(dx - 36, 238, 72, 188, [34, 34, 2, 2]); ctx.fill();
  ctx.strokeStyle = '#7a4f2a'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let k = -1; k <= 1; k++) { ctx.moveTo(dx + k * 18, 244); ctx.lineTo(dx + k * 18, 426); } ctx.stroke();
  ctx.fillStyle = '#5a3a1a'; roundRect(dx - 50, 322, 100, 12, 4); ctx.fill();
  // Oil lamp on a shelf
  const lx = W * 0.54;
  ctx.fillStyle = '#6b4520'; ctx.fillRect(lx - 30, 262, 60, 7);
  ctx.fillStyle = '#b5703a'; ctx.beginPath(); ctx.ellipse(lx, 256, 14, 6, 0, 0, TAU); ctx.fill();
  const fl = ctx.createRadialGradient(lx + 12, 244, 1, lx + 12, 244, 40);
  fl.addColorStop(0, 'rgba(255,220,120,0.6)'); fl.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(lx + 12, 244, 40, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffb938';
  ctx.beginPath(); ctx.moveTo(lx + 12, 236 - Math.sin(t * 9) * 2); ctx.quadraticCurveTo(lx + 18, 248, lx + 12, 250); ctx.quadraticCurveTo(lx + 6, 248, lx + 12, 236 - Math.sin(t * 9) * 2); ctx.fill();
  // Floor boards
  ctx.fillStyle = '#b98a55'; ctx.fillRect(x0, 426, x1 - x0, SCENE_BOT - 426 + 2);
  ctx.strokeStyle = 'rgba(110,70,30,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = 446; y < SCENE_BOT; y += 22) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
}

function drawGarden(x0, x1, top) {
  const g = ctx.createLinearGradient(0, top, 0, 430);
  g.addColorStop(0, '#9fd3f2'); g.addColorStop(0.55, '#ffe6b8'); g.addColorStop(1, '#ffc98a');
  ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, 440);
  // Rising sun
  const sx = W * 0.2, sy = 380;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 140);
  sg.addColorStop(0, 'rgba(255,245,200,0.95)'); sg.addColorStop(0.3, 'rgba(255,220,140,0.6)'); sg.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 140, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
  // Hills
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, 440);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 372 + Math.sin(x / 90) * 16 + Math.sin(x / 37) * 5);
  ctx.lineTo(x1, 440); ctx.fill();
  // The rock tomb with its stone rolled away
  const tx = W * 0.72;
  ctx.fillStyle = '#d8b98a';
  ctx.beginPath(); ctx.moveTo(tx - 150, 430); ctx.quadraticCurveTo(tx - 140, 240, tx, 230); ctx.quadraticCurveTo(tx + 150, 236, tx + 170, 430); ctx.fill();
  ctx.fillStyle = '#c4a172';
  ctx.beginPath(); ctx.ellipse(tx - 70, 320, 30, 14, 0.3, 0, TAU); ctx.ellipse(tx + 80, 300, 26, 12, -0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3b2f1e'; roundRect(tx - 30, 318, 60, 112, [30, 30, 0, 0]); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,200,0.35)'; roundRect(tx - 22, 330, 44, 100, [22, 22, 0, 0]); ctx.fill();
  ctx.fillStyle = '#9aa0a8'; ctx.strokeStyle = '#6b7078'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(tx + 78, 382, 46, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx + 78, 382, 30, 0, TAU); ctx.stroke();
  // Grass and flowers
  ctx.fillStyle = '#8fbf5f'; ctx.fillRect(x0, 426, x1 - x0, SCENE_BOT - 426 + 2);
  for (let k = 0; k < 18; k++) {
    const fx = x0 + ((k * 137) % 1000) / 1000 * (x1 - x0), fy = 436 + (k * 53) % 60;
    ctx.fillStyle = ['#f48fb1', '#ffffff', '#ffd43b'][k % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
  }
}

function drawRoad(x0, x1, top) {
  const g = ctx.createLinearGradient(0, top, 0, 430);
  g.addColorStop(0, '#7fc0ec'); g.addColorStop(1, '#d9f0fb');
  ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, 440);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(W * 0.85, 170, 30, 0, TAU); ctx.fill();
  for (const [f, y, w] of [[0.15, 170, 120], [0.5, 140, 90], [0.66, 230, 110]]) drawCloud(W * f, y, w, w * 0.3);
  // Far hills with the village of Emmaus
  ctx.fillStyle = '#b5d69a';
  ctx.beginPath(); ctx.moveTo(x0, 440);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 330 + Math.sin(x / 120) * 26);
  ctx.lineTo(x1, 440); ctx.fill();
  const vx = W * 0.8, vy = 330 + Math.sin(vx / 120) * 26;
  for (const [dx, w, h] of [[-26, 22, 18], [0, 26, 24], [26, 20, 16]]) {
    ctx.fillStyle = '#f0dcb4'; ctx.fillRect(vx + dx - w / 2, vy - h, w, h);
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(vx + dx - 3, vy - 9, 6, 9);
  }
  ctx.fillStyle = '#98c47a';
  ctx.beginPath(); ctx.moveTo(x0, 440);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 390 + Math.sin(x / 70 + 1) * 12);
  ctx.lineTo(x1, 440); ctx.fill();
  // Olive trees
  for (const f of [0.08, 0.45, 0.95]) {
    const x = W * f, y = 400;
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 5, y - 26, x, y - 46); ctx.stroke();
    ctx.fillStyle = '#7d9460';
    ctx.beginPath();
    for (const [dx, dy, r] of [[-15, -50, 15], [0, -60, 17], [15, -50, 14]]) { ctx.moveTo(x + dx + r, y + dy); ctx.arc(x + dx, y + dy, r, 0, TAU); }
    ctx.fill();
  }
  ctx.fillStyle = '#8fbf5f'; ctx.fillRect(x0, 426, x1 - x0, SCENE_BOT - 426 + 2);
  // The road winding away
  ctx.fillStyle = '#e2c898';
  ctx.beginPath();
  ctx.moveTo(x0, 470); ctx.bezierCurveTo(W * 0.3, 450, W * 0.5, 440, vx - 10, vy + 2);
  ctx.lineTo(vx + 6, vy + 2); ctx.bezierCurveTo(W * 0.55, 452, W * 0.4, 480, x0, SCENE_BOT);
  ctx.fill();
}

function drawNight(x0, x1, top) {
  const g = ctx.createLinearGradient(0, top, 0, 430);
  g.addColorStop(0, '#26335e'); g.addColorStop(0.6, '#5b5a96'); g.addColorStop(1, '#e8a276');
  ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, 440);
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 2 + s.p);
    ctx.beginPath(); ctx.arc(x0 + s.f * (x1 - x0), top + s.y * (300 - top), s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(W * 0.15, 170, 18, 0, TAU); ctx.fill();
  // The city: flat-roofed houses with warm windows
  let k = 0;
  for (let x = x0 - 20; x < x1; x += 70) {
    const h = 90 + ((k * 47) % 70), w = 64 + ((k * 31) % 20);
    ctx.fillStyle = k % 2 ? '#b48a60' : '#a07a55';
    ctx.fillRect(x, 430 - h, w, h);
    ctx.fillStyle = '#8a6444'; ctx.fillRect(x - 3, 430 - h - 5, w + 6, 6);
    ctx.fillStyle = '#ffd27a';
    roundRect(x + 14, 430 - h + 22, 12, 16, [6, 6, 0, 0]); ctx.fill();
    if (h > 120) { roundRect(x + w - 28, 430 - h + 22, 12, 16, [6, 6, 0, 0]); ctx.fill(); }
    k++;
  }
  ctx.fillStyle = '#a88c6a'; ctx.fillRect(x0, 426, x1 - x0, SCENE_BOT - 426 + 2);
  ctx.strokeStyle = 'rgba(80,60,40,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = 446; y < SCENE_BOT; y += 24) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// The table of heard clues, and Thomas's corkboard
function drawTable() {
  const x0 = -offX, x1 = W + offX;
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x0, TRAY_TOP, x1 - x0, BOARD_TOP - TRAY_TOP);
  ctx.fillStyle = '#a06a35'; ctx.fillRect(x0, TRAY_TOP, x1 - x0, 6);
  ctx.strokeStyle = 'rgba(70,40,15,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = TRAY_TOP + 30; y < BOARD_TOP; y += 34) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,210,0.85)';
  ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'left';
  const n = cards.filter((c) => c.state === 'tray' || c.state === 'drag').length;
  ctx.fillText(n ? 'Clues heard' : (state === 'play' ? 'Tap a witness to hear their story...' : 'Clues heard'), 12, TRAY_TOP + 20);
}

function drawBoard() {
  const x0 = -offX, x1 = W + offX;
  ctx.fillStyle = '#6b4520'; ctx.fillRect(x0, BOARD_TOP - 4, x1 - x0, H - BOARD_TOP + 8);
  ctx.fillStyle = '#7a4f2a'; roundRect(6, BOARD_TOP, W - 12, BOARD_BOT - BOARD_TOP, 10); ctx.fill();
  ctx.fillStyle = '#c89a62'; roundRect(14, BOARD_TOP + 8, W - 28, BOARD_BOT - BOARD_TOP - 16, 6); ctx.fill();
  ctx.fillStyle = 'rgba(120,80,40,0.35)';
  ctx.beginPath();
  for (const c of CORK) { const x = 16 + c.f * (W - 32), y = BOARD_TOP + 10 + c.g * (BOARD_BOT - BOARD_TOP - 20); ctx.moveTo(x + c.r, y); ctx.arc(x, y, c.r, 0, TAU); }
  ctx.fill();
  // Plaque
  ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
  const title = "Thomas's Evidence Board";
  const tw = ctx.measureText(title).width + 22;
  ctx.fillStyle = '#fff3d6'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
  roundRect(W / 2 - tw / 2, BOARD_TOP + 12, tw, 22, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a4210'; ctx.fillText(title, W / 2, BOARD_TOP + 28);

  const L = boardLayout();
  // Arrows between slots and the red yarn joining pinned clues
  ctx.strokeStyle = 'rgba(90,60,20,0.55)'; ctx.fillStyle = 'rgba(90,60,20,0.55)'; ctx.lineWidth = 2.5;
  for (let i = 0; i + 1 < L.rects.length; i++) {
    const a = L.rects[i], b = L.rects[i + 1];
    if (a.row !== b.row) continue;
    const ax = a.x + a.w / 2 + 4, bx = b.x - b.w / 2 - 4;
    ctx.beginPath(); ctx.moveTo(ax, a.y); ctx.lineTo(bx - 3, a.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, a.y); ctx.lineTo(bx - 7, a.y - 5); ctx.lineTo(bx - 7, a.y + 5); ctx.fill();
  }

    const r = L.rects[i];
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = focusTarget() && focusTarget().type === 'slot' && focusTarget().i === i ? '#fff' : 'rgba(90,60,20,0.6)';
    ctx.lineWidth = 2;

    ctx.restore();

        drawIcon(s.ev.id, 0, 0, 0.35); ctx.restore();

        ctx.fillStyle = 'rgba(80,50,20,0.75)'; ctx.font = `600 ${12 * L.cs}px Fredoka, sans-serif`; ctx.textAlign = 'center';
        ctx.fillText(s.ev.time, r.x, r.y + 5);
      } else {
        ctx.fillStyle = 'rgba(80,50,20,0.35)'; ctx.font = `700 ${30 * L.cs}px Fredoka, sans-serif`; ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), r.x, r.y + 10 * L.cs);
      }
    }
    // number badge
    ctx.fillStyle = '#e0a526'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x - r.w / 2 + 2, r.y - r.h / 2 + 2, 10, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), r.x - r.w / 2 + 2, r.y - r.h / 2 + 6);
  });
  if (L.rects.length) {
    ctx.fillStyle = 'rgba(70,45,15,0.8)'; ctx.font = '600 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
    const lastY = Math.max(...L.rects.map((r) => r.y + r.h / 2));
    ctx.fillText('first  →  last', (18 + (L.basket ? L.basket.x - L.basket.w / 2 - 14 : W - 18)) / 2, lastY + 16);
  }
  if (L.basket) drawBasket(L.basket, L.cs);
}

function drawBasket(b, cs) {
  const x = b.x, y = b.y;
  const w = b.w * 0.86, h = b.h * 0.55;
  const ft = focusTarget();
  ctx.fillStyle = '#b07a3a'; ctx.strokeStyle = ft && ft.type === 'basket' ? '#fff' : '#7a4f1a'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y - h / 2 + 10); ctx.lineTo(x + w / 2, y - h / 2 + 10);
  ctx.lineTo(x + w / 2 - 10, y + h / 2 + 10); ctx.lineTo(x - w / 2 + 10, y + h / 2 + 10); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,55,20,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 1; k < 4; k++) { const yy = y - h / 2 + 10 + k * (h / 4); ctx.moveTo(x - w / 2 + 3 + k * 2.5, yy); ctx.lineTo(x + w / 2 - 3 - k * 2.5, yy); }
  ctx.stroke();
  ctx.fillStyle = '#d9a760'; roundRect(x - w / 2 - 4, y - h / 2 + 4, w + 8, 10, 5); ctx.fill();
  ctx.fillStyle = '#fff3d6';
  ctx.font = `700 ${12 * cs}px Fredoka, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('Rumours', x, y - h / 2 - 6);

  ctx.fillStyle = '#fff3d6'; ctx.font = `600 ${11 * cs}px Fredoka, sans-serif`;
  ctx.fillText(`${n}/${cfg.rumours}`, x, y + 8);

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience((state === 'play' || state === 'appear') && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);

    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};
