const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1;
  buildLevel();
  showOverlay('Thomas Believes', 'A gentle Easter detective game',
    `${verseHTML('except')}
     <ul>
       <li>Thomas wasn't there when Jesus came. Help him weigh the <b>evidence</b>!</li>
       <li><b>Tap</b> each witness to hear their story &mdash; they hand you a <b>clue card</b>.</li>
       <li><b>Drag</b> each card onto Thomas's board in the <b>order it happened</b> (or tap a card, then tap its place).</li>
       <li>Some folk only have <b>rumours</b>: put those in the rumour basket.</li>
       <li>Wrong guesses burn the <b>candle</b> down. <b>Keyboard:</b> <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to choose, <kbd>Enter</kbd> to tap.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Begin', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel() {
  buildLevel();
  tapQueueClear();
  state = 'play';
  syncAmbience();
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
  if (level === 1) setTimeout(() => { if (state === 'play' && !cards.length) showMessage(isTouch() ? 'Tap someone to hear their story' : 'Click someone to hear their story'); }, 2300);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Thomas Believes!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('lord')}
       ${verseHTML('blessed')}
       <p class="score">Right first time: <b>${s.order}</b><br>Candle left: <b>${s.candle}</b><br>${s.perfect ? `No mistakes: <b>${s.perfect}</b><br>` : ''}Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Case', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('The candle burned out', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Thomas is still not sure. The friends keep telling him:</p>
       ${verseHTML('seen')}
       <p style="text-align:center">Listen to every witness, then think about <b>when</b> each thing happened.</p>
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play' || state === 'appear') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    if (drag) { drag.card.state = 'tray'; drag = null; }
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
function tapQueueClear() { ripples.length = 0; }

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function cardAt(x, y) {
  for (let i = cards.length - 1; i >= 0; i--) {
    const c = cards[i];
    if (c.state !== 'tray') continue;
    if (Math.abs(x - c.x) < CW * c.sc / 2 + 4 && Math.abs(y - c.y) < CH * c.sc / 2 + 4) return c;
  }
  return null;
}
function personAt(x, y) {
  const order = [...people].sort((a, b) => b.row - a.row);   // front row first
  for (const p of order) {
    if (Math.abs(x - p.x) < 24 * p.s && y > p.y - 78 * p.s && y < p.y + 4) return p;
  }
  return null;
}
function dropTargetAt(x, y) {
  const L = boardLayout();
  for (let i = 0; i < L.rects.length; i++) {
    const r = L.rects[i];
    if (Math.abs(x - r.x) < r.w / 2 + 12 && Math.abs(y - r.y) < r.h / 2 + 12) return { type: 'slot', i };
  }
  if (L.basket && Math.abs(x - L.basket.x) < L.basket.w / 2 + 10 && Math.abs(y - L.basket.y) < L.basket.h / 2 + 14) return { type: 'basket' };
  return null;
}

// A tap (or click) on the playfield
function tapAt(x, y) {
  ripples.push({ x, y, t: 0 });
  if (state === 'appear') { skipBeat(); return; }
  if (state !== 'play') return;
  const c = cardAt(x, y);
  if (c) { selected = selected === c ? null : c; sfx.puff(0.15); return; }
  if (selected) {
    const tg = dropTargetAt(x, y);
    if (tg) { tryPlace(selected, tg); return; }
  }
  const p = personAt(x, y);
  if (p) { talkTo(p); return; }
  selected = null;
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'play') {
    const c = cardAt(p.x, p.y);
    if (c) {
      drag = { card: c, sx: p.x, sy: p.y, px: p.x, py: p.y, ox: c.x - p.x, oy: c.y - p.y, moved: false, id: e.pointerId };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
  }
  tapAt(p.x, p.y);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = toPlayfield(e);
  drag.px = p.x; drag.py = p.y;
  if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) {
    drag.moved = true;
    drag.card.state = 'drag';
    selected = null;
    // lift the card to the top of the pile
    cards.splice(cards.indexOf(drag.card), 1); cards.push(drag.card);
    sfx.puff(0.15);
  }
});
function endDrag(e) {
  sfx.init();
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag;
  drag = null;
  if (!d.moved) { tapAt(d.sx, d.sy); return; }
  const tg = dropTargetAt(d.px, d.py) || dropTargetAt(d.card.x, d.card.y);
  if (tg) tryPlace(d.card, tg);
  else d.card.state = 'tray';
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { if (drag) { drag.card.state = 'tray'; drag = null; } });

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

// Keyboard: arrows move a highlight over witnesses, cards, board slots and
// the basket; Enter / Space taps whatever is highlighted.
function focusList() {
  if (state !== 'play') return [];
  const list = [];
  [...people].sort((a, b) => a.x - b.x).forEach((p) => list.push({ type: 'person', p }));
  cards.filter((c) => c.state === 'tray').forEach((c) => list.push({ type: 'card', c }));
  slots.forEach((s, i) => { if (!s.card) list.push({ type: 'slot', i }); });
  if (cfg.rumours) list.push({ type: 'basket' });
  return list;
}
function focusTarget() {
  if (focusIdx < 0) return null;
  const l = focusList();
  return l.length ? l[Math.min(focusIdx, l.length - 1)] : null;
}
function activateFocus() {
  const f = focusTarget();
  if (!f) { focusIdx = 0; return; }
  if (f.type === 'person') talkTo(f.p);
  else if (f.type === 'card') { selected = selected === f.c ? null : f.c; sfx.puff(0.15); }
  else if (selected) tryPlace(selected, f.type === 'slot' ? { type: 'slot', i: f.i } : { type: 'basket' });
  else showMessage('Choose a clue card first');
}

const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'appear' && (e.code === 'Enter' || e.code === 'Space') && !e.repeat) { skipBeat(); return; }
  if (state !== 'play') return;
  const n = focusList().length;
  if (e.code === 'ArrowRight' || e.code === 'ArrowDown') { focusIdx = focusIdx < 0 ? 0 : (Math.min(focusIdx, n - 1) + 1) % n; }
  else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') { focusIdx = focusIdx < 0 ? n - 1 : (Math.min(focusIdx, n - 1) - 1 + n) % n; }
  else if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) activateFocus();
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// Small extra sounds for the detective work
Object.assign(sfx, {
  talk(high) {
    if (!this.ctx) return;
    const f = high ? 520 : 330;
    this.tone(f, 0.09, 'triangle', 0.12);
    this.tone(f * 1.25, 0.09, 'triangle', 0.1, 0.09);
  },
  place(f) {
    if (!this.ctx) return;
    this.puff(0.12);
    Music.tap(f);
  },
  wrong() { this.tone(260, 0.16, 'sine', 0.3, 0, 180); this.tone(200, 0.2, 'sine', 0.25, 0.14, 140); },
});

// ============================================================
//  Rendering
// ============================================================
function drawSpeech(text, x, headY, alpha, holy) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '600 16px Fredoka, sans-serif';
  const maxW = Math.min(300, W - 40);
  const lines = wrapText(text, maxW - 24);
  const w = Math.min(maxW, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 26);
  const h = lines.length * 20 + 16;
  const bx = clamp(x - w / 2, 10, W - w - 10);
  const by = Math.max(104 - offY, headY - 18 - h);
  ctx.fillStyle = holy ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = holy ? '#e0a526' : '#b98a55'; ctx.lineWidth = holy ? 3 : 2;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(x, bx + 16, bx + w - 16);
  ctx.beginPath(); ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(x, Math.max(by + h + 4, headY - 4)); ctx.lineTo(tx + 8, by + h - 1); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = ctx.fillStyle; ctx.fillRect(tx - 7, by + h - 3, 14, 4);
  ctx.fillStyle = holy ? '#6a4a00' : '#4a3a20';
  ctx.textAlign = 'center';
  lines.forEach((l, k) => ctx.fillText(l, bx + w / 2, by + 22 + k * 20));
  ctx.restore();
}

function drawBubbles() {
  if (bubble) {
    const b = bubble;
    const a = clamp(b.t / 0.2, 0, 1) * clamp((b.dur - b.t) / 0.3, 0, 1);
    drawSpeech(b.text, b.who.x, b.who.y - 80 * b.who.s, a, false);
  }
  const beat = currentBeat();
  if (beat) {
    const a = clamp((appearT - beat.at) / 0.2, 0, 1) * clamp((beat.at + beat.dur - appearT) / 0.3, 0, 1);
    const text = '“' + verseText(beat.key) + '”';
    if (beat.who === 'jesus') drawSpeech(text, jesusX(), FRONT_Y - 92 * 1.15 * peopleScale(), a, true);
    else drawSpeech(text, thomas.x, thomas.y - 82 * thomas.s, a, false);
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const night = cfg.scene === 'night' && state !== 'win' && !(state === 'appear' && appearT > 0.7);
  const ink = night && offY < 60 ? '#fff3d6' : '#5a4210';
  if (night && offY < 60) ctx.shadowColor = 'rgba(0,0,0,0.5)';

  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Thomas Believes' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('CANDLE', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(66, 38, 122, 13, 6.5); ctx.fill();
  const f = clamp(candle / cfg.time, 0, 1);
  const gg = ctx.createLinearGradient(66, 0, 188, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
  ctx.fillStyle = f < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (f > 0) { roundRect(66, 38, 122 * f, 13, 6.5); ctx.fill(); }
  // little flame at the end of the candle bar
  if (f > 0) {
    const fx = 66 + 122 * f, fy = 36;
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.moveTo(fx, fy - 9 - Math.sin(t * 10) * 1.5); ctx.quadraticCurveTo(fx + 5, fy, fx, fy + 2); ctx.quadraticCurveTo(fx - 5, fy, fx, fy - 9 - Math.sin(t * 10) * 1.5); ctx.fill();
  }

  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: evidence found and score
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = ink;
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('EVIDENCE', rx, 20);
  ctx.font = '700 18px Fredoka, sans-serif';
  const done = slots.filter((s) => s.card).length;
  ctx.fillText(`${done} / ${slots.length}`, rx, 41);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SCORE', rx, 60);
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.fillText(String(totalScore), rx, 78);
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = 150;
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

// Keyboard highlight around a witness or card
function drawFocus() {
  const f = focusTarget();
  if (!f || state !== 'play') return;
  ctx.save();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
  if (f.type === 'person') { const p = f.p; roundRect(p.x - 26 * p.s, p.y - 82 * p.s, 52 * p.s, 86 * p.s, 12); ctx.stroke(); }
  else if (f.type === 'card') { const c = f.c; roundRect(c.x - CW * c.sc / 2 - 5, c.y - CH * c.sc / 2 - 5, CW * c.sc + 10, CH * c.sc + 10, 10); ctx.stroke(); }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawScene();

  // Heavenly light when Jesus comes (the doors being shut)
  const showJ = (state === 'appear' && appearT > 1.8) || state === 'win';
  const jAlpha = state === 'win' ? 1 : clamp((appearT - 2.0) / 0.6, 0, 1);
  if (showJ) {
    const jx = jesusX();
    const lg = ctx.createRadialGradient(jx, FRONT_Y - 60, 10, jx, FRONT_Y - 60, 320);
    const la = clamp((appearT - 1.8) / 0.6, 0, 1) * 0.55 + (state === 'win' ? 0.55 : 0);
    lg.addColorStop(0, `rgba(255,248,210,${Math.min(0.8, la)})`); lg.addColorStop(1, 'rgba(255,248,210,0)');
    ctx.fillStyle = lg; ctx.fillRect(-offX, -offY, viewW, SCENE_BOT + offY);
  }

  const back = people.filter((p) => p.row === 0), front = people.filter((p) => p.row === 1);
  for (const p of back) drawPerson(p);
  for (const p of front) drawPerson(p);
  if (showJ) drawJesus(jesusX(), FRONT_Y + 2, 1.15 * peopleScale(), jAlpha, state === 'win' || appearT > 5.2 ? 'show' : 'open');
  drawPerson(thomas);
  for (const p of back) drawTag(p);
  for (const p of front) drawTag(p);
  drawThought();

  drawTable();
  drawBoard();
  // Yarn joining the pinned clues in order, like a real detective's board
  const L = boardLayout();
  const pinned = slots.map((s, i) => (s.card ? L.rects[i] : null));
  ctx.strokeStyle = 'rgba(192,57,43,0.8)'; ctx.lineWidth = 2;
  for (let i = 0; i + 1 < pinned.length; i++) {
    const a = pinned[i], b = pinned[i + 1];
    if (!a || !b || !slots[i].card || slots[i].card.state !== 'placed' || Math.hypot(slots[i + 1].card.x - b.x, slots[i + 1].card.y - b.y) > 4) continue;
    ctx.beginPath(); ctx.moveTo(a.x, a.y - a.h / 2 + 2);
    ctx.quadraticCurveTo((a.x + b.x) / 2, Math.max(a.y, b.y) - a.h / 2 + 14, b.x, b.y - b.h / 2 + 2); ctx.stroke();
  }
  for (const c of cards) if (c.state !== 'drag') drawCard(c);
  drawFocus();
  drawParticles();
  for (const c of cards) if (c.state === 'drag') drawCard(c);

  drawBubbles();

  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 50, 0, TAU); ctx.stroke();
  }

  drawMessage();

  // "Eight days later..." fade
  if (state === 'appear' && appearT < 2.0) {
    const a = appearT < 0.7 ? appearT / 0.7 : appearT < 1.4 ? 1 : 1 - (appearT - 1.4) / 0.6;
    ctx.fillStyle = `rgba(40,28,15,${0.92 * a})`;
    ctx.fillRect(-offX, -offY, viewW, SCENE_BOT + offY);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff3d6'; ctx.textAlign = 'center'; ctx.font = '700 30px Fredoka, sans-serif';
    ctx.fillText('Eight days later…', W / 2, 300);
    ctx.globalAlpha = 1;
  }

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 1.5})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  updateCards(dt);
  if (state === 'play') {
    candle -= dt;
    if (candle <= 0) { candle = 0; fail(); }
  } else if (state === 'appear') {
    updateAppear(dt);
  } else if (state === 'win' && Math.random() < dt * 12) {
    spawn(jesusX() + rand(-40, 40), FRONT_Y - rand(0, 80), 0, -20, 1, '#fff6d0', 3);
  }
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.dur) bubble = null; }
  worriedT = Math.max(0, worriedT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { if (thomas) placePeople(); });
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
