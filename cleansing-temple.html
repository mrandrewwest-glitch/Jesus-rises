// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  // A short burst of filtered noise (flutters, swishes, clatters)
  noiseBurst(delay, dur, freq, q, vol, type = 'bandpass', sweepTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  pop(kind) { this.tone(kind === 'stall' ? 520 : 660, 0.12, 'sine', 0.08, 0, kind === 'stall' ? 780 : 880); },
  coins(amount = 1) {
    const n = Math.round(3 + amount * 6);
    for (let k = 0; k < n; k++) this.tone(rand(1800, 3300), 0.12, 'triangle', 0.06, k * 0.045 + rand(0, 0.02));
    if (amount > 0.5) this.noiseBurst(0, 0.18, 300, 1, 0.25, 'lowpass');   // the table thumps down
  },
  flutter() { for (let k = 0; k < 5; k++) this.noiseBurst(k * 0.06, 0.05, 2200, 1.2, 0.12); },
  baa() { this.tone(420, 0.38, 'sawtooth', 0.045, 0, 350); this.tone(432, 0.38, 'square', 0.02, 0, 360); },
  moo() { this.tone(150, 0.55, 'sawtooth', 0.07, 0, 105); },
  swish() { this.noiseBurst(0, 0.16, 800, 1.5, 0.18, 'bandpass', 3500); },
  oops() { this.tone(330, 0.25, 'sine', 0.3, 0, 200); this.tone(250, 0.3, 'sine', 0.2, 0.12, 180); },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// ============================================================
//  Scenery: sky, clouds, the temple, golden colonnades, stone court
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 6 }, () => ({
  f: Math.random(), y: rand(40, 230), w: rand(80, 160), speed: rand(4, 10),
}));

function updateScenery(dt) {
  for (const c of bgClouds) {
    c.f += (c.speed * dt) / (W + 300);
    if (c.f > 1) c.f -= 1;
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, FLOOR_Y);
  g.addColorStop(0, '#8fcaf0');
  g.addColorStop(0.55, '#cfe9f7');
  g.addColorStop(1, '#fff1d0');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
}

// Warm morning sun behind the sanctuary, with slowly turning rays
function drawSunAndRays() {
  const cx = W / 2, cy = 120;
  const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 300);
  glow.addColorStop(0, 'rgba(255,250,225,0.95)');
  glow.addColorStop(0.35, 'rgba(255,236,170,0.45)');
  glow.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 300, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.03);
  ctx.fillStyle = `rgba(255,244,190,${0.14 + peaceT * 0.08})`;
  for (let i = 0; i < 14; i++) {
    ctx.rotate(TAU / 14);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-38, -1000); ctx.lineTo(38, -1000); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function templeW() { return clamp(W * 0.5, 250, 430); }

function drawBackWall() {
  const x0 = -offX, x1 = W + offX;
  const g = ctx.createLinearGradient(0, 290, 0, FLOOR_Y);
  g.addColorStop(0, '#f3e7c9'); g.addColorStop(1, '#e2cf9f');
  ctx.fillStyle = g;
  ctx.fillRect(x0, 290, x1 - x0, FLOOR_Y - 290);
  // stone courses
  ctx.strokeStyle = 'rgba(160,125,70,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let y = 318; y < FLOOR_Y; y += 26) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
}

function drawColonnade() {
  const cx = W / 2, tw = templeW();
  const x0 = -offX, x1 = W + offX;
  const gapL = cx - tw / 2 - 26, gapR = cx + tw / 2 + 26;
  const top = 262, beamH = 26, colTop = top + beamH;
  for (const [a, b] of [[x0, gapL], [gapR, x1]]) {
    if (b <= a) continue;
    // shade inside the porch
    ctx.fillStyle = 'rgba(150,105,50,0.22)';
    ctx.fillRect(a, colTop, b - a, FLOOR_Y - colTop);
    // roof and golden beam
    ctx.fillStyle = '#c9a36a';
    ctx.fillRect(a, top - 10, b - a, 12);
    const beam = ctx.createLinearGradient(0, top, 0, colTop);
    beam.addColorStop(0, '#ffe08a'); beam.addColorStop(1, '#c98e1b');
    ctx.fillStyle = beam;
    ctx.fillRect(a, top, b - a, beamH);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let x = a + 8; x < b - 8; x += 22) ctx.fillRect(x, top + 6, 10, 4);    // carved dentils
  }
  // columns
  const step = 64;
  const n0 = Math.floor(x0 / step) - 1, n1 = Math.ceil(x1 / step) + 1;
  for (let k = n0; k <= n1; k++) {
    const x = cx + (k + 0.5) * step;
    if (x > gapL - 14 && x < gapR + 14) continue;
    if (x < x0 - 20 || x > x1 + 20) continue;
    const g = ctx.createLinearGradient(x - 9, 0, x + 9, 0);
    g.addColorStop(0, '#c98e1b'); g.addColorStop(0.45, '#fff0b8'); g.addColorStop(1, '#b67d16');
    ctx.fillStyle = g;
    ctx.fillRect(x - 8, colTop, 16, FLOOR_Y - colTop - 6);
    ctx.fillStyle = '#e0a526';
    roundRect(x - 14, colTop, 28, 9, 3); ctx.fill();
    roundRect(x - 13, FLOOR_Y - 10, 26, 9, 3); ctx.fill();
  }
}

function drawTemple() {
  const cx = W / 2, tw = templeW();
  const base = FLOOR_Y - 26;
  // body of the sanctuary
  const marble = ctx.createLinearGradient(cx - tw / 2, 0, cx + tw / 2, 0);
  marble.addColorStop(0, '#e9dcbc'); marble.addColorStop(0.5, '#fffaf0'); marble.addColorStop(1, '#e3d3ae');
  ctx.fillStyle = marble;
  ctx.fillRect(cx - tw / 2, 176, tw, base - 176);
  ctx.fillRect(cx - tw * 0.3, 112, tw * 0.6, 70);
  // golden cornices with little golden spikes along the roof
  ctx.fillStyle = '#e0a526';
  ctx.fillRect(cx - tw / 2 - 6, 172, tw + 12, 12);
  ctx.fillRect(cx - tw * 0.3 - 6, 108, tw * 0.6 + 12, 12);
  ctx.fillStyle = '#ffd766';
  ctx.fillRect(cx - tw / 2 - 6, 172, tw + 12, 3);
  ctx.fillRect(cx - tw * 0.3 - 6, 108, tw * 0.6 + 12, 3);
  ctx.fillStyle = '#e0a526';
  ctx.beginPath();
  for (let x = cx - tw / 2; x <= cx + tw / 2 + 0.1; x += 14) {
    if (Math.abs(x - cx) < tw * 0.3) continue;
    ctx.moveTo(x - 2, 172); ctx.lineTo(x, 162); ctx.lineTo(x + 2, 172);
  }
  for (let x = cx - tw * 0.3; x <= cx + tw * 0.3 + 0.1; x += 14) { ctx.moveTo(x - 2, 108); ctx.lineTo(x, 97); ctx.lineTo(x + 2, 108); }
  ctx.fill();
  // golden pilasters
  ctx.fillStyle = 'rgba(224,165,38,0.55)';
  for (const f of [-0.47, -0.3, 0.3, 0.47]) ctx.fillRect(cx + f * tw - 5, 184, 10, base - 184);
  // the great doorway with the veil
  const dw = tw * 0.26, dTop = 222;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - dw / 2, base); ctx.lineTo(cx - dw / 2, dTop + dw / 2);
  ctx.arc(cx, dTop + dw / 2, dw / 2, Math.PI, TAU);
  ctx.lineTo(cx + dw / 2, base); ctx.closePath();
  ctx.fillStyle = '#3f5fb5'; ctx.fill();
  ctx.clip();
  const cols = ['#3f5fb5', '#7b3fa0', '#c0392b', '#f4efe0'];
  for (let k = 0; k < 8; k++) {
    ctx.fillStyle = cols[k % 4];
    const x = cx - dw / 2 + (k * dw) / 8;
    const wave = Math.sin(t * 1.2 + k) * 1.5;
    ctx.fillRect(x + wave, dTop - 5, dw / 8 + 1, base - dTop + 10);
  }
  const shadeG = ctx.createLinearGradient(0, dTop, 0, base);
  shadeG.addColorStop(0, 'rgba(0,0,0,0.25)'); shadeG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shadeG; ctx.fillRect(cx - dw, dTop - 10, dw * 2, base - dTop + 10);
  if (peaceT > 0) {                 // light pours from the house of prayer
    ctx.fillStyle = `rgba(255,248,210,${Math.min(0.7, peaceT * 0.35)})`;
    ctx.fillRect(cx - dw, dTop - 10, dw * 2, base - dTop + 10);
  }
  ctx.restore();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - dw / 2, base); ctx.lineTo(cx - dw / 2, dTop + dw / 2);
  ctx.arc(cx, dTop + dw / 2, dw / 2, Math.PI, TAU);
  ctx.lineTo(cx + dw / 2, base); ctx.stroke();
  // golden vine above the door
  const vw = tw * 0.22;
  ctx.strokeStyle = '#c98e1b'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = -vw; x <= vw; x += 4) (x === -vw ? ctx.moveTo : ctx.lineTo).call(ctx, cx + x, 200 + Math.sin(x / 9) * 4);
  ctx.stroke();
  for (let x = -vw + 10; x <= vw - 10; x += 22) {
    ctx.fillStyle = '#6fa04a';
    ctx.beginPath(); ctx.ellipse(cx + x + 6, 196 + Math.sin((x + 6) / 9) * 4, 5, 3, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8e44ad';
    for (const [gx, gy] of [[0, 0], [4, 0], [2, 3.5], [-2, 3.5], [0, 7]]) { ctx.beginPath(); ctx.arc(cx + x + gx, 205 + gy + Math.sin(x / 9) * 4, 2.2, 0, TAU); ctx.fill(); }
  }
  // steps up to the sanctuary
  for (let k = 0; k < 3; k++) {
    ctx.fillStyle = k % 2 ? '#e6d6ad' : '#f2e6c8';
    ctx.fillRect(cx - tw / 2 - 12 - k * 14, base + k * 9, tw + 24 + k * 28, 9);
  }
}

function drawFloor() {
  const x0 = -offX, x1 = W + offX, cx = W / 2;
  const g = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  g.addColorStop(0, '#efe0bc'); g.addColorStop(1, '#d5bd8a');
  ctx.fillStyle = g;
  ctx.fillRect(x0, FLOOR_Y, x1 - x0, H - FLOOR_Y + 2);
  // flagstones in gentle perspective
  ctx.strokeStyle = 'rgba(150,115,60,0.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let k = 1; k < 10; k++) {
    const y = FLOOR_Y + (H - FLOOR_Y) * Math.pow(k / 9, 1.5);
    ctx.moveTo(x0, y); ctx.lineTo(x1, y);
  }
  for (let m = -14; m <= 14; m++) {
    const xb = cx + m * 110;
    ctx.moveTo(cx + (xb - cx) * 0.4, FLOOR_Y); ctx.lineTo(xb, H);
  }
  ctx.stroke();
  // ledge where the floor meets the wall
  ctx.fillStyle = 'rgba(150,115,60,0.3)';
  ctx.fillRect(x0, FLOOR_Y - 2, x1 - x0, 4);
}

// Soft sunbeams slanting across the court
function drawSunbeams() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 4; k++) {
    const x = W * (0.12 + k * 0.27) + Math.sin(t * 0.3 + k) * 12;
    ctx.fillStyle = `rgba(255,236,170,${0.06 + peaceT * 0.03})`;
    ctx.beginPath();
    ctx.moveTo(x, -offY); ctx.lineTo(x + 70, -offY);
    ctx.lineTo(x + 70 + 260, H); ctx.lineTo(x + 180, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// After the cleansing: golden rays spread from the sanctuary door
function drawPeace() {
  if (peaceT <= 0) return;
  const a = Math.min(1, peaceT / 1.2);
  const cx = W / 2, cy = 300;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t * 0.4) * 0.05);
  ctx.fillStyle = `rgba(255,240,180,${0.22 * a})`;
  for (let i = 0; i < 9; i++) {
    const ang = Math.PI * (0.12 + (i / 8) * 0.76);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(ang - 0.05) * 1400, Math.sin(ang - 0.05) * 1400);
    ctx.lineTo(Math.cos(ang + 0.05) * 1400, Math.sin(ang + 0.05) * 1400);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 380);
  glow.addColorStop(0, `rgba(255,250,220,${0.6 * a})`);
  glow.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 380, 0, TAU); ctx.fill();
}

// ============================================================
//  Drawing the things in the court
// ============================================================
const finePointer = matchMedia('(pointer: fine)').matches;

function drawCursor() {
  if (state !== 'play' || !(kbUsed || finePointer)) return;
  const sl = slots[cursor];
  if (!sl) return;
  const pulse = 0.5 + 0.5 * Math.sin(t * 6);
  ctx.save();
  ctx.translate(sl.x, sl.y + 2);
  ctx.fillStyle = `rgba(255,226,122,${0.25 + pulse * 0.15})`;
  ctx.strokeStyle = `rgba(224,165,38,${0.7 + pulse * 0.3})`;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, 58 * sl.s, 15 * sl.s, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawSlotThing(sl) {
  const o = sl.occ;
  const k = Math.max(0.01, easeOutBack(o.popT));
  ctx.save();
  ctx.translate(sl.x, sl.y);
  ctx.globalAlpha = clamp(o.popT * 3, 0, 1);
  ctx.fillStyle = 'rgba(90,65,30,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 44 * sl.s * k, 8 * sl.s, 0, 0, TAU); ctx.fill();
  ctx.scale(sl.s * k, sl.s * k);
  if (o.wobT > 0) ctx.rotate(Math.sin(o.wobT * 45) * 0.1 * (o.wobT / 0.4));
  drawThing(o);
  // gold pips: how many more taps it needs
  if (o.maxHp > 1) {
    const y = -THING_TOP[o.type] - 10;
    for (let n = 0; n < o.maxHp; n++) {
      const x = (n - (o.maxHp - 1) / 2) * 14;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU);
      ctx.fillStyle = n < o.hp ? '#f5c542' : 'rgba(255,255,255,0.7)';
      ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2;
      ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawLeaver(o) {
  ctx.save();
  if (o.type === 'table') {
    ctx.globalAlpha = clamp((1.8 - o.outT) / 0.5, 0, 1);
    // the merchant scurries off, looking back in shock, arms flailing
    ctx.save();
    ctx.translate(o.x + o.lx, o.y - 2 - Math.abs(Math.sin(t * 20)) * 4 * o.s);
    ctx.scale(o.s, o.s);
    drawPerson(o.person, 'run', -o.dir * 0.8, -0.3);
    ctx.restore();
    // the table tips over
    const f = Math.min(1, o.outT / 0.3);
    ctx.translate(o.x + o.dir * Math.min(o.outT, 0.3) * 30, o.y);
    ctx.scale(o.s, o.s);
    drawMoneyTable(o, (1 - (1 - f) * (1 - f)) * 1.85, false);
  } else if (o.type === 'doves') {
    ctx.globalAlpha = clamp((1.1 - o.outT) / 0.4, 0, 1);
    ctx.translate(o.x, o.y); ctx.scale(o.s, o.s);
    drawDoveCage(o, Math.min(1, o.outT * 5));
  } else if (o.type === 'sheep' || o.type === 'ox') {
    const hop = Math.abs(Math.sin(o.outT * (o.type === 'sheep' ? 14 : 10))) * (o.type === 'sheep' ? 9 : 4);
    ctx.translate(o.x + o.lx, o.y - hop * o.s);
    ctx.scale(o.s, o.s);
    drawThing(o, { happy: true, run: true });
  } else {
    ctx.globalAlpha = clamp(1 - o.outT / 0.8, 0, 1);
    ctx.translate(o.x + o.lx, o.y - Math.abs(Math.sin(o.outT * 10)) * 2);
    ctx.scale(o.s, o.s);
    drawThing(o, { run: true });
  }
  ctx.restore();
}

function drawCourt() {
  const list = [];
  for (const sl of slots) if (sl.occ) list.push({ y: sl.y, fn: () => drawSlotThing(sl) });
  for (const o of leavers) list.push({ y: o.y - 0.5, fn: () => drawLeaver(o) });
  if (jesus) list.push({ y: jesus.y, fn: () => drawJesus(jesus) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.fn();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + market meter
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Cleansing the Temple' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('MARKET', 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(66, 38, 124, 13, 6.5); ctx.fill();
    const m = meter / 100;
    const col = m < 0.45 ? '#8fcf6e' : m < 0.7 ? '#f7b538' : '#e8590c';
    ctx.fillStyle = m > 0.7 && Math.sin(t * 12) > 0 ? '#ff6b6b' : col;
    if (m > 0.01) { roundRect(66, 38, Math.max(13, 124 * m), 13, 6.5); ctx.fill(); }
  }
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: stalls cleared, time, score, combo
  if (state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`Cleared ${Math.min(cleared, cfg.goal)}/${cfg.goal}`, rx, 26);
    const tl = Math.ceil(timeLeft);
    ctx.fillStyle = tl <= 10 && state === 'play' && Math.sin(t * 10) > 0 ? '#c92a2a' : '#5a4210';
    ctx.fillText(`Time ${tl}`, rx, 48);
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.fillText(`Score ${totalScore + (state === 'win' ? 0 : levelPoints)}`, rx, 68);
    if (combo >= 2 && state === 'play') {
      ctx.fillStyle = '#2b8a3e';
      ctx.font = '700 14px Fredoka, sans-serif';
      ctx.fillText(`Combo ×${combo}`, rx, 88);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, 400);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, 400);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!slots.length) buildSlots();
  layoutSlots();
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawSunAndRays();
  for (const c of bgClouds) drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');
  drawBackWall();
  drawTemple();
  drawColonnade();
  drawFloor();
  drawSunbeams();
  drawPeace();
  drawCursor();
  drawCourt();
  drawCoins();
  drawParticles();
  drawBirds();
  drawNotes();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawPopups();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  if (!slots.length) buildSlots();
  layoutSlots();
  updateScenery(dt);
  updateParticles(dt);
  updateCoins(dt);
  updateBirds(dt);
  updateNotes(dt);
  updatePopups(dt);
  updateSlots(dt);
  updateLeavers(dt);
  updateJesus(dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win') updatePeace(dt);
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
