<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Cleansing the Temple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Cleansing the Temple</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script>
'use strict';

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// ============================================================
//  Tuning
// ============================================================
const FLOOR_Y = 445;                 // where the court's stone floor begins
const ROW_Y = [580, 720, 860];       // feet line of each row of stall positions
const ROW_S = [1.0, 1.15, 1.3];      // things nearer the front are drawn bigger
const STALL_POINTS = 100;            // per stall cleared
const COMBO_POINTS = 10;             // extra per step of the combo streak
const WORSHIP_PENALTY = 100;         // tapping a worshipper
const LEVEL_TIME = 60;             // seconds per level

const LEVEL_NAMES = [
  'Passover Morning',
  'Busy Market Day',
  'The Money Changers',
  'Sneaky Sellers',
  'Crowded Courts',
  'The Great Feast',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Feast Day ${n}`,
    gap: Math.max(0.5, 1.45 - (n - 1) * 0.17),              // seconds between pop-ups
    worship: Math.min(0.42, 0.16 + (n - 1) * 0.06),         // chance a pop-up is a worshipper
    maxWorship: Math.min(4, 2 + Math.floor(n / 2)),
    wLife: [Math.max(1.8, 3.6 - n * 0.25), Math.max(2.6, 5 - n * 0.3)],
    goal: 15 + (n - 1) * 4,                                 // stalls to clear
    time: LEVEL_TIME,
    rise: 1.6 + n * 0.5,                                    // market noise per standing stall per second
    decay: 3.5,                                             // the court calms itself a little
    ox: n >= 2,                                             // oxen need two taps
    heavy: n >= 3 ? Math.min(0.45, 0.22 + (n - 3) * 0.08) : 0,   // heavy tables need two taps
    sneaky: n >= 4 ? Math.min(0.4, 0.22 + (n - 4) * 0.06) : 0,   // sneaky sellers come back once
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('templeBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let slots = [];           // stall positions around the court
let leavers = [];         // things on their way out (tables flipping, sheep trotting off...)
let particles = [];
let coins = [];
let birds = [];
let notes = [];
let popups = [];
let message = { text: '', t: 0 };
let jesus = null;
let meter = 0;            // market noise, 0..100
let timeLeft = 60;
let cleared = 0;
let levelPoints = 0;
let combo = 0, bestCombo = 0;
let tappedWorshipper = false;
let spawnT = 1, spawnCount = 0;
let returnQueue = [];     // sneaky sellers waiting to sneak back in
let peaceT = 0, peaceFillT = 0;
let shakeT = 0, flashT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let cursor = 4;
let kbUsed = false;
let noisyWarned = false;
let worshipHintShown = false;

// ============================================================
//  Stall positions (a grid of spots on the court floor)
// ============================================================
function buildSlots() {
  const cols = W < 700 ? 3 : W < 1000 ? 4 : 5;
  slots = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < cols; c++) slots.push({ i: slots.length, r, c, cols, x: 0, y: ROW_Y[r], s: ROW_S[r], side: 1, occ: null, cd: 0 });
  }
  layoutSlots();
  cursor = Math.min(slots.length - 1, cols + Math.floor(cols / 2));   // middle of the court
}

// Recomputed every frame so a resize or rotation just works
function layoutSlots() {
  for (const sl of slots) {
    sl.x = W * (sl.c + 0.5) / sl.cols + (sl.r === 1 ? 0 : (sl.c % 2 ? 6 : -6));
    // Things are driven out toward the nearest side gate; Jesus stands on the other side
    sl.side = Math.abs(sl.c + 0.5 - sl.cols / 2) < 0.01 ? (sl.r % 2 ? 1 : -1) : Math.sign(sl.c + 0.5 - sl.cols / 2);
  }
}

// ============================================================
//  People: merchants and worshippers
// ============================================================
const MERCHANT_LOOKS = [
  { robe: '#8e44ad', hair: '#2e1d10', beard: true,  skin: '#d7a070', scarf: '#f1c40f', stripe: '#f1c40f' },
  { robe: '#16a085', hair: '#1f140c', beard: true,  skin: '#c58a55', scarf: '#e67e22', stripe: '#e67e22' },
  { robe: '#c0392b', hair: '#4a2f1a', beard: true,  skin: '#e3b184', scarf: '#f5deb3', stripe: '#f5deb3' },
  { robe: '#2c5aa0', hair: '#3a2716', beard: false, skin: '#bf8150', scarf: '#e74c3c', stripe: '#e74c3c' },
  { robe: '#d35400', hair: '#1c120b', beard: true,  skin: '#c88e5a', scarf: '#8e44ad', stripe: '#fff3c4' },
];
const WORSHIP_LOOKS = {
  pray: [
    { robe: '#e8dcc0', hair: '#5c3a1c', beard: true,  skin: '#d39a66' },
    { robe: '#9bb7d4', hair: '#3a2515', beard: false, skin: '#e3b184', scarf: '#f4efe0' },
    { robe: '#b7c9a8', hair: '#8a8a8a', beard: true,  skin: '#c98d56' },
  ],
  child: [
    { robe: '#ffb3c1', hair: '#4a2f1a', beard: false, skin: '#e3b184' },
    { robe: '#ffd166', hair: '#2e1d10', beard: false, skin: '#c58a55' },
    { robe: '#8fd3c9', hair: '#6b3f1d', beard: false, skin: '#dca678' },
  ],
  widow: [{ robe: '#4b4453', hair: '#bdbdbd', beard: false, skin: '#d7a070', scarf: '#6d6875' }],
  pilgrim: [
    { robe: '#a0673a', hair: '#3a2515', beard: true, skin: '#c78f5c', scarf: '#e8dcc0' },
    { robe: '#5a7a4b', hair: '#1f140c', beard: true, skin: '#b87a48', scarf: '#d8c7a0' },
  ],
};
const WORSHIP_POSE = { pray: 'kneel', child: 'stand', widow: 'offer', pilgrim: 'staff' };
const WORSHIP_MOOD = { pray: 'pray', child: 'joy', widow: 'watch', pilgrim: 'watch' };

let personId = 0;
function makePerson(look, mood) {
  return { ...look, i: personId++, mood, blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU) };
}

function updateBlink(d, dt) {
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

// Adapted from the disciples in Jesus Rises. Origin = feet, about 72 tall.
// pose: stand | kneel | offer (widow's two mites) | staff (pilgrim) | run (flailing, scurrying off)
function drawPerson(d, pose = 'stand', lx = 0, ly = 0) {
  const mood = d.mood;
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const kneel = pose === 'kneel';
  if (kneel) ctx.translate(0, 14);
  const rb = kneel ? -14 : 0;       // bottom of the robe
  let armsDone = false;

  // Arms up behind the head: flailing when scurrying, waving for joy
  if (pose === 'run') {
    const w = Math.sin(t * 24 + d.phase);
    arm(-11, -32, -25 + w * 5, -62 - w * 7);
    arm(11, -32, 25 + w * 5, -62 + w * 7);
    armsDone = true;
  } else if (mood === 'joy' || mood === 'sing') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
    armsDone = true;
  }

  // Pilgrim's walking staff
  if (pose === 'staff') {
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(21, -82); ctx.lineTo(21, 0); ctx.stroke();
  }

  // Scurrying feet
  if (pose === 'run') {
    const w = Math.sin(t * 24 + d.phase);
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath(); ctx.ellipse(-7 + w * 7, 0, 6, 3, 0, 0, TAU); ctx.ellipse(7 - w * 7, 0, 6, 3, 0, 0, TAU); ctx.fill();
  }

  // Kneeling legs folded under the robe
  if (kneel) {
    ctx.fillStyle = shade(d.robe, -10);
    ctx.beginPath(); ctx.ellipse(4, -19, 24, 9, 0, 0, TAU); ctx.fill();
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, rb);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, rb);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (d.stripe) {                     // merchants wear bold striped robes
    ctx.save(); ctx.clip();
    ctx.strokeStyle = d.stripe; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-7, -40); ctx.lineTo(-7, rb); ctx.moveTo(7, -40); ctx.lineTo(7, rb); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (d.stripe) {                     // money pouch on the belt
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.arc(11, -12, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(11, -16, 1.8, 0, TAU); ctx.fill();
  }

  // Resting arms
  if (!armsDone) {
    if (kneel || mood === 'pray') { arm(-11, -32, -2, -40); arm(11, -32, 2, -40); }          // hands together in prayer
    else if (pose === 'offer') {                                                         // two mites held out
      arm(-11, -32, -15, -12); arm(11, -32, 23, -28);
      ctx.fillStyle = '#c47a3a'; ctx.strokeStyle = '#8a4a1a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(22, -33, 2.4, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(27, -31, 2.4, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (pose === 'staff') { arm(-11, -32, -15, -12); arm(11, -32, 20, -40); }
    else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }        // hands clasped
    else if (mood === 'sly' || mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }   // folded arms
    else if (mood !== 'shock' && mood !== 'dismay') { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (pose !== 'run') {
    if (mood === 'shock') {
      arm(-11, -32, -15, hy + 4);
      arm(11, -32, 15, hy + 4);
    } else if (mood === 'dismay' && d.i % 2 === 0) {
      arm(11, -32, 2, hy - 3);   // facepalm
      ctx.fillStyle = d.skin;
      roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
      arm(-11, -32, -15, -12);
    } else if (mood === 'dismay') {
      arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
    }
  }
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const happyEyes = () => {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  };
  const blush = () => {
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      happyEyes();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      blush();
      break;
    case 'pray':     // eyes gently closed, a peaceful smile
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3 * Math.cos(0.15 * Math.PI), ey - 1 + 3 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      mouthLine(() => ctx.arc(0, mouthY - 3, 3.5, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'sing':     // happy eyes, a round singing mouth
      happyEyes();
      mouthFill(() => ctx.ellipse(0, mouthY, 3.4, 4.4 + Math.sin(t * 8 + d.phase) * 1.2, 0, 0, TAU));
      blush();
      break;
    case 'sly':      // a sneaky seller's side-eye and smirk
      for (const sx of [-ex, ex]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(sx, ey + 1, 3.6, 2.6, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.arc(sx + 1.6, ey + 1.3, 1.8, 0, TAU); ctx.fill();
        ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(sx - 4, ey - 0.5); ctx.lineTo(sx + 4, ey - 0.5); ctx.stroke();
      }
      brows(-6, -9, -9, -6);
      mouthLine(() => { ctx.moveTo(-5, mouthY - 1); ctx.quadraticCurveTo(1, mouthY + 2, 6, mouthY - 4); });
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Stalls and animals
// ============================================================
function drawMoneyTable(o, flip = 0, withCoins = true) {
  ctx.save();
  if (flip) {                     // tip over the far edge, away from Jesus
    const px = o.dir * 46;
    ctx.translate(px, 0); ctx.rotate(o.dir * flip); ctx.translate(-px, 0);
  }
  const wood = o.heavy ? '#7a4a22' : '#b0733a';
  ctx.fillStyle = shade(wood, -25);
  ctx.fillRect(-40, -34, 7, 34); ctx.fillRect(33, -34, 7, 34);
  // Cloth front with a golden fringe
  ctx.fillStyle = o.cloth;
  roundRect(-44, -34, 88, 18, 2); ctx.fill();
  ctx.fillStyle = '#f5c542';
  for (let x = -40; x <= 40; x += 8) { ctx.beginPath(); ctx.arc(x, -15, 2, 0, TAU); ctx.fill(); }
  // Table top
  ctx.fillStyle = wood; ctx.strokeStyle = shade(wood, -45); ctx.lineWidth = 1.5;
  roundRect(-47, -41, 94, 9, 3); ctx.fill(); ctx.stroke();
  if (o.heavy) {                  // iron bands on a heavy table
    ctx.fillStyle = '#5b5f66';
    ctx.fillRect(-30, -41, 5, 9); ctx.fillRect(25, -41, 5, 9);
    ctx.fillRect(-44, -26, 88, 3);
  }
  if (withCoins) {
    for (const [x, n] of [[-28, 4], [-12, 6], [16, 3]]) {
      for (let k = 0; k < n; k++) {
        ctx.fillStyle = k === n - 1 ? '#ffe27a' : '#f5c542'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(x, -43 - k * 3, 7, 2.6, 0, 0, TAU); ctx.fill(); ctx.stroke();
      }
    }
    ctx.fillStyle = '#e8e8e8';     // a few silver coins
    ctx.beginPath(); ctx.ellipse(2, -43, 5, 2, 0, 0, TAU); ctx.fill();
    // Little balance scales
    ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(34, -41); ctx.lineTo(34, -62); ctx.moveTo(24, -60); ctx.lineTo(44, -60); ctx.stroke();
    ctx.fillStyle = '#d4a53a';
    for (const sx of [24, 44]) { ctx.beginPath(); ctx.arc(sx, -52, 5, 0, Math.PI); ctx.fill(); }
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(24, -60); ctx.lineTo(20, -52); ctx.moveTo(24, -60); ctx.lineTo(28, -52);
    ctx.moveTo(44, -60); ctx.lineTo(40, -52); ctx.moveTo(44, -60); ctx.lineTo(48, -52); ctx.stroke();
  }
  ctx.restore();
}

function drawDove(x, y, dir, flap) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b9c6d6'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-12, -4); ctx.lineTo(-11, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(6, -4, 3.8, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f39c12';
  ctx.beginPath(); ctx.moveTo(9.5, -4.5); ctx.lineTo(12.5, -3.5); ctx.lineTo(9.5, -2.5); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(7, -5, 0.9, 0, TAU); ctx.fill();
  // wing
  ctx.fillStyle = '#eef3fa';
  ctx.beginPath(); ctx.ellipse(-1, -2 - flap * 5, 6, 3, -0.3 - flap * 0.9, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawDoveCage(o, open = 0) {
  // wooden stand
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-22, -30, 5, 30); ctx.fillRect(17, -30, 5, 30);
  ctx.fillStyle = '#b0733a';
  roundRect(-30, -35, 60, 7, 3); ctx.fill();
  ctx.fillStyle = '#7a4f24';
  roundRect(-27, -42, 54, 7, 3); ctx.fill();
  // doves inside
  if (!open) {
    drawDove(-10, -50, 1, Math.max(0, Math.sin(t * 5 + o.i)) * 0.4);
    drawDove(11, -56, -1, Math.max(0, Math.sin(t * 6 + o.i + 1)) * 0.4);
    if (o.three) drawDove(1, -66, 1, 0);
  }
  // domed bars
  ctx.strokeStyle = '#c49a4a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -42, 25, Math.PI, TAU); ctx.stroke();
  ctx.beginPath();
  for (let x = -18; x <= 18; x += 9) { ctx.moveTo(x, -42); ctx.lineTo(x, -42 - Math.sqrt(625 - x * x)); }
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-24, -52); ctx.lineTo(24, -52); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -71, 4, 0, TAU); ctx.stroke();
  // little door: swings open when tapped
  ctx.fillStyle = 'rgba(196,154,74,0.35)'; ctx.strokeStyle = '#a07a2a'; ctx.lineWidth = 2;
  const sw = open ? Math.min(1, open) : 0;
  ctx.beginPath();
  ctx.moveTo(-7, -43); ctx.lineTo(-7, -58);
  ctx.lineTo(-7 + 14 * (1 - sw * 1.8), -58 - sw * 4); ctx.lineTo(-7 + 14 * (1 - sw * 1.8), -43 + sw * 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawSheep(f, happy, run, phase = 0) {
  ctx.save(); ctx.scale(f, 1);
  ctx.strokeStyle = '#3a3030'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const [x, ph] of [[-16, 0], [-6, 2], [10, 1], [20, 3]]) {
    const k = run ? Math.sin(t * 26 + ph + phase) * 5 : 0;
    ctx.beginPath(); ctx.moveTo(x, -16); ctx.lineTo(x + k, 0); ctx.stroke();
  }
  const P = [[-22, -30, 12], [-10, -39, 14], [6, -39, 14], [18, -31, 12], [-14, -22, 11], [2, -21, 12], [16, -22, 10], [-2, -32, 15]];
  for (const [fill, dy] of [['#d9d4ca', 3], ['#fbf9f3', 0]]) {
    ctx.fillStyle = fill; ctx.beginPath();
    for (const [x, y, r] of P) { ctx.moveTo(x + r, y + dy); ctx.arc(x, y + dy, r, 0, TAU); }
    ctx.fill();
  }
  // head
  ctx.fillStyle = '#3d3434';
  ctx.beginPath(); ctx.ellipse(22, -44, 7, 3.5, -0.6, 0, TAU); ctx.fill();   // ear
  ctx.beginPath(); ctx.ellipse(30, -35, 10, 12.5, 0.25, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fbf9f3'; ctx.beginPath(); ctx.arc(28, -46, 6.5, 0, TAU); ctx.arc(33, -47, 5, 0, TAU); ctx.fill();
  if (happy) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(27, -36, 2.4, Math.PI * 1.1, Math.PI * 1.9); ctx.moveTo(32.5, -37); ctx.arc(34.5, -36, 2.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(27, -37, 2.6, 0, TAU); ctx.arc(34, -37, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1414'; ctx.beginPath(); ctx.arc(27.8, -37, 1.3, 0, TAU); ctx.arc(34.6, -37, 1.2, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e59aa0'; ctx.beginPath(); ctx.ellipse(32, -28, 3, 1.8, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawOx(f, happy, run, confused, phase = 0) {
  ctx.save(); ctx.scale(f, 1);
  // tail
  ctx.strokeStyle = '#8f552c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const tw = Math.sin(t * 4 + phase) * 4;
  ctx.beginPath(); ctx.moveTo(-36, -54); ctx.quadraticCurveTo(-46, -44, -44 + tw, -30); ctx.stroke();
  ctx.fillStyle = '#5b3a1f'; ctx.beginPath(); ctx.ellipse(-44 + tw, -28, 3, 5, 0, 0, TAU); ctx.fill();
  // legs
  for (const [x, ph] of [[-27, 0], [-15, 2], [13, 1], [25, 3]]) {
    const k = run ? Math.sin(t * 20 + ph + phase) * 5 : 0;
    ctx.strokeStyle = '#94592f'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(x, -28); ctx.lineTo(x + k, -3); ctx.stroke();
    ctx.fillStyle = '#3a2515'; ctx.fillRect(x + k - 4.5, -5, 9, 5);
  }
  // body
  ctx.fillStyle = '#a8683a'; ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 1.5;
  roundRect(-38, -66, 74, 42, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f3e6c4';
  ctx.beginPath(); ctx.ellipse(-14, -52, 10, 7, 0.4, 0, TAU); ctx.ellipse(12, -40, 8, 5, -0.3, 0, TAU); ctx.fill();
  // head
  ctx.save();
  ctx.translate(42, -54);
  if (confused) ctx.rotate(Math.sin(t * 14) * 0.15);
  ctx.strokeStyle = '#f3e6c4'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -12); ctx.quadraticCurveTo(-18, -16, -16, -26); ctx.moveTo(9, -12); ctx.quadraticCurveTo(18, -16, 16, -26); ctx.stroke();
  ctx.fillStyle = '#8f552c';
  ctx.beginPath(); ctx.ellipse(-15, -6, 6, 3.5, -0.4, 0, TAU); ctx.ellipse(15, -6, 6, 3.5, 0.4, 0, TAU); ctx.fill();
  roundRect(-12, -16, 24, 30, 11); ctx.fill();
  ctx.fillStyle = '#e8b99a';
  ctx.beginPath(); ctx.ellipse(0, 10, 12, 8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6a3a2a'; ctx.beginPath(); ctx.arc(-4, 10, 2, 0, TAU); ctx.arc(4, 10, 2, 0, TAU); ctx.fill();
  if (happy) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-5, -4, 2.8, Math.PI * 1.1, Math.PI * 1.9); ctx.moveTo(2.3, -5); ctx.arc(5, -4, 2.8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -4, 3.4, 0, TAU); ctx.arc(5, -4, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(-4.5, confused ? -5 : -3.5, 1.7, 0, TAU); ctx.arc(5.5, confused ? -5 : -3.5, 1.7, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

// Draws whatever stands in a stall position. Origin is its feet; already scaled.
function drawThing(o, extra = {}) {
  if (o.type === 'table') {
    if (!extra.noPerson) drawPerson(o.person, 'stand', o.lookX || 0, -0.4);
    drawMoneyTable(o, extra.flip || 0, !extra.flip);
  } else if (o.type === 'doves') {
    drawDoveCage(o, extra.open || 0);
  } else if (o.type === 'sheep') {
    drawSheep(o.face, extra.happy, extra.run, o.i);
  } else if (o.type === 'ox') {
    ctx.save(); ctx.scale(0.95, 0.95);
    drawOx(o.face, extra.happy, extra.run, o.hp < o.maxHp && !extra.run, o.i);
    ctx.restore();
  } else {
    // worshippers
    const s = o.type === 'child' ? 0.74 : 1.02;
    ctx.save(); ctx.scale(s, s);
    drawPerson(o.person, extra.run ? 'stand' : WORSHIP_POSE[o.type], o.lookX || 0, -0.2);
    ctx.restore();
  }
}

// How tall each thing is (for the two-tap pips) and where Jesus stands beside it
const THING_TOP = { table: 82, doves: 78, sheep: 54, ox: 86, pray: 62, child: 58, widow: 76, pilgrim: 86 };
const THING_GAP = { table: 60, doves: 44, sheep: 50, ox: 66, pray: 36, child: 30, widow: 38, pilgrim: 40 };

let thingId = 0;
function makeStall(type, opts = {}) {
  const o = {
    kind: 'stall', type, i: thingId++, hp: 1, maxHp: 1, popT: 0, wobT: 0, outT: 0,
    face: Math.random() < 0.5 ? -1 : 1, dir: 1, sneaky: false, returned: false,
  };
  if (type === 'table') {
    o.person = makePerson(pick(MERCHANT_LOOKS), 'watch');
    o.cloth = pick(['#2f6f9f', '#7b2d8b', '#b8342a', '#2d7a4f']);
    if (opts.heavy) { o.heavy = true; o.hp = o.maxHp = 2; }
    if (opts.sneaky) { o.sneaky = true; o.returned = !!opts.returned; o.person.mood = 'sly'; }
  }
  if (type === 'doves') o.three = Math.random() < 0.5;
  if (type === 'ox') o.hp = o.maxHp = 2;
  return o;
}

function makeWorshipper(type, life) {
  const p = makePerson(pick(WORSHIP_LOOKS[type]), WORSHIP_MOOD[type]);
  return { kind: 'worship', type, i: thingId++, person: p, life, popT: 0, wobT: 0, outT: 0, worryT: 0, hitCd: 0, face: 1, dir: 1 };
}

// ============================================================
//  Jesus
// ============================================================
function newJesus() {
  const sl = slots[cursor];
  return { x: sl ? sl.x : W / 2, y: sl ? sl.y + 8 : 860, s: 1.2, dir: 1, slot: cursor, whipT: 0, oopsT: 0, face: 'calm', moving: 0 };
}

function jesusTarget(j) {
  const sl = slots[j.slot];
  if (!sl) return { x: W / 2, y: 860, s: 1.3, dir: 1 };
  const o = sl.occ;
  const gap = (o ? THING_GAP[o.type] : 50) * sl.s;
  return { x: clamp(sl.x - sl.side * gap, 22, W - 22), y: sl.y + 8, s: sl.s * 1.12, dir: sl.side };
}

function updateJesus(dt) {
  const j = jesus;
  if (!j) return;
  const tg = jesusTarget(j);
  const dx = tg.x - j.x, dy = tg.y - j.y;
  const k = Math.min(1, dt * 14);
  j.x += dx * k; j.y += dy * k; j.s += (tg.s - j.s) * k;
  j.moving = Math.min(1, Math.hypot(dx, dy) / 40);
  j.lean = clamp(dx / 300, -0.18, 0.18);
  if (j.moving > 0.3 && Math.random() < dt * 30) {
    spawn(j.x + rand(-10, 10), j.y, rand(-20, 20), rand(-30, -10), 0.4, 'rgba(200,180,140,0.8)', rand(3, 5));
  }
  if (j.moving < 0.2) j.dir = tg.dir;
  else j.dir = dx > 0 ? 1 : -1;
  j.whipT = Math.max(0, j.whipT - dt);
  j.oopsT = Math.max(0, j.oopsT - dt);
  if (state === 'win') j.face = 'joy';
  else if (state === 'fail' || j.oopsT > 0) j.face = 'oops';
  else if (j.whipT > 0) j.face = 'zeal';
  else j.face = 'calm';
}

// The small whip of cords (John 2:15): swirled overhead, never touching anyone
function drawWhip(hx, hy, swirl) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // wooden handle
  ctx.strokeStyle = '#7a4f24'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(hx, hy + 3); ctx.lineTo(hx + 2, hy - 7); ctx.stroke();
  const ox = hx + 2, oy = hy - 7;
  const a = t * 17;
  for (const [off, col, lw] of [[-0.16, '#a07840', 2], [0, '#c8a064', 2.4], [0.16, '#b38b52', 2]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(ox, oy);
    for (let f = 0.1; f <= 1.001; f += 0.1) {
      let px, py;
      if (swirl) {
        const ang = a - f * 2.6 + off;
        px = ox + Math.cos(ang) * (34 * f + 3);
        py = oy - 8 - f * 6 + Math.sin(ang) * (12 * f + 2);
      } else {
        px = ox + Math.sin(t * 2 + f * 3 + off * 8) * 2.5 * f + f * 4 + off * 10 * f;
        py = oy + f * 30;
      }
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  if (swirl) {                    // a soft swoosh trail
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ox, oy - 14, 37, 14, 0, a - 1.2, a - 0.2); ctx.stroke();
  }
}

// Drawn like Jesus in Jesus Rises (white robe, red sash, halo), standing on the court floor
function drawJesus(j) {
  ctx.save();
  const bob = j.moving > 0.2 ? Math.abs(Math.sin(t * 22)) * 4 : 0;
  ctx.translate(j.x, j.y - bob);
  ctx.scale(j.s * j.dir, j.s);
  ctx.rotate(j.lean * j.dir);

  const up = j.face === 'joy';
  const swirl = j.whipT > 0;

  if (state === 'win') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // soft shadow and sandals
  ctx.fillStyle = 'rgba(80,60,30,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 1, 20, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8a5a2b';
  const step = j.moving > 0.2 ? Math.sin(t * 22) * 3 : 0;
  ctx.beginPath(); ctx.ellipse(-6 + step, -1, 6, 3, 0, 0, TAU); ctx.ellipse(6 - step, -1, 6, 3, 0, 0, TAU); ctx.fill();

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: the whip hand is raised while swirling; both raised in joy
  const hands = up ? [[-21, -66], [21, -66]] : [[-20, -22], [swirl ? 22 : 20, swirl ? -64 : -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    const raised = hy < -40;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (raised ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (raised ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }
  if (!up) drawWhip(hands[1][0], hands[1][1], swirl);

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (j.face === 'oops') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -53, 2.8, 0, TAU); ctx.arc(4, -53, 2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.3, 0, TAU); ctx.arc(4, -53, 1.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
    if (j.face === 'zeal') {
      ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6.5, -57.5); ctx.lineTo(-2, -56.5); ctx.moveTo(6.5, -57.5); ctx.lineTo(2, -56.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.face === 'oops') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 2, 0, 0, TAU); ctx.fill();
  } else if (j.face === 'zeal') {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-2.5, -46); ctx.lineTo(2.5, -46); ctx.stroke();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
//  Particles: sparkles, bouncing coins, doves, music notes, popups
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function spillCoins(x, y, floor, dir, n) {
  for (let k = 0; k < n; k++) {
    if (coins.length > 220) coins.shift();
    coins.push({
      x: x + rand(-30, 30), y: y + rand(-6, 4), vx: dir * rand(40, 260) + rand(-90, 90), vy: rand(-470, -220),
      floor: floor + rand(-6, 20), life: rand(2.2, 3.4), spin: rand(0, TAU), spinV: rand(8, 20),
      silver: Math.random() < 0.25,
    });
  }
}

function updateCoins(dt) {
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.life -= dt;
    if (c.life <= 0) { coins.splice(i, 1); continue; }
    c.vy += 1100 * dt;
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.spin += c.spinV * dt;
    if (c.y > c.floor) {               // bounce, bounce, clink
      c.y = c.floor;
      if (Math.abs(c.vy) > 90) { c.vy = -c.vy * 0.45; c.vx *= 0.7; if (Math.random() < 0.3) spawn(c.x, c.y - 3, 0, -20, 0.4, '#fff6d0', 2.5); }
      else { c.vy = 0; c.vx *= Math.pow(0.02, dt); c.spinV *= Math.pow(0.05, dt); }
    }
  }
}

function drawCoins() {
  for (const c of coins) {
    ctx.globalAlpha = clamp(c.life / 0.5, 0, 1);
    const w = Math.max(1, Math.abs(Math.cos(c.spin)) * 6);
    ctx.fillStyle = c.silver ? '#e3e6ea' : '#f5c542'; ctx.strokeStyle = c.silver ? '#9aa0a8' : '#b8860b'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(c.x, c.y - 5, w, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function releaseDoves(x, y, n) {
  for (let k = 0; k < n; k++) {
    birds.push({ x: x + rand(-12, 12), y: y + rand(-10, 10), vx: rand(-90, 90), vy: rand(-160, -90), ph: rand(0, TAU), s: rand(1.1, 1.5) });
  }
  for (let k = 0; k < 8; k++) spawn(x + rand(-15, 15), y, rand(-60, 60), rand(-80, 0), rand(0.6, 1.1), '#ffffff', rand(2, 3.5), 60);
}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.vy -= 60 * dt;                   // they climb higher and higher, free!
    b.vx += Math.sin(t * 2 + b.ph) * 30 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -offY - 60) birds.splice(i, 1);
  }
}

function drawBirds() {
  for (const b of birds) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(b.s, b.s);
    const flap = Math.sin(t * 22 + b.ph);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b9c6d6'; ctx.lineWidth = 1;
    // wings
    ctx.beginPath(); ctx.moveTo(-2, -1); ctx.quadraticCurveTo(-10, -8 - flap * 8, -18, -4 - flap * 12); ctx.quadraticCurveTo(-10, 1, -2, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -1); ctx.quadraticCurveTo(10, -8 - flap * 8, 18, -4 - flap * 12); ctx.quadraticCurveTo(10, 1, 2, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -7, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.moveTo(-1.2, -9.5); ctx.lineTo(0, -12); ctx.lineTo(1.2, -9.5); ctx.fill();
    ctx.restore();
  }
}

function updateNotes(dt) {
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.life -= dt;
    if (n.life <= 0) { notes.splice(i, 1); continue; }
    n.y += n.vy * dt; n.x += Math.sin(t * 3 + n.ph) * 14 * dt;
  }
}

function drawNotes() {
  for (const n of notes) {
    ctx.globalAlpha = clamp(n.life / 0.6, 0, 1);
    ctx.fillStyle = n.col; ctx.strokeStyle = n.col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, 4.5, 3.4, -0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(n.x + 4, n.y - 1); ctx.lineTo(n.x + 4, n.y - 16); ctx.quadraticCurveTo(n.x + 9, n.y - 12, n.x + 11, n.y - 8); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function popup(x, y, text, color = '#7a5200', size = 22) {
  popups.push({ x, y, text, color, size, t: 1.1 });
}

function updatePopups(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t -= dt; popups[i].y -= 45 * dt;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }
}

function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.35, 0, 1);
    ctx.font = `700 ${p.size}px Fredoka, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

// ============================================================
//  Pop-ups: stalls and worshippers appearing around the court
// ============================================================
function freeSlots() {
  return slots.filter((sl) => !sl.occ && sl.cd <= 0);
}

function place(sl, o) {
  sl.occ = o;
  o.popT = 0;
  o.lookX = 0;
  for (let k = 0; k < 6; k++) spawn(sl.x + rand(-30, 30) * sl.s, sl.y, rand(-30, 30), rand(-40, -10), 0.5, 'rgba(220,200,160,0.8)', rand(3, 6));
}

function spawnStall(sl, opts = {}) {
  const types = ['table', 'table', 'table', 'doves', 'doves', 'sheep', 'sheep'];
  if (cfg.ox) types.push('ox', 'ox');
  const type = opts.type || pick(types);
  const o = makeStall(type, {
    heavy: type === 'table' && Math.random() < cfg.heavy,
    sneaky: type === 'table' && (opts.sneaky || Math.random() < cfg.sneaky),
    returned: opts.returned,
  });
  place(sl, o);
  sfx.pop(o.kind);
  return o;
}

function spawnWorshipper(sl, peaceful = false) {
  const type = pick(['pray', 'pray', 'pray', 'child', 'child', 'widow', 'pilgrim', 'pilgrim']);
  const o = makeWorshipper(type, peaceful ? Infinity : rand(cfg.wLife[0], cfg.wLife[1]));
  if (peaceful) o.person.mood = type === 'child' ? 'sing' : type === 'pilgrim' ? 'joy' : 'pray';
  place(sl, o);
  return o;
}

function spawnSomething() {
  const free = freeSlots();
  if (!free.length) return;
  const sl = pick(free);
  spawnCount++;
  const worshippers = slots.filter((s) => s.occ && s.occ.kind === 'worship').length;
  if (spawnCount > 3 && worshippers < cfg.maxWorship && Math.random() < cfg.worship) {
    spawnWorshipper(sl);
    if (!worshipHintShown && level <= 2) {
      worshipHintShown = true;
      showMessage("Don't tap the worshippers!");
    }
  } else {
    spawnStall(sl);
  }
}

// ============================================================
//  Acting on a stall position: tap / click / Space
// ============================================================
function actOn(i) {
  if (state !== 'play') return;
  const sl = slots[i];
  if (!sl) return;
  cursor = i;
  jesus.slot = i;
  const o = sl.occ;
  if (!o) { jesus.whipT = 0.2; return; }

  if (o.kind === 'worship') {
    if (o.hitCd > 0) return;
    o.hitCd = 0.6;
    o.worryT = 1.6; o.wobT = 0.4;
    jesus.oopsT = 1;
    tappedWorshipper = true;
    combo = 0;
    levelPoints = Math.max(0, levelPoints - WORSHIP_PENALTY);
    popup(sl.x, sl.y - 95 * sl.s, `-${WORSHIP_PENALTY}`, '#c92a2a', 24);
    showMessage(pick(['Oops! Let them pray.', 'Gently! They came to worship.', 'Not the worshippers!']));
    sfx.oops();
    return;
  }

  // A stall: swirl the cords overhead and drive it out
  jesus.whipT = 0.45;
  sfx.swish();
  o.hp--;
  if (o.hp > 0) {
    o.wobT = 0.4;
    if (o.person) o.person.mood = 'shock';
    popup(sl.x, sl.y - (THING_TOP[o.type] + 18) * sl.s, o.type === 'ox' ? 'Moo?' : 'One more!', '#a8741a', 20);
    if (o.type === 'ox') sfx.moo(); else sfx.bounce();
    if (o.type === 'table') { spillCoins(sl.x, sl.y - 44 * sl.s, sl.y, sl.side, 4); sfx.coins(0.4); }
    return;
  }
  clearStall(sl, true);
}

function clearStall(sl, scored) {
  const o = sl.occ;
  sl.occ = null;
  sl.cd = 0.55;
  o.dir = sl.side;
  o.face = sl.side;
  o.outT = 0;
  o.x = sl.x; o.y = sl.y; o.s = sl.s;
  o.lx = 0;
  leavers.push(o);

  const topY = sl.y - 44 * sl.s;
  if (o.type === 'table') {
    o.person.mood = 'shock';
    spillCoins(sl.x, topY, sl.y, o.dir, scored ? 22 : 10);
    for (let k = 0; k < 12; k++) spawn(sl.x + rand(-40, 40), topY + rand(-10, 10), rand(-60, 60), rand(-120, -30), rand(0.5, 1), Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4), 80);
    sfx.coins(1);
    shakeT = Math.max(shakeT, 0.12);
  } else if (o.type === 'doves') {
    releaseDoves(sl.x, sl.y - 55 * sl.s, o.three ? 3 : 2);
    sfx.flutter();
  } else {
    for (let k = 0; k < 10; k++) spawn(sl.x + rand(-30, 30), sl.y, -o.dir * rand(20, 80), rand(-50, -10), 0.6, 'rgba(210,190,150,0.8)', rand(4, 7));
    if (o.type === 'sheep') sfx.baa(); else sfx.moo();
  }

  if (!scored) return;
  combo++;
  bestCombo = Math.max(bestCombo, combo);
  const pts = STALL_POINTS * o.maxHp + Math.min(combo - 1, 20) * COMBO_POINTS;
  levelPoints += pts;
  cleared++;
  meter = Math.max(0, meter - 5);
  popup(sl.x, sl.y - (THING_TOP[o.type] + 20) * sl.s, `+${pts}`, '#a8741a', 24);
  if (combo >= 3) popup(sl.x, sl.y - (THING_TOP[o.type] - 6) * sl.s, `Combo ×${combo}`, '#2b8a3e', 17);
  sfx.tap(Math.min(1, (combo - 1) / 8));
  if (o.sneaky && !o.returned) returnQueue.push({ t: rand(1.6, 2.4) });
  if (cleared >= cfg.goal) win();
}

// ============================================================
//  Updating the court
// ============================================================
function updateSlots(dt) {
  for (const sl of slots) {
    sl.cd = Math.max(0, sl.cd - dt);
    const o = sl.occ;
    if (!o) continue;
    o.popT = Math.min(1, o.popT + dt * 4);
    o.wobT = Math.max(0, o.wobT - dt);
    if (jesus) o.lookX = clamp((jesus.x - sl.x) / 120, -1, 1);
    if (o.person) updateBlink(o.person, dt);
    if (o.kind === 'worship') {
      o.worryT = Math.max(0, o.worryT - dt);
      o.hitCd = Math.max(0, o.hitCd - dt);
      if (state === 'play') {
        o.life -= dt;
        if (o.worryT > 0) o.person.mood = 'worried';
        else if (meter > 70) o.person.mood = 'worried';     // the noise troubles them
        else o.person.mood = WORSHIP_MOOD[o.type];
        if (o.life <= 0) departWorshipper(sl);
      } else if (state === 'fail') o.person.mood = 'dismay';
      if (o.type === 'child' && o.person.mood === 'sing' && Math.random() < dt * 1.5) {
        notes.push({ x: sl.x + rand(-10, 16), y: sl.y - 70 * sl.s, vy: rand(-40, -25), life: 1.6, ph: rand(0, TAU), col: pick(['#e0a526', '#c46b8c', '#3f6fb5']) });
      }
    } else if (o.person) {
      if (state === 'fail') o.person.mood = 'sly';
      else if (o.wobT > 0) o.person.mood = 'shock';
      else if (o.sneaky) o.person.mood = 'sly';
      else if (jesus && Math.abs(jesus.x - sl.x) < 170 && Math.abs(jesus.y - sl.y) < 90) o.person.mood = 'worried';
      else o.person.mood = 'watch';
    }
  }
}

function departWorshipper(sl) {
  const o = sl.occ;
  sl.occ = null;
  sl.cd = 0.4;
  o.dir = sl.side; o.outT = 0; o.x = sl.x; o.y = sl.y; o.s = sl.s; o.lx = 0; o.person.mood = 'joy';
  o.peaceful = true;
  leavers.push(o);
}

function updateLeavers(dt) {
  for (let i = leavers.length - 1; i >= 0; i--) {
    const o = leavers[i];
    o.outT += dt;
    if (o.person) updateBlink(o.person, dt);
    let done = false;
    if (o.type === 'table') {
      o.lx += o.dir * (o.outT > 0.08 ? 330 : 0) * dt;           // the merchant scurries off
      done = o.outT > 1.8;
    } else if (o.type === 'doves') {
      done = o.outT > 1.1;
    } else if (o.type === 'sheep' || o.type === 'ox') {
      o.lx += o.dir * (o.type === 'sheep' ? 360 : 290) * Math.min(1, o.outT * 4) * dt;
      done = o.outT > 3 || Math.abs(o.x + o.lx - W / 2) > W / 2 + offX + 120;
    } else {
      o.lx += o.dir * 60 * dt;                                   // worshippers stroll away in peace
      done = o.outT > 0.8;
    }
    if (done) leavers.splice(i, 1);
  }
}

function updatePlay(dt) {
  timeLeft = Math.max(0, timeLeft - dt);
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnSomething();
    spawnT = cfg.gap * rand(0.75, 1.25);
  }
  // Sneaky sellers slip back in somewhere else
  for (let i = returnQueue.length - 1; i >= 0; i--) {
    const r = returnQueue[i];
    r.t -= dt;
    if (r.t > 0) continue;
    const free = freeSlots();
    if (!free.length) { r.t = 0.5; continue; }
    returnQueue.splice(i, 1);
    const sl = pick(free);
    spawnStall(sl, { type: 'table', sneaky: true, returned: true });
    popup(sl.x, sl.y - 100 * sl.s, "He's back!", '#8e44ad', 20);
    showMessage('A sneaky seller slipped back in!');
  }

  // Market noise: every standing stall adds to it
  const stalls = slots.filter((s) => s.occ && s.occ.kind === 'stall').length;
  meter = clamp(meter + (stalls * cfg.rise - cfg.decay) * dt, 0, 100);
  if (meter > 70 && !noisyWarned) { noisyWarned = true; showMessage('The market is getting noisy!'); }
  if (meter < 40) noisyWarned = false;
  if (meter >= 100) { fail('market'); return; }
  if (timeLeft <= 0) fail('time');
}

// After a win the court fills with worshippers: praying, singing, rejoicing
function updatePeace(dt) {
  peaceT += dt;
  peaceFillT -= dt;
  if (peaceT > 0.5 && peaceFillT <= 0) {
    const free = freeSlots();
    if (free.length) { spawnWorshipper(pick(free), true); peaceFillT = 0.14; }
  }
  if (Math.random() < dt * 14) {
    spawn(rand(0, W), rand(FLOOR_Y - 250, H - 40), rand(-8, 8), rand(-30, -10), rand(1, 2), Math.random() < 0.5 ? '#fff6d0' : '#ffe27a', rand(2, 3.5));
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const timeBonus = Math.round(timeLeft) * 10;
  const reverent = tappedWorshipper ? 0 : 500;
  const levelBonus = level * 300;
  const score = levelPoints + timeBonus + reverent + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('templeBest', best); } catch (e) {} }
  lastScore = { stalls: levelPoints, timeBonus, reverent, levelBonus, score, bestCombo };
  // Every remaining stall is driven out; worshippers find their peace
  for (const sl of slots) {
    if (sl.occ && sl.occ.kind === 'stall') clearStall(sl, false);
    else if (sl.occ) sl.occ.person.mood = sl.occ.type === 'child' ? 'sing' : sl.occ.type === 'pilgrim' ? 'joy' : 'pray';
  }
  returnQueue = [];
  peaceT = 0; peaceFillT = 0;
  flashT = 0.35;
  meter = 0;
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(jesus.x, jesus.y - 40, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  showMessage('Hallelujah! A house of prayer!');
  sfx.win();
  endTimer = 3;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  jesus.whipT = 0;
  shakeT = reason === 'market' ? 0.4 : 0;
  showMessage(reason === 'market' ? 'The court is a market again...' : "Time's up!");
  sfx.fail();
  endTimer = 1.8;
}

function showMessage(text) { message = { text, t: 2.2 }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });

const WIN_VERSES = [

function startLevel() {
  cfg = makeConfig(level);
  buildSlots();
  jesus = newJesus();
  leavers = []; particles = []; coins = []; birds = []; notes = []; popups = [];
  ripples.length = 0;
  returnQueue = [];

  cleared = 0;

      if (state === 'play' && cleared === 0) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap the stalls and animals!' : 'Click the stalls, or use arrows + Space');

  if (level === 3) setTimeout(() => { if (state === 'play') showMessage('Heavy tables need two taps!'); }, 2400);
  if (level === 4) setTimeout(() => { if (state === 'play') showMessage('Sneaky sellers come back once!'); }, 2400);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('A house of prayer!', `Level ${level} complete — ${cfg.name}`,
      `<p class="verse">${WIN_VERSES[(level - 1) % WIN_VERSES.length]}</p>
       <p class="score">Stalls cleared: <b>${s.stalls}</b> &nbsp;(best combo ×${s.bestCombo})<br>Reverence bonus: <b>${s.reverent}</b>${s.reverent ? '' : ' <small>(a worshipper was tapped)</small>'}<br>Time bonus: <b>${s.timeBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>`,
      'Next Level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'market'
      ? ['The market took over!', 'Too many stalls at once. Clear them quickly and keep an eye on the Market meter.']
      : ['Out of time!', `You cleared ${cleared} of ${cfg.goal} stalls. So close &mdash; try again!`];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       <p class="verse">"My house shall be called the house of prayer; but ye have made it a den of thieves." &mdash; Matthew 21:13</p>
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    sfx.thrust(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || !slots.length) return;
  const cols = slots[0].cols;
  const r = Math.floor(cursor / cols), c = cursor % cols;
  const moveTo = (nr, nc) => {
    kbUsed = true;
    cursor = clamp(nr, 0, 2) * cols + clamp(nc, 0, cols - 1);
  };
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveTo(r, c - 1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveTo(r, c + 1);
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') moveTo(r - 1, c);
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveTo(r + 1, c);
  else if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { kbUsed = true; actOn(cursor); }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// Which stall position is under a tap? Generous boxes, nearest one wins.
function slotAt(x, y) {
  let bestSl = null, bestD = Infinity;
  for (const sl of slots) {
    const halfW = W / sl.cols / 2;
    if (Math.abs(x - sl.x) > halfW + 4) continue;
    if (y < sl.y - 125 * sl.s || y > sl.y + 30) continue;
    const d = Math.hypot(x - sl.x, (y - (sl.y - 45 * sl.s)) * 0.8);
    if (d < bestD) { bestD = d; bestSl = sl; }
  }
  return bestSl;
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  const sl = slotAt(p.x, p.y);
  if (sl) actOn(sl.i);
});
