<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a6a8a">
<title>Miriam's Tambourine</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2a6a8a;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Miriam's Tambourine</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'odeToJoy', instrument: 'pipe', accent: 'harp', ambience: 'sea', percussion: true };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  miriam: { ref: 'Exodus 15:20', KJV: 'And Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances.', NKJV: 'Then Miriam the prophetess, the sister of Aaron, took the timbrel in her hand; and all the women went out after her with timbrels and with dances.', NIV: 'Then Miriam the prophet, Aaron’s sister, took a timbrel in her hand, and all the women followed her, with timbrels and dancing.', NLT: 'Then Miriam the prophet, Aaron’s sister, took a tambourine and led all the women as they played their tambourines and danced.' },
  // Level cards
  dryLand: { ref: 'Exodus 14:29', KJV: 'But the children of Israel walked upon dry land in the midst of the sea', NKJV: 'But the children of Israel had walked on dry land in the midst of the sea', NIV: 'But the Israelites went through the sea on dry ground', NLT: 'But the people of Israel had walked through the middle of the sea on dry ground' },
  iWillSing: { ref: 'Exodus 15:1', KJV: 'Then sang Moses and the children of Israel this song unto the Lord, and spake, saying, I will sing unto the Lord, for he hath triumphed gloriously', NKJV: 'Then Moses and the children of Israel sang this song to the Lord, and spoke, saying: “I will sing to the Lord, For He has triumphed gloriously!', NIV: 'Then Moses and the Israelites sang this song to the Lord: “I will sing to the Lord, for he is highly exalted.', NLT: 'Then Moses and the people of Israel sang this song to the Lord: “I will sing to the Lord, for he has triumphed gloriously;' },
  followed: { ref: 'Exodus 15:20', KJV: 'all the women went out after her with timbrels and with dances.', NKJV: 'all the women went out after her with timbrels and with dances.', NIV: 'all the women followed her, with timbrels and dancing.', NLT: 'led all the women as they played their tambourines and danced.' },
  timbrel: { ref: 'Psalm 150:4', KJV: 'Praise him with the timbrel and dance', NKJV: 'Praise Him with the timbrel and dance', NIV: 'praise him with timbrel and dancing', NLT: 'Praise him with the tambourine and dancing' },
  // Win cards
  sing: { ref: 'Exodus 15:21', KJV: 'And Miriam answered them, Sing ye to the Lord, for he hath triumphed gloriously', NKJV: 'And Miriam answered them: “Sing to the Lord, For He has triumphed gloriously!', NIV: 'Miriam sang to them: “Sing to the Lord, for he is highly exalted.', NLT: 'And Miriam sang this song: “Sing to the Lord, for he has triumphed gloriously;' },
  // Speech bubble
  singShort: { ref: 'Exodus 15:21', KJV: 'Sing ye to the Lord', NKJV: 'Sing to the Lord', NIV: 'Sing to the Lord', NLT: 'Sing to the Lord' },
  // Fail card
  praiseName: { ref: 'Psalm 149:3', KJV: 'Let them praise his name in the dance: let them sing praises unto him with the timbrel and harp.', NKJV: 'Let them praise His name with the dance; Let them sing praises to Him with the timbrel and harp.', NIV: 'Let them praise his name with dancing and make music to him with timbrel and harp.', NLT: 'Praise his name with dancing, accompanied by tambourine and harp.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Levels
// ============================================================
// Every cue falls down its lane and must be tapped as it reaches the gold ring.
//   lanes: 'c' = tambourine only (tap anywhere), 'lcr' = step left / tambourine / step right
//   travel: seconds a cue takes to fall; good: timing window (s); miss: praise lost per miss
const LEVELS = [
  { name: 'Sing to the Lord',         bpm: 72,  bars: 9,  lanes: 'c',   travel: 2.4,  good: 0.24, miss: 0.08,
    tip: 'Tap when each <b>tambourine</b> reaches the <b>gold ring</b>. Tap anywhere on the screen!' },
  { name: 'All the Women Follow',     bpm: 80,  bars: 9,  lanes: 'lcr', travel: 2.2,  good: 0.22, miss: 0.09,
    tip: 'Now Miriam <b>dances</b> too! Tap the <b>left</b> or <b>right</b> pad when an <b>arrow</b> reaches it, and the <b>tambourine</b> in the middle.' },
  { name: 'Dancing on the Shore',     bpm: 92,  bars: 10, lanes: 'lcr', travel: 2.0,  good: 0.2,  miss: 0.1,
    tip: 'Faster! The steps come in any order. Watch which <b>lane</b> each one falls down.' },
  { name: 'Off-beat Timbrels',        bpm: 98,  bars: 11, lanes: 'lcr', travel: 1.85, good: 0.19, miss: 0.11,
    tip: 'Listen for the <b>drum</b>. Some tambourine shakes come <b>between</b> the beats!' },
  { name: 'Horse and Rider',          bpm: 108, bars: 12, lanes: 'lcr', travel: 1.7,  good: 0.18, miss: 0.12,
    tip: '<b>Double shakes</b>: two quick taps on the same pad. Keep the women dancing!' },
  { name: 'Triumphed Gloriously',     bpm: 118, bars: 13, lanes: 'lcr', travel: 1.55, good: 0.17, miss: 0.12,
    tip: 'The great song of praise, fast and full. Can you keep the whole shore dancing?' },
];
const NUM_LEVELS = LEVELS.length;
function makeConfig(n) { return { ...LEVELS[n - 1] }; }

// Ode to Joy, as heights for Music.tap, so good taps play a rising and falling tune
const MELODY = [2, 2, 3, 4, 4, 3, 2, 1, 0, 0, 1, 2, 2, 1, 1, 2, 2, 3, 4, 4, 3, 2, 1, 0, 0, 1, 2, 1, 0, 0].map((d) => (d + 2) / 8);

const LEAD = 4;           // count-in beats before the first cue
function buildChart(c, n) {
  const spb = 60 / c.bpm;
  const cues = [];
  const add = (beat, lane) => cues.push({ t: (LEAD + beat) * spb, lane, st: 'wait', note: 0, fx: 0, judge: '' });
  let run = [];
  const lane = () => {
    let l;
    do { l = pick(['l', 'c', 'r']); } while (run.length >= 2 && run[run.length - 1] === l && run[run.length - 2] === l);
    run.push(l);
    return l;
  };
  const SYNC = [
    [[0, 'X'], [1, 'X'], [1.5, 'c'], [2, 'X'], [3, 'X']],
    [[0, 'X'], [1, 'X'], [2, 'X'], [2.5, 'c'], [3, 'X']],
    [[0, 'X'], [0.5, 'c'], [1, 'X'], [2, 'X'], [3, 'X']],
    [[0, 'X'], [1.5, 'c'], [2, 'X'], [3, 'X']],
  ];
  const DOUBLE = [
    [[0, 'D'], [0.5, 'D'], [1, 'X'], [2, 'X'], [3, 'X']],
    [[0, 'X'], [1, 'D'], [1.5, 'D'], [2, 'X'], [2.5, 'c'], [3, 'X']],
    [[0, 'X'], [1, 'X'], [2, 'D'], [2.5, 'D'], [3, 'X']],
    [[0, 'X'], [0.5, 'c'], [1, 'X'], [2, 'X'], [3, 'D'], [3.5, 'D']],
  ];
  for (let bar = 0; bar < c.bars; bar++) {
    const last = bar === c.bars - 1;
    let pat;
    if (n === 1) pat = bar % 2 ? [[0, 'c'], [2, 'c'], [3, 'c']] : [[0, 'c'], [2, 'c']];
    else if (last) pat = [[0, 'c'], [2, 'c']];
    else if (n === 2) pat = bar % 2 ? [[0, 'c'], [1, 'r'], [2, 'c']] : [[0, 'c'], [1, 'l'], [2, 'c']];
    else if (n === 3) pat = bar % 3 === 2 ? [[0, 'X'], [1, 'X'], [2, 'X']] : [[0, 'X'], [1, 'X'], [2, 'X'], [3, 'X']];
    else if (n === 4) pat = bar < 2 ? [[0, 'X'], [1, 'X'], [2, 'X'], [3, 'X']] : pick(SYNC);
    else pat = bar < 1 ? [[0, 'X'], [1, 'X'], [2, 'X'], [3, 'X']] : n === 5 ? pick([...SYNC, ...DOUBLE]) : pick(DOUBLE.concat(SYNC.slice(0, 2)));
    let dl = null;
    for (const [o, l] of pat) {
      let ln = l;
      if (l === 'X') ln = lane();
      else if (l === 'D') { if (!dl) dl = lane(); ln = dl; }
      add(bar * 4 + o, ln);
    }
  }
  cues.forEach((q, i) => { q.note = MELODY[i % MELODY.length]; });
  return { cues, spb, end: (LEAD + c.bars * 4) * spb + 0.6 };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | card | play | pause | win | fail
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('miriamBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let chart = null;         // { cues, spb, end }
let t = 0;
let songT = 0;            // song clock: only runs during play, so pausing is always safe
let lastBeat = -1;
let praise = 0.6;         // the praise meter: empty = the music stops
let streak = 0, bestStreak = 0;
let hits = 0, perfects = 0, misses = 0, wrongs = 0;
let levelPts = 0;
let joined = 0;           // women dancing with Miriam
let particles = [], pops = [];
let padFx = { l: 0, c: 0, r: 0 };
let message = { text: '', t: 0 };
let bubble = null;
let told = {};
let endTimer = 0, winT = 0, failT = 0, flashT = 0;
let lastScore = null;
let beatPulse = 0;        // 1 on each beat, fades
let sway = 0, swayTo = 0, armUp = 0, oops = 0;

const MIRIAM = { robe: '#7a4fa0', scarf: '#f2b33d', skin: '#d39a66', hair: '#3a2716', blink: 0, blinkT: 2, phase: 0 };
const WOMEN = [
  { robe: '#c0392b', scarf: '#f4e4c1', skin: '#c98d56', hair: '#2e1d10' },
  { robe: '#2f7f9a', scarf: '#e8a33a', skin: '#e3b184', hair: '#4a2f1a' },
  { robe: '#6b8e3a', scarf: '#f0c9a0', skin: '#b87a48', hair: '#1f140c' },
  { robe: '#e07a5f', scarf: '#d8c7a0', skin: '#d7a070', hair: '#3a2716', kid: true },
  { robe: '#3c5fa0', scarf: '#f7d774', skin: '#c58a55', hair: '#2a1a0e' },
  { robe: '#b08a2e', scarf: '#e9dcc4', skin: '#dca678', hair: '#5c3a1c', kid: true },
].map((d, i) => ({ ...d, i, blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU), enter: 0 }));
function joinEvery() { return chart ? Math.max(3, Math.round(chart.cues.length / 8)) : 6; }

// ============================================================
//  Layout (playfield units)
// ============================================================
const HIT_Y = 772;        // the gold rings
const START_Y = 470;      // where the cues appear (out of Miriam's tambourine)
function laneGap() { return Math.min(150, W * 0.3); }
function laneX(l) { return W / 2 + ({ l: -1, c: 0, r: 1 }[l]) * (cfg.lanes === 'c' ? 0 : laneGap()); }
function padR(l) { return l === 'c' ? 58 : 50; }
function lanesShown() { return cfg.lanes === 'c' ? ['c'] : ['l', 'c', 'r']; }
function cueY(q) { return HIT_Y - (q.t - songT) / cfg.travel * (HIT_Y - START_Y); }
function topSafe() { return Math.max(12, 118 - offY); }

// ============================================================
//  Drawing: the far shore of the sea
// ============================================================
function drawCloud(cx, cy, w, h) {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const r = h * (0.42 + 0.38 * Math.sin(f * Math.PI)) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [['#e6eef6', h * 0.18], ['#ffffff', 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function drawPalm(x, y, s, flip) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (flip ? -1 : 1), s);
  ctx.strokeStyle = '#8a5f36'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -80, 4, -170); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,60,30,0.5)'; ctx.lineWidth = 2;
  for (let k = 1; k < 9; k++) { const yy = -k * 19; ctx.beginPath(); ctx.moveTo(-6 + k * 0.6, yy); ctx.lineTo(8 + k * 0.4, yy - 3); ctx.stroke(); }
  const sw = Math.sin(t * 1.3 + x) * 0.06;
  for (const [a, l] of [[-2.7, 90], [-2.2, 100], [-1.6, 70], [-1.0, 100], [-0.45, 90], [0.1, 70]]) {
    const aa = a + sw;
    ctx.fillStyle = '#4f8a34';
    ctx.beginPath();
    ctx.moveTo(4, -170);
    ctx.quadraticCurveTo(4 + Math.cos(aa - 0.25) * l * 0.6, -170 + Math.sin(aa - 0.25) * l * 0.6 - 18, 4 + Math.cos(aa) * l, -170 + Math.sin(aa) * l + 20);
    ctx.quadraticCurveTo(4 + Math.cos(aa + 0.2) * l * 0.5, -170 + Math.sin(aa + 0.2) * l * 0.5, 4, -166);
    ctx.fill();
  }
  ctx.fillStyle = '#7a4a2a';
  for (const [dx, dy] of [[-4, -164], [8, -162], [2, -158]]) { ctx.beginPath(); ctx.arc(dx, dy, 6, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawTent(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-26, -30); ctx.lineTo(28, -34); ctx.lineTo(42, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8dcc0'; ctx.fillRect(-32, -12, 68, 4);
  ctx.fillStyle = '#1e140e'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(0, -20); ctx.lineTo(8, 0); ctx.fill();
  ctx.restore();
}

function drawShore() {
  const top = -offY;
  // sky
  const g = ctx.createLinearGradient(0, top, 0, 260);
  g.addColorStop(0, '#7cc4f2'); g.addColorStop(1, '#d8f0fa');
  ctx.fillStyle = g; ctx.fillRect(-offX, top, viewW, 270 - top);
  // sun
  const sx = W * 0.8, sy = Math.max(70, topSafe() + 20);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 100);
  sg.addColorStop(0, 'rgba(255,250,215,1)'); sg.addColorStop(0.3, 'rgba(255,240,170,0.8)'); sg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 100, 0, TAU); ctx.fill();
  for (let k = 0; k < 4; k++) {
    const cw = 90 + hash(k, 5) * 70;
    const cx = ((hash(k, 4) * (viewW + 300) + t * (6 + k * 2)) % (viewW + 300)) - offX - 150;
    drawCloud(cx, lerp(top + 40, 190, hash(k, 6)), cw, cw * 0.3);
  }
  // the far side of the sea, where they came from
  ctx.fillStyle = '#c9b48a';
  ctx.beginPath(); ctx.moveTo(-offX, 258);
  for (let x = -offX; x <= W + offX + 30; x += 30) ctx.lineTo(x, 250 - Math.abs(Math.sin(x / 160)) * 14);
  ctx.lineTo(W + offX, 262); ctx.lineTo(-offX, 262); ctx.fill();
  // the sea, calm again
  const sea = ctx.createLinearGradient(0, 258, 0, 360);
  sea.addColorStop(0, '#2f7fb0'); sea.addColorStop(1, '#4fb0d0');
  ctx.fillStyle = sea; ctx.fillRect(-offX, 258, viewW, 110);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let r = 0; r < 4; r++) {
    const yy = 272 + r * 22;
    for (let k = 0; k < 9; k++) {
      const x = ((hash(k, r) * (viewW + 100) + t * (10 + r * 4) * (r % 2 ? 1 : -1)) % (viewW + 100) + viewW + 100) % (viewW + 100) - offX - 50;
      ctx.beginPath(); ctx.arc(x, yy, 10 + r * 2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }
  }
  // the beach
  const sand = ctx.createLinearGradient(0, 350, 0, H);
  sand.addColorStop(0, '#f0d9a0'); sand.addColorStop(1, '#d9b877');
  ctx.fillStyle = sand;
  ctx.beginPath(); ctx.moveTo(-offX, 358);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, 356 + Math.sin(x / 70 + t * 1.2) * 4);
  ctx.lineTo(W + offX, H + 20); ctx.lineTo(-offX, H + 20); ctx.fill();
  // foam
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = -offX; x <= W + offX + 20; x += 20) { const yy = 356 + Math.sin(x / 70 + t * 1.2) * 4; x === -offX ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
  ctx.stroke();
  // shells and pebbles
  for (let k = 0; k < 36; k++) {
    const px = hash(k, 1) * (W + offX * 2) - offX, py = lerp(380, H - 10, hash(k, 2));
    ctx.fillStyle = k % 4 ? 'rgba(150,110,60,0.25)' : '#f6e8e0';
    ctx.beginPath(); ctx.ellipse(px, py, 4 + hash(k, 3) * 6, 3, 0, 0, TAU); ctx.fill();
  }
  // tents of the camp and palm trees at the edges
  drawTent(W * 0.1, 392, 0.8, '#5a3a2a');
  drawTent(W * 0.9, 388, 0.8, '#7a4a2a');
  drawPalm(-offX * 0.3 + 30, 470, 1.15, false);
  drawPalm(W + offX * 0.3 - 30, 470, 1.15, true);
}

// ============================================================
//  Drawing: Miriam and the dancing women
// ============================================================
function drawTambourine(x, y, r, shake = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(shake * 40) * shake * 0.6);
  ctx.fillStyle = '#f6e6c0';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#b8742a'; ctx.lineWidth = r * 0.22; ctx.stroke();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = r * 0.08;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.stroke();
  for (let k = 0; k < 6; k++) {
    const a = k / 6 * TAU + 0.3;
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.17, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1; ctx.stroke();
  }
  // ribbons
  ctx.strokeStyle = '#e0402a'; ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, r); ctx.quadraticCurveTo(r * 0.4 + Math.sin(t * 6) * r * 0.3, r * 1.6, r * 0.1, r * 2.2); ctx.stroke();
  ctx.strokeStyle = '#3c8fd0';
  ctx.beginPath(); ctx.moveTo(r * 0.2, r); ctx.quadraticCurveTo(r * 0.8 + Math.sin(t * 5 + 1) * r * 0.3, r * 1.5, r * 0.7, r * 2.1); ctx.stroke();
  ctx.restore();
}

// pose: sway (-1..1), up (0..1 tambourine raised), jump (px), mood ('joy' | 'sing' | 'oops' | 'sad')
function drawWoman(d, x, y, s, pose) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 22 * s, 6 * s, 0, 0, TAU); ctx.fill();
  if (d.kid) s *= 0.8;
  ctx.translate(pose.sway * 6 * s, -pose.jump * s);
  ctx.scale(s, s);
  ctx.rotate(pose.sway * 0.08);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2 + (x2 > 0 ? 4 : -4), (y1 + y2) / 2, x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // robe, flaring as she dances
  const flare = 4 + Math.abs(pose.sway) * 6;
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18 - flare, 0);
  ctx.quadraticCurveTo(-16, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(16, -30, 18 + flare, 0);
  ctx.quadraticCurveTo(0, 4, -18 - flare, 0);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-15, -18); ctx.quadraticCurveTo(0, -14, 15, -18); ctx.stroke();
  ctx.strokeStyle = shade(d.robe, 30); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-19 - flare * 0.8, -4); ctx.quadraticCurveTo(0, 0, 19 + flare * 0.8, -4); ctx.stroke();
  // arms: one hand holds the tambourine up high, the other waves
  const up = pose.up;
  const tx = 24 + pose.sway * 4, ty = lerp(-50, -82, up);
  arm(-11, -32, -22 - pose.sway * 4, lerp(-20, -60, ease(clamp(Math.sin(t * 4 + d.phase) * 0.5 + 0.5, 0, 1)) * 0.6 + up * 0.4));
  arm(11, -32, tx, ty);
  // head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // scarf
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  // scarf tail flying
  ctx.fillStyle = d.scarf;
  ctx.beginPath(); ctx.moveTo(-17, hy + 6); ctx.quadraticCurveTo(-28 - pose.sway * 8, hy + 14, -24 - pose.sway * 10, hy + 28); ctx.lineTo(-14, hy + 12); ctx.fill();
  drawFace(d, pose.mood, hy);
  drawTambourine(tx + 3, ty - 10, 11, pose.shake || 0);
  ctx.restore();
}

function drawFace(d, mood, hy) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  ctx.lineCap = 'round';
  const blink = d.blink > 0 && mood !== 'joy';
  if (mood === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    for (const sx of [-ex, ex]) {
      if (blink) { ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke(); continue; }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sx, ey, 3.8, 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx + 0.5, ey + 1, 2.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx + 1.3, ey - 0.3, 0.8, 0, TAU); ctx.fill();
    }
  }
  ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
  ctx.beginPath();
  if (mood === 'oops' || mood === 'sad') { ctx.moveTo(-ex - 4, ey - 6); ctx.lineTo(-ex + 3, ey - 9); ctx.moveTo(ex - 3, ey - 9); ctx.lineTo(ex + 4, ey - 6); }
  else { ctx.moveTo(-ex - 4, ey - 8); ctx.lineTo(-ex + 3, ey - 9); ctx.moveTo(ex - 3, ey - 9); ctx.lineTo(ex + 4, ey - 8); }
  ctx.stroke();
  if (mood === 'oops') {
    ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(0, mouthY, 2.6, 3.4, 0, 0, TAU); ctx.fill();
  } else if (mood === 'sad') {
    ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, mouthY + 4, 4, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
  } else {
    // singing: an open, happy mouth
    ctx.fillStyle = '#7a2e22';
    const open = mood === 'sing' ? 3 + Math.max(0, Math.sin(t * 9 + d.phase)) * 2 : 4;
    ctx.beginPath(); ctx.moveTo(-5.5, mouthY - 2.5); ctx.quadraticCurveTo(0, mouthY + open + 1, 5.5, mouthY - 2.5); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,120,120,0.4)';
  ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
}

function womanSpot(i) {
  const sp = Math.min(78, (W / 2 - 60) / 3.4);
  const side = i % 2 ? 1 : -1, k = Math.floor(i / 2) + 1;
  return { x: W / 2 + side * (k * sp + 40), y: 432 - (k % 2) * 16 };
}

function drawDancers() {
  const playing = state === 'play' || state === 'pause' || state === 'win';
  const pulse = ease(beatPulse);
  const list = [];
  WOMEN.forEach((d, i) => {
    if (d.enter <= 0) return;
    const sp = womanSpot(i);
    const from = sp.x < W / 2 ? -offX - 60 : W + offX + 60;
    const e = ease(clamp(d.enter, 0, 1));
    const x = lerp(from, sp.x, e);
    list.push({ d, x, y: sp.y, s: 1.05, i });
  });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) {
    const off = o.i % 2 ? 1 : -1;
    const sw = state === 'win' ? Math.sin(t * 5 + o.i) : clamp(sway + Math.sin(t * 2 + o.i) * 0.2, -1, 1) * (o.i % 3 === 1 ? -1 : 1);
    drawWoman(o.d, o.x, o.y, o.s, { sway: sw, up: playing ? 0.5 + pulse * 0.5 : 0.3, jump: state === 'win' ? Math.abs(Math.sin(t * 6 + o.i)) * 12 : pulse * 5 * (o.d.enter >= 1 ? 1 : 0), mood: state === 'fail' ? 'sad' : 'sing', shake: pulse * 0.3 });
    if (o.d.enter < 1) {
      // dust kicked up as she runs in
      ctx.fillStyle = 'rgba(200,170,120,0.4)';
      ctx.beginPath(); ctx.arc(o.x - off * 20, o.y - 4, 8, 0, TAU); ctx.fill();
    }
  }
  // Miriam in front, in the middle
  const mood = state === 'fail' ? 'sad' : oops > 0 ? 'oops' : state === 'win' ? 'joy' : armUp > 0.3 ? 'joy' : 'sing';
  drawWoman(MIRIAM, W / 2, 452, 1.45, {
    sway: state === 'win' ? Math.sin(t * 5) : sway,
    up: state === 'title' || state === 'card' ? 0.6 + Math.sin(t * 2) * 0.2 : Math.max(armUp, 0.25 + pulse * 0.25),
    jump: state === 'win' ? Math.abs(Math.sin(t * 6)) * 14 : pulse * 3 + armUp * 6,
    mood, shake: armUp,
  });
}

// ============================================================
//  Drawing: lanes, pads and cues
// ============================================================
function drawArrow(x, y, r, dir, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-r * 0.65, 0); ctx.lineTo(-r * 0.05, -r * 0.55); ctx.lineTo(-r * 0.05, -r * 0.22);
  ctx.lineTo(r * 0.6, -r * 0.22); ctx.lineTo(r * 0.6, r * 0.22); ctx.lineTo(-r * 0.05, r * 0.22); ctx.lineTo(-r * 0.05, r * 0.55);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
const LANE_COL = { l: '#e0609a', c: '#e0a526', r: '#3c8fd0' };

function drawCue(l, x, y, r, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  if (l === 'c') {
    ctx.shadowColor = 'rgba(255,220,120,0.9)'; ctx.shadowBlur = 12;
    drawTambourine(x, y, r * 0.8, 0);
  } else {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = LANE_COL[l]; ctx.lineWidth = 5; ctx.stroke();
    drawArrow(x, y, r * 1.1, l === 'l' ? 1 : -1, LANE_COL[l]);
  }
  ctx.restore();
}

function drawLanes() {
  for (const l of lanesShown()) {
    const x = laneX(l), r = padR(l);
    // a shining path on the sand
    const g = ctx.createLinearGradient(0, START_Y, 0, HIT_Y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = g;
    roundRect(x - r * 0.7, START_Y, r * 1.4, HIT_Y - START_Y, r * 0.7); ctx.fill();
  }
}

function drawPads() {
  for (const l of lanesShown()) {
    const x = laneX(l), r = padR(l), f = padFx[l] > 0 ? padFx[l] / 0.18 : 0;
    ctx.save();
    ctx.translate(x, HIT_Y);
    ctx.scale(1 - f * 0.08, 1 - f * 0.08);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.95, r * 0.25, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = f > 0 ? '#fff6d0' : 'rgba(255,250,235,0.9)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    // the gold ring the cues must reach
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 6;
    ctx.shadowColor = 'rgba(255,210,90,0.8)'; ctx.shadowBlur = 8 + beatPulse * 10;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    if (l === 'c') {
      ctx.globalAlpha = 0.45; drawTambourine(0, 0, r * 0.55, 0); ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 0.35; drawArrow(0, 0, r * 1.2, l === 'l' ? 1 : -1, LANE_COL[l]); ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function drawCues() {
  if (!chart || !chart.cues) return;
  for (const q of chart.cues) {
    if (q.st === 'hit') continue;
    const y = cueY(q);
    if (y < START_Y - 30 || y > H + 60) continue;
    const r = padR(q.lane) * 0.78;
    const fadeIn = clamp((y - START_Y + 30) / 50, 0, 1);
    const a = q.st === 'miss' ? clamp(1 - (y - HIT_Y) / 90, 0, 1) * 0.5 : fadeIn;
    const s = lerp(0.6, 1, clamp((y - START_Y) / (HIT_Y - START_Y), 0, 1));
    drawCue(q.lane, laneX(q.lane), y, r * s, a);
  }
}

function drawPops() {
  for (const p of pops) {
    const a = clamp(p.t / 0.3, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `700 ${p.size}px Fredoka, sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    const y = p.y - (1 - p.t / p.max) * 40;
    ctx.strokeText(p.text, p.x, y); ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, y);
    ctx.restore();
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#ffb33b']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 220);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1.1), cols[i % cols.length], rand(2, 4.5), 60, i % 3 ? 'dot' : 'star');
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; if (pops[i].t <= 0) pops.splice(i, 1); }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const s = p.size * 1.6;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4, r = k % 2 ? s * 0.35 : s; ctx.lineTo(p.x + Math.cos(an) * r, p.y + Math.sin(an) * r); }
      ctx.closePath(); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function pop(text, x, y, col, size = 26, dur = 0.7) { pops.push({ text, x, y, col, size, t: dur, max: dur }); }

// ============================================================
//  Playing
// ============================================================
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function press(lane) {
  if (state !== 'play' || !chart) return;
  if (cfg.lanes === 'c') lane = 'c';
  padFx[lane] = 0.18;
  if (lane !== 'c') swayTo = lane === 'l' ? -1 : 1;
  // the nearest waiting cue in this lane
  let q = null, bd = 1e9;
  for (const c of chart.cues) {
    if (c.st !== 'wait' || c.lane !== lane) continue;
    const d = Math.abs(c.t - songT);
    if (d < bd) { bd = d; q = c; }
    if (c.t - songT > 1) break;
  }
  if (q && bd <= cfg.good) hit(q, bd <= cfg.good * 0.45);
  else wrongTap(lane, q && bd < 0.6 ? (q.t > songT ? 'Too soon!' : 'Too late!') : 'Oops!');
}

function hit(q, perfect) {
  q.st = 'hit';
  hits++; streak++; bestStreak = Math.max(bestStreak, streak);
  if (perfect) perfects++;
  const pts = (perfect ? 100 : 60) + Math.min(streak, 20) * 5;
  levelPts += pts;
  praise = clamp(praise + (perfect ? 0.05 : 0.03), 0, 1);
  const x = laneX(q.lane);
  sparkleBurst(x, HIT_Y, perfect ? 16 : 9, q.lane === 'c' ? undefined : [LANE_COL[q.lane], '#fff6d0', '#ffffff']);
  pop(perfect ? 'Perfect!' : 'Good!', x, HIT_Y - 70, perfect ? '#c27a00' : '#5a8a2a', perfect ? 28 : 24);
  sfx.tap(q.note);
  if (q.lane === 'c') { armUp = 1; sfx.jingle(0.12); }
  // the women join the dance
  const want = Math.min(WOMEN.length, Math.floor(hits / joinEvery()));
  while (joined < want) {
    WOMEN[joined].enter = 0.001;
    joined++;
    if (joined === 1 && !told.join) { told.join = true; showMessage('A friend joins the dance!', 1.6); }
  }
  if (streak > 0 && streak % 10 === 0) pop(`${streak} in a row!`, W / 2, START_Y - 10, '#7a4fa0', 24, 1);
}

function wrongTap(lane, text) {
  wrongs++;
  streak = 0;
  praise = clamp(praise - 0.04, 0, 1);
  oops = 0.4;
  pop(text, laneX(lane), HIT_Y - 70, '#9a5a50', 22, 0.6);
  sfx.bonk();
  if (praise <= 0) fail();
}

function missCue(q) {
  q.st = 'miss';
  misses++; streak = 0;
  praise = clamp(praise - cfg.miss, 0, 1);
  oops = 0.4;
  pop('Missed', laneX(q.lane), HIT_Y - 70, '#9a5a50', 22, 0.6);
  if (!told.miss && level <= 2) { told.miss = true; showMessage('Tap just as it reaches the gold ring!', 2); }
  if (praise <= 0) fail();
}

function updatePlay(dt) {
  songT += dt;
  const b = Math.floor(songT / chart.spb);
  if (b > lastBeat) {
    lastBeat = b;
    if (b >= 0 && songT < chart.end - 0.5) {
      beatPulse = 1;
      sfx.beat(b % 4 === 0, b < LEAD);
      if (b < LEAD) pop(String(b + 1), W / 2, 590, '#7a4fa0', 46, chart.spb * 0.9);
    }
  }
  for (const q of chart.cues) {
    if (q.st === 'wait' && songT - q.t > cfg.good) { missCue(q); if (state !== 'play') return; }
  }
  // first-time hints
  if (!told.first && chart.cues[0] && chart.cues[0].t - songT < cfg.travel * 0.6) {
    told.first = true;
    if (level === 1) showMessage(isTouch() ? 'Tap when it reaches the ring!' : 'Press Space when it reaches the ring!', 2.2);
  }
  if (!told.arrow && cfg.lanes !== 'c') {
    const q = chart.cues.find((c) => c.lane !== 'c');
    if (q && q.t - songT < cfg.travel * 0.7) { told.arrow = true; if (level === 2) showMessage(isTouch() ? 'Arrow? Tap that side!' : 'Arrow? Press ← or →', 2); }
  }
  if (songT > chart.end && chart.cues.every((q) => q.st !== 'wait')) winLevel();
}

function updateDancers(dt) {
  beatPulse = Math.max(0, beatPulse - dt * 3);
  armUp = Math.max(0, armUp - dt * 3);
  oops = Math.max(0, oops - dt);
  for (const l of ['l', 'c', 'r']) padFx[l] = Math.max(0, padFx[l] - dt);
  sway = lerp(sway, swayTo, 1 - Math.pow(0.0005, dt));
  swayTo *= Math.pow(0.05, dt);
  for (const d of [MIRIAM, ...WOMEN]) {
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 4); }
    if (d.blink > 0) d.blink -= dt;
    if (d.enter > 0 && d.enter < 1) d.enter = Math.min(1, d.enter + dt * 1.2);
  }
}

function winLevel() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const total = chart.cues.length;
  const acc = hits / total;
  const accBonus = Math.round(acc * 500);
  const joyBonus = Math.round(praise * 300);
  const levelBonus = level * 150;
  const score = levelPts + accBonus + joyBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('miriamBest', best); } catch (e) {} }
  lastScore = { pts: levelPts, accBonus, joyBonus, levelBonus, acc, total };
  // everyone dances at the end
  WOMEN.forEach((d) => { if (d.enter <= 0) d.enter = 0.001; });
  bubble = { key: 'singShort', t: 99 };
  sfx.win();
  sparkleBurst(W / 2, 380, 50);
  endTimer = 2.6;
}

function fail() {
  if (state !== 'play') return;
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('The music stopped…', 2);
  sfx.fail();
  endTimer = 1.8;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

// Builds everything a level needs at once, so whatever is drawn behind a card always matches cfg
function resetLevel() {
  cfg = makeConfig(level);
  chart = buildChart(cfg, level);
  songT = -1.2; lastBeat = -1;
  praise = 0.6;
  streak = 0; bestStreak = 0; hits = 0; perfects = 0; misses = 0; wrongs = 0;
  levelPts = 0; joined = 0;
  particles = []; pops = [];
  padFx = { l: 0, c: 0, r: 0 };
  sway = swayTo = armUp = oops = beatPulse = 0;
  endTimer = 0; winT = 0; failT = 0; flashT = 0;
  bubble = null;
  told = level > 1 ? { first: true } : {};
  WOMEN.forEach((d) => { d.enter = 0; });
}

function titleScreen() {
  state = 'title';
  level = 1;
  resetLevel();
  syncAmbience();
  showOverlay('Miriam’s Tambourine', 'Dancing by the sea',
    `${verseHTML('miriam')}
     <ul>
       <li>God has led His people safely through the sea! Miriam picks up her <b>tambourine</b> to praise Him.</li>
       <li>Tambourines and dance arrows fall down the sand. <b>Tap</b> just as each one reaches the <b>gold ring</b>.</li>
       <li><b>Tambourine</b> = tap the middle. <b>Arrow</b> = tap that side to dance a step.</li>
       <li>Good taps play the tune, fill the <b>praise meter</b> and bring more <b>women</b> to dance. Misses empty it. If it runs out, the music stops!</li>
       <li><b>Keys:</b> <kbd>&larr;</kbd> <kbd>Space</kbd> <kbd>&rarr;</kbd> (or <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>).</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Begin', () => { level = 1; totalScore = 0; levelCard(); });
}

const CARD_VERSES = ['dryLand', 'followed', 'timbrel', 'iWillSing', 'dryLand', 'timbrel'];
function levelCard() {
  state = 'card';
  resetLevel();
  syncAmbience();
  showOverlay(`Level ${level}`, cfg.name,
    `<p style="text-align:center">${cfg.tip}</p>
     ${verseHTML(CARD_VERSES[level - 1])}
     <p class="score">Score so far: <b>${totalScore}</b></p>`,
    'Go!', () => startLevel());
}

function startLevel(retry = false) {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  showMessage(`Level ${level}: ${cfg.name}`, 1.8);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= NUM_LEVELS;
    showOverlay(last ? 'He has triumphed gloriously!' : 'Sing to the Lord!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(last ? 'iWillSing' : 'sing')}
       <p style="text-align:center">${last ? 'The whole shore is singing and dancing to thank God for bringing them safely through the sea!' : `${joined} women danced with Miriam!`}</p>
       <p class="score">Taps on the beat: <b>${s.pts}</b><br>Hit ${hits} of ${s.total} (best run ${bestStreak}): <b>${s.accBonus}</b><br>Praise meter: <b>${s.joyBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      last ? 'Play again' : 'Next level', () => { if (last) titleScreen(); else { level++; levelCard(); } });
  } else if (state === 'fail') {
    showOverlay('The music stopped', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Too many missed beats. Watch each one fall and <b>tap just as it touches the gold ring</b>. Listen to the drum, too!</p>
       ${verseHTML('praiseName')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. The song waits for you. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    // a short run-up so the next cue isn't right on top of the ring
    if (chart) {
      const next = chart.cues.find((q) => q.st === 'wait');
      if (next && next.t - songT < 0.6) songT = Math.max(songT - 0.8, next.t - 1.2);
      lastBeat = Math.floor(songT / chart.spb);
    }
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const KEY_LANE = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', Space: 'c', ArrowDown: 'c', ArrowUp: 'c', KeyS: 'c', KeyW: 'c', KeyJ: 'c' };
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'play' && KEY_LANE[e.code] && !e.repeat) press(KEY_LANE[e.code]);
});

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  if (p.vy < 120) return;     // the HUD strip
  const x = p.vx - offX;
  const half = laneGap() / 2;
  press(cfg.lanes === 'c' ? 'c' : x < W / 2 - half ? 'l' : x > W / 2 + half ? 'r' : 'c');
});

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
    syncAmbience();
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  jingle(vol = 0.12) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.25);
  },
  // the steady drum that keeps the beat (a deeper thump on the first beat of each bar)
  beat(down, countIn) {
    if (!this.ctx) return;
    this.tone(down ? 120 : 95, 0.18, 'sine', countIn ? 0.4 : 0.3, 0, 60);
    if (countIn) this.tone(down ? 880 : 660, 0.08, 'triangle', 0.08);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) { if (this.ctx) Music.tap(height); },
  bonk() { this.tone(200, 0.14, 'triangle', 0.18, 0, 130); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  HUD
// ============================================================
function drawBubble(text, ax, ay) {
  ctx.save();
  ctx.font = '700 20px Fredoka, sans-serif';
  const lines = wrapText('“' + text + '!”', Math.min(W - 60, 380));
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 30, h = lines.length * 24 + 20;
  const bx = clamp(ax - w / 2, 12, W - w - 12), by = ay - 24 - h;
  ctx.fillStyle = '#fff6d0'; ctx.strokeStyle = '#f2a93b'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  const tx = clamp(ax - 11, bx + 14, bx + w - 36);
  ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 22, by + h - 1.5); ctx.fill();
  ctx.fillStyle = '#7a3a90';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 15, by + 22 + i * 24));
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#2a3a5a';
  ctx.font = '700 17px Fredoka, sans-serif';
  const inGame = state === 'play' || state === 'win' || state === 'fail' || state === 'pause';
  ctx.fillText(inGame ? `Level ${level} · ${cfg.name}` : 'Miriam’s Tambourine', 12, 26);
  if (inGame) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('PRAISE', 12, 49);
    ctx.shadowBlur = 0;
    const bw = Math.min(170, viewW - 250);
    ctx.fillStyle = 'rgba(40,60,90,0.2)';
    roundRect(62, 38, bw, 13, 6.5); ctx.fill();
    const g = ctx.createLinearGradient(62, 0, 62 + bw, 0);
    g.addColorStop(0, '#e0609a'); g.addColorStop(0.5, '#f2b33d'); g.addColorStop(1, '#3c8fd0');
    ctx.fillStyle = praise < 0.25 && Math.sin(t * 10) > 0 ? '#e0402a' : g;
    if (praise > 0) { roundRect(62, 38, bw * praise, 13, 6.5); ctx.fill(); }
    // song progress, as a little row of notes
    if (chart) {
      const f = clamp(songT / chart.end, 0, 1);
      ctx.fillStyle = 'rgba(40,60,90,0.2)'; roundRect(140, 80, Math.min(120, viewW - 300), 8, 4); ctx.fill();
      ctx.fillStyle = '#7a4fa0'; roundRect(140, 80, Math.min(120, viewW - 300) * f, 8, 4); ctx.fill();
    }
    ctx.shadowBlur = 4;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#2a3a5a'; ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`Score ${totalScore + (state === 'win' ? 0 : levelPts)}`, viewW - 12, 26);
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.fillText(`Dancers ${joined + 1} / ${WOMEN.length + 1}`, viewW - 12, 48);
    if (streak >= 3) ctx.fillText(`${streak} in a row`, viewW - 12, 68);
  }
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = viewH - 18 - (lines.length - 1) * 28;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#5a2a7a';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
  drawShore();
  drawDancers();
  if (state !== 'title' && state !== 'card') {
    drawLanes();
    drawPads();
    drawCues();
  }
  drawParticles();
  drawPops();
  if (bubble) drawBubble(Bible.verse(VERSES[bubble.key]).text, W / 2 + 10, 452 - 1.45 * 110);
  if (state === 'fail') {
    ctx.fillStyle = `rgba(40,40,60,${0.25 * clamp(failT, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateDancers(dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win') {
    winT += dt;
    if (Math.random() < dt * 10) spawn(rand(0, W), rand(200, 600), rand(-20, 20), -30, 1.2, pick(['#fff6d0', '#e0609a', '#3c8fd0', '#ffe27a']), 3.5, 0, 'star');
    if (Math.random() < dt * 4) { beatPulse = 1; }
  } else if (state === 'fail') failT += dt;
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
titleScreen();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
