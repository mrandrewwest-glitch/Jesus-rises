  ctx.fillStyle = g; ctx.fillRect(-offX, -offY, viewW, viewH);
  const sg = ctx.createRadialGradient(W * 0.12, 250, 10, W * 0.12, 250, 200);
  sg.addColorStop(0, 'rgba(255,245,190,0.9)'); sg.addColorStop(1, 'rgba(255,245,190,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * 0.12, 250, 200, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(W * 0.12, 250, 40, 0, TAU); ctx.fill();
  for (const c of bgClouds) {
    const x = -offX - 150 + ((c.f + (t * c.speed + cam * 0.05) / (viewW + 300)) % 1) * (viewW + 300);
    drawCloud(viewW - x - offX * 2, c.y - 60, c.w, c.w * 0.3, 'rgba(255,255,255,0.9)', 'rgba(220,235,250,0.8)');
  }
  const x0 = -offX - 10, x1 = W + offX + 10;
  // far hills (slow)
  ctx.fillStyle = '#b5d69a';
  ctx.beginPath(); ctx.moveTo(x0, RUN_GY);
  for (let x = x0; x <= x1; x += 20) { const u = x + cam * 0.15; ctx.lineTo(x, RUN_GY - 120 + Math.sin(u / 110) * 20 + Math.sin(u / 43) * 7); }
  ctx.lineTo(x1, RUN_GY); ctx.fill();

  // middle layer: olive trees in the garden, houses in the city
  const P = 0.55, sp = 150;
  const u0 = Math.floor((cam * P + x0 - wx - 100) / sp) * sp;
  for (let u = u0; u < cam * P + x1 - wx + 150; u += sp) {
    const sx = u - cam * P + wx, h = hash(u);
    const world = u / P;
    if (cityAt(world)) drawHouse(sx, RUN_GY - 30, 90 + h * 50, 80 + hash(u + 1) * 70, h, true);
    else drawOlive(sx, RUN_GY - 30, 0.75 + h * 0.3, Math.sin(t * 1.3 + u) * 2);
  }
  // path / street
  const cityScreen = run.cityX - cam + wx;
  ctx.fillStyle = '#86b95d';
  ctx.fillRect(x0, RUN_GY - 34, Math.max(0, Math.min(cityScreen, x1) - x0), 34);
  ctx.fillStyle = '#c9a877';
  ctx.fillRect(x0, RUN_GY - 4, x1 - x0, H - RUN_GY + 10);
  if (cityScreen < x1) {
    ctx.fillStyle = '#d8c39a';
    const cs = Math.max(cityScreen, x0);
    ctx.fillRect(cs, RUN_GY - 34, x1 - cs, 34);
    ctx.fillStyle = '#bfa679';
    ctx.fillRect(cs, RUN_GY - 4, x1 - cs, H - RUN_GY + 10);
    // cobbles
    ctx.strokeStyle = 'rgba(120,95,60,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let row = 0; row < 3; row++) {
      const yy = RUN_GY + 14 + row * 26;
      const off = (row % 2) * 20;
      for (let x = Math.floor((cam + cs - wx) / 40) * 40 + off; x - cam + wx < x1; x += 40) {
        const sx = x - cam + wx;
        if (sx < cs) continue;
        ctx.moveTo(sx + 16, yy); ctx.arc(sx, yy, 16, 0, Math.PI, true);
      }
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(90,70,40,0.25)';
  ctx.fillRect(x0, RUN_GY - 4, x1 - x0, 4);
  // roadside lilies in the garden
  const lu0 = Math.floor((cam + x0 - wx) / 90) * 90;
  for (let u = lu0; u < cam + x1 - wx + 90; u += 90) {
    if (cityAt(u) || hash(u * 0.37) < 0.45) continue;
    drawLily(u - cam + wx, RUN_GY - 18, 0.7);
  }
  // the city gate
  const gx = cityScreen;
  if (gx > x0 - 120 && gx < x1 + 120) drawGate(gx);

  // obstacles and lilies
  for (const o of run.obs) {
    const sx = o.x - cam + wx;
    if (sx < x0 - 120 || sx > x1 + 20) continue;
    drawObstacle(o, sx);
  }
  for (const l of run.lil) {
    if (l.got) continue;
    const sx = l.x - cam + wx;
    if (sx < x0 - 30 || sx > x1 + 30) continue;
    drawLily(sx, RUN_GY - l.h + 18 + Math.sin(t * 3 + l.x) * 3, 0.9, true);
  }

  // finale: the risen Lord, and the disciples running to see
  if (phase === 'finale') {
    const jx = Math.max(W * 0.68, fin.wx + 120);
    disciples.forEach((p, k) => {
      const target = lerp(W * 0.5, W - 30, k / (disciples.length - 1));
      const f = ease((fin.t - 3 - k * 0.15) / 1.3);
      if (f <= 0) return;
      p.x = lerp(x1 + 40 + k * 30, target, f); p.y = RUN_GY - 20; p.s = 0.85; p.dim = true;
      p.run = f < 1; p.runPh += 0.25;
      p.lx = jx < p.x ? -0.9 : 0.9; p.ly = 0.1;
      drawPerson(p);
    });
    drawRisenJesus(jx, RUN_GY + 2, 1.35, ease(fin.t / 0.8), fin.t > 1.2 && fin.t < 2.6);
  }

  // the two Marys
  const [m1, m2] = marys;
  let lead = wx, h1 = run.h, h2 = followerH();
  if (phase === 'finale') {
    lead = lerp(wx, Math.max(W * 0.42, wx), ease(fin.t / 1.3));
    h1 = h2 = 0;
    const walking = fin.t < 1.3;
    const k = ease((fin.t - 1.6) / 0.6);
    for (const p of marys) { p.run = walking; p.kneel = k; p.lean = 0; if (walking) p.runPh += 0.2; }
  } else {
    const lean = run.stumbleT > 0 ? -0.18 : 0.1;
    m1.lean = lean; m2.lean = 0.1;
    m1.run = run.grounded; m2.run = h2 < 1;
  }
  for (const [p, x, h] of [[m2, lead - 46, h2], [m1, lead, h1]]) {
    p.x = x; p.y = RUN_GY - h; p.s = 1.05; p.dim = false;
    p.lx = 0.9; p.ly = -0.2;
    if (run.invuln > 0 && p === m1 && phase === 'run' && Math.sin(t * 30) > 0.3) ctx.globalAlpha = 0.55;
    drawPerson(p);
    ctx.globalAlpha = 1;
  }
}

function drawHouse(x, base, w, h, v, far) {
  const wall = ['#f1e2c0', '#e8d2a6', '#f5e9d2', '#e2c79b'][Math.floor(v * 4)];
  ctx.fillStyle = far ? wall : shade(wall.replace('#', '#'), -8);
  roundRect(x - w / 2, base - h, w, h, 3); ctx.fill();
  ctx.fillStyle = shade(wall, -30);
  ctx.fillRect(x - w / 2 - 4, base - h - 6, w + 8, 7);
  if (v > 0.7) {   // a little dome
    ctx.fillStyle = wall;
    ctx.beginPath(); ctx.arc(x, base - h - 6, w * 0.22, Math.PI, TAU); ctx.fill();
  }
  ctx.fillStyle = '#6b4a2b';
  roundRect(x - 11, base - 38, 22, 38, [11, 11, 0, 0]); ctx.fill();
  ctx.fillStyle = '#4a3a2a';
  for (const dx of [-w * 0.3, w * 0.3]) { roundRect(x + dx - 7, base - h + 18, 14, 18, [7, 7, 0, 0]); ctx.fill(); }
  if (v < 0.35) {  // a striped awning
    const cols = ['#c0392b', '#f5e9d2'];
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = cols[k % 2];
      ctx.fillRect(x - w * 0.4 + k * w * 0.16, base - 58, w * 0.16, 12);
    }
  }
}

function drawGate(x) {
  ctx.fillStyle = '#d9c092'; ctx.strokeStyle = '#a88a5a'; ctx.lineWidth = 2;
  roundRect(x - 90, RUN_GY - 200, 180, 30, 4); ctx.fill(); ctx.stroke();
  for (let k = 0; k < 6; k++) { ctx.fillRect(x - 88 + k * 32, RUN_GY - 214, 18, 14); }
  roundRect(x - 90, RUN_GY - 180, 40, 180, 3); ctx.fill(); ctx.stroke();
  roundRect(x + 50, RUN_GY - 180, 40, 180, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 50, RUN_GY - 120); ctx.quadraticCurveTo(x, RUN_GY - 190, x + 50, RUN_GY - 120);
  ctx.lineTo(x + 50, RUN_GY - 170); ctx.lineTo(x - 50, RUN_GY - 170); ctx.closePath(); ctx.fill();
  ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#7a5a2a';
  ctx.fillText('Jerusalem', x, RUN_GY - 180);
}

function drawObstacle(o, x) {
  const y = RUN_GY;
  if (o.type === 'root') {
    ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + o.w * 0.3, y - o.h * 1.6, x + o.w * 0.6, y - 4);
    ctx.quadraticCurveTo(x + o.w * 0.8, y - o.h, x + o.w, y); ctx.stroke();
    ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 6, y - 6); ctx.quadraticCurveTo(x + o.w * 0.3, y - o.h * 1.4, x + o.w * 0.55, y - 8); ctx.stroke();
  } else if (o.type === 'rock') {
    ctx.fillStyle = '#a39c90'; ctx.strokeStyle = '#6e685e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 2, y - o.h, x + o.w * 0.5, y - o.h);
    ctx.quadraticCurveTo(x + o.w, y - o.h, x + o.w, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(x + o.w * 0.35, y - o.h * 0.7, 7, 4, -0.3, 0, TAU); ctx.fill();
  } else if (o.type === 'basket') {
    ctx.fillStyle = '#c98f45'; ctx.strokeStyle = '#8a5a22'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - o.h + 8); ctx.lineTo(x + o.w, y - o.h + 8); ctx.lineTo(x + o.w - 5, y); ctx.lineTo(x + 5, y); ctx.closePath();
    // fruit and bread peeking out
    ctx.save();
    ctx.fillStyle = '#e8a33a'; ctx.beginPath(); ctx.ellipse(x + o.w * 0.35, y - o.h + 6, 11, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d64a3a'; ctx.beginPath(); ctx.arc(x + o.w * 0.68, y - o.h + 5, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a3fa0'; ctx.beginPath(); ctx.arc(x + o.w * 0.55, y - o.h + 2, 5, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#c98f45';
    ctx.beginPath(); ctx.moveTo(x, y - o.h + 8); ctx.lineTo(x + o.w, y - o.h + 8); ctx.lineTo(x + o.w - 5, y); ctx.lineTo(x + 5, y); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let k = 1; k < 4; k++) { ctx.moveTo(x + 3, y - o.h + 8 + k * 8); ctx.lineTo(x + o.w - 3, y - o.h + 8 + k * 8); }
    ctx.stroke();
  } else if (o.type === 'puddle') {
    ctx.fillStyle = '#7fc4ec';
    ctx.beginPath(); ctx.ellipse(x + o.w / 2, y + 2, o.w / 2, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x + o.w / 2 - 8, y + 1, 16 + Math.sin(t * 3 + o.seed * 9) * 3, 3, 0, 0, TAU); ctx.stroke();
  }
}

// ---------- HUD ----------
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const dark = inGarden() && skyF < 0.5;
  const ink = dark ? '#fff1c9' : '#5a4210';
  ctx.shadowColor = dark ? 'rgba(20,20,60,0.9)' : 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + progress bar
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'He Is Risen' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  const isRun = phase === 'run' || phase === 'finale';
  ctx.fillText(isRun ? 'TELL' : 'STONE', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = dark ? 'rgba(255,241,201,0.25)' : 'rgba(90,66,16,0.25)';
  roundRect(58, 38, 130, 13, 6.5); ctx.fill();
  const prog = isRun ? clamp(run.x / cfg.runLen, 0, 1) : stoneShow;
  const gg = ctx.createLinearGradient(58, 0, 188, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
  ctx.fillStyle = rh && rh.slow && phase === 'rhythm' && Math.sin(t * 10) > 0 ? '#ff9f6b' : gg;
  if (prog > 0.01) { roundRect(58, 38, 130 * prog, 13, 6.5); ctx.fill(); }

  // Pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: sunrise timer, or lilies
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = ink;
  if (isRun) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('LILIES', rx, 20);
    ctx.font = '700 22px Fredoka, sans-serif';
    ctx.fillText(`${run.lilies}`, rx, 44);
    ctx.shadowBlur = 0;
    drawLily(rx - 38, 50, 0.6);
  } else {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SUNRISE', rx, 20);
    ctx.shadowBlur = 0;
    const sf = rh ? clamp((rh.T + 1.4) / (rh.sunEnd + 1.4), 0, 1) : 0;
    ctx.fillStyle = dark ? 'rgba(255,241,201,0.25)' : 'rgba(90,66,16,0.25)';
    roundRect(rx - 100, 28, 100, 11, 5.5); ctx.fill();
    ctx.fillStyle = sf > 0.8 && phase === 'rhythm' && Math.sin(t * 8) > 0 ? '#ff7a4a' : '#ffb347';
    if (sf > 0.01) { roundRect(rx - 100, 28, 100 * sf, 11, 5.5); ctx.fill(); }
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(rx - 100 + 100 * sf, 33.5, 7, 0, TAU); ctx.fill();
    if (rh && state !== 'title') {
      ctx.shadowBlur = 4;
      ctx.font = '700 15px Fredoka, sans-serif';
      ctx.fillStyle = rh.slow ? '#ff9f6b' : dark ? '#c8f5b0' : '#2b8a3e';
      ctx.fillText(rh.slow ? 'Slowing…' : `Combo ${rh.combo}`, rx, 62);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const lines = message.text.split('\n');
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y0 = (inGarden() ? H * 0.4 : H * 0.36) - (lines.length - 1) * 15;
  lines.forEach((ln, i) => {
    ctx.strokeText(ln, W / 2, y0 + i * 30);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(ln, W / 2, y0 + i * 30);
  });
  ctx.restore();
}

function drawPops() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  pops.forEach((p, i) => {
    if (i < pops.length - 1 && !p.big) return;   // only the newest judgement shows
    const k = 1 - p.t / 0.75;
    ctx.globalAlpha = clamp(p.t / 0.3, 0, 1);
    ctx.font = `700 ${p.big ? 26 : 22}px Fredoka, sans-serif`;
    const y = TRACK_Y - 48 - k * 30;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,40,20,0.7)';
    const x = p.big ? W / 2 : Math.max(RING_X, 50);
    ctx.strokeText(p.text, x, y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, x, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-5, 5) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (run && (phase === 'run' || phase === 'finale')) drawRunScene();
  else drawGardenScene();
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  if (phase === 'rhythm') drawPops();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (whiteA > 0) {
    ctx.fillStyle = `rgba(255,253,240,${whiteA})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (state === 'play') {
    if (phase === 'rhythm') updateRhythm(dt);
    else if (phase === 'angel') updateAngel(dt);
    else if (phase === 'run') updateRun(dt);
    else if (phase === 'finale') updateFinale(dt);
  } else if (state === 'win' && fin) {
    updateFinale(dt);
  }
  // the sky brightens as the morning goes on
  let sky = 0.08;
  if (rh && phase === 'rhythm') sky = 0.05 + 0.75 * clamp((rh.T + 1.4) / (rh.sunEnd + 1.4), 0, 1);
  if (phase === 'angel' || state === 'fail') sky = 1;
  skyF += (sky - skyF) * Math.min(1, dt * 2.5);
  if (phase === 'rhythm' || phase === 'angel') {
    const want = rh ? Math.min(rh.stone, 1) : 0;
    stoneShow += (want - stoneShow) * Math.min(1, dt * (phase === 'angel' ? 3 : 6));
  }
  beatFx = Math.max(0, beatFx - dt * 4);
  shockT = Math.max(0, shockT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; if (pops[i].t <= 0) pops.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  frameWall = performance.now();
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
