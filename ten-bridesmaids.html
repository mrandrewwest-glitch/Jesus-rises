const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Note helpers kept for this game's own sounds
// ============================================================
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}


const sfx = {
  ctx: null, master: null, windGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.7;
      this.windGain = this.ctx.createGain();
      this.windGain.gain.value = 0;
      src.connect(bp); bp.connect(this.windGain); this.windGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  wind(level) {
    if (!this.windGain) return;
    this.windGain.gain.setTargetAtTime(level * 0.2, this.ctx.currentTime, 0.1);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseHit(delay, freq, dur, vol, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.12);
    Music.tap(height);
  },
  puff(vol = 0.35) { this.noiseHit(0, 1100, 0.16, vol); },
  bounce() { this.tone(220, 0.18, 'sine', 0.3, 0, 110); },
  thunder() { this.noiseHit(0, 400, 1.2, 0.9, 'lowpass'); },
  // small effects for this game
  trim() { this.tap(0.7); },
  glug() { for (let k = 0; k < 3; k++) this.tone(420 - k * 70, 0.12, 'sine', 0.25, k * 0.09, 260 - k * 40); },
  strike() { this.noiseHit(0, 3000, 0.25, 0.5, 'highpass'); this.noiseHit(0.1, 800, 0.5, 0.25); },
  wake() { this.tone(440, 0.16, 'triangle', 0.25, 0, 880); this.tap(0.5); },
  jar() { this.tap(1); this.tone(1320, 0.3, 'sine', 0.12, 0.08); },
  out() { this.puff(0.25); this.tone(300, 0.3, 'sine', 0.15, 0, 150); },
  snore() { this.tone(110, 0.5, 'sawtooth', 0.05, 0, 90); },
  gustWhoosh() { this.noiseHit(0, 500, 1.1, 0.35, 'lowpass'); },
  cry() {
    if (!this.ctx) return;
    // a ram's-horn call, then tambourines and a dancing tune
    this.tone(233, 0.45, 'sawtooth', 0.1, 0, 349);
    this.tone(349, 0.5, 'sawtooth', 0.1, 0.45);
    this.tone(466, 0.9, 'sawtooth', 0.1, 0.95);
    const tune = ['D5', 'E5', 'F#5', 'G5', 'A5', 'G5', 'F#5', 'E5', 'D5', 'F#5', 'A5', 'D6'];
    tune.forEach((n, k) => this.tone(noteFreq(n.replace('6', '5')) * (n.endsWith('6') ? 2 : 1), 0.22, 'triangle', 0.14, 1.9 + k * 0.22));
    for (let k = 0; k < 16; k++) this.noiseHit(1.9 + k * 0.22, 7000, 0.08, k % 2 ? 0.12 : 0.22, 'highpass');
  },
};

// ============================================================
//  Rendering
// ============================================================
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// A speech bubble above (ax, ay) with its tail pointing to it
function drawSpeech(text, ax, ay, maxW, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '700 17px Fredoka, sans-serif';
  const lines = wrapText(text, maxW - 26);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(ax - w / 2, 8, W - 8 - w);
  const by = ay - 18 - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(ax, bx + 18, bx + w - 18);
  ctx.beginPath();
  ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, ay); ctx.lineTo(tx + 10, by + h - 1.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, ay); ctx.lineTo(tx + 10, by + h);
  ctx.stroke();
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawBubbles() {
  for (const b of bubbles) {
    if (b.delay > 0) continue;
    const a = clamp(b.t / 0.3, 0, 1) * clamp((b.age || 0) / 0.2, 0, 1);
    if (b.who === 'fools') {
      const sl = foolSlots();
      const cx = (sl[0].x + sl[4].x) / 2;
      drawSpeech(verseText(b.key), cx, BACK_Y - 64, Math.min(W * 0.62, 340), a);
    } else {
      const sl = wiseSlots()[4];
      drawSpeech(verseText(b.key), sl.x - 6, FRONT_Y - 76 * sl.s, Math.min(W * 0.66, 380), a);
    }
  }
}

function drawBanner() {
  if (!banner || banner.t <= 0) return;
  const v = Bible.verse(VERSES[banner.key]);
  const a = clamp(banner.t / 0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '700 22px Fredoka, sans-serif';
  const maxW = Math.min(W - 40, 640);
  const lines = wrapText(v.text, maxW - 30);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width), 120);
  const w = tw + 34, h = lines.length * 28 + 40;
  const bx = W / 2 - w / 2, by = 120;
  ctx.fillStyle = 'rgba(36,28,72,0.86)'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe8a3';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 20 + i * 28));
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillStyle = 'rgba(255,232,163,0.75)';
  ctx.fillText(v.cite, W / 2, by + h - 13);
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, W - 30);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,24,60,0.9)'; ctx.lineJoin = 'round';
  lines.forEach((l, i) => {
    const y = H * 0.44 + i * 28;
    ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = '#ffe08a';
    ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,30,0.9)'; ctx.shadowBlur = 4;

  // Left: level, flasks and matches
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe8a3';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Keep Your Lamp Burning' : state === 'intro' ? 'On the Mount of Olives' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title' && state !== 'intro') {
    ctx.shadowBlur = 0;
    drawJar(22, 46, 0.72);
    ctx.shadowBlur = 4;
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillStyle = flasks === 0 && Math.sin(t * 8) > 0 ? '#ff8a8a' : '#ffe8a3';
    ctx.fillText(`× ${flasks}`, 34, 52);
    ctx.shadowBlur = 0;
    drawMatch(84, 46);
    ctx.shadowBlur = 4;
    ctx.fillStyle = matches === 0 ? '#ff8a8a' : '#ffe8a3';
    ctx.fillText(`× ${matches}`, 96, 52);
  }
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score
  if (state !== 'intro') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#ffe8a3';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SCORE', rx, 20);
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`${totalScore}`, rx, 40);
    if (state === 'play' && nightT > cfg.minT) {
      ctx.font = '600 12px Fredoka, sans-serif';
      ctx.fillStyle = Math.sin(t * 4) > 0 ? '#ffe08a' : 'rgba(255,224,138,0.6)';
      ctx.fillText('He may come any moment!', rx, 60);
    }
  }
  ctx.restore();
}

function renderNight() {
  drawNightSky();
  drawVillage();
  drawFools();
  drawProcession();
  drawServant();
  drawWise();
  drawLeaves();
  drawParticles();
  drawPopups();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,240,200,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 60, 0, TAU); ctx.stroke();
  }
  drawBanner();
  drawBubbles();
  drawMessage();
  if (fadeIn > 0) { ctx.fillStyle = `rgba(10,10,30,${fadeIn / 0.7})`; ctx.fillRect(-offX, -offY, viewW, viewH); }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
  if (state === 'intro' || (state === 'pause' && pausedFrom === 'intro')) renderIntro();
  else renderNight();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updateNight(dt) {
  for (const c of nightClouds) {
    c.f += (c.speed + gustNow * gust.dir * 60) * dt / (W + 340);
    if (c.f > 1) c.f -= 1;
    if (c.f < 0) c.f += 1;
  }
  for (const m of WISE) updateBlink(m, dt);
  for (const f of FOOLS) updateBlink(f, dt);
}

function update(dt) {
  t += dt;
  updateNight(dt);
  updateParticles(dt);
  updateLeaves(dt);
  updateGust(dt);
  if (state === 'intro') {
    introT += dt;
    updateListeners(dt);
    if (jesusBubble) { jesusBubble.t -= dt; if (jesusBubble.t <= 0) jesusBubble = null; }
    if (introT >= introDur) beginPlay();
  } else if (state === 'play') {
    nightT += dt;
    if (nightT > cfg.minT && firstTime('window')) showMessage('He could come at any moment…');
    for (const m of WISE) updateMaid(m, dt);
    for (const f of FOOLS) updateFool(f, dt);
    updateServant(dt);
    if (nightT >= arrivalT) startCry();
  } else if (state === 'cry') {
    for (const m of WISE) updateMaid(m, dt);
    for (const f of FOOLS) updateFool(f, dt);
    updateServant(dt);
    updateCry(dt);
    updateFoolsRun(dt);
  } else if (state === 'win' || state === 'fail') {
    for (const f of FOOLS) updateFool(f, dt);
    updateEnd(dt);
    updateFoolsRun(dt);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.age = (b.age || 0) + dt;
    b.t -= dt;
    if (b.t <= 0) bubbles.splice(i, 1);
  }
  if (banner) { banner.t -= dt; if (banner.t <= 0 && state !== 'cry') banner = null; }
  fadeIn = Math.max(0, fadeIn - dt);
  message.t -= dt;
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; if (popups[i].t <= 0) popups.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.wind(state === 'play' ? gustNow * 0.8 + (gust.warn > 0 ? 0.25 : 0) : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
