<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<title>Trumpets and Jars</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #141a33;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(20, 26, 60, 0.3);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Trumpets and Jars</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'odeToJoy', instrument: 'pipe', accent: 'harp', ambience: 'night', percussion: true };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  companies: { ref: 'Judges 7:16', KJV: 'And he divided the three hundred men into three companies, and he put a trumpet in every man\'s hand, with empty pitchers, and lamps within the pitchers.', NKJV: 'Then he divided the three hundred men into three companies, and he put a trumpet into every man’s hand, with empty pitchers, and torches inside the pitchers.', NIV: 'Dividing the three hundred men into three companies, he placed trumpets and empty jars in the hands of all of them, with torches inside.', NLT: 'He divided the 300 men into three groups and gave each man a ram’s horn and a clay jar with a torch in it.' },
  // Level cards
  blew: { ref: 'Judges 7:19', KJV: 'they blew the trumpets, and brake the pitchers that were in their hands.', NKJV: 'they blew the trumpets and broke the pitchers that were in their hands.', NIV: 'They blew their trumpets and broke the jars that were in their hands.', NLT: 'Suddenly, they blew the rams’ horns and broke their clay jars.' },
  sword: { ref: 'Judges 7:18', KJV: 'The sword of the Lord, and of Gideon.', NKJV: 'The sword of the Lord and of Gideon!', NIV: 'For the Lord and for Gideon.', NLT: 'For the Lord and for Gideon!' },
  three: { ref: 'Judges 7:20', KJV: 'And the three companies blew the trumpets, and brake the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow withal: and they cried, The sword of the Lord, and of Gideon.', NKJV: 'Then the three companies blew the trumpets and broke the pitchers—they held the torches in their left hands and the trumpets in their right hands for blowing—and they cried, “The sword of the Lord and of Gideon!”', NIV: 'The three companies blew the trumpets and smashed the jars. Grasping the torches in their left hands and holding in their right hands the trumpets they were to blow, they shouted, “A sword for the Lord and for Gideon!”', NLT: 'Then all three groups blew their horns and broke their jars. They held the blazing torches in their left hands and the horns in their right hands, and they all shouted, “A sword for the Lord and for Gideon!”' },
  // Win card
  fled: { ref: 'Judges 7:21', KJV: 'And they stood every man in his place round about the camp; and all the host ran, and cried, and fled.', NKJV: 'And every man stood in his place all around the camp; and the whole army ran and cried out and fled.', NIV: 'While each man held his position around the camp, all the Midianites ran, crying out as they fled.', NLT: 'Each man stood at his position around the camp and watched as all the Midianites rushed around in a panic, shouting as they ran to escape.' },
  // Fail card
  followMe: { ref: 'Judges 7:18', KJV: 'When I blow with a trumpet, I and all that are with me, then blow ye the trumpets also', NKJV: 'When I blow the trumpet, I and all who are with me, then you also blow the trumpets', NIV: 'When I and all who are with me blow our trumpets, then from all around the camp blow yours', NLT: 'As soon as I and those with me blow the rams’ horns, blow your horns, too' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const LANE_TOP = 452;     // notes appear here
const HIT_Y = 774;        // ...and should be tapped as they cross this line
const BTN_Y = 842;        // the big buttons
const LANES = [
  { key: 'trumpet', label: 'Trumpet', col: '#e0a526', keys: ['Digit1', 'KeyA', 'ArrowLeft'] },
  { key: 'jar',     label: 'Jar',     col: '#c0643a', keys: ['Digit2', 'KeyS', 'ArrowDown'] },
  { key: 'torch',   label: 'Torch',   col: '#e8552d', keys: ['Digit3', 'KeyD', 'ArrowRight'] },
  { key: 'shout',   label: 'Shout!',  col: '#5b7fd6', keys: ['Digit4', 'KeyF', 'ArrowUp'] },
];

// Phrases: [beat, lane] pairs, and how many beats the phrase lasts.
// Lanes: 0 trumpet, 1 jar, 2 torch, 3 shout. The story order is blow, break, raise, shout.
const LEVELS = [
  { name: 'Creeping to the Camp', lanes: 3, bpm: 80,  lead: 2.5, good: 0.22, perfect: 0.1, miss: 10, wrong: 4, hide: 0,
    phrases: [{ len: 6, n: [[0, 0], [2, 1], [4, 2]] }], count: 6 },
  { name: 'The Middle Watch', lanes: 3, bpm: 88, lead: 2.3, good: 0.2, perfect: 0.09, miss: 11, wrong: 5, hide: 0,
    phrases: [{ len: 5, n: [[0, 0], [1, 0], [2, 1], [3, 2]] }, { len: 5, n: [[0, 0], [1, 1], [2, 1], [3, 2]] }, { len: 4, n: [[0, 0], [1, 1], [2, 2]] }], count: 7 },
  { name: 'The Sword of the Lord', lanes: 4, bpm: 94, lead: 2.1, good: 0.19, perfect: 0.085, miss: 12, wrong: 5, hide: 0,
    phrases: [{ len: 5, n: [[0, 0], [1, 1], [2, 2], [3, 3]] }, { len: 6, n: [[0, 0], [1, 0], [2, 1], [3, 2], [4, 3]] }, { len: 5, n: [[0, 0], [1, 1], [1.5, 1], [2, 2], [3, 3]] }], count: 8 },
  { name: 'Three Companies', lanes: 4, bpm: 100, lead: 1.9, good: 0.18, perfect: 0.08, miss: 12, wrong: 6, hide: 0,
    phrases: [{ len: 4, n: [[0, 0], [0.5, 0], [1, 1], [2, 2], [3, 3]] }, { len: 4, n: [[0, 2], [1, 1], [1.5, 1], [2, 0], [3, 3]] }, { len: 4, n: [[0, 1], [0.5, 2], [1, 0], [2, 3], [2.5, 3]] }, { len: 4, n: [[0, 0], [1, 2], [2, 1], [3, 3]] }], count: 9 },
  { name: 'Torches in the Dark', lanes: 4, bpm: 108, lead: 1.75, good: 0.17, perfect: 0.075, miss: 13, wrong: 6, hide: 0.3,
    phrases: [{ len: 4, n: [[0, 0], [0.5, 1], [1, 2], [2, 3], [2.5, 0], [3, 1]] }, { len: 4, n: [[0, 2], [0.5, 2], [1, 1], [1.5, 0], [2, 3], [3, 3]] }, { len: 4, n: [[0, 1], [1, 0], [1.5, 2], [2, 3], [3, 0]] }, { len: 3, n: [[0, 3], [0.5, 2], [1, 1], [1.5, 0]] }], count: 10 },
  { name: 'All the Camp Runs!', lanes: 4, bpm: 116, lead: 1.6, good: 0.16, perfect: 0.07, miss: 14, wrong: 7, hide: 0.42,
    phrases: [{ len: 4, n: [[0, 0], [0.5, 1], [1, 2], [1.5, 3], [2, 0], [3, 3]] }, { len: 4, n: [[0, 2], [0.5, 1], [1, 0], [2, 3], [2.5, 2], [3, 1]] }, { len: 3, n: [[0, 1], [0.5, 1], [1, 3], [2, 0], [2.5, 2]] }, { len: 4, n: [[0, 3], [1, 0], [1.5, 1], [2, 2], [2.5, 3], [3, 0]] }], count: 11 },
];
const NUM_LEVELS = LEVELS.length;
function makeConfig(n) { return Object.assign({}, LEVELS[clamp(n, 1, NUM_LEVELS) - 1]); }

// The level's "song": every note, with the time it should be tapped
function makeChart(c) {
  const beat = 60 / c.bpm;
  const notes = [];
  let at = c.lead + 1.4;
  let prev = -1;
  for (let i = 0; i < c.count; i++) {
    // never play the same phrase twice in a row (when there is a choice)
    let k = Math.floor(Math.random() * c.phrases.length);
    if (c.phrases.length > 1 && k === prev) k = (k + 1) % c.phrases.length;
    if (i === 0) k = 0;
    prev = k;
    const ph = c.phrases[k];
    for (const [b, lane] of ph.n) notes.push({ t: at + b * beat, lane, done: false, res: null, hitT: 0 });
    at += ph.len * beat;
  }
  notes.sort((a, b) => a.t - b.t);
  return { notes, end: at };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | card | play | win | fail | pause
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('trumpetsBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let chart = { notes: [], end: 0 };
let t = 0, playT = 0, winT = 0, failT = 0, endTimer = 0;
let together = 100;       // the 300 keeping together; 0 = the plan falls apart
let hits = 0, perfects = 0, missed = 0, wrongs = 0, combo = 0, bestCombo = 0, levelScore = 0;
let lastScore = null;
let particles = [], popups = [];
let btnFlash = [0, 0, 0, 0];
let message = { text: '', t: 0 };
let told = {};
let camp = [];            // the sleeping Midianites
let ridge = [];           // Gideon's men around the camp
let gideonMood = 'watch';

// ============================================================
//  Layout
// ============================================================
function laneCount() { return cfg.lanes; }
function laneW() { return Math.min(150, (W - 36) / laneCount()); }
function laneX(i) { const n = laneCount(), lw = laneW(); return W / 2 - (n * lw) / 2 + lw * (i + 0.5); }
function laneAt(x) {
  const n = laneCount(), lw = laneW(), x0 = W / 2 - (n * lw) / 2;
  const i = Math.floor((x - x0) / lw);
  return i >= 0 && i < n ? i : -1;
}
function noteY(n) {
  const f = 1 - (n.t - playT) / cfg.lead;
  return lerp(LANE_TOP, HIT_Y, f);
}

// ============================================================
//  The camp below and the 300 on the hills around it
// ============================================================
const ROBES = ['#8a3b6a', '#3b6a8a', '#7a6a2a', '#6a3b2a', '#2a6a5a', '#8a5a2a'];
function buildCamp() {
  camp = [];
  const n = W < 700 ? 6 : 9;
  for (let i = 0; i < n; i++) {
    const x = W * (0.1 + 0.8 * (i + 0.5) / n) + rand(-14, 14);
    camp.push({ i, x, y: 372 + (i % 2) * 26 + rand(-4, 4), hx: x, st: 'sleep', t: rand(0, 3), dir: Math.random() < 0.5 ? -1 : 1, robe: ROBES[i % ROBES.length], stripe: i % 2 ? '#f0e0b0' : '#2a2030', at: (i + 1) / (n + 1), dazed: 0, z: rand(0, 3) });
  }
  ridge = [];
  const m = Math.max(10, Math.round(W / 40));
  for (let i = 0; i < m; i++) ridge.push({ x: (i + 0.5) * W / m, y: 0, lit: false, broke: false, horn: 0, phase: rand(0, TAU) });
}
function ridgeY(x) { return 268 + Math.sin(x * 0.012) * 12 + Math.sin(x * 0.031 + 1) * 5; }

function updateCamp(dt) {
  const panic = chart.notes.length ? hits / chart.notes.length : 0;
  for (const c of camp) {
    c.t += dt;
    c.dazed = Math.max(0, c.dazed - dt);
    if (c.st === 'sleep' && (panic >= c.at * 0.9 || state === 'win')) { c.st = 'wake'; c.t = 0; }
    if (c.st === 'wake' && c.t > 0.7) { c.st = 'panic'; c.t = 0; }
    if (c.st === 'panic') {
      c.x += c.dir * 150 * dt;
      if (c.x < 30 || c.x > W - 30 || Math.random() < dt * 0.8) {
        c.dir *= -1;
        if (Math.random() < 0.5) { c.dazed = 0.7; spawnStars(c.x, c.y - 70); }
      }
      if ((panic >= Math.min(1, c.at + 0.25) && c.t > 1.2) || (state === 'win' && c.t > 0.6)) { c.st = 'flee'; c.dir = c.x < W / 2 ? -1 : 1; }
    }
    if (c.st === 'flee') c.x += c.dir * 260 * dt;
  }
}
function spawnStars(x, y) {
  for (let i = 0; i < 5; i++) spawn(x + offX, y + offY, Math.cos(i * 1.25) * 60, Math.sin(i * 1.25) * 30 - 30, 0.8, '#ffe27a', 3, 60, 'star');
}

// ============================================================
//  Tapping a lane
// ============================================================
function press(lane) {
  if (state !== 'play' || lane < 0 || lane >= laneCount()) return;
  btnFlash[lane] = 0.18;
  // the nearest waiting note in this lane
  let bestN = null, bd = 1e9;
  for (const n of chart.notes) {
    if (n.done || n.lane !== lane) continue;
    const d = Math.abs(n.t - playT);
    if (d < bd) { bd = d; bestN = n; }
    if (n.t - playT > 1) break;
  }
  if (bestN && bd <= cfg.good) {
    bestN.done = true; bestN.hitT = playT;
    const perfect = bd <= cfg.perfect;
    bestN.res = perfect ? 'perfect' : 'good';
    hits++; combo++; bestCombo = Math.max(bestCombo, combo);
    if (perfect) perfects++;
    levelScore += (perfect ? 100 : 60) + Math.min(combo, 20) * 5;
    together = Math.min(100, together + 3);
    popups.push({ x: laneX(lane), y: HIT_Y - 40, text: perfect ? 'Perfect!' : 'Good!', col: perfect ? '#ffe27a' : '#bfe7ff', t: 0.7 });
    sfx.action(lane, perfect);
    actionFx(lane);
    gideonMood = 'joy'; moodT = 0.5;
    if (combo === 10 && !told.combo) { told.combo = true; showMessage('Ten in a row! The camp is waking up!', 2); }
  } else {
    // a tap with nothing to play: the men get muddled
    wrongs++; combo = 0;
    together = Math.max(0, together - cfg.wrong);
    popups.push({ x: laneX(lane), y: HIT_Y - 40, text: 'Oops', col: '#ffb0a0', t: 0.6 });
    sfx.oops(lane);
    if (!told.wrong) { told.wrong = true; showMessage('Wait for a note to reach the line!', 2); }
    if (together <= 0) fail();
  }
}

// What happens on the hills when the men obey
function actionFx(lane) {
  const r = ridge[Math.floor(Math.random() * ridge.length)];
  const lit = ridge.filter((q) => !q.lit);
  if (lane === 0) { for (const q of ridge) if (Math.random() < 0.5) q.horn = 0.5; }
  if (lane === 1) {
    const q = ridge.find((q) => !q.broke) || r; q.broke = true;
    for (let i = 0; i < 6; i++) spawn(q.x + offX, ridgeY(q.x) - 30 + offY, rand(-90, 90), rand(-140, -40), 0.6, '#c0643a', 3, 500);
  }
  if (lane === 2) {
    const q = lit.length ? pick(lit) : r; q.lit = true; q.broke = true;
    for (let i = 0; i < 6; i++) spawn(q.x + offX, ridgeY(q.x) - 50 + offY, rand(-40, 40), rand(-120, -40), 0.6, '#ffcf5a', 3, 0, 'star');
  }
  if (lane === 3) { shoutT = 1.1; }
}
let shoutT = 0, moodT = 0;

function checkMisses() {
  for (const n of chart.notes) {
    if (n.done) continue;
    if (n.t - playT > 0) break;
    if (playT - n.t > cfg.good) {
      n.done = true; n.res = 'miss';
      missed++; combo = 0;
      together = Math.max(0, together - cfg.miss);
      popups.push({ x: laneX(n.lane), y: HIT_Y - 40, text: 'Miss', col: '#ffb0a0', t: 0.6 });
      sfx.miss();
      gideonMood = 'oops'; moodT = 0.6;
      if (!told.miss) { told.miss = true; showMessage(`Tap ${LANES[n.lane].label.replace('!', '')} as the note reaches the line!`, 2.2); }
      if (together <= 0) { fail(); return; }
    }
  }
  if (state === 'play' && playT > chart.end + 0.4 && chart.notes.every((n) => n.done)) win();
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function updateParticles(dt) {
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const p of popups) { p.t -= dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t > 0);
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rr = i % 2 ? r * 0.4 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    if (p.kind === 'star') drawStar(p.x, p.y, p.size * 1.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

//  Win / fail
// ============================================================
function win() {
  if (state !== 'play') return;
  state = 'win';
  syncAmbience();
  winT = 0;
  endTimer = 3.2;
  gideonMood = 'joy'; moodT = 99;
  for (const q of ridge) { q.lit = true; q.broke = true; }
  const sc = scoreLevel();
  lastScore = sc;
  totalScore += sc.total;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('trumpetsBest', String(best)); } catch (e) {} }
  sfx.win();
  showMessage('The sword of the LORD and of Gideon!', 2.8);
}
function fail() {
  if (state !== 'play') return;
  state = 'fail';
  syncAmbience();
  failT = 0;
  endTimer = 2.2;
  gideonMood = 'oops'; moodT = 99;
  sfx.fail();
}
function scoreLevel() {
  const notes = levelScore;
  const tog = Math.round(together) * 3;
  const lv = level * 100;
  const total = notes + tog + lv;
  return { lines: [[`Notes and combos (${perfects} perfect, ${hits - perfects} good, ${missed} missed, best combo ${bestCombo})`, notes], ['Kept together', tog], ['Level bonus', lv]], total };
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// Level card: the config and the level's data (chart, camp) change together, behind the card
function startLevel(retry = false) {

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= NUM_LEVELS;
    showOverlay(last ? 'Victory for the LORD!' : 'The camp ran away!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('fled')}
       ${last ? '<p style="text-align:center">Just 300 men with trumpets, jars and torches. God won the battle, not swords!</p>' : ''}
       <p class="score">${s.lines.map(([k, v]) => `${k}: <b>${v}</b>`).join('<br>')}</p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      last ? 'Play again' : 'Next level', last ? () => { level = 1; totalScore = 0; startLevel(); } : () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Oh… try again', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The men got out of step. Watch the notes and <b>tap just as each one reaches the line</b>.</p>
       ${verseHTML('followMe')}

      'Try Again', () => startLevel(true));

}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    keys.clear();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Main update
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  for (let i = 0; i < 4; i++) btnFlash[i] = Math.max(0, btnFlash[i] - dt);
  for (const q of ridge) q.horn = Math.max(0, q.horn - dt);
  shoutT = Math.max(0, shoutT - dt);
  moodT -= dt;
  if (moodT <= 0 && state === 'play') gideonMood = 'watch';
  if (state === 'play') {
    playT += dt;
    // a gentle count-in on the beat before the first note
    const beat = 60 / cfg.bpm, first = chart.notes.length ? chart.notes[0].t : 0;
    const k = Math.floor((playT - (first - 4 * beat)) / beat);
    if (k >= 0 && k < 4 && k !== lastCount) { lastCount = k; sfx.tick(k === 3); if (k === 3) showMessage('Go!', 0.8); }
    checkMisses();
    // first time a lane is used, say what it does
    const next = chart.notes.find((n) => !n.done);
    if (next && next.t - playT < cfg.lead * 0.6 && !told['lane' + next.lane] && level <= 3) {
      told['lane' + next.lane] = true;
      showMessage(['Blow the trumpet!', 'Smash the jar!', 'Raise the torch!', 'Shout: “For the LORD and for Gideon!”'][next.lane], 1.8);
    }
  }
  if (state === 'play' || state === 'win' || state === 'title' || state === 'card' || state === 'fail') updateCamp(dt);
  if (state === 'win') {
    winT += dt;
    if (Math.random() < dt * 10) spawn(rand(0, viewW), rand(120, viewH * 0.45), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  }
  if (state === 'fail') failT += dt;
  message.t -= dt;
  endScreens(dt);
}
let lastCount = -1;

// ============================================================
//  Input
// ============================================================
const keys = new Set();

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 1.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat) {
    const lane = LANES.findIndex((l) => l.keys.includes(e.code));
    if (lane >= 0) press(lane);
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) { return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale }; }

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'win' && winT > 1.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const wy = p.vy - offY;
  if (wy < LANE_TOP - 20) return;   // taps up in the sky don't count
  press(laneAt(p.vx - offX));
});

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  tick(go) { this.tone(go ? 1320 : 880, 0.08, 'triangle', 0.12); },
  action(lane, perfect) {
    if (!this.ctx) return;
    Music.tap([0.35, 0.5, 0.7, 0.9][lane] + (perfect ? 0.05 : 0));
    if (lane === 0) { this.tone(233, 0.35, 'sawtooth', 0.08, 0, 262); this.tone(349, 0.3, 'sawtooth', 0.05, 0.02); }            // ram's horn
    if (lane === 1) { this.noiseBurst(2600, 0.18, 0.4, 1.2); this.tone(1400, 0.08, 'triangle', 0.1); this.tone(900, 0.1, 'triangle', 0.08, 0.04); } // jar smash
    if (lane === 2) this.noiseBurst(500, 0.35, 0.3, 0.6, 2200);                                                                     // whoosh of flame
    if (lane === 3) { this.noiseBurst(900, 0.3, 0.25, 1.5); this.tone(196, 0.3, 'square', 0.05); this.tone(247, 0.3, 'square', 0.04); } // shout
  },
  oops() { this.tone(200, 0.15, 'triangle', 0.15, 0, 150); },
  miss() { this.tone(330, 0.2, 'sine', 0.1, 0, 220); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Rendering: night sky, the valley camp, the hills of torches
// ============================================================
const STARS = Array.from({ length: 80 }, (_, i) => ({ x: hash(i, 1), y: hash(i, 2), r: 0.8 + hash(i, 3) * 1.6, p: hash(i, 4) * TAU }));

function drawSky() {
  const top = -offY;
  const g = ctx.createLinearGradient(0, top, 0, 460);
  g.addColorStop(0, '#0f1430'); g.addColorStop(1, '#2a2f5e');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, top, viewW, 460 - top);
  ctx.fillStyle = '#fff';
  for (const s of STARS) {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 1.4 + s.p);
    ctx.beginPath(); ctx.arc(-offX + s.x * viewW, top + s.y * (260 - top), s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // a thin moon
  const mx = W - 80, my = Math.max(top + 80, 180);
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(mx, my, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = '#151b3a';
  ctx.beginPath(); ctx.arc(mx + 11, my - 6, 24, 0, TAU); ctx.fill();
}

// Hills all around the camp, with Gideon's men on the ridge
function drawRidge() {
  ctx.fillStyle = '#1e2648';
  ctx.beginPath(); ctx.moveTo(-offX, 460);
  for (let x = -offX; x <= W + offX + 10; x += 10) ctx.lineTo(x, ridgeY(x));
  ctx.lineTo(W + offX, 460); ctx.closePath(); ctx.fill();
  for (const q of ridge) {
    const y = ridgeY(q.x);
    // a little dark figure
    ctx.fillStyle = '#0e1226';
    ctx.beginPath(); ctx.moveTo(q.x - 8, y + 2); ctx.quadraticCurveTo(q.x - 7, y - 20, q.x, y - 22); ctx.quadraticCurveTo(q.x + 7, y - 20, q.x + 8, y + 2); ctx.fill();
    ctx.beginPath(); ctx.arc(q.x, y - 27, 6, 0, TAU); ctx.fill();
    // trumpet (ram's horn) in his right hand
    ctx.strokeStyle = q.horn > 0 ? '#ffe27a' : '#a8741a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(q.x + 3, y - 26); ctx.quadraticCurveTo(q.x + 14, y - 30, q.x + 16, y - 40); ctx.stroke();
    if (q.horn > 0) {
      ctx.strokeStyle = `rgba(255,230,140,${q.horn * 2})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(q.x + 18, y - 44, 6 + (0.5 - q.horn) * 20, -1.2, 0.2); ctx.stroke();
    }
    // jar or torch in his left hand
    const hx = q.x - 11, hy = y - 16;
    if (q.lit) {
      const fl = 1 + Math.sin(t * 15 + q.phase) * 0.15;
      const gl = ctx.createRadialGradient(hx, hy - 16, 2, hx, hy - 16, 30);
      gl.addColorStop(0, 'rgba(255,200,90,0.55)'); gl.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(hx, hy - 16, 30, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#6b4a2e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 14); ctx.stroke();
      ctx.fillStyle = '#ff9a2e';
      ctx.beginPath(); ctx.moveTo(hx - 5, hy - 14); ctx.quadraticCurveTo(hx, hy - 30 * fl, hx + 5, hy - 14); ctx.fill();
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath(); ctx.moveTo(hx - 2.5, hy - 14); ctx.quadraticCurveTo(hx, hy - 22 * fl, hx + 2.5, hy - 14); ctx.fill();
    } else if (!q.broke) {
      ctx.fillStyle = '#b8683a';
      ctx.beginPath(); ctx.ellipse(hx, hy - 6, 6, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,190,90,0.35)';
      ctx.beginPath(); ctx.arc(hx, hy - 13, 3, 0, TAU); ctx.fill();
    }
  }
}

function drawCampGround() {
  // the valley floor below the ridge
  const g = ctx.createLinearGradient(0, 290, 0, 450);
  g.addColorStop(0, '#2b3352'); g.addColorStop(1, '#3a3d4e');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, 300, viewW, 160);
  ctx.fillStyle = '#26304d';
  ctx.beginPath(); ctx.moveTo(-offX, 310);
  for (let x = -offX; x <= W + offX + 10; x += 20) ctx.lineTo(x, 304 + Math.sin(x * 0.02) * 4);
  ctx.lineTo(W + offX, 330); ctx.lineTo(-offX, 330); ctx.fill();
  // tents
  const n = Math.max(4, Math.round(W / 150));
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) * W / n, y = 340 + (i % 2) * 8;
    ctx.fillStyle = i % 2 ? '#5a4a6a' : '#6a4a3a';
    ctx.beginPath(); ctx.moveTo(x - 38, y + 22); ctx.lineTo(x - 10, y - 22); ctx.lineTo(x + 10, y - 22); ctx.lineTo(x + 38, y + 22); ctx.fill();
    ctx.fillStyle = i % 2 ? '#e0c890' : '#d8b070';
    ctx.globalAlpha = 0.35;
    for (let s = -2; s <= 2; s++) ctx.fillRect(x + s * 12 - 2, y - 14, 4, 34);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#20162a';
    ctx.beginPath(); ctx.moveTo(x - 7, y + 22); ctx.lineTo(x, y + 2); ctx.lineTo(x + 7, y + 22); ctx.fill();
  }
  // a low campfire
  const fx = W / 2, fy = 432;
  ctx.fillStyle = 'rgba(255,150,60,0.25)';
  ctx.beginPath(); ctx.ellipse(fx, fy, 60, 16, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff8a2e';
  const f = 1 + Math.sin(t * 12) * 0.1;
  ctx.beginPath(); ctx.moveTo(fx - 10, fy); ctx.quadraticCurveTo(fx, fy - 22 * f, fx + 10, fy); ctx.fill();
  // a sleepy camel
  drawCamel(W * 0.82, 428);
}

function drawCamel(x, y) {
  ctx.fillStyle = '#7a6040';
  ctx.beginPath(); ctx.ellipse(x, y - 12, 30, 14, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x - 4, y - 24, 12, 10, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 34, y - 10, 10, 7, 0.3, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x + 36, y - 11, 2.5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  if (state !== 'win') {
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('z', x + 44, y - 24 - (t * 8) % 12);
  }
}

// A Midianite: sleeping, waking with a jump, running about, then away over the hills
function drawMidianite(c) {
  if (c.x < -60 || c.x > W + 60) return;
  ctx.save();
  ctx.translate(c.x, c.y);
  const skin = '#c98d56';
  if (c.st === 'sleep') {
    ctx.fillStyle = c.robe;
    ctx.beginPath(); ctx.ellipse(0, -8, 26, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.stripe; ctx.globalAlpha = 0.6;
    ctx.fillRect(-14, -16, 4, 16); ctx.fillRect(2, -17, 4, 17);
    ctx.globalAlpha = 1;
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-26, -12, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(-28, -13, 2.5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
    const zz = (t * 0.7 + c.z) % 1;
    ctx.globalAlpha = 1 - zz;
    ctx.fillText('z', -30 + zz * 10, -26 - zz * 22);
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }
  const jump = c.st === 'wake' ? Math.max(0, Math.sin(c.t * 9)) * 16 : Math.abs(Math.sin(c.t * 14)) * 5;
  ctx.translate(0, -jump);
  const step = c.st === 'wake' ? 0 : Math.sin(c.t * 16);
  ctx.strokeStyle = shade(skin, -20); ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(-5 - step * 6, 0); ctx.moveTo(5, -12); ctx.lineTo(5 + step * 6, 0); ctx.stroke();
  ctx.fillStyle = c.robe;
  ctx.beginPath(); ctx.moveTo(-14, -8); ctx.quadraticCurveTo(-13, -40, 0, -44); ctx.quadraticCurveTo(13, -40, 14, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c.stripe; ctx.globalAlpha = 0.6; ctx.fillRect(-7, -38, 3.5, 30); ctx.fillRect(4, -38, 3.5, 30); ctx.globalAlpha = 1;
  // arms waving in a muddle
  const wave = Math.sin(c.t * 18) * 8;
  ctx.strokeStyle = shade(c.robe, -25); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-10, -36); ctx.lineTo(-20, -56 + wave); ctx.moveTo(10, -36); ctx.lineTo(20, -56 - wave); ctx.stroke();
  // head with turban
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -54, 12, 0, TAU); ctx.fill();
  ctx.fillStyle = c.stripe === '#2a2030' ? '#e8dcc0' : '#4a3a5a';
  ctx.beginPath(); ctx.ellipse(0, -63, 13, 7, 0, 0, TAU); ctx.fill();
  // big surprised eyes and an "O" mouth (or dizzy when they bump)
  if (c.dazed > 0) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.8;
    for (const sx of [-4.5, 4.5]) { ctx.beginPath(); ctx.arc(sx, -55, 2.6, 0, TAU * 0.8); ctx.stroke(); }
  } else {
    for (const sx of [-4.5, 4.5]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sx, -55, 3.6, 4.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(sx + c.dir * 1.2, -55, 1.8, 0, TAU); ctx.fill();
    }
  }
  ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(0, -47, 2.6, 3.4, 0, 0, TAU); ctx.fill();
  ctx.restore();
  if (c.st === 'wake') {
    ctx.fillStyle = '#ffe27a'; ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', c.x, c.y - 86);
  }
}

// ============================================================
//  Rendering: lanes, notes and buttons
// ============================================================
function drawIcon(lane, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (lane === 0) {
    // a curly ram's horn
    ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-14, 10); ctx.quadraticCurveTo(-2, 12, 6, 0); ctx.quadraticCurveTo(12, -10, 6, -16); ctx.stroke();
    ctx.strokeStyle = '#f4d27a'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-14, 10); ctx.quadraticCurveTo(-2, 12, 6, 0); ctx.quadraticCurveTo(12, -10, 6, -16); ctx.stroke();
    ctx.fillStyle = '#f4d27a'; ctx.beginPath(); ctx.ellipse(5, -16, 6, 4, -0.5, 0, TAU); ctx.fill();
  } else if (lane === 1) {
    // a clay jar with a crack
    ctx.fillStyle = '#c0643a';
    ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(6, -16); ctx.quadraticCurveTo(16, -4, 10, 12); ctx.lineTo(-10, 12); ctx.quadraticCurveTo(-16, -4, -6, -16); ctx.fill();
    ctx.fillStyle = '#8a4426'; ctx.fillRect(-7, -19, 14, 5);
    ctx.strokeStyle = '#fff2d0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(2, -4); ctx.lineTo(-2, 2); ctx.lineTo(3, 8); ctx.stroke();
  } else if (lane === 2) {
    // a torch
    ctx.strokeStyle = '#6b4a2e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, -2); ctx.stroke();
    ctx.fillStyle = '#ff7a2e';
    ctx.beginPath(); ctx.moveTo(-9, -2); ctx.quadraticCurveTo(-10, -14, 0, -22); ctx.quadraticCurveTo(10, -14, 9, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.moveTo(-4, -2); ctx.quadraticCurveTo(-5, -9, 0, -14); ctx.quadraticCurveTo(5, -9, 4, -2); ctx.closePath(); ctx.fill();
  } else {
    // a happy face shouting with a wide-open mouth
    ctx.fillStyle = '#e3b184';
    ctx.beginPath(); ctx.arc(-3, 0, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.beginPath(); ctx.arc(-8, -5, 2.2, 0, TAU); ctx.arc(2, -5, 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(-3, 6, 6, 5.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(16, -9); ctx.lineTo(22, -13); ctx.moveTo(17, 0); ctx.lineTo(24, 0); ctx.moveTo(16, 9); ctx.lineTo(22, 13); ctx.stroke();
  }
  ctx.restore();
}

function drawLanes() {
  const n = laneCount(), lw = laneW(), x0 = W / 2 - (n * lw) / 2;
  // dark ground for the lanes
  ctx.fillStyle = '#1b1830';
  ctx.fillRect(-offX, 450, viewW, 450);
  for (let i = 0; i < n; i++) {
    const x = x0 + i * lw;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.09)';
    ctx.fillRect(x + 3, LANE_TOP - 4, lw - 6, BTN_Y - LANE_TOP);
  }
  // darkness hides the top of the lanes on the darkest nights
  if (cfg.hide) {
    const hy = lerp(LANE_TOP, HIT_Y, cfg.hide);
    const g = ctx.createLinearGradient(0, LANE_TOP, 0, hy + 40);
    g.addColorStop(0, 'rgba(14,12,30,1)'); g.addColorStop(0.75, 'rgba(14,12,30,0.95)'); g.addColorStop(1, 'rgba(14,12,30,0)');
    darkGrad = { g, hy };
  } else darkGrad = null;
  // hit line
  ctx.strokeStyle = 'rgba(255,233,168,0.85)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0 + 6, HIT_Y); ctx.lineTo(x0 + n * lw - 6, HIT_Y); ctx.stroke();
  for (let i = 0; i < n; i++) {
    ctx.strokeStyle = 'rgba(255,233,168,0.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(laneX(i), HIT_Y, 27, 0, TAU); ctx.stroke();
  }
}
let darkGrad = null;

function drawNotes() {
  for (const n of chart.notes) {
    if (n.res === 'miss') continue;
    let y, a = 1, s = 1;
    if (n.done) {
      const f = (playT - n.hitT) / 0.3;
      if (f > 1) continue;
      y = HIT_Y; a = 1 - f; s = 1 + f * 0.8;
    } else {
      if (n.t - playT > cfg.lead) break;
      y = noteY(n);
    }
    const x = laneX(n.lane), L = LANES[n.lane];
    ctx.globalAlpha = a;
    ctx.fillStyle = L.col;
    ctx.beginPath(); ctx.arc(x, y, 26 * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff6d8'; ctx.lineWidth = 3; ctx.stroke();
    drawIcon(n.lane, x, y, 0.95 * s);
    ctx.globalAlpha = 1;
  }
  if (darkGrad) {
    const n = laneCount(), lw = laneW(), x0 = W / 2 - (n * lw) / 2;
    ctx.fillStyle = darkGrad.g;
    ctx.fillRect(x0, LANE_TOP - 4, n * lw, darkGrad.hy + 40 - LANE_TOP + 4);
  }
}

function drawButtons() {
  const n = laneCount(), lw = laneW();
  for (let i = 0; i < n; i++) {
    const x = laneX(i), L = LANES[i], f = btnFlash[i] / 0.18;
    const r = Math.min(40, lw / 2 - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(x, BTN_Y + 4, r, 0, TAU); ctx.fill();
    ctx.fillStyle = f > 0 ? '#fff3c4' : L.col;
    ctx.beginPath(); ctx.arc(x, BTN_Y + f * 3, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff6d8'; ctx.lineWidth = 3; ctx.stroke();
    drawIcon(i, x, BTN_Y + f * 3 - 4, r / 30);
    ctx.fillStyle = '#fff6d8'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(L.label, x, BTN_Y + r + 15 > 898 ? BTN_Y + r - 2 : BTN_Y + r + 14);
  }
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = '700 20px Fredoka, sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.3, 0, 1);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (shoutT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(shoutT / 0.4, 0, 1);
    ctx.font = '700 22px Fredoka, sans-serif';
    const txt = 'For the LORD and for Gideon!';
    const y = 172;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,30,0.9)';
    ctx.strokeText(txt, W / 2, y); ctx.fillStyle = '#ffe27a'; ctx.fillText(txt, W / 2, y);
    ctx.restore();
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  const inLevel = state !== 'title';
  ctx.fillText(inLevel ? `Level ${level} · ${cfg.name}` : 'Trumpets and Jars', 12, 26);
  if (inLevel && combo >= 3) { ctx.font = '600 14px Fredoka, sans-serif'; ctx.fillText(`Combo ×${combo}`, 12, 48); }
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  if (inLevel) {
    const rx = viewW - 14, bw = Math.min(170, viewW * 0.36);
    ctx.textAlign = 'right';
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillStyle = '#ffe9a8'; ctx.shadowBlur = 4;
    const done = chart.notes.filter((n) => n.done).length;
    ctx.fillText(`Notes ${done} / ${chart.notes.length}`, rx, 26);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,233,168,0.22)'; roundRect(rx - bw, 34, bw, 10, 5); ctx.fill();
    ctx.fillStyle = '#9fd6ff'; if (done) { roundRect(rx - bw, 34, bw * done / Math.max(1, chart.notes.length), 10, 5); ctx.fill(); }
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#ffe9a8'; ctx.shadowBlur = 4;
    ctx.fillText('Together', rx, 66);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,233,168,0.22)'; roundRect(rx - bw, 74, bw, 14, 7); ctx.fill();
    ctx.fillStyle = together < 30 && Math.sin(t * 10) > 0 ? '#ff6b6b' : together < 50 ? '#ffb35a' : '#7ed37a';
    if (together > 0) { roundRect(rx - bw, 74, bw * together / 100, 14, 7); ctx.fill(); }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = offY + 214;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,16,40,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
  drawSky();
  drawRidge();
  drawCampGround();
  for (const c of camp.slice().sort((a, b) => a.y - b.y)) drawMidianite(c);
  drawLanes();
  drawNotes();
  drawButtons();
  drawPopups();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawParticles();
  if (state === 'fail') {
    ctx.fillStyle = `rgba(10,10,25,${clamp(failT / 1.5, 0, 0.4)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
