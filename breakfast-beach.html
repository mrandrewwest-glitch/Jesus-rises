<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6c9a0">
<title>Breakfast on the Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f6c9a0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Breakfast on the Beach</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game, looked up in the player's chosen version at display time.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  castRight: { ref: 'John 21:6', KJV: 'Cast the net on the right side of the ship, and ye shall find.', NKJV: 'Cast the net on the right side of the boat, and you will find some.', NIV: 'Throw your net on the right side of the boat and you will find some.', NLT: 'Throw out your net on the right-hand side of the boat, and you’ll get some!' },
  netWhole: { ref: 'John 21:11–12', KJV: '...full of great fishes, an hundred and fifty and three: and for all there were so many, yet was not the net broken. Jesus saith unto them, Come and dine.', NKJV: '...full of large fish, one hundred and fifty-three; and although there were so many, the net was not broken. Jesus said to them, “Come and eat breakfast.”', NIV: 'It was full of large fish, 153, but even with so many the net was not torn. Jesus said to them, “Come and have breakfast.”', NLT: 'There were 153 large fish, and yet the net hadn’t torn. “Now come and have some breakfast!” Jesus said.' },
  nothing: { ref: 'John 21:3', KJV: 'They went forth, and entered into a ship immediately; and that night they caught nothing.', NKJV: 'They went out and immediately got into the boat, and that night they caught nothing.', NIV: 'So they went out and got into the boat, but that night they caught nothing.', NLT: 'So they went out in the boat, but they caught nothing all night.' },
  // speech bubbles
  anyMeat: { ref: 'John 21:5', KJV: 'Children, have ye any meat?', NKJV: 'Children, have you any food?', NIV: 'Friends, haven’t you any fish?', NLT: 'Fellows, have you caught any fish?' },
  no: { ref: 'John 21:5', KJV: 'No.', NKJV: 'No.', NIV: 'No.', NLT: 'No.' },
  theLord: { ref: 'John 21:7', KJV: 'It is the Lord.', NKJV: 'It is the Lord!', NIV: 'It is the Lord!', NLT: 'It’s the Lord!' },
  bring: { ref: 'John 21:10', KJV: 'Bring of the fish which ye have now caught.', NKJV: 'Bring some of the fish which you have just caught.', NIV: 'Bring some of the fish you have just caught.', NLT: 'Bring some of the fish you’ve just caught.' },
  dine: { ref: 'John 21:12', KJV: 'Come and dine.', NKJV: 'Come and eat breakfast.', NIV: 'Come and have breakfast.', NLT: 'Now come and have some breakfast!' },
  // on-screen banners
  fire: { ref: 'John 21:9', KJV: 'They saw a fire of coals there, and fish laid thereon, and bread.', NKJV: 'They saw a fire of coals there, and fish laid on it, and bread.', NIV: 'They saw a fire of burning coals there with fish on it, and some bread.', NLT: 'They found breakfast waiting for them—fish cooking over a charcoal fire, and some bread.' },
  served: { ref: 'John 21:13', KJV: 'Jesus then cometh, and taketh bread, and giveth them, and fish likewise.', NKJV: 'Jesus then came and took the bread and gave it to them, and likewise the fish.', NIV: 'Jesus came, took the bread and gave it to them, and did the same with the fish.', NLT: 'Then Jesus served them the bread and the fish.' },
};

// Card markup for a verse and the translation credit, looked up in the current version.
function verseHTML(entry) {
  const v = Bible.verse(entry);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() { return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`; }
// Plain text, or a VERSES entry looked up now
function textOf(x) { return typeof x === 'string' ? x : Bible.verse(x).text; }

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
// A steady pseudo-random number for index i (so things don't jitter from frame to frame)
const hsh = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function mix(a, b, f) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  f = clamp(f, 0, 1);
  const r = Math.round(lerp(pa >> 16, pb >> 16, f));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, f));
  const bl = Math.round(lerp(pa & 255, pb & 255, f));
  return `rgb(${r},${g},${bl})`;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
const GOAL = 153;               // an hundred and fifty and three
const SEA_Y = 430;              // water line
const NET_TOP = SEA_Y + 10;     // top of the net's reach
const NET_BOTTOM = SEA_Y + 380; // how deep the net reaches
const BOAT_S = 0.68;            // size of the boat and the disciples in it
const HULL = 140;               // half length of the hull (before scaling)
const DROP_T = 0.22;            // net plunging down
const DONE = 0.8;               // a side of fish is cooked from here...
const PERF = 1.1;               // ...perfectly golden up to here...
const BURN = 1.35;              // ...and burnt beyond this
const FLIP_MIN = 0.45;          // too raw to turn before this
const FLIP_T = 0.28;            // turning animation
const MOUTHS = 7;               // seven disciples to feed (John 21:2)
const FISH_COLORS = ['#8fb3c9', '#a3c1ad', '#9aa7c7', '#b7c4cc', '#c2b59b'];

const LEVEL_NAMES = [
  'Dawn on Galilee',
  'The Right Side',
  'Children, Have Ye Any Meat?',
  'Two Hundred Cubits',
  'A Fire of Coals',
  'An Hundred and Fifty and Three',
];

function makeConfig(n) {
  const k = Math.min(n - 1, 5);
  return {
    name: LEVEL_NAMES[n - 1] || `Morning ${n}`,
    casts: [14, 12, 11, 11, 10][n - 1] || 10,            // nets you can cast
    speed: 48 + k * 14,                                   // shoal swimming speed
    gap: Math.max(2.1 - k * 0.17, 1.2),                   // seconds between shoals
    maxShoals: Math.min(3 + Math.floor(n / 2), 5),
    bigMin: [16, 12, 10, 8, 6][n - 1] || 6,
    bigMax: [30, 34, 36, 38, 40][n - 1] || 40,
    exactP: [0.5, 0.35, 0.25, 0.2, 0.15][n - 1] || 0.12,  // chance a shoal is exactly what you need
    fitP: [0.8, 0.7, 0.6, 0.5, 0.45][n - 1] || 0.4,        // chance a small shoal will fit
    zoneHalf: Math.max(62 - k * 6, 38),                   // half width of the net
    turnBoost: 1 + k * 0.12,                              // shoals hurry back after turning at the shore
    dart: n >= 3,                                         // shoals put on sudden spurts
    hints: n <= 2,                                        // gold badge = just right, red = too many
    strokes: 9 + k * 2,                                   // strokes for Peter to reach the shore
    current: k * 0.03,                                    // the lake pushes Peter back
    shipTime: Math.max(9 - k * 0.8, 5),                   // seconds for the boat to come to land
    grill: Math.min(2 + Math.floor(k / 2), 4),            // fish on the fire at once
    cook: 0.2 + k * 0.035,                                // how fast a side cooks
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'fish';       // fish | lord | swim | ashore | dine  (while playing)
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('breakfastBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;                // global clock
let phaseT = 0;           // time since the current phase began
let count = 0;            // fish landed in the boat
let castsLeft = 14;
let shoals = [];
let particles = [];
let arcs = [];            // fish flying between net, boat and sea
let floaters = [];        // "+23" pop-ups
let ripples = [];
let bubbles = [];         // speech bubbles { who, text, t0, t1 }
let net;
let boat = { x: 0 };
let peter;
let dine = null;
let message = { text: '', t: 0 };
let shockT = 0, wowT = 0, joyT = 0, flashT = 0, shakeT = 0, cntPulse = 0;
let endTimer = 0;
let lastScore = null;
let spawnT = 0;
let swim = null;          // swim race info
let exactHits = 0;        // casts that landed exactly what was needed
let hints = {};
let kbdSel = -1;          // fish picked with the keyboard at the fire (-1 = none yet)

function newNet() {
  return { phase: 'idle', t: 0, side: 1, catch: 0, added: 0, bag: 0, jumpTarget: 0, jumpAcc: 0 };
}
function newPeter() { return { mode: 'boat', x: 0, y: 0, vx: 0, t: 0, strokeCd: 0, armT: 0 }; }
net = newNet(); peter = newPeter();

// ============================================================
//  Geometry
// ============================================================
function boatHome() { return clamp(W * 0.2, 104, 330); }
function shoreX() { return W - clamp(W * 0.2, 96, 300); }
function zoneX() { return boatHome() + HULL * BOAT_S + 8 + cfg.zoneHalf; }
function surf(x) { return SEA_Y + 3 * Math.sin(x * 0.028 + t * 1.5) + 2 * Math.sin(x * 0.065 - t * 2.2); }
function boatY() { return SEA_Y + 2 + Math.sin(t * 1.4) * 2.5 + (count / GOAL) * 8; }
function need() { return GOAL - count; }
// The lake bed rises into the beach; right of shoreX it is dry sand
function groundY(x) {
  const sx = shoreX();
  if (x >= sx) return SEA_Y + 3 - Math.min(46, (x - sx) * 0.2);
  const base = H - 48 + Math.sin(x / 70) * 6 + Math.sin(x / 23) * 3;
  const s0 = sx - 150;
  if (x <= s0) return base;
  const f = (x - s0) / 150;
  return lerp(base, SEA_Y + 3, f * f * 0.7 + f * 0.3);   // a steep bank just off the beach
}
// Jesus stands on the shore by his fire
function jesusShoreX() { const sx = shoreX(); return sx + clamp((W - sx) * 0.42, 34, 130); }

// ============================================================
//  Disciples: the seven of John 21:2
// ============================================================
const DISCIPLES = [
  { name: 'Peter',     robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Thomas',    robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Nathanael', robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { name: 'James',     robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',      robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Andrew',    robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'Philip',    robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.4),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
  fed: false,
}));
const byName = (n) => DISCIPLES.find((d) => d.name === n);

function crowdMood(d) {
  if (state === 'title') return 'watch';
  if (state === 'fail') return 'dismay';
  if (phase === 'dine') {
    if (d.fed) return state === 'win' || (dine && dine.done) ? 'joy' : 'eat';
    if (shockT > 0) return 'shock';
    if (dine && dine.order[dine.targeted] === d.i) return 'wow';
    return 'watch';
  }
  if (state === 'win') return 'joy';
  if (phase === 'lord' || phase === 'swim' || phase === 'ashore') return d.name === 'John' ? 'wow' : 'joy';
  if (shockT > 0) return 'shock';
  if (joyT > 0) return 'joy';
  if (wowT > 0) return 'wow';
  if (castsLeft <= 2 && state === 'play') return 'worried';
  return 'watch';
}

function updateDisciples(dt) {
  for (const d of DISCIPLES) {
    let want = crowdMood(d);
    if (d.name === 'Thomas' && want === 'watch') want = 'doubt';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

// slot: { d, x, y, s, lx, ly, wet } — drawn in the current transform
function drawDisciple(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const lx = slot.lx || 0, ly = slot.ly === undefined ? -1 : slot.ly;

  // Arms raised for joy / pointing in wonder
  const arms = !slot.noArms;
  if (mood === 'joy' && arms) {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 2 === 1 && arms) {
    arm(11, -32, 22 + lx * 6, -62);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (!arms) { /* swimming: arms drawn separately */ }
  else if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }   // folded arms
  else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }   // hands clasped
  else if (mood === 'watch' || (mood === 'wow' && d.i % 2 === 0)) { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  else if (mood === 'wow') arm(-11, -32, -15, -12);

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (!arms) { /* swimming */ }
  else if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'eat') {
    // Bread in one hand, a fish in the other, taking turns to munch
    const bite = Math.sin(t * 5 + d.phase) > 0;
    arm(-11, -32, bite ? -6 : -14, bite ? hy + 16 : -22);
    ctx.fillStyle = '#d99a4a';
    ctx.beginPath(); ctx.ellipse(bite ? -8 : -16, bite ? hy + 12 : -26, 7, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f0c27a';
    ctx.beginPath(); ctx.ellipse(bite ? -9 : -17, bite ? hy + 10 : -28, 4, 2, 0, 0, TAU); ctx.fill();
    arm(11, -32, bite ? 14 : 6, bite ? -22 : hy + 16);
    drawCookedFish(bite ? 20 : 12, bite ? -26 : hy + 12, 0.45, '#d9a04a');
  }

  // Dripping wet after a swim
  if (slot.wet) {
    ctx.fillStyle = '#7cc4f2';
    for (let k = 0; k < 3; k++) {
      const f = (t * 1.2 + k / 3) % 1;
      const dx = [-14, 3, 15][k];
      ctx.beginPath(); ctx.arc(dx, -20 + f * 24, 2.2 * (1 - f * 0.5), 0, TAU); ctx.fill();
    }
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy' && mood !== 'eat';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const happyEyes = () => {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  };
  const cheeks = () => {
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      happyEyes();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      cheeks();
      break;
    case 'eat': {
      happyEyes();
      const open = Math.max(0, Math.sin(t * 10 + d.phase));
      mouthFill(() => ctx.ellipse(0, mouthY, 4, 1.2 + open * 3, 0, 0, TAU));
      cheeks();
      break;
    }
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus (the house drawing; no cloud)
//  pose: 'open' | 'call' (hand cupped to call across the water) | 'bless' (giving) | 'up'
// ============================================================
function drawJesus(x, y, s, pose, face) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  if (pose === 'bless' || pose === 'up' || state === 'win') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.5)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms
  let hands = [[-20, -22], [20, -22]];
  if (pose === 'call') hands = [[-13, -48], [20, -22]];
  else if (pose === 'bless') hands = [[-20, -22], [28, -40]];
  else if (pose === 'up') hands = [[-21, -66], [21, -66]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    const lx = pose === 'call' ? -1.2 : 0;
    ctx.beginPath(); ctx.arc(-4 + lx, -53, 1.5, 0, TAU); ctx.arc(4 + lx, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (pose === 'call' && Math.sin(t * 6) > 0) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 2, 2.2, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
//  Shoals of fish
// ============================================================
// How many fish the next shoal holds: big shoals early, then smaller ones as the goal nears
function shoalSize() {
  const R = need();
  if (R <= 0) return randInt(3, 12);
  // don't offer the same number twice at once
  const taken = new Set(shoals.map((s) => s.n));
  for (let tries = 0; tries < 6; tries++) {
    let n;
    if (R <= cfg.bigMax && Math.random() < cfg.exactP && !taken.has(R)) return R;
    if (R > cfg.bigMax + 6 && Math.random() < 0.8) n = randInt(cfg.bigMin, cfg.bigMax);
    else if (Math.random() < cfg.fitP) n = randInt(1, Math.max(1, Math.min(R, cfg.bigMax)));
    else if (R <= cfg.bigMax + 6) n = randInt(Math.max(1, Math.round(R * 0.5)), R + randInt(3, 12));   // may be too many!
    else n = randInt(cfg.bigMin, cfg.bigMax);
    if (!taken.has(n)) return n;
  }
  return randInt(1, 9);
}

function addShoal(x, y, n) {
  const k = clamp(3 + Math.round(n / 4), 2, 11);
  const spread = 16 + Math.min(n, 40) * 1.1;
  const color = FISH_COLORS[randInt(0, FISH_COLORS.length - 1)];
  const fishes = [];
  for (let i = 0; i < k; i++) {
    const a = (i / k) * TAU + rand(-0.3, 0.3), r = i === 0 ? 0 : spread * Math.sqrt(rand(0.25, 1));
    fishes.push({ dx: Math.cos(a) * r, dy: Math.sin(a) * r * 0.5, ph: rand(0, TAU), size: rand(0.75, 0.95), color: Math.random() < 0.7 ? color : FISH_COLORS[randInt(0, 4)] });
  }
  shoals.push({
    x, y, n, fishes, spread,
    vx: cfg.speed * rand(0.85, 1.15), turned: false,
    turnX: Math.min(shoreX() - 50 - rand(0, 50), zoneX() + cfg.zoneHalf + rand(160, 320)),   // turn back at the shore (sooner on wide screens)
    boost: 1, boostT: 0, dartT: rand(1.5, 4), ph: rand(0, TAU),
  });
}

function spawnShoal() {
  // choose a depth away from other shoals near the left edge
  let y = rand(SEA_Y + 80, SEA_Y + 320);
  for (let tries = 0; tries < 6; tries++) {
    if (!shoals.some((s) => s.x < 60 - offX + 140 && Math.abs(s.y - y) < 75)) break;
    y = rand(SEA_Y + 80, SEA_Y + 320);
  }
  addShoal(-offX - 70, y, shoalSize());
}

function updateShoals(dt) {
  for (let i = shoals.length - 1; i >= 0; i--) {
    const s = shoals[i];
    if (cfg.dart) {
      s.dartT -= dt;
      if (s.dartT <= 0) { s.boostT = 0.6; s.dartT = rand(2, 5); }
    }
    s.boostT = Math.max(0, s.boostT - dt);
    const sp = s.boostT > 0 ? 1.9 : 1;
    s.x += s.vx * sp * dt;
    s.y += Math.sin(t * 1.3 + s.ph) * 8 * dt;
    if (!s.turned && s.vx > 0 && s.x >= s.turnX) { s.turned = true; s.vx = -Math.abs(s.vx) * cfg.turnBoost; }
    if (s.vx < 0 && s.x < -offX - 90) shoals.splice(i, 1);
  }
}

function updateSpawns(dt) {
  spawnT -= dt;
  if (spawnT <= 0) {
    if (shoals.length < cfg.maxShoals) spawnShoal();
    spawnT = cfg.gap * rand(0.7, 1.3);
  }
}

function inZone(s) { return Math.abs(s.x - zoneX()) <= cfg.zoneHalf + 6; }

// ============================================================
//  Casting and hauling
// ============================================================
function cast(sd = 1) {
  if (state !== 'play' || phase !== 'fish' || net.phase !== 'idle') return;
  if (sd < 0) {
    // The left side: there is nothing there (a gentle joke; costs no net)
    net = newNet(); net.phase = 'left'; net.side = -1;
    splash(boat.x - HULL * BOAT_S - 30, SEA_Y, 10);
    showMessage('Nothing on the left side!');
    bubbles.push({ who: 'jesus', text: VERSES.castRight, t0: phaseT + 0.4, t1: phaseT + 3.2 });
    sfx.cast();
    return;
  }
  net = newNet(); net.phase = 'drop';
  castsLeft--;
  hints.cast = true;
  splash(zoneX(), SEA_Y, 14);
  sfx.cast();
}

function haulDur() { return 0.75 + Math.min(net.catch, 40) * 0.02; }

function landNet() {
  const zx = zoneX();
  const caught = shoals.filter(inZone);
  shoals = shoals.filter((s) => !inZone(s));
  net.catch = caught.reduce((a, s) => a + s.n, 0);
  net.bag = Math.min(net.catch, 24);
  net.phase = 'haul'; net.t = 0;
  const R = need();
  if (net.catch === 0) {
    showMessage(caught.length ? '' : 'An empty net… watch the shoals!');
    sfx.bounce();
  } else {
    wowT = 1.4;
    floaters.push({ text: `+${net.catch}`, x: zx, y: SEA_Y - 20, t: 1.4 });
    if (net.catch === R) { showMessage('Just right!'); exactHits++; }
    else if (caught.length >= 2) showMessage(`Two shoals at once! ${net.catch} fish`);
    else if (net.catch > R) showMessage('Heavy net… that may be too many!');
    sfx.haul();
  }
}

function finishHaul() {
  if (count > GOAL) {
    const e = count - GOAL;
    net.jumpTarget = Math.max(0, GOAL - e);
    net.phase = 'jump'; net.jumpAcc = 0;
    showMessage(`Too many! ${count - net.jumpTarget} fish leapt out!`);
    floaters.push({ text: `−${count - net.jumpTarget}`, x: boat.x, y: SEA_Y - 90, t: 1.6 });
    shockT = 1.4; shakeT = 0.25;
    sfx.oops();
  } else {
    net.phase = 'idle';
    afterHaul();
  }
}

function afterHaul() {
  if (count === GOAL) { startLord(); return; }
  if (castsLeft <= 0) { fail(); return; }
  if (need() <= 12 && !hints.close) { hints.close = true; if (level <= 2) showMessage(`Only ${need()} more — pick a small shoal!`); }
}

function updateNet(dt) {
  const n = net;
  n.t += dt;
  if (n.phase === 'left' && n.t > 1.1) n.phase = 'idle';
  else if (n.phase === 'drop' && n.t >= DROP_T) landNet();
  else if (n.phase === 'haul') {
    const dur = haulDur();
    const f = clamp((n.t - dur * 0.35) / (dur * 0.6), 0, 1);
    const want = Math.round(n.catch * f);
    while (n.added < want) {
      n.added++; count++; cntPulse = 0.2;
      if (n.added % 2 === 1 || n.catch < 12) sfx.tick(count);
      if (n.added <= 14) arcs.push({ x0: zoneX() + rand(-20, 20), y0: SEA_Y - 4, x1: boat.x + rand(-60, 60), y1: boatY() - 30, t: 0, d: 0.5, color: FISH_COLORS[n.added % 5] });
    }
    if (n.t >= dur) finishHaul();
  } else if (n.phase === 'jump') {
    n.jumpAcc += dt;
    while (n.jumpAcc >= 0.045 && count > n.jumpTarget) {
      n.jumpAcc -= 0.045; count--; cntPulse = 0.2;
      const x0 = boat.x + rand(-50, 70);
      arcs.push({ x0, y0: boatY() - 30, x1: x0 + rand(60, 160) * (Math.random() < 0.7 ? 1 : -1), y1: SEA_Y + 6, t: 0, d: 0.55, color: FISH_COLORS[count % 5], leap: true });
      if (count % 3 === 0) sfx.leap();
    }
    if (count <= n.jumpTarget) { n.phase = 'idle'; afterHaul(); }
  }
}

// ============================================================
//  "It is the Lord" — Peter jumps in and swims to shore
// ============================================================
function peterBoatPos() { return { x: boat.x + 62 * BOAT_S, y: boatY() - 6 * BOAT_S }; }

function startLord() {
  phase = 'lord'; phaseT = 0;
  joyT = 0; wowT = 0;
  showMessage(`${GOAL}! The net holds!`);
  bubbles = [{ who: 'john', text: VERSES.theLord, t0: 0.5, t1: 2.8 }];
  flashT = 0.3;
  sfx.chime();
  for (let i = 0; i < 30; i++) spawn(boat.x + rand(-80, 80), boatY() - rand(20, 80), rand(-40, 40), rand(-90, -20), rand(0.6, 1.4), ['#ffe27a', '#fff6d0'][i % 2], rand(2, 4));
}

function updateLord(dt) {
  if (peter.mode === 'boat' && phaseT >= 2.7) {
    peter.mode = 'jump'; peter.t = 0;
    const p = peterBoatPos();
    peter.x0 = p.x; peter.y0 = p.y;
    peter.x = p.x; peter.y = p.y;
    showMessage('Peter jumps into the sea!');
    sfx.whoosh();
  }
  if (peter.mode === 'jump') {
    peter.t += dt;
    const f = clamp(peter.t / 0.65, 0, 1);
    const x1 = boat.x + HULL * BOAT_S + 26;
    peter.x = lerp(peter.x0, x1, f);
    peter.y = lerp(peter.y0, SEA_Y + 6, f) - Math.sin(f * Math.PI) * 90;
    if (f >= 1) {
      splash(peter.x, SEA_Y, 26); sfx.splash(); shakeT = 0.15;
      startSwim();
    }
  }
}

function startSwim() {
  phase = 'swim'; phaseT = 0;
  bubbles = [];
  peter.mode = 'swim'; peter.vx = 0; peter.y = SEA_Y + 6;
  const dist = shoreX() + 6 - peter.x;
  const goalX = shoreX() - HULL * BOAT_S - 16;
  swim = {
    x0: peter.x, dist,
    imp: (dist * 2.2) / cfg.strokes,          // drag 2.2/s: each stroke glides imp / 2.2
    current: dist * cfg.current,
    goalX, speed: Math.max(10, (goalX - boat.x) / cfg.shipTime),
    shipIn: false, beat: false, time: 0, strokes: 0,
  };
  showMessage(isTouch() ? 'Tap, tap, tap to swim to Jesus!' : 'Tap Space to swim to Jesus!');
}

function stroke() {
  if (state !== 'play' || phase !== 'swim' || peter.strokeCd > 0) return;
  peter.vx = Math.min(peter.vx + swim.imp, swim.imp * 2.4);
  peter.strokeCd = 0.08; peter.armT = 0.3;
  swim.strokes++;
  splash(peter.x - 10, SEA_Y, 6);
  sfx.stroke();
}

function updateSwim(dt) {
  swim.time += dt;
  peter.strokeCd = Math.max(0, peter.strokeCd - dt);
  peter.armT = Math.max(0, peter.armT - dt);
  peter.vx *= Math.exp(-2.2 * dt);
  peter.x = Math.max(swim.x0, peter.x + (peter.vx - swim.current) * dt);
  if (!swim.shipIn) {
    boat.x = Math.min(swim.goalX, boat.x + swim.speed * dt);
    if (boat.x >= swim.goalX) { swim.shipIn = true; showMessage('The little ship is in! Keep swimming!'); }
  }
  if (Math.random() < dt * 8) spawn(boat.x - HULL * BOAT_S, SEA_Y + 2, rand(-50, -20), rand(-30, -5), 0.5, 'rgba(255,255,255,0.9)', rand(2, 3.5), 150);
  if (peter.x >= shoreX() + 4) {
    swim.beat = !swim.shipIn;
    swim.bonus = (swim.beat ? 400 : 150) + Math.max(0, Math.round((cfg.shipTime * 1.6 - swim.time) * 30));
    showMessage(swim.beat ? 'Peter beat the boat to the shore!' : 'Ashore at last!');
    floaters.push({ text: `+${swim.bonus}`, x: peter.x, y: SEA_Y - 70, t: 1.4 });
    peter.mode = 'walk';
    phase = 'ashore'; phaseT = 0;
    joyT = 1.5;
    sfx.perfect();
  }
}

function updateAshore(dt) {
  peter.x = Math.min(peter.x + 45 * dt, jesusShoreX() - 26);
  peter.y = groundY(peter.x);
  if (!swim.shipIn) boat.x = Math.min(swim.goalX, boat.x + swim.speed * dt);
  if (phaseT >= 2.1) startDine();
}

// ============================================================
//  Breakfast by the fire
// ============================================================
// Where things sit in the breakfast scene
function fireX() { return W / 2; }
const FIRE_Y = 712;
function slotSpacing() { return Math.min(112, (W - 110) / cfg.grill); }
function slotX(i) { return fireX() + (i - (cfg.grill - 1) / 2) * slotSpacing(); }
function dineSeats() {
  const k = Math.min(1.4, (W / 2 - 34) / 240);
  const back = [-240, -160, -84, 84, 160, 240].map((dx) => fireX() + dx * k);
  // Peter sits in front, still dripping; the rest along the back
  return [
    { d: byName('Philip'), x: back[0], y: 628, s: 1.02 },
    { d: byName('Nathanael'), x: back[1], y: 632, s: 1.04 },
    { d: byName('Thomas'), x: back[2], y: 636, s: 1.06 },
    { d: byName('John'), x: back[3], y: 636, s: 1.06 },
    { d: byName('James'), x: back[4], y: 632, s: 1.04 },
    { d: byName('Andrew'), x: back[5], y: 628, s: 1.02 },
    { d: byName('Peter'), x: Math.max(44, fireX() - 200 * k - 30), y: 852, s: 1.14, wet: true },
  ];
}

function newFishSlot(wait) {
  return { cook: [0, 0], down: 0, state: 'cook', t: 0, flip: 0, wait, rate: cfg.cook * rand(0.88, 1.12), hop: 0 };
}

function startDine() {
  phase = 'dine'; phaseT = 0;
  for (const d of DISCIPLES) { d.fed = false; d.mood = 'watch'; }
  kbdSel = -1;
  dine = {
    slots: Array.from({ length: cfg.grill }, (_, i) => newFishSlot(0.7 + i * 0.9)),
    order: ['Thomas', 'John', 'Nathanael', 'James', 'Philip', 'Andrew', 'Peter'].map((n) => byName(n).i),
    targeted: 0, served: 0, flying: [], burnt: 0, perfect: 0, crispy: 0, pts: 0,
    done: false, doneT: 0, giveT: 0, msgCd: 0, readyHint: false,
  };
  particles = []; arcs = []; floaters = [];
  message = { text: VERSES.fire, t: 4.6 };
  bubbles = [
    { who: 'jesus', text: VERSES.bring, t0: 1.2, t1: 4.0 },
    { who: 'jesus', text: VERSES.dine, t0: 4.0, t1: 6.6 },
  ];
  sfx.levelStart();
}

// Fish that still need to be laid on the fire (not yet cooking, flying or eaten)
function fishStillNeeded() {
  const active = dine.slots.filter((s) => s.state === 'cook').length;
  return MOUTHS - dine.targeted - active;
}

function tapFish(i) {
  if (state !== 'play' || phase !== 'dine' || dine.done) return;
  const s = dine.slots[i];
  if (!s || s.state !== 'cook' || s.wait > 0) return;
  const up = 1 - s.down;
  const cb = s.cook[s.down], ct = s.cook[up];
  if (cb >= DONE && ct >= DONE) { serveFish(i); return; }
  if (cb < FLIP_MIN) {
    s.hop = 0.25;
    if (dine.msgCd <= 0) { showMessage('Not yet — let it cook!'); dine.msgCd = 1.5; }
    sfx.bounce();
    return;
  }
  // Turn the fish over
  s.down = up; s.flip = FLIP_T;
  const x = slotX(i);
  if (cb >= DONE && cb <= PERF) { dine.perfect++; dine.pts += 50; floaters.push({ text: 'Perfect!', x, y: FIRE_Y - 70, t: 1 }); }
  else if (cb > PERF) { dine.crispy++; dine.pts += 20; floaters.push({ text: 'Crispy', x, y: FIRE_Y - 70, t: 1 }); }
  else floaters.push({ text: 'A little pale…', x, y: FIRE_Y - 70, t: 1 });
  for (let k = 0; k < 8; k++) spawn(x + rand(-30, 30), FIRE_Y, rand(-20, 20), rand(-90, -40), 0.6, Math.random() < 0.5 ? '#ffb347' : '#ffe27a', rand(1.5, 3), 60);
  sfx.flip();
}

function serveFish(i) {
  const s = dine.slots[i];
  const cb = s.cook[s.down];
  const x = slotX(i);
  if (cb <= PERF) { dine.perfect++; dine.pts += 50; } else { dine.crispy++; dine.pts += 20; }
  dine.pts += 100;
  const seats = dineSeats();
  const who = dine.order[dine.targeted++];
  const seat = seats.find((st) => st.d.i === who);
  dine.flying.push({ x0: x, y0: FIRE_Y - 10, x1: seat.x, y1: seat.y - 30 * seat.s, t: 0, d: 0.6, who });
  floaters.push({ text: '+' + (cb <= PERF ? 150 : 120), x, y: FIRE_Y - 70, t: 1 });
  dine.giveT = 0.7;
  // lay another fish on the fire if someone still needs one
  dine.slots[i] = { ...newFishSlot(0.5), state: 'empty' };
  if (fishStillNeeded() > 0) dine.slots[i] = newFishSlot(0.5);
  sfx.serve(dine.targeted);
}

function burnFish(s, i) {
  s.state = 'burnt'; s.t = 0;
  dine.burnt++;
  shockT = 1.1;
  showMessage('Oh! Burnt — bring another fish.');
  for (let k = 0; k < 16; k++) spawn(slotX(i) + rand(-25, 25), FIRE_Y - 10, rand(-15, 15), rand(-70, -30), rand(1, 1.8), 'rgba(90,80,80,0.5)', rand(5, 10));
  sfx.burnt();
}

function updateDine(dt) {
  dine.msgCd = Math.max(0, dine.msgCd - dt);
  dine.giveT = Math.max(0, dine.giveT - dt);
  dine.slots.forEach((s, i) => {
    s.flip = Math.max(0, s.flip - dt);
    s.hop = Math.max(0, s.hop - dt);
    if (s.state === 'empty') return;
    if (s.wait > 0) { s.wait -= dt; return; }
    if (s.state === 'cook') {
      s.cook[s.down] += s.rate * dt;
      if (s.cook[s.down] >= BURN) burnFish(s, i);
      else if (s.cook[s.down] > PERF && Math.random() < dt * 10) spawn(slotX(i) + rand(-20, 20), FIRE_Y - 6, rand(-8, 8), rand(-50, -25), 1, 'rgba(120,110,110,0.35)', rand(3, 6));
      if (!dine.turnHint && s.cook[s.down] >= DONE && s.cook[1 - s.down] < DONE && level === 1) { dine.turnHint = true; showMessage(isTouch() ? 'Golden underneath — tap the fish to turn it!' : 'Golden underneath — press its number to turn it!', 3); }
      if (!dine.readyHint && s.cook[0] >= DONE && s.cook[1] >= DONE && level === 1) { dine.readyHint = true; showMessage(isTouch() ? 'Golden both sides — tap to share it!' : 'Golden both sides — share it!'); }
    } else if (s.state === 'burnt') {
      s.t += dt;
      if (s.t > 1.1) dine.slots[i] = fishStillNeeded() > 0 ? newFishSlot(0.4) : { ...newFishSlot(0), state: 'empty' };
    }
  });
  for (let k = dine.flying.length - 1; k >= 0; k--) {
    const f = dine.flying[k];
    f.t += dt;
    if (f.t >= f.d) {
      dine.flying.splice(k, 1);
      DISCIPLES[f.who].fed = true;
      dine.served++;
      for (let q = 0; q < 10; q++) spawn(f.x1 + rand(-14, 14), f.y1 + rand(-10, 10), rand(-40, 40), rand(-60, -10), 0.8, ['#ffe27a', '#fff6d0', '#ffd1e8'][q % 3], rand(2, 3.5), 40);
      if (dine.served >= MOUTHS && !dine.done) {
        dine.done = true; dine.doneT = 0;
        message = { text: VERSES.served, t: 4.2 };
        sfx.chime();
      }
    }
  }
  if (dine.done) {
    dine.doneT += dt;
    if (dine.doneT >= 1.4) win();
  }
  if (Math.random() < dt * 3) sfx.crackle();
}

// ============================================================
//  Particles, splashes, arcs
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function splash(x, y, n = 12) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-16, 16), y, rand(-70, 70), rand(-190, -60), rand(0.4, 0.8), Math.random() < 0.5 ? '#ffffff' : '#bfe6ff', rand(2, 4.5), 420);
  }
}

function updateArcs(dt) {
  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.t += dt;
    if (a.t >= a.d) {
      if (a.leap) splash(a.x1, SEA_Y, 4);
      arcs.splice(i, 1);
    }
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  if (state !== 'play') return;
  state = 'win';
  const catchPts = GOAL * 10;
  const netBonus = castsLeft * 150 + exactHits * 50;
  const swimBonus = swim ? swim.bonus : 0;
  const cookPts = dine ? dine.pts : 0;
  const levelBonus = level * 500;
  const score = catchPts + netBonus + swimBonus + cookPts + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('breakfastBest', best); } catch (e) {} }
  lastScore = { catchPts, netBonus, nets: castsLeft, swimBonus, beat: swim && swim.beat, cookPts, perfect: dine ? dine.perfect : 0, burnt: dine ? dine.burnt : 0, levelBonus, score };
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(fireX(), 440, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8), ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 2.2;
}

function fail() {
  if (state !== 'play') return;
  state = 'fail';
  showMessage('The nets are all spent…');
  sfx.fail();
  endTimer = 1.8;
}

function showMessage(text, dur = 2.2) { message = { text, t: text ? dur : 0 }; }
function isTouch() { return matchMedia('(pointer: coarse)').matches; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {

function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function resetScene() {
  shoals = []; particles = []; arcs = []; floaters = []; ripples = []; bubbles = [];
  net = newNet(); peter = newPeter(); dine = null; swim = null;
  boat.x = boatHome();
  count = 0; castsLeft = cfg.casts; exactHits = 0;
  phase = 'fish'; phaseT = 0;
  shockT = wowT = joyT = flashT = shakeT = cntPulse = 0;
  for (const d of DISCIPLES) { d.fed = false; d.mood = 'watch'; }
  spawnT = 1.2;
  // a shoal already swimming so the lake looks alive
  addShoal(boatHome() - 40, SEA_Y + 200, shoalSize());
}

function titleScreen() {
  state = 'title';
  cfg = makeConfig(1);
  resetScene();
  showOverlay('Breakfast on the Beach', 'Cast on the right side — catch exactly 153!',
    `${verseHTML(VERSES.castRight)}
     <ul>
       <li>Dawn on Galilee. The disciples have fished all night and caught nothing. Someone on the shore calls out&hellip;</li>
       <li>Cast the net on the <b>right side</b> as a shoal swims through. Each shoal shows <b>how many fish</b> it holds.</li>

function startLevel() {

  state = 'play';

  bubbles = level === 1 ? [
    { who: 'jesus', text: VERSES.anyMeat, t0: 0.4, t1: 3.2 },

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Come and Dine!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(VERSES.netWhole)}
       <p class="score">Exactly 153 fish: <b>${s.catchPts}</b><br>Nets to spare (${s.nets}): <b>${s.netBonus}</b><br>Peter's swim${s.beat ? ' (beat the boat!)' : ''}: <b>${s.swimBonus}</b><br>Breakfast (${s.perfect} perfect turns${s.burnt ? `, ${s.burnt} burnt` : ''}): <b>${s.cookPts}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
function act() {
  if (phase === 'fish') cast(1);
  else if (phase === 'swim') stroke();
  else if (phase === 'dine') {
    if (kbdSel < 0) kbdSel = 0;
    tapFish(kbdSel);
  }
}
function moveSel(d) {
  if (phase !== 'dine' || state !== 'play') return;
  kbdSel = kbdSel < 0 ? 0 : (kbdSel + d + cfg.grill) % cfg.grill;
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (e.repeat || state !== 'play') return;
  if (e.code === 'Space' || e.code === 'Enter') act();
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { if (phase === 'dine') moveSel(1); else if (phase === 'swim') stroke(); else cast(1); }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { if (phase === 'dine') moveSel(-1); else cast(-1); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') { if (phase === 'swim') stroke(); }
  else if (/^Digit[1-4]$/.test(e.code) && phase === 'dine') { kbdSel = +e.code.slice(5) - 1; tapFish(kbdSel); }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  if (phase === 'fish') cast(p.x < boat.x ? -1 : 1);
  else if (phase === 'swim') stroke();
  else if (phase === 'dine') {
    // the nearest fish on the fire, if the tap is close enough
    const sp = slotSpacing();
    let bestI = -1, bestD = 1e9;
    for (let i = 0; i < cfg.grill; i++) {
      const dx = Math.abs(p.x - slotX(i)), dy = Math.abs(p.y - (FIRE_Y - 8));
      if (dx < sp * 0.55 && dy < 75 && dx < bestD) { bestD = dx; bestI = i; }
    }
    if (bestI >= 0) { kbdSel = -1; tapFish(bestI); }
  }
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
