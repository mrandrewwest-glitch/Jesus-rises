}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Little extra sounds for the lake and the fire, built from the same tone()/noise helpers
Object.assign(sfx, {
  noiseBurst(freq, type, vol, dur, q = 0.8) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  cast() { this.noiseBurst(700, 'lowpass', 0.5, 0.35); this.tone(320, 0.2, 'sine', 0.12, 0, 130); },
  tick(k) { this.tone(520 + (k % 12) * 38, 0.08, 'triangle', 0.11); },
  haul() { if (!this.ctx) return; this.puff(0.2); playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.02, 0.4); },
  oops() { this.tone(300, 0.25, 'sine', 0.2, 0, 150); this.tone(240, 0.3, 'sine', 0.16, 0.18, 120); },
  leap() { this.noiseBurst(1800, 'bandpass', 0.18, 0.12); this.tone(700, 0.1, 'sine', 0.06, 0, 1100); },
  whoosh() { this.noiseBurst(500, 'bandpass', 0.35, 0.5, 0.5); },
  splash() { this.noiseBurst(600, 'lowpass', 0.8, 0.6); this.thunder(); },
  stroke() { this.noiseBurst(900 + Math.random() * 300, 'lowpass', 0.35, 0.18); },
  flip() { this.tone(480, 0.12, 'triangle', 0.14, 0, 720); this.noiseBurst(3500, 'highpass', 0.12, 0.25); },
  serve(k) { if (!this.ctx) return; playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.02, clamp(k / MOUTHS, 0, 1)); },
  burnt() { this.tone(180, 0.35, 'square', 0.06, 0, 90); this.noiseBurst(2500, 'highpass', 0.2, 0.5); },
  crackle() { this.noiseBurst(2500 + Math.random() * 2000, 'highpass', 0.05, 0.04); },
  chime() { this.tone(1046, 0.3, 'sine', 0.13); this.tone(1318, 0.4, 'sine', 0.11, 0.12); this.tone(1568, 0.5, 'sine', 0.1, 0.24); },
  perfect() {
    if (!this.ctx) return;
    [0.45, 0.7, 1].forEach((h, i) => playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.05 + i * 0.16, h));
  },
});

// ============================================================
//  Rendering: sky, lake and shore
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(60, 250), w: rand(90, 170), speed: rand(6, 14) }));
const gulls = Array.from({ length: 3 }, () => ({ f: Math.random(), y: rand(120, 260), speed: rand(18, 30), phase: rand(0, TAU) }));

function updateScenery(dt) {
  for (const c of bgClouds) { c.f += (c.speed * dt) / (viewW + 300); if (c.f > 1) c.f -= 1; }
  for (const g of gulls) { g.f += (g.speed * dt) / (viewW + 200); if (g.f > 1) { g.f -= 1; g.y = rand(100, 260); } }
}

// 0 at first light, 1 in the full morning (the sky brightens as the catch grows)
function dayP() {
  if (state === 'title') return 0.05;
  if (phase === 'dine') return 1;
  if (phase !== 'fish') return 0.85;
  return clamp(count / GOAL, 0, 1) * 0.8;
}

function drawSky() {
  const p = dayP();
  const g = ctx.createLinearGradient(0, -offY, 0, SEA_Y);
  g.addColorStop(0, mix('#e98f7a', '#79bdea', p));
  g.addColorStop(0.55, mix('#ffbf8f', '#b3dcf4', p));
  g.addColorStop(1, mix('#ffe2a8', '#eaf6fb', p));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, SEA_Y + offY + 10);

  // The sun rising over the hills behind the shore
  const sx = W * 0.72, sy = lerp(SEA_Y - 50, 130, p);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 150);
  sg.addColorStop(0, `rgba(255,240,180,${0.8 - p * 0.3})`);
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 150, 0, TAU); ctx.fill();
  ctx.fillStyle = mix('#ff9f4a', '#fff3b0', p);
  ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();

  for (const c of bgClouds) {
    drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', mix('#f6d3c4', '#dbe9f5', p));
  }
  ctx.strokeStyle = 'rgba(70,60,60,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const gl of gulls) {
    const x = -offX - 100 + gl.f * (viewW + 200), y = gl.y + Math.sin(t + gl.phase) * 6;
    const flap = Math.sin(t * 6 + gl.phase) * 4;
    ctx.beginPath();
    ctx.moveTo(x - 10, y - flap); ctx.quadraticCurveTo(x - 5, y - 6 - flap, x, y);
    ctx.quadraticCurveTo(x + 5, y - 6 - flap, x + 10, y - flap);
    ctx.stroke();
  }
}

// Far hills around the lake, catching the dawn
function drawHills(baseY) {
  const p = dayP();
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  ctx.fillStyle = mix('#b88fa6', '#98b9a0', p);
  ctx.beginPath(); ctx.moveTo(x0, baseY);
  for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, baseY - 64 + Math.sin(x / 150) * 22 + Math.sin(x / 53) * 7);
  ctx.lineTo(x1, baseY); ctx.fill();
  ctx.fillStyle = mix('#a2967a', '#86ad69', p);
  ctx.beginPath(); ctx.moveTo(x0, baseY);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, baseY - 28 + Math.sin(x / 95 + 1) * 8);
  ctx.lineTo(x1, baseY); ctx.fill();
}

// The underwater cut-away: water, light rays, then the lake bed rising into the beach
function drawWater() {
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  const sx = shoreX();
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(x0, H + 10);
    for (let x = x0; x <= sx + 30; x += 8) ctx.lineTo(x, surf(x));
    ctx.lineTo(sx + 30, H + 10);
    ctx.closePath();
  };
  path();
  const g = ctx.createLinearGradient(0, SEA_Y - 6, 0, H);
  g.addColorStop(0, 'rgba(110,190,225,0.55)');
  g.addColorStop(0.06, 'rgba(52,138,188,0.95)');
  g.addColorStop(0.5, '#1f6b9c');
  g.addColorStop(1, '#0f3a60');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  path(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,220,0.06)';
  for (let i = 0; i < 6; i++) {
    const x = x0 + (sx - x0) * (i + 0.5) / 6 + Math.sin(t * 0.3 + i * 1.7) * 30;
    ctx.beginPath();
    ctx.moveTo(x - 18, SEA_Y); ctx.lineTo(x + 26, SEA_Y); ctx.lineTo(x + 130, H); ctx.lineTo(x + 30, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Lake bed and beach in one piece
  const bg = ctx.createLinearGradient(0, SEA_Y - 40, 0, H);
  bg.addColorStop(0, '#e9cf96'); bg.addColorStop(0.35, '#c9aa6c'); bg.addColorStop(1, '#7d6440');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, groundY(x));
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  // Shadowed underwater part of the sand, fading out toward the water's edge
  const tint = ctx.createLinearGradient(sx - 90, 0, sx, 0);
  tint.addColorStop(0, 'rgba(20,70,110,0.32)'); tint.addColorStop(1, 'rgba(20,70,110,0)');
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, SEA_Y, sx - x0, H); ctx.clip();
  ctx.fillStyle = tint;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, groundY(x));
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Pebbles and swaying weeds on the lake bed
  for (let i = 0; i < 24; i++) {
    const x = x0 + hsh(i, 1) * (sx - 150 - x0);
    ctx.fillStyle = ['#8c7a5e', '#7a6a54', '#9c8c70'][i % 3];
    ctx.beginPath(); ctx.ellipse(x, groundY(x) + 10 + hsh(i, 2) * 20, 5 + hsh(i, 3) * 5, 3 + hsh(i, 4) * 3, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#3f7f4a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 10; i++) {
    const x = x0 + hsh(i, 7) * (sx - 200 - x0), y = groundY(x) + 4, h = 30 + hsh(i, 8) * 40;
    const sw = Math.sin(t * 1.4 + i) * 8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 8 + sw * 0.5, y - h * 0.5, x + sw, y - h); ctx.stroke();
  }
  // Pebbles and a shell on the dry beach
  for (let i = 0; i < 8; i++) {
    const x = sx + 20 + hsh(i, 21) * (x1 - sx - 20);
    ctx.fillStyle = i % 3 ? '#b59a6a' : '#f3e3c8';
    ctx.beginPath(); ctx.ellipse(x, groundY(x) + 14 + hsh(i, 22) * 40, 4 + hsh(i, 23) * 3, 2.5, 0, 0, TAU); ctx.fill();
  }
}

function drawSurfaceLine() {
  const x0 = -offX - 10, sx = shoreX();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = x0; x <= sx; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, surf(x));
  ctx.stroke();
  // lapping foam at the water's edge
  const f = Math.sin(t * 1.8) * 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx - 26 + f, SEA_Y + 3); ctx.quadraticCurveTo(sx - 8 + f, SEA_Y - 2, sx + 8 + f, SEA_Y + 2); ctx.stroke();
}

// A small fire of coals: stones, glowing embers, flickering flames, smoke
function drawCoals(x, y, w, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const glow = ctx.createRadialGradient(0, -6, 4, 0, -6, w * 0.9);
  glow.addColorStop(0, 'rgba(255,170,70,0.55)'); glow.addColorStop(1, 'rgba(255,170,70,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, -6, w * 0.9, 0, TAU); ctx.fill();
  // embers
  ctx.fillStyle = '#5a2a18';
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.46, w * 0.12, 0, 0, TAU); ctx.fill();
  const n = Math.max(5, Math.round(w / 9));
  for (let i = 0; i < n; i++) {
    const cx = (hsh(i, 31) - 0.5) * w * 0.8, cy = (hsh(i, 32) - 0.5) * w * 0.14;
    const heat = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.7);
    ctx.fillStyle = mix('#c2401c', '#ffcf5a', heat);
    ctx.beginPath(); ctx.ellipse(cx, cy, w * 0.07, w * 0.04, 0, 0, TAU); ctx.fill();
  }
  // flames
  for (let i = 0; i < 3; i++) {
    const fx = (i - 1) * w * 0.2, fh = w * (0.32 + 0.1 * Math.sin(t * 9 + i * 2));
    ctx.fillStyle = i === 1 ? 'rgba(255,200,80,0.9)' : 'rgba(255,140,50,0.85)';
    ctx.beginPath();
    ctx.moveTo(fx - w * 0.08, -2);
    ctx.quadraticCurveTo(fx - w * 0.06, -fh * 0.6, fx + Math.sin(t * 7 + i) * 3, -fh);
    ctx.quadraticCurveTo(fx + w * 0.06, -fh * 0.6, fx + w * 0.08, -2);
    ctx.fill();
  }
  // ring of stones
  ctx.fillStyle = '#8a8378';
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * (0.02 + i * 0.16);
    ctx.beginPath(); ctx.ellipse(Math.cos(a) * w * 0.5, Math.sin(a) * w * 0.14 + 2, w * 0.09, w * 0.06, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // a wisp of smoke
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k <= 12; k++) {
    const yy = y - 20 * s - k * 7 * s;
    const xx = x + Math.sin(t * 1.5 + k * 0.6) * 5 * s + k * 1.5 * s;
    (k ? ctx.lineTo : ctx.moveTo).call(ctx, xx, yy);
  }
  ctx.stroke();
}

function bubbleActive(who) {
  return bubbles.some((b) => b.who === who && phaseT >= b.t0 && phaseT <= b.t1);
}

// Jesus waiting on the shore beside His fire
function drawShore() {
  const jx = jesusShoreX();
  const fx = Math.min(jx + 34, W - 16);
  drawCoals(fx, groundY(fx) + 6, 30, 1);
  // a little loaf and fish laid on it
  drawCookedFish(fx - 2, groundY(fx) - 2, 0.35, '#d9a04a');
  const pose = bubbleActive('jesus') ? 'call' : state === 'win' ? 'up' : 'open';
  drawJesus(jx, groundY(jx) + 4, 0.92, pose, phase === 'lord' || phase === 'ashore' ? 'joy' : 'calm');
}

function lookAt(lxw, lyw, px, py) {
  const dx = lxw - px, dy = lyw - py;
  const len = Math.hypot(dx, dy) || 1;
  return [dx / len, dy / len];
}

// Fish lying in the boat, peeking over the rail
function drawPile(x0, x1, load, y) {
  const n = Math.round(clamp(load, 0, 1) * 16);
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, hsh(i, 9));
    const row = Math.floor(i / 8);
    ctx.save();
    ctx.translate(x, y - 3 - row * 6);
    ctx.rotate((hsh(i, 3) - 0.5) * 0.8);
    ctx.fillStyle = FISH_COLORS[i % FISH_COLORS.length];
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-16, -5); ctx.lineTo(-16, 5); ctx.fill();
    ctx.restore();
  }
}

function drawBoat() {
  const bx = boat.x, by = boatY();
  ctx.save();
  ctx.translate(bx, by);
  ctx.scale(BOAT_S, BOAT_S);
  ctx.rotate(Math.sin(t * 1.1) * 0.015);

  // Mast with the sail furled on its yard
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-112, -20); ctx.lineTo(-112, -205); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-166, -180); ctx.lineTo(-54, -190); ctx.stroke();
  ctx.fillStyle = '#e9dfc4';
  ctx.save(); ctx.translate(-110, -185); ctx.rotate(-0.087);
  roundRect(-54, -2, 108, 11, 5.5); ctx.fill();
  ctx.restore();

  drawPile(-110, 110, count / GOAL, -36);

  // The disciples: they watch the net, or the Man on the shore
  const jx = (jesusShoreX() - bx) / BOAT_S, jy = (groundY(jesusShoreX()) - 60 - by) / BOAT_S;
  const zx = (zoneX() - bx) / BOAT_S, zy = (NET_TOP + 120 - by) / BOAT_S;
  const lookShore = phase !== 'fish' || bubbleActive('jesus') || state === 'title';
  const crew = [['James', -78], ['Thomas', -30], ['John', 18]];
  if (peter.mode === 'boat') crew.push(['Peter', 64]);
  for (const [name, x] of crew) {
    const [lx, ly] = lookShore ? lookAt(jx, jy, x, -60) : lookAt(zx, zy, x, -60);
    drawDisciple({ d: byName(name), x, y: -6, s: 1.08, lx, ly });
  }

  // Hull
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.moveTo(-140, -40);
  ctx.quadraticCurveTo(0, -30, 142, -46);
  ctx.quadraticCurveTo(130, 10, 80, 22);
  ctx.lineTo(-94, 22);
  ctx.quadraticCurveTo(-138, 12, -140, -40);
  ctx.closePath();
  ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 3;
  for (const y of [-20, -6, 8]) { ctx.beginPath(); ctx.moveTo(-150, y); ctx.lineTo(150, y - 3); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-141, -40); ctx.quadraticCurveTo(0, -30, 143, -46); ctx.stroke();
  ctx.fillStyle = '#f3e6c4'; ctx.beginPath(); ctx.ellipse(112, -24, 7, 4.5, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(113, -24, 2.3, 0, TAU); ctx.fill();

  // Net coiled on the right-hand rail, ready to cast
  if (phase === 'fish' && net.phase === 'idle') {
    const nx = 108, ny = -46;
    ctx.fillStyle = 'rgba(214,196,150,0.95)';
    ctx.beginPath(); ctx.ellipse(nx, ny, 22, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a58f5c'; ctx.lineWidth = 1.2;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(nx + k * 8 - 4, ny - 8); ctx.lineTo(nx + k * 8 + 4, ny + 8); ctx.stroke(); }
    ctx.fillStyle = '#e0913a';
    ctx.beginPath(); ctx.arc(nx - 14, ny - 5, 3.5, 0, TAU); ctx.arc(nx + 12, ny - 6, 3.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// The net's reach on the right side of the ship
function drawZone() {
  if (phase !== 'fish' || (state !== 'play' && state !== 'title' && state !== 'pause')) return;
  const zx = zoneX(), hw = cfg.zoneHalf;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  const ready = net.phase === 'idle';
  ctx.fillStyle = `rgba(255,220,120,${ready ? 0.07 + pulse * 0.05 : 0.04})`;
  roundRect(zx - hw, NET_TOP, hw * 2, NET_BOTTOM - NET_TOP, 16); ctx.fill();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = ready ? 'rgba(255,225,140,0.55)' : 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
  const gl = ctx.createRadialGradient(zx, SEA_Y, 4, zx, SEA_Y, hw + 30);
  gl.addColorStop(0, `rgba(255,236,150,${0.35 + pulse * 0.25})`);
  gl.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.ellipse(zx, SEA_Y, hw + 30, 20, 0, 0, TAU); ctx.fill();
  if (ready && level <= 2 && count === 0) {
    ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,60,100,0.8)'; ctx.lineJoin = 'round';
    const ly = NET_TOP + 30 + pulse * 3;
    ctx.strokeText('the right side', zx, ly);
    ctx.fillStyle = '#ffe27a'; ctx.fillText('the right side', zx, ly);
    ctx.beginPath(); ctx.moveTo(zx - 7, ly + 8); ctx.lineTo(zx + 7, ly + 8); ctx.lineTo(zx, ly + 16); ctx.fill();
  }
}

function meshIn(L, R, top, bottom, sp = 16) {
  ctx.strokeStyle = 'rgba(240,230,200,0.5)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let x = L - (bottom - top); x < R + (bottom - top); x += sp) {
    ctx.moveTo(x, top); ctx.lineTo(x + (bottom - top), bottom);
    ctx.moveTo(x, bottom); ctx.lineTo(x + (bottom - top), top);
  }
  ctx.stroke();
}

function floatsAlong(L, R, y) {
  ctx.fillStyle = '#e0913a'; ctx.strokeStyle = '#a8621f'; ctx.lineWidth = 1.2;
  const n = Math.max(2, Math.round((R - L) / 18));
  for (let i = 0; i <= n; i++) {
    const x = lerp(L, R, i / n);
    ctx.beginPath(); ctx.ellipse(x, y + Math.sin(t * 3 + x * 0.1) * 1.5, 4.5, 3.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
}

// The net plunging, then drawn up full of fish
function drawNet() {
  const n = net;
  if (n.phase === 'idle') return;
  const top = SEA_Y + 4;
  const tieX = boat.x + (n.side > 0 ? 134 : -134) * BOAT_S, tieY = boatY() - 42 * BOAT_S;
  let zx = zoneX(), half = cfg.zoneHalf, depth;
  if (n.phase === 'left') {
    zx = boat.x - HULL * BOAT_S - 20 - half * 0.6; half *= 0.6;
    const f = clamp(n.t / 0.3, 0, 1), back = clamp((n.t - 0.6) / 0.5, 0, 1);
    depth = lerp(top + 20, NET_BOTTOM - 120, f) - back * (NET_BOTTOM - 140 - top);
  } else if (n.phase === 'drop') {
    const f = clamp(n.t / DROP_T, 0, 1);
    depth = lerp(NET_TOP + 40, NET_BOTTOM, 1 - (1 - f) * (1 - f));
  } else if (n.phase === 'haul') {
    const f = clamp(n.t / haulDur(), 0, 1);
    depth = lerp(NET_BOTTOM, top + 40 + n.bag * 2.5, Math.min(1, f * 1.6));
    half = lerp(half, 30 + n.bag * 1.6, Math.min(1, f * 1.6));
  } else return;

  const sway = Math.sin(t * 4) * 6;
  const L = zx - half, R = zx + half, mid = (top + depth) / 2;
  const shape = () => {
    ctx.beginPath();
    ctx.moveTo(L, top); ctx.lineTo(R, top);
    ctx.quadraticCurveTo(R + 6, mid, R - 8 + sway, depth);
    ctx.quadraticCurveTo(zx + sway, depth + 20, L + 8 + sway, depth);
    ctx.quadraticCurveTo(L - 6, mid, L, top);
    ctx.closePath();
  };
  shape();
  ctx.fillStyle = 'rgba(255,240,190,0.14)';
  ctx.fill();
  ctx.save(); ctx.clip();
  if (n.phase === 'haul') {
    const left = Math.max(0, Math.round((n.catch - n.added) / Math.max(1, n.catch) * n.bag));
    for (let i = 0; i < left; i++) {
      const fx = zx + (hsh(i) - 0.5) * half * 1.6, fy = lerp(top + 14, depth - 6, hsh(i, 1));
      drawFish(fx + Math.sin(t * 6 + i) * 2, fy, 0.6, hsh(i, 2) < 0.5 ? -1 : 1, FISH_COLORS[i % 5], i);
    }
  }
  meshIn(L - 10, R + 10, top, depth + 20);
  ctx.restore();
  shape();
  ctx.strokeStyle = '#e2d3a4'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#6d7680';
  for (let i = 0; i <= 5; i++) {
    const x = lerp(L + 8, R - 8, i / 5) + sway;
    ctx.beginPath(); ctx.arc(x, depth + Math.sin((i / 5) * Math.PI) * 14, 3, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#c8b27a'; ctx.lineWidth = 2;
  const ex = n.side > 0 ? L : R;
  ctx.beginPath(); ctx.moveTo(tieX, tieY); ctx.quadraticCurveTo((tieX + ex) / 2, Math.max(tieY, top) + 10, ex, top); ctx.stroke();
  floatsAlong(L, R, top);
}

function drawFish(x, y, size, dir, color, phase0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir * size, size);
  const wag = Math.sin(t * 11 + phase0);
  ctx.fillStyle = shade(color, -25);
  ctx.beginPath();
  ctx.moveTo(-12, 0); ctx.lineTo(-24, -9 + wag * 3); ctx.quadraticCurveTo(-20, 0, -24, 9 + wag * 3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.quadraticCurveTo(0, -15, 7, -7); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(1, 3, 11, 3.8, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(color, -45); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(3, 0, 6, -0.9, 0.9); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -2, 2.8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1d1a18'; ctx.beginPath(); ctx.arc(8.8, -2, 1.4, 0, TAU); ctx.fill();
  ctx.restore();
}

// A fish cooked (or cooking) over the coals: gentle, with a sleepy closed eye
function drawCookedFish(x, y, s, color, sy = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s * sy);
  ctx.fillStyle = shade(color.startsWith('#') ? color : '#d9a04a', -30);
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-25, -10); ctx.quadraticCurveTo(-20, 0, -25, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 8.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(1, -3, 11, 3, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(90,50,20,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (const gx of [-6, 0, 6]) { ctx.moveTo(gx - 2, -6); ctx.lineTo(gx + 2, 6); }
  ctx.stroke();
  ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(9, -2, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.restore();
}

function badge(x, y, n, inside) {
  const R = need();
  let fill = 'rgba(255,252,240,0.95)', ink = '#1f5f8c', ring = 'rgba(31,95,140,0.5)';
  if (cfg.hints && state !== 'title') {
    if (n === R) { fill = '#ffe27a'; ink = '#7a5200'; ring = '#e0a526'; }
    else if (n > R) { fill = '#ffd6d0'; ink = '#b0301c'; ring = 'rgba(176,48,28,0.6)'; }
  }
  ctx.save();
  if (inside) { ctx.shadowColor = 'rgba(255,240,170,1)'; ctx.shadowBlur = 16; ctx.translate(x, y); ctx.scale(1.15, 1.15); ctx.translate(-x, -y); }
  ctx.fillStyle = fill;
  const w = n >= 10 ? 36 : 28;
  roundRect(x - w / 2, y - 13, w, 26, 13); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = inside ? '#f5c542' : ring; ctx.lineWidth = inside ? 3.5 : 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 5, y + 12); ctx.lineTo(x, y + 19); ctx.lineTo(x + 5, y + 12); ctx.fillStyle = fill; ctx.fill();
  ctx.fillStyle = ink; ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(n, x, y + 1);
  ctx.restore();
}

function shoalY(s, dy = 0) { return Math.min(s.y + dy, groundY(s.x) - 26); }

function drawShoals() {
  for (const s of shoals) {
    const dir = Math.sign(s.vx) || 1;
    for (const f of s.fishes) {
      const bob = Math.sin(t * 3 + f.ph) * 3;
      drawFish(s.x + f.dx * dir, shoalY(s, f.dy + bob), f.size, dir, f.color, f.ph);
    }
  }
  if (phase !== 'fish') return;
  for (const s of shoals) badge(s.x, shoalY(s) - s.spread * 0.5 - 26, s.n, net.phase === 'idle' && inZone(s));
}

function drawArcs() {
  for (const a of arcs) {
    const f = clamp(a.t / a.d, 0, 1);
    const x = lerp(a.x0, a.x1, f), y = lerp(a.y0, a.y1, f) - Math.sin(f * Math.PI) * (a.leap ? 70 : 110);
    drawFish(x, y, 0.6, Math.sign(a.x1 - a.x0) || 1, a.color, a.x0);
  }
}

// Peter: leaping from the boat, swimming, then wading ashore
function drawPeter() {
  const d = byName('Peter');
  if (peter.mode === 'jump') {
    ctx.save();
    ctx.translate(peter.x, peter.y);
    ctx.rotate(clamp(peter.t / 0.65, 0, 1) * 1.2);
    drawDisciple({ d, x: 0, y: 30 * BOAT_S, s: 1.08 * BOAT_S, lx: 1, ly: 0 });
    ctx.restore();
  } else if (peter.mode === 'swim') {
    const x = peter.x, y = surf(x) + 2;
    const s = 1.08 * BOAT_S;
    // arms windmilling with each stroke
    const a = peter.armT > 0 ? (1 - peter.armT / 0.3) * Math.PI : Math.sin(t * 2) * 0.3;
    ctx.strokeStyle = shade(d.robe, -25); ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
    for (const k of [0, Math.PI]) {
      const aa = a + k;
      const hx = x + Math.cos(aa) * 24 * s, hy = y - 8 * s - Math.sin(aa) * 20 * s;
      ctx.beginPath(); ctx.moveTo(x, y - 6 * s); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(hx, hy, 4 * s, 0, TAU); ctx.fill();
    }
    const body = { d, x, y: y + 34 * s, s, lx: 1, ly: -0.2, noArms: true };
    ctx.save(); ctx.beginPath(); ctx.rect(x - 60, y - 120, 120, 122); ctx.clip();
    drawDisciple(body);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(x - 60, y + 2, 120, 60); ctx.clip();
    ctx.globalAlpha = 0.3; drawDisciple(body);
    ctx.restore();
    // ripples around his shoulders
    ctx.fillStyle = 'rgba(160,215,240,0.5)';
    ctx.beginPath(); ctx.ellipse(x, y + 3, 30 * s, 6 * s, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y + 2, 30 * s, 6 * s, 0, Math.PI, TAU); ctx.stroke();
  } else if (peter.mode === 'walk') {
    drawDisciple({ d, x: peter.x, y: groundY(peter.x) + 4, s: 1.08 * BOAT_S * 1.1, lx: 1, ly: -0.3, wet: true });
  }
}

// ============================================================
//  Breakfast scene
// ============================================================
function cookColor(c) {
  if (c < DONE) return mix('#b9cbd6', '#e8b04a', c / DONE);
  if (c < PERF) return mix('#e8b04a', '#dc9636', (c - DONE) / (PERF - DONE));
  return mix('#dc9636', '#4a3020', (c - PERF) / (BURN - PERF));
}

function drawDineBackground() {
  drawSky();
  drawHills(400);
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  // The lake behind, glittering
  const g = ctx.createLinearGradient(0, 392, 0, 480);
  g.addColorStop(0, '#a6d6ef'); g.addColorStop(1, '#4f9fd2');
  ctx.fillStyle = g;
  ctx.fillRect(x0, 392, x1 - x0, 96);
  ctx.strokeStyle = 'rgba(255,250,220,0.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const x = x0 + hsh(i, 41) * (x1 - x0), y = 400 + hsh(i, 42) * 70;
    const w = 12 + Math.sin(t * 2 + i) * 6;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y); ctx.stroke();
  }
  // The little ship drawn up at the water's edge, the full net beside it
  ctx.save();
  const bx = W * 0.12, by = 486;
  ctx.translate(bx, by); ctx.scale(0.45, 0.45); ctx.rotate(-0.05);
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(-30, -190); ctx.stroke();
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath(); ctx.moveTo(-140, -40); ctx.quadraticCurveTo(0, -30, 142, -46); ctx.quadraticCurveTo(130, 10, 80, 22); ctx.lineTo(-94, 22); ctx.quadraticCurveTo(-138, 12, -140, -40); ctx.fill();
  ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-141, -40); ctx.quadraticCurveTo(0, -30, 143, -46); ctx.stroke();
  ctx.restore();
  // Sand
  const sg = ctx.createLinearGradient(0, 470, 0, H);
  sg.addColorStop(0, '#f2dcaa'); sg.addColorStop(1, '#d9b779');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, 482 + Math.sin(x / 80) * 4);
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 10) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, 482 + Math.sin(x / 80) * 4 + Math.sin(t * 1.5) * 2);
  ctx.stroke();
  for (let i = 0; i < 16; i++) {
    const x = x0 + hsh(i, 51) * (x1 - x0), y = 500 + hsh(i, 52) * 390;
    ctx.fillStyle = i % 4 ? 'rgba(170,140,90,0.5)' : '#f7ead2';
    ctx.beginPath(); ctx.ellipse(x, y, 4 + hsh(i, 53) * 3, 2.4, 0, 0, TAU); ctx.fill();
  }
  // The great catch in its unbroken net
  const nx = W - 64, ny = 842;
  ctx.fillStyle = 'rgba(214,196,150,0.9)';
  ctx.beginPath(); ctx.ellipse(nx, ny, 56, 26, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 12; i++) {
    ctx.save();
    ctx.translate(nx + (hsh(i, 61) - 0.5) * 80, ny - 6 + (hsh(i, 62) - 0.5) * 26 - Math.floor(i / 6) * 8);
    ctx.rotate((hsh(i, 63) - 0.5) * 1);
    ctx.fillStyle = FISH_COLORS[i % 5];
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 5.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-17, -5); ctx.lineTo(-17, 5); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.beginPath(); ctx.ellipse(nx, ny, 56, 26, 0, 0, TAU); ctx.clip();
  meshIn(nx - 60, nx + 60, ny - 30, ny + 30, 12);
  ctx.restore();
  ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7a5200'; ctx.fillText(`${GOAL}`, nx, ny + 44);
}

function drawGrill() {
  const n = cfg.grill, sp = slotSpacing();
  const w = n * sp + 60;
  const cx = fireX(), cy = FIRE_Y + 22;
  // glow and coals
  const glow = ctx.createRadialGradient(cx, cy - 10, 10, cx, cy - 10, w * 0.62);
  glow.addColorStop(0, 'rgba(255,170,70,0.5)'); glow.addColorStop(1, 'rgba(255,170,70,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.ellipse(cx, cy - 10, w * 0.62, w * 0.3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a2416';
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, 26, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < Math.round(w / 12); i++) {
    const heat = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.3);
    ctx.fillStyle = mix('#b8361a', '#ffd060', heat);
    ctx.beginPath(); ctx.ellipse(cx + (hsh(i, 71) - 0.5) * w * 0.85, cy + (hsh(i, 72) - 0.5) * 30, 8, 4.5, 0, 0, TAU); ctx.fill();
  }
  // little flames licking up between the fish
  for (let i = 0; i <= n; i++) {
    const fx = cx + (i - n / 2) * sp, fh = 22 + 8 * Math.sin(t * 9 + i * 2);
    ctx.fillStyle = 'rgba(255,160,60,0.8)';
    ctx.beginPath(); ctx.moveTo(fx - 9, cy - 4); ctx.quadraticCurveTo(fx - 6, cy - fh * 0.6, fx + Math.sin(t * 7 + i) * 3, cy - fh); ctx.quadraticCurveTo(fx + 6, cy - fh * 0.6, fx + 9, cy - 4); ctx.fill();
  }
  // a grate of green sticks
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - w / 2 + 16, FIRE_Y + 8); ctx.lineTo(cx + w / 2 - 16, FIRE_Y + 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w / 2 + 16, FIRE_Y - 6); ctx.lineTo(cx + w / 2 - 16, FIRE_Y - 6); ctx.stroke();
  // stones
  ctx.fillStyle = '#8a8378';
  const k = Math.max(9, Math.round(w / 34));
  for (let i = 0; i < k; i++) {
    const a = Math.PI * (i / (k - 1));
    ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * w / 2, cy + Math.sin(a) * 24 + 4, 15, 10, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#9d968a';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(cx + s * (w / 2 + 4), cy - 4, 14, 11, 0, 0, TAU); ctx.fill(); }
}

function drawGrillFish() {
  const s = 2;
  dine.slots.forEach((sl, i) => {
    const x = slotX(i);
    let y = FIRE_Y - 2 - (sl.hop > 0 ? Math.sin((sl.hop / 0.25) * Math.PI) * 8 : 0);
    if (sl.state === 'empty') return;
    let alpha = 1;
    if (sl.wait > 0) { if (sl.wait > 0.35) return; alpha = 1 - sl.wait / 0.35; y -= sl.wait * 60; }
    ctx.save();
    ctx.globalAlpha = sl.state === 'burnt' ? clamp(1 - (sl.t - 0.5) / 0.6, 0, 1) : alpha;
    const f = sl.flip / FLIP_T;
    const sy = Math.max(0.08, Math.abs(Math.cos(f * Math.PI)));
    const showSide = f > 0.5 ? sl.down : 1 - sl.down;
    const col = sl.state === 'burnt' ? '#3a2a20' : cookColor(sl.cook[showSide]);
    // the underside glows as it cooks
    const heat = clamp(sl.cook[sl.down] / BURN, 0, 1);
    ctx.fillStyle = `rgba(255,${Math.round(150 - heat * 90)},40,${0.25 + heat * 0.35})`;
    ctx.beginPath(); ctx.ellipse(x, y + 8, 36, 9, 0, 0, TAU); ctx.fill();
    drawCookedFish(x + 6, y - (f > 0 ? Math.sin(f * Math.PI) * 26 : 0), s, col, sy);
    ctx.restore();
    if (sl.state !== 'cook' || sl.wait > 0) return;

    // Gauge: how cooked the side on the fire is (gold band = turn now)
    const done = sl.cook[0] >= DONE && sl.cook[1] >= DONE;
    const gw = Math.min(64, slotSpacing() - 18), gx = x - gw / 2, gy = FIRE_Y - 46;
    if (done) {
      const p = 0.5 + 0.5 * Math.sin(t * 8);
      ctx.fillStyle = `rgba(255,226,122,${0.75 + p * 0.25})`;
      roundRect(x - 34, gy - 9, 68, 20, 10); ctx.fill();
      ctx.strokeStyle = '#c47f00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#7a5200'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('SHARE!', x, gy + 1);
      ctx.textBaseline = 'alphabetic';
      if (Math.random() < 0.15) spawn(x + rand(-30, 30), y - rand(0, 16), 0, -20, 0.8, '#fff6d0', 2.5);
    } else {
      ctx.fillStyle = 'rgba(60,40,20,0.35)';
      roundRect(gx, gy - 5, gw, 10, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255,215,90,0.9)';
      ctx.fillRect(gx + gw * DONE / BURN, gy - 5, gw * (PERF - DONE) / BURN, 10);
      ctx.fillStyle = 'rgba(200,70,40,0.6)';
      ctx.fillRect(gx + gw * PERF / BURN, gy - 5, gw * (1 - PERF / BURN), 10);
      const c = clamp(sl.cook[sl.down] / BURN, 0, 1);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(gx + gw * c, gy, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 2; ctx.stroke();
      // a tick when the top side is already done
      if (sl.cook[1 - sl.down] >= DONE) {
        ctx.strokeStyle = '#2b8a3e'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(gx - 16, gy); ctx.lineTo(gx - 11, gy + 5); ctx.lineTo(gx - 3, gy - 6); ctx.stroke();
      }
    }
    if (kbdSel === i) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      roundRect(x - slotSpacing() / 2 + 4, gy - 16, slotSpacing() - 8, 84, 14); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
}

function drawBread(x, y) {
  ctx.fillStyle = '#9d968a';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 46, 14, 0, 0, TAU); ctx.fill();
  const loaves = [[-24, 0], [0, -3], [24, 0], [-12, -12], [12, -12]];
  const left = dine ? Math.max(1, 5 - Math.floor(dine.served * 4 / MOUTHS)) : 5;
  loaves.slice(0, left).forEach(([dx, dy]) => {
    ctx.fillStyle = '#c9843a';
    ctx.beginPath(); ctx.ellipse(x + dx, y + dy, 14, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8b064';
    ctx.beginPath(); ctx.ellipse(x + dx, y + dy - 3, 9, 4, 0, 0, TAU); ctx.fill();
  });
}

function drawDine() {
  drawDineBackground();
  const seats = dineSeats();
  const jx = fireX(), jy = 612;
  for (const st of seats) {
    if (st.d.name === 'Peter') continue;
    const [lx, ly] = st.d.fed ? lookAt(jx, jy - 80, st.x, st.y - 55) : lookAt(fireX(), FIRE_Y, st.x, st.y - 55);
    drawDisciple({ ...st, lx, ly });
    // the next hungry disciple has an empty plate waiting
    if (dine.order[dine.targeted] === st.d.i && state === 'play') {
      const by = st.y - 100 * st.s - Math.abs(Math.sin(t * 4)) * 5;
      ctx.fillStyle = 'rgba(255,252,240,0.95)'; ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(st.x, by, 17, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(st.x, by - 1, 10, 3.5, 0, 0, TAU); ctx.stroke();
    }
  }
  const pose = dine.giveT > 0 ? 'bless' : dine.done || state === 'win' ? 'up' : bubbleActive('jesus') ? 'call' : 'open';
  drawJesus(jx, jy, 1.45, pose, dine.done || state === 'win' || dine.giveT > 0 ? 'joy' : 'calm');
  drawGrill();
  drawGrillFish();
  drawBread(fireX() + 70, 826);
  const pt = seats.find((st) => st.d.name === 'Peter');
  const [plx, ply] = lookAt(fireX(), FIRE_Y, pt.x, pt.y - 60);
  drawDisciple({ ...pt, lx: plx, ly: ply });
  if (dine.order[dine.targeted] === pt.d.i && state === 'play') {
    const by = pt.y - 102 * pt.s - Math.abs(Math.sin(t * 4)) * 5;
    ctx.fillStyle = 'rgba(255,252,240,0.95)'; ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(pt.x, by, 17, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(pt.x, by - 1, 10, 3.5, 0, 0, TAU); ctx.stroke();
  }
  // bread and fish on their way to a disciple
  for (const f of dine.flying) {
    const k = clamp(f.t / f.d, 0, 1);
    const x = lerp(f.x0, f.x1, k), y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 120;
    drawCookedFish(x + 8, y, 0.8, '#e0a040');
    ctx.fillStyle = '#c9843a';
    ctx.beginPath(); ctx.ellipse(x - 14, y + 4, 9, 6, 0, 0, TAU); ctx.fill();
  }
}

// ============================================================
//  Speech, messages, HUD
// ============================================================
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawSpeech(x, y, text, who) {
  ctx.save();
  ctx.font = '600 15px Fredoka, sans-serif';
  const lines = wrapText(text, Math.min(250, W - 60));
  const lh = 19;
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 24;
  const bh = lines.length * lh + 14;
  const bx = clamp(x - bw / 2, 10, W - 10 - bw), by = y - bh - 16;
  ctx.fillStyle = 'rgba(255,252,240,0.97)';
  ctx.strokeStyle = who === 'jesus' ? 'rgba(224,165,38,0.9)' : 'rgba(63,111,181,0.7)';
  ctx.lineWidth = 2.5;
  roundRect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  const tx = clamp(x, bx + 18, bx + bw - 18);
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh - 1); ctx.lineTo(x, y - 2); ctx.lineTo(tx + 8, by + bh - 1); ctx.closePath();
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh); ctx.lineTo(x, y - 2); ctx.lineTo(tx + 8, by + bh); ctx.stroke();
  ctx.fillStyle = '#3b2f1e'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 12, by + 8 + i * lh));
  ctx.restore();
}

function drawBubbles() {
  if (state === 'title') return;
  for (const b of bubbles) {
    if (phaseT < b.t0 || phaseT > b.t1) continue;
    const text = textOf(b.text);
    if (b.who === 'jesus') {
      if (phase === 'dine') drawSpeech(fireX(), 612 - 80 * 1.45, text, 'jesus');
      else { const jx = jesusShoreX(); drawSpeech(jx, groundY(jx) - 76 * 0.92, text, 'jesus'); }
    } else {
      const bx = b.who === 'john' ? boat.x + 18 * BOAT_S : peterBoatPos().x;
      drawSpeech(bx, boatY() - 80 * 1.08 * BOAT_S, text, 'peter');
    }
  }
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.t / 0.5, 0, 1);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.text[0] === '−' ? '#c92a2a' : '#c47f00'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

// Centre banner; wraps long lines (scripture banners can be long in some versions)
function drawMessage() {
  if (message.t <= 0 || !message.text) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const txt = textOf(message.text);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 22px Fredoka, sans-serif';
  const lines = wrapText(txt, Math.min(W - 40, 640));
  const lh = 27, y0 = 170 - (lines.length - 1) * lh / 2;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#7a5200';
  lines.forEach((l, i) => { ctx.strokeText(l, W / 2, y0 + i * lh); ctx.fillText(l, W / 2, y0 + i * lh); });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + the meter for this part of the morning
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  const title = state === 'title' ? 'Breakfast on the Beach' : `Level ${level} · ${cfg.name}`;
  const tsize = Math.min(17, 17 * (viewW - 150) / Math.max(1, ctx.measureText(title).width));
  ctx.font = `700 ${tsize}px Fredoka, sans-serif`;
  ctx.fillText(title, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  if (phase === 'fish' || state === 'title') {
    ctx.fillText('NETS', 12, 48);
    ctx.shadowBlur = 0;
    for (let i = 0; i < cfg.casts; i++) {
      const x = 58 + i * 11.5, has = i < castsLeft;
      ctx.fillStyle = has ? (castsLeft <= 2 && Math.sin(t * 8) > 0 ? '#ff6b6b' : '#e0a526') : 'rgba(90,66,16,0.2)';
      ctx.beginPath(); ctx.arc(x, 44, 4.5, 0, TAU); ctx.fill();
    }
  } else if (phase === 'lord' || phase === 'swim' || phase === 'ashore') {
    ctx.fillText('SHORE', 12, 48);
    ctx.shadowBlur = 0;
    const BX = 62, BW = 126;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(BX, 38, BW, 12, 6); ctx.fill();
    if (swim) {
      const sp = clamp((peter.x - swim.x0) / swim.dist, 0, 1);
      const bp = clamp((boat.x - boatHome()) / Math.max(1, swim.goalX - boatHome()), 0, 1);
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath(); ctx.moveTo(BX + BW * bp - 7, 53); ctx.lineTo(BX + BW * bp + 7, 53); ctx.lineTo(BX + BW * bp, 58); ctx.fill();
      ctx.fillStyle = '#3f6fb5';
      if (sp > 0) { roundRect(BX, 38, BW * sp, 12, 6); ctx.fill(); }
    }
  } else if (phase === 'dine' && dine) {
    ctx.fillText('FED', 12, 48);
    ctx.shadowBlur = 0;
    for (let i = 0; i < MOUTHS; i++) {
      const x = 50 + i * 18;
      ctx.fillStyle = i < dine.served ? '#e0a526' : 'rgba(90,66,16,0.2)';
      ctx.beginPath(); ctx.ellipse(x, 44, 7, 4, 0, 0, TAU); ctx.fill();
    }
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: the catch counter (or the breakfast tally), then the score
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  if (phase !== 'dine') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('CAUGHT', rx, 18);
    ctx.font = '700 17px Fredoka, sans-serif';
    const tail = ` / ${GOAL}`;
    ctx.fillText(tail, rx, 50);
    const tw = ctx.measureText(tail).width;
    const pulse = 1 + cntPulse * 1.2;
    ctx.save();
    ctx.translate(rx - tw, 50);
    ctx.scale(pulse, pulse);
    ctx.font = '700 30px Fredoka, sans-serif';
    ctx.fillStyle = count > GOAL ? '#c92a2a' : count === GOAL ? '#c47f00' : '#1f5f8c';
    ctx.fillText(`${count}`, 0, 0);
    ctx.restore();
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillStyle = count > GOAL ? '#c92a2a' : '#5a4210';
    const R = need();
    ctx.fillText(R > 0 ? `${R} more to go` : R === 0 ? 'Exactly!' : `${-R} too many!`, rx, 68);
  } else if (dine) {
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillText(`Perfect turns ${dine.perfect}`, rx, 26);
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(dine.burnt ? `Burnt ${dine.burnt}` : 'Nothing burnt', rx, 46);
  }
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  const live = state === 'win' ? 0 : count * 10 + (swim && swim.bonus ? swim.bonus : 0) + (dine ? dine.pts : 0);
  ctx.fillText(`SCORE ${totalScore + (state === 'play' || state === 'pause' ? live : 0)}`, rx, 88);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (phase === 'dine' && dine) {
    drawDine();
  } else {
    drawSky();
    drawHills(SEA_Y);
    drawBoat();
    drawWater();
    drawShore();
    drawZone();
    drawNet();
    drawShoals();
    drawArcs();
    drawPeter();
    drawSurfaceLine();
  }
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBubbles();
  drawFloaters();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  // Warm fade between the lake and the breakfast fire
  let fade = 0;
  if (phase === 'ashore') fade = clamp((phaseT - 1.4) / 0.7, 0, 1);
  else if (phase === 'dine') fade = clamp(1 - phaseT / 0.7, 0, 1);
  if (fade > 0) {
    ctx.fillStyle = `rgba(255,226,180,${fade})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateScenery(dt);
  updateParticles(dt);
  updateDisciples(dt);
  updateArcs(dt);
  if (state === 'play') {
    phaseT += dt;
    if (phase === 'fish') {
      updateSpawns(dt);
      updateShoals(dt);
      updateNet(dt);
    } else {
      updateShoals(dt);
      if (phase === 'lord') updateLord(dt);
      else if (phase === 'swim') updateSwim(dt);
      else if (phase === 'ashore') updateAshore(dt);
      else if (phase === 'dine') updateDine(dt);
    }
  } else if (state === 'title') {
    updateSpawns(dt);
    updateShoals(dt);
  } else if (state === 'win' || state === 'fail') {
    phaseT += dt;
    if (phase !== 'dine') updateShoals(dt);
    if (state === 'win' && Math.random() < dt * 10) spawn(fireX() + rand(-60, 60), 612 - rand(20, 110), 0, -20, 1, '#fff6d0', 3);
  }
  shockT = Math.max(0, shockT - dt);
  wowT = Math.max(0, wowT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  cntPulse = Math.max(0, cntPulse - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t -= dt; floaters[i].y -= 30 * dt; if (floaters[i].t <= 0) floaters.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
