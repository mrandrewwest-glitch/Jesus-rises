}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    sfx.thrust(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Rest a while by the well. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const ripples = [];

function action(p) {
  if (state !== 'play') return;
  if (phase === 'run') {
    if (p) tapStreet(p.x, p.y); else keyStreet();
  } else tapWell();
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) action(null);
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.vx, y: p.vy, t: 0 });
  action(p);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  // the rope whirring off the winch
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, type = 'bandpass', q = 0.7) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) { this.noiseBurst(1100, 0.16, vol); },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  splash() { this.noiseBurst(700, 0.5, 0.6, 'lowpass', 0.5); this.tone(500, 0.2, 'sine', 0.12, 0, 900); },
  glug() { for (let i = 0; i < 3; i++) this.tone(260 + i * 70, 0.09, 'sine', 0.18, i * 0.1, 420 + i * 70); },
  clunk() { this.tone(110, 0.3, 'triangle', 0.45, 0, 60); this.noiseBurst(300, 0.25, 0.4, 'lowpass'); },
  creak() { this.tone(340, 0.16, 'sawtooth', 0.04, 0, 250); },
  pour() { this.noiseBurst(1800, 1.3, 0.2, 'bandpass', 0.6); },
  baa(kind) {
    if (kind === 'chicken') { this.tone(900, 0.08, 'square', 0.08); this.tone(1100, 0.12, 'square', 0.08, 0.1, 800); }
    else if (kind === 'donkey') { this.tone(500, 0.25, 'sawtooth', 0.08, 0, 300); this.tone(300, 0.3, 'sawtooth', 0.08, 0.28, 520); }
    else { for (let i = 0; i < 4; i++) this.tone(420 - i * 8, 0.09, 'sawtooth', 0.06, i * 0.08); }
  },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Rendering: Jacob's well
// ============================================================
function scene() { return phase === 'run' || (state === 'fail' && failReason === 'few') ? 'street' : 'well'; }

function drawWellSky() {
  const top = camY - offY - 5;
  if (top > GY) return;
  const g = ctx.createLinearGradient(0, -offY, 0, GY);
  g.addColorStop(0, '#5fb3ea');
  g.addColorStop(0.55, '#a9daf5');
  g.addColorStop(1, '#fff1c9');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, top, viewW, GY - top + 2);

  // The midday sun, high and hot
  const sx = W - 80, sy = 70;
  const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 120);
  glow.addColorStop(0, 'rgba(255,250,210,0.95)');
  glow.addColorStop(0.35, 'rgba(255,230,140,0.45)');
  glow.addColorStop(1, 'rgba(255,230,140,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 120, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(t * 0.1);
  ctx.strokeStyle = 'rgba(255,215,90,0.7)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    ctx.beginPath(); ctx.moveTo(44, 0); ctx.lineTo(58 + Math.sin(t * 3 + i) * 4, 0); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#ffd84d';
  ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();

  // soft clouds
  for (const c of skyClouds) {
    const x = ((c.f + t * c.speed / (W + 300)) % 1) * (viewW + 300) - offX - 150;
    drawCloud(x, c.y, c.w, c.w * 0.3);
  }

  // Mount Gerizim and the hills of Samaria
  ctx.fillStyle = '#b8c98f';
  ctx.beginPath(); ctx.moveTo(-offX, GY);
  ctx.lineTo(-offX, GY - 150);
  ctx.quadraticCurveTo(W * 0.15, GY - 250, W * 0.35, GY - 160);
  ctx.quadraticCurveTo(W * 0.55, GY - 110, W * 0.7, GY - 150);
  ctx.quadraticCurveTo(W * 0.88, GY - 190, W + offX, GY - 130);
  ctx.lineTo(W + offX, GY); ctx.fill();
  ctx.fillStyle = '#a3bd74';
  ctx.beginPath(); ctx.moveTo(-offX, GY);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, GY - 70 + Math.sin(x / 80) * 12 + Math.sin(x / 31) * 5);
  ctx.lineTo(W + offX, GY); ctx.fill();
  // Sychar in the distance
  for (let k = 0; k < 6; k++) {
    const hx = W * 0.72 + k * 26, hh = 18 + (k % 3) * 8, hy = GY - 150 - (k % 2) * 6;
    ctx.fillStyle = k % 2 ? '#efdcb4' : '#e2c794';
    ctx.fillRect(hx, hy - hh, 24, hh + 10);
    ctx.fillStyle = '#9b7b52';
    ctx.fillRect(hx + 9, hy - 8, 6, 8);
  }
}

const skyClouds = Array.from({ length: 5 }, () => ({ f: Math.random(), y: rand(140, 380), w: rand(80, 150), speed: rand(6, 14) }));

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#dcebf7') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function drawPalm(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#8b6a43'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, -70, 4, -140); ctx.stroke();
  ctx.strokeStyle = '#6f9e4a'; ctx.lineWidth = 7;
  const sway = Math.sin(t * 1.3 + x) * 3;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.48;
    ctx.beginPath(); ctx.moveTo(4, -140);
    ctx.quadraticCurveTo(4 + Math.cos(a) * 40, -140 + Math.sin(a) * 40 - 12, 4 + Math.cos(a) * 66 + sway, -140 + Math.sin(a) * 50 + 22);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEarth() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const top = Math.max(GY, camY - offY), bot = camY + H + 10;
  const deepest = GY + 1500 + 300;
  const g = ctx.createLinearGradient(0, GY, 0, deepest);
  g.addColorStop(0, '#d8b67c'); g.addColorStop(0.06, '#b98a55'); g.addColorStop(1, '#5f3f24');
  ctx.fillStyle = g;
  ctx.fillRect(x0, top, x1 - x0, bot - top);
  // strata
  ctx.strokeStyle = 'rgba(80,50,25,0.18)'; ctx.lineWidth = 3;
  for (let y = GY + 110; y < bot; y += 95) {
    if (y < top - 20) continue;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 24) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, y + Math.sin(x / 70 + y) * 7);
    ctx.stroke();
  }
  // pebbles
  const cy0 = Math.floor(top / 60), cy1 = Math.ceil(bot / 60);
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = Math.floor(x0 / 60); cx <= Math.ceil(x1 / 60); cx++) {
      const hsh = hash(cx, cy);
      if (hsh > 0.5) continue;
      const px = cx * 60 + hash(cy, cx) * 50, py = cy * 60 + hsh * 100;
      if (py < GY + 40) continue;
      ctx.fillStyle = hsh < 0.15 ? 'rgba(210,190,160,0.55)' : 'rgba(70,45,25,0.25)';
      ctx.beginPath(); ctx.ellipse(px, py, 5 + hsh * 12, 3 + hsh * 7, hsh * 3, 0, TAU); ctx.fill();
    }
  }
  // sunny ground band with tufts of grass
  ctx.fillStyle = '#e6c98f';
  ctx.fillRect(x0, GY, x1 - x0, 34);
  ctx.fillStyle = '#d2b077';
  ctx.fillRect(x0, GY + 30, x1 - x0, 8);
  ctx.strokeStyle = '#7aa24f'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = x0 + 10; x < x1; x += 37) {
    if (Math.abs(x - WX()) < 100) continue;
    const hh = 6 + hash(x, 1) * 7;
    ctx.moveTo(x, GY + 2); ctx.lineTo(x - 3, GY - hh);
    ctx.moveTo(x + 3, GY + 2); ctx.lineTo(x + 5, GY - hh * 0.8);
  }
  ctx.stroke();
}

// When the town comes out, the well is seen from the field (no cut-away)
function drawField() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const g = ctx.createLinearGradient(0, GY, 0, H);
  g.addColorStop(0, '#e6c98f'); g.addColorStop(1, '#cfae72');
  ctx.fillStyle = g;
  ctx.fillRect(x0, GY, x1 - x0, H - GY + 20);
  ctx.fillStyle = 'rgba(160,120,70,0.25)';
  for (let x = Math.floor(x0 / 80) * 80; x < x1; x += 80) {
    ctx.beginPath(); ctx.ellipse(x + hash(x, 2) * 50, GY + 120 + hash(x, 4) * 150, 20, 5, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#7aa24f'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = x0 + 10; x < x1; x += 37) {
    for (const dy of [2, 150, 260]) {
      const y = GY + dy + hash(x, dy) * 40, hh = 6 + hash(x, 1) * 7;
      ctx.moveTo(x, y); ctx.lineTo(x - 3, y - hh);
      ctx.moveTo(x + 3, y); ctx.lineTo(x + 5, y - hh * 0.8);
    }
  }
  ctx.stroke();
}

function drawShaft() {
  const wx = WX(), wy = WY(), fy = floorY();
  const top = GY, bot = Math.min(fy + 40, camY + H + 20);
  if (camY - offY > fy + 40) return;
  // dark shaft
  const g = ctx.createLinearGradient(wx - 50, 0, wx + 50, 0);
  g.addColorStop(0, '#1e140c'); g.addColorStop(0.5, '#3a2a1c'); g.addColorStop(1, '#1e140c');
  ctx.fillStyle = g;
  ctx.fillRect(wx - 50, top, 100, bot - top);
  // stone courses lining the walls
  for (let y = top; y < bot; y += 24) {
    if (y < camY - offY - 30) continue;
    const odd = Math.round((y - top) / 24) % 2;
    for (const side of [-1, 1]) {
      const x = side < 0 ? wx - 66 : wx + 50;
      ctx.fillStyle = odd ? '#9c8a70' : '#8a785f';
      roundRect(x, y + 1, 16, 22, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + 2, y + 3, 12, 3);
    }
  }
  // sandy floor
  ctx.fillStyle = '#6e5a3c';
  ctx.fillRect(wx - 66, fy, 132, 40);
  ctx.fillStyle = '#8a7350';
  ctx.beginPath(); ctx.ellipse(wx, fy + 2, 50, 6, 0, 0, TAU); ctx.fill();
  // the water line marker
  ctx.save();
  ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,220,110,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(wx - 90, wy); ctx.lineTo(wx - 52, wy); ctx.moveTo(wx + 52, wy); ctx.lineTo(wx + 90, wy); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,230,140,0.95)';
  ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('water', wx + 70, wy - 6);
}

function drawWaterOverlay() {
  const wx = WX(), wy = WY(), fy = floorY();
  if (camY - offY > fy + 40 || camY + H < wy - 20) return;
  const g = ctx.createLinearGradient(0, wy, 0, fy);
  g.addColorStop(0, 'rgba(90,175,230,0.78)'); g.addColorStop(1, 'rgba(25,80,130,0.92)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(wx - 50, fy);
  for (let x = wx - 50; x <= wx + 50; x += 5) ctx.lineTo(x, wy + Math.sin(x / 9 + t * 4) * 2);
  ctx.lineTo(wx + 50, fy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(220,245,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = wx - 50; x <= wx + 50; x += 5) (x === wx - 50 ? ctx.moveTo : ctx.lineTo).call(ctx, x, wy + Math.sin(x / 9 + t * 4) * 2);
  ctx.stroke();
  // a glint of reflected sunlight from far above
  ctx.fillStyle = `rgba(255,255,255,${0.35 + Math.sin(t * 2) * 0.15})`;
  ctx.beginPath(); ctx.ellipse(wx - 12, wy + 5, 14, 3, 0, 0, TAU); ctx.fill();
}

function drawBucket(x, y, tilt, fill) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  // handle
  ctx.strokeStyle = '#5a4630'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 14, 18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  // wooden bucket body with iron hoops
  ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-20, 10); ctx.lineTo(20, 10); ctx.lineTo(16, 50); ctx.lineTo(-16, 50); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,50,25,0.35)'; ctx.lineWidth = 1;
  for (const sx of [-9, 0, 9]) { ctx.beginPath(); ctx.moveTo(sx, 11); ctx.lineTo(sx * 0.8, 49); ctx.stroke(); }
  ctx.strokeStyle = '#555c66'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-19, 18); ctx.lineTo(19, 18); ctx.moveTo(-17, 42); ctx.lineTo(17, 42); ctx.stroke();
  // water inside, tilting with the slosh
  if (fill > 0) {
    ctx.fillStyle = '#6fc0ee';
    ctx.beginPath();
    const tip = clamp(bucket.swing * 30 + Math.sin(t * 9) * slosh * 0.05, -6, 6);
    ctx.ellipse(0, 11 + (1 - fill) * 6, 19, 4, tip * 0.04, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawJar(x, y, fill) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 6, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(-22, 0, 22, 0);
  g.addColorStop(0, '#a4522b'); g.addColorStop(0.45, '#d9824e'); g.addColorStop(1, '#9a4a25');
  ctx.fillStyle = g; ctx.strokeStyle = '#7a3a1c'; ctx.lineWidth = 1.5;
  // handles
  ctx.lineWidth = 4; ctx.strokeStyle = '#a4522b';
  ctx.beginPath(); ctx.arc(-17, -52, 8, Math.PI * 0.6, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(17, -52, 8, Math.PI * 1.5, Math.PI * 2.4); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#7a3a1c';
  ctx.beginPath();
  ctx.moveTo(-8, -62);
  ctx.quadraticCurveTo(-9, -52, -20, -44);
  ctx.quadraticCurveTo(-30, -24, -14, -2);
  ctx.lineTo(14, -2);
  ctx.quadraticCurveTo(30, -24, 20, -44);
  ctx.quadraticCurveTo(9, -52, 8, -62);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c46a3a';
  roundRect(-11, -68, 22, 7, 3); ctx.fill(); ctx.stroke();
  // painted band
  ctx.strokeStyle = '#f3d7a8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-22, -32); ctx.quadraticCurveTo(0, -27, 22, -32); ctx.stroke();
  ctx.fillStyle = '#3a1d0e';
  ctx.beginPath(); ctx.ellipse(0, -66, 7, 2.5, 0, 0, TAU); ctx.fill();
  if (fill > 0.05) {
    ctx.fillStyle = `rgba(120,200,245,${0.5 + fill * 0.5})`;
    ctx.beginPath(); ctx.ellipse(0, -66, 6 * fill + 1, 2, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawWellTop() {
  const wx = WX();
  // the dark mouth of the well
  ctx.fillStyle = '#20150c';
  ctx.beginPath(); ctx.ellipse(wx, GY - RIM, 80, 17, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#b8a283'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(wx, GY - RIM, 80, 17, 0, Math.PI, TAU); ctx.stroke();
  // wooden posts
  ctx.fillStyle = '#8b5e34'; ctx.strokeStyle = '#5e3d1f'; ctx.lineWidth = 1.5;
  for (const side of [-1, 1]) {
    roundRect(wx + side * 84 - 6, GY - 210, 12, 180, 3); ctx.fill(); ctx.stroke();
  }
}

function drawRope() {
  const wx = WX(), b = bucket;
  const bx = b.pour ? b.pour.x : wx + Math.sin(b.swing) * 20, by = b.pour ? b.pour.y : b.y;
  ctx.strokeStyle = '#c8a86a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(wx, GY - 186); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,90,40,0.5)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.lineDashOffset = -b.y * 0.5;
  ctx.beginPath(); ctx.moveTo(wx, GY - 186); ctx.lineTo(bx, by); ctx.stroke();
  ctx.setLineDash([]);
  drawBucket(bx, by, b.pour ? b.pour.tilt : b.swing, b.empty ? 0 : water / 100);
}

function drawWellFront() {
  const wx = WX();
  // stone rim, front face
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(wx - 82, GY - RIM);
  ctx.lineTo(wx - 82, GY);
  ctx.ellipse(wx, GY, 82, 14, 0, Math.PI, 0, true);
  ctx.lineTo(wx + 82, GY - RIM);
  ctx.ellipse(wx, GY - RIM, 82, 17, 0, 0, Math.PI, false);
  ctx.closePath();
  const g = ctx.createLinearGradient(wx - 82, 0, wx + 82, 0);
  g.addColorStop(0, '#a8916e'); g.addColorStop(0.4, '#dcc8a4'); g.addColorStop(1, '#9d8664');
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  ctx.strokeStyle = 'rgba(90,70,45,0.45)'; ctx.lineWidth = 2;
  for (let r = 0; r < 4; r++) {
    const y = GY - RIM + 8 + r * 17;
    ctx.beginPath(); ctx.ellipse(wx, y, 82, 16, 0, 0.1, Math.PI - 0.1); ctx.stroke();
    for (let k = 0; k < 6; k++) {
      const a = 0.25 + (k + (r % 2) * 0.5) * 0.47;
      const x = wx + Math.cos(a) * 82;
      ctx.beginPath(); ctx.moveTo(x, y + Math.sin(a) * 16); ctx.lineTo(x, y + Math.sin(a) * 16 + 17); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.strokeStyle = '#d9c7a5'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(wx, GY - RIM, 80, 17, 0, 0, Math.PI); ctx.stroke();

  // crossbar, pulley and crank
  ctx.fillStyle = '#9a6a3c'; ctx.strokeStyle = '#5e3d1f'; ctx.lineWidth = 1.5;
  roundRect(wx - 100, GY - 214, 200, 13, 5); ctx.fill(); ctx.stroke();
  const spin = bucket ? bucket.y / 14 : 0;
  ctx.save(); ctx.translate(wx, GY - 196); ctx.rotate(spin);
  ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c8a86a'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 6); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke(); }
  ctx.restore();
  // crank wheel on the right post
  const c = crankPos();
  ctx.fillStyle = '#7a5230'; ctx.strokeStyle = '#5e3d1f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(wx + 96, CRANK_Y, 7, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(wx + 96, CRANK_Y); ctx.lineTo(c.x, c.y); ctx.stroke();
  ctx.fillStyle = '#c8a86a'; ctx.beginPath(); ctx.arc(c.x, c.y, 4.5, 0, TAU); ctx.fill();
}

function drawWoman() {
  if (!WOMAN.vis || WOMAN.x > W + offX + 60) return;
  const d = WOMAN;
  let o = {};
  if (d.pose === 'crank') {
    const c = crankPos();
    o.hand = [(c.x - d.x) / JS, (c.y - d.y) / JS];
  } else if (d.pose === 'pour' && bucket.pour) {
    o.hand = [(bucket.pour.x - d.x) / JS, (bucket.pour.y + 14 - d.y) / JS];
  }
  let lx = jesus.x, ly = jesus.y - 90;
  if (phase === 'lower' || phase === 'haul' || phase === 'fill') { lx = WX(); ly = bucket.y; }
  drawPerson(d, d.x, d.y, JS, lx, ly, d.pose, o);
}

function renderWell() {
  drawWellSky();
  if (camY - offY < GY) {
    drawPalm(W * 0.93 + 20, GY + 4, 1.05);
    drawPalm(W * 0.04 - 10, GY + 6, 0.9);
  }
  if (phase === 'arrive') drawField();
  else { drawEarth(); drawShaft(); }
  // back row of the crowd, behind the well
  if (phase === 'arrive') for (const p of followers) if (p.row === 0) drawCrowdPerson(p);
  drawWellTop();
  // back row of the crowd (behind the well)
  drawRope();
  drawWaterOverlay();
  drawWellFront();
  drawJar(JAR_X(), GY + 4, jar.fill);
  drawJesus(jesus);
  if (phase === 'arrive') {
    const front = followers.filter((p) => p.row === 1).map((p) => ({ y: p.fy, draw: () => drawCrowdPerson(p) }));
    front.push({ y: WOMAN.y, draw: drawWoman });
    front.sort((a, b) => a.y - b.y).forEach((o) => o.draw());
  } else drawWoman();
  drawParticles();
}

function drawCrowdPerson(p) {
  drawPerson(p, p.fx, p.fy, p.s, jesus.x, jesus.y - 90, p.walking ? 'run' : 'stand');
}

// ============================================================
//  Rendering: the streets of Sychar
// ============================================================
function drawStreetBg() {
  const g = ctx.createLinearGradient(0, 0, 0, offY + SY);
  g.addColorStop(0, '#5fb3ea'); g.addColorStop(0.6, '#a9daf5'); g.addColorStop(1, '#fff1c9');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, viewH);
  ctx.save();
  ctx.translate(0, offY);
  // far hills scroll slowly
  const px = camX * 0.25;
  ctx.fillStyle = '#b8c98f';
  ctx.beginPath(); ctx.moveTo(0, SY);
  for (let x = 0; x <= viewW + 20; x += 20) {
    const wx = x + px;
    ctx.lineTo(x, SY - 300 + Math.sin(wx / 260) * 50 + Math.sin(wx / 90) * 14);
  }
  ctx.lineTo(viewW, SY); ctx.fill();
  // Mount Gerizim far behind the town
  const gx = 700 - camX * 0.12;
  ctx.fillStyle = '#a9bf86';
  ctx.beginPath(); ctx.moveTo(gx - 700, SY); ctx.quadraticCurveTo(gx, SY - 1000, gx + 700, SY); ctx.fill();
  // rooftops of the back streets
  const bx = camX * 0.55;
  for (let k = Math.floor(bx / 90) - 1; k < Math.floor((bx + viewW) / 90) + 2; k++) {
    const hh = 150 + hash(k, 7) * 170, x = k * 90 - bx;
    ctx.fillStyle = hash(k, 9) < 0.5 ? '#f1e2c2' : '#e8d3a8';
    ctx.fillRect(x, SY - hh - 60, 92, hh + 60);
    ctx.fillStyle = 'rgba(120,90,50,0.35)';
    ctx.fillRect(x + 30, SY - hh - 30, 14, 18);
    if (hash(k, 11) < 0.3) { ctx.fillStyle = '#e8d3a8'; ctx.beginPath(); ctx.arc(x + 46, SY - hh - 60, 26, Math.PI, TAU); ctx.fill(); }
  }
  for (const c of skyClouds) {
    const x = (((c.f * 3000 - camX * 0.1 + t * c.speed) % (viewW + 300)) + viewW + 300) % (viewW + 300) - 150;
    drawCloud(x, c.y - 40, c.w, c.w * 0.3);
  }
  ctx.restore();
}

function drawHouse(h) {
  const top = SY - 60 - h.h;
  ctx.fillStyle = h.c; ctx.strokeStyle = shade(h.c, -45); ctx.lineWidth = 2;
  ctx.fillRect(h.x, top, h.w, h.h + 62); ctx.strokeRect(h.x, top, h.w, h.h + 62);
  // parapet on the flat roof
  ctx.fillStyle = shade(h.c, -20);
  ctx.fillRect(h.x - 4, top - 10, h.w + 8, 12);
  for (let x = h.x + 8; x < h.x + h.w - 8; x += 26) ctx.fillRect(x, top - 18, 12, 9);
  // windows
  if (h.win) {
    ctx.fillStyle = '#5b3f25';
    for (const f of [0.22, 0.72]) {
      const wx = h.x + h.w * f;
      roundRect(wx - 11, top + 34, 22, 28, [11, 11, 2, 2]); ctx.fill();
    }
    if (h.cloth) {
      ctx.fillStyle = h.cloth;
      ctx.beginPath(); ctx.moveTo(h.x + h.w * 0.22 - 14, top + 66); ctx.lineTo(h.x + h.w * 0.22 + 14, top + 66);
      ctx.lineTo(h.x + h.w * 0.22 + 10, top + 92); ctx.lineTo(h.x + h.w * 0.22 - 10, top + 92); ctx.fill();
    }
  }
  // arched doors
  for (const dx of h.doors) {
    ctx.fillStyle = shade(h.c, -30);
    roundRect(dx - 30, SY - 108, 60, 108, [30, 30, 0, 0]); ctx.fill();
    ctx.fillStyle = '#4a321c';
    roundRect(dx - 24, SY - 102, 48, 102, [24, 24, 0, 0]); ctx.fill();
  }
}

function drawStall(s) {
  const x = s.x;
  ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x - 52, SY); ctx.lineTo(x - 52, SY - 128); ctx.moveTo(x + 52, SY); ctx.lineTo(x + 52, SY - 128); ctx.stroke();
  // striped awning
  for (let k = 0; k < 6; k++) {
    ctx.fillStyle = s.c[k % 2];
    ctx.beginPath();
    ctx.moveTo(x - 62 + k * 20.7, SY - 140); ctx.lineTo(x - 62 + (k + 1) * 20.7, SY - 140);
    ctx.lineTo(x - 62 + (k + 1) * 20.7, SY - 118); ctx.quadraticCurveTo(x - 62 + (k + 0.5) * 20.7, SY - 110, x - 62 + k * 20.7, SY - 118);
    ctx.fill();
  }
}
function drawCounter(s) {
  const x = s.x;
  ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 2;
  roundRect(x - 56, SY - 40, 112, 42, 4); ctx.fill(); ctx.stroke();
  // baskets of figs, pomegranates and bread
  const goods = ['#7a3d6b', '#d9483b', '#e3b25a'];
  for (let k = 0; k < 3; k++) {
    const bx = x - 34 + k * 34;
    ctx.fillStyle = '#c9a063';
    ctx.beginPath(); ctx.ellipse(bx, SY - 42, 15, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = goods[k];
    for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.arc(bx - 8 + j * 5.5, SY - 46 - (j % 2) * 3, 4.5, 0, TAU); ctx.fill(); }
  }
}

function drawAnimal(d) {
  const x = d.x, y = d.y;
  const bob = Math.sin(t * 5 + d.phase) * 1.5;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 5, 0, 0, TAU); ctx.fill();
  if (d.kind === 'chicken') {
    ctx.fillStyle = '#fff8ec'; ctx.strokeStyle = '#c9b89a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -14 + bob, 13, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(10, -26 + bob, 7, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(10, -34 + bob, 3.5, 0, TAU); ctx.arc(13, -33 + bob, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2a33a'; ctx.beginPath(); ctx.moveTo(16, -27 + bob); ctx.lineTo(22, -25 + bob); ctx.lineTo(16, -23 + bob); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(12, -27 + bob, 1.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f2a33a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(-3, 0); ctx.moveTo(3, -4); ctx.lineTo(3, 0); ctx.stroke();
  } else {
    const donkey = d.kind === 'donkey';
    const body = donkey ? '#9a948c' : '#f4efe4', line = donkey ? '#6f6a63' : '#bdb3a2';
    const sc = donkey ? 1.25 : 1;
    ctx.scale(sc, sc);
    ctx.strokeStyle = line; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const lx of [-14, -7, 8, 15]) { ctx.moveTo(lx, -14); ctx.lineTo(lx, 0); }
    ctx.stroke();
    ctx.fillStyle = body; ctx.strokeStyle = line; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -20 + bob, 22, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    // head
    ctx.beginPath(); ctx.ellipse(22, -32 + bob, 8, 10, 0.4, 0, TAU); ctx.fill(); ctx.stroke();
    if (donkey) {
      ctx.beginPath(); ctx.ellipse(18, -48 + bob, 3, 9, -0.2, 0, TAU); ctx.ellipse(25, -48 + bob, 3, 9, 0.2, 0, TAU); ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = '#8a7a60'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(19, -40 + bob); ctx.quadraticCurveTo(14, -48 + bob, 10, -44 + bob);
      ctx.moveTo(24, -40 + bob); ctx.quadraticCurveTo(22, -50 + bob, 17, -48 + bob); ctx.stroke();
      ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(24, -24 + bob); ctx.lineTo(27, -16 + bob); ctx.lineTo(22, -22 + bob); ctx.fill();
    }
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(24, -34 + bob, 1.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function renderStreet() {
  const L = camX - offX - 80, R = camX + W + offX + 80;
  // the street itself
  ctx.fillStyle = '#e6c98f';
  ctx.fillRect(L, SY - 4, R - L, H - SY + 20);
  ctx.fillStyle = '#d7b77c';
  for (let x = Math.floor(L / 70) * 70; x < R; x += 70) {
    ctx.beginPath(); ctx.ellipse(x + hash(x, 3) * 40, SY + 90 + hash(x, 5) * 80, 18, 5, 0, 0, TAU); ctx.fill();
  }
  for (const h of street.houses) if (h.x + h.w > L && h.x < R) drawHouse(h);
  for (const px of street.palms) if (px > L - 100 && px < R + 100) drawPalm(px, SY - 2, 1.1);
  // people on the rooftops
  for (const p of street.people) if (p.roof && !p.invited && p.x > L && p.x < R) drawStreetPerson(p);
  for (const s of street.stalls) if (s.x > L - 80 && s.x < R + 80) drawStall(s);
  // doorways and stalls
  for (const p of street.people) {
    if (p.invited || p.roof || p.kind === 'walker' || p.x < L || p.x > R) continue;
    drawStreetPerson(p);
  }
  for (const s of street.stalls) if (s.x > L - 80 && s.x < R + 80) drawCounter(s);
  // the lane: followers, the woman, animals and passers-by, back to front
  const lane = [];
  for (const p of followers) if (p.joinT > 0.35 || p.kind === 'walker') lane.push({ y: p.fy, draw: () => drawStreetPerson(p) });
  for (const p of followers) if (p.joinT <= 0.35 && p.kind !== 'walker') lane.push({ y: p.fy - 100, draw: () => drawStreetPerson(p) });
  for (const p of street.people) if (!p.invited && p.kind === 'walker' && p.x > L && p.x < R) lane.push({ y: p.y, draw: () => drawStreetPerson(p) });
  for (const d of street.decoys) if (d.x > L && d.x < R) lane.push({ y: d.y, draw: () => drawAnimal(d) });
  lane.push({ y: SY + 24, draw: () => drawPerson(WOMAN, runner.x, SY + 24, 1.15, runner.x + 200, SY - 60, WOMAN.pose) });
  lane.sort((a, b) => a.y - b.y).forEach((o) => o.draw());
  // the end of the street: the road back out to the well
  const ex = street.len + 120;
  if (ex < R + 100) {
    ctx.fillStyle = '#9a6a3c';
    ctx.fillRect(ex - 4, SY - 120, 8, 124);
    ctx.fillStyle = '#c8a06a'; ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 2;
    roundRect(ex - 60, SY - 150, 120, 36, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3a1a'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("Jacob's well →", ex, SY - 126);
  }
  drawParticles();
}

function drawStreetPerson(p) {
  const pose = p.invited && p.joinT > 0.35 ? 'run' : p.kind === 'walker' && !p.invited ? 'run' : 'stand';
  drawPerson(p, p.fx, p.fy, p.s, runner.x, SY - 40, pose);
}

// ============================================================
//  HUD
// ============================================================
function drawHudButtons() {
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
}

function meter(x, y, w, f, colA, colB, flash) {
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(x, y, w, 13, 6.5); ctx.fill();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, colA); g.addColorStop(1, colB);
  ctx.fillStyle = flash && Math.sin(t * 10) > 0 ? '#ff6b6b' : g;
  if (f > 0) { roundRect(x, y, Math.max(13, w * clamp(f, 0, 1)), 13, 6.5); ctx.fill(); }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Woman at the Well' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  const inTown = scene() === 'street';
  if (state !== 'title') {
    if (inTown) {
      ctx.fillText(`INVITED ${followers.length} / ${cfg.need}`, 12, 48);
      ctx.shadowBlur = 0;
      for (let k = 0; k < cfg.need; k++) {
        ctx.fillStyle = k < followers.length ? '#e0a526' : 'rgba(90,66,16,0.22)';
        ctx.beginPath(); ctx.arc(118 + k * 11, 44, 4.2, 0, TAU); ctx.fill();
      }
    } else if (phase !== 'arrive') {
      ctx.fillText('SLOSH', 12, 48);
      ctx.shadowBlur = 0;
      meter(58, 38, 110, slosh / 100, '#9fd1ee', '#4dabf7', slosh > 70);
    }
  }
  drawHudButtons();

  // Right side: water in the bucket, the sun timer, or progress through town
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  if (state !== 'title' && !inTown && phase !== 'arrive') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('BUCKET', rx, 20);
    ctx.shadowBlur = 0;
    meter(rx - 90, 26, 90, water / 100, '#bfe6ff', '#4dabf7', water > 0 && water < 45);
    if (timeLeft !== null) {
      const low = timeLeft < 8;
      ctx.fillStyle = low && Math.sin(t * 10) > 0 ? '#c92a2a' : '#5a4210';
      ctx.shadowBlur = 4;
      ctx.font = '700 18px Fredoka, sans-serif';
      ctx.fillText(`${Math.ceil(timeLeft)}s`, rx, 64);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffc93c';
      ctx.beginPath(); ctx.arc(rx - 48, 58, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.moveTo(rx - 48 + Math.cos(a) * 9, 58 + Math.sin(a) * 9); ctx.lineTo(rx - 48 + Math.cos(a) * 12, 58 + Math.sin(a) * 12); }
      ctx.stroke();
    }
    drawDepthGauge();
  } else if (inTown && street) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('THROUGH SYCHAR', rx, 20);
    ctx.shadowBlur = 0;
    meter(rx - 110, 26, 110, runner.x / street.len, '#f7c948', '#fff1a8', false);
  }
  ctx.restore();

  if (state === 'play' && phase === 'haul') drawHaulRing();
  if (state === 'play' && phase === 'lower') drawLowerHint();
}

// How far down the bucket is, and where the water waits
function drawDepthGauge() {
  if (phase !== 'lower' && phase !== 'fill' && phase !== 'haul') return;
  const x = viewW - 20, y0 = 104, y1 = Math.min(360, viewH * 0.42);
  const top = bucketY0(), bot = floorY();
  const map = (y) => lerp(y0, y1, (y - top) / (bot - top));
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  roundRect(x - 7, y0 - 6, 14, y1 - y0 + 12, 7); ctx.fill();
  ctx.fillStyle = '#4dabf7';
  roundRect(x - 5, map(WY()), 10, y1 - map(WY()), 4); ctx.fill();
  ctx.fillStyle = 'rgba(80,200,120,0.8)';
  ctx.fillRect(x - 7, map(WY() + FILL_IN), 14, Math.max(2, map(WY() + FILL_IN + PERFECT) - map(WY() + FILL_IN)));
  ctx.fillStyle = '#6e5a3c';
  ctx.fillRect(x - 5, y1 - 3, 10, 4);
  const by = map(bucket.y + B_OFF);
  ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 13, by - 6); ctx.lineTo(x - 5, by); ctx.lineTo(x - 13, by + 6); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawHaulRing() {
  const cx = viewW / 2, cy = viewH - 84, r = 40;
  const ready = charge >= READY;
  ctx.save();
  ctx.fillStyle = 'rgba(255,252,240,0.9)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(90,66,16,0.2)'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  // the golden zone
  ctx.strokeStyle = 'rgba(80,200,120,0.35)';
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2 + TAU * READY, -Math.PI / 2 + TAU); ctx.stroke();
  ctx.strokeStyle = ready ? '#f5b82e' : '#8fb8d8';
  if (ready) { ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 14 + Math.sin(t * 12) * 4; }
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * charge); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = ready ? '#a8741a' : '#7a8a9a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${ready ? 21 : 17}px Fredoka, sans-serif`;
  ctx.fillText(ready ? 'PULL!' : 'wait…', cx, cy + 1);
  // notes like "Too quick!"
  for (const n of notes) {
    ctx.globalAlpha = clamp(1 - n.t / 0.9, 0, 1);
    ctx.fillStyle = n.color; ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillText(n.text, cx, cy - r - 22 - n.t * 30);
  }
  ctx.restore();
}

function drawLowerHint() {
  const text = bucket.moving ? 'Tap to STOP in the water!' : bucket.y === bucketY0() ? 'Tap to let the bucket down' : 'Tap to let it down further';
  ctx.save();
  ctx.font = '700 18px Fredoka, sans-serif';
  const w = ctx.measureText(text).width + 36;
  const cx = viewW / 2, cy = viewH - 70;
  ctx.fillStyle = bucket.moving ? 'rgba(255,236,170,0.95)' : 'rgba(255,252,240,0.9)';
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(cx - w / 2, cy - 22, w, 44, 22); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8a5a00'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy + 1);
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = bubble ? viewH * 0.6 : viewH * 0.36;
  lines.forEach((l, i) => {
    ctx.strokeText(l, viewW / 2, y0 + i * 30);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, viewW / 2, y0 + i * 30);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }

  if (scene() === 'street' && street) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawStreetBg();
    ctx.setTransform(scale, 0, 0, scale, (offX - camX + sx) * scale, (offY + sy) * scale);
    renderStreet();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawPops();
  } else {
    ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY - camY + sy) * scale);
    renderWell();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }
  drawBubble();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  drawMessage();
  if (fadeT > 0) {
    ctx.fillStyle = `rgba(255,250,230,${clamp(fadeT / 0.8, 0, 1)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function womanMood() {
  if (state === 'fail') return 'dismay';
  if (state === 'win') return 'joy';
  if (shockT > 0) return 'shock';
  if (worryT > 0) return 'worried';
  if (phase === 'haul' && slosh > 65) return 'worried';
  if (bubble && bubble.who === 'jesus' && (bubble.key === 'gift' || bubble.key === 'never')) return 'wow';
  if (phase === 'talk' && bubble && bubble.key === 'sir') return 'joy';
  if (phase === 'leave' || phase === 'run' || phase === 'arrive') return 'joy';
  return 'watch';
}

function update(dt) {
  t += dt;
  phaseT += dt;
  updateParticles(dt);
  updateBlink(WOMAN, dt);
  for (const p of followers) updateBlink(p, dt);
  if (street) for (const p of street.people) if (!p.invited) updateBlink(p, dt);
  WOMAN.mood = womanMood();
  if (state === 'play') {
    updateBubbles(dt);
    if (phase === 'run') updateStreet(dt);
    else if (phase === 'arrive') updateArrive(dt);
    else updateWell(dt);
  } else if (state === 'win' || state === 'fail') {
    updateBubbles(dt);
    if (phase === 'arrive') updateArrive(dt);
    if (state === 'win' && Math.random() < dt * 12) {
      spawn(jesus.x + rand(-40, 40), jesus.y - rand(0, 90), 0, -20, 1, '#fff6d0', 3);
    }
    if (state === 'win') for (const p of followers) p.mood = 'joy';
  }
  if (jesus) jesus.speaking = !!(bubble && bubble.who === 'jesus');
  shockT = Math.max(0, shockT - dt);
  worryT = Math.max(0, worryT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  fadeT = Math.max(0, fadeT - dt);
  message.t -= dt;
  for (const n of notes) n.t += dt;
  notes = notes.filter((n) => n.t < 0.9);
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  if (state !== 'play' || phase !== 'lower' || !bucket.moving) sfx.thrust(0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
