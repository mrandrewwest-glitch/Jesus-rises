<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>The Woman at the Well</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>

Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'pipe', ambience: 'wind', percussion: false };

  fields:  { ref: 'John 4:35', KJV: 'Lift up your eyes, and look on the fields; for they are white already to harvest.', NKJV: 'Lift up your eyes and look at the fields, for they are already white for harvest!', NIV: 'Open your eyes and look at the fields! They are ripe for harvest.', NLT: 'Wake up and look around. The fields are already ripe for harvest.' },
  // Win card

  deep:    { ref: 'John 4:11', KJV: 'Sir, thou hast nothing to draw with, and the well is deep', NKJV: 'Sir, You have nothing to draw with, and the well is deep', NIV: 'Sir... you have nothing to draw with and the well is deep', NLT: 'But sir, you don’t have a rope or a bucket... and this well is very deep' },
};
// "..." marks skipped words; show it as a proper ellipsis
function verseText(key) {
  return Bible.verse(VERSES[key]).text.replace(/\s*\.\.\.\s*/g, '… ');
}
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text.replace(/\s*\.\.\.\s*/g, '… ')}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Tiny repeatable noise so each pebble keeps its place
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const GY = 600;           // the ground at Jacob's well
const SY = 770;           // the street in Sychar
const RIM = 60;           // height of the well's stone rim
const B_OFF = 50;         // bucket handle top to bucket bottom
const FALL_ACC = 520;     // how quickly the rope runs out once released
const FILL_IN = 16;       // the bucket must sink this far under the surface to fill
const PERFECT = 40;       // ...and stopping within this much more is a perfect dip
const READY = 0.8;        // the haul ring must be this full for a smooth pull
const JS = 1.25;          // size of the people at the well

const LEVEL_NAMES = [
  "Jacob's Well",
  'The Sixth Hour',
  'Deep Waters',
  'Mount Gerizim',
  'The Streets of Sychar',
  'Fields White to Harvest',
];

function makeConfig(n) {
  const k = n - 1;
  return {
    name: LEVEL_NAMES[k] || `Jacob's Well ${n}`,
    depth: Math.min(380 + k * 260, 1500),         // rim to water
    waterDepth: Math.max(210 - k * 28, 90),       // water to the muddy bottom
    maxFall: Math.min(300 + k * 40, 520),
    beat: Math.max(0.6 - k * 0.035, 0.42),        // time for the haul ring to fill
    pull: 70 + Math.min(k, 6) * 6,
    sloshK: 60 + k * 10,
    time: n === 1 ? null : Math.max(24, 38 - 4 * (n - 1)),
    people: Math.min(7 + k * 2, 17),
    need: Math.min(5 + k * 2, 15),
    decoys: Math.min(1 + k, 6),
    run: Math.min(170 + k * 22, 290),
    len: 2200 + Math.min(k, 6) * 450,
    walkers: n >= 2,
    roofs: n >= 3,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('wellBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let phase = 'lower';      // lower | fill | haul | pour | talk | leave | run | arrive
let phaseT = 0;
let bucket, jesus, jar, runner, street = null;
let water = 0, slosh = 0, charge = 0, timeLeft = null;
let camY = 0, camX = 0;
let stats = {};
let followers = [];
let particles = [];
let pops = [];
let bubble = null, bubbleQ = [];
let message = { text: '', t: 0 };
let shakeT = 0, flashT = 0, fadeT = 0, shockT = 0, worryT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let wasPaused = false;

const WOMAN = {
  robe: '#2f7f8f', hair: '#2b1a10', skin: '#d39a66', scarf: '#f1e3c2',
  i: 1, mood: 'watch', blinkT: 2, blink: 0, phase: 0,
  x: 0, y: GY, pose: 'crank', vis: true,
};

// Scene positions at the well
const WX = () => W / 2;
const JX = () => W / 2 - 150;
const HOME_X = () => W / 2 + 132;
const JAR_X = () => W / 2 + 190;
const WY = () => GY + cfg.depth;
const floorY = () => WY() + cfg.waterDepth;
const bucketY0 = () => GY - RIM - 12 - B_OFF;
const CRANK_Y = GY - 72;
const crankPos = () => ({ x: WX() + 96 + Math.cos(bucket ? bucket.y / 18 : 0) * 9, y: CRANK_Y + Math.sin(bucket ? bucket.y / 18 : 0) * 9 });

function newBucket() {
  const y = bucketY0();
  return { y, v: 0, moving: false, target: y, swing: 0, swingV: 0, pour: null };
}

// ============================================================
//  People: faces and figures (the style of the disciples in Jesus Rises)
// ============================================================
const FOLK = [
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { robe: '#d9a13a', hair: '#6b3f1d', skin: '#e3b184', scarf: '#7a4fa0' },
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56', scarf: '#e8dcc0' },
  { robe: '#c46b8c', hair: '#5c3a1c', skin: '#dca678', kid: true },
  { robe: '#5a6475', hair: '#8a8a8a', beard: true,  skin: '#c88e5a' },
  { robe: '#3c8f86', hair: '#1f140c', skin: '#b87a48', scarf: '#f2c14e' },
  { robe: '#a0673a', hair: '#3a2515', skin: '#d39a66', kid: true },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55' },
  { robe: '#b08a2e', hair: '#1c120b', skin: '#c78f5c', scarf: '#3f6fb5' },
  { robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150', scarf: '#d8c7a0' },
  { robe: '#e07a5f', hair: '#4a2f1a', skin: '#e3b184', scarf: '#f4f1de' },
  { robe: '#3f6fb5', hair: '#6b3f1d', skin: '#d9a066', kid: true },
];
const REPLIES = ['Really?', 'Coming!', 'Wait for me!', 'A prophet?', 'Show us!', "Let's go!", 'Me too!', 'Is it true?', "I'm coming!", 'Everyone, come!', 'Where is he?', 'Tell us more!'];

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function drawScarf(d, hy) {
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
}

// pose: 'stand' (arms follow the mood) | 'crank' | 'pour' (hands to o.hand) | 'run' | 'call'
function drawPerson(d, x, y, s, lookX, lookY, pose = 'stand', o = {}) {
  const mood = d.mood;
  let jump = 0;
  if (pose === 'stand' && mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  if (pose === 'run') jump = Math.abs(Math.sin(t * 13 + d.phase)) * 5;
  if (d.kid) s *= 0.78;

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const dx = lookX - x, dy = lookY - (y - 60 * s), len = Math.hypot(dx, dy) || 1;
  const lx = dx / len, ly = dy / len;
  const hy = -53;

  // Running feet peep out under the robe
  if (pose === 'run') {
    const k = Math.sin(t * 13 + d.phase);
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath();
    ctx.ellipse(-6 + k * 8, -1 - Math.max(0, k) * 4, 6, 3, 0, 0, TAU);
    ctx.ellipse(6 - k * 8, -1 - Math.max(0, -k) * 4, 6, 3, 0, 0, TAU);
    ctx.fill();
  }

  if (pose === 'stand') {
    if (mood === 'joy') {
      const wave = Math.sin(t * 9 + d.phase) * 4;
      arm(-11, -32, -24 + wave, -66);
      arm(11, -32, 24 - wave, -66);
    } else if (mood === 'wow' && d.i % 2 === 0) {
      arm(11, -32, 20 + lx * 6, -70);
    }
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  if (pose === 'stand') {
    if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && d.i % 2 !== 0)) {
      if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }
      else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
    } else if (mood === 'worried') {
      arm(-11, -32, -2, -28); arm(11, -32, 2, -28);
    }
  } else if (pose === 'crank' || pose === 'pour') {
    const [hx, hy2] = o.hand || [-24, -40];
    arm(-11, -32, hx + 3, hy2 + 4);
    arm(11, -32, hx - 3, hy2 - 2);
  } else if (pose === 'run') {
    const k = Math.sin(t * 13 + d.phase) * 7;
    arm(-11, -32, -18 + k, -16);
    arm(11, -32, 18 + k, -16);
  }

  // Head
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) drawScarf(d, hy);
  else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (pose === 'call') {
    arm(-11, -32, -9, hy + 11);
    arm(11, -32, 9, hy + 11);
  } else if (pose === 'stand') {
    if (mood === 'shock') {
      arm(-11, -32, -15, hy + 4);
      arm(11, -32, 15, hy + 4);
    } else if (mood === 'dismay' && d.i % 2 === 0) {
      arm(11, -32, 2, hy - 3);   // facepalm
      ctx.fillStyle = d.skin;
      roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
    } else if (mood === 'dismay') {
      arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
    }
  }
  ctx.restore();
}

function updateBlink(d, dt) {
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

// ============================================================
//  Jesus (drawn as in Jesus Rises; resting on a stone by the well)
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);

  if (j.sit) {
    // the stone He rests on, wearied from the journey
    ctx.fillStyle = '#b9ad9a'; ctx.strokeStyle = '#8f8472'; ctx.lineWidth = 1.5;
    roundRect(-24, -30, 46, 30, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(-18, -27, 26, 6, 3); ctx.fill();
    // lap and legs, feet toward the well
    ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14, -34); ctx.lineTo(18, -37);
    ctx.quadraticCurveTo(28, -35, 27, -25);
    ctx.lineTo(26, -3);
    ctx.quadraticCurveTo(20, 0, 14, -3);
    ctx.lineTo(14, -25); ctx.lineTo(-14, -25);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath(); ctx.ellipse(22, -1.5, 8, 3, 0, 0, TAU); ctx.fill();
    ctx.translate(0, -30);
  }

  const up = j.face === 'joy';

  if (state === 'win') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: resting on His lap, open and welcoming, one hand lifted as He speaks
  let hands = up ? [[-21, -66], [21, -66]] : j.sit ? [[-2, -6], [17, -8]] : [[-20, -22], [20, -22]];
  if (!up && j.speaking) hands[1] = [23, -34 - Math.max(0, Math.sin(t * 3)) * 6];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face: He looks toward the woman
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4 + 1, -53, 1.5, 0, TAU); ctx.arc(4 + 1, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.speaking && Math.sin(t * 14) > 0) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46.5, 2, 1.8, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  Speech bubbles
// ============================================================
// Queue a line; key is a VERSES key (looked up when shown) or plain text
function say(who, key, delay = 0) { bubbleQ.push({ who, key, delay }); }
function lineText(key) { return VERSES[key] ? verseText(key) : key; }

function updateBubbles(dt) {
  if (bubble) {
    bubble.t += dt;
    if (bubble.t >= bubble.dur) bubble = null;
  }
  if (!bubble && bubbleQ.length) {
    bubbleQ[0].delay -= dt;
    if (bubbleQ[0].delay <= 0) {
      const q = bubbleQ.shift();
      const len = lineText(q.key).length;
      bubble = { ...q, t: 0, dur: clamp(1.8 + len * 0.055, 2.6, 7) };
    }
  }
}

// Screen position of a speaker's head
function speakerPos(who) {
  if (scene() === 'street') {
    return { x: offX + runner.x - camX, y: offY + SY + 24 - 88 * 1.15 };
  }
  if (who === 'jesus') return { x: offX + jesus.x, y: offY + jesus.y - camY - (jesus.sit ? 128 : 95) };
  return { x: offX + WOMAN.x, y: offY + WOMAN.y - camY - 92 };
}

function drawSpeech(text, ax, ay, who, alpha = 1, size = 18) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const maxW = Math.min(viewW * 0.62, 340, viewW - 90);
  let lines = wrapText(text, maxW);
  const lh = size + 5;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 28;
  const h = lines.length * lh + 18;
  const top = 108;
  const offscreen = ay < top + 30 || ay > viewH - 20;
  const gauge = scene() === 'well' && (phase === 'lower' || phase === 'fill' || phase === 'haul');
  let bx = clamp(ax - w / 2, 10, viewW - w - (gauge ? 40 : 10));
  let by = offscreen ? top : Math.max(top, ay - 16 - h);
  const tail = !offscreen && ay - 6 > by + h;
  const jesusSpeaks = who === 'jesus';
  ctx.fillStyle = jesusSpeaks ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = jesusSpeaks ? '#e0a526' : '#b98a55';
  ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  if (tail) {
    const tx = clamp(ax, bx + 20, bx + w - 20);
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 10, by + h); ctx.stroke();
  }
  if (offscreen) {
    // speaker is out of view (camera down the well): name them
    ctx.font = '700 12px Fredoka, sans-serif';
    ctx.fillStyle = jesusSpeaks ? '#e0a526' : '#b98a55';
    const name = jesusSpeaks ? 'JESUS' : 'THE WOMAN';
    const nw = ctx.measureText(name).width + 14;
    roundRect(bx + 14, by - 9, nw, 17, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(name, bx + 21, by);
    ctx.font = `700 ${size}px Fredoka, sans-serif`;
  }
  ctx.fillStyle = jesusSpeaks ? '#8a5a00' : '#5a3a1a';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 14, by + 9 + lh / 2 + i * lh));
  ctx.restore();
}

function drawBubble() {
  if (!bubble) return;
  const p = speakerPos(bubble.who);
  const a = clamp(bubble.t / 0.2, 0, 1) * clamp((bubble.dur - bubble.t) / 0.3, 0, 1);
  drawSpeech('“' + lineText(bubble.key) + '”', p.x, p.y, bubble.who, a);
}

// Little pop-up bubbles in town (replies, "Baa!")
function addPop(text, x, y, o = {}) {
  pops.push({ text, x, y, t: -(o.delay || 0), dur: o.dur || 1.3, follow: o.follow || null, woman: !!o.woman });
}
function drawPops() {
  for (const p of pops) {
    if (p.t < 0) continue;
    const a = clamp(p.t / 0.12, 0, 1) * clamp((p.dur - p.t) / 0.25, 0, 1);
    let x = p.x, y = p.y;
    if (p.follow) { x = p.follow.fx; y = p.follow.fy - 95 * (p.follow.kid ? 0.8 : 1.1); }
    if (p.woman) { x = runner.x; y = SY + 24 - 100; }
    const sx = offX + x - camX, sy = offY + y - p.t * 14;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '700 15px Fredoka, sans-serif';
    const w = ctx.measureText(p.text).width + 18;
    const bx = clamp(sx - w / 2, 6, viewW - w - 6);
    ctx.fillStyle = p.woman ? '#fff4e6' : '#ffffff';
    ctx.strokeStyle = p.woman ? '#2f7f8f' : '#b98a55'; ctx.lineWidth = 2;
    roundRect(bx, sy - 26, w, 24, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3a1a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.text, bx + w / 2, sy - 14);
    ctx.restore();
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, shape = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, shape });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const r = p.size * (0.5 + a * 0.5);
    ctx.beginPath();
    if (p.shape === 'heart') {
      ctx.moveTo(p.x, p.y + r);
      ctx.bezierCurveTo(p.x - r * 2, p.y - r * 0.6, p.x - r * 0.6, p.y - r * 2, p.x, p.y - r * 0.6);
      ctx.bezierCurveTo(p.x + r * 0.6, p.y - r * 2, p.x + r * 2, p.y - r * 0.6, p.x, p.y + r);
    } else ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function droplets(x, y, n, spread = 90) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-14, 14), y, rand(-spread, spread), rand(-160, -40), rand(0.5, 0.9), Math.random() < 0.5 ? '#7cc4f2' : '#bfe6ff', rand(2, 4), 500);
  }
}

// ============================================================
//  Part 1: the bucket
// ============================================================
function tapWell() {
  if (phase === 'lower') {
    if (!bucket.moving) {
      bucket.moving = true;
      bucket.v = 0;
      sfx.creak();
    } else stopBucket(false);
  } else if (phase === 'haul') pull();
  else if (phase === 'talk') {
    if (bubble && bubble.t > 0.5) bubble.t = bubble.dur;
  }
}

function stopBucket(hitBottom) {
  const b = bucket;
  b.moving = false; b.v = 0;
  sfx.thrust(0);
  const bottom = b.y + B_OFF;
  if (hitBottom) {
    stats.muddy = true;
    water = 65;
    showMessage('Clunk! Muddy water…');
    sfx.clunk(); shakeT = 0.25; worryT = 1.2;
    beginFill();
  } else if (bottom >= WY() + FILL_IN) {
    water = 100;
    if (bottom <= WY() + FILL_IN + PERFECT) { stats.perfect = true; showMessage('Perfect dip!'); }
    else showMessage('Filled!');
    sfx.glug();
    beginFill();
  } else {
    showMessage(bottom > WY() - 8 ? 'Just touching — a little deeper!' : 'Not deep enough yet');
    sfx.bounce();
  }
}

function beginFill() {
  phase = 'fill'; phaseT = 0;
  say('woman', 'how', 0.3);
}

function pull() {
  const b = bucket;
  const q = charge;
  let amt = cfg.pull;
  if (q >= READY) {
    stats.smooth++;
    slosh = Math.max(0, slosh - 6);
  } else {
    amt *= Math.max(0.35, q);
    const add = (READY - q) / READY * cfg.sloshK;
    slosh += add;
    b.swingV += (Math.random() < 0.5 ? -1 : 1) * add * 0.05;
    droplets(WX(), b.y + 12, Math.round(add / 8));
    if (q < 0.4) addScreenNote('Too quick!', '#c92a2a');
  }
  stats.pulls++;
  b.target = Math.max(bucketY0(), b.target - amt);
  charge = 0;
  sfx.tap(1 - (b.target - bucketY0()) / (WY() - bucketY0()));
}

// small floating note near the haul ring
let notes = [];
function addScreenNote(text, color) { notes.push({ text, color, t: 0 }); }

function updateWell(dt) {
  const b = bucket;
  // the bucket swings a little on its rope
  b.swingV += (-30 * b.swing - 2.5 * b.swingV) * dt;
  b.swing = clamp(b.swing + b.swingV * dt, -0.5, 0.5);

  if (phase === 'lower' && b.moving) {
    const prev = b.y + B_OFF;
    b.v = Math.min(b.v + FALL_ACC * dt, cfg.maxFall);
    b.y += b.v * dt;
    sfx.thrust(0.25 + 0.5 * b.v / cfg.maxFall);
    const bottom = b.y + B_OFF;
    if (prev < WY() && bottom >= WY()) {
      sfx.splash();
      for (let i = 0; i < 16; i++) spawn(WX() + rand(-30, 30), WY(), rand(-60, 60), rand(-150, -50), rand(0.4, 0.8), '#bfe6ff', rand(2, 4), 400);
    }
    if (bottom >= floorY()) { b.y = floorY() - B_OFF; stopBucket(true); }
  }

  if (phase === 'fill') {
    if (Math.random() < dt * 25) spawn(WX() + rand(-12, 12), b.y + 30, rand(-5, 5), rand(-60, -30), 0.5, 'rgba(255,255,255,0.8)', rand(2, 3.5));
    if (phaseT > 0.8) {
      phase = 'haul'; phaseT = 0;
      b.target = b.y; charge = 0.5;
      if (level === 1) showMessage('Haul! Tap when the ring glows gold');
    }
  }

  if (phase === 'haul') {
    charge = Math.min(1, charge + dt / cfg.beat);
    b.y += (b.target - b.y) * Math.min(1, dt * 10);
    slosh = Math.max(0, slosh - 14 * dt);
    if (slosh > 70) {
      water -= (slosh - 70) * 0.25 * dt;
      if (Math.random() < dt * 20) droplets(WX(), b.y + 12, 1, 60);
    }
    if (slosh >= 100) {
      water -= 22; slosh = 60;
      shakeT = 0.25; shockT = 1;
      droplets(WX(), b.y + 12, 18, 140);
      showMessage('Splash!');
      sfx.splash();
    }
    const prog = 1 - (b.y - bucketY0()) / (WY() - bucketY0());
    if (!stats.giftSaid && prog > 0.3) { stats.giftSaid = true; say('jesus', 'gift', 0.2); }
    if (water < 30) { fail('spill'); return; }
    if (b.target <= bucketY0() && b.y - bucketY0() < 2) startPour();
  }

  if (phase === 'pour') updatePour(dt);

  if (phase === 'talk') {
    WOMAN.pose = 'stand';
    if (!bubble && !bubbleQ.length && phaseT > 1) {
      phase = 'leave'; phaseT = 0;
      showMessage('She left her waterpot and ran into the city!');
      WOMAN.pose = 'run';
    }
  }
  if (phase === 'leave') {
    WOMAN.x += 330 * dt;
    if (phaseT > 1.6) startRun();
  }

  // Timer: the midday sun (from level 2)
  if (timeLeft !== null && (phase === 'lower' || phase === 'fill' || phase === 'haul')) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; fail('time'); return; }
  }

  // Camera follows the bucket down the shaft
  let want = 0;
  if (phase === 'lower' || phase === 'fill' || phase === 'haul') want = clamp(b.y + B_OFF - 540, 0, floorY() + 70 - H);
  camY += (want - camY) * Math.min(1, dt * (phase === 'lower' && b.moving ? 9 : 5));
}

function startPour() {
  phase = 'pour'; phaseT = 0;
  stats.water = Math.round(water);
  WOMAN.pose = 'pour';
  sfx.pour();
}

function updatePour(dt) {
  const b = bucket;
  const f = phaseT;
  const sx = WX(), sy = bucketY0();
  const jx = JAR_X() - 34, jy = GY - 100;
  WOMAN.x = lerp(HOME_X(), WX() + 150, Math.min(1, f / 0.6));
  let px, py, tilt = 0;
  if (f < 0.6) { const e = f / 0.6; px = lerp(sx, jx, e); py = lerp(sy, jy, e) - Math.sin(e * Math.PI) * 30; }
  else if (f < 1.8) {
    px = jx; py = jy; tilt = Math.min(1, (f - 0.6) / 0.3) * 1.1;
    if (tilt > 0.9) {
      b.empty = true;
      jar.fill = Math.min(water / 100, jar.fill + dt * 1.1);
      if (Math.random() < dt * 60) spawn(px + 22, py + 16, rand(10, 25), rand(20, 60), 0.35, Math.random() < 0.5 ? '#7cc4f2' : '#bfe6ff', rand(2.5, 4), 500);
    }
  } else { const e = Math.min(1, (f - 1.8) / 0.5); px = lerp(jx, sx, e); py = lerp(jy, sy, e); tilt = 1.1 * (1 - e); }
  b.pour = { x: px, y: py, tilt };
  if (f > 2.3) {
    b.pour = null;
    phase = 'talk'; phaseT = 0;
    say('jesus', 'never', 0.3);
    say('woman', 'sir', 0.4);
  }
}

// ============================================================
//  Part 2: running through Sychar
// ============================================================
function buildStreet() {
  const len = cfg.len;
  const people = [];
  const n = cfg.people;
  const spacing = (len - 800) / n;
  const kinds = ['door', 'stall', 'door'];
  if (cfg.walkers) kinds.push('walker');
  if (cfg.roofs) kinds.push('roof', 'roof');
  const folk = [...FOLK].sort(() => Math.random() - 0.5);
  for (let i = 0; i < n; i++) {
    const x = 650 + i * spacing + rand(-spacing * 0.2, spacing * 0.2);
    const f = folk[i % folk.length];
    people.push({
      ...f, i, x, y: SY - 2, fx: x, fy: SY - 2, s: 1.1,
      kind: i === 0 ? 'door' : pick(kinds),
      mood: 'watch', blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU),
      invited: false, missed: false, joinT: 0, vx: rand(35, 60),
    });
  }
  // Houses along the street, each with a door where someone waits
  const houses = [];
  let x = -400;
  const colours = ['#ecd3a3', '#e5c48e', '#f0dcb4', '#dcb98a', '#e9cfa0'];
  while (x < len + 900) {
    const w = rand(170, 250);
    houses.push({ x, w, h: rand(170, 250), c: pick(colours), doors: [], win: Math.random() < 0.7, cloth: Math.random() < 0.35 ? pick(['#c0392b', '#3f6fb5', '#f2c14e', '#6b8e3a']) : null });
    x += w + rand(-4, 30);
  }
  const houseAt = (px) => houses.find((h) => px >= h.x && px <= h.x + h.w);
  const stalls = [];
  for (const p of people) {
    const h = houseAt(p.x);
    if (p.kind === 'roof' && h) { p.y = p.fy = SY - 60 - h.h; p.s = 0.9; p.roof = true; }
    else if (p.kind === 'roof') p.kind = 'door';
    if (p.kind === 'walker') { p.y = p.fy = SY + 52; }
    if (p.kind === 'stall') stalls.push({ x: p.x, c: pick([['#e63946', '#fff3dc'], ['#3f6fb5', '#fff3dc'], ['#e0a526', '#fff8e6']]) });
    if (p.kind === 'door' && h) h.doors.push(p.x);
  }
  for (const h of houses) if (!h.doors.length) h.doors.push(h.x + h.w * rand(0.3, 0.7));
  // Goats, chickens and donkeys: not the ones she's looking for!
  const decoys = [];
  for (let i = 0; i < cfg.decoys; i++) {
    const dx = 800 + (i + 0.5) * (len - 900) / cfg.decoys + rand(-60, 60);
    decoys.push({ x: dx, y: SY + 40, kind: pick(['goat', 'chicken', 'donkey']), hit: false, phase: rand(0, TAU) });
  }
  const palms = [];
  for (let px = 300; px < len + 600; px += rand(500, 900)) palms.push(px);
  return { len, people, houses, stalls, decoys, palms };
}

function startRun() {
  phase = 'run'; phaseT = 0;
  street = buildStreet();
  runner = { x: 0, stumble: 0, callCd: 0, callT: 0 };
  camX = runner.x - W * 0.3;
  followers = [];
  bubble = null; bubbleQ = [];
  WOMAN.pose = 'run';
  say('woman', 'come', 0.2);
  if (level === 1) setTimeout(() => { if (state === 'play' && phase === 'run' && !followers.length) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap the townspeople!' : 'Click them, or press Space when near'); }, 1200);
}

function streetTargets() {
  const list = street.people.filter((p) => !p.invited && !p.missed).map((p) => ({ p, x: p.x, y: p.y, s: p.s }));
  for (const d of street.decoys) if (!d.hit) list.push({ d, x: d.x, y: d.y, s: 1 });
  return list;
}

function tapStreet(px, py) {
  const wx = px + camX;
  let bestT = null, bestD = 1e9;
  for (const tg of streetTargets()) {
    const h = tg.p ? 88 * tg.s * (tg.p.kid ? 0.8 : 1) : 50;
    const cy = tg.y - h / 2;
    const dx = Math.abs(wx - tg.x), dy = Math.abs(py - cy);
    if (dx < 30 * tg.s + 16 && dy < h / 2 + 18) {
      const d = dx + dy * 0.5;
      if (d < bestD) { bestD = d; bestT = tg; }
    }
  }
  if (bestT) invite(bestT);
}

// Keyboard: call to whoever is nearest ahead of her
function keyStreet() {
  let bestT = null, bestD = 1e9;
  for (const tg of streetTargets()) {
    const dx = tg.x - runner.x;
    if (dx < -70 || dx > 200) continue;
    if (Math.abs(dx) < bestD) { bestD = Math.abs(dx); bestT = tg; }
  }
  if (bestT) invite(bestT);
  else if (runner.callCd <= 0) { addPop('…', runner.x, SY - 80, { dur: 0.6 }); runner.callCd = 0.3; }
}

function invite(tg) {
  if (runner.callCd > 0) return;
  if (tg.d) {
    const d = tg.d;
    d.hit = true;
    addPop({ goat: 'Baa!', chicken: 'Cluck!', donkey: 'Hee-haw!' }[d.kind], d.x, d.y - 50);
    runner.stumble = 0.7; runner.callCd = 0.8; worryT = 0.9;
    sfx.baa(d.kind);
    stats.decoysHit++;
    return;
  }
  const p = tg.p;
  p.invited = true; p.joinT = 0;
  followers.push(p);
  runner.callCd = 0.25; runner.callT = 0.5;
  addPop(verseText('comeShort') + '…', 0, 0, { woman: true, dur: 0.9 });
  addPop(pick(REPLIES), 0, 0, { follow: p, delay: 0.35, dur: 1.2 });
  for (let i = 0; i < 8; i++) spawn(p.x + rand(-15, 15), p.y - 70 * p.s, rand(-40, 40), rand(-80, -30), 0.9, pick(['#ff8fab', '#ffd166', '#fff6d0']), rand(3, 5), 0, Math.random() < 0.5 ? 'heart' : 'dot');
  sfx.tap(followers.length / cfg.people);
}

function followerTarget(k) {
  return { x: runner.x - 46 - k * 30, y: SY + 24 + (k % 2 ? -12 : 10) };
}

function updateStreet(dt) {
  const r = runner;
  r.stumble = Math.max(0, r.stumble - dt);
  r.callCd = Math.max(0, r.callCd - dt);
  r.callT = Math.max(0, r.callT - dt);
  const speed = cfg.run * (r.stumble > 0 ? 0.3 : 1);
  r.x += speed * dt;
  camX = r.x - W * 0.3;
  WOMAN.pose = r.callT > 0 ? 'call' : 'run';

  street.people.forEach((p) => {
    if (!p.invited) {
      if (p.kind === 'walker') { p.x -= p.vx * dt; p.fx = p.x; }
      if (!p.missed && p.x - camX < -50) p.missed = true;
      const near = Math.abs(p.x - r.x) < 260;
      p.mood = p.missed ? 'doubt' : near ? 'watch' : 'watch';
      return;
    }
    p.joinT += dt;
    p.mood = p.joinT < 0.8 ? 'wow' : 'joy';
    if (p.joinT > 0.35) {
      const k = followers.indexOf(p);
      const tg = followerTarget(k);
      const f = Math.min(1, dt * 4);
      p.fx += (tg.x - p.fx) * f + speed * dt * 0.2;
      p.fy += (tg.y - p.fy) * f;
      p.roof = false;
    }
  });
  for (const pp of pops) pp.t += dt;
  pops = pops.filter((pp) => pp.t < pp.dur);

  if (r.x >= street.len) {
    if (followers.length >= cfg.need) startArrive();
    else fail('few');
  }
}

// ============================================================
//  Arrival: the town comes out to Jesus
// ============================================================
function startArrive() {
  phase = 'arrive'; phaseT = 0;
  fadeT = 0.8;
  camY = 0;
  pops = [];
  jesus.sit = false; jesus.x = JX(); jesus.face = 'calm';
  WOMAN.x = JX() + 58; WOMAN.y = GY + 34; WOMAN.pose = 'stand';
  // Slots: a back row behind the well, a front row before it
  const n = followers.length;
  const front = Math.ceil(n / 2), back = n - front;
  const slots = [];
  for (let k = 0; k < back; k++) slots.push({ x: lerp(WX() - 70, W - 30, back === 1 ? 0.5 : k / (back - 1)), y: GY - 34, s: 0.9, row: 0 });
  for (let k = 0; k < front; k++) slots.push({ x: lerp(JX() + 105, W - 30, front === 1 ? 0.5 : k / (front - 1)), y: GY + 62, s: 1.1, row: 1 });
  followers.forEach((p, k) => {
    const sl = slots[k];
    p.tx = sl.x; p.ty = sl.y; p.row = sl.row; p.s = sl.s;
    p.fx = W + 60 + k * 34; p.fy = sl.y;
    p.mood = 'wow';
  });
  say('jesus', 'fields', 1.4);
}

function updateArrive(dt) {
  for (const p of followers) {
    const dx = p.tx - p.fx;
    p.fx += Math.sign(dx) * Math.min(Math.abs(dx), 240 * dt);
    p.walking = Math.abs(dx) > 1;
  }
  if (state === 'play' && !bubble && !bubbleQ.length && phaseT > 3) win();
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  jesus.face = 'joy';
  const waterPts = stats.water * 5;
  const dipPts = stats.perfect ? 200 : 0;
  const smoothPts = stats.smooth * 10;
  const invitePts = followers.length * 100 + (followers.length === cfg.people ? 300 : 0);
  const timePts = timeLeft !== null ? Math.round(timeLeft * 10) : 0;
  const levelBonus = level * 300;
  const score = waterPts + dipPts + smoothPts + invitePts + timePts + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('wellBest', best); } catch (e) {} }
  lastScore = { waterPts, dipPts, smoothPts, invitePts, timePts, levelBonus, score };
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(jesus.x, jesus.y - 50, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  showMessage('Many believed!');
  sfx.win();
  endTimer = 1.8;
}

function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  bucket.moving = false;
  sfx.thrust(0);
  for (const p of followers) p.mood = 'dismay';
  sfx.fail();
  endTimer = 1.4;
}

function showMessage(text) { message = { text, t: 2.4 }; }

function setupScene() {

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;

    const s = lastScore;
    showOverlay('Many believed!', `Level ${level} complete — ${cfg.name}`,

       <p class="score">Water drawn: <b>${s.waterPts}</b>${s.dipPts ? `<br>Perfect dip: <b>${s.dipPts}</b>` : ''}<br>Smooth pulls: <b>${s.smoothPts}</b><br>Townspeople: <b>${s.invitePts}</b>${s.timePts ? `<br>Time to spare: <b>${s.timePts}</b>` : ''}<br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = {
      spill: ['Splish, splash!', 'Most of the water sloshed out of the bucket. Wait for the golden ring &mdash; a steady rhythm keeps it in.'],
      time: ['The sun rose high', 'The hot midday sun got the better of us. Steady pulls are quicker than rushed ones.'],
      few: ['Only a few came', `Only ${followers.length} of the ${cfg.need} needed heard her call. Tap each person as you pass &mdash; but not the goats!`],
    }[failReason];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('deep')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
