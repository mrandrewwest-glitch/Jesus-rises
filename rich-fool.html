<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3d9a0">
<title>The Rich Fool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f3d9a0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Rich Fool</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// The shared sound engine's theme for this game (music.js)
Music.theme = { tune: 'doxology', instrument: 'harp', accent: 'pipe', ambience: 'birds', percussion: false };

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Title card
  beware: { ref: 'Luke 12:15', KJV: "Take heed, and beware of covetousness: for a man's life consisteth not in the abundance of the things which he possesseth.", NKJV: 'Take heed and beware of covetousness, for one’s life does not consist in the abundance of the things he possesses.', NIV: 'Watch out! Be on your guard against all kinds of greed; life does not consist in an abundance of possessions.', NLT: 'Beware! Guard against every kind of greed. Life is not measured by how much you own.' },
  // Jesus telling the story (speech bubbles)
  tell1: { ref: 'Luke 12:16', KJV: 'The ground of a certain rich man brought forth plentifully:', NKJV: 'The ground of a certain rich man yielded plentifully.', NIV: 'The ground of a certain rich man yielded an abundant harvest.', NLT: 'A rich man had a fertile farm that produced fine crops.' },
  tell2: { ref: 'Luke 12:17', KJV: 'What shall I do, because I have no room where to bestow my fruits?', NKJV: 'What shall I do, since I have no room to store my crops?', NIV: 'What shall I do? I have no place to store my crops.', NLT: 'What should I do? I don’t have room for all my crops.' },
  // Banner while the barns are pulled down and built greater
  barns: { ref: 'Luke 12:18', KJV: 'I will pull down my barns, and build greater;', NKJV: 'I will pull down my barns and build greater,', NIV: 'I will tear down my barns and build bigger ones,', NLT: 'I’ll tear down my barns and build bigger ones.' },
  // The farmer at dusk (speech bubble)
  merry: { ref: 'Luke 12:19', KJV: 'Take thine ease, eat, drink, and be merry.', NKJV: 'Take your ease; eat, drink, and be merry.', NIV: 'Take life easy; eat, drink and be merry.', NLT: 'Now take it easy! Eat, drink, and be merry!' },
  // Banner at night when grain was hoarded; also the fail card
  fool: { ref: 'Luke 12:20', KJV: 'Thou fool, this night thy soul shall be required of thee:', NKJV: 'Fool! This night your soul will be required of you;', NIV: 'You fool! This very night your life will be demanded from you.', NLT: 'You fool! You will die this very night.' },
  // Win card: Jesus's point
  rich: { ref: 'Luke 12:21', KJV: 'So is he that layeth up treasure for himself, and is not rich toward God.', NKJV: 'So is he who lays up treasure for himself, and is not rich toward God.', NIV: 'This is how it will be with whoever stores up things for themselves but is not rich toward God.', NLT: 'Yes, a person is a fool to store up earthly wealth but not have a rich relationship with God.' },
};
// A leading "..." becomes "…", and a trailing comma, semicolon or colon becomes "…" so a part-verse reads on
function verseText(key) {
  return Bible.verse(VERSES[key]).text.replace(/^\.\.\.\s*/, '…').replace(/[,;:]$/, '…');
}
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${verseText(key)}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Mix two #rrggbb colours
function mix(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((x >> s) & 255, (y >> s) & 255, f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

const isTouch = () => matchMedia('(pointer: coarse)').matches;

// ============================================================
//  Tuning
// ============================================================
const GROUND = H - 130;   // the barn floor / farmyard line
const SH = 40;            // height of one grain sack
const WALL = 26;          // thickness of a barn wall
const GRAV = 1500;        // how fast a dropped sack falls
const Q_SLOTS = 3;        // hungry villagers who can wait at the gate at once
const SACK_COLS = ['#d9b87a', '#cfa968', '#e2c48a', '#c9a26a'];

const LEVEL_NAMES = [
  'The First Harvest',
  'A Bumper Crop',
  'Fields Overflowing',
  'Barns Bursting',
  'The Greatest Harvest Ever',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Harvest ${n}`,
    sacks: Math.min(10 + (n - 1) * 2, 20),         // sacks that come in on the hoist
    villagers: Math.min(4 + (n - 1) * 2, 13),      // hungry neighbours who will come by
    sackW: Math.max(104 - (n - 1) * 7, 72),
    speed: Math.min(1.45 + (n - 1) * 0.35, 3.3),   // how fast the hoist swings
    carry: n === 1 ? 0 : Math.min(0.1 + (n - 2) * 0.07, 0.35), // dropped sacks keep some of its swing
    cap: 5,                                        // sacks the first barn holds
    night: Math.max(15 - (n - 1) * 1.5, 8),        // seconds of night to share before the reckoning
    perfect: n === 1 ? 10 : 7,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let stage = 'intro';      // intro | harvest | build | dusk | night | reckon | topple | joy
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('richFoolBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0, stageT = 0, nightT = 0;
let stack = [];           // sacks in the barn, bottom first: { x, w, col }
let drop = null;          // the sack falling from the hoist
let hook = { phase: 0, has: true, cool: 0, y: GROUND - 300 };
let barn = { cap: 5, up: true, show: 1 };
let pieces = [];          // new barn pieces to drag into place
let drag = null;
let tumblers = [];        // sacks and old walls falling over
let flyers = [];          // sacks on their way to a villager
let villagers = [];
let nextV = 0;
let particles = [], floaters = [];
let dropped = 0, lost = 0, perfects = 0, shared = 0, builds = 0;
let wob = 0, zoom = 1, skyN = 0;
let message = { text: '', t: 0 };
let bubble = null;        // Jesus speaking in the story scene
let fbubble = null;       // the farmer speaking
let banner = null;        // a verse banner across the top
let farmer = { mood: 'smug', moodT: 0 };
let trans = null;
let endTimer = 0, lastScore = null, failReason = '';
let introStep = 0, introT = 0, told = 0;
let shakeT = 0, flashT = 0;
let hinted = { share: false, build: false };

// ============================================================
//  Layout of the farmyard (world coordinates)
// ============================================================
function layout() {
  const inner = cfg.sackW * 1.8;
  const outer = inner + WALL * 2;
  const barnX = Math.max(278, Math.min(W * 0.56, W - outer / 2 - 90));
  const wallH = barn.cap * SH + 14;
  return {
    inner, outer, barnX, wallH,
    left: barnX - inner / 2, right: barnX + inner / 2,
    farmerX: Math.min(barnX + outer / 2 + 44, W - 42),
    amp: inner / 2 + 30,
    hookY: GROUND - wallH - 96,
  };
}
const queueX = (L, i) => L.barnX - L.outer / 2 - 34 - i * 48;
function backX(L, k) {
  const n = cfg.villagers;
  const x1 = L.barnX - L.outer / 2 - 18;
  return lerp(20, x1, n > 1 ? k / (n - 1) : 0.5);
}

// World <-> screen: the farm zooms out around the bottom-centre when the barn grows tall
function worldToView(x, y) {
  return { x: (x - W / 2) * zoom + W / 2 + offX, y: (y - H) * zoom + H + offY };
}
function viewToWorld(vx, vy) {
  return { x: (vx - offX - W / 2) / zoom + W / 2, y: (vy - offY - H) / zoom + H };
}

// ============================================================
//  People
// ============================================================
const PEOPLE = [
  { robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678', scarf: '#f0e2c4' },
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { robe: '#3c8f86', hair: '#1f140c', beard: false, skin: '#b87a48', scarf: '#d8c7a0' },
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { robe: '#5a6475', hair: '#2a1a0e', beard: false, skin: '#c88e5a' },
  { robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66', scarf: '#c9b27a' },
  { robe: '#4b7f4b', hair: '#2d1b0f', beard: false, skin: '#bf8150', scarf: '#f2d0d8' },
  { robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c' },
  { robe: '#6b5a9e', hair: '#4a2f1a', beard: false, skin: '#e0ae7e' },
].map((d, i) => ({ ...d, i, phase: rand(0, TAU), blink: 0, blinkT: rand(1, 4) }));

const FARMER = { robe: '#7a3fa0', hair: '#3a2716', beard: true, skin: '#dba46c', turban: '#f3e3b3', sash: '#e8b93a', i: 7, phase: 0, blink: 0, blinkT: 2 };

function tickBlink(d, dt) {
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

function drawSmallSack(x, y, w, col) {
  const h = w * 0.62;
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -55); ctx.lineWidth = 1.5;
  roundRect(x - w / 2, y - h / 2, w, h, w * 0.22); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.18, y - h / 2 + 1); ctx.lineTo(x, y - h / 2 - w * 0.2); ctx.lineTo(x + w * 0.18, y - h / 2 + 1);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - w * 0.12, y - h / 2 - 2); ctx.lineTo(x + w * 0.12, y - h / 2 - 2); ctx.stroke();
}

// A person in the house style. o: { dim, portly, hold: 'sack' | 'basket' }
function drawPerson(d, x, y, s, mood, lx, ly, o = {}) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  const dim = o.dim ? -24 : 0;
  const col = (c, a = 0) => (a + dim ? shade(c, a + dim) : c);

  ctx.save();
  ctx.translate(x, y - jump * s);
  ctx.scale(s, s);
  const pw = o.portly ? 1.32 : 1;
  const sleeve = col(d.robe, -25);
  const skin = col(d.skin);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const holdSack = o.hold === 'sack';
  const sx = 11 * pw;

  // Arms raised for joy (holding a sack up high if they have one)
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    if (holdSack) {
      arm(-sx, -32, -13, -74); arm(sx, -32, 13, -74);
      drawSmallSack(0, -84 + wave * 0.5, 34, '#d9b87a');
    } else {
      arm(-sx, -32, -24 + wave, -66);
      arm(sx, -32, 24 - wave, -66);
    }
  }

  // Robe
  ctx.fillStyle = col(d.robe);
  ctx.strokeStyle = col(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18 * pw, 0);
  ctx.quadraticCurveTo(-17 * pw - (o.portly ? 6 : 0), -26, -11 * pw, -37);
  ctx.quadraticCurveTo(0, -41, 11 * pw, -37);
  ctx.quadraticCurveTo(17 * pw + (o.portly ? 6 : 0), -26, 18 * pw, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = d.sash ? col(d.sash) : col('#c9b07a'); ctx.lineWidth = d.sash ? 4 : 2.5;
  ctx.beginPath(); ctx.moveTo(-16 * pw - (o.portly ? 4 : 0), -17); ctx.quadraticCurveTo(0, -13, 16 * pw + (o.portly ? 4 : 0), -17); ctx.stroke();
  if (d.sash) {   // a gold chain for the rich man
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -38, 9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(0, -29, 3, 0, TAU); ctx.fill();
  }

  // Resting arms, or holding things
  if (mood !== 'joy') {
    if (holdSack) {
      drawSmallSack(0, -20, 34, '#d9b87a');
      arm(-sx, -32, -15, -20); arm(sx, -32, 15, -20);
    } else if (mood === 'worried') {
      arm(-sx, -32, -2, -28); arm(sx, -32, 2, -28);           // hands clasped
    } else if (mood === 'smug') {
      arm(-sx, -32, -sx - 6, -16); arm(sx, -32, sx + 6, -16);  // hands on hips
    } else if (mood !== 'shock' && !(mood === 'dismay' && d.i % 2 === 0)) {
      arm(-sx, -32, -15 * pw, -12); arm(sx, -32, 15 * pw, -12);
    }
    if (o.hold === 'basket' && mood !== 'shock') {
      ctx.fillStyle = col('#a8743a'); ctx.strokeStyle = col('#7a4e22'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(6, -18); ctx.lineTo(28, -18); ctx.quadraticCurveTo(27, -4, 17, -4); ctx.quadraticCurveTo(7, -4, 6, -18);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = col('#7a4e22'); ctx.beginPath(); ctx.moveTo(10, -13); ctx.lineTo(24, -13); ctx.stroke();
    }
  }

  // Head
  const hy = -53;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.turban) {
    ctx.fillStyle = col(d.hair);
    ctx.beginPath(); ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    ctx.fillStyle = col(d.turban); ctx.strokeStyle = col(d.turban, -45); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, hy - 13, 19, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, hy - 10); ctx.quadraticCurveTo(0, hy - 20, 17, hy - 12); ctx.stroke();
    ctx.fillStyle = '#d6334a'; ctx.beginPath(); ctx.arc(0, hy - 13, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(0, hy - 13, 1.5, 0, TAU); ctx.fill();
  } else if (d.scarf) {
    ctx.fillStyle = col(d.scarf);
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = col(d.hair);
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard && !o.kid) {
    ctx.fillStyle = col(d.hair);
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-sx, -32, -15, hy + 4);
    arm(sx, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(sx, -32, 2, hy - 3);   // facepalm
    arm(-sx, -32, -15 * pw, -12);
    ctx.fillStyle = skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  }
  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'smug':   // the rich man admiring his grain
      eyes(3.5, 3.2, 2);
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-ex - 4, ey - 1.5); ctx.lineTo(-ex + 4, ey - 1.5); ctx.moveTo(ex - 4, ey - 1.5); ctx.lineTo(ex + 4, ey - 1.5); ctx.stroke();
      brows(-9, -10, -7, -6);
      mouthFill(() => { ctx.moveTo(-7, mouthY - 4); ctx.quadraticCurveTo(0, mouthY + 5, 7, mouthY - 4); ctx.closePath(); });
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-5, mouthY - 3); ctx.lineTo(5, mouthY - 3); ctx.stroke();
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus (as in Jesus Rises, standing to tell the story)
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Sandals
  ctx.fillStyle = '#8a5a2a';
  ctx.beginPath(); ctx.ellipse(-6, 0, 5, 2.5, 0, 0, TAU); ctx.ellipse(6, 0, 5, 2.5, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: open and welcoming; one hand lifted as He tells the story
  const lift = j.speaking ? Math.sin(t * 3) * 3 : 0;
  const hands = j.speaking ? [[-20, -22], [22, -60 + lift]] : j.face === 'joy' ? [[-21, -66], [21, -66]] : [[-20, -22], [20, -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.speaking && Math.sin(t * 12) > 0) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 1.6, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  Scenery
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#e6eef6') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// Golden hills with rows of ripe wheat
function drawFields(y0, n) {
  const x0 = -offX - 20, x1 = W + offX + 20;
  const hill = (x, base, a) => base + Math.sin(x / 120) * a + Math.sin(x / 47) * a * 0.3;
  ctx.fillStyle = mix('#c9d98f', '#3c4a6a', n * 0.6);
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, hill(x, y0, 22));
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = mix('#e8c665', '#5a5a6a', n * 0.6);
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, hill(x + 300, y0 + 60, 16));
  ctx.lineTo(x1, H); ctx.fill();
  ctx.strokeStyle = mix('#d4a940', '#4a4a5a', n * 0.6); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let r = 0; r < 4; r++) {
    for (let x = x0; x <= x1; x += 26) {
      const y = hill(x + 300, y0 + 60, 16) + 14 + r * 16;
      ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 9);
    }
  }
  ctx.stroke();
}

// ============================================================
//  Particles and floating score text
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}
function grainPuff(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = rand(Math.PI * 1.05, Math.PI * 1.95);
    spawn(x + rand(-10, 10), y, Math.cos(a) * rand(40, 150), Math.sin(a) * rand(40, 150), rand(0.5, 1), Math.random() < 0.6 ? '#f2d27a' : '#fff1c2', rand(2, 3.5), 320);
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt; f.y -= 40 * dt;
    if (f.t > 1.3) floaters.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '700 22px Fredoka, sans-serif';
  ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(1.3 - f.t, 0, 1);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function floatText(x, y, text, col = '#b57a00') { floaters.push({ x, y, text, col, t: 0 }); }

// ============================================================
//  Sacks, barn pieces and the hoist
// ============================================================
function drawSack(x, y, w, col, rot = 0) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const h = SH, hw = w / 2;
  const dark = shade(col, -55);
  ctx.fillStyle = col; ctx.strokeStyle = dark; ctx.lineWidth = 2;
  // gathered corners ("ears") of the sack
  ctx.beginPath();
  ctx.moveTo(-hw + 4, -h / 2 + 8); ctx.lineTo(-hw - 3, -h / 2 - 3); ctx.lineTo(-hw + 16, -h / 2 + 3);
  ctx.moveTo(hw - 4, -h / 2 + 8); ctx.lineTo(hw + 3, -h / 2 - 3); ctx.lineTo(hw - 16, -h / 2 + 3);
  ctx.fill(); ctx.stroke();
  roundRect(-hw, -h / 2 + 2, w, h - 2, 13); ctx.fill(); ctx.stroke();
  // a darker belly
  ctx.fillStyle = shade(col, -18);
  roundRect(-hw + 4, h / 2 - 11, w - 8, 8, 5); ctx.fill();
  // stitching along the top
  ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(-hw + 8, -h / 2 + 8); ctx.lineTo(hw - 8, -h / 2 + 8); ctx.stroke();
  ctx.setLineDash([]);
  // a stamped ear of wheat
  ctx.strokeStyle = '#9a6a2a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, h / 2 - 7); ctx.lineTo(0, -h / 2 + 12); ctx.stroke();
  ctx.fillStyle = '#9a6a2a';
  for (let k = 0; k < 3; k++) {
    const yy = -h / 2 + 14 + k * 5;
    ctx.beginPath(); ctx.ellipse(-3, yy, 2.2, 1.3, -0.6, 0, TAU); ctx.ellipse(3, yy, 2.2, 1.3, 0.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawWallPiece(len, ghost) {
  const w = WALL;
  if (ghost) {
    ctx.strokeStyle = ghost; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
    roundRect(-w / 2, -len / 2, w, len, 4); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = '#a4552f'; ctx.strokeStyle = '#6a3318'; ctx.lineWidth = 2;
  roundRect(-w / 2, -len / 2, w, len, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#bd6a40';
  ctx.fillRect(-w / 2 + 4, -len / 2 + 3, 6, len - 6);
  ctx.strokeStyle = '#7a3c1c'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let y = -len / 2 + 30; y < len / 2 - 6; y += 30) { ctx.moveTo(-w / 2 + 2, y); ctx.lineTo(w / 2 - 2, y); }
  ctx.stroke();
  ctx.fillStyle = '#3a2a1a';
  for (let y = -len / 2 + 12; y < len / 2; y += 30) { ctx.beginPath(); ctx.arc(0, y, 1.8, 0, TAU); ctx.fill(); }
}

// The roof: an open A-frame of beams with a little red ridge
function drawRoofPiece(w, ghost) {
  const h = 60;
  if (ghost) {
    ctx.strokeStyle = ghost; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(-w / 2, h / 2); ctx.lineTo(0, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#6a3318'; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(-w / 2, h / 2 - 4); ctx.lineTo(0, -h / 2); ctx.lineTo(w / 2, h / 2 - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w / 2 + 10, h / 2 - 4); ctx.lineTo(w / 2 - 10, h / 2 - 4); ctx.stroke();
  ctx.strokeStyle = '#b8653a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-w / 2, h / 2 - 4); ctx.lineTo(0, -h / 2); ctx.lineTo(w / 2, h / 2 - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w / 2 + 10, h / 2 - 4); ctx.lineTo(w / 2 - 10, h / 2 - 4); ctx.stroke();
  ctx.strokeStyle = '#8a4a2a'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, -h / 2 + 6); ctx.lineTo(0, h / 2 - 6); ctx.stroke();
  // a golden wheat sheaf at the peak
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (const a of [-0.4, 0, 0.4]) { ctx.moveTo(0, -h / 2 - 2); ctx.lineTo(Math.sin(a) * 14, -h / 2 - 2 - Math.cos(a) * 16); }
  ctx.stroke();
  ctx.fillStyle = '#f5c542';
  for (const a of [-0.4, 0, 0.4]) { ctx.beginPath(); ctx.ellipse(Math.sin(a) * 15, -h / 2 - 3 - Math.cos(a) * 17, 3, 5, a, 0, TAU); ctx.fill(); }
}

function pieceSize(p) { return p.kind === 'wall' ? { w: WALL, h: p.len } : { w: p.w, h: 60 }; }

// ============================================================
//  Villagers
// ============================================================
function arrivalAt(i) {
  const S = cfg.sacks, V = cfg.villagers;
  return Math.round(1 + i * (S - 3) / Math.max(1, V - 1));
}
function queueCount() { return villagers.filter((v) => v.slot >= 0).length; }
function fedCount() { return villagers.filter((v) => v.hasSack || v.mode === 'expect').length; }
function unfed() { return cfg.villagers - fedCount(); }
function allFed() { return fedCount() >= cfg.villagers && flyers.length === 0; }

function spawnVillagers(L) {
  const late = stage === 'dusk' || stage === 'night';
  while (nextV < cfg.villagers && (dropped >= arrivalAt(nextV) || late) && queueCount() < Q_SLOTS) {
    const used = new Set(villagers.map((v) => v.slot));
    let slot = 0;
    while (used.has(slot)) slot++;
    const k = nextV++;
    const kid = k % 3 === 2;
    villagers.push({
      d: PEOPLE[(k * 5 + 3) % PEOPLE.length], k, kid,
      x: -40 - (late ? 0 : 20), y: GROUND + 16, s: kid ? 0.74 : 1,
      slot, mode: 'walk', hasSack: false, happyT: 0, back: -1, joyT: 0,
    });
    if (!hinted.share && stack.length) {
      hinted.share = true;
      showMessage(isTouch() ? 'Tap a hungry neighbour to share!' : 'Click a hungry neighbour (or press S) to share!', 3);
    }
  }
}

function updateVillagers(dt, L) {
  let backN = villagers.filter((v) => v.back >= 0).length;
  for (const v of villagers) {
    tickBlink(v.d, dt);
    v.joyT = Math.max(0, v.joyT - dt);
    const sp = (stage === 'night' || stage === 'dusk' ? 170 : 120) * dt;
    if (v.mode === 'walk') {
      const tx = queueX(L, v.slot);
      v.x += clamp(tx - v.x, -sp, sp);
      if (Math.abs(tx - v.x) < 1) v.mode = 'wait';
    } else if (v.mode === 'wait' || v.mode === 'expect') {
      v.x = lerp(v.x, queueX(L, v.slot), Math.min(1, dt * 6));
    } else if (v.mode === 'happy') {
      v.happyT -= dt;
      if (v.happyT <= 0) { v.mode = 'toBack'; v.slot = -1; v.back = backN++; }
    } else if (v.mode === 'toBack') {
      const tx = backX(L, v.back), ty = GROUND - 22;
      v.x += clamp(tx - v.x, -sp, sp);
      v.y += clamp(ty - v.y, -sp * 0.4, sp * 0.4);
      v.s = lerp(v.s, (v.kid ? 0.74 : 1) * 0.8, Math.min(1, dt * 2));
      if (Math.abs(tx - v.x) < 1 && Math.abs(ty - v.y) < 1) v.mode = 'back';
    } else if (v.mode === 'back') {
      v.x = lerp(v.x, backX(L, v.back), Math.min(1, dt * 3));
    }
  }
}

function villagerMood(v) {
  if (state === 'win') return 'joy';
  if (v.mode === 'expect') return 'wow';
  if (v.mode === 'happy' || v.joyT > 0) return 'joy';
  if (v.hasSack) return stage === 'topple' || state === 'fail' ? 'worried' : 'watch';
  if (stage === 'topple' || state === 'fail') return 'shock';
  return 'worried';
}

function villagerAt(wx, wy) {
  let bestV = null, bd = 1e9;
  for (const v of villagers) {
    if (v.mode !== 'wait' && !(v.mode === 'walk' && v.x > 10)) continue;
    const dx = Math.abs(wx - v.x), top = v.y - 105 * v.s;
    if (dx < 34 * v.s + 8 && wy > top - 30 && wy < v.y + 22 && dx < bd) { bd = dx; bestV = v; }
  }
  return bestV;
}

function shareWith(v) {
  if (!v || stage === 'reckon' || stage === 'topple' || stage === 'intro') return;
  if (!stack.length) { showMessage(dropped < cfg.sacks ? 'Catch some grain first!' : 'The barn is empty!'); sfx.bounce(); return; }
  const s = stack.pop();
  const y = GROUND - stack.length * SH - SH / 2;
  flyers.push({ x0: s.x, y0: y, x1: v.x, y1: v.y - 30 * v.s, t: 0, dur: 0.6, w: s.w, col: s.col, v });
  v.mode = 'expect';
  shared++;
  floatText(v.x, v.y - 120 * v.s, '+150', '#2b8a3e');
  sfx.share();
  // The rich man is not pleased... at first
  const lines = ['Hey! That was MY sack!', 'Well... maybe just one.', 'Hmm... that smile is nice.', 'Sharing feels... good?'];
  const n = Math.min(shared, lines.length) - 1;
  if (shared <= 2 || shared === 4 || shared === 6) {
    farmerSay(lines[Math.min(n, lines.length - 1)], 2.2);
    setFarmer(shared <= 1 ? 'shock' : shared <= 2 ? 'worried' : 'watch', 1.8);
  }
}

function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt;
    f.v.x1 = f.v.x;
    if (f.t >= f.dur) {
      flyers.splice(i, 1);
      const v = f.v;
      v.hasSack = true; v.mode = 'happy'; v.happyT = 1.1; v.joyT = 1.5;
      for (let k = 0; k < 10; k++) spawn(v.x + rand(-16, 16), v.y - 60 * v.s, rand(-40, 40), rand(-90, -30), 0.9, k % 2 ? '#ff8fab' : '#ffe27a', rand(2.5, 4), 60);
      sfx.joy();
    }
  }
}

// ============================================================
//  The farmer
// ============================================================
function setFarmer(mood, dur = 1.5) { farmer.mood = mood; farmer.moodT = dur; }
function farmerSay(text, dur = 2.4, key = null) { fbubble = { text, key, t: dur }; }

function farmerMood() {
  if (farmer.moodT > 0) return farmer.mood;
  if (state === 'win' || stage === 'joy') return 'joy';
  if (state === 'fail') return 'dismay';
  if (stage === 'topple') return 'dismay';
  if (stage === 'reckon') return 'shock';
  if (stage === 'dusk') return 'joy';
  if (stage === 'build') return 'wow';
  if (shared >= 3) return 'watch';
  return 'smug';
}

// ============================================================
//  The harvest: dropping, stacking, toppling
// ============================================================
function dropSack() {
  if (stage !== 'harvest' || !hook.has || drop) return;
  const L = layout();
  const x = L.barnX + L.amp * Math.sin(hook.phase);
  const vx = L.amp * cfg.speed * Math.cos(hook.phase) * cfg.carry;
  drop = { x, y: hook.y + 34, vx, vy: 0, w: cfg.sackW, col: SACK_COLS[dropped % SACK_COLS.length] };
  hook.has = false; hook.cool = 0.45;
  dropped++;
  sfx.whoosh();
}

function updateHook(dt, L) {
  hook.y = lerp(hook.y, L.hookY, Math.min(1, dt * 3));
  if (stage === 'harvest') hook.phase += cfg.speed * dt;
  if (!hook.has && !drop && dropped < cfg.sacks) {
    hook.cool -= dt;
    if (hook.cool <= 0) hook.has = true;
  }
}

function updateDrop(dt, L) {
  if (!drop) return;
  drop.vy += GRAV * dt;
  drop.x += drop.vx * dt;
  drop.y += drop.vy * dt;
  const surface = GROUND - stack.length * SH;
  if (drop.y + SH / 2 >= surface) {
    drop.y = surface - SH / 2;
    landDrop(L);
  }
}

function landDrop(L) {
  const d = drop;
  drop = null;
  const n = stack.length;
  const baseX = n ? stack[n - 1].x : L.barnX;
  const dx = d.x - baseX;
  const limit = n ? d.w * 0.6 : L.inner / 2 - d.w * 0.2;
  if (Math.abs(dx) > limit) {
    // Whoops: it slides off and tumbles into the yard
    const dir = Math.sign(dx) || 1;
    tumblers.push({ kind: 'sack', x: d.x, y: d.y, vx: dir * rand(90, 150) + d.vx * 0.5, vy: -80, rot: 0, vr: dir * rand(4, 7), w: d.w, col: d.col, gy: GROUND + rand(12, 48), rest: 0, fade: true });
    lost++;
    setFarmer('shock', 1.4);
    farmerSay(lost === 1 ? 'Not my grain!' : lost === 2 ? 'Careful! That\'s mine!' : 'Oh, my precious grain!', 1.8);
    showMessage('Whoops!', 1.2);
    sfx.bounce();
  } else {
    const perfect = Math.abs(dx) <= cfg.perfect;
    const x = perfect ? baseX : d.x;
    stack.push({ x, w: d.w, col: d.col });
    wob = Math.min(3, wob + Math.abs(dx) / d.w * 1.6 + 0.15);
    grainPuff(x, GROUND - n * SH, 6);
    sfx.thud();
    if (perfect) {
      perfects++;
      floatText(x, GROUND - (n + 1) * SH - 10, 'Perfect! +25');
      for (let i = 0; i < 10; i++) spawn(x + rand(-d.w / 2, d.w / 2), GROUND - (n + 0.5) * SH, rand(-30, 30), rand(-120, -40), 0.8, '#fff1a8', rand(2, 3.5), 100);
      sfx.ding();
      if (Math.random() < 0.35) { setFarmer('joy', 1.2); farmerSay(['Beautiful! All mine!', 'More! MORE!', 'Look at all my grain!'][perfects % 3], 1.6); }
    }
    checkTopple();
  }
  // A full barn: pull it down and build greater
  if (stack.length >= barn.cap && dropped < cfg.sacks) startBuild();
}

// If the sacks above any sack lean past its edge, they tip over
function checkTopple() {
  for (let k = 0; k < stack.length - 1; k++) {
    let sum = 0;
    for (let j = k + 1; j < stack.length; j++) sum += stack[j].x;
    const com = sum / (stack.length - k - 1);
    if (Math.abs(com - stack[k].x) > stack[k].w / 2) {
      const dir = Math.sign(com - stack[k].x) || 1;
      const fall = stack.splice(k + 1);
      fall.forEach((s, i) => {
        const y = GROUND - (k + 1 + i) * SH - SH / 2;
        tumblers.push({ kind: 'sack', x: s.x, y, vx: dir * (70 + i * 45) * rand(0.8, 1.2), vy: -60 - i * 20, rot: 0, vr: dir * rand(3, 6), w: s.w, col: s.col, gy: GROUND + rand(12, 50), rest: 0, fade: true });
      });
      lost += fall.length;
      shakeT = 0.3;
      showMessage('Timber-r-r!', 1.4);
      setFarmer('shock', 1.6);
      farmerSay('My grain!!', 1.6);
      sfx.crash();
      return;
    }
  }
}

function updateTumblers(dt) {
  for (let i = tumblers.length - 1; i >= 0; i--) {
    const b = tumblers[i];
    if (b.rest > 0) {
      b.rest += dt;
      if (b.fade && b.rest > (b.kind === 'sack' ? 2.5 : 0.9)) tumblers.splice(i, 1);
      continue;
    }
    if (b.pivot) {
      b.va += Math.sign(b.va) * 6 * dt;
      b.ang += b.va * dt;
      if (Math.abs(b.ang) >= Math.PI / 2) {
        b.ang = Math.sign(b.ang) * Math.PI / 2;
        b.rest = 0.001;
        for (let k = 0; k < 12; k++) spawn(b.px + Math.sign(b.ang) * rand(0, b.len), GROUND, rand(-40, 40), rand(-90, -20), 0.7, '#e8d3aa', rand(3, 5), 120);
        sfx.bump();
      }
      b.rot = b.ang;
      b.x = b.px + Math.sin(b.ang) * b.len / 2;
      b.y = GROUND - Math.cos(b.ang) * b.len / 2 - Math.abs(Math.sin(b.ang)) * WALL / 2;
      continue;
    }
    b.vy += GRAV * 0.8 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    if (b.y >= b.gy) {
      b.y = b.gy;
      if (b.vy > 160) {
        b.vy = -b.vy * 0.35; b.vx *= 0.6; b.vr *= 0.5;
        if (b.kind === 'sack') { grainPuff(b.x, b.y + 10, 8); sfx.bump(); }
      } else {
        b.vy = 0; b.vx = 0; b.vr = 0;
        b.rot = Math.round(b.rot / Math.PI) * Math.PI;
        b.rest = 0.001;
      }
    }
  }
}

// ============================================================
//  Pulling down the barns and building greater
// ============================================================
function startBuild() {
  const L = layout();
  stage = 'build';
  builds++;
  // Down come the old walls and roof
  // each wall tips over outward like a felled tree
  for (const [px, dir] of [[L.left - WALL / 2, -1], [L.right + WALL / 2, 1]]) {
    tumblers.push({ kind: 'wall', pivot: true, px, len: L.wallH, ang: 0, va: dir * 0.6, x: px, y: GROUND - L.wallH / 2, rot: 0, rest: 0, fade: true });
  }
  tumblers.push({ kind: 'roof', w: L.outer + 36, x: L.barnX, y: GROUND - L.wallH - 26, vx: rand(-40, 40), vy: -380, rot: 0, vr: rand(-3, 3), gy: GROUND + 20, rest: 0, fade: true });
  barn.up = false; barn.show = 0;
  barn.cap += 4;
  const L2 = layout();
  const mk = (kind, hy, tx, ty, extra) => ({ kind, hx: L2.barnX, hy, hrot: kind === 'wall' ? Math.PI / 2 : 0, hs: kind === 'wall' ? 0.7 : 0.5, tx, ty, x: W + 400, y: hy, rot: kind === 'wall' ? Math.PI / 2 : 0, s: kind === 'wall' ? 0.7 : 0.5, u: 0, placed: false, ...extra });
  pieces = [
    mk('wall', GROUND + 44, L2.left - WALL / 2, GROUND - L2.wallH / 2, { len: L2.wallH }),
    mk('wall', GROUND + 80, L2.right + WALL / 2, GROUND - L2.wallH / 2, { len: L2.wallH }),
    mk('roof', GROUND + 110, L2.barnX, GROUND - L2.wallH - 26, { w: L2.outer + 36 }),
  ];
  pieces[1].x = W + 600; pieces[2].x = W + 800;
  if (builds === 1) banner = { key: 'barns', t: 5 };
  farmerSay(builds === 1 ? 'No room! Bigger barns!' : 'BIGGER barns! BIGGER!', 2.4);
  setFarmer('wow', 2);
  shakeT = 0.25;
  sfx.crash();
  if (!hinted.build) {
    hinted.build = true;
    setTimeout(() => { if (stage === 'build') showMessage(isTouch() ? 'Drag the new barn pieces into place!' : 'Drag the pieces into place (or press Space)', 3.2); }, 900);
  }
}

// Which target a piece should go to: walls fill whichever wall slot is still empty and nearer
function pieceTarget(p) {
  if (p.kind !== 'wall') return { x: p.tx, y: p.ty };
  const walls = pieces.filter((q) => q.kind === 'wall');
  const other = walls.find((q) => q !== p);
  const slots = [walls[0].tx, walls[1].tx].map((x) => ({ x, y: p.ty }));
  const free = slots.filter((s) => !(other.placed && Math.abs(other.gx - s.x) < 1));
  return free.sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x))[0] || slots[0];
}

function placePiece(p) {
  const tg = pieceTarget(p);
  p.placed = true; p.gx = tg.x; p.gy = tg.y;
  sfx.hammer();
  for (let i = 0; i < 12; i++) spawn(tg.x + rand(-20, 20), tg.y + rand(-30, 30), rand(-80, 80), rand(-80, 20), 0.6, '#e8d3aa', rand(2, 4), 200);
}

function finishBuild() {
  if (stage !== 'build' || !pieces.every((q) => q.placed)) return;
  barn.up = true; barn.show = 0;
  pieces = [];
  stage = 'harvest';
  showMessage('Greater barns!', 1.6);
  farmerSay('Room for MORE!', 1.8);
  setFarmer('joy', 1.4);
  sfx.ding();
}

let buildDoneT = 0;
function updatePieces(dt) {
  // a short pause after the last piece goes on, then back to the harvest
  if (stage === 'build' && pieces.length && pieces.every((q) => q.placed)) {
    buildDoneT += dt;
    if (buildDoneT > 0.4) { buildDoneT = 0; finishBuild(); return; }
  } else buildDoneT = 0;
  for (const p of pieces) {
    const lifted = drag && drag.p === p;
    const goalU = p.placed || lifted ? 1 : 0;
    p.u += (goalU - p.u) * Math.min(1, dt * 10);
    p.rot = lerp(p.hrot, 0, p.u);
    p.s = lerp(p.hs, 1, p.u);
    if (lifted) continue;
    const gx = p.placed ? p.gx : p.hx, gy = p.placed ? p.gy : p.hy;
    const f = Math.min(1, dt * (p.placed ? 14 : 7));
    p.x += (gx - p.x) * f; p.y += (gy - p.y) * f;
  }
}

function pieceAt(wx, wy) {
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    if (p.placed) continue;
    const sz = pieceSize(p);
    const c = Math.cos(-p.rot), s = Math.sin(-p.rot);
    const dx = wx - p.x, dy = wy - p.y;
    const lx = (dx * c - dy * s) / p.s, ly = (dx * s + dy * c) / p.s;
    const pad = 24 / p.s;
    if (Math.abs(lx) < sz.w / 2 + pad && Math.abs(ly) < sz.h / 2 + pad) return p;
  }
  return null;
}

function releaseDrag() {
  if (!drag) return;
  const p = drag.p;
  drag = null;
  const tg = pieceTarget(p);
  if (Math.hypot(p.x - tg.x, p.y - tg.y) < 120) placePiece(p);
  else { sfx.bounce(); showMessage('Drop it on the dashed outline', 1.6); }
}

// ============================================================
//  Dusk, night, and the reckoning
// ============================================================
function startDusk() {
  stage = 'dusk'; stageT = 0;
  farmerSay('', 3.6, 'merry');
  setFarmer('joy', 3.6);
}

function startNight() {
  stage = 'night'; nightT = 0;
  showMessage('Night is falling… share with the hungry!', 3);
}

function startReckon() {
  stage = 'reckon'; stageT = 0;
  banner = { key: 'fool', t: 4.2 };
  fbubble = null;
  setFarmer('shock', 2.4);
  sfx.rumble();
}

function startTopple() {
  stage = 'topple'; stageT = 0;
  const dir = Math.random() < 0.5 ? -1 : 1;
  stack.forEach((s, i) => {
    const y = GROUND - i * SH - SH / 2;
    const d = i % 3 === 2 ? -dir : dir;   // a few fly the other way, comically
    tumblers.push({ kind: 'sack', x: s.x, y, vx: d * (30 + i * 36) * rand(0.8, 1.25), vy: -100 - i * 18, rot: 0, vr: d * rand(3, 8), w: s.w, col: s.col, gy: GROUND + rand(10, 60), rest: 0, fade: false });
  });
  stack = [];
  shakeT = 0.5;
  sfx.crash();
  setTimeout(() => sfx.crash(), 250);
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  stage = 'joy';
  const sharedPts = shared * 150;
  const perfectPts = perfects * 25;
  const keptPts = stack.length * 10;
  const bonus = 500 + level * 200;
  const score = sharedPts + perfectPts + keptPts + bonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('richFoolBest', best); } catch (e) {} }
  lastScore = { sharedPts, perfectPts, keptPts, bonus, score };
  const L = layout();
  for (let i = 0; i < 80; i++) {
    const a = rand(0, TAU), sp = rand(40, 200);
    spawn(L.barnX + rand(-100, 100), GROUND - 150, Math.cos(a) * sp, Math.sin(a) * sp - 60, rand(0.9, 1.9),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 40);
  }
  farmerSay('Sharing is… wonderful!', 3);
  showMessage('Rich toward God!', 2.4);
  sfx.win();
  syncAmbience();
  endTimer = 2.6;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  sfx.fail();
  syncAmbience();
  endTimer = 1.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  stage = 'intro';
  cfg = makeConfig(1);
  showOverlay('The Rich Fool', 'A Parable of Sharing',
    `${verseHTML('beware')}
     <ul>
       <li>The harvest pours in! <b>Drop the grain sacks</b> from the swinging hoist and <b>stack them neatly</b> in the barn.</li>
       <li>Barn full? Pull it down and <b>drag the pieces</b> of a bigger one into place.</li>
       <li>Hungry neighbours will come by. <b>Share a sack</b> with each one &mdash; sharing scores far more than hoarding!</li>
       <li><b>Touch:</b> tap to drop a sack, tap a neighbour to share. <b>Keyboard:</b> <kbd>Space</kbd> / <kbd>&darr;</kbd> to drop, <kbd>S</kbd> to share.</li>
       <li>Share with everyone before the night is over&hellip;</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Tell me the story', () => { level = 1; totalScore = 0; told = 0; startLevel(); });
}

// retry = true skips Jesus telling the story and goes straight to the harvest
function startLevel(retry = false) {
  cfg = makeConfig(level);
  state = 'play';
  stack = []; drop = null; tumblers = []; flyers = []; villagers = []; pieces = []; drag = null;
  particles = []; floaters = [];
  nextV = 0; dropped = 0; lost = 0; perfects = 0; shared = 0; builds = 0;
  barn = { cap: cfg.cap, up: true, show: 1 };
  hook = { phase: -Math.PI / 2 + 0.4, has: true, cool: 0, y: layout().hookY };
  wob = 0; skyN = 0; nightT = 0; stageT = 0;
  banner = null; fbubble = null; bubble = null; trans = null;
  farmer = { mood: 'smug', moodT: 0 };
  shakeT = flashT = 0; endTimer = 0;
  hideOverlay();
  sfx.levelStart();
  syncAmbience();
  if (retry || told === level) startHarvest();
  else { told = level; startIntro(); }
}

// ---- Jesus tells the story ----
const introDur = () => (level === 1 ? [4.6, 5.4] : [3.4, 4]);
function say(key, dur) { bubble = { key, t: dur }; }
function startIntro() {
  stage = 'intro';
  introStep = 0; introT = 0;
  say('tell1', introDur()[0]);
  showMessage(level === 1 ? 'Jesus told the people a story…' : `Level ${level}: ${cfg.name}`, 2.4);
}
function advanceIntro() {
  if (trans || state !== 'play' || stage !== 'intro') return;
  if (introStep === 0) {
    introStep = 1; introT = 0;
    say('tell2', introDur()[1]);
  } else {
    if (bubble) bubble.t = Math.min(bubble.t, 0.4);
    goStage(startHarvest);
  }
}
function updateIntro(dt) {
  introT += dt;
  if (!trans && introT > introDur()[introStep]) advanceIntro();
}

function startHarvest() {
  stage = 'harvest';
  bubble = null;
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  farmerSay(level === 1 ? 'What a harvest! Stack it ALL up!' : 'Even MORE grain! Hooray for me!', 2.6);
  if (level === 1) setTimeout(() => { if (state === 'play' && stage === 'harvest' && dropped === 0) showMessage(isTouch() ? 'Tap to drop a sack' : 'Press Space (or click) to drop a sack', 2.6); }, 2500);
}

// Fade out, switch scene, fade back in
function goStage(fn) {
  if (trans) return;
  trans = { t: 0, fn, called: false };
}
function updateTrans(dt) {
  if (!trans) return;
  trans.t += dt;
  if (!trans.called && trans.t >= 0.45) { trans.called = true; trans.fn(); }
  if (trans && trans.t >= 0.9) trans = null;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Rich toward God!', `Level ${level} complete — ${cfg.name}`,
      `<p style="text-align:center">Every hungry neighbour had grain for supper, and the rich man learned the joy of giving.</p>
       ${verseHTML('rich')}
       <p class="score">Sacks shared: <b>${s.sharedPts}</b><br>Neat stacking: <b>${s.perfectPts}</b><br>Sacks kept: <b>${s.keptPts}</b><br>Rich toward God bonus: <b>${s.bonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Harvest', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'spilled'
      ? ['Oh… no!', 'Too much grain tumbled off the stack, so there wasn\'t enough to share. Stack carefully, and share as you go!']
      : ['This night…', 'The barns were full, but hungry neighbours went without. Share your grain before the night is over!'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('fool')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    drag = null;
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
    syncAmbience();
  }
}

// ============================================================
//  Input
// ============================================================
function primaryAction() {
  if (state !== 'play') return;
  if (stage === 'intro') advanceIntro();
  else if (stage === 'harvest') dropSack();
  else if (stage === 'build') { const p = pieces.find((q) => !q.placed); if (p && !drag) placePiece(p); }
}
function shareNext() {
  if (state !== 'play') return;
  const L = layout();
  const v = villagers.filter((q) => q.mode === 'wait').sort((a, b) => Math.abs(a.x - L.barnX) - Math.abs(b.x - L.barnX))[0];
  if (v) shareWith(v);
  else showMessage('No one is waiting just now', 1.4);
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') primaryAction();
  if (e.code === 'KeyS' || e.code === 'ArrowLeft') shareNext();
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play' || trans) return;
  if (stage === 'intro') { advanceIntro(); return; }
  const w = viewToWorld(p.vx, p.vy);
  const v = villagerAt(w.x, w.y);
  if (v) { shareWith(v); return; }
  if (stage === 'build') {
    const pc = pieceAt(w.x, w.y);
    if (pc) {
      drag = { p: pc, id: e.pointerId };
      pieces.splice(pieces.indexOf(pc), 1); pieces.push(pc);   // lift to the top
      pc.x = w.x; pc.y = w.y;
      sfx.tick();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return;
  }
  if (stage === 'harvest') dropSack();
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || state !== 'play') return;
  const p = toPlayfield(e);
  const w = viewToWorld(p.vx, p.vy);
  drag.p.x = w.x; drag.p.y = w.y;
});
canvas.addEventListener('pointerup', () => { sfx.init(); releaseDrag(); });
canvas.addEventListener('pointercancel', () => releaseDrag());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound: the shared harp-and-pipe music (music.js) plus little farm effects
// ============================================================
// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
    } catch (e) { this.ctx = null; }
    syncAmbience();
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, type = 'bandpass', delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  fail() { Music.fail(); },
  tap(height) { if (this.ctx) { this.puff(0.15); Music.tap(height); } },
  puff(vol = 0.35) { this.noiseBurst(1100, 0.16, vol); },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  thunder() { this.noiseBurst(400, 1.2, 0.9, 'lowpass'); },
  // extra little effects for the farm
  whoosh() { this.noiseBurst(1400, 0.18, 0.12); },
  thud() { this.tone(130, 0.16, 'triangle', 0.35, 0, 70); this.noiseBurst(500, 0.12, 0.25, 'lowpass'); },
  bump() { this.tone(110, 0.12, 'triangle', 0.25, 0, 60); },
  ding() { this.tone(880, 0.14, 'sine', 0.2); this.tone(1320, 0.2, 'sine', 0.16, 0.07); },
  tick() { this.tone(600, 0.06, 'triangle', 0.15); },
  hammer() { this.noiseBurst(2200, 0.06, 0.4, 'bandpass'); this.tone(300, 0.08, 'square', 0.08); this.noiseBurst(2200, 0.06, 0.35, 'bandpass', 0.14); this.tone(320, 0.08, 'square', 0.07, 0.14); },
  share() { this.tone(523, 0.12, 'sine', 0.2); this.tone(659, 0.12, 'sine', 0.2, 0.08); this.tone(784, 0.2, 'sine', 0.2, 0.16); },
  joy() { this.tap(Math.min(1, 0.3 + shared * 0.08)); },   // a rising note for each neighbour fed
  crash() { this.noiseBurst(300, 0.5, 0.5, 'lowpass'); this.tone(90, 0.3, 'triangle', 0.3, 0, 50); },
  rumble() { this.noiseBurst(180, 1.6, 0.35, 'lowpass'); this.tone(70, 1.4, 'sine', 0.2, 0, 55); },
};

// ============================================================
//  Rendering: the story scene
// ============================================================
function storyLayout() {
  const k = clamp(W / 640, 1, 1.4);      // bigger figures on wide screens
  const jx = Math.max(80, W * 0.2);
  const gy = H - 150;
  const slots = [];
  const x0 = jx + 95 * k, x1 = W - 34 * k;
  const nBack = clamp(Math.floor((x1 - x0) / (62 * k)), 3, 8), nFront = clamp(Math.floor((x1 - x0 + 40) / (70 * k)), 3, 8);
  for (let i = 0; i < nBack; i++) slots.push({ d: PEOPLE[(i * 2 + 1) % PEOPLE.length], x: lerp(x0 + 20, x1, nBack === 1 ? 0.5 : i / (nBack - 1)), y: gy - 26, s: 1.05 * k, row: 0 });
  for (let i = 0; i < nFront; i++) slots.push({ d: PEOPLE[(i * 2) % PEOPLE.length], x: lerp(x0 - 10, x1 - 16, nFront === 1 ? 0.5 : i / (nFront - 1)), y: gy + 40, s: 1.25 * k, row: 1, kid: i % 3 === 1 });
  return { jx, gy, slots, k };
}

function inStory() {
  return state === 'title' || (state === 'play' || state === 'pause') && stage === 'intro';
}

function drawStory() {
  const L = storyLayout();
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#fff3cf'); g.addColorStop(0.35, '#ffe0a8'); g.addColorStop(0.62, '#bfe3f5'); g.addColorStop(1, '#9fd1ee');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  const sg = ctx.createRadialGradient(W * 0.78, 190, 10, W * 0.78, 190, 140);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * 0.78, 190, 140, 0, TAU); ctx.fill();
  for (const [cx, cy, w] of [[W * 0.25, 170, 140], [W * 0.6, 110, 110]]) drawCloud(cx, cy, w, w * 0.3);
  drawFields(H - 360, 0);
  // a little barn far away on the golden hills
  const bx = W * 0.62, by = H - 318;
  ctx.fillStyle = '#b5553a'; ctx.fillRect(bx - 22, by - 24, 44, 26);
  ctx.fillStyle = '#7a3a22'; ctx.beginPath(); ctx.moveTo(bx - 27, by - 22); ctx.lineTo(bx, by - 42); ctx.lineTo(bx + 27, by - 22); ctx.fill();
  ctx.fillStyle = '#e8d3aa'; ctx.fillRect(bx - 6, by - 14, 12, 16);
  // near hill where the crowd sits
  ctx.fillStyle = '#8fc06a';
  ctx.beginPath(); ctx.moveTo(-offX, H + 10);
  for (let x = -offX; x <= W + offX + 10; x += 10) ctx.lineTo(x, L.gy - 60 + Math.sin(x / 160) * 10);
  ctx.lineTo(W + offX, H + 10); ctx.fill();
  ctx.fillStyle = '#7aae55';
  ctx.fillRect(-offX, H - 60, viewW, 70);
  for (let k = 0; k < 18; k++) {
    const fx = hash(k, 1) * W, fy = L.gy - 30 + hash(k, 2) * 170;
    ctx.fillStyle = ['#fff', '#ffd166', '#f28fb1'][k % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
  }
  // the rock Jesus stands on
  ctx.fillStyle = '#a89a86';
  ctx.beginPath(); ctx.ellipse(L.jx, L.gy + 6, 50 * L.k, 20 * L.k, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c2b5a0';
  ctx.beginPath(); ctx.ellipse(L.jx - 6, L.gy - 2, 40 * L.k, 12 * L.k, 0, 0, TAU); ctx.fill();

  const speaking = state === 'play' && bubble && bubble.t > 0.3;
  const js = 1.55 * L.k;
  const jHead = { x: L.jx, y: L.gy - 4 - 55 * js };
  const mood = state === 'play' && introStep === 1 ? 'wow' : 'watch';
  const look = (s) => { const dx = jHead.x - s.x, dy = jHead.y - (s.y - 55 * s.s), l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  for (const s of L.slots) if (s.row === 0) { const [lx, ly] = look(s); drawPerson(s.d, s.x, s.y, s.s, (s.d.i % 4 === 1 && mood === 'wow') ? 'worried' : mood, lx, ly, { dim: true }); }
  drawJesus({ x: L.jx, y: L.gy - 4, s: js, face: 'calm', speaking });
  for (const s of L.slots) if (s.row === 1) { const [lx, ly] = look(s); drawPerson(s.d, s.x, s.y, s.s * (s.kid ? 0.8 : 1), mood, lx, ly, { kid: s.kid }); }

  if (state === 'play' && introT > 0.8 && !trans) {
    ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(90,66,16,${0.5 + 0.3 * Math.sin(t * 4)})`;
    ctx.fillText(isTouch() ? 'Tap to continue' : 'Click or press Space to continue', W / 2, H - 24);
  }
}

// ============================================================
//  Rendering: the farm
// ============================================================
function drawFarmSky() {
  const n = skyN;
  const top = n < 0.5 ? mix('#fff0c8', '#f7b77a', n * 2) : mix('#f7b77a', '#1d2552', (n - 0.5) * 2);
  const mid = n < 0.5 ? mix('#ffe1a0', '#f59a6a', n * 2) : mix('#f59a6a', '#3a3f78', (n - 0.5) * 2);
  const low = n < 0.5 ? mix('#bfe3f5', '#e9a3a0', n * 2) : mix('#e9a3a0', '#5a5f94', (n - 0.5) * 2);
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, top); g.addColorStop(0.45, mid); g.addColorStop(0.8, low);
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // stars
  if (n > 0.55) {
    ctx.fillStyle = `rgba(255,250,220,${(n - 0.55) * 2})`;
    for (let k = 0; k < 40; k++) {
      const x = -offX + hash(k, 7) * viewW, y = -offY + hash(k, 9) * (offY + H * 0.5);
      const r = 1 + hash(k, 3) * 1.5 + Math.sin(t * 3 + k) * 0.4;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
  }
  // the sun sinks as the day goes on; the moon rises through the night
  const sunY = lerp(170, H - 250, clamp(n / 0.6, 0, 1));
  if (n < 0.7) {
    const sg = ctx.createRadialGradient(W * 0.8, sunY, 10, W * 0.8, sunY, 130);
    sg.addColorStop(0, `rgba(255,248,215,${1 - n})`); sg.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * 0.8, sunY, 130, 0, TAU); ctx.fill();
    ctx.fillStyle = mix('#fff4c8', '#ff9a5a', clamp(n * 1.6, 0, 1));
    ctx.beginPath(); ctx.arc(W * 0.8, sunY, 34, 0, TAU); ctx.fill();
  }
  if (n > 0.5) {
    const f = stage === 'night' ? clamp(nightT / cfg.night, 0, 1) : stage === 'dusk' ? 0 : 1;
    const mx = W * 0.2, my = lerp(H - 300, 150 - offY * 0.5, f);
    ctx.globalAlpha = clamp((n - 0.5) * 3, 0, 1);
    const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 90);
    mg.addColorStop(0, 'rgba(255,250,220,0.5)'); mg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 90, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6d6';
    ctx.beginPath(); ctx.arc(mx, my, 28, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ebe0b8';
    ctx.beginPath(); ctx.arc(mx - 9, my - 6, 6, 0, TAU); ctx.arc(mx + 8, my + 7, 8, 0, TAU); ctx.arc(mx + 10, my - 11, 4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  const cloudTop = mix('#ffffff', '#6a6f9c', n), cloudUnder = mix('#e6eef6', '#4a4f7c', n);
  for (const [f, cy, w, sp] of [[0.2, 150, 130, 6], [0.65, 90, 100, 9], [0.9, 230, 90, 5]]) {
    const cx = ((f * (W + 300) + t * sp) % (W + 300)) - 150;
    drawCloud(cx, cy, w, w * 0.3, cloudTop, cloudUnder);
  }
  drawFields(H - 330, n);
}

function drawGround(L) {
  const n = skyN;
  const x0 = -W, x1 = 2 * W;
  ctx.fillStyle = mix('#8fc06a', '#3a5a4a', n * 0.7);
  ctx.fillRect(x0, GROUND - 30, x1 - x0, H * 2);
  ctx.fillStyle = mix('#a4cf78', '#44664f', n * 0.7);
  ctx.beginPath(); ctx.moveTo(x0, GROUND - 30);
  for (let x = x0; x <= x1; x += 30) ctx.lineTo(x, GROUND - 32 + Math.sin(x / 70) * 4);
  ctx.lineTo(x1, GROUND - 20); ctx.lineTo(x0, GROUND - 20); ctx.fill();
  // the dusty farmyard in front of the barn
  ctx.fillStyle = mix('#dcc08a', '#5a5460', n * 0.7);
  ctx.beginPath(); ctx.ellipse(L.barnX, GROUND + 50, L.outer * 1.1 + 60, 70, 0, 0, TAU); ctx.fill();
  // tufts of grass
  ctx.strokeStyle = mix('#6f9e4a', '#2f4a3a', n * 0.7); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 40; k++) {
    const x = -offX / zoom + hash(k, 4) * (W + 2 * offX) / zoom, y = GROUND + 20 + hash(k, 5) * 100;
    if (Math.abs(x - L.barnX) < L.outer * 1.1 + 40 && y < GROUND + 110) continue;
    ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 8); ctx.moveTo(x, y); ctx.lineTo(x, y - 10); ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 8);
  }
  ctx.stroke();
  // the farmer's house and a haystack on wide screens
  const hx = L.farmerX + 150;
  if (hx + 80 < W + offX) {
    ctx.fillStyle = mix('#ead7b0', '#6a6470', n * 0.7); ctx.fillRect(hx - 60, GROUND - 120, 120, 100);
    ctx.fillStyle = mix('#b89a6a', '#4a4450', n * 0.7); ctx.fillRect(hx - 66, GROUND - 126, 132, 10);
    ctx.fillStyle = mix('#6b5238', '#2a2430', n * 0.5); roundRect(hx - 14, GROUND - 70, 28, 50, [12, 12, 0, 0]); ctx.fill();
    ctx.fillStyle = n > 0.6 ? '#ffd76a' : mix('#6b5238', '#2a2430', n); ctx.fillRect(hx + 22, GROUND - 100, 18, 16); ctx.fillRect(hx - 40, GROUND - 100, 18, 16);
  }
  const sx = L.barnX - L.outer / 2 - 190;
  if (sx > -offX / zoom + 40 && W > 700) {
    ctx.fillStyle = mix('#e8c665', '#5a5a5a', n * 0.7);
    ctx.beginPath(); ctx.moveTo(sx - 50, GROUND - 24); ctx.quadraticCurveTo(sx, GROUND - 130, sx + 50, GROUND - 24); ctx.fill();
  }
}

function drawBarn(L) {
  const n = skyN;
  const a = barn.show;
  if (!barn.up) {
    // just the stone floor while the new barn goes up
    ctx.fillStyle = mix('#b8a88a', '#4a4650', n * 0.7);
    roundRect(L.left - WALL - 6, GROUND - 4, L.outer + 12, 14, 5); ctx.fill();
    return;
  }
  ctx.globalAlpha = a;
  // back wall of planks
  ctx.fillStyle = mix('#c86a44', '#5a3a44', n * 0.6);
  ctx.fillRect(L.left, GROUND - L.wallH, L.inner, L.wallH);
  ctx.strokeStyle = mix('#a8543a', '#4a2a34', n * 0.6); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = L.left + 24; x < L.right; x += 24) { ctx.moveTo(x, GROUND - L.wallH); ctx.lineTo(x, GROUND); }
  ctx.stroke();
  // a big white X brace like a real barn
  ctx.strokeStyle = mix('#f3e6cc', '#8a8494', n * 0.6); ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(L.left + 6, GROUND - 6); ctx.lineTo(L.right - 6, GROUND - L.wallH + 6);
  ctx.moveTo(L.right - 6, GROUND - 6); ctx.lineTo(L.left + 6, GROUND - L.wallH + 6);
  ctx.stroke();
  ctx.fillStyle = mix('#b8a88a', '#4a4650', n * 0.7);
  roundRect(L.left - WALL - 6, GROUND - 4, L.outer + 12, 14, 5); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawBarnFront(L) {
  if (!barn.up) return;
  ctx.globalAlpha = barn.show;
  for (const x of [L.left - WALL / 2, L.right + WALL / 2]) {
    ctx.save(); ctx.translate(x, GROUND - L.wallH / 2); drawWallPiece(L.wallH); ctx.restore();
  }
  ctx.save(); ctx.translate(L.barnX, GROUND - L.wallH - 26); drawRoofPiece(L.outer + 36); ctx.restore();
  ctx.globalAlpha = 1;
}

function stackSway() {
  let amp = wob * 0.004;
  if (stage === 'reckon') amp += stageT * 0.012;
  return amp * Math.sin(t * (stage === 'reckon' ? 10 : 7));
}

function drawStack() {
  const sway = stackSway();
  stack.forEach((s, i) => {
    const h = i * SH + SH / 2;
    drawSack(s.x + sway * h, GROUND - h, s.w, s.col, sway * 0.8);
  });
}

function drawHook(L) {
  const hx = L.barnX + L.amp * Math.sin(hook.phase);
  const topY = viewToWorld(0, 0).y - 20;
  const hy = hook.y;
  ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx, topY); ctx.lineTo(hx, hy - 8); ctx.stroke();
  // pulley block and iron hook
  ctx.fillStyle = '#8a5a2a'; ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2;
  roundRect(hx - 9, hy - 22, 18, 16, 4); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#6a6a72'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(hx, hy - 6); ctx.lineTo(hx, hy + 2); ctx.arc(hx + 5, hy + 2, 5, Math.PI, Math.PI * 0.2, true); ctx.stroke();
  if (hook.has && stage === 'harvest' || hook.has && stage === 'build') {
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx + 4, hy + 4); ctx.lineTo(hx - cfg.sackW / 2 + 12, hy + 18); ctx.moveTo(hx + 4, hy + 4); ctx.lineTo(hx + cfg.sackW / 2 - 12, hy + 18); ctx.stroke();
    drawSack(hx, hy + 34, cfg.sackW, SACK_COLS[dropped % SACK_COLS.length]);
    // a faint guide line to show where it will land
    if (stage === 'harvest') {
      const surface = GROUND - stack.length * SH;
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.moveTo(hx, hy + 56); ctx.lineTo(hx, surface - 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

function drawTumblers() {
  for (const b of tumblers) {
    const a = b.rest > 0 && b.fade ? clamp(1 - (b.rest - (b.kind === 'sack' ? 1.8 : 0.4)) / 0.6, 0, 1) : 1;
    ctx.globalAlpha = a;
    if (b.kind === 'sack') drawSack(b.x, b.y, b.w, b.col, b.rot);
    else {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      if (b.kind === 'wall') drawWallPiece(b.len); else drawRoofPiece(b.w);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFlyers() {
  for (const f of flyers) {
    const k = clamp(f.t / f.dur, 0, 1);
    const x = lerp(f.x0, f.v.x, k), y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 120;
    drawSack(x, y, f.w * lerp(1, 0.45, k), f.col, k * TAU);
  }
}

function drawPieces(L) {
  if (stage !== 'build') return;
