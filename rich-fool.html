  // dashed outlines where the new barn goes
  const pulse = 0.55 + 0.35 * Math.sin(t * 5);
  const ghost = `rgba(255,255,255,${pulse})`;
  const wallsLeft = pieces.filter((p) => p.kind === 'wall' && !p.placed).length;
  const placedX = pieces.filter((p) => p.kind === 'wall' && p.placed).map((p) => p.gx);
  if (pieces.length) {
    const w0 = pieces.find((p) => p.kind === 'wall');
    for (const x of [L.left - WALL / 2, L.right + WALL / 2]) {
      if (wallsLeft && !placedX.some((px) => Math.abs(px - x) < 1)) { ctx.save(); ctx.translate(x, GROUND - L.wallH / 2); drawWallPiece(w0.len, ghost); ctx.restore(); }
    }
    const roof = pieces.find((p) => p.kind === 'roof');
    if (roof && !roof.placed) { ctx.save(); ctx.translate(roof.tx, roof.ty); drawRoofPiece(roof.w, ghost); ctx.restore(); }
  }
  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s);
    if (!p.placed && !(drag && drag.p === p)) { ctx.shadowColor = `rgba(255,230,120,${pulse})`; ctx.shadowBlur = 14; }
    if (p.kind === 'wall') drawWallPiece(p.len); else drawRoofPiece(p.w);
    ctx.restore();
  }
}

function drawVillager(v, L) {
  const [lx, ly] = (() => { const dx = L.barnX - v.x, dy = -40; const l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; })();
  const mood = villagerMood(v);
  drawPerson(v.d, v.x, v.y, v.s, mood, lx, ly, { hold: v.hasSack ? 'sack' : 'basket', kid: v.kid, dim: v.mode === 'back' });
  // a thought bubble: hungry for bread
  if (v.mode === 'wait' && state === 'play') {
    const bx = v.x + 22 * v.s, by = v.y - 118 * v.s + Math.sin(t * 3 + v.k) * 3;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(v.x + 10 * v.s, v.y - 88 * v.s, 3.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(v.x + 15 * v.s, v.y - 98 * v.s, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx, by, 22, 17, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(160,120,60,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    // a loaf of bread
    ctx.fillStyle = '#d99a4a'; ctx.strokeStyle = '#9a6424'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(bx, by + 2, 13, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 6, by - 2); ctx.lineTo(bx - 3, by + 5); ctx.moveTo(bx, by - 3); ctx.lineTo(bx + 3, by + 5); ctx.moveTo(bx + 6, by - 2); ctx.lineTo(bx + 8, by + 4); ctx.stroke();
    // a bouncing arrow on the first waiting neighbour when there's grain to share
    if (stack.length && (level === 1 || stage === 'night') && v === firstWaiting(L)) {
      const ay = by - 34 + Math.sin(t * 6) * 5;
      ctx.fillStyle = '#e0a526'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx - 9, ay - 10); ctx.lineTo(bx + 9, ay - 10); ctx.lineTo(bx + 9, ay); ctx.lineTo(bx + 15, ay); ctx.lineTo(bx, ay + 13); ctx.lineTo(bx - 15, ay); ctx.lineTo(bx - 9, ay); ctx.closePath();
      ctx.stroke(); ctx.fill();
    }
  }
}
function firstWaiting(L) {
  return villagers.filter((q) => q.mode === 'wait').sort((a, b) => Math.abs(a.x - L.barnX) - Math.abs(b.x - L.barnX))[0];
}

function drawFarm() {
  const L = layout();
  drawFarmSky();

  // the zoomable world
  ctx.save();
  ctx.translate(W / 2, H); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H);
  drawGround(L);
  for (const v of villagers) if (v.mode === 'back' || v.mode === 'toBack') drawVillager(v, L);
  drawBarn(L);
  drawBarnFront(L);
  drawStack();
  if (drop) drawSack(drop.x, drop.y, drop.w, drop.col);
  if (state === 'play' || state === 'pause' || state === 'title') drawHook(L);
  drawTumblers();
  // the rich farmer
  const fm = farmerMood();
  const topY = GROUND - stack.length * SH;
  drawPerson(FARMER, L.farmerX, GROUND + 14, 1.18, fm, -0.7, clamp((topY - GROUND) / 300, -0.9, 0.2), { portly: true });
  for (const v of villagers) if (v.mode !== 'back' && v.mode !== 'toBack') drawVillager(v, L);
  drawFlyers();
  drawPieces(L);
  drawParticles();
  ctx.restore();

  // night falls over the whole farm (colours dimmed directly, no canvas filter)
  const dark = clamp((skyN - 0.35) / 0.65, 0, 1);
  if (dark > 0) {
    ctx.fillStyle = `rgba(20,24,70,${dark * 0.34})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
    // a warm lantern glow on the barn
    const lp = { x: (L.barnX - W / 2) * zoom + W / 2, y: (GROUND - 60 - H) * zoom + H };
    const lg = ctx.createRadialGradient(lp.x, lp.y, 5, lp.x, lp.y, 220 * zoom);
    lg.addColorStop(0, `rgba(255,210,120,${dark * 0.28})`); lg.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lp.x, lp.y, 220 * zoom, 0, TAU); ctx.fill();
  }
}

// ============================================================
//  Rendering: bubbles, banners, HUD (view coordinates)
// ============================================================
function drawBubble(text, ax, ay, opts = {}) {
  ctx.save();
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.font = `700 ${opts.size || 18}px Fredoka, sans-serif`;
  const lh = (opts.size || 18) + 5;
  const maxW = Math.min(viewW - 44, opts.maxW || 360);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 28, h = lines.length * lh + 18;
  const bx = clamp(ax - w / 2 + (opts.shift || 0), 10, viewW - w - 10);
  const by = Math.max(ay - 26 - h, opts.minY || 110);
  ctx.fillStyle = opts.fill || '#fffbe8'; ctx.strokeStyle = opts.stroke || '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  const tx = clamp(ax - 11, bx + 16, bx + w - 38);
  if (ay > by + h + 6) {
    ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay - 6); ctx.lineTo(tx + 22, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(ax, ay - 6); ctx.lineTo(tx + 22, by + h); ctx.stroke();
  }
  ctx.fillStyle = opts.ink || '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 14, by + 9 + lh / 2 + i * lh));
  ctx.restore();
}

function drawBubbles() {
  if (inStory()) {
    if (!bubble || state === 'title') return;
    const L = storyLayout();
    const a = { x: L.jx + 14 + offX, y: L.gy - 104 * L.k + offY };
    drawBubble('“' + verseText(bubble.key) + '”', a.x, a.y - 30 * L.k, { alpha: clamp(bubble.t / 0.3, 0, 1), maxW: 480, size: 19, shift: 120 });
    return;
  }
  if (fbubble && fbubble.t > 0 && (state === 'play' || state === 'win')) {
    const L = layout();
    const head = worldToView(L.farmerX, GROUND + 14 - 95 * 1.18);
    const text = fbubble.key ? '“' + verseText(fbubble.key) + '”' : fbubble.text;
    if (text) drawBubble(text, head.x, head.y, { alpha: clamp(fbubble.t / 0.3, 0, 1), maxW: 260, size: 17, minY: 150 });
  }
}

function drawBanner() {
  if (!banner || banner.t <= 0) return;
  const v = Bible.verse(VERSES[banner.key]);
  const text = '“' + verseText(banner.key) + '”';
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1);
  ctx.font = 'italic 700 19px Fredoka, sans-serif';
  const maxW = Math.min(viewW - 60, 560);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width), 120);
  const w = tw + 36, h = lines.length * 25 + 38;
  const x = viewW / 2 - w / 2, y = 112;
  const night = banner.key === 'fool';
  ctx.fillStyle = night ? 'rgba(40,44,96,0.92)' : 'rgba(255,248,225,0.95)';
  ctx.strokeStyle = night ? '#c9b7ff' : '#e0a526'; ctx.lineWidth = 3;
  roundRect(x, y, w, h, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = night ? '#fff6d6' : '#7a4a00';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, viewW / 2, y + 18 + i * 25));
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillStyle = night ? '#d8d0ff' : '#9a7a40';
  ctx.fillText('— ' + v.cite, viewW / 2, y + h - 14);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const light = skyN > 0.55;
  const ink = light ? '#fff4d6' : '#5a4210';
  ctx.shadowColor = light ? 'rgba(0,0,40,0.8)' : 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  const story = inStory();
  ctx.fillText(state === 'title' ? 'The Rich Fool' : story ? 'Jesus tells a story' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (!story) {
    ctx.font = '600 13px Fredoka, sans-serif';
    const left = cfg.sacks - dropped;
    const fed = villagers.filter((v) => v.hasSack).length;
    ctx.fillText(`Harvest: ${left} to come  ·  Fed: ${fed}/${cfg.villagers}`, 12, 50);
  }
  ctx.shadowBlur = 0;

  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score, and the night meter
  if (!story) {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SCORE', rx, 20);
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.fillText(`${totalScore + shared * 150 + perfects * 25}`, rx, 41);
    if (stage === 'night' || stage === 'dusk') {
      ctx.font = '600 12px Fredoka, sans-serif';
      ctx.fillText('NIGHT', rx, 64);
      ctx.shadowBlur = 0;
      const f = stage === 'night' ? clamp(1 - nightT / cfg.night, 0, 1) : 1;
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; roundRect(rx - 150, 55, 100, 11, 5.5); ctx.fill();
      ctx.fillStyle = f < 0.3 && Math.sin(t * 10) > 0 ? '#ff8a8a' : '#c9b7ff';
      if (f > 0) { roundRect(rx - 150, 55, 100 * f, 11, 5.5); ctx.fill(); }
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, Math.min(viewW - 40, 600));
  const y0 = offY + H * (inStory() ? 0.36 : 0.3);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  lines.forEach((l, i) => { ctx.strokeText(l, viewW / 2, y0 + i * 30); });
  ctx.fillStyle = '#7a5200';
  lines.forEach((l, i) => { ctx.fillText(l, viewW / 2, y0 + i * 30); });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  if (inStory()) drawStory(); else drawFarm();

  if (trans) {
    ctx.fillStyle = `rgba(255,248,230,${1 - Math.abs(trans.t - 0.45) / 0.45})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBubbles();
  drawBanner();
  drawMessage();
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateTrans(dt);
  tickBlink(FARMER, dt);
  for (const d of PEOPLE) tickBlink(d, dt);
  const L = layout();

  if (state === 'play') {
    stageT += dt;
    if (stage === 'intro') updateIntro(dt);
    else {
      updateHook(dt, L);
      updateDrop(dt, L);
      updatePieces(dt);
      spawnVillagers(L);
      if (stage === 'harvest' && dropped >= cfg.sacks && !drop) startDusk();
      else if (stage === 'dusk' && stageT > 3.2) { if (allFed()) win(); else startNight(); }
      else if (stage === 'night') {
        nightT += dt;
        if (allFed()) win();
        else if (nightT >= cfg.night || (!stack.length && !flyers.length && nightT > 1.5)) startReckon();
      } else if (stage === 'reckon' && stageT > 2.4) startTopple();
      else if (stage === 'topple' && stageT > 1.8) fail(lost > cfg.sacks - cfg.villagers ? 'spilled' : 'hoard');
    }
  }
  if (state !== 'title' && state !== 'pause' && stage !== 'intro') {
    updateVillagers(dt, L);
    updateFlyers(dt);
    updateTumblers(dt);
  }
  if (state === 'win' && Math.random() < dt * 14) {
    spawn(L.barnX + rand(-L.outer, L.outer), GROUND - rand(20, 200), rand(-20, 20), -40, 1.2, ['#fff6d0', '#ffe27a', '#ffd1e8'][Math.floor(rand(0, 3))], 3);
  }

  // the sky: afternoon through the harvest, sunset at dusk, night after, golden joy on a win
  let target = (dropped / cfg.sacks) * 0.3;
  if (stage === 'dusk') target = 0.3 + clamp(stageT / 3.2, 0, 1) * 0.3;
  if (stage === 'night') target = 0.6 + clamp(nightT / cfg.night, 0, 1) * 0.4;
  if (stage === 'reckon' || stage === 'topple' || state === 'fail') target = 1;
  if (state === 'win') target = 0.42;
  if (stage === 'intro' || state === 'title') target = 0;
  skyN += (target - skyN) * Math.min(1, dt * 1.5);

  // zoom out when the barn grows taller than the screen
  const topNeeded = L.hookY - 40;
  const avail = H + offY - 160;
  const zt = Math.min(1, avail / (H - topNeeded));
  zoom += (zt - zoom) * Math.min(1, dt * 3);

  wob = Math.max(0, wob - dt * 0.8);
  barn.show = Math.min(1, barn.show + dt * 3);
  if (farmer.moodT > 0) farmer.moodT -= dt;
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0 && !(state === 'play' && stage === 'intro')) bubble = null; }
  if (fbubble) { fbubble.t -= dt; if (fbubble.t <= 0) fbubble = null; }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
