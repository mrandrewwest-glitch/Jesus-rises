<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123552">
<title>Inside the Big Fish</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #123552;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Inside the Big Fish</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'pipe', ambience: 'sea', percussion: false };

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Title card and intro: inside the fish
  inside: { ref: 'Jonah 1:17', KJV: 'Now the Lord had prepared a great fish to swallow up Jonah. And Jonah was in the belly of the fish three days and three nights.', NKJV: 'Now the Lord had prepared a great fish to swallow Jonah. And Jonah was in the belly of the fish three days and three nights.', NIV: 'Now the Lord provided a huge fish to swallow Jonah, and Jonah was in the belly of the fish three days and three nights.', NLT: 'Now the Lord had arranged for a great fish to swallow Jonah. And Jonah was inside the fish for three days and three nights.' },
  // Intro: Jonah prays
  prayed: { ref: 'Jonah 2:1', KJV: 'Then Jonah prayed unto the Lord his God out of the fish\'s belly,', NKJV: 'Then Jonah prayed to the Lord his God from the fish’s belly.', NIV: 'From inside the fish Jonah prayed to the Lord his God.', NLT: 'Then Jonah prayed to the Lord his God from inside the fish.' },
  // The prayer lights: short phrases from Jonah's prayer
  p1: { ref: 'Jonah 2:2', KJV: 'I cried by reason of mine affliction unto the Lord, and he heard me', NKJV: 'I cried out to the Lord because of my affliction, And He answered me.', NIV: 'In my distress I called to the Lord, and he answered me.', NLT: 'I cried out to the Lord in my great trouble, and he answered me.' },
  p2: { ref: 'Jonah 2:2', KJV: 'thou heardest my voice.', NKJV: 'You heard my voice.', NIV: 'you listened to my cry.', NLT: 'Lord, you heard me!' },
  p3: { ref: 'Jonah 2:7', KJV: 'I remembered the Lord', NKJV: 'I remembered the Lord', NIV: 'I remembered you, Lord', NLT: 'I remembered the Lord.' },
  p4: { ref: 'Jonah 2:7', KJV: 'my prayer came in unto thee, into thine holy temple.', NKJV: 'my prayer went up to You, Into Your holy temple.', NIV: 'my prayer rose to you, to your holy temple.', NLT: 'my earnest prayer went out to you in your holy Temple.' },
  p5: { ref: 'Jonah 2:9', KJV: 'I will sacrifice unto thee with the voice of thanksgiving', NKJV: 'I will sacrifice to You With the voice of thanksgiving', NIV: 'with shouts of grateful praise, will sacrifice to you.', NLT: 'I will offer sacrifices to you with songs of praise' },
  p6: { ref: 'Jonah 2:9', KJV: 'Salvation is of the Lord.', NKJV: 'Salvation is of the Lord.', NIV: 'Salvation comes from the Lord.', NLT: 'my salvation comes from the Lord alone.' },
  // Finale and win card: onto dry land
  spit: { ref: 'Jonah 2:10', KJV: 'And the Lord spake unto the fish, and it vomited out Jonah upon the dry land.', NKJV: 'So the Lord spoke to the fish, and it vomited Jonah onto dry land.', NIV: 'And the Lord commanded the fish, and it vomited Jonah onto dry land.', NLT: 'Then the Lord ordered the fish to spit Jonah out onto the beach.' },
};
const PHRASES = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'];

function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function verseCite(key) { return Bible.verse(VERSES[key]).cite; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  if (typeof onResize === 'function') onResize();
}
window.addEventListener('resize', resize);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function mix(a, b, f) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(na >> 16, nb >> 16, f)), g = Math.round(lerp((na >> 8) & 255, (nb >> 8) & 255, f)), bl = Math.round(lerp(na & 255, nb & 255, f));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#e6eef6') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// ============================================================
//  People (the house cartoon style)
// ============================================================
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const closed = () => {
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
    ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'grumpy':
      eyes(3.5, 3.2, 2);
      brows(-5, -9, -5, -9);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'sleep':
      closed();
      mouthFill(() => ctx.ellipse(0, mouthY, 2.2, 2.6 + Math.sin(t * 2) * 0.8, 0, 0, TAU));
      break;
    case 'pray':
      closed();
      brows(-8, -7, -8, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 3.5, 0.25 * Math.PI, 0.75 * Math.PI));
      break;
    case 'happy':
      eyes(3.5, 4.5, 2);
      brows(-8, -8, -8, -8);
      mouthFill(() => { ctx.moveTo(-5, mouthY - 2); ctx.arc(0, mouthY - 2, 5, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.4)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
  }
}

function drawHeadwear(d, hy) {
  if (d.crown) {
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#b8861a'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-13, hy - 10); ctx.lineTo(-13, hy - 24); ctx.lineTo(-7, hy - 17); ctx.lineTo(0, hy - 27);
    ctx.lineTo(7, hy - 17); ctx.lineTo(13, hy - 24); ctx.lineTo(13, hy - 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d64545'; ctx.beginPath(); ctx.arc(0, hy - 15, 2.5, 0, TAU); ctx.fill();
    return;
  }
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    return;
  }
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
  ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
  ctx.closePath(); ctx.fill();
  if (d.band) {
    ctx.strokeStyle = d.band; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, hy - 1, 16, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  }
}

function drawBeard(d, hy) {
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.moveTo(-15, hy + 2);
  ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
  ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
  ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
  ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
  ctx.fill();
}

// d: { robe, hair, skin, beard, scarf, kid, crown, band, sack, blink, phase, i }
// pose: 'stand' | 'armsUp' | 'push' | 'pray' | 'kneel' | 'wave' | 'point'
function drawPerson(d, x, y, s, mood, pose = 'stand', lookX = 0, lookY = 0.3) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + (d.phase || 0))) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  if (d.kid) s *= 0.78;
  const kneel = pose === 'kneel' || pose === 'pray';

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  if (kneel) ctx.translate(0, 12);

  const robe = d.sack ? '#b89a6a' : d.robe;
  const sleeve = shade(robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  if (pose === 'armsUp') {
    const wave = Math.sin(t * 9 + (d.phase || 0)) * 4;
    arm(-11, -32, -24 + wave, -66); arm(11, -32, 24 - wave, -66);
  } else if (pose === 'wave') {
    arm(11, -32, 24 + Math.sin(t * 10 + (d.phase || 0)) * 5, -64);
  }

  ctx.fillStyle = robe;
  ctx.strokeStyle = shade(robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (kneel) {
    ctx.moveTo(-20, -12);
    ctx.quadraticCurveTo(-17, -30, -11, -37);
    ctx.quadraticCurveTo(0, -41, 11, -37);
    ctx.quadraticCurveTo(17, -30, 20, -12);
    ctx.quadraticCurveTo(0, -6, -20, -12);
  } else {
    ctx.moveTo(-18, 0);
    ctx.quadraticCurveTo(-17, -30, -11, -37);
    ctx.quadraticCurveTo(0, -41, 11, -37);
    ctx.quadraticCurveTo(17, -30, 18, 0);
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  if (d.sack) {
    // rough burlap stitches
    ctx.strokeStyle = 'rgba(110,80,40,0.55)'; ctx.lineWidth = 1;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 6, -34); ctx.lineTo(k * 6.6, kneel ? -12 : -2); ctx.stroke(); }
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.lineTo(16, -17); ctx.stroke();
  } else {
    ctx.strokeStyle = d.belt || '#c9b07a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }

  if (pose === 'stand' && mood !== 'shock') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (pose === 'wave') {
    arm(-11, -32, -15, -12);
  } else if (pose === 'push') {
    arm(-11, -32, -22, -40); arm(11, -32, 22, -40);
  } else if (pose === 'point') {
    arm(-11, -32, -15, -12); arm(11, -32, 30, -46);
  } else if (pose === 'pray' || pose === 'kneel') {
    arm(-11, -32, -2, -40); arm(11, -32, 2, -40);
  }

  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  drawHeadwear(d, hy);
  if (d.beard) drawBeard(d, hy);
  drawFace(d, mood, hy, lookX, lookY);
  if (d.sack && !d.crown) {
    // a sprinkle of ashes on the head
    ctx.fillStyle = 'rgba(120,120,120,0.55)';
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-8 + k * 4, hy - 15 + (k % 2) * 2, 1.4, 0, TAU); ctx.fill(); }
  }
  if (mood === 'shock' && pose === 'stand') {
    arm(-11, -32, -15, hy + 4); arm(11, -32, 15, hy + 4);
  }
  ctx.restore();
}

// ============================================================
//  Particles (world = playfield coordinates, scr = view coordinates)
// ============================================================
let particles = [];
function spawn(x, y, vx, vy, life, color, size, grav = 0, scr = false, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, scr, kind, rot: rand(0, TAU) });
}
function sparkleBurst(x, y, n, scr = false, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#bfe8ff']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, 260);
    spawn(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.5, 1.1), pick(cols), rand(2, 5), 120, scr, i % 3 ? 'dot' : 'star');
  }
}
function splashBurst(x, y, n = 14, col = '#d8f0ff') {
  for (let i = 0; i < n; i++) spawn(x + rand(-12, 12), y, rand(-120, 120), rand(-320, -120), rand(0.5, 0.9), i % 2 ? col : '#ffffff', rand(3, 6), 700);
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += dt * 3;
  }
}
function drawParticles(scr) {
  for (const p of particles) {
    if (p.scr !== scr) continue;
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const r = k % 2 ? p.size * 0.45 : p.size * 1.4; ctx.lineTo(Math.cos(k * Math.PI / 4) * r, Math.sin(k * Math.PI / 4) * r); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (p.kind === 'heart') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.size / 8, p.size / 8);
      ctx.beginPath(); ctx.moveTo(0, 3); ctx.bezierCurveTo(-8, -3, -4, -9, 0, -4); ctx.bezierCurveTo(4, -9, 8, -3, 0, 3); ctx.fill(); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.kind === 'puff' ? 2 - a : 1), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

const overlay = document.getElementById('overlay');

const ovBtn2 = document.getElementById('ovBtn2');

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {

let pausedFrom = 'play';
function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input (shared parts; each game adds gameKey / gamePress / gameMove / gameRelease)
// ============================================================
const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  keys.add(e.code);
  gameKey(e);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 8) { b.action(); return; }
  }
  p.x = p.vx - offX; p.y = p.vy - offY;   // playfield coordinates
  gamePress(p, e);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (typeof gameMove !== 'function') return;
  const p = toView(e); p.x = p.vx - offX; p.y = p.vy - offY;
  gameMove(p, e);
});
canvas.addEventListener('pointerup', (e) => {
  sfx.init();
  if (typeof gameRelease !== 'function') return;
  const p = toView(e); p.x = p.vx - offX; p.y = p.vy - offY;
  gameRelease(p, e);
});
canvas.addEventListener('pointercancel', (e) => { if (typeof gameRelease === 'function') gameRelease(null, e); });

function hudButtons() {
