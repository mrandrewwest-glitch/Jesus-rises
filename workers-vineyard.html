// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.12);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35, freq = 1100, dur = 0.16, delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.04);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // small extra effects for this game
  bell() { for (const d of [0, 0.55]) { this.tone(784, 1.3, 'sine', 0.2, d); this.tone(1568, 0.7, 'sine', 0.06, d); this.tone(392, 1.5, 'triangle', 0.07, d); } },
  clink() { this.tone(1760, 0.18, 'triangle', 0.16); this.tone(2640, 0.2, 'sine', 0.08, 0.03); },
  coin() { this.tone(1318, 0.1, 'square', 0.05); this.tone(1976, 0.35, 'sine', 0.16, 0.07); },
  ding() { this.tone(880, 0.25, 'sine', 0.12); this.tone(1320, 0.3, 'sine', 0.08, 0.07); },
  buzz() { this.tone(170, 0.32, 'sawtooth', 0.06, 0, 260); this.tone(175, 0.28, 'sawtooth', 0.04, 0.05, 250); },
  squish() { this.puff(0.3, 500, 0.25); this.tone(140, 0.2, 'sine', 0.2, 0, 90); },
};

// ============================================================
//  Rendering: sky, sun, hills, fields
// ============================================================
// Sky colours through the day: dawn, morning, noon, afternoon, sunset, dusk
const SKY = [
  [0.0, '#f6a88a', '#ffe0b0'],
  [0.15, '#8fcaf0', '#e4f4fb'],
  [0.5, '#6fb8ec', '#d8effa'],
  [0.8, '#86c2ec', '#f4ecd0'],
  [0.93, '#f29a6a', '#ffd49a'],
  [1.0, '#8a6aae', '#f7a56e'],
];
function skyAt(f) {
  for (let i = 1; i < SKY.length; i++) {
    if (f <= SKY[i][0]) {
      const k = (f - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]);
      return [mix(SKY[i - 1][1], SKY[i][1], k), mix(SKY[i - 1][2], SKY[i][2], k)];
    }
  }
  return [SKY[SKY.length - 1][1], SKY[SKY.length - 1][2]];
}
// how much the evening light tints the land
function duskAmt(f) { return clamp((f - 0.82) / 0.18, 0, 1) * 0.35 + clamp((0.1 - f) / 0.1, 0, 1) * 0.15; }
function land(hex, f) { return mix(hex, '#7a5a8a', duskAmt(f)); }

function drawSky(f) {
  const [top, bottom] = skyAt(f);
  const g = ctx.createLinearGradient(0, -offY, 0, HORIZON + 40);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // the sun crosses the sky as the day passes
  const x0 = -offX + 30, x1 = W + offX - 30;
  const sx = lerp(x0, x1, f);
  const sy = HORIZON - 10 - Math.sin(f * Math.PI) * (HORIZON - 150 + Math.min(offY, 200));
  const glow = ctx.createRadialGradient(sx, sy, 5, sx, sy, 90);
  glow.addColorStop(0, 'rgba(255,245,200,0.9)');
  glow.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 90, 0, TAU); ctx.fill();
  ctx.fillStyle = f > 0.9 || f < 0.08 ? '#ffb347' : '#ffe066';
  ctx.beginPath(); ctx.arc(sx, sy, 28, 0, TAU); ctx.fill();
  // a few soft clouds
  for (let k = 0; k < 4; k++) {
    const cx = ((k * 0.29 + t * 0.004) % 1.2 - 0.1) * (viewW + 200) - offX - 100;
    drawCloudShape(cx, 150 + k * 38 - Math.min(offY, 120) * 0.5, 90 + k * 20, 26);
  }
}

function drawCloudShape(cx, cy, w, h) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  const n = Math.max(3, Math.round(w / 24));
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const r = h * (0.5 + 0.45 * Math.sin(f * Math.PI));
    const px = cx - w / 2 + h * 0.4 + f * (w - h * 0.8);
    ctx.moveTo(px + r, cy - r * 0.3); ctx.arc(px, cy - r * 0.3, r, 0, TAU);
  }
  ctx.fill();
}

function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function drawHills(f) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // far hills
  ctx.fillStyle = land('#a9cf8e', f);
  ctx.beginPath(); ctx.moveTo(x0, HORIZON + 60);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, HORIZON - 40 + Math.sin(x / 120) * 22 + Math.sin(x / 47) * 7);
  ctx.lineTo(x1, HORIZON + 60); ctx.fill();
  // the town on the hill behind the marketplace
  for (let k = 0; k < 7; k++) {
    const hx = -offX * 0.3 + 12 + k * 34 + (k % 2) * 6, hh = 26 + hash(k) * 22, hw = 30 + hash(k + 9) * 10;
    const base = HORIZON - 16 + Math.sin(hx / 120) * 10;
    ctx.fillStyle = land(k % 2 ? '#efdcb4' : '#e6cfa2', f);
    ctx.fillRect(hx, base - hh, hw, hh + 20);
    ctx.fillStyle = land('#b89a6a', f);
    ctx.fillRect(hx + hw * 0.4, base - hh * 0.5, 7, 10);
    if (k === 3) { ctx.fillStyle = land('#e6cfa2', f); roundRect(hx + 6, base - hh - 16, 18, 18, [9, 9, 0, 0]); ctx.fill(); }
  }
  // near slope with distant vine rows
  ctx.fillStyle = land('#95c46e', f);
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, HORIZON + 10 + Math.sin(x / 200 + 1) * 10);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.strokeStyle = land('#6f9e4a', f); ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
  for (let r = 0; r < 3; r++) {
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 16) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, HORIZON + 22 + r * 12 + Math.sin(x / 200 + 1) * 10);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawFields(f) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // the grassy vineyard floor
  ctx.fillStyle = land('#a8cf72', f);
  ctx.fillRect(x0, HORIZON + 50, x1 - x0, H - HORIZON);
  // the dusty lane from the marketplace to the winepress
  ctx.fillStyle = land('#e2c996', f);
  ctx.beginPath(); ctx.moveTo(x0, MARKET_Y - 34); ctx.quadraticCurveTo(W / 2, MARKET_Y - 22, x1, PRESS_Y - 30);
  ctx.lineTo(x1, PRESS_Y + 36); ctx.quadraticCurveTo(W / 2, MARKET_Y + 56, x0, MARKET_Y + 60); ctx.closePath(); ctx.fill();
  // paving stones in the marketplace
  const mw = marketW();
  ctx.fillStyle = land('#d9c4a0', f);
  roundRect(-offX - 10, MARKET_Y - 40, mw + offX + 20, 104, 18); ctx.fill();
  ctx.strokeStyle = land('#c4ab80', f); ctx.lineWidth = 1.5;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 12; c++) {
    const sx = -offX + c * 30 + (r % 2) * 15, sy = MARKET_Y - 30 + r * 24;
    if (sx > mw) continue;
    roundRect(sx, sy, 26, 20, 5); ctx.stroke();
  }
  // dirt aisles in front of each row of vines
  for (const ry of ROWS_Y) {
    ctx.fillStyle = land('#d8bf8a', f);
    roundRect(12, ry + 4, W - 24, 42, 16); ctx.fill();
  }
}

function drawMarketStall(f) {
  const mw = marketW();
  const x = 10, w = Math.min(mw - 20, 190), y = MARKET_Y - 128;
  // posts
  ctx.fillStyle = land('#8a6a44', f);
  ctx.fillRect(x + 6, y + 10, 6, 84); ctx.fillRect(x + w - 12, y + 10, 6, 84);
  // table with produce
  ctx.fillStyle = land('#b8905a', f);
  roundRect(x, y + 66, w, 16, 4); ctx.fill();
  const fruit = ['#e8590c', '#fab005', '#8e44ad', '#74b816', '#e03131'];
  for (let k = 0; k < Math.floor(w / 26); k++) {
    ctx.fillStyle = land('#c99a52', f); roundRect(x + 8 + k * 26, y + 56, 20, 12, 3); ctx.fill();
    ctx.fillStyle = land(fruit[k % fruit.length], f);
    ctx.beginPath(); ctx.arc(x + 13 + k * 26, y + 54, 4.5, 0, TAU); ctx.arc(x + 22 + k * 26, y + 54, 4.5, 0, TAU); ctx.arc(x + 18 + k * 26, y + 49, 4.5, 0, TAU); ctx.fill();
  }
  // striped awning
  const stripes = Math.max(4, Math.round(w / 22));
  for (let k = 0; k < stripes; k++) {
    ctx.fillStyle = land(k % 2 ? '#fff4dc' : '#d9534f', f);
    const sx = x - 6 + k * (w + 12) / stripes;
    ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + (w + 12) / stripes, y); ctx.lineTo(sx + (w + 12) / stripes, y + 20);
    ctx.quadraticCurveTo(sx + (w + 12) / stripes / 2, y + 30, sx, y + 20); ctx.closePath(); ctx.fill();
  }
  // sign
  ctx.fillStyle = land('#f7e4bf', f); ctx.strokeStyle = land('#a8803a', f); ctx.lineWidth = 2;
  roundRect(x + w / 2 - 50, y - 24, 100, 22, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a14'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Marketplace', x + w / 2, y - 13);
  ctx.textBaseline = 'alphabetic';
}

function drawPress(f) {
  const px = pressX(), ph = pressHalf(), base = PRESS_Y;
  // big clay jar behind, filling with new wine
  const jx = px + ph * 0.55, jh = 84, jw = 46, jb = base - 36;
  ctx.fillStyle = land('#c8743e', f); ctx.strokeStyle = land('#8a4a22', f); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(jx - 10, jb - jh); ctx.lineTo(jx + 10, jb - jh);
  ctx.quadraticCurveTo(jx + jw * 0.7, jb - jh * 0.7, jx + jw * 0.5, jb - 6);
  ctx.quadraticCurveTo(jx, jb + 4, jx - jw * 0.5, jb - 6);
  ctx.quadraticCurveTo(jx - jw * 0.7, jb - jh * 0.7, jx - 10, jb - jh);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const fill = clamp(pressed / cfg.quota, 0, 1);
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#6a1f7e';
  ctx.fillRect(jx - jw, jb + 4 - (jh + 4) * fill, jw * 2, (jh + 4) * fill);
  ctx.restore();
  ctx.strokeStyle = land('#8a4a22', f); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(jx - jw * 0.55, jb - jh * 0.45); ctx.lineTo(jx + jw * 0.55, jb - jh * 0.45); ctx.stroke();
  // stone basin
  ctx.fillStyle = land('#b9ad9c', f); ctx.strokeStyle = land('#857a6a', f); ctx.lineWidth = 2;
  roundRect(px - ph, base - 52, ph * 2, 52, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = land('#a09482', f);
  ctx.beginPath(); ctx.ellipse(px, base - 52, ph, 13, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // juice inside, splashing when grapes go in
  ctx.fillStyle = '#7b2d8e';
  ctx.beginPath(); ctx.ellipse(px, base - 50 + Math.sin(t * 3) * 0.8, ph - 8, 8 + pressFx * 3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(px - ph * 0.3, base - 52, ph * 0.25, 2.5, 0, 0, TAU); ctx.fill();
  // spout and little bowl
  ctx.fillStyle = land('#857a6a', f); ctx.fillRect(px - ph - 10, base - 24, 12, 7);
  ctx.fillStyle = '#7b2d8e'; ctx.fillRect(px - ph - 8, base - 18, 3, 10 + Math.sin(t * 6) * 2);
  // label + count
  ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineJoin = 'round';
  const label = `Winepress ${pressed}/${cfg.quota}`;
  const lx = clamp(px, 70, W - 70);
  ctx.strokeText(label, lx, base - 130);
  ctx.fillStyle = pressed >= cfg.quota ? '#2b8a3e' : '#5a2a6a';
  ctx.fillText(label, lx, base - 130);
  // a gentle bouncing arrow while the basket is full
  if (scene === 'vineyard' && boss && boss.basket >= cfg.basket && state === 'play') {
    const ay = base - 150 - Math.abs(Math.sin(t * 5)) * 8;
    ctx.fillStyle = '#e0a526';
    ctx.beginPath(); ctx.moveTo(lx - 9, ay); ctx.lineTo(lx + 9, ay); ctx.lineTo(lx, ay + 11); ctx.fill();
  }
}

// A bunch of grapes: small and green while growing, plump and purple when ripe
function drawBunch(s) {
  const g = s.grow;
  const sway = Math.sin(t * 1.6 + s.sway) * 1.5;
  const x = s.x + sway, y = s.y;
  const k = 0.45 + 0.55 * Math.min(1, g);
  const col = g >= 1 ? '#7b2d8e' : mix('#9ccc5a', '#a066b8', clamp((g - 0.5) * 2, 0, 1));
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s.x, y - 22); ctx.lineTo(x, y - 12); ctx.stroke();
  if (g >= 1) {
    ctx.fillStyle = '#5f9e3a';
    ctx.beginPath(); ctx.ellipse(x + 8, y - 16, 8, 4.5, -0.5, 0, TAU); ctx.fill();
    // a soft glow behind ripe bunches so they are easy to spot
    ctx.fillStyle = 'rgba(255,240,180,0.35)';
    ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.fill();
  }
  const rows = [[-6, 0, 6], [-6, 0, 6], [-3, 3], [0]];
  const r = 4.6 * k;
  ctx.fillStyle = col;
  ctx.beginPath();
  rows.forEach((row, ri) => row.forEach((dx) => { const gx = x + dx * k * 1.05 + (ri === 1 ? 0 : 0), gy = y - 8 * k + ri * 7.5 * k; ctx.moveTo(gx + r, gy); ctx.arc(gx, gy, r, 0, TAU); }));
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  rows.forEach((row, ri) => row.forEach((dx) => { const gx = x + dx * k * 1.05 - r * 0.3, gy = y - 8 * k + ri * 7.5 * k - r * 0.3; ctx.moveTo(gx + r * 0.3, gy); ctx.arc(gx, gy, r * 0.3, 0, TAU); }));
  ctx.fill();
}

// A row of vines on a trellis, with its bunches
function drawRow(r, f) {
  const ry = ROWS_Y[r];
  const x0 = 22, x1 = W - 22;
  const wire = ry - 84;
  // posts
  ctx.fillStyle = land('#7a5634', f);
  const nPosts = Math.max(3, Math.round((x1 - x0) / 150));
  for (let k = 0; k <= nPosts; k++) { const px = lerp(x0, x1, k / nPosts); ctx.fillRect(px - 3, wire - 8, 6, ry - wire + 8); }
  // wires
  ctx.strokeStyle = land('#8a7a60', f); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, wire); ctx.lineTo(x1, wire); ctx.moveTo(x0, wire + 36); ctx.lineTo(x1, wire + 36); ctx.stroke();
  // twisting vine and leaves
  ctx.strokeStyle = land('#6b4a2b', f); ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, wire + 2 + Math.sin(x / 23 + r) * 4);
  ctx.stroke();
  const leafA = land('#5f9e3a', f), leafB = land('#79b84a', f);
  for (let x = x0 + 6, k = 0; x <= x1; x += 17, k++) {
    ctx.fillStyle = k % 2 ? leafA : leafB;
    const ly = wire - 4 + Math.sin(x / 23 + r) * 4 + (k % 3) * 3;
    ctx.beginPath(); ctx.ellipse(x, ly, 12, 8, (k % 3 - 1) * 0.5, 0, TAU); ctx.fill();
  }
  for (const s of slots) if (s.row === r) drawBunch(s);
}

function drawWasp(w) {
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.scale(w.facing || 1, 1);
  // wings, fluttering
  const fl = Math.sin(t * 60) * 0.35;
  ctx.fillStyle = 'rgba(230,245,255,0.85)'; ctx.strokeStyle = 'rgba(120,150,180,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(-2, -9, 6, 9, -0.5 + fl, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(4, -8, 5, 8, 0.4 - fl, 0, TAU); ctx.fill(); ctx.stroke();
  // striped body
  ctx.fillStyle = '#ffd43b';
  ctx.beginPath(); ctx.ellipse(-3, 0, 10, 7, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-9, -8, 3.5, 16); ctx.fillRect(-2, -8, 3.5, 16);
  ctx.restore();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-18, 1); ctx.lineTo(-13, 3); ctx.fill();   // tiny stinger
  // head with a cheeky face
  ctx.fillStyle = '#ffd43b';
  ctx.beginPath(); ctx.arc(9, -1, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.arc(10.5, -2.5, 1.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(10, 0.5, 2.4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, -6); ctx.quadraticCurveTo(13, -11, 16, -11); ctx.stroke();
  ctx.restore();
  // "bzz" drifting
  if (w.state === 'sit' && Math.sin(t * 2 + w.ph) > 0.4) {
    ctx.font = 'italic 600 12px Fredoka, sans-serif'; ctx.fillStyle = 'rgba(90,66,16,0.75)'; ctx.textAlign = 'center';
    ctx.fillText('bzz', w.x + 16, w.y - 18);
  }
}

function drawVineyardScene() {
  const f = dayF();
  drawSky(f);
  drawHills(f);
  drawFields(f);
  drawMarketStall(f);
  // depth-sorted: rows, the winepress and people
  const items = [];
  items.push({ y: PRESS_Y, fn: () => drawPress(f) });
  ROWS_Y.forEach((ry, r) => items.push({ y: ry, fn: () => drawRow(r, f) }));
  for (const p of folk) items.push({ y: p.y, fn: () => drawPerson(p) });
  if (boss) items.push({ y: boss.y + 0.1, fn: () => drawPerson(boss) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.fn();
  // a golden ring marks where the householder is heading
  if (boss && boss.tx !== null && state === 'play') {
    ctx.strokeStyle = 'rgba(224,165,38,0.7)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(boss.tx, boss.ty + 2, 14, 5, 0, 0, TAU); ctx.stroke();
  }
  for (const w of wasps) drawWasp(w);
  // a warm evening glow
  const da = duskAmt(f);
  if (da > 0.02) { ctx.fillStyle = `rgba(255,140,80,${da * 0.25})`; ctx.fillRect(-offX, -offY, viewW, viewH); }
}

// ============================================================
//  The framing scene
// ============================================================
function frameLayout() {
  const narrow = W < 700;
  const s = narrow ? 1.3 : 1.7;
  const gy = H - 150;
  const jx = clamp(W * 0.18, 70, 240);
  const a = jx + (narrow ? 84 : 140), b = W - (narrow ? 40 : 80);
  return { narrow, s, gy, jx, a, b };
}

function drawFrameScene() {
  const f = 0.3;
  drawSky(f);
  drawHills(f);
  const x0 = -offX - 10, x1 = W + offX + 10;
  // a grassy hillside in Judea
  ctx.fillStyle = '#9fcb6c';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, H - 250 + Math.sin(x / 160) * 16);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#8dbb5c'; ctx.fillRect(x0, H - 140, x1 - x0, 140);
  // a few wildflowers
  for (let k = 0; k < 18; k++) {
    const fx = x0 + hash(k) * (x1 - x0), fy = H - 200 + hash(k + 40) * 180;
    ctx.fillStyle = ['#ffd43b', '#ff8fab', '#ffffff'][k % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
  }
  const L = frameLayout();
  // a flat rock for Jesus to stand beside
  ctx.fillStyle = '#b9ad9c';
  roundRect(L.jx - 40 * L.s * 0.6, L.gy - 8, 80 * L.s * 0.6, 20, 10); ctx.fill();

  const back = listeners.slice(0, 3), front = listeners.slice(3);
  back.forEach((d, k) => { d.x = lerp(L.a + 40, L.b - 20, k / 2); d.y = L.gy - 52; d.s = L.s * 0.85; d.facing = -1; d.dim = true; d.pose = 'sit'; });
  front.forEach((d, k) => { d.x = lerp(L.a + 10, L.b - 10, k / 2); d.y = L.gy + 6; d.s = L.s; d.facing = -1; d.pose = 'sit'; d.dim = false; });
  for (const d of listeners) {
    const dx = L.jx - d.x, dy = (L.gy - 80) - (d.y - 50);
    const len = Math.hypot(dx, dy) || 1;
    d.lx = dx / len; d.ly = dy / len * 0.4;
  }
  back.forEach(drawPerson);
  front.forEach(drawPerson);
  drawJesus({ x: L.jx, y: L.gy, s: L.s * 1.1, pose: 'teach', face: state === 'title' ? 'calm' : sceneT > 3.6 ? 'joy' : 'calm' });
}

function updateListeners(dt) {
  for (const d of listeners) {
    let want = 'watch';
    if (scene === 'frame' && state === 'play') want = sceneT > 3.8 ? 'joy' : sceneT > 3 ? 'wow' : 'watch';
    if (want !== d.mood) { d.switchT += dt; if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; } }
  }
}

// ============================================================
//  The evening pay line
// ============================================================
function drawPaydayScene() {
  const f = 1;
  drawSky(f);
  drawHills(f);
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = land('#a8cf72', f);
  ctx.fillRect(x0, HORIZON + 50, x1 - x0, H - HORIZON);
  drawRow(0, f);
  // the yard in front of the householder's house
  ctx.fillStyle = land('#e2c996', f);
  ctx.beginPath(); ctx.ellipse(W / 2, H - 120, W * 0.62 + offX, 200, 0, 0, TAU); ctx.fill();
  const L = payLayout();
  // a little table with the pennies
  ctx.fillStyle = land('#9a6a38', f);
  roundRect(L.hx - 52, L.y - 44, 34, 40, 4); ctx.fill();
  ctx.fillStyle = land('#b8905a', f); roundRect(L.hx - 58, L.y - 50, 46, 10, 3); ctx.fill();
  ctx.fillStyle = '#f5c542';
  for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(L.hx - 44 + (k % 3) * 8, L.y - 53 - Math.floor(k / 3) * 3, 4.5, 2.2, 0, 0, TAU); ctx.fill(); }

  if (pay) {
    for (const p of pay.wait.slice().reverse()) drawPerson(p);
    drawPerson(boss);
    if (pay.front) drawPerson(pay.front);
    for (const p of pay.done.slice().sort((a, b) => a.y - b.y)) drawPerson(p);
    // a penny flying from the householder's hand
    if (pay.coin) {
      const p = pay.coin.p, k = clamp(pay.coin.t / 0.5, 0, 1);
      const sx = boss.x + 30 * boss.s, sy = boss.y - 40 * boss.s, ex = p.x, ey = p.y - 50 * p.s;
      const cx = lerp(sx, ex, k), cy = lerp(sy, ey, k) - Math.sin(k * Math.PI) * 50;
      ctx.fillStyle = '#f5c542'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, 7 * Math.abs(Math.cos(t * 14)) + 1.5, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
  } else if (boss) drawPerson(boss);
  const da = duskAmt(f);
  ctx.fillStyle = `rgba(255,140,80,${da * 0.2})`; ctx.fillRect(-offX, -offY, viewW, viewH);
}

// ============================================================
//  Bubbles, banners, messages, HUD
// ============================================================
function bubbleAnchor(p) {
  if (p === 'jesus') { const L = frameLayout(); return { x: L.jx + 6, y: L.gy - 76 * L.s * 1.1 }; }
  if (!p || p.x === undefined) return null;
  const head = p.pose === 'sit' ? 66 : 84;
  return { x: p.x, y: p.y - head * (p.s || 1) };
}

function drawSpeech(text, ax, ay, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 44, 420);
  const lines = wrapText(text, maxW - 26);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(ax - w * 0.35, 10, W - 10 - w);
  const by = clamp(ay - 22 - h, 132, H - 20 - h);
  const tx = clamp(ax, bx + 20, bx + w - 20);
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  if (ay > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h); ctx.stroke();
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(tx - 9, by + h - 5, 18, 4);
  }
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawBubbles() {
  for (const b of bubbles) {
    if (b.t <= 0) continue;
    const a = bubbleAnchor(b.p);
    if (!a || a.x < -40 || a.x > W + 40) continue;
    drawSpeech(b.text, a.x, a.y, clamp(b.t / 0.3, 0, 1));
  }
}

function drawBanner() {
  if (!banner || banner.t <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1) * clamp(banner.age / 0.3, 0, 1);
  const maxW = Math.min(W - 40, 700);
  ctx.font = 'italic 600 19px Fredoka, sans-serif';
  const lines = wrapText(banner.text, maxW - 36);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = Math.min(maxW, tw + 36), h = lines.length * 24 + (banner.cite ? 34 : 18);
  const bx = W / 2 - w / 2, by = 116;
  ctx.fillStyle = 'rgba(255,246,220,0.95)'; ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 2.5;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a14'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 9 + 12 + i * 24));
  if (banner.cite) {
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a40';
    ctx.fillText(banner.cite, W / 2, by + h - 13);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = `700 ${W < 560 ? 21 : 24}px Fredoka, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = scene === 'payday' ? H * 0.4 : 300;
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function drawHint() {
  if (!hint || hint.t <= 0 || state !== 'play') return;
  ctx.save();
  ctx.globalAlpha = clamp(hint.t / 0.4, 0, 1) * (0.8 + 0.2 * Math.sin(t * 4));
  ctx.font = `700 ${W < 560 ? 17 : 20}px Fredoka, sans-serif`;
  ctx.textAlign = 'center';
  const lines = wrapText(hint.text, W - 40);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#5a3a00';
  const baseY = H - 18;
  lines.forEach((l, i) => {
    const y = baseY - (lines.length - 1 - i) * 22;
    ctx.strokeText(l, W / 2, y); ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const dark = '#5a4210';

  // Left: level + the day passing
  ctx.textAlign = 'left';
  ctx.fillStyle = dark;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Workers in the Vineyard' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('DAY', 12, 48);
    ctx.shadowBlur = 0;
    const bx = 44, bw = 110;
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#f6a88a'); g.addColorStop(0.2, '#8fcaf0'); g.addColorStop(0.8, '#8fcaf0'); g.addColorStop(1, '#8a6aae');
    ctx.fillStyle = g;
    roundRect(bx, 38, bw, 13, 6.5); ctx.fill();
    // hour ticks for the marketplace visits
    ctx.fillStyle = 'rgba(90,66,16,0.5)';
    for (const h of WAVES) ctx.fillRect(bx + bw * h / 12 - 1, 36, 2, 17);
    const df = dayF();
    ctx.fillStyle = '#ffd43b'; ctx.strokeStyle = '#e8590c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx + bw * df, 44.5, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 4;
    ctx.fillStyle = dark; ctx.font = '700 13px Fredoka, sans-serif';
    ctx.fillText(scene === 'frame' ? '' : HOUR_NAMES[Math.min(12, Math.floor(df * 12 + 1e-6))], bx + bw + 12, 49);
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: grapes pressed, score, labourers
  if (state !== 'title' && scene !== 'frame') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillStyle = pressed >= cfg.quota ? '#2b8a3e' : '#5a2a6a';
    ctx.fillText(`Grapes ${pressed}/${cfg.quota}`, rx, 24);
    ctx.fillStyle = dark;
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.fillText(`Score ${totalScore}`, rx, 44);
    ctx.fillText(`Labourers ${folk.filter((p) => p.hired).length}`, rx, 62);
    const waiting = scene === 'vineyard' && !dusk ? folk.filter((p) => p.state === 'idle').length : 0;
    if (waiting) {
      ctx.fillStyle = Math.sin(t * 6) > 0 ? '#e8590c' : '#b8860b';
      ctx.font = '700 13px Fredoka, sans-serif';
      ctx.fillText(`${waiting} waiting in the market!`, rx, 80);
    }
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (scene === 'frame') drawFrameScene();
  else if (scene === 'payday') drawPaydayScene();
  else drawVineyardScene();
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  if (state !== 'title') {
    drawBubbles();
    drawBanner();
    drawMessage();
    drawHint();
  }

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fade) {
    const a = fade.t < FADE ? fade.t / FADE : 1 - (fade.t - FADE) / FADE;
    ctx.fillStyle = `rgba(255,246,220,${clamp(a, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePeople(dt) {
  const all = [boss, ...listeners, ...folk];
  for (const d of all) {
    if (!d) continue;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
    if (d.shake > 0) d.shake -= dt;
  }
  updateListeners(dt);
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (fade) {
    fade.t += dt;
    if (fade.t >= FADE && !fade.done) { fade.done = true; setScene(fade.next); }
    if (fade.t >= FADE * 2) fade = null;
  }
  if (state === 'play') {
    sceneT += dt;
    for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); } }
    switch (scene) {
      case 'frame': updateFrame(dt); break;
      case 'vineyard': if (!fade) updateVineyard(dt); break;
      case 'payday': if (pay) updatePayday(dt); break;
    }
  } else if (state === 'title') {
    sceneT += dt;
  } else if (state === 'win' && scene === 'payday' && pay) {
    for (const p of pay.done) p.pose = 'cheer';
  }
  for (const b of bubbles) b.t -= dt;
  bubbles = bubbles.filter((b) => b.t > 0);
  if (banner) { banner.t -= dt; banner.age += dt; }
  if (hint) hint.t -= dt;
  pressFx = Math.max(0, pressFx - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  msgCd -= dt;
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
