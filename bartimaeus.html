const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function setupScene() {
  cfg = makeConfig(level);
  bart = newBart();
  rows = makeRows();
  procession = makeProcession();
  jesus = { x: 0, y: ROAD_Y, face: 'calm', pose: 'walk', side: -1, bob: 0 };
  cloak = null;
  particles = []; bubbles = []; shoutFx = []; ripples = [];
  caption = null;
  voice = 0; noise = 0; noisePh = [rand(0, TAU), rand(0, TAU)];
  prog = P_START; walking = true; clarity = 0;
  phase = 'cry'; phaseT = 0; lt = 0; rowT = 0;
  tapCd = 0; shoutT = 0; hushT = level === 1 ? 3.5 : 2.5; muffled = 0; bumps = 0; walkTime = 0;
  noiseMsgCd = 4; chatterCd = 1;
  flashT = shakeT = 0;
  queuedMove = null;
  placeProcession(0);
}

function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1;
  setupScene();
  prog = 0.27; placeProcession(0);
  showOverlay('Blind Bartimaeus', 'Heard by Jesus on the Jericho road',
    `${verseHTML('mercy')}
     <ul>
       <li>Blind Bartimaeus sits begging by the road outside Jericho. <b>Jesus is passing by</b> with a great crowd!</li>
       <li><b>Tap</b> (or <kbd>Space</kbd>) to cry out. Each shout fills the <b>Voice</b> meter.</li>
       <li>Some people turn round to <b>hush</b> him. When someone folds their arms and turns, <b>wait</b> until the "Shh!" is over, then cry out again. When the crowd gets noisy, cry louder!</li>
       <li>Fill the meter while Jesus is <b>near</b> and He will hear you.</li>
       <li>Then guide Bartimaeus through the crowd to Jesus: <b>tap above</b> him to step forward, <b>beside</b> him to sidestep (<kbd>&uarr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd>).</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Cry out!', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel() {
  setupScene();
  state = 'play';
  syncAmbience();
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
  if (level === 1) setTimeout(() => { if (state === 'play' && phase === 'cry' && voice < 10) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap to cry out to Jesus!' : 'Press Space (or click) to cry out!'); }, 2300);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('He can see!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('whole')}
       <p class="score">Heard in time: <b>${s.early}</b><br>Patient crying: <b>${s.patient}</b><br>Gentle steps: <b>${s.steps}</b><br>Came quickly: <b>${s.quick}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Cry out again!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Jesus went by before He heard. Don't give up! Keep the Voice meter full as He comes near, and wait out each "Shh!"</p>
       ${verseHTML('hush')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    sfx.thrust(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (phase === 'cry') {
    if (['Space', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) shout();
  } else if (phase === 'walk') {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) moveBart('up');
    else if (['ArrowDown', 'KeyS'].includes(e.code)) moveBart('down');
    else if (['ArrowLeft', 'KeyA'].includes(e.code)) moveBart('left');
    else if (['ArrowRight', 'KeyD'].includes(e.code)) moveBart('right');
  }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function handleTap(p) {
  if (phase === 'cry') { shout(); return; }
  if (phase !== 'walk') return;
  const dx = p.x - bart.x, dy = p.y - (bart.y - 40 * bartScale(bart.y));
  if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy) * 0.9) moveBart(dx < 0 ? 'left' : 'right');
  else if (dy > 50) moveBart('down');
  else moveBart('up');
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  handleTap(p);
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      // a soft crowd murmur that follows the crowd noise
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.9;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {            // crowd murmur level
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.2);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.12);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  // "Shhh!": a soft hiss
  shh(vol = 0.3) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3800; hp.Q.value = 1.2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.06);
    g.gain.setValueAtTime(vol, t0 + 0.3); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.65);
  },
  chime() { this.tone(880, 0.6, 'sine', 0.22); this.tone(1320, 0.7, 'sine', 0.18, 0.12); this.tone(1760, 0.9, 'sine', 0.14, 0.24); },
  step() { this.tone(320, 0.08, 'triangle', 0.1, 0, 250); },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
};

// ============================================================
//  Rendering
// ============================================================
function placeProcession(dt) {
  jesus.x = lerp(W + 90, -90, prog);
  jesus.bob = walking || state === 'fail' ? Math.abs(Math.sin(t * 8)) * 2 : 0;
  for (const p of procession) {
    p.x = jesus.x + p.dx;
    p.bob = walking || state === 'fail' ? Math.abs(Math.sin(t * 8 + p.phase)) * 2 : 0;
  }
}

// Everything Bartimaeus "sees": drawn into the low-resolution, dim layer
function drawWorld() {
  drawSky();
  drawJericho();
  drawGround();
  // procession (far to near) with Jesus
  const walkers = [...procession.map((p) => ({ y: p.y, draw: () => drawPerson(p) })), { y: jesus.y + 1, draw: () => drawJesus(jesus) }];
  walkers.sort((a, b) => a.y - b.y).forEach((w) => w.draw());
  if (cloak && cloak.landed) drawCloak(cloak);
  // rows of bystanders, far to near, with Bartimaeus slotted in by depth
  // (while he sits at the front he is drawn clearly instead: see drawSharp)
  let bartDrawn = bartIsClear();
  for (let k = rows.length - 1; k >= 0; k--) {
    const r = rows[k];
    if (!bartDrawn && bart.y < r.y - 1) { drawBart(bart); bartDrawn = true; }
    for (const p of r.people) if (p.x > -offX - 40 && p.x < W + offX + 40) drawPerson(p);
  }
  if (!bartDrawn) drawBart(bart);
}

// Sitting at the very front, nothing hides him: draw him clearly so he always reads well
function bartIsClear() { return bart.pose === 'sit' || (bart.row < 0 && !bart.back && state !== 'win'); }

// Clear overlays: things the player must read, and the light of Jesus
function drawSharp() {
  if (bartIsClear()) drawBart(bart);
  if (cloak && !cloak.landed) drawCloak(cloak);

  // the light of Jesus shines through his blindness
  if (clarity < 1) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(jesus.x, jesus.y - 45, 4, jesus.x, jesus.y - 45, 95);
    g.addColorStop(0, `rgba(255,240,170,${(0.55 + pulse * 0.2) * (1 - clarity)})`);
    g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(jesus.x, jesus.y - 45, 95, 0, TAU); ctx.fill();
    ctx.restore();
    // a golden halo you can always make out
    ctx.strokeStyle = `rgba(255,214,90,${0.9 * (1 - clarity)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(jesus.x, jesus.y - 56 - jesus.bob, 15, 0, TAU); ctx.stroke();
  }

  // hushers: turning round (warning), then "Shh!"
  for (const r of rows) for (const p of r.people) {
    if (!p.hush) continue;
    const x = p.x, y = p.y - 84 * p.s;
    if (p.hush.stage === 'turn') {
      const a = 0.6 + 0.4 * Math.sin(t * 14);
      ctx.fillStyle = `rgba(255,250,235,${a})`; ctx.strokeStyle = '#b07a2a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a5a10'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', x, y + 1);
    } else {
      const wob = Math.sin(t * 20) * 2;
      ctx.fillStyle = 'rgba(255,245,245,0.97)'; ctx.strokeStyle = '#c0504d'; ctx.lineWidth = 2.5;
      roundRect(x - 27 + wob, y - 14, 54, 26, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b03a36'; ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Shh!', x + wob, y);
    }
    ctx.textBaseline = 'alphabetic';
  }

  // his cry going out: golden rings from his mouth
  const bs = bartScale(bart.y);
  for (const f of shoutFx) {
    const a = 1 - f.t / 0.6;
    ctx.strokeStyle = `rgba(255,205,70,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bart.x, bart.y - 52 * bs, 16 + f.t * 90, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
  }

  // the Voice meter beside him
  if (phase === 'cry' && (state === 'play' || state === 'fail' || state === 'pause')) drawVoiceMeter();

  drawParticles();
  drawBubbles();
  drawCaption();

  // a soft golden ring at his feet so you can follow him through the blur
  if ((phase === 'walk' || phase === 'meet') && state !== 'win' && !bartIsClear()) {
    const s2 = bartScale(bart.y);
    ctx.strokeStyle = `rgba(255,214,90,${0.65 + 0.25 * Math.sin(t * 4)})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(bart.x, bart.y + 1, 26 * s2, 7 * s2, 0, 0, TAU); ctx.stroke();
  }

  // gap hint during the walk: a soft glow on the next row's gap
  if (phase === 'walk' && state === 'play' && bart.row < rows.length - 1) {
    const r = rows[bart.row + 1];
    const gx = r.gapC + r.shift;
    ctx.fillStyle = `rgba(255,230,140,${0.25 + 0.15 * Math.sin(t * 5)})`;
    ctx.beginPath(); ctx.ellipse(gx, r.y - 2, 24, 7, 0, 0, TAU); ctx.fill();
  }

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 1.6})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
}

function drawVoiceMeter() {
  const x = bart.x + 70, top = 752, h = 124, w = 18;
  const full = voice / 100;
  const near = inEarshot();
  ctx.save();
  ctx.fillStyle = 'rgba(255,252,240,0.9)'; ctx.strokeStyle = near ? '#e0a526' : '#b8a57a'; ctx.lineWidth = 2.5;
  roundRect(x - 3, top - 3, w + 6, h + 6, 10); ctx.fill(); ctx.stroke();
  const g = ctx.createLinearGradient(0, top + h, 0, top);
  g.addColorStop(0, '#f7c948'); g.addColorStop(1, '#fff1a8');
  ctx.fillStyle = hushing() && Math.sin(t * 16) > 0 ? '#e57373' : g;
  if (full > 0) { roundRect(x, top + h * (1 - full), w, h * full, 7); ctx.fill(); }
  // crowd noise shown as a grey mist creeping up the meter
  ctx.fillStyle = 'rgba(120,110,100,0.35)';
  roundRect(x, top + h * (1 - noise * 0.6), w, h * noise * 0.6, 7); ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = '700 11px Fredoka, sans-serif';
  ctx.fillStyle = '#5a4210';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText('VOICE', x + w / 2, top - 8); ctx.fillText('VOICE', x + w / 2, top - 8);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // soft panels so the HUD reads on the dim scene
  ctx.shadowBlur = 0;
  ctx.font = '700 17px Fredoka, sans-serif';
  const nameW = ctx.measureText(state === 'title' ? 'Blind Bartimaeus' : `Level ${level} · ${cfg.name}`).width;
  ctx.fillStyle = 'rgba(255,250,235,0.55)';
  roundRect(4, 4, Math.max(196, nameW + 18), 54, 12); ctx.fill();
  roundRect(viewW - 222, 4, 218, phase === 'cry' ? 70 : 44, 12); ctx.fill();
  ctx.shadowBlur = 4;

  // Left: level + voice
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3510';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Blind Bartimaeus' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  const walkingNow = phase !== 'cry' && state !== 'title';
  ctx.fillText(walkingNow ? 'BUMPS' : 'VOICE', 12, 48);
  ctx.shadowBlur = 0;
  if (walkingNow) {
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillText(`${bumps}`, 60, 49);
  } else {
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(58, 38, 130, 13, 6.5); ctx.fill();
    const gg = ctx.createLinearGradient(58, 0, 188, 0);
    gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
    ctx.fillStyle = gg;
    if (voice > 0) { roundRect(58, 38, 130 * voice / 100, 13, 6.5); ctx.fill(); }
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: where Jesus is on the road, and how loud the crowd is
  const rx = viewW - 12, tw = 140, tl = rx - tw, ty = 36;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.font = '700 12px Fredoka, sans-serif';
  let label = 'JESUS IS COMING', col = '#4a3510';
  if (phase === 'cry' && inEarshot()) { label = 'HE IS NEAR: CRY OUT!'; col = Math.sin(t * 8) > -0.3 ? '#2b8a3e' : '#4a3510'; }
  if (phase === 'cry' && prog > ZONE1) { label = 'HE HAS PASSED BY'; col = '#a33'; }
  if (phase !== 'cry') { label = state === 'win' ? 'HE CAN SEE!' : 'JESUS IS CALLING'; col = '#2b8a3e'; }
  ctx.fillStyle = col;
  ctx.fillText(label, rx, 20);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.22)';
  roundRect(tl, ty - 4, tw, 8, 4); ctx.fill();
  const zx0 = tl + (1 - ZONE1) * tw, zx1 = tl + (1 - ZONE0) * tw;
  ctx.fillStyle = 'rgba(240,190,60,0.85)';
  roundRect(zx0, ty - 4, zx1 - zx0, 8, 4); ctx.fill();
  // Bartimaeus in the middle
  ctx.fillStyle = '#7b5236';
  ctx.beginPath(); ctx.arc(tl + tw / 2, ty + 9, 4, 0, TAU); ctx.fill();
  // Jesus's dot moving right to left
  const jx = tl + clamp(1 - prog, 0, 1) * tw;
  ctx.fillStyle = '#fffdf2'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(jx, ty, 7, 0, TAU); ctx.fill(); ctx.stroke();
  if (phase === 'cry') {
    ctx.font = '600 11px Fredoka, sans-serif'; ctx.fillStyle = '#4a3510';
    ctx.fillText('CROWD', tl - 6, ty + 28);
    ctx.fillStyle = 'rgba(90,66,16,0.22)';
    roundRect(tl, ty + 20, tw, 8, 4); ctx.fill();
    ctx.fillStyle = noise > 0.62 ? '#d9480f' : '#9a8a6a';
    if (noise > 0.01) { roundRect(tl, ty + 20, tw * noise, 8, 4); ctx.fill(); }
  }
  ctx.restore();
}

function render() {
  // The world is drawn small then stretched: that is how blurry his eyes are.
  const blurPx = lerp(BLUR_PX, 0, clarity);
  const k = Math.max(1, blurPx * dpr);
  const ow = Math.max(1, Math.round(canvas.width / k)), oh = Math.max(1, Math.round(canvas.height / k));
  if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
  const f = ow / canvas.width;
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }

  ctx = offCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ow, oh);
  ctx.setTransform(scale * f, 0, 0, scale * f, (offX + sx) * scale * f, (offY + sy) * scale * f);
  drawWorld();

  ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, ow, oh, 0, 0, canvas.width, canvas.height);

  // dim, greyed and shadowed at the edges until his eyes are opened
  const dim = 1 - clarity;
  if (dim > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = 0.62 * dim;
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(30,24,45,${0.3 * dim})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2, cy = canvas.height * 0.6, R = Math.hypot(canvas.width, canvas.height) * 0.62;
    const vg = ctx.createRadialGradient(cx, cy, R * 0.35, cx, cy, R);
    vg.addColorStop(0, 'rgba(15,10,25,0)');
    vg.addColorStop(1, `rgba(15,10,25,${0.6 * dim})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawSharp();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  for (const c of bgClouds) { c.f += (c.speed * dt) / (W + 300); if (c.f > 1) c.f -= 1; }
  updateParticles(dt);
  if (state === 'play') {
    lt += dt;
    tapCd = Math.max(0, tapCd - dt);
    if (phase === 'cry') updateCry(dt);
    else if (phase === 'called') updateCalled(dt);
    else if (phase === 'walk') updateWalk(dt);
    else if (phase === 'meet') updateMeet(dt);
  } else if (state === 'fail') {
    prog += dt / cfg.walkT;               // He walks on down the road
  } else if (state === 'win') {
    clarity = Math.min(1, clarity + dt / 1.4);
    if (Math.random() < dt * 14) {
      const colours = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
      spawn(rand(-offX, W + offX), rand(-offY, H * 0.5), rand(-10, 10), rand(20, 50), 2, colours[Math.floor(Math.random() * colours.length)], rand(2, 4));
    }
  }
  if (state !== 'pause') {
    if (state === 'play' || state === 'title' || state === 'fail') placeProcession(dt);
    if (state === 'play' || state === 'fail' || state === 'win') updateRows(dt);
    for (const r of rows) for (const p of r.people) updatePerson(p, dt, true);
    for (const p of procession) updatePerson(p, dt, false);
  }
  // Bartimaeus's face
  if (state === 'play' && phase === 'cry') bart.mood = shoutT > 0 ? 'shout' : 'blind';
  shoutT = Math.max(0, shoutT - dt);
  // the cast-away cloak
  if (cloak && !cloak.landed) {
    cloak.vy += 700 * dt; cloak.x += cloak.vx * dt; cloak.y += cloak.vy * dt; cloak.rot += cloak.vr * dt;
    if (cloak.vy > 0 && cloak.y > BART_Y - 6) { cloak.y = BART_Y - 6; cloak.landed = true; cloak.rot = 0; sfx.puff(0.15); }
  }
  for (let i = shoutFx.length - 1; i >= 0; i--) { shoutFx[i].t += dt; if (shoutFx[i].t > 0.6) shoutFx.splice(i, 1); }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  if (caption) caption.t -= dt;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' && phase === 'cry' ? 0.15 + noise * 0.6 : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
