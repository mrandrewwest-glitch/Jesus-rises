<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>The Wheat and the Weeds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Wheat and the Weeds</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. Bible.verse() falls back to the KJV (labelled KJV)
// when a version is missing.
const VERSES = {
  // Overlay cards
  sowed:   { ref: 'Matthew 13:24', KJV: 'The kingdom of heaven is likened unto a man which sowed good seed in his field', NKJV: 'The kingdom of heaven is like a man who sowed good seed in his field', NIV: 'The kingdom of heaven is like a man who sowed good seed in his field', NLT: 'The Kingdom of Heaven is like a farmer who planted good seed in his field' },
  harvest: { ref: 'Matthew 13:30', KJV: 'Gather ye together first the tares, and bind them in bundles to burn them: but gather the wheat into my barn.', NKJV: 'First gather together the tares and bind them in bundles to burn them, but gather the wheat into my barn.', NIV: 'First collect the weeds and tie them in bundles to be burned; then gather the wheat and bring it into my barn.', NLT: 'I will tell the harvesters to sort out the weeds, tie them into bundles, and burn them, and to put the wheat in the barn.' },
  shine:   { ref: 'Matthew 13:43', KJV: 'Then shall the righteous shine forth as the sun in the kingdom of their Father.', NKJV: 'Then the righteous will shine forth as the sun in the kingdom of their Father.', NIV: 'Then the righteous will shine like the sun in the kingdom of their Father.', NLT: 'Then the righteous will shine like the sun in their Father’s Kingdom.' },
  nay:     { ref: 'Matthew 13:29', KJV: 'Nay; lest while ye gather up the tares, ye root up also the wheat with them.', NKJV: 'No, lest while you gather up the tares you also uproot the wheat with them.', NIV: 'No... because while you are pulling the weeds, you may uproot the wheat with them.', NLT: 'No... you’ll uproot the wheat if you do.' },
  // Speech bubbles (Jesus telling the parable, and the eager servants)
  enemy:   { ref: 'Matthew 13:25', KJV: 'But while men slept, his enemy came and sowed tares among the wheat, and went his way.', NKJV: 'But while men slept, his enemy came and sowed tares among the wheat and went his way.', NIV: 'But while everyone was sleeping, his enemy came and sowed weeds among the wheat, and went away.', NLT: 'But that night as the workers slept, his enemy came and planted weeds among the wheat, then slipped away.' },
  grow:    { ref: 'Matthew 13:30', KJV: 'Let both grow together until the harvest', NKJV: 'Let both grow together until the harvest', NIV: 'Let both grow together until the harvest', NLT: 'Let both grow together until the harvest' },
  gather:  { ref: 'Matthew 13:28', KJV: 'Wilt thou then that we go and gather them up?', NKJV: 'Do you want us then to go and gather them up?', NIV: 'Do you want us to go and pull them up?', NLT: 'Should we pull out the weeds?' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// Blend two #rrggbb colours
function mix(a, b, f) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((na >> s) & 255, (nb >> s) & 255, clamp(f, 0, 1)));
  return '#' + ((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, '0');
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning & layout (playfield rows, top to bottom)
// ============================================================
const FIELD_TOP = 505;          // back edge of the field
const FIELD_BOT = 772;          // front edge of the field (grass below)
const ROWS = [575, 660, 745];   // base line of each row of plants, back to front
const JESUS_X = 58;             // Jesus sits on a grassy knoll, bottom left
const HIT = 52;                 // generous tap radius for creatures

const LEVEL_NAMES = [
  'The Good Field',
  'A Dry Summer',
  'Goats at the Gate',
  'The Busy Servants',
  'Look-alike Tares',
  'The Great Harvest',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Harvest ${n}`,
    cols: Math.min(7 + n, 12),
    weedFrac: Math.min(0.25 + 0.03 * (n - 1), 0.4),
    seasonDur: Math.min(30 + 6 * (n - 1), 60),
    birdGap: Math.max(5.5 - 0.6 * (n - 1), 2),
    maxBirds: 1 + Math.floor(n / 2),
    peck: 0.11 + 0.03 * n,
    drought: n >= 2,
    droughtGap: Math.max(13 - n, 7),
    dryRate: 0.09 + 0.02 * n,
    goats: n >= 3,
    goatGap: Math.max(15 - n, 7),
    goatTaps: n >= 5 ? 2 : 1,
    goatSpeed: 36 + 4 * n,
    servants: n === 1 ? 1 : n <= 3 ? 2 : 3,
    servantSpeed: 38 + 4 * n,
    minFrac: Math.min(0.45 + 0.04 * (n - 1), 0.7),
    sortTime: Math.max(3.1 - 0.35 * (n - 1), 1.3),
    alike: clamp((n - 1) / 5, 0, 1),
    mistakes: n === 1 ? 4 : 3,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | season | reap | harvest | win | fail | pause
let pausedFrom = 'season';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('wheatBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let plants = [], birds = [], goats = [], servants = [], droughts = [], particles = [], popups = [];
let initialWheat = 0, need = 0;
let introT = 0, introDur = 8.8, introSc = 1;
let seasonT = 0, growth = 0;
let birdT = 0, goatT = 0, droughtT = 0, servantTimes = [];
let pts = 0;              // points from protecting the field this level
let keyCd = 0;
let reapT = 0;
let queue = [], item = null, flyers = [], sorted = 0, sortTotal = 0, mistakes = 0, streak = 0, sortPts = 0, nextT = 0;
let bubble = null;        // Jesus's speech bubble { text, t }
let moodEvent = { mood: 'watch', t: 0 };
let focus = { x: 300, y: FIELD_TOP };
let message = { text: '', t: 0 };
let seen = new Set();
let shakeT = 0, flashT = 0, canFx = null;
let endTimer = 0;
let lastScore = null;
let failReason = '';

function say(text, dur = 3) { bubble = { text, t: dur }; }
function showMessage(text, dur = 2.2) { message = { text, t: dur }; }
function hint(key, text) { if (!seen.has(key)) { seen.add(key); showMessage(text, 2.6); } }

// ============================================================
//  Field geometry
// ============================================================
function spacing() { return clamp((W - 110) / cfg.cols, 32, 64); }
function fieldX0() { return (W - spacing() * cfg.cols) / 2; }
function colX(c) { return fieldX0() + (c + 0.5) * spacing(); }
function plantX(p) { return fieldX0() + (p.col + 0.5 + p.jx) * spacing(); }
function plantY(p) { return ROWS[p.row] + p.jy; }
function plantH(p) { return lerp(6, 80, ease(clamp(growth / 0.8, 0, 1))) * p.hs; }
function headF() { return clamp((growth - 0.42) / 0.25, 0, 1); }
function ripeF() { return clamp((growth - 0.55) / 0.4, 0, 1); }

function makePlants() {
  const list = [];
  const n = cfg.cols * 3;
  const weeds = Math.round(n * cfg.weedFrac);
  const kinds = Array.from({ length: n }, (_, i) => i < weeds);
  for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  let k = 0;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < cfg.cols; col++) {
      list.push({
        col, row, weed: kinds[k++],
        jx: (row % 2 ? 0.18 : -0.12) + rand(-0.08, 0.08), jy: rand(-4, 4),
        hs: rand(0.9, 1.08), hp: 1, alive: true, pulled: false, planted: false,
        warnT: 0, phase: rand(0, TAU), trample: 0,
      });
    }
  }
  return list;
}

function aliveWheat() { return plants.filter((p) => !p.weed && p.alive).length; }

// ============================================================
//  The listening crowd
// ============================================================
const PEOPLE = [
  { robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { robe: '#c46b8c', hair: '#4a2f1a', beard: false, skin: '#e3b184', scarf: '#f2e2c4', kid: true },
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { robe: '#7a4fa0', hair: '#3a2716', beard: false, skin: '#c58a55', scarf: '#e8dcc0' },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', kid: true },
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { robe: '#3c8f86', hair: '#1f140c', beard: false, skin: '#b87a48', scarf: '#d8c7a0' },
  { robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { robe: '#4b7f4b', hair: '#5c3a1c', beard: false, skin: '#dca678', kid: true },
  { robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { robe: '#b08a2e', hair: '#1c120b', beard: false, skin: '#c78f5c', scarf: '#f0d9e0' },
  { robe: '#c05a5a', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
  { robe: '#5b87c9', hair: '#6b3f1d', beard: false, skin: '#e0ae80', kid: true },
  { robe: '#8f6bb5', hair: '#3a2716', beard: true,  skin: '#c98d56' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: rand(0.05, 0.45),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

function crowdSlots() {
  const x0 = JESUS_X + 84, x1 = W - 26;
  const n = clamp(Math.floor((x1 - x0) / 56) + 1, 5, PEOPLE.length);
  const slots = [];
  for (let k = 0; k < n; k++) {
    const d = PEOPLE[k];
    const x = lerp(x0, x1, k / (n - 1));
    slots.push({ d, x, y: H + 6 - (k % 2) * 8, s: d.kid ? 0.8 : 0.98 });
  }
  return slots;
}

function crowdMood() {
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (state === 'title') return 'watch';
  if (moodEvent.t > 0) return moodEvent.mood;
  if (state === 'intro') return introT > 3.6 * introSc && introT < 7.8 * introSc ? 'worried' : 'watch';
  if (state === 'reap') return 'wow';
  if (state === 'harvest') return 'watch';
  if (birds.some((b) => b.state === 'peck') || goats.some((g) => g.state === 'in' && inField(g.x)) ||
      droughts.some((d) => d.t > d.warn) || servants.some((s) => s.state === 'in')) return 'worried';
  return 'watch';
}

function crowdEvent(mood, dur, x, y) {
  moodEvent = { mood, t: dur };
  if (x !== undefined) focus = { x, y: y === undefined ? FIELD_TOP + 60 : y };
}

function updateCrowd(dt) {
  const target = crowdMood();
  for (const d of PEOPLE) {
    if (target !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = target; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

// Draws one person (crowd member or servant). slot.look overrides where they look.
function drawPerson(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward whatever is happening (or at Jesus while He tells the story)
  const wx = x, wy = slot.y - 52 * s;
  let fx = focus.x, fy = focus.y;
  if (slot.look) { fx = slot.look.x; fy = slot.look.y; }
  else if (state === 'title' || (state === 'intro' && introT < 1.2) || (bubble && moodEvent.t <= 0 && state !== 'harvest')) { fx = JESUS_X; fy = H - 80; }
  const dx = fx - wx, dy = fy - wy;
  const len = Math.hypot(dx, dy) || 1;
  const lx = dx / len, ly = dy / len;

  // Arms raised for joy / pointing in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 8, -66);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms (a servant carries his hoe)
  if (slot.hoe) {
    arm(-11, -32, -15, -12);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(slot.hoe * 16, 2); ctx.lineTo(slot.hoe * 22, -70); ctx.stroke();
    ctx.fillStyle = '#9aa0a8';
    ctx.beginPath(); ctx.moveTo(slot.hoe * 22, -70); ctx.lineTo(slot.hoe * 36, -66); ctx.lineTo(slot.hoe * 34, -60); ctx.lineTo(slot.hoe * 21, -64); ctx.fill();
    arm(11 * slot.hoe, -32, 19 * slot.hoe, -38);
  } else if (mood === 'watch' || (mood === 'wow' && d.i % 3 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock' && !slot.hoe) {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Jesus, telling the story from a grassy knoll
// ============================================================
function drawJesus(x, y, pose, face) {
  ctx.save();
  ctx.translate(x, y);

  const up = pose === 'joy';

  if (up || pose === 'teach') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 70);
    g.addColorStop(0, 'rgba(255,235,150,0.45)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 70, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: both raised for joy, one raised while teaching, open otherwise
  let hands = [[-20, -22], [20, -22]];
  if (up) hands = [[-21, -66], [21, -66]];
  else if (pose === 'teach') hands = [[-20, -22], [24, -58 + Math.sin(t * 3) * 3]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (face === 'talk') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 1 + Math.abs(Math.sin(t * 12)) * 1.4, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  ctx.restore();
}

function drawJesusScene() {
  const x = JESUS_X, y = H - 30;
  let pose = 'teach', face = 'calm';
  if (bubble) face = 'talk';
  if (state === 'win') { pose = 'joy'; face = 'joy'; }
  else if ((state === 'season' || state === 'harvest') && !bubble) pose = 'rest';
  drawJesus(x, y, pose, face);
  // The grassy knoll He sits on, in front of His robe
  ctx.fillStyle = '#7fb553';
  ctx.beginPath(); ctx.ellipse(x, H + 8, 62, 30, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9aca6a';
  ctx.beginPath(); ctx.ellipse(x - 6, H + 2, 46, 18, 0, Math.PI, TAU); ctx.fill();
}

// ============================================================
//  Wheat and tares
// ============================================================
// Colours of a ripe head. Tares (darnel) have darker, smaller heads; on later
// levels their colour creeps closer to the wheat's, so look at size and shape too.
function weedHeadColour() { return mix('#56425e', '#c09036', cfg.alike * 0.8); }
function weedStalkColour() { return mix('#6c7a44', '#bf9a3e', cfg.alike * 0.75); }

// One stalk: x, y = base; h = height; hf = head size 0..1; ripe 0..1; hp 0..1
function drawStalk(x, y, h, weed, hf, ripe, hp, sway, s = 1) {
  const dry = 1 - hp;
  let stalk = weed ? mix('#5fa83f', weedStalkColour(), ripe) : mix('#5fa83f', '#d4a22e', ripe);
  stalk = mix(stalk, '#9a7a4a', dry * 0.7);
  const droop = dry * 0.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.rotate(droop * (weed ? -0.5 : 0.5));
  ctx.lineCap = 'round';
  ctx.strokeStyle = stalk; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(sway * 0.3, -h * 0.5, sway, -h); ctx.stroke();
  // leaves
  ctx.fillStyle = stalk;
  ctx.beginPath(); ctx.ellipse(-5 + sway * 0.1, -h * 0.35, 7, 2, -0.6 + droop, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 + sway * 0.2, -h * 0.55, 7, 2, 0.6 + droop, 0, TAU); ctx.fill();
  if (hf > 0) {
    ctx.translate(sway, -h);
    if (!weed) {
      // Wheat: plump golden grains in pairs, long whiskers, the ripe head bows
      const head = mix(mix('#8cc45a', '#f0c048', ripe), '#a08050', dry * 0.6);
      ctx.rotate(ripe * 0.32 + droop);
      ctx.scale(hf, hf);
      ctx.fillStyle = head; ctx.strokeStyle = mix('#5a8a30', '#b0801a', ripe); ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const gy = -i * 4.3;
        ctx.beginPath(); ctx.ellipse(-2.7, gy, 2.8, 4.1, -0.4, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(2.7, gy, 2.8, 4.1, 0.4, 0, TAU); ctx.fill(); ctx.stroke();
      }
      ctx.strokeStyle = mix('#9cc86a', '#e6b53c', ripe); ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const gy = -i * 4.3;
        ctx.moveTo(-3.5, gy - 2); ctx.lineTo(-9, gy - 10);
        ctx.moveTo(3.5, gy - 2); ctx.lineTo(9, gy - 10);
      }
      ctx.stroke();
    } else {
      // Tare: small dark grains, one at a time, spaced out; stands upright
      const head = mix(mix('#8cc45a', weedHeadColour(), ripe), '#6a5a48', dry * 0.4);
      ctx.scale(hf, hf);
      ctx.fillStyle = head; ctx.strokeStyle = shade(head, -35); ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const side = i % 2 ? 1 : -1;
        const gy = -i * 6.2;
        ctx.beginPath(); ctx.ellipse(side * 2.2, gy, 2, 3.1, side * 0.5, 0, TAU); ctx.fill(); ctx.stroke();
      }
      ctx.strokeStyle = shade(head, -20); ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const side = i % 2 ? 1 : -1;
        ctx.moveTo(side * 3, -i * 6.2 - 2); ctx.lineTo(side * 5, -i * 6.2 - 6);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlant(p) {
  const x = plantX(p), y = plantY(p);
  if (!p.planted) return;
  if (!p.alive) {
    if (p.pulled) {
      // a little hole where it was pulled up
      ctx.fillStyle = '#7a5433';
      ctx.beginPath(); ctx.ellipse(x, y, 9, 3.5, 0, 0, TAU); ctx.fill();
    } else {
      // withered, trampled or eaten: a flattened dry stalk
      ctx.strokeStyle = '#a88a5a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 6, x + 22, y - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6, y - 8, x - 12, y - 4); ctx.stroke();
    }
    return;
  }
  const h = plantH(p);
  if (h < 10) {
    // seed and first shoot look the same for wheat and tares
    ctx.fillStyle = '#e8d49a';
    ctx.beginPath(); ctx.ellipse(x, y - 1, 2.4, 1.6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6cb446'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 1, y - h); ctx.stroke();
    return;
  }
  const sway = Math.sin(t * 1.8 + p.phase) * 2 + (p.trample > 0 ? Math.sin(t * 30) * 3 : 0);
  drawStalk(x, y, h, p.weed, headF(), ripeF(), p.hp, sway);
  if (p.warnT > 0) {
    // "Are you sure?" warning over a plant the player tapped
    const a = clamp(p.warnT / 0.3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff4d6'; ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 2.5;
    const by = y - h - 44;
    ctx.beginPath(); ctx.arc(x, by, 12, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d9480f'; ctx.font = '700 17px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', x, by + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }
}

// ============================================================
//  Birds, goats, servants, drought
// ============================================================
function spawnBird() {
  const targets = plants.filter((p) => !p.weed && p.alive && !birds.some((b) => b.target === p));
  if (!targets.length) return;
  const p = targets[Math.floor(Math.random() * targets.length)];
  const fromLeft = Math.random() < 0.5;
  birds.push({ x: fromLeft ? -offX - 40 : W + offX + 40, y: rand(200, 330), target: p, state: 'in', vx: 0, vy: 0, t: 0, dir: fromLeft ? 1 : -1, flap: rand(0, TAU) });
  hint('bird', 'Tap the bird to shoo it!');
}

function birdHeadPos(b) {
  const p = b.target;
  return { x: plantX(p) + 3, y: plantY(p) - plantH(p) - (headF() > 0 ? 14 : 2) };
}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.t += dt; b.flap += dt * (b.state === 'peck' ? 4 : 18);
    if (b.state === 'in') {
      if (!b.target.alive) { b.state = 'out'; continue; }
      const tp = birdHeadPos(b);
      const dx = tp.x - b.x, dy = tp.y - b.y, d = Math.hypot(dx, dy);
      const sp = 170 + level * 12;
      if (d < 6) { b.state = 'peck'; b.t = 0; }
      else { b.x += dx / d * Math.min(sp * dt, d); b.y += dy / d * Math.min(sp * dt, d); b.dir = Math.sign(dx) || b.dir; }
    } else if (b.state === 'peck') {
      const tp = birdHeadPos(b); b.x = tp.x; b.y = tp.y;
      const p = b.target;
      p.hp -= cfg.peck * dt;
      if (Math.random() < dt * 3) spawn(b.x, b.y + 4, rand(-30, 30), rand(-40, -10), 0.5, '#e8c46a', 2, 200);
      if (p.hp <= 0) { killPlant(p); b.state = 'out'; }
    } else {
      b.x += b.dir * 260 * dt; b.y -= 180 * dt;
      if (b.y < -offY - 60 || b.x < -offX - 80 || b.x > W + offX + 80) birds.splice(i, 1);
    }
  }
}

function drawBird(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(b.dir, 1);
  const peck = b.state === 'peck' ? Math.max(0, Math.sin(b.t * 9)) * 0.5 : 0;
  // body
  ctx.fillStyle = '#8a5a3a';
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e9d2b0';
  ctx.beginPath(); ctx.ellipse(3, 3, 8, 5, 0, 0, TAU); ctx.fill();
  // tail
  ctx.fillStyle = '#6b4128';
  ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-22, -7); ctx.lineTo(-21, 2); ctx.closePath(); ctx.fill();
  // head
  ctx.save(); ctx.translate(10, -6); ctx.rotate(peck);
  ctx.fillStyle = '#8a5a3a';
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f0a830';
  ctx.beginPath(); ctx.moveTo(6, -1); ctx.lineTo(12, 1); ctx.lineTo(6, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(2.5, -1.5, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(3.2, -1.5, 1.3, 0, TAU); ctx.fill();
  ctx.restore();
  // wing
  const w = Math.sin(b.flap) * (b.state === 'peck' ? 0.2 : 1);
  ctx.fillStyle = '#6b4128';
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.quadraticCurveTo(-2, -4 - 16 * w, 8, -4 - 12 * w); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function inField(x) { const x0 = fieldX0(); return x > x0 - 10 && x < x0 + spacing() * cfg.cols + 10; }

function spawnGoat() {
  const fromLeft = Math.random() < 0.5;
  goats.push({ x: fromLeft ? -offX - 50 : W + offX + 50, row: Math.floor(rand(0, 3)), dir: fromLeft ? 1 : -1, state: 'in', taps: cfg.goatTaps, t: 0, bleat: 0 });
  hint('goat', 'A goat! Tap it to send it home.');
}

function updateGoats(dt) {
  for (let i = goats.length - 1; i >= 0; i--) {
    const g = goats[i];
    g.t += dt; g.bleat = Math.max(0, g.bleat - dt);
    const sp = g.state === 'out' ? cfg.goatSpeed * 3.2 : cfg.goatSpeed;
    g.x += g.dir * sp * dt;
    if (g.state === 'in' && inField(g.x)) {
      for (const p of plants) {
        if (p.row !== g.row || !p.alive || p.weed || !p.planted) continue;
        if (Math.abs(plantX(p) - g.x) < 20) {
          p.hp -= 0.85 * dt; p.trample = 0.2;
          if (p.hp <= 0) { killPlant(p); crowdEvent('shock', 0.9, g.x, ROWS[g.row] - 30); }
        }
      }
      focus = { x: g.x, y: ROWS[g.row] - 30 };
    }
    if (g.x < -offX - 90 || g.x > W + offX + 90) goats.splice(i, 1);
  }
}

function drawGoat(g) {
  const y = ROWS[g.row] + 6;
  const step = Math.sin(g.t * (g.state === 'out' ? 22 : 10));
  ctx.save();
  ctx.translate(g.x, y - Math.abs(step) * 2);
  ctx.scale(g.dir, 1);
  // legs
  ctx.strokeStyle = '#6d5a48'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, -12); ctx.lineTo(-14 + step * 5, 0);
  ctx.moveTo(-6, -12); ctx.lineTo(-6 - step * 5, 0);
  ctx.moveTo(10, -12); ctx.lineTo(10 - step * 5, 0);
  ctx.moveTo(17, -12); ctx.lineTo(17 + step * 5, 0);
  ctx.stroke();
  // body
  ctx.fillStyle = '#f1ead8'; ctx.strokeStyle = '#b9ab8c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(2, -20, 24, 13, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d9c9a4';
  ctx.beginPath(); ctx.ellipse(-4, -22, 7, 5, 0.3, 0, TAU); ctx.fill();
  // tail
  ctx.fillStyle = '#f1ead8';
  ctx.beginPath(); ctx.ellipse(-24, -28, 3, 6, -0.6, 0, TAU); ctx.fill();
  // head
  ctx.save(); ctx.translate(26, -32 + (g.state === 'in' && inField(g.x) ? Math.sin(g.t * 8) * 3 + 6 : 0));
  ctx.strokeStyle = '#8a7658'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-2, -8); ctx.quadraticCurveTo(-8, -18, -14, -16); ctx.stroke();
  ctx.fillStyle = '#f1ead8'; ctx.strokeStyle = '#b9ab8c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(4, 0, 10, 8, 0.4, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e2d3b2';
  ctx.beginPath(); ctx.ellipse(-4, -3, 6, 2.6, -0.6, 0, TAU); ctx.fill();   // ear
  ctx.fillStyle = '#d7c8a8';
  ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(9, 16); ctx.lineTo(12, 6); ctx.fill();     // beard
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -3, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); ctx.ellipse(6, -3, 1.6, 1, 0, 0, TAU); ctx.fill();
  if (g.bleat > 0) {
    ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(12, 4, 2.2, 2.6, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  if (g.bleat > 0) {
    ctx.fillStyle = '#6a4a20'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Meh-eh!', g.x, y - 58);
  }
}

// Servants come to pull up the tares. Tap them: not yet!
const SERVANT_LOOKS = [
  { robe: '#9c7a54', hair: '#3a2716', beard: true,  skin: '#c98d56', scarf: '#e6d6b0' },
  { robe: '#6f8a9c', hair: '#2e1d10', beard: false, skin: '#d7a070' },
  { robe: '#a3665a', hair: '#4a2f1a', beard: true,  skin: '#b87a48' },
];

function spawnServant() {
  const weeds = plants.filter((p) => p.weed && p.alive);
  if (!weeds.length) return;
  const p = weeds[Math.floor(Math.random() * weeds.length)];
  const fromLeft = plantX(p) < W / 2;
  const look = SERVANT_LOOKS[servants.length % SERVANT_LOOKS.length];
  servants.push({
    x: fromLeft ? -offX - 30 : W + offX + 30, dir: fromLeft ? 1 : -1, target: p, state: 'in', t: 0, sayT: 3.2,
    d: { ...look, i: 1, mood: 'watch', blink: 0, blinkT: 2, phase: rand(0, TAU) },
  });
  hint('servant', 'Tap the servant: wait for the harvest!');
}

function updateServants(dt) {
  for (let i = servants.length - 1; i >= 0; i--) {
    const s = servants[i];
    s.t += dt; s.sayT -= dt;
    s.d.blinkT -= dt;
    if (s.d.blinkT <= 0) { s.d.blink = 0.13; s.d.blinkT = rand(1.5, 5); }
    if (s.d.blink > 0) s.d.blink -= dt;
    if (s.state === 'in') {
      s.d.mood = 'wow';
      if (!s.target.alive) { s.state = 'back'; s.dir = -s.dir; continue; }
      const tx = plantX(s.target);
      s.x += s.dir * cfg.servantSpeed * dt;
      focus = { x: s.x, y: ROWS[s.target.row] - 50 };
      if ((s.dir > 0 && s.x >= tx - 6) || (s.dir < 0 && s.x <= tx + 6)) {
        pullWeed(s.target, s.x);
        s.state = 'back'; s.dir = -s.dir; s.d.mood = 'shock'; s.sayT = 0;
      }
    } else {
      s.x += s.dir * cfg.servantSpeed * 1.5 * dt;
      if (s.t > 0 && s.state === 'back' && s.d.mood !== 'shock') s.d.mood = 'joy';
      if (s.x < -offX - 60 || s.x > W + offX + 60) servants.splice(i, 1);
    }
  }
}

function servantY(s) { return ROWS[s.target.row] + 8; }

function drawServant(s) {
  const bob = Math.abs(Math.sin(s.t * 8)) * 2;
  drawPerson({ d: s.d, x: s.x, y: servantY(s) - bob, s: 0.8, hoe: s.dir, look: { x: s.x + s.dir * 80, y: servantY(s) - 30 } });
}

function drawServantBubble(s) {
  if (s.state !== 'in' || s.sayT <= 0 || servants.find((q) => q.state === 'in' && q.sayT > 0) !== s) return;
  ctx.save();
  ctx.globalAlpha = clamp(s.sayT / 0.3, 0, 1);
  ctx.font = '700 15px Fredoka, sans-serif';
  const lines = wrapText(verseText('gather'), 190);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 20, h = lines.length * 18 + 12;
  const ax = s.x, ay = servantY(s) - 64;
  const bx = clamp(ax - w / 2, 6, W - w - 6), by = ay - 22 - h;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2.5;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax - 8, by + h - 1); ctx.lineTo(ax, ay - 8); ctx.lineTo(ax + 8, by + h - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ax - 8, by + h); ctx.lineTo(ax, ay - 8); ctx.lineTo(ax + 8, by + h); ctx.stroke();
  ctx.fillStyle = '#5a4210'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 6 + 9 + i * 18));
  ctx.restore();
}

function spawnDrought() {
  const w = Math.min(cfg.cols, level >= 4 ? 4 : 3);
  const c0 = Math.floor(rand(0, cfg.cols - w + 1));
  if (droughts.some((d) => !(c0 + w - 1 < d.c0 || c0 > d.c1))) return;
  droughts.push({ c0, c1: c0 + w - 1, t: 0, warn: 1.6, life: 15, fade: 0 });
  hint('drought', 'The ground is dry! Tap it to water.');
}

function droughtRect(d) {
  const sp = spacing();
  return { x0: colX(d.c0) - sp * 0.5, x1: colX(d.c1) + sp * 0.5 };
}

function updateDroughts(dt) {
  for (let i = droughts.length - 1; i >= 0; i--) {
    const d = droughts[i];
    if (d.fade > 0) { d.fade -= dt; if (d.fade <= 0) droughts.splice(i, 1); continue; }
    d.t += dt;
    if (d.t > d.warn) {
      for (const p of plants) {
        if (p.weed || !p.alive || p.col < d.c0 || p.col > d.c1) continue;
        p.hp -= cfg.dryRate * dt;
        if (p.hp <= 0) killPlant(p);
      }
    }
    if (d.t > d.life) d.fade = 0.6;
  }
}

function drawDrought(d) {
  const r = droughtRect(d);
  const a = clamp(d.t / d.warn, 0, 1) * (d.fade > 0 ? d.fade / 0.6 : 1);
  ctx.save();
  ctx.globalAlpha = a * 0.85;
  ctx.fillStyle = '#d8b67a';
  roundRect(r.x0, FIELD_TOP + 6, r.x1 - r.x0, FIELD_BOT - FIELD_TOP - 12, 16); ctx.fill();
  // cracks
  ctx.strokeStyle = '#a8804a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 7; k++) {
    const cx = lerp(r.x0 + 14, r.x1 - 14, ((k * 37) % 7) / 6), cy = FIELD_TOP + 40 + k * 34;
    ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 2, cy + 6); ctx.lineTo(cx + 8, cy - 2); ctx.lineTo(cx + 14, cy + 5);
  }
  ctx.stroke();
  ctx.restore();
}

// The "tap to water" sign floats above the dry patch
function drawDroughtSign(d) {
  if (d.fade > 0) return;
  const r = droughtRect(d);
  const cx = (r.x0 + r.x1) / 2, cy = FIELD_TOP - 24 + Math.sin(t * 4) * 4;
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.strokeStyle = '#2c7fb8'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3a9ae0';
  ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.quadraticCurveTo(cx + 9, cy + 1, cx, cy + 9); ctx.quadraticCurveTo(cx - 9, cy + 1, cx, cy - 11); ctx.fill();
}

function water(d, x, y) {
  d.fade = 0.6;
  canFx = { x, y, t: 0.7 };
  for (let i = 0; i < 26; i++) {
    spawn(rand(droughtRect(d).x0, droughtRect(d).x1), rand(FIELD_TOP - 20, FIELD_TOP + 20), rand(-20, 20), rand(60, 160), rand(0.6, 1.1), Math.random() < 0.5 ? '#6cc1ff' : '#b8e4ff', rand(2, 3.5), 300);
  }
  addPoints(15, x, y - 30);
  crowdEvent('wow', 0.8, x, y);
  sfx.splash();
}

function drawCan() {
  if (!canFx) return;
  const { x, y } = canFx;
  ctx.save();
  ctx.globalAlpha = clamp(canFx.t / 0.2, 0, 1);
  ctx.translate(x - 20, y - 50);
  ctx.rotate(0.5);
  ctx.fillStyle = '#9aa7b4'; ctx.strokeStyle = '#6b7885'; ctx.lineWidth = 2;
  roundRect(-14, -12, 28, 24, 5); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(30, -10); ctx.lineTo(32, -6); ctx.lineTo(14, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-4, -14, 9, Math.PI, TAU); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Particles & score popups
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t -= dt; popups[i].y -= 30 * dt;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function addPoints(n, x, y, col = '#2b8a3e') {
  pts += n;
  popups.push({ text: `+${n}`, x, y, t: 1, col });
}

function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 18px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.4, 0, 1);
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

// ============================================================
//  Plant fates
// ============================================================
function killPlant(p) {
  if (!p.alive) return;
  p.alive = false; p.hp = 0;
  for (let i = 0; i < 6; i++) spawn(plantX(p), plantY(p) - 10, rand(-40, 40), rand(-60, -20), 0.6, '#c9a66b', 2.5, 200);
  if (!p.weed) checkField();
}

// Pulling up a tare before harvest roots up the wheat beside it too (Matthew 13:29)
function pullWeed(p, x) {
  p.alive = false; p.pulled = true;
  let lost = 0;
  const near = plants.filter((q) => q !== p && q.alive && !q.weed && Math.abs(q.col - p.col) <= 1 && Math.abs(q.row - p.row) <= 1)
    .sort((a, b) => (Math.abs(a.col - p.col) + Math.abs(a.row - p.row)) - (Math.abs(b.col - p.col) + Math.abs(b.row - p.row)));
  for (const q of near.slice(0, 2)) { q.alive = false; q.pulled = true; lost++; }
  for (let i = 0; i < 16; i++) spawn(plantX(p), plantY(p) - 6, rand(-80, 80), rand(-140, -40), 0.8, Math.random() < 0.5 ? '#7a5433' : '#6cb446', rand(2, 4), 320);
  crowdEvent('shock', 1.4, plantX(p), plantY(p) - 40);
  say(verseText('nay'), 3.4);
  showMessage(lost ? `Oh no! ${lost} wheat rooted up too!` : 'Pulled up too soon!');
  pts = Math.max(0, pts - 30);
  shakeT = 0.25;
  sfx.pull();
  checkField();
}

function checkField() {
  if (state === 'season' && aliveWheat() < need) fail('field');
}

// ============================================================
//  The story intro: good seed by day, tares by night
// ============================================================
function introPhase() {
  const a = 3.4 * introSc, b = 8.0 * introSc, c = 8.8 * introSc;
  return { a, b, c };
}

function nightF() {
  if (state !== 'intro') return 0;
  const { a, b, c } = introPhase();
  if (introT < a) return 0;
  if (introT < a + 0.8) return (introT - a) / 0.8;
  if (introT < b) return 1;
  return clamp(1 - (introT - b) / (c - b), 0, 1);
}

function enemyX() {
  const { a, b } = introPhase();
  const f = clamp((introT - a - 0.6) / (b - a - 0.9), 0, 1);
  return lerp(-offX - 60, W + offX + 60, f);
}

function updateIntro(dt) {
  introT += dt;
  const { a, b, c } = introPhase();
  // Good seed goes in by day, column by column
  for (const p of plants) {
    if (!p.weed && !p.planted && introT > (0.3 + (p.col / cfg.cols) * 2.4) * introSc) {
      p.planted = true;
      spawn(plantX(p), plantY(p) - 30, 0, 60, 0.4, '#ffe9a0', 2.5);
    }
  }
  if (introT > a && introT - dt <= a) say(verseText('enemy'), b - a);
  // The enemy tiptoes across, flicking tares into the field
  if (introT > a + 0.6 && introT < b) {
    const ex = enemyX();
    for (const p of plants) {
      if (p.weed && !p.planted && plantX(p) < ex) {
        p.planted = true;
        for (let i = 0; i < 3; i++) spawn(ex + 10, ROWS[0] - 70, rand(-20, 20) + (plantX(p) - ex) * 1.5, rand(20, 80), 0.6, '#3d3050', 2.2, 200);
      }
    }
    focus = { x: ex, y: ROWS[1] - 60 };
  }
  if (introT >= c) beginSeason();
}

function drawEnemy() {
  if (state !== 'intro') return;
  const { a, b } = introPhase();
  if (introT < a + 0.4 || introT > b + 0.2) return;
  const x = enemyX();
  const step = introT * 5.5;
  const hop = Math.abs(Math.sin(step)) * 14;
  const y = ROWS[1] + 4 - hop;
  const lean = Math.sin(step) * 0.08;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean);
  const ink = '#241c36';
  // long tiptoeing legs
  ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const s = Math.sin(step);
  ctx.beginPath();
  ctx.moveTo(-5, -30); ctx.lineTo(-10 + s * 10, -8); ctx.lineTo(-6 + s * 12, 0);
  ctx.moveTo(5, -30); ctx.lineTo(10 - s * 10, -8); ctx.lineTo(14 - s * 12, 0);
  ctx.stroke();
  // sack over his shoulder
  ctx.fillStyle = '#3a3048';
  ctx.beginPath(); ctx.ellipse(-20, -66, 15, 18, -0.4, 0, TAU); ctx.fill();
  // cloak
  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.moveTo(-16, -26); ctx.quadraticCurveTo(-18, -60, -4, -76);
  ctx.lineTo(4, -98);                               // pointy hood
  ctx.quadraticCurveTo(18, -74, 16, -60);
  ctx.quadraticCurveTo(20, -40, 16, -26);
  ctx.closePath(); ctx.fill();
  // long nose poking out of the hood
  ctx.beginPath(); ctx.moveTo(12, -72); ctx.quadraticCurveTo(26, -70, 24, -64); ctx.lineTo(12, -66); ctx.fill();
  // shifty eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(4, -74, 3.4, 2.4, 0, 0, TAU); ctx.ellipse(12, -74, 3.4, 2.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = ink;
  const look = Math.sin(introT * 3) > 0 ? 1.4 : -1.4;
  ctx.beginPath(); ctx.arc(4 + look, -74, 1.4, 0, TAU); ctx.arc(12 + look, -74, 1.4, 0, TAU); ctx.fill();
  // flicking hand
  ctx.strokeStyle = ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(10, -52); ctx.lineTo(24, -46 + Math.sin(introT * 14) * 6); ctx.stroke();
  ctx.restore();
  // a moonlit tiptoe "tip... tip..."
  ctx.fillStyle = 'rgba(230,230,255,0.8)'; ctx.font = '600 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
  if (Math.sin(step) > 0.7) ctx.fillText('tip…', x - 10, ROWS[1] - 112);
}

function beginSeason() {
  for (const p of plants) p.planted = true;
  state = 'season';
  seasonT = 0; growth = 0;
  birdT = level === 1 ? 3 : 2;
  droughtT = 7; goatT = 9;
  servantTimes = [];
  for (let k = 0; k < cfg.servants; k++) servantTimes.push(cfg.seasonDur * lerp(0.5, 0.88, cfg.servants === 1 ? 0.2 : k / (cfg.servants - 1)));
  say(verseText('grow'), 3.2);
  if (level === 1) setTimeout(() => { if (state === 'season') showMessage('Protect the wheat until harvest!'); }, 3400);
}

// ============================================================
//  The growing season
// ============================================================
function updateSeason(dt) {
  seasonT += dt;
  growth = clamp(seasonT / cfg.seasonDur, 0, 1);
  const busyEnd = seasonT < cfg.seasonDur - 2.5;

  birdT -= dt;
  if (birdT <= 0 && busyEnd) {
    birdT = cfg.birdGap * rand(0.75, 1.25);
    if (birds.filter((b) => b.state !== 'out').length < cfg.maxBirds) spawnBird();
  }
  if (cfg.drought) {
    droughtT -= dt;
    if (droughtT <= 0 && busyEnd) { droughtT = cfg.droughtGap * rand(0.8, 1.2); spawnDrought(); }
  }
  if (cfg.goats) {
    goatT -= dt;
    if (goatT <= 0 && busyEnd) { goatT = cfg.goatGap * rand(0.8, 1.2); spawnGoat(); }
  }
  while (servantTimes.length && seasonT >= servantTimes[0]) { servantTimes.shift(); spawnServant(); }

  for (const p of plants) { p.warnT = Math.max(0, p.warnT - dt); p.trample = Math.max(0, p.trample - dt); }
  updateBirds(dt);
  updateGoats(dt);
  updateServants(dt);
  updateDroughts(dt);
  if (state !== 'season') return;

  if (seasonT >= cfg.seasonDur) startReap();
}

// Everything the player can tap during the season, most urgent first
function actAt(x, y) {
  for (const b of birds) {
    if (b.state !== 'out' && Math.hypot(b.x - x, b.y - y) < HIT) { shooBird(b); return true; }
  }
  for (const g of goats) {
    if (g.state === 'in' && Math.abs(g.x - x) < HIT && Math.abs(ROWS[g.row] - 24 - y) < HIT) { shooGoat(g); return true; }
  }
  for (const s of servants) {
    if (s.state === 'in' && Math.abs(s.x - x) < HIT - 10 && y > servantY(s) - 110 && y < servantY(s) + 14) { stopServant(s); return true; }
  }
  for (const d of droughts) {
    const r = droughtRect(d);
    if (d.fade <= 0 && x > r.x0 && x < r.x1 && y > FIELD_TOP - 50 && y < FIELD_BOT) { water(d, x, y); return true; }
  }
  // Otherwise: did they tap a plant? Warn first; a second tap pulls it up.
  let bestP = null, bestD = 30;
  for (const p of plants) {
    if (!p.alive) continue;
    const px = plantX(p), py = plantY(p), h = plantH(p);
    if (y < py - h - 30 || y > py + 8) continue;
    const d = Math.abs(px - x);
    if (d < bestD) { bestD = d; bestP = p; }
  }
  if (bestP) {
    if (bestP.warnT > 0) {
      if (bestP.weed) pullWeed(bestP);
      else { bestP.alive = false; bestP.pulled = true; crowdEvent('shock', 1.2, plantX(bestP), plantY(bestP) - 40); say(verseText('nay'), 3.4); showMessage('That was wheat!'); pts = Math.max(0, pts - 30); sfx.pull(); checkField(); }
    } else {
      bestP.warnT = 2.2;
      showMessage('Wait! Pulling now roots up the wheat too.', 2.4);
      crowdEvent('worried', 1, plantX(bestP), plantY(bestP) - 40);
      sfx.bounce();
    }
    return true;
  }
  return false;
}

function shooBird(b) {
  b.state = 'out'; b.dir = b.x < W / 2 ? -1 : 1;
  for (let i = 0; i < 6; i++) spawn(b.x, b.y, rand(-60, 60), rand(-60, 20), 0.6, '#8a5a3a', 2.5, 100);
  addPoints(10, b.x, b.y - 20);
  crowdEvent('wow', 0.6, b.x, b.y);
  sfx.shoo();
}

function shooGoat(g) {
  g.taps--;
  g.bleat = 0.8;
  sfx.bleat();
  if (g.taps <= 0) {
    g.state = 'out'; g.dir = -g.dir;
    addPoints(20, g.x, ROWS[g.row] - 70);
    crowdEvent('joy', 0.8, g.x, ROWS[g.row] - 30);
  } else showMessage('Once more!');
}

function stopServant(s) {
  s.state = 'back'; s.dir = -s.dir; s.t = -0.6; s.d.mood = 'watch';
  addPoints(25, s.x, servantY(s) - 100);
  showMessage('Not yet! Wait for the harvest.');
  crowdEvent('joy', 0.8, s.x, servantY(s) - 50);
  sfx.shoo();
}

// Keyboard: Space deals with the oldest trouble
function actNext() {
  if (keyCd > 0) return;
  keyCd = 0.45;
  const s = servants.find((q) => q.state === 'in');
  if (s) { stopServant(s); return; }
  const g = goats.find((q) => q.state === 'in' && q.x > -20 && q.x < W + 20);
  if (g) { shooGoat(g); return; }
  const b = birds.find((q) => q.state === 'peck') || birds.find((q) => q.state === 'in');
  if (b) { shooBird(b); return; }
  const d = droughts.find((q) => q.fade <= 0);
  if (d) { const r = droughtRect(d); water(d, (r.x0 + r.x1) / 2, ROWS[1]); }
}

// ============================================================
//  Harvest: sort the tares into bundles and the wheat into the barn
// ============================================================
function startReap() {
  state = 'reap';
  reapT = 0;
  birds.forEach((b) => { b.state = 'out'; });
  goats.forEach((g) => { if (g.state === 'in') { g.state = 'out'; g.dir = -g.dir; } });
  servants.forEach((s) => { if (s.state === 'in') { s.state = 'back'; s.dir = -s.dir; } });
  say(verseText('harvest'), 4.2);
  showMessage('Harvest time!');
  crowdEvent('wow', 2, W / 2, ROWS[1] - 60);
}

function startHarvest() {
  state = 'harvest';
  queue = plants.filter((p) => p.alive).map((p) => ({ weed: p.weed, hs: p.hs, phase: p.phase }));
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  sortTotal = queue.length; sorted = 0; mistakes = 0; streak = 0; sortPts = 0;
  item = null; flyers = []; nextT = 0.3;
  if (bubble && bubble.t > 0.5) bubble.t = 0.5;
  if (level === 1) showMessage('Weeds left, wheat right!', 2.6);
  else if (level === 5) showMessage('Look closely: smaller, darker heads are tares!', 2.8);
}

function harvestLayout() {
  const bw = clamp(W * 0.22, 110, 190);
  return { pileX: 14 + bw / 2, barnX: W - 14 - bw / 2, bw, baseY: 770, itemX: W / 2, itemY: 730 };
}

function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt;
    if (f.t >= f.dur) flyers.splice(i, 1);
  }
}

function updateHarvest(dt) {
  updateFlyers(dt);
  if (!item) {
    nextT -= dt;
    if (nextT <= 0) {
      if (queue.length) {
        const q = queue.shift();
        const max = cfg.sortTime * lerp(1, 0.72, sorted / Math.max(1, sortTotal));
        item = { ...q, t: max, max, pop: 0 };
      } else if (!flyers.length) { win(); }
    }
    return;
  }
  item.pop = Math.min(1, item.pop + dt * 6);
  item.t -= dt;
  if (item.t <= 0) {
    // Dropped on the ground
    flyers.push({ ...item, dir: 0, t: 0, dur: 0.5, ok: false });
    miss('Too slow!');
    item = null; nextT = 0.25;
  }
}

function sortItem(dir) {
  if (state !== 'harvest' || !item) return;
  const ok = item.weed ? dir < 0 : dir > 0;
  flyers.push({ ...item, dir, t: 0, dur: 0.45, ok });
  sorted++;
  const L = harvestLayout();
  if (ok) {
    streak++;
    const n = (item.weed ? 30 : 40) + Math.min(streak, 10) * 5;
    sortPts += n;
    popups.push({ text: `+${n}`, x: dir < 0 ? L.pileX : L.barnX, y: L.baseY - 150, t: 1, col: '#2b8a3e' });
    sfx.tap(Math.min(streak, 8) / 8);
    if (streak > 0 && streak % 5 === 0) showMessage(`${streak} in a row!`, 1.2);
  } else {
    miss(item.weed ? 'A tare in the barn!' : 'Good wheat in the bundles!');
  }
  item = null; nextT = 0.12;
}

function miss(text) {
  mistakes++; streak = 0;
  showMessage(text, 1.4);
  crowdEvent('worried', 0.9, W / 2, 620);
  sfx.bounce();
  shakeT = 0.2;
  if (mistakes >= cfg.mistakes) fail('sort');
}

function drawBarn(x, baseY, w) {
  const h = w * 0.78;
  ctx.save();
  ctx.translate(x, baseY);
  // stone walls
  ctx.fillStyle = '#d9c3a0'; ctx.strokeStyle = '#a88c64'; ctx.lineWidth = 2;
  roundRect(-w / 2, -h, w, h, 4); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,120,80,0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let r = 1; r < 5; r++) { const yy = -h + (r * h) / 5; ctx.moveTo(-w / 2 + 2, yy); ctx.lineTo(w / 2 - 2, yy); }
  ctx.stroke();
  // roof
  ctx.fillStyle = '#b8643a'; ctx.strokeStyle = '#8a4526';
  ctx.beginPath(); ctx.moveTo(-w / 2 - 10, -h + 2); ctx.lineTo(0, -h - w * 0.38); ctx.lineTo(w / 2 + 10, -h + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  // big open door with golden grain inside
  ctx.fillStyle = '#5a3a1e';
  roundRect(-w * 0.2, -h * 0.62, w * 0.4, h * 0.62, [w * 0.2, w * 0.2, 0, 0]); ctx.fill();
  const fill = state === 'harvest' || state === 'win' ? clamp(sorted / Math.max(1, sortTotal), 0, 1) : 0.15;
  ctx.fillStyle = '#f0c048';
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.18, h * 0.12 + fill * h * 0.25, 0, Math.PI, TAU); ctx.fill();
  ctx.restore();
}

function drawPile(x, baseY, w) {
  // A gentle little fire pit, and the bound bundles of tares waiting beside it
  ctx.save();
  ctx.translate(x, baseY);
  ctx.scale(w / 80, w / 80);
  w = 80;
  const fl = Math.sin(t * 9) * 3;
  ctx.fillStyle = '#8a8076';
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(-w * 0.18 + k * 9, -4, 7, 5, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#ff9a3c';
  ctx.beginPath(); ctx.moveTo(-w * 0.18 - 16, -6); ctx.quadraticCurveTo(-w * 0.18 - 10, -40 - fl, -w * 0.18, -52 + fl); ctx.quadraticCurveTo(-w * 0.18 + 12, -30, -w * 0.18 + 16, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd35a';
  ctx.beginPath(); ctx.moveTo(-w * 0.18 - 8, -6); ctx.quadraticCurveTo(-w * 0.18 - 4, -26 + fl, -w * 0.18, -32 - fl); ctx.quadraticCurveTo(-w * 0.18 + 7, -20, -w * 0.18 + 8, -6); ctx.closePath(); ctx.fill();
  // bundles (more appear as tares are sorted)
  const n = 1 + Math.min(5, Math.floor(sorted / 3));
  for (let k = 0; k < n; k++) {
    const bx = w * 0.15 + (k % 3) * 16 - 10, by = -Math.floor(k / 3) * 22;
    ctx.fillStyle = mix('#6c7a44', '#56425e', 0.5);
    ctx.beginPath(); ctx.moveTo(bx - 7, by); ctx.lineTo(bx - 10, by - 34); ctx.lineTo(bx + 10, by - 34); ctx.lineTo(bx + 7, by); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9a66b'; ctx.fillRect(bx - 8, by - 18, 16, 4);
  }
  ctx.restore();
}

function drawHarvest() {
  const L = harvestLayout();
  // Stubble where the field was cut
  ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let r = 0; r < 3; r++) for (let x = 20; x < W - 10; x += 22) { const y = ROWS[r] + ((x * 7) % 9); ctx.moveTo(x, y); ctx.lineTo(x + 1, y - 8); }
  ctx.stroke();

  drawPile(L.pileX, L.baseY - 20, L.bw);
  drawBarn(L.barnX, L.baseY - 20, L.bw);

  // Labels and arrows
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText('← Bundles', L.pileX, L.baseY - L.bw * 0.95 - 18); ctx.fillStyle = '#5a3a6a'; ctx.fillText('← Bundles', L.pileX, L.baseY - L.bw * 0.95 - 18);
  ctx.strokeText('Barn →', L.barnX, L.baseY - L.bw * 1.2 - 24); ctx.fillStyle = '#8a5a00'; ctx.fillText('Barn →', L.barnX, L.baseY - L.bw * 1.2 - 24);
  ctx.restore();

  // The stalk to sort, shown big so the heads can be compared
  if (item) {
    const s = 2.3 * (0.6 + 0.4 * ease(item.pop));
    // soft spotlight
    const g = ctx.createRadialGradient(L.itemX, L.itemY - 120, 10, L.itemX, L.itemY - 120, 130);
    g.addColorStop(0, 'rgba(255,250,220,0.85)'); g.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.itemX, L.itemY - 120, 130, 0, TAU); ctx.fill();
    drawStalk(L.itemX, L.itemY, 70 * item.hs, item.weed, 1, 1, 1, Math.sin(t * 2 + item.phase) * 2, s);
    // timer bar
    const f = clamp(item.t / item.max, 0, 1);
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(L.itemX - 50, L.itemY + 14, 100, 10, 5); ctx.fill();
    ctx.fillStyle = f < 0.3 ? '#e8590c' : '#f2b632';
    roundRect(L.itemX - 50, L.itemY + 14, 100 * f, 10, 5); ctx.fill();
  }
  for (const fl of flyers) {
    const f = fl.t / fl.dur;
    let x, y, s;
    if (fl.dir === 0) { x = L.itemX; y = L.itemY + f * 20; s = 2.3 * (1 - f); ctx.globalAlpha = 1 - f; }
    else {
      const tx = fl.dir < 0 ? L.pileX + L.bw * 0.15 : L.barnX;
      x = lerp(L.itemX, tx, f); y = lerp(L.itemY, L.baseY - 40, f) - Math.sin(f * Math.PI) * 120; s = 2.3 * (1 - f * 0.7);
    }
    drawStalk(x, y, 70 * fl.hs, fl.weed, 1, 1, 1, 0, s);
    ctx.globalAlpha = 1;
    if (!fl.ok && fl.dir !== 0) {
      ctx.strokeStyle = '#e03131'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x - 10, y - 30); ctx.lineTo(x + 10, y - 10); ctx.moveTo(x + 10, y - 30); ctx.lineTo(x - 10, y - 10); ctx.stroke();
    }
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const wheat = aliveWheat();
  const wheatPts = wheat * 20;
  const levelBonus = level * 300;
  const score = pts + wheatPts + sortPts + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('wheatBest', best); } catch (e) {} }
  lastScore = { pts, wheat, wheatPts, sortPts, levelBonus, score };
  const L = harvestLayout();
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(L.barnX, L.baseY - 120, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#f0c048', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  showMessage('Safely gathered in!');
  sfx.win();
  endTimer = 1.8;
}

function fail(reason) {
  if (state === 'fail') return;
  state = 'fail';
  failReason = reason;
  item = null;
  sfx.fail();
  endTimer = 1.5;
}

// btn2 / action2 add an optional second, smaller button

function titleScreen() {
  state = 'title';
  cfg = makeConfig(1);
  plants = makePlants();
  plants.forEach((p) => { p.planted = true; });
  growth = 0.9;
  showOverlay('The Wheat and the Weeds', 'A parable of patience',
    `${verseHTML('sowed')}
     <ul>
       <li>An enemy sowed <b>tares</b> (weeds) among the good wheat! Guard the field all season: <b>tap</b> hungry <b>birds</b>, wandering <b>goats</b> and <b>dry ground</b>.</li>
       <li><b>Don't pull the weeds yet</b> &mdash; that roots up the wheat too. Tap the eager <b>servants</b> to say "not yet".</li>
       <li>At <b>harvest</b>, sort fast: <b>tares</b> (smaller, darker, upright heads) to the <b>bundles</b> on the left, golden <b>wheat</b> to the <b>barn</b> on the right. Tap a side or swipe.</li>

function startLevel() {
  cfg = makeConfig(level);
  plants = makePlants();
  initialWheat = aliveWheat();
  need = Math.ceil(initialWheat * cfg.minFrac);
  birds = []; goats = []; servants = []; droughts = []; particles = []; popups = []; flyers = [];
  item = null; queue = [];
  pts = 0; sortPts = 0; sorted = 0; sortTotal = 0; mistakes = 0; streak = 0;
  growth = 0; seasonT = 0; endTimer = 0;
  moodEvent = { mood: 'watch', t: 0 };
  shakeT = flashT = 0; canFx = null;
  introSc = level === 1 ? 1 : 0.75;
  introT = 0;
  state = 'intro';
  hideOverlay();
  say(verseText('sowed'), introPhase().a);
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Safely gathered in!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('harvest')}
       <p style="text-align:center">Jesus explained that the good seed are the children of the kingdom. God is patient, and at the end He will set everything right:</p>
       ${verseHTML('shine')}
       <p class="score">Wheat saved (${s.wheat}): <b>${s.wheatPts}</b><br>Guarding the field: <b>${s.pts}</b><br>Sorting: <b>${s.sortPts}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next season', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'field'
      ? ['The field is bare!', 'Too much wheat was lost. Shoo the birds and goats, water the dry ground &mdash; and leave the weeds for the harvest.']
      : ['A muddled harvest!', 'Too many stalks went the wrong way. Tares have smaller, darker heads that stand upright; ripe wheat is golden, plump, and bows its head.'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('nay')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'intro' || state === 'season' || state === 'reap' || state === 'harvest') {
    pausedFrom = state;
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = pausedFrom;
    hideOverlay();
  }
}

const keys = new Set();
const ripples = [];
let down = null;          // where a harvest swipe started

function skipIntro() {
  if (state !== 'intro') return;
  if (bubble) bubble.t = Math.min(bubble.t, 0.4);
  beginSeason();
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (e.repeat) return;
  if (e.code === 'Space') {
    if (state === 'intro') skipIntro();
    else if (state === 'reap') reapT = 99;
    else if (state === 'season') actNext();
    return;
  }
  if (state === 'harvest') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') sortItem(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') sortItem(1);
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  down = null;
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'intro') { skipIntro(); return; }
  if (state === 'reap') { reapT = 99; return; }
  if (state === 'harvest') { down = p; return; }
  if (state !== 'season') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  actAt(p.x, p.y);
});
// Harvest: a swipe sorts in its direction; a tap sorts to the side tapped
canvas.addEventListener('pointerup', (e) => {
  sfx.init();
  if (state !== 'harvest' || !down) { down = null; return; }
  const p = toPlayfield(e);
  const dx = p.x - down.x;
  const dir = Math.abs(dx) > 30 ? Math.sign(dx) : (down.x < W / 2 ? -1 : 1);
  ripples.push({ x: down.x, y: down.y, t: 0 });
  down = null;
  sortItem(dir);
});
canvas.addEventListener('pointercancel', () => { down = null; });
