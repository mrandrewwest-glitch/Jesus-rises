// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Small extra effects for the field
Object.assign(sfx, {
  shoo() { this.tone(520, 0.14, 'triangle', 0.22, 0, 980); this.puff(0.12); },
  splash() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.35, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.55);
    this.tone(880, 0.12, 'sine', 0.12, 0.05, 1320);
  },
  bleat() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    const lfo = this.ctx.createOscillator(), depth = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 420;
    lfo.frequency.value = 22; depth.gain.value = 40;
    lfo.connect(depth); depth.connect(o.frequency);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
    o.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 0.5); lfo.start(t0); lfo.stop(t0 + 0.5);
  },
  pull() { this.puff(0.3); this.tone(180, 0.25, 'sine', 0.3, 0, 90); },
});

// ============================================================
//  Rendering
// ============================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, FIELD_TOP);
  const warm = state === 'season' ? growth : state === 'reap' || state === 'harvest' || state === 'win' || state === 'fail' ? 1 : 0.2;
  g.addColorStop(0, mix('#8fcaf0', '#f7d98c', warm * 0.35));
  g.addColorStop(0.7, mix('#c7e8fa', '#ffe9b0', warm * 0.5));
  g.addColorStop(1, '#eaf6fc');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, FIELD_TOP + offY + 10);
}

function drawSun() {
  // The sun crosses the sky as the season passes
  const f = state === 'season' ? growth : state === 'intro' || state === 'title' ? 0.1 : 1;
  const x = lerp(W * 0.12, W * 0.88, f), y = 210 - Math.sin(f * Math.PI) * 110;
  const g = ctx.createRadialGradient(x, y, 10, x, y, 90);
  g.addColorStop(0, 'rgba(255,240,170,0.9)'); g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 90, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(x, y, 34, 0, TAU); ctx.fill();
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(120, 360), w: rand(80, 160), speed: rand(4, 9) }));

function drawHills() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#b5d98f';
  ctx.beginPath(); ctx.moveTo(x0, FIELD_TOP + 20);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 420 + Math.sin(x / 110) * 22 + Math.sin(x / 41) * 7);
  ctx.lineTo(x1, FIELD_TOP + 20); ctx.fill();
  ctx.fillStyle = '#9dcc72';
  ctx.beginPath(); ctx.moveTo(x0, FIELD_TOP + 20);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 468 + Math.sin(x / 70 + 1) * 12);
  ctx.lineTo(x1, FIELD_TOP + 20); ctx.fill();
  // The householder's barn on the far hill (big and close at harvest)
  if (state !== 'harvest' && state !== 'win') drawBarn(W - 60, 470, 70);
}

function drawField() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Grass all around
  ctx.fillStyle = '#8cc063';
  ctx.fillRect(x0, FIELD_TOP - 10, x1 - x0, H - FIELD_TOP + 20);
  // Ploughed soil
  const fx0 = state === 'harvest' || state === 'win' ? 6 : fieldX0() - 22;
  const fx1 = state === 'harvest' || state === 'win' ? W - 6 : fieldX0() + spacing() * cfg.cols + 22;
  const g = ctx.createLinearGradient(0, FIELD_TOP, 0, FIELD_BOT);
  const gold = state === 'season' ? ripeF() : state === 'title' || state === 'intro' ? 0 : 1;
  g.addColorStop(0, mix('#a57a4e', '#b99a5c', gold * 0.6));
  g.addColorStop(1, mix('#8a6038', '#a07c46', gold * 0.6));
  ctx.fillStyle = g;
  roundRect(fx0, FIELD_TOP, fx1 - fx0, FIELD_BOT - FIELD_TOP, 22); ctx.fill();
  // furrows
  ctx.strokeStyle = 'rgba(90,60,30,0.35)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const ry of ROWS) { ctx.moveTo(fx0 + 16, ry + 5); ctx.lineTo(fx1 - 16, ry + 5); }
  ctx.stroke();
  // low stone wall along the front, between the story and the crowd
  ctx.fillStyle = '#c9b48f';
  for (let x = x0; x < x1; x += 26) { roundRect(x, FIELD_BOT + 8 + ((x / 26) % 2) * 2, 24, 12, 5); ctx.fill(); }
}

function drawStars() {
  const n = nightF();
  if (n <= 0) return;
  ctx.fillStyle = `rgba(22,26,64,${0.62 * n})`;
  ctx.fillRect(-offX, -offY, viewW, FIELD_BOT + 24 + offY);
  ctx.fillStyle = `rgba(255,255,230,${n})`;
  for (let i = 0; i < 40; i++) {
    const x = -offX + ((i * 97.3) % viewW), y = -offY + ((i * 53.7) % (380 + offY));
    ctx.beginPath(); ctx.arc(x, y, 1.2 + (i % 3) * 0.5 + Math.sin(t * 3 + i) * 0.3, 0, TAU); ctx.fill();
  }
  // crescent moon
  const mx = W * 0.8, my = 150;
  ctx.fillStyle = `rgba(255,248,210,${n})`;
  ctx.beginPath(); ctx.arc(mx, my, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(40,46,96,${n})`;
  ctx.beginPath(); ctx.arc(mx + 12, my - 8, 26, 0, TAU); ctx.fill();
}

function drawBubble() {
  if (!bubble) return;
  const ax = JESUS_X + 12, ay = H - 104;   // near Jesus's mouth
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - JESUS_X - 70, 460);
  const lines = wrapText(bubble.text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = JESUS_X + 34, by = H - 94 - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  // tail down to Jesus
  ctx.beginPath();
  ctx.moveTo(bx + 2, by + h - 22); ctx.lineTo(ax + 6, ay); ctx.lineTo(bx + 18, by + h - 1.5);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx, by + h - 22); ctx.lineTo(ax + 6, ay); ctx.lineTo(bx + 18, by + h);
  ctx.stroke();
  ctx.fillStyle = '#fffbe8';
  ctx.fillRect(bx + 1.5, by + h - 24, 18, 21);
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + wheat meter (with a tick for how much must survive)
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Wheat and the Weeds' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('WHEAT', 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(62, 38, 126, 13, 6.5); ctx.fill();
    const f = initialWheat ? aliveWheat() / initialWheat : 1;
    const low = aliveWheat() < need + 2;
    ctx.fillStyle = low && Math.sin(t * 10) > 0 ? '#ff6b6b' : '#f2b632';
    if (f > 0) { roundRect(62, 38, 126 * f, 13, 6.5); ctx.fill(); }
    const nx = 62 + 126 * (need / Math.max(1, initialWheat));
    ctx.strokeStyle = '#8a2a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(nx, 34); ctx.lineTo(nx, 55); ctx.stroke();
  }

  // Pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: time until harvest, or sorting progress and mistakes
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#5a4210';
  if (state === 'season' || state === 'intro' || (state === 'pause' && (pausedFrom === 'season' || pausedFrom === 'intro'))) {
    ctx.shadowBlur = 4;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('HARVEST', rx, 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(rx - 110, 28, 110, 12, 6); ctx.fill();
    ctx.fillStyle = '#7bbf4a';
    if (growth > 0) { roundRect(rx - 110, 28, 110 * growth, 12, 6); ctx.fill(); }
  } else if (state === 'harvest' || state === 'win' || state === 'fail' || state === 'pause') {
    ctx.shadowBlur = 4;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SORTED', rx, 20);
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillText(`${sorted} / ${sortTotal}`, rx, 40);
    ctx.shadowBlur = 0;
    // one leaf per allowed mistake
    for (let i = 0; i < cfg.mistakes; i++) {
      const x = rx - 8 - i * 20, y = 58;
      ctx.fillStyle = i < cfg.mistakes - mistakes ? '#f2b632' : 'rgba(90,66,16,0.2)';
      ctx.beginPath(); ctx.ellipse(x, y, 6, 8, 0.3, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  let size = 24;
  while (ctx.measureText(message.text).width > W - 30 && size > 15) { size--; ctx.font = `700 ${size}px Fredoka, sans-serif`; }
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, 400);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, 400);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawSun();
  for (const c of bgClouds) drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');
  drawHills();
  drawField();

  if (state === 'harvest' || state === 'win' || (state === 'fail' && failReason === 'sort') || (state === 'pause' && pausedFrom === 'harvest')) {
    drawHarvest();
  } else {
    for (const d of droughts) drawDrought(d);
    // Back to front, each row with the creatures walking in it
    for (let r = 0; r < 3; r++) {
      for (const p of plants) if (p.row === r) drawPlant(p);
      for (const g of goats) if (g.row === r) drawGoat(g);
      for (const s of servants) if (s.target.row === r) drawServant(s);
    }
    for (const d of droughts) drawDroughtSign(d);
    for (const b of birds) drawBird(b);
    for (const s of servants) drawServantBubble(s);
    drawCan();
  }
  drawStars();
  if (state === 'intro' && nightF() > 0.2) drawEnemy();   // stays visible against the night
  drawParticles();

  for (const s of crowdSlots()) drawPerson(s);
  drawJesusScene();
  drawPopups();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBubble();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  for (const c of bgClouds) { c.f += (c.speed * dt) / (viewW + 300); if (c.f > 1) c.f -= 1; }
  updateParticles(dt);
  updateCrowd(dt);
  if (state === 'intro') updateIntro(dt);
  else if (state === 'season') updateSeason(dt);
  else if (state === 'reap') {
    reapT += dt;
    updateBirds(dt); updateGoats(dt); updateServants(dt);
    growth = 1;
    if (reapT > 3.6) startHarvest();
  } else if (state === 'harvest') updateHarvest(dt);
  else if (state === 'win' || state === 'fail') {
    updateFlyers(dt);
    if (state === 'win' && Math.random() < dt * 12) {
      const L = harvestLayout();
      spawn(L.barnX + rand(-60, 60), L.baseY - rand(40, 180), 0, -20, 1, '#fff6d0', 3);
    }
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (canFx) { canFx.t -= dt; if (canFx.t <= 0) canFx = null; }
  moodEvent.t -= dt;
  keyCd = Math.max(0, keyCd - dt);
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
