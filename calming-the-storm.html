<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2748">
<title>Calming the Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1b2748;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(10, 16, 40, 0.35);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 10, 40, 0.45), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Calming the Storm</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Overlay cards
  rebuked:    { ref: 'Mark 4:39',    KJV: 'And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.', NKJV: 'Then He arose and rebuked the wind, and said to the sea, “Peace, be still!” And the wind ceased and there was a great calm.', NIV: 'He got up, rebuked the wind and said to the waves, “Quiet! Be still!” Then the wind died down and it was completely calm.', NLT: 'When Jesus woke up, he rebuked the wind and said to the waves, “Silence! Be still!” Suddenly the wind stopped, and there was a great calm.' },
  obey:       { ref: 'Mark 4:41',    KJV: 'What manner of man is this, that even the wind and the sea obey him?', NKJV: 'Who can this be, that even the wind and the sea obey Him!', NIV: 'Who is this? Even the wind and the waves obey him!', NLT: 'Who is this man?... Even the wind and waves obey him!' },
  awakeHim:   { ref: 'Mark 4:38',    KJV: 'And they awake him, and say unto him, Master, carest thou not that we perish?', NKJV: 'And they awoke Him and said to Him, “Teacher, do You not care that we are perishing?”', NIV: 'The disciples woke him and said to him, “Teacher, don’t you care if we drown?”', NLT: 'The disciples woke him up, shouting, “Teacher, don’t you care that we’re going to drown?”' },
  greatStorm: { ref: 'Mark 4:37',    KJV: 'And there arose a great storm of wind, and the waves beat into the ship, so that it was now full.', NKJV: 'And a great windstorm arose, and the waves beat into the boat, so that it was already filling.', NIV: 'A furious squall came up, and the waves broke over the boat, so that it was nearly swamped.', NLT: 'But soon a fierce storm came up. High waves were breaking into the boat, and it began to fill with water.' },
  // Speech bubbles and on-screen messages
  carestCry:  { ref: 'Mark 4:38',    KJV: 'Master, carest thou not that we perish?', NKJV: 'Teacher, do You not care that we are perishing?', NIV: 'Teacher, don’t you care if we drown?', NLT: 'Teacher, don’t you care that we’re going to drown?' },
  peace:      { ref: 'Mark 4:39',    KJV: 'Peace, be still.', NKJV: 'Peace, be still!', NIV: 'Quiet! Be still!', NLT: 'Silence! Be still!' },
  greatCalm:  { ref: 'Mark 4:39',    KJV: 'And there was a great calm.', NKJV: 'And there was a great calm.', NIV: 'And it was completely calm.', NLT: 'And there was a great calm.' },
  whatManner: { ref: 'Mark 4:41',    KJV: 'What manner of man is this?', NKJV: 'Who can this be?', NIV: 'Who is this?', NLT: 'Who is this man?' },
  saveUs:     { ref: 'Matthew 8:25', KJV: 'Lord, save us!', NKJV: 'Lord, save us!', NIV: 'Lord, save us!', NLT: 'Lord, save us!' },
  perish:     { ref: 'Matthew 8:25', KJV: 'We perish!', NKJV: 'We are perishing!', NIV: 'We’re going to drown!', NLT: 'We’re going to drown!' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function mix(a, b, f) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, f));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, f));
  const bl = Math.round(lerp(pa & 255, pb & 255, f));
  return `rgb(${r},${g},${bl})`;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
const SEA_Y = 620;        // calm water line
const HALF = 220;         // half the boat's length, in boat units
const MAX_ROLL = 0.62;    // tip further than this and she capsizes (about 35 degrees)
const DANGER_ROLL = 0.4;  // the tilt gauge turns red from here
const TIP_GRACE = 0.25;   // seconds she can hang past MAX_ROLL before going over
const K_ROLL = 6;         // how firmly the boat follows the slope of the sea
const D_ROLL = 4.5;       // damping of the rocking
const WAVE_GAIN = 0.9;    // how much the slope of the swell tips the boat
const ROGUE_GAIN = 2.4;   // how much a giant wave tips the boat
const LEAN_EFF = 0.42;    // how far the disciples' weight can lean her (radians)
const SLOSH = 0.55;       // water sloshing to the low side makes the rocking worse
const LEAN_RATE = 6;      // how quickly the crew shifts their weight
const TAP_LEAN_T = 0.8;   // how long one tap keeps them leaning
const WATER_MAX = 10;     // scoops of water that swamp the boat
const PUDDLE_MAX = 3;     // scoops in one puddle
const DECK_MIN = -92, DECK_MAX = 196;     // where water can collect on the floor
const PUDDLE_V = -19;     // puddles sit at the front of the floor, where you can reach them
const JESUS_FEET = { u: -102, v: -33 };   // He lies at the stern, feet toward the bow
const JESUS_S = 1.2;      // He is drawn a little larger than in the other games

const LEVEL_NAMES = [
  'Evening on Galilee',
  'Let Us Pass Over',
  'A Great Storm of Wind',
  'Waves Beat into the Ship',
  'The Ship Was Full',
  'Master, Carest Thou Not?',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Stormy Crossing ${n}`,
    dur: Math.min(26 + 7 * (n - 1), 60),            // seconds until the disciples can wake Him
    swell: Math.min(22 + 3.5 * (n - 1), 36),          // height of the rolling waves
    splashGap: Math.max(0.75, 2.5 - 0.3 * (n - 1)), // seconds between waves splashing in
    splashBig: n >= 3 ? Math.min(0.15 + 0.08 * (n - 3), 0.5) : 0,
    rogueGap: n === 1 ? 13 : Math.max(7, 11 - 1 * (n - 2)),
    rogueH: Math.min(70 + 10 * n, 120),
    rogueWater: n >= 3 ? 3 : 2,
    gust: Math.min(0.04 + 0.03 * (n - 1), 0.18),
    boltGap: Math.max(2.5, 7.5 - 0.8 * n),
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('calmingStormBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let boat;
let puddles = [];
let incoming = [];        // splashes still flying through the air into the boat
let rogues = [];          // giant waves rolling across the sea
let particles = [];
let message = { text: '', t: 0 };
let bubble = null;        // speech bubble { who, text, t }
let warn = null;          // { dir, t } a giant wave is coming
let bolt = null;
let flashT = 0, shakeT = 0, shockT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let calm = 1;             // 1 = full storm, 0 = "there was a great calm"
let wake = 0;             // the Wake-the-Master meter, 0..1
let winT = 0, spoke = false, marvelled = false;
let gust = 0, gustTarget = 0, gustTimer = 0;
let splashTimer = 0, rogueTimer = 0, boltTimer = 0, cryTimer = 0, nagCd = 0;
let stats;
let tut = { bail: false, lean: false };

function newBoat() {
  return { x: W / 2, y: SEA_Y, roll: 0, vr: 0, lean: 0, tapLean: 0, tapLeanT: 0, sink: 0, tipT: 0 };
}

// Boat size grows a little on wide screens
function boatScale() { return clamp((W * 0.45) / HALF, 0.98, 1.45); }

// Boat coordinates (u along the boat, v down) to playfield coordinates
function toWorld(u, v) {
  const bs = boatScale(), c = Math.cos(boat.roll), s = Math.sin(boat.roll);
  return { x: boat.x + (u * c - v * s) * bs, y: boat.y + (u * s + v * c) * bs };
}

// ============================================================
//  Sea
// ============================================================
// The rolling swell (without the giant waves)
function swell(x) {
  return SEA_Y + calm * (cfg.swell * Math.sin(x * 0.009 + t * 1.5) +
                         7 * Math.sin(x * 0.027 - t * 3.3) +
                         3.5 * Math.sin(x * 0.051 + t * 4.1));
}

// How much the giant waves lift the sea at x
function rogueLift(x) {
  let y = 0;
  for (const w of rogues) {
    const d = (x - w.x) / w.w;
    if (d > -3 && d < 3) y += w.h * Math.exp(-d * d);
  }
  return y;
}

// Water surface at a playfield x
function surf(x) { return swell(x) - rogueLift(x); }

function water() { let n = 0; for (const p of puddles) n += p.n; return n; }

function spawnRogue() {
  const dir = Math.random() < 0.5 ? 1 : -1;   // 1 = rolling in from the left
  const speed = 200 + Math.min(level, 8) * 6;
  const lead = 1.9;                            // seconds of warning
  rogues.push({
    x: boat.x - dir * (HALF * boatScale() + speed * lead),
    dir, speed, h: cfg.rogueH * rand(0.9, 1.1), w: 140, hit: false,
  });
  warn = { dir, t: lead };
  sfx.warn();
  if (level === 1 && !tut.lean) {
    showMessage(isTouch() ? 'Big wave! Tap the HIGH side to lean!' : 'Big wave! Hold ← / → to lean!');
  }
}

function updateSea(dt) {
  for (let i = rogues.length - 1; i >= 0; i--) {
    const w = rogues[i];
    w.x += w.dir * w.speed * dt;
    if (state === 'win') w.h *= Math.max(0, 1 - dt * 2.5);
    if (!w.hit && Math.abs(w.x - boat.x) < 40 && state === 'play') {
      // The crest breaks right over the boat
      w.hit = true;
      shakeT = 0.35;
      for (let k = 0; k < cfg.rogueWater; k++) splashIn(rand(DECK_MIN + 20, DECK_MAX - 20), 1, k * 0.12);
    }
    if (Math.random() < dt * 14 * calm) {
      spawn(w.x + rand(-20, 20), surf(w.x) + 4, w.dir * rand(20, 80), rand(-160, -60), 0.7, 'rgba(235,245,255,0.9)', rand(2, 4), 500);
    }
    if (Math.abs(w.x - boat.x) > 1400 || w.h < 1) rogues.splice(i, 1);
  }
  if (warn) { warn.t -= dt; if (warn.t <= 0) warn = null; }
  // spray off the crests
  if (Math.random() < dt * 10 * calm) {
    const x = rand(-offX, W + offX);
    spawn(x, surf(x), rand(-60, 20), rand(-120, -50), 0.6, 'rgba(225,240,255,0.85)', rand(1.5, 3), 500);
  }
}

function updateGust(dt) {
  gustTimer -= dt;
  if (gustTimer <= 0) {
    gustTarget = rand(-1, 1) * cfg.gust;
    gustTimer = rand(1.2, 3.5);
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 1.5);
}

// ============================================================
//  The boat
// ============================================================
function updateBoat(dt) {
  const b = boat, bs = boatScale();
  b.x = W / 2;
  const L = HALF * bs * 0.8;
  const yl = surf(b.x - L), yr = surf(b.x + L);
  const wa = Math.atan2(swell(b.x + L) - swell(b.x - L), 2 * L) * WAVE_GAIN +
             Math.atan2(rogueLift(b.x - L) - rogueLift(b.x + L), 2 * L) * ROGUE_GAIN;
  const wf = water() / WATER_MAX;

  if (state === 'fail') {
    // Over she goes / down she settles
    if (failReason === 'capsize') {
      const target = (Math.sign(b.roll) || 1) * 1.05;
      b.roll += (target - b.roll) * Math.min(1, dt * 3);
      b.sink = Math.min(48 * bs, b.sink + 45 * dt);
    } else {
      b.roll += (wa * 0.4 - b.roll) * Math.min(1, dt * 2);
      b.sink = Math.min(46 * bs, b.sink + 30 * dt);
    }
    b.y = (yl + yr) / 2 - 8 * bs + b.sink;
    return;
  }

  // Which way are the disciples leaning?
  let target = 0;
  if (state === 'play') {
    const kl = keys.has('ArrowLeft') || keys.has('KeyA');
    const kr = keys.has('ArrowRight') || keys.has('KeyD');
    if (kl && !kr) target = -1;
    else if (kr && !kl) target = 1;
    else if (b.tapLeanT > 0) target = b.tapLean;
  }
  b.tapLeanT = Math.max(0, b.tapLeanT - dt);
  b.lean += clamp(target - b.lean, -LEAN_RATE * dt, LEAN_RATE * dt);

  // once He has spoken the boat settles quickly
  const damp = state === 'win' ? D_ROLL * 3 : D_ROLL;
  const acc = K_ROLL * (wa * (state === 'win' ? calm : 1) + gust * calm - b.roll) + K_ROLL * LEAN_EFF * b.lean +
              K_ROLL * SLOSH * wf * b.roll - damp * b.vr;
  b.vr += acc * dt;
  b.roll += b.vr * dt;
  b.y = (yl + yr) / 2 - 8 * bs + wf * 12 * bs;

  if (state === 'play') {
    if (Math.abs(b.roll) > 0.25 && level === 1 && !tut.lean && message.t <= 0) {
      tut.lean = true;
      showMessage(isTouch() ? 'Tap the HIGH side to lean!' : 'Hold ← / → to lean against the tilt!');
    }
    // a moment past the limit is survivable; staying there is not
    b.tipT = Math.abs(b.roll) > MAX_ROLL ? b.tipT + dt : Math.max(0, b.tipT - dt);
    if (b.tipT > TIP_GRACE) fail('capsize');
  }
}

// Which way should the crew lean right now? 0 = all fine
function leanHint() {
  if (state !== 'play') return 0;
  const r = boat.roll + boat.vr * 0.25;
  if (Math.abs(r) > 0.22) return r > 0 ? -1 : 1;   // lean toward the high side
  if (warn) return warn.dir > 0 ? -1 : 1;           // lean toward the incoming wave
  return 0;
}

// ============================================================
//  Water in the boat
// ============================================================
function addWater(u, n) {
  for (let k = 0; k < n; k++) {
    let bestP = null, bd = 60;
    for (const p of puddles) {
      const d = Math.abs(p.u - u);
      if (p.n < PUDDLE_MAX && d < bd) { bd = d; bestP = p; }
    }
    if (bestP) bestP.n++;
    else {
      // find a clear spot on the floor
      let uu = u;
      for (let tries = 0; tries < 8; tries++) {
        if (puddles.every((p) => Math.abs(p.u - uu) > 44)) break;
        uu = rand(DECK_MIN, DECK_MAX);
      }
      puddles.push({ u: clamp(uu, DECK_MIN, DECK_MAX), n: 1, size: 0, wob: rand(0, TAU) });
    }
  }
  if (state === 'play' && water() >= WATER_MAX) fail('swamp');
}

// A wave slaps against the side and throws water into the boat
function splashIn(u, n, delay = 0) {
  incoming.push({ u, n, t: 0.55 + delay, started: false, delay });
}

function updateIncoming(dt) {
  for (let i = incoming.length - 1; i >= 0; i--) {
    const s = incoming[i];
    s.t -= dt;
    if (!s.started && s.t <= 0.55) {
      s.started = true;
      const bs = boatScale();
      const tw = toWorld(s.u, PUDDLE_V);
      const T = 0.55, g = 900;
      for (let k = 0; k < 16; k++) {
        const sx = tw.x + rand(-40, 40) * bs, sy = SEA_Y + rand(10, 30);
        const tx = tw.x + rand(-14, 14), ty = tw.y + rand(-4, 4);
        spawn(sx, sy, (tx - sx) / T, (ty - sy - 0.5 * g * T * T) / T, T + 0.05, k % 3 ? 'rgba(190,225,255,0.95)' : '#ffffff', rand(3, 5.5), g);
      }
      sfx.splash(0.5);
    }
    if (s.t <= 0) {
      incoming.splice(i, 1);
      if (state === 'play') {
        addWater(s.u, s.n);
        const tw = toWorld(s.u, PUDDLE_V);
        for (let k = 0; k < 8; k++) spawn(tw.x, tw.y, rand(-90, 90), rand(-140, -40), 0.4, 'rgba(210,235,255,0.9)', rand(2, 3.5), 700);
        if (level === 1 && !tut.bail && message.t <= 0.5) {
          showMessage(isTouch() ? 'Tap the water to bail it out!' : 'Press Space to bail!');
        }
      }
    }
  }
}

function updatePuddles(dt) {
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i];
    // water slides a little toward the low side
    if (state === 'play') p.u = clamp(p.u + Math.sin(boat.roll) * 55 * dt, DECK_MIN, DECK_MAX);
    const target = state === 'win' && calm < 0.7 ? 0 : p.n;
    p.size += (target - p.size) * Math.min(1, dt * (state === 'win' ? 1.5 : 8));
    if (state === 'win' && p.size < 0.05) puddles.splice(i, 1);
  }
}

function bail(p) {
  if (!p || state !== 'play') return;
  p.n--;
  stats.bailed++;
  tut.bail = true;
  // The disciple nearest the puddle scoops it over the side
  const slot = crewSlots().reduce((a, s) => (Math.abs(s.u - p.u) < Math.abs(a.u - p.u) ? s : a));
  slot.d.bailT = 0.4;
  slot.d.bailDir = boat.roll > 0 ? -1 : 1;
  const bw = toWorld(slot.u, -120);
  for (let k = 0; k < 14; k++) {
    spawn(bw.x + rand(-6, 6), bw.y + rand(-4, 4), slot.d.bailDir * rand(40, 160), rand(-300, -170), rand(0.6, 0.9), k % 3 ? 'rgba(170,215,255,0.95)' : '#ffffff', rand(2.5, 4.5), 900);
  }
  const pw = toWorld(p.u, PUDDLE_V);
  for (let k = 0; k < 6; k++) spawn(pw.x, pw.y, rand(-60, 60), rand(-110, -40), 0.35, 'rgba(210,235,255,0.9)', rand(2, 3), 600);
  if (p.n <= 0) puddles.splice(puddles.indexOf(p), 1);
  sfx.tap(1 - water() / WATER_MAX);
}

// Keyboard: bail the biggest puddle
function bailBiggest() {
  let bestP = null;
  for (const p of puddles) if (!bestP || p.n > bestP.n || (p.n === bestP.n && Math.abs(p.u) < Math.abs(bestP.u))) bestP = p;
  if (bestP) bail(bestP);
}

// ============================================================
//  Disciples
// ============================================================
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
].map((d, i) => ({
  ...d, i,
  mood: 'worried', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.5),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
  bailT: 0, bailDir: 1,
}));

const CREW_U = [-64, -20, 56, 100, 146, 190];

// Where each disciple stands in the boat (boat coordinates). They shift with the lean.
function crewSlots() {
  const n = W < 560 ? 5 : 6;
  const sp = n === 5 ? [-62, -16, 60, 110, 162] : CREW_U;
  const lean = boat ? boat.lean : 0;
  return sp.map((u, k) => ({ d: DISCIPLES[k], u: u + lean * 12, v: -30, s: 0.95 }));
}

const CRIES = [
  // { verse: key } entries are scripture, looked up in the chosen version when spoken
  'Master!', { verse: 'perish' }, 'Bail, bail!', 'Hold on!', 'Is He still asleep?!',
  { verse: 'saveUs' }, 'My sandals are soaked!', 'Andrew, stop splashing me!',
  'Peter, you’re the fisherman!', 'Hang on to the mast!', 'How can He sleep?!',
];

function crowdMood() {
  if (state === 'title') return 'worried';
  if (state === 'fail') return 'dismay';
  if (state === 'win') {
    if (winT < 1.0) return 'wow';
    if (winT < 3.3) return 'shock';      // "they feared exceedingly"
    if (winT < 4.4) return 'wow';
    return 'joy';
  }
  if (shockT > 0 || Math.abs(boat.roll) > DANGER_ROLL) return 'shock';
  const wf = water() / WATER_MAX;
  if (wf < 0.2 && Math.abs(boat.roll) < 0.18 && !warn) return 'watch';
  return 'worried';
}

function updateDisciples(dt) {
  const target = crowdMood();
  for (const d of DISCIPLES) {
    let want = target;
    if (d.name === 'Thomas' && want === 'wow' && state === 'win' && winT > 3.3) want = 'doubt';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
    d.bailT = Math.max(0, d.bailT - dt);
  }
}

function drawDisciple(slot, lx, ly) {
  const { d, u, v, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(u, v - jump * s);
  // lean with the crew's weight, and try to stay upright as the boat rolls
  ctx.rotate((boat.lean * 0.16 - boat.roll * 0.45) + Math.sin(t * 2 + d.phase) * 0.02);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const bailing = d.bailT > 0;
  const hy = -53;

  // Arms raised behind the head for joy / pointing in wonder
  if (!bailing) {
    if (mood === 'joy') {
      const wave = Math.sin(t * 9 + d.phase) * 4;
      arm(-11, -32, -24 + wave, -66);
      arm(11, -32, 24 - wave, -66);
    } else if (mood === 'wow' && d.i % 3 === 0) {
      arm(11, -32, 20 + lx * 6, -70);
    }
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (!bailing) {
    if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && d.i % 3 !== 0)) {
      if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
      else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
    } else if (mood === 'worried') {
      arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
    }
  }

  // Head
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  if (bailing) {
    // Heave-ho! A bucket of water goes over the side
    const tip = d.bailDir * (1 - d.bailT / 0.4) * 0.9;
    arm(-11, -32, -13, -80);
    arm(11, -32, 13, -80);
    ctx.save();
    ctx.translate(0, -86);
    ctx.rotate(tip);
    ctx.fillStyle = '#8b5a2b'; ctx.strokeStyle = '#5e3b1c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(12, -10); ctx.lineTo(9, 8); ctx.lineTo(-9, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, -3); ctx.lineTo(11, -3); ctx.stroke();
    ctx.restore();
  } else if (mood === 'shock') {
    // Hands over the face come last
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus
// ============================================================
// Drawn like the other games: white robe, red sash, brown hair and beard,
// golden halo. Feet at the origin. pose: 'sleep' | 'stand' | 'command'
function drawJesusFigure(pose, glow) {
  if (glow > 0) {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 90);
    g.addColorStop(0, `rgba(255,235,150,${0.6 * glow})`);
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 90, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Feet
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(-6, 0, 4.5, 2.2, 0, 0, TAU); ctx.ellipse(6, 0, 4.5, 2.2, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: folded while asleep, one hand raised over the storm when He speaks
  const hands = pose === 'sleep' ? [[-3, -25], [5, -28]]
    : pose === 'command' ? [[-23, -30], [24, -76]]
    : [[-20, -22], [20, -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    const ex = pose === 'sleep' ? hx : hx * 0.9, ey = pose === 'command' && hy < -50 ? hy + 4 : hy;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face: peacefully asleep, or calm and awake
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (pose === 'sleep') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-4, -53.5, 2.3, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.moveTo(4 + 2.3 * Math.cos(0.15 * Math.PI), -53.5 + 2.3 * Math.sin(0.15 * Math.PI));
    ctx.arc(4, -53.5, 2.3, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
}

// 0 = lying asleep on the cushion, 1 = standing
function jesusRise() { return state === 'win' ? ease(clamp(winT / 0.9, 0, 1)) : 0; }

// When He stands He steps back toward the stern, clear of Peter
function jesusFeetU() { return lerp(JESUS_FEET.u, -150, jesusRise()); }

function jesusHead() {
  const a = lerp(-Math.PI / 2 + 0.12, 0, jesusRise());
  return toWorld(jesusFeetU() + Math.sin(a) * 52 * JESUS_S, JESUS_FEET.v - Math.cos(a) * 52 * JESUS_S);
}

function drawJesusInBoat() {
  const r = jesusRise();
  ctx.save();
  ctx.translate(jesusFeetU(), JESUS_FEET.v + 2 * (1 - r));
  // He rises from the cushion and stands upright even as the boat rocks
  ctx.rotate(lerp(-Math.PI / 2 + 0.12, -boat.roll, r));
  const pose = r < 0.5 ? 'sleep' : state === 'win' && winT > 1.0 && winT < 3.6 ? 'command' : 'stand';
  const glow = state === 'win' ? r : 0;
  ctx.scale(JESUS_S, JESUS_S);
  drawJesusFigure(pose, glow);
  ctx.restore();
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 450) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Lightning
// ============================================================
function updateBolt(dt) {
  if (bolt) bolt.t -= dt;
  if (state !== 'play' && state !== 'title') return;
  boltTimer -= dt;
  if (boltTimer <= 0) {
    boltTimer = cfg.boltGap * rand(0.7, 1.4);
    const x = Math.random() < 0.5 ? rand(-offX + 20, W * 0.3) : rand(W * 0.7, W + offX - 20);
    const pts = [];
    let bx = x, by = -offY;
    while (by < SEA_Y) { pts.push([bx, by]); bx += rand(-30, 30); by += rand(40, 70); }
    pts.push([bx, SEA_Y]);
    bolt = { pts, t: 0.3 };
    flashT = 0.22;
    if (state === 'play') {
      shakeT = 0.15;
      shockT = 0.9;
      gustTarget = (Math.random() < 0.5 ? -1 : 1) * cfg.gust * 1.6;   // a blast of wind follows
      gustTimer = 1.2;
    }
    sfx.thunder();
  }
}

// ============================================================
//  Speech
// ============================================================
function say(who, text, dur = 2.2) { bubble = { who, text, t: dur }; }

function updateCries(dt) {
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (state !== 'play') return;
  cryTimer -= dt;
  if (cryTimer <= 0 && !bubble) {
    cryTimer = rand(4, 7);
    const n = crewSlots().length;
    if (wake >= 1) say(Math.floor(rand(0, n)), 'Master, wake up!');
    else {
      const cry = CRIES[Math.floor(Math.random() * CRIES.length)];
      say(Math.floor(rand(0, n)), typeof cry === 'string' ? cry : verseText(cry.verse));
    }
  }
}

// ============================================================
//  Waking the Master
// ============================================================
function updateWake(dt) {
  if (wake >= 1) return;
  wake = Math.min(1, wake + dt / cfg.dur);
  if (wake >= 1) {
    say(0, verseText('carestCry'), 3.2);
    showMessage(isTouch() ? 'Tap Jesus to wake Him!' : 'Press W or Enter to wake Jesus!');
    sfx.chime();
  }
}

function wakeJesus() {
  if (state !== 'play') return;
  if (wake < 1) {
    if (nagCd <= 0) {
      showMessage('Shh… He is sleeping. Keep the boat afloat!');
      nagCd = 2.5;
    }
    return;
  }
  win();
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  winT = 0; spoke = false; marvelled = false;
  const T = Math.max(1, stats.time);
  const s = {
    time: Math.round(stats.time * 10),
    bailed: stats.bailed * 15,
    dry: Math.round((stats.dry / T) * 400),
    steady: Math.round((stats.steady / T) * 400),
    levelBonus: level * 300,
  };
  s.total = s.time + s.bailed + s.dry + s.steady + s.levelBonus;
  lastScore = s;
  totalScore += s.total;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('calmingStormBest', best); } catch (e) {} }
  warn = null; incoming = []; bubble = null; shockT = 0;
  message.t = 0;
  boat.tapLeanT = 0;
  sfx.chime();
  endTimer = 7;
}

function fail(reason) {
  if (state !== 'play') return;
  state = 'fail';
  failReason = reason;
  warn = null; bubble = null; shockT = 0;
  shakeT = 0.5;
  const c = toWorld(0, 0);
  for (let i = 0; i < 50; i++) {
    const a = rand(Math.PI * 1.05, Math.PI * 1.95), sp = rand(120, 360);
    spawn(c.x + rand(-160, 160), SEA_Y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.2), i % 3 ? 'rgba(200,228,255,0.95)' : '#ffffff', rand(3, 6), 700);
  }
  showMessage(reason === 'capsize' ? 'Whoa! Over she goes!' : 'Glub, glub… swamped!');
  sfx.splash(1);
  sfx.fail();
  endTimer = 2.8;
}

function showMessage(text) { message = { text, t: 2.4 }; }
function isTouch() { return matchMedia('(pointer: coarse)').matches; }

function endScreens(dt) {

      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

const keys = new Set();
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  keys.add(e.code);
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'KeyW' || e.code === 'Enter' || (e.code === 'Space' && wake >= 1)) { wakeJesus(); return; }
  if (['Space', 'ArrowDown', 'KeyS', 'KeyB'].includes(e.code)) bailBiggest();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  const bs = boatScale();
  // Wake the Master once the meter is full
  if (wake >= 1) {
    const jc = toWorld(-128, -40);
    if (Math.hypot(p.x - jc.x, p.y - jc.y) < 75 * bs) { wakeJesus(); return; }
  }
  // Tap a puddle to bail it
  let hit = null, hd = Infinity;
  for (const q of puddles) {
    const w = toWorld(q.u, PUDDLE_V);
    const d = Math.hypot(p.x - w.x, p.y - w.y);
    if (d < (10 + 8 * q.n + 28) * bs && d < hd) { hd = d; hit = q; }
  }
  if (hit) { bail(hit); return; }
  // Anywhere else: everyone lean toward that side
  boat.tapLean = p.x < boat.x ? -1 : 1;
  boat.tapLeanT = TAP_LEAN_T;
  sfx.puff(0.12);
});
