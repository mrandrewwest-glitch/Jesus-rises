// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap (here: each bucket bailed), pitched higher the drier the boat
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}


const sfx = {
  ctx: null, master: null, windGain: null, rainGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      // Storm ambience: a low rumbling wind and a hiss of rain
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 480;
      this.windGain = this.ctx.createGain();
      this.windGain.gain.value = 0;
      src.connect(lp); lp.connect(this.windGain); this.windGain.connect(this.master);
      const hp = this.ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 3200;
      this.rainGain = this.ctx.createGain();
      this.rainGain.gain.value = 0;
      src.connect(hp); hp.connect(this.rainGain); this.rainGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  storm(level) {
    if (!this.windGain) return;
    const w = level * (0.28 + 0.1 * Math.sin(t * 0.7));
    this.windGain.gain.setTargetAtTime(w, this.ctx.currentTime, 0.3);
    this.rainGain.gain.setTargetAtTime(level * 0.05, this.ctx.currentTime, 0.3);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  burst(freq, vol, dur, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  // A bucket of water over the side: a splash and a sung note, higher as the boat gets drier
  tap(height) {
    if (!this.ctx) return;
    this.burst(1600, 0.25, 0.25);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  splash(v) { this.burst(1300, 0.5 * v, 0.4); },
  chime() { this.tone(1046.5, 0.4, 'triangle', 0.18); this.tone(1568, 0.5, 'sine', 0.1, 0.07); },
  warn() { this.tone(98, 0.7, 'sawtooth', 0.08, 0, 82); this.tone(147, 0.7, 'triangle', 0.1); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// ============================================================
//  Rendering
// ============================================================
const skyClouds = Array.from({ length: 10 }, () => ({ f: Math.random(), y: rand(-80, 250), w: rand(180, 340), speed: rand(10, 26) }));
const rain = Array.from({ length: 130 }, () => ({ f: Math.random(), y: rand(0, 1), len: rand(16, 28) }));
const stars = Array.from({ length: 80 }, () => ({ f: Math.random(), y: Math.random(), r: rand(0.7, 2), tw: rand(0, TAU) }));

function updateScenery(dt) {
  for (const c of skyClouds) { c.f += (c.speed * (0.2 + calm) * dt) / (viewW + 400); if (c.f > 1) c.f -= 1; }
  for (const r of rain) { r.y += dt * 1.4; if (r.y > 1) { r.y -= 1; r.f = Math.random(); } }
}

function drawCloud(cx, cy, w, h, top, under) {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function moonPos() { return { x: W * 0.78, y: 120 - offY * 0.3 }; }

function drawSky() {
  const c = 1 - calm;   // 0 in the storm, 1 once it is calm
  const g = ctx.createLinearGradient(0, -offY, 0, SEA_Y);
  g.addColorStop(0, mix('#0b1228', '#0d1b4a', c));
  g.addColorStop(0.6, mix('#1b2748', '#22407f', c));
  g.addColorStop(1, mix('#2a3a63', '#6a8cc8', c));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);

  // Stars come out as the clouds part
  if (c > 0.01) {
    ctx.fillStyle = '#fffbe6';
    for (const s of stars) {
      ctx.globalAlpha = c * (0.55 + 0.45 * Math.sin(t * 2 + s.tw));
      ctx.beginPath();
      ctx.arc(-offX + s.f * viewW, -offY + s.y * (SEA_Y - 120 + offY), s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // The moon, hidden behind the storm
  const m = moonPos();
  const mg = ctx.createRadialGradient(m.x, m.y, 10, m.x, m.y, 130);
  mg.addColorStop(0, `rgba(255,250,220,${0.2 + 0.4 * c})`);
  mg.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(m.x, m.y, 130, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.35 + 0.65 * c;
  ctx.fillStyle = '#f6f0d4';
  ctx.beginPath(); ctx.arc(m.x, m.y, 34, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // Rolling storm clouds, which part and blow away when He speaks
  for (const cl of skyClouds) {
    let x = -offX - 200 + (cl.f * (viewW + 400)) % (viewW + 400);
    x += Math.sign(x - W / 2 || 1) * c * (W * 0.9);
    ctx.globalAlpha = 0.3 + 0.65 * calm;
    drawCloud(x, cl.y - c * 140, cl.w, cl.w * 0.34, '#4b5570', '#343c52');
  }
  ctx.globalAlpha = 1;
  // a heavy lid of cloud over everything
  if (calm > 0.01) {
    const lid = ctx.createLinearGradient(0, -offY, 0, 260);
    lid.addColorStop(0, `rgba(22,26,42,${0.85 * calm})`);
    lid.addColorStop(1, 'rgba(22,26,42,0)');
    ctx.fillStyle = lid;
    ctx.fillRect(-offX, -offY, viewW, 260 + offY);
  }
}

function drawBolt() {
  if (!bolt || bolt.t <= 0) return;
  ctx.save();
  ctx.strokeStyle = '#fffbd0'; ctx.lineWidth = 4; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 16;
  ctx.globalAlpha = clamp(bolt.t / 0.15, 0, 1);
  ctx.beginPath();
  ctx.moveTo(bolt.pts[0][0], bolt.pts[0][1]);
  for (const [x, y] of bolt.pts) ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

function drawSea(front) {
  const x0 = -offX - 10, x1 = viewW - offX + 10;
  const c = 1 - calm;
  const clipBoat = front && boat && state !== 'fail';
  if (clipBoat) {
    // The near water may hide the hull, but never the people or the water inside the boat
    ctx.save();
    ctx.beginPath();
    ctx.rect(-offX - 20, -offY - 20, viewW + 40, viewH + 40);
    [[-236, -420], [252, -420], [252, -56], [196, -12], [-192, -12], [-236, -44]].forEach(([u, v], i) => {
      const p = toWorld(u, v);
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.clip('evenodd');
  }
  ctx.beginPath();
  ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, surf(x) + (front ? 16 : 0));
  ctx.lineTo(x1, H + 10);
  ctx.closePath();
  if (front) {
    const g = ctx.createLinearGradient(0, SEA_Y - 60, 0, H);
    g.addColorStop(0, 'rgba(40,86,140,0.5)');
    g.addColorStop(0.15, mix('#183a68', '#23508a', c).replace('rgb', 'rgba').replace(')', ',0.9)'));
    g.addColorStop(1, 'rgba(10,26,54,1)');
    ctx.fillStyle = g;
    ctx.fill();
    // foamy edge on the near water
    ctx.strokeStyle = `rgba(215,235,255,${0.25 + 0.35 * calm})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, surf(x) + 16);
    ctx.stroke();
    // Moonlight on the still water
    if (c > 0.01) {
      const m = moonPos();
      ctx.fillStyle = '#fff6d0';
      for (let i = 0; i < 9; i++) {
        ctx.globalAlpha = c * (0.35 - i * 0.03) * (0.7 + 0.3 * Math.sin(t * 3 + i));
        const w = 46 - i * 3 + Math.sin(t * 2 + i * 1.7) * 6;
        ctx.beginPath(); ctx.ellipse(m.x, SEA_Y + 8 + i * 16, w, 2.5, 0, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (clipBoat) ctx.restore();
  } else {
    const g = ctx.createLinearGradient(0, SEA_Y - 80, 0, H);
    g.addColorStop(0, mix('#2f5f96', '#4a82c0', c));
    g.addColorStop(1, '#0d2244');
    ctx.fillStyle = g;
    ctx.fill();
  }
}

function drawFoam() {
  ctx.strokeStyle = 'rgba(235,245,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const w of rogues) {
    if (w.h < 10) continue;
    const top = surf(w.x);
    const d = -w.dir;
    ctx.beginPath();
    ctx.arc(w.x + d * w.w * 0.12, top + 9, 10, d > 0 ? Math.PI * 1.05 : Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w.x + d * w.w * 0.9, surf(w.x + d * w.w * 0.9) + 2);
    ctx.quadraticCurveTo(w.x + d * w.w * 0.4, top - 2, w.x, top + 1);
    ctx.stroke();
  }
}

function drawRain() {
  const s = calm;
  if (s < 0.05) return;
  ctx.strokeStyle = `rgba(200,215,240,${0.35 * s})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const slant = 0.35 + gust * 2;
  for (const r of rain) {
    const x = -offX + r.f * (viewW + 100);
    const y = -offY + r.y * (viewH + 40) - 20;
    ctx.moveTo(x, y); ctx.lineTo(x - r.len * slant, y + r.len);
  }
  ctx.stroke();
}

// The fishing boat, drawn in boat coordinates (half-length 220), rocking with the sea
function drawBoat() {
  const bs = boatScale();
  ctx.save();
  ctx.translate(boat.x, boat.y);
  ctx.rotate(boat.roll);
  ctx.scale(bs, bs);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // Rigging, mast and the furled sail
  ctx.strokeStyle = 'rgba(60,40,20,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(18, -248); ctx.lineTo(-226, -44); ctx.moveTo(18, -248); ctx.lineTo(238, -52); ctx.stroke();
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(18, -30); ctx.lineTo(18, -252); ctx.stroke();
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-72, -216); ctx.lineTo(112, -232); ctx.stroke();
  const flap = Math.sin(t * 8) * 12 * calm, flap2 = Math.sin(t * 11 + 1) * 8 * calm;
  // loose corner of the sail flapping in the wind
  ctx.fillStyle = '#e9dfc4';
  ctx.beginPath();
  ctx.moveTo(60, -226);
  ctx.quadraticCurveTo(96 + flap, -196 + flap2, 128 + flap * 1.6, lerp(-208, -150, 1 - calm) + flap2);
  ctx.lineTo(106, -231);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#e9dfc4'; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(-64, -212); ctx.lineTo(104, -227); ctx.stroke();
  ctx.strokeStyle = '#b9a67c'; ctx.lineWidth = 2.5;
  for (const u of [-40, 0, 40, 80]) { ctx.beginPath(); ctx.moveTo(u, -222 - u * 0.087 + 12); ctx.lineTo(u + 2, -222 - u * 0.087 - 3); ctx.stroke(); }
  // pennant at the masthead
  ctx.fillStyle = '#c0392b';
  const pw = Math.sin(t * 12) * 5 * calm;
  ctx.beginPath();
  ctx.moveTo(18, -252); ctx.lineTo(18, -240);
  ctx.lineTo(lerp(20, 50, calm) + pw, lerp(-222, -246, calm) + pw * 0.5);
  ctx.closePath(); ctx.fill();

  // Inside of the far side of the hull
  const inner = new Path2D();
  inner.moveTo(-232, -42);
  inner.quadraticCurveTo(-205, -54, -150, -52);
  inner.lineTo(150, -52);
  inner.quadraticCurveTo(212, -56, 244, -52);
  inner.lineTo(200, -12);
  inner.lineTo(-196, -12);
  inner.closePath();
  ctx.fillStyle = '#5e3b1c';
  ctx.fill(inner);
  ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-232, -42); ctx.quadraticCurveTo(-205, -54, -150, -52); ctx.lineTo(150, -52); ctx.quadraticCurveTo(212, -56, 244, -52);
  ctx.stroke();
  // floor boards
  ctx.fillStyle = '#7a4e27';
  roundRect(-205, -38, 410, 28, 12); ctx.fill();
  ctx.strokeStyle = '#6a4220'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-200, -29); ctx.lineTo(200, -29); ctx.moveTo(-200, -20); ctx.lineTo(200, -20); ctx.stroke();
  // ribs
  ctx.strokeStyle = '#4e3117'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (const u of [-150, -80, 90, 160]) { ctx.moveTo(u, -50); ctx.lineTo(u * 0.95, -38); }
  ctx.stroke();

  // Stern seat and the pillow (Mark 4:38)
  ctx.fillStyle = '#8b5a2b';
  roundRect(-212, -36, 112, 9, 4); ctx.fill();
  ctx.fillStyle = '#9b3b5a';
  ctx.beginPath(); ctx.ellipse(-166, -37, 21, 9, -0.08, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c96a8a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-182, -39); ctx.quadraticCurveTo(-166, -44, -150, -40); ctx.stroke();

  // Water sloshing in the bottom of the boat (its surface stays level)
  let wet = 0;
  for (const p of puddles) wet += p.size;
  const wf = clamp(wet / WATER_MAX, 0, 1);
  if (wf > 0.01) {
    ctx.save();
    ctx.clip(inner);
    const h0 = -11 - wf * 34, tn = Math.tan(boat.roll);
    ctx.fillStyle = 'rgba(80,150,215,0.55)';
    ctx.beginPath();
    ctx.moveTo(-250, h0 + 250 * tn); ctx.lineTo(250, h0 - 250 * tn); ctx.lineTo(250, 10); ctx.lineTo(-250, 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(220,240,255,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let u = -250; u <= 250; u += 10) {
      const y = h0 - u * tn + Math.sin(u * 0.08 + t * 6) * 1.5;
      (u === -250 ? ctx.moveTo : ctx.lineTo).call(ctx, u, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Jesus asleep on the pillow, and the disciples
  drawJesusInBoat();
  const slots = crewSlots();
  slots.forEach((s) => {
    const [lx, ly] = crewLook(s);
    drawDisciple(s, lx, ly);
  });

  // Puddles, splashed in by the waves (tap to bail)
  for (const p of puddles) drawPuddle(p);

  // Near side of the hull
  const hull = new Path2D();
  hull.moveTo(-234, -44);
  hull.quadraticCurveTo(-222, -16, -192, -12);
  hull.lineTo(196, -12);
  hull.quadraticCurveTo(228, -16, 246, -56);
  hull.quadraticCurveTo(238, 6, 176, 34);
  hull.lineTo(-160, 34);
  hull.quadraticCurveTo(-220, 22, -234, -44);
  hull.closePath();
  const hg = ctx.createLinearGradient(0, -12, 0, 34);
  hg.addColorStop(0, '#96622f'); hg.addColorStop(1, '#6b4220');
  ctx.fillStyle = hg;
  ctx.fill(hull);
  ctx.save();
  ctx.clip(hull);
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (const y of [0, 12, 24]) { ctx.moveTo(-240, y); ctx.lineTo(250, y); }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#b07b40'; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-234, -44); ctx.quadraticCurveTo(-222, -16, -192, -12); ctx.lineTo(196, -12); ctx.quadraticCurveTo(228, -16, 246, -56);
  ctx.stroke();
  // a painted eye on the bow, like the old Galilee boats
  ctx.fillStyle = '#f3ead2';
  ctx.beginPath(); ctx.ellipse(204, 2, 9, 5, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12';
  ctx.beginPath(); ctx.arc(206, 2, 3, 0, TAU); ctx.fill();

  ctx.restore();
}

// Where a disciple is looking
function crewLook(s) {
  let dx, dy;
  if (s.d.bailT > 0) { dx = 0; dy = -1; }
  else if (state === 'win' || (state === 'play' && wake >= 1 && s.d.i % 2 === 0)) {
    dx = jesusFeetU() - 40 - s.u; dy = 20;
  } else if (warn) { dx = warn.dir > 0 ? -1 : 1; dy = -0.2; }
  else if (state === 'fail') { dx = 0; dy = 1; }
  else {
    // glancing between the waves and the sleeping Master
    const ph = Math.sin(t * 0.8 + s.d.phase * 3);
    dx = ph > 0.2 ? -1 : ph < -0.4 ? 1 : 0.2; dy = ph > 0.2 ? 0.25 : -0.5;
  }
  const l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

function drawPuddle(p) {
  const n = p.size;
  if (n < 0.05) return;
  const rx = 10 + 8 * n, ry = 3.5 + 1.8 * n;
  const wob = Math.sin(t * 5 + p.wob) * 1.5;
  ctx.fillStyle = 'rgba(105,180,240,0.95)';
  ctx.beginPath(); ctx.ellipse(p.u, PUDDLE_V, rx + wob, ry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(230,245,255,0.9)'; ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(225,244,255,0.95)';
  ctx.beginPath(); ctx.ellipse(p.u - rx * 0.3, PUDDLE_V - ry * 0.25, rx * 0.32, ry * 0.3, 0, 0, TAU); ctx.fill();
  // it keeps sloshing: little droplets jump up
  ctx.fillStyle = 'rgba(200,232,255,0.95)';
  for (let k = 0; k < Math.ceil(n); k++) {
    const ph = (t * 1.6 + p.wob + k * 0.37) % 1;
    const hx = p.u + (k - (Math.ceil(n) - 1) / 2) * rx * 0.55;
    ctx.beginPath(); ctx.arc(hx, PUDDLE_V - 3 - Math.sin(ph * Math.PI) * (8 + 3 * n), 2.2, 0, TAU); ctx.fill();
  }
}

function drawZzz() {
  if (jesusRise() > 0 || state === 'win') return;
  const h = jesusHead();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const ph = (t * 0.45 + i / 3) % 1;
    const x = h.x + 8 + ph * 30 + Math.sin(t * 2 + i * 2) * 4;
    const y = h.y - 18 - ph * 56;
    ctx.globalAlpha = Math.sin(ph * Math.PI);
    ctx.font = `700 ${Math.round(12 + ph * 12)}px Fredoka, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(15,22,48,0.8)';
    ctx.strokeText(i % 2 ? 'z' : 'Z', x, y);
    ctx.fillStyle = '#e8f0ff';
    ctx.fillText(i % 2 ? 'z' : 'Z', x, y);
  }
  ctx.restore();
}

function drawWakePrompt() {
  if (state !== 'play' || wake < 1) return;
  const bs = boatScale();
  const c = toWorld(-128, -40);
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  const g = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, 80 * bs);
  g.addColorStop(0, `rgba(255,232,140,${0.3 + 0.25 * pulse})`);
  g.addColorStop(1, 'rgba(255,232,140,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(c.x, c.y, 80 * bs, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(255,226,122,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(c.x, c.y, (48 + pulse * 8) * bs, 0, TAU); ctx.stroke();
  const label = isTouch() ? 'Tap to wake Him!' : 'Press W to wake Him!';
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 20px Fredoka, sans-serif';
  const tx = clamp(c.x, 100, W - 100), ty = c.y + 92 * bs + pulse * 4;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(15,22,48,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(label, tx, ty);
  ctx.fillStyle = '#ffe27a';
  ctx.fillText(label, tx, ty);
  ctx.restore();
}

// Chunky arrow telling the crew which way to lean
function drawLeanHint() {
  const dir = leanHint();
  if (!dir) return;
  const bs = boatScale();
  const p = toWorld(dir * 170, -175);
  const x = clamp(p.x, 70, W - 70), y = p.y;
  const pulse = 0.5 + 0.5 * Math.sin(t * 10);
  ctx.save();
  ctx.translate(x + dir * pulse * 6, y);
  ctx.scale(dir * Math.min(1.2, bs), Math.min(1.2, bs));
  ctx.beginPath();
  ctx.moveTo(26, 0); ctx.lineTo(6, -18); ctx.lineTo(6, -8); ctx.lineTo(-22, -8);
  ctx.lineTo(-22, 8); ctx.lineTo(6, 8); ctx.lineTo(6, 18); ctx.closePath();
  ctx.fillStyle = Math.abs(boat.roll) > DANGER_ROLL ? '#ff8a6b' : '#ffe27a';
  ctx.strokeStyle = 'rgba(15,22,48,0.9)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.stroke(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(15,22,48,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText('LEAN', x, y - 26);
  ctx.fillStyle = '#fff3cf';
  ctx.fillText('LEAN', x, y - 26);
  ctx.restore();
}

function drawWarn() {
  if (!warn || state !== 'play') return;
  const left = warn.dir > 0;
  const x = left ? -offX + 16 : W + offX - 16;
  const y = 200;
  const pulse = Math.sin(t * 14) > 0;
  ctx.save();
  ctx.textAlign = left ? 'left' : 'right';
  ctx.font = '700 22px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(15,22,48,0.9)'; ctx.lineJoin = 'round';
  const txt = left ? 'BIG WAVE! →' : '← BIG WAVE!';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = pulse ? '#ffb86b' : '#fff3cf';
  ctx.fillText(txt, x, y);
  ctx.restore();
}

// "Tap!" pointer over the first puddle, for the first level
function drawTutorial() {
  if (state !== 'play' || level !== 1 || tut.bail || !puddles.length || !isTouch()) return;
  const p = puddles[0];
  const w = toWorld(p.u, PUDDLE_V);
  const bob = Math.abs(Math.sin(t * 6)) * 8;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(15,22,48,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText('Tap!', w.x, w.y + 52 + bob);
  ctx.fillStyle = '#fff3cf';
  ctx.fillText('Tap!', w.x, w.y + 52 + bob);
  ctx.beginPath();
  ctx.moveTo(w.x, w.y + 14 + bob); ctx.lineTo(w.x - 8, w.y + 28 + bob); ctx.lineTo(w.x + 8, w.y + 28 + bob); ctx.closePath();
  ctx.stroke(); ctx.fill();
  ctx.restore();
}

function drawBubble() {
  if (!bubble) return;
  const bs = boatScale();
  let anchor, big = false;
  if (bubble.who === 'jesus') {
    const h = jesusHead();
    anchor = { x: h.x, y: h.y - 26 * bs };
    big = true;
  } else {
    const slots = crewSlots();
    const s = slots[clamp(bubble.who, 0, slots.length - 1)];
    anchor = toWorld(s.u, -104);
  }
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = big ? '700 22px Fredoka, sans-serif' : '600 15px Fredoka, sans-serif';
  const tw = ctx.measureText(bubble.text).width;
  const w = tw + (big ? 28 : 20), h = big ? 40 : 30;
  const bx = clamp(anchor.x - w / 2, -offX + 8, W + offX - w - 8);
  const by = anchor.y - h - 14;
  ctx.fillStyle = big ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = big ? '#e0a526' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  const tx = clamp(anchor.x, bx + 16, bx + w - 16);
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h);
  ctx.stroke();
  ctx.fillStyle = big ? '#8a5a00' : '#3b2f1e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bubble.text, bx + w / 2, by + h / 2 + 1);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,20,0.8)'; ctx.shadowBlur = 4;

  // Left: level + water in the boat
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff3cf';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Calming the Storm' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('WATER', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,243,207,0.25)';
  roundRect(62, 38, 126, 13, 6.5); ctx.fill();
  const wl = boat ? clamp(water() / WATER_MAX, 0, 1) : 0;
  const wg = ctx.createLinearGradient(62, 0, 188, 0);
  wg.addColorStop(0, '#7cc4f2'); wg.addColorStop(1, '#2f7fd0');
  ctx.fillStyle = wl > 0.66 && Math.sin(t * 10) > 0 ? '#ff6b6b' : wg;
  if (wl > 0) { roundRect(62, 38, 126 * wl, 13, 6.5); ctx.fill(); }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1b2748'; ctx.strokeStyle = '#1b2748'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: the Wake-the-Master meter
  const rx = viewW - 14, bw = Math.min(150, viewW - 262), bx = rx - bw;
  const ready = wake >= 1 && state === 'play';
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = ready ? '#ffe27a' : '#fff3cf';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText(ready ? 'WAKE HIM NOW!' : 'WAKE THE MASTER', rx, 20);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,243,207,0.25)';
  roundRect(bx, 28, bw, 10, 5); ctx.fill();
  const wg2 = ctx.createLinearGradient(bx, 0, rx, 0);
  wg2.addColorStop(0, '#f7c948'); wg2.addColorStop(1, '#fff1a8');
  ctx.fillStyle = ready && Math.sin(t * 8) > 0 ? '#ffffff' : wg2;
  if (wake > 0) { roundRect(bx, 28, bw * (state === 'win' ? 1 : wake), 10, 5); ctx.fill(); }

  // Tilt gauge: a little boat that tips with the real one
  if (boat && state !== 'title') {
    const gx = rx - 34, gy = 84, gr = 28, span = 1.1;
    ctx.lineCap = 'butt'; ctx.lineWidth = 7;
    const zone = (a0, a1, col) => { ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(gx, gy, gr, -Math.PI / 2 + a0 * span, -Math.PI / 2 + a1 * span); ctx.stroke(); };
    const dz = DANGER_ROLL / MAX_ROLL;
    zone(-1, -dz, 'rgba(255,107,107,0.85)');
    zone(-dz, dz, 'rgba(140,220,160,0.7)');
    zone(dz, 1, 'rgba(255,107,107,0.85)');
    const r = clamp(boat.roll / MAX_ROLL, -1, 1);
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(r * span);
    ctx.strokeStyle = '#fff3cf'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, -gr - 2); ctx.stroke();
    ctx.fillStyle = '#b07b40';
    ctx.beginPath(); ctx.moveTo(-15, -2); ctx.lineTo(15, -2); ctx.lineTo(10, 7); ctx.lineTo(-10, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff3cf';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('TILT', gx - gr - 10, gy + 4);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 26px Fredoka, sans-serif';
  const size = Math.min(26, (W - 24) / (ctx.measureText(message.text).width / 26));
  ctx.font = `700 ${Math.floor(size)}px Fredoka, sans-serif`;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,16,40,0.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.3);
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText(message.text, W / 2, H * 0.3);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 3; sy = rand(-4, 4) * shakeT * 3; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawBolt();
  drawSea(false);
  drawBoat();
  drawSea(true);
  drawWakePrompt();
  drawFoam();
  drawParticles();
  drawRain();
  drawZzz();
  drawLeanHint();
  drawWarn();
  drawTutorial();
  drawBubble();

  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(230,235,255,${flashT * 2.2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePlay(dt) {
  const wf = water() / WATER_MAX;
  stats.time += dt;
  stats.dry += (1 - wf) * dt;
  stats.steady += clamp(1 - Math.abs(boat.roll) / MAX_ROLL, 0, 1) * dt;
  updateWake(dt);
  if (state !== 'play') return;

  // Waves splash over the side
  splashTimer -= dt;
  if (splashTimer <= 0) {
    splashTimer = cfg.splashGap * rand(0.7, 1.3);
    splashIn(rand(DECK_MIN, DECK_MAX), Math.random() < cfg.splashBig ? 2 : 1);
  }
  // Now and then a giant wave
  rogueTimer -= dt;
  if (rogueTimer <= 0) {
    rogueTimer = cfg.rogueGap * rand(0.8, 1.25);
    spawnRogue();
  }
  // Golden sparkles round the Master once the disciples can wake Him
  if (wake >= 1 && Math.random() < dt * 10) {
    const c = toWorld(-128, -40);
    spawn(c.x + rand(-50, 50), c.y + rand(-30, 20), 0, -30, 0.9, Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 3.5));
  }
}

function updateWin(dt) {
  winT += dt;
  if (!spoke && winT >= 1.0) {
    // "Peace, be still."
    spoke = true;
    say('jesus', verseText('peace'), 3);
    flashT = 0.35;
    sfx.win();
    const h = toWorld(jesusFeetU() + 24 * JESUS_S, JESUS_FEET.v - 76 * JESUS_S);
    for (let i = 0; i < 60; i++) {
      const a = rand(0, TAU), sp = rand(40, 200);
      spawn(h.x, h.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8), ['#ffe27a', '#fff6d0', '#ffffff'][i % 3], rand(2, 4.5), 20);
    }
  }
  if (winT > 1.0) calm = Math.max(0, calm - dt / 2.2);
  if (winT > 3.2 && winT - dt <= 3.2) showMessage(verseText('greatCalm'));
  if (!marvelled && winT >= 3.8) {
    marvelled = true;
    say(1, verseText('whatManner'), 2.8);
  }
  if (Math.random() < dt * 12) {
    const c = toWorld(jesusFeetU(), JESUS_FEET.v - 40);
    spawn(c.x + rand(-40, 40), c.y + rand(-40, 30), 0, -20, 1, '#fff6d0', 3);
  }
}

function update(dt) {
  t += dt;
  updateGust(dt);
  updateScenery(dt);
  updateSea(dt);
  updateBoat(dt);
  updateParticles(dt);
  updateIncoming(dt);
  updatePuddles(dt);
  updateDisciples(dt);
  updateBolt(dt);
  updateCries(dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win') updateWin(dt);

  shockT = Math.max(0, shockT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  nagCd = Math.max(0, nagCd - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.storm(state === 'title' ? 0.6 : calm);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
