<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2a66a">
<title>The Road to Emmaus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f2a66a;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(60, 30, 40, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game (Luke 24). Bible.verse() picks the reader's chosen version

  returned:    { ref: 'Luke 24:33', KJV: 'And they rose up the same hour, and returned to Jerusalem.', NKJV: 'So they rose up that very hour and returned to Jerusalem.', NIV: 'They got up and returned at once to Jerusalem.', NLT: 'And within the hour they were on their way back to Jerusalem.' },

function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (f) => { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); };
// Repeatable pseudo-random number in [0, 1) for scenery
const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Blend two hex colours (f = 0 gives a, f = 1 gives b)
function mix(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = (s) => Math.round(lerp((x >> s) & 255, (y >> s) & 255, clamp(f, 0, 1)));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning
// ============================================================
const ROAD_Y = 722;       // where feet meet the road
const CH = 1.5;           // character scale
const STEP = 48;          // how far the Stranger moves with each step
const LEAD = 2.6;         // seconds before the first footprint reaches the target
const TRACK_Y = 842;      // the rhythm track along the bottom
const TRACK_VIS = 2.0;    // seconds of footprints visible ahead
const TABLE_Y = 690;      // top of the supper table

const LEVEL_NAMES = [
  'Leaving Jerusalem',
  'The Dusty Road',
  'Golden Hour',
  'Long Shadows',
  'Hearts Aflame',
  'First Stars',
];

// Scroll pieces: the books where the Scriptures speak of Him
const BOOKS = ['Moses', 'Psalms', 'Isaiah', 'Micah', 'Jonah', 'Zechariah', 'Daniel', 'Hosea', 'Malachi', 'Jeremiah'];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Journey ${n}`,
    interval: Math.max(0.46, 0.74 - (n - 1) * 0.06),   // seconds between His steps
    perfect: Math.max(0.06, 0.11 - (n - 1) * 0.01),
    good: Math.max(0.13, 0.24 - (n - 1) * 0.025),
    beats: Math.min(28 + n * 6, 60),
    scrolls: Math.min(4 + n, 10),
    rests: n >= 2,                                     // He pauses now and then to explain
    speedUp: n >= 3,                                   // and quickens His pace near the end
    missGap: 8 + n * 2,
    stumbleGap: 3 + n * 1.5,
    urges: Math.min(2 + n, 7),
    inviteTime: Math.max(3.2, 6.5 - n * 0.5),
    breaks: n === 1 ? 2 : 3,
    pulse: Math.max(0.7, 1.3 - n * 0.1),
    runLen: 2400 + n * 500,
    runSpeed: 250 + n * 15,
    obstacles: 3 + n * 2,
    runSlack: Math.max(1.15, 1.6 - n * 0.08),
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'walk';       // walk | invite | supper | run | arrive
let phaseT = 0;
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('emmausBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let camX = 0;
let particles = [];
let popups = [];
let message = { text: '', t: 0 };
let bubble = null;        // { who, text, t }
let banner = null;        // { key, t }
let flashT = 0, shakeT = 0, fadeT = 0, fadeFn = null;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let pts = null;           // points earned this level
let walk = null, inv = null, sup = null, run = null;
let scenery = [];
let heads = {};           // where each speaker's head was drawn this frame (for bubbles)

// The Stranger (the risen Jesus, not yet recognised)
const J = { x: 0, y: ROAD_Y, s: CH, walkPh: 0, walkAmt: 0, pose: 'walk', face: 'calm', hood: 1, reveal: 0, alpha: 1 };

// Cleopas (Luke 24:18) and his companion
const PAIR = [
  { name: 'Cleopas',   robe: '#3c6fa8', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'Companion', robe: '#b5603f', hair: '#6b3f1d', beard: false, skin: '#e3b184', scarf: '#e8dcc0' },
].map((d, i) => ({
  ...d, i,
  x: 0, y: ROAD_Y, walkPh: 0, walkAmt: 0, jumpY: 0, vy: 0,
  mood: 'sad', switchT: 0, delay: i ? 0.25 : 0.05,
  blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU),
}));

// The eleven, waiting in Jerusalem
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Philip',      robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { name: 'Bartholomew', robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { name: 'James the Less', robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
  { name: 'Thaddaeus',   robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
  { name: 'Simon',       robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c', scarf: '#d8c7a0' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.5),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

// ============================================================
//  Level setup
// ============================================================
function makeWalk() {
  const notes = [];
  let time = LEAD, scrollIdx = 0;
  const n = cfg.beats;
  const every = Math.max(3, Math.floor(n / (cfg.scrolls + 1)));
  for (let i = 0; i < n; i++) {
    const iv = cfg.interval * (cfg.speedUp && i >= n * 0.55 ? 0.88 : 1);
    if (cfg.rests && i > 6 && i % 9 === 4) { time += iv; continue; }   // a rest: He stops to explain
    const isScroll = (i + 1) % every === 0 && scrollIdx < cfg.scrolls;
    notes.push({ time, iv, type: isScroll ? 'scroll' : 'step', label: isScroll ? BOOKS[scrollIdx++ % BOOKS.length] : '', judged: false, res: null, heard: false });
    time += iv;
  }
  const roadEnd = notes.length * STEP;
  return {
    notes, roadEnd, doorX: roadEnd + 40,
    scrollTotal: scrollIdx, scrolls: 0,
    gap: 15, gapDisp: 15, combo: 0,
    stumbleT: 0, wowT: 0, worriedSaid: false,
    beatFlash: 0, lastSteps: 0,
    events: [
      { at: 0.4, fn: () => setBanner('drewNear', 4.6) },
      { at: 1.6, fn: () => say('jesus', verseText('whatManner'), 4.2) },
      { at: LEAD + 4.8, fn: () => say('companion', verseText('trusted'), 4.2) },
      { at: time * 0.42, fn: () => say('jesus', verseText('oughtNot'), 4.6) },
      { at: time * 0.64, fn: () => setBanner('expounded', 6) },
    ],
  };
}

function makeScenery(roadEnd) {
  const list = [];
  let x = -700, i = 0;
  while (x < roadEnd + 1400) {
    const r = hash(i + level * 31);
    if (x > roadEnd - 120 && x < roadEnd + 620) { x += 180; i++; continue; }   // leave room for the village
    list.push({ x, kind: r < 0.5 ? 'olive' : r < 0.78 ? 'cypress' : 'rock', s: 0.75 + hash(i * 3.7) * 0.5, back: hash(i * 9.1) < 0.7 });
    x += 150 + hash(i * 5.3) * 200;
    i++;
  }
  list.push({ x: 150, kind: 'sign', s: 1, back: true });
  return list;
}

function startLevel() {
  cfg = makeConfig(level);
  walk = makeWalk();
  scenery = makeScenery(walk.roadEnd);
  inv = sup = run = null;
  pts = { steps: 0, scrolls: 0, bread: 0, time: 0 };
  phase = 'walk'; phaseT = 0;
  Object.assign(J, { x: 0, y: ROAD_Y, walkPh: 0, walkAmt: 0, pose: 'walk', face: 'calm', hood: 1, reveal: 0, alpha: 1 });
  PAIR[0].x = -68 - 33; PAIR[1].x = -128 - 33;
  for (const p of PAIR) { p.y = ROAD_Y; p.jumpY = 0; p.vy = 0; p.walkAmt = 0; p.mood = 'sad'; }
  camX = J.x - walkBaseX();
  particles = []; popups = []; ripples.length = 0;
  bubble = null; banner = null;
  flashT = shakeT = fadeT = 0; fadeFn = null;
  state = 'play';
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
}

function walkBaseX() { return W * 0.5 + 30; }

// ============================================================
//  Speech bubbles, banners, messages
// ============================================================
function say(who, text, dur = 3) { bubble = { who, text, t: dur }; }
function setBanner(key, dur = 5) { banner = { key, t: dur }; }
function showMessage(text) { message = { text, t: 2.2 }; }
function popup(x, y, text, color, scr = true) { popups.push({ x, y, text, color, t: 0.9, scr }); }

// A fade to dark and back, running fn at the darkest moment
function scheduleFade(fn) { if (!fadeFn) { fadeT = 1.2; fadeFn = fn; } }

// ============================================================
//  Phase 1: the walk (keep step with the Stranger)
// ============================================================
// His position follows His footsteps: each step glides forward and lands on the beat.
function strangerSteps(T) {
  let s = 0;
  for (const n of walk.notes) {
    const dur = n.iv * 0.6;
    if (T >= n.time) s += 1;
    else if (T > n.time - dur) s += smooth((T - (n.time - dur)) / dur);
    else break;
  }
  return s;
}

function judge(n, res) {
  n.judged = true; n.res = res;
  const w = walk;
  const tx = trackTargetX();
  if (res === 'perfect' || res === 'good') {
    w.gap = Math.max(0, w.gap - (res === 'perfect' ? 8 : 4));
    pts.steps += res === 'perfect' ? 25 : 10;
    w.combo++;
    popup(tx, TRACK_Y - 44, res === 'perfect' ? 'Perfect!' : 'Good', res === 'perfect' ? '#c77d00' : '#4f7f2a');
    for (let i = 0; i < (res === 'perfect' ? 12 : 6); i++) {
      const a = rand(0, TAU), sp = rand(40, 120);
      spawn(tx, TRACK_Y, Math.cos(a) * sp, Math.sin(a) * sp, 0.6, i % 2 ? '#ffe27a' : '#fff6d0', rand(2, 4), 0, true);
    }
    sfx.hit(Math.min(w.combo / 12, 1));
    if (n.type === 'scroll') {
      w.scrolls++;
      pts.scrolls += 100;
      w.wowT = 1.4;
      popup(tx + 60, TRACK_Y - 70, n.label, '#8a5a00');
      for (let i = 0; i < 18; i++) {
        const a = rand(0, TAU), sp = rand(60, 180);
        spawn(tx, TRACK_Y, Math.cos(a) * sp, Math.sin(a) * sp - 40, 1, '#ffd24a', rand(2.5, 4.5), 40, true);
      }
      sfx.chime();
    }
  } else {
    w.gap += cfg.missGap;
    w.combo = 0;
    popup(tx, TRACK_Y - 44, n.type === 'scroll' ? 'Scroll missed' : 'Missed step', '#8a7a6a');
  }
}

function walkTap() {
  const w = walk, T = phaseT;
  if (T < LEAD - 0.7) return;                 // nothing to step to yet
  let near = null, bd = Infinity;
  for (const n of w.notes) {
    if (n.judged) continue;
    const d = T - n.time;
    if (Math.abs(d) < Math.abs(bd)) { bd = d; near = n; }
    if (n.time > T + 1) break;
  }
  if (near && Math.abs(bd) <= cfg.good) { judge(near, Math.abs(bd) <= cfg.perfect ? 'perfect' : 'good'); return; }
  // Off the beat: a little stumble
  w.gap += cfg.stumbleGap;
  w.combo = 0;
  w.stumbleT = 0.6;
  popup(trackTargetX(), TRACK_Y - 44, 'Oops!', '#c0392b');
  sfx.bounce();
}

function updateWalk(dt) {
  const w = walk, T = phaseT;
  for (const e of w.events) if (!e.done && T >= e.at) { e.done = true; e.fn(); }

  // Footfalls you can hear, and steps that went by untapped
  for (const n of w.notes) {
    if (!n.heard && T >= n.time) { n.heard = true; w.beatFlash = 0.18; sfx.step(); }
    if (!n.judged && T > n.time + cfg.good) judge(n, 'miss');
    if (n.time > T + 1) break;
  }
  w.beatFlash = Math.max(0, w.beatFlash - dt);
  w.stumbleT = Math.max(0, w.stumbleT - dt);
  w.wowT = Math.max(0, w.wowT - dt);
  w.gap = clamp(w.gap, 0, 100);
  w.gapDisp += (w.gap - w.gapDisp) * Math.min(1, dt * 3);

  if (w.gap > 70 && !w.worriedSaid) { w.worriedSaid = true; say('cleopas', 'Wait for us, friend!', 2); }
  if (w.gap < 45) w.worriedSaid = false;
  if (w.gap >= 100) { fail('lost'); return; }

  // The Stranger
  const steps = strangerSteps(T);
  const speed = (steps - w.lastSteps) * STEP / Math.max(dt, 1e-4);
  w.lastSteps = steps;
  J.x = steps * STEP;
  J.walkPh = steps * Math.PI;
  J.walkAmt += (clamp(speed / 50, 0, 1) - J.walkAmt) * Math.min(1, dt * 10);
  J.pose = bubble && bubble.who === 'jesus' ? 'explain' : (J.walkAmt < 0.3 && T > LEAD ? 'explain' : 'walk');

  // The two follow, as close as their pace allows
  const gp = w.gapDisp * 2.2;
  followTo(PAIR[0], J.x - 68 - gp, dt);
  followTo(PAIR[1], J.x - 128 - gp, dt);
  camX = J.x - walkBaseX() - gp * 0.5;

  const last = w.notes[w.notes.length - 1];
  if (T > last.time + 0.5 && w.notes.every((n) => n.judged)) startInvite();
}

function followTo(p, tx, dt, rate = 6) {
  const nx = p.x + (tx - p.x) * Math.min(1, dt * rate);
  const dx = nx - p.x;
  p.x = nx;
  p.walkPh += Math.abs(dx) * 0.075;
  p.walkAmt += (clamp(Math.abs(dx) / Math.max(dt, 1e-4) / 40, 0, 1) - p.walkAmt) * Math.min(1, dt * 8);
}

// ============================================================
//  Phase 2: at the village, urge Him to stay
// ============================================================
const URGES = ['Please, come in!', 'Do not go on alone!', 'Rest here with us!', 'Share our supper!', 'It is getting dark!', 'Please, friend!', 'Come inside!'];

function startInvite() {
  phase = 'invite'; phaseT = 0;
  inv = { urges: 0, done: false, doneT: 0, startX: J.x };
  setBanner('furtherOn', 3.6);
  say('cleopas', 'Here is our village!', 1.8);
}

function inviteTap() {
  if (inv.done) return;
  inv.urges++;
  sfx.hit(inv.urges / cfg.urges);
  if (inv.urges >= cfg.urges) {
    inv.done = true;
    say('cleopas', verseText('abide'), 3.8);
    sfx.chime();
  } else {
    say(inv.urges % 2 ? 'companion' : 'cleopas', URGES[(inv.urges - 1) % URGES.length], 1.4);
  }
  popup(PAIR[0].x - camX + 30, ROAD_Y - 150, `${inv.urges}/${cfg.urges}`, '#8a5a00');
}

function inviteLimit() { return walk.doorX + 330; }

function updateInvite(dt) {
  const door = walk.doorX;
  followTo(PAIR[0], door - 10, dt, 3);
  followTo(PAIR[1], door - 72, dt, 3);
  if (!inv.done) {
    // He walks on slowly, as though going further
    const sp = (inviteLimit() - inv.startX) / cfg.inviteTime;
    J.x += sp * dt;
    J.walkPh += sp * dt * Math.PI / STEP;
    J.walkAmt = 1;
    J.pose = 'walk';
    if (J.x >= inviteLimit()) { fail('walkedOn'); return; }
  } else {
    inv.doneT += dt;
    // He turns back and goes in with them
    const target = door + 60;
    if (J.x > target) {
      const sp = Math.min(160, (J.x - target) * 3 + 30);
      J.x -= sp * dt; J.walkPh += sp * dt * Math.PI / STEP; J.walkAmt = 1;
    } else J.walkAmt *= 0.9;
    J.pose = 'walk';
    if (inv.doneT > 2.8) scheduleFade(startSupper);
  }
  const target = (J.x + PAIR[1].x) / 2 - W / 2;
  camX += (target - camX) * Math.min(1, dt * 3);
}

// ============================================================
//  Phase 3: supper, the breaking of the bread
// ============================================================
function supperLayout() {
  const dx = Math.min(210, W * 0.33);
  return { cx: W / 2, dx, seatY: 748, breadX: W / 2, breadY: TABLE_Y - 8 };
}

function startSupper() {
  phase = 'supper'; phaseT = 0;
  sup = { sub: 'bless', subT: 0, breaks: 0, cd: 0, give: 0 };
  camX = 0;
  bubble = null;
  const L = supperLayout();
  Object.assign(J, { x: L.cx, y: L.seatY, walkAmt: 0, pose: 'bless', face: 'calm' });
  PAIR[0].x = L.cx - L.dx; PAIR[1].x = L.cx + L.dx;
  for (const p of PAIR) { p.y = L.seatY; p.walkAmt = 0; }
  setBanner('tookBread', 5.5);
}

function breadPulse() { return 0.5 - 0.5 * Math.cos(TAU * sup.subT / cfg.pulse); }

function supperTap(p) {
  if (sup.sub !== 'break' || sup.cd > 0) return;
  const L = supperLayout();
  if (p && Math.hypot(p.x - L.breadX, p.y - L.breadY) > 140) return;   // tap the bread itself
  const g = breadPulse();
  const res = g >= 0.85 ? 'perfect' : g >= 0.5 ? 'good' : 'ok';
  const add = { perfect: 150, good: 90, ok: 40 }[res];
  pts.bread += add;
  sup.breaks++;
  sup.cd = 0.3;
  popup(L.breadX, L.breadY - 70, res === 'perfect' ? 'Blessed!' : res === 'good' ? 'Broken' : 'Crack!', res === 'ok' ? '#8a6a3a' : '#c77d00', true);
  for (let i = 0; i < 14; i++) {
    spawn(L.breadX + rand(-10, 10), L.breadY - 6, rand(-90, 90), rand(-140, -40), 0.8, i % 3 ? '#e2b36a' : '#fff1b0', rand(1.5, 3.5), 260);
  }
  sfx.crunch();
  if (sup.breaks >= cfg.breaks) { sup.sub = 'give'; sup.subT = 0; J.pose = 'give'; }
}

function updateSupper(dt) {
  sup.subT += dt;
  sup.cd = Math.max(0, sup.cd - dt);
  const s = sup;
  if (s.sub === 'bless') {
    J.pose = 'bless';
    if (s.subT > 1.7) { s.sub = 'break'; s.subT = 0; J.pose = 'break'; }
  } else if (s.sub === 'break') {
    J.pose = 'break';
  } else if (s.sub === 'give') {
    s.give = smooth(s.subT / 1.2);
    if (s.subT > 1.4) {
      s.sub = 'opened'; s.subT = 0;
      flashT = 0.6;
      sfx.levelStart();
      setBanner('eyesOpened', 5.2);
    }
  } else if (s.sub === 'opened') {
    J.pose = 'welcome'; J.face = 'joy';
    J.hood = 1 - smooth(s.subT / 0.9);
    J.reveal = smooth(s.subT / 0.9);
    if (s.subT > 2.4) { s.sub = 'vanish'; s.subT = 0; sfx.sparkle(); }
  } else if (s.sub === 'vanish') {
    J.alpha = 1 - smooth(s.subT / 1.4);
    if (Math.random() < dt * 60 && J.alpha > 0.05) {
      spawn(J.x + rand(-40, 40), J.y - rand(20, 130), rand(-20, 20), rand(-60, -20), 1.2, Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4));
    }
    if (s.subT > 1.6) { s.sub = 'burn'; s.subT = 0; say('companion', verseText('burn'), 4.4); }
  } else if (s.sub === 'burn') {
    if (s.subT > 4.2) scheduleFade(startRun);
  }
}

// ============================================================
//  Phase 4: run back to Jerusalem in the dark
// ============================================================
function makeObstacles() {
  const list = [];
  const n = cfg.obstacles;
  const a = 600, b = cfg.runLen - 350;
  for (let i = 0; i < n; i++) {
    const x = lerp(a, b, n === 1 ? 0.5 : i / (n - 1)) + rand(-50, 50);
    const r = Math.random();
    list.push(r < 0.45 ? { x, kind: 'rock', w: 38, hit: false } : r < 0.75 ? { x, kind: 'hole', w: 50, hit: false } : { x, kind: 'log', w: 46, hit: false });
  }
  return list;
}

function startRun() {
  phase = 'run'; phaseT = 0;
  const limit = cfg.runLen / cfg.runSpeed * cfg.runSlack + 1;
  run = { x: 0, vx: 0, stumbleT: 0, limit, timeLeft: limit, obs: makeObstacles(), stumbles: 0 };
  Object.assign(J, { alpha: 0 });
  bubble = null;
  PAIR[0].x = 0; PAIR[1].x = -75;
  for (const p of PAIR) { p.y = ROAD_Y; p.jumpY = 0; p.vy = 0; }
  camX = -W * 0.3;
  setBanner('returned', 4.2);
  showMessage('Tap to hop over the stones!');
}

function jump(p) {
  if (p.jumpY > 0.5) return false;
  p.vy = 620;
  return true;
}

function runTap() {
  if (jump(PAIR[0])) sfx.puff(0.18);
}

function updateRun(dt) {
  const r = run;
  const target = r.stumbleT > 0 ? 90 : cfg.runSpeed;
  r.vx += (target - r.vx) * Math.min(1, dt * 4);
  r.x += r.vx * dt;
  r.stumbleT = Math.max(0, r.stumbleT - dt);
  r.timeLeft -= dt;

  const lead = PAIR[0], comp = PAIR[1];
  lead.x = r.x;
  comp.x = r.x - 75;
  for (const p of PAIR) {
    p.walkPh += r.vx * dt * 0.06;
    p.walkAmt = p.jumpY > 1 ? 0.2 : 1;
    p.vy -= 1900 * dt;
    p.jumpY = Math.max(0, p.jumpY + p.vy * dt);
    if (p.jumpY === 0) p.vy = Math.max(p.vy, 0);
  }
  // The companion follows Cleopas's lead and hops by herself
  for (const o of r.obs) {
    const d = o.x - comp.x;
    if (d > 20 && d < 20 + r.vx * 0.12 + o.w / 2) jump(comp);
  }
  // Cleopas stumbles if he doesn't hop
  for (const o of r.obs) {
    if (o.hit || lead.jumpY > 16) continue;
    if (Math.abs(lead.x - o.x) < o.w / 2 + 8) {
      o.hit = true;
      r.stumbleT = 0.7;
      r.stumbles++;
      shakeT = 0.25;
      popup(lead.x - camX, ROAD_Y - 150, 'Oof!', '#ffd9a0', true);
      say('cleopas', ['Oof! A stone!', 'Oops! Keep going!', 'I am all right!'][r.stumbles % 3], 1.2);
      sfx.bounce();
    }
  }
  camX = r.x - W * 0.3;
  if (r.x >= cfg.runLen) { startArrive(); return; }
  if (r.timeLeft <= 0) { r.timeLeft = 0; fail('late'); }
}

// ============================================================
//  Phase 5: the eleven in Jerusalem
// ============================================================
function arriveLayout() {
  const x0 = cfg.runLen + 70;
  const span = Math.min(420, W * 0.72 - 110);
  return { x0, span };
}

function startArrive() {
  phase = 'arrive'; phaseT = 0;
  pts.time = Math.round(run.timeLeft * 40);
  bubble = null;
}

function updateArrive(dt) {
  const r = run;
  const stopX = cfg.runLen + 10;
  const sp = Math.max(0, Math.min(r.vx, (stopX - r.x) * 3));
  r.vx = sp;
  r.x += sp * dt;
  for (const p of PAIR) {
    p.walkPh += sp * dt * 0.06; p.walkAmt = clamp(sp / 150, 0, 1);
    p.vy -= 1900 * dt; p.jumpY = Math.max(0, p.jumpY + p.vy * dt); if (p.jumpY === 0) p.vy = Math.max(p.vy, 0);
  }
  PAIR[0].x = r.x; PAIR[1].x = r.x - 75;
  const target = cfg.runLen - W * 0.28;
  camX += (target - camX) * Math.min(1, dt * 3);
  if (phaseT > 0.7 && phaseT - dt <= 0.7) say('peter', verseText('risenIndeed'), 3.4);
  if (phaseT > 3.4) win();
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const levelBonus = level * 500;
  const score = pts.steps + pts.scrolls + pts.bread + pts.time + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('emmausBest', best); } catch (e) {} }
  lastScore = { ...pts, levelBonus, score, scrolls: walk.scrolls, scrollTotal: walk.scrollTotal };
  const L = arriveLayout();
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(L.x0 + L.span / 2, ROAD_Y - 160, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 2.2;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  sfx.fail();
  endTimer = 1.6;
}

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  cfg = makeConfig(1);
  walk = makeWalk();
  scenery = makeScenery(walk.roadEnd);
  phase = 'walk';
  showOverlay('The Road to Emmaus', 'A walk at sunset with a Stranger',
    `${verseHTML('title')}
     <ul>
       <li><b>Walk in step:</b> <b>tap</b> (or <kbd>Space</kbd>) as the Stranger's foot lands on the circle at the bottom. Fall too far behind and He walks on ahead!</li>
       <li>Golden <b>scroll</b> steps are the Scriptures He opens to them &mdash; don't miss them.</li>
       <li>At Emmaus, <b>tap quickly</b> to urge Him to stay.</li>
       <li>At supper, <b>tap the bread</b> as it shines to break it&hellip;</li>
       <li>Then run back to Jerusalem in the dark &mdash; <b>tap</b> to hop over stones!</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Begin the Walk', () => { level = 1; totalScore = 0; startLevel(); });
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Their eyes were opened!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('winCard')}
       <p class="score">Steps in time: <b>${s.steps}</b><br>Scrolls ${s.scrolls}/${s.scrollTotal}: <b>${s.scrolls * 100}</b><br>Breaking the bread: <b>${s.bread}</b><br>Time to spare: <b>${s.time}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Walk Again', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = {
      lost: ['He walked on ahead', 'The Stranger kept walking and they fell behind. Tap just as His foot lands on the circle.'],
      walkedOn: ['He went on His way', 'They did not ask Him in soon enough. Tap quickly to urge Him to stay!'],
      late: ['The night grew long', 'The road back was slow tonight. Tap to hop over the stones and run with glad hearts!'],
    }[failReason] || ['Oh no!', 'Try again.'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('walkSad')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const ripples = [];

// One tap (or key press) does whatever the current part of the journey needs
function handleTap(p) {
  if (state !== 'play' || fadeFn) return;
  if (phase === 'walk') walkTap();
  else if (phase === 'invite') inviteTap();
  else if (phase === 'supper') supperTap(p);
  else if (phase === 'run') runTap();
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (!e.repeat && ['Space', 'ArrowUp', 'ArrowRight', 'KeyJ', 'KeyF'].includes(e.code)) handleTap(null);
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  handleTap(p);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each good step, climbing as the steps keep in time
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  hit(height) { if (this.ctx) playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height); },
  // His footfall on the dusty road: the beat to walk to
  step() { this.tone(150, 0.12, 'triangle', 0.22, 0, 80); this.puff(0.06); },
  chime() { this.tone(988, 0.3, 'triangle', 0.12); this.tone(1318, 0.45, 'triangle', 0.1, 0.09); },
  sparkle() { for (let k = 0; k < 6; k++) this.tone(1100 + k * 190, 0.35, 'sine', 0.06, k * 0.07); },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  crunch() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 1.2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.4, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.16);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// ============================================================
//  Particles
// ============================================================
// scr particles live in screen space (the rhythm track); others in the world
function spawn(x, y, vx, vy, life, color, size, grav = 0, scr = false) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, scr });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; if (popups[i].t <= 0) popups.splice(i, 1); }
}

function drawParticles(scr) {
  for (const p of particles) {
    if (p.scr !== scr) continue;
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  People: moods and drawing
// ============================================================
function pairMood() {
  if (state === 'title') return 'sad';
  if (state === 'fail') return 'dismay';
  if (state === 'win') return 'joy';
  if (phase === 'walk' && walk) {
    if (walk.stumbleT > 0) return 'shock';
    if (walk.wowT > 0) return 'wow';
    if (walk.gap > 70) return 'worried';
    return walk.scrolls < 2 ? 'sad' : 'watch';
  }
  if (phase === 'invite') return 'watch';
  if (phase === 'supper' && sup) {
    if (sup.sub === 'opened') return sup.subT < 0.9 ? 'shock' : 'wow';
    if (sup.sub === 'vanish') return 'wow';
    if (sup.sub === 'burn') return 'joy';
    return 'watch';
  }
  if (phase === 'run' && run) return run.stumbleT > 0 ? 'shock' : 'joy';
  return 'joy';
}

function elevenMood() {
  if (phase !== 'arrive' && state !== 'win') return 'watch';
  if (state === 'win') return 'joy';
  return phaseT < 0.5 ? 'wow' : 'joy';
}

function tickMood(d, want, dt) {
  if (want !== d.mood) {
    d.switchT += dt;
    if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
  } else d.switchT = 0;
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

function updatePeople(dt) {
  const pm = pairMood(), em = elevenMood();
  for (const p of PAIR) tickMood(p, pm, dt);
  for (const d of DISCIPLES) tickMood(d, em, dt);
}

// Sandalled feet that step along with the walk
function drawFeet(ph, amt, stride = 6) {
  ctx.fillStyle = '#7a4a26';
  for (const side of [-1, 1]) {
    const sw = Math.sin(ph) * side * stride * amt;
    const lift = Math.max(0, Math.cos(ph) * side) * 3 * amt;
    ctx.beginPath(); ctx.ellipse(side * 7 + sw, -1 - lift, 6, 3, 0, 0, TAU); ctx.fill();
  }
}

// o: { d, x, y, s, lx, ly, walkPh, walkAmt, jumpY, run, seated, reach, lamp }
function drawPerson(o) {
  const { d, x, y, s } = o;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy' && !o.run && (o.walkAmt || 0) < 0.2) jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  const amt = o.walkAmt || 0, ph = o.walkPh || 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (!o.seated) {
    const jy = (o.jumpY || 0) / s;
    ctx.fillStyle = `rgba(40,20,10,${0.18 * (1 - clamp(jy / 120, 0, 0.7))})`;
    ctx.beginPath(); ctx.ellipse(0, 2, 20 - jy * 0.05, 5, 0, 0, TAU); ctx.fill();
    ctx.translate(0, -jy);
  }
  ctx.translate(0, -jump);
  if (!o.seated) drawFeet(ph, amt, o.run ? 10 : 6);
  ctx.translate(0, -Math.abs(Math.sin(ph)) * 2 * amt);
  if (o.run) ctx.rotate(0.1);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const lx = o.lx || 0, ly = o.ly || 0;
  const special = o.run || o.reach;

  // Arms raised behind the head for joy / pointing up in wonder
  if (!special) {
    if (mood === 'joy') {
      const wave = Math.sin(t * 9 + d.phase) * 4;
      arm(-11, -32, -24 + wave, -66);
      arm(11, -32, 24 - wave, -66);
    } else if (mood === 'wow' && d.i % 3 === 0) {
      arm(11, -32, 20 + lx * 6, -70);
    }
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Arms
  if (o.run) {
    const sw = Math.sin(ph) * 9;
    if (o.lamp) arm(-11, -32, -16 - sw, -16);
    else { arm(-11, -32, -16 - sw, -16); }
    if (o.lamp) arm(11, -32, 24, -34);
    else arm(11, -32, 16 + sw, -16);
  } else if (o.reach) {
    arm(-11, -32, -15, -12);
    arm(11, -32, 28, -46 + Math.sin(t * 8) * 3);
  } else if (mood === 'watch' || mood === 'sad' || mood === 'doubt' || (mood === 'wow' && d.i % 3 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }
  // A little clay lamp for the dark road
  if (o.lamp) {
    ctx.fillStyle = '#b5703a';
    ctx.beginPath(); ctx.ellipse(27, -36, 7, 3.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.moveTo(32, -38); ctx.quadraticCurveTo(36 + Math.sin(t * 20), -46, 33, -50); ctx.quadraticCurveTo(30, -44, 32, -38); ctx.fill();
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock' && !o.run) {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
  return { x, y: y - (o.jumpY || 0) - 75 * s };
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'sad': {
      // downcast eyes, sorrowful brows, a small frown
      const old = ly;
      eyes(3.5, 4, 2);
      ctx.fillStyle = d.skin;
      ctx.beginPath(); ctx.ellipse(-ex, ey - 2.5, 4, 2.2, 0, 0, TAU); ctx.ellipse(ex, ey - 2.5, 4, 2.2, 0, 0, TAU); ctx.fill();
      brows(-9, -5, -9, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      void old;
      break;
    }
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus, the Stranger on the road
// ============================================================
// A traveller's mantle hides His head at first, and His halo is only a faint glow.
// When their eyes are opened the mantle slips back and the halo shines.
function drawJesus(j) {
  if (j.alpha <= 0.01) return null;
  ctx.save();
  ctx.globalAlpha = j.alpha;
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);
  const seated = phase === 'supper';
  const ph = j.walkPh, amt = j.walkAmt;
  if (!seated) {
    ctx.fillStyle = 'rgba(40,20,10,0.18)';
    ctx.beginPath(); ctx.ellipse(0, 2, 20, 5, 0, 0, TAU); ctx.fill();
    drawFeet(ph, amt, 6);
  }
  ctx.translate(0, -Math.abs(Math.sin(ph)) * 2 * amt);

  // A gentle glow that a watchful player may notice
  const glowA = 0.2 + 0.45 * j.reveal + 0.05 * Math.sin(t * 2);
  const g = ctx.createRadialGradient(0, -38, 5, 0, -38, 80);
  g.addColorStop(0, `rgba(255,235,150,${glowA})`);
  g.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -38, 80, 0, TAU); ctx.fill();

  // Halo
  ctx.save();
  ctx.globalAlpha = j.alpha * (0.3 + 0.7 * j.reveal);
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56 - 4 * j.hood, 15 + 2 * j.hood, 0, TAU); ctx.stroke();
  ctx.restore();

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Traveller's mantle: hood behind the head and a short cape
  const hood = j.hood;
  if (hood > 0.01) {
    ctx.save();
    ctx.globalAlpha = j.alpha * hood;
    ctx.translate(0, (1 - hood) * 14);
    ctx.fillStyle = '#a8865a';
    ctx.beginPath(); ctx.ellipse(0, -53, 16, 17.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-17, -29);
    ctx.quadraticCurveTo(-17, -43, -9, -44);
    ctx.lineTo(9, -44);
    ctx.quadraticCurveTo(17, -43, 17, -29);
    ctx.quadraticCurveTo(0, -24, -17, -29);
    ctx.fill();
    ctx.restore();
  }

  // Arms for each pose
  const pose = j.pose;
  let hands;
  if (pose === 'bless') hands = [[-21, -66], [21, -66]];
  else if (pose === 'break') {
    const pull = sup ? Math.min(sup.breaks, 3) * 2 : 0;
    hands = [[-13 - pull, -44], [13 + pull, -44]];
  } else if (pose === 'give') hands = [[-26, -40], [26, -40]];
  else if (pose === 'welcome') hands = [[-24, -30], [24, -30]];
  else if (pose === 'explain') hands = [[-20, -22], [22, -46 + Math.sin(t * 5) * 3]];
  else { const sw = Math.sin(ph) * 3 * amt; hands = [[-20, -22 + sw], [20, -22 - sw]]; }
  const up = pose === 'bless';
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  const talking = bubble && bubble.who === 'jesus' && Math.sin(t * 14) > 0;
  if (talking) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 1.8, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  // Hood rim over the top of His head
  if (hood > 0.01) {
    ctx.save();
    ctx.globalAlpha = j.alpha * hood;
    ctx.translate(0, (1 - hood) * 14);
    ctx.strokeStyle = '#a8865a'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(0, -53, 13.5, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -53, 10.8, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
  return { x: j.x, y: j.y - 82 * j.s };
}

// ============================================================
//  Scenery
// ============================================================
function sunsetP() {
  if (state === 'title') return 0.3;
  if (phase === 'walk' && walk) return clamp(J.x / walk.roadEnd, 0, 1) * 0.85;
  return 0.9;
}

function drawSunsetSky(p) {
  const g = ctx.createLinearGradient(0, -offY, 0, 700);
  g.addColorStop(0, mix('#7fb2e0', '#4a3f86', p));
  g.addColorStop(0.45, mix('#ffd9a8', '#f08a6a', p));
  g.addColorStop(1, mix('#fff0c8', '#ffb86b', p));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // The sun going down toward the hills
  const sx = W * 0.78, sy = lerp(330, 600, p);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 160);
  sg.addColorStop(0, 'rgba(255,245,200,0.9)');
  sg.addColorStop(0.3, 'rgba(255,220,140,0.45)');
  sg.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 160, 0, TAU); ctx.fill();
  ctx.fillStyle = mix('#fff4c2', '#ffcf7a', p);
  ctx.beginPath(); ctx.arc(sx, sy, 42, 0, TAU); ctx.fill();
  // Soft, sun-lit clouds drifting slowly
  for (let i = 0; i < 5; i++) {
    const span = viewW + 400;
    const x = ((hash(i) * span - camX * 0.05 + t * 6 * (0.5 + hash(i + 9))) % span + span) % span - offX - 200;
    const y = 170 + hash(i + 3) * 260 - offY * 0.3;
    const w = 110 + hash(i + 5) * 120;
    drawCloud(x, y, w, w * 0.3, mix('#fff6e6', '#ffd0b0', p), mix('#f6d6c8', '#e89a9a', p));
  }
}

function drawNightSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, 700);
  g.addColorStop(0, '#0e1537');
  g.addColorStop(0.6, '#262c5e');
  g.addColorStop(1, '#4a3f6e');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  for (let i = 0; i < 70; i++) {
    const x = -offX + hash(i * 1.3) * viewW;
    const y = -offY + hash(i * 2.7) * (offY + 560);
    const tw = 0.5 + 0.5 * Math.sin(t * 2 + i);
    ctx.fillStyle = `rgba(255,250,220,${0.4 + tw * 0.5})`;
    ctx.beginPath(); ctx.arc(x, y, 0.8 + hash(i * 4.1) * 1.4, 0, TAU); ctx.fill();
  }
  // The moon
  const mx = W * 0.8, my = 180;
  const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 110);
  mg.addColorStop(0, 'rgba(255,250,220,0.5)'); mg.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 110, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff8dc'; ctx.beginPath(); ctx.arc(mx, my, 34, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(210,200,170,0.5)';
  ctx.beginPath(); ctx.arc(mx - 10, my - 6, 6, 0, TAU); ctx.arc(mx + 9, my + 9, 4, 0, TAU); ctx.fill();
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// A rolling line of hills, scrolling at its own depth
function drawHills(base, amp, freq, par, color, seed) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1 + 12; x += 12) {
    const wx = x + camX * par + seed;
    ctx.lineTo(x, base + Math.sin(wx / freq) * amp + Math.sin(wx / (freq * 0.37)) * amp * 0.3);
  }
  ctx.lineTo(x1 + 12, H); ctx.fill();
}

function drawCity(x, base, par, wall, lit) {
  // Jerusalem: walls, towers and the temple, far away
  const sx = x - camX * par;
  if (sx < -offX - 400 || sx > W + offX + 400) return;
  ctx.fillStyle = wall;
  ctx.fillRect(sx - 170, base - 60, 340, 60);
  for (const tx of [-170, -60, 60, 150]) { ctx.fillRect(sx + tx, base - 82, 26, 82); }
  ctx.fillRect(sx - 30, base - 110, 70, 50);
  ctx.beginPath(); ctx.arc(sx + 5, base - 110, 26, Math.PI, TAU); ctx.fill();
  for (let i = 0; i < 17; i++) ctx.fillRect(sx - 170 + i * 20, base - 68, 11, 8);
  if (lit) {
    ctx.fillStyle = '#ffd97a';
    for (let i = 0; i < 9; i++) ctx.fillRect(sx - 150 + hash(i + 2) * 300, base - 50 + hash(i + 7) * 30, 6, 8);
  }
}

function drawTree(x, y, s, kind, dim) {
  if (kind === 'olive') {
    ctx.strokeStyle = mix('#6b4a2b', '#3a2a24', dim); ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x, y - 55 * s); ctx.stroke();
    ctx.fillStyle = mix('#7d9460', '#2e3a44', dim);
    ctx.beginPath();
    for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
      ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU);
    }
    ctx.fill();
  } else if (kind === 'cypress') {
    ctx.fillStyle = mix('#5c7a44', '#26303c', dim);
    ctx.beginPath(); ctx.ellipse(x, y - 55 * s, 13 * s, 55 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = mix('#6b4a2b', '#3a2a24', dim);
    ctx.fillRect(x - 3 * s, y - 6 * s, 6 * s, 8 * s);
  } else if (kind === 'rock') {
    ctx.fillStyle = mix('#b8a07a', '#4a4a5c', dim);
    ctx.beginPath(); ctx.ellipse(x, y - 8 * s, 22 * s, 13 * s, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = mix('#cdb890', '#5a5a6e', dim);
    ctx.beginPath(); ctx.ellipse(x - 5 * s, y - 12 * s, 10 * s, 6 * s, 0, 0, TAU); ctx.fill();
  } else if (kind === 'sign') {
    ctx.fillStyle = '#8a6440'; ctx.fillRect(x - 3, y - 70, 6, 70);
    ctx.fillStyle = '#e9d3a3'; ctx.strokeStyle = '#8a6440'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 40, y - 82); ctx.lineTo(x + 34, y - 82); ctx.lineTo(x + 46, y - 70); ctx.lineTo(x + 34, y - 58); ctx.lineTo(x - 40, y - 58); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a4a1a'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('EMMAUS', x + 2, y - 70);
  }
}

function drawHouse(x, base, w, h, wall, doorOpen, lit) {
  ctx.fillStyle = wall;
  roundRect(x - w / 2, base - h, w, h, 4); ctx.fill();
  ctx.fillStyle = shade(wall.startsWith('#') ? wall : '#d8b889', -25);
  ctx.fillRect(x - w / 2 - 6, base - h - 8, w + 12, 10);   // flat roof with parapet
  // door
  ctx.fillStyle = doorOpen ? (lit ? '#ffcf73' : '#3b2a1c') : '#7a5230';
  ctx.beginPath();
  ctx.moveTo(x - 17, base); ctx.lineTo(x - 17, base - 42); ctx.arc(x, base - 42, 17, Math.PI, TAU); ctx.lineTo(x + 17, base); ctx.fill();
  // window
  ctx.fillStyle = lit ? '#ffd97a' : '#5a3e28';
  roundRect(x + w * 0.22, base - h + 22, 18, 18, [9, 9, 2, 2]); ctx.fill();
  if (lit) {
    const g = ctx.createRadialGradient(x, base - 30, 5, x, base - 30, 120);
    g.addColorStop(0, 'rgba(255,210,120,0.45)'); g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, base - 30, 120, 0, TAU); ctx.fill();
  }
}

// The road and fields, used for both the sunset walk and the night run
function drawGroundAndRoad(p, night) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const field = night ? '#2c3a3e' : mix('#b7c47a', '#b39060', p);
  ctx.fillStyle = field;
  ctx.fillRect(x0, 668, x1 - x0, H - 668 + 10);
  const road = night ? '#5a5570' : mix('#ead3a0', '#dcae82', p);
  ctx.fillStyle = road;
  ctx.fillRect(x0, 694, x1 - x0, 58);
  ctx.fillStyle = night ? '#4a4660' : mix('#d4b882', '#c49468', p);
  ctx.fillRect(x0, 694, x1 - x0, 4);
  ctx.fillRect(x0, 748, x1 - x0, 4);
  // pebbles along the road
  ctx.fillStyle = night ? '#6e6a88' : mix('#c9ae7c', '#b88c62', p);
  const first = Math.floor((camX + x0) / 70);
  for (let i = first; i < first + (x1 - x0) / 70 + 2; i++) {
    const x = i * 70 + hash(i) * 50 - camX;
    ctx.beginPath(); ctx.ellipse(x, 702 + hash(i * 3.1) * 44, 3 + hash(i * 1.7) * 3, 2, 0, 0, TAU); ctx.fill();
  }
}

function drawGrassTufts(p, night) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.strokeStyle = night ? '#3e5048' : mix('#8ea456', '#9a7a48', p);
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const par = 1.2;
  const first = Math.floor((camX * par + x0) / 55);
  for (let i = first; i < first + (x1 - x0) / 55 + 2; i++) {
    const x = i * 55 + hash(i + 40) * 30 - camX * par;
    const y = 770 + hash(i + 11) * 20;
    for (const dx of [-5, 0, 5]) { ctx.moveTo(x + dx, y); ctx.lineTo(x + dx * 1.8, y - 10 - hash(i + dx) * 6); }
  }
  ctx.stroke();
}

function drawWalkWorld() {
  const p = sunsetP();
  drawSunsetSky(p);
  drawHills(560, 22, 160, 0.12, mix('#c9a6c2', '#9a76a8', p), 0);
  drawCity(-40, 610, 0.3, mix('#e2c79a', '#b98f7e', p), false);
  drawHills(640, 16, 110, 0.35, mix('#b9b075', '#a0785a', p), 300);
  drawGroundAndRoad(p, false);

  ctx.save();
  ctx.translate(-camX, 0);
  const vis0 = camX - offX - 120, vis1 = camX + W + offX + 120;
  for (const o of scenery) {
    if (!o.back || o.x < vis0 || o.x > vis1) continue;
    drawTree(o.x, 686, o.s, o.kind, p * 0.25);
  }
  // Emmaus: a few flat-roofed houses at the end of the road
  if (walk) {
    const d = walk.doorX;
    drawHouse(d + 330, 690, 130, 110, '#e3c79a', false, false);
    drawHouse(d - 150, 688, 100, 90, '#d9b98a', false, false);
    drawHouse(d, 694, 150, 130, '#ecd3a6', phase === 'invite', phase === 'invite');
  }
  ctx.restore();
}

function drawSupperRoom() {
  const L = supperLayout();
  // Warm walls lit by the lamp
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#b98a5a'); g.addColorStop(0.6, '#e2b983'); g.addColorStop(1, '#c79a64');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // Beams
  ctx.fillStyle = '#7a5433';
  ctx.fillRect(-offX, 250, viewW, 18);
  for (let x = -offX + 40; x < W + offX; x += 160) ctx.fillRect(x, -offY, 14, 250 + offY);
  // Window with the evening sky
  const wx = L.cx - L.dx * 1.05, wy = 350;
  ctx.fillStyle = '#6a4a2a'; roundRect(wx - 48, wy - 58, 96, 112, [48, 48, 6, 6]); ctx.fill();
  const sg = ctx.createLinearGradient(0, wy - 52, 0, wy + 48);
  sg.addColorStop(0, '#3d3a78'); sg.addColorStop(1, '#f08a6a');
  ctx.fillStyle = sg; roundRect(wx - 40, wy - 50, 80, 96, [40, 40, 4, 4]); ctx.fill();
  ctx.fillStyle = '#fff3c0'; ctx.beginPath(); ctx.arc(wx + 14, wy - 22, 2.5, 0, TAU); ctx.fill();
  // Floor
  ctx.fillStyle = '#8a6440'; ctx.fillRect(-offX, 780, viewW, H - 780 + 10);
  ctx.fillStyle = '#7a5636'; ctx.fillRect(-offX, 780, viewW, 5);
  // Lamp glow
  const lx = L.cx + L.dx * 0.55;
  const lg = ctx.createRadialGradient(lx, TABLE_Y - 30, 10, lx, TABLE_Y - 30, 360);
  lg.addColorStop(0, 'rgba(255,220,140,0.55)'); lg.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, TABLE_Y - 30, 360, 0, TAU); ctx.fill();
}

function drawTable() {
  const L = supperLayout();
  const hw = Math.min(310, W / 2 - 16);
  // legs and front
  ctx.fillStyle = '#6a4424';
  ctx.fillRect(L.cx - hw + 20, TABLE_Y + 20, 16, 80);
  ctx.fillRect(L.cx + hw - 36, TABLE_Y + 20, 16, 80);
  ctx.fillStyle = '#8a5a30';
  roundRect(L.cx - hw, TABLE_Y, hw * 2, 26, 6); ctx.fill();
  // cloth
  ctx.fillStyle = '#f4ead2';
  ctx.beginPath();
  ctx.moveTo(L.cx - hw * 0.7, TABLE_Y); ctx.lineTo(L.cx + hw * 0.7, TABLE_Y);
  ctx.lineTo(L.cx + hw * 0.62, TABLE_Y + 34); ctx.lineTo(L.cx - hw * 0.62, TABLE_Y + 34); ctx.closePath(); ctx.fill();
  // cup
  const cx = L.cx - L.dx * 0.55;
  ctx.fillStyle = '#b5703a';
  ctx.beginPath(); ctx.moveTo(cx - 11, TABLE_Y - 26); ctx.lineTo(cx + 11, TABLE_Y - 26); ctx.lineTo(cx + 6, TABLE_Y - 8); ctx.lineTo(cx - 6, TABLE_Y - 8); ctx.fill();
  ctx.fillRect(cx - 2, TABLE_Y - 8, 4, 6); ctx.fillRect(cx - 8, TABLE_Y - 3, 16, 3);
  // oil lamp
  const lx = L.cx + L.dx * 0.55;
  ctx.fillStyle = '#b5703a';
  ctx.beginPath(); ctx.ellipse(lx, TABLE_Y - 6, 16, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd24a';
  ctx.beginPath(); ctx.moveTo(lx + 12, TABLE_Y - 10); ctx.quadraticCurveTo(lx + 18 + Math.sin(t * 17), TABLE_Y - 24, lx + 13, TABLE_Y - 30); ctx.quadraticCurveTo(lx + 8, TABLE_Y - 20, lx + 12, TABLE_Y - 10); ctx.fill();
}

// The loaf: whole, then broken into pieces, then shared
function drawBread() {
  const L = supperLayout();
  const s = sup;
  const breaks = s ? s.breaks : 0;
  const pieces = breaks + 1;
  const glowing = s && s.sub === 'break';
  if (glowing || (s && s.sub === 'bless')) {
    const gv = glowing ? breadPulse() : smooth(s.subT / 1.7);
    const g = ctx.createRadialGradient(L.breadX, L.breadY, 5, L.breadX, L.breadY, 90);
    g.addColorStop(0, `rgba(255,236,150,${0.25 + 0.6 * gv})`); g.addColorStop(1, 'rgba(255,236,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.breadX, L.breadY, 90, 0, TAU); ctx.fill();
    if (glowing) {
      ctx.strokeStyle = `rgba(245,190,40,${0.35 + 0.65 * gv})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(L.breadX, L.breadY, 50 + 10 * (1 - gv), 0, TAU); ctx.stroke();
    }
  }
  const pw = 76 / pieces;
  const spread = breaks * 7;
  for (let i = 0; i < pieces; i++) {
    let px = L.breadX - 38 + pw * (i + 0.5) + (i - (pieces - 1) / 2) * spread;
    let py = L.breadY;
    if (s && s.give > 0 && (i === 0 || i === pieces - 1)) {
      const tx = i === 0 ? L.cx - L.dx + 24 : L.cx + L.dx - 24;
      px = lerp(px, tx, s.give);
    }
    ctx.fillStyle = '#c98a3e';
    roundRect(px - pw / 2 + 1, py - 13, pw - 2, 22, pieces === 1 ? 11 : 6); ctx.fill();
    ctx.fillStyle = '#e2b36a';
    roundRect(px - pw / 2 + 3, py - 12, pw - 6, 10, 5); ctx.fill();
    ctx.strokeStyle = '#a56a2a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px - pw * 0.2, py - 8); ctx.lineTo(px - pw * 0.05, py - 3); ctx.moveTo(px + pw * 0.05, py - 8); ctx.lineTo(px + pw * 0.2, py - 3); ctx.stroke();
  }
  if (glowing) {
    ctx.save();
    ctx.font = '700 17px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    const txt = `Tap the bread as it shines! (${breaks}/${cfg.breaks})`;
    ctx.strokeText(txt, L.breadX, TABLE_Y + 78); ctx.fillStyle = '#7a4a10'; ctx.fillText(txt, L.breadX, TABLE_Y + 78);
    ctx.restore();
  }
}

function drawRunWorld() {
  drawNightSky();
  drawHills(560, 22, 160, 0.12, '#2e2f5a', 0);
  drawCity(cfg.runLen * 0.3 + W * 0.5, 610, 0.3, '#3a3a60', true);
  drawHills(640, 16, 110, 0.35, '#28324a', 300);
  drawGroundAndRoad(0, true);
  ctx.save();
  ctx.translate(-camX, 0);
  const vis0 = camX - offX - 150, vis1 = camX + W + offX + 150;
  for (let i = 0; i < cfg.runLen / 240 + 6; i++) {
    const x = i * 240 + hash(i + 70) * 120 - 300;
    if (x < vis0 || x > vis1) continue;
    drawTree(x, 686, 0.7 + hash(i + 3) * 0.5, hash(i + 5) < 0.55 ? 'olive' : 'cypress', 1);
  }
  // The upper room where the eleven are gathered
  const A = arriveLayout();
  drawHouse(A.x0 + A.span / 2, 694, A.span + 90, 170, '#6a5a78', true, true);
  // Obstacles on the road
  if (run) {
    for (const o of run.obs) {
      if (o.x < vis0 || o.x > vis1) continue;
      const y = ROAD_Y + 2;
      if (o.kind === 'rock') {
        ctx.fillStyle = '#8a86a0';
        ctx.beginPath(); ctx.ellipse(o.x, y, o.w / 2, 18, 0, Math.PI, TAU); ctx.fill();
        ctx.fillStyle = '#a6a2bc'; ctx.beginPath(); ctx.ellipse(o.x - 6, y - 10, 8, 5, 0, 0, TAU); ctx.fill();
      } else if (o.kind === 'hole') {
        ctx.fillStyle = '#2a2640';
        ctx.beginPath(); ctx.ellipse(o.x, y, o.w / 2, 7, 0, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = '#6a4a34';
        roundRect(o.x - o.w / 2, y - 14, o.w, 14, 7); ctx.fill();
        ctx.fillStyle = '#8a6a4a'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2 - 4, y - 7, 4, 6, 0, 0, TAU); ctx.fill();
      }
    }
  }
  ctx.restore();
}

// ============================================================
//  Rhythm track, bubbles, banner, HUD
// ============================================================
function trackTargetX() { return 24 + 64; }

function drawFootprint(x, y, left, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(left ? -0.25 : 0.25);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#9a6a3a';
  ctx.beginPath(); ctx.ellipse(0, 3, 7, 11, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -11, 5.5, 5, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawScrollIcon(x, y, s, a = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#f6e3b0'; ctx.strokeStyle = '#b58a2a'; ctx.lineWidth = 2;
  roundRect(-12, -9, 24, 18, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d9a13a';
  roundRect(-16, -12, 6, 24, 3); ctx.fill();
  roundRect(10, -12, 6, 24, 3); ctx.fill();
  ctx.strokeStyle = '#b58a2a'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-7, -3); ctx.lineTo(7, -3); ctx.moveTo(-7, 2); ctx.lineTo(5, 2); ctx.stroke();
  ctx.restore();
}

function drawTrack() {
  const w = walk;
  const x0 = 24, x1 = W - 24, y = TRACK_Y, tx = trackTargetX();
  const T = phaseT;
  ctx.save();
  ctx.fillStyle = 'rgba(255,248,225,0.85)';
  ctx.strokeStyle = 'rgba(200,150,50,0.8)'; ctx.lineWidth = 2.5;
  roundRect(x0, y - 36, x1 - x0, 72, 36); ctx.fill(); ctx.stroke();
  // target circle, which pulses with each footfall
  const f = w.beatFlash / 0.18;
  ctx.fillStyle = `rgba(255,215,90,${0.25 + 0.5 * f})`;
  ctx.beginPath(); ctx.arc(tx, y, 27 + 4 * f, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#d9961c'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(tx, y, 27, 0, TAU); ctx.stroke();
  // clip the notes to the band
  roundRect(x0 + 2, y - 34, x1 - x0 - 4, 68, 34); ctx.clip();
  const pxs = (x1 - tx - 20) / TRACK_VIS;
  let k = 0;
  for (const n of w.notes) {
    k++;
    const x = tx + (n.time - T) * pxs;
    if (x > x1 + 30) break;
    if (x < x0 - 30) continue;
    if (n.res === 'perfect' || n.res === 'good') continue;
    const a = n.res === 'miss' ? 0.3 : 1;
    if (n.type === 'scroll') {
      if (!n.res) {
        const g = ctx.createRadialGradient(x, y, 2, x, y, 30);
        g.addColorStop(0, 'rgba(255,220,90,0.8)'); g.addColorStop(1, 'rgba(255,220,90,0)');
