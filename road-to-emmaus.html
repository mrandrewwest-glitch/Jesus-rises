        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.fill();
      }
      drawScrollIcon(x, y, 1.05, a);
    } else drawFootprint(x, y, k % 2 === 0, a);
  }
  ctx.restore();
  if (level === 1 && T < LEAD + 4) {
    ctx.save();
    ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8a5a00';
    ctx.fillText('TAP', tx, y + 1);
    ctx.restore();
  }
}

function drawBubble() {
  if (!bubble || bubble.t <= 0) return;
  const key = { jesus: 'jesus', cleopas: 'cleopas', companion: 'companion', peter: 'peter' }[bubble.who];
  const anchor = heads[key];
  if (!anchor) return;
  const big = bubble.who === 'jesus';
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = big ? '700 18px Fredoka, sans-serif' : '600 17px Fredoka, sans-serif';
  const maxW = Math.min(W * 0.84, 400) - 26;
  const lines = wrapLines(bubble.text, maxW);
  const lw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = lw + 26, lh = 22, h = lines.length * lh + 16;
  const bx = clamp(anchor.x - w / 2, -offX + 8, W + offX - w - 8);
  const by = Math.max(anchor.y - h - 16, 250);
  ctx.fillStyle = big ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = big ? '#e0a526' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  const tx = clamp(anchor.x, bx + 16, bx + w - 16);
  const ay = Math.max(anchor.y - 2, by + h + 6);
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(anchor.x, ay); ctx.lineTo(tx + 8, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h); ctx.lineTo(anchor.x, ay); ctx.lineTo(tx + 8, by + h);
  ctx.stroke();
  ctx.fillStyle = big ? '#8a5a00' : '#3b2f1e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 8 + lh * (i + 0.5) + 1));
  ctx.restore();
}

// A parchment banner for the narration verses
function drawBanner() {
  if (!banner || banner.t <= 0) return;
  const v = Bible.verse(VERSES[banner.key]);
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.5, 0, 1) * clamp((banner.age || 0) / 0.4, 0, 1);
  ctx.font = 'italic 600 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 60, 620) - 40;
  const lines = wrapLines(v.text, maxW);
  const lw = Math.max(...lines.map((l) => ctx.measureText(l).width), 120);
  const w = lw + 44, lh = 22, h = lines.length * lh + 36;
  const x = W / 2 - w / 2, y = 116;
  ctx.fillStyle = '#fbf1d6'; ctx.strokeStyle = '#c9a45a'; ctx.lineWidth = 2.5;
  roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8cf92';
  roundRect(x - 8, y - 4, 14, h + 8, 7); ctx.fill(); ctx.stroke();
  roundRect(x + w - 6, y - 4, 14, h + 8, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a1a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y + 12 + lh * (i + 0.5)));
  ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a3a';
  ctx.fillText(v.cite, W / 2, y + h - 12);
  ctx.restore();
}

function drawPopups(scr) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 20px Fredoka, sans-serif';
  ctx.lineJoin = 'round';
  for (const p of popups) {
    if (p.scr !== scr) continue;
    const a = clamp(p.t / 0.3, 0, 1);
    const yy = p.y - (0.9 - p.t) * 40;
    ctx.globalAlpha = a;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    if (phase === 'run') ctx.strokeStyle = 'rgba(20,20,50,0.8)';
    ctx.strokeText(p.text, p.x, yy);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, yy);
  }
  ctx.restore();
}

function drawHUD() {
  const night = state !== 'title' && (phase === 'run' || phase === 'arrive');
  const ink = night ? '#fff3cf' : '#5a4210';
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = night ? 'rgba(0,0,20,0.8)' : 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + meter
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Road to Emmaus' : `Level ${level} · ${cfg.name}`, 12, 26);
  let label = '', val = 0, col = '#f7c948', col2 = '#fff1a8', warn = false;
  if (state !== 'title') {
    if (phase === 'walk' && walk) { label = 'PACE'; val = 1 - walk.gapDisp / 100; warn = walk.gap > 70; col = '#7fc36a'; col2 = '#d8f0a0'; }
    else if (phase === 'invite' && inv) { label = 'URGE'; val = inv.urges / cfg.urges; }
    else if (phase === 'supper' && sup) { label = 'BREAD'; val = sup.breaks / cfg.breaks; col = '#e2b36a'; col2 = '#fff1b0'; }
    else if (run) { label = 'ROAD'; val = clamp(run.x / cfg.runLen, 0, 1); col = '#ffd24a'; col2 = '#fff6d0'; }
  }
  if (label) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(label, 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = night ? 'rgba(255,243,207,0.25)' : 'rgba(90,66,16,0.25)';
    roundRect(58, 38, 130, 13, 6.5); ctx.fill();
    const gg = ctx.createLinearGradient(58, 0, 188, 0);
    gg.addColorStop(0, col); gg.addColorStop(1, col2);
    ctx.fillStyle = warn && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
    if (val > 0) { roundRect(58, 38, 130 * clamp(val, 0, 1), 13, 6.5); ctx.fill(); }
  }
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: scrolls gathered, or time left on the night road
  if (state !== 'title' && walk) {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    if (run && (phase === 'run' || phase === 'arrive')) {
      ctx.font = '600 12px Fredoka, sans-serif';
      ctx.fillText('TIME', rx, 20);
      ctx.font = '700 20px Fredoka, sans-serif';
      ctx.fillStyle = run.timeLeft < 3 && phase === 'run' ? '#ff8a8a' : ink;
      ctx.fillText(`${Math.ceil(run.timeLeft)}s`, rx, 44);
    } else {
      ctx.font = '600 12px Fredoka, sans-serif';
      ctx.fillText('SCROLLS', rx, 20);
      ctx.font = '700 20px Fredoka, sans-serif';
      ctx.fillText(`${walk.scrolls}/${walk.scrollTotal}`, rx, 44);
      ctx.shadowBlur = 0;
      drawScrollIcon(rx - ctx.measureText(`${walk.scrolls}/${walk.scrollTotal}`).width - 20, 37, 0.7);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.3);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, H * 0.3);
  ctx.restore();
}

// ============================================================
//  Rendering
// ============================================================
function drawCharacters() {
  heads = {};
  const jScreen = J.x;
  if (phase === 'supper' && state !== 'title') {
    const lookJ = (p) => { const dx = J.x - p.x; return { lx: Math.sign(dx) * 0.8, ly: -0.3 }; };
    heads.cleopas = drawPerson({ d: PAIR[0], x: PAIR[0].x, y: PAIR[0].y, s: CH, seated: true, ...lookJ(PAIR[0]) });
    heads.companion = drawPerson({ d: PAIR[1], x: PAIR[1].x, y: PAIR[1].y, s: CH, seated: true, ...lookJ(PAIR[1]) });
    heads.jesus = drawJesus(J);
    return;
  }
  const running = phase === 'run' || phase === 'arrive';
  if (running && state !== 'title') {
    // The eleven, gathered in the lamplight
    const A = arriveLayout();
    const back = [1, 4, 6, 8, 9], front = [0, 2, 3, 5, 7, 10];
    const lookBack = { lx: -0.8, ly: -0.2 };
    back.forEach((idx, k) => {
      const x = A.x0 + 20 + (A.span - 40) * (k / 4);
      drawPerson({ d: DISCIPLES[idx], x, y: ROAD_Y - 22, s: 0.95, ...lookBack });
    });
    front.forEach((idx, k) => {
      const x = A.x0 + A.span * (k / 5);
      const h = drawPerson({ d: DISCIPLES[idx], x, y: ROAD_Y + 4, s: 1.05, ...lookBack });
      if (idx === 0) heads.peter = h;
    });
    heads.companion = drawPerson({ d: PAIR[1], x: PAIR[1].x, y: ROAD_Y, s: CH, walkPh: PAIR[1].walkPh, walkAmt: PAIR[1].walkAmt, jumpY: PAIR[1].jumpY, run: PAIR[1].walkAmt > 0.3, lx: 1, ly: 0 });
    heads.cleopas = drawPerson({ d: PAIR[0], x: PAIR[0].x, y: ROAD_Y, s: CH, walkPh: PAIR[0].walkPh, walkAmt: PAIR[0].walkAmt, jumpY: PAIR[0].jumpY, run: PAIR[0].walkAmt > 0.3, lamp: true, lx: 1, ly: 0 });
    return;
  }
  // On the road (and on the title screen)
  const look = (p) => { const dx = jScreen - p.x; return { lx: clamp(dx / 120, -1, 1) * 0.9, ly: -0.25 }; };
  const reach = phase === 'invite' && inv && !inv.done && state === 'play';
  heads.companion = drawPerson({ d: PAIR[1], x: PAIR[1].x, y: ROAD_Y - 4, s: CH, walkPh: PAIR[1].walkPh, walkAmt: PAIR[1].walkAmt, reach: reach && inv.urges % 2 === 1, ...look(PAIR[1]) });
  heads.cleopas = drawPerson({ d: PAIR[0], x: PAIR[0].x, y: ROAD_Y + 2, s: CH, walkPh: PAIR[0].walkPh, walkAmt: PAIR[0].walkAmt, reach: reach && inv.urges % 2 === 0, ...look(PAIR[0]) });
  heads.jesus = drawJesus(J);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  const inRoom = phase === 'supper' && state !== 'title';
  const night = (phase === 'run' || phase === 'arrive') && state !== 'title';
  if (inRoom) drawSupperRoom();
  else if (night) drawRunWorld();
  else drawWalkWorld();

  // Characters in the world
  ctx.save();
  ctx.translate(-camX, 0);
  if (night) {
    const g = ctx.createRadialGradient(PAIR[0].x, ROAD_Y - 60, 10, PAIR[0].x, ROAD_Y - 60, 200);
    g.addColorStop(0, 'rgba(255,210,120,0.35)'); g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(PAIR[0].x, ROAD_Y - 60, 200, 0, TAU); ctx.fill();
  }
  drawCharacters();
  for (const k in heads) if (heads[k]) heads[k] = { x: heads[k].x - camX, y: heads[k].y };
  ctx.restore();

  if (inRoom) { drawTable(); drawBread(); }
  ctx.save(); ctx.translate(-camX, 0); drawParticles(false); ctx.restore();
  if (!inRoom) drawGrassTufts(night ? 0 : sunsetP(), night);

  if (state !== 'title' && phase === 'walk' && walk) drawTrack();
  if (phase === 'invite' && inv && !inv.done && state === 'play') {
    // A friendly prompt above the pair
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    const hx = heads.cleopas ? heads.cleopas.x : W / 2;
    ctx.save();
    ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    const txt = `Tap to ask Him in! ${inv.urges}/${cfg.urges}`;
    const px = clamp(hx, 150, W - 150);
    ctx.strokeText(txt, px, 820 - pulse * 4); ctx.fillStyle = '#8a4a00'; ctx.fillText(txt, px, 820 - pulse * 4);
    ctx.restore();
  }
  drawParticles(true);
  drawPopups(true);

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBanner();
  drawBubble();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,220,${Math.min(1, flashT * 1.6)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fadeT > 0) {
    ctx.fillStyle = `rgba(20,12,24,${1 - Math.abs(fadeT - 0.6) / 0.6})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updateTitle(dt) {
  // The three walk together along the road behind the title card
  J.x += 55 * dt;
  J.walkPh += 55 * dt * Math.PI / STEP; J.walkAmt = 1; J.pose = 'walk';
  J.hood = 1; J.reveal = 0; J.alpha = 1;
  followTo(PAIR[0], J.x - 68, dt);
  followTo(PAIR[1], J.x - 128, dt);
  camX = J.x - walkBaseX();
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (banner) { banner.t -= dt; banner.age = (banner.age || 0) + dt; if (banner.t <= 0) banner = null; }
  if (fadeT > 0) {
    const before = fadeT;
    fadeT = Math.max(0, fadeT - dt);
    if (before > 0.6 && fadeT <= 0.6 && fadeFn) { const fn = fadeFn; fn(); }
    if (fadeT <= 0) fadeFn = null;
  }
  if (state === 'play') {
    phaseT += dt;
    if (phase === 'walk') updateWalk(dt);
    else if (phase === 'invite') updateInvite(dt);
    else if (phase === 'supper') updateSupper(dt);
    else if (phase === 'run') updateRun(dt);
    else if (phase === 'arrive') updateArrive(dt);
  } else if (state === 'fail') {
    // He walks on ahead if they fell behind
    if (phase === 'walk' || phase === 'invite') { J.x += 60 * dt; J.walkPh += 60 * dt * Math.PI / STEP; J.walkAmt = 1; }
    for (const p of PAIR) { p.walkAmt *= 0.9; p.vy -= 1900 * dt; p.jumpY = Math.max(0, p.jumpY + p.vy * dt); }
  } else if (state === 'win') {
    if (Math.random() < dt * 12) {
      const A = arriveLayout();
      spawn(A.x0 + rand(0, A.span), ROAD_Y - rand(40, 160), 0, -20, 1, '#fff6d0', 3);
    }
  } else if (state === 'title') {
    updateTitle(dt);
  }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
