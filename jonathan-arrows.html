<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd1ee">
<title>David and Jonathan</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #9fd1ee;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .new {
    text-align: center;
    background: #fff3cf;
    border-radius: 12px;
    padding: 6px 10px;
    margin: 8px 0;
  }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">David and Jonathan</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'jesusLovesMe', instrument: 'harp', accent: 'pipe', ambience: 'birds', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  runFind: { ref: '1 Samuel 20:36', KJV: 'Run, find out now the arrows which I shoot. And as the lad ran, he shot an arrow beyond him.', NKJV: 'Now run, find the arrows which I shoot.” As the lad ran, he shot an arrow beyond him.', NIV: 'Run and find the arrows I shoot.” As the boy ran, he shot an arrow beyond him.', NLT: 'Start running,” he told the boy, “so you can find the arrows as I shoot them.” So the boy ran, and Jonathan shot an arrow beyond him.' },
  // Level cards: the secret plan
  threeArrows: { ref: '1 Samuel 20:20', KJV: 'And I will shoot three arrows on the side thereof, as though I shot at a mark.', NKJV: 'Then I will shoot three arrows to the side, as though I shot at a target;', NIV: 'I will shoot three arrows to the side of it, as though I were shooting at a target.', NLT: 'I will come out and shoot three arrows to the side of the stone pile as though I were shooting at a target.' },
  thisSide: { ref: '1 Samuel 20:21', KJV: 'Behold, the arrows are on this side of thee, take them; then come thou: for there is peace to thee, and no hurt', NKJV: 'Look, the arrows are on this side of you; get them and come’—then, as the Lord lives, there is safety for you and no harm.', NIV: 'Look, the arrows are on this side of you; bring them here,’ then come, because, as surely as the Lord lives, you are safe', NLT: 'They’re on this side,’ then you will know, as surely as the Lord lives, that all is well, and there is no trouble.' },
  beyond: { ref: '1 Samuel 20:22', KJV: 'Behold, the arrows are beyond thee; go thy way: for the Lord hath sent thee away.', NKJV: 'Look, the arrows are beyond you’—go your way, for the Lord has sent you away.', NIV: 'Look, the arrows are beyond you,’ then you must go, because the Lord has sent you away.', NLT: 'Go farther—the arrows are still ahead of you,’ then it will mean that you must leave immediately, for the Lord is sending you away.' },
  // Jonathan's calls (speech bubbles)
  isNot: { ref: '1 Samuel 20:37', KJV: 'Is not the arrow beyond thee?', NKJV: 'Is not the arrow beyond you?', NIV: 'Isn’t the arrow beyond you?', NLT: 'The arrow is still ahead of you.' },
  onThisSide: { ref: '1 Samuel 20:21', KJV: 'Behold, the arrows are on this side of thee', NKJV: 'Look, the arrows are on this side of you', NIV: 'Look, the arrows are on this side of you', NLT: 'They’re on this side' },
  haste: { ref: '1 Samuel 20:38', KJV: 'Make speed, haste, stay not.', NKJV: 'Make haste, hurry, do not delay!', NIV: 'Hurry! Go quickly! Don’t stop!', NLT: 'Hurry, hurry, don’t wait.' },
  gathered: { ref: '1 Samuel 20:38', KJV: 'And Jonathan\'s lad gathered up the arrows, and came to his master.', NKJV: 'So Jonathan’s lad gathered up the arrows and came back to his master.', NIV: 'The boy picked up the arrow and returned to his master.', NLT: 'So the boy quickly gathered up the arrows and ran back to his master.' },
  // The friends say goodbye
  goInPeace: { ref: '1 Samuel 20:42', KJV: 'Go in peace, forasmuch as we have sworn both of us in the name of the Lord, saying, The Lord be between me and thee, and between my seed and thy seed for ever.', NKJV: 'Go in peace, since we have both sworn in the name of the Lord, saying, ‘May the Lord be between you and me, and between your descendants and my descendants, forever.’', NIV: 'Go in peace, for we have sworn friendship with each other in the name of the Lord, saying, ‘The Lord is witness between you and me, and between your descendants and my descendants forever.', NLT: 'Go in peace, for we have sworn loyalty to each other in the Lord’s name. The Lord is the witness of a bond between us and our children forever.' },
  peace: { ref: '1 Samuel 20:42', KJV: 'Go in peace', NKJV: 'Go in peace', NIV: 'Go in peace', NLT: 'Go in peace' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function bubbleText(key) {
  return Bible.verse(VERSES[key]).text.replace(/^\.\.\.\s*/, '…').replace(/[,:;]$/, '…').replace(/[“”]/g, '');
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  onResize();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;          // HUD strip at the top of the screen
const GY = 770;            // the ground line of the field

const LEVELS = [
  { name: 'Three Arrows',        rounds: 3, zf: 0.34, period: 3.4, timer: 10,  wind: 0,    ghost: false, move: 0,    catchN: 5,  catchGap: 1.0 },
  { name: 'The Secret Signal',   rounds: 4, zf: 0.27, period: 2.8, timer: 8,   wind: 0,    ghost: false, move: 0,    catchN: 6,  catchGap: 0.9 },
  { name: 'A Breezy Morning',    rounds: 4, zf: 0.24, period: 2.5, timer: 7,   wind: 0.09, ghost: true,  move: 0,    catchN: 7,  catchGap: 0.85 },
  { name: 'The Boy Runs About',  rounds: 5, zf: 0.22, period: 2.3, timer: 6,   wind: 0.08, ghost: false, move: 0.1,  catchN: 8,  catchGap: 0.75 },
  { name: 'Gusty Fields',        rounds: 5, zf: 0.19, period: 2.0, timer: 5.2, wind: 0.12, ghost: false, move: 0.14, catchN: 9,  catchGap: 0.68 },
  { name: 'Make Speed, Haste!',  rounds: 6, zf: 0.17, period: 1.75, timer: 4.4, wind: 0.13, ghost: false, move: 0.18, catchN: 10, catchGap: 0.6 },
];
const NEW_THINGS = [
  '',
  'Watch the sign each time: <b>GO</b> means land it <b>BEYOND</b> the boy, <b>SAFE</b> means land it <b>SHORT</b> of him.',
  '<b>New: wind!</b> The wind pushes your arrow. The dotted ring shows where it will really land.',
  '<b>New: the boy runs about!</b> Your arrow must land in the right place when it comes down. No more dotted ring for the wind: watch the flag!',
  'Stronger gusts and quicker rounds. Watch the flag!',
  'The fastest rounds of all. Make speed, haste!',
];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | pause | win | fail | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('jonathanBest') || 0; } catch (e) {}

let cfg = LEVELS[0];
let t = 0;
let phase = 'ready';       // ready | aim | flight | result | catch
let phaseT = 0;
let round = 0;
let hearts = 3;
let msg = 'go';            // the secret message this round: 'go' (beyond) or 'safe' (short)
let marker = { u: 0, dir: 1 };
let wind = 0;
let timer = 0;
let arrow = null;          // the arrow in flight
let stuck = [];            // arrows stuck in the ground
let boy = null;
let david = null;
let jon = null;
let falling = [];          // the catch-the-arrows bonus
let caught = 0, catchSpawned = 0, catchT = 0;
let roundPts = 0, hits = 0, wrongs = 0, misses = 0, accSum = 0;
let lastResult = null;
let particles = [];
let message = { text: '', t: 0 };
let bubbles = [];
let flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let winT = 0, failT = 0;
let told = {};

// ============================================================
//  The field
// ============================================================
function jx() { return clamp(W * 0.09, 58, 130); }
function field() {
  const minX = jx() + 110, maxX = W - 26;
  return { minX, maxX, F: maxX - minX };
}
function stoneX() { return W * 0.8; }
function zoneOf(bx) {
  const f = field();
  const zw = cfg.zf * f.F, gap = Math.max(22, 0.05 * f.F);
  return msg === 'go' ? { a: bx + gap, b: bx + gap + zw, gap, zw } : { a: bx - gap - zw, b: bx - gap, gap, zw };
}
// Where the boy may stand so the whole zone is in the field
function boyRange() {
  const f = field();
  const zw = cfg.zf * f.F, gap = Math.max(22, 0.05 * f.F);
  const lo0 = f.minX + 0.18 * f.F;
  return msg === 'go' ? [lo0, f.maxX - gap - zw] : [Math.max(lo0, f.minX + gap + zw), f.maxX - 30];
}
function onResize() {
  if (!boy) return;
  const f = field();
  boy.x = clamp(boy.x, f.minX, f.maxX); boy.tx = clamp(boy.tx, f.minX, f.maxX);
}

// ============================================================
//  Level flow
// ============================================================
function resetLevel() {
  cfg = LEVELS[level - 1];
  round = 0; hearts = 3;
  roundPts = 0; hits = 0; wrongs = 0; misses = 0; accSum = 0;
  arrow = null; stuck = []; falling = []; caught = 0; catchSpawned = 0; catchT = 0;
  particles = []; bubbles = [];
  winT = 0; failT = 0; flashT = shakeT = 0; endTimer = 0;
  lastResult = null;
  told = {};
  wind = 0;
  boy = { x: jx() + 40, y: GY, tx: jx() + 40, step: 0, mood: 'smile', hold: 0, lo: 0, hi: 0, v: 0, jump: 0 };
  david = { x: stoneX(), y: GY - 34, peek: 0, mood: 'smile', out: null, step: 0 };
  jon = { pull: 0, mood: 'smile', bow: 0 };
  keys.clear();
}

function startLevel() {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}`, 2);
  newRound();
}

function newRound() {
  round++;
  msg = level === 1 ? ['go', 'safe', 'go'][round - 1] : Math.random() < 0.5 ? 'go' : 'safe';
  const [lo, hi] = boyRange();
  boy.tx = rand(lo, hi);
  const f = field();
  if (cfg.move) {
    const span = Math.min(hi - lo, 0.34 * f.F);
    boy.lo = clamp(boy.tx - span / 2, lo, hi); boy.hi = clamp(boy.lo + span, lo, hi);
    boy.v = cfg.move * f.F * (Math.random() < 0.5 ? 1 : -1);
  } else boy.v = 0;
  wind = 0;
  if (cfg.wind) {
    const m = rand(0.35, 1) * cfg.wind * f.F;
    wind = Math.random() < 0.5 ? -m : m;
    if (round === 1 && level === 3) wind = Math.abs(wind);
  }
  marker = { u: 0, dir: 1 };
  timer = cfg.timer;
  phase = 'ready'; phaseT = 0;
  jon.pull = 0;
  sfx.whistle();
}

// ============================================================
//  Shooting
// ============================================================
function markerX() { const f = field(); return f.minX + marker.u * f.F; }

function shoot() {
  if (state !== 'play' || phase !== 'aim') return;
  const f = field();
  const lx = clamp(markerX() + wind, f.minX - 60, W + 30);
  const bx = jx() + 58, by = GY - 46;
  const dist = Math.abs(lx - bx);
  arrow = { x0: bx, y0: by, lx, t: 0, dur: 0.7 + 0.45 * dist / Math.max(400, f.F), apex: 120 + dist * 0.32, x: bx, y: by, a: 0 };
  phase = 'flight'; phaseT = 0;
  jon.pull = 0; jon.bow = 1;
  sfx.twang();
}

function updateArrow(dt) {
  if (!arrow) return;
  arrow.t += dt / arrow.dur;
  const f = Math.min(1, arrow.t);
  const px = arrow.x, py = arrow.y;
  arrow.x = lerp(arrow.x0, arrow.lx, f);
  arrow.y = lerp(arrow.y0, GY - 4, f) - Math.sin(f * Math.PI) * arrow.apex;
  arrow.a = Math.atan2(arrow.y - py, arrow.x - px || 0.001);
  if (f >= 1) land();
}

function land() {
  const lx = arrow.lx;
  stuck.push({ x: lx, a: arrow.a, t: 0 });
  arrow = null;
  sfx.thunk();
  for (let k = 0; k < 6; k++) spawn(lx, GY, rand(-60, 60), rand(-90, -30), 0.5, '#a07a4a', rand(2, 4), 260);
  const z = zoneOf(boy.x);
  // the opposite zone (the wrong message)
  const gap = z.gap, zw = z.zw;
  const wrongZone = msg === 'go' ? { a: boy.x - gap - zw, b: boy.x - gap } : { a: boy.x + gap, b: boy.x + gap + zw };
  let res;
  if (lx >= z.a && lx <= z.b) res = 'hit';
  else if (Math.abs(lx - boy.x) < gap) res = 'close';
  else if (lx >= wrongZone.a - 30 && lx <= wrongZone.b + 30 && Math.sign(lx - boy.x) === (msg === 'go' ? -1 : 1)) res = 'wrong';
  else res = 'miss';
  lastResult = res;
  phase = 'result'; phaseT = 0;
  if (res === 'hit') {
    const mid = (z.a + z.b) / 2;
    const acc = 1 - Math.abs(lx - mid) / (zw / 2);
    accSum += acc;
    hits++;
    const pts = 200 + Math.round(acc * 100) + Math.round(Math.max(0, timer) * 15);
    roundPts += pts;
    showMessage(acc > 0.7 ? `Bullseye! +${pts}` : `The secret sign is sent! +${pts}`, 1.8);
    bubbles.push({ key: msg === 'go' ? 'isNot' : 'onThisSide', who: 'jon', t: 2.2 });
    boy.mood = 'joy'; david.mood = 'joy'; david.peek = 1;
    sparkleBurst(lx, GY - 10, 18);
    sfx.good();
  } else {
    hearts--;
    shakeT = 0.2;
    if (res === 'wrong') { wrongs++; showMessage(msg === 'go' ? 'Oh no! That says SAFE, not GO!' : 'Oh no! That says GO, not SAFE!', 2); }
    else if (res === 'close') { misses++; showMessage('Too close to the boy!', 2); boy.jump = 1; }
    else { misses++; showMessage('Missed the mark!', 1.8); }
    boy.mood = 'shock'; david.mood = 'worried'; david.peek = 1;
    sfx.bad();
  }
}

function timeUp() {
  hearts--; misses++;
  lastResult = 'slow';
  showMessage('Too slow! Shoot before the time runs out', 2);
  phase = 'result'; phaseT = 0;
  boy.mood = 'shock'; david.mood = 'worried';
  sfx.bad();
}

function endRound() {
  // the boy fetches the arrow
  stuck = stuck.filter((s) => s.t < 0);
  boy.mood = 'smile'; david.mood = 'smile';
  if (hearts <= 0) { fail(); return; }
  if (round >= cfg.rounds) { startCatch(); return; }
  newRound();
}

// ============================================================
//  The bonus: the boy gathers the arrows
// ============================================================
function startCatch() {
  phase = 'catch'; phaseT = 0;
  catchT = 0; catchSpawned = 0; caught = 0; falling = [];
  wind = 0;
  bubbles.push({ key: 'haste', who: 'jon', t: 2.4 });
  showMessage('Bonus! Tap where the boy should run to catch the arrows', 3);
  boy.tx = boy.x;
}
function updateCatch(dt) {
  catchT += dt;
  const f = field();
  if (catchSpawned < cfg.catchN && catchT > 1.2 + catchSpawned * cfg.catchGap) {
    catchSpawned++;
    const x = rand(f.minX + 10, f.maxX - 10);
    falling.push({ x, y: -offY - 30, vy: 180 + level * 30, done: false, t: 0 });
  }
  // keyboard
  if (keys.has('ArrowLeft') || keys.has('KeyA')) boy.tx = boy.x - 60;
  if (keys.has('ArrowRight') || keys.has('KeyD')) boy.tx = boy.x + 60;
  boy.tx = clamp(boy.tx, f.minX - 60, f.maxX);
  for (const a of falling) {
    if (a.done) { a.t += dt; continue; }
    a.y += a.vy * dt; a.vy += 60 * dt;
    if (a.y >= GY - 64 && Math.abs(a.x - boy.x) < 46) {
      a.done = true; a.caught = true; caught++;
      sfx.catchIt(caught);
      sparkleBurst(a.x, GY - 70, 10);
    } else if (a.y >= GY - 6) {
      a.done = true; a.y = GY - 6;
      sfx.thunk();
    }
  }
  falling = falling.filter((a) => !(a.done && (a.caught || a.t > 1.2)));
  if (catchSpawned >= cfg.catchN && falling.every((a) => a.done) && catchT > 1.6) win();
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const heartBonus = hearts * 150;
  const catchBonus = caught * 50;
  const levelBonus = level * 300;
  const score = roundPts + heartBonus + catchBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('jonathanBest', best); } catch (e) {} }
  lastScore = { roundPts, heartBonus, catchBonus, levelBonus, score };
  showMessage('David saw the signal!', 2);
  sfx.win();
  boy.mood = 'joy';
  david.out = { t: 0, fx: david.x };
  falling = [];
  endTimer = 7.5;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('The secret signal got muddled…', 2.2);
  sfx.fail();
  endTimer = 2.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  particles.push({ x, y, vx, vy, life, t: 0, color, size, grav });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(40, 200);
    particles.push({ kind: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.6, 1.2), t: 0, color: pick(cols), size: rand(2, 5), grav: 60 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vy += (p.grav || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
}

  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')) shoot();
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {

  if (state !== 'play') return;
  if (phase === 'catch') { boy.tx = p.vx - offX; return; }
  shoot();
});

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass', delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  twang() { this.tone(180, 0.25, 'triangle', 0.25, 0, 90); this.noiseBurst(2500, 0.25, 0.12, 1, 800); },
  thunk() { this.tone(140, 0.12, 'sine', 0.3, 0, 70); this.noiseBurst(500, 0.1, 0.15, 1); },
  good() { if (this.ctx) Music.tap(0.7); this.tone(1046, 0.3, 'sine', 0.12, 0.08); this.tone(1318, 0.4, 'sine', 0.1, 0.18); },
  bad() { this.tone(330, 0.25, 'triangle', 0.18, 0, 220); this.tone(220, 0.35, 'triangle', 0.14, 0.18, 160); },
  whistle() { this.tone(1500, 0.12, 'sine', 0.08, 0, 1900); this.tone(1900, 0.18, 'sine', 0.07, 0.13, 1400); },
  catchIt(n) { if (this.ctx) Music.tap(clamp(n / cfg.catchN, 0, 1)); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);

// ============================================================
//  Drawing people
// ============================================================
const JON = { robe: '#2f6fb5', hair: '#4a2f1a', skin: '#d9a066', beard: true, band: true, sash: '#f2c230' };
const DAVID = { robe: '#3c8f86', hair: '#a8532a', skin: '#e3b184', beard: false, sash: '#e0a526' };
const BOY = { robe: '#e07a5f', hair: '#3a2716', skin: '#dca678', beard: false, sash: '#f0d888' };

function eyes(x, y, lx, ly, closed, big = 1) {
  const dark = '#2b1d12';
  for (const sx of [-6, 6]) {
    if (closed) {
      ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + sx, y - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x + sx, y, 3.6 * big, 4.6 * big, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(x + sx + lx * 1.6, y + ly * 2, 2.1, 0, TAU); ctx.fill();
  }
}

// A standing figure: d = colours, pose = 'creep' | 'stand' | 'hold' | 'call' | 'walk'
function drawFigure(d, x, y, s, opt = {}) {
  const pose = opt.pose || 'stand';
  const face = opt.face || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s, s);
  const crouch = pose === 'creep' ? 8 : 0;
  ctx.translate(0, crouch * 0.5);
  if (opt.shiver) ctx.translate(Math.sin(t * 60) * 1.6, 0);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // feet
  const stepA = pose === 'walk' ? Math.sin(opt.step || 0) * 5 : 0;
  ctx.fillStyle = '#7a4a28';
  ctx.beginPath(); ctx.ellipse(-7 + stepA, -2, 6, 3.5, 0, 0, TAU); ctx.ellipse(7 - stepA, -2, 6, 3.5, 0, 0, TAU); ctx.fill();
  // robe
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-17, -2);
  ctx.quadraticCurveTo(-16, -30, -11, -37 + crouch);
  ctx.quadraticCurveTo(0, -41 + crouch, 11, -37 + crouch);
  ctx.quadraticCurveTo(16, -30, 17, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = d.sash || '#c9b07a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-15, -18 + crouch * 0.4); ctx.quadraticCurveTo(0, -15 + crouch * 0.4, 15, -18 + crouch * 0.4); ctx.stroke();
  const sh = -32 + crouch;
  if (pose === 'creep') { arm(-11, sh, -18 * face, sh + 14); arm(11, sh, 22 * face, sh + 6); }
  else if (pose === 'hold') { arm(-11, sh, -14, sh + 20); arm(11 * face, sh, 22 * face, sh - 36); }
  else if (pose === 'call') { arm(-11, sh, -24, sh - 30); arm(11, sh, 24, sh - 30); }
  else if (pose === 'lamp' || pose === 'walk') { arm(11 * face, sh, 30 * face, sh + 14); arm(-11 * face, sh, -15 * face, sh + 20); }
  else if (pose === 'bow') { arm(-11 * face, sh, 18 * face, sh + 2); arm(11 * face, sh, 30 * face, sh); }
  else if (pose === 'run') { const sw = Math.sin(opt.step || 0) * 12; arm(-11, sh, -14 - sw * 0.5, sh + 18); arm(11, sh, 14 + sw * 0.5, sh + 18); }
  else if (pose === 'hug') { arm(-11 * face, sh, 16 * face, sh + 6); arm(11 * face, sh, 28 * face, sh + 4); }
  else if (pose === 'carry') { arm(-11, sh, -16, sh - 30); arm(11, sh, 16, sh - 30); }
  else if (pose === 'dance') { const sw = Math.sin(opt.step || 0); arm(-11, sh, -26, sh - 22 - sw * 10); arm(11, sh, 26, sh - 22 + sw * 10); }
  else if (pose === 'bowdown') { arm(-11, sh, -12, sh + 16); arm(11, sh, 12, sh + 16); }
  else { arm(-11, sh, -15, sh + 20); arm(11, sh, 15, sh + 20); }
  // head
  const hy = -53 + crouch;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.helmet) {
    ctx.fillStyle = '#9aa4ad';
    ctx.beginPath(); ctx.arc(0, hy - 3, 17, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#c0392b'; roundRect(-3, hy - 26, 6, 10, 3); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
    if (!d.beard) { // David's curls
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-12 + k * 6, hy - 13 + Math.abs(k - 2), 4, 0, TAU); ctx.fill(); }
    }
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  if (d.crown) drawCrown(0, hy - 14, 1);
  if (d.band) { ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(0, hy - 1, 15.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
  if (d.turban) { ctx.fillStyle = d.turban; ctx.beginPath(); ctx.ellipse(0, hy - 12, 18, 9, 0, 0, TAU); ctx.fill(); ctx.fillStyle = shade(d.turban, -25); ctx.fillRect(-16, hy - 9, 32, 4); }
  const closed = opt.blink;
  eyes(0, hy - 1, opt.lx != null ? opt.lx : face * 0.6, opt.ly || 0, closed, opt.wide ? 1.2 : 1);
  // mouth
  ctx.lineCap = 'round';
  if (opt.mouth === 'o') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(0, hy + 9, 3, 4, 0, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'shh') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.arc(0, hy + 9, 2.4, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'grin') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.moveTo(-6, hy + 6); ctx.arc(0, hy + 6, 6, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  else { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, hy + 6, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (opt.hold) opt.hold(22 * face, sh - 44);
  ctx.restore();
}

function drawCrown(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-13, 4); ctx.lineTo(-14, -8); ctx.lineTo(-7, -2); ctx.lineTo(0, -11); ctx.lineTo(7, -2); ctx.lineTo(14, -8); ctx.lineTo(13, 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
  ctx.restore();
}

// Speech bubble with a tail pointing to (ax, ay)
function speech(x, y, text, ax, ay, fill = '#fffbe8', ink = '#8a5a00', size = 17, maxW = 300) {
  ctx.save();
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 24, h = lines.length * (size + 5) + 14;
  const bx = clamp(x, 8, W - w - 8), by = Math.max(TOPH - offY + 6, y - h);
  ctx.fillStyle = fill; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(ax, bx + 18, bx + w - 34);
  if (ay > by + h) {
    ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay); ctx.lineTo(tx + 16, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(ax, ay); ctx.lineTo(tx + 16, by + h); ctx.stroke();
  }
  ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 12, by + 7 + (size + 5) / 2 + i * (size + 5)));
  ctx.restore();
  return { bx, by, w, h };
}

// ============================================================
//  Drawing the field
// ============================================================
function drawCloud(cx, cy, w, h) {
  const n = Math.max(3, Math.round(w / 22));
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1), r = h * (0.42 + 0.38 * Math.sin(f * Math.PI));
    const px = cx - w / 2 + h * 0.4 + f * (w - h * 0.8), py = cy - r * 0.3;
    ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU);
  }
  ctx.fill();
}

function drawBackground() {
  const L = -offX, R = W + offX, T = -offY;
  const g = ctx.createLinearGradient(0, T, 0, GY);
  g.addColorStop(0, '#9fd1ee'); g.addColorStop(0.6, '#cfe9f5'); g.addColorStop(1, '#fff1cc');
  ctx.fillStyle = g; ctx.fillRect(L, T, R - L, GY - T);
  // morning sun
  const sx = W * 0.22, sy = GY - 330;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 130);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 130, 0, TAU); ctx.fill();
  for (let k = 0; k < 5; k++) {
    const cw = 90 + hash(k, 5) * 90;
    const cx = ((hash(k, 4) * (viewW + 300) + t * (8 + k * 3) + wind * 0.05 * t) % (viewW + 300)) - offX - 150;
    drawCloud(cx, lerp(T + 150, GY - 380, hash(k, 6)), cw, cw * 0.32);
  }
  // far hills and the town of Gibeah
  ctx.fillStyle = '#b9d49a';
  ctx.beginPath(); ctx.moveTo(L, GY);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, GY - 150 + Math.sin(x / 120) * 22 + Math.sin(x / 47) * 7);
  ctx.lineTo(R, GY); ctx.fill();
  const tx = W * 0.08;
  for (let k = 0; k < 5; k++) {
    const hx = tx + k * 30 - 20, hy = GY - 186 + (k % 2) * 8 + Math.sin(hx / 120) * 22;
    ctx.fillStyle = k % 2 ? '#e8d3aa' : '#dcc497';
    ctx.fillRect(hx, hy, 28, 22);
    ctx.fillStyle = '#b89a6a'; ctx.fillRect(hx - 2, hy - 3, 32, 4);
  }
  ctx.fillStyle = '#c9b07a'; ctx.fillRect(tx - 30, GY - 172, 170, 8);
  ctx.fillStyle = '#9fc27a';
  ctx.beginPath(); ctx.moveTo(L, GY);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, GY - 70 + Math.sin(x / 160 + 1) * 14);
  ctx.lineTo(R, GY); ctx.fill();
}

function drawStonePile() {
  const x = stoneX(), y = GY - 22;
  const rocks = [[-44, 0, 30, 20], [0, 4, 36, 22], [42, 2, 28, 18], [-22, -24, 28, 18], [20, -24, 30, 19], [0, -46, 24, 16]];
  for (const [dx, dy, rx, ry] of rocks) {
    ctx.fillStyle = '#9a8f80';
    ctx.beginPath(); ctx.ellipse(x + dx, y + dy, rx, ry, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b8ad9c';
    ctx.beginPath(); ctx.ellipse(x + dx - 6, y + dy - 6, rx * 0.6, ry * 0.45, 0, 0, TAU); ctx.fill();
  }
}

function drawGround() {
  const L = -offX, R = W + offX;
  const g = ctx.createLinearGradient(0, GY - 20, 0, H);
  g.addColorStop(0, '#8fc06a'); g.addColorStop(1, '#6a9e4a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(L, GY - 8);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, GY - 8 + Math.sin(x / 90) * 3);
  ctx.lineTo(R, H + 10); ctx.lineTo(L, H + 10); ctx.fill();
  for (let k = 0; k < 40; k++) {
    const fx = L + hash(k, 1) * (R - L), fy = GY + 20 + hash(k, 2) * (H - GY - 30);
    ctx.fillStyle = ['#fff', '#ffd166', '#f28fb1', '#7aae55'][k % 4];
    ctx.beginPath(); ctx.arc(fx, fy, k % 4 === 3 ? 5 : 3, 0, TAU); ctx.fill();
  }
}

// The glowing patch where the arrow must land
function drawZone() {
  if (state !== 'play' || phase === 'catch' || phase === 'ready' && phaseT < 0.2) return;
  const z = zoneOf(boy.x);
  const col = msg === 'go' ? '255,150,60' : '60,200,110';
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  ctx.save();
  ctx.fillStyle = `rgba(${col},${0.35 + pulse * 0.2})`;
  roundRect(z.a, GY - 6, z.b - z.a, 26, 13); ctx.fill();
  ctx.strokeStyle = `rgba(${col},0.95)`; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
  roundRect(z.a, GY - 6, z.b - z.a, 26, 13); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  const lbl = msg === 'go' ? 'BEYOND' : 'SHORT';
  ctx.strokeText(lbl, (z.a + z.b) / 2, GY + 46);
  ctx.fillStyle = `rgb(${msg === 'go' ? '190,90,20' : '30,130,60'})`; ctx.fillText(lbl, (z.a + z.b) / 2, GY + 46);
  ctx.restore();
}

function drawMarker() {
  if (state !== 'play' || (phase !== 'aim' && phase !== 'ready')) return;
  if (phase === 'ready') return;
  const x = markerX();
  const z = zoneOf(boy.x);
  const inZ = x + (cfg.ghost ? wind : 0) >= z.a && x + (cfg.ghost ? wind : 0) <= z.b;
  ctx.save();
  ctx.strokeStyle = inZ ? '#ffffff' : '#c0392b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(x, GY + 6, 26, 9, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = inZ ? 'rgba(255,255,255,0.35)' : 'rgba(192,57,43,0.18)';
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 10, GY + 6); ctx.lineTo(x + 10, GY + 6); ctx.moveTo(x, GY); ctx.lineTo(x, GY + 12); ctx.stroke();
  // a bouncing pointer above the ring
  const by = GY - 40 - Math.abs(Math.sin(t * 6)) * 8;
  ctx.fillStyle = inZ ? '#ffffff' : '#c0392b';
  ctx.beginPath(); ctx.moveTo(x - 9, by - 12); ctx.lineTo(x + 9, by - 12); ctx.lineTo(x, by); ctx.closePath(); ctx.fill();
  if (cfg.ghost && wind) {
    // where the wind will really carry it
    const gx = x + wind;
    ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(40,60,120,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(gx, GY + 6, 22, 8, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, GY + 22); ctx.lineTo(gx, GY + 22); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawArrowShape(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.strokeStyle = '#7a4a28'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(18, 0); ctx.stroke();
  ctx.fillStyle = '#9aa4ad';
  ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(16, -5); ctx.lineTo(16, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-32, -6); ctx.lineTo(-20, -1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-32, 6); ctx.lineTo(-20, 1); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawJonathan() {
  const x = jx(), y = GY + 4;
  const s = 1.5;
  const aiming = state === 'play' && phase === 'aim';
  if (aiming) jon.pull = Math.min(1, jon.pull + 0.05);
  const hug = state === 'win' || state === 'done';
  drawFigure(JON, x, y, s, { pose: hug && david.out && david.out.t > 0.95 ? 'hug' : hug ? 'stand' : 'bow', face: 1, lx: 1, mouth: lastResult === 'hit' && phase === 'result' ? 'grin' : 'smile' });
  if (hug) return;
  // the bow
  const hx = x + 30 * s, hy = y - 32 * s;
  const pull = aiming ? 6 + jon.pull * 10 : 0;
  ctx.save();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hx - 14, hy, 34, -1.15, 1.15); ctx.stroke();
  const tx = hx - 14 + Math.cos(-1.15) * 34, ty1 = hy + Math.sin(-1.15) * 34, ty2 = hy - Math.sin(-1.15) * 34;
  ctx.strokeStyle = '#f5ecd7'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(tx, ty1); ctx.lineTo(hx - 14 - pull, hy); ctx.lineTo(tx, ty2); ctx.stroke();
  if (aiming || phase === 'ready') drawArrowShape(hx + 6 - pull, hy, -0.35, 0.9);
  ctx.restore();
  // quiver with the arrows still to shoot
  const left = cfg.rounds - round + (phase === 'aim' || phase === 'ready' ? 1 : 0);
  for (let k = 0; k < Math.max(0, left - 1); k++) {
    ctx.save(); ctx.translate(x - 22, y - 62 + k * 2); ctx.rotate(-1.9 + k * 0.08);
    ctx.strokeStyle = '#7a4a28'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26, 0); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6, -4); ctx.lineTo(-6, 4); ctx.fill();
    ctx.restore();
  }
}

function drawBoy() {
  const moving = Math.abs(boy.tx - boy.x) > 2 || (phase === 'aim' && boy.v);
  const jump = boy.mood === 'joy' ? Math.abs(Math.sin(t * 9)) * 10 : boy.jump > 0 ? Math.sin(boy.jump * Math.PI) * 30 : 0;
  drawFigure(BOY, boy.x, boy.y - jump, 1.05, {
    pose: boy.mood === 'joy' ? 'call' : moving ? 'run' : 'stand', step: boy.step, face: boy.face || 1,
    mouth: boy.mood === 'joy' ? 'grin' : boy.mood === 'shock' ? 'o' : 'smile', wide: boy.mood === 'shock',
    lx: (jx() - boy.x) < 0 ? -0.8 : 0.8,
    hold: phase === 'catch' || state === 'win' || state === 'done' ? (hx, hy) => { for (let k = 0; k < Math.min(caught + 1, 6); k++) drawArrowShape(hx - 18 + k * 2, hy + 30, -1.4 + k * 0.06, 0.6); } : null,
  });
}

function drawDavid() {
  if (david.out) {
    drawFigure(DAVID, david.x, david.y, 1.3, { pose: david.out.t >= 1 ? 'hug' : 'run', step: david.step, face: -1, lx: -1, mouth: 'grin' });
    return;
  }
  // peeking out from behind the stone pile (drawn before the stones, so only his head shows)
  const up = 6 + david.peek * 22 + Math.sin(t * 1.3) * 3;
  const x = stoneX() + 14, feet = GY - 30 - up, y = feet - 70;
  drawFigure(DAVID, x, feet, 1.2, { pose: david.mood === 'joy' ? 'call' : 'stand', face: -1, lx: -1, mouth: david.mood === 'joy' ? 'grin' : david.mood === 'worried' ? 'o' : 'smile', wide: david.mood === 'worried' });
  if (david.mood === 'joy') {
    ctx.fillStyle = '#ffe27a'; ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('♥', x + 26, y - 20 - Math.sin(t * 6) * 4);
  }
}

function drawWindFlag(x, y) {
  const f = field();
  const w = clamp(wind / (0.14 * f.F), -1, 1);
  const calm = Math.abs(w) < 0.05;
  ctx.save();
  ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const n = 1 + Math.round(Math.abs(w) * 2);
  const txt = calm ? 'No wind' : 'Wind ' + (w > 0 ? '→'.repeat(n) : '←'.repeat(n));
  const tw = ctx.measureText(txt).width + 64;
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; roundRect(x - tw / 2, y, tw, 30, 15); ctx.fill();
  // a little flag that streams out with the wind
  const px = x - tw / 2 + 18, py = y + 4;
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(px, py + 24); ctx.lineTo(px, py); ctx.stroke();
  const len = 6 + Math.abs(w) * 16, dir = w >= 0 ? 1 : -1, flap = Math.sin(t * (6 + Math.abs(w) * 10)) * 2;
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dir * len, py + 4 + flap); ctx.lineTo(px, py + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a4a7a'; ctx.fillText(txt, x + 10, y + 16);
  ctx.restore();
}

// The secret message for this round, and the time left
function drawSign() {
  if (state !== 'play' || phase === 'catch') return;
  const go = msg === 'go';
  ctx.save();
  ctx.font = '700 26px Fredoka, sans-serif';
  const top = Math.max(TOPH - offY + 70, GY - 440);
  const txt = go ? 'Send: GO!' : 'Send: SAFE!';
  const sub = go ? 'Land it BEYOND the boy' : 'Land it SHORT of the boy';
  ctx.font = '700 18px Fredoka, sans-serif';
  const w = Math.max(230, ctx.measureText(sub).width + 40);
  const x = W / 2 - w / 2;
  ctx.fillStyle = go ? '#f39c34' : '#2fae5f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  roundRect(x, top, w, 74, 18); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 28px Fredoka, sans-serif'; ctx.fillText(txt, W / 2, top + 26);
  ctx.font = '600 17px Fredoka, sans-serif'; ctx.fillText(sub, W / 2, top + 55);
  // timer bar
  if (phase === 'aim') {
    const f = clamp(timer / cfg.timer, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; roundRect(x + 10, top + 82, w - 20, 10, 5); ctx.fill();
    ctx.fillStyle = f < 0.3 ? '#e74c3c' : '#3b6fb5'; roundRect(x + 10, top + 82, (w - 20) * f, 10, 5); ctx.fill();
  }
  if (cfg.wind) drawWindFlag(W / 2, top + 100);
  ctx.restore();
}

function drawArrows() {
  for (const s of stuck) drawArrowShape(s.x - Math.cos(s.a) * 14, GY - Math.sin(s.a) * 14 - 2, s.a);
  if (arrow) drawArrowShape(arrow.x, arrow.y, arrow.a);
  for (const a of falling) {
    if (!a.done) {
      // shadow showing where it will land
      const near = clamp((a.y + offY) / (GY + offY), 0, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.1 + near * 0.25})`;
      ctx.beginPath(); ctx.ellipse(a.x, GY + 4, 8 + near * 14, 4 + near * 3, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = a.done ? clamp(1 - a.t, 0, 1) : 1;
    drawArrowShape(a.x, a.y, Math.PI / 2);
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 4);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const r = k % 2 ? p.size * 0.45 : p.size * 1.3; ctx.lineTo(Math.cos(k * Math.PI / 5) * r, Math.sin(k * Math.PI / 5) * r); }
      ctx.fill(); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawBubbles() {
  for (const b of bubbles) {
    ctx.save();
    ctx.globalAlpha = clamp(b.t / 0.3, 0, 1);
    const text = '“' + bubbleText(b.key) + '”';
    const x = jx();
    if (b.who === 'jon') speech(x - 20, GY - 150, text, x + 10, GY - 100, '#fffbe8', '#8a5a00', 18, Math.min(320, W - 60));
    ctx.restore();
  }
}

// ============================================================
//  Updating
// ============================================================
function updateBoy(dt) {
  boy.jump = Math.max(0, boy.jump - dt * 2);
  if (phase === 'aim' && boy.v && state === 'play') {
    boy.tx += boy.v * dt;
    if (boy.tx > boy.hi) { boy.tx = boy.hi; boy.v = -Math.abs(boy.v); }
    if (boy.tx < boy.lo) { boy.tx = boy.lo; boy.v = Math.abs(boy.v); }
    boy.x = boy.tx;
  }
  if (phase === 'flight' && boy.v && state === 'play') {
    boy.x += boy.v * dt;
    if (boy.x > boy.hi) { boy.x = boy.hi; boy.v = -Math.abs(boy.v); }
    if (boy.x < boy.lo) { boy.x = boy.lo; boy.v = Math.abs(boy.v); }
    boy.tx = boy.x;
  }
  const d = boy.tx - boy.x;
  const sp = phase === 'catch' ? 380 : 300;
  if (Math.abs(d) > 1) {
    boy.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);
    boy.step += dt * 14;
    boy.face = Math.sign(d);
  }
  if (phase === 'aim' && boy.v) { boy.step += dt * 10; boy.face = Math.sign(boy.v); }
}

function updatePlay(dt) {
  phaseT += dt;
  updateBoy(dt);
  david.peek = Math.max(0, david.peek - dt * 0.6);
  if (phase === 'ready') {
    if (Math.abs(boy.tx - boy.x) < 2 && phaseT > 0.9) {
      phase = 'aim'; phaseT = 0;
      if (!told.aim) { told.aim = true; showMessage('Tap when the ring is in the glowing patch!', 2.6); }
      if (wind && !told.wind) { told.wind = true; showMessage(cfg.ghost ? 'The wind! Aim with the dotted ring' : 'Watch the wind flag!', 2.4); }
      if (boy.v && !told.move) { told.move = true; showMessage('The boy is running about!', 2.2); }
    }
  } else if (phase === 'aim') {
    marker.u += marker.dir * dt * 2 / cfg.period;
    if (marker.u >= 1) { marker.u = 1; marker.dir = -1; }
    if (marker.u <= 0) { marker.u = 0; marker.dir = 1; }
    timer -= dt;
    if (timer <= 0) timeUp();
  } else if (phase === 'flight') {
    updateArrow(dt);
  } else if (phase === 'result') {
    if (phaseT > 1.7) endRound();
  } else if (phase === 'catch') {
    updateCatch(dt);
  }
}

function updateWin(dt) {
  winT += dt;
  updateBoy(dt);
  // the boy goes back to town; David comes out from behind the stone
  if (winT > 0.6) boy.tx = -offX - 80;
  if (david.out) {
    david.out.t = Math.min(1, david.out.t + dt / 2.2);
    const f = ease(david.out.t);
    david.x = lerp(david.out.fx, jx() + 62, f); david.y = GY + 4; david.step += dt * 12;
    if (david.out.t >= 1 && !david.said) {
      david.said = true;
      bubbles.push({ key: 'peace', who: 'jon', t: 3.5 });
      for (let k = 0; k < 6; k++) particles.push({ kind: 'star', x: jx() + 30, y: GY - 120, vx: rand(-30, 30), vy: rand(-60, -20), life: 1.6, t: 0, color: '#ff8fa3', size: 5, grav: 0 });
    }
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(255,255,255,0.75)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, viewW, TOPH);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'David and Jonathan' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    for (let k = 0; k < 3; k++) {
      const x = 22 + k * 24, y = 45;
      ctx.globalAlpha = k < hearts ? 1 : 0.25;
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 12, y - 2, x - 6, y - 11, x, y - 4); ctx.bezierCurveTo(x + 6, y - 11, x + 12, y - 2, x, y + 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`Score ${totalScore + roundPts}`, viewW - 12, 26);
    ctx.fillText(phase === 'catch' ? `Caught ${caught}/${cfg.catchN}` : `Arrow ${Math.min(round, cfg.rounds)}/${cfg.rounds}`, viewW - 12, 49);
  }
  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = TOPH + 34;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,12,8,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  if (boy) {
    drawBackground();
    if (!david.out) drawDavid();
    drawStonePile();
    if (david.out) drawDavid();
    drawGround();
    drawZone();
    drawMarker();
    drawBoy();
    drawJonathan();
    drawArrows();
    drawParticles();
    drawSign();
    drawBubbles();
  }
  if (flashT > 0) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (!boy) return;
  for (const s of stuck) s.t += dt;
  if (state === 'play') updatePlay(dt);
  else if (state === 'win' || state === 'done') updateWin(dt);
  else if (state === 'fail') failT += dt;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
