<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a8ab8">
<title>The Dove and the Olive Leaf</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2a1f2e;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #overlay .card { -webkit-overflow-scrolling: touch; }
  #overlay:not(.hidden) .card { overscroll-behavior: contain; }   /* only while shown: on a hidden card it makes Chrome treat canvas taps as scrolls */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Dove and the Olive Leaf</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'harp', ambience: 'wind', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  sentDove: { ref: 'Genesis 8:8', KJV: 'Also he sent forth a dove from him, to see if the waters were abated from off the face of the ground;', NKJV: 'He also sent out from himself a dove, to see if the waters had receded from the face of the ground.', NIV: 'Then he sent out a dove to see if the water had receded from the surface of the ground.', NLT: 'He also released a dove to see if the water had receded and it could find dry ground.' },
  // Win card
  oliveLeaf: { ref: 'Genesis 8:11', KJV: 'And the dove came in to him in the evening; and, lo, in her mouth was an olive leaf pluckt off: so Noah knew that the waters were abated from off the earth.', NKJV: 'Then the dove came to him in the evening, and behold, a freshly plucked olive leaf was in her mouth; and Noah knew that the waters had receded from the earth.', NIV: 'When the dove returned to him in the evening, there in its beak was a freshly plucked olive leaf! Then Noah knew that the water had receded from the earth.', NLT: 'This time the dove returned to him in the evening with a fresh olive leaf in its beak. Then Noah knew that the floodwaters were almost gone.' },
  window: { ref: 'Genesis 8:6', KJV: 'And it came to pass at the end of forty days, that Noah opened the window of the ark which he had made:', NKJV: 'So it came to pass, at the end of forty days, that Noah opened the window of the ark which he had made.', NIV: 'After forty days Noah opened a window he had made in the ark', NLT: 'After another forty days, Noah opened the window he had made in the boat' },
  // Fail card
  noRest: { ref: 'Genesis 8:9', KJV: 'But the dove found no rest for the sole of her foot, and she returned unto him into the ark', NKJV: 'But the dove found no resting place for the sole of her foot, and she returned into the ark to him', NIV: 'But the dove could find nowhere to perch... so it returned to Noah in the ark.', NLT: 'But the dove could find no place to land... So it returned to the boat' },
};

let state = 'title';      // title | play | pause | win | fail
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('doveBest') || 0; } catch (e) {}
let t = 0;

function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#e6eef6') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// ============================================================
//  People (Noah and his family)
// ============================================================
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';
  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  switch (mood) {
    case 'wow':
      eyes(4, 5.5, 2.1); brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2); brows(-10, -6, -10, -6);
      mouthLine(() => { ctx.moveTo(-5, mouthY); ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY); ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY); });
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      eyes(3.5, 4, 2); brows(-9, -5, -9, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    default:  // watch / work
      eyes(3.5, 4.5, 2); brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
  }
}

function drawScarf(d, hy) {
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
}

// d: { robe, hair, skin, beard, longBeard, scarf, kid, blink }
// mood: watch | work | wow | worried | joy | dismay | point
function drawPerson(d, x, y, s, mood, lookX = 0, lookY = 0.2, extra = 0) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + (d.phase || 0))) * 12;
  if (d.kid) s *= 0.78;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + (d.phase || 0)) * 4;
    arm(-11, -32, -24 + wave, -66); arm(11, -32, 24 - wave, -66);
  } else if (mood === 'point') {
    arm(11, -32, 30, -50 + Math.sin(t * 5) * 2);
  }
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37); ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (mood === 'watch' || mood === 'wow' || mood === 'dismay') { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }
  else if (mood === 'point') arm(-11, -32, -15, -12);
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) drawScarf(d, hy);
  else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    const L = d.longBeard ? 34 : 21;
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + L, 0, hy + L + 1);
    ctx.quadraticCurveTo(14, hy + L, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
    if (d.longBeard) { ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-4, hy + 14); ctx.lineTo(-3, hy + L - 4); ctx.moveTo(4, hy + 14); ctx.lineTo(3, hy + L - 4); ctx.stroke(); }
  }
  drawFace(d, mood === 'work' || mood === 'point' ? 'watch' : mood, hy, lookX, lookY);
  if (mood === 'work') {
    // swinging a mallet
    const a = -0.6 + Math.max(0, Math.sin(extra)) * 1.3;
    ctx.save(); ctx.translate(14, -32); ctx.rotate(a);
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, 10); ctx.stroke();
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(16, -14); ctx.stroke();
    ctx.fillStyle = '#6b4423'; roundRect(8, -22, 16, 9, 2); ctx.fill();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(14, 10, 4, 0, TAU); ctx.fill();
    ctx.restore();
    arm(-11, -32, -15, -12);
  }
  ctx.restore();
}

// A friendly pointing hand (for first-time hints)
function drawHand(x, y, ang = -Math.PI / 2) {
  const bob = Math.sin(t * 6) * 6;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.translate(0, 18 + bob);
  ctx.fillStyle = '#ffe0bd'; ctx.strokeStyle = '#a0643a'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-5, 0); ctx.lineTo(-5, 20); ctx.quadraticCurveTo(-15, 18, -14, 28);
  ctx.lineTo(-12, 44); ctx.quadraticCurveTo(0, 54, 14, 44); ctx.lineTo(16, 26);
  ctx.quadraticCurveTo(16, 20, 9, 20); ctx.lineTo(5, 20); ctx.lineTo(5, 0);
  ctx.quadraticCurveTo(0, -6, -5, 0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, 22); ctx.lineTo(-1, 30); ctx.moveTo(6, 22); ctx.lineTo(6, 30); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Particles (playfield coordinates)
// ============================================================
let particles = [];
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#ffd0e0']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, 260);
    spawn(x, y, Math.cos(a) * v, Math.sin(a) * v - 40, rand(0.5, 1.1), pick(cols), rand(2.5, 5), 160, i % 3 ? 'dot' : 'star');
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const r = p.size * 1.6;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.35 : r; ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); }
      ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

let message = { text: '', t: 0 };

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  tap(h) { if (this.ctx) Music.tap(clamp(h, 0, 1)); },
  bonk() { this.tone(220, 0.2, 'triangle', 0.25, 0, 130); },
  pop() { this.tone(520, 0.12, 'sine', 0.25, 0, 900); },
  sparkle() { [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.4, 'sine', 0.1, i * 0.07)); },
  whoosh() { this.noiseBurst(500, 0.9, 0.3, 0.6, 1600); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['intro', 'play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}
function toView(e) { return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale }; }
function hudHit(p) {
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return true; }
  }
  return false;
}

function drawHudButtons() {
  ctx.save();
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Level name top-left (view coordinates)
function drawHudTitle(text, ink = '#fff6dc') {
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
  ctx.fillStyle = ink;
  ctx.fillText(text, 12, 26);
  ctx.restore();
}

// A meter at the top right (view coordinates)
function drawMeter(label, frac, col, warn) {
  const w = Math.min(170, viewW - 300), x = viewW - w - 14, y = 40;
  ctx.save();
  ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'right';
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
  ctx.fillStyle = '#fff6dc';
  ctx.fillText(label, viewW - 14, 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  roundRect(x, y, w, 14, 7); ctx.fill();
  ctx.fillStyle = warn && Math.sin(t * 10) > 0 ? '#ff7b6b' : col;
  if (frac > 0) { roundRect(x, y, Math.max(14, w * frac), 14, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  roundRect(x, y, w, 14, 7); ctx.stroke();
  ctx.restore();
}

// Big friendly message (view coordinates)
function drawMessage(y) {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, Math.min(viewW - 40, 640));
  lines.forEach((l, i) => {
    const yy = y + i * 29;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(40,30,60,0.85)';
    ctx.strokeText(l, viewW / 2, yy);
    ctx.fillStyle = '#fff3c4';
    ctx.fillText(l, viewW / 2, yy);
  });
  ctx.restore();
}
// ============================================================
//  Tuning
// ============================================================
const WATER = 772;        // playfield y of the flood's surface
const GRAV = 860;         // pulls the dove down (px/s²)
const FLAP = -330;        // a flap lifts her (px/s)
const MAX_FALL = 360;
const DOVE_R = 15;        // her hit circle
const LAND_W = 620;       // the strip of dry land with the olive tree

const LEVELS = [
  { name: 'Over the Waters',     len: 1700, speed: 165, gate: 560, gap: 330, feathers: 5, gusts: 0, gustF: 0,   ravens: 0, rain: 0, win: 190 },
  { name: 'A Breezy Morning',    len: 2300, speed: 175, gate: 480, gap: 300, feathers: 5, gusts: 3, gustF: 380, ravens: 0, rain: 0, win: 170 },
  { name: 'The Cheeky Raven',    len: 2900, speed: 185, gate: 430, gap: 280, feathers: 4, gusts: 3, gustF: 450, ravens: 3, rain: 0, win: 150 },
  { name: 'Rain on the Wing',    len: 3400, speed: 195, gate: 390, gap: 260, feathers: 4, gusts: 4, gustF: 520, ravens: 4, rain: 1, win: 140 },
  { name: 'Strong Winds',        len: 4000, speed: 205, gate: 350, gap: 245, feathers: 4, gusts: 6, gustF: 620, ravens: 5, rain: 1, win: 130 },
  { name: 'The Long Way Home',   len: 4700, speed: 215, gate: 320, gap: 235, feathers: 3, gusts: 7, gustF: 680, ravens: 7, rain: 1, win: 120 },
];
function makeConfig(n) {
  const L = LEVELS[Math.min(n, LEVELS.length) - 1];
  const extra = Math.max(0, n - LEVELS.length);
  return { ...L, n, len: L.len + extra * 400, speed: L.speed + extra * 6, name: extra ? `${L.name} ${extra + 1}` : L.name };
}

// ============================================================
//  Game state
// ============================================================
let cfg = makeConfig(1);
const dove = { x: 0, y: 0, vy: 0, dir: 1, flapT: 0, hurtT: 0, leaf: false, ready: true, home: 0 };
let obstacles = [];       // trees and storm clouds
let gusts = [];
let ravens = [];
let sparkles = [];
let leaf = null;
let feathers = 5;
let sparklesGot = 0;
let camX = 0;
let playT = 0, winT = 0, failT = 0, endTimer = 0;
let ravenT = 0;
let rain = [];
let splashes = [];
let told = {};
let lastScore = null;
let shakeT = 0;
const NOAH = { robe: '#8a6a45', hair: '#f4f1ea', skin: '#d9a066', beard: true, longBeard: true, scarf: '#e8dcc0', blink: 0 };

function ceilY() { return 118 - offY; }
function arkWin() { return { x: 0, y: 470, h: cfg.win }; }   // the window's opening (right wall of the ark at x=0)
function landX() { return cfg.len; }
function groundAt(x) {
  // dry land rising out of the water at the far end
  const lx = landX();
  if (x < lx - 120 || x > lx + LAND_W + 200) return WATER;
  const f = clamp((x - (lx - 120)) / 260, 0, 1);
  const g = clamp((lx + LAND_W + 200 - x) / 260, 0, 1);
  return WATER - 120 * ease(Math.min(f, g)) - Math.sin(x / 60) * 6 * Math.min(f, g);
}

// ============================================================
//  Building a course
// ============================================================
function buildCourse() {
  obstacles = []; gusts = []; ravens = []; sparkles = [];
  const top = ceilY() + 40;
  let x = 520;
  let k = 0;
  while (x < cfg.len - 250) {
    const kind = k % 3 === 1 ? 'cloud' : k % 3 === 2 && cfg.n >= 2 ? 'both' : 'tree';
    const gapMid = rand(Math.max(top + cfg.gap / 2, 300), WATER - cfg.gap / 2 - 40);
    if (kind === 'tree' || kind === 'both') {
      const ty = kind === 'both' ? gapMid + cfg.gap / 2 : rand(Math.max(430, WATER - 330), WATER - 130);
      obstacles.push({ kind: 'tree', x: x + rand(-40, 40), y: ty + 52, r: 52, sway: rand(0, TAU) });
    }
    if (kind === 'cloud' || kind === 'both') {
      const cy = kind === 'both' ? gapMid - cfg.gap / 2 : rand(top + 20, Math.min(470, WATER - cfg.gap - 120));
      obstacles.push({ kind: 'cloud', x: x + rand(-30, 30), y: cy - 34, rx: 88, ry: 44, phase: rand(0, TAU) });
    }
    // a little sparkle of light to collect in the safe gap
    sparkles.push({ x: x + rand(-60, 60) + cfg.gate / 2, y: rand(top + 60, WATER - 120), got: false });
    x += cfg.gate * rand(0.85, 1.15);
    k++;
  }
  for (let i = 0; i < cfg.gusts; i++) {
    const gx = lerp(700, cfg.len - 300, (i + 0.5) / cfg.gusts) + rand(-80, 80);
    gusts.push({ x: gx, w: 170, dir: i % 2 ? -1 : 1 });
  }
  // the olive leaf, floating just above the olive tree
  leaf = { x: landX() + LAND_W * 0.55, y: WATER - 120 - 190, got: false };
}

// ============================================================
//  Flying
// ============================================================
function flap() {
  if (state !== 'play') return;
  if (dove.ready) { dove.ready = false; if (!told.go) { told.go = true; showMessage('Fly, little dove! Find the olive leaf.', 2.2); } }
  dove.vy = FLAP;
  dove.flapT = 0.28;
  sfx.flap();
}

function hurt(what) {
  if (dove.hurtT > 0) return;
  feathers--;
  dove.hurtT = 1.6;
  shakeT = 0.25;
  for (let i = 0; i < 6; i++) spawn(dove.x, dove.y, rand(-80, 80), rand(-120, 20), 1.4, '#ffffff', 4, 120, 'feather');
  sfx.bonk();
  const msg = { tree: 'Bump! Fly over the treetops.', cloud: 'Oof! Keep away from the storm clouds.', raven: 'That cheeky raven! Dodge him.', water: 'Splash! Tap to stay above the water.', wall: 'Find the window! Fly straight in.' }[what];
  if (feathers <= 0) { fail(); return; }
  if (!told[what]) { told[what] = true; showMessage(msg, 2.2); }
}

function updateDove(dt) {
  if (dove.ready) {
    dove.y = arkWin().y + Math.sin(t * 3) * 8;
    dove.flapT = (t * 4) % 0.28;
    return;
  }
  // wind in a gust column
  let push = 0;
  for (const g of gusts) if (Math.abs(dove.x - g.x) < g.w / 2) push += g.dir * cfg.gustF;
  dove.vy += (GRAV * (1 + cfg.rain * 0.12) - push) * dt;
  dove.vy = clamp(dove.vy, -520, MAX_FALL);
  dove.y += dove.vy * dt;
  dove.x += cfg.speed * dove.dir * dt;
  dove.flapT = Math.max(0, dove.flapT - dt);
  dove.hurtT = Math.max(0, dove.hurtT - dt);
  if (dove.y < ceilY() + DOVE_R) { dove.y = ceilY() + DOVE_R; dove.vy = Math.max(dove.vy, 40); }
  // the water (or the land)
  const gy = groundAt(dove.x);
  if (dove.y > gy - DOVE_R) {
    dove.y = gy - DOVE_R; dove.vy = -430;
    if (gy >= WATER - 2) { splashAt(dove.x); hurt('water'); }
  }
  if (state !== 'play') return;
  // things to bump into
  for (const o of obstacles) {
    if (Math.abs(o.x - dove.x) > 140) continue;
    if (o.kind === 'tree') {
      if (Math.hypot(dove.x - o.x, dove.y - o.y) < o.r + DOVE_R - 6) { hurt('tree'); bounce(o.y); }
      else if (Math.abs(dove.x - o.x) < 12 + DOVE_R && dove.y > o.y) { hurt('tree'); bounce(o.y); }
    } else {
      const dx = (dove.x - o.x) / (o.rx + DOVE_R - 8), dy = (dove.y - o.y) / (o.ry + DOVE_R - 6);
      if (dx * dx + dy * dy < 1) { hurt('cloud'); dove.vy = dove.y > o.y ? 200 : -300; }
    }
    if (state !== 'play') return;
  }
  for (const r of ravens) {
    if (!r.shooed && Math.hypot(dove.x - r.x, dove.y - r.y) < 20 + DOVE_R) { hurt('raven'); r.shooed = true; r.vy = -200; sfx.caw(); }
    if (state !== 'play') return;
  }
  for (const s of sparkles) {
    if (!s.got && Math.hypot(dove.x - s.x, dove.y - s.y) < 34) { s.got = true; sparklesGot++; sparkleBurst(s.x, s.y, 10); sfx.tap(0.5 + Math.random() * 0.5); }
  }
  // the olive leaf!
  if (!dove.leaf && Math.hypot(dove.x - leaf.x, dove.y - leaf.y) < 44) {
    dove.leaf = true; leaf.got = true;
    sparkleBurst(leaf.x, leaf.y, 30, ['#9ccc65', '#d4f0a0', '#fff6d0']);
    sfx.sparkle();
    showMessage('An olive leaf! Now fly home to Noah.', 2.6);
  }
  // turning round at the ends of the dry land
  const lx = landX();
  if (dove.dir > 0 && dove.x > lx + LAND_W + 60) { dove.dir = -1; if (!dove.leaf) showMessage('You missed the leaf! Turn round and grab it.', 2.2); }
  if (dove.dir < 0 && !dove.leaf && dove.x < lx - 140) { dove.dir = 1; showMessage('Back for the olive leaf!', 1.8); }
  if (dove.dir > 0 && dove.leaf && dove.x > lx + 40) { dove.dir = -1; }
  // home to the ark window
  if (dove.dir < 0 && dove.leaf && dove.x < arkWin().x + 30) {
    const w = arkWin();
    if (Math.abs(dove.y - w.y) < w.h / 2 - 6) win();
    else { hurt('wall'); dove.x = w.x + 150; dove.vy = -220; }
  }
}
function bounce(oy) { dove.vy = dove.y < oy ? -340 : 150; }
function splashAt(x) {
  splashes.push({ x, t: 0 });
  for (let i = 0; i < 10; i++) spawn(x + rand(-10, 10), WATER, rand(-120, 120), rand(-260, -120), 0.7, '#cfe8ff', 3, 700);
  sfx.splash();
}

function updateRavens(dt) {
  if (cfg.ravens && state === 'play' && !dove.ready) {
    ravenT -= dt;
    if (ravenT <= 0) {
      ravenT = rand(26, 34) / cfg.ravens * (cfg.len / 2600);
      const ahead = dove.dir * (W * 0.85);
      ravens.push({ x: dove.x + ahead, y: rand(ceilY() + 80, WATER - 160), y0: 0, vx: -dove.dir * rand(70, 120), phase: rand(0, TAU), shooed: false, vy: 0 });
      ravens[ravens.length - 1].y0 = ravens[ravens.length - 1].y;
      if (!told.ravenSeen) { told.ravenSeen = true; showMessage('Here comes a cheeky raven!', 1.8); sfx.caw(); }
    }
  }
  for (const r of ravens) {
    r.x += r.vx * dt;
    if (r.shooed) { r.vy -= 300 * dt; r.y += r.vy * dt; }
    else r.y = r.y0 + Math.sin(t * 2.4 + r.phase) * 60;
  }
  ravens = ravens.filter((r) => Math.abs(r.x - dove.x) < W * 2 && r.y > -offY - 100);
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  dove.home = 0;
  const featherBonus = feathers * 250;
  const sparkleBonus = sparklesGot * 60;
  const levelBonus = level * 400;
  const score = featherBonus + sparkleBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('doveBest', best); } catch (e) {} }
  lastScore = { featherBonus, sparkleBonus, levelBonus, score };
  showMessage('Noah reached out his hand and took her in!', 2.8);
  sfx.win();
  endTimer = 4.2;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('The little dove is too tired…', 2.4);
  sfx.fail();
  endTimer = 3;
}

// ============================================================
//  Screens
// ============================================================
function titleScreen() {
  state = 'title';
  syncAmbience();
  cfg = makeConfig(1);
  buildCourse();
  dove.x = 260; dove.y = 380; dove.dir = 1; dove.ready = true; dove.leaf = false;
  camX = 0;
  showOverlay('The Dove and the Olive Leaf', 'Fly out over the flood and bring back good news',
    `${verseHTML('sentDove')}
     <ul>
       <li>The rain has stopped. Noah sends a little <b>dove</b> out of the ark's window to look for dry land.</li>
       <li><b>Tap</b> (or press <kbd>Space</kbd>) to <b>flap</b>. Each tap lifts her up; stop tapping and she glides down.</li>
       <li>Don't touch the <b>water</b>, the <b>treetops</b> or the dark <b>storm clouds</b>. Dodge the cheeky <b>raven</b>! Swirling <b>wind</b> pushes you up or down.</li>
       <li>Find the <b>olive leaf</b> on the dry land, then fly home and straight in through the <b>ark window</b>.</li>
       <li>Catch the little <b>sparkles</b> on the way for extra points.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Open the window', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel(retry = false) {
  cfg = makeConfig(level);
  buildCourse();
  const w = arkWin();
  Object.assign(dove, { x: w.x + 40, y: w.y, vy: 0, dir: 1, flapT: 0, hurtT: 0, leaf: false, ready: true, home: 0 });
  feathers = cfg.feathers; sparklesGot = 0;
  camX = dove.x - W * 0.3;
  playT = 0; winT = 0; failT = 0; endTimer = 0;
  ravenT = 4; rain = []; splashes = []; particles = [];
  told = retry ? { go: true } : (level > 1 ? { go: true } : {});
  shakeT = 0;
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}`, 2);
  if (level === 1 && !retry) setTimeout(() => { if (state === 'play' && dove.ready) showMessage(isTouch() ? 'Tap the screen to flap!' : 'Tap, click or press Space to flap!', 3); }, 2000);
  if (level === 2 && !retry) setTimeout(() => { if (state === 'play') showMessage('Swirly wind pushes you up or down!', 2.6); }, 2100);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('An olive leaf!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('oliveLeaf')}
       ${level >= 2 ? verseHTML('window') : ''}
       <p style="text-align:center">The fresh leaf was good news: the water was going down, and soon everyone could come out of the ark!</p>
       <p class="score">Feathers kept (${feathers}): <b>${s.featherBonus}</b><br>Sparkles (${sparklesGot}): <b>${s.sparkleBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      level < LEVELS.length ? 'Fly again' : 'Fly once more!', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Back to the ark', `Level ${level} — ${cfg.name}`,
      `${verseHTML('noRest')}
       <p style="text-align:center">Noah gently took the tired dove back in. Try again! <b>Short taps</b> keep her steady: tap a little, glide a little.</p>
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Updating
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  shakeT = Math.max(0, shakeT - dt);
  for (const s of splashes) s.t += dt;
  splashes = splashes.filter((s) => s.t < 1);
  if (state === 'play') {
    playT += dt;
    updateDove(dt);
    updateRavens(dt);
    if (cfg.rain) updateRain(dt);
  } else if (state === 'win') {
    winT += dt;
    // she glides in through the window to Noah's hand
    const w = arkWin();
    dove.home = Math.min(1, dove.home + dt * 1.5);
    dove.x = lerp(dove.x, w.x - 60, dt * 3); dove.y = lerp(dove.y, w.y + 10, dt * 3);
    dove.flapT = (t * 3) % 0.28;
    if (Math.random() < dt * 6) sparkleBurst(w.x - 40 + rand(-30, 30), w.y + rand(-40, 40), 3);
  } else if (state === 'fail') {
    failT += dt;
    dove.y = Math.min(dove.y + dt * 40, WATER - 60);
  } else if (state === 'title') {
    dove.x += 60 * dt; dove.y = 380 + Math.sin(t * 1.5) * 40; dove.flapT = (t * 3) % 0.28;
    if (dove.x > 1600) dove.x = 200;
    camX = dove.x - W * 0.4;
  }
  // camera: she sits a third of the way across, looking ahead
  if (state === 'play' || state === 'win' || state === 'fail') {
    const target = dove.x - W * (dove.dir > 0 ? 0.3 : 0.7);
    camX += (target - camX) * (1 - Math.pow(0.02, dt));
  }
  message.t -= dt;
  endScreens(dt);
}

function updateRain(dt) {
  if (Math.random() < dt * 40) for (let i = 0; i < 2; i++) rain.push({ x: camX + rand(-offX, W + offX + 200), y: -offY - 20, v: rand(550, 700) });
  for (let i = rain.length - 1; i >= 0; i--) {
    const r = rain[i]; r.y += r.v * dt; r.x -= r.v * dt * 0.2;
    if (r.y > WATER) rain.splice(i, 1);
  }
}

// ============================================================
//  Input
// ============================================================
canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const v = toView(e);
  if (hudHit(v)) return;
  if (state === 'win' && winT > 2.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play') flap();
});
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && winT > 2.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat && ['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) flap();
});

// ============================================================
//  Extra sounds
// ============================================================
sfx.flap = function () { this.noiseBurst(1400, 0.12, 0.16, 0.9, 700); };
sfx.splash = function () { this.noiseBurst(1800, 0.4, 0.3, 0.6, 400); };
sfx.caw = function () { this.tone(520, 0.12, 'sawtooth', 0.08, 0, 380); this.tone(500, 0.14, 'sawtooth', 0.08, 0.16, 360); };

// ============================================================
//  Drawing
// ============================================================
function skyColours() {
  const lv = cfg.n;
  if (cfg.rain) return ['#9db4c8', '#c8d6de', '#e6ece6'];
  return lv % 2 ? ['#8fd0f2', '#cdeaf7', '#fff1d6'] : ['#a7c8f0', '#e6dcf2', '#ffe2c8'];
}
function drawSky() {
  const [a, b, c] = skyColours();
  const g = ctx.createLinearGradient(0, -offY, 0, WATER);
  g.addColorStop(0, a); g.addColorStop(0.65, b); g.addColorStop(1, c);
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, WATER + offY + 10);
  // sun low over the water
  if (!cfg.rain) {
    const sx = W * 0.75 - (camX * 0.02) % 200, sy = 320;
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 160);
    sg.addColorStop(0, 'rgba(255,250,225,0.95)'); sg.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 160, 0, TAU); ctx.fill();
  }
  // far soft clouds (parallax)
  for (let i = 0; i < 7; i++) {
    const span = W + 600;
    const x = ((hash(i, 1) * span - camX * 0.15) % span + span) % span - 300;
    const y = -offY * 0.5 + 90 + hash(i, 2) * 220;
    const w = 140 + hash(i, 3) * 120;
    drawCloud(x, y, w, w * 0.3, cfg.rain ? '#e4e9ee' : '#ffffff', cfg.rain ? '#c8d0d8' : '#eef2f7');
  }
  // far mountain tops just poking out of the flood
  ctx.fillStyle = cfg.rain ? '#8ea4a8' : '#9fbcc0';
  for (let i = -1; i < 6; i++) {
    const span = 900;
    const base = Math.floor(camX * 0.3 / span) * span;
    const x = base + i * span * 0.5 + hash(i + Math.floor(camX * 0.3 / span), 7) * 200 - camX * 0.3;
    const h = 30 + hash(i + Math.floor(camX * 0.3 / span), 8) * 40;
    ctx.beginPath(); ctx.moveTo(x - 90, WATER - 30); ctx.quadraticCurveTo(x, WATER - 30 - h * 2, x + 90, WATER - 30); ctx.fill();
  }
}

function drawWater() {
  const g = ctx.createLinearGradient(0, WATER - 40, 0, H);
  g.addColorStop(0, '#5aa6d8'); g.addColorStop(1, '#1f5f9a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-offX, H + 10);
  for (let x = -offX; x <= W + offX + 20; x += 16) ctx.lineTo(x, WATER + Math.sin((x + camX) / 45 + t * 2) * 5);
  ctx.lineTo(W + offX, H + 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = -offX; x <= W + offX + 20; x += 16) ctx.lineTo(x, WATER + Math.sin((x + camX) / 45 + t * 2) * 5);
  ctx.stroke();
  // little wave crests
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const span = W + 200;
    const x = ((hash(i, 4) * span - camX * 1.0 - t * 15) % span + span) % span - 100;
    const y = WATER + 30 + hash(i, 5) * (H - WATER - 40);
    ctx.beginPath(); ctx.arc(x, y, 10, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
}

function drawArk() {
  // the ark, floating, its right wall at world x = 0 with the window
  const x = -camX, w = arkWin();
  if (x < -offX - 10 || x > W + offX + 600) return;
  const bob = Math.sin(t * 1.2) * 4;
  ctx.save();
  ctx.translate(x, bob);
  ctx.fillStyle = '#a8693a'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(30, 610); ctx.quadraticCurveTo(20, WATER + 30, -30, WATER + 50); ctx.lineTo(-1400, WATER + 50); ctx.lineTo(-1400, 610); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,40,10,0.45)'; ctx.lineWidth = 2.5;
  for (const y of [650, 690, 730]) { ctx.beginPath(); ctx.moveTo(-1400, y); ctx.lineTo(24 - (y - 610) * 0.3, y); ctx.stroke(); }
  // cabin walls with the window
  ctx.fillStyle = '#c08850'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 4;
  ctx.fillRect(-1300, 330, 1300, 280); ctx.strokeRect(-1300, 330, 1300, 280);
  ctx.strokeStyle = 'rgba(90,50,20,0.3)'; ctx.lineWidth = 2;
  for (let y = 365; y < 610; y += 35) { ctx.beginPath(); ctx.moveTo(-1300, y); ctx.lineTo(0, y); ctx.stroke(); }
  ctx.fillStyle = '#7a4a2a'; ctx.strokeStyle = '#4a2a12'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(40, 335); ctx.lineTo(-60, 230); ctx.lineTo(-1400, 230); ctx.lineTo(-1400, 335); ctx.closePath(); ctx.fill(); ctx.stroke();
  // the open window
  const wy = w.y - bob;
  ctx.fillStyle = '#3a2412';
  ctx.fillRect(-46, wy - w.h / 2, 46, w.h);
  ctx.fillStyle = '#d8a868'; ctx.fillRect(-52, wy - w.h / 2 - 10, 58, 10); ctx.fillRect(-52, wy + w.h / 2, 58, 10);
  // Noah looking out, his hand ready
  const near = state === 'win' || (dove.leaf && dove.x < 700);
  ctx.save();
  ctx.beginPath(); ctx.rect(-46, wy - w.h / 2, 46, w.h); ctx.clip();
  drawPerson(NOAH, -30, wy + 70, 1.2, state === 'win' ? 'joy' : near ? 'wow' : 'watch', 0.8, 0);
  ctx.restore();
  if (near) {
    ctx.fillStyle = NOAH.skin;
    ctx.beginPath(); ctx.ellipse(8 + Math.sin(t * 4) * 2, wy + 22, 10, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(NOAH.robe, -25); ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-20, wy + 30); ctx.lineTo(2, wy + 24); ctx.stroke();
  }
  // a glowing guide on the window when she's coming home
  if (dove.leaf && state === 'play') {
    const p = 0.5 + 0.5 * Math.sin(t * 5);
    ctx.strokeStyle = `rgba(255,236,150,${0.5 + p * 0.5})`; ctx.lineWidth = 4;
    ctx.strokeRect(-48, wy - w.h / 2 - 2, 50, w.h + 4);
  }
  ctx.restore();
}

function drawLand() {
  const lx = landX() - camX;
  if (lx > W + offX + 200 || lx + LAND_W + 300 < -offX) return;
  ctx.fillStyle = '#8fbf62';
  ctx.beginPath(); ctx.moveTo(lx - 140, WATER + 10);
  for (let x = landX() - 140; x <= landX() + LAND_W + 220; x += 12) ctx.lineTo(x - camX, groundAt(x));
  ctx.lineTo(lx + LAND_W + 220, WATER + 10); ctx.fill();
  ctx.fillStyle = '#c9b48a';
  ctx.beginPath(); ctx.moveTo(lx - 140, WATER + 4);
  for (let x = landX() - 140; x <= landX() + LAND_W + 220; x += 12) ctx.lineTo(x - camX, Math.min(WATER + 4, groundAt(x) + 14));
  ctx.lineTo(lx + LAND_W + 220, WATER + 4); ctx.fill();
  // the olive tree
  const tx = leaf.x - camX, ty = groundAt(leaf.x);
  ctx.fillStyle = '#7a5a3a';
  ctx.beginPath(); ctx.moveTo(tx - 10, ty); ctx.quadraticCurveTo(tx - 4, ty - 60, tx - 14, ty - 110); ctx.lineTo(tx + 4, ty - 110); ctx.quadraticCurveTo(tx + 8, ty - 60, tx + 12, ty); ctx.fill();
  ctx.fillStyle = '#8aa858';
  for (const [dx, dy, r] of [[-40, -120, 40], [0, -140, 46], [40, -118, 38], [-10, -100, 36]]) { ctx.beginPath(); ctx.arc(tx + dx, ty + dy, r, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#a3c070';
  for (const [dx, dy, r] of [[-30, -132, 18], [12, -152, 20], [40, -128, 14]]) { ctx.beginPath(); ctx.arc(tx + dx, ty + dy, r, 0, TAU); ctx.fill(); }
  // flowers on the new dry ground
  for (let k = 0; k < 10; k++) {
    const fx = landX() + hash(k, 3) * LAND_W;
    ctx.fillStyle = ['#fff', '#ffd166', '#f28fb1'][k % 3];
    ctx.beginPath(); ctx.arc(fx - camX, groundAt(fx) + 8, 4, 0, TAU); ctx.fill();
  }
  if (!leaf.got) drawOliveLeaf(leaf.x - camX, leaf.y + Math.sin(t * 2) * 6, 1.6, true);
}

function drawOliveLeaf(x, y, s, glow) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  if (glow) {
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
    g.addColorStop(0, 'rgba(255,250,200,0.9)'); g.addColorStop(1, 'rgba(255,250,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
  }
  ctx.rotate(-0.5 + Math.sin(t * 3) * 0.1);
  ctx.fillStyle = '#6f9a3a'; ctx.strokeStyle = '#3e6a1c'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.quadraticCurveTo(0, -7, 12, 0); ctx.quadraticCurveTo(0, 7, -12, 0); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-17, 1); ctx.stroke();
  ctx.restore();
}

function drawTree(o) {
  const x = o.x - camX;
  if (x < -offX - 100 || x > W + offX + 100) return;
  const sway = Math.sin(t * 1.3 + o.sway) * 3;
  ctx.fillStyle = '#6b4a2c';
  ctx.fillRect(x - 9, o.y, 18, WATER - o.y + 10);
  ctx.fillStyle = '#4f8a3a';
  for (const [dx, dy, r] of [[-26, 8, 32], [26, 8, 32], [0, -14, 40], [0, 10, 36]]) { ctx.beginPath(); ctx.arc(x + dx + sway, o.y + dy, r, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#67a64a';
  for (const [dx, dy, r] of [[-14, -20, 16], [16, -6, 14], [-24, 4, 12]]) { ctx.beginPath(); ctx.arc(x + dx + sway, o.y + dy, r, 0, TAU); ctx.fill(); }
  // ripples where it pokes out of the flood
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, WATER + 4, 22 + Math.sin(t * 3 + o.sway) * 4, 5, 0, 0, TAU); ctx.stroke();
}

function drawStormCloud(o) {
  const x = o.x - camX;
  if (x < -offX - 140 || x > W + offX + 140) return;
  const y = o.y + Math.sin(t * 1.4 + o.phase) * 3;
  drawCloud(x, y + 14, o.rx * 2.1, o.ry * 1.4, '#7d8698', '#5d6578');
  // a grumpy-sleepy little face
  ctx.fillStyle = '#3c4252'; ctx.strokeStyle = '#3c4252'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 22, y + 4); ctx.lineTo(x - 10, y + 6); ctx.moveTo(x + 10, y + 6); ctx.lineTo(x + 22, y + 4); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y + 22, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // a few drops underneath
  ctx.fillStyle = 'rgba(160,200,240,0.8)';
  for (let k = 0; k < 3; k++) { const f = ((t * 0.9 + k / 3 + o.phase) % 1); ctx.beginPath(); ctx.arc(x - 30 + k * 30, y + 40 + f * 60, 3, 0, TAU); ctx.fill(); }
}

function drawGust(g) {
  const x = g.x - camX;
  if (x < -offX - 120 || x > W + offX + 120) return;
  ctx.save();
  ctx.fillStyle = g.dir > 0 ? 'rgba(255,255,255,0.12)' : 'rgba(200,220,255,0.14)';
  ctx.fillRect(x - g.w / 2, ceilY(), g.w, WATER - ceilY());
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const span = WATER - ceilY();
    const f = ((t * 0.6 * g.dir * -1 + i / 6) % 1 + 1) % 1;
    const y = ceilY() + f * span;
    const sx = x + Math.sin(i * 2.1) * g.w * 0.3;
    ctx.beginPath(); ctx.arc(sx, y, 12, 0, Math.PI * 1.4); ctx.stroke();
    // arrow
    ctx.beginPath(); ctx.moveTo(sx + 26, y - 14 * g.dir); ctx.lineTo(sx + 26, y + 14 * g.dir); ctx.moveTo(sx + 20, y - 6 * g.dir); ctx.lineTo(sx + 26, y - 14 * g.dir); ctx.lineTo(sx + 32, y - 6 * g.dir); ctx.stroke();
  }
  ctx.restore();
}

function drawRaven(r) {
  const x = r.x - camX;
  if (x < -offX - 60 || x > W + offX + 60) return;
  const face = r.vx < 0 ? -1 : 1;
  const wing = Math.sin(t * 14 + r.phase) * 0.8;
  ctx.save(); ctx.translate(x, r.y); ctx.scale(face, 1);
  if (r.shooed) ctx.rotate(-0.4);
  ctx.fillStyle = '#2a2a3a';
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-18, -2); ctx.lineTo(-32, -8); ctx.lineTo(-30, 6); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.rotate(-wing); ctx.beginPath(); ctx.ellipse(-2, -10, 8, 20, 0.3, 0, TAU); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(16, -8, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f2b632'; ctx.beginPath(); ctx.moveTo(24, -10); ctx.lineTo(34, -6); ctx.lineTo(24, -3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(18, -10, 3.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(19, -10, 1.8, 0, TAU); ctx.fill();
  // cheeky eyebrow
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(14, -16); ctx.lineTo(22, -14); ctx.stroke();
  if (r.shooed) { ctx.fillStyle = '#ffe27a'; for (let k = 0; k < 3; k++) { const a = t * 6 + k * 2.1; ctx.beginPath(); ctx.arc(16 + Math.cos(a) * 14, -22 + Math.sin(a) * 4, 3, 0, TAU); ctx.fill(); } }
  ctx.restore();
}

function drawDove(x, y, dir, flapT, leafed) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(dir, 1);
  const tilt = clamp(dove.vy / 900, -0.35, 0.4);
  if (state === 'play') ctx.rotate(tilt);
  if (dove.hurtT > 0 && Math.sin(dove.hurtT * 30) > 0) ctx.globalAlpha = 0.45;
  const wing = flapT > 0 ? Math.sin((0.28 - flapT) / 0.28 * Math.PI * 2) : 0.15;
  // tail
  ctx.fillStyle = '#e6eaf0';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-32, -6); ctx.lineTo(-32, 8); ctx.closePath(); ctx.fill();
  // far wing
  ctx.fillStyle = '#d8dee8';
  ctx.save(); ctx.translate(-2, -4); ctx.rotate(-0.4 - wing * 0.9);
  ctx.beginPath(); ctx.ellipse(-4, -14, 7, 18, 0.4, 0, TAU); ctx.fill(); ctx.restore();
  // body
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b8c2d0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(15, -9, 10, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2a0a8'; ctx.beginPath(); ctx.moveTo(23, -10); ctx.lineTo(31, -7); ctx.lineTo(23, -5); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.ellipse(17, -11, 2.6, 3.2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(18, -12.2, 1, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,140,150,0.4)'; ctx.beginPath(); ctx.arc(13, -5, 2.6, 0, TAU); ctx.fill();
  if (leafed) { ctx.save(); ctx.translate(31, -6); ctx.scale(0.9, 0.9); ctx.rotate(0.6); drawOliveLeaf(8, 0, 1, false); ctx.restore(); }
  // near wing
  ctx.fillStyle = '#f4f6fa'; ctx.strokeStyle = '#b8c2d0';
  ctx.save(); ctx.translate(0, -2); ctx.rotate(-0.3 - wing * 1.1);
  ctx.beginPath(); ctx.ellipse(-4, -14, 8, 20, 0.35, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.restore();
}

function drawRain() {
  ctx.strokeStyle = 'rgba(220,235,255,0.75)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const r of rain) { const x = r.x - camX; ctx.moveTo(x, r.y); ctx.lineTo(x + 4, r.y - 16); }
  ctx.stroke();
}

function drawSparkles() {
  for (const s of sparkles) {
    if (s.got) continue;
    const x = s.x - camX;
    if (x < -offX - 30 || x > W + offX + 30) continue;
    const p = 0.6 + 0.4 * Math.sin(t * 5 + s.x);
    ctx.fillStyle = `rgba(255,236,150,${p})`;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + t, rr = k % 2 ? 4 : 11; ctx.lineTo(x + Math.cos(a) * rr, s.y + Math.sin(a) * rr); }
    ctx.fill();
  }
}

function drawFeathersHUD() {
  const x0 = viewW - 22;
  for (let i = 0; i < cfg.feathers; i++) {
    const x = x0 - i * 22, y = 66;
    ctx.save(); ctx.translate(x, y); ctx.rotate(0.5);
    ctx.globalAlpha = i < feathers ? 1 : 0.25;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#8a97aa'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 14); ctx.stroke();
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 3; sy = rand(-3, 3) * shakeT * 3; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawSky();
  for (const g of gusts) drawGust(g);
  drawLand();
  for (const o of obstacles) if (o.kind === 'tree') drawTree(o);
  drawWater();
  drawArk();
  drawSparkles();
  for (const o of obstacles) if (o.kind === 'cloud') drawStormCloud(o);
  for (const r of ravens) drawRaven(r);
  if (!(state === 'win' && dove.home > 0.95)) drawDove(dove.x - camX, dove.y, dove.dir, dove.flapT, dove.leaf);
  for (const s of splashes) { ctx.strokeStyle = `rgba(255,255,255,${1 - s.t})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(s.x - camX, WATER + 2, 10 + s.t * 50, 3 + s.t * 8, 0, 0, TAU); ctx.stroke(); }
  drawRain();
  ctx.save(); ctx.translate(-camX, 0); drawParticles(); ctx.restore();
  if (state === 'play' && dove.ready && level === 1) drawHand(dove.x - camX + 30, dove.y + 40, -Math.PI / 2);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHudTitle(state === 'title' ? 'The Dove and the Olive Leaf' : `Level ${level} · ${cfg.name}`);
  if (state !== 'title') {
    const prog = clamp(dove.x / (landX() + LAND_W * 0.55), 0, 1);
    drawMeter(dove.leaf ? 'Home to the ark' : 'Find the olive leaf', dove.leaf ? 1 - prog : prog, dove.leaf ? '#ffd166' : '#9ccc65', false);
    drawFeathersHUD();
  }
  drawHudButtons();
  drawMessage(Math.max(offY + 60, 160));
}

// ============================================================
//  Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
