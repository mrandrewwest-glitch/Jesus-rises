<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8caa0">
<title>Mary and Martha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e8caa0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Mary and Martha</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Scripture shown in this game (Luke 10:38-42).
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  sat:      { ref: 'Luke 10:39', KJV: 'And she had a sister called Mary, which also sat at Jesus\' feet, and heard his word.', NKJV: 'And she had a sister called Mary, who also sat at Jesus’ feet and heard His word.', NIV: 'She had a sister called Mary, who sat at the Lord’s feet listening to what he said.', NLT: 'Her sister, Mary, sat at the Lord’s feet, listening to what he taught.' },
  cumbered: { ref: 'Luke 10:40', KJV: 'But Martha was cumbered about much serving.', NKJV: 'But Martha was distracted with much serving.', NIV: 'But Martha was distracted by all the preparations that had to be made.', NLT: 'But Martha was distracted by the big dinner she was preparing.' },
  complain: { ref: 'Luke 10:40', KJV: 'Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me.', NKJV: 'Lord, do You not care that my sister has left me to serve alone? Therefore tell her to help me.', NIV: 'Lord, don’t you care that my sister has left me to do the work by myself? Tell her to help me!', NLT: 'Lord, doesn’t it seem unfair to you that my sister just sits here while I do all the work? Tell her to come and help me.' },
  answer:   { ref: 'Luke 10:41–42', KJV: 'Martha, Martha, thou art careful and troubled about many things: But one thing is needful: and Mary hath chosen that good part', NKJV: 'Martha, Martha, you are worried and troubled about many things. But one thing is needed, and Mary has chosen that good part', NIV: 'Martha, Martha... you are worried and upset about many things, but few things are needed—or indeed only one. Mary has chosen what is better', NLT: 'My dear Martha, you are worried and upset over all these details! There is only one thing worth being concerned about. Mary has discovered it' },
  goodPart: { ref: 'Luke 10:42', KJV: 'But one thing is needful: and Mary hath chosen that good part, which shall not be taken away from her.', NKJV: 'But one thing is needed, and Mary has chosen that good part, which will not be taken away from her.', NIV: 'But few things are needed—or indeed only one. Mary has chosen what is better, and it will not be taken away from her.', NLT: 'There is only one thing worth being concerned about. Mary has discovered it, and it will not be taken away from her.' },
};
// Shared sound engine theme: "Jesus Loves Me" on harp with pipe, a crackling cooking fire
Music.theme = { tune: 'jesusLovesMe', instrument: 'harp', accent: 'pipe', ambience: 'fire', percussion: false };

function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes wall and ceiling above the room
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Layout & tuning
// ============================================================
const FLOOR_UP = 440;     // floor of the sitting room where Jesus teaches
const COUNTER_Y = 820;    // top of Martha's kitchen bench
const MARTHA_Y = 898;     // Martha's feet (she works in front of the bench)
const BUBBLE_Y = 655;     // task bubbles float here
const SIT_Y = 508;        // the "Sit and listen" button
const MARTHA_S = 1.3;

const TASKS = [
  { name: 'Knead', key: '1' },
  { name: 'Stir',  key: '2' },
  { name: 'Water', key: '3' },
  { name: 'Plates', key: '4' },
];

const LEVEL_NAMES = [
  'A Simple Supper',
  'Guests at the Door',
  'The Disciples Are Hungry',
  'A Feast in Bethany',
  'Busy, Busy Martha',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Supper ${n}`,
    rush: Math.min(22 + n * 2, 34),                 // cooking before Martha speaks up
    final: 16,                                      // last round, with the chance to sit
    int0: Math.max(1.1, 3.0 - 0.4 * (n - 1)),       // gap between new tasks at the start...
    int1: Math.max(0.6, 2.0 - 0.3 * (n - 1)),       // ...and at the most frantic
    life: Math.max(3.0, 7.5 - 0.9 * (n - 1)),       // seconds before a task slips
    taps: n === 1 ? [1, 1, 1, 1] : n === 2 ? [2, 1, 1, 1] : n === 3 ? [2, 2, 1, 1] : [3, 2, 1, 2],
    miss: Math.min(30, 16 + 3 * (n - 1)),           // calm lost when a task slips
    winLen: Math.max(1.1, 2.6 - 0.3 * (n - 1)),     // how long Jesus' welcome lasts
    winGap: 3.2 + Math.min(2, 0.4 * (n - 1)),
  };
}

function stationX(i) {
  const sp = Math.min(W / 4, 250);
  return W / 2 + (i - 1.5) * sp;
}
function stationHalf() { return Math.min(W / 8, 80); }
function kitchenScale() { return W > 700 ? 1.25 : 1; }

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'title';      // intro | rush | complain | final | rest
let phaseT = 0;
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('marthaBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let calm = 100;
let levelScore = 0, tasksDone = 0, missed = 0, combo = 0;
let spawnT = 1;
let stations = [];
let sat = false, sitBonus = 0, sitCd = 0;
let winNext = 2.5, winOpen = 0;
let dialogStep = 0;
let bubble = null;        // { who, key, t, dur }
let pops = [];
let particles = [];
let ripples = [];
let message = { text: '', t: 0 };
let shockT = 0, shakeT = 0, flashT = 0;
let endTimer = 0;
let lastScore = null;
let martha;

function newStations() {
  return TASKS.map((k, i) => ({ i, task: null, anim: 0, oops: 0, done: 0 }));
}

function newMartha() {
  return { x: W / 2 + 40, y: MARTHA_Y, s: MARTHA_S, tx: W / 2 + 40, workT: 0, workKind: 0, seated: false,
    tween: null, walk: 0 };
}

// ============================================================
//  People
// ============================================================
const MARTHA = { name: 'Martha', robe: '#c8643b', hair: '#4a2c17', skin: '#d9a070', scarf: '#f0e0b8', apron: '#f7f0df', i: 0 };
const MARY = { name: 'Mary', robe: '#4a78b5', hair: '#3a2414', skin: '#dcaa7a', scarf: '#efe3c4', i: 1 };
const LISTENERS = [
  { name: 'Peter',  robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066', i: 2, pos: -178, dir: 1 },
  { name: 'John',   robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', i: 3, pos: 190, dir: -1 },
  { name: 'Andrew', robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56', i: 5, pos: -330, dir: 1, wide: true },
  { name: 'James',  robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070', i: 6, pos: 340, dir: -1, wide: true },
];
for (const d of [MARTHA, MARY, ...LISTENERS]) {
  Object.assign(d, { mood: 'watch', blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU), switchT: 0, delay: rand(0.05, 0.4) });
}

function listenerSlots() {
  return LISTENERS.filter((d) => !d.wide || W > 820).map((d) => ({ d, x: W / 2 + d.pos, y: FLOOR_UP, s: 1.4 }));
}

function marySlot() { return { x: W / 2 + 84, y: FLOOR_UP }; }
function marthaSeat() { return { x: W / 2 - 84, y: FLOOR_UP }; }
function jesusPos() { return { x: W / 2, y: FLOOR_UP, s: 1.7 }; }

function jesusPose() {
  if (state === 'win') return 'open';
  if (phase === 'complain') return dialogStep === 1 ? 'answer' : 'rest';
  if (phase === 'final' && winOpen > 0) return 'open';
  if (phase === 'rest') return 'teach';
  return Math.sin(t * 0.7) > -0.3 ? 'teach' : 'rest';
}

function setMood(d, want, dt) {
  if (want !== d.mood) {
    d.switchT += dt;
    if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
  } else d.switchT = 0;
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

function updatePeople(dt) {
  // The listeners
  let lm = 'watch';
  if (state === 'win') lm = 'joy';
  else if (state === 'fail') lm = 'dismay';
  else if (phase === 'complain') lm = dialogStep === 0 ? 'worried' : 'wow';
  else if (phase === 'rest') lm = 'joy';
  else if (shockT > 0) lm = 'shock';
  for (const d of LISTENERS) setMood(d, lm, dt);

  // Mary listens peacefully the whole time
  let mm = 'watch';
  if (state === 'win' || phase === 'rest') mm = 'joy';
  else if (state === 'fail' || (phase === 'complain' && dialogStep === 0)) mm = 'worried';
  setMood(MARY, mm, dt);

  // Martha
  let km = 'watch';
  if (state === 'win' || phase === 'rest') km = 'joy';
  else if (state === 'fail') km = 'dismay';
  else if (phase === 'complain') km = dialogStep === 0 ? 'worried' : 'wow';
  else if (shockT > 0.6) km = 'shock';
  else if (calm < 55 && phase !== 'title') km = 'worried';
  setMood(MARTHA, km, dt);
  MARTHA.delay = 0.05;

  // Martha dashes between stations
  const m = martha;
  if (m.tween) {
    m.tween.t += dt;
    const f = clamp(m.tween.t / m.tween.dur, 0, 1);
    const e = f * f * (3 - 2 * f);
    m.x = lerp(m.tween.x0, m.tween.x1, e);
    m.y = lerp(m.tween.y0, m.tween.y1, e);
    m.s = lerp(m.tween.s0, m.tween.s1, e);
    m.walk = f < 1 ? 1 : 0;
    if (f >= 1) { m.tween = null; m.seated = true; }
  } else if (!m.seated) {
    const d = m.tx - m.x;
    const step = 1500 * dt;
    m.walk = Math.abs(d) > 4 ? 1 : 0;
    m.x = Math.abs(d) <= step ? m.tx : m.x + Math.sign(d) * step;
  }
  m.workT = Math.max(0, m.workT - dt);
}

// Face with moods: watch, wow, worried, shock, joy, dismay (as in Jesus Rises)
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function drawHead(d, hy, lx, ly) {
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    // a wisp of hair under the head cloth
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.moveTo(-12, hy - 6); ctx.quadraticCurveTo(0, hy - 13, 12, hy - 6); ctx.quadraticCurveTo(0, hy - 9, -12, hy - 6); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, d.mood, hy, lx, ly);
}

function makeArm(d) {
  const sleeve = shade(d.robe, -25);
  return (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
}

// A person sitting on the floor, lap toward `dir` (1 = right), looking at (lookX, lookY)
function drawSeated(d, x, y, s, dir, lookX, lookY) {
  const mood = d.mood;
  let bob = 0;
  if (mood === 'joy') bob = Math.abs(Math.sin(t * 5 + d.phase)) * 3;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(60,30,0,0.16)';
  ctx.beginPath(); ctx.ellipse(dir * 8 * s, 0, 30 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s, s);
  ctx.translate(0, 13 - bob);
  const arm = makeArm(d);
  const dx = lookX - x, dy = lookY - (y - 45 * s), len = Math.hypot(dx, dy) || 1;
  const lx = dx / len, ly = dy / len;
  const hy = -53;

  // Lap and tucked feet
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(dir * 10, -21, 25, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8a5a36';
  ctx.beginPath(); ctx.ellipse(dir * 34, -15, 5.5, 3.5, 0, 0, TAU); ctx.fill();
  // Torso
  ctx.fillStyle = d.robe;
  ctx.beginPath();
  ctx.moveTo(-15, -18);
  ctx.quadraticCurveTo(-15, -32, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(15, -32, 15, -18);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-14, -24); ctx.quadraticCurveTo(0, -22, 14, -24); ctx.stroke();

  if (mood === 'joy') { arm(-11, -32, -3, -40); arm(11, -32, 3, -40); }          // hands clasped with joy
  else if (mood === 'worried') { arm(-11, -32, -2, -30); arm(11, -32, 2, -30); }
  else if (mood !== 'shock') { arm(-11, -32, dir * 8 - 5, -22); arm(11, -32, dir * 8 + 5, -22); }

  drawHead(d, hy, lx, ly);
  if (mood === 'shock') { arm(-11, -32, -15, hy + 4); arm(11, -32, 15, hy + 4); }
  else if (mood === 'wow' && d.i % 2 === 0) arm(11, -32, 7, hy + 12);            // hand to chin
  ctx.restore();
}

// Martha on her feet: pose 'stand' | 'work' | 'walk'
function drawMartha(m) {
  const d = MARTHA;
  const mood = d.mood;
  let pose = m.walk ? 'walk' : m.workT > 0 ? 'work' : 'stand';
  let jump = 0;
  if (pose === 'stand' && mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 8;
  if (pose === 'walk') jump = Math.abs(Math.sin(t * 16)) * 5;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  const s = m.s;
  ctx.save();
  ctx.translate(m.x, m.y - jump * s);
  ctx.scale(s, s);
  const arm = makeArm(d);
  let lx = 0, ly = 1;
  if (phase === 'complain' || phase === 'rest' || state === 'win') { lx = (W / 2 - m.x) / 200; ly = -1; }
  const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
  const hy = -53;

  if (pose === 'stand' && mood === 'joy') {
    const wave = Math.sin(t * 9) * 4;
    arm(-11, -32, -24 + wave, -66); arm(11, -32, 24 - wave, -66);
  }
  // Robe and apron
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = d.apron; ctx.strokeStyle = '#d8ccb0';
  roundRect(-11, -31, 22, 30, [6, 6, 3, 3]); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -22); ctx.quadraticCurveTo(0, -19, 16, -22); ctx.stroke();

  if (pose === 'work') {
    const k = Math.sin(t * 28);
    // reaching up to the bench
    if (m.workKind === 1) { arm(-11, -32, -20 + Math.cos(t * 20) * 6, -60 + Math.sin(t * 20) * 3); arm(11, -32, 20, -56); }
    else { arm(-11, -32, -20, -58 + k * 4); arm(11, -32, 20, -58 - k * 4); }
  } else if (pose === 'walk') {
    const k = Math.sin(t * 16) * 7;
    arm(-11, -32, -19 + k, -16); arm(11, -32, 19 + k, -16);
  } else if (mood === 'worried' || mood === 'dismay') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);
  } else if (mood !== 'joy' && mood !== 'shock') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }
  drawHead(d, hy, lx, ly);
  if (mood === 'shock') { arm(-11, -32, -15, hy + 4); arm(11, -32, 15, hy + 4); }
  ctx.restore();
}

// ============================================================
//  Jesus (drawn as in Jesus Rises, seated on a low stool to teach)
// ============================================================
function drawJesus(x, y, s, pose, face) {
  ctx.save();
  ctx.translate(x, y);
  // stool
  ctx.fillStyle = '#9a6a3c';
  roundRect(-30 * s, -22 * s, 60 * s, 9 * s, 4 * s); ctx.fill();
  ctx.fillRect(-26 * s, -14 * s, 6 * s, 14 * s); ctx.fillRect(20 * s, -14 * s, 6 * s, 14 * s);
  ctx.fillStyle = 'rgba(60,30,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 36 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s, s);

  if (pose === 'open' || pose === 'teach' && phase === 'rest') {
    const g = ctx.createRadialGradient(0, -40, 5, 0, -40, 80);
    g.addColorStop(0, 'rgba(255,235,150,0.6)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -40, 80, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash, falling wide over His knees
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.quadraticCurveTo(14, -24, 20, -14);
  ctx.lineTo(19, -1);
  ctx.quadraticCurveTo(0, 2, -19, -1);
  ctx.lineTo(-20, -14);
  ctx.quadraticCurveTo(-14, -24, -9, -41);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -14); ctx.stroke();
  ctx.restore();
  // knees
  ctx.strokeStyle = '#e4ddc8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-17, -13); ctx.quadraticCurveTo(-8, -16, 0, -13); ctx.quadraticCurveTo(8, -16, 17, -13); ctx.stroke();
  // sandals
  ctx.fillStyle = '#8a5a36';
  ctx.beginPath(); ctx.ellipse(-8, 0, 6, 3, 0, 0, TAU); ctx.ellipse(8, 0, 6, 3, 0, 0, TAU); ctx.fill();

  // Arms
  const wave = Math.sin(t * 2) * 2;
  let hands = [[-13, -16], [13, -16]];
  if (pose === 'teach') hands = [[-13, -16], [22, -50 + wave]];
  if (pose === 'open') hands = [[-27, -30], [27, -30]];
  if (pose === 'answer') hands = [[-13, -16], [26, -24 + wave]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Particles & pops
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, shape = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, shape });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawHeart(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.4, x, y - r * 0.4);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.shape === 'heart') drawHeart(p.x, p.y, p.size);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function addPop(text, x, y, color = '#5a3a1a', dur = 1.3) {
  pops.push({ text, x, y, t: 0, dur, color });
}
function updatePops(dt) {
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > pops[i].dur) pops.splice(i, 1); }
}
function drawPops() {
  for (const p of pops) {
    const a = clamp(p.t / 0.12, 0, 1) * clamp((p.dur - p.t) / 0.25, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '700 16px Fredoka, sans-serif';
    const w = ctx.measureText(p.text).width + 18;
    const y = p.y - p.t * 16;
    const bx = clamp(p.x - w / 2, 6 - offX, W + offX - w - 6);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c99a55'; ctx.lineWidth = 2;
    roundRect(bx, y - 26, w, 25, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.text, bx + w / 2, y - 13);
    ctx.restore();
  }
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Kitchen tasks
// ============================================================
const MISS_LINES = [
  ['The dough is puffing up!', 'Something smells toasty...'],
  ['The pot is bubbling over!', 'Oops, the stew!'],
  ['The water jar is empty!', 'Anyone thirsty?'],
  ['Clatter! The plates!', 'Where do we sit?'],
];

function updateTasks(dt) {
  const frantic = phase === 'final';
  if (!sat) {
    const prog = phase === 'rush' ? clamp(phaseT / cfg.rush, 0, 1) : 1;
    let gap = lerp(cfg.int0, cfg.int1, prog) * (frantic ? 0.9 : 1);
    spawnT -= dt;
    const active = stations.filter((s) => s.task).length;
    if (active === 0 && spawnT > 0.6) spawnT = 0.6;
    if (spawnT <= 0) {
      const free = stations.filter((s) => !s.task && s.oops <= 0.6);
      if (free.length) {
        const st = free[Math.floor(Math.random() * free.length)];
        const life = cfg.life * rand(0.9, 1.1);
        st.task = { need: cfg.taps[st.i], taps: 0, life, max: life, t: 0 };
        sfx.tone(880, 0.08, 'sine', 0.08);
      }
      spawnT = gap * rand(0.8, 1.2);
    }
  }
  for (const st of stations) {
    st.anim = Math.max(0, st.anim - dt);
    st.oops = Math.max(0, st.oops - dt);
    st.done = Math.max(0, st.done - dt);
    if (!st.task) continue;
    st.task.t += dt;
    st.task.life -= dt;
    if (st.task.life <= 0) missTask(st);
    if (state !== 'play') return;
  }
}

function missTask(st) {
  st.task = null;
  st.oops = 1.4;
  missed++;
  combo = 0;
  calm = Math.max(0, calm - cfg.miss);
  shockT = 1.1; shakeT = 0.2;
  const x = stationX(st.i);
  const lines = MISS_LINES[st.i];
  addPop(lines[missed % 2], x, BUBBLE_Y - 40, '#b0452a');
  for (let i = 0; i < 14; i++) {
    const col = st.i === 1 || st.i === 0 ? '#f4efe6' : st.i === 2 ? '#7cc4f2' : '#e8d2b0';
    spawn(x + rand(-30, 30), COUNTER_Y - 30, rand(-50, 50), rand(-120, -40), rand(0.6, 1.1), col, rand(4, 8), 90);
  }
  sfx.bounce();
  if (calm <= 0) fail();
}

// One tap on a station: Martha dashes over and does one step of the task
function workStation(i) {
  if (state !== 'play' || sat) return;
  if (phase !== 'rush' && phase !== 'final' && phase !== 'intro') return;
  const st = stations[i];
  martha.tx = clamp(stationX(i) + 30, 30, W - 30);
  if (!st.task) return;
  st.task.taps++;
  st.anim = 0.3;
  martha.workT = 0.35; martha.workKind = i;
  const x = stationX(i);
  [() => { sfx.puff(0.25); sfx.tone(150, 0.12, 'sine', 0.25); },
   () => sfx.tone(420, 0.12, 'triangle', 0.14, 0, 560),
   () => sfx.tone(700, 0.16, 'sine', 0.18, 0, 320),
   () => { sfx.tone(1400, 0.08, 'triangle', 0.1); sfx.tone(1800, 0.08, 'triangle', 0.08, 0.06); }][i]();
  for (let k = 0; k < 4; k++) spawn(x + rand(-20, 20), COUNTER_Y - 20, rand(-40, 40), rand(-80, -30), 0.4, '#fff6d0', rand(2, 4));
  if (st.task.taps >= st.task.need) {
    const pts = 40 + Math.round(20 * st.task.life / st.task.max) + st.task.need * 10 + Math.min(combo, 10) * 3;
    levelScore += pts;
    tasksDone++;
    combo++;
    calm = Math.min(100, calm + 4);
    st.task = null;
    st.done = 0.6;
    addPop(`+${pts}`, x, BUBBLE_Y - 30, '#2b8a3e', 0.9);
    for (let k = 0; k < 10; k++) {
      const a = rand(0, TAU), sp = rand(40, 120);
      spawn(x, BUBBLE_Y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.4, 0.8), k % 2 ? '#ffe27a' : '#ffffff', rand(2, 4));
    }
    sfx.tap(clamp(combo / 8, 0, 1));
  }
}

// ============================================================
//  Story beats
// ============================================================
function bubbleDur(key) {
  const len = Bible.verse(VERSES[key]).text.length;
  return clamp(2.5 + len * 0.05, 4, 11);
}

function startComplain() {
  phase = 'complain'; phaseT = 0;
  dialogStep = 0;
  martha.tx = clamp(W / 2 + 96, 40, W - 40);
  bubble = { who: 'martha', key: 'complain', t: 0, dur: bubbleDur('complain') };
  sfx.tone(330, 0.3, 'sine', 0.12, 0, 260);
}

function advanceDialog() {
  if (!bubble || bubble.t < 0.8) return;
  if (dialogStep === 0) {
    dialogStep = 1;
    bubble = { who: 'jesus', key: 'answer', t: 0, dur: bubbleDur('answer') };
    sfx.tap(0.4);
  } else startFinal();
}

function startFinal() {
  bubble = null;
  phase = 'final'; phaseT = 0;
  winNext = 2.2; winOpen = 0; sitCd = 0;
  spawnT = 0.8;
  showMessage('One more round...');
  setTimeout(() => { if (state === 'play' && phase === 'final' && !sat) showMessage('Sit and listen when Jesus welcomes you', 2.6); }, 1600);
}

function sitButtonRect() {
  const w = Math.min(250, W - 40), h = 52;
  return { x: W / 2 - w / 2, y: SIT_Y - h / 2, w, h };
}

function trySit() {
  if (state !== 'play' || phase !== 'final' || sat || sitCd > 0) return;
  if (winOpen > 0) {
    sat = true;
    const left = Math.max(0, cfg.final - phaseT);
    sitBonus = level * 600 + Math.round(left * 40) + Math.round(winOpen / cfg.winLen * 200);
    phase = 'rest'; phaseT = 0;
    const seat = marthaSeat();
    martha.tween = { t: 0, dur: 1.5, x0: martha.x, y0: martha.y, s0: martha.s, x1: seat.x, y1: seat.y, s1: 1.45 };
    // The busy tasks drift away as little hearts
    for (const st of stations) {
      if (st.task) {
        for (let k = 0; k < 5; k++) spawn(stationX(st.i) + rand(-20, 20), BUBBLE_Y + rand(-15, 15), rand(-20, 20), rand(-70, -30), rand(1, 1.6), '#ff9fb8', rand(5, 8), 0, 'heart');
        st.task = null;
      }
    }
    addPop(`Sit and listen! +${sitBonus}`, W / 2, SIT_Y - 20, '#a8741a', 2);
    showMessage('Martha sits and listens', 2.6);
    sfx.levelStart();
  } else {
    sitCd = 1.1;
    addPop('Just one more thing...', martha.x, MARTHA_Y - 105, '#8a6a2a');
    sfx.tone(300, 0.15, 'sine', 0.15, 0, 220);
  }
}

function updatePhase(dt) {
  phaseT += dt;
  if (phase === 'intro') {
    updateTasks(dt);
    if (phaseT > 2.2) { phase = 'rush'; phaseT = 0; }
  } else if (phase === 'rush') {
    updateTasks(dt);
    if (state === 'play' && phaseT >= cfg.rush) {
      // any unfinished tasks are set aside while Martha speaks
      for (const st of stations) st.task = null;
      startComplain();
    }
  } else if (phase === 'complain') {
    if (bubble) {
      bubble.t += dt;
      if (bubble.t >= bubble.dur) { bubble.t = bubble.dur; advanceDialog(); }
    }
  } else if (phase === 'final') {
    updateTasks(dt);
    if (state !== 'play') return;
    sitCd = Math.max(0, sitCd - dt);
    if (winOpen > 0) {
      winOpen -= dt;
      if (winOpen <= 0) { winOpen = 0; winNext = cfg.winGap; }
    } else {
      winNext -= dt;
      if (winNext <= 0) {
        winOpen = cfg.winLen;
        sfx.tone(988, 0.5, 'sine', 0.1); sfx.tone(1318, 0.6, 'sine', 0.07, 0.1);
      }
    }
    if (phaseT >= cfg.final) win();
  } else if (phase === 'rest') {
    const j = jesusPos();
    if (Math.random() < dt * 14) spawn(j.x + rand(-60, 60), FLOOR_UP - rand(20, 110), rand(-10, 10), -25, rand(1, 1.8), Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4));
    if (phaseT > 5) win();
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  if (state !== 'play') return;
  state = 'win';
  for (const st of stations) st.task = null;
  const calmBonus = Math.round(calm * 4);
  const levelBonus = level * 300;
  const score = levelScore + sitBonus + calmBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('marthaBest', best); } catch (e) {} }
  lastScore = { tasks: levelScore, done: tasksDone, sit: sitBonus, calmBonus, levelBonus, score, sat };
  const j = jesusPos();
  for (let i = 0; i < 60; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(j.x, j.y - 60, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  showMessage(sat ? 'That good part!' : 'Supper is served!');
  sfx.win();
  updateAmbience();
  endTimer = 1.8;
}

function fail() {
  if (state !== 'play') return;
  state = 'fail';
  bubble = null;
  shakeT = 0.4;
  showMessage('Oh, Martha!');
  sfx.fail();
  updateAmbience();
  endTimer = 1.4;
}

function startLevel() {
  cfg = makeConfig(level);
  stations = newStations();
  martha = newMartha();
  calm = 100;
  levelScore = 0; tasksDone = 0; missed = 0; combo = 0;
  sat = false; sitBonus = 0; sitCd = 0;
  winNext = 2.5; winOpen = 0;
  dialogStep = 0;
  bubble = null;
  pops = []; particles = []; ripples.length = 0;
  shockT = shakeT = flashT = 0;
  endTimer = 0;
  spawnT = 1.2;
  phase = 'intro'; phaseT = 0;
  state = 'play';
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  addPop('Welcome, Lord!', martha.x, MARTHA_Y - 105, '#8a4a20', 2);
  sfx.levelStart();
  updateAmbience();
  if (level === 1) setTimeout(() => { if (state === 'play' && tasksDone === 0) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap the bubbles to help Martha' : 'Click the bubbles, or press 1–4', 2.6); }, 2400);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay(s.sat ? 'That Good Part!' : 'Supper Is Served!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('goodPart')}
       ${s.sat ? '' : '<p style="text-align:center">A lovely meal! Next time, try sitting with Mary when Jesus welcomes you.</p>'}
       <p class="score">Jobs done (${s.done}): <b>${s.tasks}</b><br>Sat and listened: <b>${s.sit}</b><br>Calm heart: <b>${s.calmBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Supper', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Oh, Martha!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Too many jobs slipped at once. Take a breath and try again &mdash; one thing at a time.</p>
       ${verseHTML('cumbered')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
  updateAmbience();
}

//  Input

const KEY_STATION = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (e.code in KEY_STATION) { workStation(KEY_STATION[e.code]); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyS') {
    if (phase === 'complain') advanceDialog();
    else if (phase === 'final') trySit();
  }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// A tap in the playfield: the dialogue, the sit button, or a kitchen job
function tapAt(x, y) {
  if (state !== 'play') return;
  ripples.push({ x, y, t: 0 });
  if (phase === 'complain') { advanceDialog(); return; }
  if (phase === 'final' && !sat) {
    const r = sitButtonRect();
    if (x > r.x - 8 && x < r.x + r.w + 8 && y > r.y - 8 && y < r.y + r.h + 8) { trySit(); return; }
  }
  let bestI = -1, bestD = 1e9;
  const half = stationHalf();
  for (let i = 0; i < 4; i++) {
    const sx = stationX(i);
    const dB = Math.hypot(x - sx, y - BUBBLE_Y);
    const inStation = Math.abs(x - sx) < half && y > BUBBLE_Y - 60 && y < 880;
    if ((dB < 62 || inStation) && Math.abs(x - sx) < bestD) { bestD = Math.abs(x - sx); bestI = i; }
  }
  if (bestI >= 0) workStation(bestI);
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  tapAt(p.x, p.y);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

// The fire crackles only during active play: never behind a card, when muted, or after leaving
let pageHidden = false;
function updateAmbience() {
  if (!sfx.ctx) return;
  Music.ambience(state === 'play' && !sfx.muted && !pageHidden);
}
window.addEventListener('pagehide', () => { pageHidden = true; updateAmbience(); });
window.addEventListener('pageshow', () => { pageHidden = false; updateAmbience(); });
document.addEventListener('visibilitychange', () => { pageHidden = document.visibilityState === 'hidden'; updateAmbience(); });

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
      Music.init(this.ctx, this.master);   // shared harp-and-pipe engine, through the mute-aware master
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    updateAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

//  Rendering: the house in Bethany
// ============================================================
function drawRoom() {
  const x0 = -offX, x1 = W + offX;
  // Plaster wall
  const g = ctx.createLinearGradient(0, -offY, 0, FLOOR_UP);
  g.addColorStop(0, '#f6e6c4');
  g.addColorStop(1, '#ebcf9f');
  ctx.fillStyle = g;
  ctx.fillRect(x0, -offY, viewW, FLOOR_UP + offY + 20);

  // Ceiling beams
  ctx.fillStyle = '#8a5a34';
  ctx.fillRect(x0, -offY, viewW, 22);
  for (let x = x0 + 30; x < x1; x += 120) {
    ctx.fillStyle = '#9d6a3e';
    roundRect(x - 9, -offY + 14, 18, 18, 4); ctx.fill();
  }

  // Arched windows with the hills of Bethany and a warm evening sky
  for (const f of [0.14, 0.86]) {
    const wx = W * f, wy = 170, ww = 86, wh = 130;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(wx - ww / 2, wy + wh); ctx.lineTo(wx - ww / 2, wy + ww / 2);
    ctx.arc(wx, wy + ww / 2, ww / 2, Math.PI, TAU);
    ctx.lineTo(wx + ww / 2, wy + wh); ctx.closePath();
    const sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, '#9fd3f2'); sky.addColorStop(0.6, '#ffe2a8'); sky.addColorStop(1, '#ffc98a');
    ctx.fillStyle = sky; ctx.fill();
    ctx.clip();
    ctx.fillStyle = '#9cc47a';
    ctx.beginPath(); ctx.moveTo(wx - ww, wy + wh);
    for (let x = -ww; x <= ww; x += 8) ctx.lineTo(wx + x, wy + wh - 34 + Math.sin(x / 14 + f * 9) * 8);
    ctx.lineTo(wx + ww, wy + wh); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(wx - 12, wy + 40, 9, 0, TAU); ctx.arc(wx, wy + 36, 11, 0, TAU); ctx.arc(wx + 12, wy + 40, 8, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#b98a55'; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(wx - ww / 2, wy + wh); ctx.lineTo(wx - ww / 2, wy + ww / 2);
    ctx.arc(wx, wy + ww / 2, ww / 2, Math.PI, TAU);
    ctx.lineTo(wx + ww / 2, wy + wh); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#c99a62'; roundRect(wx - ww / 2 - 8, wy + wh - 2, ww + 16, 10, 4); ctx.fill();
  }

  // A shelf with jars and a lamp niche
  const sx = W / 2;
  ctx.fillStyle = '#a8743f';
  roundRect(sx - 120, 150, 240, 9, 3); ctx.fill();
  const jars = [['#c9764a', -95, 34], ['#e0b070', -60, 26], ['#b86a3c', 60, 30], ['#d99a5a', 95, 24]];
  for (const [c, dx, h] of jars) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(sx + dx, 150 - h / 2, h * 0.38, h / 2, 0, 0, TAU); ctx.fill();
    ctx.fillRect(sx + dx - 5, 150 - h - 4, 10, 7);
  }
  // oil lamp with a gentle flame
  ctx.fillStyle = '#c98a4a';
  ctx.beginPath(); ctx.ellipse(sx, 144, 18, 6, 0, 0, TAU); ctx.fill();
  const fl = 1 + Math.sin(t * 9) * 0.12;
  const lg = ctx.createRadialGradient(sx + 14, 132, 2, sx + 14, 132, 40);
  lg.addColorStop(0, 'rgba(255,220,120,0.55)'); lg.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(sx + 14, 132, 40, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffb627';
  ctx.beginPath(); ctx.ellipse(sx + 14, 133, 3.5, 7 * fl, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff2b0';
  ctx.beginPath(); ctx.ellipse(sx + 14, 135, 1.8, 3.5 * fl, 0, 0, TAU); ctx.fill();

  // Sitting-room floor and rug
  ctx.fillStyle = '#d8b582';
  ctx.fillRect(x0, FLOOR_UP - 40, viewW, 70);
  ctx.fillStyle = '#b04a3a';
  const rw = Math.min(W - 40, 520);
  roundRect(W / 2 - rw / 2, FLOOR_UP - 22, rw, 34, 12); ctx.fill();
  ctx.strokeStyle = '#e8b64a'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
  roundRect(W / 2 - rw / 2 + 7, FLOOR_UP - 16, rw - 14, 22, 8); ctx.stroke();
  ctx.setLineDash([]);
  // Step down into the kitchen
  ctx.fillStyle = '#c29a64';
  ctx.fillRect(x0, FLOOR_UP + 28, viewW, 16);
  ctx.fillStyle = '#a57e4c';
  ctx.fillRect(x0, FLOOR_UP + 44, viewW, 5);

  // Kitchen floor: packed earth with stone flags
  const kg = ctx.createLinearGradient(0, FLOOR_UP + 49, 0, H);
  kg.addColorStop(0, '#e2c496'); kg.addColorStop(1, '#d2ad78');
  ctx.fillStyle = kg;
  ctx.fillRect(x0, FLOOR_UP + 49, viewW, H - FLOOR_UP - 49 + 10);
  ctx.strokeStyle = 'rgba(150,110,60,0.18)'; ctx.lineWidth = 2;
  for (let r = 0; r < 5; r++) {
    const y = FLOOR_UP + 80 + r * 60;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    for (let x = x0 + (r % 2) * 50; x < x1; x += 100) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 60); ctx.stroke(); }
  }
}

// The long kitchen bench in front of Martha
function drawCounter() {
  const x0 = -offX - 10, w = viewW + 20;
  ctx.fillStyle = '#9a6a3c';
  ctx.fillRect(x0, COUNTER_Y + 8, w, H - COUNTER_Y);
  ctx.strokeStyle = 'rgba(70,40,15,0.25)'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x0, COUNTER_Y + 30 + k * 22); ctx.lineTo(x0 + w, COUNTER_Y + 30 + k * 22); ctx.stroke(); }
  ctx.fillStyle = '#c28a52';
  roundRect(x0, COUNTER_Y, w, 12, 4); ctx.fill();
  ctx.fillStyle = '#d9a468';
  ctx.fillRect(x0, COUNTER_Y, w, 3);
}

function drawStation(i) {
  const st = stations[i];
  const x = stationX(i), y = COUNTER_Y;
  const a = st.anim / 0.3;
  const wob = st.oops > 0 ? Math.sin(t * 40) * 3 * (st.oops / 1.4) : 0;
  ctx.save();
  ctx.translate(x + wob, y);
  ctx.scale(kitchenScale(), kitchenScale());
  if (i === 0) {
    // Kneading trough and dough
    ctx.fillStyle = '#8a5a30';
    ctx.beginPath(); ctx.moveTo(-44, -20); ctx.lineTo(44, -20); ctx.lineTo(34, 2); ctx.lineTo(-34, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6e4624'; ctx.beginPath(); ctx.ellipse(0, -20, 44, 7, 0, 0, TAU); ctx.fill();
    const puff = st.oops > 0 ? 1.35 : 1;
    const sq = 1 + a * 0.3;
    ctx.fillStyle = '#f6e7c8'; ctx.strokeStyle = '#dcc49a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -26 + a * 3, 26 * sq * puff, 14 / sq * puff, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e7d3ad';
    ctx.beginPath(); ctx.arc(-8, -30, 3, 0, TAU); ctx.arc(9, -27, 2.5, 0, TAU); ctx.fill();
    // a flat loaf waiting beside it
    ctx.fillStyle = '#d9a35a';
    ctx.beginPath(); ctx.ellipse(46, -6, 16, 7, 0, 0, TAU); ctx.fill();
  } else if (i === 1) {
    // Clay stove, fire and pot
    ctx.fillStyle = '#b5673e';
    roundRect(-36, -34, 72, 36, 8); ctx.fill();
    ctx.fillStyle = '#4a2a18'; roundRect(-16, -22, 32, 20, 8); ctx.fill();
    const fl = 1 + Math.sin(t * 13) * 0.15;
    ctx.fillStyle = '#ff9d2e'; ctx.beginPath(); ctx.ellipse(0, -9, 9, 9 * fl, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe36a'; ctx.beginPath(); ctx.ellipse(0, -7, 4.5, 5 * fl, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5f5a55';
    ctx.beginPath(); ctx.moveTo(-30, -58); ctx.quadraticCurveTo(-32, -32, 0, -32); ctx.quadraticCurveTo(32, -32, 30, -58); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.ellipse(0, -58, 30, 7, 0, 0, TAU); ctx.fill();
    // spoon, swirling when stirred
    const ang = st.anim > 0 ? t * 20 : 0.4;
    ctx.strokeStyle = '#c9a46a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(Math.cos(ang) * 10, -58 + Math.sin(ang) * 3); ctx.lineTo(18 + Math.cos(ang) * 6, -92); ctx.stroke();
    // steam (a lot when it boils over)
    const n = st.oops > 0 ? 6 : 2;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let k = 0; k < n; k++) {
      const f = (t * 0.6 + k / n) % 1;
      ctx.beginPath(); ctx.arc(-12 + k * 9 + Math.sin(t * 2 + k) * 5, -66 - f * 40, 5 + f * 6, 0, TAU); ctx.fill();
    }
    if (st.oops > 0) {
      ctx.fillStyle = '#b8743a';
      ctx.beginPath(); ctx.ellipse(-26, -50, 5, 9, 0.2, 0, TAU); ctx.ellipse(24, -48, 5, 10, -0.2, 0, TAU); ctx.fill();
    }
  } else if (i === 2) {
    // Big water jar and a pitcher
    ctx.fillStyle = '#c9764a'; ctx.strokeStyle = '#9c5530'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-8, -40, 28, 38, 0, 0, TAU); ctx.fill(); ctx.stroke();
    roundRect(-22, -86, 28, 14, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = st.oops > 0 ? '#6b3a20' : '#5aa9d8';
    ctx.beginPath(); ctx.ellipse(-8, -84, 11, 3.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e0a070'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-8, -40, 20, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
    // pitcher, tipping to pour
    ctx.save();
    ctx.translate(30, -2);
    ctx.rotate(-a * 0.7);
    ctx.fillStyle = '#e0a868';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-14, -18, -7, -26); ctx.lineTo(7, -26); ctx.quadraticCurveTo(14, -18, 10, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b87a40'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(12, -15, 6, -1.3, 1.3); ctx.stroke();
    ctx.restore();
    if (st.anim > 0) {
      ctx.fillStyle = '#7cc4f2';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(14 - k * 4, -30 + k * 8, 3, 0, TAU); ctx.fill(); }
    }
  } else {
    // Plates and bowls for the guests
    const rattle = st.oops > 0 ? Math.sin(t * 50) * 3 : 0;
    const count = st.anim > 0 ? 5 : 4;
    for (let k = 0; k < count; k++) {
      ctx.fillStyle = k % 2 ? '#f2e6cf' : '#e6d2ad';
      ctx.strokeStyle = '#b89a6a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(-18 + (k % 2 ? rattle : -rattle), -6 - k * 7, 26, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#c98a4a';
    ctx.beginPath(); ctx.arc(34, -14, 15, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a3b6a';
    ctx.beginPath(); ctx.arc(29, -16, 5, 0, TAU); ctx.arc(38, -17, 5, 0, TAU); ctx.arc(34, -22, 5, 0, TAU); ctx.fill();
  }
  ctx.restore();
  if (st.done > 0) {
    ctx.fillStyle = `rgba(255,240,170,${st.done})`;
    ctx.beginPath(); ctx.arc(x, y - 30, 50 * (1.4 - st.done), 0, TAU); ctx.fill();
  }
}

// Little icon for each job inside its bubble
function drawTaskIcon(i, x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';
  if (i === 0) {
    ctx.fillStyle = '#d9a35a'; ctx.strokeStyle = '#a86e2c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 2, 18, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f4d59a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(-3, 5); ctx.moveTo(0, -3); ctx.lineTo(5, 4); ctx.moveTo(8, -2); ctx.lineTo(11, 2); ctx.stroke();
  } else if (i === 1) {
    ctx.fillStyle = '#5f5a55';
    ctx.beginPath(); ctx.moveTo(-15, -2); ctx.quadraticCurveTo(-15, 14, 0, 14); ctx.quadraticCurveTo(15, 14, 15, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b8743a'; ctx.beginPath(); ctx.ellipse(0, -2, 15, 4, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c9a46a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(2, -2); ctx.lineTo(12, -16); ctx.stroke();
  } else if (i === 2) {
    ctx.fillStyle = '#4dabf7';
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(13, 2, 0, 12); ctx.quadraticCurveTo(-13, 2, 0, -16); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-4, 2, 2.5, 4, 0.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#f2e6cf'; ctx.strokeStyle = '#b89a6a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 3, 18, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 1, 10, 4, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-22, -8); ctx.lineTo(-22, 10); ctx.moveTo(22, -8); ctx.lineTo(22, 10); ctx.stroke();
  }
  ctx.restore();
}

const COARSE = matchMedia('(pointer: coarse)').matches;

function drawTaskBubbles() {
  for (const st of stations) {
    if (!st.task) continue;
    const tk = st.task;
    const x = stationX(st.i);
    const f = clamp(tk.life / tk.max, 0, 1);
    const pop = clamp(tk.t / 0.18, 0, 1);
    const urgent = f < 0.35;
    const y = BUBBLE_Y + (urgent ? Math.sin(t * 20) * 2 : Math.sin(t * 3 + st.i) * 3);
    const r = 34 * kitchenScale() * (0.6 + 0.4 * pop) * (st.anim > 0 ? 1.08 : 1);
    ctx.save();
    // tail pointing to the station
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(x - 9, y + r - 4); ctx.lineTo(x, y + r + 14); ctx.lineTo(x + 9, y + r - 4); ctx.fill();
    ctx.shadowColor = 'rgba(90,60,20,0.25)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // countdown ring
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(x, y, r - 3, 0, TAU); ctx.stroke();
    ctx.strokeStyle = f > 0.6 ? '#51b85a' : f > 0.35 ? '#f0a92e' : '#e8594a';
    ctx.beginPath(); ctx.arc(x, y, r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke();
    ctx.save(); ctx.translate(x, y - 3); ctx.scale(kitchenScale(), kitchenScale()); drawTaskIcon(st.i, 0, 0); ctx.restore();
    // taps still needed
    if (tk.need > 1) {
      for (let k = 0; k < tk.need; k++) {
        ctx.fillStyle = k < tk.taps ? '#51b85a' : '#d8c8a8';
        ctx.beginPath(); ctx.arc(x + (k - (tk.need - 1) / 2) * 11, y + r - 12, 3.5, 0, TAU); ctx.fill();
      }
    }
    // name tag (and key on desktop)
    ctx.font = '700 13px Fredoka, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = COARSE ? TASKS[st.i].name : `${TASKS[st.i].key} · ${TASKS[st.i].name}`;
    const lw = ctx.measureText(label).width + 12;
    ctx.fillStyle = '#8a5a2a';
    roundRect(x - lw / 2, y - r - 16, lw, 18, 9); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, y - r - 7);
    ctx.restore();
  }
}

function drawSitButton() {
  if (phase !== 'final' || sat || state !== 'play') return;
  const r = sitButtonRect();
  const open = winOpen > 0;
  const pulse = 0.5 + 0.5 * Math.sin(t * 8);
  ctx.save();
  if (open) {
    const g = ctx.createRadialGradient(W / 2, SIT_Y, 10, W / 2, SIT_Y, r.w * 0.75);
    g.addColorStop(0, `rgba(255,230,120,${0.5 + pulse * 0.3})`); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, SIT_Y, r.w * 0.75, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = sitCd > 0 ? 0.55 : 1;
  const bg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  if (open) { bg.addColorStop(0, '#f7c948'); bg.addColorStop(1, '#d9961c'); }
  else { bg.addColorStop(0, '#fffaf0'); bg.addColorStop(1, '#f0e2c4'); }
  ctx.fillStyle = bg;
  ctx.strokeStyle = open ? '#a8741a' : 'rgba(168,116,26,0.6)'; ctx.lineWidth = 3;
  roundRect(r.x, r.y, r.w, r.h, r.h / 2); ctx.fill(); ctx.stroke();
  ctx.font = '700 20px Fredoka, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = open ? '#ffffff' : '#a8741a';
  ctx.fillText(open ? 'Sit and listen!' : 'Sit and listen', W / 2, SIT_Y + 1);
  if (open) {
    // how long the welcome lasts
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    roundRect(r.x + 24, r.y + r.h - 8, (r.w - 48) * (winOpen / cfg.winLen), 4, 2); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  Speech bubbles (drawn in screen space)
// ============================================================
function speakerPos(who) {
  if (who === 'jesus') { const j = jesusPos(); return { x: offX + j.x, y: offY + j.y - 70 * j.s - 14 }; }
  return { x: offX + martha.x, y: offY + martha.y - 75 * martha.s };
}

function drawSpeech(text, ax, ay, who, alpha = 1, size = 18) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const maxW = Math.min(viewW * 0.66, 380, viewW - 60);
  const lines = wrapText(text, maxW);
  const lh = size + 5;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 28;
  const h = lines.length * lh + 18;
  const top = 108;
  const bx = clamp(ax - w / 2, 10, viewW - w - 10);
  const by = Math.max(top, ay - 16 - h);
  const tail = ay - 6 > by + h;
  const jesusSpeaks = who === 'jesus';
  ctx.fillStyle = jesusSpeaks ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = jesusSpeaks ? '#e0a526' : '#c8643b';
  ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  if (tail) {
    const tx = clamp(ax, bx + 20, bx + w - 20);
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 10, by + h); ctx.stroke();
  }
  // speaker's name tag
  ctx.font = '700 12px Fredoka, sans-serif';
  ctx.fillStyle = jesusSpeaks ? '#e0a526' : '#c8643b';
  const name = jesusSpeaks ? 'JESUS' : 'MARTHA';
  const nw = ctx.measureText(name).width + 14;
  roundRect(bx + 14, by - 9, nw, 17, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(name, bx + 21, by);
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  ctx.fillStyle = jesusSpeaks ? '#8a5a00' : '#5a3a1a';
  lines.forEach((l, i) => ctx.fillText(l, bx + 14, by + 9 + lh / 2 + i * lh));
  ctx.restore();
}

function drawBubble() {
  if (!bubble) return;
  const p = speakerPos(bubble.who);
  const a = clamp(bubble.t / 0.2, 0, 1);
  drawSpeech('“' + Bible.verse(VERSES[bubble.key]).text + '”', p.x, p.y, bubble.who, a, viewW < 560 ? 17 : 18);
  if (bubble.t > 0.8) {
    ctx.save();
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(90,66,16,${0.5 + 0.3 * Math.sin(t * 4)})`;
    ctx.fillText(COARSE ? 'tap to continue' : 'Space / click to continue', offX + W / 2, offY + H - 14);
    ctx.restore();
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + calm
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  const title = state === 'title' ? 'Mary and Martha' : `Level ${level} · ${cfg.name}`;
  ctx.fillText(title, 12, 26, viewW - 150);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('CALM', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(52, 38, 130, 13, 6.5); ctx.fill();
  const cl = calm / 100;
  const cg = ctx.createLinearGradient(52, 0, 182, 0);
  cg.addColorStop(0, '#6cc3e8'); cg.addColorStop(1, '#bfe9f7');
  ctx.fillStyle = cl < 0.3 && Math.sin(t * 10) > 0 ? '#ff6b6b' : cg;
  if (cl > 0) { roundRect(52, 38, 130 * cl, 13, 6.5); ctx.fill(); }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score + round clock
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SCORE', rx, 20);
  ctx.font = '700 18px Fredoka, sans-serif';
  ctx.fillText(`${totalScore + levelScore}`, rx, 42);
  if (state === 'play' || state === 'pause') {
    let label = '';
    if (phase === 'rush' || phase === 'intro') label = `Cooking · ${Math.ceil(Math.max(0, cfg.rush - (phase === 'rush' ? phaseT : 0)))}s`;
    else if (phase === 'final') label = `Last round · ${Math.ceil(Math.max(0, cfg.final - phaseT))}s`;
    else if (phase === 'rest') label = 'Listening';
    else if (phase === 'complain') label = 'Martha speaks';
    ctx.font = '700 14px Fredoka, sans-serif';
    ctx.fillText(label, rx, 64);
    if (combo >= 3 && (phase === 'rush' || phase === 'final')) {
      ctx.fillStyle = '#2b8a3e';
      ctx.fillText(`Streak ×${combo}`, rx, 84);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = `700 ${W < 560 ? 21 : 24}px Fredoka, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = phase === 'final' && !sat && state === 'play' ? 572 : 548;
  ctx.strokeText(message.text, W / 2, y, W - 20);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y, W - 20);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawRoom();

  // The sitting room: Jesus teaching, Mary at His feet, a few disciples listening
  const j = jesusPos();
  const headX = j.x, headY = j.y - 52 * j.s;
  for (const s of listenerSlots()) drawSeated(s.d, s.x, s.y, s.s, s.d.dir, headX, headY);
  const pose = jesusPose();
  drawJesus(j.x, j.y, j.s, pose, state === 'win' || phase === 'rest' || pose === 'open' ? 'joy' : 'calm');
  const ms = marySlot();
  drawSeated(MARY, ms.x, ms.y, 1.45, -1, headX, headY);
  if (martha.seated) drawSeated(MARTHA, martha.x, martha.y, martha.s, 1, headX, headY);

  drawSitButton();

  // The kitchen
  drawCounter();
  for (let i = 0; i < 4; i++) drawStation(i);
  if (!martha.seated) drawMartha(martha);
  drawTaskBubbles();
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  drawPops();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBubble();
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePops(dt);
  updatePeople(dt);
  if (state === 'play') updatePhase(dt);
  else if (state === 'win' && Math.random() < dt * 10) {
    const j = jesusPos();
    spawn(j.x + rand(-80, 80), j.y - rand(0, 110), 0, -20, 1, '#fff6d0', 3);
  }
  shockT = Math.max(0, shockT - dt);
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
