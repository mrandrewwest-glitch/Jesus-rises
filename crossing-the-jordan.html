<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1f3e">
<title>Crossing the Jordan</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2a1f3e;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;

    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 30, 70, 0.25);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);

  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>

<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Crossing the Jordan</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>

    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'doxology', instrument: 'harp', accent: 'pipe', ambience: 'sea', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  feet: { ref: 'Joshua 3:13', KJV: 'As soon as the soles of the feet of the priests that bear the ark of the LORD, the Lord of all the earth, shall rest in the waters of Jordan, that the waters of Jordan shall be cut off from the waters that come down from above; and they shall stand upon an heap.', NKJV: 'As soon as the soles of the feet of the priests who bear the ark of the LORD, the Lord of all the earth, shall rest in the waters of the Jordan, that the waters of the Jordan shall be cut off, the waters that come down from upstream, and they shall stand as a heap.', NIV: 'As soon as the priests who carry the ark of the LORD—the Lord of all the earth—set foot in the Jordan, its waters flowing downstream will be cut off and stand up in a heap.', NLT: 'The priests will carry the Ark of the LORD, the Lord of all the earth. As soon as their feet touch the water, the flow of water will be cut off upstream, and the river will stand up like a wall.' },
  // Level cards
  touched: { ref: 'Joshua 3:15', KJV: 'The feet of the priests that bare the ark were dipped in the brim of the water.', NKJV: 'The feet of the priests who bore the ark dipped in the edge of the water.', NIV: 'As soon as the priests who carried the ark reached the Jordan and their feet touched the water’s edge...', NLT: 'As soon as the feet of the priests who were carrying the Ark touched the water at the river’s edge...' },
  flood: { ref: 'Joshua 3:15', KJV: 'Jordan overfloweth all his banks all the time of harvest.', NKJV: 'The Jordan overflows all its banks during the whole time of harvest.', NIV: 'Now the Jordan is at flood stage all during harvest.', NLT: 'It was the harvest season, and the Jordan was overflowing its banks.' },
  heap: { ref: 'Joshua 3:16', KJV: 'The waters which came down from above stood and rose up upon an heap very far from the city Adam.', NKJV: 'The waters which came down from upstream stood still, and rose in a heap very far away at Adam.', NIV: 'The water from upstream stopped flowing. It piled up in a heap a great distance away, at a town called Adam.', NLT: 'The water above that point began backing up a great distance away at a town called Adam... And the water below that point flowed on to the Dead Sea until the riverbed was dry.' },
  crossed: { ref: 'Joshua 3:16', KJV: 'And the people passed over right against Jericho.', NKJV: 'And the people crossed over opposite Jericho.', NIV: 'So the people crossed over opposite Jericho.', NLT: 'Then all the people crossed over near the town of Jericho.' },
  // Win cards
  dry: { ref: 'Joshua 3:17', KJV: 'And the priests that bare the ark of the covenant of the LORD stood firm on dry ground in the midst of Jordan, and all the Israelites passed over on dry ground.', NKJV: 'Then the priests who bore the ark of the covenant of the LORD stood firm on dry ground in the midst of the Jordan; and all Israel crossed over on dry ground.', NIV: 'The priests who carried the ark of the covenant of the LORD stopped in the middle of the Jordan and stood on dry ground, while all Israel passed by.', NLT: 'The priests who were carrying the Ark of the LORD’s Covenant stood on dry ground in the middle of the riverbed as the people passed by.' },
  whole: { ref: 'Joshua 3:17', KJV: 'All the Israelites passed over on dry ground, until all the people were passed clean over Jordan.', NKJV: 'All Israel crossed over on dry ground, until all the people had crossed completely over the Jordan.', NIV: 'All Israel passed by until the whole nation had completed the crossing on dry ground.', NLT: 'They waited there until the whole nation of Israel had crossed the Jordan on dry ground.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
// Small seeded random so every level has the same, tested layout
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
//  Tuning
// ============================================================
const TOP_BANK = 270;     // the far (Canaan) bank ends here (playfield y)
const BOT_BANK = 770;     // the near bank (the camp) starts here
const CHANCES = 3;
const STEP_T = 0.2;       // seconds a step takes
const FAM_W = 20;         // half-width of a family on the stones (for splashes)

// rows: river rows; streams: [seconds between streams min, max], speed px/s, len px
const LEVELS = [
  { name: 'The Priests Step In', verse: 'touched', rows: 3, families: 3, speed: [90, 110], gap: [3.0, 3.8], len: [70, 90], surge: 0, time: 60,
    tip: 'Tap <b>above</b> the family to take <b>one step</b> across the stones. Wait for the running water to pass!' },
  { name: 'Harvest Flood', verse: 'flood', rows: 5, families: 4, speed: [110, 140], gap: [2.6, 3.4], len: [80, 110], surge: 0, time: 75,
    tip: 'The middle of the river is dry where the <b>priests</b> stand with the ark. Rest there!' },
  { name: 'Running Streams', verse: 'heap', rows: 5, families: 5, speed: [130, 170], gap: [2.3, 3.0], len: [90, 120], surge: 0.3, time: 85,
    tip: 'Some streams <b>speed up and slow down</b>. Watch them carefully. Tap <b>below</b> the family to step back.' },
  { name: 'Faster Water', verse: 'touched', rows: 7, families: 5, speed: [150, 200], gap: [2.0, 2.7], len: [100, 130], surge: 0.35, time: 100,
    tip: 'More streams and faster water. You can stop on any stone between them.' },
  { name: 'All Israel Crosses', verse: 'crossed', rows: 7, families: 7, speed: [170, 230], gap: [1.8, 2.4], len: [110, 140], surge: 0.4, time: 125,
    tip: 'Everyone must get over before sunset. Quick and careful!' },
];
function makeConfig(n) { return { ...LEVELS[n - 1], n }; }

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | level | play | pause | win | fail | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('jordanBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let lv = null;            // { rows: [...], fam, crossed, waiting }
let chances = CHANCES, timeLeft = 60, splashes = 0;
let particles = [];
let message = { text: '', t: 0 };
let flashT = 0, shakeT = 0, endTimer = 0;
let lastScore = null;
let playT = 0, winT = 0, failT = 0;
let failWhy = '';
let told = {};

const FAMILIES = [
  [{ robe: '#3f6fb5', skin: '#d9a066', hair: '#3a2716', beard: true }, { robe: '#c46b8c', skin: '#d7a070', scarf: '#e8dcc0' }, { robe: '#d9a13a', skin: '#e3b184', hair: '#6b3f1d', kid: true }],
  [{ robe: '#6b8e3a', skin: '#c98d56', hair: '#4a2f1a', beard: true }, { robe: '#7a4fa0', skin: '#c58a55', scarf: '#f0c9a0' }],
  [{ robe: '#b5503f', skin: '#d7a070', hair: '#2e1d10', beard: true }, { robe: '#3c8f86', skin: '#b87a48', scarf: '#d8c7a0' }, { robe: '#e07a5f', skin: '#dca678', hair: '#5c3a1c', kid: true }, { robe: '#5a6475', skin: '#dca678', hair: '#3a2716', kid: true }],
  [{ robe: '#b08a2e', skin: '#c78f5c', hair: '#1c120b', beard: true }, { robe: '#4b7f4b', skin: '#bf8150', scarf: '#e8dcc0' }, { robe: '#a0673a', skin: '#d39a66', hair: '#3a2515', kid: true }],
  [{ robe: '#5a6475', skin: '#c88e5a', hair: '#8a8a8a', beard: true }, { robe: '#c0392b', skin: '#d9a066', scarf: '#f0dcb0' }],
];

// ============================================================
//  Building a level
// ============================================================
function rowY(r) {
  // r = 0: near bank, 1..rows: river rows, rows+1: far bank
  const n = cfg.rows;
  if (r <= 0) return BOT_BANK + 46;
  if (r >= n + 1) return TOP_BANK - 40;
  const h = (BOT_BANK - TOP_BANK) / n;
  return BOT_BANK - h * (r - 0.5);
}
function rowH() { return (BOT_BANK - TOP_BANK) / cfg.rows; }
function midRow() { return Math.ceil(cfg.rows / 2); }
function colX() { return viewW / 2; }

function buildLevel() {
  const rng = seeded(level * 733 + 5);
  const r = (a, b) => a + rng() * (b - a);
  lv = { rows: [], fam: null, crossed: 0, next: 0, ark: { glow: 0 }, dry: 0 };
  for (let i = 1; i <= cfg.rows; i++) {
    const dry = i === midRow() && cfg.rows > 1;
    lv.rows.push({
      i, dry,
      speed: r(cfg.speed[0], cfg.speed[1]),
      surgePh: r(0, TAU), surgeW: r(0.6, 1.1),
      len: r(cfg.len[0], cfg.len[1]),
      spawnT: r(0, cfg.gap[1]),
      streams: [],
      rng,
    });
  }
  // let the water run for a while so the river is already full of streams
  for (let k = 0; k < 400; k++) updateStreams(1 / 30, true);
  newFamily();
}

function newFamily() {
  const k = lv.next++;
  lv.fam = { k, people: FAMILIES[k % FAMILIES.length], row: 0, from: 0, stepT: 0, queued: 0, wet: 0, washX: 0, arriveT: 0 };
}

function rowSpeed(row) {
  return row.speed * (1 + cfg.surge * Math.sin(t * row.surgeW * 2 + row.surgePh));
}

function updateStreams(dt, warm = false) {
  const tt = warm ? 0 : t;
  for (const row of lv.rows) {
    if (row.dry) continue;
    const sp = warm ? row.speed : rowSpeed(row);
    for (const s of row.streams) s.x += sp * dt;
    row.streams = row.streams.filter((s) => s.x - s.len / 2 < viewW + 300);
    row.spawnT -= dt;
    if (row.spawnT <= 0 && lv.dry <= 0) {
      // streams thin out as more families get across (the riverbed drying)
      const dryMul = 1 + 0.06 * lv.crossed;
      row.spawnT = lerp(cfg.gap[0], cfg.gap[1], row.rng()) * dryMul;
      row.streams.push({ x: -300 - row.len / 2, len: row.len * (1 - 0.04 * lv.crossed), w: Math.min(rowH() * 0.62, 50), ph: row.rng() * TAU });
    }
  }
  void tt;
}

// Water touching the stone column on a given row?
function wetAt(r) {
  const row = lv.rows[r - 1];
  if (!row || row.dry) return false;
  const cx = colX();
  return row.streams.some((s) => Math.abs(s.x - cx) < s.len / 2 + FAM_W);
}

function resetLevel() {
  cfg = makeConfig(level);
  particles = [];
  chances = CHANCES; timeLeft = cfg.time; splashes = 0;
  playT = 0; winT = 0; failT = 0;
  flashT = shakeT = 0;
  endTimer = 0;
  message = { text: '', t: 0 };
  told = {};
  buildLevel();
}

// ============================================================
//  Cards
// ============================================================
// ============================================================
//  Overlay cards
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
  overlay.querySelector('.card').scrollTop = 0;
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}
function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  note(h) { if (this.ctx) Music.tap(h); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Drawing helpers shared by the scenes
// ============================================================
function eyes(x, y, lookX, open, big = 1) {
  const dark = '#2b1d12';
  for (const sx of [-6, 6]) {
    if (!open) {
      ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + sx, y, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x + sx, y, 4 * big, 5 * big, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(x + sx + lookX * 1.8 * big, y + 0.5, 2.2 * big, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + sx + lookX * 1.8 * big - 0.8, y - 0.8, 0.8, 0, TAU); ctx.fill();
  }
}
function bubbleAt(x, y, text, col, s = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.font = '700 17px Fredoka, sans-serif';
  const w = ctx.measureText(text).width + 22;
  ctx.fillStyle = col; ctx.strokeStyle = 'rgba(80,50,20,0.6)'; ctx.lineWidth = 2;
  roundRect(-w / 2, -17, w, 32, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(0, 26); ctx.lineTo(6, 14); ctx.fill();
  ctx.fillStyle = '#5a3210'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
function drawHudButtons() {
  ctx.save();
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}
// The HUD strip: title line, a time bar, chances, score
function drawHudStrip(label, barName, frac, chancesLeft, chancesMax, extra) {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const hg = ctx.createLinearGradient(0, 0, 0, 112);
  hg.addColorStop(0, 'rgba(20,14,34,0.8)'); hg.addColorStop(1, 'rgba(20,14,34,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, viewW, 112);
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(label, 12, 26);
  if (barName) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(barName, 12, 50);
    ctx.shadowBlur = 0;
    const bx = 18 + ctx.measureText(barName).width;
    ctx.fillStyle = 'rgba(255,233,168,0.22)';
    roundRect(bx, 40, 120, 13, 6.5); ctx.fill();
    ctx.fillStyle = frac < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : '#ffd860';
    if (frac > 0) { roundRect(bx, 40, 120 * frac, 13, 6.5); ctx.fill(); }
    for (let i = 0; i < chancesMax; i++) {
      const cx = bx + 140 + i * 22;
      ctx.fillStyle = i < chancesLeft ? '#ff6b7a' : 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(cx, 54); ctx.bezierCurveTo(cx - 12, 46, cx - 8, 36, cx, 42); ctx.bezierCurveTo(cx + 8, 36, cx + 12, 46, cx, 54); ctx.fill();
    }
    if (extra) { ctx.fillStyle = '#ffe9a8'; ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillText(extra, bx + 150 + chancesMax * 22, 52); }
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe9a8'; ctx.font = '700 16px Fredoka, sans-serif';
  ctx.shadowBlur = 4;
  if (state !== 'title') ctx.fillText(`Score ${totalScore}`, viewW - 14, 26);
  ctx.restore();
  drawHudButtons();
}
function drawMessage(y0) {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 23px Fredoka, sans-serif';
  const lines = wrapText(message.text, Math.min(viewW - 40, 640));
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,12,34,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function titleScreen() {

  level = 1;
  resetLevel();
  showOverlay('Crossing the Jordan', 'Over the river on dry ground',
    `${verseHTML('feet')}
     <ul>
       <li>The priests carry the <b>ark of the LORD</b> into the river, and God stops the water! Help every family cross to the new land.</li>
       <li><b>Tap above</b> the family to take <b>one step</b> along the stones. <b>Tap below</b> them to step back.</li>
       <li>The last of the water is still <b>running away</b> downstream. Step between the streams, or the family gets <b>splashed</b> back to the start!</li>
       <li>The dry middle where the <b>priests</b> stand is always safe.</li>
       <li><b>Keys:</b> <kbd>&uarr;</kbd> or <kbd>Space</kbd> step, <kbd>&darr;</kbd> step back.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}

}

// The level card: the new level is built at the same time, so the scene behind it is ready
function levelCard() {
  resetLevel();
  state = 'level';
  syncAmbience();
  showOverlay(`Level ${level}`, cfg.name,
    `${verseHTML(cfg.verse)}
     <p style="text-align:center">${cfg.tip}</p>
     <p style="text-align:center"><b>${cfg.families}</b> families to bring across.</p>`,
    'Begin', () => startLevel());
}

function startLevel() {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
}

function winLevel() {
  state = 'win';
  syncAmbience();
  winT = 0;
  lv.dry = 1;
  const timeBonus = Math.round(timeLeft) * 10;
  const famBonus = cfg.families * 100;
  const careBonus = chances * 150;
  const levelBonus = level * 300;
  const score = timeBonus + famBonus + careBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('jordanBest', best); } catch (e) {} }
  lastScore = { timeBonus, famBonus, careBonus, levelBonus, score };
  showMessage('Everyone crossed on dry ground!', 2.4);
  sfx.win();
  flashT = 0.3;
  endTimer = 2.8;
}

function fail(why) {
  state = 'fail';
  syncAmbience();
  failT = 0;
  failWhy = why;
  showMessage(why, 2.2);
  sfx.fail();
  endTimer = 2.2;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= LEVELS.length;
    const scoreHTML = `<p class="score">Families across: <b>${s.famBonus}</b><br>Sunlight left: <b>${s.timeBonus}</b><br>Hearts kept (${chances}): <b>${s.careBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>`;
    if (last) {
      state = 'done';
      showOverlay('Into the Promised Land!', 'All Israel crossed the Jordan',
        `${verseHTML('whole')}
         <p style="text-align:center">God kept His promise and made a dry path for His people, just as He did at the Red Sea.</p>
         ${verseHTML('crossed')}
         ${scoreHTML}
         ${creditHTML()}`,
        'Play again', () => { level = 1; totalScore = 0; levelCard(); });
    } else {
      showOverlay('Across!', `Level ${level} complete — ${cfg.name}`,
        `${verseHTML('dry')}
         ${scoreHTML}
         ${creditHTML()}`,
        'Next level', () => { level++; levelCard(); });
    }
  } else if (state === 'fail') {
    showOverlay('Splash!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${failWhy} Watch the streams come from the left, and step when the way is clear.</p>
       ${verseHTML('touched')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">The priests stand still and wait. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel());
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Playing
// ============================================================
function step(dir) {
  if (state !== 'play' || !lv.fam) return;
  const f = lv.fam;
  if (f.wet > 0 || f.arriveT > 0) return;
  if (f.stepT > 0) { f.queued = dir; return; }
  const to = clamp(f.row + dir, 0, cfg.rows + 1);
  if (to === f.row) return;
  f.from = f.row; f.row = to; f.stepT = STEP_T;
  sfx.step(to);
  if (to === cfg.rows + 1) arrive();
}

function arrive() {
  const f = lv.fam;
  f.arriveT = 0.7;
  lv.crossed++;
  sfx.note(0.5 + 0.5 * lv.crossed / cfg.families);
  for (let i = 0; i < 14; i++) spawn(colX(), rowY(cfg.rows + 1) - 40, rand(-90, 90), rand(-160, -40), 0.9, pick(['#ffe27a', '#fff6d0', '#9fe0ff']), 4, 200, 'star');
  if (lv.crossed >= cfg.families) { winLevel(); return; }
  showMessage(`${lv.crossed} of ${cfg.families} families across!`, 1.6);
}

function splash() {
  const f = lv.fam;
  chances--; splashes++;
  f.wet = 1.0; f.washX = 0; f.queued = 0;
  sfx.splash();
  shakeT = 0.25;
  const y = rowY(f.row);
  for (let i = 0; i < 22; i++) spawn(colX() + rand(-20, 20), y - 20, rand(-60, 160), rand(-220, -60), 0.9, pick(['#9fd8ff', '#ffffff', '#6ab8e8']), rand(3, 6), 500);
  if (chances <= 0) { fail('The family got splashed too many times!'); return; }
  showMessage(chances === 1 ? 'Splash! Back to the start… last heart!' : 'Splash! Back to the start.', 1.8);
}

function updateFamily(dt) {
  const f = lv.fam;
  if (!f) return;
  if (f.arriveT > 0) {
    f.arriveT -= dt;
    if (f.arriveT <= 0 && state === 'play') newFamily();
    return;
  }
  if (f.wet > 0) {
    f.wet -= dt;
    f.washX += dt * 160;
    if (f.wet <= 0) { f.row = 0; f.from = 0; f.washX = 0; f.stepT = 0; }
    return;
  }
  if (f.stepT > 0) {
    f.stepT -= dt;
    if (f.stepT <= 0) {
      f.stepT = 0;
      if (f.queued) { const q = f.queued; f.queued = 0; step(q); }
    }
  }
  if (f.row >= 1 && f.row <= cfg.rows && wetAt(f.row)) { splash(); return; }
  if (!told.wait && f.row === 0 && playT > 3) {
    told.wait = true;
    showMessage(level === 1 ? 'Tap above the family to step onto the stones!' : 'Step when the stones are clear!', 2.4);
  }
  if (!told.mid && f.row === midRow() && cfg.rows > 1) { told.mid = true; showMessage('Safe here beside the priests and the ark!', 2); }
}

// ============================================================
//  Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (['ArrowUp', 'KeyW', 'Space', 'Enter'].includes(e.code)) step(1);
  else if (['ArrowDown', 'KeyS'].includes(e.code)) step(-1);
});

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 8) { b.action(); return; }
  }
  if (state === 'win' && winT > 1) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play' || !lv.fam) return;
  const y = p.vy - offY;
  const fy = rowY(lv.fam.row) - 30;
  step(y < fy ? 1 : -1);
});

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    if (p.kind === 'star') drawStar(p.x, p.y, p.size * 1.6, p.size * 0.7);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawStar(x, y, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}


// ============================================================
//  Sounds for this game
// ============================================================
Object.assign(sfx, {
  step(r) { this.noiseBurst(700, 0.1, 0.18, 1, 350, 'lowpass'); if (this.ctx) Music.tap(clamp(r / (cfg.rows + 1), 0, 1) * 0.8); },
  splash() { this.noiseBurst(2500, 0.5, 0.35, 0.6, 500); this.tone(500, 0.25, 'sine', 0.12, 0.05, 250); },
});

// ============================================================
//  Rendering
// ============================================================
function drawPerson(d, x, y, s, mood, phase) {
  ctx.save();
  ctx.translate(x, y);
  if (d.kid) s *= 0.75;
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 16 * s, 5 * s, 0, 0, TAU); ctx.fill();
  const jump = mood === 'joy' ? Math.abs(Math.sin(t * 7 + phase)) * 10 : 0;
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (mood === 'joy') { const w = Math.sin(t * 9 + phase) * 4; arm(-11, -32, -24 + w, -64); arm(11, -32, 24 - w, -64); }
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-17, 0); ctx.quadraticCurveTo(-16, -30, -10, -37); ctx.quadraticCurveTo(0, -41, 10, -37); ctx.quadraticCurveTo(16, -30, 17, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-15, -17); ctx.quadraticCurveTo(0, -14, 15, -17); ctx.stroke();
  if (mood !== 'joy') {
    if (mood === 'wet') { arm(-11, -32, -18, -56); arm(11, -32, 18, -56); }
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  }
  const hy = -52;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 15, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 0.95, Math.PI * 2.05); ctx.lineTo(17, hy + 10); ctx.lineTo(12, hy + 4); ctx.lineTo(12, hy - 6);
    ctx.quadraticCurveTo(0, hy - 11, -12, hy - 6); ctx.lineTo(-12, hy + 4); ctx.lineTo(-17, hy + 10); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.arc(0, hy - 2, 15.5, Math.PI * 0.95, Math.PI * 2.05); ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10); ctx.quadraticCurveTo(-8, hy - 12, -15, hy + 1); ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.moveTo(-14, hy + 2); ctx.quadraticCurveTo(-13, hy + 20, 0, hy + 21); ctx.quadraticCurveTo(13, hy + 20, 14, hy + 2); ctx.quadraticCurveTo(8, hy + 8, 0, hy + 8); ctx.quadraticCurveTo(-8, hy + 8, -14, hy + 2); ctx.fill();
  }
  eyes(0, hy - 1, 0, true, mood === 'wet' ? 1.2 : 1);
  ctx.fillStyle = '#7a2e22';
  ctx.beginPath();
  if (mood === 'wet') ctx.ellipse(0, hy + 9, 3.5, 4.5, 0, 0, TAU);
  else ctx.arc(0, hy + 6, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.fill();
  ctx.restore();
}

function drawFamily(people, x, y, s, mood) {
  const n = people.length;
  people.forEach((d, i) => {
    const ox = (i - (n - 1) / 2) * 18 * s;
    const oy = (i % 2) * 4 * s;
    drawPerson(d, x + ox, y + oy, s, mood, i * 1.3);
  });
}

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, TOP_BANK);
  const dusk = state === 'play' || state === 'pause' ? 1 - clamp(timeLeft / cfg.time, 0, 1) : 0;
  g.addColorStop(0, dusk > 0.7 ? '#4a4a8a' : '#6aa8e0');
  g.addColorStop(1, dusk > 0.7 ? '#e88a6a' : '#cfe6f5');
  ctx.fillStyle = g;
  ctx.fillRect(0, -offY, viewW, TOP_BANK + offY);
  // sun sinks as time runs out
  const sy = lerp(-offY + 90, TOP_BANK - 90, dusk);
  ctx.fillStyle = dusk > 0.7 ? '#ffb86b' : '#ffe08a';
  ctx.beginPath(); ctx.arc(viewW * 0.82, sy, 38, 0, TAU); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 260 + t * 8) % (viewW + 300)) - 150, cy = -offY * 0.5 + 60 + i * 30;
    ctx.beginPath(); ctx.ellipse(cx, cy, 60, 18, 0, 0, TAU); ctx.ellipse(cx + 30, cy - 12, 36, 16, 0, 0, TAU); ctx.fill();
  }
}

function drawFarBank() {
  // hills of Canaan and the walls of Jericho in the distance
  ctx.fillStyle = '#9ab86a';
  ctx.beginPath(); ctx.moveTo(0, TOP_BANK - 50);
  for (let x = 0; x <= viewW + 40; x += 40) ctx.lineTo(x, TOP_BANK - 70 - Math.sin(x * 0.008 + 1) * 30);
  ctx.lineTo(viewW, TOP_BANK); ctx.lineTo(0, TOP_BANK); ctx.fill();
  const jx = viewW * 0.22;
  ctx.fillStyle = '#c9a27a';
  ctx.fillRect(jx - 70, TOP_BANK - 128, 140, 50);
  for (let k = 0; k < 7; k++) ctx.fillRect(jx - 70 + k * 21, TOP_BANK - 138, 12, 12);
  ctx.fillRect(jx - 20, TOP_BANK - 156, 40, 40);
  ctx.fillStyle = '#7a5a3a';
  ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Jericho', jx, TOP_BANK - 162);
  // grassy bank
  ctx.fillStyle = '#7fae4f';
  ctx.fillRect(0, TOP_BANK - 80, viewW, 80);
  ctx.fillStyle = '#6a9a40';
  for (let x = 0; x < viewW; x += 22) { ctx.beginPath(); ctx.moveTo(x, TOP_BANK - 80); ctx.lineTo(x + 6, TOP_BANK - 92); ctx.lineTo(x + 12, TOP_BANK - 80); ctx.fill(); }
  // palms
  for (const px of [viewW * 0.08, viewW * 0.9, viewW * 0.66]) drawPalm(px, TOP_BANK - 60, 0.6);
}

function drawPalm(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#8a6038'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(8, -70, 2, -140); ctx.stroke();
  ctx.fillStyle = '#4f9a4a';
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * 0.55 + Math.sin(t + i) * 0.04;
    ctx.save(); ctx.translate(2, -140); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(36, 0, 38, 9, 0.25, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawRiverbed() {
  // the riverbed, now dry: wet sand with pebbles
  const g = ctx.createLinearGradient(0, TOP_BANK, 0, BOT_BANK);
  g.addColorStop(0, '#c7ad7c'); g.addColorStop(1, '#b89a66');
  ctx.fillStyle = g;
  ctx.fillRect(0, TOP_BANK, viewW, BOT_BANK - TOP_BANK);
  // ripples left in the sand
  ctx.strokeStyle = 'rgba(120,90,50,0.18)'; ctx.lineWidth = 2;
  for (let y = TOP_BANK + 20; y < BOT_BANK; y += 26) {
    ctx.beginPath();
    for (let x = 0; x <= viewW; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.05 + y) * 3);
    ctx.stroke();
  }
  for (let i = 0; i < 70; i++) {
    const x = hash(i, 11) * viewW, y = TOP_BANK + hash(i, 12) * (BOT_BANK - TOP_BANK);
    ctx.fillStyle = i % 2 ? 'rgba(110,90,70,0.35)' : 'rgba(240,230,210,0.5)';
    ctx.beginPath(); ctx.ellipse(x, y, 4 + hash(i, 13) * 5, 3, 0, 0, TAU); ctx.fill();
  }
  // far upstream: the water standing up in a heap, glowing
  const hx = 0, hw = Math.min(70, viewW * 0.1);
  const hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);
  hg.addColorStop(0, 'rgba(70,150,210,0.95)'); hg.addColorStop(1, 'rgba(120,200,240,0.2)');
  ctx.fillStyle = hg;
  ctx.fillRect(hx, TOP_BANK, hw, BOT_BANK - TOP_BANK);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let y = TOP_BANK + 10; y < BOT_BANK; y += 30) {
    ctx.beginPath(); ctx.ellipse(hw * 0.6 + Math.sin(t * 2 + y) * 4, y, 6, 12, 0, 0, TAU); ctx.fill();
  }
}

function drawRows() {
  const cx = colX();
  for (const row of lv.rows) {
    const y = rowY(row.i);
    if (row.dry) {
      // the dry place where the priests stand with the ark
      ctx.fillStyle = 'rgba(255,240,180,0.35)';
      ctx.fillRect(0, y - rowH() / 2 + 4, viewW, rowH() - 8);
    }
    // the stepping stone
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, y + 6, 40, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#9a9286';
    ctx.beginPath(); ctx.ellipse(cx, y, 40, 15, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b8b0a2';
    ctx.beginPath(); ctx.ellipse(cx - 6, y - 4, 26, 8, 0, 0, TAU); ctx.fill();
  }
}

function drawStreams() {
  for (const row of lv.rows) {
    if (row.dry) continue;
    const y = rowY(row.i);
    for (const s of row.streams) {
      if (s.x + s.len / 2 < -20 || s.x - s.len / 2 > viewW + 20) continue;
      const a = lv.dry > 0 ? clamp(1 - winT, 0, 1) : 1;
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      const x0 = s.x - s.len / 2, h = s.w;
      const g = ctx.createLinearGradient(x0, 0, x0 + s.len, 0);
      g.addColorStop(0, 'rgba(80,160,220,0.55)'); g.addColorStop(0.25, '#4f9fdc'); g.addColorStop(1, '#3a86c8');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      for (let k = 0; k <= 10; k++) { const xx = x0 + s.len * k / 10; ctx.lineTo(xx, y - h / 2 + Math.sin(t * 6 + k + s.ph) * 3); }
      ctx.quadraticCurveTo(x0 + s.len + 18, y, x0 + s.len, y + h / 2);
      for (let k = 10; k >= 0; k--) { const xx = x0 + s.len * k / 10; ctx.lineTo(xx, y + h / 2 + Math.sin(t * 6 + k + s.ph + 2) * 3); }
      ctx.closePath(); ctx.fill();
      // foam at the front of the stream
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x0 + s.len - 4 + Math.sin(t * 9 + k) * 3, y - h / 3 + k * h / 4.5, 5, 0, TAU); ctx.fill(); }
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        const xx = x0 + ((t * 60 + k * 40 + s.ph * 20) % Math.max(1, s.len - 20));
        ctx.beginPath(); ctx.moveTo(xx, y - 4 + k * 4); ctx.lineTo(xx + 14, y - 4 + k * 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
}

function drawArk() {
  // the priests stand in the dry middle of the river holding the ark on its poles
  const r = midRow();
  const y = rowY(r) + 8;
  const x = colX() + Math.min(150, viewW * 0.27);
  const glow = 0.55 + 0.2 * Math.sin(t * 2);
  const g = ctx.createRadialGradient(x, y - 60, 10, x, y - 60, 140);
  g.addColorStop(0, `rgba(255,236,150,${glow})`); g.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y - 60, 140, 0, TAU); ctx.fill();
  const priest = { robe: '#f2efe6', skin: '#d39a66', hair: '#3a2716', beard: true };
  const priest2 = { robe: '#eeeae0', skin: '#c98d56', hair: '#5c3a1c', beard: true };
  drawPerson(priest2, x - 46, y - 6, 0.85, 'watch', 0);
  drawPerson(priest2, x + 46, y - 6, 0.85, 'watch', 1);
  // the poles and the ark
  ctx.fillStyle = '#a8741a';
  roundRect(x - 78, y - 50, 156, 6, 3); ctx.fill();
  ctx.fillStyle = '#e0a526';
  roundRect(x - 34, y - 78, 68, 36, 4); ctx.fill();
  ctx.fillStyle = '#f7c948';
  roundRect(x - 38, y - 84, 76, 9, 3); ctx.fill();
  ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2;
  ctx.strokeRect(x - 28, y - 72, 56, 24);
  // two cherubim, wings meeting over the lid
  ctx.fillStyle = '#f7d460';
  ctx.beginPath(); ctx.moveTo(x - 30, y - 84); ctx.quadraticCurveTo(x - 20, y - 112, x - 2, y - 100); ctx.lineTo(x - 8, y - 84); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 30, y - 84); ctx.quadraticCurveTo(x + 20, y - 112, x + 2, y - 100); ctx.lineTo(x + 8, y - 84); ctx.fill();
  drawPerson(priest, x - 46, y, 0.9, 'watch', 0);
  drawPerson(priest, x + 46, y, 0.9, 'watch', 1);
}

function drawNearBank() {
  ctx.fillStyle = '#c9a77a';
  ctx.fillRect(0, BOT_BANK, viewW, H - BOT_BANK + 10);
  ctx.fillStyle = '#b8935f';
  for (let x = 0; x < viewW; x += 30) { ctx.beginPath(); ctx.ellipse(x + 10, BOT_BANK + 4, 14, 5, 0, 0, TAU); ctx.fill(); }
  // tents of the camp
  for (const [tx, col] of [[viewW * 0.1, '#e8dcc0'], [viewW * 0.88, '#d9c7a0']]) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(tx - 44, H - 20); ctx.lineTo(tx, BOT_BANK + 20); ctx.lineTo(tx + 44, H - 20); ctx.fill();
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath(); ctx.moveTo(tx - 10, H - 20); ctx.lineTo(tx, BOT_BANK + 60); ctx.lineTo(tx + 10, H - 20); ctx.fill();
  }
}

function drawWaitingFamilies() {
  // families still to cross wait on the near bank; those across cheer on the far bank
  const waiting = cfg.families - lv.crossed - (lv.fam && lv.fam.arriveT <= 0 ? 1 : 0);
  for (let i = 0; i < Math.max(0, waiting); i++) {
    const k = lv.next + i;
    const side = i % 2 ? 1 : -1;
    const x = colX() + side * (110 + Math.floor(i / 2) * 90);
    drawFamily(FAMILIES[k % FAMILIES.length], x, H - 26, 0.62, 'watch');
  }
  for (let i = 0; i < lv.crossed - (lv.fam && lv.fam.arriveT > 0 ? 1 : 0); i++) {
    const side = i % 2 ? 1 : -1;
    const x = colX() + side * (100 + Math.floor(i / 2) * 80);
    drawFamily(FAMILIES[i % FAMILIES.length], x, TOP_BANK - 24, 0.55, 'joy');
  }
}

function drawActiveFamily() {
  const f = lv.fam;
  if (!f) return;
  let y = rowY(f.row);
  if (f.stepT > 0) y = lerp(rowY(f.from), rowY(f.row), ease(1 - f.stepT / STEP_T)) - Math.sin((1 - f.stepT / STEP_T) * Math.PI) * 12;
  let x = colX() + f.washX;
  let s = 0.8;
  if (f.arriveT > 0) { s = lerp(0.55, 0.8, f.arriveT / 0.7); }
  drawFamily(f.people, x, y + 4, s, f.wet > 0 ? 'wet' : f.arriveT > 0 ? 'joy' : 'watch');
  // tap hints
  if (state === 'play' && f.wet <= 0 && f.arriveT <= 0 && f.stepT <= 0 && f.row < cfg.rows + 1) {
    const ny = rowY(f.row + 1);
    const clear = f.row + 1 > cfg.rows || !wetAt(f.row + 1);
    const bob = Math.sin(t * 6) * 4;
    ctx.fillStyle = clear ? 'rgba(255,255,255,0.9)' : 'rgba(255,140,120,0.85)';
    ctx.beginPath(); ctx.moveTo(colX(), ny - 26 + bob); ctx.lineTo(colX() - 14, ny - 6 + bob); ctx.lineTo(colX() + 14, ny - 6 + bob); ctx.closePath(); ctx.fill();
    if (level === 1 && f.k === 0 && f.row === 0) {
      ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(40,20,30,0.8)'; ctx.lineWidth = 4;
      ctx.strokeText('Tap up here to step', colX(), ny - 36 + bob);
      ctx.fillStyle = '#fff'; ctx.fillText('Tap up here to step', colX(), ny - 36 + bob);
    }
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lv) return;
  const sx = shakeT > 0 ? rand(-4, 4) * shakeT * 2 : 0;
  ctx.setTransform(scale, 0, 0, scale, sx * scale, offY * scale);
  drawSky();
  drawFarBank();
  drawRiverbed();
  drawRows();
  drawStreams();
  drawArk();
  drawNearBank();
  drawWaitingFamilies();
  drawActiveFamily();
  drawParticles();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (state === 'play' && playT < 0.5) {
    ctx.fillStyle = `rgba(20,14,34,${1 - playT / 0.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHudStrip(state === 'title' ? 'Crossing the Jordan' : `Level ${level} · ${cfg.name}`, state === 'title' ? null : 'SUN', clamp(timeLeft / cfg.time, 0, 1), chances, CHANCES,
    state === 'title' ? '' : `Across ${lv.crossed}/${cfg.families}`);
  drawMessage(Math.max(150, offY + 150));
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (!lv) return;
  if (state === 'play') {
    playT += dt;
    timeLeft -= dt;
    updateStreams(dt);
    if (timeLeft <= 0) { timeLeft = 0; fail('The sun went down before everyone crossed!'); }
    else updateFamily(dt);
  } else if (state === 'win') {
    winT += dt;
    updateStreams(dt);
    if (lv.fam && lv.fam.arriveT > 0) lv.fam.arriveT = Math.max(0.01, lv.fam.arriveT - dt);
    if (Math.random() < dt * 8) spawn(rand(0, viewW), rand(TOP_BANK - 200, TOP_BANK), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  } else if (state === 'fail') {
    failT += dt;
    updateStreams(dt);
    if (lv.fam && lv.fam.wet > 0) { lv.fam.wet = Math.max(0.01, lv.fam.wet - dt); lv.fam.washX += dt * 100; }
  } else if (state !== 'pause') {
    updateStreams(dt);
  }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
