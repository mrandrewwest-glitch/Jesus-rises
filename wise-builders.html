<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>The Wise Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Wise Builder</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script>
'use strict';

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// blend two #rrggbb colours
function mix(a, b, f) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// ============================================================
//  Tuning
// ============================================================
const BS = 48;            // one block, in world pixels
const GCOLS = 12;         // your build plot: columns 0..11
const GROWS = 10;         // ...and rows 0..9 above the valley floor
const WCOLS = 18;         // simulated columns: your plot, a gap (12), the neighbour's plot (13..17)
const NB_C0 = 13;         // the neighbour's plot starts here
const RIVER_C0 = 18;      // the river runs from here
const WORLD_L = -4 * BS;  // the rocky hill where Jesus teaches
const WORLD_R = 21 * BS;
const GROUND_Y = 670;     // logical y of the valley floor
const MAX_SPAN = 3;       // a block can reach this far sideways from a wall or pillar
const STORM_DUR = 12.5;   // seconds of storm
const BASE_FLOOD = -0.6;  // the river's normal level, in rows above the valley floor

// wind: how easily a loosely held block blows away; water: chance per tick to wash away when under the flood
const BLOCKS = {
  stone: { name: 'Stone',      cost: 2, wind: 0.3, water: 0 },
  plank: { name: 'Wood plank', cost: 1, wind: 1,   water: 0.06 },
  log:   { name: 'Log pillar', cost: 1, wind: 0.7, water: 0.03 },
  glass: { name: 'Window',     cost: 2, wind: 0.6, water: 0 },
  door:  { name: 'Door',       cost: 2, wind: 0.5, water: 0 },
  roof:  { name: 'Roof tile',  cost: 1, wind: 1.2, water: 0.08 },
};
const PALETTE = ['stone', 'plank', 'log', 'glass', 'door', 'roof', 'erase'];

const LEVELS = [
  { name: 'The Rocky Hill',  rockCols: 7, budget: 30, tall: 3, rooms: 1, windows: 1, flood: 0.7,  wind: 0.5,  gusts: [6, 7.6, 9.2],
    tip: 'Tip: build on the ROCK, on the left!' },
  { name: 'Windy Valley',    rockCols: 6, budget: 26, tall: 4, rooms: 1, windows: 2, flood: 1.0,  wind: 0.8,  gusts: [5.4, 6.6, 7.8, 9.2],
    tip: 'Stronger winds: keep your roof close to walls!' },
  { name: 'Two Rooms',       rockCols: 6, budget: 30, tall: 3, rooms: 2, windows: 2, flood: 1.3,  wind: 1.0,  gusts: [5.2, 6.2, 7.2, 8.2, 9.2],
    tip: 'The flood reaches the rock now: stone is strongest down low!' },
  { name: 'The Watchtower',  rockCols: 5, budget: 26, tall: 6, rooms: 1, windows: 2, flood: 1.45, wind: 1.15, gusts: [5.2, 6.2, 7.2, 8.2, 9.2], tower: true,
    tip: 'Build a tall tower, on the rock!' },
  { name: 'The Great Storm', rockCols: 5, budget: 32, tall: 6, rooms: 2, windows: 2, flood: 1.55, wind: 1.3,  gusts: [5, 5.9, 6.8, 7.7, 8.6, 9.4], tower: true,
    tip: 'The great storm is coming. Build wisely!' },
];

function makeConfig(n) {
  const base = LEVELS[Math.min(n, LEVELS.length) - 1];
  const extra = Math.max(0, n - LEVELS.length);
  return {
    ...base,
    name: n <= LEVELS.length ? base.name : `Storm ${n}`,
    budget: Math.max(24, base.budget - extra * 2),
    wind: Math.min(base.wind + extra * 0.1, 2),
    waterMul: 1 + extra * 0.15,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('buildersBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let phase = 'build';      // build | storm (while state === 'play')
let buildT = 0, stormT = 0;
let grid = new Array(WCOLS * GROWS).fill(null);   // {type, owner:'p'|'n', doom}
let er = new Array(WCOLS).fill(0);                // how many sand rows the flood has washed out, per column
let front = RIVER_C0;     // the flood's erosion front (a column), moving from the river toward the rock
let floodH = BASE_FLOOD;  // flood surface, in rows above the valley floor
let dark = 0, rainAmt = 0, windFx = 0;
let coins = 0, sel = 'stone', cursor = { c: 2, r: 1 }, hover = null, kbUsed = false;
let debris = [];
let particles = [];
let message = { text: '', t: 0 };
let msgQueue = [];
let flashT = 0, shakeT = 0, endTimer = 0;
let lastScore = null, lastFail = null;
let nbIdx = 0, nbTimer = 0, nbSay = { text: '', t: 0 }, nbSayIdx = 0, nbSayCd = 0, nbFell = false, nbShockT = 0;
let gustIdx = 0, tickT = 0, initialCount = 0, onRock = false, pShockT = 0, readyJoyT = 0, wasReady = false;
let stormMsg = 0, stormEndT = 0, bolt = null;
let ana = null, reqs = [];
let cam = { x: 0, zoom: 1 };

const idx = (c, r) => r * WCOLS + c;
function get(c, r) {
  if (c < 0 || c >= WCOLS || r < 0 || r >= GROWS) return null;
  return grid[idx(c, r)];
}
function setCell(c, r, v) { grid[idx(c, r)] = v; }
const colIsRock = (c) => c >= 0 && c < cfg.rockCols;
const groundRow = (c) => (colIsRock(c) ? 1 : 0);      // on the rock, row 0 is the rock itself
const groundOK = (c) => colIsRock(c) || er[c] === 0;   // is there still ground under this column?

// World y of the top of the ground in any column (y grows downward, valley floor = 0)
function terrainTop(c) {
  if (c < 0) return -2 * BS;                 // the hill where Jesus teaches
  if (c < cfg.rockCols) return -BS;          // the rock shelf
  if (c < RIVER_C0) return (er[c] || 0) * BS; // sand, lower as it washes away
  return 2.2 * BS;                           // river bed
}

// The foolish neighbour's house, in the order he builds it
const NB_PLAN = [
  [13, 0, 'door'], [17, 0, 'plank'], [13, 1, 'plank'], [17, 1, 'glass'], [13, 2, 'plank'], [17, 2, 'plank'],
  [13, 3, 'roof'], [14, 3, 'roof'], [15, 3, 'roof'], [16, 3, 'roof'], [17, 3, 'roof'],
  [14, 4, 'roof'], [15, 4, 'roof'], [16, 4, 'roof'],
];
const NB_LINES = [
  'Sand is soft, so quick to build!',
  'Rock? Too much hard work!',
  'What a lovely river view!',
  'Storms? Never happen here!',
  'Done already! Easy!',
];
// A sample house on the rock for the title screen
const DEMO_HOUSE = [
  [2, 1, 'door'], [2, 2, 'stone'], [5, 1, 'stone'], [5, 2, 'glass'],
  [2, 3, 'roof'], [3, 3, 'roof'], [4, 3, 'roof'], [5, 3, 'roof'],
];

// ============================================================
//  Support: blocks need something holding them up
// ============================================================
// Each block gets a "reach": 0 if it stands on a column going down to solid
// ground, +1 for every step sideways (or hanging) away from such a column.
// Anything further than MAX_SPAN away (or cut off completely) falls.
function computeSupport() {
  const N = WCOLS * GROWS;
  const d = new Array(N).fill(Infinity);
  for (let c = 0; c < WCOLS; c++) {
    const r = groundRow(c);
    if (grid[idx(c, r)] && groundOK(c)) d[idx(c, r)] = 0;
  }
  let changed = true, guard = 0;
  while (changed && guard++ < N) {
    changed = false;
    for (let r = 0; r < GROWS; r++) {
      for (let c = 0; c < WCOLS; c++) {
        const i = idx(c, r);
        if (!grid[i] || d[i] === 0) continue;
        let b = d[i];
        if (r > 0 && grid[idx(c, r - 1)]) b = Math.min(b, d[idx(c, r - 1)]);            // resting on
        if (r < GROWS - 1 && grid[idx(c, r + 1)]) b = Math.min(b, d[idx(c, r + 1)] + 1); // hanging from
        if (c > 0 && grid[idx(c - 1, r)]) b = Math.min(b, d[idx(c - 1, r)] + 1);
        if (c < WCOLS - 1 && grid[idx(c + 1, r)]) b = Math.min(b, d[idx(c + 1, r)] + 1);
        if (b < d[i]) { d[i] = b; changed = true; }
      }
    }
  }
  return d;
}

// ============================================================
//  Checking the house
// ============================================================
function analyse() {
  const top = new Array(GCOLS).fill(-1), topType = new Array(GCOLS).fill(null);
  let count = 0, height = 0, doors = 0, windows = 0, rockN = 0;
  for (let c = 0; c < GCOLS; c++) {
    for (let r = 0; r < GROWS; r++) {
      const b = get(c, r);
      if (!b || b.owner !== 'p') continue;
      count++;
      if (colIsRock(c)) rockN++;
      if (r > top[c]) { top[c] = r; topType[c] = b.type; }
      height = Math.max(height, r - groundRow(c) + 1);
      if (b.type === 'door' && r === groundRow(c)) doors++;
      if (b.type === 'glass') windows++;
    }
  }
  const isP = (c, r) => { const b = get(c, r); return !!(b && b.owner === 'p'); };
  // Inside a room: an empty cell with a block above it and walls to its left and right
  const inside = new Uint8Array(GCOLS * GROWS);
  for (let c = 0; c < GCOLS; c++) {
    for (let r = groundRow(c); r < top[c]; r++) {
      if (get(c, r)) continue;
      let L = false, R = false;
      for (let k = c - 1; k >= 0 && !L; k--) L = isP(k, r);
      for (let k = c + 1; k < GCOLS && !R; k++) R = isP(k, r);
      if (L && R) inside[r * GCOLS + c] = 1;
    }
  }
  // Count rooms (connected pockets) and check each is under roof tiles
  let rooms = 0, roofOK = true, anyInside = false;
  const seen = new Uint8Array(GCOLS * GROWS);
  for (let s = 0; s < inside.length; s++) {
    if (!inside[s] || seen[s]) continue;
    rooms++;
    const stack = [s]; seen[s] = 1;
    while (stack.length) {
      const k = stack.pop(), c = k % GCOLS, r = (k / GCOLS) | 0;
      anyInside = true;
      if (topType[c] !== 'roof') roofOK = false;
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= GCOLS || nr < 0 || nr >= GROWS) continue;
        const nk = nr * GCOLS + nc;
        if (inside[nk] && !seen[nk]) { seen[nk] = 1; stack.push(nk); }
      }
    }
  }
  if (!anyInside) roofOK = false;
  return { count, height, doors, windows, rooms, roofOK, rockN, inside };
}

// After the storm, every room must still be under its roof (no holes blown in it)
let insideBefore = null;
function roofIntact(a) {
  if (!insideBefore) return true;
  for (let k = 0; k < insideBefore.length; k++) if (insideBefore[k] && !a.inside[k]) return false;
  return true;
}

function reqList(a) {
  const sealed = phase === 'build' || roofIntact(a);
  return [
    { label: cfg.tower ? `A tower ${cfg.tall} blocks tall` : `At least ${cfg.tall} blocks tall`,
      ok: a.height >= cfg.tall, info: `${Math.min(a.height, cfg.tall)}/${cfg.tall}` },
    { label: cfg.rooms > 1 ? `${cfg.rooms} rooms under a roof` : 'A roof over a room',
      ok: a.roofOK && a.rooms >= cfg.rooms && sealed, info: cfg.rooms > 1 ? `${a.roofOK ? a.rooms : 0}/${cfg.rooms}` : '' },
    { label: 'A door on the ground', ok: a.doors >= 1, info: '' },
    { label: cfg.windows > 1 ? `${cfg.windows} windows` : 'A window',
      ok: a.windows >= cfg.windows, info: cfg.windows > 1 ? `${Math.min(a.windows, cfg.windows)}/${cfg.windows}` : '' },
  ];
}

// ============================================================
//  Building
// ============================================================
function canTouch(c, r) {
  if (r === groundRow(c)) return true;
  for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const b = get(c + dc, r + dr);
    if (b && c + dc < GCOLS) return true;
  }
  return false;
}

function placeCheck(c, r, type) {
  if (c < 0 || c >= GCOLS || r < 0 || r >= GROWS) return 'Build inside your plot';
  if (r < groundRow(c)) return 'That is solid rock!';
  const cur = get(c, r);
  if (type === 'erase') return cur ? '' : 'Nothing to clear there';
  if (cur) {
    if (cur.type === type) return 'Already there';
    return coins >= BLOCKS[type].cost - BLOCKS[cur.type].cost ? '' : 'Not enough coins!';
  }
  if (coins < BLOCKS[type].cost) return 'Not enough coins!';
  if (!canTouch(c, r)) return "Can't build in mid-air!";
  return '';
}

function tryPlace(c, r, type) {
  if (state !== 'play' || phase !== 'build') return false;
  const why = placeCheck(c, r, type);
  if (why) {
    if (why !== 'Already there' && why !== 'Nothing to clear there') { showMessage(why); sfx.bounce(); }
    return false;
  }
  if (type === 'erase') { eraseAt(c, r); return true; }
  const cur = get(c, r);
  if (cur) {
    coins -= BLOCKS[type].cost - BLOCKS[cur.type].cost;
    cur.type = type;
  } else {
    setCell(c, r, { type, owner: 'p', doom: -1 });
    const d = computeSupport();
    if (d[idx(c, r)] > MAX_SPAN) {
      setCell(c, r, null);
      showMessage('Too far from a wall. Add a pillar!');
      sfx.bounce();
      return false;
    }
    coins -= BLOCKS[type].cost;
  }
  puffAt(c, r, '#ffffff');
  sfx.tap(r / (GROWS - 1));
  return true;
}

function eraseAt(c, r) {
  const b = get(c, r);
  if (!b || b.owner !== 'p') return;
  coins += BLOCKS[b.type].cost;
  setCell(c, r, null);
  puffAt(c, r, '#fff6d0');
  // anything that was only held up by it comes down too (and you get the coins back)
  const d = computeSupport();
  for (let rr = 0; rr < GROWS; rr++) {
    for (let cc = 0; cc < GCOLS; cc++) {
      const o = get(cc, rr);
      if (o && o.owner === 'p' && d[idx(cc, rr)] > MAX_SPAN) {
        coins += BLOCKS[o.type].cost;
        setCell(cc, rr, null);
        puffAt(cc, rr, '#fff6d0');
      }
    }
  }
  sfx.erase();
}

function puffAt(c, r, color) {
  const x = (c + 0.5) * BS, y = -(r + 0.5) * BS;
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), sp = rand(30, 110);
    spawn(x + Math.cos(a) * 14, y + Math.sin(a) * 14, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.3, 0.6), color, rand(3, 6));
  }
}

function updateNeighbourBuild(dt) {
  if (nbIdx >= NB_PLAN.length) return;
  nbTimer -= dt;
  if (nbTimer > 0 || buildT < 0.8) return;
  const [c, r, type] = NB_PLAN[nbIdx++];
  setCell(c, r, { type, owner: 'n', doom: -1 });
  puffAt(c, r, '#fff3c4');
  nbTimer = 0.38;
}
function finishNeighbour() {
  while (nbIdx < NB_PLAN.length) {
    const [c, r, type] = NB_PLAN[nbIdx++];
    setCell(c, r, { type, owner: 'n', doom: -1 });
  }
}

// ============================================================
//  The storm
// ============================================================
const STORM_LINES = [
  [0, '"And the rain descended..."'],
  [2.3, '"...and the floods came..."'],
  [5, '"...and the winds blew..."'],
  [7.8, '"...and beat upon that house!"'],
];

function startStorm() {
  if (state !== 'play' || phase !== 'build') return;
  const missing = reqs.filter((q) => !q.ok);
  if (missing.length) {
    showMessage('Still needed: ' + missing[0].label.toLowerCase());
    sfx.bounce();
    return;
  }
  finishNeighbour();
  phase = 'storm';
  stormT = 0; stormMsg = 0; gustIdx = 0; tickT = 0; stormEndT = 0;
  initialCount = ana.count;
  insideBefore = ana.inside;
  onRock = ana.rockN >= ana.count * 0.9;
  hover = null;
  nbSay = { text: 'Uh oh... run for the rock!', t: 2.5 };
  sfx.thunder();
}

function updateStorm(dt) {
  stormT += dt;
  const T = STORM_DUR;
  const calm = T - 2.8;         // when the storm starts to clear
  dark = lerp(dark, stormT < calm ? 1 : 0, Math.min(1, dt * (stormT < calm ? 1.5 : 1)));
  rainAmt = stormT < calm ? clamp(stormT / 1.2, 0, 1) : clamp(1 - (stormT - calm) / 1.8, 0, 1);

  // Narration
  while (stormMsg < STORM_LINES.length && stormT >= STORM_LINES[stormMsg][0]) {
    showMessage(STORM_LINES[stormMsg][1]);
    stormMsg++;
  }

  // The flood rises, holds, then drains away
  if (stormT < 2) floodH = BASE_FLOOD;
  else if (stormT < 6) { const f = (stormT - 2) / 4; floodH = lerp(BASE_FLOOD, cfg.flood, f * f * (3 - 2 * f)); }
  else if (stormT < calm) floodH = cfg.flood + Math.sin(stormT * 3) * 0.04;
  else floodH = lerp(cfg.flood, BASE_FLOOD, clamp((stormT - calm) / 2.5, 0, 1));

  // The flood washes the sand away, from the river toward the rock. The rock does not move.
  if (stormT > 3) {
    const speed = (RIVER_C0 - cfg.rockCols) / 5.2;
    front = Math.max(cfg.rockCols, RIVER_C0 - (stormT - 3) * speed);
    for (let c = cfg.rockCols; c < WCOLS; c++) {
      const want = c >= front + 1.5 ? 2 : c >= front ? 1 : 0;
      if (want > er[c]) {
        er[c] = want;
        const x = (c + 0.5) * BS;
        for (let i = 0; i < 8; i++) spawn(x + rand(-20, 20), (want - 1) * BS + 10, rand(-40, 40), rand(-120, -40), 0.7, '#e8cf8a', rand(3, 6), 300);
      }
    }
  }

  // Wind gusts
  windFx = Math.max(0, windFx - dt * 0.9);
  if (gustIdx < cfg.gusts.length && stormT >= cfg.gusts[gustIdx]) {
    gustIdx++;
    windFx = 1;
    sfx.gust();
    applyWind();
  }

  // Lightning
  if (stormT > 0.8 && stormT < calm && Math.random() < dt * 0.4) {
    flashT = 0.25;
    bolt = { x: rand(40, W - 40), t: 0.22, seed: Math.random() };
    sfx.thunder();
  }

  // Water soaks and washes away weak blocks under the flood
  tickT -= dt;
  if (tickT <= 0) {
    tickT = 0.3;
    const yf = -floodH * BS;
    for (let r = 0; r < GROWS; r++) {
      for (let c = 0; c < WCOLS; c++) {
        const b = get(c, r);
        if (!b || b.doom >= 0) continue;
        if (-r * BS > yf + 8 && Math.random() < BLOCKS[b.type].water * cfg.waterMul) knockOff(c, r, 'wash');
      }
    }
  }

  settleBlocks(dt);

  // Neighbour's house falls
  if (!nbFell) {
    let n = 0;
    for (const b of grid) if (b && b.owner === 'n' && b.doom < 0) n++;
    if (n < NB_PLAN.length * 0.5) {
      nbFell = true; nbShockT = 2.6;
      nbSay = { text: 'My house!', t: 2.6 };
      showMessage('Great was the fall of it!');
      shakeT = 0.5;
      sfx.crash();
    }
  }

  // Finish once the storm is over and everything has settled
  if (stormT >= T) {
    const busy = grid.some((b) => b && b.doom >= 0) || debris.some((d) => !d.landed && !d.float);
    stormEndT += dt;
    if (!busy || stormEndT > 2) evaluate();
  }
}

// Anything that has lost its support starts to wobble, then falls
function settleBlocks(dt) {
  const d = computeSupport();
  for (let r = 0; r < GROWS; r++) {
    for (let c = 0; c < WCOLS; c++) {
      const b = get(c, r);
      if (!b) continue;
      if (b.doom < 0 && d[idx(c, r)] > MAX_SPAN) b.doom = 0.06 + r * 0.05 + rand(0, 0.12);
      if (b.doom >= 0) {
        b.doom -= dt;
        if (b.doom <= 0) knockOff(c, r, 'fall');
      }
    }
  }
}

// Wind blows off blocks that are held only loosely (two or more steps from a wall or pillar)
function applyWind() {
  const d = computeSupport();
  for (let r = GROWS - 1; r >= 0; r--) {
    for (let c = 0; c < WCOLS; c++) {
      const b = get(c, r);
      if (!b || b.doom >= 0) continue;
      const reach = d[idx(c, r)];
      if (reach < 2 || reach > MAX_SPAN) continue;
      const p = 0.18 * reach * cfg.wind * BLOCKS[b.type].wind;
      if (Math.random() < p) knockOff(c, r, 'wind');
    }
  }
}

function knockOff(c, r, how) {
  const b = get(c, r);
  if (!b) return;
  setCell(c, r, null);
  const x = (c + 0.5) * BS, y = -(r + 0.5) * BS;
  let vx = rand(-40, 40), vy = rand(-60, 0), vr = rand(-3, 3);
  if (how === 'wind') { vx = rand(220, 320); vy = rand(-220, -120); vr = rand(4, 8); }
  if (how === 'wash') { vx = rand(40, 90); vy = 0; vr = rand(-1, 1); }
  debris.push({ x, y, vx, vy, rot: 0, vr, type: b.type, life: 4.5, landed: false, float: false, owner: b.owner });
  if (b.owner === 'p') pShockT = 1.2;
  if (Math.random() < 0.5) sfx.thud();
}

function updateDebris(dt) {
  const yf = -floodH * BS;
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    const col = Math.floor(d.x / BS);
    const top = terrainTop(col);
    const wet = yf < top && d.y > yf - 4;
    if (wet) {
      // bob on the flood and drift off toward the river
      if (!d.float) {
        d.float = true;
        for (let k = 0; k < 8; k++) spawn(d.x + rand(-15, 15), yf, rand(-60, 60), rand(-140, -60), 0.6, '#d6efff', rand(2, 4), 400);
      }
      d.vy += (yf - 6 - d.y) * 10 * dt;
      d.vy *= Math.pow(0.1, dt);
      d.vx += (70 - d.vx) * dt;
      d.vr *= Math.pow(0.3, dt);
    } else if (!d.landed) {
      d.vy += 900 * dt;
      if (d.y + BS * 0.42 >= top && d.vy > 0) {
        d.y = top - BS * 0.42;
        if (d.vy > 120) { d.vy = -d.vy * 0.3; d.vx *= 0.6; d.vr *= -0.5; }
        else { d.landed = true; d.vy = 0; d.vx = 0; d.vr = 0; }
      }
    }
    if (d.landed) {
      d.float = false;
      if (d.y + BS * 0.42 < top - 2) d.landed = false;  // ground washed out from under it
    }
    d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (d.landed || d.float) d.life -= dt;
    if (d.life <= 0 || d.x > WORLD_R + 300) debris.splice(i, 1);
  }
}

// ============================================================
//  Win / fail
// ============================================================
function evaluate() {
  phase = 'done';
  const a = analyse();
  const rq = reqList(a);
  const met = rq.filter((q) => q.ok).length;
  const survive = initialCount ? a.count / initialCount : 0;
  const stands = survive >= 0.7 && met === rq.length;
  dark = Math.min(dark, 0.3);
  rainAmt = 0;
  if (stands) {
    state = 'win';
    const blocksPts = a.count * 20;
    const reqPts = met * 100;
    const coinPts = coins * 10;
    const rockPts = onRock ? 400 : 0;
    const levelBonus = level * 300;
    const score = blocksPts + reqPts + coinPts + rockPts + levelBonus;
    totalScore += score;
    if (totalScore > best) { best = totalScore; try { localStorage.setItem('buildersBest', best); } catch (e) {} }
    lastScore = { blocksPts, blocks: a.count, total: initialCount, reqPts, coinPts, rockPts, levelBonus, score };
    const hx = houseCentre();
    for (let i = 0; i < 70; i++) {
      const ang = rand(0, TAU), sp = rand(60, 220);
      spawn(hx, -3 * BS, Math.cos(ang) * sp, Math.sin(ang) * sp, rand(0.8, 1.8),
        ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(3, 5.5), 40);
    }
    nbSay = { text: 'Next time... the rock!', t: 4 };
    showMessage('It fell not!');
    sfx.win();
    endTimer = 2.4;
  } else {
    state = 'fail';
    lastFail = { survive, onRock, missing: rq.filter((q) => !q.ok).map((q) => q.label) };
    showMessage('Oh... no');
    sfx.fail();
    endTimer = 2.2;
  }
}

function houseCentre() {
  let s = 0, n = 0;
  for (let c = 0; c < GCOLS; c++) for (let r = 0; r < GROWS; r++) { const b = get(c, r); if (b && b.owner === 'p') { s += c; n++; } }
  return n ? (s / n + 0.5) * BS : 3 * BS;
}

function showMessage(text) { message = { text, t: 2.4 }; }

// ============================================================
//  People (drawn like the disciples in Jesus Rises)
// ============================================================
function drawDisciple(slot, look = { lx: 0, ly: -1 }) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);
  if (slot.row === 0) ctx.filter = 'brightness(0.92)';

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward whatever they are watching
  const { lx, ly } = look;

  // Arms raised behind the head for joy / pointing up in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && d.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// ============================================================
//  The builders, the neighbour and Jesus
// ============================================================
const BUILDER = {
  name: 'You', robe: '#3f6fb5', hair: '#6b3f1d', beard: false, skin: '#e3b184', i: 0,
  mood: 'watch', switchT: 0, delay: 0.05, blinkT: 2, blink: 0, phase: 0.5,
};
const NEIGHBOUR = {
  name: 'Neighbour', robe: '#d9822b', hair: '#2e1d10', beard: true, skin: '#c98d56', scarf: '#efd98a', i: 1,
  mood: 'joy', switchT: 0, delay: 0.1, blinkT: 3, blink: 0, phase: 2.1,
};
const FOLK = [BUILDER, NEIGHBOUR];
const JESUS = { x: -1.95 * BS, y: -2 * BS, face: 'calm', teach: true };
const BUILDER_X = -0.55 * BS, BUILDER_Y = -2 * BS;
const NB_X = 12.5 * BS;       // his spot next to his house
const NB_SAFE = -3.45 * BS;   // where he runs to when the storm comes: the rock!
let nbX = NB_X, nbY = 0;

function folkMoods() {
  let me = 'watch', nb = 'joy';
  if (state === 'win') { me = 'joy'; nb = 'dismay'; }
  else if (state === 'fail') { me = 'dismay'; nb = 'dismay'; }
  else if (state === 'play' && phase === 'build') {
    me = readyJoyT > 0 ? 'joy' : 'watch';
    nb = nbIdx < NB_PLAN.length ? 'joy' : 'watch';
  } else if (state === 'play') {
    me = pShockT > 0 ? 'shock' : 'worried';
    nb = nbShockT > 0 ? 'shock' : nbFell ? 'dismay' : 'worried';
  }
  return [me, nb];
}

function updateFolk(dt) {
  const moods = folkMoods();
  FOLK.forEach((d, k) => {
    const want = moods[k];
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  });
  JESUS.face = state === 'win' ? 'joy' : 'calm';
  JESUS.teach = state !== 'win';
  // when the storm comes, the neighbour runs for the rock
  let moving = false;
  if (state !== 'title' && (phase !== 'build' || state !== 'play') && stormT > 1) {
    const step = 380 * dt;
    if (Math.abs(nbX - NB_SAFE) > step) { nbX += Math.sign(NB_SAFE - nbX) * step; moving = true; }
    else nbX = NB_SAFE;
  }
  const nc = Math.floor(nbX / BS);
  const groundY = nc < 0 ? -2 * BS : nc < cfg.rockCols ? -BS : 0;
  nbY = lerp(nbY, groundY - (moving ? Math.abs(Math.sin(t * 14)) * 7 : 0), Math.min(1, dt * 12));
  // neighbour chatter while building
  nbSay.t -= dt;
  if (state === 'play' && phase === 'build') {
    nbSayCd -= dt;
    if (nbSayCd <= 0) {
      nbSay = { text: NB_LINES[nbSayIdx % NB_LINES.length], t: 3 };
      nbSayIdx++;
      nbSayCd = 5.5;
    }
  }
}

function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);

  const up = j.face === 'joy';

  if (up) {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Sandals
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.ellipse(-6, 0, 5, 2.5, 0, 0, TAU); ctx.ellipse(6, 0, 5, 2.5, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: raised in joy, or one hand lifted as He teaches
  let hands = [[-20, -22], [20, -22]];
  if (up) hands = [[-21, -66], [21, -66]];
  else if (j.teach) hands = [[-20, -22], [24, -50 + Math.sin(t * 2) * 3]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 500) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Chunky pixel textures (16 x 16, drawn without smoothing)
// ============================================================
function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function makeTex(seed, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  const R = mkRng(seed);
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  const pick = (arr) => arr[Math.floor(R() * arr.length)];
  draw(g, px, pick, R);
  return c;
}
function noiseFill(px, pick, cols) { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, pick(cols)); }
function edges(g, light, darkC) {
  g.fillStyle = light; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
  g.fillStyle = darkC; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // --- extra effects for the builder game ---
  erase() { this.puff(0.2); this.tone(520, 0.12, 'triangle', 0.18, 0, 260); },
  thud() { this.tone(rand(110, 150), 0.16, 'triangle', 0.3, 0, 60); this.puff(0.12); },
  gust() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(1300, t0 + 0.6); bp.frequency.exponentialRampToValueAtTime(400, t0 + 1.3);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.4); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.4);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 1.5);
  },
  crash() {
    this.thunder();
    for (let i = 0; i < 4; i++) this.tone(140 - i * 20, 0.25, 'triangle', 0.3, i * 0.12, 50);
  },
};

function endScreens(dt) {

function togglePause() {

      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
