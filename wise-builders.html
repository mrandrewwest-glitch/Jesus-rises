// The bottom bar, in playfield coordinates
function barLayout() {
  const top = H - 134;
  const pw = Math.min(W - 16, 620);
  const px = (W - pw) / 2;
  const sw = Math.min(360, pw - 30);
  const stormBtn = { x: (W - sw) / 2, y: H - 112, w: sw, h: 70 };
  return { top, px, pw, stormBtn };
}

// ============================================================
//  Rendering: sky and scenery
// ============================================================
const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(140, 330), w: rand(80, 160), speed: rand(4, 10) }));
const rain = Array.from({ length: 170 }, () => ({ x: Math.random(), y: rand(-1, 1), sp: rand(700, 950), len: rand(14, 24) }));
const stormClouds = [0.15, 0.5, 0.85].map((f, i) => ({ f, y: [70, 110, 60][i], phase: i * 2, w: 150 }));

function drawSky() {
  const k = dark;
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, mix('#bfe6ff', '#4b5568', k));
  g.addColorStop(0.55, mix('#8fcaf0', '#6a768a', k));
  g.addColorStop(1, mix('#e2f4ff', '#8e98a8', k));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);

  // Sun
  const sa = 1 - k;
  if (sa > 0.02) {
    const sx = W * 0.6, sy = 110;
    ctx.globalAlpha = sa;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.1);
    ctx.fillStyle = 'rgba(255,236,150,0.35)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(-8, 44); ctx.lineTo(0, 78); ctx.lineTo(8, 44); ctx.fill();
    }
    ctx.restore();
    const sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, 40);
    sg.addColorStop(0, '#fff6c2'); sg.addColorStop(1, '#ffd24a');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, 38, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Fluffy clouds, greyer in the storm
  for (const c of bgClouds) {
    const x = -offX - 150 + c.f * (viewW + 300);
    drawCloud(x, c.y, c.w, c.w * 0.3, mix('#ffffff', '#8a93a3', k), mix('#dbe9f6', '#6d7686', k));
  }

  // Distant hills
  ctx.fillStyle = mix('#b3d69a', '#6f8872', k);
  ctx.beginPath(); ctx.moveTo(-offX, GROUND_Y + 10);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, GROUND_Y - 70 - Math.sin(x / 110) * 26 - Math.sin(x / 41) * 8);
  ctx.lineTo(W + offX + 20, GROUND_Y + 10); ctx.fill();
}

function drawStormClouds() {
  if (dark < 0.05) return;
  ctx.globalAlpha = clamp(dark * 1.3, 0, 1);
  for (const s of stormClouds) {
    const x = -offX + s.f * viewW + Math.sin(t * 0.4 + s.phase) * 20;
    const y = s.y - offY * 0.5 + Math.sin(t * 1.5 + s.phase) * 3;
    drawCloud(x, y, s.w + 20, 50, '#6b7285', '#474d5c');
    // grumpy face
    ctx.strokeStyle = '#2d3140'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 16); ctx.lineTo(x - 5, y - 12);
    ctx.moveTo(x + 16, y - 16); ctx.lineTo(x + 5, y - 12);
    ctx.stroke();
    ctx.fillStyle = '#2d3140';
    ctx.beginPath(); ctx.arc(x - 9, y - 7, 2.3, 0, TAU); ctx.arc(x + 9, y - 7, 2.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + 5, 5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBolt() {
  if (!bolt || bolt.t <= 0) return;
  const R = mkRng(Math.floor(bolt.seed * 1e6));
  ctx.strokeStyle = '#fff59a'; ctx.lineWidth = 4; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 14; ctx.lineCap = 'round';
  ctx.beginPath();
  let x = bolt.x, y = 90 - offY * 0.5;
  ctx.moveTo(x, y);
  while (y < GROUND_Y - 160) { x += (R() - 0.5) * 60; y += 30 + R() * 25; ctx.lineTo(x, y); }
  ctx.stroke(); ctx.shadowBlur = 0;
}

function drawRain() {
  if (rainAmt <= 0.01) return;
  const n = Math.floor(rain.length * rainAmt);
  const slant = 0.25 + windFx * 0.5;
  ctx.strokeStyle = 'rgba(220,235,255,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const d = rain[i];
    const x = -offX + d.x * viewW, y = -offY + d.y * viewH;
    ctx.moveTo(x, y); ctx.lineTo(x - d.len * slant, y - d.len);
  }
  ctx.stroke();
  // gust streaks
  if (windFx > 0.05) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * windFx})`; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const y = 180 + i * 37 + Math.sin(i * 3.1) * 20;
      const x = -offX + ((i * 0.137 + t * 0.9) % 1) * (viewW + 200) - 100;
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 40, y - 6, x + 90, y);
    }
    ctx.stroke();
  }
}

function updateScenery(dt) {
  for (const c of bgClouds) {
    c.f += (c.speed * (1 + dark * 4) * dt) / (viewW + 300);
    if (c.f > 1) c.f -= 1;
  }
  const fall = 1 / viewH;
  for (const d of rain) {
    d.y += d.sp * dt * fall;
    d.x += d.sp * (0.25 + windFx * 0.5) * dt / viewW;
    if (d.y > 1) { d.y -= 1.05; d.x = Math.random(); }
    if (d.x > 1) d.x -= 1;
  }
  if (bolt) bolt.t -= dt;
}

// ============================================================
//  Rendering: the valley (world coordinates)
// ============================================================
function drawTerrain(visL, visR) {
  const c0 = Math.floor(visL / BS) - 1, c1 = Math.ceil(visR / BS) + 1;
  for (let c = c0; c <= c1; c++) {
    const x = c * BS;
    if (c < 0) {
      // the rocky hill where Jesus teaches
      for (let r = -2; r < 3; r++) drawTex(r === -2 ? 'rockTop' : 'rock', x, r * BS);
      ctx.fillStyle = '#5f636c'; ctx.fillRect(x, 3 * BS, BS + 0.8, 40 * BS);
    } else if (c < RIVER_C0 && spotAt(c)) {
      // a spot of rock under the sand (still covered if it hasn't been dug yet)
      const sp = spotAt(c);
      for (let r = 0; r < 3; r++) drawTex(r === 0 ? 'rockSand' : 'rock', x, r * BS);
      ctx.fillStyle = '#5f636c'; ctx.fillRect(x, 3 * BS, BS + 0.8, 40 * BS);
      if (sp.buried && !sp.dug) {
        let a = 1;
        if (phase === 'dig' && digSpot && digSpot.spot === sp) a = clamp(1 - (digT - 0.2) / 0.6, 0, 1);
        ctx.globalAlpha = a;
        drawTex('sandPebble', x, 0);
        drawTex('sand', x, BS);
        ctx.fillStyle = '#c9a060'; ctx.fillRect(x, 2 * BS, BS + 0.8, 40 * BS);
        ctx.globalAlpha = 1;
      }
    } else if (c < RIVER_C0) {
      // sand, washed away row by row in the flood
      const e = er[c] || 0;
      ctx.fillStyle = '#8f7446'; ctx.fillRect(x, e * BS, BS + 0.8, 2 * BS - e * BS);
      for (let r = e; r < 2; r++) drawTex(r === e ? 'sandTop' : 'sand', x, r * BS);
      ctx.fillStyle = e >= 2 ? '#8f7446' : '#c9a060'; ctx.fillRect(x, 2 * BS, BS + 0.8, 40 * BS);
    } else {
      // river bed
      ctx.fillStyle = '#b39159'; ctx.fillRect(x, 2.2 * BS, BS + 0.8, 40 * BS);
      ctx.fillStyle = '#9c7c47'; ctx.fillRect(x, 2.2 * BS, BS + 0.8, 6);
    }
  }
  // a smooth sandy bank down into the river
  ctx.fillStyle = '#e8cb80';
  const bx = RIVER_C0 * BS;
  ctx.beginPath(); ctx.moveTo(bx, (er[WCOLS - 1] || 0) * BS); ctx.quadraticCurveTo(bx + 20, 1.6 * BS, bx + 46, 2.2 * BS); ctx.lineTo(bx, 2.2 * BS); ctx.fill();

  // Level 1: a gentle sparkle on the rock
  if (level === 1 && state === 'play' && phase === 'choose') {
    for (const sp of cfg.spots) {
      for (let k = 0; k < 3; k++) {
        const ph = (t * 0.8 + k / 3) % 1;
        const x = (sp.c0 + ((k * 0.37 + Math.floor(t * 0.8 + k / 3) * 0.61) % 1) * sp.w) * BS;
        const y = 10 + ((k * 0.53) % 1) * 24;
        const s = Math.sin(ph * Math.PI) * 7;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.3, y - s * 0.3); ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.3, y + s * 0.3);
        ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.3, y + s * 0.3); ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.3, y - s * 0.3);
        ctx.fill();
      }
    }
  }
}

function drawSignpost() {
  if (level !== 1 || state !== 'play' || phase !== 'choose') return;
  const x = -3.25 * BS, y = -2 * BS;
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(x - 3, y - 64, 6, 64);
  ctx.save();
  ctx.translate(x, y - 58 + Math.sin(t * 2) * 1.5);
  ctx.fillStyle = '#d9a866'; ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-34, -12); ctx.lineTo(28, -12); ctx.lineTo(42, 0); ctx.lineTo(28, 12); ctx.lineTo(-34, 12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a18';
  ctx.font = '700 11px Fredoka, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Build on', 2, -1);
  ctx.fillText('the ROCK', 2, 10);
  ctx.restore();
}

function drawBlocks() {
  for (let r = 0; r < GROWS; r++) {
    for (let c = 0; c < WCOLS; c++) {
      const b = get(c, r);
      if (!b) continue;
      let dx = 0, dy = 0;
      if (b.doom >= 0) { dx = rand(-2.5, 2.5); dy = rand(-1, 1); }
      drawTex(b.type, c * BS + dx, -(r + 1) * BS + dy);
    }
  }
}

function drawDebris() {
  for (const d of debris) {
    ctx.save();
    ctx.globalAlpha = clamp(d.life, 0, 1);
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    drawTex(d.type, -BS * 0.42, -BS * 0.42, BS * 0.84);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawWater(visL, visR) {
  const yf = -floodH * BS;
  const c0 = Math.floor(visL / BS) - 1, c1 = Math.ceil(visR / BS) + 1;
  ctx.fillStyle = 'rgba(58,140,220,0.55)';
  const cols = [];
  for (let c = c0; c <= c1; c++) {
    const top = terrainTop(c);
    if (top > yf) { ctx.fillRect(c * BS, yf, BS + 0.5, top - yf); cols.push(c); }
  }
  // wavy, shining surface
  ctx.strokeStyle = 'rgba(225,245,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const c of cols) {
    for (let k = 0; k <= 4; k++) {
      const x = c * BS + k * BS / 4;
      const y = yf + Math.sin(x / 18 + t * (3 + dark * 3)) * (1.5 + dark * 2.5);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  // the river flows
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const x = RIVER_C0 * BS + ((i * 57 + t * 40) % (3.5 * BS)) + 10;
    const y = yf + 14 + (i % 3) * 14;
    if (y < 2.2 * BS - 6) { ctx.moveTo(x, y); ctx.lineTo(x + 16, y); }
  }
  ctx.stroke();
}


// Step 1: a glowing outline shows where the foundation would go (mouse / keyboard)
function drawFootprint() {
  if (state !== 'play' || phase !== 'choose') return;
  const c = hoverC !== null ? hoverC : kbUsed ? pickC : null;
  if (c === null) return;
  const fp = footprintAt(c);
  const pulse = 0.5 + 0.5 * Math.sin(t * 6);
  const good = fp.kind === 'rock' || fp.kind === 'buried';
  if (fp.kind !== 'small') {
    ctx.globalAlpha = 0.45 + pulse * 0.15;
    for (let k = 0; k < fp.w; k++) drawTex('stone', (fp.c0 + k) * BS + 4, -BS + 4, BS - 8);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = fp.kind === 'small' ? `rgba(220,80,60,${0.6 + pulse * 0.4})` : `rgba(255,226,110,${0.7 + pulse * 0.3})`;
  ctx.lineWidth = 4;
  ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 30;
  roundRect(fp.c0 * BS + 2, -BS + 2, fp.w * BS - 4, BS * 2 - 4, 10); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineJoin = 'round';
  const label = { rock: 'ROCK', buried: 'Dig here?', sand: 'SAND', small: 'Too small' }[fp.kind];
  const lx = (fp.c0 + fp.w / 2) * BS, ly = -BS - 12;
  ctx.strokeText(label, lx, ly);
  ctx.fillStyle = good ? '#4f5561' : fp.kind === 'small' ? '#b23a2a' : '#a8741a';
  ctx.fillText(label, lx, ly);
}

// Step 2: the glowing blueprint squares
function drawGhosts() {
  if (state !== 'play' || phase !== 'build') return;
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  for (const q of bp) {
    if (q.done) continue;
    const x = q.c * BS, y = -(q.r + 1) * BS;
    ctx.globalAlpha = 0.38 + pulse * 0.12;
    drawTex(q.type, x + 4, y + 4, BS - 8);
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.shadowColor = '#fff1a0'; ctx.shadowBlur = 10 + pulse * 8;
    ctx.strokeStyle = `rgba(255,226,110,${0.7 + pulse * 0.3})`;
    ctx.lineWidth = 3;
    roundRect(x + 3, y + 3, BS - 6, BS - 6, 6); ctx.stroke();
    ctx.restore();
  }
  if (kbUsed && !houseDone()) {
    ctx.strokeStyle = `rgba(255,255,255,${0.6 + pulse * 0.4})`;
    ctx.lineWidth = 5;
    ctx.strokeRect(cursor.c * BS + 1, -(cursor.r + 1) * BS + 1, BS - 2, BS - 2);
  }
}

function drawRainbow() {
  if (state !== 'win') return;
  const cx = houseCentre();
  const bows = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
  ctx.globalAlpha = 0.55; ctx.lineWidth = 12;
  bows.forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(cx, 0, 7.5 * BS - i * 12, Math.PI, TAU); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}


function drawPeople() {
  drawJesus(JESUS);
  drawDisciple({ d: BUILDER, x: BUILDER_X, y: BUILDER_Y, s: 0.95, row: 1 }, lookFor(BUILDER_X, BUILDER_Y));
  drawDisciple({ d: NEIGHBOUR, x: nbX, y: nbY, s: 0.95, row: 1 }, lookFor(nbX, nbY));
  if (state === 'play' && (phase === 'choose' || phase === 'dig' || phase === 'build')) {
    ctx.font = '700 13px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.fillStyle = '#2f4f8a';
    ctx.strokeText('You', BUILDER_X, BUILDER_Y + 16); ctx.fillText('You', BUILDER_X, BUILDER_Y + 16);
  }
}

// where each person is looking
function lookFor(x, y) {
  let tx = houseCentre(), ty = -2 * BS;
  if (state === 'play' && (phase === 'choose' || phase === 'dig')) {
    tx = ((hoverC !== null ? hoverC : pickC) + 0.5) * BS; ty = 0;
  } else if (state === 'play' && phase === 'build') {
    const q = kbUsed ? cursor : nextGhost() || cursor;
    tx = (q.c + 0.5) * BS; ty = -(q.r + 0.5) * BS;
  }
  if (x === nbX) {
    tx = 15 * BS; ty = -3 * BS;
    if (state === 'play' && phase !== 'storm' && phase !== 'done') tx = x - 200;
  }
  const dx = tx - x, dy = ty - (y - 52);
  const len = Math.hypot(dx, dy) || 1;
  return { lx: dx / len, ly: dy / len };
}

function drawBubble(text, wx, wy) {
  const p = toLogical(wx, wy);
  ctx.font = '600 14px Fredoka, sans-serif';
  const tw = ctx.measureText(text).width;
  const w = tw + 20, h = 28;
  const x = clamp(p.x - w / 2, 8 - offX, W + offX - w - 8);
  const y = p.y - h - 12;
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = 'rgba(120,90,40,0.5)'; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  const tx = clamp(p.x, x + 14, x + w - 14);
  ctx.beginPath(); ctx.moveTo(tx - 7, y + h - 1); ctx.lineTo(tx, y + h + 9); ctx.lineTo(tx + 7, y + h - 1); ctx.fill();
  ctx.fillStyle = '#5a4210';
  ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + 19);
}


// A cartoon hand pointing down at (x, y), bobbing: "tap here!"
function drawHand(x, y) {
  const bob = Math.abs(Math.sin(t * 5)) * 12;
  ctx.save();
  ctx.translate(x + 6, y - 4 - bob);
  ctx.rotate(-0.25);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 2.5;
  // sleeve
  ctx.fillStyle = '#3f6fb5';
  roundRect(-15, -84, 30, 22, 6); ctx.fill(); ctx.stroke();
  // palm with curled fingers
  ctx.fillStyle = '#f2c9a0';
  roundRect(-16, -66, 32, 30, 11); ctx.fill(); ctx.stroke();
  // pointing finger
  roundRect(-6, -48, 12, 48, 6); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(122,74,34,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-14, -48); ctx.lineTo(-7, -48); ctx.moveTo(7, -48); ctx.lineTo(14, -48); ctx.stroke();
  ctx.restore();
  // tap ripple at the fingertip
  const k = (t * 1.2) % 1;
  ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 6 + k * 26, 0, TAU); ctx.stroke();
}

function handTarget() {
  if (state !== 'play') return null;
  const show = level === 1 || idleT > 5;
  if (!show) return null;
  const L = barLayout();
  if (phase === 'choose') {
    // point at the rock spot that is big enough for the house
    const sp = cfg.spots.find((q) => q.w >= cfg.plan.w);
    return toLogical((sp.c0 + sp.w / 2) * BS, BS * 0.35);
  }
  if (phase === 'build') {
    if (houseDone()) return { x: L.stormBtn.x + L.stormBtn.w * 0.72, y: L.stormBtn.y + L.stormBtn.h * 0.55 };
    const q = nextGhost();
    if (q) return toLogical((q.c + 0.5) * BS, -(q.r + 0.5) * BS);
  }
  return null;
}

// ============================================================
//  Rendering: HUD, step banner, bottom bar
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = dark > 0.5 ? '#fff6dc' : '#5a4210';
  ctx.shadowColor = dark > 0.5 ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 4;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Wise Builder' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 13px Fredoka, sans-serif';
  if (state !== 'title') ctx.fillText(`SCORE ${totalScore}`, 12, 48);
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  drawBanner();
  ctx.restore();
}

// The big "what to do now" banner
function bannerStep() {
  if (state !== 'play') return null;
  if (phase === 'choose' || phase === 'dig') return ['1', 'Find the rock and lay your foundation'];
  if (phase === 'build') return houseDone() ? ['3', 'Let the storm come!'] : ['2', 'Tap the glowing squares to build your house'];
  return null;
}

function wrapText(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return [text];
  const words = text.split(' ');
  let bestSplit = 1, bestW = Infinity;
  for (let k = 1; k < words.length; k++) {
    const w = Math.max(ctx.measureText(words.slice(0, k).join(' ')).width, ctx.measureText(words.slice(k).join(' ')).width);
    if (w < bestW) { bestW = w; bestSplit = k; }
  }
  return [words.slice(0, bestSplit).join(' '), words.slice(bestSplit).join(' ')];
}

function drawBanner() {
  bannerBottom = 0;
  const step = bannerStep();
  if (!step) return;
  const w = Math.min(viewW - 20, 640);
  const x = (viewW - w) / 2, y = 112;
  const circle = 48;
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(step[1], w - circle - 40);
  const h = lines.length > 1 ? 80 : 60;
  const pop = 1 + Math.max(0, 0.08 - levelT * 0.1);
  ctx.fillStyle = 'rgba(255,252,240,0.96)';
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(x, y, w, h, 18); ctx.fill(); ctx.stroke();
  // step number
  const cx = x + 14 + circle / 2, cy = y + h / 2;
  const g = ctx.createLinearGradient(0, cy - circle / 2, 0, cy + circle / 2);
  g.addColorStop(0, '#f7c948'); g.addColorStop(1, '#d9961c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, circle / 2 * pop, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = '700 28px Fredoka, sans-serif';
  ctx.fillText(step[0], cx, cy + 10);
  // words
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 24px Fredoka, sans-serif';
  const tx = x + circle + 24 + (w - circle - 34) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, tx, cy + 9 + (i - (lines.length - 1) / 2) * 30));
  bannerBottom = y + h;
}

function drawBigButton(b, top, bottom, rim, label, sub, pulse = 0, icon = null) {
  const p = pulse;
  ctx.fillStyle = rim;
  roundRect(b.x - p, b.y + 5 - p / 2, b.w + p * 2, b.h + p, 22); ctx.fill();
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  roundRect(b.x - p, b.y - p / 2, b.w + p * 2, b.h + p, 22); ctx.fill();
  let tx = b.x + b.w / 2;
  if (icon) {
    const s = Math.min(46, b.h - 30);
    drawTex(icon, b.x + 14, b.y + (b.h - s) / 2, s);
    tx = b.x + 14 + s + (b.w - 14 - s) / 2;
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(60,40,0,0.6)'; ctx.shadowBlur = 3;
  if (sub) {
    ctx.font = '600 15px Fredoka, sans-serif';
    ctx.fillText(sub, tx, b.y + b.h / 2 - 8);
    ctx.font = '700 28px Fredoka, sans-serif';
    ctx.fillText(label, tx, b.y + b.h / 2 + 22);
  } else {
    ctx.font = `700 ${b.w < 330 ? 22 : 26}px Fredoka, sans-serif`;
    ctx.fillText(label, tx, b.y + b.h / 2 + 9);
  }
  ctx.shadowBlur = 0;
}

function drawBar() {
  const L = barLayout();
  ctx.fillStyle = 'rgba(58,44,28,0.8)';
  roundRect(L.px, L.top, L.pw, H - L.top + 30, 18); ctx.fill();

  if (state === 'play' && (phase === 'choose' || phase === 'dig')) {
    // rock vs sand, as two little picture cards
    const cw = Math.min(250, (L.pw - 40) / 2), gap = 12, cy = H - 116, ch = 86;
    const cards = [
      { x: W / 2 - gap / 2 - cw, tex: 'rockSand', title: 'Rock', line: 'Stands firm', col: '#dfe3e8' },
      { x: W / 2 + gap / 2, tex: 'sandTop', title: 'Sand', line: 'Washes away', col: '#f6e3b0' },
    ];
    for (const k of cards) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      roundRect(k.x, cy, cw, ch, 16); ctx.fill();
      const s = 50;
      drawTex(k.tex, k.x + 12, cy + (ch - s) / 2, s);
      ctx.textAlign = 'left';
      ctx.fillStyle = k.col;
      ctx.font = '700 24px Fredoka, sans-serif';
      ctx.fillText(k.title, k.x + s + 24, cy + 38);
      ctx.font = '600 15px Fredoka, sans-serif';
      ctx.fillStyle = 'rgba(255,246,220,0.85)';
      ctx.fillText(k.line, k.x + s + 24, cy + 62);
    }
  } else if (state === 'play' && phase === 'build' && !houseDone()) {
    // progress
    const bw = Math.min(420, L.pw - 40), bx = (W - bw) / 2, by = H - 76;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff6dc';
    ctx.font = '700 22px Fredoka, sans-serif';
    ctx.fillText(`House: ${placed}/${bp.length} blocks`, W / 2, H - 90);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    roundRect(bx, by, bw, 24, 12); ctx.fill();
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#f7c948'); g.addColorStop(1, '#fff1a8');
    ctx.fillStyle = g;
    if (placed > 0) { roundRect(bx, by, Math.max(24, bw * placed / bp.length), 24, 12); ctx.fill(); }
    if (cfg.timeLimit) {
      const s = Math.max(0, Math.ceil(timeLeft));
      ctx.fillStyle = s <= 10 && Math.sin(t * 10) > 0 ? '#ff9b8a' : '#fff6dc';
      ctx.font = '700 17px Fredoka, sans-serif';
      ctx.fillText(`Storm clouds arrive in ${s}s`, W / 2, H - 22);
    }
  } else if (state === 'play' && phase === 'build') {
    drawBigButton(L.stormBtn, '#f7c948', '#d9961c', '#a8741a', 'Let the storm come!', null, Math.sin(t * 5) * 3);
  } else {
    // Matthew 7:25, lit up as it happens
    const vt = (k) => Bible.verse(VERSES[k]).text;
    const parts = [
      [vt('rain') + ', ', 0], [vt('floods') + ', ', 2.3],
      [vt('winds') + ', ', 5], [vt('beat'), 7.8],
    ];
    const lines = [[parts[0], parts[1]], [parts[2], parts[3]]];
    ctx.font = 'italic 600 16px Fredoka, sans-serif';
    ctx.textAlign = 'left';
    const live = state === 'play' ? stormT : 99;
    lines.forEach((ln, i) => {
      const total = ln.reduce((s, p) => s + ctx.measureText(p[0]).width, 0);
      let x = W / 2 - total / 2;
      for (const [txt, at] of ln) {
        ctx.fillStyle = live >= at ? '#fff6dc' : 'rgba(255,246,220,0.3)';
        ctx.fillText(txt, x, H - 88 + i * 26);
        x += ctx.measureText(txt).width;
      }
    });
    ctx.textAlign = 'center';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillStyle = 'rgba(255,246,220,0.6)';
    ctx.fillText(Bible.verse(VERSES.rain).cite, W / 2, H - 28);
  }
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const y = Math.max(bannerBottom ? bannerBottom - offY + 38 : 160, GROUND_Y - GROWS * BS * cam.zoom - 24);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, W - 30);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#7a5200';
  lines.forEach((ln, i) => {
    const tw = ctx.measureText(ln).width;
    if (tw > W - 20) ctx.font = `700 ${Math.floor(24 * (W - 20) / tw)}px Fredoka, sans-serif`;
    ctx.strokeText(ln, W / 2, y + i * 30);
    ctx.fillText(ln, W / 2, y + i * 30);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawStormClouds();
  drawBolt();

  // The valley, through the camera
  ctx.save();
  ctx.translate(W / 2, GROUND_Y);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, 0);
  const visL = cam.x - (W / 2 + offX + 10) / cam.zoom, visR = cam.x + (W / 2 + offX + 10) / cam.zoom;
  drawRainbow();
  drawTerrain(visL, visR);
  drawSignpost();
  drawFootprint();
  drawBlocks();
  drawGhosts();
  drawPeople();
  drawDebris();
  drawWater(visL, visR);
  drawParticles();
  ctx.restore();

  // Speech bubbles
  if (nbSay.t > 0) drawBubble(nbSay.text, nbX, nbY - 70);

  drawRain();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 50, 0, TAU); ctx.stroke();
  }

  if (state !== 'title') drawBar();
  const hand = handTarget();
  if (hand) drawHand(hand.x, hand.y);

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
let camSnapped = false;
function update(dt) {
  t += dt;
  updateScenery(dt);
  updateParticles(dt);
  updateFolk(dt);
  updateCamera(dt, !camSnapped);
  camSnapped = true;
  if (state === 'play') {
    levelT += dt;
    idleT += dt;
    if (phase === 'choose' || phase === 'dig' || phase === 'build') updateNeighbourBuild(dt);
    if (phase === 'dig') updateDig(dt);
    if (phase === 'build') {
      buildT += dt;
      if (cfg.timeLimit && !houseDone()) {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timedOut = true;
          showMessage('The storm is here!');
          startStorm(true);
        }
      }
    } else if (phase === 'storm') {
      updateStorm(dt);
    }
  }
  if (state === 'play' || state === 'win' || state === 'fail') updateDebris(dt);
  if (state === 'win' || state === 'fail') {
    dark = lerp(dark, 0, Math.min(1, dt * 1.5));
    floodH = lerp(floodH, BASE_FLOOD, Math.min(1, dt));
    if (state === 'win' && Math.random() < dt * 10) {
      spawn(houseCentre() + rand(-90, 90), -rand(0, 5) * BS, 0, -25, 1.2, '#fff6d0', 3);
    }
  }
  pShockT = Math.max(0, pShockT - dt);
  nbShockT = Math.max(0, nbShockT - dt);
  readyJoyT = Math.max(0, readyJoyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' ? rainAmt * 0.8 : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
