// ============================================================
//  Camera: the whole valley, or zoomed in on your plot
// ============================================================
function camTarget() {
  const all = state !== 'play' || phase !== 'build' || buildT < 2.2;
  const x0 = all ? WORLD_L : -1.6 * BS, x1 = all ? 19 * BS : 12.6 * BS;
  const zoom = Math.min(1, W / (x1 - x0), (GROUND_Y - 170) / (GROWS * BS));
  const half = (W / 2) / zoom;
  let x = (x0 + x1) / 2;
  if (half * 2 >= WORLD_R - WORLD_L) x = (WORLD_L + WORLD_R) / 2;
  else x = clamp(x, WORLD_L + half, WORLD_R - half);
  return { x, zoom };
}
function updateCamera(dt, snap) {
  const tg = camTarget();
  const f = snap ? 1 : Math.min(1, dt * 3);
  cam.x = lerp(cam.x, tg.x, f);
  cam.zoom = lerp(cam.zoom, tg.zoom, f);
}
function toWorld(lx, ly) { return { x: (lx - W / 2) / cam.zoom + cam.x, y: (ly - GROUND_Y) / cam.zoom }; }
function toLogical(wx, wy) { return { x: W / 2 + (wx - cam.x) * cam.zoom, y: GROUND_Y + wy * cam.zoom }; }

// ============================================================
//  Input
// ============================================================
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Backspace'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || phase !== 'build') return;
  const dig = /^(Digit|Numpad)([1-7])$/.exec(e.code);
  if (dig) { sel = PALETTE[+dig[2] - 1]; sfx.puff(0.12); return; }
  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.code];
  if (mv) {
    kbUsed = true;
    cursor.c = clamp(cursor.c + mv[0], 0, GCOLS - 1);
    cursor.r = clamp(cursor.r + mv[1], 0, GROWS - 1);
    if (cursor.r < groundRow(cursor.c)) cursor.r = groundRow(cursor.c);
    return;
  }
  if (e.code === 'Space') { kbUsed = true; tryPlace(cursor.c, cursor.r, sel); return; }
  if (e.code === 'KeyX' || e.code === 'Backspace' || e.code === 'Delete') { kbUsed = true; tryPlace(cursor.c, cursor.r, 'erase'); return; }
  if (e.code === 'Enter' && !e.repeat) startStorm();
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function cellAt(p) {
  const w = toWorld(p.x, p.y);
  return { c: Math.floor(w.x / BS), r: Math.floor(-w.y / BS) };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play' || phase !== 'build') return;
  kbUsed = false;
  const L = barLayout();
  for (const s of L.slots) {
    if (p.x >= s.x - 3 && p.x <= s.x + s.w + 3 && p.y >= s.y - 6 && p.y <= s.y + s.w + 6) { sel = s.type; sfx.puff(0.12); return; }
  }
  const b = L.btn;
  if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { startStorm(); return; }
  if (p.y > L.top) return;
  const { c, r } = cellAt(p);
  if (c >= 0 && c < GCOLS && r >= 0 && r < GROWS) {
    cursor = { c, r: Math.max(r, groundRow(c)) };
    ripples.push({ x: p.x, y: p.y, t: 0 });
    tryPlace(c, r, sel);
  } else if (c >= NB_C0 && c < RIVER_C0 && r >= 0 && r < GROWS && get(c, r)) {
    showMessage("That's your neighbour's house!");
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const p = toPlayfield(e);
  const { c, r } = cellAt(p);
  hover = c >= 0 && c < GCOLS && r >= groundRow(c) && r < GROWS && p.y < barLayout().top ? { c, r } : null;
  if (hover) kbUsed = false;
});
canvas.addEventListener('pointerleave', () => { hover = null; });
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// The hotbar and the storm button, in playfield coordinates
function barLayout() {
  const n = PALETTE.length, gap = 6;
  const sw = Math.min(62, (W - 24 - gap * (n - 1)) / n);
  const total = n * sw + (n - 1) * gap;
  const x0 = (W - total) / 2, y = H - 124;
  const slots = PALETTE.map((type, i) => ({ type, i, x: x0 + i * (sw + gap), y, w: sw }));
  const bw = Math.min(300, W - 190);
  const pw = Math.min(W - 16, Math.max(total + 36, 600));
  return { top: H - 134, slots, btn: { x: (W - bw) / 2, y: H - 54, w: bw, h: 44 }, px: (W - pw) / 2, pw };
}

// ============================================================
//  Rendering: sky and scenery
// ============================================================
const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(140, 330), w: rand(80, 160), speed: rand(4, 10) }));
const rain = Array.from({ length: 170 }, () => ({ x: Math.random(), y: rand(-1, 1), sp: rand(700, 950), len: rand(14, 24) }));
const stormClouds = [0.15, 0.5, 0.85].map((f, i) => ({ f, y: [70, 110, 60][i], phase: i * 2, w: 150 }));

function drawSky() {
  const k = dark;
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, mix('#bfe6ff', '#4b5568', k));
  g.addColorStop(0.55, mix('#8fcaf0', '#6a768a', k));
  g.addColorStop(1, mix('#e2f4ff', '#8e98a8', k));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);

  // Sun
  const sa = 1 - k;
  if (sa > 0.02) {
    const sx = W * 0.6, sy = 110;
    ctx.globalAlpha = sa;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.1);
    ctx.fillStyle = 'rgba(255,236,150,0.35)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(-8, 44); ctx.lineTo(0, 78); ctx.lineTo(8, 44); ctx.fill();
    }
    ctx.restore();
    const sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, 40);
    sg.addColorStop(0, '#fff6c2'); sg.addColorStop(1, '#ffd24a');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, 38, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Fluffy clouds, greyer in the storm
  for (const c of bgClouds) {
    const x = -offX - 150 + c.f * (viewW + 300);
    drawCloud(x, c.y, c.w, c.w * 0.3, mix('#ffffff', '#8a93a3', k), mix('#dbe9f6', '#6d7686', k));
  }

  // Distant hills
  ctx.fillStyle = mix('#b3d69a', '#6f8872', k);
  ctx.beginPath(); ctx.moveTo(-offX, GROUND_Y + 10);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, GROUND_Y - 70 - Math.sin(x / 110) * 26 - Math.sin(x / 41) * 8);
  ctx.lineTo(W + offX + 20, GROUND_Y + 10); ctx.fill();
}

function drawStormClouds() {
  if (dark < 0.05) return;
  ctx.globalAlpha = clamp(dark * 1.3, 0, 1);
  for (const s of stormClouds) {
    const x = -offX + s.f * viewW + Math.sin(t * 0.4 + s.phase) * 20;
    const y = s.y - offY * 0.5 + Math.sin(t * 1.5 + s.phase) * 3;
    drawCloud(x, y, s.w + 20, 50, '#6b7285', '#474d5c');
    // grumpy face
    ctx.strokeStyle = '#2d3140'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 16); ctx.lineTo(x - 5, y - 12);
    ctx.moveTo(x + 16, y - 16); ctx.lineTo(x + 5, y - 12);
    ctx.stroke();
    ctx.fillStyle = '#2d3140';
    ctx.beginPath(); ctx.arc(x - 9, y - 7, 2.3, 0, TAU); ctx.arc(x + 9, y - 7, 2.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + 5, 5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBolt() {
  if (!bolt || bolt.t <= 0) return;
  const R = mkRng(Math.floor(bolt.seed * 1e6));
  ctx.strokeStyle = '#fff59a'; ctx.lineWidth = 4; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 14; ctx.lineCap = 'round';
  ctx.beginPath();
  let x = bolt.x, y = 90 - offY * 0.5;
  ctx.moveTo(x, y);
  while (y < GROUND_Y - 160) { x += (R() - 0.5) * 60; y += 30 + R() * 25; ctx.lineTo(x, y); }
  ctx.stroke(); ctx.shadowBlur = 0;
}

function drawRain() {
  if (rainAmt <= 0.01) return;
  const n = Math.floor(rain.length * rainAmt);
  const slant = 0.25 + windFx * 0.5;
  ctx.strokeStyle = 'rgba(220,235,255,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const d = rain[i];
    const x = -offX + d.x * viewW, y = -offY + d.y * viewH;
    ctx.moveTo(x, y); ctx.lineTo(x - d.len * slant, y - d.len);
  }
  ctx.stroke();
  // gust streaks
  if (windFx > 0.05) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * windFx})`; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const y = 180 + i * 37 + Math.sin(i * 3.1) * 20;
      const x = -offX + ((i * 0.137 + t * 0.9) % 1) * (viewW + 200) - 100;
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 40, y - 6, x + 90, y);
    }
    ctx.stroke();
  }
}

function updateScenery(dt) {
  for (const c of bgClouds) {
    c.f += (c.speed * (1 + dark * 4) * dt) / (viewW + 300);
    if (c.f > 1) c.f -= 1;
  }
  const fall = 1 / viewH;
  for (const d of rain) {
    d.y += d.sp * dt * fall;
    d.x += d.sp * (0.25 + windFx * 0.5) * dt / viewW;
    if (d.y > 1) { d.y -= 1.05; d.x = Math.random(); }
    if (d.x > 1) d.x -= 1;
  }
  if (bolt) bolt.t -= dt;
}

// ============================================================
//  Rendering: the valley (world coordinates)
// ============================================================
function drawTerrain(visL, visR) {
  const c0 = Math.floor(visL / BS) - 1, c1 = Math.ceil(visR / BS) + 1;
  for (let c = c0; c <= c1; c++) {
    const x = c * BS;
    if (c < cfg.rockCols) {
      // the rock: the hill on the left and the shelf you may build upon
      const top = c < 0 ? -2 : -1;
      for (let r = top; r < 3; r++) drawTex(r === top ? 'rockTop' : 'rock', x, r * BS);
      ctx.fillStyle = '#5f636c'; ctx.fillRect(x, 3 * BS, BS, 40 * BS);
    } else if (c < RIVER_C0) {
      // sand, washed away row by row in the flood
      const e = er[c] || 0;
      ctx.fillStyle = '#8f7446'; ctx.fillRect(x, e * BS, BS, 2 * BS - e * BS);
      for (let r = e; r < 2; r++) drawTex(r === e ? 'sandTop' : 'sand', x, r * BS);
      ctx.fillStyle = e >= 2 ? '#8f7446' : '#c9a060'; ctx.fillRect(x, 2 * BS, BS, 40 * BS);
    } else {
      // river bed
      ctx.fillStyle = '#b39159'; ctx.fillRect(x, 2.2 * BS, BS, 40 * BS);
      ctx.fillStyle = '#9c7c47'; ctx.fillRect(x, 2.2 * BS, BS, 6);
    }
  }
  // a smooth sandy bank down into the river
  ctx.fillStyle = '#e8cb80';
  const bx = RIVER_C0 * BS;
  ctx.beginPath(); ctx.moveTo(bx, (er[WCOLS - 1] || 0) * BS); ctx.quadraticCurveTo(bx + 20, 1.6 * BS, bx + 46, 2.2 * BS); ctx.lineTo(bx, 2.2 * BS); ctx.fill();

  // gentle labels in the ground
  ctx.font = '700 15px Fredoka, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('ROCK', cfg.rockCols * BS / 2, 1.2 * BS);
  ctx.fillStyle = 'rgba(140,100,30,0.55)';
  if ((er[cfg.rockCols + 1] || 0) < 2) ctx.fillText('SAND', (cfg.rockCols + GCOLS) * BS / 2, 1.2 * BS);
}

function drawSignpost() {
  if (level !== 1 || state !== 'play' || phase !== 'build') return;
  const x = -3.25 * BS, y = -2 * BS;
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(x - 3, y - 64, 6, 64);
  ctx.save();
  ctx.translate(x, y - 58 + Math.sin(t * 2) * 1.5);
  ctx.fillStyle = '#d9a866'; ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-34, -12); ctx.lineTo(28, -12); ctx.lineTo(42, 0); ctx.lineTo(28, 12); ctx.lineTo(-34, 12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a18';
  ctx.font = '700 11px Fredoka, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Build on', 2, -1);
  ctx.fillText('the ROCK', 2, 10);
  ctx.restore();
}

function drawBlocks() {
  for (let r = 0; r < GROWS; r++) {
    for (let c = 0; c < WCOLS; c++) {
      const b = get(c, r);
      if (!b) continue;
      let dx = 0, dy = 0;
      if (b.doom >= 0) { dx = rand(-2.5, 2.5); dy = rand(-1, 1); }
      drawTex(b.type, c * BS + dx, -(r + 1) * BS + dy);
    }
  }
}

function drawDebris() {
  for (const d of debris) {
    ctx.save();
    ctx.globalAlpha = clamp(d.life, 0, 1);
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    drawTex(d.type, -BS * 0.42, -BS * 0.42, BS * 0.84);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawWater(visL, visR) {
  const yf = -floodH * BS;
  const c0 = Math.floor(visL / BS) - 1, c1 = Math.ceil(visR / BS) + 1;
  ctx.fillStyle = 'rgba(58,140,220,0.55)';
  const cols = [];
  for (let c = c0; c <= c1; c++) {
    const top = terrainTop(c);
    if (top > yf) { ctx.fillRect(c * BS, yf, BS + 0.5, top - yf); cols.push(c); }
  }
  // wavy, shining surface
  ctx.strokeStyle = 'rgba(225,245,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const c of cols) {
    for (let k = 0; k <= 4; k++) {
      const x = c * BS + k * BS / 4;
      const y = yf + Math.sin(x / 18 + t * (3 + dark * 3)) * (1.5 + dark * 2.5);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  // the river flows
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const x = RIVER_C0 * BS + ((i * 57 + t * 40) % (3.5 * BS)) + 10;
    const y = yf + 14 + (i % 3) * 14;
    if (y < 2.2 * BS - 6) { ctx.moveTo(x, y); ctx.lineTo(x + 16, y); }
  }
  ctx.stroke();
}

function drawGuide() {
  if (state !== 'play' || phase !== 'build') return;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c < GCOLS; c++) {
    for (let r = groundRow(c); r < GROWS; r++) ctx.rect(c * BS + 0.5, -(r + 1) * BS + 0.5, BS - 1, BS - 1);
  }
  ctx.stroke();
  // cursor (keyboard) or hover (mouse)
  const cur = kbUsed ? cursor : hover;
  if (!cur) return;
  const why = placeCheck(cur.c, cur.r, sel);
  const ok = !why;
  const x = cur.c * BS, y = -(cur.r + 1) * BS;
  if (ok && sel !== 'erase' && !get(cur.c, cur.r)) {
    ctx.globalAlpha = 0.5; drawTex(sel, x, y); ctx.globalAlpha = 1;
  }
  const pulse = 0.6 + 0.4 * Math.sin(t * 8);
  ctx.strokeStyle = ok ? (sel === 'erase' ? `rgba(240,90,120,${pulse})` : `rgba(255,255,255,${pulse})`) : `rgba(220,60,60,${pulse})`;
  ctx.lineWidth = 4;
  ctx.strokeRect(x + 2, y + 2, BS - 4, BS - 4);
}

function drawRainbow() {
  if (state !== 'win') return;
  const cx = houseCentre();
  const bows = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
  ctx.globalAlpha = 0.55; ctx.lineWidth = 12;
  bows.forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(cx, 0, 7.5 * BS - i * 12, Math.PI, TAU); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawPeople() {
  drawJesus(JESUS);
  drawDisciple({ d: BUILDER, x: BUILDER_X, y: BUILDER_Y, s: 0.95, row: 1 }, lookFor(BUILDER_X, BUILDER_Y));
  drawDisciple({ d: NEIGHBOUR, x: nbX, y: nbY, s: 0.95, row: 1 }, lookFor(nbX, nbY));
  if (state === 'play' && phase === 'build') {
    ctx.font = '700 13px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.fillStyle = '#2f4f8a';
    ctx.strokeText('You', BUILDER_X, BUILDER_Y + 16); ctx.fillText('You', BUILDER_X, BUILDER_Y + 16);
  }
}

// where each person is looking
function lookFor(x, y) {
  let tx, ty;
  if (state === 'play' && phase === 'build') {
    const cur = kbUsed ? cursor : hover || cursor;
    tx = (cur.c + 0.5) * BS; ty = -(cur.r + 0.5) * BS;
  } else { tx = houseCentre(); ty = -2 * BS; }
  if (x === nbX) { tx = 15 * BS; ty = -3 * BS; if (state === 'play' && phase === 'build' && nbIdx >= NB_PLAN.length) tx = x - 200; }
  const dx = tx - x, dy = ty - (y - 52);
  const len = Math.hypot(dx, dy) || 1;
  return { lx: dx / len, ly: dy / len };
}

function drawBubble(text, wx, wy) {
  const p = toLogical(wx, wy);
  ctx.font = '600 14px Fredoka, sans-serif';
  const tw = ctx.measureText(text).width;
  const w = tw + 20, h = 28;
  const x = clamp(p.x - w / 2, 8 - offX, W + offX - w - 8);
  const y = p.y - h - 12;
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = 'rgba(120,90,40,0.5)'; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  const tx = clamp(p.x, x + 14, x + w - 14);
  ctx.beginPath(); ctx.moveTo(tx - 7, y + h - 1); ctx.lineTo(tx, y + h + 9); ctx.lineTo(tx + 7, y + h - 1); ctx.fill();
  ctx.fillStyle = '#5a4210';
  ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + 19);
}

// ============================================================
//  Rendering: HUD, goal card, hotbar
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  ctx.textAlign = 'left';
  ctx.fillStyle = dark > 0.5 ? '#fff6dc' : '#5a4210';
  ctx.shadowColor = dark > 0.5 ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.9)';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Wise Builder' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 13px Fredoka, sans-serif';
  if (state !== 'title') ctx.fillText(`SCORE ${totalScore}`, 12, 48);
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  if (state !== 'title') drawGoalCard();
  ctx.restore();
}

function drawGoalCard() {
  const w = Math.min(232, viewW * 0.48), x = viewW - w - 10, y = 10;
  const h = 34 + reqs.length * 22;
  ctx.fillStyle = 'rgba(255,252,240,0.93)';
  ctx.strokeStyle = 'rgba(224,165,38,0.7)'; ctx.lineWidth = 2.5;
  roundRect(x, y, w, h, 14); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#a8741a';
  ctx.font = '700 15px Fredoka, sans-serif';
  ctx.fillText(phase === 'build' && state === 'play' ? 'Build a house:' : 'Your house:', x + 12, y + 22);
  reqs.forEach((q, i) => {
    const ly = y + 34 + i * 22;
    ctx.fillStyle = q.ok ? '#40a352' : 'rgba(90,66,16,0.15)';
    roundRect(x + 12, ly, 16, 16, 4); ctx.fill();
    if (q.ok) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + 16, ly + 8); ctx.lineTo(x + 19, ly + 12); ctx.lineTo(x + 25, ly + 4); ctx.stroke();
    }
    ctx.fillStyle = q.ok ? '#2b6e37' : '#5a4210';
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.fillText(q.label, x + 35, ly + 13);
    if (q.info && !q.ok) {
      ctx.textAlign = 'right'; ctx.fillStyle = '#a8741a';
      ctx.fillText(q.info, x + w - 10, ly + 13);
      ctx.textAlign = 'left';
    }
  });
}

function drawCoin(x, y, r) {
  ctx.fillStyle = '#e0a526';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd766';
  ctx.beginPath(); ctx.arc(x - r * 0.1, y - r * 0.1, r * 0.72, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#b8801a'; ctx.lineWidth = Math.max(1.5, r * 0.18);
  ctx.beginPath(); ctx.moveTo(x - r * 0.1, y - r * 0.42); ctx.lineTo(x - r * 0.1, y + r * 0.3); ctx.stroke();
}

function drawEraser(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6);
  ctx.fillStyle = '#f28fb0'; roundRect(-s * 0.45, -s * 0.2, s * 0.9, s * 0.4, 5); ctx.fill();
  ctx.fillStyle = '#5a8fd6'; ctx.fillRect(-s * 0.05, -s * 0.2, s * 0.22, s * 0.4);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; roundRect(-s * 0.45, -s * 0.2, s * 0.9, s * 0.4, 5); ctx.stroke();
  ctx.restore();
}

function drawBar() {
  const L = barLayout();
  // hotbar panel
  ctx.fillStyle = 'rgba(58,44,28,0.8)';
  roundRect(L.px, L.top, L.pw, H - L.top + 30, 18); ctx.fill();

  if (state === 'play' && phase === 'build') {
    for (const s of L.slots) {
      const on = s.type === sel;
      const y = s.y - (on ? 4 : 0);
      ctx.fillStyle = on ? 'rgba(255,240,190,0.95)' : 'rgba(255,255,255,0.16)';
      roundRect(s.x, y, s.w, s.w, 10); ctx.fill();
      if (on) { ctx.strokeStyle = '#f7c948'; ctx.lineWidth = 3.5; roundRect(s.x, y, s.w, s.w, 10); ctx.stroke(); }
      const is = s.w * 0.56;
      if (s.type === 'erase') drawEraser(s.x + s.w / 2, y + s.w * 0.42, is);
      else drawTex(s.type, s.x + (s.w - is) / 2, y + 7, is);
      ctx.font = '700 11px Fredoka, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = on ? '#8a5a00' : 'rgba(255,255,255,0.7)';
      ctx.fillText(String(s.i + 1), s.x + 5, y + 13);
      ctx.textAlign = 'center';
      if (s.type !== 'erase') {
        const cost = BLOCKS[s.type].cost;
        const cy = y + s.w - 9;
        drawCoin(s.x + s.w / 2 - 7, cy - 4, 5.5);
        ctx.fillStyle = on ? '#5a4210' : '#fff6dc';
        ctx.font = '700 13px Fredoka, sans-serif';
        ctx.fillText(String(cost), s.x + s.w / 2 + 6, cy + 1);
      } else {
        ctx.fillStyle = on ? '#5a4210' : '#fff6dc';
        ctx.font = '700 10px Fredoka, sans-serif';
        ctx.fillText('ERASE', s.x + s.w / 2, y + s.w - 6);
      }
    }

    // coins left
    drawCoin(L.px + 22, H - 32, 12);
    ctx.textAlign = 'left';
    ctx.fillStyle = coins <= 3 ? '#ff9b8a' : '#fff6dc';
    ctx.font = '700 22px Fredoka, sans-serif';
    ctx.fillText(String(coins), L.px + 39, H - 24);
    ctx.font = '600 10px Fredoka, sans-serif';
    ctx.fillStyle = 'rgba(255,246,220,0.7)';
    ctx.fillText('COINS', L.px + 10, H - 48);

    // selected block name
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff6dc';
    ctx.font = '600 13px Fredoka, sans-serif';
    const nm = sel === 'erase' ? 'Eraser' : BLOCKS[sel].name;
    ctx.fillText(nm, L.px + L.pw - 10, H - 30);
    ctx.fillStyle = 'rgba(255,246,220,0.6)'; ctx.font = '600 10px Fredoka, sans-serif';
    ctx.fillText('SELECTED', L.px + L.pw - 10, H - 46);

    // storm button
    const b = L.btn;
    const ready = reqs.every((q) => q.ok);
    const pulse = ready ? Math.sin(t * 5) * 2 : 0;
    ctx.fillStyle = ready ? '#a8741a' : '#6d6150';
    roundRect(b.x - pulse, b.y + 3 - pulse / 2, b.w + pulse * 2, b.h + pulse, 22); ctx.fill();
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (ready) { g.addColorStop(0, '#f7c948'); g.addColorStop(1, '#d9961c'); }
    else { g.addColorStop(0, '#bdb3a2'); g.addColorStop(1, '#9d927f'); }
    ctx.fillStyle = g;
    roundRect(b.x - pulse, b.y - pulse / 2, b.w + pulse * 2, b.h + pulse - 2, 22); ctx.fill();
    ctx.fillStyle = ready ? '#fff' : 'rgba(255,255,255,0.85)';
    ctx.textAlign = 'center';
    ctx.font = '700 19px Fredoka, sans-serif';
    ctx.shadowColor = 'rgba(120,70,0,0.6)'; ctx.shadowBlur = ready ? 3 : 0;
    ctx.fillText('Let the storm come!', b.x + b.w / 2, b.y + 28);
    ctx.shadowBlur = 0;
  } else {
    // Matthew 7:25, lit up as it happens
    const parts = [
      ['And the rain descended, ', 0], ['and the floods came, ', 2.3],
      ['and the winds blew, ', 5], ['and beat upon that house', 7.8],
    ];
    const lines = [[parts[0], parts[1]], [parts[2], parts[3]]];
    ctx.font = 'italic 600 16px Fredoka, sans-serif';
    ctx.textAlign = 'left';
    const live = state === 'play' ? stormT : 99;
    lines.forEach((ln, i) => {
      const total = ln.reduce((s, p) => s + ctx.measureText(p[0]).width, 0);
      let x = W / 2 - total / 2;
      for (const [txt, at] of ln) {
        ctx.fillStyle = live >= at ? '#fff6dc' : 'rgba(255,246,220,0.3)';
        ctx.fillText(txt, x, H - 88 + i * 26);
        x += ctx.measureText(txt).width;
      }
    });
    ctx.textAlign = 'center';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillStyle = 'rgba(255,246,220,0.6)';
    ctx.fillText('Matthew 7:25', W / 2, H - 28);
  }
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const y = Math.max(160, GROUND_Y - GROWS * BS * cam.zoom - 24);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const tw = ctx.measureText(message.text).width;
  if (tw > W - 24) ctx.font = `700 ${Math.floor(24 * (W - 24) / tw)}px Fredoka, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawStormClouds();
  drawBolt();

  // The valley, through the camera
  ctx.save();
  ctx.translate(W / 2, GROUND_Y);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, 0);
  const visL = cam.x - (W / 2 + offX + 10) / cam.zoom, visR = cam.x + (W / 2 + offX + 10) / cam.zoom;
  drawRainbow();
  drawTerrain(visL, visR);
  drawSignpost();
  drawGuide();
  drawBlocks();
  drawPeople();
  drawDebris();
  drawWater(visL, visR);
  drawParticles();
  ctx.restore();

  // Speech bubbles
  if (nbSay.t > 0) drawBubble(nbSay.text, nbX, nbY - 70);

  drawRain();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 50, 0, TAU); ctx.stroke();
  }

  drawMessage();
  if (state !== 'title') drawBar();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
let camSnapped = false;
function update(dt) {
  t += dt;
  updateScenery(dt);
  updateParticles(dt);
  updateFolk(dt);
  updateCamera(dt, !camSnapped);
  camSnapped = true;
  if (state === 'play' || state === 'win' || state === 'fail') {
    ana = analyse();
    reqs = reqList(ana);
  }
  if (state === 'play' && phase === 'build') {
    buildT += dt;
    updateNeighbourBuild(dt);
    while (msgQueue.length && buildT >= msgQueue[0].at) showMessage(msgQueue.shift().text);
    const ready = reqs.every((q) => q.ok);
    if (ready && !wasReady) { readyJoyT = 1.6; showMessage('House ready! Let the storm come!'); }
    wasReady = ready;
  } else if (state === 'play' && phase === 'storm') {
    updateStorm(dt);
  }
  if (state === 'play' || state === 'win' || state === 'fail') updateDebris(dt);
  if (state === 'win' || state === 'fail') {
    dark = lerp(dark, 0, Math.min(1, dt * 1.5));
    floodH = lerp(floodH, BASE_FLOOD, Math.min(1, dt));
    if (state === 'win' && Math.random() < dt * 10) {
      spawn(houseCentre() + rand(-90, 90), -rand(0, 5) * BS, 0, -25, 1.2, '#fff6d0', 3);
    }
  }
  pShockT = Math.max(0, pShockT - dt);
  nbShockT = Math.max(0, nbShockT - dt);
  readyJoyT = Math.max(0, readyJoyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' ? rainAmt * 0.8 : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
