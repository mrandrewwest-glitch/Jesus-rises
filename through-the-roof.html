    const a = holeL + k * tileW, sh = tl.shake > 0 ? rand(-1.5, 1.5) : 0;
    ctx.save(); ctx.translate(sh, 0);
    layer(a, a + tileW, tl.hp < cfg.tileHp ? 4 : 0);
    if (tl.hp < cfg.tileHp) {   // cracked
      ctx.strokeStyle = '#5a3d1e'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(a + tileW * 0.3, ROOF_Y + 4); ctx.lineTo(a + tileW * 0.45, ROOF_Y + 11); ctx.lineTo(a + tileW * 0.35, ROOF_Y + 20);
      ctx.moveTo(a + tileW * 0.45, ROOF_Y + 11); ctx.lineTo(a + tileW * 0.7, ROOF_Y + 14);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(90,60,30,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a + 0.5, ROOF_Y + 2); ctx.lineTo(a + 0.5, CEIL_Y); ctx.stroke();
    ctx.restore();
  });
  // Log beams, seen end-on; the hole sits between two of them
  const beams = [holeL - 9, holeR + 9];
  for (let x = holeL - 9 - 66; x > x0 + 6; x -= 66) beams.push(x);
  for (let x = holeR + 9 + 66; x < x1 - 6; x += 66) beams.push(x);
  for (const x of beams) {
    ctx.fillStyle = '#7a5230';
    ctx.beginPath(); ctx.arc(x, CEIL_Y - 3, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#b08058'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, CEIL_Y - 3, 6, 0, TAU); ctx.moveTo(x + 2.5, CEIL_Y - 3); ctx.arc(x, CEIL_Y - 3, 2.5, 0, TAU); ctx.stroke();
  }
  // Parapet round the roof edge (Deuteronomy's rule for flat roofs)
  ctx.fillStyle = '#c9a36e';
  roundRect(x1 - 12, ROOF_Y - 14, 12, 15, [3, 3, 0, 0]); ctx.fill();

  // Dig hint
  if ((state === 'play' && phase === 'dig') || state === 'title') {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    ctx.strokeStyle = `rgba(255,215,90,${0.55 + pulse * 0.4})`; ctx.lineWidth = 3;
    ctx.setLineDash([7, 6]);
    roundRect(holeL, ROOF_Y - 3, holeR - holeL, ROOF_T + 3, 6); ctx.stroke();
    ctx.setLineDash([]);
    if (state === 'play' && tilesLeft() > 0) {
      const c = tiles[cursor] && tiles[cursor].hp > 0 ? cursor : nearestTile(cursor);
      const cx = holeL + (c + 0.5) * tileW;
      ctx.fillStyle = `rgba(255,225,120,${0.25 + pulse * 0.2})`;
      roundRect(holeL + c * tileW + 2, ROOF_Y - 1, tileW - 4, 16, 4); ctx.fill();
      const bob = Math.sin(t * 6) * 4;
      ctx.fillStyle = '#f2b632'; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, ROOF_Y - 8 + bob); ctx.lineTo(cx - 9, ROOF_Y - 22 + bob); ctx.lineTo(cx + 9, ROOF_Y - 22 + bob); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
      ctx.strokeText('Dig!', cx, ROOF_Y - 28 + bob);
      ctx.fillStyle = '#8a5a00'; ctx.fillText('Dig!', cx, ROOF_Y - 28 + bob);
    }
  }
}

// ============================================================
//  Rendering: lamp, cat, ropes, friends
// ============================================================
function drawLamp(L) {
  const lp = lampPos(L);
  // hook
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(lp.ax - 4, CEIL_Y - 1, 8, 4);
  // chain
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 2;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(lp.ax, CEIL_Y + 2); ctx.lineTo(lp.x, lp.y - 8); ctx.stroke();
  ctx.setLineDash([]);
  // warm glow
  const fl = 0.85 + Math.sin(t * 17) * 0.08 + Math.sin(t * 7.3) * 0.07;
  const gg = ctx.createRadialGradient(lp.x + 14, lp.y - 10, 2, lp.x + 14, lp.y - 10, 48 * fl);
  gg.addColorStop(0, 'rgba(255,220,120,0.55)'); gg.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(lp.x + 14, lp.y - 10, 48 * fl, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(lp.x, lp.y);
  ctx.rotate(-lp.a * 0.6);
  // clay-and-bronze oil lamp
  ctx.fillStyle = '#b07a3a'; ctx.strokeStyle = '#7a5022'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-15, -2); ctx.quadraticCurveTo(-14, 9, 0, 9); ctx.quadraticCurveTo(12, 9, 18, -2);
  ctx.lineTo(20, -6); ctx.lineTo(10, -4); ctx.quadraticCurveTo(0, -8, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-17, 1, 4, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(0, -10); ctx.lineTo(10, -4); ctx.stroke();
  // flame
  ctx.fillStyle = '#ffb627';
  ctx.beginPath(); ctx.moveTo(17, -6); ctx.quadraticCurveTo(26, -12 * fl, 19, -22 * fl); ctx.quadraticCurveTo(12, -12, 17, -6); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.moveTo(18, -7); ctx.quadraticCurveTo(22, -11, 19, -16 * fl); ctx.quadraticCurveTo(15, -11, 18, -7); ctx.fill();
  ctx.restore();
}

function drawStone(L) {
  if (!cfg.stone || !(state === 'play' || state === 'pause') || phase !== 'dig') return;
  const f = 1 - stone.hop / 0.25;
  const x = lerp(stoneX(L, stone.from), stoneX(L, stone.at), ease(f));
  const y = ROOF_Y - 9 - Math.sin(f * Math.PI) * (stone.hop > 0 ? 26 : 0);
  const r = Math.min(15, L.tileW * 0.42);
  ctx.save();
  ctx.translate(x + (stone.stun > 0 ? rand(-1.5, 1.5) : 0), y);
  ctx.fillStyle = 'rgba(60,40,20,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 8, r, 3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8f8a82'; ctx.strokeStyle = '#5e5a54'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b3aea5';
  ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.25, r * 0.35, r * 0.2, -0.3, 0, TAU); ctx.fill();
  ctx.restore();
}

// Streaks and a big arrow warn that a gust is on its way
function drawWind(L) {
  if (!(state === 'play' && phase === 'lower') || wind.mode === 'calm') return;
  const warn = wind.mode === 'warn';
  const a = warn ? 0.5 + 0.5 * Math.sin(t * 14) : 0.9;
  const cx = wind.dir > 0 ? L.holeL - 70 : L.holeR + 70, cy = CEIL_Y + 60;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(cx, cy);
  ctx.scale(wind.dir, 1);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    const y = (k - 1) * 14, off = warn ? 0 : ((t * 200 + k * 30) % 40);
    ctx.beginPath(); ctx.moveTo(-30 + off, y); ctx.quadraticCurveTo(0 + off, y - 6, 22 + off, y); ctx.stroke();
  }
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#5a7fa0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(30, -14); ctx.lineTo(48, 0); ctx.lineTo(30, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawCat(L) {
  const x = L.catX, y = SHELF_Y;
  // shelf
  ctx.fillStyle = '#8a5f34'; ctx.fillRect(x - 36, y, 66, 7);
  ctx.fillStyle = '#6b4a2b';
  ctx.beginPath(); ctx.moveTo(x - 28, y + 7); ctx.lineTo(x - 28, y + 24); ctx.lineTo(x - 14, y + 7); ctx.fill();
  ctx.fillStyle = '#9a8566';
  ctx.beginPath(); ctx.ellipse(x - 26, y - 9, 7, 9, 0, 0, TAU); ctx.fill();
  const mode = cat.mode;
  const wig = mode === 'windup' ? Math.sin(t * 30) * 2 : 0;
  const orange = '#f0a040', dark = '#c46f1c';
  // tail
  ctx.strokeStyle = orange; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const tw = Math.sin(t * (mode === 'windup' ? 10 : 2)) * 6;
  ctx.beginPath(); ctx.moveTo(x - 10, y - 4); ctx.quadraticCurveTo(x - 30, y - 6, x - 24 + tw, y - 26); ctx.stroke();
  // body
  ctx.fillStyle = orange;
  ctx.beginPath(); ctx.ellipse(x + wig, y - 12, 13, 12, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 6 + wig, y - 20); ctx.lineTo(x - 2 + wig, y - 14); ctx.moveTo(x - 9 + wig, y - 13); ctx.lineTo(x - 4 + wig, y - 8); ctx.stroke();
  // paw
  if (mode === 'swat') {
    const tx = clamp(cat.rx, x + 14, x + 70);
    ctx.strokeStyle = orange; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x + 8, y - 16); ctx.lineTo(tx, y - 18); ctx.stroke();
    ctx.fillStyle = '#fff1dd'; ctx.beginPath(); ctx.arc(tx, y - 18, 4, 0, TAU); ctx.fill();
  }
  // head
  const hx = x + 9 + wig, hy = y - 29;
  ctx.fillStyle = orange;
  ctx.beginPath(); ctx.arc(hx, hy, 10, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx - 9, hy - 4); ctx.lineTo(hx - 7, hy - 15); ctx.lineTo(hx - 1, hy - 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 9, hy - 4); ctx.lineTo(hx + 7, hy - 15); ctx.lineTo(hx + 1, hy - 8); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.5;
  if (mode === 'sleep') {
    ctx.beginPath(); ctx.arc(hx - 4, hy - 1, 2.5, 0.1, Math.PI - 0.1); ctx.moveTo(hx + 6.5, hy - 1); ctx.arc(hx + 4, hy - 1, 2.5, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#6a5a8a';
    const zz = (t * 0.8) % 1;
    ctx.globalAlpha = 1 - zz; ctx.fillText('z', hx + 10 + zz * 8, hy - 12 - zz * 16); ctx.globalAlpha = 1;
  } else {
    const r = mode === 'windup' ? 3.2 : 2.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx - 4, hy - 1, r, 0, TAU); ctx.arc(hx + 4, hy - 1, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.beginPath(); ctx.arc(hx - 3, hy - 1, 1.4, 0, TAU); ctx.arc(hx + 5, hy - 1, 1.4, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e07a8a'; ctx.beginPath(); ctx.arc(hx, hy + 3, 1.6, 0, TAU); ctx.fill();
  if (mode === 'windup') {
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText('!', hx, hy - 20);
    ctx.fillStyle = '#d9480f'; ctx.fillText('!', hx, hy - 20);
  }
}

function ropeLine(x1, y1, x2, y2, x3, y3) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, w] of [['#8a6a3a', 3.4], ['#d8b77a', 2]]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    if (x3 !== undefined) ctx.lineTo(x3, y3);
    ctx.stroke();
  }
}

// Friends' hands on the ropes
function ropeHands(L) {
  const give = (s) => ropeFx[s] > 0 ? 5 : 0;
  return {
    L: [[L.holeL - 36, ROOF_Y - 24 + give('L')], [L.holeL - 10, ROOF_Y - 28 + give('L')]],
    R: [[L.holeR + 10, ROOF_Y - 28 + give('R')], [L.holeR + 36, ROOF_Y - 24 + give('R')]],
  };
}

function hanging() { return (state === 'play' || state === 'fail' || state === 'pause') && (phase === 'lower' || phase === 'haul'); }

// The mat and the lower part of the ropes (inside the house)
function drawHangingMat(L) {
  if (hanging()) {
    const g = matGeom(L);
    const hands = ropeHands(L);
    const c = Math.cos(g.ang), s = Math.sin(g.ang);
    const endL = { x: g.mx - c * (MAT_HALF - 3) + s * 3, y: g.my - s * (MAT_HALF - 3) - c * 3 };
    const endR = { x: g.mx + c * (MAT_HALF - 3) + s * 3, y: g.my + s * (MAT_HALF - 3) - c * 3 };
    for (const [end, hs, side] of [[endL, hands.L, 'L'], [endR, hands.R, 'R']]) {
      const e = ropeEdge(L, side);
      // Past the edge of the hole the rope also bends round the ceiling corner
      const past = side === 'L' ? end.x < e.x : end.x > e.x;
      for (const [j, dx] of [[0, -2], [1, 2]]) {
        const ex = e.x + (side === 'L' ? j * 3 : -j * 3);
        if (past) {
          ropeLine(hs[j][0], hs[j][1], ex, e.y, ex, CEIL_Y);
          ropeLine(ex, CEIL_Y, end.x + dx, end.y);
        } else ropeLine(hs[j][0], hs[j][1], ex, e.y, end.x + dx, end.y);
      }
    }
    drawMat(g.mx, g.my, g.ang, { mood: manMood(), slide: man.slide * man.slideDir * 16 });
  } else if (state === 'win') {
    const lg = matGeom(L);
    // The mat on the floor, then rolled up and carried away
    if (!man.stood) drawMat(lg.mx, FLOOR_Y - MAT_TH, 0, { mood: manMood() });
    else if (winT < 7.6) {
      const f = clamp((winT - 7.0) / 0.6, 0, 1);
      const len = lerp(MAT_LEN, 16, f);
      drawMat(lg.mx + MAT_HALF - len / 2, FLOOR_Y - MAT_TH, 0, { man: false, len });
      if (f > 0) { ctx.fillStyle = '#c9a258'; ctx.strokeStyle = '#9a7432'; ctx.beginPath(); ctx.arc(lg.mx + MAT_HALF - len, FLOOR_Y - 10, 4 + f * 6, 0, TAU); ctx.fill(); ctx.stroke(); }
    }
  }
}

function drawManStanding(L) {
  if (state !== 'win' || !man.stood) return;
  const x = manX(L);
  const walking = winT > 7.6 && winT < 10.4;
  const bob = walking ? Math.abs(Math.sin(t * 10)) * 3 : 0;
  const p = { ...MAN_LOOK, i: 3, x, y: FLOOR_Y + 2 - bob, s: 1, mood: 'joy', blink: 0, back: 0, phase: 0, lean: 0, scarf: null, hands: null };
  const pop = clamp((winT - 6.4) / 0.3, 0, 1);
  p.s = 0.6 + pop * 0.4;
  if (winT > 7.6) p.hands = [[x - 14, FLOOR_Y - 46 - bob], [x + 14, FLOOR_Y - 50 - bob]];
  drawPerson(p, L.jx, FLOOR_Y - 60);
  if (winT > 7.6) {   // the rolled-up bed on his shoulder
    ctx.save();
    ctx.translate(x, FLOOR_Y - 48 - bob);
    ctx.rotate(-0.25);
    ctx.fillStyle = '#d9b36a'; ctx.strokeStyle = '#9a7432'; ctx.lineWidth = 1.5;
    roundRect(-26, -7, 52, 14, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(26, 0, 4, 7, 0, 0, TAU); ctx.fillStyle = '#c9a258'; ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#8a6a3a';
    ctx.beginPath(); ctx.moveTo(-10, -7); ctx.lineTo(-10, 7); ctx.moveTo(10, -7); ctx.lineTo(10, 7); ctx.stroke();
    ctx.restore();
  }
}

function drawFriends(L) {
  const hands = ropeHands(L);
  const low = hanging() || state === 'win';
  friends.forEach((f, k) => {
    f.x = friendX(k, L);
    f.y = ROOF_Y;
    const side = k < 2 ? 'L' : 'R';
    f.hands = null; f.lean = 0;
    if (low && state !== 'win') {
      const hp = hands[side][k % 2];
      f.hands = [[hp[0] - 4, hp[1]], [hp[0] + 4, hp[1] + 2]];
      f.lean = (side === 'L' ? -0.12 : 0.12) * (phase === 'haul' ? 2 : 1) + (ropeFx[side] > 0 ? (side === 'L' ? 0.1 : -0.1) : 0);
    } else if (state === 'play' && phase === 'dig' && (k === 1 || k === 2)) {
      // Digging: scoop at the roof beside them
      const dx = k === 1 ? 20 : -20;
      const scoop = (digFx > 0 && digSide === side) ? Math.sin(digFx * 25) * 8 : Math.sin(t * 3 + k) * 2;
      f.hands = [[f.x + dx - 5, ROOF_Y - 12 + scoop], [f.x + dx + 5, ROOF_Y - 10 + scoop]];
      f.lean = k === 1 ? 0.25 : -0.25;
    } else if (state === 'play' && phase === 'lift') {
      f.hands = [[f.x - 8, ROOF_Y - 70], [f.x + 8, ROOF_Y - 70]];
    }
    const g = low ? matGeom(L) : null;
    drawPerson(f, g ? g.mx : L.hcx, g ? g.my : FLOOR_Y);
  });
  // Upper ropes over the friends' hands
  if (hanging()) {
    ropeLine(hands.L[0][0] - 8, hands.L[0][1] + 4, hands.L[0][0], hands.L[0][1]);
    ropeLine(hands.R[1][0] + 8, hands.R[1][1] + 4, hands.R[1][0], hands.R[1][1]);
  }
}

// The mat on the roof before it goes down (title, dig and lift)
function drawRoofMat(L) {
  if (hanging() || state === 'win') return;
  let x = L.matRestX, y = ROOF_Y - MAT_TH, ang = 0;
  if (state === 'play' && phase === 'lift') {
    const f = ease(phaseT / LIFT_T);
    x = lerp(L.matRestX, L.hcx, f);
    y = lerp(ROOF_Y - MAT_TH, START_Y, f) - Math.sin(f * Math.PI) * 50;
    ang = Math.sin(f * Math.PI) * 0.08;
  }
  drawMat(x, y, ang, { mood: manMood() });
}

// ============================================================
//  Rendering: bubbles, HUD, buttons
// ============================================================
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function bubbleAnchor(L) {
  const who = bubble.who;
  if (who === 'jesus') return { x: L.jx, y: FLOOR_Y - 96, big: true };
  if (who === 'jesus-side') return { x: L.jx + 10, y: FLOOR_Y - 90 };
  if (who === 'man') {
    if (state === 'win' && man.stood) return { x: manX(L), y: FLOOR_Y - 80 };
    if (hanging()) { const g = matGeom(L); return { x: g.x1 + 12, y: g.y1 - 28 }; }
    return { x: L.matRestX - 40, y: ROOF_Y - 30 };
  }
  if (who === 'scribe') { const s = scribes()[0]; return s ? { x: s.x, y: s.y - 76 } : { x: L.zoneL, y: FLOOR_Y - 80 }; }
  if (who === 'crowd') {
    const out = people.filter((p) => p.role === 'out');
    const p = out.length && W > 700 ? out[0] : people.find((q) => q.row === 0 && q.x > L.hcx) || people[0];
    return { x: p.x, y: p.y - 80 };
  }
  return { x: who.x, y: who.y - 76 * who.s };
}

function drawBubble(L) {
  if (!bubble) return;
  const a = bubbleAnchor(L);
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  const big = a.big;
  ctx.font = big ? '700 19px Fredoka, sans-serif' : '600 15px Fredoka, sans-serif';
  const maxW = Math.min(big ? 300 : 230, viewW - 60);
  const lines = wrapLines(bubble.text, maxW);
  const lh = big ? 24 : 19;
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + (big ? 28 : 20), h = lines.length * lh + 12;
  const bx = clamp(a.x - w / 2, -offX + 8, W + offX - w - 8);
  const by = a.y - h - 14;
  ctx.fillStyle = big ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = big ? '#e0a526' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  const tx = clamp(a.x, bx + 16, bx + w - 16);
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(a.x, a.y - 2); ctx.lineTo(tx + 8, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h); ctx.lineTo(a.x, a.y - 2); ctx.lineTo(tx + 8, by + h);
  ctx.stroke();
  ctx.fillStyle = big ? '#8a5a00' : '#3b2f1e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, k) => ctx.fillText(l, bx + w / 2, by + 6 + lh * (k + 0.5) + 1));
  ctx.restore();
}

function drawHeart(x, y, r, full) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.8, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.8, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.closePath();
  ctx.fillStyle = full ? '#e03a4e' : 'rgba(90,66,16,0.2)';
  ctx.fill();
  if (full) { ctx.strokeStyle = '#a3202f'; ctx.lineWidth = 1.2; ctx.stroke(); }
}

function drawTiltMeter(cx, cy, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 10, Math.PI, TAU); ctx.lineTo(cx + r + 10, cy + 34); ctx.lineTo(cx - r - 10, cy + 34); ctx.closePath(); ctx.fill();
  const range = cfg.slide * 1.25;
  const toA = (deg) => -Math.PI / 2 - clamp(deg / range, -1, 1) * Math.PI / 2;
  const warn = cfg.slide * 0.45;
  const arc = (d0, d1, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.min(toA(d0), toA(d1)), Math.max(toA(d0), toA(d1))); ctx.stroke();
  };
  arc(-warn, warn, '#69c16b');
  arc(warn, cfg.slide, '#f2c14e'); arc(-cfg.slide, -warn, '#f2c14e');
  arc(cfg.slide, range, '#e8594a'); arc(-range, -cfg.slide, '#e8594a');
  // needle
  const a = toA(curTilt);
  ctx.strokeStyle = '#3b2f1e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r + 4), cy + Math.sin(a) * (r + 4)); ctx.stroke();
  // his face in the middle
  ctx.save();
  ctx.translate(cx, cy + 4);
  ctx.scale(0.62, 0.62);
  drawHead({ ...MAN_LOOK, i: man.i, blink: man.blink }, manMood(), 0, 0, 0);
  ctx.restore();
  ctx.fillStyle = '#5a4210'; ctx.font = '600 11px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('TILT', cx, cy + 30);
}

function ropeButtons() {
  const r = 44, m = 16;
  return [
    { side: 'L', x: m + r, y: viewH - m - r, r, label: 'LEFT', key: 'A / ←' },
    { side: 'R', x: viewW - m - r, y: viewH - m - r, r, label: 'RIGHT', key: 'D / →' },
  ];
}

function drawRopeButtons() {
  if (!(state === 'play' && (phase === 'lower' || phase === 'haul'))) return;
  for (const b of ropeButtons()) {
    const lit = ropeFx[b.side] > 0;
    ctx.fillStyle = lit ? 'rgba(247,201,72,0.95)' : 'rgba(255,252,240,0.78)';
    ctx.strokeStyle = 'rgba(168,116,26,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    // two ropes and a down arrow
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - 5, b.y - 30); ctx.lineTo(b.x - 5, b.y - 6); ctx.moveTo(b.x + 5, b.y - 30); ctx.lineTo(b.x + 5, b.y - 6); ctx.stroke();
    ctx.fillStyle = '#a8741a';
    ctx.beginPath(); ctx.moveTo(b.x - 11, b.y - 6); ctx.lineTo(b.x + 11, b.y - 6); ctx.lineTo(b.x, b.y + 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.textAlign = 'center';
    ctx.font = '700 14px Fredoka, sans-serif';
    ctx.fillText(b.label, b.x, b.y + 22);
    ctx.font = '600 10px Fredoka, sans-serif';
    ctx.fillText(b.key, b.x, b.y + 34);
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level, hearts, time
  ctx.textAlign = 'left';
  ctx.fillStyle = '#23405a';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Through the Roof' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.shadowBlur = 0;
  if (state !== 'title') {
    for (let k = 0; k < cfg.hearts; k++) drawHeart(20 + k * 22, 46, 8, k < hearts);
    // The sun timer: a little sun and the seconds left before it sets
    const tx = 20 + cfg.hearts * 22 + 10, low = timeLeft < 10;
    const flash = low && state === 'play' && Math.sin(t * 10) > 0;
    ctx.fillStyle = flash ? '#e8594a' : '#f5b82e';
    ctx.beginPath(); ctx.arc(tx, 46, 6.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) { const a = k * TAU / 8; ctx.moveTo(tx + Math.cos(a) * 9, 46 + Math.sin(a) * 9); ctx.lineTo(tx + Math.cos(a) * 11.5, 46 + Math.sin(a) * 11.5); }
    ctx.stroke();
    ctx.fillStyle = low ? '#c0392b' : '#23405a'; ctx.font = `${low ? 700 : 600} 14px Fredoka, sans-serif`;
    ctx.fillText(`${Math.max(0, Math.ceil(timeLeft))}s`, tx + 16, 51);
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: tilt meter while lowering, roof progress while digging
  const rx = viewW - 12;
  if (state === 'play' || state === 'pause' || state === 'fail') {
    if (phase === 'dig') {
      const total = TILE_N * cfg.tileHp;
      const done = total - tiles.reduce((s, tl) => s + tl.hp, 0);
      ctx.textAlign = 'right'; ctx.fillStyle = '#23405a';
      ctx.shadowBlur = 4;
      ctx.font = '600 12px Fredoka, sans-serif'; ctx.fillText('OPEN THE ROOF', rx, 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(90,66,16,0.25)'; roundRect(rx - 110, 28, 110, 13, 6.5); ctx.fill();
      ctx.fillStyle = '#b98b58'; if (done) { roundRect(rx - 110, 28, 110 * done / total, 13, 6.5); ctx.fill(); }
    } else {
      drawTiltMeter(rx - 58, 66, 44);
    }
  }
  if (state !== 'title') {
    ctx.textAlign = 'right'; ctx.fillStyle = '#23405a'; ctx.font = '600 13px Fredoka, sans-serif';
    ctx.shadowBlur = 4;
    ctx.fillText(`Score ${totalScore}`, rx, phase === 'dig' ? 60 : 122);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapLines(message.text, viewW - 40);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  lines.forEach((l, k) => {
    const y = 176 + k * 28;
    ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function render() {
  if (sceneW !== W || sceneLevel !== level) buildScene();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  const L = layout();
  drawSky();
  drawTown();
  drawStairs(L);
  drawBackWall(L);
  drawCat(L);
  drawLightShaft(L);
  drawRug(L);

  // Who everyone is looking at
  let look = { x: L.jx, y: FLOOR_Y - 70 };
  if (state === 'win') look = man.stood ? { x: manX(L), y: FLOOR_Y - 60 } : { x: L.hcx, y: FLOOR_Y - 20 };
  else if (hanging()) { const g = matGeom(L); look = { x: g.mx, y: g.my }; }
  else if (shockT > 0) look = { x: L.hcx, y: ROOF_Y };

  for (const p of people) if (p.row === 0) drawPerson(p, look.x, look.y);
  drawLamp(L);
  drawHangingMat(L);
  const jFace = state === 'win' ? (winT < 1.2 || (winT > 5 && winT < 6.4) ? 'up' : 'joy') : 'calm';
  const jPose = state === 'win' ? (winT < 5 ? 'open' : winT < 6.4 ? 'teach' : 'open') : 'teach';
  drawJesus(L.jx, FLOOR_Y - 2, jPose, jFace);
  for (const p of people) if (p.row === 1) drawPerson(p, p.role === 'scribe' && !hanging() && state !== 'win' ? L.jx : look.x, look.y);
  drawManStanding(L);
  drawSideWalls(L);
  for (const p of people) if (p.row === 2) drawPerson(p, L.hx1 - 20, FLOOR_Y - 90);
  drawRoof(L);
  drawStone(L);
  drawRoofMat(L);
  drawFriends(L);
  drawParticles();
  drawWind(L);

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBubble(L);
  drawMessage();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawRopeButtons();
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  if (sceneW !== W || sceneLevel !== level) buildScene();
  t += dt;
  const L = layout();
  for (const c of bgClouds) { c.f += (c.speed * dt) / (W + 300); if (c.f > 1) c.f -= 1; }
  updateParticles(dt);
  updatePeople(dt);
  // The lamp swings back after a knock
  lamp.kickV += (-2.9 * lamp.kick - 0.7 * lamp.kickV) * dt;
  lamp.kick += lamp.kickV * dt;
  if (state === 'play') {
    elapsed += dt; phaseT += dt;
    if (phase !== 'haul') {
      timeLeft -= dt;
      if (timeLeft <= 0) timeUp();
    }
    if (state !== 'play') { /* the sun set on the last heart */ }
    else if (phase === 'dig') updateStone(dt);
    else if (phase === 'lift') { if (phaseT >= LIFT_T) beginLower(); }
    else if (phase === 'lower' || phase === 'haul') updateLower(dt, L);
  } else if (state === 'win') {
    updateWin(dt, L);
  }
  for (const tl of tiles) tl.shake = Math.max(0, tl.shake - dt);
  digFx = Math.max(0, digFx - dt);
  ropeFx.L = Math.max(0, ropeFx.L - dt); ropeFx.R = Math.max(0, ropeFx.R - dt);
  shockT = Math.max(0, shockT - dt);
  shakeT = Math.max(0, shakeT - dt);
  bumpCd = Math.max(0, bumpCd - dt);
  hitCd = Math.max(0, hitCd - dt);
  headCd = Math.max(0, headCd - dt);
  gaspCd = Math.max(0, gaspCd - dt);
  slipCd = Math.max(0, slipCd - dt);
  man.oops = Math.max(0, man.oops - dt);
  message.t -= dt;
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
