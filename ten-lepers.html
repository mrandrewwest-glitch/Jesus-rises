<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe3f7">
<title>The Ten Lepers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Ten Lepers</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound: the shared music engine (music.js) with this game's tune, instruments and ambience
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'harp', ambience: 'wind', percussion: false };

// Scripture shown in this game (Luke 17:11-19).
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  mercy:     { ref: 'Luke 17:13', KJV: 'Jesus, Master, have mercy on us.', NKJV: 'Jesus, Master, have mercy on us!', NIV: 'Jesus, Master, have pity on us!', NLT: 'Jesus, Master, have mercy on us!' },
  go:        { ref: 'Luke 17:14', KJV: 'Go shew yourselves unto the priests.', NKJV: 'Go, show yourselves to the priests.', NIV: 'Go, show yourselves to the priests.', NLT: 'Go show yourselves to the priests.' },
  cleansed:  { ref: 'Luke 17:14', KJV: 'And it came to pass, that, as they went, they were cleansed.', NKJV: 'And so it was that as they went, they were cleansed.', NIV: 'And as they went, they were cleansed.', NLT: 'And as they went, they were cleansed of their leprosy.' },
  turned:    { ref: 'Luke 17:15', KJV: 'One of them, when he saw that he was healed, turned back, and with a loud voice glorified God.', NKJV: 'One of them, when he saw that he was healed, returned, and with a loud voice glorified God.', NIV: 'One of them, when he saw he was healed, came back, praising God in a loud voice.', NLT: 'One of them, when he saw that he was healed, came back to Jesus, shouting, ‘Praise God!’' },
  thanks:    { ref: 'Luke 17:15–16', KJV: 'And one of them, when he saw that he was healed, turned back, and with a loud voice glorified God, and fell down on his face at his feet, giving him thanks: and he was a Samaritan.', NKJV: 'And one of them, when he saw that he was healed, returned, and with a loud voice glorified God, and fell down on his face at His feet, giving Him thanks. And he was a Samaritan.', NIV: 'One of them, when he saw he was healed, came back, praising God in a loud voice. He threw himself at Jesus’ feet and thanked him—and he was a Samaritan.', NLT: 'One of them, when he saw that he was healed, came back to Jesus, shouting, ‘Praise God!’ He fell to the ground at Jesus’ feet, thanking him for what he had done. This man was a Samaritan.' },
  whereNine: { ref: 'Luke 17:17', KJV: 'Were there not ten cleansed? but where are the nine?', NKJV: 'Were there not ten cleansed? But where are the nine?', NIV: 'Were not all ten cleansed? Where are the other nine?', NLT: 'Didn’t I heal ten men? Where are the other nine?' },
  whole:     { ref: 'Luke 17:19', KJV: 'Arise, go thy way: thy faith hath made thee whole.', NKJV: 'Arise, go your way. Your faith has made you well.', NIV: 'Rise and go; your faith has made you well.', NLT: 'Stand up and go. Your faith has healed you.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
const ROAD = 1000;        // length of the road to the priests (world units)
const JESUS_Y = 705;      // where Jesus stands on the road in part 1
const P1_BACK_Y = 655, P1_FRONT_Y = 750;
const P2_BACK_Y = 680, P2_FRONT_Y = 792;
const VILLAGER_Y = 588;

const LEVEL_NAMES = [
  'A Certain Village',
  'Between Samaria and Galilee',
  'The Road to the Priests',
  'Market Day',
  'Crowded Streets',
  'Feast Day in the Village',
];

function makeConfig(n) {
  const k = Math.min(n, 6) - 1;
  const extra = Math.max(0, n - 6);
  return {
    name: LEVEL_NAMES[n - 1] || `Village ${n}`,
    // Part 1: the order game on the road
    sizes: [[2, 2, 2, 2, 2], [3, 3, 4], [3, 3, 4], [5, 5], [5, 5], [4, 6]][k].slice(),
    roadTime: Math.max(24, [60, 48, 42, 38, 34, 32][k] - extra * 1.5),
    callDur: Math.max(0.3, [0.75, 0.62, 0.55, 0.5, 0.45, 0.42][k] - extra * 0.02),
    callGap: Math.max(0.1, [0.28, 0.22, 0.2, 0.18, 0.15, 0.14][k] - extra * 0.01),
    // Part 2: the shell game in the village
    swaps: [4, 7, 9, 11, 12, 13][k] + extra,
    swapDur: Math.max(0.3, [1.0, 0.8, 0.66, 0.56, 0.5, 0.45][k] - extra * 0.02),
    sim: [1, 1, 2, 2, 2, 3][k],
    tellEvery: [1.7, 2.6, 3.6, 5, 7, Infinity][k],
    tellBubble: n <= 2,
    tries: [3, 2, 2, 1, 1, 1][k],
    chooseTime: Math.max(4.5, [9, 8, 7, 6, 6, 5][k] - extra * 0.1),
    glowFade: [2.6, 1.1, 0.7, 0.6, 0.5, 0.5][k],
    villagers: Math.min(5 + n, 11),
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'intro';      // intro | walk | arrive | fade | reveal | shuffle | choose
let part = 1;
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('lepersBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0, phaseT = 0;
let camX = 0;             // how far along the road the ten have walked
let men = [];             // the ten
let villagers = [];
let jesus = { x: 46, y: JESUS_Y, s: 1.25, face: 'calm', pose: 'open' };
let round = null;         // the current call-and-answer round in part 1
let mistakes = 0;
let p1Result = null;      // part 1 score, kept if part 2 is retried
let samaritan = null;
let moves = [];           // active swaps in the shell game
let swapsLeft = 0, swapGap = 0, tellT = 0, glowT = 0;
let triesLeft = 0, triesUsed = 0, chooseLeft = 0;
let particles = [], bubbles = [], ripples = [];
let caption = null;
let message = { text: '', t: 0 };
let fadeT = 0, shakeT = 0, hintCd = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';

// ============================================================
//  People: looks
// ============================================================
// All ten wear the same patched grey clothes and head cloth, as lepers had to.
const LEPER = { robe: '#9d9480', hair: '#5a4028', skin: '#d0a06e', beard: true, scarf: '#cfc3a8', ragged: true };

const VILLAGER_LOOKS = [
  { robe: '#3f6fb5', hair: '#3a2716', skin: '#d9a066', beard: true },
  { robe: '#c46b8c', hair: '#2e1d10', skin: '#e3b184', beard: false, scarf: '#e8dcc0' },
  { robe: '#6b8e3a', hair: '#8a8a8a', skin: '#c98d56', beard: true },
  { robe: '#d9a13a', hair: '#4a2f1a', skin: '#dca678', beard: false, scarf: '#7a4fa0' },
  { robe: '#3c8f86', hair: '#1f140c', skin: '#b87a48', beard: true },
  { robe: '#b5503f', hair: '#2a1a0e', skin: '#c58a55', beard: false, scarf: '#f0e6cc' },
  { robe: '#7a4fa0', hair: '#5c3a1c', skin: '#e3b184', beard: false },
  { robe: '#a0673a', hair: '#aaaaaa', skin: '#d39a66', beard: true, scarf: '#d8c7a0' },
  { robe: '#4b7f4b', hair: '#2d1b0f', skin: '#bf8150', beard: false, scarf: '#f3d36b' },
  { robe: '#5a6475', hair: '#2a1a0e', skin: '#c88e5a', beard: true },
  { robe: '#e07a3a', hair: '#3a2515', skin: '#d7a070', beard: false },
];

function newPerson(look, i) {
  return {
    look, i, x: 0, y: 0, s: 1, mood: 'watch', want: 'watch', switchT: 0, delay: rand(0.05, 0.45),
    pose: 'rest', spots: 0, glow: 0, blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU),
    walk: false, alpha: 1, lookAt: null, dim: 0,
  };
}

function makeMen() {
  return Array.from({ length: 10 }, (_, id) => {
    const m = newPerson(LEPER, id);
    m.id = id; m.slot = id; m.spots = 1; m.healed = false;
    m.callT = 0; m.healT = 0; m.wrongT = 0; m.tellT = 0;
    m.gone = false; m.free = false; m.bow = 0; m.say = null;
    return m;
  });
}

function makeVillagers(n) {
  const list = [];
  const looks = VILLAGER_LOOKS.slice().sort(() => Math.random() - 0.5);
  for (let i = 0; i < n; i++) {
    const v = newPerson(looks[i % looks.length], i);
    v.f = n === 1 ? 0.5 : i / (n - 1);
    v.jit = rand(-8, 8);
    v.s = 0.78; v.dim = 14;
    list.push(v);
  }
  return list;
}

// ============================================================
//  Layout
// ============================================================
function groupCX() { return W / 2 + 30; }

// Part 1: two staggered rows of five on the road
function p1Slot(k) {
  const sp = Math.min(84, (W - 90) / 5.4);
  const front = k >= 5, i = k % 5;
  return {
    x: groupCX() + (i - 2) * sp + (front ? -0.25 : 0.25) * sp,
    y: front ? P1_FRONT_Y : P1_BACK_Y,
    s: front ? 1.05 : 0.9,
  };
}
// Left-to-right order, used to pitch each man's call
function p1Rank(k) { return (k % 5) * 2 + (k >= 5 ? 0 : 1); }

// Part 2: the village square
function p2Slot(k) {
  const cx = (W + 120) / 2;
  const sp = Math.min(100, (W - 180) / 4.6);
  const front = k >= 5, i = k % 5;
  return {
    x: cx + (i - 2) * sp + (front ? -0.25 : 0.25) * sp,
    y: front ? P2_FRONT_Y : P2_BACK_Y,
  };
}
function scaleAtY(y) { return clamp(0.96 + (y - P2_BACK_Y) / (P2_FRONT_Y - P2_BACK_Y) * 0.14, 0.84, 1.16); }

function jesusScreenX() { return part === 1 ? 48 - camX : 54; }
function jesusY() { return part === 1 ? JESUS_Y : P2_FRONT_Y; }
function gateScreenX() { return groupCX() + 215 + (ROAD - camX); }

// Place everyone for this frame
function placeMen() {
  const walking = part === 1 && (phase === 'walk' || phase === 'arrive') && state === 'play';
  for (const m of men) {
    if (m.free) { m.s = scaleAtY(m.y); continue; }
    if (part === 1) {
      const p = p1Slot(m.slot);
      m.x = p.x; m.y = p.y; m.s = p.s;
      m.walk = walking || (state === 'fail' && false);
      m.lookAt = phase === 'intro' || state === 'title' ? { x: jesusScreenX(), y: JESUS_Y - 60 } : null;
    } else {
      const drift = phase === 'choose' && state === 'play' ? (1 - chooseLeft / cfg.chooseTime) * 30 : 0;
      const mv = moves.find((q) => q.a === m || q.b === m);
      if (mv) {
        const f = ease(clamp(mv.t / mv.dur, 0, 1));
        const from = p2Slot(mv.a === m ? mv.sa : mv.sb), to = p2Slot(mv.a === m ? mv.sb : mv.sa);
        m.x = lerp(from.x, to.x, f);
        m.y = lerp(from.y, to.y, f) + (mv.a === m ? -42 : 30) * Math.sin(f * Math.PI);
        m.walk = true;
      } else {
        const p = p2Slot(m.slot);
        m.x = p.x + drift; m.y = p.y;
        m.walk = drift > 0;
      }
      m.s = scaleAtY(m.y);
    }
  }
  for (const v of villagers) {
    v.x = lerp(110, W - 24, v.f) + v.jit;
    v.y = VILLAGER_Y + (v.i % 2) * 6;
  }
  jesus.x = jesusScreenX();
  jesus.y = jesusY();
}

// ============================================================
//  Drawing people
// ============================================================
function drawPerson(p) {
  const s = p.s, mood = p.mood, L = p.look;
  const C = (c) => (p.dim ? shade(c, -p.dim) : c);
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + p.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  const bob = p.walk ? Math.abs(Math.sin(t * 8 + p.phase)) * 3.5 : 0;

  ctx.save();
  if (p.alpha < 1) ctx.globalAlpha = Math.max(0, p.alpha);

  // Healing glow on the ground and around him
  if (p.glow > 0.01) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s, s);
    const g = ctx.createRadialGradient(0, -36, 6, 0, -36, 62);
    g.addColorStop(0, `rgba(255,236,150,${0.75 * p.glow})`);
    g.addColorStop(1, 'rgba(255,236,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -36, 62, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(245,190,40,${0.8 * p.glow})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 2, 26, 7, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  ctx.translate(p.x, p.y - (jump + bob) * s);
  ctx.rotate(p.walk ? Math.sin(t * 8 + p.phase) * 0.04 : 0);
  ctx.scale(s, s);

  const sleeve = C(L.robe) === L.robe ? shade(L.robe, -25) : shade(L.robe, -25 - p.dim);
  const skin = C(L.skin);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Which way the eyes look
  let lx = 0, ly = 0.3;
  if (p.lookAt) {
    const dx = p.lookAt.x - p.x, dy = p.lookAt.y - (p.y - 52 * s);
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  const armsUp = p.pose === 'plead' || p.pose === 'praise' || mood === 'joy';
  if (armsUp) {
    const wave = Math.sin(t * (p.pose === 'plead' ? 6 : 9) + p.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (p.pose === 'wave') {
    arm(11, -32, 22 + Math.sin(t * 10 + p.phase) * 5, -68);
  }

  // Robe (ragged hem for the ten)
  ctx.fillStyle = C(L.robe);
  ctx.strokeStyle = shade(L.robe, -40 - p.dim);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  if (L.ragged) {
    for (let k = 1; k <= 6; k++) ctx.lineTo(18 - k * 6, k % 2 ? -5 : 0);
  }
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (L.ragged) {
    // patches
    ctx.fillStyle = shade(L.robe, -18 - p.dim);
    roundRect(5, -27, 8, 7, 2); ctx.fill();
    roundRect(-13, -11, 7, 6, 2); ctx.fill();
    ctx.strokeStyle = shade(L.robe, -45 - p.dim); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(6, -24); ctx.lineTo(12, -24); ctx.moveTo(-12, -8); ctx.lineTo(-7, -8); ctx.stroke();
  } else {
    ctx.strokeStyle = C('#c9b07a'); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }

  // Resting arms
  if (!armsUp) {
    if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }   // hands clasped
    else if (mood !== 'shock' && !(mood === 'dismay' && p.i % 2 === 0)) {
      arm(-11, -32, -15, -12);
      if (p.pose !== 'wave') arm(11, -32, 15, -12);
    }
  }

  // Head
  const hy = -53;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (L.scarf) {
    ctx.fillStyle = C(L.scarf);
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(L.scarf, -40 - p.dim); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = C(L.hair);
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (L.beard) {
    ctx.fillStyle = C(L.hair);
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace({ hair: L.hair, blink: p.blink, i: p.i }, mood, hy, lx, ly);

  // Gentle spots that fade away when he is cleansed
  if (p.spots > 0.01) {
    for (const [sx, sy, r] of [[-10, hy - 7, 2.6], [9, hy - 9, 2.1], [11, hy + 3, 2.3], [-12, hy + 4, 1.9], [3, hy - 12, 1.7]]) {
      ctx.fillStyle = `rgba(190,104,96,${0.85 * p.spots})`;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(235,160,150,${0.7 * p.spots})`;
      ctx.beginPath(); ctx.arc(sx - r * 0.3, sy - r * 0.3, r * 0.45, 0, TAU); ctx.fill();
    }
    for (const [sx, sy] of [[-6, -22], [8, -12], [-3, -32]]) {
      ctx.fillStyle = `rgba(150,90,80,${0.5 * p.spots})`;
      ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, TAU); ctx.fill();
    }
  }

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && p.i % 2 === 0) {
    arm(-11, -32, -15, -12);
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  }
  ctx.restore();
}

// The Samaritan fallen on his face at Jesus's feet, giving thanks
function drawBowed(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.s, p.s);
  const L = p.look;
  const g = ctx.createRadialGradient(-6, -14, 4, -6, -14, 60);
  g.addColorStop(0, 'rgba(255,236,150,0.6)'); g.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-6, -14, 60, 0, TAU); ctx.fill();
  // arms reaching forward on the ground
  ctx.strokeStyle = shade(L.robe, -25); ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -18); ctx.lineTo(-40, -4); ctx.moveTo(-6, -14); ctx.lineTo(-36, 0); ctx.stroke();
  ctx.fillStyle = L.skin;
  ctx.beginPath(); ctx.arc(-41, -4, 4, 0, TAU); ctx.arc(-37, 0, 4, 0, TAU); ctx.fill();
  // body as a low mound
  ctx.fillStyle = L.robe; ctx.strokeStyle = shade(L.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-16, -30, 4, -30);
  ctx.quadraticCurveTo(24, -28, 26, 0);
  for (let k = 1; k <= 7; k++) ctx.lineTo(26 - k * 6.3, k % 2 ? -4 : 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(L.robe, -18);
  roundRect(6, -22, 8, 7, 2); ctx.fill();
  // head bowed low, head cloth toward us
  ctx.fillStyle = L.skin;
  ctx.beginPath(); ctx.arc(-24, -12, 12, 0, TAU); ctx.fill();
  ctx.fillStyle = L.scarf;
  ctx.beginPath(); ctx.arc(-22, -15, 13.5, Math.PI * 0.75, Math.PI * 2.05); ctx.closePath(); ctx.fill();
  ctx.fillStyle = L.hair;
  ctx.beginPath(); ctx.ellipse(-33, -6, 5, 7, 0.4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);

  if (j.pose === 'bless' || j.face === 'joy') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();
  // sandals
  ctx.fillStyle = '#8a5a2b';
  roundRect(-11, -2, 9, 4, 2); ctx.fill();
  roundRect(2, -2, 9, 4, 2); ctx.fill();

  // Arms: open and welcoming, pointing the way, raised in blessing, or reaching down
  const up = j.pose === 'bless';
  let hands = [[-20, -22], [20, -22]];
  if (up) hands = [[-21, -66], [21, -66]];
  else if (j.pose === 'point') hands = [[-20, -22], [27, -40]];
  else if (j.pose === 'reach') hands = [[-20, -22], [24, -12]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
    if (j.face === 'sad') {
      ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6.5, -56); ctx.lineTo(-2, -57.5); ctx.moveTo(6.5, -56); ctx.lineTo(2, -57.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  if (j.face === 'sad') ctx.arc(0, -44.5, 2.4, 1.2 * Math.PI, 1.8 * Math.PI);
  else ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Moods
// ============================================================
function updatePeople(dt) {
  const all = men.concat(villagers);
  for (const p of all) {
    p.blinkT -= dt;
    if (p.blinkT <= 0) { p.blink = 0.13; p.blinkT = rand(1.5, 5); }
    if (p.blink > 0) p.blink -= dt;
  }
  for (const m of men) {
    m.callT = Math.max(0, m.callT - dt);
    m.healT = Math.max(0, m.healT - dt);
    m.wrongT = Math.max(0, m.wrongT - dt);
    m.tellT = Math.max(0, m.tellT - dt);
    if (m.healed && m.spots > 0) m.spots = Math.max(0, m.spots - dt * 1.6);
    m.pose = 'rest';
    let mood;
    if (part === 1) {
      mood = m.healed ? (m.healT > 0 ? 'joy' : 'watch') : 'worried';
      if (m.callT > 0 || (phase === 'intro' && state === 'play' && phaseT < 2.6) || state === 'title') { mood = 'wow'; m.pose = 'plead'; }
      if (state === 'title') { mood = 'worried'; }
      if (m.wrongT > 0) mood = 'shock';
      if (state === 'fail' && !m.healed) mood = 'dismay';
      m.glow = m.callT > 0 ? 1 : Math.max(0, m.glow - dt * 3);
    } else {
      mood = 'watch';
      if (m === samaritan) {
        if (phase === 'reveal' || m.tellT > 0 || state === 'win' || state === 'fail') { mood = 'joy'; m.pose = 'praise'; }
        const target = phase === 'reveal' || state === 'fail' ? 1 : phase === 'shuffle' ? Math.max(0, 1 - glowT / cfg.glowFade) : 0;
        m.glow = state === 'win' ? 1 : Math.max(target, m.tellT > 0 ? 0.35 : 0);
      } else {
        m.glow = 0;
        if (m.wrongT > 0) mood = 'wow';
      }
      if (m.gone) { m.x += 90 * dt; m.alpha -= dt * 0.8; m.walk = true; }
      m.lookAt = phase === 'reveal' && m !== samaritan ? { x: samaritan.x, y: samaritan.y - 50 } : null;
    }
    m.mood = mood;
  }

  // Villagers react with a little delay each, like a real crowd
  let want = 'watch';
  if (state === 'win') want = 'joy';
  else if (state === 'fail') want = 'dismay';
  else if (phase === 'reveal' || (samaritan && samaritan.tellT > 0)) want = 'wow';
  else if (phase === 'choose' && chooseLeft < cfg.chooseTime * 0.35) want = 'worried';
  for (const v of villagers) {
    if (want !== v.mood) {
      v.switchT += dt;
      if (v.switchT > v.delay) { v.mood = want; v.switchT = 0; }
    } else v.switchT = 0;
    v.pose = v.mood === 'wow' && v.i % 3 === 0 ? 'wave' : 'rest';
    v.lookAt = samaritan ? { x: samaritan.x, y: samaritan.y - 50 } : null;
  }

  // Jesus
  if (state === 'win') { jesus.face = 'joy'; jesus.pose = part === 2 && samaritan && samaritan.bow > 0 ? 'reach' : 'bless'; }
  else if (state === 'fail') { jesus.face = 'sad'; jesus.pose = 'open'; }
  else if (part === 1 && phase === 'intro' && phaseT > 2.6) { jesus.face = 'calm'; jesus.pose = 'point'; }
  else { jesus.face = 'calm'; jesus.pose = 'open'; }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function sparkle(x, y, n, spread = 30) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(20, 110);
    spawn(x + rand(-spread, spread) * 0.3, y + rand(-spread, spread) * 0.3, Math.cos(a) * sp, Math.sin(a) * sp - 30, rand(0.5, 1.2),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4), 40);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Speech bubbles, captions, messages
// ============================================================
// who: 'jesus' or a person. key: a VERSES key, or text: plain words.
function say(who, opts) { bubbles = bubbles.filter((b) => b.who !== who); bubbles.push({ who, t: opts.dur || 2.2, ...opts }); }

function speakerPos(who) {
  if (who === 'jesus') return { x: jesus.x, y: jesus.y - 78 * jesus.s };
  if (who.bow > 0) return { x: who.x - 20, y: who.y - 40 };
  return { x: who.x, y: who.y - 76 * who.s };
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawBubble(sx, sy, text, maxW = 240, small = false, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = small ? '600 13px Fredoka, sans-serif' : '600 15px Fredoka, sans-serif';
  const mw = Math.min(maxW, W - 40);
  const lines = wrapText(text, mw);
  const lh = small ? 16 : 19, pad = small ? 7 : 10;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + pad * 2;
  const h = lines.length * lh + pad * 2 - 4;
  const bx = clamp(sx - w / 2, -offX + 8, W + offX - w - 8);
  let by = sy - h - 14;
  if (by < 104 - offY) by = 104 - offY;
  ctx.fillStyle = 'rgba(255,253,244,0.96)'; ctx.strokeStyle = '#c9a13a'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  // tail toward the speaker
  const tx = clamp(sx, bx + 14, bx + w - 14);
  if (sy > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(sx, Math.min(sy, by + h + 14)); ctx.lineTo(tx + 8, by + h - 1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillRect(tx - 7, by + h - 3, 14, 3);
  }
  ctx.fillStyle = '#4a3512'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh));
  ctx.restore();
}

function drawBubbles() {
  for (const b of bubbles) {
    const p = speakerPos(b.who);
    const text = b.key ? Bible.verse(VERSES[b.key]).text : b.text;
    drawBubble(p.x, p.y, text, b.small ? 160 : 240, b.small, clamp(b.t / 0.3, 0, 1));
  }
}

function showCaption(key, dur = 3.4) { caption = { key, t: dur }; }

function drawCaption() {
  if (!caption || caption.t <= 0) return;
  const v = Bible.verse(VERSES[caption.key]);
  ctx.save();
  ctx.globalAlpha = clamp(caption.t / 0.5, 0, 1);
  const maxW = Math.min(540, W - 30);
  ctx.font = 'italic 600 16px Fredoka, sans-serif';
  const lines = wrapText(`"${v.text}"`, maxW - 28);
  const h = lines.length * 21 + 36;
  const x = (W - maxW) / 2, y = 150 - offY * 0.5;
  ctx.fillStyle = 'rgba(255,252,240,0.93)'; ctx.strokeStyle = 'rgba(201,161,58,0.8)'; ctx.lineWidth = 2;
  roundRect(x, y, maxW, h, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a4210'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y + 10 + i * 21));
  ctx.font = '600 12px Fredoka, sans-serif'; ctx.fillStyle = '#8a7446';
  ctx.fillText(`— ${v.cite}`, W / 2, y + h - 20);
  ctx.restore();
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.47);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, H * 0.47);
  ctx.restore();
}

// ============================================================
//  Part 1: "Jesus, Master, have mercy on us" - the order game
// ============================================================
// Each round a few of the ten call out, one after another. Tap them in the
// same order and each one is cleansed as they walk to the priests.
function startRound() {
  const left = men.filter((m) => !m.healed);
  if (!left.length) return;
  const size = Math.min(cfg.sizes.shift() || 5, left.length);
  const pick = left.sort(() => Math.random() - 0.5).slice(0, size);
  round = { seq: pick, i: 0, next: 0, stage: 'call', t: -0.3 };
}

function updateRound(dt) {
  if (!round) return;
  round.t += dt;
  if (round.stage === 'call') {
    const step = cfg.callDur + cfg.callGap;
    const idx = Math.floor(round.t / step);
    if (round.t >= 0 && idx >= round.i && idx < round.seq.length) {
      const m = round.seq[idx];
      m.callT = cfg.callDur;
      sfx.call(p1Rank(m.id));
      round.i = idx + 1;
    }
    if (round.t >= round.seq.length * step) {
      round.stage = 'input';
      round.t = 0;
      if (level === 1 && men.filter((m) => m.healed).length < 4) showMessage('Your turn! Tap them in order', 1.6);
    }
  } else if (round.stage === 'pause') {
    if (round.t > 0.7) {
      if (men.every((m) => m.healed)) allHealed();
      else startRound();
    }
  } else if (round.stage === 'replay') {
    if (round.t > 0.9) { round.stage = 'call'; round.t = -0.1; round.i = 0; }
  }
}

function tapPart1(px, py) {
  if (phase !== 'walk' || !round) return;
  const m = hitMan(px, py);
  if (!m) return;
  if (round.stage !== 'input') {
    if (hintCd <= 0) { showMessage('Listen first...', 1.2); hintCd = 1.5; }
    return;
  }
  if (m.healed) {
    if (hintCd <= 0) { say(m, { text: 'I am already clean!', small: true, dur: 1.2 }); hintCd = 1; }
    return;
  }
  ripples.push({ x: px, y: py, t: 0 });
  if (m === round.seq[round.next]) {
    heal(m);
    round.next++;
    if (round.next >= round.seq.length) { round.stage = 'pause'; round.t = 0; }
  } else {
    // Wrong one: the rest of the round is called again
    mistakes++;
    m.wrongT = 0.7;
    sfx.bounce();
    shakeT = 0.15;
    showMessage('Listen again...', 1.2);
    round.seq = round.seq.slice(round.next);
    round.next = 0;
    round.stage = 'replay';
    round.t = 0;
  }
}

function heal(m) {
  m.healed = true;
  m.healT = 1.4;
  m.glow = 1;
  sparkle(m.x, m.y - 50 * m.s, 18);
  sfx.heal(p1Rank(m.id));
}

function allHealed() {
  round = null;
  const roadLeft = clamp(1 - camX / ROAD, 0, 1);
  p1Result = { healed: 500, road: Math.round(roadLeft * 400), perfect: mistakes === 0 ? 200 : 0 };
  phase = 'arrive'; phaseT = 0;
  showCaption('cleansed', 3.6);
  sfx.win();
  for (const m of men) { m.healT = 2; sparkle(m.x, m.y - 50 * m.s, 6); }
}

function updatePart1(dt) {
  if (phase === 'intro') {
    if (phaseT < 0.1 && !bubbles.length) say(men[2], { key: 'mercy', dur: 2.6 });
    if (phaseT > 2.6 && phaseT - dt <= 2.6) say('jesus', { key: 'go', dur: 2.6 });
    if (phaseT > 5.2) {
      phase = 'walk'; phaseT = 0;
      startRound();
      if (level === 1) showMessage('Watch who calls out...', 1.8);
    }
  } else if (phase === 'walk') {
    camX += (ROAD / cfg.roadTime) * dt;
    updateRound(dt);
    if (camX >= ROAD && state === 'play') { camX = ROAD; fail('road'); }
  } else if (phase === 'arrive') {
    camX = Math.min(ROAD, camX + Math.max(260, ROAD / cfg.roadTime * 3) * dt);
    if (camX >= ROAD && phaseT > 2.4) { phase = 'fade'; phaseT = 0; fadeT = 0; }
  } else if (phase === 'fade') {
    fadeT = Math.min(1, phaseT / 0.5);
    if (phaseT >= 0.5) startPart2();
  }
}

// ============================================================
//  Part 2: the one who turned back - the shell game
// ============================================================
function startPart2() {
  part = 2;
  state = 'play';
  syncAmbience();
  hideOverlay();
  camX = ROAD;
  villagers = makeVillagers(cfg.villagers);
  for (const m of men) {
    m.healed = true; m.spots = 0; m.gone = false; m.alpha = 1; m.free = false; m.bow = 0;
    m.callT = m.healT = m.wrongT = m.tellT = 0;
  }
  const order = men.map((m) => m.id).sort(() => Math.random() - 0.5);
  men.forEach((m, k) => { m.slot = order[k]; });
  samaritan = men[Math.floor(Math.random() * 10)];
  moves = []; bubbles = []; ripples = [];
  swapsLeft = cfg.swaps; swapGap = 0; tellT = cfg.tellEvery; glowT = 0;
  triesLeft = cfg.tries; triesUsed = 0; chooseLeft = cfg.chooseTime;
  phase = 'reveal'; phaseT = 0; fadeT = 1;
  placeMen();
  showCaption('turned', 3.2);
  say(samaritan, { text: 'Glory to God!', small: true, dur: 2.2 });
  sparkle(samaritan.x, samaritan.y - 50, 20);
  sfx.chime();
}

function startSwaps() {
  const free = men.filter((m) => !moves.some((q) => q.a === m || q.b === m)).sort(() => Math.random() - 0.5);
  const n = Math.min(cfg.sim, swapsLeft, Math.floor(free.length / 2));
  for (let k = 0; k < n; k++) {
    // swap with a near-ish neighbour most of the time, so it can be followed
    const a = free.shift();
    free.sort((p, q) => Math.abs(p2Slot(p.slot).x - p2Slot(a.slot).x) - Math.abs(p2Slot(q.slot).x - p2Slot(a.slot).x));
    const b = Math.random() < 0.7 ? free.shift() : free.splice(Math.floor(Math.random() * free.length), 1)[0];
    moves.push({ a, b, sa: a.slot, sb: b.slot, t: 0, dur: cfg.swapDur });
    swapsLeft--;
  }
  sfx.puff(0.12);
}

function updatePart2(dt) {
  if (fadeT > 0) fadeT = Math.max(0, fadeT - dt * 2);
  if (phase === 'reveal') {
    if (phaseT > 2.4) {
      phase = 'shuffle'; phaseT = 0;
      showMessage(level === 1 ? 'Keep your eye on him!' : 'Watch him!', 1.4);
    }
  } else if (phase === 'shuffle') {
    glowT += dt;
    for (let i = moves.length - 1; i >= 0; i--) {
      const q = moves[i];
      q.t += dt;
      if (q.t >= q.dur) { q.a.slot = q.sb; q.b.slot = q.sa; moves.splice(i, 1); }
    }
    swapGap -= dt;
    if (!moves.length && swapGap <= 0) {
      if (swapsLeft > 0) { startSwaps(); swapGap = 0.12; }
      else {
        phase = 'choose'; phaseT = 0;
        showMessage('Which one turned back?', 1.8);
      }
    }
    // Now and then he lifts his hands in praise, just for a moment
    tellT -= dt;
    if (tellT <= 0 && phaseT > 0.8) {
      tellT = cfg.tellEvery * rand(0.8, 1.2);
      samaritan.tellT = level <= 2 ? 0.55 : 0.4;
      spawn(samaritan.x, samaritan.y - 80 * samaritan.s, 0, -40, 0.6, '#ffe27a', 3);
      if (cfg.tellBubble) say(samaritan, { text: 'Glory to God!', small: true, dur: 0.8 });
      sfx.chime(0.5);
    }
  } else if (phase === 'choose') {
    chooseLeft -= dt;
    if (chooseLeft <= 0 && state === 'play') { chooseLeft = 0; fail('lost'); }
  }
}

function tapPart2(px, py) {
  if (phase === 'reveal' || phase === 'shuffle') {
    if (hintCd <= 0) { showMessage('Wait... keep watching!', 1.2); hintCd = 1.5; }
    return;
  }
  if (phase !== 'choose') return;
  const m = hitMan(px, py);
  if (!m || m.gone) return;
  ripples.push({ x: px, y: py, t: 0 });
  if (m === samaritan) { found(); return; }
  triesLeft--; triesUsed++;
  m.wrongT = 1; m.gone = true;
  const lines = ['Not me! I am off to the priests!', 'Not me! Off to the priest!', 'Not me! I am going home!'];
  say(m, { text: lines[triesUsed % lines.length], small: true, dur: 1.4 });
  sfx.bounce();
  if (triesLeft <= 0) fail('lost');
}

function found() {
  state = 'win';
  syncAmbience();
  const s = samaritan;
  s.free = true; s.tellT = 0;
  const p2 = { found: 500, quick: Math.round(clamp(chooseLeft / cfg.chooseTime, 0, 1) * 300), first: triesUsed === 0 ? 200 : 0 };
  const p1 = p1Result || { healed: 500, road: 0, perfect: 0 };
  const levelBonus = level * 300;
  const score = p1.healed + p1.road + p1.perfect + p2.found + p2.quick + p2.first + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('lepersBest', best); } catch (e) {} }
  lastScore = { ...p1, ...p2, levelBonus, score };
  for (const m of men) if (m !== s) m.gone = true;
  sparkle(s.x, s.y - 50, 30);
  say(s, { text: 'Thank You, Lord!', small: true, dur: 1.6 });
  sfx.chime();
  endTimer = 99;   // the card waits until he is at Jesus's feet
}

function updateWin(dt) {
  if (part !== 2 || !samaritan) return;
  const s = samaritan;
  const tx = jesus.x + 72, ty = P2_FRONT_Y + 4;
  if (s.bow <= 0) {
    const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
    if (d > 4) {
      const sp = 320 * dt;
      s.x += dx / d * Math.min(sp, d); s.y += dy / d * Math.min(sp, d);
      s.walk = true;
    } else {
      s.bow = 1; s.walk = false;
      sparkle(s.x - 10, s.y - 20, 24);
      sfx.win();
      say('jesus', { key: 'whole', dur: 3.4 });
      endTimer = 3.6;
    }
  }
  if (s.bow > 0 && Math.random() < dt * 10) spawn(s.x + rand(-40, 30), s.y - rand(0, 60), 0, -25, 1, '#fff6d0', 3);
}

// ============================================================
//  Hit testing
// ============================================================
function hitMan(px, py) {
  let bestM = null, bestD = Infinity;
  for (const m of men) {
    if (m.gone || m.alpha < 0.5) continue;
    const cx = m.x, cy = m.y - 38 * m.s;
    const dx = Math.abs(px - cx) / (26 * m.s), dy = Math.abs(py - cy) / (44 * m.s);
    const d = Math.hypot(dx, dy);
    // prefer whoever is in front when bodies overlap
    const score = d - m.y * 0.001;
    if (d < 1.25 && score < bestD) { bestD = score; bestM = m; }
  }
  return bestM;
}

// ============================================================
//  Win / fail
// ============================================================
function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  round = null;
  if (reason === 'lost') {
    for (const m of men) if (m !== samaritan) m.gone = true;
    samaritan.glow = 1;
    say('jesus', { key: 'whereNine', dur: 3 });
  } else {
    showMessage('They have reached the priests...', 2);
  }
  sfx.fail();
  endTimer = reason === 'lost' ? 3.2 : 2.2;
}

}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('He came back!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('thanks')}
       <p class="score">Ten cleansed: <b>${s.healed}</b> &nbsp; Road left: <b>${s.road}</b>${s.perfect ? ` &nbsp; Perfect listening: <b>${s.perfect}</b>` : ''}<br>

    } else {

}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  A sung voice with organ: used for each leper's own call note
//  (win, start, fail and tap music come from music.js)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Each of the ten calls on his own note, rising from left to right
const CALL_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5', 'B5'];
function playCallNote(ac, out, t0, idx, vol = 0.12) {
  const n = CALL_SCALE[clamp(idx, 0, CALL_SCALE.length - 1)];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, vol);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  call(idx) { if (this.ctx) playCallNote(this.ctx, this.master, this.ctx.currentTime + 0.01, idx); },
  heal(idx) {
    if (!this.ctx) return;
    playCallNote(this.ctx, this.master, this.ctx.currentTime + 0.01, idx, 0.1);
    this.tone(1320, 0.25, 'sine', 0.12, 0.05);
    this.tone(1760, 0.3, 'sine', 0.1, 0.12);
  },
  chime(vol = 1) {
    this.tone(988, 0.3, 'sine', 0.14 * vol);
    this.tone(1480, 0.35, 'sine', 0.1 * vol, 0.08);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
};

// ============================================================
//  Rendering: scenery
// ============================================================
const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(140, 380), w: rand(80, 160), speed: rand(4, 10) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, 560);
  g.addColorStop(0, '#8fcaf0');
  g.addColorStop(0.6, '#cfeafa');
  g.addColorStop(1, '#fff1cf');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // sun
  const sx = W * 0.82, sy = 170;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 110);
  sg.addColorStop(0, 'rgba(255,245,200,0.95)'); sg.addColorStop(0.35, 'rgba(255,230,150,0.45)'); sg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 110, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff4c2'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
  for (const c of bgClouds) {
    const x = -offX - 150 + ((c.f * (viewW + 300) - camX * 0.05) % (viewW + 300) + viewW + 300) % (viewW + 300);
    drawCloud(x, c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.9)', 'rgba(220,235,250,0.8)');
  }
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function hillLine(color, base, amp, freq, par, bottom = H) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1; x += 16) {
    const wx = x + camX * par;
    ctx.lineTo(x, base + Math.sin(wx / freq) * amp + Math.sin(wx / (freq * 0.37)) * amp * 0.3);
  }
  ctx.lineTo(x1, bottom); ctx.closePath(); ctx.fill();
}

function drawOlive(x, y, s) {
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x, y - 55 * s); ctx.stroke();
  ctx.fillStyle = '#7d9460';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
    ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU);
  }
  ctx.fill();
}

function drawPalm(x, y, s) {
  ctx.strokeStyle = '#8a6238'; ctx.lineWidth = 8 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10 * s, y - 60 * s, x + 4 * s, y - 120 * s); ctx.stroke();
  ctx.strokeStyle = '#4f8a3a'; ctx.lineWidth = 7 * s;
  const tx = x + 4 * s, ty = y - 120 * s;
  for (let k = 0; k < 7; k++) {
    const a = Math.PI + (k / 6) * Math.PI + Math.sin(t * 1.3 + k) * 0.04;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * 30 * s, ty + Math.sin(a) * 30 * s - 8 * s, tx + Math.cos(a) * 55 * s, ty + Math.sin(a) * 40 * s + 18 * s);
    ctx.stroke();
  }
}

function drawHouse(x, y, w, h, col) {
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 2;
  ctx.fillRect(x, y - h, w, h); ctx.strokeRect(x, y - h, w, h);
  ctx.fillStyle = shade(col, -18);
  ctx.fillRect(x - 4, y - h - 8, w + 8, 10);
  ctx.fillStyle = '#7a5332';
  roundRect(x + w * 0.5 - 11, y - 38, 22, 38, [11, 11, 0, 0]); ctx.fill();
  ctx.fillStyle = '#5a3d22';
  if (w > 70) { roundRect(x + 12, y - h + 18, 14, 14, 4); ctx.fill(); roundRect(x + w - 26, y - h + 18, 14, 14, 4); ctx.fill(); }
  else { roundRect(x + w * 0.5 - 7, y - h + 16, 14, 14, 4); ctx.fill(); }
}

// Part 1: the long road to the priests
function drawRoad() {
  hillLine('#b8d28f', 520, 22, 140, 0.12);
  hillLine('#a3c878', 575, 14, 90, 0.35);
  // trees along the way
  for (let i = -2; i < 20; i++) {
    const wx = i * 230 + 90;
    const x = wx - camX * 0.6;
    if (x < -offX - 80 || x > W + offX + 80) continue;
    drawOlive(x, 604 + (i % 2) * 6, 0.75 + (i % 3) * 0.08);
  }
  // road
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#e6d3a3';
  ctx.fillRect(x0, 610, x1 - x0, 200);
  ctx.fillStyle = '#d4bd88';
  ctx.fillRect(x0, 610, x1 - x0, 5);
  // pebbles move with the walk
  ctx.fillStyle = '#c9b07c';
  for (let i = 0; i < 60; i++) {
    const wx = i * 53;
    const x = ((wx - camX) % 3180 + 3180) % 3180 - offX - 40;
    if (x > W + offX + 20) continue;
    const y = 630 + ((i * 37) % 160);
    ctx.beginPath(); ctx.ellipse(x, y, 4 + (i % 3), 2.4, 0, 0, TAU); ctx.fill();
  }
  // grass
  ctx.fillStyle = '#8fbf5f';
  ctx.fillRect(x0, 800, x1 - x0, H - 800 + 20);
  ctx.strokeStyle = '#78a94c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 50; i++) {
    const x = ((i * 71 - camX * 1.1) % 3550 + 3550) % 3550 - offX - 40;
    if (x > W + offX + 20) continue;
    const y = 830 + ((i * 29) % 50);
    ctx.moveTo(x, y); ctx.lineTo(x - 3, y - 8); ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 9);
  }
  ctx.stroke();

  // The village gate where the priests are
  const gx = gateScreenX();
  if (gx < W + offX + 200) drawGate(gx);
}

function drawGate(gx) {
  // houses peeking over the wall
  drawHouse(gx + 10, 560, 80, 70, '#e7cfa3');
  drawHouse(gx + 100, 560, 90, 90, '#dcb98a');
  // wall and arch
  ctx.fillStyle = '#d8c29a'; ctx.strokeStyle = '#a88b5c'; ctx.lineWidth = 2;
  ctx.fillRect(gx - 20, 520, 320, 100); ctx.strokeRect(gx - 20, 520, 320, 100);
  for (let k = 0; k < 11; k++) ctx.fillRect(gx - 20 + k * 30, 508, 18, 14);
  ctx.fillStyle = '#6b4a2b';
  roundRect(gx + 20, 545, 54, 75, [27, 27, 0, 0]); ctx.fill();
  // a priest waiting at the gate
  const pr = { look: { robe: '#f4f1e6', hair: '#9a9a9a', skin: '#d9a066', beard: true, scarf: '#4a6fb5' }, i: 0, x: gx + 47, y: 628, s: 0.9,
    mood: 'watch', pose: 'rest', spots: 0, glow: 0, blink: 0, phase: 0, walk: false, alpha: 1, lookAt: { x: groupCX(), y: 600 }, dim: 0 };
  drawPerson(pr);
}

// Part 2: the village square
function drawVillage() {
  hillLine('#b8d28f', 470, 20, 140, 0);
  const cols = ['#e7cfa3', '#dcb98a', '#efd9b4', '#e3c19a', '#d9b48c'];
  const x0 = -offX - 40;
  let x = x0, k = 0;
  while (x < W + offX + 40) {
    const w = 80 + ((k * 37) % 50), h = 90 + ((k * 53) % 70);
    drawHouse(x, 590, w, h, cols[k % cols.length]);
    x += w + 14; k++;
  }
  drawPalm(W * 0.28, 600, 0.9);
  drawPalm(W - 50, 600, 0.8);
  // square
  ctx.fillStyle = '#ead8ab';
  ctx.fillRect(-offX - 10, 590, viewW + 20, H - 590 + 20);
  ctx.strokeStyle = 'rgba(180,150,100,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let y = 620; y < H; y += 44) { ctx.moveTo(-offX, y); ctx.lineTo(W + offX, y); }
  ctx.stroke();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Ten Lepers' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  if (state !== 'title') {
    if (part === 1) {
      ctx.fillText('HEALED', 12, 50);
      ctx.shadowBlur = 0;
      men.forEach((m, i) => {
        ctx.fillStyle = m.healed ? '#f2b928' : 'rgba(90,66,16,0.25)';
        ctx.beginPath(); ctx.arc(70 + i * 13, 46, 5, 0, TAU); ctx.fill();
      });
    } else {
      ctx.fillText('TRIES', 12, 50);
      ctx.shadowBlur = 0;
      for (let i = 0; i < cfg.tries; i++) drawHeart(62 + i * 18, 46, i < triesLeft);
    }
  }

  // Buttons
  for (const b of hudButtons()) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score + road / time bar
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SCORE', rx, 20);
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.fillText(`${totalScore}`, rx, 40);
  if (state === 'play') {
    let label = null, frac = 0, warn = false;
    if (part === 1 && phase !== 'intro') { label = 'ROAD TO THE PRIESTS'; frac = clamp(camX / ROAD, 0, 1); warn = frac > 0.8 && phase === 'walk'; }
    else if (part === 2 && phase === 'choose') { label = 'BEFORE HE BLENDS IN'; frac = clamp(chooseLeft / cfg.chooseTime, 0, 1); warn = frac < 0.35; }
    if (label) {
      ctx.font = '600 11px Fredoka, sans-serif';
      ctx.fillText(label, rx, 60);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(90,66,16,0.25)';
      roundRect(rx - 140, 66, 140, 11, 5.5); ctx.fill();
      ctx.fillStyle = warn && Math.sin(t * 10) > 0 ? '#ff6b6b' : '#f2b928';
      if (frac > 0) { roundRect(rx - 140, 66, 140 * frac, 11, 5.5); ctx.fill(); }
    }
  }
  ctx.restore();
}

function drawHeart(x, y, full) {
  ctx.fillStyle = full ? '#e0485a' : 'rgba(90,66,16,0.25)';
  ctx.beginPath();
  ctx.moveTo(x, y + 6);
  ctx.bezierCurveTo(x - 9, y - 1, x - 5, y - 8, x, y - 3);
  ctx.bezierCurveTo(x + 5, y - 8, x + 9, y - 1, x, y + 6);
  ctx.fill();
}

// ============================================================
//  Render
// ============================================================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  placeMen();
  drawSky();
  if (part === 1) {
    drawRoad();
    if (jesus.x > -offX - 60) drawJesus(jesus);
  } else {
    drawVillage();
    for (const v of villagers) drawPerson(v);
    drawJesus(jesus);
  }
  const order = men.slice().sort((a, b) => a.y - b.y);
  for (const m of order) { if (m.bow > 0) drawBowed(m); else drawPerson(m); }
  drawParticles();

  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 60, 0, TAU); ctx.stroke();
  }

  drawBubbles();
  drawCaption();
  drawMessage();

  if (fadeT > 0) {
    ctx.fillStyle = `rgba(255,250,235,${fadeT})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  phaseT += dt;
  for (const c of bgClouds) { c.f += c.speed * dt / (viewW + 300); if (c.f > 1) c.f -= 1; }
  placeMen();
  if (state === 'play') {
    if (part === 1) updatePart1(dt); else updatePart2(dt);
  } else if (state === 'win') {
    updateWin(dt);
    if (part === 2) for (const m of moves) m.t = m.dur;
  } else if (state === 'fail') {
    if (fadeT > 0) fadeT = Math.max(0, fadeT - dt * 2);
  }
  updatePeople(dt);
  updateParticles(dt);
  shakeT = Math.max(0, shakeT - dt);
  hintCd = Math.max(0, hintCd - dt);
  message.t -= dt;
  if (caption) caption.t -= dt;
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
