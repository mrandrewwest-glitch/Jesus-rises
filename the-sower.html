      ctx.fillRect(p.x0 + 4, FIELD_TOP - 60, p.x1 - p.x0 - 8, FIELD_BOT - FIELD_TOP + 60);
      ctx.fillStyle = '#6e4a2c';
      ctx.beginPath();
      for (const d of p.deco) { const x = p.x0 + d.dx; ctx.moveTo(x + d.r, d.y); ctx.arc(x, d.y, d.r, 0, TAU); }
      ctx.fill();
      // an earthworm or two, for the children
      if (p.x1 - p.x0 > 120) {
        const wx = p.x0 + (p.x1 - p.x0) * 0.62;
        ctx.strokeStyle = '#d98a8a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(wx - 10, FIELD_BOT + 20);
        ctx.quadraticCurveTo(wx - 4, FIELD_BOT + 14 + Math.sin(t * 3) * 2, wx, FIELD_BOT + 20);
        ctx.quadraticCurveTo(wx + 4, FIELD_BOT + 26, wx + 10, FIELD_BOT + 20);
        ctx.stroke();
      }
      // stars: one, two or three for thirty-, sixty- and an hundredfold
      const n = p.q === 100 ? 3 : p.q === 60 ? 2 : 1;
      const cx = (p.x0 + p.x1) / 2;
      for (let i = 0; i < n; i++) {
        const sx = cx + (i - (n - 1) / 2) * 24;
        const sy = FIELD_TOP - 26 + Math.sin(t * 3 + i) * 3;
        drawStar(sx, sy, p.q === 100 ? 11 : 9, p.q === 100 ? '#ffd23f' : '#f7e08a');
      }
      if (p.q === 100 && state !== 'title') {
        for (let i = 0; i < 3; i++) {
          const ph = (t * 0.8 + i / 3 + p.x0 * 0.01) % 1;
          const sx = p.x0 + ((i * 53 + p.x0) % Math.max(20, p.x1 - p.x0 - 10)) + 5;
          ctx.globalAlpha = Math.sin(ph * Math.PI);
          drawStar(sx, FIELD_TOP + 10 - ph * 30, 3.5, '#fff6c0');
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  // Roots of growing wheat, seen in the cut
  ctx.strokeStyle = 'rgba(230,210,160,0.5)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const p of plants) {
    if (p.type !== 'good' || p.x < vx0 || p.x > vx1) continue;
    const r = clamp(p.age / 2.4, 0, 1) * 26;
    ctx.moveTo(p.x, FIELD_BOT); ctx.lineTo(p.x, FIELD_BOT + r);
    ctx.moveTo(p.x, FIELD_BOT + r * 0.4); ctx.lineTo(p.x - 5, FIELD_BOT + r * 0.8);
  }
  ctx.stroke();

  // Low stone wall at the end of the field
  const ex = worldEnd + 20;
  if (ex > vx0 && ex < vx1 + 100) {
    for (let r = 0; r < 3; r++) {
      for (let k = 0; k < 4; k++) {
        ctx.fillStyle = (r + k) % 2 ? '#b8b0a0' : '#a39a88';
        roundRect(ex + k * 20 + (r % 2) * 10, FIELD_BOT - 16 - r * 14, 20, 14, 5); ctx.fill();
      }
    }
  }
}

// Plants, seeds on the path and pecking birds, drawn back to front
function drawFieldThings() {
  const vx0 = cam - offX - 60, vx1 = cam + W + offX + 60;
  const list = [];
  for (const p of plants) if (p.x > vx0 && p.x < vx1) list.push({ y: p.y, k: 0, o: p });
  for (const g of groundSeeds) if (!g.eaten && !g.saved && g.x > vx0 && g.x < vx1) list.push({ y: g.y, k: 1, o: g });
  for (const b of birds) if (b.state === 'peck') list.push({ y: b.y, k: 2, o: b });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.k === 0) drawPlant(it.o);
    else if (it.k === 1) {
      ctx.fillStyle = '#f0dc9a'; ctx.strokeStyle = '#a8804a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(it.o.x, it.o.y, 3, 2, 0.4, 0, TAU); ctx.fill(); ctx.stroke();
    } else drawBird(it.o);
  }
}

function drawFlyingSeeds() {
  ctx.fillStyle = '#f5e3a6'; ctx.strokeStyle = '#a8804a'; ctx.lineWidth = 1;
  for (const s of flying) {
    if (s.age < 0) continue;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 3.2, 2.1, s.age * 12, 0, TAU); ctx.fill(); ctx.stroke();
  }
}

function drawLane() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#dcc093';
  ctx.fillRect(x0, CUT_BOT, x1 - x0, GRASS_TOP - CUT_BOT);
  ctx.fillStyle = 'rgba(150,115,70,0.45)';
  const k0 = Math.floor((cam + x0) / 29), k1 = Math.ceil((cam + x1) / 29);
  ctx.beginPath();
  for (let k = k0; k <= k1; k++) {
    const h = Math.abs(Math.sin(k * 12.9898) * 43758.5453) % 1;
    const x = k * 29 - cam + h * 20, y = CUT_BOT + 8 + h * 32;
    ctx.moveTo(x + 2.5, y); ctx.arc(x, y, 1.5 + h * 1.8, 0, TAU);
  }
  ctx.fill();
  // grass verge with tufts scrolling past
  ctx.fillStyle = '#8cc063';
  ctx.fillRect(x0, GRASS_TOP, x1 - x0, SHORE_TOP - GRASS_TOP + 2);
  ctx.strokeStyle = '#6da447'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  const j0 = Math.floor((cam + x0) / 23), j1 = Math.ceil((cam + x1) / 23);
  for (let k = j0; k <= j1; k++) {
    const h = Math.abs(Math.sin(k * 78.233) * 12345.678) % 1;
    const x = k * 23 - cam, y = GRASS_TOP + 10 + h * 36;
    ctx.moveTo(x - 4, y - 5); ctx.lineTo(x, y); ctx.lineTo(x + 4, y - 6);
  }
  ctx.stroke();
}

function drawShore() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // the lakeside hillside where the crowd sits listening (it doesn't scroll)
  const g = ctx.createLinearGradient(0, SHORE_TOP, 0, H);
  g.addColorStop(0, '#b6dc84'); g.addColorStop(1, '#94c565');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0, SHORE_TOP + 6);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, SHORE_TOP + 2 + Math.sin(x / 70) * 4);
  ctx.lineTo(x1, H + 10); ctx.lineTo(x0, H + 10); ctx.closePath(); ctx.fill();
  // flowers
  for (let i = 0; i < 14; i++) {
    const x = JESUS_X + 100 + ((i * 131) % Math.max(100, W - JESUS_X - 110));
    const y = SHORE_TOP + 16 + ((i * 37) % 22);
    ctx.fillStyle = ['#fff', '#ffd1e8', '#ffe27a'][i % 3];
    ctx.beginPath();
    for (let k = 0; k < 5; k++) { const a = k * TAU / 5; ctx.moveTo(x + Math.cos(a) * 3 + 2, y + Math.sin(a) * 3); ctx.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = '#f0a030'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill();
  }
  // separate the story field from the real hillside with a soft fence line
  ctx.strokeStyle = 'rgba(80,120,50,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, SHORE_TOP + 4); ctx.lineTo(x1, SHORE_TOP + 4); ctx.stroke();
}

function drawAim() {
  if (state !== 'play' || fieldDone) return;
  const x = aimX;
  const p = patchAt(cam + x);
  const good = p.type === 'good';
  const ready = cooldown <= 0 && bag > 0;
  const bob = Math.sin(t * 6) * 3;
  ctx.save();
  ctx.globalAlpha = ready ? 1 : 0.45;
  ctx.strokeStyle = good ? '#ffd23f' : 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.ellipse(x, (FIELD_TOP + FIELD_BOT) / 2, SPREAD + 6, 12, 0, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = good ? '#ffd23f' : '#ffffff';
  ctx.strokeStyle = 'rgba(90,66,16,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, FIELD_TOP - 30 + bob); ctx.lineTo(x - 9, FIELD_TOP - 44 + bob); ctx.lineTo(x + 9, FIELD_TOP - 44 + bob);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Rendering: harvest tally, bubble, HUD
// ============================================================
function drawHarvestPanel() {
  if (!(state === 'harvest' || state === 'win' || state === 'fail') || harvestT < 2.6) return;
  const a = clamp((harvestT - 2.6) / 0.4, 0, 1);
  const pw = Math.min(W - 40, 400), ph = 250;
  const px = W / 2 - pw / 2, py = 150;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,252,240,0.94)';
  ctx.strokeStyle = 'rgba(224,165,38,0.8)'; ctx.lineWidth = 3;
  roundRect(px, py, pw, ph, 22); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e0a526';
  ctx.font = '700 30px Fredoka, sans-serif';
  ctx.fillText('The Harvest', W / 2, py + 40);
  const rows = [['an hundredfold', 100], ['sixtyfold', 60], ['thirtyfold', 30]];
  ctx.font = '600 18px Fredoka, sans-serif';
  rows.forEach(([name, q], i) => {
    const show = harvestT > 2.9 + i * 0.4;
    if (!show) return;
    const y = py + 74 + i * 28;
    ctx.textAlign = 'left'; ctx.fillStyle = '#6a5a3c';
    ctx.fillText(`Some ${name}`, px + 26, y);
    for (let s = 0; s < (q === 100 ? 3 : q === 60 ? 2 : 1); s++) drawStar(px + pw - 116 + s * 14, y - 6, 6, '#f0c040');
    ctx.textAlign = 'right'; ctx.fillStyle = '#a8741a';
    ctx.fillText(`× ${stats.fold[q]}`, px + pw - 26, y);
  });
  const f = clamp((harvestT - 3) / 2.1, 0, 1);
  const shown = Math.round(stats.yield * ease(f));
  ctx.textAlign = 'center';
  ctx.font = '700 46px Fredoka, sans-serif';
  const reached = shown >= goal;
  ctx.fillStyle = reached ? '#2b8a3e' : '#a8741a';
  ctx.fillText(`${shown}`, W / 2, py + 198);
  ctx.font = '600 16px Fredoka, sans-serif';
  ctx.fillStyle = '#6a5a3c';
  let tail = `Goal: ${goal}`;
  if (harvestResult === 'win') tail += '  ✔ Hallelujah!';
  if (harvestResult === 'fail') tail += '  — not quite…';
  ctx.fillText(tail, W / 2, py + 228);
  ctx.restore();
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawBubble() {
  if (!bubble) return;
  const bob = Math.sin(t * 1.6) * 2;
  const ax = JESUS_X + 12, ay = H - 104 + bob;   // near Jesus's mouth
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - JESUS_X - 70, 460);
  const lines = wrapText(bubble.text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = JESUS_X + 34, by = H - 94 - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  // tail down to Jesus
  ctx.beginPath();
  ctx.moveTo(bx + 2, by + h - 22); ctx.lineTo(ax + 6, ay); ctx.lineTo(bx + 18, by + h - 1.5);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx, by + h - 22); ctx.lineTo(ax + 6, ay); ctx.lineTo(bx + 18, by + h);
  ctx.stroke();
  ctx.fillStyle = '#fffbe8';
  ctx.fillRect(bx + 1.5, by + h - 24, 18, 21);
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawSack(x, y, full) {
  ctx.fillStyle = '#e2c98f'; ctx.strokeStyle = '#a8804a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 8);
  ctx.quadraticCurveTo(x - 12, y + 6, x - 7, y + 9);
  ctx.lineTo(x + 7, y + 9);
  ctx.quadraticCurveTo(x + 12, y + 6, x + 5, y - 8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9a15a'; ctx.fillRect(x - 5, y - 9, 10, 3);
  if (full > 0) { ctx.fillStyle = '#f5e3a6'; ctx.beginPath(); ctx.arc(x, y - 9, 3, Math.PI, TAU); ctx.fill(); }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + seed bag
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Sower' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.shadowBlur = 0;
  const full = clamp(bag / cfg.bag, 0, 1);
  drawSack(22, 45, full);
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(38, 38, 110, 13, 6.5); ctx.fill();
  const gg = ctx.createLinearGradient(38, 0, 148, 0);
  gg.addColorStop(0, '#d9a84a'); gg.addColorStop(1, '#f5e3a6');
  ctx.fillStyle = bag <= 2 && state === 'play' && Math.sin(t * 10) > 0 ? '#ff8a6b' : gg;
  if (full > 0) { roundRect(38, 38, 110 * Math.min(full, 1), 13, 6.5); ctx.fill(); }
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 14px Fredoka, sans-serif';
  ctx.fillText(`${bag}`, 154, 50);

  // Pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: harvest so far against the goal, and the wind
  const rx = viewW - 12;
  if (state !== 'title') {
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('HARVEST', rx, 20);
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillStyle = stats.yield >= goal ? '#2b8a3e' : '#5a4210';
    ctx.fillText(`${stats.yield} / ${goal}`, rx, 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(rx - 120, 46, 120, 9, 4.5); ctx.fill();
    const hf = clamp(stats.yield / goal, 0, 1);
    ctx.fillStyle = stats.yield >= goal ? '#51cf66' : '#f0c040';
    if (hf > 0) { roundRect(rx - 120, 46, 120 * hf, 9, 4.5); ctx.fill(); }
    if (cfg.gust) {
      const w = windNow();
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#5a4210';
      ctx.font = '600 12px Fredoka, sans-serif';
      ctx.fillText('WIND', rx, 78);
      ctx.shadowBlur = 0;
      const ax = rx - 72, ay = 74;
      const alen = clamp(Math.abs(w) / 60, 0.1, 1) * 24;
      const dir = Math.sign(w) || 1;
      ctx.strokeStyle = Math.abs(w) > 45 ? '#d9480f' : '#2c7fb8';
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ax - dir * alen, ay); ctx.lineTo(ax + dir * alen, ay); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax + dir * (alen + 7), ay); ctx.lineTo(ax + dir * (alen - 3), ay - 7); ctx.lineTo(ax + dir * (alen - 3), ay + 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, 420);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, 420);
  ctx.restore();
}

// Wind streaks on windy levels
const streaks = Array.from({ length: 22 }, () => ({ f: Math.random(), y: rand(150, 500), len: rand(0.5, 1.2) }));
function drawStreaks(dt) {
  if (!cfg.gust) return;
  const w = windNow();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineCap = 'round'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const s of streaks) {
    const len = clamp(Math.abs(w) * 0.7, 6, 44) * s.len;
    const x = -offX - 100 + s.f * (viewW + 200);
    ctx.moveTo(x, s.y); ctx.lineTo(x - Math.sign(w || 1) * len, s.y);
  }
  ctx.stroke();
}
function updateStreaks(dt) {
  const w = windNow();
  for (const s of streaks) {
    s.f += (w * 3 * dt) / (viewW + 200);
    if (s.f > 1) { s.f -= 1; s.y = rand(150, 500); }
    if (s.f < 0) { s.f += 1; s.y = rand(150, 500); }
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);

  drawSky();
  drawSun();
  for (const c of bgClouds) drawCloud(-offX - 170 + c.f * (viewW + 340), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.9)', 'rgba(220,235,250,0.8)');
  drawHills();

  // The field scrolls with the camera
  ctx.save();
  ctx.translate(-cam, 0);
  drawField();
  drawFieldThings();
  ctx.restore();

  drawLane();
  drawAim();
  const walkIn = state === 'intro' ? lerp(-50, sowerX, ease(clamp(introT / (introDur * 0.7), 0, 1))) : sowerX;
  drawSower(walkIn, LANE_Y);

  ctx.save();
  ctx.translate(-cam, 0);
  drawFlyingSeeds();
  for (const b of birds) if (b.state !== 'peck' && b.state !== 'wait') drawBird(b);
  drawParticles();
  drawPopups();
  ctx.restore();

  drawStreaks();
  drawShore();
  drawBoatScene();
  for (const s of crowdSlots()) drawPerson(s);

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 60, 0, TAU); ctx.stroke();
  }

  drawHarvestPanel();
  drawMessage();
  drawBubble();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePlay(dt) {
  cooldown = Math.max(0, cooldown - dt);
  const dir = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  aimX = clamp(aimX + dir * 380 * dt, aimMin(), aimMax());

  if (!fieldDone) {
    cam += cfg.speed * dt;
    walkT += dt;
    if (cam + W - 10 >= worldEnd + 40) {
      cam = worldEnd + 50 - W;
      fieldDone = true;
      showMessage('The end of the field!');
    }
  }
  updateFlying(dt);
  updatePlants(dt);
  updateBirds(dt);

  // Once the field ends or the bag is empty, wait for the last seed to settle
  const busy = flying.length > 0 || birds.some((b) => b.state === 'wait' || b.state === 'in' || b.state === 'peck');
  if ((fieldDone || bag <= 0) && !busy) {
    if (endWait < 0) { endWait = 0; if (bag <= 0 && !fieldDone) showMessage('The seed bag is empty!'); }
    endWait += dt;
    const settling = plants.some((p) => p.type !== 'good' && p.age < 2.3);
    if (endWait > 1.4 && !settling) startHarvest();
  } else endWait = -1;
}

function update(dt) {
  t += dt;
  updateGust(dt);
  updateScenery(dt);
  updateStreaks(dt);
  updateParticles(dt);
  updateCrowd(dt);
  throwT = Math.max(0, throwT - dt);
  if (state === 'intro') {
    introT += dt;
    walkT += dt;
    if (introT >= introDur) beginPlay();
  } else if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'harvest') {
    updateHarvest(dt);
    updatePlants(dt);
    updateBirds(dt);
  } else if (state === 'win' || state === 'fail') {
    harvestT += dt;
    updatePlants(dt);
    updateBirds(dt);
    if (state === 'win' && Math.random() < dt * 14) {
      spawn(cam + rand(0, W), FIELD_TOP - rand(0, 40), rand(-10, 10), -40, 1.2, '#fff6d0', 3);
    }
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  moodEvent.t = Math.max(0, moodEvent.t - dt);
  crowdCheer = Math.max(0, crowdCheer - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' && cfg.gust ? clamp(Math.abs(windNow()) / 140, 0, 0.4) : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
