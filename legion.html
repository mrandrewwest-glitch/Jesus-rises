// Rocks, bushes and trees that imps bounce off
function drawObstacle(o) {
  const x = mx(o.u), gy = groundY(x);
  if (o.type === 'rock') {
    const r = o.r;
    ctx.fillStyle = '#a8a092'; ctx.strokeStyle = '#7d766a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - r * 1.05, gy + 3);
    ctx.quadraticCurveTo(x - r * 1.1, gy - r * 1.2, x - r * 0.1, gy - r * 1.55);
    ctx.quadraticCurveTo(x + r * 1.1, gy - r * 1.4, x + r * 1.05, gy + 3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, gy - r * 1.05, r * 0.35, r * 0.18, -0.5, 0, TAU); ctx.fill();
  } else if (o.type === 'bush') {
    const c = obstacleCircles(o)[0];
    ctx.fillStyle = '#4f8f3a';
    ctx.beginPath();
    for (const [dx, dy, rr] of [[-0.7, 0.35, 0.6], [0.7, 0.35, 0.6], [0, -0.1, 0.85], [-0.4, -0.4, 0.5], [0.45, -0.35, 0.5]]) {
      ctx.moveTo(c.x + dx * c.r + rr * c.r, c.y + dy * c.r); ctx.arc(c.x + dx * c.r, c.y + dy * c.r, rr * c.r, 0, TAU);
    }
    ctx.fill();
    ctx.fillStyle = '#69ab4c';
    ctx.beginPath(); ctx.arc(c.x - c.r * 0.2, c.y - c.r * 0.3, c.r * 0.45, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8485a';
    for (const [dx, dy] of [[-0.5, 0.1], [0.3, -0.2], [0.55, 0.35], [-0.1, 0.45]]) {
      ctx.beginPath(); ctx.arc(c.x + dx * c.r, c.y + dy * c.r, 2.6, 0, TAU); ctx.fill();
    }
  } else {
    const [c] = obstacleCircles(o);
    const sway = cfg.wind ? Math.sin(t * 2 + o.u * 9) * 2 + Math.sign(cfg.wind) * 2 : 0;
    ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, gy + 2); ctx.quadraticCurveTo(x - 5, gy - 40, x + sway * 0.4, c.y + 10); ctx.stroke();
    ctx.fillStyle = '#5f9a44';
    ctx.beginPath();
    for (const [dx, dy, rr] of [[-0.55, 0.2, 0.6], [0.55, 0.2, 0.6], [0, -0.25, 0.75], [0, 0.35, 0.6]]) {
      ctx.moveTo(c.x + sway + dx * c.r + rr * c.r, c.y + dy * c.r); ctx.arc(c.x + sway + dx * c.r, c.y + dy * c.r, rr * c.r, 0, TAU);
    }
    ctx.fill();
    ctx.fillStyle = '#78b457';
    ctx.beginPath(); ctx.arc(c.x + sway - c.r * 0.25, c.y - c.r * 0.35, c.r * 0.4, 0, TAU); ctx.fill();
  }
}

// ============================================================
//  Jesus
// ============================================================
function drawJesus() {
  const j = jesus;
  const x = GEO.jesusX, gy = groundY(x);
  ctx.save();
  ctx.translate(x, gy);
  ctx.scale(1.1, 1.1);

  const up = state === 'win';

  // Calm radiance
  const glowR = up ? 95 : 70;
  const g = ctx.createRadialGradient(0, -38, 5, 0, -38, glowR);
  g.addColorStop(0, `rgba(255,235,150,${up ? 0.6 : 0.38})`);
  g.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -38, glowR, 0, TAU); ctx.fill();

  // Shadow and feet
  ctx.fillStyle = 'rgba(60,40,20,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 18, 4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(-6, 0.5, 4.5, 2.4, 0, 0, TAU); ctx.ellipse(6, 0.5, 4.5, 2.4, 0, 0, TAU); ctx.fill();

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: right hand raised toward the imp ("Come out of the man"), both raised in joy at the end
  const hands = up ? [[-21, -66], [21, -66]] : [[-20, -22], [22, -61]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    const ex = hx * 0.9, ey = hy + (hy < -50 ? 4 : 0);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }
  // The glowing hand: the anchor of the slingshot
  if (!up && state !== 'fail') {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const hg = ctx.createRadialGradient(22, -61, 1, 22, -61, 16 + j.flash * 30);
    hg.addColorStop(0, `rgba(255,245,190,${0.7 + pulse * 0.3})`);
    hg.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(22, -61, 16 + j.flash * 30, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  The man possessed by Legion (and then freed)
// ============================================================
function drawMan() {
  const x = GEO.manX, gy = groundY(x);
  const freed = freedT >= 0.5;
  ctx.save();
  ctx.translate(x, gy);

  // Rock seat
  ctx.fillStyle = '#a89a86'; ctx.strokeStyle = '#7d7262'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-2, -9, 24, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();

  // Broken chains lying at his feet (gone once he is freed)
  if (!freed) {
    ctx.strokeStyle = '#7b7f88'; ctx.lineWidth = 2.5;
    for (let k = 0; k < 5; k++) {
      ctx.beginPath(); ctx.ellipse(10 + k * 7, 1 - (k % 2) * 2, 4.5, 2.6, k % 2 ? 0.5 : -0.3, 0, TAU); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(-22, 0, 4.5, 2.6, 0.3, 0, TAU); ctx.stroke();
  }

  const robe = freed ? '#fbf6e8' : '#8f8472';
  const robeEdge = freed ? '#cfc8b4' : '#6b6152';
  // Legs, knees up
  ctx.strokeStyle = robeEdge; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2, -20); ctx.lineTo(14, -30); ctx.lineTo(18, -6); ctx.stroke();
  ctx.strokeStyle = robe; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-2, -20); ctx.lineTo(14, -30); ctx.lineTo(18, -6); ctx.stroke();
  ctx.fillStyle = '#d19a66';
  ctx.beginPath(); ctx.ellipse(21, -3, 5, 3, 0, 0, TAU); ctx.fill();

  // Tunic: ragged before, a clean robe after
  ctx.fillStyle = robe; ctx.strokeStyle = robeEdge; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-15, -16);
  ctx.quadraticCurveTo(-15, -40, -9, -46);
  ctx.quadraticCurveTo(0, -50, 9, -46);
  ctx.quadraticCurveTo(14, -40, 13, -16);
  if (freed) ctx.quadraticCurveTo(0, -12, -15, -16);
  else for (let k = 1; k <= 6; k++) ctx.lineTo(13 - k * 28 / 6, -16 + (k % 2 ? 5 : 0));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if (freed) {
    ctx.save(); ctx.clip();
    ctx.strokeStyle = '#3f6fb5'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-9, -46); ctx.lineTo(13, -20); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = 'rgba(70,60,45,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(-2, -30); ctx.moveTo(4, -26); ctx.lineTo(7, -22); ctx.stroke();
  }

  // Arms
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = shade(freed ? '#e8e0cc' : '#8f8472', -20); ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = '#d19a66'; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (freed) {
    const wave = Math.sin(t * 6) * 4;
    arm(-9, -42, -4, -24);
    arm(9, -42, 22 + wave, -70);            // a joyful wave
  } else {
    arm(-9, -42, 12, -30); arm(9, -42, 15, -32);   // hugging his knees
    // broken shackles dangling from his wrists
    ctx.strokeStyle = '#7b7f88'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(14, -31, 4.5, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(14, -22, 2.5, 4, 0, 0, TAU); ctx.stroke();
  }

  // Head
  const hy = -62;
  ctx.fillStyle = '#d19a66';
  ctx.beginPath(); ctx.arc(0, hy, 15, 0, TAU); ctx.fill();
  ctx.fillStyle = MAN.hair;
  if (freed) {
    ctx.beginPath();
    ctx.arc(0, hy - 2, 15.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 10, 0, hy - 9);
    ctx.quadraticCurveTo(-8, hy - 11, -15, hy + 1);
    ctx.closePath(); ctx.fill();
  } else {
    // wild, uncombed hair
    ctx.beginPath();
    ctx.moveTo(-17, hy + 4);
    for (let k = 0; k <= 9; k++) {
      const a = Math.PI * (1 + k / 9);
      const rr = k % 2 ? 24 : 16;
      ctx.lineTo(Math.cos(a) * rr, hy - 2 + Math.sin(a) * rr);
    }
    ctx.lineTo(17, hy + 4);
    ctx.quadraticCurveTo(8, hy - 10, 0, hy - 9);
    ctx.quadraticCurveTo(-8, hy - 10, -17, hy + 4);
    ctx.fill();
  }
  // beard: scruffy, then neat
  ctx.beginPath();
  ctx.moveTo(-14, hy + 2);
  if (freed) ctx.quadraticCurveTo(-13, hy + 19, 0, hy + 20), ctx.quadraticCurveTo(13, hy + 19, 14, hy + 2);
  else { ctx.lineTo(-12, hy + 16); ctx.lineTo(-6, hy + 13); ctx.lineTo(0, hy + 22); ctx.lineTo(6, hy + 13); ctx.lineTo(12, hy + 17); ctx.lineTo(14, hy + 2); }
  ctx.quadraticCurveTo(8, hy + 8, 0, hy + 8);
  ctx.quadraticCurveTo(-8, hy + 8, -14, hy + 2);
  ctx.fill();

  drawFace(MAN, MAN.mood, hy, 0.8, -0.3);
  ctx.restore();

  // Glow of peace once he is freed
  if (freed) {
    const a = 0.35 + 0.15 * Math.sin(t * 3);
    const g = ctx.createRadialGradient(x, gy - 40, 5, x, gy - 40, 60);
    g.addColorStop(0, `rgba(255,245,200,${a})`); g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, gy - 40, 60, 0, TAU); ctx.fill();
  }
}

// Imps swirling around the man (drawn half behind him, half in front)
function drawOrbit(front) {
  const n = impsOnMan;
  if (n <= 0) return;
  const cx = GEO.manX, cy = groundY(cx) - 30;
  const shown = Math.min(n, 12);
  for (let k = 0; k < shown; k++) {
    const a = t * 1.5 + (k * TAU) / shown;
    const s = Math.sin(a);
    if ((s >= 0) !== front) continue;
    const faces = ['grin', 'tongue', 'grin', 'wink'];
    drawImp(cx + Math.cos(a) * 36, cy + s * 9 + Math.sin(t * 5 + k) * 3, 8 + s * 1.2,
      faces[(k + Math.floor(t * 0.8)) % 4], Math.sin(t * 4 + k) * 0.2, Math.cos(a) > 0 ? 1 : -1);
  }
}

function drawLegionLabel() {
  if (impsOnMan <= 0 || state === 'win') return;
  const x = Math.max(GEO.manX + 6, -offX + 44), y = groundY(GEO.manX) - 112;
  const text = `Legion ×${impsOnMan}`;
  ctx.font = '700 13px Fredoka, sans-serif';
  const w = ctx.measureText(text).width + 16;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  roundRect(x - w / 2, y - 14, w, 20, 10); ctx.fill();
  ctx.fillStyle = '#5b4a8e'; ctx.textAlign = 'center';
  ctx.fillText(text, x, y + 1);
}

// ============================================================
//  Imps (cartoon shadow imps: more cheeky than scary)
// ============================================================
function drawImp(x, y, r, face = 'grin', rot = 0, dir = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  const s = r / 13;
  ctx.scale(s * dir, s);
  // smoky tail
  ctx.fillStyle = 'rgba(120,95,160,0.55)';
  ctx.beginPath();
  ctx.moveTo(-9, 4);
  ctx.quadraticCurveTo(-6, 18, -15 + Math.sin(t * 8 + x) * 3, 21);
  ctx.quadraticCurveTo(0, 18, 8, 6);
  ctx.fill();
  // little horns
  ctx.fillStyle = '#d4c2f0';
  ctx.beginPath();
  ctx.moveTo(-9, -8); ctx.quadraticCurveTo(-14, -16, -11, -21); ctx.lineTo(-3, -11);
  ctx.moveTo(9, -8); ctx.quadraticCurveTo(14, -16, 11, -21); ctx.lineTo(3, -11);
  ctx.fill();
  // body puffs
  const g = ctx.createRadialGradient(-3, -5, 2, 0, 0, 17);
  g.addColorStop(0, '#b39ddb'); g.addColorStop(1, '#6b5a8e');
  ctx.fillStyle = g;
  ctx.beginPath();
  for (const [px, py, pr] of [[0, 0, 12], [-8, 4, 7], [8, 4, 7], [0, -6, 9]]) { ctx.moveTo(px + pr, py); ctx.arc(px, py, pr, 0, TAU); }
  ctx.fill();
  // glowing eyes
  const dark = '#3a2150';
  ctx.shadowColor = '#fff58a'; ctx.shadowBlur = 6;
  if (face === 'tongue') {
    ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-7, -6); ctx.lineTo(-3, -3); ctx.lineTo(-7, 0);
    ctx.moveTo(7, -6); ctx.lineTo(3, -3); ctx.lineTo(7, 0);
    ctx.stroke();
  } else {
    const big = face === 'shock' ? 1.3 : 1;
    ctx.fillStyle = '#fffbd0';
    ctx.beginPath();
    ctx.ellipse(-4.5, -3, 3.6 * big, 4.2 * big, 0, 0, TAU);
    if (face === 'wink') { ctx.fill(); ctx.beginPath(); }
    else ctx.ellipse(4.5, -3, 3.6 * big, 4.2 * big, 0, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-3.8, -2.5, 1.8, 0, TAU); if (face !== 'wink') ctx.arc(5.2, -2.5, 1.8, 0, TAU); ctx.fill();
    if (face === 'wink') {
      ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(4.5, -3, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
  // cheeky brows
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, -9); ctx.lineTo(-2, -8); ctx.moveTo(2, -9); ctx.lineTo(8, -11); ctx.stroke();
  // mouth
  if (face === 'shock') {
    ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, 5, 2.6, 3.4, 0, 0, TAU); ctx.fill();
  } else if (face === 'tongue') {
    ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, 4, 4, 2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7aa2'; ctx.beginPath(); ctx.ellipse(1, 7.5, 3, 4, 0.2, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(-6, 2); ctx.quadraticCurveTo(0, 11, 6, 1); ctx.quadraticCurveTo(0, 5, -6, 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-3, 3.2); ctx.lineTo(-1.5, 5.5); ctx.lineTo(0, 3.6); ctx.fill();
  }
  ctx.restore();
}

function drawImps() {
  for (const m of imps) {
    const dir = m.state === 'sneak' ? m.dir || -1 : Math.sign(m.vx) || 1;
    drawImp(m.x, m.y, IMP_R, m.face, Math.sin(t * 10 + m.x * 0.01) * 0.25, dir);
    // marker when an imp flies above the top of the screen
    if (m.y < -offY - 8) {
      ctx.fillStyle = '#6b4fa0';
      ctx.beginPath(); ctx.moveTo(m.x, -offY + 104); ctx.lineTo(m.x - 7, -offY + 116); ctx.lineTo(m.x + 7, -offY + 116); ctx.fill();
    }
  }
}

// The imp waiting in Jesus's hand, the band of light, and the aiming arc
function drawLauncher() {
  const r = restPos(), hp = handPos();
  const aim = currentAim();
  if (loaded) {
    const k = clamp(loaded.t / LOAD_TIME, 0, 1);
    let x, y;
    if (k < 1) {
      const sx = GEO.manX, sy = groundY(sx) - 50;
      x = lerp(sx, r.x, k); y = lerp(sy, r.y, k) - Math.sin(k * Math.PI) * 50;
    } else {
      x = r.x; y = r.y + Math.sin(t * 4) * 2;
      if (aim) {
        const pull = aim.power * PULL_MAX * 0.5;
        x -= Math.cos(aim.a) * pull; y += Math.sin(aim.a) * pull;
      }
    }
    if (k >= 1) {
      ctx.strokeStyle = 'rgba(255,230,120,0.5)'; ctx.lineWidth = aim ? 7 - aim.power * 3 : 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hp.x, hp.y); ctx.lineTo(x, y); ctx.stroke();
      ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = aim ? 3 - aim.power : 2.5;
      ctx.beginPath(); ctx.moveTo(hp.x, hp.y); ctx.lineTo(x, y); ctx.stroke();
    }
    drawImp(x, y, IMP_R, aim ? 'shock' : 'grin', Math.sin(t * 3) * 0.15, 1);
  }
  if (aim && loaded && loaded.t >= LOAD_TIME) {
    const pts = previewPoints(aim.a, aim.power);
    pts.forEach(([px, py], i) => {
      ctx.globalAlpha = 0.9 * (1 - i / (pts.length + 2));
      ctx.fillStyle = '#fff8dc';
      ctx.beginPath(); ctx.arc(px, py, 3.6, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(168,116,26,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
}

function previewPoints(a, power) {
  const r = restPos();
  let x = r.x, y = r.y;
  const sp = vmax() * power;
  let vx = Math.cos(a) * sp, vy = -Math.sin(a) * sp;
  const pts = [], dt = 1 / 60;
  const circles = obstacles.flatMap(obstacleCircles);
  for (let i = 0; i < cfg.preview; i++) {
    vy += GRAV * dt; vx += cfg.wind * dt;
    x += vx * dt; y += vy * dt;
    if (i % 4 === 3) pts.push([x, y]);
    if (y > groundY(x) || x > W + offX || (x > GEO.bankBot && y > SEA_Y)) break;
    if (circles.some((c) => Math.hypot(x - c.x, y - c.y) < c.r + IMP_R)) break;
  }
  return pts;
}

// ============================================================
//  Swine drawing
// ============================================================
function drawPig(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.state === 'run') ctx.rotate(clamp(Math.atan((groundY(p.x + 5) - groundY(p.x - 5)) / 10), -0.9, 0.9));
  ctx.globalAlpha = p.alpha;
  const walking = p.walking || p.state === 'trot' || p.state === 'enter' || p.state === 'run';
  const speed = p.state === 'run' ? 24 : 12;
  const bob = walking ? Math.abs(Math.sin(p.t * speed)) * 2.5 : 0;
  const jig = p.state === 'hit' ? Math.sin(p.t * 60) * 2 : 0;
  ctx.translate(jig, -bob - (p.state === 'hit' ? Math.sin(Math.min(p.t / 0.55, 1) * Math.PI) * 14 : 0));
  ctx.scale(p.dir, 1);

  // motion lines when dashing off
  if (p.state === 'run') {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-30, -22); ctx.lineTo(-46, -22); ctx.moveTo(-30, -12); ctx.lineTo(-42, -12); ctx.stroke();
  }
  // legs
  ctx.fillStyle = '#e9859f';
  for (const [lx, ph] of [[-14, 0], [-6, Math.PI], [8, Math.PI], [15, 0]]) {
    const lift = walking ? Math.max(0, Math.sin(p.t * speed + ph)) * 3 : 0;
    roundRect(lx - 3, -10 - lift, 6, 10, 2.5); ctx.fill();
  }
  // curly tail
  ctx.strokeStyle = '#e07894'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-22, -20);
  ctx.bezierCurveTo(-31, -22, -31, -31, -26, -30);
  ctx.bezierCurveTo(-21, -29, -24, -23, -29, -25);
  ctx.stroke();
  // body
  const g = ctx.createLinearGradient(0, -32, 0, -4);
  g.addColorStop(0, '#ffc6d4'); g.addColorStop(1, '#f28fab');
  ctx.fillStyle = g; ctx.strokeStyle = '#d8718f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -19, 23, 14, 0, 0, TAU); ctx.fill(); ctx.stroke();
  if (p.state === 'hit' || p.state === 'run') { ctx.fillStyle = 'rgba(140,100,190,0.28)'; ctx.fill(); }
  // head (lowered to munch grass while grazing)
  const munch = p.face === 'happy' && p.state === 'graze' && !p.walking;
  const hx = 21, hy = munch ? -14 + Math.sin(p.t * 7) * 1.2 : -24;
  ctx.fillStyle = '#ffbccd'; ctx.strokeStyle = '#d8718f';
  ctx.beginPath(); ctx.arc(hx, hy, 11, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ee8aa6';
  ctx.beginPath(); ctx.moveTo(hx - 6, hy - 7); ctx.lineTo(hx - 2, hy - 17); ctx.lineTo(hx + 3, hy - 9); ctx.closePath(); ctx.fill();
  // snout
  ctx.fillStyle = '#f7869f'; ctx.strokeStyle = '#d8718f';
  ctx.beginPath(); ctx.ellipse(hx + 10, hy + 2, 4.5, 5.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b8506c';
  ctx.beginPath(); ctx.arc(hx + 10, hy, 1.1, 0, TAU); ctx.arc(hx + 11, hy + 4, 1.1, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,110,140,0.45)';
  ctx.beginPath(); ctx.arc(hx - 1, hy + 5, 3, 0, TAU); ctx.fill();
  // eye and mouth
  const ex = hx + 2, ey = hy - 4, dark = '#3b2230';
  ctx.lineCap = 'round';
  if (p.face === 'happy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(ex, ey + 1, 2.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 4, hy + 6, 3, 0.1 * Math.PI, 0.7 * Math.PI); ctx.stroke();
    if (munch) {   // a mouthful of grass
      ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(hx + 6, hy + 8); ctx.lineTo(hx + 9, hy + 14); ctx.moveTo(hx + 4, hy + 8); ctx.lineTo(hx + 4, hy + 15); ctx.stroke();
    }
  } else if (p.face === 'uhoh') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(ex + p.look.x * p.dir * 1.8, ey + p.look.y * 1.8, 1.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 4, hy + 7, 1.8, 2.4, 0, 0, TAU); ctx.fill();
  } else {
    // swirly eyes and a squeal
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, 4.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let k = 0; k < 18; k++) {
      const a = k * 0.7 + p.t * 12, rr = k * 0.22;
      k ? ctx.lineTo(ex + Math.cos(a) * rr, ey + Math.sin(a) * rr) : ctx.moveTo(ex, ey);
    }
    ctx.stroke();
    ctx.fillStyle = '#7a2e40';
    ctx.beginPath(); ctx.ellipse(hx + 4, hy + 8, 3, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7cc4f2';
    ctx.beginPath(); ctx.moveTo(hx - 10, hy - 12); ctx.quadraticCurveTo(hx - 6, hy - 5, hx - 10, hy - 4); ctx.quadraticCurveTo(hx - 14, hy - 5, hx - 10, hy - 12); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  HUD, messages, popups
// ============================================================
function drawStreaks() {
  if (!cfg.wind) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineCap = 'round'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 18; i++) {
    const y = 120 + ((i * 97) % 520);
    const span = viewW + 200;
    let f = ((i * 0.37 + t * Math.abs(cfg.wind) * 0.0022 * (0.8 + (i % 3) * 0.2)) % 1);
    if (cfg.wind < 0) f = 1 - f;
    const x = -offX - 100 + f * span;
    const len = clamp(Math.abs(cfg.wind) * 0.25, 12, 50);
    ctx.moveTo(x, y); ctx.lineTo(x - Math.sign(cfg.wind) * len, y);
  }
  ctx.stroke();
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.lineJoin = 'round';
  for (const p of popups) {
    ctx.globalAlpha = clamp(1.4 - p.t, 0, 1);
    const y = p.y - p.t * 40;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(p.text, p.x, y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + imps still on the man
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3a6a';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Legion' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('IMPS', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(74,58,106,0.22)';
  roundRect(50, 38, 120, 13, 6.5); ctx.fill();
  const left = total - castOut;
  const f = total ? left / total : 0;
  const gg = ctx.createLinearGradient(50, 0, 170, 0);
  gg.addColorStop(0, '#7b5fb5'); gg.addColorStop(1, '#b39ddb');
  ctx.fillStyle = gg;
  if (f > 0) { roundRect(50, 38, 120 * f, 13, 6.5); ctx.fill(); }
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#4a3a6a';
  ctx.font = '700 13px Fredoka, sans-serif';
  ctx.fillText(left ? `${left} left` : 'Free!', 176, 49);

  // HUD buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: shots, score, wind
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SHOTS', rx, 20);
  ctx.font = '700 20px Fredoka, sans-serif';
  ctx.fillStyle = shots <= 3 && state === 'play' && Math.sin(t * 8) > 0 ? '#c92a2a' : '#5a4210';
  ctx.fillText(`${shots}`, rx, 42);
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 14px Fredoka, sans-serif';
  ctx.fillText(`SCORE ${totalScore + (state === 'win' ? 0 : levelScore)}`, rx, 62);
  if (cfg.wind && state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('WIND', rx, 86);
    ctx.shadowBlur = 0;
    const ax = rx - 64, ay = 82;
    const alen = clamp(Math.abs(cfg.wind) / 190, 0.2, 1) * 22;
    const dir = Math.sign(cfg.wind);
    ctx.strokeStyle = Math.abs(cfg.wind) > 140 ? '#d9480f' : '#2c7fb8';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax - dir * alen, ay); ctx.lineTo(ax + dir * alen, ay); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax + dir * (alen + 7), ay); ctx.lineTo(ax + dir * (alen - 3), ay - 7); ctx.lineTo(ax + dir * (alen - 3), ay + 7); ctx.fill();
  }
  if (combo > 1 && t - lastHitT < COMBO_WINDOW && state === 'play') {
    ctx.shadowBlur = 4;
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillStyle = '#a8741a';
    ctx.fillText(`Combo ×${combo}`, rx, cfg.wind ? 108 : 86);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.4);
  ctx.fillStyle = '#5b3f8e';
  ctx.fillText(message.text, W / 2, H * 0.4);
  ctx.restore();
}

// Rays of light breaking over the hillside when the man is freed
function drawGloryRays() {
  if (state !== 'win') return;
  const a = clamp(winT / 1.2, 0, 1) * 0.3;
  const x = GEO.jesusX, y = groundY(x) - 60;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.05);
  ctx.fillStyle = `rgba(255,244,190,${a})`;
  for (let i = 0; i < 14; i++) {
    ctx.rotate(TAU / 14);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-45, -1400); ctx.lineTo(45, -1400); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  drawSky();
  drawLake();
  drawTombHill();
  // Grey gloom over the land while Legion holds the man
  if (gloom > 0.005) {
    const gg = ctx.createLinearGradient(0, -offY, 0, H);
    gg.addColorStop(0, `rgba(70,55,110,${gloom * 0.35})`);
    gg.addColorStop(0.6, `rgba(70,55,110,${gloom * 0.7})`);
    gg.addColorStop(1, `rgba(70,55,110,${gloom})`);
    ctx.fillStyle = gg;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  drawGloryRays();
  drawRidge();
  drawSwineherds();
  drawGround();
  drawBoat();

  drawOrbit(false);
  drawMan();
  drawOrbit(true);
  drawJesus();
  for (const p of pigs) drawPig(p);
  for (const o of obstacles) drawObstacle(o);
  drawLegionLabel();
  drawLauncher();
  drawImps();
  drawParticles();
  drawStreaks();
  drawPopups();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  for (const c of bgClouds) { c.f += c.speed * dt; if (c.f > 1) c.f -= 1; }
  updateParticles(dt);
  updatePeople(dt);
  updatePigs(dt);
  jesus.flash = Math.max(0, jesus.flash - dt);
  if (state === 'play') {
    updateKeyboardAim(dt);
    tryLoad(dt);
    updateImps(dt);
    if (castOut >= total && imps.length === 0) win();
    else if (shots <= 0 && imps.length === 0 && !loaded) fail();
  } else if (state === 'win') {
    winT += dt;
    freedT = Math.min(1, freedT + dt / 1.4);
    if (!freedFlash && freedT >= 0.5) {
      freedFlash = true;
      flashT = 0.35;
      const x = GEO.manX, y = groundY(x) - 40;
      for (let i = 0; i < 60; i++) {
        const a = rand(0, TAU), sp = rand(40, 180);
        spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8), ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
      }
      sfx.puff(0.3);
    }
    if (winT > 1.2 && winT < 1.25) showMessage('The swineherds ran to tell the city!');
    if (Math.random() < dt * 10) spawn(GEO.manX + rand(-40, 40), groundY(GEO.manX) - rand(0, 80), 0, -20, 1, '#fff6d0', 3);
    updateImps(dt);
  } else if (state === 'fail') {
    updateImps(dt);
  }
  // The land brightens as the imps are cast out
  const want = state === 'win' ? 0 : state === 'title' ? 0.22 : 0.28 * ((total - castOut) / (total || 1)) + 0.04;
  gloom += (want - gloom) * Math.min(1, dt * (state === 'win' ? 1.5 : 3));
  shockT = Math.max(0, shockT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  boatWowT = Math.max(0, boatWowT - dt);
  manJoltT = Math.max(0, manJoltT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
