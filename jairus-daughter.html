//  Input
// ============================================================
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (e.repeat || state !== 'play') return;   // taps, not holds
  const go = e.code === 'Space' || e.code === 'Enter';
  const right = e.code === 'ArrowRight' || e.code === 'KeyD';
  const left = e.code === 'ArrowLeft' || e.code === 'KeyA';
  const up = e.code === 'ArrowUp' || e.code === 'KeyW';
  const down = e.code === 'ArrowDown' || e.code === 'KeyS';
  if (phase === 'walk') {
    if (right || go) tryMove(1, 0);
    else if (up) sidestep(-1);
    else if (down) sidestep(1);
  } else if (phase === 'find') {
    if (left || up) { cursor = (cursor + cands.length - 1) % cands.length; kbdUsed = true; }
    else if (right || down) { cursor = (cursor + 1) % cands.length; kbdUsed = true; }
    else if (go && kbdUsed && cands[cursor]) pickCand(cands[cursor]);
    else if (go) kbdUsed = true;
  } else if (go) roomOrSkip();
});

function roomOrSkip() {
  if (phase === 'room' && script && script[scriptI] && script[scriptI].until && !handTaken) { handTaken = true; return; }
  skipStep();
}

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  const wx = p.x + (inRoom ? 0 : camX), wy = p.y;
  ripples.push({ x: wx, y: wy, t: 0 });
  if (phase === 'walk') tapStreet(wx, wy);
  else if (phase === 'find') tapFind(wx, wy);
  else roomOrSkip();
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// A tap in the street: the lane you tapped, and whether it's ahead of Jesus
function tapStreet(wx, wy) {
  let lane = 0, bestD = 1e9;
  for (let l = 0; l < 3; l++) {
    const d = Math.abs(wy - (LANE_Y[l] - 30 * LANE_S[l]));
    if (d < bestD) { bestD = d; lane = l; }
  }
  const dl = Math.sign(lane - jesus.lane);
  const ahead = wx > colX(jesus.col) + CELL * 0.5;
  if (ahead) tryMove(1, dl);
  else if (dl) tryMove(0, dl);
}

function tapFind(wx, wy) {
  let hit = null;
  for (const e of cands) {
    const s = e.s * sAt(e.ry);
    if (Math.abs(wx - e.rx) < 24 * s && wy > e.ry - 84 * s && wy < e.ry + 8) {
      if (!hit || e.ry > hit.ry) hit = e;
    }
  }
  if (hit) pickCand(hit);
}

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}


// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// A few small extra sounds made with the same tone() / noise helpers
Object.assign(sfx, {
  // One sung note per step, climbing as you near the house
  step(progress) {
    if (!this.ctx) return;
    this.puff(0.08);
    Music.tap(progress);
  },
  chime() {
    [1318.5, 1568, 1975.5, 2637].forEach((f, k) => this.tone(f, 0.7, 'sine', 0.12, k * 0.08));
  },
  nope() { this.tone(330, 0.16, 'triangle', 0.22, 0, 262); this.tone(262, 0.2, 'triangle', 0.18, 0.13, 220); },
  bray() {
    this.tone(560, 0.22, 'sawtooth', 0.09, 0, 300);
    this.tone(480, 0.3, 'sawtooth', 0.09, 0.24, 260);
  },
});

// ============================================================
//  Rendering: the street in Capernaum
// ============================================================
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, STREET_TOP);
  g.addColorStop(0, '#9fd3f2');
  g.addColorStop(0.6, '#cfeaf7');
  g.addColorStop(1, '#fdf0cf');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // Sun
  const sx = W * 0.82, sy = 150;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 110);
  sg.addColorStop(0, 'rgba(255,248,210,0.95)'); sg.addColorStop(0.3, 'rgba(255,236,160,0.5)'); sg.addColorStop(1, 'rgba(255,236,160,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 110, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(sx, sy, 30, 0, TAU); ctx.fill();
  // Drifting clouds
  for (let k = 0; k < 5; k++) {
    const span = viewW + 300;
    const x = -offX - 150 + ((k * 331 + t * (6 + k * 2) - camX * 0.05) % span + span) % span;
    drawCloud(x, 90 + k * 55, 90 + k * 18, 26 + k * 4);
  }
}

function drawCloud(cx, cy, w, h) {
  const n = Math.max(3, Math.round(w / 22));
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const r = h * (0.42 + 0.38 * Math.sin(f * Math.PI));
    const px = cx - w / 2 + h * 0.4 + f * (w - h * 0.8);
    ctx.moveTo(px + r, cy - r * 0.3); ctx.arc(px, cy - r * 0.3, r, 0, TAU);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();
}

function drawBackdrop() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Far hills beyond the sea
  ctx.fillStyle = '#b6d39a';
  ctx.beginPath(); ctx.moveTo(x0, 400);
  for (let x = x0; x <= x1; x += 20) {
    const wx = x + camX * 0.12;
    ctx.lineTo(x, 300 + Math.sin(wx / 120) * 22 + Math.sin(wx / 47) * 8);
  }
  ctx.lineTo(x1, 400); ctx.fill();
  // The Sea of Galilee glinting between hills and town
  const sea = ctx.createLinearGradient(0, 340, 0, 400);
  sea.addColorStop(0, '#5fa9d6'); sea.addColorStop(1, '#9ad0ec');
  ctx.fillStyle = sea;
  ctx.fillRect(x0, 342, x1 - x0, 70);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 14; k++) {
    const x = x0 + (((k * 137 + t * 8 - camX * 0.2) % (x1 - x0)) + (x1 - x0)) % (x1 - x0), y = 352 + (k % 4) * 10;
    ctx.moveTo(x, y); ctx.lineTo(x + 14, y);
  }
  ctx.stroke();

  // Houses of Capernaum along the street (a little parallax)
  const par = 0.55, step = 150;
  const first = Math.floor((camX * par + x0) / step) - 1;
  for (let i = first; i < first + Math.ceil((x1 - x0) / step) + 3; i++) {
    const hx = i * step - camX * par;
    const r1 = hash(i), r2 = hash(i + 50), r3 = hash(i + 99);
    const w = 110 + r1 * 40, h = 70 + r2 * 60;
    const base = STREET_TOP + 4;
    ctx.fillStyle = ['#ecd9b0', '#e3c998', '#f1e4c4', '#dcc08e'][Math.floor(r3 * 4)];
    ctx.fillRect(hx, base - h, w, h);
    ctx.fillStyle = '#c0a171'; ctx.fillRect(hx - 4, base - h - 7, w + 8, 8);
    // Door and windows
    ctx.fillStyle = '#7a5a36';
    roundRect(hx + w * 0.18, base - 42, 22, 42, [11, 11, 0, 0]); ctx.fill();
    ctx.fillStyle = '#6a4c2c';
    roundRect(hx + w * 0.62, base - h + 18, 18, 16, 3); ctx.fill();
    if (h > 100) { roundRect(hx + w * 0.3, base - h + 18, 16, 14, 3); ctx.fill(); }
    // Striped awning on some
    if (r1 > 0.5) {
      for (let k = 0; k < 6; k++) {
        ctx.fillStyle = k % 2 ? '#f5efe0' : ['#c0392b', '#2e86c1', '#d68910'][i % 3 < 0 ? 0 : Math.abs(i) % 3];
        ctx.fillRect(hx + w * 0.5 + k * 8, base - 60, 8, 12);
      }
    }
    // Palm tree now and then
    if (r2 > 0.7) {
      const px = hx + w + 12;
      ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, base); ctx.quadraticCurveTo(px + 6, base - 60, px + 2, base - 120); ctx.stroke();
      ctx.strokeStyle = '#5f9a3e'; ctx.lineWidth = 5;
      for (let k = 0; k < 6; k++) {
        const a = -Math.PI / 2 + (k - 2.5) * 0.55 + Math.sin(t * 1.2 + i) * 0.04;
        ctx.beginPath(); ctx.moveTo(px + 2, base - 120);
        ctx.quadraticCurveTo(px + 2 + Math.cos(a) * 26, base - 120 + Math.sin(a) * 26 - 8, px + 2 + Math.cos(a) * 44, base - 120 + Math.sin(a) * 30 + 14);
        ctx.stroke();
      }
    }
  }
}

function drawStreet() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const g = ctx.createLinearGradient(0, STREET_TOP, 0, H);
  g.addColorStop(0, '#dcc08a'); g.addColorStop(1, '#ecd6a4');
  ctx.fillStyle = g;
  ctx.fillRect(x0, STREET_TOP, x1 - x0, H - STREET_TOP + 20);
  ctx.fillStyle = '#c6a56e';
  ctx.fillRect(x0, STREET_TOP, x1 - x0, 6);
  // Paving stones scrolling by
  ctx.fillStyle = 'rgba(255,248,225,0.45)';
  for (const [y, sz] of [[492, 1.1], [606, 1.25], [737, 1.4], [866, 1.6]]) {
    const step = 64 * sz;
    const first = Math.floor((camX + x0) / step) - 1;
    ctx.beginPath();
    for (let i = first; i < first + (x1 - x0) / step + 3; i++) {
      const x = i * step - camX + hash(i + y) * 20;
      ctx.moveTo(x + 18 * sz, y); ctx.ellipse(x, y, 18 * sz, 5 * sz, 0, 0, TAU);
    }
    ctx.fill();
  }
}

// Jairus's house at the end of the street (drawn in world coordinates)
function drawHouse() {
  const hx = colX(cfg.cols + 1.6), base = STREET_TOP + 6;
  if (hx - 260 > camX + W + offX || hx + 260 < camX - offX) return;
  const w = 290, h = 250;
  ctx.save();
  ctx.translate(hx, base); ctx.scale(1.25, 1.25); ctx.translate(-hx, -base);
  ctx.fillStyle = '#f7eedb'; ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 2;
  ctx.fillRect(hx - w / 2, base - h, w, h); ctx.strokeRect(hx - w / 2, base - h, w, h);
  ctx.fillStyle = '#d2b47e'; ctx.fillRect(hx - w / 2 - 8, base - h - 12, w + 16, 14);
  ctx.fillStyle = '#e8d8b4';
  for (let k = 0; k < 9; k++) ctx.fillRect(hx - w / 2 - 4 + k * 36, base - h - 26, 18, 14);   // roof parapet
  // Upper windows with lattices
  for (const dx of [-80, 80]) {
    ctx.fillStyle = '#3d6fb0'; roundRect(hx + dx - 20, base - h + 40, 40, 44, [20, 20, 3, 3]); ctx.fill();
    ctx.strokeStyle = '#f7eedb'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx + dx, base - h + 42); ctx.lineTo(hx + dx, base - h + 84); ctx.moveTo(hx + dx - 20, base - h + 62); ctx.lineTo(hx + dx + 20, base - h + 62); ctx.stroke();
  }
  // Arched blue door with a lamp and steps
  ctx.fillStyle = '#c9b48a'; ctx.fillRect(hx - 50, base - 8, 100, 8);
  ctx.fillStyle = '#2f5597'; roundRect(hx - 32, base - 104, 64, 96, [32, 32, 2, 2]); ctx.fill();
  ctx.strokeStyle = '#e0b64a'; ctx.lineWidth = 3; roundRect(hx - 32, base - 104, 64, 96, [32, 32, 2, 2]); ctx.stroke();
  ctx.fillStyle = '#e0b64a'; ctx.beginPath(); ctx.arc(hx + 18, base - 54, 3.5, 0, TAU); ctx.fill();
  const glow = ctx.createRadialGradient(hx + 52, base - 110, 2, hx + 52, base - 110, 30);
  glow.addColorStop(0, 'rgba(255,220,120,0.9)'); glow.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(hx + 52, base - 110, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b5651d'; ctx.beginPath(); ctx.ellipse(hx + 52, base - 104, 7, 4, 0, 0, TAU); ctx.fill();
  // Potted plants and a vine
  for (const dx of [-66, 66]) {
    ctx.fillStyle = '#c2703d'; roundRect(hx + dx - 12, base - 26, 24, 22, 4); ctx.fill();
    ctx.fillStyle = '#5f9a3e';
    ctx.beginPath(); ctx.arc(hx + dx - 7, base - 32, 9, 0, TAU); ctx.arc(hx + dx + 7, base - 33, 9, 0, TAU); ctx.arc(hx + dx, base - 42, 10, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#6a9c45'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - w / 2 + 10, base); ctx.bezierCurveTo(hx - w / 2 + 30, base - 90, hx - w / 2 + 4, base - 150, hx - w / 2 + 40, base - 200); ctx.stroke();
  ctx.fillStyle = '#7cb356';
  for (let k = 0; k < 8; k++) { ctx.beginPath(); ctx.ellipse(hx - w / 2 + 14 + (k % 2) * 16, base - 20 - k * 23, 7, 4.5, k, 0, TAU); ctx.fill(); }
  // A glowing marker while you're on the way
  if (state === 'play' && phase === 'walk') {
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.fillStyle = '#8a5a00';
    ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("Jairus's house", hx, base - h - 18 - pulse * 3);
  }
  ctx.restore();
}

// Everyone in the street, drawn back to front
function drawStreetPeople() {
  const list = [];
  const L = camX - offX - 80, R = camX + W + offX + 80;
  for (const e of crowd) if (e.rx > L && e.rx < R) list.push(e);
  if (woman && !crowd.includes(woman)) list.push(woman);
  list.push(...messengers, ...mourners, jairus, peter, jesus);
  list.sort((a, b) => a.ry - b.ry);
  const lookX = jesus.rx, lookY = jesus.ry - 60;
  for (const e of list) {
    if (e === jesus) {
      const n = jesus.nudge > 0 ? Math.sin((jesus.nudge / 0.25) * Math.PI) : 0;
      drawJesus(jesus.rx + jesus.ndx * n, jesus.ry + jesus.ndy * n, jesus.pose, jesus.face, 1.12 * sAt(jesus.ry), jesus.walk);
    } else if (e.kind === 'donkey') drawDonkey(e);
    else {
      let lx = lookX, ly = lookY;
      if (e === jairus || e === peter) { lx = jesus.rx + 60; ly = jesus.ry - 60; }
      if (e.cand && e !== woman && phase === 'find') { lx = e.rx + Math.sin(t * 1.3 + e.phase) * 80; ly = e.ry - 40; }
      if (mourners.includes(e)) { lx = jesus.rx; ly = jesus.ry - 60; }
      if (e.cand && phase === 'find' && kbdUsed && cands[cursor] === e) drawCursor(e);
      drawPerson(e, lx, ly);
    }
  }
}

function drawCursor(e) {
  const s = e.s * sAt(e.ry);
  ctx.strokeStyle = `rgba(224,165,38,${0.6 + 0.4 * Math.sin(t * 6)})`; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(e.rx, e.ry + 2, 26 * s, 8 * s, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#e0a526';
  const y = e.ry - 96 * s - Math.abs(Math.sin(t * 5)) * 5;
  ctx.beginPath(); ctx.moveTo(e.rx - 8, y); ctx.lineTo(e.rx + 8, y); ctx.lineTo(e.rx, y + 10); ctx.fill();
}

const MOTHER_LOOK = { kind: 'person', i: 910, robe: '#c4677a', scarf: '#f2c4cf', skin: '#e3b184', hair: '#4a2f1a', beard: false, s: 1, phase: 3, blink: 0 };
const GIRL_LOOK = { kind: 'person', i: 911, robe: '#f7d774', skin: '#e3b184', hair: '#5b3a1f', beard: false, longHair: true, flower: true, s: 0.8, phase: 4, blink: 0 };
const THREE = [

  { kind: 'person', i: 921, robe: '#b5503f', hair: '#2e1d10', beard: true, skin: '#d7a070', s: 1, phase: 2, blink: 0 },   // James

function drawRoom() {
  const L = roomLayout();
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Warm plastered walls and a wooden floor
  const g = ctx.createLinearGradient(0, -offY, 0, L.floor);
  g.addColorStop(0, '#e9cf9f'); g.addColorStop(1, '#f6e4c0');
  ctx.fillStyle = g; ctx.fillRect(x0, -offY, x1 - x0, L.floor + offY);
  ctx.fillStyle = '#b98a55'; ctx.fillRect(x0, L.floor - 40, x1 - x0, H - L.floor + 60);
  ctx.strokeStyle = 'rgba(120,80,40,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = L.floor - 20; y < H + 10; y += 26) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.fillStyle = '#9c7040'; ctx.fillRect(x0, L.floor - 44, x1 - x0, 6);
  // A window full of morning light
  const wx = L.cx - 150, wy = 470;
  ctx.fillStyle = '#9fd3f2'; roundRect(wx - 55, wy - 70, 110, 130, [55, 55, 4, 4]); ctx.fill();
  ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(wx + 18, wy - 20, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = 5; roundRect(wx - 55, wy - 70, 110, 130, [55, 55, 4, 4]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wx, wy - 70); ctx.lineTo(wx, wy + 60); ctx.moveTo(wx - 55, wy); ctx.lineTo(wx + 55, wy); ctx.stroke();
  ctx.fillStyle = 'rgba(255,245,200,0.28)';
  ctx.beginPath(); ctx.moveTo(wx - 50, wy + 60); ctx.lineTo(wx + 50, wy + 60); ctx.lineTo(L.cx + 170, L.floor); ctx.lineTo(L.cx - 10, L.floor); ctx.closePath(); ctx.fill();
  // Roof beams and a woven hanging
  // Ceiling of palm-thatch and poles above the beam
  const ceilTop = -offY - 900;
  ctx.fillStyle = '#d9b77f'; ctx.fillRect(x0, ceilTop, x1 - x0, 360 - ceilTop);
  ctx.strokeStyle = 'rgba(140,100,50,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = 350; y > ceilTop; y -= 22) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.fillStyle = '#9c7040';
  ctx.fillRect(x0, 360, x1 - x0, 14);
  for (let x = L.cx - 400; x < L.cx + 400; x += 80) { roundRect(x - 9, 354, 18, 26, 4); ctx.fill(); }
  const tx = L.cx + 90, ty = 392;
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(tx - 6, ty - 6, 102, 6);
  const stripes = ['#c0392b', '#e8c170', '#2e86c1', '#e8c170', '#c0392b', '#6a9c45', '#e8c170'];
  stripes.forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(tx, ty + k * 14, 90, 14); });
  ctx.strokeStyle = '#e8c170'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = tx + 4; x < tx + 90; x += 8) { ctx.moveTo(x, ty + 98); ctx.lineTo(x, ty + 108); }
  ctx.stroke();
  // An oil lamp on a shelf
  ctx.fillStyle = '#9c7040'; ctx.fillRect(L.cx - 60, 556, 90, 8);
  ctx.fillStyle = '#c2703d'; ctx.beginPath(); ctx.ellipse(L.cx - 15, 548, 16, 8, 0, 0, TAU); ctx.fill();
  const fl = 1 + Math.sin(t * 12) * 0.1;
  ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.ellipse(L.cx, 534, 4 * fl, 9 * fl, 0, 0, TAU); ctx.fill();
  const lg = ctx.createRadialGradient(L.cx, 534, 2, L.cx, 534, 60);

  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(L.cx, 534, 60, 0, TAU); ctx.fill();

  const joy = roomJoy;
  const girlLook = { x: L.jx, y: L.jy - 70 };
  // Peter, James and John by the door
  THREE.forEach((d, k) => {
    d.mood = joy ? 'joy' : riseF > 0 ? 'wow' : 'watch';
    d.rx = L.disc[k]; d.ry = L.bedTop - 4 - (k % 2) * 6;

  roundRect(bedL - 10, top - 40, 14, 92, 4); ctx.fill();       // headboard post
  ctx.fillStyle = '#fbf7ee'; ctx.strokeStyle = '#d9cfb8'; ctx.lineWidth = 1.5;
  roundRect(bedL, top - 6, bedR - bedL, 22, 8); ctx.fill(); ctx.stroke();
  // Pillow
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d9cfb8';
  ctx.beginPath(); ctx.ellipse(L.hipX - 56, top - 8, 26, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();

  drawGirl(L, girlLook);

  // Blanket over her legs
  ctx.fillStyle = '#f29bb5'; ctx.strokeStyle = '#c9607f'; ctx.lineWidth = 1.5;
  roundRect(L.hipX - 6, top - 16, bedR - L.hipX - 4, 24, [10, 10, 6, 6]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let x = L.hipX + 10; x < bedR - 14; x += 22) { ctx.beginPath(); ctx.arc(x, top - 4, 3, 0, TAU); ctx.fill(); }
  // Bed frame front
  ctx.fillStyle = '#a0703c'; ctx.strokeStyle = '#6e4a24'; ctx.lineWidth = 1.5;
  roundRect(bedL - 4, top + 12, bedR - bedL + 8, 22, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(bedL, top + 32, 10, L.floor - top - 30); ctx.fillRect(bedR - 10, top + 32, 10, L.floor - top - 30);

  // Jesus at the head of the bed, reaching for her hand
  drawJesus(L.jx, L.jy, handTaken ? 'reach' : 'walk', joy ? 'joy' : 'calm', L.js);

  // Her mother and father at the foot of the bed
  const mother = Object.assign(MOTHER_LOOK, { mood: joy ? 'joy' : riseF > 0 ? 'wow' : 'hope', rx: L.motherX, ry: L.floor + 18 });
  drawPerson(mother, L.hipX, L.hipY - 30, { scale: 1.0 });
  jairus.rx = L.fatherX; jairus.ry = L.floor + 26; jairus.walk = 0;
  if (!joy) jairus.mood = riseF > 0 ? 'wow' : 'hope';
  drawPerson(jairus, L.hipX, L.hipY - 30, { scale: 1.04 });

  // A glow and a hint while we wait for the player to take her hand
  if (state === 'play' && phase === 'room' && !handTaken && fadeT < 0.3) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const hp = girlHand(L);
    const hg = ctx.createRadialGradient(hp.x, hp.y, 2, hp.x, hp.y, 34);
    hg.addColorStop(0, `rgba(255,236,150,${0.5 + pulse * 0.4})`); hg.addColorStop(1, 'rgba(255,236,150,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hp.x, hp.y, 34, 0, TAU); ctx.fill();
    ctx.save();
    ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';

    const txt = matchMedia('(pointer: coarse)').matches ? 'Tap to take her hand' : 'Click or press Space to take her hand';
    ctx.strokeText(txt, L.cx, 636 - pulse * 4);
    ctx.fillStyle = '#7a5200'; ctx.fillText(txt, L.cx, 636 - pulse * 4);

}

// Where the girl's hand rests (lying down) in playfield coordinates
function girlHand(L) { return { x: L.hipX - 14, y: L.hipY - 6 }; }

function drawGirl(L, look) {
  const g = GIRL_LOOK;
  g.mood = roomJoy ? 'joy' : riseF > 0.5 ? 'wow' : 'sleep';
  const f = ease(riseF);
  const ang = -Math.PI / 2 * (1 - f);   // lying with her head on the pillow, then sitting up
  const sc = 0.95;
  ctx.save();
  ctx.translate(L.hipX, L.hipY);
  ctx.rotate(ang);
  ctx.scale(sc, sc);
  const sleeve = shade(g.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = g.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // Where Jesus's hand is, in her own coordinates
  const toLocal = (wx, wy) => {
    const dx = wx - L.hipX, dy = wy - L.hipY, c = Math.cos(-ang), s = Math.sin(-ang);
    return [(dx * c - dy * s) / sc, (dx * s + dy * c) / sc];
  };
  // Dress
  ctx.fillStyle = g.robe; ctx.strokeStyle = shade(g.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-16, 4); ctx.quadraticCurveTo(-15, -26, -10, -35);
  ctx.quadraticCurveTo(0, -39, 10, -35); ctx.quadraticCurveTo(15, -26, 16, 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Arms: resting on her chest while she sleeps; one hand in His once He takes it
  if (handTaken) {
    const hp = jesusHand(L);
    let [lx, ly] = toLocal(hp.x, hp.y);
    const d = Math.hypot(lx - 10, ly + 30), max = lerp(52, 80, f);
    if (d > max) { lx = 10 + (lx - 10) * max / d; ly = -30 + (ly + 30) * max / d; }
    arm(-10, -30, -4, -18);
    arm(10, -30, lx, ly);
  } else if (roomJoy) {
    const wave = Math.sin(t * 9) * 4;
    arm(-10, -30, -22 + wave, -60);
    arm(10, -30, 4, -18);
  } else {
    arm(-10, -30, 2, -20); arm(10, -30, 6, -14);
  }
  drawHead(g, g.mood, -50, 0.6, -0.6);
  ctx.restore();
}

// ============================================================
//  Speech bubbles, messages and the HUD
// ============================================================
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Where a bubble points, in playfield (screen) coordinates
function bubbleAnchor() {
  const who = bubble.who;
  if (inRoom) {
    const L = roomLayout();
    const k = roomK(), to = (x, y) => ({ x: L.cx + (x - L.cx) * k, y: L.floor + (y - L.floor) * k });
    if (who === 'jesus') return { ...to(L.jx, L.jy - 104), big: true };
    return to(L.fatherX, L.floor - 70);
  }
  const sx = (e, h = 82) => ({ x: e.rx - camX, y: e.ry - h * (e.s || 1) * sAt(e.ry) });
  if (who === 'jesus') return { ...sx(jesus, 96), big: true };
  if (who === 'jairus') return sx(jairus);
  if (who === 'woman') return woman ? sx(woman) : sx(jesus);
  if (who === 'msg') return messengers.length ? sx(messengers[0]) : sx(jesus);
  return sx(who);
}

function drawBubble() {
  if (!bubble) return;
  const a = bubbleAnchor();
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  const big = a.big;
  ctx.font = big ? '700 19px Fredoka, sans-serif' : '600 16px Fredoka, sans-serif';
  const maxW = Math.min(big ? 300 : 240, viewW - 60);
  const lines = wrapLines(bubble.text, maxW);
  const lh = big ? 24 : 20;
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + (big ? 28 : 22), h = lines.length * lh + 12;
  const bx = clamp(a.x - w / 2, -offX + 8, W + offX - w - 8);
  const by = Math.max(a.y - h - 16, 150 - offY);
  ctx.fillStyle = big ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = big ? '#e0a526' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  if (bubble.thought) ctx.setLineDash([5, 4]);
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  const tx = clamp(a.x, bx + 16, bx + w - 16);
  if (bubble.thought) {   // little thought-bubble circles
    for (const [k, r] of [[0.35, 5], [0.7, 3.2]]) {
      ctx.beginPath(); ctx.arc(lerp(tx, a.x, k), lerp(by + h, a.y, k) + 2, r, 0, TAU); ctx.fill(); ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(a.x, a.y - 2); ctx.lineTo(tx + 8, by + h - 1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx - 8, by + h); ctx.lineTo(a.x, a.y - 2); ctx.lineTo(tx + 8, by + h);
    ctx.stroke();
  }
  ctx.fillStyle = big ? '#8a5a00' : '#3b2f1e';
  if (bubble.thought) ctx.font = 'italic ' + ctx.font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, k) => ctx.fillText(l, bx + w / 2, by + 6 + lh * (k + 0.5) + 1));
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const lines = wrapLines(message.text, viewW - 40);
  lines.forEach((l, k) => {
    const y = 330 + k * 30;
    ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + time
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? "Jairus's Daughter" : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('HURRY', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(60, 38, 130, 13, 6.5); ctx.fill();
  const tf = clamp(timeLeft / cfg.time, 0, 1);
  const running = state === 'play' && (phase === 'walk' || phase === 'find');
  const gg = ctx.createLinearGradient(60, 0, 190, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
  ctx.fillStyle = running && tf < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (tf > 0) { roundRect(60, 38, 130 * tf, 13, 6.5); ctx.fill(); }
  ctx.fillStyle = '#5a4210'; ctx.font = '700 13px Fredoka, sans-serif';
  ctx.fillText(`${Math.ceil(timeLeft)}s`, 196, 49);

  // Pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: how far to Jairus's house
  const rx = viewW - 12, bw = 104;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('TO THE HOUSE', rx, 20);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(rx - bw - 22, 30, bw, 10, 5); ctx.fill();
  const pf = jesus ? clamp((jesus.col - 1) / (cfg.cols - 1), 0, 1) : 0;
  ctx.fillStyle = '#7cb356';
  if (pf > 0) { roundRect(rx - bw - 22, 30, bw * pf, 10, 5); ctx.fill(); }
  // the woman's spot on the way
  if (!womanDone) { ctx.fillStyle = '#8fb3dc'; ctx.beginPath(); ctx.arc(rx - bw - 22 + bw * (womanCol - 1) / (cfg.cols - 1), 35, 4, 0, TAU); ctx.fill(); }
  // little house icon
  const hx = rx - 8, hy = 36;
  ctx.fillStyle = '#f7eedb'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 1.5;
  ctx.fillRect(hx - 8, hy - 4, 16, 12); ctx.strokeRect(hx - 8, hy - 4, 16, 12);
  ctx.fillStyle = '#2f5597'; ctx.fillRect(hx - 2.5, hy + 1, 5, 7);
  ctx.fillStyle = '#5a4210'; ctx.fillRect(hx - 10, hy - 7, 20, 3);

  // During the search: what to look for
  if (state === 'play' && phase === 'find') {
    ctx.textAlign = 'center';
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
    const lines = wrapLines('Who touched His cloak? Tap the woman with the hopeful face!', viewW - 150);
    lines.forEach((l, k) => {
      ctx.strokeText(l, viewW / 2, 128 + k * 23);
      ctx.fillStyle = '#7a4a00'; ctx.fillText(l, viewW / 2, 128 + k * 23);
    });
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (inRoom) {
    const L = roomLayout(), k = roomK();
    ctx.save();
    ctx.translate(L.cx, L.floor); ctx.scale(k, k); ctx.translate(-L.cx, -L.floor);
    drawRoom();
    drawParticles();
    ctx.restore();
  } else {
    drawSky();
    drawBackdrop();
    drawStreet();
    ctx.save();
    ctx.translate(-camX, 0);
    drawHouse();
    drawStreetPeople();
    // A gentle sparkle over her if the search is taking a while
    if (phase === 'find' && woman && findT > (level === 1 ? 7 : 12)) {
      const a = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.fillStyle = `rgba(255,226,122,${a})`;
      const y = woman.ry - 96 * sAt(woman.ry);
      ctx.beginPath();
      for (let k = 0; k < 4; k++) { const ang = k * Math.PI / 2 + t; ctx.moveTo(woman.rx, y); ctx.lineTo(woman.rx + Math.cos(ang) * 9, y + Math.sin(ang) * 9); }
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 3; ctx.stroke();
    }
    drawParticles();
    ctx.restore();
  }
  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x - (inRoom ? 0 : camX), r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  drawBubble();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fadeT > 0) {
    ctx.fillStyle = `rgba(60,40,15,${fadeT})`;
    ctx.fillRect(-offX - 10, -offY - 10, viewW + 20, viewH + 20);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (state === 'play' || state === 'title') {
    updateParty(dt);
    updateCrowd(dt);
    updateExtras(dt);
  } else if (state === 'fail') {
    updateParty(dt);
    updateCrowd(dt);
  }
  updateMoods(dt);
  if (state === 'play') {
    updateScript(dt);
    if (phase === 'walk' || phase === 'find') {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; fail(); }
    }
    if (phase === 'find') {
      findT += dt;
      if (cfg.swap) { swapT -= dt; if (swapT <= 0) { swapT = cfg.swap; swapCands(); } }
    }
    if (introT > 0) { introT -= dt; if (introT <= 0 && phase === 'walk') say('jairus', verseSay('live'), 3.2); }
    if (helpT > 0) {
      helpT -= dt;
      if (helpT <= 0 && phase === 'walk' && jesus.col < 4) {
        showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap an open space to step into it' : 'Press → to step, ↑ ↓ to sidestep (or click)');
      }
    }
  }
  if (roomRise || state === 'win') riseF = Math.min(1, riseF + dt / 1.1);
  if (handTaken) reachF = Math.min(1, reachF + dt / 0.6);
  if (fadeDir) { fadeT = clamp(fadeT + fadeDir * dt / 0.8, 0, 1); if (fadeT === 0 && fadeDir < 0) fadeDir = 0; }
  if (state === 'win' && Math.random() < dt * 12) {
    const L = roomLayout();
    spawn(L.hipX + rand(-60, 60), L.hipY - rand(0, 90), 0, -20, 1, '#fff6d0', 3);
  }
  // Camera follows Jesus down the street
  if (jesus && !inRoom) {
    const target = Math.max(0, jesus.rx - W * 0.32);
    camX += (target - camX) * Math.min(1, dt * 4);
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
