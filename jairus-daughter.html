<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd3f2">
<title>Jairus's Daughter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #9fd3f2;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Jairus's Daughter</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound: the shared music engine (music.js) with this game's tune, instruments and ambience
Music.theme = { tune: 'jesusLovesMe', instrument: 'harp', accent: 'pipe', ambience: 'crowd', percussion: false };

// Scripture shown in this game, looked up in the chosen Bible version when displayed.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Overlay cards
  believe:  { ref: 'Mark 5:36', KJV: 'Be not afraid, only believe.', NKJV: 'Do not be afraid; only believe.', NIV: 'Don’t be afraid; just believe.', NLT: 'Don’t be afraid. Just have faith.' },
  arise:    { ref: 'Mark 5:41–42', KJV: 'Talitha cumi... Damsel, I say unto thee, arise. And straightway the damsel arose, and walked; for she was of the age of twelve years.', NKJV: 'Talitha, cumi... Little girl, I say to you, arise. Immediately the girl arose and walked, for she was twelve years of age.', NIV: 'Talitha koum!... Little girl, I say to you, get up! Immediately the girl stood up and began to walk around (she was twelve years old).', NLT: 'Talitha koum... Little girl, get up! And the girl, who was twelve years old, immediately stood up and walked around!' },
  live:     { ref: 'Mark 5:23', KJV: 'come and lay thy hands on her, that she may be healed; and she shall live.', NKJV: 'Come and lay Your hands on her, that she may be healed, and she will live.', NIV: 'Please come and put your hands on her so that she will be healed and live.', NLT: 'Please come and lay your hands on her; heal her so she can live.' },
  // Speech bubbles
  touch:    { ref: 'Mark 5:28', KJV: 'If I may touch but his clothes, I shall be whole.', NKJV: 'If only I may touch His clothes, I shall be made well.', NIV: 'If I just touch his clothes, I will be healed.', NLT: 'If I can just touch his robe, I will be healed.' },
  who:      { ref: 'Mark 5:30', KJV: 'Who touched my clothes?', NKJV: 'Who touched My clothes?', NIV: 'Who touched my clothes?', NLT: 'Who touched my robe?' },
  faith:    { ref: 'Mark 5:34', KJV: 'Daughter, thy faith hath made thee whole; go in peace.', NKJV: 'Daughter, your faith has made you well. Go in peace.', NIV: 'Daughter, your faith has healed you. Go in peace.', NLT: 'Daughter, your faith has made you well. Go in peace.' },
  trouble:  { ref: 'Mark 5:35', KJV: 'why troublest thou the Master any further?', NKJV: 'Why trouble the Teacher any further?', NIV: 'Why bother the teacher anymore?', NLT: 'There’s no use troubling the Teacher now.' },
  sleepeth: { ref: 'Mark 5:39', KJV: 'the damsel is not dead, but sleepeth.', NKJV: 'The child is not dead, but sleeping.', NIV: 'The child is not dead but asleep.', NLT: 'The child isn’t dead; she’s only asleep.' },
  talitha:  { ref: 'Mark 5:41', KJV: 'Talitha cumi... Damsel, I say unto thee, arise.', NKJV: 'Talitha, cumi... Little girl, I say to you, arise.', NIV: 'Talitha koum!... Little girl, I say to you, get up!', NLT: 'Talitha koum... Little girl, get up!' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  const s = v.text.charAt(0).toUpperCase() + v.text.slice(1);
  return `<p class="verse">"${s}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
// Capitalise the first letter for a speech bubble that starts mid-verse
function verseSay(key) { const s = verseText(key); return s.charAt(0).toUpperCase() + s.slice(1); }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const ease = (f) => { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
// The street is a grid: columns run left to right toward Jairus's house,
// and three lanes run from the back of the street (0) to the front (2).
const CELL = 100;                   // width of one column
const COL0 = 100;                   // world x of column 0
const LANE_Y = [548, 674, 800];     // feet of someone standing in each lane
const LANE_S = [1.25, 1.42, 1.6];   // people nearer the front look bigger
const STREET_TOP = 452;             // back edge of the street
const STUN = 0.35;                  // pause after bumping into someone
const WRONG_COST = 3;               // seconds lost for picking the wrong person
const MOVES = [[1, 0], [1, -1], [1, 1], [0, -1], [0, 1]];

const colX = (c) => COL0 + c * CELL;

const LEVEL_NAMES = [
  'By the Sea of Galilee',
  'Capernaum Market Day',
  'The Thronging Street',
  'Pressed on Every Side',
  'Festival Crowds',
  'The Whole City Came',
];

const LEVELS = [
  { cols: 22, dens: 0.22, shuffle: 0,   donkeys: 1, moving: 0, swap: 0,   cands: 5,  veil: 0, per: 1.6,  extra: 22 },
  { cols: 28, dens: 0.28, shuffle: 6,   donkeys: 2, moving: 1, swap: 2.4, cands: 7,  veil: 1, per: 1.35, extra: 18 },
  { cols: 34, dens: 0.33, shuffle: 4.5, donkeys: 3, moving: 2, swap: 1.7, cands: 9,  veil: 2, per: 1.15, extra: 15 },
  { cols: 40, dens: 0.37, shuffle: 3.5, donkeys: 3, moving: 3, swap: 1.3, cands: 10, veil: 2, per: 1.0,  extra: 12 },
  { cols: 46, dens: 0.40, shuffle: 2.8, donkeys: 4, moving: 3, swap: 1.0, cands: 11, veil: 3, per: 0.88, extra: 10 },
];

function makeConfig(n) {
  const base = LEVELS[n - 1] || { cols: 50, dens: 0.43, shuffle: 2.3, donkeys: 5, moving: 4, swap: 0.85, cands: 11, veil: 3, per: Math.max(0.7, 0.8 - (n - 6) * 0.04), extra: 9 };
  return {
    ...base,
    name: LEVEL_NAMES[n - 1] || `Crowded Road ${n}`,
    time: Math.round(base.cols * base.per + base.extra),
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'walk';       // walk | find | cut | room (while playing)
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('jairusBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let timeLeft = 60;
let camX = 0;
let grid = [];            // grid[c * 3 + lane] = whoever stands there (or null)
let crowd = [];           // people and donkeys in the street
let jesus, jairus, peter, woman = null;
let trail = [];           // cells Jesus just left: Jairus and Peter follow in them
let messengers = [], mourners = [];
let womanCol = 10, womanDone = false;
let cands = [], extraCells = new Set(), findT = 0, swapT = 0, cursor = 0, kbdUsed = false;
let bumps = 0, wrong = 0;
let particles = [];
let message = { text: '', t: 0 };
let bubble = null;
let shakeT = 0, flashT = 0, fadeT = 0, fadeDir = 0;
let endTimer = 0;
let lastScore = null;
let inRoom = false, handTaken = false, riseF = 0, reachF = 0, roomJoy = false;
let script = null, scriptI = 0, scriptT = 0;
let hintT = 0;

// ============================================================
//  People
// ============================================================
const ROBES = ['#3f6fb5', '#6b8e3a', '#b5503f', '#d9a13a', '#7a4fa0', '#3c8f86', '#a0673a', '#5a6475', '#c46b8c', '#4b7f4b', '#b08a2e', '#8a5a9e'];
const HAIRS = ['#8a8a8a', '#4a2f1a', '#2e1d10', '#6b3f1d', '#3a2716', '#1f140c'];
const SKINS = ['#d9a066', '#c98d56', '#d7a070', '#e3b184', '#c58a55', '#b87a48', '#d39a66'];
const SCARVES = ['#e8dcc0', '#d8a0a0', '#c9b27a', '#e6c3d6', '#b9d3a8'];
// The woman who touches His cloak: a soft blue veil over a lilac robe
const WOMAN_LOOK = { robe: '#9c86c2', scarf: '#8fb3dc', skin: '#d7a070', hair: '#3a2716', beard: false };
const JAIRUS_LOOK = { robe: '#2f5597', scarf: '#f3efe2', stripe: '#2f5597', skin: '#d39a66', hair: '#7d7468', beard: true };
const PETER_LOOK = { robe: '#3f6fb5', hair: '#8a8a8a', beard: true, skin: '#d9a066' };
let personN = 0;

function makePerson(extra = {}) {
  const i = personN++;
  const woman = Math.random() < 0.42;
  const kid = !woman && Math.random() < 0.16;
  let scarf = woman ? pick(SCARVES) : (Math.random() < 0.2 ? '#d8c7a0' : null);
  return {
    kind: 'person', i,
    robe: pick(ROBES), hair: pick(HAIRS), skin: pick(SKINS),
    beard: !woman && !kid && Math.random() < 0.8, scarf, kid,
    s: kid ? 0.76 : 1,
    mood: 'watch', switchT: 0, delay: rand(0.05, 0.5), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU),
    ox: rand(-9, 9), oy: rand(-5, 5), alpha: 1, bumpT: 0, denyT: 0, pend: null, hold: -1,
    shuffleT: rand(2, 8),
    ...extra,
  };
}

function makeDonkey(extra = {}) {
  return {
    kind: 'donkey', i: personN++, dir: Math.random() < 0.5 ? -1 : 1, moving: false, walk: 0,
    ox: rand(-4, 4), oy: rand(-3, 3), alpha: 1, bumpT: 0, pend: null, hold: -1, stepT: rand(1, 2),
    blanket: pick(['#c0392b', '#2e86c1', '#d68910', '#7d3c98']), load: Math.random() < 0.5,
    blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU),
    ...extra,
  };
}

// Scale for someone standing at depth y: nearer the front looks bigger
function sAt(y) { return clamp(lerp(LANE_S[0], LANE_S[2], (y - LANE_Y[0]) / (LANE_Y[2] - LANE_Y[0])), LANE_S[0] - 0.05, LANE_S[2] + 0.05); }

// ============================================================
//  The street grid
// ============================================================
function gridAt(c, l) {
  if (c < 0 || l < 0 || l > 2) return 'wall';
  if (c >= cfg.cols) return null;
  return grid[c * 3 + l] || null;
}
function setGrid(c, l, v) { if (c >= 0 && c < cfg.cols && l >= 0 && l <= 2) grid[c * 3 + l] = v; }
function place(e, c, l) {
  e.col = c; e.lane = l; setGrid(c, l, e);
  e.rx = colX(c) + e.ox; e.ry = LANE_Y[l] + e.oy;
}
function removeEntity(e) {
  if (e.col !== undefined && gridAt(e.col, e.lane) === e) setGrid(e.col, e.lane, null);
  if (e.hold >= 0 && grid[e.hold] === e) grid[e.hold] = null;
  e.hold = -1;
}

// Cells Jesus, Jairus and Peter stand in: the crowd never steps into them
function partyCell(c, l) {
  if (c === jesus.col && l === jesus.lane) return true;
  return trail.some((p) => p.col === c && p.lane === l);
}

// Can Jesus still get through to the house from where He stands?
function reachable() {
  const n = cfg.cols;
  const seen = new Uint8Array((n + 2) * 3);
  const stack = [[jesus.col, jesus.lane]];
  seen[jesus.col * 3 + jesus.lane] = 1;
  while (stack.length) {
    const [c, l] = stack.pop();
    for (const [dc, dl] of MOVES) {
      const nc = c + dc, nl = l + dl;
      if (nl < 0 || nl > 2) continue;
      if (nc >= n) return true;
      if (gridAt(nc, nl)) continue;
      const k = nc * 3 + nl;
      if (seen[k]) continue;
      seen[k] = 1;
      stack.push([nc, nl]);
    }
  }
  return false;
}

function buildWorld(n) {
  cfg = makeConfig(n);
  grid = new Array(cfg.cols * 3).fill(null);
  crowd = [];
  personN = 0;
  jesus = { col: 1, lane: 1, rx: colX(1), ry: LANE_Y[1], stun: 0, face: 'calm', pose: 'walk', nudge: 0, ndx: 0, ndy: 0, walk: 0 };
  trail = [{ col: 0, lane: 1 }, { col: -1, lane: 1 }];
  jairus = { ...JAIRUS_LOOK, kind: 'person', i: 900, s: 1, mood: 'worried', switchT: 0, delay: 0.1, blinkT: 2, blink: 0, phase: 1, rx: colX(0), ry: LANE_Y[1], alpha: 1, bumpT: 0, denyT: 0 };
  peter = { ...PETER_LOOK, kind: 'person', i: 901, s: 1, mood: 'watch', switchT: 0, delay: 0.3, blinkT: 3, blink: 0, phase: 2, rx: colX(-1), ry: LANE_Y[1], alpha: 1, bumpT: 0, denyT: 0 };
  woman = null; womanDone = false;
  womanCol = Math.round(cfg.cols * 0.42);
  messengers = []; mourners = [];
  cands = []; extraCells = new Set();

  // Scatter the crowd: never a whole column blocked
  for (let c = 3; c < cfg.cols; c++) {
    let inCol = 0;
    for (const l of [0, 1, 2].sort(() => Math.random() - 0.5)) {
      if (inCol >= 2 || Math.random() > cfg.dens) continue;
      place(makePerson(), c, l);
      crowd.push(gridAt(c, l));
      inCol++;
    }
  }
  // Donkeys, some of them ambling down the street toward us
  for (let k = 0; k < cfg.donkeys; k++) {
    const c = Math.floor(rand(5, cfg.cols - 1));
    const l = Math.floor(rand(0, 3));
    const old = gridAt(c, l);
    if (old) { removeEntity(old); crowd.splice(crowd.indexOf(old), 1); }
    const d = makeDonkey({ moving: k < cfg.moving });
    if (d.moving) d.dir = -1;
    place(d, c, l);
    crowd.push(d);
  }
  // Make sure there is always a way through
  let guard = 0;
  while (!reachable() && guard++ < 500) {
    const blockers = crowd.filter((e) => e.col >= 2);
    const e = pick(blockers);
    removeEntity(e); crowd.splice(crowd.indexOf(e), 1);
  }
  camX = 0;
}

// ============================================================
//  Jesus and the party
// ============================================================
function tryMove(dc, dl) {
  if (state !== 'play' || phase !== 'walk' || jesus.stun > 0) return;
  const tc = jesus.col + dc, tl = jesus.lane + dl;
  if (tl < 0 || tl > 2 || tc < 0) return;
  const who = gridAt(tc, tl);
  if (who) { bump(who, dc, dl); return; }
  trail.unshift({ col: jesus.col, lane: jesus.lane });
  trail.length = 2;
  jesus.col = tc; jesus.lane = tl;
  sfx.step(clamp(jesus.col / cfg.cols, 0, 1));
  for (let i = 0; i < 3; i++) spawn(jesus.rx + rand(-10, 10), jesus.ry + 2, rand(-30, 30), rand(-30, -5), 0.4, '#e9d3a0', rand(2, 4));
  if (jesus.col >= cfg.cols) { arrive(); return; }
  if (!womanDone && jesus.col >= womanCol) startTouch();
}

// Up / down from the keyboard: sidestep, or slip diagonally forward if that's open
function sidestep(dl) {
  const tl = jesus.lane + dl;
  if (tl < 0 || tl > 2) return;
  if (!gridAt(jesus.col, tl)) tryMove(0, dl);
  else if (!gridAt(jesus.col + 1, tl)) tryMove(1, dl);
  else tryMove(0, dl);
}

const BUMP_LINES = ['Excuse us!', 'Pardon us, friend!', 'Make way, please!', 'Coming through!', 'Sorry! Hurrying!', 'Mind the Master!'];
function bump(who, dc, dl) {
  if (who === 'wall') return;
  jesus.stun = STUN;
  jesus.nudge = 0.25; jesus.ndx = dc * 16; jesus.ndy = dl * 12;
  bumps++;
  who.bumpT = 0.7;
  if (who.kind === 'donkey') { showMessage('Hee-haw!'); sfx.bray(); }
  else { showMessage(pick(BUMP_LINES)); sfx.bounce(); }
  shakeT = 0.12;
}

function followerTarget(k) {
  const p = trail[k] || { col: jesus.col - k - 1, lane: jesus.lane };
  return { x: colX(p.col) + (k ? -6 : 4), y: LANE_Y[p.lane] + (k ? -3 : 3) };
}

function updateParty(dt) {
  const j = jesus;
  j.stun = Math.max(0, j.stun - dt);
  j.nudge = Math.max(0, j.nudge - dt);
  const tx = colX(j.col), ty = LANE_Y[j.lane];
  const d = Math.hypot(tx - j.rx, ty - j.ry);
  j.rx += (tx - j.rx) * Math.min(1, dt * 14);
  j.ry += (ty - j.ry) * Math.min(1, dt * 14);
  j.walk = d > 2 ? j.walk + dt * 14 : 0;
  for (const [k, f] of [[0, jairus], [1, peter]]) {
    const tg = followerTarget(k);
    const fd = Math.hypot(tg.x - f.rx, tg.y - f.ry);
    f.rx += (tg.x - f.rx) * Math.min(1, dt * 9);
    f.ry += (tg.y - f.ry) * Math.min(1, dt * 9);
    f.walk = fd > 2 ? (f.walk || 0) + dt * 12 : 0;
  }
}

// ============================================================
//  The jostling crowd
// ============================================================
function tryShuffle(e) {
  const dirs = Math.random() < 0.5 ? [-1, 1] : [1, -1];
  for (const dl of dirs) {
    const nl = e.lane + dl;
    if (nl < 0 || nl > 2 || gridAt(e.col, nl) || partyCell(e.col, nl)) continue;
    setGrid(e.col, nl, e);             // hold both cells while they shuffle across
    if (!reachable()) { setGrid(e.col, nl, null); continue; }
    e.pend = { col: e.col, lane: nl, t: 0.45 };
    return true;
  }
  return false;
}

function tryDonkeyStep(e) {
  const nc = e.col + e.dir;
  if (nc < 0) { e.leaving = true; removeEntity(e); return; }
  if (gridAt(nc, e.lane) || partyCell(nc, e.lane)) {
    if (partyCell(nc, e.lane) && Math.random() < 0.3) { e.bumpT = 0.5; }
    return;
  }
  setGrid(nc, e.lane, e);
  if (!reachable()) { setGrid(nc, e.lane, null); return; }
  e.pend = { col: nc, lane: e.lane, t: 0.2 };
}

function updateCrowd(dt) {
  const live = state === 'play' && phase === 'walk';
  const viewL = camX - 120, viewR = camX + W + 260;
  for (let i = crowd.length - 1; i >= 0; i--) {
    const e = crowd[i];
    e.bumpT = Math.max(0, e.bumpT - dt);
    e.denyT = Math.max(0, (e.denyT || 0) - dt);
    e.blinkT -= dt;
    if (e.blinkT <= 0) { e.blink = 0.13; e.blinkT = rand(1.5, 5); }
    if (e.blink > 0) e.blink -= dt;
    if (e.leaving) {
      e.alpha -= dt * 2.5;
      if (e.kind === 'donkey') { e.rx -= 50 * dt; e.walk += dt * 8; }
      if (e.alpha <= 0) crowd.splice(i, 1);
      continue;
    }
    if (e.fadeIn !== undefined && e.alpha < 1) e.alpha = Math.min(1, e.alpha + dt * 3);
    // A pending move: wait out the little warning hop, then go
    if (e.pend) {
      e.pend.t -= dt;
      if (e.pend.t <= 0) {
        e.hold = e.col * 3 + e.lane;
        e.col = e.pend.col; e.lane = e.pend.lane;
        e.pend = null;
      }
    }
    const tx = colX(e.col) + e.ox, ty = LANE_Y[e.lane] + e.oy;
    const sp = e.kind === 'donkey' ? 4 : (e.cand ? 7 : 9);
    e.rx += (tx - e.rx) * Math.min(1, dt * sp);
    e.ry += (ty - e.ry) * Math.min(1, dt * sp);
    const near = Math.hypot(tx - e.rx, ty - e.ry) < 8;
    if (e.hold >= 0 && near) { if (grid[e.hold] === e) grid[e.hold] = null; e.hold = -1; }
    if (e.kind === 'donkey') e.walk = near ? 0 : e.walk + dt * 10;
    if (!live || e.pend || e.hold >= 0 || e.rx < viewL || e.rx > viewR) continue;
    if (e.kind === 'person' && cfg.shuffle) {
      e.shuffleT -= dt;
      if (e.shuffleT <= 0) { e.shuffleT = rand(cfg.shuffle, cfg.shuffle * 2); tryShuffle(e); }
    } else if (e.kind === 'donkey' && e.moving) {
      e.stepT -= dt;
      if (e.stepT <= 0) { e.stepT = rand(1.1, 1.8) / Math.min(1.6, 0.8 + level * 0.15); tryDonkeyStep(e); }
    }
  }
}

function wantMood(p) {
  if (p === jairus) {
    if (state === 'win' || roomJoy) return 'joy';
    if (state === 'fail') return 'dismay';
    return p.forceMood || (state === 'title' ? 'worried' : 'worried');
  }
  if (p === peter) {
    if (state === 'win' || roomJoy) return 'joy';
    if (state === 'fail') return 'dismay';
    return p.forceMood || 'watch';
  }
  if (p.forceMood) return p.forceMood;
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (p.bumpT > 0) return 'shock';
  if (p.denyT > 0) return 'shrug';
  if (p.pend) return 'wow';
  if (p.cand) return p.candMood;
  if (jesus && Math.abs(p.rx - jesus.rx) < CELL * 1.3) return p.i % 3 === 0 ? 'wow' : 'smile';
  return 'watch';
}

function updateMoods(dt) {
  const all = [...crowd, jairus, peter, ...messengers, ...mourners];
  if (woman) all.push(woman);
  for (const p of all) {
    if (p.kind !== 'person') continue;
    const want = wantMood(p);
    if (want !== p.mood) {
      p.switchT += dt;
      if (p.switchT > p.delay) { p.mood = want; p.switchT = 0; }
    } else p.switchT = 0;
    if (p === jairus || p === peter || p === woman || messengers.includes(p) || mourners.includes(p)) {
      p.blinkT -= dt;
      if (p.blinkT <= 0) { p.blink = 0.13; p.blinkT = rand(1.5, 5); }
      if (p.blink > 0) p.blink -= dt;
    }
  }
}

// ============================================================
//  "Who touched my clothes?"
// ============================================================
function startTouch() {
  womanDone = true;
  phase = 'cut';
  const lane = jesus.lane < 2 ? jesus.lane + 1 : jesus.lane - 1;
  woman = makePerson({ ...WOMAN_LOOK, kid: false, s: 1, ox: 0, oy: 0, isWoman: true, forceMood: 'hope' });
  woman.rx = jesus.rx - CELL * 2.6; woman.ry = LANE_Y[lane];
  woman.tx = jesus.rx - 30; woman.ty = (LANE_Y[lane] + LANE_Y[jesus.lane]) / 2 + 4;
  runScript([
    { t: 2.9, run() { say('woman', verseSay('touch'), 2.9, true); } },
    { t: 1.0, skip: false, run() {
      woman.reach = 1;
      for (let i = 0; i < 26; i++) {
        const a = rand(0, TAU), sp = rand(30, 110);
        spawn(jesus.rx - 12, jesus.ry - 20, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.2), pick(['#ffe27a', '#fff6d0', '#ffffff']), rand(2, 4));
      }
      woman.forceMood = 'joy';
      jesus.face = 'up';
      sfx.chime();
    } },
    { t: 2.6, run() {
      woman.reach = 0;
      jesus.pose = 'open';
      say('jesus', verseSay('who'), 2.6);
      setupFind();
    } },
    { t: 0, run() { phase = 'find'; findT = 0; hintT = 0; showMessage('Find her!'); } },
  ]);
}

function setupFind() {
  const region = [];
  // Only spaces that are on screen once the camera settles
  const camR = Math.max(0, colX(jesus.col) - W * 0.32) + W - 40;
  for (let c = jesus.col - 1; c <= jesus.col + 3; c++) {
    for (let l = 0; l < 3; l++) {
      if (partyCell(c, l) || c >= cfg.cols || c < 0 || colX(c) + 20 > camR) continue;
      region.push([c, l]);
    }
  }
  const occupied = region.filter(([c, l]) => gridAt(c, l));
  const free = region.filter(([c, l]) => !gridAt(c, l)).sort(() => Math.random() - 0.5);
  cands = [];
  for (const [c, l] of occupied) { const e = gridAt(c, l); if (e.kind === 'person' && !e.pend && e.hold < 0) cands.push(e); }
  // Top up with extra people, keeping one free space for the woman
  const want = Math.max(cfg.cands - 1, cands.length);
  extraCells = new Set();
  while (cands.length < want && free.length > 1) {
    const [c, l] = free.pop();
    const e = makePerson({ fadeIn: true, alpha: 0 });
    place(e, c, l);
    e.ry -= 30;                    // they hurry in from the back of the street
    crowd.push(e); cands.push(e);
    extraCells.add(c * 3 + l);
  }
  // The woman slips in among them
  const [wc, wl] = free.pop() || occupied[0];
  const prior = gridAt(wc, wl);
  if (prior) { removeEntity(prior); crowd.splice(crowd.indexOf(prior), 1); cands.splice(cands.indexOf(prior), 1); }
  woman.col = wc; woman.lane = wl; setGrid(wc, wl, woman);
  if (!prior) extraCells.add(wc * 3 + wl);   // her space was empty: it must be empty again afterwards
  woman.ox = 0; woman.oy = 0; woman.tx = undefined; woman.cand = true; woman.candMood = 'hope';
  woman.forceMood = null;
  crowd.push(woman);
  // Decoy faces: never hopeful, but some look very like her at higher levels
  const pool = level === 1 ? ['watch', 'wow', 'shrug'] : level === 2 ? ['watch', 'wow', 'shrug', 'smile'] : ['watch', 'wow', 'smile', 'smile', 'shrug', 'worried'];
  const decoys = cands.slice().sort(() => Math.random() - 0.5);
  decoys.forEach((e, k) => {
    e.cand = true; e.candMood = pick(pool);
    if (e.scarf === WOMAN_LOOK.scarf) e.scarf = '#e8dcc0';   // level 1: her veil is unique
    if (k < cfg.veil) { e.scarf = WOMAN_LOOK.scarf; e.beard = false; e.kid = false; e.s = 1; if (k < cfg.veil - 1) e.robe = WOMAN_LOOK.robe; }
  });
  cands.push(woman);
  cands.sort((a, b) => a.col - b.col || a.lane - b.lane);
  cursor = 0;
  swapT = cfg.swap ? cfg.swap * 0.6 : 0;
}

// People in the crowd trade places now and then while you look for her
function swapCands() {
  const list = cands.filter((e) => e.hold < 0 && !e.pend);
  for (let tries = 0; tries < 10; tries++) {
    const a = pick(list), b = pick(list);
    if (!a || !b || a === b) continue;
    if (Math.abs(a.col - b.col) + Math.abs(a.lane - b.lane) > 2) continue;
    const [ac, al] = [a.col, a.lane];
    a.col = b.col; a.lane = b.lane; b.col = ac; b.lane = al;
    setGrid(a.col, a.lane, a); setGrid(b.col, b.lane, b);
    [a.ox, b.ox] = [b.ox, a.ox];
    return;
  }
}

const DENY_LINES = ['Not I!', 'Who, me?', "Wasn't me!", 'Not me, Master!', 'I only bumped Peter!', 'Me? No!'];
function pickCand(e) {
  if (phase !== 'find' || state !== 'play') return;
  if (e === woman) { found(); return; }
  if (!e.cand || e.denyT > 0) return;
  e.denyT = 1.4;
  wrong++;
  timeLeft = Math.max(0, timeLeft - WRONG_COST);
  say(e, pick(DENY_LINES), 1.3);
  sfx.nope();
}

function found() {
  phase = 'cut';
  bubble = null;
  setGrid(woman.col, woman.lane, null);
  woman.cand = false;
  woman.tx = jesus.rx + 64; woman.ty = jesus.ry + 10; woman.kneel = 1;
  woman.forceMood = 'hope';
  crowd.splice(crowd.indexOf(woman), 1);
  for (const e of cands) if (e !== woman) e.forceMood = 'wow';
  sfx.chime();
  showMessage('There she is!');
  runScript([
    { t: 1.0, skip: false },
    { t: 3.6, run() {
      jesus.face = 'joy'; jesus.pose = 'open';
      say('jesus', verseSay('faith'), 3.6);
      woman.forceMood = 'joy';
      for (const e of cands) if (e !== woman) e.forceMood = 'joy';
      for (let i = 0; i < 40; i++) {
        const a = rand(0, TAU), sp = rand(30, 140);
        spawn(woman.rx, woman.ry - 30, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.7, 1.5), pick(['#ffe27a', '#fff6d0', '#ffd1e8']), rand(2, 4), 20);
      }
    } },
    { t: 1.5, skip: false, run() {
      clearFind();
      woman.kneel = 0; woman.leaving = true; woman.tx = woman.rx + 40; woman.ty = LANE_Y[0] - 10;
      jesus.face = 'calm'; jesus.pose = 'walk';
      const baseX = jesus.rx + CELL * 1.5;
      messengers = [0, 1].map((k) => {
        const m = makePerson({ robe: k ? '#8c7a5b' : '#6f6a60', scarf: k ? null : '#d8c7a0', beard: true, kid: false, s: 1, forceMood: 'worried', staff: true });
        m.rx = camX + W + 60 + k * 70; m.ry = k ? LANE_Y[1] + 40 : LANE_Y[2] + 14;
        m.tx = baseX + k * 76; m.ty = m.ry;
        return m;
      });
    } },
    { t: 3.3, run() { say('msg', verseSay('trouble'), 3.3); jairus.forceMood = 'worried'; } },
    { t: 3.2, run() {
      jesus.pose = 'open';
      say('jesus', verseSay('believe'), 3.2);
      jairus.forceMood = 'hope';
    } },
    { t: 0, run() {
      jesus.pose = 'walk';
      for (const m of messengers) m.leaving = true;
      phase = 'walk';
      showMessage("Hurry on to Jairus's house!");
    } },
  ]);
}

// The extra people step back; anyone standing where the street was clear goes
function clearFind() {
  for (const e of cands) {
    if (e === woman) continue;
    e.cand = false; e.forceMood = null;
    const k = e.col * 3 + e.lane;
    if (extraCells.has(k)) { removeEntity(e); e.leaving = true; }
  }
  cands = [];
  extraCells = new Set();
}

// ============================================================
//  Jairus's house and the little girl
// ============================================================
function arrive() {
  phase = 'cut';
  const hx = colX(cfg.cols + 1.6);
  mourners = [[-70, 0], [70, 0], [100, 2], [-10, 2]].map(([dx, l], k) => {
    const m = makePerson({ robe: ['#6d5f7e', '#7a6a58', '#5f6f7e', '#806070'][k], scarf: k % 2 ? null : '#cfc6b8', beard: k % 2 === 1, kid: false, s: 1, forceMood: 'worried' });
    m.rx = hx + dx + CELL * 0.6; m.ry = LANE_Y[l] - (l ? 0 : 6);
    return m;
  });
  runScript([
    { t: 1.2, run() { showMessage("Jairus's house!"); } },
    { t: 3.4, run() { jesus.pose = 'open'; say('jesus', verseSay('sleepeth'), 3.4); for (const m of mourners) m.forceMood = 'wow'; } },
    { t: 0.8, skip: false, run() { fadeDir = 1; } },
    { t: 0.9, skip: false, run() {
      inRoom = true; phase = 'room'; handTaken = false; riseF = 0; reachF = 0; roomJoy = false;
      jairus.forceMood = 'hope'; peter.forceMood = 'watch';
      fadeDir = -1; bubble = null;
      jesus.pose = 'walk'; jesus.face = 'calm';
    } },
    { until: () => handTaken, run() { hintT = 0; } },
    { t: 1.0, skip: false, run() { sfx.chime(); } },
    { t: 3.4, run() { say('jesus', verseSay('talitha'), 3.4); } },
    { t: 1.3, skip: false, run() { roomRise = true; } },
    { t: 0, run() { win(); } },
  ]);
}
let roomRise = false;

// The room is drawn a little larger on wide screens, scaled about the floor's centre
function roomK() { return clamp((W - 20) / 360, 1, 1.5); }

// Positions in the girl's room (playfield coordinates, before roomK scaling)
function roomLayout() {
  const cx = W / 2;
  return {
    cx, floor: 812, bedL: cx - 100, bedR: cx + 112, bedTop: 746,
    hipX: cx - 8, hipY: 740,
    jx: cx - 128, jy: 812, js: 1.35,
    motherX: cx + 118, fatherX: cx + 162,
    disc: [cx + 48, cx + 84, cx + 120],
  };
}
// Where His reaching hand is (room coordinates)
function jesusHand(L) {
  return { x: L.jx + lerp(19, 30, reachF) * L.js, y: L.jy + lerp(-22, -44, reachF) * L.js };
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  roomJoy = true;
  const timeBonus = Math.round(timeLeft) * 15;
  const gentle = Math.max(0, 300 - bumps * 30);
  const faithBonus = Math.max(0, 400 - wrong * 150);
  const levelBonus = level * 500;
  const score = timeBonus + gentle + faithBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('jairusBest', best); } catch (e) {} }
  lastScore = { timeBonus, gentle, faithBonus, levelBonus, score };
  const L = roomLayout();
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(L.hipX, L.hipY - 40, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  jesus.face = 'joy';
  showMessage('She is awake!');
  sfx.win();
  endTimer = 3.2;
}

function fail() {
  state = 'fail';
  syncAmbience();
  phase = 'walk';
  script = null;
  bubble = null;
  jesus.face = 'calm';
  sfx.fail();
  endTimer = 1.5;
}

function showMessage(text) { message = { text, t: 2.2 }; }
function say(who, text, dur = 2.4, thought = false) { bubble = { who, text, t: dur, thought }; }

// ============================================================
//  Little scripted scenes (tap to hurry them along)
// ============================================================
function runScript(steps) { script = steps; scriptI = -1; nextStep(); }
function nextStep() {
  scriptI++; scriptT = 0;
  if (!script || scriptI >= script.length) { script = null; return; }
  const s = script[scriptI];
  const mine = script;
  if (s.run) s.run();
  if (script === mine && script && s.t === 0 && !s.until) nextStep();
}
function updateScript(dt) {
  if (!script) return;
  const s = script[scriptI];
  scriptT += dt;
  if (s.until ? s.until() : scriptT >= s.t) nextStep();
}
function skipStep() {
  if (!script) return;
  const s = script[scriptI];
  if (s.skip === false || s.until || scriptT < 0.5) return;
  if (bubble) bubble = null;
  nextStep();
}

function updateExtras(dt) {
  // The woman walks on her own when she isn't standing in the crowd
  if (woman && !crowd.includes(woman)) {
    if (woman.tx !== undefined) {
      const d = Math.hypot(woman.tx - woman.rx, woman.ty - woman.ry);
      woman.rx += (woman.tx - woman.rx) * Math.min(1, dt * 3.2);
      woman.ry += (woman.ty - woman.ry) * Math.min(1, dt * 3.2);
      woman.walk = d > 3 ? (woman.walk || 0) + dt * 10 : 0;
    }
    if (woman.leaving) { woman.alpha -= dt * 1.2; if (woman.alpha <= 0) woman = null; }
  }
  for (let i = messengers.length - 1; i >= 0; i--) {
    const m = messengers[i];
    const d = Math.hypot(m.tx - m.rx, m.ty - m.ry);
    m.rx += (m.tx - m.rx) * Math.min(1, dt * 2.6);
    m.walk = d > 3 ? (m.walk || 0) + dt * 10 : 0;
    if (m.leaving) { m.alpha -= dt * 1.5; if (m.alpha <= 0) messengers.splice(i, 1); }
  }
}

// ============================================================
//  Drawing people
// ============================================================
function drawPerson(p, lookX, lookY, opts = {}) {
  const mood = p.mood;
  const s = p.s * (opts.scale !== undefined ? opts.scale : sAt(p.ry));
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + p.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  if (p.pend) jump = Math.abs(Math.sin(t * 16)) * 5;
  const walkBob = p.walk ? Math.abs(Math.sin(p.walk)) * 3 : 0;
  const jostle = Math.sin(t * 2.2 + p.phase) * 0.8;
  const px = p.rx + (p.bumpT > 0 ? Math.sin(t * 50) * 2.5 * p.bumpT : 0);
  let py = p.ry - (jump + walkBob) * s;
  const kneel = p.kneel ? 20 * s : 0;

  ctx.save();
  ctx.globalAlpha = clamp(p.alpha === undefined ? 1 : p.alpha, 0, 1);
  if (kneel) {   // kneeling: the robe folds down behind the ground line
    ctx.beginPath(); ctx.rect(px - 60, py - 200, 120, 200 + 1); ctx.clip();
    py += kneel;
  }
  // Soft shadow on the street
  if (!opts.noShadow) {
    ctx.fillStyle = 'rgba(90,60,20,0.16)';
    ctx.beginPath(); ctx.ellipse(px, p.ry + 1 + kneel * 0.0, 17 * s, 4.5 * s, 0, 0, TAU); ctx.fill();
  }
  ctx.translate(px, py);
  ctx.rotate(jostle * 0.01 + (p.denyT > 0 ? Math.sin(t * 18) * 0.05 : 0));
  ctx.scale(s, s);

  const sleeve = shade(p.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward what matters
  let lx = 0, ly = -1;
  if (lookX !== undefined) {
    const wx = px, wy = py - 53 * s;
    const dx = lookX - wx, dy = lookY - wy;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  if (mood === 'joy' && !p.reach) {
    const wave = Math.sin(t * 9 + p.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && p.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = p.robe;
  ctx.strokeStyle = shade(p.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = p === jairus ? '#e0b64a' : '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (p === jairus) {   // the synagogue ruler's fine striped robe
    ctx.strokeStyle = '#e0b64a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-17.5, -6); ctx.lineTo(17.5, -6); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-15, 5); ctx.moveTo(15, 0); ctx.lineTo(15, 5); ctx.stroke();
  }
  if (p.staff) {   // a traveller's staff: they came in a hurry from the house
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(24, -74); ctx.lineTo(22, 2); ctx.stroke();
  }
  if (p.walk) {   // little sandals peeping out while walking
    ctx.fillStyle = '#8a5a2b';
    const k = Math.sin(p.walk) * 4;
    ctx.beginPath(); ctx.ellipse(-6 + k, 1, 5, 2.5, 0, 0, TAU); ctx.ellipse(6 - k, 1, 5, 2.5, 0, 0, TAU); ctx.fill();
  }

  // Resting arms
  if (p.reach) {
    arm(-11, -32, -15, -12);
    arm(11, -32, 32, -30);   // reaching out to touch the hem of His cloak
  } else if (mood === 'watch' || mood === 'smile' || mood === 'doubt' || (mood === 'wow' && p.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  } else if (mood === 'hope') {
    arm(-11, -32, -3, -38); arm(11, -32, 3, -38);           // hands together under the chin
  } else if (mood === 'shrug') {
    arm(-11, -32, -25, -27); arm(11, -32, 25, -27);         // "who, me?"
  }

  drawHead(p, mood, -53, lx, ly);

  // Hands over the face come last
  const hy = -53;
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && p.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = p.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }
  ctx.restore();
}

function drawHead(d, mood, hy, lx, ly) {
  // Long hair shows below a girl's head cloth-free head
  if (d.longHair) {
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.ellipse(0, hy + 4, 17, 20, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = d.stripe || shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  if (d.flower) {   // a little flower in the girl's hair
    ctx.fillStyle = '#ff9ec4';
    for (let k = 0; k < 5; k++) { const a = k * TAU / 5; ctx.beginPath(); ctx.arc(11 + Math.cos(a) * 3, hy - 11 + Math.sin(a) * 3, 2.4, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(11, hy - 11, 1.8, 0, TAU); ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy' && mood !== 'sleep';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr, glint) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      const cx = sx + lx * (rx - pr), cy = ey + ly * (ry - pr);
      ctx.beginPath(); ctx.arc(cx, cy, pr, 0, TAU); ctx.fill();
      if (glint) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - pr * 0.4, cy - pr * 0.45, pr * 0.45, 0, TAU); ctx.fill(); }
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  const blush = (a) => {
    ctx.fillStyle = `rgba(255,120,120,${a})`;
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'smile':
      eyes(3.5, 4.5, 2);
      brows(-8, -8, -8, -8);
      mouthLine(() => ctx.arc(0, mouthY - 5, 6, 0.18 * Math.PI, 0.82 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'hope':   // shining eyes turned to Jesus, brows lifted, a small brave smile
      eyes(4.3, 5.6, 2.3, true);
      brows(-12, -8, -12, -8);
      mouthLine(() => ctx.arc(0, mouthY - 3.5, 3.6, 0.15 * Math.PI, 0.85 * Math.PI));
      blush(0.35);
      break;
    case 'shrug':
      eyes(3.8, 5, 2);
      brows(-11, -11, -11, -11);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.lineTo(4, mouthY); });
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'sleep':   // peacefully asleep
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      mouthLine(() => ctx.arc(0, mouthY - 3, 3, 0.25 * Math.PI, 0.75 * Math.PI));
      blush(0.25);
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      blush(0.45);
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Donkeys
// ============================================================
function drawDonkey(e) {
  const s = sAt(e.ry) * 1.05;
  const x = e.rx + (e.bumpT > 0 ? Math.sin(t * 40) * 2 : 0), y = e.ry;
  ctx.save();
  ctx.globalAlpha = clamp(e.alpha, 0, 1);
  ctx.fillStyle = 'rgba(90,60,20,0.16)';
  ctx.beginPath(); ctx.ellipse(x, y + 1, 34 * s, 5 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(x, y);
  ctx.scale(s * e.dir, s);
  const fur = '#a3968a', dark = '#6e6258', light = '#d9d0c4';
  // Legs (trotting when on the move)
  const sw = e.walk ? Math.sin(e.walk) * 5 : 0;
  ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const [lx, k] of [[-20, 1], [-12, -1], [14, -1], [22, 1]]) { ctx.moveTo(lx, -22); ctx.lineTo(lx + sw * k, -2); }
  ctx.stroke();
  ctx.fillStyle = '#3b3029';
  for (const [lx, k] of [[-20, 1], [-12, -1], [14, -1], [22, 1]]) { ctx.beginPath(); ctx.ellipse(lx + sw * k, -1, 3.5, 2, 0, 0, TAU); ctx.fill(); }
  // Tail
  ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
  const wag = Math.sin(t * 3 + e.phase) * 4;
  ctx.beginPath(); ctx.moveTo(-29, -36); ctx.quadraticCurveTo(-36, -30, -34 + wag * 0.3, -18); ctx.stroke();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(-34 + wag * 0.3, -16, 3, 5, 0, 0, TAU); ctx.fill();
  // Body
  ctx.fillStyle = fur; ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -34, 31, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(2, -26, 20, 6, 0, 0, TAU); ctx.fill();
  // Saddle blanket and baskets
  ctx.fillStyle = e.blanket;
  roundRect(-14, -50, 28, 20, 4); ctx.fill();
  ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-14, -44); ctx.lineTo(14, -44); ctx.moveTo(-14, -37); ctx.lineTo(14, -37); ctx.stroke();
  if (e.load) {
    ctx.fillStyle = '#c9a063'; ctx.strokeStyle = '#8a6a36'; ctx.lineWidth = 1.5;
    roundRect(-10, -62, 20, 13, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(-4, -63, 4, 0, TAU); ctx.arc(4, -64, 4, 0, TAU); ctx.fill();
  }
  // Neck and head
  ctx.fillStyle = fur; ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(18, -44); ctx.quadraticCurveTo(26, -62, 34, -66); ctx.lineTo(42, -56); ctx.quadraticCurveTo(32, -46, 28, -30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a3f37'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(20, -48); ctx.quadraticCurveTo(26, -62, 32, -67); ctx.stroke();
  // Ears
  const flick = e.bumpT > 0 ? -0.4 : Math.sin(t * 1.3 + e.phase) * 0.08;
  ctx.fillStyle = fur; ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  for (const [ex, ang] of [[32, -0.35 + flick], [37, 0.1 + flick]]) {
    ctx.save(); ctx.translate(ex, -68); ctx.rotate(ang);
    ctx.beginPath(); ctx.ellipse(0, -10, 4, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e0b3a8'; ctx.beginPath(); ctx.ellipse(0, -10, 1.8, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = fur;
    ctx.restore();
  }
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(40, -62, 11, 9, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.ellipse(48, -56, 7.5, 6.5, 0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3b3029';
  ctx.beginPath(); ctx.arc(51, -57, 1.2, 0, TAU); ctx.fill();
  // Eye and a contented smile
  const blink = e.blink > 0;
  if (blink) { ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(37, -64); ctx.lineTo(42, -64); ctx.stroke(); }
  else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(40, -65, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(41, -65, 1.8, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (e.bumpT > 0) ctx.ellipse(47, -51, 3, 2.5, 0, 0, TAU);
  else ctx.arc(46, -53, 3.5, 0.3 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Jesus (same drawing as the rest of the collection, standing)
// ============================================================
function drawJesus(x, y, pose, face, sc = 1.2, walk = 0) {
  ctx.save();
  ctx.translate(x, y - (walk ? Math.abs(Math.sin(walk)) * 3 : 0));
  ctx.fillStyle = 'rgba(90,60,20,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 1, 18 * sc, 4.5 * sc, 0, 0, TAU); ctx.fill();
  ctx.scale(sc, sc);

  if (state === 'win' || face === 'joy') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Sandals
  ctx.fillStyle = '#8a5a2b';
  const k = walk ? Math.sin(walk) * 4 : 0;
  ctx.beginPath(); ctx.ellipse(-6 + k, 1, 5, 2.5, 0, 0, TAU); ctx.ellipse(6 - k, 1, 5, 2.5, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: walking, open wide in blessing, raised, or reaching for a small hand
  let hands;
  if (pose === 'open') hands = [[-25, -40], [25, -40]];
  else if (pose === 'up') hands = [[-21, -66], [21, -66]];
  else if (pose === 'reach') hands = [[-19, -22], [lerp(19, 30, reachF), lerp(-22, -44, reachF)]];
  else if (pose === 'beckon') hands = [[-19, -22], [26, -44 + Math.sin(t * 5) * 4]];
  else hands = [[-19, -22], [19, -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (face === 'up') {   // stopping, eyes wide: "Who touched me?"
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -53, 2.6, 0, TAU); ctx.arc(4, -53, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4.6, -53.6, 1.4, 0, TAU); ctx.arc(3.4, -53.6, 1.4, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function resetScene() {
  particles = [];
  bubble = null; script = null;
  inRoom = false; handTaken = false; riseF = 0; reachF = 0; roomJoy = false; roomRise = false;
  fadeT = 0; fadeDir = 0; shakeT = 0; flashT = 0;
  bumps = 0; wrong = 0;
  ripples.length = 0;
}

function titleScreen() {
  state = 'title';
  syncAmbience();
  resetScene();
  buildWorld(1);
  timeLeft = cfg.time;
  showOverlay("Jairus's Daughter", 'Through the crowd, quickly!',
    `${verseHTML('believe')}
     <ul>
       <li><b>Jairus</b> begs Jesus to come to his little girl. Lead them through the <b>jostling crowd</b> to his house before the time runs out.</li>
       <li><b>Touch:</b> <b>tap an open space</b> beside Jesus to step into it &mdash; ahead, or up and down the street. Mind the people and donkeys!</li>
       <li><b>Keyboard:</b> <kbd>&rarr;</kbd> / <kbd>Space</kbd> step forward, <kbd>&uarr;</kbd> <kbd>&darr;</kbd> sidestep.</li>
       <li>When Jesus asks <b>who touched Him</b>, find the woman with the <b>hopeful face</b> and tap her.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Hurry to the House', () => { level = 1; totalScore = 0; startLevel(); });
}

let introT = 0, helpT = 0;
function startLevel() {
  resetScene();
  buildWorld(level);
  timeLeft = cfg.time;
  jairus.forceMood = null; peter.forceMood = null;
  state = 'play';
  syncAmbience();
  phase = 'walk';
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
  introT = 1.2;
  helpT = level === 1 ? 4.6 : 0;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Joy in the House!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('arise')}
       <p class="score">Time to spare: <b>${s.timeBonus}</b><br>Gentle steps: <b>${s.gentle}</b><br>Found her: <b>${s.faithBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Journey', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('The crowd was too thick!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Jairus is still waiting to bring Jesus home. Look ahead for the gaps and keep moving!</p>
       ${verseHTML('live')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>
       ${verseHTML('believe')}`,
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}
