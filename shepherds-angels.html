}

// Try again from the start of the part that went wrong
function retryPart() {
  if (failReason === 'path') {
    state = 'play';
    hideOverlay();
    startJourney();
    sfx.levelStart();
  } else startLevel();
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Tidings of great joy!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('glory')}
       <p class="score">Night watch: <b>${s.watch}</b><br>Angel choir: <b>${s.choir}</b> <small>(${s.perfect} perfect)</small><br>Road to Bethlehem: <b>${s.path}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Night', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'path'
      ? ['A bumpy road!', 'The shepherds stumbled once too often. Watch for rocks and ditches in the starlight, and step aside in good time.']
      : ['The flock got away!', 'The lamps went out before morning. Watch the edges of the firelight, and keep Benjamin awake!'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('sign')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', retryPart,
      failReason === 'path' ? '↻ Restart Level' : null, failReason === 'path' ? startLevel : null);
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const tapQueue = [];
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (phase === 'journey') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') stepLane(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') stepLane(1);
  } else if (e.code === 'Space' || e.code === 'Enter') {
    if (phase === 'choir') keyChoir();
    else if (phase === 'angel' && lineT > 0.8) nextAngelLine();
    else if (phase === 'finale' && stageT > 1.2) nextStage();
  }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  if (tapQueue.length < 4) tapQueue.push({ x: p.x, y: p.y });
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function handleTaps() {
  while (tapQueue.length) {
    const p = tapQueue.shift();
    if (state !== 'play') continue;
    if (phase === 'watch') tapWatch(p);
    else if (phase === 'angel') { if (lineT > 0.8) nextAngelLine(); }
    else if (phase === 'choir') tapChoir(p);
    else if (phase === 'journey') { if (p.x < gx - 16) stepLane(-1); else if (p.x > gx + 16) stepLane(1); }
    else if (phase === 'finale') { if (stageT > 1.2) nextStage(); }
  }
}

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // --- extra little sounds for this game ---
  bleat(pitch = 1) {   // "baa-aa"
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(), depth = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(470 * pitch, t0);
    o.frequency.linearRampToValueAtTime(400 * pitch, t0 + 0.5);
    lfo.frequency.value = 17; depth.gain.value = 26 * pitch;
    lfo.connect(depth); depth.connect(o.frequency);
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1050; bp.Q.value = 2.5;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.connect(bp); bp.connect(g); g.connect(this.master);
    o.start(t0); lfo.start(t0); o.stop(t0 + 0.6); lfo.stop(t0 + 0.6);
  },
  whistle() { this.tone(1300, 0.12, 'sine', 0.12, 0, 1900); this.tone(1900, 0.2, 'sine', 0.12, 0.13, 1400); },
  yelp() { this.tone(950, 0.22, 'triangle', 0.2, 0, 520); this.tone(800, 0.2, 'triangle', 0.15, 0.2, 450); },
  wake() { this.tone(520, 0.1, 'sine', 0.2); this.tone(780, 0.16, 'sine', 0.2, 0.1); },
  bump() { this.bounce(); this.puff(0.25); },
  step() { this.puff(0.12); },
  sing(note, vowel) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + 0.01;
    singPart(this.ctx, this.master, t0, 0.45, [[vowel, 1, note]], 0, 0.15);
    organ(this.ctx, this.master, t0, 0.42, [[vowel, 1, note]], 0.03);
  },
  glory() {            // the sudden light: a shimmer and a great "Ahh"
    if (!this.ctx) return;
    this.thunder();
    for (let i = 0; i < 6; i++) this.tone(1200 + i * 260, 0.9, 'sine', 0.05, i * 0.07);
    playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.3, 'start');
  },
};

// ============================================================
//  Rendering: the night field
// ============================================================
const STARS = Array.from({ length: 90 }, () => ({ f: Math.random(), g: Math.random(), r: rand(0.8, 2.2), tw: rand(0, TAU) }));

function drawNightSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, HORIZON + 40);
  g.addColorStop(0, '#070b2a');
  g.addColorStop(0.6, '#18225a');
  g.addColorStop(1, '#3a3f80');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, HORIZON + 80 + offY);
}

function drawStars(alpha, top, bottom) {
  for (const s of STARS) {
    const x = -offX + s.f * viewW, y = top + s.g * (bottom - top);
    const a = alpha * (0.55 + 0.45 * Math.sin(t * 2 + s.tw));
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.fillStyle = '#fffbe8';
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
    if (s.r > 1.9) {
      ctx.strokeStyle = '#fffbe8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawMoon(alpha) {
  const mx = W - Math.min(110, W * 0.18), my = 190;
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(mx, my, 10, mx, my, 70);
  g.addColorStop(0, 'rgba(255,250,220,0.35)'); g.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 70, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx, my, 24, 0, TAU); ctx.clip();
  ctx.fillStyle = '#fff6d0'; ctx.fillRect(mx - 30, my - 30, 60, 60);
  ctx.fillStyle = '#131c4c'; ctx.beginPath(); ctx.arc(mx + 11, my - 7, 22, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawFarHills() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#1b2352';
  ctx.beginPath(); ctx.moveTo(x0, HORIZON + 40);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, HORIZON - 55 + Math.sin(x / 130) * 22 + Math.sin(x / 47) * 6);
  ctx.lineTo(x1, HORIZON + 40); ctx.fill();
  // Bethlehem's little houses on the far hill, windows glowing
  const bx = W * 0.2, by = HORIZON - 58 + Math.sin(bx / 130) * 22;
  for (let i = 0; i < 6; i++) {
    const hx = bx - 50 + i * 20, hh = 14 + (i * 7) % 12;
    ctx.fillStyle = '#141a40';
    ctx.fillRect(hx, by - hh + 8, 18, hh);
    ctx.fillStyle = `rgba(255,205,110,${0.7 + 0.3 * Math.sin(t * 2 + i)})`;
    ctx.fillRect(hx + 7, by - hh + 13, 4, 4);
  }
  ctx.fillStyle = '#23305e';
  ctx.beginPath(); ctx.moveTo(x0, HORIZON + 40);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, HORIZON - 18 + Math.sin(x / 90 + 2) * 12);
  ctx.lineTo(x1, HORIZON + 40); ctx.fill();
}

function drawField() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#2d5640'); g.addColorStop(1, '#1f4030');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, HORIZON + Math.sin(x / 150) * 10);
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  // grass tufts
  ctx.strokeStyle = '#3d7050'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 40; i++) {
    const x = x0 + ((i * 137) % (x1 - x0)), y = HORIZON + 30 + ((i * 71) % (H - HORIZON - 40));
    ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 7); ctx.moveTo(x, y); ctx.lineTo(x, y - 9); ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 7);
  }
  ctx.stroke();
}

function drawBush(x, y, rustle) {
  const wob = rustle ? Math.sin(t * 25) * 2 : 0;
  ctx.fillStyle = '#1d3b2a';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-26, -8, 20], [0, -20, 26], [26, -8, 20], [-12, 2, 18], [14, 2, 18]]) {
    ctx.moveTo(x + dx + wob + r, y + dy); ctx.arc(x + dx + wob, y + dy, r, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = '#28503a';
  ctx.beginPath(); ctx.arc(x - 6 + wob, y - 26, 12, 0, TAU); ctx.arc(x + 14 + wob, y - 16, 9, 0, TAU); ctx.fill();
}

function drawCampfire(x, y, lv) {
  // stones
  ctx.fillStyle = '#6d6a72';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * TAU;
    ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * 34, y + Math.sin(a) * 12, 10, 7, 0, 0, TAU); ctx.fill();
  }
  // logs
  ctx.fillStyle = '#6b4424';
  ctx.save(); ctx.translate(x, y - 2);
  ctx.rotate(0.35); roundRect(-30, -6, 60, 12, 6); ctx.fill();
  ctx.rotate(-0.7); roundRect(-30, -6, 60, 12, 6); ctx.fill();
  ctx.restore();
  // flames
  const f = (hgt, w, col, ph) => {
    const h2 = hgt * lv * (0.9 + 0.12 * Math.sin(t * 11 + ph));
    const sway = Math.sin(t * 7 + ph) * 4;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x - w, y - 4);
    ctx.quadraticCurveTo(x - w * 1.1, y - h2 * 0.5, x + sway, y - h2);
    ctx.quadraticCurveTo(x + w * 1.1, y - h2 * 0.5, x + w, y - 4);
    ctx.closePath(); ctx.fill();
  };
  f(62, 24, '#ff6a2b', 0);
  f(46, 17, '#ffa634', 1.7);
  f(28, 10, '#ffe27a', 3.1);
}

function drawFireGlow(x, y, lv) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y - 20, 5, x, y - 20, 220 * lv);
  g.addColorStop(0, 'rgba(255,170,70,0.32)'); g.addColorStop(1, 'rgba(255,140,50,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 20, 220 * lv, 0, TAU); ctx.fill();
  ctx.restore();
}

// Everything outside the light fades into the night
function drawDarkness(cx, cy, rx, ry, alpha) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, rx * 0.55, 0, 0, rx * 1.05);
  g.addColorStop(0, 'rgba(6,10,34,0)'); g.addColorStop(1, `rgba(6,10,34,${alpha})`);
  ctx.fillStyle = g;
  ctx.fillRect(-6000, -6000, 12000, 12000);
  ctx.restore();
}

// A friendly cartoon wolf (only the eyes show while it hides)
function drawWolfBody(w) {
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.scale(w.side, 1);   // side 1 = facing left
  const trot = w.stage === 'flee' ? Math.sin(t * 30) * 3 : Math.sin(t * 10) * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5d6275';
  for (const lx of [-18, -8, 10, 20]) { roundRect(lx - 3, -16 + (lx % 20 === 0 ? trot : -trot), 6, 16, 3); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(0, -24, 28, 13, 0, 0, TAU); ctx.fill();
  // tail
  ctx.beginPath(); ctx.moveTo(24, -28); ctx.quadraticCurveTo(46, -34, 44, -18 + trot); ctx.quadraticCurveTo(34, -22, 24, -20); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(-26, -32, 13, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-34, -30); ctx.lineTo(-48, -26); ctx.lineTo(-34, -22); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-32, -42); ctx.lineTo(-30, -54); ctx.lineTo(-24, -43); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-24, -43); ctx.lineTo(-18, -53); ctx.lineTo(-16, -40); ctx.fill();
  ctx.fillStyle = '#2b2d38'; ctx.beginPath(); ctx.arc(-48, -26, 2.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9aa0b4'; ctx.beginPath(); ctx.ellipse(-30, -24, 7, 4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawWolfEyes(w) {
  const hx = w.stage === 'eyes' ? w.x : w.x - w.side * 28, hy = w.stage === 'eyes' ? w.y - 22 : w.y - 34;
  ctx.save();
  ctx.shadowColor = '#fff27a'; ctx.shadowBlur = 12;
  ctx.fillStyle = w.stage === 'flee' ? '#ffffff' : '#fff05a';
  const open = w.blink ? 0.15 : 1;
  const big = w.stage === 'flee' ? 1.5 : 1;
  for (const dx of [-6, 6]) { ctx.beginPath(); ctx.ellipse(hx + dx, hy, 4 * big, 3.2 * open * big, 0, 0, TAU); ctx.fill(); }
  ctx.shadowBlur = 0;
  if (w.stage !== 'flee' && !w.blink) {
    ctx.fillStyle = '#1a1a1a';
    for (const dx of [-6, 6]) { ctx.beginPath(); ctx.arc(hx + dx - w.side * 1.2, hy, 1.5, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
  // a gentle hint: a pulsing ring around the eyes
  if (state === 'play' && w.stage === 'eyes') {
    ctx.strokeStyle = `rgba(255,240,120,${0.35 + 0.25 * Math.sin(t * 8)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, 22 + Math.sin(t * 8) * 3, 0, TAU); ctx.stroke();
  }
}

function drawAngel(x, y, a, s = 1, raised = true) {
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y + Math.sin(t * 2 + x) * 6 * s);
  ctx.scale(s, s);
  const g = ctx.createRadialGradient(0, -40, 5, 0, -40, 120);
  g.addColorStop(0, 'rgba(255,250,220,0.8)'); g.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -40, 120, 0, TAU); ctx.fill();
  // wings
  const flap = Math.sin(t * 3 + x) * 0.08;
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.scale(sx, 1); ctx.rotate(flap);
    ctx.fillStyle = '#fbfaff'; ctx.strokeStyle = '#d6d8ec'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(8, -60); ctx.quadraticCurveTo(50, -110, 78, -84);
    ctx.quadraticCurveTo(70, -76, 74, -66); ctx.quadraticCurveTo(62, -62, 64, -50);
    ctx.quadraticCurveTo(50, -48, 50, -38); ctx.quadraticCurveTo(30, -40, 8, -40);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // gown
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d6d8ec'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-10, -62); ctx.quadraticCurveTo(0, -66, 10, -62);
  ctx.lineTo(20, 10); ctx.quadraticCurveTo(0, 20, -20, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-13, -30); ctx.quadraticCurveTo(0, -27, 13, -30); ctx.stroke();
  // arms open in blessing (or both raised in song)
  ctx.strokeStyle = '#f4f2fb'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const hands = raised ? [[24, -86], [-24, -86]] : [[26, -44], [-26, -44]];
  for (const [hx, hy] of hands) { ctx.beginPath(); ctx.moveTo(Math.sign(hx) * 8, -58); ctx.lineTo(hx, hy); ctx.stroke(); }
  ctx.fillStyle = '#f1c9a0';
  ctx.beginPath(); for (const [hx, hy] of hands) { ctx.moveTo(hx + 3.5, hy); ctx.arc(hx, hy, 3.5, 0, TAU); } ctx.fill();
  // halo, hair, face
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3; ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -96, 14, 0, TAU); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#f2c14e';
  ctx.beginPath(); ctx.arc(0, -78, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f1c9a0';
  ctx.beginPath(); ctx.arc(0, -76, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f2c14e';
  ctx.beginPath(); ctx.arc(0, -79, 11.5, Math.PI, TAU); ctx.quadraticCurveTo(0, -82, -11.5, -79); ctx.fill();
  ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(-4, -76, 2.4, Math.PI * 1.1, Math.PI * 1.9);
  ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -76 + 2.4 * Math.sin(Math.PI * 1.1));
  ctx.arc(4, -76, 2.4, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();
  ctx.fillStyle = '#7a2e22';
  ctx.beginPath(); ctx.moveTo(-3, -72); ctx.arc(0, -72, 3, 0, Math.PI); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// The multitude of the heavenly host, in an arc across the sky
function hostSlots() {
  const n = W < 700 ? 6 : 10;
  const list = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    list.push({ x: lerp(50, W - 50, f), y: 350 - Math.sin(f * Math.PI) * 50 + (i % 2) * 30, k: i });
  }
  return list;
}

function drawNote(n) {
  const live = n.state === 'live';
  const a = live ? clamp(n.t / 0.25, 0, 1) : clamp(1 - n.fx / 0.8, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(n.x, n.y - (live ? 0 : n.fx * 40));
  // closing ring
  if (live) {
    const f = clamp(1 - n.t / n.dur, 0, 1);
    const close = Math.abs(n.dur - n.t) <= 0.22;
    ctx.strokeStyle = close ? '#fff6a0' : 'rgba(255,240,180,0.8)';
    ctx.lineWidth = close ? 5 : 3;
    ctx.beginPath(); ctx.arc(0, 0, 30 + f * 70, 0, TAU); ctx.stroke();
  }
  // glow
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 44);
  const col = n.state === 'miss' ? '180,190,220' : '255,230,120';
  g.addColorStop(0, `rgba(${col},0.9)`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fill();
  // the note itself: a head, a stem and a flag
  ctx.fillStyle = n.state === 'miss' ? '#aab0c8' : '#fffdf0';
  ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(-4, 9, 10, 7.5, -0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, 7); ctx.lineTo(5, -20); ctx.quadraticCurveTo(16, -14, 14, -2); ctx.stroke();
  if (n.label) {
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,30,80,0.7)'; ctx.lineJoin = 'round';
    ctx.strokeText(n.label, 0, -34);
    ctx.fillStyle = n.state === 'miss' ? '#d0d6ee' : '#fff3a0';
    ctx.fillText(n.label, 0, -34);
  }
  ctx.restore();
}

function drawNightField() {
  drawNightSky();
  drawFarHills();
  drawField();
  const bs = bushes();
  for (const b of bs) drawBush(b.x, b.y, wolves.some((w) => w.stage === 'eyes' && Math.hypot(w.x - b.x, w.y - 10 - b.y) < 20));

  // People, sheep, fire and wolves, back to front
  const items = [{ y: FY, draw: () => drawCampfire(W / 2, FY, fireLevel) }];
  for (const sl of shepherdSlots()) items.push({ y: sl.y, draw: () => drawShepherd(sl) });
  for (const s of sheep) {
    const sc = 0.55 + clamp((s.y - HORIZON) / 500, 0, 1) * 0.3;
    const moving = s.state !== 'home';
    const graze = s.state === 'home' && Math.sin(t * 0.7 + s.phase) > 0.6 ? 6 : 0;
    items.push({ y: s.y, draw: () => drawSheep(s.x, s.y, sc, s, s.mood, { walk: moving ? s.walk : 0, flip: s.flip, graze, lx: -s.flip * 0.6, ly: 0.2, jump: s.mood === 'joy' && phase !== 'watch' ? Math.abs(Math.sin(t * 6 + s.phase)) * 8 : 0 }) });
  }
  for (const w of wolves) if (w.stage !== 'eyes') items.push({ y: w.y, draw: () => drawWolfBody(w) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw();

  // The night closes in beyond the firelight (and melts away in the glory)
  const lr = RX() * cfg.light * fireLevel * 1.08;
  drawDarkness(W / 2, FY - 30, lr, RY_UP * cfg.light * fireLevel * 1.08, cfg.dark * (1 - gloryF));
  drawStars(1 - gloryF * 0.7, -offY + 8, HORIZON - 110);
  drawMoon(1 - gloryF * 0.6);
  drawFireGlow(W / 2, FY, fireLevel);
  for (const w of wolves) drawWolfEyes(w);

  // A soft hint ring on sleepy Benjamin
  if (sleepy.asleep && state === 'play') {
    const b = shepherdSlots()[2];
    ctx.strokeStyle = `rgba(255,240,160,${0.4 + 0.3 * Math.sin(t * 6)})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x, b.y - 48, 48 + Math.sin(t * 6) * 3, 0, TAU); ctx.stroke();
  }
  // Rings on sheep far out in the dark, so they can still be found
  if (state === 'play' && phase === 'watch') {
    for (const s of sheep) {
      if (s.state !== 'wander' || s.r < 0.6) continue;
      const a = clamp((s.r - 0.6) / 0.3, 0, 1);
      ctx.strokeStyle = `rgba(255,255,255,${0.25 + a * 0.35 * (0.6 + 0.4 * Math.sin(t * 7))})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y - 20, 30, 0, TAU); ctx.stroke();
    }
  }

  // Glory of the Lord shining round about them (Luke 2:9)
  if (gloryF > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(W / 2, 250, 20, W / 2, 250, Math.max(W, 900) * 0.8);
    gg.addColorStop(0, `rgba(255,240,170,${0.55 * gloryF})`);
    gg.addColorStop(0.5, `rgba(255,210,120,${0.22 * gloryF})`);
    gg.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(-offX, -offY, viewW, viewH);
    ctx.restore();
    // rays
    ctx.save();
    ctx.translate(W / 2, 240);
    ctx.rotate(t * 0.05);
    ctx.fillStyle = `rgba(255,244,190,${0.16 * gloryF})`;
    for (let i = 0; i < 16; i++) {
      ctx.rotate(TAU / 16);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -1100); ctx.lineTo(40, -1100); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  if (phase === 'choir') {
    const hs = hostSlots();
    hs.forEach((h, i) => drawAngel(h.x, h.y, clamp(phaseT * 2.5 - i * 0.35, 0, 1) * 0.95, 0.5));
  }
  if (phase === 'angel' || phase === 'choir') {
    const ay = phase === 'angel' ? lerp(200, 380, clamp(phaseT / 1.2, 0, 1)) : 380;
    drawAngel(W / 2, ay, clamp(phaseT / 0.8, 0, 1) + (phase === 'choir' ? 1 : 0), phase === 'choir' ? 1 : 1.25, phase === 'choir');
  }
  if (phase === 'angel' && lineIdx < ANGEL_LINES.length) drawAngelBubble();
  for (const n of notes) drawNote(n);
}

// The angel's words in a speech bubble
function drawAngelBubble() {
  const v = Bible.verse(VERSES[ANGEL_LINES[lineIdx]]);
  const a = clamp(lineT / 0.3, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 19px Fredoka, sans-serif';
  const bw = Math.min(W - 28, 460);
  const lines = wrapLines(`“${v.text}”`, bw - 30);
  const lh = 24;
  const bh = lines.length * lh + 42;
  const bx = W / 2 - bw / 2, by = Math.max(112, 236 - bh);
  ctx.fillStyle = 'rgba(255,253,240,0.96)';
  ctx.strokeStyle = 'rgba(224,165,38,0.8)'; ctx.lineWidth = 3;
  roundRect(bx, by, bw, bh, 18); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 - 12, by + bh - 1); ctx.lineTo(W / 2, by + bh + 16); ctx.lineTo(W / 2 + 12, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#4a3a1c'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, by + 26 + i * lh));
  ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#8a6a2a';
  ctx.fillText(`${v.cite}${lineT > 0.8 && state === 'play' ? '  ·  tap to continue' : ''}`, W / 2, by + bh - 11);
  ctx.restore();
}

// ============================================================
//  Rendering: the road to Bethlehem
// ============================================================
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function drawRock(x, y, seed) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 34, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8b8792'; ctx.strokeStyle = '#5c5963'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 32, y + 8);
  ctx.quadraticCurveTo(x - 34, y - 18, x - 10, y - 24 - seed);
  ctx.quadraticCurveTo(x + 18, y - 30, x + 30, y - 6);
  ctx.quadraticCurveTo(x + 36, y + 8, x + 20, y + 10);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b2aeb8';
  ctx.beginPath(); ctx.ellipse(x - 8, y - 14, 10, 5, -0.3, 0, TAU); ctx.fill();
}

function drawDitch(x, y, w) {
  ctx.fillStyle = '#5e4a2e';
  ctx.beginPath(); ctx.ellipse(x, y, w / 2 + 6, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1e2616';
  ctx.beginPath(); ctx.ellipse(x, y + 3, w / 2 - 4, 15, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3f6b44'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const dx of [-w / 2, -w / 4, w / 4, w / 2 - 6]) { ctx.moveTo(x + dx, y - 16); ctx.lineTo(x + dx - 3, y - 25); ctx.moveTo(x + dx + 4, y - 16); ctx.lineTo(x + dx + 6, y - 24); }
  ctx.stroke();
}

function drawStarItem(x, y, seed) {
  const r = 14 + Math.sin(t * 5 + seed) * 2;
  ctx.save();
  ctx.translate(x, y - 20);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 40);
  g.addColorStop(0, 'rgba(255,240,150,0.8)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
  ctx.rotate(t * 1.5 + seed);
  ctx.fillStyle = '#ffe27a'; ctx.strokeStyle = '#f5b82e'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = (i / 10) * TAU - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawLantern(x, y) {
  ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y - 20); ctx.stroke();
  ctx.fillStyle = '#6b4a2b'; roundRect(x - 7, y - 14, 14, 3, 1); ctx.fill();
  ctx.fillStyle = '#ffd766'; roundRect(x - 6, y - 11, 12, 13, 3); ctx.fill();
  ctx.fillStyle = '#6b4a2b'; roundRect(x - 7, y + 2, 14, 3, 1); ctx.fill();
}

// The stable in Bethlehem, seen from the road
function drawStableFront(x, y) {
  ctx.save();
  ctx.translate(x, y);
  const g = ctx.createRadialGradient(0, -80, 10, 0, -80, 260);
  g.addColorStop(0, 'rgba(255,220,140,0.45)'); g.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -80, 260, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a5433'; ctx.strokeStyle = '#4a3220'; ctx.lineWidth = 3;
  roundRect(-130, -150, 260, 150, 6); ctx.fill(); ctx.stroke();
  // roof
  ctx.fillStyle = '#5a3b24';
  ctx.beginPath(); ctx.moveTo(-160, -140); ctx.lineTo(0, -220); ctx.lineTo(160, -140); ctx.closePath(); ctx.fill(); ctx.stroke();
  // warm doorway
  ctx.fillStyle = '#ffd98a';
  roundRect(-50, -110, 100, 110, [40, 40, 0, 0]); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,200,0.8)';
  roundRect(-32, -86, 64, 86, [30, 30, 0, 0]); ctx.fill();
  // planks
  ctx.strokeStyle = 'rgba(60,40,20,0.4)'; ctx.lineWidth = 2;
  for (const px of [-110, -80, 70, 100]) { ctx.beginPath(); ctx.moveTo(px, -145); ctx.lineTo(px, -2); ctx.stroke(); }
  ctx.restore();
}

function drawTraveller(d, x, y, s, lantern) {
  const bob = Math.abs(Math.sin(walkT + d.i)) * 3;
  const slot = { d, x, y: y - bob, s };
  if (lantern) {
    drawDisciple(slot);
    drawLantern(x + 20 * s, y - bob - 20 * s);
  } else drawShepherd(slot);
}

function drawJourney() {
  const lw = laneW();
  const pw = lw * 3 + 60;
  // the hillside
  ctx.fillStyle = '#1f3f2c';
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // grass tufts and stones beside the road, scrolling past
  const rowH = 70;
  const r0 = Math.floor((jd - GROUP_Y - offY) / rowH) - 1, r1 = Math.floor((jd + H - GROUP_Y) / rowH) + 1;
  for (let r = r0; r <= r1; r++) {
    const y = GROUP_Y + r * rowH - jd;
    for (let k = 0; k < 3; k++) {
      const side = k % 2 ? 1 : -1;
      const x = W / 2 + side * (pw / 2 + 20 + hash(r * 3 + k) * Math.max(40, (viewW - pw) / 2 - 20));
      if (hash(r * 7 + k) < 0.5) {
        ctx.strokeStyle = '#3d7050'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 8); ctx.moveTo(x, y); ctx.lineTo(x, y - 10); ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 8); ctx.stroke();
      } else {
        ctx.fillStyle = '#4a5c4c';
        ctx.beginPath(); ctx.ellipse(x, y, 8 + hash(r + k) * 6, 5, 0, 0, TAU); ctx.fill();
      }
    }
  }
  // the winding road
  ctx.fillStyle = '#806a45';
  ctx.beginPath();
  const edge = (y) => Math.sin((jd + y) / 170) * 10;
  for (let y = -offY - 20; y <= H + 20; y += 20) ctx.lineTo(W / 2 - pw / 2 + edge(y), y);
  for (let y = H + 20; y >= -offY - 20; y -= 20) ctx.lineTo(W / 2 + pw / 2 + edge(y + 60), y);
  ctx.closePath(); ctx.fill();
  // lane marks
  ctx.fillStyle = 'rgba(80,60,30,0.25)';
  for (let r = r0; r <= r1; r++) {
    const y = GROUP_Y + r * rowH - jd;
    for (const lx of [W / 2 - lw / 2, W / 2 + lw / 2]) { ctx.beginPath(); ctx.ellipse(lx, y, 3, 6, 0, 0, TAU); ctx.fill(); }
  }
  // Bethlehem's stable comes into view at the end
  if (cfg.pathLen - jd < 900) drawStableFront(W / 2, GROUP_Y + cfg.pathLen + 330 - jd);

  const sy = (o) => GROUP_Y + (o.d - jd);
  const visible = obstacles.filter((o) => { const y = sy(o); return y > -offY - 60 && y < H + 80; });
  for (const o of visible) if (o.type === 'ditch') drawDitch(laneX(o.lane), sy(o), lw * 0.78);
  for (const o of visible) if (o.type === 'rock' && sy(o) < GROUP_Y + 10) drawRock(laneX(o.lane), sy(o), (o.seed % 1) * 6);
  // the travellers: two shepherds and two sheep
  const blink = hitCd > 0 && Math.sin(t * 30) > 0;
  if (!blink) {
    drawTraveller(SHEPHERDS[0], gx - 28, GROUP_Y - 8, 0.92, false);
    drawTraveller(SHEPHERDS[2], gx + 28, GROUP_Y - 4, 0.92, true);
    for (const [k, dx] of [[0, -30], [1, 30]]) {
      const s = sheep[k];
      if (s) drawSheep(gx + dx, GROUP_Y + 36 + Math.abs(Math.sin(walkT * 1.3 + k)) * -2, 0.56, s, SHEPHERDS[0].mood === 'shock' ? 'shock' : SHEPHERDS[0].mood, { walk: walkT * 2 + k, flip: 1, ly: 1 });
    }
  }
  for (const o of visible) if (o.type === 'rock' && sy(o) >= GROUP_Y + 10) drawRock(laneX(o.lane), sy(o), (o.seed % 1) * 6);

  // Only starlight and a lantern: darker nights show less of the road ahead
  ctx.fillStyle = 'rgba(8,12,40,0.22)';
  ctx.fillRect(-offX, -offY, viewW, viewH);
  drawDarkness(gx, GROUP_Y + 190, cfg.view * 0.85, cfg.view * 0.95, Math.min(cfg.dark + 0.12, 0.9));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(gx + 20, GROUP_Y - 20, 5, gx + 20, GROUP_Y - 20, 160);
  lg.addColorStop(0, 'rgba(255,200,110,0.25)'); lg.addColorStop(1, 'rgba(255,200,110,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(gx + 20, GROUP_Y - 20, 160, 0, TAU); ctx.fill();
  ctx.restore();
  for (const o of visible) if (o.type === 'star' && !o.hit) drawStarItem(laneX(o.lane), sy(o), o.seed);
  // twinkles of starlight drifting over the hillside
  for (let i = 0; i < 24; i++) {
    const x = -offX + hash(i + 1) * viewW, y = ((hash(i + 50) * (H + offY) - jd * 0.3) % (H + offY) + H + offY) % (H + offY) - offY;
    ctx.fillStyle = `rgba(255,250,220,${0.35 + 0.3 * Math.sin(t * 3 + i)})`;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill();
  }
}

//  Rendering: the stable and the village

function drawManger(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // legs
  ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-22, -34); ctx.moveTo(-22, 0); ctx.lineTo(-40, -34);
  ctx.moveTo(40, 0); ctx.lineTo(22, -34); ctx.moveTo(22, 0); ctx.lineTo(40, -34); ctx.stroke();
  // soft glow of the holy child
  const g = ctx.createRadialGradient(0, -52, 4, 0, -52, 110);
  g.addColorStop(0, 'rgba(255,240,170,0.75)'); g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -52, 110, 0, TAU); ctx.fill();
  // hay
  ctx.fillStyle = '#e8c35a';
  ctx.beginPath(); ctx.ellipse(0, -44, 50, 12, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#d4a53a'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = -5; i <= 5; i++) { ctx.moveTo(i * 9, -44); ctx.lineTo(i * 9 + (i % 2 ? 6 : -6), -58); }
  ctx.stroke();
  // the babe wrapped in swaddling clothes
  ctx.fillStyle = '#fbf6ea'; ctx.strokeStyle = '#d9cfb8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(6, -54, 24, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#e2d6bc'; ctx.lineWidth = 2;
  for (const bx of [0, 12, 22]) { ctx.beginPath(); ctx.moveTo(bx - 3, -64); ctx.quadraticCurveTo(bx + 2, -54, bx - 3, -44); ctx.stroke(); }
  // soft halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2.5; ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(-22, -58, 12, 0, TAU); ctx.stroke(); ctx.shadowBlur = 0;
  // little head, asleep and content
  ctx.fillStyle = '#e8b890';
  ctx.beginPath(); ctx.arc(-20, -56, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.arc(-21, -59, 8, Math.PI * 1.05, Math.PI * 1.9); ctx.fill();
  ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(-23.5, -56, 1.8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.moveTo(-15.2, -55.4); ctx.arc(-17, -56, 1.8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,0.45)';
  ctx.beginPath(); ctx.arc(-26, -53, 1.8, 0, TAU); ctx.arc(-14, -53, 1.8, 0, TAU); ctx.fill();
  // the trough
  ctx.fillStyle = '#8a5a30'; ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-52, -48); ctx.lineTo(52, -48); ctx.lineTo(40, -22); ctx.lineTo(-40, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,35,15,0.5)';
  ctx.beginPath(); ctx.moveTo(-47, -38); ctx.lineTo(47, -38); ctx.stroke();
  ctx.restore();
}

function drawMary(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // a low stool
  ctx.fillStyle = '#6b4a2b'; roundRect(-22, -26, 44, 26, 4); ctx.fill();
  // white dress and blue mantle, seated
  ctx.fillStyle = '#f3efe6';
  ctx.beginPath(); ctx.moveTo(-26, -2); ctx.quadraticCurveTo(-26, -24, -10, -30); ctx.lineTo(10, -30); ctx.quadraticCurveTo(14, -12, 8, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3f6fc6'; ctx.strokeStyle = '#2c4f94'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-8, -64); ctx.quadraticCurveTo(-22, -58, -24, -36); ctx.quadraticCurveTo(-34, -24, -30, 0);
  ctx.lineTo(-14, 0); ctx.quadraticCurveTo(-14, -20, -4, -28);
  ctx.quadraticCurveTo(16, -30, 22, 0); ctx.lineTo(24, 0); ctx.quadraticCurveTo(26, -40, 8, -64); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8b890';
  ctx.beginPath(); ctx.arc(-12, -36, 4, 0, TAU); ctx.arc(-6, -35, 4, 0, TAU); ctx.fill();
  const hy = -78;
  ctx.fillStyle = '#e8b890';
  ctx.beginPath(); ctx.arc(0, hy, 15, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.arc(0, hy - 2, 15.5, Math.PI * 0.95, Math.PI * 2.05); ctx.quadraticCurveTo(0, hy - 9, -15.5, hy); ctx.fill();
  ctx.fillStyle = '#3f6fc6';
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 14); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 14);
  ctx.closePath(); ctx.fill();
  drawFace({ hair: '#5b3a1f', blink: 0, i: 0 }, 'watch', hy, -0.8, 0.4);
  ctx.fillStyle = 'rgba(255,120,120,0.35)';
  ctx.beginPath(); ctx.arc(-10, hy + 4, 3, 0, TAU); ctx.arc(10, hy + 4, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStableInterior() {
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#3e2818'); g.addColorStop(0.6, '#7a5433'); g.addColorStop(1, '#5e4028');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // planks
  ctx.strokeStyle = 'rgba(40,25,10,0.3)'; ctx.lineWidth = 2;
  for (let x = -offX + 20; x < W + offX; x += 46) { ctx.beginPath(); ctx.moveTo(x, -offY); ctx.lineTo(x, 700); ctx.stroke(); }
  // window with the night sky and stars
  const wx = W / 2 - Math.min(200, W * 0.3);
  ctx.fillStyle = '#131c4c'; roundRect(wx - 55, 250, 110, 120, [50, 50, 4, 4]); ctx.fill();
  ctx.save(); roundRect(wx - 55, 250, 110, 120, [50, 50, 4, 4]); ctx.clip();
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = `rgba(255,250,220,${0.5 + 0.5 * Math.sin(t * 2 + i)})`;
    ctx.beginPath(); ctx.arc(wx - 50 + hash(i) * 100, 255 + hash(i + 9) * 110, 1.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#4a3220'; ctx.lineWidth = 6;
  roundRect(wx - 55, 250, 110, 120, [50, 50, 4, 4]); ctx.stroke();
  // roof beams
  ctx.fillStyle = '#3a2414';
  ctx.fillRect(-offX, 160, viewW, 22);
  // straw floor
  ctx.fillStyle = '#b8914e'; ctx.fillRect(-offX, 700, viewW, H - 700 + 10);
  ctx.strokeStyle = '#d4b060'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 60; i++) { const x = -offX + hash(i) * viewW, y = 712 + hash(i + 3) * 180; ctx.moveTo(x, y); ctx.lineTo(x + 12, y - 4); }
  ctx.stroke();
  // hanging lamp glow
  const lg = ctx.createRadialGradient(W / 2, 560, 10, W / 2, 560, 420);
  lg.addColorStop(0, 'rgba(255,215,130,0.35)'); lg.addColorStop(1, 'rgba(255,215,130,0)');
  ctx.fillStyle = lg; ctx.fillRect(-offX, -offY, viewW, viewH);

  const k = clamp(W / 600, 0.8, 1.35);
  lookTarget = { x: W / 2 - 20 * k, y: 780 - 60 * k };
  ctx.save();
  ctx.translate(W / 2, 790);
  ctx.scale(k, k);
  if (sheep[1]) drawSheep(-255, 20, 0.62, sheep[1], 'joy', { flip: -1, lx: 1 });
  drawKneeling(SHEPHERDS[0], -190, 10, 1.35, 1);
  drawKneeling(SHEPHERDS[2], -100, 30, 1.35, 1);
  drawManger(0, 20, 1.45);
  drawMary(104, 20, 1.45);
  drawShepherd({ d: JOSEPH, x: 184, y: 20, s: 1.35 });
  drawKneeling(SHEPHERDS[1], 262, 34, 1.2, -1);
  if (sheep[0]) drawSheep(-40, 80, 0.62, sheep[0], 'joy', { flip: -1, lx: 0.5 });
  ctx.restore();
}

function drawVillage() {
  drawNightSky();
  drawStars(1, -offY + 8, 330);
  drawMoon(1);
  // houses along the street
  const x0 = -offX - 10, x1 = W + offX + 10;
  for (let x = x0, i = 0; x < x1; x += 110, i++) {
    const hh = 150 + hash(i) * 70;
    ctx.fillStyle = i % 2 ? '#c9a878' : '#b8966a';
    ctx.fillRect(x, 640 - hh, 104, hh);
    ctx.fillStyle = '#9a7a52'; ctx.fillRect(x - 4, 640 - hh - 8, 112, 10);
    ctx.fillStyle = `rgba(255,205,110,${0.85 + 0.15 * Math.sin(t * 2 + i)})`;
    roundRect(x + 20, 640 - hh + 30, 22, 26, [10, 10, 2, 2]); ctx.fill();
    ctx.fillStyle = '#6b4a2b'; roundRect(x + 58, 640 - 70, 30, 70, [14, 14, 0, 0]); ctx.fill();
  }
  // dim the houses for night
  ctx.fillStyle = 'rgba(20,24,70,0.35)'; ctx.fillRect(-offX, 380, viewW, 260);
  ctx.fillStyle = '#8a7658'; ctx.fillRect(-offX, 640, viewW, H - 640 + 10);
  ctx.fillStyle = '#7a684c'; ctx.fillRect(-offX, 640, viewW, 8);
  // a warm glow of lamps held by the townsfolk
  const lg = ctx.createRadialGradient(W / 2, 720, 20, W / 2, 720, 420);
  lg.addColorStop(0, 'rgba(255,215,130,0.3)'); lg.addColorStop(1, 'rgba(255,215,130,0)');
  ctx.fillStyle = lg; ctx.fillRect(-offX, -offY, viewW, viewH);

  lookTarget = { x: W / 2, y: 690 };
  const folk = TOWNSFOLK.slice(0, W < 640 ? 4 : W < 900 ? 6 : 7);
  const slots = [];
  folk.forEach((d, i) => {
    const side = i % 2 ? 1 : -1, rank = Math.floor(i / 2);
    const x = W / 2 + side * (130 + rank * Math.min(95, (W / 2 - 170) / Math.max(1, Math.ceil(folk.length / 2) - 1)));
    slots.push({ d, x, y: 760 + (rank % 2) * 26, s: 1.15 });
  });
  slots.sort((a, b) => a.y - b.y);
  for (const s of slots) drawDisciple(s);
  // the shepherds tell everyone
  drawShepherd({ d: SHEPHERDS[0], x: W / 2 - 50, y: 790, s: 1.25 });
  drawShepherd({ d: SHEPHERDS[1], x: W / 2 + 52, y: 796, s: 1.25 });
  drawDisciple({ d: SHEPHERDS[2], x: W / 2, y: 820, s: 1.2 });
  if (sheep[0]) drawSheep(W / 2 - 110, 870, 0.6, sheep[0], 'joy', { flip: -1, lx: 0.4 });
  if (sheep[1]) drawSheep(W / 2 + 110, 872, 0.6, sheep[1], 'joy', { flip: 1, lx: -0.4 });
  // a joyful word (not scripture)
  const said = stage === 1 ? 'Come and hear what we saw tonight!' : 'It was all just as the angel told us!';
  drawSpeech(said, W / 2, 790 - 1.25 * 95);
}

function drawSpeech(text, x, y) {
  ctx.save();
  ctx.font = '700 18px Fredoka, sans-serif';
  const lines = wrapLines(text, Math.min(W - 60, 330));
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 28, bh = lines.length * 22 + 18;
  const bx = clamp(x - bw / 2, 10, W - bw - 10), by = y - bh - 16;
  ctx.fillStyle = 'rgba(255,253,240,0.96)'; ctx.strokeStyle = 'rgba(224,165,38,0.8)'; ctx.lineWidth = 2.5;
  roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 10, by + bh - 1); ctx.lineTo(x, by + bh + 14); ctx.lineTo(x + 10, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#4a3a1c'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 24 + i * 22));
  ctx.restore();
}

// ============================================================
//  HUD, banner and messages
// ============================================================
// A verse shown on a parchment banner at the top of the playfield
function drawBanner() {
  if (!banner || banner.t <= 0) return;
  const v = Bible.verse(VERSES[banner.key]);
  const a = clamp(banner.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 18px Fredoka, sans-serif';
  const bw = Math.min(W - 28, 640);
  const lines = wrapLines(`“${v.text}”`, bw - 28);
  const lh = 23;
  const bh = lines.length * lh + 36;
  const bx = W / 2 - bw / 2, by = 110;
  ctx.fillStyle = 'rgba(255,250,232,0.97)';
  ctx.strokeStyle = 'rgba(224,165,38,0.7)'; ctx.lineWidth = 2.5;
  roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a4520'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, by + 24 + i * lh));
  ctx.font = '600 12px Fredoka, sans-serif'; ctx.fillStyle = '#8a6a2a';
  ctx.fillText(v.cite, W / 2, by + bh - 9);
  ctx.restore();
}

function drawLampIcon(x, y, lit) {
  if (lit) {
    const g = ctx.createRadialGradient(x, y, 2, x, y, 16);
    g.addColorStop(0, 'rgba(255,220,120,0.7)'); g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
  }
  // a little clay oil lamp with a flame
  ctx.fillStyle = lit ? '#c8864a' : '#6a6070';
  ctx.beginPath(); ctx.ellipse(x, y + 5, 10, 5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 6, y + 3); ctx.lineTo(x + 14, y + 1); ctx.lineTo(x + 8, y + 7); ctx.fill();
  if (lit) {
    const fl = Math.sin(t * 12 + x) * 1;
    ctx.fillStyle = '#ffb13a';
    ctx.beginPath(); ctx.moveTo(x + 10, y + 1); ctx.quadraticCurveTo(x + 8 + fl, y - 6, x + 13 + fl, y - 11); ctx.quadraticCurveTo(x + 16, y - 4, x + 14, y + 1); ctx.fill();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,20,0.9)'; ctx.shadowBlur = 4;

  // Left: level + progress through the night
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff3cf';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Shepherds and the Angels' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    const labels = { watch: 'WATCH', angel: 'GLORY', choir: 'CHOIR', journey: 'ROAD', finale: 'ROAD' };
    const prog = {
      watch: clamp(watchT / cfg.watchTime, 0, 1),
      angel: 1,
      choir: melody.length ? clamp((noteSpawned - notes.filter((n) => n.state === 'live').length) / melody.length, 0, 1) : 0,
      journey: clamp(jd / cfg.pathLen, 0, 1),
      finale: 1,
    }[phase];
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(labels[phase], 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,243,207,0.25)';
    roundRect(62, 38, 126, 13, 6.5); ctx.fill();
    const gg = ctx.createLinearGradient(62, 0, 188, 0);
    gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
    ctx.fillStyle = gg;
    if (prog > 0) { roundRect(62, 38, 126 * prog, 13, 6.5); ctx.fill(); }
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score + lamps
  if (state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff3cf';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SCORE', rx, 18);
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`${totalScore + (state === 'win' ? 0 : pts.watch + pts.choir + pts.path)}`, rx, 38);
    ctx.shadowBlur = 0;
    if (phase === 'watch' || phase === 'journey') {
      for (let i = 0; i < LAMPS; i++) drawLampIcon(rx - 12 - i * 28, 56, i < lamps);
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapLines(message.text, W - 30);
  const y0 = phase === 'journey' ? H * 0.5 : H * 0.44;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,20,60,0.85)'; ctx.lineJoin = 'round';
  lines.forEach((l, i) => { ctx.strokeText(l, W / 2, y0 + i * 28); });
  ctx.fillStyle = '#fff3a0';
  lines.forEach((l, i) => { ctx.fillText(l, W / 2, y0 + i * 28); });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (phase === 'journey') drawJourney();
  else if (phase === 'finale') { if (stage === 0) drawStableInterior(); else drawVillage(); }
  else drawNightField();

  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBanner();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,252,225,${Math.min(1, flashT * 1.2)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fadeT > 0) {
    ctx.fillStyle = `rgba(10,12,40,${Math.min(1, fadeT * 1.25)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (state === 'play') {
    phaseT += dt;
    handleTaps();
  }
  // where everyone looks
  if (phase === 'watch') {
    const far = sheep.filter((s) => s.state === 'wander').sort((a, b) => b.r - a.r)[0];
    const w = wolves.find((o) => o.stage !== 'flee');
    lookTarget = w ? { x: w.x, y: w.y - 20 } : far ? { x: far.x, y: far.y - 20 } : { x: W / 2, y: FY - 20 };
  } else if (phase === 'angel' || phase === 'choir') lookTarget = { x: W / 2, y: 260 };
  else if (phase === 'journey') lookTarget = null;
  updatePeople(SHEPHERDS, shepherdMood, dt);
  updatePeople([JOSEPH], () => 'joy', dt);
  updatePeople(TOWNSFOLK, townMood, dt);
  if (phase === 'watch' || phase === 'angel' || phase === 'choir') updateSheep(dt);
  else for (const s of sheep) { s.mood = state === 'fail' ? 'dismay' : SHEPHERDS[0].mood === 'shock' ? 'shock' : 'joy'; s.blinkT -= dt; if (s.blinkT <= 0) { s.blink = 0.13; s.blinkT = rand(1.5, 5); } if (s.blink > 0) s.blink -= dt; }

  if (state === 'play') {
    if (phase === 'watch') updateWatch(dt);
    else if (phase === 'angel') {
      updateWolves(dt);
      gloryF = clamp(phaseT / 1.2, 0, 1);
      lineT += dt;
      if (phaseT > 1.2 && lineT > angelLineDur()) nextAngelLine();
      if (phaseT < 1.2) lineT = 0;
    } else if (phase === 'choir') { updateWolves(dt); updateChoir(dt); }
    else if (phase === 'journey') updateJourney(dt);
    else if (phase === 'finale') {
      stageT += dt;
      if (stageT > STAGE_DUR + (stage === 0 ? 0.6 : 0)) nextStage();
    }
    if (phase === 'watch' && Math.random() < dt * 6) spawn(W / 2 + rand(-12, 12), FY - 30, rand(-10, 10), rand(-70, -40), rand(0.6, 1.2), Math.random() < 0.5 ? '#ffb13a' : '#ffe27a', rand(1.5, 2.5));
  } else if (state === 'title') {
    updateSheepIdle(dt);
  } else if (state === 'win' && Math.random() < dt * 12) {
    spawn(W / 2 + rand(-120, 120), rand(500, 760), 0, -30, 1, '#fff6d0', 3);
  }
  if (banner && banner.t < 900) banner.t -= dt;
  shockT = Math.max(0, shockT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  fadeT = Math.max(0, fadeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

// On the title screen one sheep ambles out and back, just for show
function updateSheepIdle(dt) {
  const s = sheep[1];
  if (!s) return;
  if (s.state === 'home' && Math.random() < dt * 0.15) { s.state = 'wander'; s.wa = s.ha; s.speed = 0.8; }
  if (s.state === 'wander' && s.r > 0.85) { s.state = 'return'; s.speed = 0.5; }
  if (Math.random() < dt * 2) spawn(W / 2 + rand(-12, 12), FY - 30, rand(-10, 10), rand(-70, -40), rand(0.6, 1.2), '#ffb13a', rand(1.5, 2.5));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
