<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1236">
<title>The Shepherds and the Angels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b1236;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(10, 14, 40, 0.35);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.1rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Shepherds and the Angels</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'joyToTheWorld', instrument: 'pipe', accent: 'harp', ambience: 'night', percussion: false };

// Scripture shown in this game (Luke 2:8-20), in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  watch:     { ref: 'Luke 2:8',  KJV: '...shepherds abiding in the field, keeping watch over their flock by night.', NKJV: '...shepherds living out in the fields, keeping watch over their flock by night.', NIV: '...shepherds living out in the fields nearby, keeping watch over their flocks at night.', NLT: '...shepherds staying in the fields nearby, guarding their flocks of sheep.' },
  fearNot:   { ref: 'Luke 2:10', KJV: 'Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people.', NKJV: 'Do not be afraid, for behold, I bring you good tidings of great joy which will be to all people.', NIV: 'Do not be afraid. I bring you good news that will cause great joy for all the people.', NLT: 'Don’t be afraid!... I bring you good news that will bring great joy to all people.' },
  born:      { ref: 'Luke 2:11', KJV: 'For unto you is born this day in the city of David a Saviour, which is Christ the Lord.', NKJV: 'For there is born to you this day in the city of David a Savior, who is Christ the Lord.', NIV: 'Today in the town of David a Savior has been born to you; he is the Messiah, the Lord.', NLT: 'The Savior—yes, the Messiah, the Lord—has been born today in Bethlehem, the city of David!' },
  sign:      { ref: 'Luke 2:12', KJV: 'Ye shall find the babe wrapped in swaddling clothes, lying in a manger.', NKJV: 'You will find a Babe wrapped in swaddling cloths, lying in a manger.', NIV: 'You will find a baby wrapped in cloths and lying in a manger.', NLT: 'You will find a baby wrapped snugly in strips of cloth, lying in a manger.' },
  glory:     { ref: 'Luke 2:14', KJV: 'Glory to God in the highest, and on earth peace, good will toward men.', NKJV: 'Glory to God in the highest, And on earth peace, goodwill toward men!', NIV: 'Glory to God in the highest heaven, and on earth peace to those on whom his favor rests.', NLT: 'Glory to God in highest heaven, and peace on earth to those with whom God is pleased.' },
  letUsGo:   { ref: 'Luke 2:15', KJV: 'Let us now go even unto Bethlehem, and see this thing which is come to pass.', NKJV: 'Let us now go to Bethlehem and see this thing that has come to pass.', NIV: 'Let’s go to Bethlehem and see this thing that has happened.', NLT: 'Let’s go to Bethlehem! Let’s see this thing that has happened.' },
  found:     { ref: 'Luke 2:16', KJV: 'And they came with haste, and found Mary, and Joseph, and the babe lying in a manger.', NKJV: 'And they came with haste and found Mary and Joseph, and the Babe lying in a manger.', NIV: 'So they hurried off and found Mary and Joseph, and the baby, who was lying in the manger.', NLT: 'They hurried to the village and found Mary and Joseph. And there was the baby, lying in the manger.' },
  madeKnown: { ref: 'Luke 2:17', KJV: 'And when they had seen it, they made known abroad the saying which was told them concerning this child.', NKJV: 'Now when they had seen Him, they made widely known the saying which was told them concerning this Child.', NIV: 'When they had seen him, they spread the word concerning what had been told them about this child.', NLT: 'After seeing him, the shepherds told everyone what had happened and what the angel had said to them about this child.' },
  returned:  { ref: 'Luke 2:20', KJV: 'And the shepherds returned, glorifying and praising God for all the things that they had heard and seen.', NKJV: 'Then the shepherds returned, glorifying and praising God for all the things that they had heard and seen.', NIV: 'The shepherds returned, glorifying and praising God for all the things they had heard and seen.', NLT: 'The shepherds went back to their flocks, glorifying and praising God for all they had heard and seen.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Splits text into lines that fit maxW in the current font
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning
// ============================================================
const FY = 660;           // the campfire's y
const HORIZON = 400;      // where the field meets the far hills
const RY_UP = 230;        // how far up the hill the firelight reaches
const RY_DOWN = 190;      // ... and down toward us
const STAGE_DUR = 4.6;    // seconds per finale scene
const GO_DUR = 5;         // the gentle journey to Bethlehem between the choir and the stable

const LEVEL_NAMES = [
  'A Quiet Night',
  'Hills of Bethlehem',
  'Starlit Fields',
  'The Darkest Watch',
  'Frost on the Hills',
  'The Longest Night',
];

function makeConfig(n) {
  const k = n - 1;
  return {
    name: LEVEL_NAMES[n - 1] || `Night Watch ${n}`,
    sheep: Math.min(6 + k * 2, 12),              // grown sheep in the flock
    lambs: Math.min(2 + k, 4),                   // little lambs (they wander faster)
    lostAllowed: n === 1 ? 2 : 1,                // lose more than this and the night is over
    watchTime: Math.min(75 + k * 12, 120),       // seconds of night watch
    wanderRate: Math.min(0.04 + k * 0.008, 0.08),// how fast strays head for the dark
    lambSpeed: 1.6,
    maxWander: Math.min(2 + k, 5),
    wanderGap: Math.max(4.5 - k * 0.7, 1.8),
    grace: Math.max(6 - k * 1.2, 3),             // seconds a stray can stand in the dark before it's lost
    wolves: Math.min(1 + Math.floor(k * 0.7), 4),
    foxes: n >= 3 ? Math.min(n - 2, 3) : 0,
    wolfWarn: Math.max(3 - k * 0.3, 1.5),        // eyes in the bushes before it creeps
    wolfSpeed: 32 + k * 8,
    scatter: n === 1 ? 1 : 2,                    // sheep a wolf chases off if it reaches the flock
    naps: Math.min(1 + k, 4),
    thorns: Math.min(1 + k, 4),
    thornTaps: Math.min(3 + k, 6),               // taps to free a lamb from the thorns
    stuckLimit: Math.max(20 - k * 3, 10),
    owls: Math.min(1 + k, 4),
    burn: 0.008 + k * 0.003,                     // how fast the fire burns down
    light: Math.max(1 - k * 0.05, 0.85),         // size of the firelight
    dark: Math.min(0.55 + k * 0.08, 0.82),       // darkness beyond it
    notes: Math.min(8 + k * 3, 20),              // choir notes
    noteGap: Math.max(1.15 - k * 0.1, 0.62),
    ring: Math.max(1.6 - k * 0.15, 0.95),        // time for a ring to close
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'watch';      // watch | angel | choir | go | finale
let phaseT = 0;
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('shepherdsBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let pts = { watch: 0, choir: 0 };
let particles = [];
let message = { text: '', t: 0 };
let banner = null;        // { key, t } a verse shown at the top
let shockT = 0, joyT = 0, flashT = 0, shakeT = 0, fadeT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let lookTarget = null;    // where the people are looking

// Part 1: the night watch
let sheep = [];
let wolves = [];
let events = [];
let owl = null;           // an owl that hoots from a lone tree
let watchT = 0, wanderT = 0, fireLevel = 1, wakeT = 0, lostCount = 0;
let sleepy = { asleep: false, napT: 0 };
let stats = { called: 0, lambs: 0, wolves: 0, woken: 0, safe: 0 };
let hints = {};
// Part 2: the angel and the heavenly host
let lineIdx = 0, lineT = 0, gloryF = 0;
let notes = [], noteSpawned = 0, noteSpawnT = 0, melody = [], choirDoneT = -1;
let noteStats = { perfect: 0, good: 0, miss: 0 };
// Finale
let stage = 0, stageT = 0;

// ============================================================
//  People (drawn like the disciples in Jesus Rises)
// ============================================================
function makePerson(look, i) {
  return {
    ...look, i,
    mood: 'watch', switchT: 0, delay: rand(0.05, 0.4),
    blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU),
  };
}

const SHEPHERDS = [
  { name: 'Reuben',   robe: '#7a5a3a', hair: '#8a8a8a', beard: true,  skin: '#d9a066', scarf: '#e8dcc0' },
  { name: 'Asher',    robe: '#3f6fb5', hair: '#3a2716', beard: true,  skin: '#c58a55' },
  { name: 'Benjamin', robe: '#6b8e3a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
].map(makePerson);
const JOSEPH = makePerson({ robe: '#8a5a2b', hair: '#4a2f1a', beard: true, skin: '#d39a66', scarf: '#c9b27a' }, 5);
const TOWNSFOLK = [
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678', scarf: '#f0e0c8' },
  { robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { robe: '#5a6475', hair: '#2a1a0e', beard: false, skin: '#c88e5a', scarf: '#d8c7a0' },
  { robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
].map((d, i) => makePerson(d, i + 6));

function updatePeople(list, moodFn, dt) {
  for (const d of list) {
    const want = moodFn(d);
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

function shepherdMood(d) {
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (phase === 'watch') {
    if (d.name === 'Benjamin' && sleepy.asleep) return 'sleep';
    if (d.name === 'Benjamin' && wakeT > 0) return 'shock';
    if (shockT > 0) return 'shock';
    if (joyT > 0) return 'joy';
    if (wolves.some((w) => w.stage === 'creep') || sheep.some((s) => s.state === 'stuck' || (s.state === 'wander' && s.r >= edge() * 0.85))) return 'worried';
    return 'watch';
  }
  if (phase === 'angel') return phaseT < 2.2 ? 'shock' : 'wow';
  if (phase === 'choir') return joyT > 0 ? 'joy' : 'wow';
  return 'joy';
}

function townMood(d) {
  if (stage <= 1) return d.i % 3 === 0 ? 'shock' : 'wow';
  return 'joy';
}

// A standing person at slot { d, x, y, s }
function drawDisciple(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);
  if (mood === 'sleep') ctx.rotate(0.1 + Math.sin(t * 1.5) * 0.03);   // dozing on his staff

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward whatever is happening
  let lx = 0, ly = 0.3;
  if (lookTarget) {
    const wx = x, wy = slot.y - 52 * s;
    const dx = lookTarget.x - wx, dy = lookTarget.y - wy;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  // Arms raised for joy / pointing in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || mood === 'sleep' || (mood === 'wow' && d.i % 3 !== 0)) {
    if (mood === 'sleep') { arm(-11, -32, 4, -26); arm(11, -32, 15, -30); }
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  const hy = -53;
  drawPersonHead(d, hy, mood, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

// Head, hair or head cloth, beard and face
function drawPersonHead(d, hy, mood, lx, ly) {
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);
}

// A shepherd: a person with a crook
function drawShepherd(slot) {
  const { x, y, s } = slot;
  const lean = slot.d.mood === 'sleep' ? 0.1 : 0;
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(lean);
  ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(17, 2); ctx.lineTo(17, -86);
  ctx.arc(25, -86, 8, Math.PI, TAU); ctx.lineTo(33, -80);
  ctx.stroke();
  ctx.restore();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x, y + 1, 22 * s, 6 * s, 0, 0, TAU); ctx.fill();
  drawDisciple(slot);
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'sleep':
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      mouthFill(() => ctx.ellipse(0, mouthY, 2.2, 2.4 + Math.sin(t * 3) * 0.8, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// A shepherd kneeling in worship, facing right (facing = 1) or left (-1)
function drawKneeling(d, x, y, s, facing) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * facing, s);
  const sleeve = shade(d.robe, -25);
  const bow = Math.sin(t * 2 + d.i) * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(2, 1, 30, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-24, 0); ctx.quadraticCurveTo(-24, -24, -12, -34);
  ctx.quadraticCurveTo(0, -38, 11, -34); ctx.quadraticCurveTo(18, -20, 20, -10);
  ctx.quadraticCurveTo(34, -12, 34, 0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-22, -14); ctx.quadraticCurveTo(-4, -11, 16, -14); ctx.stroke();
  // hands together in prayer
  ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, -30); ctx.lineTo(17, -40 + bow); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -30); ctx.lineTo(19, -42 + bow); ctx.stroke();
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.ellipse(20, -45 + bow, 3.5, 6, 0.3, 0, TAU); ctx.fill();
  ctx.translate(2, bow);
  drawPersonHead(d, -52, d.mood, 1, 0.4);
  ctx.restore();
}

// ============================================================
//  Sheep (from The Lost Sheep)
// ============================================================
function drawSheepHead(d, mood, lx, ly) {
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#6b5548';
    ctx.beginPath(); ctx.ellipse(s * 18, -2, 9, 4.8, s * 0.35, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8a8a0';
    ctx.beginPath(); ctx.ellipse(s * 18.5, -1.5, 5.5, 2.4, s * 0.35, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#ecd0b2'; ctx.strokeStyle = '#c9a07c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 1, 15, 16, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fbfaf4';
  ctx.beginPath();
  for (const [x, y, r] of [[-8, -13, 6], [0, -15, 7], [8, -13, 6]]) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = '#c98f7a';
  ctx.beginPath(); ctx.ellipse(0, 6, 3, 2, 0, 0, TAU); ctx.fill();
  drawFace(d, mood, 0, lx, ly);
}

function woolPuffs(cx, cy, rx, ry, r, n) {
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const a = (k / n) * TAU;
    const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
    ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU);
  }
  ctx.moveTo(cx + rx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
}

function drawSheep(x, y, s, d, mood, opts = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 30 * s, 8 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -(opts.jump || 0));
  ctx.scale(s, s);
  for (const [lx, ph] of [[-20, 0], [-8, Math.PI], [8, 0], [20, Math.PI]]) {
    const lift = opts.walk ? Math.max(0, Math.sin(opts.walk + ph)) * 5 : 0;
    ctx.fillStyle = '#4a3f3a';
    roundRect(lx - 3.5, -18 - lift, 7, 18, 3); ctx.fill();
  }
  ctx.fillStyle = '#d9d5c8';
  woolPuffs(0, -30, 26, 13, 12, 10); ctx.fill();
  ctx.fillStyle = '#fbfaf4';
  woolPuffs(0, -33, 25, 12, 11.5, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-30 * (opts.flip || 1), -38, 7, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate((opts.flip || 1) * 4, -30 + (opts.graze || 0));
  drawSheepHead(d, mood, opts.lx || 0, opts.ly || 0);
  ctx.restore();
  ctx.restore();
}

// ============================================================
//  Part 1: the night watch
// ============================================================
function RX() { return Math.min(W / 2 - 60, 560); }
// Thorn bushes near the edge of the firelight, where lambs get tangled
const THORNS = [{ a: -2.35, r: 0.84 }, { a: -0.8, r: 0.84 }];
const LOST_R = 1.12;      // how far a stray walks into the dark before it stops and waits

function safeCount() { return sheep.filter((s) => s.state !== 'lost').length; }

// The firelight's reach (1 = full): it shrinks as the fire burns low
function edge() { return clamp(fireLevel * cfg.light, 0.55, 1.05); }

function newSheep(i, kind, a, r, mom) {
  return {
    i, kind, mom, ha: a, hr: r, a, r, wa: a, state: 'home', speed: 1, darkT: 0, warned: false, counted: false,
    thorn: -1, taps: 0, stuckT: 0, wobT: 0, lostT: 0, nuzzleT: 0, scareT: 0, hop: 0,
    x: 0, y: 0, flip: 1, walk: 0, mood: 'watch', hair: kind === 'lamb' ? '#b8a898' : '#9a8878',
    blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU), bleatCd: 0, doze: 0, dozeT: rand(5, 15),
  };
}

// Grown sheep in rows around the fire; each lamb stays beside its mother
function makeFlock(nSheep, nLambs) {
  const homes = [];
  const lower = nSheep >= 8 ? 2 : 0;
  const upper = nSheep - lower;
  for (let i = 0; i < upper; i++) {
    const f = upper === 1 ? 0.5 : i / (upper - 1);
    homes.push({ a: -Math.PI * 0.88 + f * Math.PI * 0.76, r: i % 2 ? 0.6 : 0.4 });
  }
  if (lower) { homes.push({ a: 0.38, r: 0.74 }); homes.push({ a: Math.PI - 0.38, r: 0.74 }); }
  const list = homes.map((h, i) => newSheep(i, 'sheep', h.a, h.r, -1));
  const moms = shuffle(list.slice(0, upper).map((m) => m.i)).slice(0, nLambs);
  moms.forEach((m) => {
    const mom = list[m];
    const side = Math.cos(mom.ha) < 0 ? 1 : -1;       // tucked in on the side toward the middle
    list.push(newSheep(list.length, 'lamb', mom.ha + side * 0.16, mom.hr - 0.06, m));
  });
  return list;
}

function sheepXY(s) {
  const up = Math.sin(s.a) < 0;
  return [W / 2 + Math.cos(s.a) * s.r * RX(), FY + Math.sin(s.a) * s.r * (up ? RY_UP : RY_DOWN)];
}

function bushes() {
  const R = RX() + 12;
  return [
    { x: W / 2 - R, y: FY - 150 }, { x: W / 2 - R, y: FY - 30 },
    { x: W / 2 + R, y: FY - 150 }, { x: W / 2 + R, y: FY - 30 },
  ];
}

// The lone trees on the hill, where the owl perches
function owlTree(side) { return { x: W / 2 + side * RX() * 0.92, y: HORIZON + 30 }; }

function shepherdSlots() {
  return [
    { d: SHEPHERDS[0], x: W / 2 - 62, y: FY + 50, s: 1.05 },
    { d: SHEPHERDS[1], x: W / 2 + 62, y: FY + 50, s: 1.05 },
    { d: SHEPHERDS[2], x: W / 2 + 6, y: FY + 170, s: 1.1 },   // Benjamin, who gets sleepy
  ];
}

function setupField() {
  sheep = makeFlock(cfg.sheep, cfg.lambs);
  for (const s of sheep) [s.x, s.y] = sheepXY(s);
  wolves = []; owl = null;
  watchT = 0; wanderT = 3; fireLevel = 1; wakeT = 0; lostCount = 0;
  sleepy = { asleep: false, napT: 0 };
  stats = { called: 0, lambs: 0, wolves: 0, woken: 0, safe: 0 };
  hints = {};
  // Spread the night's troubles through the watch, a few seconds apart
  events = [];
  const spread = (n, type, lo, hi) => {
    for (let i = 0; i < n; i++) events.push({ t: cfg.watchTime * lerp(lo, hi, n === 1 ? 0.5 : i / (n - 1)) + rand(-3, 3), type });
  };
  spread(cfg.naps, 'nap', 0.15, 0.7);
  spread(cfg.thorns, 'thorn', 0.22, 0.75);
  spread(cfg.wolves, 'wolf', 0.3, 0.85);
  spread(cfg.owls, 'owl', 0.38, 0.9);
  spread(cfg.foxes, 'fox', 0.45, 0.8);
  events.sort((a, b) => a.t - b.t);
  for (let i = 1; i < events.length; i++) events[i].t = Math.max(events[i].t, events[i - 1].t + 4);
}

function updateSheep(dt) {
  const playing = state === 'play' && phase === 'watch';
  const E = edge();
  for (const s of sheep) {
    if (s.state === 'lost') {          // fading away into the night
      s.lostT += dt; s.r += dt * 0.12;
      [s.x, s.y] = sheepXY(s);
      continue;
    }
    s.blinkT -= dt;
    if (s.blinkT <= 0) { s.blink = 0.13; s.blinkT = rand(1.5, 5); }
    if (s.blink > 0) s.blink -= dt;
    s.bleatCd = Math.max(0, s.bleatCd - dt);
    s.scareT = Math.max(0, s.scareT - dt);
    s.nuzzleT = Math.max(0, s.nuzzleT - dt);
    s.wobT = Math.max(0, s.wobT - dt);
    const [ox] = sheepXY(s);
    const lambF = s.kind === 'lamb' ? cfg.lambSpeed : 1;
    s.hop = 0;
    if (s.state === 'home') {
      s.a += (s.ha - s.a) * Math.min(1, dt * 2);
      s.r += (s.hr - s.r) * Math.min(1, dt * 2);
      // sleepy sheep doze off now and then
      s.dozeT -= dt;
      if (s.dozeT <= 0) {
        s.doze = s.doze ? 0 : 1;
        s.dozeT = s.doze ? rand(3, 7) : rand(6, 16);
      }
    } else if (s.state === 'wander') {
      const rate = cfg.wanderRate * s.speed * lambF * (sleepy.asleep ? 1.3 : 1);
      if (s.thorn >= 0) {
        // a lamb scampering off toward the thorns
        const th = THORNS[s.thorn];
        s.a += (th.a - s.a) * Math.min(1, dt * 1.6);
        s.r = Math.min(th.r, s.r + rate * dt);
        if (s.r >= th.r - 0.005 && Math.abs(s.a - th.a) < 0.08) {
          s.state = 'stuck'; s.taps = 0; s.stuckT = 0;
          sfx.bleat(1.5);
          hint('thorn', 'A lamb is stuck in the thorns! Tap it a few times to free it.', true);
        }
      } else {
        s.r = Math.min(LOST_R, s.r + rate * dt);
        s.a += (s.wa - s.a) * Math.min(1, dt * 0.4);
        if (playing) {
          if (s.r >= E) {
            // out of the firelight: a little while to be called home
            s.darkT += dt;
            if (!s.warned) { s.warned = true; sfx.bleat(1.25); hint('dark', 'Quick! Tap the sheep with the "!" before it is lost.'); }
            if (s.darkT >= cfg.grace) loseSheep(s);
          } else s.darkT = Math.max(0, s.darkT - dt * 2);
        }
      }
      s.walk += dt * 7 * lambF;
    } else if (s.state === 'stuck') {
      if (playing) {
        s.stuckT += dt;
        if (s.bleatCd <= 0) { sfx.bleat(1.5); s.bleatCd = 2.5; }
        if (s.stuckT >= cfg.stuckLimit) loseSheep(s);
      }
    } else if (s.state === 'return') {
      const sp = s.speed * dt;
      s.r += clamp(s.hr - s.r, -sp, sp);
      s.a += (s.ha - s.a) * Math.min(1, dt * 3 * s.speed);
      s.walk += dt * 12;
      if (s.kind === 'lamb') s.hop = Math.abs(Math.sin(t * 9 + s.phase)) * 9;   // happy hops home
      if (Math.abs(s.r - s.hr) < 0.01 && Math.abs(s.a - s.ha) < 0.05) arriveHome(s);
    }
    [s.x, s.y] = sheepXY(s);
    if (Math.abs(s.x - ox) > 0.01) s.flip = s.x > ox ? -1 : 1;
    // Sheep faces
    if (state === 'fail') s.mood = 'dismay';
    else if (state === 'win' || phase === 'choir' || phase === 'go') s.mood = 'joy';
    else if (phase === 'angel') s.mood = phaseT < 2 ? 'shock' : 'wow';
    else if (s.nuzzleT > 0) s.mood = 'joy';
    else if (s.scareT > 0) s.mood = 'shock';
    else if (s.state === 'stuck') s.mood = 'worried';
    else if (s.state === 'wander' && s.r >= E * 0.85) s.mood = 'worried';
    else if (s.state === 'return') s.mood = 'joy';
    else if (s.state === 'home' && s.doze) s.mood = 'sleep';
    else s.mood = 'watch';
  }
  if (!playing) return;
  // Send another sheep off to explore
  wanderT -= dt * (sleepy.asleep ? 1.3 : 1);
  const wandering = sheep.filter((s) => s.state === 'wander' && s.thorn < 0).length;
  if (wanderT <= 0 && wandering < cfg.maxWander) {
    const idle = sheep.filter((s) => s.state === 'home');
    if (idle.length) sendWandering(idle[Math.floor(Math.random() * idle.length)], rand(0.85, 1.15));
    wanderT = cfg.wanderGap * rand(0.7, 1.3);
  }
}

// Off a sheep goes, outward into the dark (fast if frightened)
function sendWandering(s, speed, side = 0) {
  s.state = 'wander'; s.speed = speed; s.thorn = -1; s.darkT = 0; s.warned = false; s.doze = 0;
  if (side) s.wa = side > 0 ? -0.2 : -Math.PI + 0.2;
  else if (Math.sin(s.ha) > 0) s.wa = Math.cos(s.ha) > 0 ? -0.2 : -Math.PI + 0.2;
  else s.wa = clamp(s.ha + rand(-0.4, 0.4), -Math.PI + 0.12, -0.12);
  if (s.bleatCd <= 0) { sfx.bleat(s.kind === 'lamb' ? 1.4 : 1.1); s.bleatCd = 2; }
}

// Back safe by the fire: a counting "baa", and lambs nuzzle their mothers
function arriveHome(s) {
  s.state = 'home'; s.darkT = 0; s.warned = false; s.thorn = -1; s.dozeT = rand(6, 14);
  if (!s.counted) return;
  s.counted = false;
  const n = safeCount();
  floatText(s.x, s.y - 58, `${n}/${sheep.length}`);
  sfx.bleat(0.9 + 0.4 * n / sheep.length);
  const mom = s.mom >= 0 ? sheep[s.mom] : null;
  if (mom && mom.state === 'home') {
    s.nuzzleT = mom.nuzzleT = 1.8;
    for (let i = 0; i < 4; i++) particles.push({ x: (s.x + mom.x) / 2 + rand(-8, 8), y: s.y - 40, vx: rand(-10, 10), vy: rand(-45, -25), life: 1.3, max: 1.3, color: 'heart', size: 7, grav: 0 });
  }
}

function loseSheep(s) {
  if (state !== 'play') return;
  s.state = 'lost'; s.lostT = 0;
  lostCount++;
  sfx.sadBaa();
  shockT = 1.2; shakeT = 0.2;
  showMessage(s.kind === 'lamb' ? 'Oh no... a little lamb is lost in the dark.' : 'Oh no... a sheep is lost in the dark.');
  if (lostCount > cfg.lostAllowed) fail('lost');
}

// Level 1 teaches as it goes; "always" hints show the first time on any night
function hint(key, text, always = false) {
  if (hints[key] || (level > 1 && !always)) return;
  hints[key] = true;
  showMessage(text);
}

function floatText(x, y, text) {
  particles.push({ x, y, vx: 0, vy: -32, life: 1.5, max: 1.5, color: 'txt', text, size: 20, grav: 0 });
}

function startEvent(type) {
  if (type === 'wolf' || type === 'fox') {
    const b = bushes()[Math.floor(Math.random() * 4)];
    const side = b.x < W / 2 ? -1 : 1;
    wolves.push({ kind: type, x: b.x - side * 6, y: b.y + 10, side, stage: 'eyes', t: 0, target: null, blink: 0 });
    if (type === 'fox') hint('fox', 'A sly fox is sneaking up on the lambs! Tap it to shoo it.', true);
    else hint('wolf', 'Eyes in the bushes! Tap the wolf to shoo it away.');
  } else if (type === 'nap') {
    if (!sleepy.asleep) {
      sleepy.asleep = true; sleepy.napT = 0;
      showMessage(level === 1 ? 'Benjamin is nodding off... tap him to wake him!' : 'Benjamin is nodding off...');
    }
  } else if (type === 'thorn') {
    const lambs = sheep.filter((s) => s.kind === 'lamb' && s.state === 'home');
    if (!lambs.length) return;
    const s = lambs[Math.floor(Math.random() * lambs.length)];
    sendWandering(s, 1.4);
    s.thorn = Math.abs(s.a - THORNS[0].a) < Math.abs(s.a - THORNS[1].a) ? 0 : 1;
  } else if (type === 'owl') {
    owl = { side: Math.random() < 0.5 ? -1 : 1, t: 0, bolted: false };
    sfx.hoot();
  }
}

function updateWatch(dt) {
  watchT += dt;
  while (events.length && watchT >= events[0].t) startEvent(events.shift().type);
  updateWolves(dt);
  // The owl hoots, and one sheep takes fright and bolts
  if (owl) {
    owl.t += dt;
    if (!owl.bolted && owl.t > 1) {
      owl.bolted = true;
      const idle = sheep.filter((s) => s.state === 'home');
      if (idle.length) {
        const tr = owlTree(owl.side);
        const s = idle.reduce((a, b) => (Math.abs(b.x - tr.x) < Math.abs(a.x - tr.x) ? b : a));
        sendWandering(s, 3.5, -owl.side);
        s.scareT = 1.4;
        showMessage('Hoo-hoo! A sheep got a fright and ran off!');
      }
    }
    if (owl.t > 3.6) owl = null;
  }
  // Sleepy Benjamin lets the fire burn low
  if (sleepy.asleep) {
    sleepy.napT += dt;
    if (Math.random() < dt * 1.2) spawnZ();
  }
  wakeT = Math.max(0, wakeT - dt);
  fireLevel = Math.max(0.62, fireLevel - (cfg.burn + (sleepy.asleep ? 0.045 : 0)) * dt);
  if (fireLevel < 0.8) hint('fire', 'The fire is burning low. Tap it to add sticks!');
  if (watchT >= cfg.watchTime && state === 'play') startAngel();
}

// Wolves (and foxes): glowing eyes first, then a slow creep toward the flock
function updateWolves(dt) {
  for (let i = wolves.length - 1; i >= 0; i--) {
    const w = wolves[i];
    w.t += dt;
    w.blink = (w.t % 2.4) < 0.12 ? 1 : 0;
    const fox = w.kind === 'fox';
    if (w.stage === 'eyes' && w.t > cfg.wolfWarn) {
      w.stage = 'creep';
    } else if (w.stage === 'creep') {
      if (!w.target || w.target.state === 'lost') {
        const prey = sheep.filter((o) => o.state !== 'lost' && (!fox || o.kind === 'lamb'));
        const pool = prey.length ? prey : sheep.filter((o) => o.state !== 'lost');
        if (!pool.length) { w.stage = 'flee'; continue; }
        w.target = pool.reduce((a, b) => (Math.hypot(b.x - w.x, b.y - w.y) < Math.hypot(a.x - w.x, a.y - w.y) ? b : a));
      }
      const s = w.target;
      const dx = s.x - w.x, dy = s.y - w.y, len = Math.hypot(dx, dy) || 1;
      const sp = cfg.wolfSpeed * (fox ? 1.4 : 1);
      w.x += (dx / len) * sp * dt;
      w.y += (dy / len) * sp * dt;
      w.side = dx < 0 ? 1 : -1;
      if (len < 46) {
        // It reaches the flock: the nearest sheep bolt off into the dark
        const near = sheep.filter((o) => o.state === 'home' || o.state === 'wander' || o.state === 'return')
          .sort((a, b) => Math.hypot(a.x - w.x, a.y - w.y) - Math.hypot(b.x - w.x, b.y - w.y))
          .slice(0, fox ? 1 : cfg.scatter);
        for (const o of near) { sendWandering(o, 4, w.x < W / 2 ? 1 : -1); o.scareT = 1.4; o.counted = false; }
        sfx.bleat(1.3);
        shockT = 1; shakeT = 0.25;
        w.stage = 'flee'; w.t = 0;
        showMessage(fox ? 'The fox chased a lamb into the dark! Tap it home!' : 'The wolf chased sheep into the dark! Tap them home!');
      }
    } else if (w.stage === 'flee') {
      const dir = w.x < W / 2 ? -1 : 1;
      w.side = -dir;
      w.x += dir * 300 * dt;
      if (w.x < -80 - offX || w.x > W + 80 + offX) wolves.splice(i, 1);
    }
  }
}

// Taps during the watch: wolves and foxes first, then Benjamin, lambs in the thorns, strays, and the fire
function tapWatch(p) {
  for (const w of wolves) {
    if (w.stage !== 'flee' && Math.hypot(p.x - w.x, p.y - (w.y - 22)) < 70) {
      w.stage = 'flee'; w.t = 0;
      stats.wolves++; pts.watch += 100; joyT = 1;
      showMessage(w.kind === 'fox' ? 'Shoo, little fox!' : 'Shoo, wolf! Off you go!');
      sfx.yelp();
      for (let i = 0; i < 12; i++) spawn(w.x, w.y - 10, rand(-80, 80), rand(-80, 10), 0.6, '#c9c2b0', rand(3, 6), 60);
      return;
    }
  }
  const b = shepherdSlots()[2];
  if (sleepy.asleep && Math.hypot(p.x - b.x, p.y - (b.y - 45)) < 60) {
    sleepy.asleep = false; wakeT = 1;
    stats.woken++; pts.watch += 50;
    showMessage('Wake up, Benjamin!');
    sfx.wake();
    return;
  }
  for (const s of sheep) {
    if (s.state !== 'stuck' || Math.hypot(p.x - s.x, p.y - (s.y - 16)) > 64) continue;
    s.taps++; s.wobT = 0.25;
    sfx.rustle();
    for (let i = 0; i < 5; i++) spawn(s.x + rand(-20, 20), s.y - 20, rand(-60, 60), rand(-90, -30), 0.6, '#3f7a3a', rand(2, 3.5), 120);
    if (s.taps >= cfg.thornTaps) {
      s.state = 'return'; s.speed = 1.2; s.thorn = -1; s.counted = true;
      stats.lambs++; pts.watch += 120; joyT = 1;
      showMessage('Free! Hop home, little lamb!');
    }
    return;
  }
  let pick = null, pd = 62;
  for (const s of sheep) {
    const d = Math.hypot(p.x - s.x, p.y - (s.y - 20));
    if (d < pd && s.state === 'wander') { pick = s; pd = d; }
  }
  if (pick) {
    pts.watch += pick.darkT > 0 ? 60 : 30;
    stats.called++;
    pick.state = 'return'; pick.speed = 1.1; pick.thorn = -1; pick.counted = true; pick.scareT = 0;
    joyT = 0.8;
    sfx.whistle();
    for (let i = 0; i < 8; i++) spawn(pick.x, pick.y - 30, rand(-50, 50), rand(-80, -20), 0.6, '#fff6d0', rand(2, 3.5));
    return;
  }
  if (Math.hypot(p.x - W / 2, p.y - (FY - 18)) < 60) {
    // another stick on the fire
    if (fireLevel < 0.95) pts.watch += 10;
    fireLevel = Math.min(1.15, fireLevel + 0.22);
    sfx.crackle();
    for (let i = 0; i < 14; i++) spawn(W / 2 + rand(-16, 16), FY - 26, rand(-40, 40), rand(-160, -70), rand(0.5, 1), Math.random() < 0.5 ? '#ffb13a' : '#ffe27a', rand(1.5, 3));
    return;
  }
  // A tap on a sheep at home earns a friendly "baa" (and wakes a dozing one)
  for (const s of sheep) {
    if (s.state === 'home' && Math.hypot(p.x - s.x, p.y - (s.y - 20)) < 40 && s.bleatCd <= 0) {
      sfx.bleat(s.kind === 'lamb' ? 1.4 : 1); s.bleatCd = 1.2; s.doze = 0; s.dozeT = rand(6, 14); return;
    }
  }
}

function spawnZ() {
  const b = shepherdSlots()[2];
  particles.push({ x: b.x + 14, y: b.y - 80, vx: rand(8, 20), vy: -22, life: 1.8, max: 1.8, color: 'z', size: 14, grav: 0 });
}

// ============================================================
//  Part 2: the angel and the multitude of the heavenly host
// ============================================================
const ANGEL_LINES = ['fearNot', 'born', 'sign'];
// "Gloria" (after the traditional carol "Angels We Have Heard on High", public domain)
const GLORIA = ['A5', 'B5', 'A5', 'G5', 'F#5', 'G5', 'A5', 'F#5', 'G5', 'A5', 'G5', 'F#5', 'E5', 'F#5', 'G5', 'E5',
  'F#5', 'G5', 'F#5', 'E5', 'D5', 'E5', 'F#5', 'D5', 'E5', 'A4', 'D5'];

function startAngel() {
  phase = 'angel'; phaseT = 0; lineIdx = 0; lineT = 0;
  for (const w of wolves) if (w.stage !== 'flee') { w.stage = 'flee'; w.t = 0; }
  sleepy.asleep = false; owl = null;
  for (const s of sheep) if (s.state !== 'home' && s.state !== 'lost') { s.state = 'return'; s.speed = 1; s.thorn = -1; s.counted = false; }
  stats.safe = safeCount();
  pts.watch += stats.safe * 50;
  flashT = 0.9; shockT = 0; message.t = 0; banner = null;
  sfx.glory();
}

function angelLineDur() {
  return Math.max(3.6, Bible.verse(VERSES[ANGEL_LINES[lineIdx]]).text.length * 0.055);
}

function nextAngelLine() {
  lineIdx++; lineT = 0;
  if (lineIdx >= ANGEL_LINES.length) startChoir();
}

function startChoir() {
  phase = 'choir'; phaseT = 0;
  notes = []; noteSpawned = 0; noteSpawnT = 1.2; choirDoneT = -1;
  noteStats = { perfect: 0, good: 0, miss: 0 };
  const n = cfg.notes;
  melody = n >= GLORIA.length ? GLORIA.slice() : GLORIA.slice(0, n - 3).concat(['E5', 'A4', 'D5']);
  banner = { key: 'glory', t: 999 };
}

function spawnNote() {
  let x = W / 2, y = 450;
  for (let tries = 0; tries < 30; tries++) {
    x = rand(70, W - 70); y = rand(330, 610);
    if (notes.every((n) => n.state !== 'live' || Math.hypot(n.x - x, n.y - y) > 120)) break;
  }
  const k = noteSpawned;
  const vowel = k === melody.length - 1 ? 'a' : k === melody.length - 2 ? 'e' : 'o';   // "Glo-o-o...-ri-a"
  notes.push({ x, y, t: 0, dur: cfg.ring, pitch: melody[k], vowel, state: 'live', fx: 0, label: '' });
  noteSpawned++;
}

function updateChoir(dt) {
  noteSpawnT -= dt;
  if (noteSpawnT <= 0 && noteSpawned < melody.length) { spawnNote(); noteSpawnT = cfg.noteGap; }
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.t += dt;
    if (n.state === 'live' && n.t > n.dur + 0.35) {
      n.state = 'miss'; noteStats.miss++; n.label = 'Missed';
    }
    if (n.state !== 'live') { n.fx += dt; if (n.fx > 0.8) notes.splice(i, 1); }
  }
  if (noteSpawned >= melody.length && !notes.some((n) => n.state === 'live')) {
    if (choirDoneT < 0) {
      choirDoneT = 0;
      const all = noteStats.perfect + noteStats.good;
      showMessage(all >= melody.length * 0.8 ? 'What beautiful singing!' : 'The angels sang for joy!');
      pts.choir += noteStats.miss === 0 ? 300 : 0;
      sfx.levelStart();
    }
    choirDoneT += dt;
    if (choirDoneT > 3) startGo();
  }
}

function hitNote(n) {
  const off = n.dur - n.t;
  const perfect = Math.abs(off) <= 0.22;
  n.state = 'hit'; n.fx = 0;
  n.label = perfect ? 'Perfect!' : 'Good';
  if (perfect) noteStats.perfect++; else noteStats.good++;
  pts.choir += perfect ? 100 : 50;
  joyT = 0.6;
  sfx.sing(n.pitch, n.vowel);
  for (let i = 0; i < 14; i++) {
    const a = rand(0, TAU), sp = rand(40, 140);
    spawn(n.x, n.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1), ['#ffe27a', '#fff6d0', '#ffffff'][i % 3], rand(2, 4));
  }
}

function tapChoir(p) {
  let pick = null, pd = 66;
  for (const n of notes) {
    if (n.state !== 'live') continue;
    const d = Math.hypot(p.x - n.x, p.y - n.y);
    if (d < pd) { pick = n; pd = d; }
  }
  if (pick) hitNote(pick);
}

// Keyboard: Space sings the most urgent note
function keyChoir() {
  const live = notes.filter((n) => n.state === 'live');
  if (!live.length) return;
  hitNote(live.reduce((a, b) => (b.t / b.dur > a.t / a.dur ? b : a)));
}

// ============================================================
//  "Let us now go even unto Bethlehem": a gentle drift toward the town
// ============================================================
function startGo() {
  phase = 'go'; phaseT = 0;
  banner = { key: 'letUsGo', t: 999 };
  notes = []; message.t = 0;
}

// ============================================================
//  Finale: the babe lying in a manger
// ============================================================
function startFinale() {
  phase = 'finale'; stage = 0; stageT = 0; fadeT = 0.8;
  gloryF = 0;
  banner = { key: 'found', t: 999 };
  message.t = 0;
  sfx.levelStart();
}

function nextStage() {
  stage++; stageT = 0;
  if (stage === 1) fadeT = 0.8;
  if (stage > 2) { stage = 2; win(); return; }
  banner = { key: ['found', 'madeKnown', 'returned'][stage], t: 999 };
  sfx.tap(0.5 + stage * 0.2);
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    if (p.color === 'z') {      // sleepy "z"s
      ctx.fillStyle = '#e8ecff';
      ctx.font = `700 ${Math.round(p.size + (1 - a) * 8)}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('z', p.x, p.y);
    } else if (p.color === 'txt') {   // counting the sheep home
      ctx.font = `700 ${p.size}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,20,60,0.8)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = '#fff3a0';
      ctx.fillText(p.text, p.x, p.y);
    } else if (p.color === 'heart') {
      const r = p.size;
      ctx.fillStyle = '#ff7a9a';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + r * 0.9);
      ctx.bezierCurveTo(p.x - r * 1.6, p.y - r * 0.2, p.x - r * 0.6, p.y - r * 1.4, p.x, p.y - r * 0.4);
      ctx.bezierCurveTo(p.x + r * 0.6, p.y - r * 1.4, p.x + r * 1.6, p.y - r * 0.2, p.x, p.y + r * 0.9);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  const levelBonus = level * 500;
  const score = pts.watch + pts.choir + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('shepherdsBest', best); } catch (e) {} }
  lastScore = { ...stats, total: sheep.length, watch: pts.watch, choir: pts.choir, levelBonus, score, perfect: noteStats.perfect };
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(W / 2, 420, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 1.8;
}

function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  sfx.fail();
  endTimer = 1.4;
}

function showMessage(text) { message = { text, t: 2.2 }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  phase = 'watch';
  cfg = makeConfig(1);
  setupField();
  showOverlay('The Shepherds and the Angels', 'A night on the hills of Bethlehem',
    `${verseHTML('fearNot')}
     <ul>
       <li><b>Keep watch all night:</b> when a sheep or lamb wanders off toward the dark, tap it to call it home. Hurry when you see a <b>!</b></li>
       <li>Tap a lamb stuck in the <b>thorns</b> a few times to free it. Tap glowing <b>eyes</b> to shoo the wolf, wake sleepy <b>Benjamin</b>, and tap the <b>fire</b> to add sticks.</li>
       <li>If more than 2 sheep get lost, the night is over (fewer on later nights).</li>
       <li><b>Then sing:</b> when the angels come, tap each glowing note as its ring closes (or press <kbd>Space</kbd>).</li>
       <li>A mouse click works like a tap.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Keep Watch', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel() {
  cfg = makeConfig(level);
  phase = 'watch'; phaseT = 0;
  setupField();
  pts = { watch: 0, choir: 0 };
  noteStats = { perfect: 0, good: 0, miss: 0 };
  particles = []; notes = [];
  tapQueue.length = 0;
  ripples.length = 0;
  shockT = joyT = flashT = shakeT = fadeT = 0; gloryF = 0;
  stage = 0; stageT = 0;
  state = 'play';
  syncAmbience();
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  banner = { key: 'watch', t: 5 };
  sfx.levelStart();
  if (level === 1) setTimeout(() => { if (state === 'play' && phase === 'watch' && watchT < 10) showMessage('Tap a sheep that wanders off to call it home'); }, 3500);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Tidings of great joy!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('glory')}
       <p class="score" style="font-size:1rem">Sheep kept safe: <b>${s.safe}/${s.total}</b><br>Strays called home: <b>${s.called}</b><br>Lambs freed: <b>${s.lambs}</b><br>${level >= 3 ? 'Wolves &amp; foxes' : 'Wolves'} shooed: <b>${s.wolves}</b></p>
       <p class="score">Night watch: <b>${s.watch}</b><br>Angel choir: <b>${s.choir}</b> <small>(${s.perfect} perfect)</small><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Night', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Lost in the dark!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lostCount} of the flock wandered off into the night. Watch for the <b>!</b> and tap strays home in time, free lambs from the thorns, and keep the fire bright.</p>
       ${verseHTML('watch')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', startLevel);
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const tapQueue = [];
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (phase === 'choir') keyChoir();
    else if (phase === 'angel' && lineT > 0.8) nextAngelLine();
    else if (phase === 'go' && phaseT > 1.5) startFinale();
    else if (phase === 'finale' && stageT > 1.2) nextStage();
  }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  if (tapQueue.length < 4) tapQueue.push({ x: p.x, y: p.y });
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function handleTaps() {
  while (tapQueue.length) {
    const p = tapQueue.shift();
    if (state !== 'play') continue;
    if (phase === 'watch') tapWatch(p);
    else if (phase === 'angel') { if (lineT > 0.8) nextAngelLine(); }
    else if (phase === 'choir') tapChoir(p);
    else if (phase === 'go') { if (phaseT > 1.5) startFinale(); }
    else if (phase === 'finale') { if (stageT > 1.2) nextStage(); }
  }
}
