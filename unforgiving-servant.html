<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3c98b">
<title>The Unforgiving Servant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f3c98b;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Unforgiving Servant</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Scripture shown in this game, looked up in the player's chosen version.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  howOft:     { ref: 'Matthew 18:21', KJV: 'Lord, how oft shall my brother sin against me, and I forgive him? till seven times?', NKJV: 'Lord, how often shall my brother sin against me, and I forgive him? Up to seven times?', NIV: 'Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?', NLT: 'Lord, how often should I forgive someone who sins against me? Seven times?' },   // title card + Peter's bubble
  seventy:    { ref: 'Matthew 18:22', KJV: 'I say not unto thee, Until seven times: but, Until seventy times seven.', NKJV: 'I do not say to you, up to seven times, but up to seventy times seven.', NIV: 'I tell you, not seven times, but seventy-seven times.', NLT: 'No, not seven times... but seventy times seven!' },   // title card + Jesus's bubble
  countTo:    { ref: 'Matthew 18:22', KJV: 'Until seventy times seven', NKJV: 'Up to seventy times seven', NIV: 'Seventy-seven times', NLT: 'Seventy times seven' },   // counting game header
  patience:   { ref: 'Matthew 18:26', KJV: 'Lord, have patience with me, and I will pay thee all.', NKJV: 'Master, have patience with me, and I will pay you all.', NIV: 'Be patient with me... and I will pay back everything.', NLT: 'Please, be patient with me, and I will pay it all.' },   // the servant begs the king
  forgave:    { ref: 'Matthew 18:27', KJV: 'Then the lord of that servant was moved with compassion, and loosed him, and forgave him the debt.', NKJV: 'Then the master of that servant was moved with compassion, released him, and forgave him the debt.', NIV: 'The servant’s master took pity on him, canceled the debt and let him go.', NLT: 'Then his master was filled with pity for him, and he released him and forgave his debt.' },   // banner in the palace
  payMe:      { ref: 'Matthew 18:28', KJV: 'Pay me that thou owest.', NKJV: 'Pay me what you owe!', NIV: 'Pay back what you owe me!', NLT: 'He... demanded instant payment.' },   // banner when the servant demands
  beg:        { ref: 'Matthew 18:29', KJV: 'Have patience with me, and I will pay thee all.', NKJV: 'Have patience with me, and I will pay you all.', NIV: 'Be patient with me, and I will pay it back.', NLT: 'Be patient with me, and I will pay it.' },   // a fellow servant's bubble + night fail card
  wouldNot:   { ref: 'Matthew 18:30', KJV: 'And he would not: but went and cast him into prison, till he should pay the debt.', NKJV: 'And he would not, but went and threw him into prison till he should pay the debt.', NIV: 'But he refused. Instead, he went off and had the man thrown into prison until he could pay the debt.', NLT: 'But his creditor wouldn’t wait. He had the man arrested and put in prison until the debt could be paid in full.' },   // demand fail card
  compassion: { ref: 'Matthew 18:33', KJV: 'Shouldest not thou also have had compassion on thy fellowservant, even as I had pity on thee?', NKJV: 'Should you not also have had compassion on your fellow servant, just as I had pity on you?', NIV: 'Shouldn’t you have had mercy on your fellow servant just as I had on you?', NLT: 'Shouldn’t you have mercy on your fellow servant, just as I had mercy on you?' },   // the king's bubble + win card
  hearts:     { ref: 'Matthew 18:35', KJV: 'from your hearts', NKJV: 'from his heart', NIV: 'from your heart', NLT: 'from your heart' },   // Jesus's point, win card
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }

// The shared sound engine: harp melody with the shepherd's pipe, market bustle behind
Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'pipe', ambience: 'market', percussion: false };

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hash = (i) => { const s = Math.sin(i * 127.1 + 11.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Blends two hex colours; used to let the town slip gently into night
function mix(a, b, f) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(na >> 16, nb >> 16, f));
  const g = Math.round(lerp((na >> 8) & 255, (nb >> 8) & 255, f));
  const bl = Math.round(lerp(na & 255, nb & 255, f));
  return `rgb(${r},${g},${bl})`;
}
// Darkens a colour toward a dusky blue (canvas filters are too slow)
const dusk = (hex, f) => mix(hex, '#262a52', f);

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

const isTouch = () => matchMedia('(pointer: coarse)').matches;

// ============================================================
//  Tuning
// ============================================================
const STREET_Y = 800;     // feet of everyone in the town street
const HEART_Y = 848;      // the row of Forgive buttons
const HEART_R = 29;
const NOTE_Y = 628;       // top of each debt tablet
const WALK_V = 230;       // walking speed (px/s)
const FADE = 0.35;        // scene fade (each way)

const LEVEL_NAMES = [
  'A Little Debt',
  'Market Day',
  'The Busy Street',
  'Again and Again',
  'Festival of Lights',
  'The Whole Town',
];

function makeConfig(n) {
  const N = [5, 7, 9, 11, 13][n - 1] || Math.min(13 + (n - 5) * 2, 21);
  const c = {
    name: LEVEL_NAMES[n - 1] || `Seventy Times Seven ${n}`,
    N,                                                   // debts to forgive
    taps: n === 1 ? 1 : n <= 3 ? 2 : 3,                  // taps on the heart to forgive one debt
    patience: Math.max(15 - (n - 1) * 2.2, 6),           // seconds a debtor waits before walking off
    gap: Math.max(2.4 - (n - 1) * 0.35, 1.0),            // seconds between arrivals
    clouds: n === 1 ? 0 : Math.max(8 - (n - 2) * 1.5, 3),   // seconds between grumpy thoughts (0 = none)
    again: n < 3 ? 0 : Math.min(n - 2, 5),               // people who come back owing again
    countTime: [25, 20, 17, 15, 13][n - 1] || 12,        // seconds for the counting game
  };
  // Time before night falls, from a rough estimate of the work needed
  const est = N * c.gap + 4 + N * c.taps * 0.25;
  c.time = Math.round(est * ([3.2, 2.2, 1.9, 1.75, 1.6][n - 1] || 1.5));
  return c;
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let scene = 'frame';      // frame | count | king | story | town | demand
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('forgivenBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0, sceneT = 0;
let fade = null;          // { t, to } while crossing between scenes
let cut = null;           // the running cutscene
let seenIntro = false;    // after the story has been told once, a retry goes straight to the town
let seenStory = false;    // the story's own sad ending is shown once per game
let particles = [];
let floaters = [];        // rising words ("Forgiven!", "+7")
let ripples = [];
let bubble = null;        // { who, text, t }
let banner = null;        // { text, cite, t }
let message = { text: '', t: 0 };
let hint = null;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let shakeT = 0, flashT = 0;

// Counting game
let count = null;         // { n, goal, step, timeLeft, started, done, doneT }
let countBonus = 0;

// Palace
let pileF = 1;            // how much of the mountain of coins is left

// Town
let servant, king, fellow;
let debtors = [];
let queue = [];           // debts still to come
let clouds = [];
let forgiven = 0;
let timeLeft = 0;
let spawnT = 0, cloudT = 0;
let nSlots = 3;
let lightMul = 1;         // the lamps dim when the servant demands payment
let glowF = 0;            // the town's festival glow after a win
let cheer = [];           // everyone forgiven, cheering in the street after a win
let demanded = 0;

// ============================================================
//  People
// ============================================================
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Philip',      robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { name: 'Bartholomew', robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { name: 'James the Less', robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
  { name: 'Thaddaeus',   robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
  { name: 'Simon',       robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c', scarf: '#d8c7a0' },
].map((d, i) => person(d, i));

// Townsfolk who owe the servant a little
const FOLK = [
  { name: 'Eli',     robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'Hannah',  robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', scarf: '#f2c6d6' },
  { name: 'Reuben',  robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55' },
  { name: 'Miriam',  robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678', scarf: '#e8dcc0' },
  { name: 'Old Asa', robe: '#4b7f4b', hair: '#9a9a9a', beard: true,  skin: '#bf8150' },
  { name: 'Tobias',  robe: '#3f6fb5', hair: '#1c120b', beard: false, skin: '#c78f5c', child: true },
  { name: 'Joel',    robe: '#a0673a', hair: '#2d1b0f', beard: true,  skin: '#d39a66', scarf: '#c9b27a' },
  { name: 'Leah',    robe: '#5a6475', hair: '#4a2f1a', beard: false, skin: '#b87a48', scarf: '#bfe0d8' },
  { name: 'Micah',   robe: '#c97a2b', hair: '#3a2515', beard: true,  skin: '#e0a877' },
  { name: 'Ruth',    robe: '#2f8f6f', hair: '#2a1a0e', beard: false, skin: '#c88e5a', scarf: '#f5e6b0' },
];

function person(d, i) {
  return {
    ...d, i,
    x: 0, y: 0, s: 1, tx: null,
    mood: 'watch', blink: 0, blinkT: rand(1, 4), phase: rand(0, TAU),
    lookX: 0, lookY: 0, kneel: false, walking: false, jump: 0,
  };
}

function newServant() {
  const p = person({ name: 'Servant', robe: '#2f7fa8', hair: '#4a2f1a', beard: true, skin: '#d9a066', scarf: '#f0cf6a' }, 20);
  p.s = 1.35;
  return p;
}
function newKing() {
  const p = person({ name: 'King', robe: '#6a3fa0', hair: '#a0a0a0', beard: true, skin: '#e0a877', crown: true }, 21);
  p.s = 1.45;
  return p;
}

function tickPerson(p, dt) {
  p.blinkT -= dt;
  if (p.blinkT <= 0) { p.blink = 0.13; p.blinkT = rand(1.5, 5); }
  if (p.blink > 0) p.blink -= dt;
  p.walking = false;
  if (p.tx !== null && p.tx !== undefined) {
    const d = p.tx - p.x;
    if (Math.abs(d) > 2) { p.x += Math.sign(d) * Math.min(Math.abs(d), WALK_V * dt); p.walking = true; }
    else p.x = p.tx;
  }
}

function lookAt(p, x, y) {
  const dx = x - p.x, dy = y - (p.y - 55 * p.s);
  const len = Math.hypot(dx, dy) || 1;
  p.lookX = dx / len; p.lookY = dy / len;
}

// Head position for speech bubbles
const headOf = (p) => ({ x: p.x, y: p.y - (p.kneel ? 76 : 90) * p.s });

function drawPerson(p) {
  const s = p.s * (p.child ? 0.8 : 1);
  const mood = p.mood;
  let jump = p.jump || 0;
  if (mood === 'joy') jump += Math.abs(Math.sin(t * 7 + p.phase)) * 10;
  if (mood === 'shock') jump += Math.max(0, Math.sin(t * 30)) * 1.5;
  if (p.walking) jump += Math.abs(Math.sin(t * 11 + p.phase)) * 3;

  // soft shadow
  ctx.fillStyle = 'rgba(40,30,20,0.16)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, 20 * s, 5 * s, 0, 0, TAU); ctx.fill();

  ctx.save();
  ctx.translate(p.x, p.y - jump * s);
  ctx.scale(s, s);
  const k = p.kneel ? 14 : 0;     // kneeling: the whole body sits lower, with folded legs
  ctx.translate(0, k);

  const sleeve = shade(p.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const lx = p.lookX, ly = p.lookY;

  // Arms raised behind the head for joy / pointing up in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + p.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && p.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  const bottom = -k;
  ctx.fillStyle = p.robe;
  ctx.strokeStyle = shade(p.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, bottom);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, bottom);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (p.kneel) {          // folded knees
    ctx.beginPath(); ctx.ellipse(0, bottom, 21, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = p.crown ? '#f5c542' : '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && p.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  } else if (mood === 'cross') {
    arm(-11, -32, -8, -20); arm(11, -32, 32, -40);           // hand on hip, pointing
  }

  // Head
  const hy = -53;
  ctx.fillStyle = p.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (p.scarf) {
    ctx.fillStyle = p.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(p.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (p.beard) {
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  // The king's crown
  if (p.crown) {
    ctx.fillStyle = '#f5c542'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14, hy - 10); ctx.lineTo(-16, hy - 28); ctx.lineTo(-8, hy - 19); ctx.lineTo(0, hy - 31);
    ctx.lineTo(8, hy - 19); ctx.lineTo(16, hy - 28); ctx.lineTo(14, hy - 10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(0, hy - 16, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4dabf7'; ctx.beginPath(); ctx.arc(-9, hy - 14, 2, 0, TAU); ctx.arc(9, hy - 14, 2, 0, TAU); ctx.fill();
  }

  drawFace(p, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && p.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = p.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'cross':
      eyes(3.5, 3.5, 2);
      brows(-5, -10, -5, -10);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4.5, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

  // beard
  ctx.beginPath();

  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';

  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);

    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();

}

const jesus = { x: 0, y: 700, s: 1.7, face: 'calm', up: false, talk: false };

// ============================================================
//  Particles & floating words
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, heart = false) {
  if (particles.length > 500) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, heart });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t -= dt; f.y -= 40 * dt;
    if (f.t <= 0) floaters.splice(i, 1);
  }
}

function heartPath(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.5, y - r * 0.1, x - r * 0.75, y - r * 1.25, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.75, y - r * 1.25, x + r * 1.5, y - r * 0.1, x, y + r * 0.9);
  ctx.closePath();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.heart) { heartPath(p.x, p.y, p.size * (0.6 + a * 0.4)); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function floatText(x, y, text, color = '#b8860b', size = 22) {
  floaters.push({ x, y, text, t: 1.2, color, size });
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.t / 0.4, 0, 1);
    ctx.font = `700 ${f.size}px Fredoka, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

function goldBurst(x, y, n, hearts = false) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 190);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 40, rand(0.7, 1.6),
      ['#ffe27a', '#fff6d0', '#ffd24a', '#ffb3c7'][i % 4], hearts && i % 3 === 0 ? rand(5, 8) : rand(2, 4.5), 40, hearts && i % 3 === 0);
  }
}

// ============================================================
//  Cutscenes: a list of beats, each tapped through (or timed)
// ============================================================
function runCutscene(list, done) {
  cut = { list, i: -1, t: 0, dur: 1, done };
  nextBeat();
}

function nextBeat() {
  if (!cut) return;
  cut.i++;
  cut.t = 0;
  bubble = null; banner = null;
  if (cut.i >= cut.list.length) { const d = cut.done; cut = null; d(); return; }
  const b = cut.list[cut.i];
  b.go();
  const text = (bubble && bubble.text) || (banner && banner.text) || '';
  cut.dur = b.dur || clamp(2.2 + text.split(' ').length * 0.27, 3, 9);
}

function say(who, text) { bubble = { who, text, t: 99 }; }
function narrate(text, cite = '') { banner = { text, cite, t: 99, age: 0 }; }
function narrateVerse(key) { const v = Bible.verse(VERSES[key]); narrate(v.text, v.cite); }

// ============================================================
//  Scenes
// ============================================================
function setScene(name, instant = false) {
  if (instant) { enterScene(name); return; }
  fade = { t: 0, to: name };
}

function enterScene(name) {
  scene = name;
  sceneT = 0;
  cut = null; bubble = null; banner = null; hint = null;
  particles = []; floaters = [];
  if (name === 'frame') enterFrame();
  else if (name === 'count') enterCount();
  else if (name === 'king') enterKing();
  else if (name === 'story') enterStory();
  else if (name === 'town') enterTown();
}

function updateFade(dt) {
  if (!fade) return;
  const before = fade.t;
  fade.t += dt;
  if (before < FADE && fade.t >= FADE) enterScene(fade.to);
  if (fade.t >= FADE * 2) fade = null;
}

// ---------- The hillside: Peter asks, Jesus answers ----------
function crowdSlots() {
  const jx = W * 0.74;
  const left = 36, right = jx - 70;
  const slots = [];
  const backN = clamp(Math.floor((right - left) / 52), 3, 6);
  const frontN = clamp(Math.floor((right - left) / 72), 3, 5);
  const backIdx = [1, 4, 6, 8, 9, 10], frontIdx = [3, 2, 5, 7, 0];   // Peter at the front, nearest Jesus
  for (let k = 0; k < backN; k++) {
    const d = DISCIPLES[backIdx[k]];
    d.x = lerp(left + 10, right - 20, backN === 1 ? 0.5 : k / (backN - 1)); d.y = 748; d.s = 1.02;
    slots.push(d);
  }
  for (let k = 0; k < frontN; k++) {
    const d = DISCIPLES[frontIdx[frontN === 5 ? k : k + (5 - frontN)]];
    d.x = lerp(left, right, frontN === 1 ? 0.5 : k / (frontN - 1)); d.y = 826; d.s = 1.28;
    slots.push(d);
  }
  return slots;
}
const peter = DISCIPLES[0];

function setCrowd(mood) { for (const d of DISCIPLES) d.mood = mood; }

function enterFrame() {

// ---------- The counting game: seventy times seven ----------
function countGoal() {
  // The NIV reads "seventy-seven times", so count what the chosen Bible says
  return Bible.verse(VERSES.countTo).version === 'NIV' ? { goal: 77, step: 1 } : { goal: 490, step: 7 };
}

function enterCount() {
  const g = countGoal();
  count = { n: 0, goal: g.goal, step: g.step, timeLeft: cfg.countTime, started: false, done: false, doneT: 0, reached: false };
  setCrowd('watch');
  hint = { text: isTouch() ? 'Tap anywhere to count!' : 'Tap, click or press Space to count!', t: 99 };
}

function countTap() {
  const c = count;
  if (!c || c.done) return;
  if (!c.started) { c.started = true; hint = null; }
  c.n = Math.min(c.goal, c.n + c.step);
  const f = c.n / c.goal;
  floatText(W / 2 + rand(-120, 120), 360 + rand(-20, 20), `${c.n}`, '#b8860b', 20);
  spawn(W / 2 + rand(-60, 60), 300, rand(-60, 60), rand(-90, -30), 0.7, '#ffe27a', rand(2, 4));
  sfx.tap(f);
  setCrowd(f > 0.5 ? 'wow' : 'watch');
  if (c.n >= c.goal) finishCount(true);
}

function finishCount(reached) {
  const c = count;
  c.done = true; c.reached = reached; c.doneT = 2.2;
  if (reached) {
    countBonus = 300 + Math.round(c.timeLeft * 20);
    setCrowd('joy'); jesus.face = 'joy'; jesus.up = true;
    goldBurst(W / 2, 260, 60, true);
    showMessage(`${c.goal}! Keep on forgiving!`);
    sfx.chime(1);
  } else {
    countBonus = Math.round((c.n / c.goal) * 200);
    setCrowd('wow'); jesus.face = 'joy';
    showMessage(`${c.n}… that’s a lot of forgiving!`);
  }
}

function updateCount(dt) {
  const c = count;
  if (!c) return;
  if (c.done) {
    c.doneT -= dt;
    if (c.doneT <= 0) { count = null; jesus.up = false; jesus.face = 'calm'; setScene('king'); }
    return;
  }
  if (c.started) {
    c.timeLeft -= dt;
    if (c.timeLeft <= 0) { c.timeLeft = 0; finishCount(false); }
  }
}

  let row = 0;
  for (let n = 11; n >= 1; n--, row++) {

  }
  return coins;
})();

    { go: () => narrate('Forgiven and free, the servant went out and met a friend who owed him just a little money.') },
    { go: () => { servant.mood = 'cross'; fellow.mood = 'shock'; narrateVerse('payMe'); sfx.grumble(); } },
    { go: () => { fellow.kneel = true; fellow.mood = 'worried'; say(fellow, verseText('beg')); } },
    { go: () => { narrate('But the servant would not forgive even that little debt.'); fellow.kneel = false; fellow.mood = 'dismay'; fellow.tx = W + 80; lightMul = 0.35; } },
    { go: () => { king.tx = Math.max(servant.x + 110, W * 0.36); king.mood = 'worried'; servant.mood = 'shock'; lookAt(king, servant.x, servant.y - 60); lookAt(servant, king.tx, king.y - 60); say(king, verseText('compassion')); }, dur: 7 },
    { go: () => { narrate('The king was so sad. That is how Jesus’s story goes… but YOU can choose differently. Will you forgive?'); servant.mood = 'worried'; } },
  ];
  runCutscene(beats, () => { seenStory = true; setScene('town'); });
}

// ---------- The town: forgive everyone before night falls ----------
function slotX(i) {
  const first = Math.max(175, W * 0.3), last = W - Math.max(52, W * 0.07);
  return nSlots === 1 ? (first + last) / 2 : lerp(first, last, i / (nSlots - 1));
}
const SERV_X = () => Math.max(66, W * 0.1);

function enterTown() {
  seenIntro = true;
  nSlots = W >= 900 ? 5 : W >= 660 ? 4 : 3;
  servant = newServant();
  servant.x = SERV_X(); servant.y = STREET_Y; servant.mood = 'watch';
  king = newKing(); king.x = -90; king.y = STREET_Y; king.s = 1.35;
  debtors = []; clouds = []; cheer = [];
  forgiven = 0; demanded = 0; lightMul = 1; glowF = 0;
  timeLeft = cfg.time;
  spawnT = 0.8; cloudT = cfg.clouds ? cfg.clouds * 0.6 : 0;
  queue = makeQueue();
  showMessage(`Level ${level}: ${cfg.name}`);
  hint = { text: isTouch() ? 'Tap the heart under each person to forgive them' : 'Click the hearts, or press 1–' + nSlots + ' (Space = next)', t: 5 };
  Music.ambience(true);
}

// The debts for this level. Some people come back owing again (seventy times seven!)
function makeQueue() {
  const q = [];
  const people = FOLK.slice().sort(() => Math.random() - 0.5);
  const firstN = cfg.N - cfg.again;
  for (let i = 0; i < firstN; i++) q.push({ who: people[i % people.length], amount: Math.round(rand(2, 9)), again: false });
  for (let i = 0; i < cfg.again; i++) {
    const at = Math.min(q.length, 3 + Math.floor(rand(0, q.length - 2)));
    q.splice(at, 0, { who: q[i % firstN].who, amount: Math.round(rand(1, 6)), again: true });
  }
  return q;
}

const PLEAS = [
  'I’m sorry, I spent it on bread!',
  'My goat ate my purse!',
  'Could you wait a little longer?',
  'The fish weren’t biting this week!',
  'I promise I’ll pay you back!',
  'My roof leaked and I had to fix it!',
  'My donkey needed new sandals!',
  'The rain spoiled my figs!',
];
const AGAIN = ['It’s me again… I’m so sorry!', 'Again? I know, I know…', 'I owe you a little more…'];
const THANKS = ['Thank you!', 'Bless you!', 'You forgave me!', 'Hooray!', 'How kind!'];

function trySpawn() {
  const taken = new Set(debtors.filter((d) => d.slot >= 0).map((d) => d.slot));
  const present = new Set(debtors.map((d) => d.debt.who.name));
  let slot = -1;
  for (let i = 0; i < nSlots; i++) if (!taken.has(i)) { slot = i; break; }
  if (slot < 0 || !queue.length) { spawnT = 0.3; return; }
  const qi = queue.findIndex((q) => !present.has(q.who.name));
  if (qi < 0) { spawnT = 0.3; return; }
  const debt = queue.splice(qi, 1)[0];
  const p = person(debt.who, 40 + forgiven + debtors.length);
  p.s = 1.22; p.x = W + 50 + offX; p.y = STREET_Y; p.tx = slotX(slot);
  debtors.push({ p, debt, slot, phase: 'in', patience: cfg.patience, hearts: 0, t: 0 });
  spawnT = cfg.gap;
}

function waiting() { return debtors.filter((d) => d.phase === 'wait'); }

function heartTap(d) {
  if (d.phase !== 'wait') return;
  d.hearts++;
  d.pulse = 0.25;
  sfx.tone(520 + d.hearts * 120, 0.12, 'sine', 0.18);
  if (d.hearts >= cfg.taps) forgiveDebtor(d);
}

function forgiveDebtor(d) {
  d.phase = 'joy'; d.t = 1.1;
  d.p.mood = 'joy';
  forgiven++;
  servant.mood = 'joy'; servant.moodT = 1;
  const x = slotX(d.slot);
  goldBurst(x, NOTE_Y + 20, 40, true);
  floatText(x, NOTE_Y - 20, 'Forgiven!', '#c07a00', 22);
  say(d.p, pick(THANKS)); bubble.t = 1.6;
  sfx.chime(forgiven / cfg.N);
  if (forgiven >= cfg.N) win();
}

// The player chooses to demand payment: the story's sad ending plays out
function demand() {
  const w = waiting();
  if (!w.length) { showMessage('No one is waiting right now'); return; }
  const d = w.reduce((a, b) => (a.patience < b.patience ? a : b));
  demanded++;
  scene = 'demand';
  hint = null;
  Music.ambience(false);
  const p = d.p;
  for (const o of debtors) if (o !== d && o.phase === 'wait') { o.p.mood = 'shock'; }
  lookAt(servant, p.x, p.y - 60); lookAt(p, servant.x, servant.y - 60);
  const beats = [
    { go: () => { servant.mood = 'cross'; p.mood = 'shock'; narrateVerse('payMe'); sfx.grumble(); } },
    { go: () => { p.kneel = true; p.mood = 'worried'; say(p, verseText('beg')); } },
    { go: () => { p.kneel = false; p.mood = 'dismay'; p.tx = W + 90; d.phase = 'gone'; lightMul = 0.3; for (const o of debtors) if (o !== d) o.p.mood = 'dismay'; narrate('The servant would not forgive. All the lamps grew dim…'); } },
    { go: () => { king.tx = Math.max(servant.x + 100, W * 0.3); king.mood = 'worried'; servant.mood = 'shock'; lookAt(king, servant.x, servant.y - 60); lookAt(servant, king.tx, king.y - 60); say(king, verseText('compassion')); }, dur: 7 },
  ];
  runCutscene(beats, () => fail('demand'));
}

// A tap in the town: grumpy thoughts first, then the hearts, then Demand
function townTap(x, y) {
  for (const c of clouds) {
    if (Math.hypot(x - c.x, y - c.y) < 46) { puffCloud(c); return; }
  }
  for (const d of debtors) {
    if (d.phase === 'wait' && Math.hypot(x - slotX(d.slot), y - HEART_Y) < HEART_R + 14) { heartTap(d); return; }
  }
  const b = demandBtn();
  if (Math.abs(x - b.x) < b.w / 2 + 4 && Math.abs(y - b.y) < b.h / 2 + 6) demand();
}

// Keyboard: a number picks a person (or puffs the thought in front of them)
function slotKey(i) {
  const d = debtors.find((o) => o.slot === i && o.phase === 'wait');
  if (!d) return;
  const c = clouds.find((o) => Math.abs(o.x - slotX(i)) < 52);
  if (c) { puffCloud(c); return; }
  heartTap(d);
}
function nextKey() {
  const w = waiting();
  if (!w.length) return;
  slotKey(w.reduce((a, b) => (a.patience < b.patience ? a : b)).slot);
}

const demandBtn = () => ({ x: SERV_X(), y: HEART_Y + 2, w: 104, h: 38 });

// Grumpy thoughts ("He owes me!") drift across and cover the hearts until puffed away
const GRUMBLES = ['He owes me!', 'Pay up!', 'Mine!', 'Hmph!'];
function spawnCloud() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  clouds.push({
    x: dir > 0 ? SERV_X() + 60 : W + 60, y: HEART_Y - 4, vx: dir * rand(28, 40 + level * 4),
    text: pick(GRUMBLES), phase: rand(0, TAU),
  });
}
function puffCloud(c) {
  clouds.splice(clouds.indexOf(c), 1);
  for (let i = 0; i < 16; i++) spawn(c.x + rand(-30, 30), c.y + rand(-12, 12), rand(-80, 80), rand(-80, 20), 0.6, '#ffffff', rand(4, 8));
  floatText(c.x, c.y - 30, 'Puff!', '#6a7a8a', 18);
  sfx.puff(0.3);
}

function updateTown(dt) {
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; fail('night'); return; }
  spawnT -= dt;
  if (spawnT <= 0) trySpawn();
  if (cfg.clouds) {
    cloudT -= dt;
    if (cloudT <= 0) { if (clouds.length < 2) spawnCloud(); cloudT = cfg.clouds * rand(0.7, 1.3); }
  }
  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    c.x += c.vx * dt;
    if (c.x < SERV_X() + 40 || c.x > W + 90) clouds.splice(i, 1);
  }
  let firstArrival = null;
  for (let i = debtors.length - 1; i >= 0; i--) {
    const d = debtors[i];
    const p = d.p;
    if (d.pulse) d.pulse = Math.max(0, d.pulse - dt);
    if (d.phase === 'in') {
      p.tx = slotX(d.slot);
      if (Math.abs(p.x - p.tx) < 3) {
        d.phase = 'wait';
        lookAt(p, servant.x, servant.y - 60);
        firstArrival = d;
      }
    } else if (d.phase === 'wait') {
      p.tx = slotX(d.slot);
      d.patience -= dt;
      const f = d.patience / cfg.patience;
      p.mood = f < 0.35 ? 'worried' : 'watch';
      if (d.patience <= 0) {
        // They sigh and wander off, but they'll be back: forgive them next time!
        d.phase = 'sad'; d.slot = -1; p.mood = 'dismay'; p.tx = W + 90 + offX;
        queue.push(d.debt);
        floatText(p.x, NOTE_Y - 10, 'They’ll be back…', '#7a6a9a', 18);
        sfx.tone(300, 0.3, 'triangle', 0.15, 0, 220);
      }
    } else if (d.phase === 'joy') {
      d.t -= dt;
      if (d.t <= 0) { d.phase = 'home'; d.slot = -1; p.tx = W + 90 + offX; }
    } else if (d.phase === 'home' || d.phase === 'sad') {
      if (p.x >= W + 80 + offX) { debtors.splice(i, 1); continue; }
    }
    tickPerson(p, dt);
  }
  if (firstArrival && (!bubble || bubble.t <= 0)) {
    const d = firstArrival;
    const text = d.debt.again ? pick(AGAIN) : forgiven === 0 && level === 1 ? verseText('beg') : pick(PLEAS);
    say(d.p, text); bubble.t = 2.6;
  }
  if (servant.moodT > 0) { servant.moodT -= dt; if (servant.moodT <= 0) servant.mood = 'watch'; }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const forgiveScore = cfg.N * 100;
  const timeBonus = Math.round(timeLeft * 10);
  const levelBonus = level * 500;
  const score = forgiveScore + timeBonus + countBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('forgivenBest', best); } catch (e) {} }
  lastScore = { forgiveScore, timeBonus, countBonus, levelBonus, score };
  // Everyone forgiven comes out to celebrate
  const seen = new Set();
  cheer = [];
  for (const d of debtors) seen.add(d.debt.who.name);
  const folk = FOLK.filter((f) => !seen.has(f.name)).slice(0, Math.max(0, Math.floor((W - 200) / 90)));
  folk.forEach((f, k) => {
    const p = person(f, 60 + k);
    p.s = 0.95; p.y = STREET_Y - 58; p.x = lerp(SERV_X() + 70, W - 40, folk.length === 1 ? 0.5 : k / (folk.length - 1)); p.mood = 'joy';
    cheer.push(p);
  });
  for (const d of debtors) { d.p.mood = 'joy'; if (d.phase === 'home') d.p.tx = d.p.x; }
  clouds = [];
  servant.mood = 'joy';
  hint = null;
  showMessage('The whole town is glowing!');
  Music.ambience(false);
  sfx.win();
  endTimer = 2.6;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  hint = null;
  if (reason === 'night') {
    for (const d of debtors) d.p.mood = 'dismay';
    servant.mood = 'dismay';
    showMessage('Night has fallen…');
  }
  Music.ambience(false);
  sfx.fail();
  endTimer = reason === 'demand' ? 0.6 : 1.6;
}

function showMessage(text) { message = { text, t: 2.4 }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  scene = 'frame';
  setCrowd('watch');
  showOverlay('The Unforgiving Servant', 'A parable of forgiving from the heart',
    `${verseHTML('howOft')}
     ${verseHTML('seventy')}
     <ul>
       <li>Jesus tells a story about a king who forgave his servant a <b>mountain of debt</b>&hellip;</li>
       <li>First, help Peter <b>count to seventy times seven</b> &mdash; tap as fast as you can!</li>
       <li>Then <b>you</b> are the forgiven servant. Neighbours come who owe you a little. <b>Tap the heart</b> under each one to forgive them and light up the town before night falls.</li>
       <li>Puff away the grumpy thoughts. And will you <b>Demand</b> payment? Choose well&hellip;</li>
       <li><b>Keyboard:</b> <kbd>Space</kbd> to count and continue; in town <kbd>1</kbd>&ndash;<kbd>5</kbd> forgive a person, <kbd>Space</kbd> the one waiting longest, <kbd>D</kbd> demand.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Tell the story', () => { level = 1; totalScore = 0; seenStory = false; startLevel(false); });
}

function resetLevelState() {
  cfg = makeConfig(level);
  particles = []; floaters = []; ripples = [];
  debtors = []; clouds = []; cheer = []; queue = [];
  bubble = null; banner = null; hint = null; cut = null; count = null;
  shakeT = flashT = 0;
  endTimer = 0;
  lightMul = 1; glowF = 0;
}

// skipIntro: a retry goes straight back to the town instead of retelling the story
function startLevel(skipIntro = false) {
  resetLevelState();
  if (!skipIntro) { seenIntro = false; countBonus = 0; }
  state = 'play';
  hideOverlay();
  setScene(skipIntro ? 'town' : 'frame', true);
  if (!skipIntro) showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
  Music.ambience(true);
}

function restartLevel() { startLevel(seenIntro); }

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  Music.ambience(false);
  if (state === 'win') {
    const s = lastScore;
    const h = Bible.verse(VERSES.hearts);
    showOverlay('The town is lit with love!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('compassion')}
       <p class="verse">Jesus’s point: forgive one another &ldquo;${h.text}&rdquo; &mdash; ${h.cite}</p>
       <p class="score">Debts forgiven: <b>${s.forgiveScore}</b><br>Counting to ${countGoal().goal}: <b>${s.countBonus}</b><br>Before nightfall: <b>${s.timeBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(false); });
  } else if (state === 'fail') {
    const demandFail = failReason === 'demand';
    showOverlay(demandFail ? 'Oh… no' : 'Night has fallen', `Level ${level} — ${cfg.name}`,
      demandFail
        ? `<p style="text-align:center">The servant who was forgiven so much would not forgive a little. The king was very sad. Try again &mdash; and forgive everyone!</p>
           ${verseHTML('wouldNot')}
           <p class="score">Score so far: <b>${totalScore}</b></p>`
        : `<p style="text-align:center">The sun went down before everyone was forgiven. Your neighbours are still waiting! Be quicker with your kindness.</p>
           ${verseHTML('beg')}
           <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    Music.ambience(false);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', restartLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
    if (!sfx.muted) Music.ambience(true);
  }
}

// ============================================================
//  Input
// ============================================================
// One tap = one action. x/y are playfield coordinates.
function handleTap(x, y) {
  if (state !== 'play' || fade) return;
  if (cut) { if (cut.t > 0.35) nextBeat(); return; }
  if (scene === 'count') countTap();
  else if (scene === 'town') townTap(x, y);
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { restartLevel(); return; }
  if (e.repeat || state !== 'play' || fade) return;
  const act = e.code === 'Space' || e.code === 'Enter';
  if (cut) { if (act && cut.t > 0.35) nextBeat(); return; }
  if (scene === 'count' && act) countTap();
  else if (scene === 'town') {
    const m = /^(?:Digit|Numpad)([1-5])$/.exec(e.code);
    if (m) slotKey(+m[1] - 1);
    else if (act) nextKey();
    else if (e.code === 'KeyD') demand();
  }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  handleTap(p.x, p.y);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

// The market bustle must never keep playing after leaving the page
window.addEventListener('pagehide', () => Music.ambience(false));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Music.ambience(false);
  else if (state === 'play' && !sfx.muted) Music.ambience(true);
});

function goHome() { Music.ambience(false); location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound: the shared harp-and-pipe engine (music.js) plus small effects
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full chords from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      if (state === 'play') Music.ambience(true);
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    if (this.muted) Music.ambience(false);
    else if (state === 'play') Music.ambience(true);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  // One note per tap, climbing the tune's scale as the count (or the town's light) grows
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.1);
    Music.tap(height);
  },
  // A warm glowing chime when someone is forgiven
  chime(height) {
    if (!this.ctx) return;
    Music.tap(height);
    [1, 1.26, 1.5, 2].forEach((m, i) => this.tone(660 * m, 0.5, 'sine', 0.08, i * 0.06));
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  grumble() { this.tone(170, 0.4, 'triangle', 0.22, 0, 110); },
};

function drawHillside() {
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#fff3cf');
  g.addColorStop(0.35, '#ffe9b0');
  g.addColorStop(0.62, '#b9e0f7');
  g.addColorStop(1, '#8fcaf0');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  const x0 = -offX - 10, x1 = W + offX + 10;

  // soft clouds
  for (const [f, y, w] of [[0.15, 210, 130], [0.55, 150, 110], [0.88, 250, 140]]) drawCloud(W * f + Math.sin(t * 0.1 + f * 9) * 20, y, w, w * 0.3, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');

  // Sea of Galilee far away, then hills
  ctx.fillStyle = '#8cc7e8';
  ctx.fillRect(x0, 560, x1 - x0, 60);
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 600 + Math.sin(x / 90) * 16 + Math.sin(x / 37) * 5);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#86b95d';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, 700 + Math.sin(x / 140) * 10);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#6f9e4a';
  ctx.fillRect(x0, H - 40, x1 - x0, 60);

  // Flowers
  for (let i = 0; i < 26; i++) {
    const fx = x0 + hash(i) * (x1 - x0), fy = 715 + hash(i + 9) * 150;
    ctx.fillStyle = ['#ffffff', '#ffd43b', '#ff8fab'][i % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
  }

  // The rock Jesus stands on
  const jx = W * 0.74;
  ctx.fillStyle = '#b8a888';
  ctx.beginPath(); ctx.ellipse(jx, 752, 70, 26, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#9f8f70';
  ctx.fillRect(jx - 70, 750, 140, 8);
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function drawFrameScene() {
  drawHillside();
  jesus.x = W * 0.74; jesus.y = 740; jesus.s = W < 560 ? 1.55 : 1.75;
  const slots = crowdSlots();
  for (const d of slots) lookAt(d, jesus.x, jesus.y - 90);
  peter.lookX = 0.9; peter.lookY = -0.3;
  for (const d of slots) if (d.y < 800) drawPerson(d);
  drawJesus(jesus);
  for (const d of slots) if (d.y >= 800) drawPerson(d);
  if (scene === 'count' && count) drawCountPanel();
}

function drawCountPanel() {
  const c = count;
  const w = Math.min(W - 32, 540), x = W / 2 - w / 2, y = 128, h = 230;
  ctx.save();
  ctx.fillStyle = 'rgba(255,250,232,0.94)'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;

  ctx.font = '600 12px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a40';
  ctx.fillText(v.cite, W / 2, y + 50);
  // the big number
  const pop = 1 + (c.started ? 0.06 * Math.max(0, Math.sin(t * 20)) : 0);

  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';

  ctx.font = '600 15px Fredoka, sans-serif'; ctx.fillStyle = '#7a6640';
  ctx.fillText(`of ${c.goal}`, W / 2, y + 144);
  // progress
  const bw = w - 60, bx = W / 2 - bw / 2;
  ctx.fillStyle = 'rgba(90,66,16,0.18)'; roundRect(bx, y + 162, bw, 16, 8); ctx.fill();
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#ffe27a');
  ctx.fillStyle = gg;
  if (c.n > 0) { roundRect(bx, y + 162, bw * c.n / c.goal, 16, 8); ctx.fill(); }
  // timer: a little sand bar
  const tf = c.timeLeft / cfg.countTime;
  ctx.fillStyle = 'rgba(90,66,16,0.12)'; roundRect(bx, y + 192, bw, 10, 5); ctx.fill();
  ctx.fillStyle = tf < 0.25 && Math.sin(t * 10) > 0 ? '#ff8a6b' : '#8ec5e8';

  ctx.font = '600 12px Fredoka, sans-serif'; ctx.fillStyle = '#7a6640';
  ctx.fillText(c.started ? `${Math.ceil(c.timeLeft)}s` : 'The timer starts on your first tap', W / 2, y + 217);
  ctx.restore();
}

function drawCoinPile() {
  if (pileF <= 0.001) return;
  const cx = pileX(), base = 800;
  const sc = clamp(W / 900, 0.62, 1.1);
  const keep = Math.round(PILE.length * pileF);
  ctx.save();
  ctx.translate(cx, base); ctx.scale(sc, sc);
  // glow
  const g = ctx.createRadialGradient(0, -80, 10, 0, -80, 190);
  g.addColorStop(0, 'rgba(255,225,120,0.45)'); g.addColorStop(1, 'rgba(255,225,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -80, 190, 0, TAU); ctx.fill();
  for (let i = 0; i < keep; i++) {
    const c = PILE[i];
    ctx.fillStyle = '#c98e1b';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 2, 12, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.r > 0.5 ? '#ffd24a' : '#f7c948';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 12, 7, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 7, 4, 0, 0, TAU); ctx.stroke();
  }
  // sparkles glinting on the mountain
  for (let i = 0; i < 5; i++) {
    const a = Math.max(0, Math.sin(t * 3 + i * 1.7));
    const c = PILE[Math.floor(hash(i * 5) * keep)];
    if (!c) continue;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 8); ctx.lineTo(c.x + 2, c.y); ctx.lineTo(c.x, c.y + 8); ctx.lineTo(c.x - 2, c.y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(c.x - 8, c.y); ctx.lineTo(c.x, c.y + 2); ctx.lineTo(c.x + 8, c.y); ctx.lineTo(c.x, c.y - 2); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  Rendering: the town at sunset
// ============================================================
const STARS = Array.from({ length: 50 }, (_, i) => ({ f: hash(i + 400), y: hash(i + 500) * 420, r: 0.8 + hash(i + 600) * 1.6 }));
const HOUSE_COLS = ['#e9cfa0', '#e3bf8c', '#f0dcb4', '#d9b27e', '#ecd6aa'];
const HOUSE_ROOFS = ['#c9ad7e', '#c29f6c', '#d0bb92', '#b8925e', '#cbb488'];

function nightNow() {
  if (scene === 'story') return 0.3;
  return lerp(0.08, 1, 1 - timeLeft / cfg.time);
}

function drawTownScene() {
  const night = clamp(nightNow(), 0, 1) * (1 - glowF * 0.4);
  const lit = scene === 'story' ? 0 : (state === 'win' ? 1 : forgiven / cfg.N);
  const x0 = -offX - 10, x1 = W + offX + 10;

  // sky from sunset gold to deep evening blue
  const g = ctx.createLinearGradient(0, -offY, 0, 720);
  g.addColorStop(0, mix('#ffcf8a', '#1d2150', night));
  g.addColorStop(0.6, mix('#ffe2a8', '#3a3a78', night));
  g.addColorStop(1, mix('#ffd9a0', '#5a4a80', night));
  ctx.fillStyle = g; ctx.fillRect(-offX, -offY, viewW, viewH);

  // the setting sun, then the moon and stars
  const sunY = lerp(330, 640, night);
  ctx.fillStyle = `rgba(255,190,90,${1 - night})`;
  ctx.beginPath(); ctx.arc(W * 0.78, sunY, 48, 0, TAU); ctx.fill();
  if (night > 0.3) {
    const a = clamp((night - 0.3) * 1.6, 0, 1);
    for (const s of STARS) {
      ctx.fillStyle = `rgba(255,255,230,${a * (0.6 + 0.4 * Math.sin(t * 2 + s.f * 20))})`;
      ctx.beginPath(); ctx.arc(x0 + s.f * (x1 - x0), s.y - offY * 0.5, s.r, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,250,220,${a})`;
    ctx.beginPath(); ctx.arc(W * 0.2, 190, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = mix('#ffcf8a', '#1d2150', night);
    ctx.beginPath(); ctx.arc(W * 0.2 + 11, 183, 22, 0, TAU); ctx.fill();
  }

  // the king's palace on the hill behind the town
  ctx.fillStyle = dusk('#e8c890', night * 0.8);
  const px = W * 0.14;
  ctx.fillRect(px - 70, 400, 140, 120);
  ctx.beginPath(); ctx.arc(px, 400, 48, Math.PI, TAU); ctx.fill();
  ctx.fillRect(px - 92, 360, 22, 160); ctx.fillRect(px + 70, 360, 22, 160);
  ctx.fillStyle = dusk('#f5c542', night * 0.6);
  ctx.beginPath(); ctx.moveTo(px - 4, 352); ctx.lineTo(px, 336); ctx.lineTo(px + 4, 352); ctx.fill();

  // houses
  let x = x0 - 20, i = 0, win = 0;
  while (x < x1) {
    const w = 104 + hash(i) * 56, h = 170 + hash(i + 50) * 90;
    const top = 730 - h;
    const col = HOUSE_COLS[Math.floor(hash(i + 90) * HOUSE_COLS.length)];
    ctx.fillStyle = dusk(col, night * 0.62);
    roundRect(x, top, w, h + 10, 4); ctx.fill();
    ctx.fillStyle = dusk(HOUSE_ROOFS[HOUSE_COLS.indexOf(col)], night * 0.62);
    ctx.fillRect(x - 4, top - 8, w + 8, 12);
    // windows light up as people are forgiven
    const nw = w > 128 ? 2 : 1;
    for (let k = 0; k < nw; k++) {
      const wx = x + (nw === 1 ? w / 2 : w * (k === 0 ? 0.3 : 0.7));
      const on = hash(win + 300) < lit - 0.001 || lit >= 1;
      win++;
      if (on) {
        const gl = ctx.createRadialGradient(wx, top + 50, 4, wx, top + 50, 46);
        gl.addColorStop(0, `rgba(255,220,120,${0.55 * lightMul})`); gl.addColorStop(1, 'rgba(255,220,120,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(wx, top + 50, 46, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = on ? mix('#5a4a3a', '#ffd76a', lightMul) : dusk('#5a4a3a', night * 0.5);
      roundRect(wx - 12, top + 34, 24, 30, [12, 12, 2, 2]); ctx.fill();
    }
    // door
    ctx.fillStyle = dusk('#8a5a32', night * 0.6);
    roundRect(x + w * 0.5 - 13 + (nw === 1 ? 26 : 0), 730 - 46, 26, 48, [13, 13, 0, 0]); ctx.fill();
    x += w + 8; i++;
  }

  // street
  ctx.fillStyle = dusk('#d8c4a0', night * 0.55);
  ctx.fillRect(x0, 728, x1 - x0, H - 728 + 20);
  ctx.strokeStyle = dusk('#c2ab84', night * 0.55); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let r = 0; r < 5; r++) {
    const yy = 750 + r * 34;
    for (let cx = x0 + (r % 2) * 22; cx < x1; cx += 44) { ctx.moveTo(cx, yy); ctx.lineTo(cx + 30, yy); }
  }
  ctx.stroke();

  drawLanterns(night, lit);
}

// A string of lanterns across the street: one for every debt forgiven
function drawLanterns(night, lit) {
  const n = cfg.N;
  const xa = 8, xb = W - 8, ya = 470, sag = 44;
  ctx.strokeStyle = dusk('#6b4a2b', night * 0.5); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k <= 30; k++) { const f = k / 30; const yy = ya + Math.sin(f * Math.PI) * sag; k ? ctx.lineTo(lerp(xa, xb, f), yy) : ctx.moveTo(xa, yy); }
  ctx.stroke();
  const litN = Math.round(lit * n);
  for (let k = 0; k < n; k++) {
    const f = (k + 0.5) / n;
    const lx = lerp(xa, xb, f), ly = ya + Math.sin(f * Math.PI) * sag + 6 + Math.sin(t * 2 + k) * 1.5;
    const on = scene !== 'story' && k < litN;
    const col = ['#ff8a5b', '#ffd24a', '#ff6fa0', '#7fd1ff', '#9be27a'][k % 5];
    if (on) {
      const rr = 30 + glowF * 14;
      const gl = ctx.createRadialGradient(lx, ly + 8, 2, lx, ly + 8, rr);
      gl.addColorStop(0, `rgba(255,230,140,${0.7 * lightMul})`); gl.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(lx, ly + 8, rr, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = dusk('#6b4a2b', night * 0.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(lx, ly - 4); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = on ? mix(dusk(col, 0.6), col, lightMul) : dusk(col, 0.25 + night * 0.5);
    roundRect(lx - 7, ly, 14, 18, 6); ctx.fill();
    ctx.fillStyle = dusk('#6b4a2b', night * 0.4);
    ctx.fillRect(lx - 5, ly - 1, 10, 3); ctx.fillRect(lx - 5, ly + 16, 10, 3);
  }
}

function drawHeartButton(d) {

function drawDemandButton() {

  ctx.save();
  ctx.fillStyle = 'rgba(110,110,120,0.85)'; ctx.strokeStyle = 'rgba(60,60,70,0.9)'; ctx.lineWidth = 2;
  roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, b.h / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2f2f2'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Demand', b.x, b.y + 1);
  ctx.restore();
}

function drawGrumpyCloud(c) {
  const y = c.y + Math.sin(t * 2 + c.phase) * 3;
  drawCloud(c.x, y, 92, 40, '#8b92a5', '#646b7c');
  ctx.strokeStyle = '#2d3140'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c.x - 14, y - 14); ctx.lineTo(c.x - 4, y - 10);
  ctx.moveTo(c.x + 14, y - 14); ctx.lineTo(c.x + 4, y - 10);
  ctx.stroke();
  ctx.fillStyle = '#2d3140';
  ctx.beginPath(); ctx.arc(c.x - 8, y - 5, 2.2, 0, TAU); ctx.arc(c.x + 8, y - 5, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(c.x, y + 6, 4.5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(c.text, c.x, y - 30);
}

function drawTownPeople() {
  for (const p of cheer) drawPerson(p);
  if (scene === 'story') {
    drawPerson(fellow);
  }
  for (const d of debtors) {
    if (d.phase === 'wait' && scene === 'town' && state === 'play') drawDebtTablet(d);
    drawPerson(d.p);
  }
  drawPerson(servant);
  if (king.x > -60) drawPerson(king);
  if (scene === 'town' && state === 'play') {
    for (const d of debtors) if (d.phase === 'wait') drawHeartButton(d);
    drawDemandButton();
    for (const c of clouds) drawGrumpyCloud(c);
  }
}

// ============================================================
//  Rendering: words on screen
// ============================================================
function drawSpeech(text, ax, ay, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 44, 420);
  const lines = wrapText(text, maxW - 26);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(ax - w * 0.35, 10, W - 10 - w);
  const by = clamp(ay - 22 - h, 132, H - 20 - h);
  const tx = clamp(ax, bx + 20, bx + w - 20);
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  if (ay > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h); ctx.stroke();
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(tx - 9, by + h - 5, 18, 4);
  }
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawBubble() {
  if (!bubble || bubble.t <= 0) return;
  const h = bubble.who === jesus ? { x: jesus.x, y: jesus.y - 78 * jesus.s } : headOf(bubble.who);
  drawSpeech(bubble.text, h.x, h.y, clamp(bubble.t / 0.3, 0, 1));
}

function drawBanner() {
  if (!banner || banner.t <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1) * clamp(banner.age / 0.3, 0, 1);
  const maxW = Math.min(W - 32, 700);
  ctx.font = 'italic 600 19px Fredoka, sans-serif';
  const lines = wrapText(banner.text, maxW - 36);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = Math.min(maxW, Math.max(tw, banner.cite ? 150 : 0) + 36), h = lines.length * 24 + (banner.cite ? 34 : 18);
  const bx = W / 2 - w / 2, by = 116;
  ctx.fillStyle = 'rgba(255,246,220,0.95)'; ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 2.5;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a14'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 9 + 12 + i * 24));
  if (banner.cite) {
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a40';
    ctx.fillText(banner.cite, W / 2, by + h - 13);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = `700 ${W < 560 ? 22 : 26}px Fredoka, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = scene === 'count' ? 400 : scene === 'town' ? 400 : H * 0.36;
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function drawHint() {
  if (!hint || hint.t <= 0 || state !== 'play' || cut) return;
  ctx.save();
  ctx.globalAlpha = clamp(hint.t / 0.4, 0, 1) * (0.8 + 0.2 * Math.sin(t * 4));
  ctx.font = `700 ${W < 560 ? 17 : 20}px Fredoka, sans-serif`;
  ctx.textAlign = 'center';
  const lines = wrapText(hint.text, W - 40);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  const y0 = scene === 'count' ? 400 : 560;
  lines.forEach((l, i) => {
    ctx.strokeText(l, W / 2, y0 + i * 24);
    ctx.fillStyle = '#7a4a00';
    ctx.fillText(l, W / 2, y0 + i * 24);
  });
  ctx.restore();
}

// "Tap to continue" at the foot of each story beat
function drawContinue() {
  if (!cut || state !== 'play' || cut.t < 0.6) return;
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.3 * Math.sin(t * 4);
  ctx.font = '600 15px Fredoka, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const x = W - 34, y = H - 22;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const label = isTouch() ? 'Tap to continue' : 'Tap or Space to continue';
  ctx.strokeText(label, x, y);
  ctx.fillStyle = '#7a4a00'; ctx.fillText(label, x, y);
  ctx.beginPath(); ctx.moveTo(x + 8, y - 7); ctx.lineTo(x + 18, y); ctx.lineTo(x + 8, y + 7); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const nightHud = scene === 'town' || scene === 'demand' ? clamp(nightNow(), 0, 1) > 0.55 : false;
  const ink = nightHud ? '#fff4d6' : '#5a4210';
  if (nightHud) ctx.shadowColor = 'rgba(0,0,0,0.6)';

  // Left: level + progress
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Unforgiving Servant' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 13px Fredoka, sans-serif';
  const sub = { frame: 'Jesus tells a story', count: 'Count with Peter!', king: 'In the king’s palace', story: 'How the story goes…', town: `Forgiven ${forgiven} / ${cfg.N}`, demand: `Forgiven ${forgiven} / ${cfg.N}` }[scene];
  if (state !== 'title') ctx.fillText(sub, 12, 48);

  // Pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: time until night falls (a little sun sliding into a moon)
  if (state !== 'title' && (scene === 'town' || scene === 'demand')) {
    const rx = viewW - 12;
    const f = clamp(timeLeft / cfg.time, 0, 1);
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('BEFORE NIGHTFALL', rx, 20);
    ctx.shadowBlur = 0;
    const bw = 120, bx = rx - bw;
    ctx.fillStyle = 'rgba(90,66,16,0.3)'; roundRect(bx, 28, bw, 12, 6); ctx.fill();
    const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    gg.addColorStop(0, '#7a8ad8'); gg.addColorStop(1, '#ffc95a');
    ctx.fillStyle = f < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
    if (f > 0) { roundRect(bx, 28, bw * f, 12, 6); ctx.fill(); }
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(bx + bw * f, 34, 8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c98e1b'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (scene === 'frame' || scene === 'count') drawFrameScene();
  else if (scene === 'king') drawKingScene();
  else { drawTownScene(); drawTownPeople(); }
  drawParticles();
  drawFloaters();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBanner();
  drawBubble();
  drawMessage();
  drawHint();
  drawContinue();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,225,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fade) {
    const a = fade.t < FADE ? fade.t / FADE : 1 - (fade.t - FADE) / FADE;
    ctx.fillStyle = `rgba(255,244,220,${clamp(a, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  sceneT += dt;
  updateParticles(dt);
  updateFade(dt);
  for (const d of DISCIPLES) tickPerson(d, dt);
  if (servant) tickPerson(servant, dt);
  if (king) tickPerson(king, dt);
  if (fellow) tickPerson(fellow, dt);
  for (const p of cheer) tickPerson(p, dt);
  if (state === 'play' && !fade) {
    if (cut) {
      cut.t += dt;
      if (cut.t >= cut.dur) nextBeat();
    }
    if (scene === 'count') updateCount(dt);
    else if (scene === 'town') updateTown(dt);
    else if (scene === 'demand') for (const d of debtors) tickPerson(d.p, dt);
    if (scene === 'king' && pileF < 1) pileF = Math.max(0, pileF - dt * 1.2);
  } else if (state === 'win') {
    glowF = Math.min(1, glowF + dt * 0.8);
    for (const d of debtors) tickPerson(d.p, dt);
    if (Math.random() < dt * 10) {
      spawn(rand(0, W), rand(420, 700), rand(-10, 10), rand(-60, -20), 1.4, ['#ffe27a', '#fff6d0', '#ffb3c7'][Math.floor(rand(0, 3))], rand(3, 6), 0, Math.random() < 0.4);
    }
  } else if (state === 'fail') {
    for (const d of debtors) tickPerson(d.p, dt);
  }
  if (banner) banner.age = (banner.age || 0) + dt;
  if (bubble && bubble.t < 90) bubble.t -= dt;
  if (hint && hint.t < 90) hint.t -= dt;
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

servant = newServant();
king = newKing();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
