<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Jesus Is Baptised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Jesus Is Baptised</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound: the shared music engine (music.js) with this game's tune, instruments and ambience
Music.theme = { tune: 'doxology', instrument: 'harp', accent: 'pipe', ambience: 'birds', percussion: false };

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  cometh:    { ref: 'Matthew 3:13', KJV: 'Then cometh Jesus from Galilee to Jordan unto John, to be baptized of him.', NKJV: 'Then Jesus came from Galilee to John at the Jordan to be baptized by him.', NIV: 'Then Jesus came from Galilee to the Jordan to be baptized by John.', NLT: 'Then Jesus went from Galilee to the Jordan River to be baptized by John.' },
  prepare:   { ref: 'Matthew 3:3',  KJV: 'Prepare ye the way of the Lord, make his paths straight.', NKJV: 'Prepare the way of the Lord; Make His paths straight.', NIV: 'Prepare the way for the Lord, make straight paths for him.', NLT: 'Prepare the way for the Lord’s coming! Clear the road for him!' },
  needThee:  { ref: 'Matthew 3:14', KJV: 'I have need to be baptized of thee, and comest thou to me?', NKJV: 'I need to be baptized by You, and are You coming to me?', NIV: 'I need to be baptized by you, and do you come to me?', NLT: 'I am the one who needs to be baptized by you... so why are you coming to me?' },
  sufferIt:  { ref: 'Matthew 3:15', KJV: 'Suffer it to be so now: for thus it becometh us to fulfil all righteousness.', NKJV: 'Permit it to be so now, for thus it is fitting for us to fulfill all righteousness.', NIV: 'Let it be so now; it is proper for us to do this to fulfill all righteousness.', NLT: 'It should be done, for we must carry out all that God requires.' },
  dove:      { ref: 'Matthew 3:16', KJV: 'The heavens were opened unto him, and he saw the Spirit of God descending like a dove, and lighting upon him.', NKJV: 'The heavens were opened to Him, and He saw the Spirit of God descending like a dove and alighting upon Him.', NIV: 'Heaven was opened, and he saw the Spirit of God descending like a dove and alighting on him.', NLT: 'The heavens were opened and he saw the Spirit of God descending like a dove and settling on him.' },
  beloved:   { ref: 'Matthew 3:17', KJV: 'This is my beloved Son, in whom I am well pleased.', NKJV: 'This is My beloved Son, in whom I am well pleased.', NIV: 'This is my Son, whom I love; with him I am well pleased.', NLT: 'This is my dearly loved Son, who brings me great joy.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function isTouch() { return matchMedia('(pointer: coarse)').matches; }

// ============================================================
//  Tuning
// ============================================================
const RIVER_TOP = 440;    // far edge of the Jordan
const RIVER_BOT = 770;    // near edge (the riverbank path)
const FAR_Y = 432;        // where the baptised stand on the far bank
const JOHN_Y = 560;       // John's feet (he stands waist-deep)
const HOP_T = 0.3;        // seconds for one hop between stones
const STONE_LAG = 0.36;   // seconds between neighbouring stones rising
const GRAV = 90;          // the dove sinks gently...
const FLAP_UP = 95;       // ...and each flap lifts it
const FLAP_X = 85;        // sideways push from a flap
const RISE_MAX = 150;     // flaps can't send it upward faster than this
const FLAP_GAP = 0.1;     // fastest flap rate

const LEVEL_NAMES = [
  'The River Jordan',
  'Bethabara Crossing',
  'Breezy Banks',
  'Wilderness Winds',
  'The Open Heavens',
  'Rushing Waters',
];

function makeConfig(n) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  return {
    name: LEVEL_NAMES[n - 1] || `Jordan ${n}`,
    // Part 1: the stepping stones
    people: Math.min(2 + n, 7),
    stones: 4 + Math.min(Math.floor((n - 1) / 2), 3),
    period: Math.max(3.4 - 0.3 * (n - 1), 1.9),      // seconds for one swell of the river
    upFrac: Math.max(0.74 - 0.04 * (n - 1), 0.5),    // share of each swell a stone is dry
    lives: n === 1 ? 5 : 3,
    // Part 2: the dove
    skyLen: Math.min(1700 + 600 * (n - 1), 4700),
    baseWind: dir * Math.min(6 + 10 * (n - 1), 60),
    band: n === 1 ? 10 : Math.min(18 + 10 * n, 80),
    gust: n === 1 ? 4 : Math.min(8 + 6 * n, 50),
    rain: n === 1 ? 2 : Math.min(2 + 2 * (n - 1), 11),
    fallMax: Math.min(105 + 7 * (n - 1), 145),
    landV: Math.max(150 - 13 * (n - 1), 75),
    landHalf: Math.max(40 - 4 * (n - 1), 22),
    hitCost: n === 1 ? 20 : 25,
    sparkles: 10 + 3 * n,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'river';      // inside 'play': river (part 1) | story | dove (part 2)
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('baptismBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let people = [];
let cur = 0;              // index of the person crossing now
let lives = 5;
let part1Score = 0;
let cleanCrossings = 0;
let splashedThisTrip = false;
let storyDelay = 0;
let failT = 0;             // counts down to the 'too many splashes' card
let story = { step: 0, t: 0 };
let calmF = 0;            // 0 = flowing river, 1 = calm (stones stay up)
let jesusP = null;        // Jesus in the scene
let dove = null;
let sparkles = [];
let rainClouds = [];
let skyClouds = [];
let particles = [];
let camY = 0;             // camera: 0 shows the river; negative looks up the sky
let heavenOpen = 0;
let message = { text: '', t: 0 };
let bubble = null;        // { who: 'john'|'jesus'|person, key?, text?, t }
let banner = null;        // golden voice-from-heaven banner
let caption = null;       // small verse caption at the top of the river
let peace = 100;
let sparkCount = 0;
let hitCd = 0, flapCd = 0;
let shockT = 0, joyT = 0, flashT = 0, shakeT = 0, worryT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let failPhase = 'river';
let gust = 0, gustTarget = 0, gustTimer = 0;
let windSeed = 0;

const john = {
  hair: '#3a2414', skin: '#c68a52', i: 1,
  mood: 'watch', switchT: 0, delay: 0.1, blink: 0, blinkT: 2,
  pose: 'idle', honeyT: 6, honeyAnim: 0, bee: 0,
};

// ============================================================
//  Riverside people
// ============================================================
const ROBES = ['#3f6fb5', '#6b8e3a', '#b5503f', '#d9a13a', '#7a4fa0', '#3c8f86', '#a0673a', '#c46b8c', '#4b7f4b', '#b08a2e', '#5a6475'];
const SKINS = ['#d9a066', '#c98d56', '#d7a070', '#e3b184', '#c58a55', '#b87a48', '#d39a66', '#bf8150'];
const HAIRS = ['#4a2f1a', '#2e1d10', '#6b3f1d', '#1f140c', '#8a8a8a', '#3a2716'];
const SCARVES = ['#e8dcc0', '#c9b27a', '#d8c7a0', '#e6b8c8', '#b8d4e6'];

function makePerson(i) {
  const child = i % 4 === 2;
  const scarf = !child && Math.random() < 0.4 ? SCARVES[i % SCARVES.length] : null;
  return {
    i, robe: ROBES[(i * 3 + 1) % ROBES.length], skin: SKINS[(i * 5) % SKINS.length],
    hair: HAIRS[i % HAIRS.length], beard: !child && !scarf && Math.random() < 0.6, scarf,
    s: child ? 0.7 : 0.86,
    mood: 'watch', switchT: 0, delay: rand(0.05, 0.45), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU),
    st: 'queue', x: 0, y: 0, pos: 0, from: null, to: 0, tt: 0, alpha: 1, dip: 0, tilt: 0, farK: 0,
  };
}

// ============================================================
//  Scene geometry
// ============================================================
let geomCache = null, geomKey = '';
function geom() {
  const key = W + ':' + cfg.stones + ':' + cfg.period;
  if (key === geomKey) return geomCache;
  const n = cfg.stones;
  const jx = Math.min(W - 95, W / 2 + 330);
  const padX = jx - 50, padY = JOHN_Y + 6;
  const start = { x: Math.max(60, padX - 90 - n * 95), y: 792 };
  const pts = [start];
  const dx = padX - start.x, dy = padY - start.y;
  for (let i = 1; i <= n; i++) {
    const f = i / (n + 1);
    const zig = (i % 2 ? -1 : 1) * 12;
    pts.push({ x: start.x + dx * f, y: start.y + dy * f + zig });
  }
  pts.push({ x: padX, y: padY });
  // The swell reaches each stone STONE_LAG seconds after the one before, so a
  // steady hopper can keep pace with the dry stones on any screen width.
  const waveLen = (dx / (n + 1)) * cfg.period / STONE_LAG;
  geomKey = key;
  geomCache = { jx, padX, padY, start, pts, waveLen, rock: { x: jx + 46, y: JOHN_Y + 16 } };
  return geomCache;
}

function queueSpot(k) {
  const g = geom();
  return { x: g.start.x + 50 + k * 42, y: 850 };
}
function farSpot(k) {
  const n = cfg.people;
  return { x: lerp(W * 0.08, W * 0.72, (k + 0.5) / n), y: FAR_Y };
}

// Stones sink as each swell of the river flows past (left to right)
function riverPhase(x) {
  const p = t / cfg.period - x / geom().waveLen;
  return ((p % 1) + 1) % 1;
}
function stoneH(i) {
  const g = geom();
  if (i <= 0 || i > cfg.stones) return 1;
  const ph = riverPhase(g.pts[i].x);
  const e = 0.07;
  const raw = ph < cfg.upFrac ? Math.min(clamp(ph / e, 0, 1), clamp((cfg.upFrac - ph) / e, 0, 1)) : 0;
  return lerp(raw, 1, calmF);
}
function stoneSafe(i) { return stoneH(i) > 0.2; }        // forgiving: a stone just breaking the surface still holds
function stoneGood(i) { return stoneH(i) > 0.5 && !stoneWarn(i); }   // clearly dry: a good moment to hop
function stoneWarn(i) {
  if (i <= 0 || i > cfg.stones || calmF > 0.5) return false;
  const ph = riverPhase(geom().pts[i].x);
  return ph > cfg.upFrac - 0.13 && ph < cfg.upFrac;
}

// ============================================================
//  Wind (part 2)
// ============================================================
function windAt(y) {
  let w = cfg.baseWind + cfg.band * Math.sin(y / 230 + windSeed) + cfg.gust * gust;
  if (y > 250) w *= 0.35;     // sheltered down by the river
  return w;
}

function updateGust(dt) {
  gustTimer -= dt;
  if (gustTimer <= 0) {
    gustTarget = rand(-1, 1) * (Math.random() < 0.3 ? 1.6 : 1);
    gustTimer = rand(1, 3.5);
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 1.2);
}

// ============================================================
//  Crowd moods
// ============================================================
function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'shock';
  if (joyT > 0) return 'joy';
  if (worryT > 0) return 'worried';
  if (phase === 'story' && story.step >= 4) return 'wow';
  if (phase === 'dove' && dove && dove.y > -200) return 'wow';
  return 'watch';
}

function updateMood(d, target, dt) {
  if (target !== d.mood) {
    d.switchT += dt;
    if (d.switchT > d.delay) { d.mood = target; d.switchT = 0; }
  } else d.switchT = 0;
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

function updateCrowd(dt) {
  const target = crowdMood();
  for (const p of people) {
    let want = target;
    // the person in the river has their own feelings
    if (p.st === 'swim') want = 'worried';
    else if (p.st === 'dip' || (p.st === 'wade' && p.tt < 1.2)) want = 'joy';
    else if (people[cur] === p && state === 'play' && phase === 'river' && worryT > 0) want = 'worried';
    updateMood(p, want, dt);
  }
  let jm = target === 'shock' ? 'wow' : target;
  if (phase === 'story' && story.step === 2) jm = 'wow';
  updateMood(john, jm, dt);
}

function lookTarget() {
  if (phase === 'dove' && dove) return { x: dove.x, y: dove.y };
  if ((phase === 'story' || state === 'win') && jesusP) return { x: jesusP.x, y: jesusP.y - 50 };
  const p = people[cur];
  if (p && state !== 'title') return { x: p.x, y: p.y - 40 };
  return { x: geom().jx, y: JOHN_Y - 60 };
}

// ============================================================
//  Drawing people (the disciple style, with reacting faces)
// ============================================================
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// waterY (optional): hide everything below this line, for people standing in the river
function drawPerson(d, x, y, s, waterY = null, extra = {}) {
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy' && !waterY) jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  if (extra.alpha !== undefined) ctx.globalAlpha = extra.alpha;
  if (waterY !== null) {
    ctx.beginPath(); ctx.rect(x - 200, y - 400, 400, waterY - (y - 400)); ctx.clip();
  }
  ctx.translate(x, y - jump * s);
  if (extra.tilt) ctx.rotate(extra.tilt);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  const lt = lookTarget();
  let lx = 0, ly = -1;
  {
    const dx = lt.x - x, dy = lt.y - (y - 52 * s);
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  if (mood === 'watch' || (mood === 'wow' && d.i % 3 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    if (extra.swim) { arm(-11, -32, -26, -44); arm(11, -32, 26, -44); }  // paddling
    else { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }                // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Water drips after a dunking
  if (extra.wet) {
    ctx.fillStyle = 'rgba(124,196,242,0.9)';
    for (let k = 0; k < 3; k++) {
      const yy = hy + 6 + ((t * 40 + k * 13) % 30);
      ctx.beginPath(); ctx.arc(-17 + k * 17, yy, 2, 0, TAU); ctx.fill();
    }
  }

  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
  if (waterY !== null && (extra.alpha === undefined || extra.alpha > 0.3)) waterRing(x, waterY, 20 * s);
}

// A little ripple where someone stands in the water
function waterRing(x, y, r) {
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, r + Math.sin(t * 4) * 2, r * 0.28, 0, 0, TAU); ctx.stroke();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  John the Baptist: camel's hair, leather belt, wild honey
// ============================================================
function drawJohn(x, y) {
  const s = 1.1;
  const waterY = y - 26 * s;
  const pose = john.pose;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 200, y - 400, 400, waterY - (y - 400)); ctx.clip();
  ctx.translate(x, y);
  ctx.scale(s, s);

  const fur = '#b8864b', furDark = '#8a5f2e';
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = john.skin; ctx.lineWidth = 7; ctx.lineCap = 'round';   // bare, sunburnt arms
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = shade('#c68a52', -15); ctx.beginPath(); ctx.arc(x2, y2, 4.2, 0, TAU); ctx.fill();
  };

  // Arms behind the body
  const m = john.mood;
  if (m === 'joy') {
    const wave = Math.sin(t * 9) * 4;
    arm(-12, -34, -26 + wave, -70); arm(12, -34, 26 - wave, -70);
  }

  // Shaggy camel-hair tunic
  ctx.fillStyle = fur; ctx.strokeStyle = furDark; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-19, 2);
  ctx.quadraticCurveTo(-18, -32, -12, -40);
  ctx.quadraticCurveTo(0, -44, 12, -40);
  ctx.quadraticCurveTo(18, -32, 19, 2);
  for (let k = 0; k <= 8; k++) ctx.lineTo(19 - k * 4.75, k % 2 ? 7 : 2);   // tufted hem
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // fur tufts
  ctx.strokeStyle = furDark; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const [fx, fy] of [[-9, -30], [6, -26], [-4, -12], [10, -8], [-12, -4], [2, -36]]) {
    ctx.moveTo(fx, fy); ctx.lineTo(fx + 2, fy + 4); ctx.moveTo(fx + 3, fy); ctx.lineTo(fx + 5, fy + 4);
  }
  ctx.stroke();
  // leathern girdle about his loins
  ctx.strokeStyle = '#6b3f1d'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-18, -18); ctx.quadraticCurveTo(0, -15, 18, -18); ctx.stroke();
  ctx.fillStyle = '#d9b36a'; ctx.fillRect(-3, -20, 6, 5);

  // Front arms by pose
  if (m !== 'joy') {
    if (pose === 'dip') { arm(-12, -34, -34, -20); arm(12, -34, -26, -34); }
    else if (pose === 'humble') { arm(-12, -34, -2, -30); arm(12, -34, 2, -30); }
    else if (pose === 'honey') {
      const f = john.honeyAnim;   // 0..1: reach to the pot, then lick the finger
      const reach = f < 0.45 ? ease(f / 0.45) : f < 0.6 ? 1 : 1 - ease((f - 0.6) / 0.4);
      arm(-12, -34, -16, -13);
      arm(12, -34, lerp(8, 34, reach), lerp(-66, -14, reach));
    } else { arm(-12, -34, -16, -13); arm(12, -34, 16, -13); }
  }

  // Head with wild hair and a big beard
  const hy = -56;
  ctx.fillStyle = john.hair;
  ctx.beginPath();
  for (let k = 0; k < 9; k++) {
    const a = Math.PI * (0.85 + k * 0.165);
    const r = 21 + (k % 2) * 4;
    ctx.moveTo(Math.cos(a) * r + 6, hy + Math.sin(a) * r);
    ctx.arc(Math.cos(a) * (r - 6), hy + Math.sin(a) * (r - 6), 7, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = john.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  ctx.fillStyle = john.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(4, hy - 9, -2, hy - 10);
  ctx.quadraticCurveTo(-9, hy - 10, -16, hy - 4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-15, hy + 1);
  ctx.quadraticCurveTo(-17, hy + 27, 0, hy + 29);
  ctx.quadraticCurveTo(17, hy + 27, 15, hy + 1);
  ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
  ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 1);
  ctx.fill();

  drawFace(john, pose === 'honey' && john.honeyAnim > 0.62 ? 'joy' : m, hy, ...johnLook(x, y, s));

  if (m === 'shock') { arm(-12, -34, -15, hy + 4); arm(12, -34, 15, hy + 4); }
  ctx.restore();
  waterRing(x, waterY, 24);
}
function johnLook(x, y, s) {
  if (john.pose === 'honey') return [0.8, 0.5];
  const lt = lookTarget();
  const dx = lt.x - x, dy = lt.y - (y - 56 * s);
  const len = Math.hypot(dx, dy) || 1;
  return [dx / len, dy / len];
}

function drawHoneyPot(r) {
  // a flat rock peeking out of the water
  ctx.fillStyle = '#9a8f80';
  ctx.beginPath(); ctx.ellipse(r.x, r.y, 30, 11, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b5ab9c';
  ctx.beginPath(); ctx.ellipse(r.x - 3, r.y - 3, 26, 7, 0, 0, TAU); ctx.fill();
  waterRing(r.x, r.y + 5, 30);
  // the pot of wild honey
  const px = r.x + 2, py = r.y - 4;
  ctx.fillStyle = '#c9773a'; ctx.strokeStyle = '#8a4a1e'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px - 9, py - 24);
  ctx.quadraticCurveTo(px - 17, py - 12, px - 11, py);
  ctx.lineTo(px + 11, py);
  ctx.quadraticCurveTo(px + 17, py - 12, px + 9, py - 24);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a85f2a'; roundRect(px - 11, py - 28, 22, 5, 2); ctx.fill();
  // golden honey drip
  ctx.fillStyle = '#ffc93c';
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 24); ctx.lineTo(px + 8, py - 24);
  ctx.lineTo(px + 6, py - 20); ctx.quadraticCurveTo(px + 4, py - 12 + Math.sin(t * 1.5) * 2, px + 2, py - 20);
  ctx.lineTo(px - 8, py - 21); ctx.closePath(); ctx.fill();
  // a busy bee doing loops round the pot (and round John when he's licking his finger)
  const g = geom();
  const nearJohn = john.pose === 'honey' && john.honeyAnim > 0.55;
  const cx = nearJohn ? g.jx + 10 : px, cy = nearJohn ? JOHN_Y - 80 : py - 36;
  const bx = cx + Math.cos(t * 3.1) * 20, by = cy + Math.sin(t * 6.2) * 8;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(bx - 2, by - 5, 3.5, 2.2, -0.5 + Math.sin(t * 40) * 0.4, 0, TAU); ctx.ellipse(bx + 2, by - 5, 3.5, 2.2, 0.5 - Math.sin(t * 40) * 0.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffcf33';
  ctx.beginPath(); ctx.ellipse(bx, by, 5, 3.6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3b2f1e'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(bx - 1, by - 3); ctx.lineTo(bx - 1, by + 3); ctx.moveTo(bx + 2, by - 3); ctx.lineTo(bx + 2, by + 3); ctx.stroke();
}

function updateJohn(dt) {
  if (phase === 'story' || state === 'win') return;
  // Comic touch: now and then John helps himself to a fingerful of wild honey
  if (john.pose === 'honey') {
    john.honeyAnim += dt / 2.4;
    if (john.honeyAnim >= 1) { john.pose = 'idle'; john.honeyT = rand(7, 12); }
  } else if (john.pose === 'idle') {
    john.honeyT -= dt;
    const busy = people[cur] && (people[cur].st === 'hop' || people[cur].st === 'dip');
    if (john.honeyT <= 0 && !busy && phase === 'river') {
      john.pose = 'honey'; john.honeyAnim = 0;
      if (Math.random() < 0.5 || state === 'title') setTimeout(() => {
        if (john.pose === 'honey') say('john', null, ['Mmm, wild honey!', 'Locusts, anyone?', 'Sweet as can be!'][Math.floor(rand(0, 3))], 1.6);
      }, 1300);
      setTimeout(() => sfx.buzz(), 900);
    }
  }
}

// ============================================================
//  Jesus (drawn as in Jesus Rises, without His cloud)
// ============================================================
function drawJesus(j) {
  const s = 1.12;
  ctx.save();
  if (j.waterY !== null && j.waterY !== undefined) {
    ctx.beginPath(); ctx.rect(j.x - 200, j.y - 400, 400, j.waterY - (j.y - 400)); ctx.clip();
  }
  ctx.translate(j.x, j.y + (j.dip || 0));
  if (j.tilt) ctx.rotate(j.tilt);
  ctx.scale(s, s);

  const up = j.arms === 'up';

  if (j.glow) {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 80);
    g.addColorStop(0, `rgba(255,235,150,${0.6 * j.glow})`);
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 80, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: raised in praise, or open and welcoming
  let hands = up ? [[-21, -66], [21, -66]] : [[-20, -22], [20, -22]];
  if (j.arms === 'pray') hands = [[-3, -30], [3, -30]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
  if (j.waterY !== null && j.waterY !== undefined) waterRing(j.x, j.waterY, 22);
}

// ============================================================
//  The dove
// ============================================================
function drawDove(d) {
  ctx.save();
  ctx.translate(d.x, d.y);
  // soft light around the Spirit
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
  g.addColorStop(0, 'rgba(255,245,200,0.7)');
  g.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
  ctx.scale(d.face, 1);
  if (!d.perched) ctx.rotate(clamp(d.vy / 600, -0.25, 0.3));
  if (d.hurt > 0) ctx.rotate(Math.sin(t * 30) * 0.2);

  const wing = d.perched ? 0 : Math.sin(d.flapAnim);
  // back wing
  ctx.fillStyle = '#e4ecf5';
  ctx.beginPath();
  ctx.moveTo(-2, -3);
  ctx.quadraticCurveTo(-8, -18 - wing * 16, -22, -22 - wing * 18);
  ctx.quadraticCurveTo(-12, -8, -2, 2);
  ctx.fill();
  // tail fan
  ctx.fillStyle = '#f4f7fb';
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-27, -6); ctx.lineTo(-29, 3); ctx.lineTo(-26, 9); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c9d6e4'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 1, 16, 10, -0.1, 0, TAU); ctx.fill(); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(13, -7, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
  // beak & eye
  ctx.fillStyle = '#f0a73a';
  ctx.beginPath(); ctx.moveTo(19.5, -8); ctx.lineTo(26, -6); ctx.lineTo(19.5, -4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b1d12';
  ctx.beginPath(); ctx.arc(15, -8.5, 1.5, 0, TAU); ctx.fill();
  // front wing
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c9d6e4';
  ctx.beginPath();
  if (d.perched) {
    ctx.ellipse(-3, 0, 12, 6, -0.15, 0, TAU);
  } else {
    ctx.moveTo(2, -2);
    ctx.quadraticCurveTo(-4, -20 - wing * 20, -18, -30 - wing * 24);
    ctx.quadraticCurveTo(-6, -10 - wing * 6, -6, 4);
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  Clouds, sparkles, particles
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// A sleepy rain cloud: harmless, but it bumps the dove about
function drawRainCloud(c) {
  const bob = Math.sin(t * 1.3 + c.phase) * 3;
  const y = c.y + bob;
  ctx.strokeStyle = 'rgba(110,160,220,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 5; k++) {
    const dx = -c.w / 2 + 16 + k * (c.w - 32) / 4;
    const dy = ((t * 60 + k * 17) % 34);
    ctx.moveTo(c.x + dx, y + 16 + dy); ctx.lineTo(c.x + dx - 2, y + 22 + dy);
  }
  ctx.stroke();
  drawCloud(c.x, y, c.w + 16, c.h, c.hit > 0 ? '#c3cbe0' : '#aeb8cf', '#8e98b2');
  // sleepy face
  ctx.strokeStyle = '#4b5470'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  if (c.hit > 0) {
    ctx.arc(c.x - 9, y - 7, 3, 0, TAU); ctx.moveTo(c.x + 12, y - 7); ctx.arc(c.x + 9, y - 7, 3, 0, TAU);
  } else {
    ctx.arc(c.x - 9, y - 8, 4, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.moveTo(c.x + 13, y - 7); ctx.arc(c.x + 9, y - 8, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  }
  ctx.moveTo(c.x - 3, y + 4); ctx.quadraticCurveTo(c.x, y + 6, c.x + 3, y + 4);
  ctx.stroke();
  if (c.hit <= 0) {
    ctx.fillStyle = '#6a7390'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'left';
    const zz = (t * 0.8 + c.phase) % 1;
    ctx.globalAlpha = 1 - zz;
    ctx.fillText('z', c.x + c.w / 2 - 6 + zz * 10, y - c.h / 2 - zz * 18);
    ctx.globalAlpha = 1;
  }
}

function drawSparkle(sp) {
  const tw = 0.75 + 0.25 * Math.sin(t * 5 + sp.phase);
  const r = 13 * tw;
  const g = ctx.createRadialGradient(sp.x, sp.y, 1, sp.x, sp.y, 24);
  g.addColorStop(0, 'rgba(255,225,120,0.9)');
  g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sp.x, sp.y, 24, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fffbe6';
  ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + t * 0.6;
    ctx.lineTo(sp.x + Math.cos(a) * r, sp.y + Math.sin(a) * r);
    ctx.lineTo(sp.x + Math.cos(a + Math.PI / 4) * r * 0.35, sp.y + Math.sin(a + Math.PI / 4) * r * 0.35);
  }
  ctx.closePath(); ctx.fill();
}

function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function splashFx(x, y, n = 22) {
  for (let i = 0; i < n; i++) {
    const a = rand(Math.PI * 1.1, Math.PI * 1.9), sp = rand(60, 170);
    spawn(x + rand(-8, 8), y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1), i % 3 ? '#bfe6ff' : '#ffffff', rand(2.5, 5), 320);
  }
}

// ============================================================
//  Part 1: along the riverbank, over the stepping stones
// ============================================================
function placePeople() {
  people.forEach((p, k) => {
    const q = queueSpot(k);
    p.st = 'queue'; p.x = q.x; p.y = q.y; p.pos = 0; p.alpha = 1; p.dip = 0; p.tilt = 0; p.wet = false; p.farK = k;
  });
}

function currentQueueSlot(p) {
  // people still waiting shuffle along the bank
  return people.indexOf(p) - cur - 1;
}

function hop() {
  const p = people[cur];
  if (!p || p.st !== 'stand' || failT > 0) return;
  const g = geom();
  if (p.pos >= g.pts.length - 1) return;
  p.st = 'hop'; p.from = { x: p.x, y: p.y }; p.to = p.pos + 1; p.tt = 0;
  sfx.hop();
}

function splashPerson(p) {
  p.st = 'swim'; p.tt = 0;
  lives--;
  splashedThisTrip = true;
  shockT = 1.1; shakeT = 0.25;
  splashFx(p.x, p.y - 4);
  sfx.splash();
  showMessage(['Splash! Whoops!', 'Glub, glub!', 'Soggy sandals!', 'Bit early for a dip!', 'Oops, into the Jordan!'][Math.floor(rand(0, 5))]);
  if (lives <= 0) failT = 0.9;   // let them bob a moment first
}

function updateRiver(dt) {
  const g = geom();
  const nPts = g.pts.length;
  worryT = Math.max(0, worryT - dt);
  for (const p of people) {
    switch (p.st) {
      case 'queue': {
        const q = queueSpot(Math.max(0, currentQueueSlot(p)));
        p.x += (q.x - p.x) * Math.min(1, dt * 4); p.y = q.y;
        break;
      }
      case 'walk': {
        const dx = g.start.x - p.x, dy = g.start.y - p.y;
        const d = Math.hypot(dx, dy);
        const step = 150 * dt;
        if (d <= step) { p.x = g.start.x; p.y = g.start.y; p.st = 'stand'; p.pos = 0; }
        else { p.x += dx / d * step; p.y += dy / d * step; }
        break;
      }
      case 'stand': {
        const pt = g.pts[p.pos];
        p.x = pt.x; p.y = pt.y - (p.pos > 0 && p.pos < nPts - 1 ? (1 - stoneH(p.pos)) * 6 : 0);
        if (p.pos > 0 && p.pos < nPts - 1) {
          if (stoneWarn(p.pos)) worryT = 0.2;
          if (stoneH(p.pos) < 0.12) splashPerson(p);
        }
        break;
      }
      case 'hop': {
        p.tt += dt / HOP_T;
        const to = g.pts[p.to];
        const f = Math.min(1, p.tt);
        p.x = lerp(p.from.x, to.x, f);
        p.y = lerp(p.from.y, to.y, f) - Math.sin(f * Math.PI) * 34;
        if (p.tt >= 1) {
          p.pos = p.to; p.x = to.x; p.y = to.y;
          if (p.pos === nPts - 1) startDip(p);
          else if (!stoneSafe(p.pos)) splashPerson(p);
          else {
            p.st = 'stand';
            for (let i = 0; i < 5; i++) spawn(p.x + rand(-14, 14), p.y, rand(-30, 30), rand(-50, -20), 0.4, '#ffffff', rand(2, 3), 200);
          }
        }
        break;
      }
      case 'swim': {
        p.tt += dt;
        p.x += 55 * dt;                       // the current carries them gently downstream
        if (p.tt > 1.3) p.alpha = Math.max(0, 1 - (p.tt - 1.3) / 0.4);
        if (p.tt > 1.7) {                     // clamber back out onto the bank
          p.st = 'stand'; p.pos = 0; p.x = g.start.x; p.y = g.start.y; p.alpha = 1; p.wet = true;
          for (let i = 0; i < 10; i++) spawn(p.x + rand(-16, 16), p.y - rand(0, 50), rand(-20, 20), rand(-20, 20), 0.6, '#ffffff', rand(2, 4));
        }
        break;
      }
      case 'dip': {
        p.tt += dt;
        const f = p.tt;
        // lowered back into the water... and raised up again
        const down = f < 0.55 ? ease(f / 0.55) : f < 0.85 ? 1 : 1 - ease(Math.min(1, (f - 0.85) / 0.45));
        p.dip = down * 60; p.tilt = -down * 0.6;
        if (f >= 0.55 && !p.splashed) { p.splashed = true; splashFx(p.x - 10, g.padY - 12, 18); sfx.splash(0.5); }
        if (f >= 1.3 && !p.risen) {
          p.risen = true; p.wet = true; joyT = 1.4;
          sfx.tap(0.4 + cur * 0.08);
          for (let i = 0; i < 24; i++) {
            const a = rand(0, TAU), sp = rand(30, 110);
            spawn(p.x, p.y - 40, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.2), ['#ffe27a', '#fff6d0', '#ffffff'][i % 3], rand(2, 4), 20);
          }
        }
        if (f >= 1.5) {
          john.pose = 'idle';
          p.dip = 0; p.tilt = 0;
          const gain = 100 + (splashedThisTrip ? 0 : 50);
          if (!splashedThisTrip) cleanCrossings++;
          part1Score += gain;
          showMessage(splashedThisTrip ? `Baptised! +${gain}` : `Baptised! Dry feet +${gain}`);
          p.st = 'wade'; p.tt = 0;
          nextPerson();
        }
        break;
      }
      case 'wade': {
        p.tt += dt;
        const fs = farSpot(p.farK);
        const dx = fs.x - p.x, dy = fs.y - p.y;
        const d = Math.hypot(dx, dy);
        const step = 110 * dt;
        if (d <= step) { p.x = fs.x; p.y = fs.y; p.st = 'done'; }
        else { p.x += dx / d * step; p.y += dy / d * step; }
        break;
      }
      case 'done': {
        const fs = farSpot(p.farK);
        p.x = fs.x; p.y = fs.y;
        break;
      }
    }
  }
  if (failT > 0) {
    failT -= dt;
    if (failT <= 0) { fail('splash'); return; }
  }
  if (storyDelay > 0) {
    storyDelay -= dt;
    if (storyDelay <= 0) startStory();
  }
}

function startDip(p) {
  p.st = 'dip'; p.tt = 0; p.splashed = false; p.risen = false;
  john.pose = 'dip';
}

function nextPerson() {
  cur++;
  splashedThisTrip = false;
  if (cur < people.length) people[cur].st = 'walk';
  else storyDelay = 1.6;
}

// Where someone is in the water: returns the waterline to clip at, or null on dry land
function personWaterY(p) {
  const g = geom();
  const inRiver = p.y > RIVER_TOP + 4 && p.y < RIVER_BOT - 4;
  if (p.st === 'swim') return p.y - 38 * p.s;
  if (p.st === 'dip') return g.padY - 14;
  if (p.st === 'stand' && p.pos === g.pts.length - 1) return g.padY - 14;
  if (p.st === 'wade' && inRiver) return p.y - 16;
  return null;
}
function personScale(p) {
  // people further across the river look a little smaller
  return p.s * lerp(0.82, 1, clamp((p.y - FAR_Y) / (850 - FAR_Y), 0, 1));
}

// ============================================================
//  Story: Jesus comes, John hesitates, the heavens open
// ============================================================
const STORY_STEPS = [
  { id: 'enter', dur: 99 },
  { id: 'cross', dur: 99 },
  { id: 'john', dur: 4.2, skip: 0.8 },
  { id: 'jesus', dur: 4.0, skip: 0.8 },
  { id: 'dip', dur: 1.7 },
  { id: 'open', dur: 2.8 },
];

function startStory() {
  phase = 'story';
  caption = null;
  story = { step: 0, t: 0, hopT: 0, pos: 0 };
  jesusP = { x: -40, y: 820, face: 'calm', arms: 'open', dip: 0, tilt: 0, glow: 0, waterY: null };
  showMessage('Jesus comes from Galilee!');
}

function advanceStory() {
  story.step++; story.t = 0;
  const id = STORY_STEPS[story.step] ? STORY_STEPS[story.step].id : 'done';
  const g = geom();
  if (id === 'john') { john.pose = 'humble'; say('john', 'needThee', null, 4.2); }
  else if (id === 'jesus') { john.pose = 'idle'; say('jesus', 'sufferIt', null, 4.0); }
  else if (id === 'dip') { bubble = null; john.pose = 'dip'; }
  else if (id === 'open') {
    john.pose = 'idle';
    jesusP.dip = 0; jesusP.tilt = 0; jesusP.arms = 'up'; jesusP.face = 'joy'; jesusP.glow = 1;
    flashT = 0.5; heavenOpen = 0;
    sfx.levelStart(); sfx.shimmer();
    splashFx(g.padX, g.padY - 12, 24);
  } else if (id === 'done') startDove(false);
}

function updateStory(dt) {
  const g = geom();
  const j = jesusP;
  story.t += dt;
  calmF = Math.min(1, calmF + dt * 1.5);   // the river grows still for Him
  const id = STORY_STEPS[story.step].id;
  if (id === 'enter') {
    const dx = g.start.x - j.x, dy = g.start.y - j.y;
    const d = Math.hypot(dx, dy), step = 130 * dt;
    if (d <= step) { j.x = g.start.x; j.y = g.start.y; advanceStory(); story.pos = 0; story.hopT = 0.2; }
    else { j.x += dx / d * step; j.y += dy / d * step; }
  } else if (id === 'cross') {
    story.hopT -= dt;
    if (story.hopT <= 0 && !story.hopping) { story.hopping = { from: { x: j.x, y: j.y }, to: story.pos + 1, tt: 0 }; }
    if (story.hopping) {
      const h = story.hopping;
      h.tt += dt / 0.34;
      const to = g.pts[h.to], f = Math.min(1, h.tt);
      j.x = lerp(h.from.x, to.x, f); j.y = lerp(h.from.y, to.y, f) - Math.sin(f * Math.PI) * 26;
      if (h.tt >= 1) {
        story.pos = h.to; story.hopping = null; story.hopT = 0.12;
        if (story.pos === g.pts.length - 1) { j.waterY = g.padY - 14; advanceStory(); }
      }
    }
  } else if (id === 'dip') {
    const f = story.t;
    const down = f < 0.55 ? ease(f / 0.55) : f < 0.85 ? 1 : 1 - ease(Math.min(1, (f - 0.85) / 0.5));
    j.dip = down * 64; j.tilt = -down * 0.6;
    if (f >= 0.55 && !story.splashed) { story.splashed = true; splashFx(g.padX - 10, g.padY - 12, 20); sfx.splash(0.5); }
  } else if (id === 'open') {
    // the heavens open, and the camera looks up to see
    const f = clamp(story.t / STORY_STEPS[story.step].dur, 0, 1);
    heavenOpen = ease(clamp(f * 1.6, 0, 1));
    camY = lerp(0, camTop(), ease(clamp((f - 0.25) / 0.75, 0, 1)));
    if (Math.random() < dt * 20) spawn(j.x + rand(-40, 40), j.y - rand(0, 80), 0, -25, 1, '#fff6d0', 3);
  }
  if (story.t >= STORY_STEPS[story.step].dur) advanceStory();
}

function camTop() {
  return Math.min(0, -cfg.skyLen - 40 + offY);
}

// ============================================================
//  Part 2: guide the dove down from the opened heavens
// ============================================================
function startDove(retry) {
  const g = geom();
  phase = 'dove';
  state = 'play';
  syncAmbience();
  calmF = 1;
  heavenOpen = 1;
  bubble = null; banner = null;
  // everyone who was baptised watches from the far bank
  people.forEach((p) => { p.st = 'done'; const fs = farSpot(p.farK); p.x = fs.x; p.y = fs.y; p.alpha = 1; p.dip = 0; p.tilt = 0; p.wet = true; });
  cur = people.length;
  jesusP = { x: g.padX, y: g.padY, face: 'joy', arms: 'up', dip: 0, tilt: 0, glow: 0.6, waterY: g.padY - 14 };
  john.pose = 'idle';
  const top = -cfg.skyLen;
  const sx = level === 1 ? W / 2 : clamp(W / 2 + rand(-W * 0.25, W * 0.25), 60, W - 60);
  dove = { x: sx, y: top + 150, vx: 0, vy: 20, face: 1, flapAnim: 0, flapBurst: 0, perched: false, hurt: 0 };
  camY = camTop();
  peace = 100; sparkCount = 0; hitCd = 0; flapCd = 0;
  windSeed = rand(0, TAU);
  gust = 0; gustTarget = 0; gustTimer = 0;
  // light sparkles, mostly along a gentle path of light down to Jesus
  sparkles = [];
  const targetY = g.padY - 84;
  for (let i = 0; i < cfg.sparkles; i++) {
    const f = (i + 0.5) / cfg.sparkles;
    const y = lerp(top + 260, targetY - 150, f);
    const px = lerp(sx, g.padX, f) + Math.sin(f * 9 + windSeed) * W * 0.22 + rand(-30, 30);
    sparkles.push({ x: clamp(px, 30, W - 30), y, phase: rand(0, TAU) });
  }
  // sleepy rain clouds drifting across the sky
  rainClouds = [];
  for (let i = 0; i < cfg.rain; i++) {
    const f = (i + 0.5) / cfg.rain;
    rainClouds.push({
      x: rand(40, W - 40), y: lerp(top + 380, 120, f) + rand(-40, 40),
      vx: (Math.random() < 0.5 ? -1 : 1) * rand(10, 22 + level * 3), w: 104, h: 42, phase: rand(0, TAU), hit: 0,
    });
  }
  makeSkyClouds();
  particles = [];
  caption = null;
  if (!retry) showMessage('Guide the dove down to Jesus!');
  else { showMessage(`Level ${level}: the dove descends`); sfx.levelStart(); }
  if (level === 1) setTimeout(() => {
    if (state === 'play' && phase === 'dove') showMessage(isTouch() ? 'Tap beside the dove to flap that way' : '← → to flap sideways, ↑ / Space to lift');
  }, 2400);
}

function flap(ix) {
  const d = dove;
  if (!d || flapCd > 0 || d.perched) return;
  // a sideways flap mostly steers; a straight-up flap lifts
  d.vy = Math.max(d.vy - FLAP_UP * (1 - 0.8 * Math.abs(ix)), -RISE_MAX);
  d.vx += ix * FLAP_X;
  if (Math.abs(ix) > 0.2) d.face = ix > 0 ? 1 : -1;
  d.flapBurst = 0.32;
  flapCd = FLAP_GAP;
  for (let i = 0; i < 5; i++) spawn(d.x + rand(-10, 10), d.y + 8, -ix * 40 + rand(-20, 20), rand(30, 70), 0.5, Math.random() < 0.5 ? '#ffe27a' : '#ffffff', rand(2, 3.5));
  const g = geom();
  sfx.flap(1 - clamp((d.y - (-cfg.skyLen)) / (g.padY + cfg.skyLen), 0, 1));
}

function updateDove(dt) {
  const d = dove;
  const g = geom();
  flapCd = Math.max(0, flapCd - dt);
  hitCd = Math.max(0, hitCd - dt);
  d.hurt = Math.max(0, d.hurt - dt);

  d.vy = Math.min(d.vy + GRAV * dt, cfg.fallMax);   // wings spread: a gentle glide down
  d.vx += (windAt(d.y) - d.vx) * 0.8 * dt;
  d.x += d.vx * dt; d.y += d.vy * dt;
  if (d.flapBurst > 0) { d.flapBurst -= dt; d.flapAnim += dt * 26; }
  else d.flapAnim += dt * 3;

  if (d.x < 22) { d.x = 22; d.vx = Math.abs(d.vx) * 0.5; }
  if (d.x > W - 22) { d.x = W - 22; d.vx = -Math.abs(d.vx) * 0.5; }
  const top = -cfg.skyLen + 60;
  if (d.y < top) { d.y = top; d.vy = Math.max(d.vy, 0); }

  // camera follows, looking a little ahead (below)
  const want = clamp(d.y - H * 0.36, camTop(), 0);
  camY += (want - camY) * Math.min(1, dt * 4);

  // sparkles of light
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const sp = sparkles[i];
    if (Math.hypot(sp.x - d.x, sp.y - d.y) < 32) {
      sparkles.splice(i, 1);
      sparkCount++;
      for (let k = 0; k < 10; k++) {
        const a = rand(0, TAU), v = rand(30, 90);
        spawn(sp.x, sp.y, Math.cos(a) * v, Math.sin(a) * v, 0.6, k % 2 ? '#ffe27a' : '#fff6d0', rand(2, 3.5));
      }
      sfx.chime(sparkCount);
    }
  }

  // sleepy rain clouds
  for (const c of rainClouds) {
    c.x += c.vx * dt + windAt(c.y) * 0.25 * dt;
    if (c.x < -80) c.x = W + 80;
    if (c.x > W + 80) c.x = -80;
    c.hit = Math.max(0, c.hit - dt);
    if (hitCd <= 0 && Math.abs(d.x - c.x) < c.w / 2 + 6 && Math.abs(d.y - c.y) < c.h / 2 + 6) {
      d.vy = -120; d.vx = (d.x < c.x ? -1 : 1) * 110;
      d.hurt = 0.6; c.hit = 1; hitCd = 1;
      peace = Math.max(0, peace - cfg.hitCost);
      shakeT = 0.25;
      showMessage(['Bump! A sleepy rain cloud.', 'Oof! Soggy feathers!', 'Pardon me, cloud!'][Math.floor(rand(0, 3))]);
      sfx.bounce();
      if (peace <= 0) { fail('peace'); return; }
    }
  }

  // John's head: close, but not the One!
  const jh = { x: g.jx, y: JOHN_Y - 72 };
  if (hitCd <= 0 && Math.hypot(d.x - jh.x, d.y - jh.y) < 30) {
    d.vy = -130; d.vx = (d.x < jh.x ? -1 : 1) * 90; hitCd = 1;
    peace = Math.max(0, peace - 10);
    john.mood = 'wow'; shockT = 0.6;
    showMessage("That's John! Look for Jesus.");
    sfx.bounce();
    if (peace <= 0) { fail('peace'); return; }
  }

  // Landing on Jesus
  const tx = g.padX, ty = g.padY - 84;
  if (d.vy > 0 && d.y >= ty - 4 && d.y <= ty + 18 && Math.abs(d.x - tx) <= cfg.landHalf) {
    if (d.vy <= cfg.landV) { win(); return; }
    d.vy = -90; d.hurt = 0.4;
    peace = Math.max(0, peace - 8);
    showMessage('Gently now... flap to slow down');
    sfx.bounce();
    if (peace <= 0) { fail('peace'); return; }
  }
  if (d.y > ty + 50) { fail('river'); return; }
}

function tapDove(p) {
  // tap to the side of the dove to flap that way; above or on it to lift straight up
  const wy = p.y + camY;
  const dx = p.x - dove.x;
  let ix = clamp(dx / 120, -1, 1);
  if (Math.abs(dx) < 26 || (wy < dove.y - 60 && Math.abs(dx) < 60)) ix = 0;
  flap(ix);
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  const g = geom();
  const d = dove;
  state = 'win';
  syncAmbience();
  const soft = Math.round(clamp(cfg.landV - d.vy, 0, 150) * 2);
  d.perched = true; d.vx = 0; d.vy = 0;
  d.x = g.padX; d.y = g.padY - 88;
  jesusP.glow = 1; jesusP.arms = 'open'; jesusP.face = 'joy';
  const spark = sparkCount * 25;
  const calm = Math.round(peace * 3);
  const levelBonus = level * 500;
  const score = part1Score + spark + calm + soft + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('baptismBest', best); } catch (e) {} }
  lastScore = { people: part1Score, clean: cleanCrossings, spark, calm, soft, levelBonus, score };
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(d.x, d.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  banner = { key: 'beloved', age: 0 };
  flashT = 0.35;
  sfx.win();
  endTimer = 5;
}

function fail(reason) {
  if (state !== 'play') return;
  state = 'fail';
  syncAmbience();
  failReason = reason;
  failPhase = phase;
  if (reason === 'river' && dove) {
    const g = geom();
    splashFx(dove.x, g.padY - 10, 26);
    dove.y = g.padY - 18; dove.vx = 0; dove.vy = 0; dove.perched = true;
    sfx.splash();
  }
  sfx.fail();
  endTimer = 1.6;
}

function showMessage(text) { message = { text, t: 2.2 }; }

// A speech bubble: key = a verse (looked up as it's drawn), or plain text

function startLevel() {
  resetScene();
  lives = cfg.lives;
  part1Score = 0; cleanCrossings = 0; splashedThisTrip = false; storyDelay = 0; failT = 0;
  shockT = joyT = flashT = shakeT = worryT = 0;
  endTimer = 0;
  tapQueue.length = 0;
  ripples.length = 0;
  people[0].st = 'walk';
  state = 'play';
  syncAmbience();
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  caption = { key: 'prepare', t: 4.5 };
  sfx.levelStart();
  if (level === 1) setTimeout(() => {
    if (state === 'play' && phase === 'river' && cur === 0) showMessage(isTouch() ? 'Tap to hop when the next stone is dry' : 'Space / → to hop when the stone is dry');
  }, 2400);

function retry() {
  if (failPhase === 'dove') { state = 'play'; hideOverlay(); endTimer = 0; shockT = flashT = shakeT = 0; tapQueue.length = 0; startDove(true); }
  else startLevel();
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Well pleased!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('beloved')}
       <p class="score">People baptised: <b>${s.people}</b><br>Sparkles of light: <b>${s.spark}</b><br>Peaceful flight: <b>${s.calm}</b><br>Gentle landing: <b>${s.soft}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = {
      splash: ['Too many splashes!', 'The swell swept folk off the stones. Hop when the stone ahead has risen out of the foam.'],
      river: ['Splash into the Jordan!', 'The dove missed Jesus and landed in the water. Flap gently to steer onto Him.'],
      peace: ['Ruffled feathers!', 'The sleepy rain clouds bumped the dove once too often. Glide round them.'],
    }[failReason];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('dove')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', retry);
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Rest a while by the river. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

const tapQueue = [];
const ripples = [];

function gameAction(kind) {
  if (state !== 'play') return;
  if (phase === 'river') {
    if (kind !== 'left') hop();
  } else if (phase === 'story') {
    const st = STORY_STEPS[story.step];
    if (st.skip !== undefined && story.t > st.skip) advanceStory();
  } else if (phase === 'dove') {
    flap(kind === 'left' ? -1 : kind === 'right' ? 1 : 0);
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') gameAction('left');
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') gameAction('right');
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') gameAction('up');
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  if (tapQueue.length < 4) tapQueue.push({ x: p.x, y: p.y });
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

function applyTaps() {
  while (tapQueue.length) {
    const tp = tapQueue.shift();
    if (state !== 'play') continue;
    if (phase === 'dove') tapDove(tp);
    else gameAction('tap');
  }
}
