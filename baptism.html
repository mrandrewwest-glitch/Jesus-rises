// ============================================================
//  Note names to frequencies (used by the chime and shimmer effects)
// ============================================================
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35, freq = 1100) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // --- small extras for the river and the dove ---
  splash(vol = 0.8) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t0); lp.frequency.exponentialRampToValueAtTime(300, t0 + 0.5);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.65);
    this.tone(500, 0.12, 'sine', 0.2 * vol, 0, 180);
  },
  hop() { this.tone(520, 0.1, 'sine', 0.18, 0, 760); },
  flap(height) { this.puff(0.2, 700); this.tone(lerp(500, 900, clamp(height, 0, 1)), 0.08, 'sine', 0.06); },
  chime(n) {
    const f = noteFreq(TAP_SCALE[n % TAP_SCALE.length]) * 2;
    this.tone(f, 0.35, 'triangle', 0.14); this.tone(f * 1.5, 0.3, 'sine', 0.06, 0.05);
  },
  shimmer() { for (let k = 0; k < 6; k++) this.tone(noteFreq(TAP_SCALE[3 + k % 6]) * 2, 0.5, 'sine', 0.07, k * 0.08); },
  buzz() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), l = this.ctx.createOscillator(), lg = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 190; l.frequency.value = 22; lg.gain.value = 18;
    l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.035, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
    o.connect(g); g.connect(this.master);
    o.start(t0); l.start(t0); o.stop(t0 + 0.75); l.stop(t0 + 0.75);
  },
};

// ============================================================
//  Rendering
// ============================================================
function drawSky() {
  const top = -cfg.skyLen - 300;
  const g = ctx.createLinearGradient(0, top, 0, RIVER_TOP);
  g.addColorStop(0, '#fff3cf');
  g.addColorStop(0.15, '#ffe9b0');
  g.addColorStop(0.45, '#b9e0f7');
  g.addColorStop(1, '#8fcaf0');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, camY - offY, viewW, viewH);
}

// The heavens opened: a golden gap in the clouds at the top of the sky
function drawHeavens() {
  const top = -cfg.skyLen;
  const cx = W / 2, cy = top + 110;
  if (camY - offY > cy + 400) return;
  const o = heavenOpen;
  // rim of clouds, always there
  for (let k = -3; k <= 3; k++) {
    drawCloud(cx + k * 110 * (0.8 + o * 0.35), cy + Math.abs(k) * 8 - 10, 150, 50, '#ffffff', '#e9eef8');
  }
  if (o <= 0) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.05);
  const rays = ctx.createRadialGradient(0, 0, 20, 0, 0, 1300);
  rays.addColorStop(0, `rgba(255,244,190,${0.4 * o})`);
  rays.addColorStop(1, 'rgba(255,244,190,0)');
  ctx.fillStyle = rays;
  for (let i = 0; i < 16; i++) {
    ctx.rotate(TAU / 16);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1300); ctx.lineTo(60, -1300); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const r = 160 * o;
  const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, r * 1.6);
  glow.addColorStop(0, 'rgba(255,255,245,1)');
  glow.addColorStop(0.45, 'rgba(255,238,170,0.8)');
  glow.addColorStop(1, 'rgba(255,238,170,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.6, r * 0.8, 0, 0, TAU); ctx.fill();
}

// A soft path of light from the opened heavens down to Jesus
function drawLightColumn() {
  if (!jesusP || heavenOpen <= 0 || phase === 'river') return;
  const g = geom();
  const top = -cfg.skyLen + 110;
  const a = state === 'win' ? 0.45 : level <= 2 ? 0.16 : 0.09;
  const grd = ctx.createLinearGradient(0, top, 0, g.padY);
  grd.addColorStop(0, `rgba(255,245,200,${a * heavenOpen})`);
  grd.addColorStop(1, `rgba(255,245,200,${a * 0.6 * heavenOpen})`);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 110, top); ctx.lineTo(W / 2 + 110, top);
  ctx.lineTo(g.padX + 34, g.padY - 20); ctx.lineTo(g.padX - 34, g.padY - 20);
  ctx.closePath(); ctx.fill();
}

function drawLand() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // distant hills of the wilderness
  ctx.fillStyle = '#d9c18f';
  ctx.beginPath(); ctx.moveTo(x0, RIVER_TOP);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 300 + Math.sin(x / 110) * 22 + Math.sin(x / 41) * 7);
  ctx.lineTo(x1, RIVER_TOP); ctx.fill();
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, RIVER_TOP);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 355 + Math.sin(x / 80 + 1) * 14);
  ctx.lineTo(x1, RIVER_TOP); ctx.fill();
  // palms on the far bank
  for (const f of [0.05, 0.38, 0.62, 0.96]) {
    const x = W * f, y = 405;
    const sway = Math.sin(t * 1.4 + f * 9) * 3;
    ctx.strokeStyle = '#8a6a3f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - 40, x + sway, y - 78); ctx.stroke();
    ctx.strokeStyle = '#5f9a44'; ctx.lineWidth = 5;
    for (let k = 0; k < 6; k++) {
      const a = Math.PI * (1.05 + k * 0.18);
      ctx.beginPath(); ctx.moveTo(x + sway, y - 78);
      ctx.quadraticCurveTo(x + sway + Math.cos(a) * 20, y - 88 + Math.sin(a) * 12, x + sway + Math.cos(a) * 36, y - 70 + Math.sin(a) * 4 + 12);
      ctx.stroke();
    }
  }
  // far bank
  ctx.fillStyle = '#e6d3a1';
  ctx.beginPath(); ctx.moveTo(x0, 395);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, 398 + Math.sin(x / 60) * 4);
  ctx.lineTo(x1, RIVER_TOP + 10); ctx.lineTo(x0, RIVER_TOP + 10); ctx.fill();
}

function drawRiver() {
  const g = geom();
  const x0 = -offX - 10, x1 = W + offX + 10;
  const grd = ctx.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  grd.addColorStop(0, '#6fb9d8'); grd.addColorStop(1, '#3d8fbf');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.moveTo(x0, RIVER_TOP + 6);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, RIVER_TOP + 6 + Math.sin(x / 50 + t) * 2);
  ctx.lineTo(x1, RIVER_BOT + 6); ctx.lineTo(x0, RIVER_BOT + 6); ctx.fill();

  // the swell: foamy bands flowing downstream; stones under them are covered
  if (calmF < 1) {
    ctx.save();
    ctx.globalAlpha = 1 - calmF;
    const L = g.waveLen, base = t / cfg.period;
    const wav = (y, k) => Math.sin(y / 38 + t * 2 + k) * 9;
    // each band covers riverPhase in [upFrac, 1): x = L * (base - q - k)
    for (let k = Math.floor(base - 1 - x1 / L) - 1; k <= Math.ceil(base - x0 / L) + 1; k++) {
      const xa = L * (base - 1 - k), xb = L * (base - cfg.upFrac - k);
      if (xb < x0 - 20 || xa > x1 + 20) continue;
      ctx.fillStyle = 'rgba(225,244,255,0.22)';
      ctx.beginPath();
      for (let y = RIVER_TOP + 10; y <= RIVER_BOT; y += 10) ctx.lineTo(xa + wav(y, 0), y);
      for (let y = RIVER_BOT; y >= RIVER_TOP + 10; y -= 10) ctx.lineTo(xb + wav(y, 2), y);
      ctx.closePath(); ctx.fill();
      // foamy crest along the leading edge of the swell
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      for (let y = RIVER_TOP + 10; y <= RIVER_BOT; y += 8) ctx.lineTo(xb + wav(y, 2), y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  // ripples flowing left to right
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let r = 0; r < 7; r++) {
    const y = RIVER_TOP + 30 + r * 45;
    const speed = 40 * (1 - calmF * 0.8);
    for (let k = 0; k < 6; k++) {
      const span = viewW + 120;
      const x = x0 - 60 + ((k * span / 6 + t * speed + r * 57) % span);
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 12, y - 4, x + 24, y);
    }
  }
  ctx.stroke();

  // the baptism spot: a sandy shallow by John
  ctx.fillStyle = 'rgba(236,214,160,0.5)';
  ctx.beginPath(); ctx.ellipse(g.padX + 20, g.padY - 2, 90, 22, 0, 0, TAU); ctx.fill();

  // stepping stones
  for (let i = 1; i <= cfg.stones; i++) {
    const p = g.pts[i];
    const h = stoneH(i);
    const warn = stoneWarn(i) ? Math.sin(t * 40) * 1.5 : 0;
    const sink = (1 - h) * 9;
    ctx.fillStyle = `rgba(40,90,130,${0.3})`;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, 30, 10, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.35 + h * 0.65;
    ctx.fillStyle = '#766c5f'; ctx.strokeStyle = '#564e44'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x + warn, p.y + 3 + sink, 30, 13, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = h > 0.5 ? '#d8cdb5' : '#8fa6b4';
    ctx.beginPath(); ctx.ellipse(p.x + warn - 2, p.y - 1 + sink, 25, 8.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(p.x + warn - 8, p.y - 3 + sink, 9, 3, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (h < 0.5) {   // water washing over
      ctx.fillStyle = 'rgba(200,235,255,0.55)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y + sink, 30, 9, 0, 0, TAU); ctx.fill();
    }
    waterRing(p.x, p.y + 6, 28);
    if (stoneWarn(i)) {   // bubbles: about to go under
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(p.x - 18 + k * 18, p.y - 8 - ((t * 30 + k * 7) % 12), 2.5, 0, TAU); ctx.fill(); }
    }
  }
  // show which stone is next (gold when it's dry and safe to hop)
  const pc = people[cur];
  if (state === 'play' && phase === 'river' && pc && pc.st === 'stand' && pc.pos < cfg.stones) {
    const n = pc.pos + 1, p = g.pts[n];
    const ok = stoneGood(n);
    ctx.strokeStyle = ok ? 'rgba(255,205,60,0.95)' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 1, 34, 14, 0, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (ok) {
      const b = Math.sin(t * 6) * 3;
      ctx.fillStyle = 'rgba(224,165,38,0.95)';
      ctx.beginPath(); ctx.moveTo(p.x - 7, p.y - 30 + b); ctx.lineTo(p.x + 7, p.y - 30 + b); ctx.lineTo(p.x, p.y - 21 + b); ctx.fill();
    }
  }
}

function drawNearBank() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#e6d3a1';
  ctx.beginPath(); ctx.moveTo(x0, RIVER_BOT);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, RIVER_BOT + Math.sin(x / 45) * 5);
  ctx.lineTo(x1, H + 20); ctx.lineTo(x0, H + 20); ctx.fill();
  ctx.fillStyle = '#d4bd84';
  ctx.fillRect(x0, 870, x1 - x0, 40);
  // reeds along the water
  ctx.strokeStyle = '#6f9e4a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = x0 + 8; x < x1; x += 37) {
    if (Math.abs(x - geom().start.x) < 40) continue;
    const s = Math.sin(t * 1.8 + x) * 2;
    ctx.moveTo(x, RIVER_BOT + 10); ctx.quadraticCurveTo(x - 2, RIVER_BOT - 6, x + s, RIVER_BOT - 22);
    ctx.moveTo(x + 6, RIVER_BOT + 10); ctx.quadraticCurveTo(x + 8, RIVER_BOT - 2, x + 10 + s, RIVER_BOT - 14);
  }
  ctx.stroke();
}

function drawPeople(filter) {
  const list = people.filter(filter).sort((a, b) => a.y - b.y);
  for (const p of list) {
    const s = personScale(p);
    const wy = personWaterY(p);
    if (p.st === 'dip') {
      // John lowers them back into the water
      ctx.save();
      ctx.beginPath(); ctx.rect(p.x - 200, p.y - 400, 400, wy - (p.y - 400)); ctx.clip();
      drawPerson(p, p.x, p.y + p.dip, s, null, { tilt: p.tilt });
      ctx.restore();
      waterRing(p.x, wy, 20 * s);
    } else {
      drawPerson(p, p.x, p.y, s, wy, { alpha: p.alpha, wet: p.wet && p.st !== 'swim', swim: p.st === 'swim' });
    }
  }
}

function drawBubble() {
  if (!bubble || bubble.t <= 0) return;
  const g = geom();
  let sx, sy;
  if (bubble.who === 'john') { sx = g.jx; sy = JOHN_Y - 100; }
  else if (bubble.who === 'jesus' && jesusP) { sx = jesusP.x; sy = jesusP.y - 92; }
  else return;
  sy -= camY;
  const text = bubble.key ? `“${Bible.verse(VERSES[bubble.key]).text}”` : bubble.text;
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '600 15px Fredoka, sans-serif';
  const mw = Math.min(260, W + offX * 2 - 40);
  const lines = wrapText(text, mw);
  const lh = 19, pad = 10;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + pad * 2;
  const h = lines.length * lh + pad * 2 - 4;
  const bx = clamp(sx - w / 2, -offX + 10, W + offX - w - 10);
  let by = sy - h - 14;
  if (by < 104 - offY) by = 104 - offY;
  ctx.fillStyle = 'rgba(255,253,244,0.97)'; ctx.strokeStyle = '#c9a13a'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  const tx = clamp(sx, bx + 14, bx + w - 14);
  if (sy > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(sx, Math.min(sy, by + h + 14)); ctx.lineTo(tx + 8, by + h - 1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillRect(tx - 7, by + h - 3, 14, 3);
  }
  ctx.fillStyle = '#4a3512'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh));
  ctx.restore();
}

// Golden banner: the voice from heaven
function drawBanner() {
  if (!banner) return;
  const v = Bible.verse(VERSES[banner.key]);
  ctx.save();
  ctx.globalAlpha = clamp(banner.age / 0.6, 0, 1);
  const maxW = Math.min(W + offX * 2 - 32, 560);
  ctx.font = 'italic 700 21px Fredoka, sans-serif';
  const lines = wrapText(`“${v.text}”`, maxW - 40);
  const lh = 27;
  const h = lines.length * lh + 70;
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = Math.min(maxW, Math.max(tw, 200) + 44);
  const bx = W / 2 - w / 2, by = 170 - (1 - Math.min(1, banner.age / 0.6)) * 20;
  const gg = ctx.createLinearGradient(0, by, 0, by + h);
  gg.addColorStop(0, '#fff6cf'); gg.addColorStop(1, '#ffe08a');
  ctx.shadowColor = 'rgba(255,215,90,0.9)'; ctx.shadowBlur = 24;
  ctx.fillStyle = gg; ctx.strokeStyle = '#d9961c'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 18); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 13px Fredoka, sans-serif';
  ctx.fillStyle = '#a8741a';
  ctx.fillText('A VOICE FROM HEAVEN', W / 2, by + 18);
  ctx.font = 'italic 700 21px Fredoka, sans-serif';
  ctx.fillStyle = '#6a4a10';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 34 + lh * (i + 0.5)));
  ctx.font = '600 14px Fredoka, sans-serif';
  ctx.fillStyle = '#9a7a3a';
  ctx.fillText(`— ${v.cite}`, W / 2, by + h - 16);
  ctx.restore();
}

// A small verse caption as each level begins
function drawCaption() {
  if (!caption || caption.t <= 0) return;
  const v = Bible.verse(VERSES[caption.key]);
  ctx.save();
  ctx.globalAlpha = clamp(caption.t / 0.5, 0, 1) * clamp((4.5 - caption.t) / 0.4, 0, 1);
  const maxW = Math.min(W + offX * 2 - 32, 520);
  ctx.font = 'italic 600 16px Fredoka, sans-serif';
  const lines = wrapText(`“${v.text}” — ${v.cite}`, maxW - 28);
  const lh = 21, h = lines.length * lh + 18;
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 28;
  const bx = W / 2 - w / 2, by = 112;
  ctx.fillStyle = 'rgba(255,248,225,0.92)';
  ctx.strokeStyle = 'rgba(224,165,38,0.8)'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a10'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 9 + lh * (i + 0.5)));
  ctx.restore();
}

const streaks = Array.from({ length: 36 }, () => ({ f: Math.random(), sy: rand(0, 1), len: rand(0.5, 1.2) }));
function updateStreaks(dt) {
  for (const s of streaks) {
    const wy = camY - offY + s.sy * viewH;
    s.f += (windAt(wy) * 2.2 * dt) / (viewW + 200);
    if (s.f > 1) { s.f -= 1; s.sy = rand(0, 1); }
    if (s.f < 0) { s.f += 1; s.sy = rand(0, 1); }
  }
}
function drawStreaks() {
  if (phase !== 'dove') return;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const s of streaks) {
    const y = camY - offY + s.sy * viewH;
    if (y > 250) continue;
    const w = windAt(y);
    const len = clamp(Math.abs(w) * 0.6, 6, 50) * s.len;
    const x = -offX - 100 + s.f * (viewW + 200);
    const wav = Math.sin(t * 3 + s.sy * 40) * 2;
    ctx.moveTo(x, y + wav);
    ctx.lineTo(x - Math.sign(w || 1) * len, y + wav);
  }
  ctx.stroke();
}

function drawHeart(x, y, r, full) {
  ctx.fillStyle = full ? '#e8566b' : 'rgba(90,66,16,0.22)';
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y, x - r * 0.9, y - r * 1.1, x, y - r * 0.35);
  ctx.bezierCurveTo(x + r * 0.9, y - r * 1.1, x + r * 1.4, y, x, y + r * 0.9);
  ctx.fill();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Jesus Is Baptised' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  if (state !== 'title' && phase === 'dove') {
    ctx.fillText('PEACE', 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(58, 38, 110, 13, 6.5); ctx.fill();
    const gl = peace / 100;
    const gg = ctx.createLinearGradient(58, 0, 168, 0);
    gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
    ctx.fillStyle = gl < 0.3 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
    if (gl > 0) { roundRect(58, 38, 110 * gl, 13, 6.5); ctx.fill(); }
    ctx.fillStyle = '#5a4210'; ctx.shadowBlur = 4;
    ctx.fillText(`✦ ${sparkCount}`, 178, 49);
  } else if (state !== 'title') {
    const done = Math.min(cur, people.length);
    ctx.fillText(`BAPTISED ${done}/${people.length}`, 12, 48);
    ctx.shadowBlur = 0;
    for (let k = 0; k < cfg.lives; k++) drawHeart(128 + k * 17, 44, 6.5, k < lives);
  }

  for (const b of hudButtons()) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score, or wind + descent speed for the dove
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  if (phase === 'dove' && dove && state !== 'title') {
    const w = windAt(dove.y);
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('WIND', rx, 20);
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillText(`${Math.abs(Math.round(w))}`, rx, 40);
    ctx.shadowBlur = 0;
    const ax = rx - 64, ay = 33;
    const alen = clamp(Math.abs(w) / 90, 0.1, 1) * 26;
    const dir = Math.sign(w) || 1;
    ctx.strokeStyle = Math.abs(w) > 60 ? '#d9480f' : '#2c7fb8';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax - dir * alen, ay); ctx.lineTo(ax + dir * alen, ay); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax + dir * (alen + 7), ay); ctx.lineTo(ax + dir * (alen - 3), ay - 7); ctx.lineTo(ax + dir * (alen - 3), ay + 7); ctx.fill();
    ctx.shadowBlur = 4;
    ctx.font = '700 15px Fredoka, sans-serif';
    const vy = Math.round(dove.vy);
    ctx.fillStyle = dove.vy <= cfg.landV ? '#2b8a3e' : '#c92a2a';
    ctx.fillText(`${vy > 0 ? '↓' : '↑'} ${Math.abs(vy)}`, rx, 64);
    // how far to go
    const g = geom();
    const left = Math.max(0, Math.round((g.padY - 84 - dove.y) / 10));
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(`${left} m to Jesus`, rx, 84);
  } else if (state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SCORE', rx, 20);
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillText(`${totalScore + part1Score}`, rx, 40);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const maxW = W + offX * 2 - 24;
  if (ctx.measureText(message.text).width > maxW) ctx.font = '700 19px Fredoka, sans-serif';
  const y = phase === 'dove' ? H * 0.2 : H * 0.28;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  // world space: camY scrolls up into the sky
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy - camY) * scale);

  const g = geom();
  drawSky();
  drawHeavens();
  for (const c of skyClouds) {
    const x = -offX - 150 + ((c.f + t * c.speed * 0.01) % 1) * (viewW + 300);
    drawCloud(x, c.y, c.w, c.w * 0.32, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');
  }
  if (camY > -H - 200) {      // the river scene (skip when high in the sky)
    drawLand();
    drawPeople((p) => p.y < RIVER_TOP + 4);          // far bank
    drawRiver();
    drawLightColumn();
    drawHoneyPot(g.rock);
    drawPeople((p) => p.y >= RIVER_TOP + 4 && p.y < RIVER_BOT - 4 && p.x < g.jx - 20);
    if (jesusP && phase !== 'river') drawJesus(jesusP);
    drawJohn(g.jx, JOHN_Y);
    drawPeople((p) => p.y >= RIVER_TOP + 4 && p.y < RIVER_BOT - 4 && p.x >= g.jx - 20);
    drawNearBank();
    drawPeople((p) => p.y >= RIVER_BOT - 4);          // near bank queue
  } else drawLightColumn();
  for (const sp of sparkles) drawSparkle(sp);
  for (const c of rainClouds) drawRainCloud(c);
  drawStreaks();
  if (dove) drawDove(dove);
  drawParticles();

  // back to camera space for the text layers
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  drawCaption();
  drawBubble();
  drawMessage();
  drawBanner();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateGust(dt);
  updateStreaks(dt);
  updateParticles(dt);
  updateCrowd(dt);
  updateJohn(dt);
  if (state === 'play') {
    applyTaps();
    if (phase === 'river') updateRiver(dt);
    else if (phase === 'story') { updateRiver(dt); if (phase === 'story') updateStory(dt); }
    else if (phase === 'dove') updateDove(dt);
  } else if (state === 'title') {
    // people idle on the bank while John enjoys his honey
  } else if (state === 'win') {
    if (Math.random() < dt * 12) spawn(jesusP.x + rand(-40, 40), jesusP.y - rand(0, 90), 0, -20, 1, '#fff6d0', 3);
    if (dove) dove.flapAnim += dt * 2;
    if (banner) banner.age += dt;
    camY += (0 - camY) * Math.min(1, dt * 3);
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (caption) { caption.t -= dt; if (caption.t <= 0) caption = null; }
  shockT = Math.max(0, shockT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
