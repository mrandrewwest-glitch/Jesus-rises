<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6a4a22">
<title>Fill the Storehouses</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #6a4a22;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(80, 50, 10, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .tip { text-align: center; margin: 8px 0; }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Fill the Storehouses</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'odeToJoy', instrument: 'harp', accent: 'pipe', ambience: 'market', percussion: true };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  gathered: { ref: 'Genesis 41:48–49', KJV: 'And he gathered up all the food of the seven years... and laid up the food in the cities... And Joseph gathered corn as the sand of the sea, very much', NKJV: 'So he gathered up all the food of the seven years... and laid up the food in the cities... Joseph gathered very much grain, as the sand of the sea', NIV: 'Joseph collected all the food produced in those seven years of abundance in Egypt and stored it in the cities... Joseph stored up huge quantities of grain, like the sand of the sea', NLT: 'Joseph gathered all the crops grown in Egypt and stored the grain from the surrounding fields in the cities. He piled up huge amounts of grain like sand on the seashore.' },
  // Level cards
  handfuls: { ref: 'Genesis 41:47', KJV: 'And in the seven plenteous years the earth brought forth by handfuls.', NKJV: 'Now in the seven plentiful years the ground brought forth abundantly.', NIV: 'During the seven years of abundance the land produced plentifully.', NLT: 'As predicted, for seven years the land produced bumper crops.' },
  store: { ref: 'Genesis 41:35–36', KJV: 'And let them gather all the food of those good years that come... And that food shall be for store to the land against the seven years of famine', NKJV: 'And let them gather all the food of those good years that are coming... Then that food shall be as a reserve for the land for the seven years of famine', NIV: 'They should collect all the food of these good years that are coming... This food should be held in reserve for the country, to be used during the seven years of famine', NLT: 'Have them gather all the food produced in the good years that are just ahead and bring it to Pharaoh’s storehouses.' },
  sand: { ref: 'Genesis 41:49', KJV: 'Joseph gathered corn as the sand of the sea, very much, until he left numbering; for it was without number.', NKJV: 'Joseph gathered very much grain, as the sand of the sea, until he stopped counting, for it was immeasurable.', NIV: 'Joseph stored up huge quantities of grain, like the sand of the sea; it was so much that he stopped keeping records because it was beyond measure.', NLT: 'He piled up huge amounts of grain like sand on the seashore. Finally, he stopped keeping records because there was too much to measure.' },
  bread: { ref: 'Genesis 41:54', KJV: 'And the seven years of dearth began to come, according as Joseph had said: and the dearth was in all lands; but in all the land of Egypt there was bread.', NKJV: 'And the seven years of famine began to come, as Joseph had said. The famine was in all lands, but in all the land of Egypt there was bread.', NIV: 'The seven years of famine began, just as Joseph had said. There was famine in all the other lands, but in the whole land of Egypt there was food.', NLT: 'Then the seven years of famine began, just as Joseph had predicted. The famine also struck all the surrounding countries, but throughout Egypt there was plenty of food.' },
  goToJoseph: { ref: 'Genesis 41:55', KJV: 'Go unto Joseph; what he saith to you, do.', NKJV: 'Go to Joseph; whatever he says to you, do.', NIV: 'Go to Joseph and do what he tells you.', NLT: 'Go to Joseph, and do whatever he tells you.' },
  opened: { ref: 'Genesis 41:56', KJV: 'And the famine was over all the face of the earth: and Joseph opened all the storehouses', NKJV: 'The famine was over all the face of the earth, and Joseph opened all the storehouses', NIV: 'When the famine had spread over the whole country, Joseph opened all the storehouses', NLT: 'So with severe famine everywhere, Joseph opened up the storehouses and distributed grain to the Egyptians' },
  allCountries: { ref: 'Genesis 41:57', KJV: 'And all countries came into Egypt to Joseph for to buy corn; because that the famine was so sore in all lands.', NKJV: 'So all countries came to Joseph in Egypt to buy grain, because the famine was severe in all lands.', NIV: 'And all the world came to Egypt to buy grain from Joseph, because the famine was severe everywhere.', NLT: 'And people from all around came to Egypt to buy grain from Joseph because the famine was severe throughout the world.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  if (typeof basket !== 'undefined') { basket.x = clamp(basket.x, BASKET_R, W - BASKET_R); basket.tx = clamp(basket.tx, BASKET_R, W - BASKET_R); }
  if (typeof families !== 'undefined') for (const f of families) f.x = slotX(f.slot);
}
window.addEventListener('resize', resize);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;         // HUD strip
const FIELD_Y = 250;      // the wheat field the sheaves are thrown from
const CATCH_Y = 780;      // the rim of Joseph's basket
const BASKET_R = 64;      // half the width of the basket
const BASKET_SPEED = 1150;
const FAM_Y = 800;        // where the families stand in the hungry years
const GRANARY_Y = 470;    // the ground line under the storehouses

// Each level: a harvest (good years), then the hungry years
const LEVELS = [
  { name: 'The First Harvest',    verse: 'handfuls',     fall: 165, every: 1.15, ratio: 2.0,  blight: 0,    wind: 0,  families: 4,  need: [1, 2], slots: 1, patience: 24, brothers: false, foreign: 0,
    tip: '<b>Tap</b> (or drag) to move Joseph’s basket and <b>catch the golden grain</b>. Then <b>tap each hungry family</b> to give them a sack, until they have all they need.' },
  { name: 'Store It Up',          verse: 'store',        fall: 190, every: 1.0,  ratio: 1.75, blight: 0.12, wind: 0,  families: 5,  need: [1, 3], slots: 2, patience: 21, brothers: false, foreign: 0,
    tip: 'Watch out for <b>brown, blighted grain</b>: it spoils a sack! Two families can wait at once.' },
  { name: 'Like the Sand of the Sea', verse: 'sand',     fall: 215, every: 0.85, ratio: 1.55, blight: 0.18, wind: 0,  families: 6,  need: [2, 3], slots: 2, patience: 18, brothers: false, foreign: 0.2,
    tip: 'More grain, falling faster. Catch as much as you can: the hungry years are coming!' },
  { name: 'The Famine Comes',     verse: 'bread',        fall: 240, every: 0.75, ratio: 1.45, blight: 0.22, wind: 30, families: 7,  need: [1, 4], slots: 3, patience: 16, brothers: true,  foreign: 0.3,
    tip: 'The <b>east wind</b> blows the grain sideways. Three families at once now, and some brothers from far away…' },
  { name: 'Go to Joseph',         verse: 'goToJoseph',   fall: 265, every: 0.66, ratio: 1.38, blight: 0.27, wind: 45, families: 8,  need: [2, 4], slots: 3, patience: 14, brothers: true,  foreign: 0.4,
    tip: 'Everyone is coming to Joseph! Feed the family that has waited longest first.' },
  { name: 'All the World Came',   verse: 'allCountries', fall: 295, every: 0.58, ratio: 1.3,  blight: 0.3,  wind: 60, families: 10, need: [2, 5], slots: 3, patience: 12, brothers: true,  foreign: 0.5,
    tip: 'People come from every land. Catch every golden sheaf, and share it out quickly!' },
];

const ROBES = ['#3f6fb5', '#c46b8c', '#6b8e3a', '#d9a13a', '#7a4fa0', '#b5503f', '#3c8f86', '#5a6475', '#e07a5f', '#b08a2e', '#4b7f4b', '#a0673a'];
const SKINS = ['#d9a066', '#d7a070', '#c98d56', '#e3b184', '#c58a55', '#b87a48', '#c88e5a', '#a8703f'];
const HAIRS = ['#3a2716', '#4a2f1a', '#2e1d10', '#1f140c', '#6b3f1d', '#8a8a8a'];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | pause | win | fail | done
let phase = 'harvest';    // harvest | turn | famine (inside play)
let pausedFrom = 'play';
let level = 1;
let totalScore = 0, levelScore = 0;
let best = 0;
try { best = +localStorage.getItem('storehousesBest') || 0; } catch (e) {}

let cfg = LEVELS[0];
let t = 0;
let grain = 0, needTotal = 0, caught = 0, spoiled = 0, fed = 0;
let sheaves = [];         // falling sheaves
let dropQueue = [];       // what is still to be thrown in this harvest
let dropT = 0;
let flyers = [];          // sacks flying to the storehouse or to a family
let families = [];        // families at the storehouse window
let famQueue = [];
let famT = 0;
let hearts = 3;
let turnT = 0, dryness = 0;
let particles = [];
let message = { text: '', t: 0 };
let bubble = null;
let shakeT = 0;
let endTimer = 0;
let winT = 0, failT = 0;
let told = {};
let attempted = 0;
let lastBonus = null;
const basket = { x: 240, tx: 240, tilt: 0, catchFx: 0 };
const keys = new Set();
let dragging = false;

const sfx = {};

function saveBest() {
  if (totalScore > best) {
    best = totalScore;
    try { localStorage.setItem('storehousesBest', String(best)); } catch (e) {}
  }
}
resize();

// ============================================================
//  Building a level
// ============================================================
function makeFamilies() {
  const list = [];
  for (let i = 0; i < cfg.families; i++) {
    const need = Math.round(rand(cfg.need[0], cfg.need[1]));
    const size = need >= 3 ? 3 : need === 2 ? 2 : pick([1, 2]);
    const foreign = Math.random() < cfg.foreign;
    list.push({ need, size, foreign, brothers: false, seed: Math.random() * 1000 });
  }
  if (cfg.brothers) {
    // Joseph's brothers come down from Canaan to buy grain (Genesis 42)
    const k = Math.floor(cfg.families * rand(0.4, 0.8));
    list[k] = { need: 5, size: 3, foreign: true, brothers: true, seed: 7 };
  }
  return list;
}

function makeDrops() {
  const good = Math.ceil(needTotal * cfg.ratio);
  const bad = Math.round(good * cfg.blight);
  const list = [];
  for (let i = 0; i < good; i++) list.push(false);
  for (let i = 0; i < bad; i++) list.push(true);
  list.sort(() => Math.random() - 0.5);
  // never start with blight
  const fi = list.indexOf(false);
  if (fi > 0) { list[fi] = list[0]; list[0] = false; }
  return list;
}

function slotX(slot) {
  const n = cfg.slots;
  if (n === 1) return W / 2;
  const span = Math.min(W - 150, 760);
  return W / 2 - span / 2 + span * slot / (n - 1);
}

// ============================================================
//  Harvest: catching the sheaves
// ============================================================
function throwSheaf() {
  const bad = dropQueue.shift();
  if (bad === undefined) return;
  const x = rand(50, W - 50);
  sheaves.push({ x, y: FIELD_Y - 10, vx: 0, vy: -rand(120, 200), bad, rot: rand(-0.5, 0.5), spin: rand(-2, 2), wob: rand(0, TAU), landed: 0 });
  sfx.whoosh();
}

function updateHarvest(dt) {
  // basket moves toward the tap, or with the arrow keys
  let kx = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
  if (kx) basket.tx = clamp(basket.x + kx * 700 * dt, BASKET_R, W - BASKET_R);
  const dx = basket.tx - basket.x;
  const step = BASKET_SPEED * dt;
  const prev = basket.x;
  basket.x = Math.abs(dx) < step ? basket.tx : basket.x + Math.sign(dx) * step;
  basket.tilt = lerp(basket.tilt, clamp((basket.x - prev) / dt / 3000, -0.25, 0.25), 0.2);
  basket.catchFx = Math.max(0, basket.catchFx - dt);

  if (dropQueue.length) {
    dropT -= dt;
    if (dropT <= 0) { throwSheaf(); dropT = cfg.every * rand(0.7, 1.3); }
  }
  for (const s of sheaves) {
    if (s.landed) { s.landed += dt; continue; }
    s.vy = Math.min(s.vy + 600 * dt, cfg.fall);
    s.wob += dt * 2.2;
    s.x += (Math.sin(s.wob) * cfg.wind * 0.9 + (cfg.wind ? cfg.wind * 0.5 * Math.sin(t * 0.7) : 0)) * dt;
    s.x = clamp(s.x, 24, W - 24);
    const py = s.y;
    s.y += s.vy * dt;
    s.rot += s.spin * dt * 0.4;
    if (py < CATCH_Y - 4 && s.y >= CATCH_Y - 4 && Math.abs(s.x - basket.x) < BASKET_R + 10) {
      s.landed = -1;
      catchSheaf(s);
    } else if (s.y > H - 40) {
      s.landed = 0.001; s.y = H - 40;
      if (!s.bad) { sfx.thud(); if (!told.missGrain) { told.missGrain = true; say('Oh! Try to catch every golden one.'); } }
    }
  }
  sheaves = sheaves.filter((s) => s.landed >= 0 && s.landed < 1.2);
  if (!dropQueue.length && !sheaves.some((s) => !s.landed)) {
    phase = 'turn'; turnT = 0;
    showMessage('The seven good years are over…', 2.4);
    say(grain >= needTotal ? 'We have stored up plenty. Thank You, God!' : 'Will there be enough for everyone?', 2.6);
  }
}

function catchSheaf(s) {
  basket.catchFx = 0.25;
  if (s.bad) {
    spoiled++;
    if (grain > 0) grain--;
    sfx.yuck();
    floatText(basket.x + offX, CATCH_Y - 40 + offY, '−1 spoiled!', '#ffd0d0');
    for (let k = 0; k < 10; k++) spawn(basket.x + offX + rand(-20, 20), CATCH_Y + offY, rand(-80, 80), rand(-150, -40), 0.7, '#7a6a4a', rand(2, 4), 300);
    if (!told.blight) { told.blight = true; say('Oh no, that grain was scorched by the east wind!'); }
    shakeT = 0.25;
    return;
  }
  caught++;
  levelScore += 10; totalScore += 10;
  sfx.catch(caught);
  // a sack of grain flies to the storehouse
  flyers.push({ x: basket.x, y: CATCH_Y - 10, x0: basket.x, y0: CATCH_Y - 10, x1: W / 2, y1: GRANARY_Y - 120, f: 0, dur: 0.6, kind: 'store' });
  if (!told.firstCatch) { told.firstCatch = true; say('Into the storehouse it goes!'); }
}

// ============================================================
//  The hungry years: sharing out the grain
// ============================================================
function startFamine() {
  phase = 'famine';
  famQueue = plannedFamilies.slice();
  famT = 0.4;
  showMessage('Now the hungry years! Share out the grain.', 2.6);
  say('Tap each family to give them a sack!', 3);
}
let plannedFamilies = [];

function freeSlot() {
  for (let s = 0; s < cfg.slots; s++) if (!families.some((f) => f.slot === s && f.mode !== 'leave')) return s;
  return -1;
}

function newFamily(spec, slot) {
  const from = Math.random() < 0.5 ? -1 : 1;
  const people = [];
  for (let k = 0; k < spec.size; k++) {
    people.push({
      robe: spec.brothers ? ['#8a5a33', '#3f6fb5', '#6b8e3a'][k] : pick(ROBES),
      skin: pick(SKINS), hair: pick(HAIRS), kid: !spec.brothers && k > 0 && Math.random() < 0.6,
      beard: spec.brothers || (k === 0 && Math.random() < 0.5),
      turban: spec.foreign ? pick(['#e8dcc0', '#c0392b', '#3c8f86', '#d9a13a']) : null,
      phase: rand(0, TAU),
    });
  }
  families.push({
    ...spec, slot, people, given: 0, pending: 0,
    x: slotX(slot), walkX: from * (W / 2 + 160), mode: 'come', patience: 1, flash: 0, happy: 0,
  });
  sfx.knock();
  if (spec.brothers) { say('Who are these? They have come all the way from Canaan!', 3); }
  else if (spec.foreign && !told.foreign) { told.foreign = true; say('People are coming from other lands too!', 2.6); }
}

function updateFamine(dt) {
  if (famQueue.length) {
    famT -= dt;
    const s = freeSlot();
    if (famT <= 0 && s >= 0) { newFamily(famQueue.shift(), s); famT = rand(1.2, 2.4) * (cfg.patience / 20); }
  }
  for (const f of families) {
    f.flash = Math.max(0, f.flash - dt);
    for (const p of f.people) p.phase += dt * 6;
    if (f.mode === 'come') {
      f.walkX = lerp(f.walkX, 0, 1 - Math.pow(0.02, dt));
      if (Math.abs(f.walkX) < 4) { f.walkX = 0; f.mode = 'wait'; }
    } else if (f.mode === 'wait') {
      f.patience -= dt / cfg.patience;
      if (f.patience < 0.3 && !told.hurry) { told.hurry = true; showMessage('Hurry! A family is getting very hungry.', 2); }
      if (f.patience <= 0) {
        f.mode = 'leave'; f.sad = true; f.dir = f.x < W / 2 ? -1 : 1;
        sfx.sad();
        floatText(f.x + offX, FAM_Y - 150 + offY, 'They went away hungry…', '#ffd0d0');
        loseHeart();
      }
    } else if (f.mode === 'leave') {
      f.walkX += f.dir * 260 * dt;
    }
  }
  families = families.filter((f) => !(f.mode === 'leave' && Math.abs(f.walkX) > W / 2 + 200));
  if (state === 'play' && !famQueue.length && !families.some((f) => f.mode !== 'leave')) win();
}

function familyAt(px, py) {
  let bestF = null, bd = 1e9;
  for (const f of families) {
    if (f.mode === 'leave') continue;
    const x = f.x + f.walkX;
    const dx = Math.abs(px - x), dy = py - (FAM_Y - 90);
    if (dx < 95 && dy > -150 && dy < 150 && dx < bd) { bd = dx; bestF = f; }
  }
  return bestF;
}

function giveTo(f) {
  if (!f || f.mode === 'leave') return;
  if (grain <= 0) {
    sfx.soft();
    showMessage('The storehouse is empty!', 1.6);
    return;
  }
  if (f.given + f.pending >= f.need) return;
  grain--;
  f.pending = (f.pending || 0) + 1;
  flyers.push({ x0: W / 2, y0: GRANARY_Y - 40, x1: f.x + f.walkX, y1: FAM_Y - 60, f: 0, dur: 0.35, kind: 'give', fam: f });
  sfx.give();
}

function arriveGift(fl) {
  const f = fl.fam;
  f.pending--;
  f.given++;
  f.flash = 0.2;
  if (f.given >= f.need && f.mode !== 'leave') {
    f.mode = 'leave'; f.happy = 1; f.dir = f.x < W / 2 ? -1 : (f.x > W / 2 ? 1 : pick([-1, 1]));
    fed++;
    const pts = 60 + Math.round(f.patience * 40) + (f.brothers ? 200 : 0);
    levelScore += pts; totalScore += pts;
    floatText(f.x + offX, FAM_Y - 170 + offY, f.brothers ? `Brothers fed! +${pts}` : `+${pts}`, '#fff3b0');
    sparkle(f.x, FAM_Y - 80, 14);
    sfx.thanks();
  }
}

function loseHeart() {
  hearts--;
  shakeT = 0.35;
  if (hearts <= 0) { hearts = 0; fail(); }
}

function updateFlyers(dt) {
  for (const fl of flyers) {
    fl.f += dt / fl.dur;
    if (fl.f >= 1 && !fl.done) {
      fl.done = true;
      if (fl.kind === 'store') { grain++; sfx.pour(); }
      else if (fl.kind === 'give') arriveGift(fl);
    }
  }
  flyers = flyers.filter((fl) => !fl.done);
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot', text = '') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind, text });
}
function sparkle(x, y, n) {
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), v = rand(60, 200);
    spawn(x + offX, y + offY, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, 0.8), pick(['#ffe27a', '#fff6d0', '#ffffff']), rand(2, 4), 120, 'star');
  }
}
function floatText(x, y, text, color) { spawn(x, y, 0, -60, 1.3, color, 22, 0, 'text', text); }
function updateParticles(dt) {
  for (const p of particles) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter((p) => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
    if (p.kind === 'text') {
      ctx.font = `700 ${p.size}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(60,35,10,0.85)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    } else if (p.kind === 'star') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const r = k % 2 ? p.size * 0.4 : p.size * 1.4, an = k * Math.PI / 4;
        ctx.lineTo(p.x + Math.cos(an) * r, p.y + Math.sin(an) * r);
      }
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const heartBonus = hearts * 100, grainBonus = grain * 5, levelBonus = level * 100;
  const add = heartBonus + grainBonus + levelBonus;
  levelScore += add; totalScore += add;
  lastBonus = { heartBonus, grainBonus, levelBonus };
  saveBest();
  say('In all the land of Egypt there was bread!', 3);
  sfx.win();
  endTimer = 2.4;
}

function fail() {
  if (state !== 'play') return;
  state = 'fail';
  syncAmbience();
  failT = 0;
  saveBest();
  sfx.fail();
  endTimer = 1.8;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }
function say(text, dur = 2.6) { bubble = { text, t: dur }; }

function titleScreen() {
  state = 'title';
  syncAmbience();

  resetLevel();
  showOverlay('Fill the Storehouses', 'Seven good years, then seven hungry years',
    `${verseHTML('gathered')}
     <ul>

function resetLevel() {
  cfg = LEVELS[level - 1];
  phase = 'harvest';
  sheaves = []; flyers = []; families = []; particles = [];
  plannedFamilies = makeFamilies();
  needTotal = plannedFamilies.reduce((a, f) => a + f.need, 0);
  dropQueue = makeDrops();
  dropT = 1.0;
  grain = 0; caught = 0; spoiled = 0; fed = 0;
  hearts = 3;
  turnT = 0; dryness = 0;
  winT = 0; failT = 0; endTimer = 0; shakeT = 0;
  bubble = null; told = {};
  basket.x = basket.tx = W / 2;
  keys.clear(); dragging = false;
}

function startLevel(retry = false) {
  resetLevel();
  if (retry || attempted > 0) { beginPlay(); return; }
  attempted++;
  levelCard();
}

function levelCard() {
  state = 'intro';
  syncAmbience();
  showOverlay(`Level ${level}`, cfg.name,
    `${verseHTML(cfg.verse)}
     <p class="tip">${cfg.tip}</p>
     <p class="tip">Families to feed: <b>${cfg.families}</b> &middot; Sacks they need: about <b>${needTotal}</b></p>`,
    'Go!', beginPlay);
}

function beginPlay() {
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  attempted = Math.max(attempted, 1);
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  if (level === 1) say('Tap where you want the basket to go!', 3.2);
  else say(`The good years! Catch at least ${needTotal} sacks.`, 3);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const b = lastBonus;
    const last = level === LEVELS.length;
    showOverlay(last ? 'Everyone was fed!' : 'Well done!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(last ? 'allCountries' : 'opened')}
       ${last ? '<p style="text-align:center">God gave Joseph wisdom to save food in the good years, so there was enough for everyone, and even for his own family!</p>' : ''}
       <p class="score">Grain caught: <b>${caught}</b> &nbsp;&middot;&nbsp; Families fed: <b>${fed} / ${cfg.families}</b><br>Hearts left: <b>${b.heartBonus}</b><br>Grain left over: <b>${b.grainBonus}</b><br>Level bonus: <b>${b.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      last ? 'Play again' : 'Next years', last
        ? () => { level = 1; totalScore = 0; attempted = 0; startLevel(); }
        : () => { level++; attempted = 0; startLevel(); });
    if (last) state = 'done';
  } else if (state === 'fail') {
    showOverlay('Oh dear!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Some families went away hungry. Catch <b>lots of golden grain</b> in the good years, and feed the family who has <b>waited longest</b> first.</p>
       ${verseHTML('store', '…')}
       <p class="score">Score so far: <b>${totalScore - levelScore}</b></p>`,
      'Try Again', () => { totalScore -= levelScore; levelScore = 0; startLevel(true); });
  }
}

function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;
    state = 'pause';
    keys.clear(); dragging = false;
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => { totalScore -= levelScore; levelScore = 0; startLevel(true); });
  } else if (state === 'pause') {
    if (pausedFrom === 'intro') { levelCard(); return; }
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { totalScore -= levelScore; levelScore = 0; startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && winT > 1.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && phase === 'famine' && !e.repeat) {
    const k = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (k !== undefined) giveTo(families.find((f) => f.slot === k && f.mode !== 'leave'));
    if (e.code === 'Space') {
      // Space feeds the hungriest family
      const w = families.filter((f) => f.mode !== 'leave').sort((a, b) => a.patience - b.patience)[0];
      giveTo(w);
    }
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'win' && winT > 1.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const x = p.vx - offX, y = p.vy - offY;
  if (phase === 'harvest' || phase === 'turn') {
    basket.tx = clamp(x, BASKET_R, W - BASKET_R);
    dragging = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (phase === 'famine') {
    const f = familyAt(x, y);
    if (f) giveTo(f);
    else if (!told.tapFam) { told.tapFam = true; say('Tap on a family to give them grain.', 2); }
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging || state !== 'play') return;
  const p = toView(e);
  basket.tx = clamp(p.vx - offX, BASKET_R, W - BASKET_R);
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
Object.assign(sfx, {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  catch(n) { if (this.ctx) Music.tap(0.15 + (n % 8) * 0.1); },
  whoosh() { this.noiseBurst(1800, 0.25, 0.06, 0.8, 700); },
  thud() { this.tone(140, 0.18, 'sine', 0.2, 0, 80); },
  yuck() { this.tone(220, 0.25, 'triangle', 0.25, 0, 120); this.noiseBurst(500, 0.3, 0.2, 0.7, 200); },
  pour() { this.noiseBurst(3000, 0.18, 0.06, 0.6, 1200); },
  give() { this.noiseBurst(900, 0.2, 0.12, 0.7, 400); this.tone(520, 0.1, 'triangle', 0.08); },
  thanks() { if (this.ctx) { Music.tap(0.9); this.tone(1568, 0.3, 'sine', 0.1, 0.1); } },
  knock() { this.tone(300, 0.07, 'triangle', 0.18); this.tone(300, 0.07, 'triangle', 0.18, 0.14); },
  sad() { this.tone(392, 0.3, 'sine', 0.18, 0, 330); this.tone(330, 0.4, 'sine', 0.16, 0.25, 262); },
  soft() { this.tone(400, 0.12, 'sine', 0.1); },
});

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Drawing: people
// ============================================================
function drawFace(mood, hy, d) {
  const ex = 6, ey = hy - 1, dark = '#2b1d12', mouthY = hy + 9;
  ctx.lineCap = 'round';
  const blink = Math.sin(t * 1.6 + d.phase * 3) > 0.985 && mood !== 'joy';
  for (const sx of [-ex, ex]) {
    if (mood === 'joy') {
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(sx, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      continue;
    }
    if (blink) { ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke(); continue; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sx, ey, 3.7, 4.7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx, ey + 0.8, 2.1, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#6a2a1e'; ctx.fillStyle = '#7a2e22'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mood === 'joy') { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  else if (mood === 'wow') { ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU); ctx.fill(); }
  else if (mood === 'worried' || mood === 'sad') {
    ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-ex - 4, ey - 6); ctx.lineTo(-ex + 3, ey - 9); ctx.moveTo(ex - 3, ey - 9); ctx.lineTo(ex + 4, ey - 6); ctx.stroke();
  }
  else { ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (mood === 'joy') {
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  }
}

function drawPerson(d, x, y, s, mood, opts = {}) {
  const jump = mood === 'joy' ? Math.abs(Math.sin(t * 7 + d.phase)) * 10 : (opts.walk ? Math.abs(Math.sin(d.phase)) * 4 : 0);
  if (d.kid) s *= 0.75;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (mood === 'joy' && !opts.carry) { const w = Math.sin(t * 9 + d.phase) * 4; arm(-11, -32, -24 + w, -66); arm(11, -32, 24 - w, -66); }
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -50); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (d.sash) {
    ['#c0392b', '#e0a526', '#3c8f86', '#7a4fa0'].forEach((c, k) => { ctx.strokeStyle = c; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-12 + k * 2.4, -36); ctx.lineTo(10 + k * 2.4, -8); ctx.stroke(); });
  } else {
    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }
  if (d.collar) {
    ctx.fillStyle = d.collar; ctx.beginPath(); ctx.ellipse(0, -37, 13, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.ellipse(0, -37, 9, 2.5, 0, 0, TAU); ctx.fill();
  }
  if (mood !== 'joy' || opts.carry) {
    if (opts.reach) { arm(-11, -32, -20, -46); arm(11, -32, 20, -46); }
    else if (opts.carry) { arm(-11, -32, -22, -76); arm(11, -32, 22, -76); }
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  }
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.turban) {
    ctx.fillStyle = d.turban;
    ctx.beginPath(); ctx.ellipse(0, hy - 10, 18, 10, 0, Math.PI, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, hy - 9, 17, 5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(d.turban, -40); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-15, hy - 13); ctx.quadraticCurveTo(0, hy - 8, 15, hy - 15); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2); ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2); ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2); ctx.fill();
  }
  drawFace(mood, hy, d);
  ctx.restore();
}

const JOSEPH = { robe: '#f8f4ea', skin: '#d39a66', hair: '#3a2515', sash: true, collar: '#e0a526', phase: 0 };

// ============================================================
//  Drawing: grain, baskets, storehouses
// ============================================================
function drawSheaf(x, y, rot, bad, s = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const gold = bad ? '#8a7650' : '#ecc04e', stalk = bad ? '#7d6a44' : '#d9a83a';
  // stalks
  ctx.strokeStyle = stalk; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath(); ctx.moveTo(k * 2, 16); ctx.lineTo(k * 4.5, -6); ctx.stroke();
  }
  // heads
  for (let k = -3; k <= 3; k++) {
    const hx = k * 5.2, hy = -12 - (3 - Math.abs(k)) * 3 + (bad ? Math.abs(k) * 2 : 0);
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.ellipse(hx, hy, bad ? 2.6 : 4, bad ? 7 : 9, k * 0.18 + (bad ? 0.5 : 0), 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(gold, -50); ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = shade(gold, -20);
    ctx.beginPath(); ctx.moveTo(hx, hy - 8); ctx.lineTo(hx + k * 1.5, hy - 17); ctx.stroke();
  }
  // band
  ctx.fillStyle = bad ? '#5a4a30' : '#b5503f';
  roundRect(-11, 2, 22, 6, 3); ctx.fill();
  if (bad) {
    // scorched spots and a little puff of the east wind
    ctx.fillStyle = 'rgba(60,40,20,0.7)';
    ctx.beginPath(); ctx.arc(-6, -12, 2.5, 0, TAU); ctx.arc(5, -18, 2, 0, TAU); ctx.arc(9, -8, 2, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-5, -20, 1.5, 4, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawSack(x, y, s = 1, col = '#d9c08a') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -60); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-10, 12); ctx.quadraticCurveTo(-14, -2, -7, -9); ctx.lineTo(-4, -13); ctx.lineTo(4, -13); ctx.lineTo(7, -9);
  ctx.quadraticCurveTo(14, -2, 10, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(6, -9); ctx.stroke();
  ctx.fillStyle = '#ecc04e';
  ctx.beginPath(); ctx.ellipse(0, -14, 4, 2.5, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawGranaries() {
  // three white storehouse domes; the middle one shows how much grain is inside
  const cx = W / 2, gy = GRANARY_Y;
  const dome = (x, w, h, show) => {
    ctx.fillStyle = 'rgba(80,50,20,0.18)';
    ctx.beginPath(); ctx.ellipse(x, gy + 4, w * 0.55, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = lerpCol('#f4ecdc', '#e6d4b4', dryness);
    ctx.strokeStyle = '#b8a07a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, gy);
    ctx.bezierCurveTo(x - w / 2, gy - h * 0.9, x - w * 0.2, gy - h, x, gy - h);
    ctx.bezierCurveTo(x + w * 0.2, gy - h, x + w / 2, gy - h * 0.9, x + w / 2, gy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // little top hatch and door
    ctx.fillStyle = '#8a5a2a';
    roundRect(x - 8, gy - h - 6, 16, 9, 3); ctx.fill();
    roundRect(x - 12, gy - 30, 24, 30, 6); ctx.fill();
    if (show) {
      // window showing the grain level
      const ww = w * 0.44, wh = h * 0.5, wx = x - ww / 2, wy = gy - h * 0.82;
      ctx.fillStyle = '#5a3a1a';
      roundRect(wx - 4, wy - 4, ww + 8, wh + 8, 10); ctx.fill();
      ctx.fillStyle = '#3a2410';
      roundRect(wx, wy, ww, wh, 8); ctx.fill();
      const cap = Math.max(needTotal * 1.25, 1);
      const f = clamp(grain / cap, 0, 1);
      ctx.save();
      roundRect(wx, wy, ww, wh, 8); ctx.clip();
      const gg = ctx.createLinearGradient(0, wy, 0, wy + wh);
      gg.addColorStop(0, '#ffd965'); gg.addColorStop(1, '#d99a2a');
      ctx.fillStyle = gg;
      const top = wy + wh * (1 - f);
      ctx.beginPath(); ctx.moveTo(wx, wy + wh); ctx.lineTo(wx, top + 4);
      for (let k = 0; k <= 8; k++) ctx.lineTo(wx + ww * k / 8, top + Math.sin(k * 1.7 + t * 2) * 2);
      ctx.lineTo(wx + ww, wy + wh); ctx.fill();
      // the "enough" line
      const ny = wy + wh * (1 - clamp(needTotal / cap, 0, 1));
      ctx.setLineDash([6, 5]); ctx.strokeStyle = grain >= needTotal ? '#7cff8a' : '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(wx, ny); ctx.lineTo(wx + ww, ny); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
      // the count
      ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,35,10,0.9)';
      const txt = phase === 'famine' ? `${grain}` : `${grain} / ${needTotal}`;
      ctx.strokeText(txt, x, wy + wh - 16);
      ctx.fillStyle = grain >= needTotal || phase === 'famine' ? '#fff3b0' : '#ffffff';
      ctx.fillText(txt, x, wy + wh - 16);
    }
  };
  const side = Math.min(170, W * 0.3);
  dome(cx - side, 120, 120, false);
  dome(cx + side, 120, 120, false);
  dome(cx, 170, 190, true);
}

function lerpCol(a, b, f) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, f)), g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, f)), bl = Math.round(lerp(pa & 255, pb & 255, f));
  return `rgb(${r},${g},${bl})`;
}

function drawBackground() {
  // sky (view coordinates)
  const g = ctx.createLinearGradient(0, 0, 0, offY + GRANARY_Y);
  g.addColorStop(0, lerpCol('#7cc4f0', '#e7b07a', dryness));
  g.addColorStop(1, lerpCol('#d8f0ff', '#f6dcae', dryness));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, offY + GRANARY_Y + 2);
  // sun
  const sx = viewW * 0.82, sy = offY + 150 - Math.min(offY, 80);
  ctx.fillStyle = lerpCol('#fff1a8', '#ffcf7a', dryness);
  ctx.beginPath(); ctx.arc(sx, sy, 36, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,160,0.25)';
  ctx.beginPath(); ctx.arc(sx, sy, 56, 0, TAU); ctx.fill();
  // clouds in the good years
  if (dryness < 1) {
    ctx.globalAlpha = 1 - dryness;
    for (let k = 0; k < 3; k++) {
      const cx = ((hash(k, 3) * viewW + t * (10 + k * 4)) % (viewW + 240)) - 120;
      cloud(cx, offY * 0.5 + 60 + k * 50, 110 + k * 20);
    }
    ctx.globalAlpha = 1;
  }
}
function cloud(x, y, w) {
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, w * 0.16, 0, 0, TAU);
  ctx.ellipse(x - w * 0.2, y - w * 0.08, w * 0.22, w * 0.16, 0, 0, TAU);
  ctx.ellipse(x + w * 0.12, y - w * 0.12, w * 0.26, w * 0.2, 0, 0, TAU);
  ctx.fill();
}

function drawField() {
  // playfield coordinates: the wheat field the reapers work in, behind the storehouses
  const top = FIELD_Y - 90;
  ctx.fillStyle = lerpCol('#e8c45a', '#c9a46a', dryness);
  ctx.fillRect(-offX, top, viewW, GRANARY_Y - top);
  // rows of wheat (they are cut down in the hungry years)
  for (let r = 0; r < 4; r++) {
    const y = top + 18 + r * 22;
    for (let k = 0; k < Math.ceil(viewW / 14) + 1; k++) {
      const x = -offX + k * 14 + (r % 2) * 7;
      const sway = Math.sin(t * 2 + k * 0.4 + r) * 2;
      const h = (1 - dryness) * (16 + hash(k, r) * 6) + dryness * 4;
      ctx.strokeStyle = lerpCol('#d9a83a', '#9a8050', dryness); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x + sway, y + 12 - h); ctx.stroke();
      if (dryness < 0.7) {
        ctx.fillStyle = '#f0c850';
        ctx.beginPath(); ctx.ellipse(x + sway, y + 10 - h, 2.4, 5, 0, 0, TAU); ctx.fill();
      }
    }
  }
  // the reapers who throw the sheaves
  if (phase === 'harvest') {
    const xs = [0.1, 0.3, 0.7, 0.9];
    for (let k = 0; k < 4; k++) {
      const x = W * xs[k];
      const d = REAPERS[k];
      drawPerson(d, x, FIELD_Y + 26, 0.62, 'watch', { reach: Math.sin(t * 3 + k * 1.3) > 0.4 });
    }
  }
  // ground in front of the storehouses
  ctx.fillStyle = lerpCol('#cfe08a', '#d8b98a', dryness);
  ctx.fillRect(-offX, GRANARY_Y - 6, viewW, H - GRANARY_Y + 6);
  ctx.fillStyle = lerpCol('#b8d070', '#c8a676', dryness);
  for (let k = 0; k < 30; k++) {
    const x = -offX + hash(k, 21) * viewW, y = GRANARY_Y + 20 + hash(k, 22) * (H - GRANARY_Y - 30);
    ctx.beginPath(); ctx.ellipse(x, y, 16, 4, 0, 0, TAU); ctx.fill();
  }
}
const REAPERS = [
  { robe: '#6b8e3a', skin: '#c98d56', hair: '#4a2f1a', phase: 1, beard: true },
  { robe: '#e07a5f', skin: '#dca678', hair: '#2e1d10', phase: 2 },
  { robe: '#3c8f86', skin: '#b87a48', hair: '#1f140c', phase: 3, beard: true },
  { robe: '#d9a13a', skin: '#d7a070', hair: '#3a2716', phase: 4 },
];

function drawBasket() {
  const x = basket.x, y = CATCH_Y;
  // Joseph carries the basket
  drawPerson(JOSEPH, x, H - 2, 0.9, basket.catchFx > 0 ? 'joy' : 'watch', { carry: true });
  ctx.save();
  ctx.translate(x, y + 14);
  ctx.rotate(basket.tilt);
  const bw = BASKET_R + 8;
  ctx.fillStyle = '#b07a3a'; ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-bw, -14); ctx.lineTo(bw, -14); ctx.lineTo(bw - 12, 34); ctx.quadraticCurveTo(0, 42, -bw + 12, 34); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // weave
  ctx.strokeStyle = 'rgba(90,55,20,0.5)'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-bw + 4 + k * 4, -2 + k * 12); ctx.lineTo(bw - 4 - k * 4, -2 + k * 12); ctx.stroke(); }
  for (let k = -4; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(k * 15, -12); ctx.lineTo(k * 12, 36); ctx.stroke(); }
  // a little grain peeking out
  ctx.fillStyle = '#ecc04e';
  ctx.beginPath(); ctx.ellipse(0, -14, bw - 10, 7 + (basket.catchFx > 0 ? 4 : 0), 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#d9a03a'; ctx.beginPath(); ctx.ellipse(0, -14, bw, 6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}

function drawFamilies() {
  for (const f of families) {
    const x = f.x + f.walkX;
    const n = f.people.length;
    const mood = f.happy ? 'joy' : f.sad ? 'sad' : f.patience < 0.35 ? 'worried' : 'watch';
    // people stand in a little group
    f.people.forEach((p, k) => {
      const px = x + (k - (n - 1) / 2) * 34;
      const py = FAM_Y + (k % 2) * 6;
      drawPerson(p, px, py, 0.95, mood, { walk: f.mode !== 'wait', reach: f.mode === 'wait' && k === 0 });
    });
    // their sacks so far
    for (let k = 0; k < f.given; k++) drawSack(x - 24 + (k % 3) * 24 + (f.mode === 'leave' ? 0 : 0), FAM_Y + 22 - Math.floor(k / 3) * 14, 0.8);
    if (f.mode === 'leave') continue;
    // the wish bubble: one sack per thing they need
    const bw = Math.max(70, f.need * 24 + 20), bh = 46;
    const bx = x - bw / 2, by = FAM_Y - 168;
    ctx.save();
    if (f.flash > 0) { ctx.translate(x, by + bh / 2); ctx.scale(1.08, 1.08); ctx.translate(-x, -(by + bh / 2)); }
    ctx.fillStyle = f.brothers ? 'rgba(255,240,200,0.97)' : 'rgba(255,252,240,0.96)';
    ctx.strokeStyle = f.brothers ? '#e0a526' : 'rgba(150,120,70,0.5)'; ctx.lineWidth = f.brothers ? 3 : 1.5;
    roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 7, by + bh - 1); ctx.lineTo(x, by + bh + 10); ctx.lineTo(x + 7, by + bh - 1); ctx.fill();
    for (let k = 0; k < f.need; k++) {
      const sx = x - (f.need - 1) * 12 + k * 24;
      ctx.globalAlpha = k < f.given ? 1 : 0.35;
      drawSack(sx, by + 24, 0.85, k < f.given ? '#ecc04e' : '#d9c08a');
      ctx.globalAlpha = 1;
    }
    // patience bar
    const pw = bw - 16;
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; roundRect(bx + 8, by + bh + 14, pw, 8, 4); ctx.fill();
    ctx.fillStyle = f.patience > 0.5 ? '#6cc24a' : f.patience > 0.25 ? '#f2b33d' : '#e8505b';
    roundRect(bx + 8, by + bh + 14, pw * clamp(f.patience, 0, 1), 8, 4); ctx.fill();
    if (f.brothers) {
      ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#a8741a';
      ctx.fillText('from Canaan', x, by - 6);
    }
    ctx.restore();
    // keyboard number
    if (cfg.slots > 1) {
      ctx.font = '600 12px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(90,60,20,0.6)';
      ctx.fillText(String(f.slot + 1), x, FAM_Y + 44);
    }
  }
}

function drawFamineScene() {
  // Joseph at his table in front of the storehouses
  ctx.fillStyle = '#8a5a2a';
  roundRect(W / 2 - 70, GRANARY_Y + 46, 140, 16, 5); ctx.fill();
  ctx.fillRect(W / 2 - 60, GRANARY_Y + 60, 10, 30); ctx.fillRect(W / 2 + 50, GRANARY_Y + 60, 10, 30);
  drawSack(W / 2 - 40, GRANARY_Y + 34, 1);
  drawSack(W / 2 + 40, GRANARY_Y + 34, 1);
  drawPerson(JOSEPH, W / 2, GRANARY_Y + 44, 1, state === 'win' ? 'joy' : 'watch', { reach: flyers.some((f) => f.kind === 'give') });
}

function drawFlyers() {
  for (const fl of flyers) {
    const f = ease(clamp(fl.f, 0, 1));
    const x = lerp(fl.x0, fl.kind === 'give' ? fl.fam.x + fl.fam.walkX : fl.x1, f);
    const y = lerp(fl.y0, fl.y1, f) - Math.sin(f * Math.PI) * 90;
    if (fl.kind === 'store') drawSheaf(x, y, f * 4, false, lerp(1, 0.6, f));
    else drawSack(x, y, 1);
  }
}

function drawBubble() {
  if (!bubble) return;
  const a = clamp(bubble.t / 0.3, 0, 1);
  const jx = phase === 'famine' ? W / 2 : basket.x, jy = phase === 'famine' ? GRANARY_Y - 30 : CATCH_Y - 60;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 17px Fredoka, sans-serif';
  const lines = wrapText(bubble.text, Math.min(260, W * 0.6));
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 26, bh = lines.length * 21 + 16;
  const bx = clamp(jx - bw / 2, 8 - offX, W + offX - bw - 8), by = jy - bh - 14;
  ctx.fillStyle = 'rgba(255,252,240,0.96)';
  roundRect(bx, by, bw, bh, 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(jx - 8, by + bh - 1); ctx.lineTo(jx, by + bh + 12); ctx.lineTo(jx + 8, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#4a3418'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 9 + i * 21));
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(70,45,15,0.8)'); hg.addColorStop(1, 'rgba(70,45,15,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, viewW, TOPH);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Fill the Storehouses' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.font = '600 15px Fredoka, sans-serif';
    ctx.fillText(phase === 'famine' ? `Hungry years · fed ${fed} / ${cfg.families}` : `Good years · grain left to fall: ${dropQueue.length}`, 12, 50);
    for (let k = 0; k < 3; k++) heart(viewW - 24 - k * 30, 44, k < hearts);
    ctx.textAlign = 'right';
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.fillText(`${totalScore}`, viewW - 12, 84);
  }
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function heart(x, y, full) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = full ? '#e8505b' : 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-14, -2, -8, -14, 0, -6);
  ctx.bezierCurveTo(8, -14, 14, -2, 0, 8);
  ctx.fill();
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = Math.max(TOPH + 30, offY + FIELD_Y - 120);
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(70,40,10,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#fff3c4';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBackground();
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawField();
  drawGranaries();
  if (phase === 'famine') {
    drawFamineScene();
    drawFamilies();
  } else {
    for (const s of sheaves) {
      ctx.globalAlpha = s.landed ? clamp(1 - s.landed, 0, 1) : 1;
      drawSheaf(s.x, s.y, s.rot, s.bad);
    }
    ctx.globalAlpha = 1;
    drawBasket();
  }
  drawFlyers();
  drawBubble();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawParticles();
  if (state === 'fail') {
    ctx.fillStyle = `rgba(60,35,10,${clamp(failT / 1.5, 0, 0.35)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (state === 'play') {
    if (phase === 'harvest') updateHarvest(dt);
    else if (phase === 'turn') {
      turnT += dt;
      dryness = clamp(turnT / 2.2, 0, 1);
      if (turnT > 2.6 && !flyers.length) startFamine();
    } else if (phase === 'famine') {
      dryness = 1;
      updateFamine(dt);
    }
    updateFlyers(dt);
  } else if (state === 'win' || state === 'done') {
    winT += dt;
    if (phase === 'famine') updateFamine(dt);
    if (Math.random() < dt * 8) spawn(rand(0, viewW), rand(TOPH, viewH * 0.5), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  } else if (state === 'fail') {
    failT += dt;
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
