}

// ============================================================
//  Feet and hands
// ============================================================
function drawTarget(f, skin) {
  ctx.save();
  // pulled-up feet disappear under the robe
  if (f.kind === 'foot' && f.oy < 0) { ctx.beginPath(); ctx.rect(-offX, FEET_Y, viewW, H); ctx.clip(); }
  ctx.translate(f.x0 + f.ox, f.y0 + f.oy);
  if (f.mirror) { ctx.translate(f.bw, 0); ctx.scale(-1, 1); }
  const outline = shade(skin, -55);
  ctx.lineJoin = 'round';
  // reflection on the water beneath the toes
  if (f.kind === 'foot' && f.oy > -20) {
    ctx.fillStyle = 'rgba(40,60,90,0.18)';
    ctx.beginPath(); ctx.ellipse(95, 286, 80, 12, 0, 0, TAU); ctx.fill();
  }
  traceShape(ctx, f.kind);
  ctx.strokeStyle = outline; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = skin; ctx.fill();

  ctx.save();
  traceShape(ctx, f.kind);
  ctx.clip();
  // roundness: shadow on the outer edge, light on the instep
  const g = ctx.createLinearGradient(0, 0, f.bw, 0);
  g.addColorStop(0, 'rgba(90,40,10,0.28)'); g.addColorStop(0.35, 'rgba(90,40,10,0)');
  g.addColorStop(0.7, 'rgba(255,240,220,0.12)'); g.addColorStop(1, 'rgba(90,40,10,0.18)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, f.bw, f.bh);
  const sh = ctx.createLinearGradient(0, 0, 0, 50);
  sh.addColorStop(0, 'rgba(60,30,10,0.4)'); sh.addColorStop(1, 'rgba(60,30,10,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, f.bw, 50);
  ctx.fillStyle = 'rgba(255,250,235,0.3)';
  if (f.kind === 'foot') {
    ctx.beginPath(); ctx.ellipse(118, 120, 13, 48, -0.2, 0, TAU); ctx.fill();
    // toe creases and nail beds
    ctx.strokeStyle = shade(skin, -35); ctx.globalAlpha = 0.45; ctx.lineWidth = 1.6;
    for (const e of TOES) { ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, e.ry, e.a, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for (const nl of f.nails) {
      ctx.fillStyle = '#f7dccd'; ctx.strokeStyle = shade(skin, -30); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(nl.x, nl.y, nl.rx, nl.ry, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.ellipse(nl.x - nl.rx * 0.35, nl.y - nl.ry * 0.3, nl.rx * 0.25, nl.ry * 0.3, 0, 0, TAU); ctx.fill();
    }
  } else {
    ctx.beginPath(); ctx.ellipse(80, 55, 26, 30, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(skin, -35); ctx.globalAlpha = 0.5; ctx.lineWidth = 1.6;
    for (const fg of FINGERS) { ctx.beginPath(); rrPath(ctx, fg[0], fg[1], fg[2], fg[3], fg[2] / 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for (const fg of FINGERS) {
      ctx.fillStyle = '#f7dccd';
      ctx.beginPath(); ctx.ellipse(fg[0] + fg[2] / 2, fg[1] + fg[3] - 9, fg[2] * 0.3, 6, 0, 0, TAU); ctx.fill();
    }
  }
  // the grime (and wet shine) from the mask canvas
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(f.canvas, 0, 0, f.bw, f.bh);
  ctx.restore();

  // toenail grime, progress rings and glints
  const hint = gridClean(f) > 0.6 && inWashPhase();
  for (const nl of f.nails) {
    if (nl.grime > 0) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(nl.x, nl.y, nl.rx, nl.ry, 0, 0, TAU); ctx.clip();
      ctx.fillStyle = `rgba(62,40,18,${0.35 + 0.6 * nl.grime})`;
      ctx.beginPath(); ctx.ellipse(nl.x, nl.y + nl.ry * 1.05, nl.rx * 1.2, nl.ry * (0.35 + 0.55 * nl.grime), 0, 0, TAU); ctx.fill();
      ctx.restore();
      const rr = Math.max(nl.rx, nl.ry) + 6;
      if (nl.active > 0 || nl.grime < 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(nl.x, nl.y, rr, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#f5b82e'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(nl.x, nl.y, rr, -Math.PI / 2, -Math.PI / 2 + (1 - nl.grime) * TAU); ctx.stroke();
      } else if (hint) {
        ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(t * 6)})`; ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(nl.x, nl.y, rr + 2, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
    } else if (nl.dirty) {
      // a clean nail keeps a little shine; a new one flashes a glint
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      star(nl.x + nl.rx * 0.3, nl.y - nl.ry * 0.2, 3 + nl.glint * 9);
    }
  }
  // stuck pebbles, fish scales and seaweed
  for (const it of f.items) {
    if (it.hp <= 0) continue;
    const wx = it.x + Math.sin(t * 60) * it.wob * 8;
    drawItem(it.type, wx, it.y, it.r, it.rot, it.col, 1);
  }
  ctx.restore();
}

function drawItem(type, x, y, r, rot, col, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y); ctx.rotate(rot);
  if (type === 'pebble') {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(1.5, 2, r, r * 0.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath();
    for (let k = 0; k < 7; k++) {
      const an = (k / 7) * TAU, rr = r * (0.85 + 0.15 * Math.sin(k * 2.3 + r));
      k ? ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr * 0.85) : ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr * 0.85);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.3, r * 0.35, r * 0.22, -0.5, 0, TAU); ctx.fill();
  } else if (type === 'scale') {
    const g = ctx.createLinearGradient(-r, -r, r, r);
    g.addColorStop(0, '#e9f4ff'); g.addColorStop(0.5, '#a9c4dc'); g.addColorStop(1, '#d8c9f0');
    ctx.fillStyle = g; ctx.strokeStyle = 'rgba(80,100,130,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.85, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, r * 0.9, r * 0.9, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
  } else {
    // seaweed strand
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2f6b2e'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(-34, -14); ctx.bezierCurveTo(-14, 6, 6, -22, 34, 10); ctx.stroke();
    ctx.strokeStyle = '#5fa34a'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-34, -14); ctx.bezierCurveTo(-14, 6, 6, -22, 34, 10); ctx.stroke();
    ctx.fillStyle = '#4e9440';
    for (const [lx, ly, an] of [[-20, -4, 0.6], [2, -8, -0.5], [22, 2, 0.8]]) {
      ctx.beginPath(); ctx.ellipse(lx, ly, 8, 3.5, an, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFlyers() {
  for (const f of flyers) {
    const a = f.sunk ? clamp(1 - f.sunk / 0.9, 0, 1) : 1;
    drawItem(f.type, f.x, f.y, f.r * (f.sunk ? 1 - f.sunk * 0.3 : 1), f.rot, f.col, a);
  }
}

// ============================================================
//  The basin
// ============================================================
function drawBasinBack() {
  const b = basinGeom();
  ctx.fillStyle = 'rgba(40,20,5,0.3)';
  ctx.beginPath(); ctx.ellipse(b.x, 884, b.rx * 0.9, 16, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(b.x - b.rx, 0, b.x + b.rx, 0);
  g.addColorStop(0, '#7a4a20'); g.addColorStop(0.25, '#c98f45'); g.addColorStop(0.45, '#f1c77a');
  g.addColorStop(0.7, '#b97a36'); g.addColorStop(1, '#6e4018');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(b.x - b.rx, b.y);
  ctx.bezierCurveTo(b.x - b.rx, b.y + 70, b.x - b.rx * 0.55, 884, b.x, 884);
  ctx.bezierCurveTo(b.x + b.rx * 0.55, 884, b.x + b.rx, b.y + 70, b.x + b.rx, b.y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6b4420';
  ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, TAU); ctx.fill();
  // the water: clear blue, getting browner as the feet get cleaner
  const wg = ctx.createLinearGradient(0, b.y - b.ry, 0, b.y + b.ry);
  wg.addColorStop(0, mixHex('#8fd0f0', '#a89060', murk));
  wg.addColorStop(1, mixHex('#4f9fd0', '#7a6440', murk));
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.ellipse(b.x, b.y + 6, b.rx * 0.9, b.ry * 0.78, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    const yy = b.y + 6 + (k - 1) * 14, ww = b.rx * (0.7 - Math.abs(k - 1) * 0.2);
    ctx.beginPath(); ctx.ellipse(b.x + Math.sin(t * 1.3 + k) * 10, yy, ww, 4, 0, 0.1 * Math.PI, 0.4 * Math.PI); ctx.stroke();
  }
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - r.t / 0.9)})`;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, 6 + r.t * 50, 2 + r.t * 14, 0, 0, TAU); ctx.stroke();
  }
}

function drawBasinFront() {
  const b = basinGeom();
  ctx.strokeStyle = '#8a5a26'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx - 4, b.ry - 3, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = '#f3cf85'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(b.x, b.y - 2, b.rx - 4, b.ry - 3, 0, 0.05 * Math.PI, 0.95 * Math.PI); ctx.stroke();
}

// ============================================================

const SPOUT = [-30, -54], HANDLE = [40, -16];
function rotPt(x, y, a, lx, ly) { return [x + lx * Math.cos(a) - ly * Math.sin(a), y + lx * Math.sin(a) + ly * Math.cos(a)]; }

function drawSleeve(hx, hy) {

function drawTowel(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  roundRect(-46, -26, 96, 60, 12); ctx.fill();
  ctx.fillStyle = '#f5eeda'; ctx.strokeStyle = '#c9bb95'; ctx.lineWidth = 2;
  roundRect(-48, -32, 96, 60, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5b7fb8';

}

// His sleeve, hand, pitcher and the stream of water (or the towel) in the close-up
function drawJesusTools() {
  if (!cur) return;
  if (tool === 'towel' && inWashPhase()) {
    const tx = pointer.x, ty = pointer.y;
    const a = Math.sin(t * 3) * 0.08 + (pointer.down ? Math.sin(t * 18) * 0.06 : 0);
    drawTowel(tx, ty, a);
    drawSleeve(tx + 16, ty - 4);
    return;
  }
  const p = pitcher;
  if (pouring) {
    const [sx, sy] = rotPt(p.x, p.y, p.a, SPOUT[0], SPOUT[1]);
    const ex = pointer.x, ey = pointer.y;
    const cx = sx - 6 + Math.sin(t * 20) * 3, cy = lerp(sy, ey, 0.4);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(140,205,250,0.55)'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(235,248,255,0.9)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.setLineDash([10, 14]); ctx.lineDashOffset = -t * 500;
    ctx.beginPath(); ctx.moveTo(sx - 3, sy); ctx.quadraticCurveTo(cx - 3, cy, ex - 3, ey); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    // foamy splash where it lands
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let k = 0; k < 5; k++) {
      const an = t * 9 + k * 1.3;
      ctx.beginPath(); ctx.arc(ex + Math.cos(an) * 12, ey + Math.sin(an) * 5, 4 + Math.sin(an * 2) * 1.5, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, ey, BRUSH_R * (0.8 + 0.15 * Math.sin(t * 15)), BRUSH_R * 0.35, 0, 0, TAU); ctx.stroke();
  }
  drawPitcher(p.x, p.y, p.a);
  const [hx, hy] = rotPt(p.x, p.y, p.a, HANDLE[0], HANDLE[1]);
  drawSleeve(hx, hy);
}

function updatePitcher(dt) {
  const active = inWashPhase() && (pointer.down || pointer.mouse || kb.active);
  if (active || state === 'title') { pitcher.tx = pointer.x + 62; pitcher.ty = pointer.y - 150; }
  if (state === 'title') { pitcher.tx = W * 0.8; pitcher.ty = 640; }
  if (pitcher.tx === undefined) { pitcher.tx = pitcher.x; pitcher.ty = pitcher.y; }
  const tx = pitcher.tx, ty = pitcher.ty + (refillT > 0 ? 30 : 0);   // dips while refilling
  const k = Math.min(1, dt * 18);
  pitcher.x += (tx - pitcher.x) * k;
  pitcher.y += (ty - pitcher.y) * k;
  const ta = pouring ? -1.0 : refillT > 0 ? 0.35 + Math.sin(t * 20) * 0.1 : -0.12;
  pitcher.a += (ta - pitcher.a) * Math.min(1, dt * 10);
}

// Jesus in the wide shots (reference drawing, without the cloud), with a towel girded
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);
  const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
  g.addColorStop(0, 'rgba(255,235,150,0.45)');
  g.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // bare feet
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(-6, 0, 5, 2.5, 0, 0, TAU); ctx.ellipse(6, 0, 5, 2.5, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  // the towel girded about Him
  ctx.fillStyle = '#f1e6c8';
  ctx.fillRect(-16, -24, 32, 8);
  ctx.fillStyle = '#5b7fb8';
  ctx.fillRect(-16, -22, 32, 1.5);
  ctx.restore();
  ctx.fillStyle = '#f1e6c8'; ctx.strokeStyle = '#c9bb95'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(-11, -4); ctx.lineTo(-4, -5); ctx.lineTo(-3, -18); ctx.closePath(); ctx.fill(); ctx.stroke();

  // Arms: serving (pitcher) or open and welcoming
  const hands = j.pose === 'serve' ? [[-19, -24], [21, -26]] : [[-24, -36], [24, -36]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }
  if (j.pose === 'serve') drawPitcher(26, -14, -0.1, 0.24);

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);

  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;

}

// The disciples waiting (or already washed) behind the table in the close-up
function drawBgDisciples() {
  const others = queue.map((name, k) => ({ name, k })).filter((o) => state !== 'title' && o.k !== qi);
  const left = [], right = [];
  for (let x = W / 2 - 190; x > 30; x -= 78) left.push(x);
  for (let x = W / 2 + 190; x < W - 30; x += 78) right.push(x);
  const slots = [];
  for (let i = 0; i < Math.max(left.length, right.length); i++) {
    if (i < left.length) slots.push(left[i]);
    if (i < right.length) slots.push(right[i]);
  }
  others.forEach((o, i) => {
    if (i >= slots.length) return;
    const d = DISCIPLES.find((x) => x.name === o.name);
    drawPerson(d, o.k < qi ? 'joy' : 'watch', slots[i], 420, 1.05, W / 2, 650);
  });
}

function drawCloseUp() {
  drawRoom(false);
  drawBgDisciples();
  drawTable(404, 60);
  // a soft warm haze separates the background from the close-up
  ctx.fillStyle = 'rgba(120,60,20,0.12)';
  ctx.fillRect(-offX, -offY, viewW, 470 + offY);
  drawBasinBack();
  const c = cur;
  if (c) {
    ctx.save();
    ctx.translate(c.slide * (W * 0.6 + 260), 0);
    drawSeatedBody(c);
    for (const f of c.feet) drawTarget(f, c.d.skin);

    if (c.hands) { drawHandArms(c); for (const h of c.hands) drawTarget(h, c.d.skin); }
    ctx.restore();
  }
  drawFlyers();
  drawBasinFront();
  drawParticles();
  if (c && c.slide === 0 && (phase === 'wash' || phase === 'hands' || state === 'title')) drawPills(c);
  if (state === 'play' || state === 'title' || state === 'pause' || state === 'fail') drawJesusTools();
  if (phase === 'refuse' && state === 'play') drawPeterHint();
  // keyboard sponge cursor
  if (kb.active && inWashPhase()) {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, BRUSH_R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(90,66,16,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, BRUSH_R + 2.5, 0, TAU); ctx.stroke();
  }
}

// Cleanliness percentage over each foot (and dryness once they are clean)
function drawPills(c) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of c.targets) {
    const cl = Math.floor(cleanOf(f) * 100 + 1e-6);
    const [px] = toWorld(f, f.kind === 'foot' ? 95 : 72, 0);
    const py = f.kind === 'foot' ? 506 : f.y0 - 14;
    const ok = cl >= THRESHOLD * 100;
    const label = ok ? `✓ ${cl}%` : `${cl}%`;
    ctx.font = '700 17px Fredoka, sans-serif';
    const w = ctx.measureText(label).width + 22;
    ctx.fillStyle = ok ? 'rgba(43,138,62,0.92)' : 'rgba(255,252,240,0.92)';
    roundRect(px - w / 2, py - 14, w, 28, 14); ctx.fill();
    ctx.fillStyle = ok ? '#ffffff' : '#7a5200';
    ctx.fillText(label, px, py + 1);
    if (c.ready && f.kind === 'foot') {
      const dr = Math.floor(dryOf(f) * 100);
      const l2 = `dry ${dr}%`;
      ctx.font = '600 13px Fredoka, sans-serif';
      const w2 = ctx.measureText(l2).width + 16;
      ctx.fillStyle = 'rgba(91,127,184,0.9)';
      roundRect(px - w2 / 2, py + 17, w2, 22, 11); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(l2, px, py + 28.5);
    }
  }
  ctx.restore();
}

function drawPeterHint() {

  ctx.strokeStyle = `rgba(245,190,40,${0.5 + pulse * 0.5})`; ctx.lineWidth = 5;

  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText('Tap Peter', cx, 640 + pulse * 4);

  ctx.fillText('Tap Peter', cx, 640 + pulse * 4);
  ctx.restore();
}

// ============================================================
//  Speech bubbles and messages
// ============================================================
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawBubble() {
  if (!bubble) return;
  const big = bubble.who === 'jesus';
  let anchor;
  if (big) anchor = scene === 'wash' ? { x: W - 80, y: 640 } : { x: W / 2, y: JESUS_WIDE.y - 74 * JESUS_WIDE.s };
  else anchor = { x: W / 2 + (cur ? cur.slide * (W * 0.6 + 260) : 0), y: SEAT_Y - 69 * SEAT_S - 4 };
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = big ? '700 19px Fredoka, sans-serif' : '600 16px Fredoka, sans-serif';
  const maxW = Math.min(W - 32, big ? 440 : 400);
  const lines = wrapLines(bubble.text, maxW - 28);
  const lh = big ? 24 : 21;
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 28, h = lines.length * lh + 16;
  const bx = clamp(anchor.x - w / 2, 12, W - w - 12);
  const by = anchor.y - h - 16;
  ctx.fillStyle = big ? '#fffbe8' : '#ffffff';
  ctx.strokeStyle = big ? '#e0a526' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  const tx = clamp(anchor.x, bx + 16, bx + w - 16);
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h);
  ctx.stroke();
  ctx.fillStyle = big ? '#8a5a00' : '#3b2f1e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 8 + lh * (i + 0.5) + 1));
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const y = 150 - Math.min(offY, 100) * 0.6;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapLines(message.text, W - 40);
  lines.forEach((ln, i) => {
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(ln, W / 2, y + i * 28);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(ln, W / 2, y + i * 28);
  });
  ctx.restore();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + whose feet
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3208';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Washing Feet' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title' && scene === 'wash' && cur) {
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.fillText(`${cur.name} · ${qi + 1} of ${queue.length}`, 12, 48);
  }
  ctx.shadowBlur = 0;

  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: the supper candle burning down
  const frac = state === 'title' ? 1 : clamp(candle / candleMax, 0, 1);
  const cx = viewW - 30, base = 112;
  const low = frac < 0.2 && state === 'play';
  ctx.fillStyle = '#c9a24a';
  ctx.beginPath(); ctx.ellipse(cx, base + 3, 20, 6, 0, 0, TAU); ctx.fill();
  const ch = 6 + 70 * frac, top = base - ch;
  const wg = ctx.createLinearGradient(cx - 8, 0, cx + 8, 0);
  wg.addColorStop(0, '#e9dcc0'); wg.addColorStop(0.5, '#fffaf0'); wg.addColorStop(1, '#d9c8a4');
  ctx.fillStyle = wg;
  roundRect(cx - 8, top, 16, ch, 3); ctx.fill();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.arc(cx - 5, top + 6, 2.5, 0, TAU); ctx.fill();
  ctx.fillRect(cx - 7.5, top + 4, 5, 6);
  if (candle > 0 || state === 'title') {
    const fl = 1 + Math.sin(t * 17) * 0.1 + Math.sin(t * 31) * 0.06;
    const fg = ctx.createRadialGradient(cx, top - 10, 1, cx, top - 10, 26);
    fg.addColorStop(0, 'rgba(255,220,120,0.6)'); fg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(cx, top - 10, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = low && Math.sin(t * 10) > 0 ? '#ff7a4a' : '#ffc53d';
    ctx.beginPath();
    ctx.moveTo(cx, top - 22 * fl);
    ctx.quadraticCurveTo(cx + 7, top - 8, cx, top - 2);
    ctx.quadraticCurveTo(cx - 7, top - 8, cx, top - 22 * fl);
    ctx.fill();
    ctx.fillStyle = '#fff6d0';
    ctx.beginPath(); ctx.ellipse(cx, top - 7, 2, 4, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#3b2f1e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top - 4); ctx.stroke();
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = low ? '#c92a2a' : '#4a3208';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SUPPER', cx - 26, 22);
  const secs = Math.ceil(state === 'title' ? cfg.perDisc * cfg.names.length : candle);
  ctx.font = '700 18px Fredoka, sans-serif';
  ctx.fillText(`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, cx - 26, 44);
  if (phase === 'hands' && state === 'play') {
    ctx.fillStyle = '#2b6cb0';
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillText(`Bonus ${Math.ceil(handsT)}`, cx - 26, 66);
  }
  ctx.shadowBlur = 0;

  // Bottom: jug (with its water meter), towel and next
  for (const b of toolButtons()) {
    if (b.icon === 'next') {
      const pulse = 1 + Math.sin(t * 5) * 0.03;
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pulse, pulse);
      const gg = ctx.createLinearGradient(0, -22, 0, 22);
      gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#d9961c');
      ctx.fillStyle = '#a8741a'; roundRect(-b.w / 2, -20, b.w, 44, 22); ctx.fill();
      ctx.fillStyle = gg; roundRect(-b.w / 2, -23, b.w, 44, 22); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 19px Fredoka, sans-serif';
      ctx.fillText('Next ›', 0, 0);
      ctx.restore();
      continue;
    }
    const active = (b.icon === 'jug' && tool === 'pitcher') || (b.icon === 'towel' && tool === 'towel');
    ctx.fillStyle = 'rgba(255,252,240,0.88)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = active ? '#e0a526' : 'rgba(90,66,16,0.3)'; ctx.lineWidth = active ? 4 : 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    if (b.icon === 'jug') {
      // water meter ring
      const empty = water <= 0 && refillT <= 0;
      ctx.strokeStyle = 'rgba(60,110,160,0.2)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 6, 0, TAU); ctx.stroke();
      ctx.strokeStyle = water < 25 ? '#e8590c' : '#3d9be0';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 6, -Math.PI / 2, -Math.PI / 2 + (water / 100) * TAU); ctx.stroke();
      if (empty) {
        ctx.strokeStyle = `rgba(232,89,12,${0.5 + 0.5 * Math.sin(t * 9)})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 13, 0, TAU); ctx.stroke();
      }
      drawPitcher(b.x - 2, b.y + 4, refillT > 0 ? Math.sin(t * 20) * 0.15 : 0, 0.42);
      ctx.fillStyle = '#4a3208'; ctx.textAlign = 'center'; ctx.font = '700 11px Fredoka, sans-serif';
      ctx.fillText(refillT > 0 ? 'glug…' : empty ? 'REFILL' : 'WATER', b.x, b.y - b.r - 12);
    } else {
      drawTowel(b.x, b.y + 2, -0.15, 0.5);
      ctx.fillStyle = '#4a3208'; ctx.textAlign = 'center'; ctx.font = '700 11px Fredoka, sans-serif';
      ctx.fillText('TOWEL', b.x, b.y - b.r - 8);
    }
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
  if (scene === 'intro' || scene === 'outro') drawWide();
  else drawCloseUp();
  drawBubble();
  drawMessage();
  // warm vignette of the lamplit evening
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.35, W / 2, H * 0.55, Math.max(viewW, viewH) * 0.8);
  vg.addColorStop(0, 'rgba(60,20,0,0)'); vg.addColorStop(1, 'rgba(60,20,0,0.28)');
  ctx.fillStyle = vg;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateFlyers(dt);
  updateBlinks(dt);
  message.t -= dt;
  bubbleCd -= dt;
  nailHintCd -= dt;
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (state === 'play') {
    if (scene === 'intro') {
      sceneT += dt;
      if (sceneT > 4.5) beginWashing();
    } else {
      moveKeyboardSponge(dt);
      if (refillT > 0) {
        refillT -= dt;
        water = Math.min(100, water + (dt * 100) / REFILL_TIME);
        if (refillT <= 0) { water = 100; emptyWarned = false; }
      }
      updateWash(dt);
    }
  } else if (state === 'win') {
    sceneT += dt;
    if (sceneT >= 3.9 && !musicPlayed) {
      musicPlayed = true;
      const love = verseText('loveShort');
      say('jesus', love.charAt(0).toUpperCase() + love.slice(1) + '.', 3.4);
      sfx.win();
    }
    if (Math.random() < dt * 10) spawn(rand(0, W), rand(450, 650), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  }
  if (cur && scene === 'wash') {
    layoutTargets(cur, dt);
    updateMood(dt);
    for (const f of cur.targets) flushTarget(f);
    if (cur.hands) for (const f of cur.feet) flushTarget(f);
  }
  if (!inWashPhase()) pouring = false;
  updatePitcher(dt);
  endScreens(dt);
  sfx.water(pouring && state === 'play' ? 1 : 0, pourHit);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') update(dt);
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
