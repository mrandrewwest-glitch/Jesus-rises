<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>

    --ink: #3b2f1e;

  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;

    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {

    margin-top: 8px;
    text-align: center;

    margin: 8px 0;

  kbd {

    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;

    color: #8a6a2a;
    font-weight: 600;

  }

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Overlay cards
  pourWash:   { ref: 'John 13:5',  KJV: 'After that he poureth water into a bason, and began to wash the disciples’ feet, and to wipe them with the towel wherewith he was girded.', NKJV: null, NIV: null, NLT: null },
  oneAnother: { ref: 'John 13:14', KJV: 'If I then, your Lord and Master, have washed your feet; ye also ought to wash one another’s feet.', NKJV: null, NIV: null, NLT: null },
  newCommand: { ref: 'John 13:34', KJV: 'A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another.', NKJV: null, NIV: null, NLT: null },

  // Level intro caption
  girded:     { ref: 'John 13:4',  KJV: 'He riseth from supper, and laid aside his garments; and took a towel, and girded himself.', NKJV: null, NIV: null, NLT: null },
  // Speech bubbles
  never:      { ref: 'John 13:8',  KJV: 'Thou shalt never wash my feet.', NKJV: null, NIV: null, NLT: null },
  handsHead:  { ref: 'John 13:9',  KJV: 'Lord, not my feet only, but also my hands and my head.', NKJV: null, NIV: null, NLT: null },
  washed:     { ref: 'John 13:10', KJV: 'He that is washed needeth not save to wash his feet, but is clean every whit.', NKJV: null, NIV: null, NLT: null },
  loveShort:  { ref: 'John 13:34', KJV: 'love one another', NKJV: null, NIV: null, NLT: null },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes wall above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// A rounded-rectangle sub-path that works on any context (used for masks)
function rrPath(c, x, y, w, h, r) {
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function mixHex(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((x >> s) & 255, (y >> s) & 255, f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// ============================================================
//  Tuning
// ============================================================
const THRESHOLD = 0.9;     // each foot must be this clean
const BRUSH_R = 26;        // size of the water stream's scrub
const TOWEL_R = 38;        // size of the towel
const POWER = 80;          // how much grime one stamp of water lifts
const REFILL_TIME = 1.2;   // seconds to refill the pitcher
const MASK_SCALE = 0.8;    // mask pixels per logical pixel (144 x 216 per foot)
const SEAT_Y = 440;        // the disciple's waist in the close-up
const SEAT_S = 2.4;        // close-up scale of the disciple
const FEET_Y = 530;        // top of the feet (the ankles, under the robe hem)
const HANDS_TIME = 10;     // Peter's bonus round
const FOOT = { bw: 180, bh: 270 };
const HAND = { bw: 140, bh: 190 };

// The toes of a left-hand-on-screen foot (the disciple's right foot: big toe toward the middle)
const TOES = [
  { x: 143, y: 232, rx: 22, ry: 27, a: -0.1 },   // big toe
  { x: 107, y: 240, rx: 15, ry: 19, a: 0 },
  { x: 78, y: 236, rx: 13.5, ry: 17, a: 0.05 },
  { x: 52, y: 228, rx: 12.5, ry: 15, a: 0.12 },
  { x: 29, y: 214, rx: 11, ry: 13, a: 0.25 },
];
// Gaps between the toes, where pebbles get stuck
const GAPS = TOES.slice(0, 4).map((e, i) => [(e.x + TOES[i + 1].x) / 2, (e.y + TOES[i + 1].y) / 2 - 12]);
// Fingers of a palm-down hand: [x, y, w, h]
const FINGERS = [[24, 96, 20, 58], [46, 100, 22, 76], [70, 102, 22, 82], [94, 98, 22, 74]];

// Kinds of grime. tough = passes needed; soft layers fade, hard ones leave a wet edge.
const DIRT = {
  dust:  { col: [170, 128, 84],  tough: 1,   soft: true },
  sand:  { col: [226, 198, 138], tough: 1.3, soft: true },
  grass: { col: [104, 142, 58],  tough: 2.2, soft: true },
  mud:   { col: [116, 80, 46],   rim: [66, 42, 22],  tough: 3.4 },
  ink:   { col: [44, 56, 104],   rim: [22, 28, 62],  tough: 2.8 },
  fig:   { col: [128, 54, 108],  rim: [82, 28, 70],  tough: 2.5 },
  muck:  { col: [112, 126, 62],  rim: [72, 84, 36],  tough: 3.2 },
};

const LEVEL_NAMES = [
  'The Upper Room',
  'Dusty Roads',
  'After the Fields',
  'The Long Walk',
  'All Twelve Washed',
  'Love One Another',
];
const LINEUPS = [
  ['John', 'Andrew', 'Peter'],
  ['Matthew', 'Thomas', 'James', 'Philip'],
  ['Bartholomew', 'Thaddaeus', 'Simon', 'James the Less', 'Judas'],
  ['Peter', 'John', 'Andrew', 'James', 'Philip', 'Matthew'],
  ['Thomas', 'Bartholomew', 'Thaddaeus', 'Simon', 'James the Less', 'Judas'],
];

function makeConfig(n) {
  let names = LINEUPS[n - 1];
  if (!names) {
    const rest = DISCIPLES.map((d) => d.name).filter((x) => x !== 'Peter').sort(() => Math.random() - 0.5);
    names = rest.slice(0, 5);
    names.splice(Math.floor(rand(0, 5)), 0, 'Peter');
  }
  return {
    name: LEVEL_NAMES[n - 1] || `Supper ${n}`,
    names,
    grime: Math.min(1 + (n - 1) * 0.15, 1.8),     // how much grime is on each foot
    tough: Math.min(1 + (n - 1) * 0.06, 1.3),     // how many passes it takes
    pebbles: [1, 2, 2, 3, 3][n - 1] || 4,
    nails: [1, 1, 2, 2, 3][n - 1] || 3,
    perDisc: Math.max(46, 58 - (n - 1) * 2),      // candle seconds per disciple
    nailTime: 0.9 + Math.min(n - 1, 5) * 0.1,
    waterUse: Math.min(13, 8 + (n - 1) * 1.1),     // pitcher drains this much per second
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('washingFeetBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let scene = 'wash';       // intro | wash | outro
let sceneT = 0;
let queue = [], qi = 0;   // disciples in this level and whose turn it is
let cur = null;           // the disciple being washed
let phase = 'title';      // enter | refuse | talk | wash | hands | leave
let phaseT = 0;
let candle = 1, candleMax = 1;
let water = 100, refillT = 0, tool = 'pitcher', emptyWarned = false, pouring = false, pourHit = false;
let particles = [], flyers = [], ripples = [];
let message = { text: '', t: 0 };
let bubble = null, talkQueue = [], talkDone = null, bubbleCd = 0, nailHintCd = 0;
let stats = null;
let endTimer = 0, lastScore = null, musicPlayed = false;
let murk = 0;             // the basin water gets browner as feet get cleaner
let handsT = 0;
let firstNail = true;
const pitcher = { x: 360, y: 480, a: -0.1 };
const pointer = { x: 360, y: 640, lx: 360, ly: 640, down: false, id: null, speed: 0, mouse: false };
const kb = { active: false };

function newStats() {
  return { cleanPts: 0, dryPts: 0, handsPts: 0, grit: 0, nails: 0, poured: 0, onTarget: 0 };
}

// ============================================================
//  Disciples
// ============================================================
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Philip',      robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { name: 'Bartholomew', robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { name: 'James the Less', robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
  { name: 'Thaddaeus',   robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
  { name: 'Simon',       robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c', scarf: '#d8c7a0' },
  { name: 'Judas',       robe: '#6d6a52', hair: '#2a1c10', beard: true,  skin: '#c28a58' },
].map((d, i) => ({ ...d, i, blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU) }));

// Each disciple's feet tell where they have been
const STYLES = {
  Peter:  { layers: ['sand', 'mud'], scales: 4, weed: true, quip: 'Sorry about the fish, Lord!' },
  Andrew: { layers: ['sand', 'dust'], scales: 3, quip: 'I’ve been down by the sea!' },
  James:  { layers: ['sand', 'mud'], scales: 3, weed: true, quip: 'Nets, mud… sorry, Master!' },
  John:   { layers: ['dust', 'sand'], quip: 'It was a very dusty road!' },
  Matthew: { layers: ['dust', 'ink'], quip: 'Ink from the tax booth. Oops.' },
  Thomas: { layers: ['grass', 'mud'], quip: 'Muddy fields… I doubt it will come off!' },
  Philip: { layers: ['dust', 'fig'], quip: 'I stepped on a fig. Or three.' },
  Bartholomew: { layers: ['fig', 'dust'], quip: 'I was sitting under a fig tree!' },
  Thaddaeus: { layers: ['grass', 'dust'], quip: 'Long grass all the way here!' },
  Simon:  { layers: ['mud', 'muck'], quip: 'Don’t ask what the green stuff is.' },
  'James the Less': { layers: ['dust', 'grass', 'sand'], quip: 'Sand between every toe!' },
  Judas:  { layers: ['dust', 'mud'], quip: 'A long day in the market.' },
};

const TICKLE = ['Hee hee! That tickles!', 'Ha ha! Not the toes!', 'Hee hee hee!'];
const RELIEF = ['Ahh… that feels better.', 'Mmm, lovely cool water.', 'Ahh, so fresh!'];
const WOW = ['Wow, look at that shine!', 'Is that really my foot?!', 'Sparkling!'];
const THANKS = ['Thank you, Master.', 'Thank you, Lord!', 'My feet have never been so clean!'];

function updateBlinks(dt) {
  for (const d of DISCIPLES) {
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

// ============================================================
//  Feet and hands: dirt masks
// ============================================================
// Outline of a foot (toes pointing down at the viewer) or a palm-down hand,
// in unmirrored local coordinates.
function traceShape(c, kind) {
  c.beginPath();
  if (kind === 'hand') {
    rrPath(c, 22, 8, 98, 112, 28);
    for (const f of FINGERS) rrPath(c, f[0], f[1], f[2], f[3], f[2] / 2);
    c.moveTo(124 + 11 * Math.cos(-0.45), 90 + 11 * Math.sin(-0.45));
    c.ellipse(124, 90, 11, 32, -0.45, 0, TAU);
    return;
  }
  c.moveTo(52, 0);
  c.lineTo(138, 0);
  c.bezierCurveTo(140, 70, 170, 120, 168, 188);
  c.bezierCurveTo(167, 214, 150, 222, 128, 222);
  c.lineTo(42, 216);
  c.bezierCurveTo(20, 208, 14, 176, 20, 148);
  c.bezierCurveTo(28, 100, 50, 60, 52, 0);
  c.closePath();
  for (const e of TOES) {
    c.moveTo(e.x + e.rx * Math.cos(e.a), e.y + e.rx * Math.sin(e.a));
    c.ellipse(e.x, e.y, e.rx, e.ry, e.a, 0, TAU);
  }
}

// Paints one grime layer's coverage (only the alpha matters) in local coordinates
function genDirt(c, type, kind, grime) {
  const G = kind === 'hand' ? HAND : FOOT, bw = G.bw, bh = G.bh;
  const n = (k) => Math.max(1, Math.round(k * grime));
  const pt = (bias = 1) => [rand(14, bw - 14), bh * (0.06 + 0.92 * Math.pow(Math.random(), bias))];
  const blob = (x, y, r, a) => {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  };
  const disc = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  c.fillStyle = '#000'; c.strokeStyle = '#000'; c.lineCap = 'round';
  switch (type) {
    case 'dust':
      c.fillStyle = 'rgba(0,0,0,0.42)'; c.fillRect(0, 0, bw, bh);
      for (let k = 0; k < n(6); k++) { const [x, y] = pt(0.6); blob(x, y, rand(28, 56), 0.8); }
      break;
    case 'sand': {
      const g = c.createLinearGradient(0, bh * 0.55, 0, bh);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
      c.fillStyle = g; c.fillRect(0, 0, bw, bh);
      for (let k = 0; k < n(260); k++) {
        const [x, y] = pt(0.45);
        c.fillStyle = `rgba(0,0,0,${rand(0.7, 1)})`; disc(x, y, rand(1.1, 2.5));
      }
      break;
    }
    case 'mud':
      c.fillStyle = '#000';
      for (let k = 0; k < n(3); k++) {
        const [x, y] = pt(0.8), r = rand(20, 34);
        disc(x, y, r);
        for (let s = 0; s < 9; s++) {
          const a = rand(0, TAU), dd = r * rand(0.7, 1.15);
          disc(x + Math.cos(a) * dd, y + Math.sin(a) * dd, r * rand(0.18, 0.45));
        }
        c.lineWidth = r * 0.35;
        for (let s = 0; s < 2; s++) {
          const dx = rand(-r * 0.6, r * 0.6);
          c.beginPath(); c.moveTo(x + dx, y); c.lineTo(x + dx, y + r + rand(8, 26)); c.stroke();
        }
      }
      break;
    case 'ink':
      c.strokeStyle = 'rgba(0,0,0,0.95)';
      for (let k = 0; k < n(2); k++) {
        const [x, y] = pt(0.9);
        c.lineWidth = rand(7, 13);
        c.beginPath(); c.moveTo(x, y);
        c.bezierCurveTo(x + rand(-40, 40), y + rand(-30, 30), x + rand(-40, 40), y + rand(-30, 30), x + rand(-50, 50), y + rand(-40, 40));
        c.stroke();
      }
      { const [x, y] = pt(1); c.fillStyle = 'rgba(0,0,0,0.85)'; c.beginPath(); c.ellipse(x, y, 12, 15, rand(-0.5, 0.5), 0, TAU); c.fill(); }
      c.fillStyle = '#000';
      for (let k = 0; k < n(8); k++) { const [x, y] = pt(1); disc(x, y, rand(1.5, 3.5)); }
      break;
    case 'fig':
      c.fillStyle = '#000';
      for (let k = 0; k < n(3); k++) {
        const [x, y] = pt(0.9), r = rand(12, 22);
        disc(x, y, r);
        for (let s = 0; s < 5; s++) { const a = rand(0, TAU); disc(x + Math.cos(a) * r * 1.4, y + Math.sin(a) * r * 1.4, rand(2, 4)); }
        c.lineWidth = 5;
        const dx = rand(-r * 0.5, r * 0.5), len = rand(16, 36);
        c.beginPath(); c.moveTo(x + dx, y); c.lineTo(x + dx, y + r + len); c.stroke();
        disc(x + dx, y + r + len, 4.5);
      }
      break;
    case 'grass':
      c.strokeStyle = 'rgba(0,0,0,0.85)';
      for (let k = 0; k < n(5); k++) {
        const [x, y] = pt(0.8), a = rand(-0.6, 0.6) + (Math.random() < 0.5 ? 0 : Math.PI), len = rand(40, 90);
        c.lineWidth = rand(4, 8);
        c.beginPath(); c.moveTo(x, y);
        c.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + rand(-10, 10), y + Math.sin(a) * len * 0.5 + rand(-10, 10), x + Math.cos(a) * len, y + Math.sin(a) * len);
        c.stroke();
      }
      break;
    case 'muck':
      c.fillStyle = '#000';
      for (let k = 0; k < n(1.4); k++) {
        const x = rand(30, bw - 30), y = rand(bh * 0.45, bh * 0.9), r = rand(26, 40);
        for (let s = 0; s < 10; s++) {
          const a = rand(0, TAU), dd = rand(0, r * 0.6);
          disc(x + Math.cos(a) * dd, y + Math.sin(a) * dd, r * rand(0.4, 0.7));
        }
      }
      break;
  }
}

// One scrubbable foot or hand, with its own small offscreen canvas
function makeTarget(kind, side, y0, layerTypes, opts) {
  const G = kind === 'hand' ? HAND : FOOT;
  const mw = Math.round(G.bw * MASK_SCALE), mh = Math.round(G.bh * MASK_SCALE), N = mw * mh;
  const cv = document.createElement('canvas');
  cv.width = mw; cv.height = mh;
  const c2 = cv.getContext('2d', { willReadFrequently: true });
  c2.save(); c2.scale(MASK_SCALE, MASK_SCALE); c2.fillStyle = '#000'; traceShape(c2, kind); c2.fill(); c2.restore();
  const shapeData = c2.getImageData(0, 0, mw, mh).data;
  const inside = new Uint8Array(N);
  let insideCount = 0;
  for (let i = 0; i < N; i++) if (shapeData[i * 4 + 3] > 100) { inside[i] = 1; insideCount++; }
  let dirt0 = 0;
  const layers = layerTypes.map((type) => {
    c2.clearRect(0, 0, mw, mh);
    c2.save(); c2.scale(MASK_SCALE, MASK_SCALE); genDirt(c2, type, kind, opts.grime); c2.restore();
    const a = c2.getImageData(0, 0, mw, mh).data;
    const amt = new Uint8Array(N), tex = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      tex[i] = Math.random() * 255;
      if (inside[i]) { amt[i] = Math.min(255, a[i * 4 + 3]); if (amt[i] < 16) amt[i] = 0; dirt0 += amt[i]; }
    }
    const def = DIRT[type];
    return { type, def, amt, tex, tough: def.tough * opts.tough };
  });
  c2.clearRect(0, 0, mw, mh);
  const f = {
    kind, side, mirror: side > 0, bw: G.bw, bh: G.bh, mw, mh, x0: 0, y0, ox: 0, oy: 0, wig: 0,
    canvas: cv, cctx: c2, img: c2.createImageData(mw, mh),
    inside, insideCount, layers, dirt0: Math.max(1, dirt0), dirtSum: dirt0,
    wet: new Uint8Array(N), everWet: new Uint8Array(N), wetSum: 0, everWetCount: 0,
    dirty: [0, 0, mw, mh], items: [], nails: [],
  };
  flushTarget(f);
  return f;
}

// Rebuilds the dirty part of a target's canvas from its grime + wetness layers
function flushTarget(f) {
  const d = f.dirty;
  if (!d) return;
  const x0 = clamp(Math.floor(d[0]), 0, f.mw), y0 = clamp(Math.floor(d[1]), 0, f.mh);
  const x1 = clamp(Math.ceil(d[2]), 0, f.mw), y1 = clamp(Math.ceil(d[3]), 0, f.mh);
  f.dirty = null;
  if (x1 <= x0 || y1 <= y0) return;
  const data = f.img.data, mw = f.mw, layers = f.layers;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = y * mw + x, o = i * 4;
      if (!f.inside[i]) { data[o + 3] = 0; continue; }
      let r = 0, g = 0, b = 0, a = 0;
      const w = f.wet[i];
      if (w) { a = (w / 255) * 0.36; r = 238; g = 249; b = 255; }   // wet shine
      for (let k = 0; k < layers.length; k++) {
        const L = layers[k], v = L.amt[i];
        if (!v) continue;
        const T = L.def, tt = v / 255, tx = L.tex[i] / 255;
        let la, cr, cg, cb;
        if (T.soft) {
          la = Math.min(1, tt * 1.15) * (0.8 + 0.2 * tx);
          const m = 0.82 + 0.18 * tx;
          cr = T.col[0] * m; cg = T.col[1] * m; cb = T.col[2] * m;
        } else {
          // thick grime: solid, with a dark wet edge where it has been scrubbed thin
          la = tt < 0.07 ? 0 : Math.min(1, (tt - 0.07) * 5);
          const e = clamp((tt - 0.07) * 3.2, 0, 1), m = 0.8 + 0.2 * tx;
          cr = lerp(T.rim[0], T.col[0], e) * m; cg = lerp(T.rim[1], T.col[1], e) * m; cb = lerp(T.rim[2], T.col[2], e) * m;
        }
        const na = la + a * (1 - la);
        if (na > 0) {
          r = (cr * la + r * a * (1 - la)) / na;
          g = (cg * la + g * a * (1 - la)) / na;
          b = (cb * la + b * a * (1 - la)) / na;
        }
        a = na;
      }
      data[o] = r; data[o + 1] = g; data[o + 2] = b; data[o + 3] = a * 255;
    }
  }
  f.cctx.putImageData(f.img, 0, 0, x0, y0, x1 - x0, y1 - y0);
}

function markDirty(f, x0, y0, x1, y1) {
  if (!f.dirty) f.dirty = [x0, y0, x1, y1];
  else {
    const d = f.dirty;
    d[0] = Math.min(d[0], x0); d[1] = Math.min(d[1], y0); d[2] = Math.max(d[2], x1); d[3] = Math.max(d[3], y1);
  }
}

// Water stamp: wets the skin and lifts grime from the top layer down
function scrubTarget(f, lx, ly, R, power) {
  const s = MASK_SCALE, cx = lx * s, cy = ly * s, r = R * s, r2 = r * r;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(f.mw, Math.ceil(cx + r) + 1);
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(f.mh, Math.ceil(cy + r) + 1);
  let removed = 0, cleared = 0;
  const layers = f.layers;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const d2 = ((x - cx) * (x - cx) + (y - cy) * (y - cy)) / r2;
      if (d2 >= 1) continue;
      const i = y * f.mw + x;
      if (!f.inside[i]) continue;
      const fall = 1 - d2;
      if (!f.everWet[i]) { f.everWet[i] = 1; f.everWetCount++; }
      const w = f.wet[i];
      if (w < 255) { const nw = Math.min(255, Math.floor(w + 255 * fall * 1.5 + 30)); f.wetSum += nw - w; f.wet[i] = nw; }
      let p = power * fall;
      for (let k = layers.length - 1; k >= 0 && p > 0; k--) {
        const L = layers[k], v = L.amt[i];
        if (!v) continue;
        let nv = Math.floor(v - p / L.tough);   // whole numbers keep the running total exact
        if (nv < 16) { nv = 0; cleared++; }
        p -= (v - nv) * L.tough;
        removed += v - nv;
        L.amt[i] = nv;
        if (nv > 0) break;
      }
    }
  }
  f.dirtSum -= removed;
  markDirty(f, x0, y0, x1, y1);
  return { removed, cleared };
}

// Towel stamp: dries the wet skin
function dryTarget(f, lx, ly, R, power) {
  const s = MASK_SCALE, cx = lx * s, cy = ly * s, r = R * s, r2 = r * r;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(f.mw, Math.ceil(cx + r) + 1);
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(f.mh, Math.ceil(cy + r) + 1);
  let dried = 0;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const d2 = ((x - cx) * (x - cx) + (y - cy) * (y - cy)) / r2;
      if (d2 >= 1) continue;
      const i = y * f.mw + x, w = f.wet[i];
      if (!w) continue;
      let nw = Math.floor(w - power * (1 - d2 * 0.6));
      if (nw < 20) nw = 0;
      dried += w - nw;
      f.wet[i] = nw;
    }
  }
  f.wetSum -= dried;
  markDirty(f, x0, y0, x1, y1);
  return dried;
}

function toLocal(f, x, y) {
  let lx = x - (f.x0 + f.ox);
  const ly = y - (f.y0 + f.oy);
  if (f.mirror) lx = f.bw - lx;
  return [lx, ly];
}
function toWorld(f, lx, ly) {
  return [f.x0 + f.ox + (f.mirror ? f.bw - lx : lx), f.y0 + f.oy + ly];
}
function nearTarget(f, x, y, pad) {
  const [lx, ly] = toLocal(f, x, y);
  return lx > -pad && lx < f.bw + pad && ly > -pad && ly < f.bh + pad;
}
function isOnSkin(f, x, y) {
  const [lx, ly] = toLocal(f, x, y);
  const mx = Math.floor(lx * MASK_SCALE), my = Math.floor(ly * MASK_SCALE);
  if (mx < 0 || my < 0 || mx >= f.mw || my >= f.mh) return false;
  return !!f.inside[my * f.mw + mx];
}

// Cleanliness 0..1: the grime layers, the pebbles and the toenails
function cleanOf(f) {
  const g = clamp((1 - f.dirtSum / f.dirt0) / 0.97, 0, 1);
  const parts = [[g, 0.7]];
  if (f.items.length) parts.push([f.items.filter((i) => i.hp <= 0).length / f.items.length, 0.15]);
  const dn = f.nails.filter((n) => n.dirty);
  if (dn.length) parts.push([dn.reduce((s, n) => s + (1 - n.grime), 0) / dn.length, 0.15]);
  const wsum = parts.reduce((s, p) => s + p[1], 0);
  return parts.reduce((s, p) => s + p[0] * p[1], 0) / wsum;
}
function gridClean(f) { return clamp((1 - f.dirtSum / f.dirt0) / 0.97, 0, 1); }
function dryOf(f) { return f.everWetCount ? clamp(1 - f.wetSum / (255 * f.everWetCount), 0, 1) : 1; }

function addItems(f, st, k) {
  const spots = GAPS.map((g) => g.slice()).sort(() => Math.random() - 0.5);
  for (let i = 0; i < cfg.pebbles; i++) {
    const p = i < spots.length ? spots[i] : [rand(40, 150), rand(150, 205)];
    f.items.push({ type: 'pebble', x: p[0] + rand(-2, 2), y: p[1] + rand(-2, 2), r: rand(5.5, 8), hp: 0.3,
      rot: rand(0, TAU), col: pick(['#9a9288', '#8a7d6b', '#b0a89a', '#7d746a']), wob: 0 });
  }
  for (let i = 0; i < (st.scales || 0); i++) {
    f.items.push({ type: 'scale', x: rand(45, 150), y: rand(60, 205), r: 6, hp: 0.14, rot: rand(0, TAU), wob: 0 });
  }
  if (st.weed && k === 0) f.items.push({ type: 'weed', x: 96, y: 168, r: 26, hp: 0.8, rot: rand(-0.3, 0.3), wob: 0 });
}

function addNails(f) {
  TOES.forEach((e, i) => {
    const dirty = i < cfg.nails;
    f.nails.push({ x: e.x, y: e.y + e.ry * 0.4, rx: e.rx * 0.55, ry: e.ry * 0.42, grime: dirty ? 1 : 0, dirty, glint: 0, active: 0 });
  });
}

function makeDisciple(name) {
  const d = DISCIPLES.find((x) => x.name === name);
  const st = STYLES[name];
  const layers = st.layers.slice();
  if (level >= 4 && !layers.includes('mud') && !layers.includes('muck')) layers.unshift('mud');
  const opts = { grime: cfg.grime, tough: cfg.tough };
  const feet = [-1, 1].map((side) => makeTarget('foot', side, FEET_Y, layers, opts));
  feet.forEach((f, k) => { addItems(f, st, k); addNails(f); });
  const c = {
    d, name, st, feet, hands: null, targets: feet, mood: 'watch', moodT: 0, tickle: 0, relief: 0,
    ready: false, tuck: 0, slide: 0, clean100: [false, false], handsDone: false, isPeter: name === 'Peter',
  };
  layoutTargets(c, 0);
  return c;
}

function layoutTargets(c, dt) {
  for (const f of c.feet) {
    f.x0 = W / 2 + (f.side < 0 ? -190 : 10);
    f.oy = -c.tuck * 150;
    f.wig = Math.max(0, f.wig - dt);
    f.ox = Math.sin(t * 38) * f.wig * 5;
  }
  if (c.hands) for (const h of c.hands) h.x0 = W / 2 + (h.side < 0 ? -158 : 18);
}

// ============================================================
//  Particles, flying pebbles, ripples
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function star(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') star(p.x, p.y, p.size * (0.4 + 0.6 * Math.sin(a * Math.PI)));
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function sparkleBurst(x, y, n, spread = 60) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-spread, spread), y + rand(-spread, spread), rand(-20, 20), rand(-40, 0), rand(0.5, 1.1),
      pick(['#ffffff', '#fff6d0', '#ffe27a', '#d9f3ff']), rand(5, 10), 0, 'star');
  }
}

function basinGeom() { return { x: W / 2, y: 790, rx: Math.min(250, W / 2 - 14), ry: 56 }; }

// A pebble / scale / seaweed pops off and arcs into the basin
function popItem(f, it) {
  const [wx, wy] = toWorld(f, it.x, it.y);
  const b = basinGeom();
  const landY = 812 + rand(0, 24);
  const tx = clamp(wx + rand(-90, 90), b.x - b.rx * 0.75, b.x + b.rx * 0.75);
  const vy = rand(-420, -300), g = 1300;
  const T = (-vy + Math.sqrt(vy * vy + 2 * g * Math.max(0, landY - wy))) / g;
  flyers.push({ type: it.type, x: wx, y: wy, vx: (tx - wx) / T, vy, rot: it.rot, vr: rand(-12, 12), r: it.r, col: it.col, landY, sunk: 0 });
  stats.grit++;
  for (let i = 0; i < 6; i++) spawn(wx, wy, rand(-80, 80), rand(-160, -40), 0.5, '#bfe6ff', rand(2, 3.5), 700);
  if (it.type === 'pebble') { sfx.tink(); showMessage('Tink!', 0.8); }
  else if (it.type === 'scale') sfx.flick();
  else { sfx.flick(); sfx.puff(0.15); showMessage('Seaweed! Ha!', 1.2); }
}

function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    if (!f.sunk) {
      f.vy += 1300 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
      if (f.vy > 0 && f.y >= f.landY) {
        f.sunk = 0.001; f.y = f.landY;
        ripples.push({ x: f.x, y: f.y, t: 0 });
        for (let k = 0; k < 8; k++) spawn(f.x, f.y, rand(-70, 70), rand(-150, -60), 0.5, '#d4f0ff', rand(2, 3.5), 600);
        sfx.plop();
      }
    } else {
      f.sunk += dt;
      f.y += dt * 10;
      if (f.sunk > 0.9) flyers.splice(i, 1);
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.9) ripples.splice(i, 1); }
}

// ============================================================
//  Talking
// ============================================================
function say(who, text, dur = 2.4) { bubble = { who, text, t: dur }; }

// Lines play one after another; verse lines are looked up as they appear
function runTalk(lines, done) { talkQueue = lines.slice(); talkDone = done; bubble = null; phase = 'talk'; phaseT = 0; }

function updateTalk() {
  if (bubble) return;
  const next = talkQueue.shift();
  if (!next) { const f = talkDone; talkDone = null; if (f) f(); return; }
  if (next.fn) next.fn();
  say(next.who, next.key ? verseText(next.key) : next.text, next.dur);
}

function setMood(m, dur) { if (cur) { cur.mood = m; cur.moodT = dur; } }

function updateMood(dt) {
  const c = cur;
  c.moodT -= dt;
  if (c.moodT > 0 && state === 'play') return;
  let m = 'watch';
  if (state === 'fail') m = 'dismay';
  else if (phase === 'refuse') m = 'refuse';
  else if (phase === 'leave') m = 'joy';
  else if (c.ready) m = 'relief';
  else if (phase === 'wash' && candle < candleMax * 0.15) m = 'worried';
  c.mood = m;
}

// ============================================================
//  Level flow
// ============================================================
function beginDisciple(i) {
  cur = makeDisciple(queue[i]);
  cur.slide = 1;
  phase = 'enter'; phaseT = 0;
  tool = 'pitcher';
  bubble = null;
}

function startRefuse() {
  phase = 'refuse'; phaseT = 0;
  say('disc', verseText('never'), 999);
  sfx.bounce();
}

function peterTapped() {
  if (phase !== 'refuse') return;
  sfx.tap(0.6);
  runTalk([
    { who: 'jesus', key: 'noPart', dur: 3.6 },
    { who: 'disc', key: 'handsHead', dur: 3.6, fn: () => { setMood('joy', 3.6); cur.untuck = true; sfx.giggle(); } },
  ], startWashPhase);
}

function startWashPhase() {
  phase = 'wash'; phaseT = 0;
  cur.untuck = true;
  tool = 'pitcher';
  say('disc', cur.st.quip, 2.6);
  if (level === 1 && qi === 0) {
    showMessage(kb.active ? 'Hold Space to wash, arrows to move' : 'Press and drag over the feet to wash!', 3);
  }
}

function checkReady() {
  const c = cur;
  const cl = c.targets.map(cleanOf);
  cl.forEach((v, k) => {
    if (v >= 0.999 && !c.clean100[k]) {
      c.clean100[k] = true;
      const f = c.targets[k];
      setMood('wow', 1.4);
      const [wx, wy] = toWorld(f, f.bw / 2, f.bh / 2);
      sparkleBurst(wx, wy, 16, 70);
      sfx.chime();
      if (bubbleCd <= 0) { say('disc', pick(WOW), 1.8); bubbleCd = 5; }
    }
  });
  if (!c.ready && cl.every((v) => v >= THRESHOLD)) {
    c.ready = true;
    tool = 'towel';
    sfx.chime();
    showMessage('Clean! Now dry them with the towel', 2.6);
  }
  if (c.ready && c.feet.every((f) => dryOf(f) >= 0.92)) {
    showMessage('Squeaky clean!', 1.6);
    finishDisciple();
  }
}

function finishDisciple() {
  if (phase !== 'wash' || !cur) return;
  const c = cur;
  const avg = c.feet.reduce((s, f) => s + cleanOf(f), 0) / c.feet.length;
  const dry = c.feet.reduce((s, f) => s + dryOf(f), 0) / c.feet.length;
  stats.cleanPts += Math.round(avg * 600);
  stats.dryPts += Math.round(dry * 200);
  sfx.squeak();
  for (const f of c.feet) { const [wx, wy] = toWorld(f, f.bw / 2, f.bh / 2); sparkleBurst(wx, wy, 10, 70); }
  if (c.isPeter && !c.handsDone) { startHands(); return; }
  startLeave();
}

function startHands() {
  const c = cur;
  c.handsDone = true;
  c.hands = [-1, 1].map((side) => makeTarget('hand', side, 392, ['sand', 'dust'], { grime: 0.8, tough: 1 }));
  c.hands.forEach((h) => {
    for (let i = 0; i < 3; i++) h.items.push({ type: 'scale', x: rand(35, 110), y: rand(25, 110), r: 6, hp: 0.12, rot: rand(0, TAU), wob: 0 });
  });
  layoutTargets(c, 0);
  c.targets = c.hands;
  c.ready = false;
  phase = 'hands'; phaseT = 0;
  handsT = HANDS_TIME;
  water = 100; refillT = 0; tool = 'pitcher';
  setMood('joy', 1.5);
  showMessage('Bonus! Quick, wash Peter’s hands too!', 2.4);
  sfx.giggle();
}

function endHands() {
  const c = cur;
  const avg = c.hands.reduce((s, h) => s + cleanOf(h), 0) / c.hands.length;
  stats.handsPts = Math.round(avg * 400);
  for (const h of c.hands) { const [wx, wy] = toWorld(h, h.bw / 2, h.bh / 2); sparkleBurst(wx, wy, 10, 50); }
  sfx.chime();
  runTalk([{ who: 'jesus', key: 'washed', dur: 4 }], startLeave);
}

function startLeave() {
  phase = 'leave'; phaseT = 0;
  say('disc', pick(THANKS), 1.3);
}

function nextDisciple() {
  qi++;
  if (qi >= queue.length) levelWon();
  else beginDisciple(qi);
}

function burnCandle(dt) {
  candle -= dt;
  if (candle <= 0) { candle = 0; fail(); }
}

function startRefill() {
  if (refillT > 0 || water >= 99.5) return;
  refillT = REFILL_TIME;
  sfx.glug();
}
function jugPressed() { tool = 'pitcher'; startRefill(); }
function towelPressed() {
  if (phase !== 'wash') return;
  tool = tool === 'towel' ? 'pitcher' : 'towel';
  sfx.puff(0.12);
}

// The water and the towel, driven by the pointer (or the keyboard sponge)
function doTools(dt) {
  const c = cur;
  const pressing = kb.active ? keys.has('Space') : pointer.down;
  const dx = pointer.x - pointer.lx, dy = pointer.y - pointer.ly;
  const dist = Math.hypot(dx, dy);
  pointer.speed = lerp(pointer.speed, dist / Math.max(dt, 1e-4), 0.35);
  pouring = false; pourHit = false;
  if (pressing && tool === 'pitcher' && refillT <= 0) {
    if (water > 0) {
      pouring = true;
      water = Math.max(0, water - cfg.waterUse * dt);
      stats.poured += dt;
      const n = Math.max(1, Math.ceil(dist / (BRUSH_R * 0.35)));
      const pw = (POWER * dt * 60) / n;
      for (let k = 1; k <= n; k++) {
        const x = lerp(pointer.lx, pointer.x, k / n), y = lerp(pointer.ly, pointer.y, k / n);
        for (const f of c.targets) if (nearTarget(f, x, y, BRUSH_R * 0.5)) { pourHit = true; washAt(f, x, y, pw, dt / n); }
      }
      if (pourHit) stats.onTarget += dt;
      // splashes where the stream lands
      if (Math.random() < dt * 40) {
        spawn(pointer.x + rand(-8, 8), pointer.y, rand(-90, 90), rand(-170, -60), 0.45, pourHit ? '#e6f7ff' : '#9fd3f5', rand(2, 4), 700);
      }
      if (water <= 0 && !emptyWarned) {
        emptyWarned = true;
        showMessage('The pitcher is empty! Tap the jug to refill', 2.6);
        sfx.bounce();
      }
    }
  } else if (pressing && tool === 'towel' && phase === 'wash') {
    const n = Math.max(1, Math.ceil(dist / (TOWEL_R * 0.35)));
    let dried = 0;
    for (let k = 1; k <= n; k++) {
      const x = lerp(pointer.lx, pointer.x, k / n), y = lerp(pointer.ly, pointer.y, k / n);
      for (const f of c.targets) if (nearTarget(f, x, y, TOWEL_R * 0.5)) { const [lx, ly] = toLocal(f, x, y); dried += dryTarget(f, lx, ly, TOWEL_R, (45 * dt * 60) / n); }
    }
    if (dried > 0 && dist > 2) sfx.rub();
  }
  pointer.lx = pointer.x; pointer.ly = pointer.y;
}

function washAt(f, x, y, pw, dtPart) {
  const c = cur;
  const [lx, ly] = toLocal(f, x, y);
  const r = scrubTarget(f, lx, ly, BRUSH_R, pw);
  c.relief += r.removed;
  murk = Math.min(0.55, murk + r.removed * 1.5e-7);
  if (r.cleared > 6 && Math.random() < 0.25) spawn(x + rand(-14, 14), y + rand(-14, 14), 0, -12, 0.7, '#ffffff', rand(5, 8), 0, 'star');
  for (const it of f.items) {
    if (it.hp <= 0) continue;
    if (Math.hypot(lx - it.x, ly - it.y) < BRUSH_R * 0.7 + it.r) {
      it.hp -= dtPart; it.wob = 0.25;
      if (it.hp <= 0) popItem(f, it);
    }
  }
  for (const nl of f.nails) {
    if (nl.grime <= 0) continue;
    if (Math.hypot(lx - nl.x, ly - nl.y) < Math.max(nl.rx, nl.ry) + 7) {
      const slow = pointer.speed < 420;
      nl.grime -= (dtPart * (slow ? 1 : pointer.speed < 900 ? 0.25 : 0.08)) / cfg.nailTime;
      nl.active = 0.25;
      if (!slow && nailHintCd <= 0) { showMessage('Slowly, right on the toenail…', 1.6); nailHintCd = 4; }
      if (nl.grime <= 0) nailDone(f, nl);
    }
  }
  if (f.kind === 'foot' && ly > 196 && pointer.speed > 150) c.tickle += dtPart;
}

function nailDone(f, nl) {
  nl.grime = 0; nl.glint = 1.4;
  stats.nails++;
  const [wx, wy] = toWorld(f, nl.x, nl.y);
  sparkleBurst(wx, wy, 8, 14);
  sfx.chime();
  setMood('wow', 1.2);
  showMessage(firstNail ? 'Perfect nail! Every grimy nail counts' : 'Perfect nail!', firstNail ? 2.2 : 1.2);
  firstNail = false;
}

function updateReactions(dt) {
  const c = cur;
  if (c.tickle > 0.6) {
    c.tickle = 0;
    setMood('giggle', 0.9);
    for (const f of c.feet) f.wig = 0.5;
    sfx.giggle();
    if (bubbleCd <= 0) { say('disc', pick(TICKLE), 1.6); bubbleCd = 6; }
  }
  if (c.relief > 90000) {
    c.relief = 0;
    if (c.moodT <= 0) setMood('relief', 1.3);
    if (bubbleCd <= 0 && Math.random() < 0.5) { say('disc', pick(RELIEF), 1.8); bubbleCd = 6; }
  }
  c.tickle = Math.max(0, c.tickle - dt * 0.3);
  // dripping toes
  if (phase === 'wash') {
    for (const f of c.feet) {
      if (f.wetSum > 255 * f.insideCount * 0.25 && Math.random() < dt * 3) {
        const e = pick(TOES);
        const [wx, wy] = toWorld(f, e.x, e.y + e.ry);
        spawn(wx, wy, 0, 40, 0.5, '#bfe6ff', 3, 900);
      }
    }
  }
  for (const f of c.targets) for (const nl of f.nails) { nl.active = Math.max(0, nl.active - dt); nl.glint = Math.max(0, nl.glint - dt); }
  for (const f of c.targets) for (const it of f.items) it.wob = Math.max(0, it.wob - dt);
}

function updateWash(dt) {
  phaseT += dt;
  const c = cur;
  switch (phase) {
    case 'enter':
      c.slide = Math.max(0, 1 - phaseT / 0.6);
      if (phaseT >= 0.6) {
        c.slide = 0;
        if (c.isPeter && !c.handsDone) startRefuse();
        else startWashPhase();
      }
      break;
    case 'refuse':
      c.tuck = Math.min(1, c.tuck + dt * 4);
      burnCandle(dt);
      break;
    case 'talk':
      updateTalk();
      break;
    case 'wash':
      burnCandle(dt);
      if (state !== 'play') return;
      doTools(dt);
      updateReactions(dt);
      checkReady();
      break;
    case 'hands':
      handsT -= dt;
      doTools(dt);
      updateReactions(dt);
      if (handsT <= 0 || c.hands.every((h) => cleanOf(h) >= 0.95)) endHands();
      break;
    case 'leave':
      c.slide = -clamp((phaseT - 1) / 0.7, 0, 1);
      if (phaseT >= 1.75) nextDisciple();
      break;
  }
  if (c.untuck) c.tuck = Math.max(0, c.tuck - dt * 2.5);
}

// ============================================================
//  Win / fail
// ============================================================
function levelWon() {
  state = 'win';
  scene = 'outro'; sceneT = 0;
  bubble = null; talkQueue = [];
  pouring = false;
  musicPlayed = false;
  const s = stats;
  const eff = s.poured > 0 ? s.onTarget / s.poured : 1;
  const waterPts = Math.round(eff * 400);
  const gritPts = s.grit * 25;
  const nailPts = s.nails * 60;
  const timePts = Math.ceil(candle) * 8;
  const levelBonus = level * 500;
  const score = s.cleanPts + gritPts + nailPts + waterPts + s.dryPts + s.handsPts + timePts + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('washingFeetBest', best); } catch (e) {} }
  lastScore = { clean: s.cleanPts, grit: s.grit, gritPts, nails: s.nails, nailPts, eff: Math.round(eff * 100), waterPts, dry: s.dryPts, hands: s.handsPts, timePts, levelBonus, score };
  say('jesus', verseText('oneAnother'), 3.9);
  endTimer = 7.4;
}

function fail() {
  state = 'fail';
  pouring = false;
  bubble = null;
  if (cur) { cur.mood = 'dismay'; cur.moodT = 0; }
  showMessage('The candle burned out…', 2);
  sfx.fail();
  endTimer = 1.8;
}

function endScreens(dt) {
  if (endTimer <= 0) return;

  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Supper is served!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('oneAnother')}

    showOverlay('Oh… the candle went out', `Level ${level} — ${cfg.name}`,

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    pointer.down = false;
    sfx.water(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

const keys = new Set();

function inWashPhase() { return state === 'play' && scene === 'wash' && (phase === 'wash' || phase === 'hands'); }

// Taps that mean "carry on": skip the intro, Peter's turn, the end scene
function advanceTap() {
  if (state === 'play' && scene === 'intro') { beginWashing(); return true; }
  if (state === 'play' && phase === 'refuse') { peterTapped(); return true; }
  if (state === 'win' && scene === 'outro' && endTimer > 0.4) {
    if (!musicPlayed) { musicPlayed = true; sfx.win(); }
    endTimer = 0.3; return true;
  }
  return false;
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat && advanceTap()) return;
  if (inWashPhase()) {
    if (e.code === 'KeyR') { jugPressed(); return; }
    if (e.code === 'KeyT') { towelPressed(); return; }
    if ((e.code === 'KeyN' || e.code === 'Enter') && cur && cur.ready) { finishDisciple(); return; }
    if (e.code.startsWith('Arrow') && !kb.active) { kb.active = true; pointer.lx = pointer.x; pointer.ly = pointer.y; }
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); pointer.down = false; });

function moveKeyboardSponge(dt) {
  if (!kb.active) return;
  const sp = 330;
  if (keys.has('ArrowLeft')) pointer.x -= sp * dt;
  if (keys.has('ArrowRight')) pointer.x += sp * dt;
  if (keys.has('ArrowUp')) pointer.y -= sp * dt;
  if (keys.has('ArrowDown')) pointer.y += sp * dt;
  pointer.x = clamp(pointer.x, 10, W - 10);
  pointer.y = clamp(pointer.y, 300, 880);
}

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function onBasin(p) {
  const b = basinGeom();
  const dx = (p.x - b.x) / b.rx, dy = (p.y - (b.y + 30)) / (b.ry + 60);
  return dx * dx + dy * dy < 1;
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  for (const b of toolButtons()) {
    const hit = b.w ? Math.abs(p.vx - b.x) < b.w / 2 + 4 && Math.abs(p.vy - b.y) < 26 : Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6;
    if (hit) { b.action(); return; }
  }
  if (state === 'play' && phase === 'refuse') {
    if (Math.abs(p.x - W / 2) < 190 && p.y > 200 && p.y < 720) peterTapped();
    return;
  }
  if (advanceTap()) return;
  if (!inWashPhase()) return;
  kb.active = false;
  // Dip the empty pitcher in the basin to refill it
  if (tool === 'pitcher' && water < 20 && refillT <= 0 && onBasin(p) && !cur.targets.some((f) => isOnSkin(f, p.x, p.y))) {
    startRefill(); return;
  }
  pointer.down = true;
  pointer.id = e.pointerId;
  pointer.x = pointer.lx = p.x;
  pointer.y = pointer.ly = p.y;
  pointer.speed = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (pointer.down && e.pointerId !== pointer.id) return;
  const p = toPlayfield(e);
  if (!pointer.down && e.pointerType !== 'mouse') return;
  if (e.pointerType === 'mouse') { pointer.mouse = true; kb.active = false; }
  pointer.x = p.x; pointer.y = p.y;
  if (!pointer.down) { pointer.lx = p.x; pointer.ly = p.y; }
});
const release = (e) => {
  if (e.pointerId !== pointer.id) return;
  pointer.down = false; pointer.id = null;
  sfx.init();   // iOS only unlocks audio on some gestures, so try again when the finger lifts
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, waterGain: null, waterBP: null, noise: null, muted: false, rubCd: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      // The pouring water: looped noise through a band-pass filter
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      this.waterBP = this.ctx.createBiquadFilter();
      this.waterBP.type = 'bandpass'; this.waterBP.frequency.value = 1800; this.waterBP.Q.value = 0.6;
      this.waterGain = this.ctx.createGain();
      this.waterGain.gain.value = 0;
      src.connect(this.waterBP); this.waterBP.connect(this.waterGain); this.waterGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  // level 0..1; onFeet splashes higher and brighter than water hitting the basin
  water(level, onFeet = true) {
    if (!this.waterGain) return;
    const now = this.ctx.currentTime;
    this.waterGain.gain.setTargetAtTime(level * 0.28, now, 0.05);
    this.waterBP.frequency.setTargetAtTime(onFeet ? 2400 + Math.random() * 500 : 900, now, 0.08);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35, freq = 1100) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  // a pebble pops out
  tink() { this.tone(2600, 0.12, 'triangle', 0.22); this.tone(3900, 0.09, 'sine', 0.12, 0.012); },
  // a fish scale or seaweed flicks off
  flick() { this.tone(1500, 0.08, 'sine', 0.14, 0, 2600); },
  // something drops into the basin
  plop() { this.tone(320, 0.12, 'sine', 0.3, 0, 900); this.puff(0.08, 700); },
  // squeaky-clean sparkle
  chime() { [1319, 1661, 1976, 2637].forEach((f, i) => this.tone(f, 0.45, 'sine', 0.1, i * 0.06)); },
  squeak() { this.tone(1400, 0.1, 'sine', 0.14, 0, 2300); this.tone(1700, 0.12, 'sine', 0.12, 0.1, 2800); },
  giggle() { [760, 940, 800, 1000].forEach((f, i) => this.tone(f, 0.07, 'triangle', 0.07, i * 0.08)); },
  glug() { for (let i = 0; i < 3; i++) this.tone(260 - i * 20, 0.14, 'sine', 0.3, i * 0.3, 150); this.puff(0.1, 500); },
  rub() {
    if (!this.ctx || this.ctx.currentTime < this.rubCd) return;
    this.rubCd = this.ctx.currentTime + 0.14;
    this.puff(0.07, 2200);
  },
};

// ============================================================
//  Rendering: the upper room
// ============================================================
function drawRoom(wide) {
  const floorY = wide ? 666 : 470;
  // warm plaster wall in the evening lamplight
  const g = ctx.createLinearGradient(0, -offY, 0, floorY);
  g.addColorStop(0, '#b97a47');
  g.addColorStop(0.55, '#e3b073');
  g.addColorStop(1, '#d69c5c');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, floorY + offY + 1);
  // stone courses
  ctx.strokeStyle = 'rgba(120,70,30,0.13)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = floorY - 46, row = 0; y > -offY; y -= 46, row++) {
    ctx.moveTo(-offX, y); ctx.lineTo(W + offX, y);
    for (let x = -offX + (row % 2) * 45; x < W + offX; x += 90) { ctx.moveTo(x, y); ctx.lineTo(x, y - 46); }
  }
  ctx.stroke();

  // Arched window with the Passover full moon
  const wx = W / 2, wy0 = wide ? 110 : 96, wy1 = wide ? 300 : 300, ww = wide ? 70 : 64;
  ctx.fillStyle = '#9a6a3c';
  ctx.beginPath(); ctx.moveTo(wx - ww - 12, wy1 + 10); ctx.lineTo(wx - ww - 12, wy0 + ww); ctx.arc(wx, wy0 + ww, ww + 12, Math.PI, TAU); ctx.lineTo(wx + ww + 12, wy1 + 10); ctx.fill();
  const sky = ctx.createLinearGradient(0, wy0, 0, wy1);
  sky.addColorStop(0, '#2f3570'); sky.addColorStop(0.55, '#8a4f7a'); sky.addColorStop(1, '#f0a45a');
  ctx.fillStyle = sky;
  ctx.beginPath(); ctx.moveTo(wx - ww, wy1); ctx.lineTo(wx - ww, wy0 + ww); ctx.arc(wx, wy0 + ww, ww, Math.PI, TAU); ctx.lineTo(wx + ww, wy1); ctx.fill();
  ctx.fillStyle = '#fff6d8';
  ctx.shadowColor = '#fff1b0'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(wx + ww * 0.35, wy0 + ww * 0.75, 15, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (const [sx, sy] of [[-0.5, 0.5], [-0.2, 1.1], [0.55, 1.5], [-0.62, 1.6]]) star(wx + sx * ww, wy0 + sy * ww, 3);
  ctx.fillStyle = '#6e4a2a';
  ctx.fillRect(wx - ww - 14, wy1, ww * 2 + 28, 12);   // sill

  // Oil lamps in wall niches
  for (const fx of [0.13, 0.87]) {
    const lx = W * fx, ly = wide ? 330 : 270;
    ctx.fillStyle = 'rgba(90,50,20,0.35)';
    ctx.beginPath(); ctx.moveTo(lx - 30, ly + 16); ctx.lineTo(lx - 30, ly - 22); ctx.arc(lx, ly - 22, 30, Math.PI, TAU); ctx.lineTo(lx + 30, ly + 16); ctx.fill();
    drawLamp(lx, ly + 10, 1);
  }

  // Floor
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0, '#8d5b36'); fg.addColorStop(1, '#6a4126');
  ctx.fillStyle = fg;
  ctx.fillRect(-offX, floorY, viewW, H - floorY + 2);
  ctx.strokeStyle = 'rgba(40,20,5,0.18)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = floorY + 30, k = 1; y < H; y += 30 + k * 12, k++) { ctx.moveTo(-offX, y); ctx.lineTo(W + offX, y); }
  ctx.stroke();
}

// A little clay oil lamp with a flickering flame and glow
function drawLamp(x, y, s) {
  const fl = 1 + Math.sin(t * 13 + x) * 0.08 + Math.sin(t * 29 + x * 2) * 0.05;
  const glow = ctx.createRadialGradient(x, y - 14 * s, 2, x, y - 14 * s, 80 * s);
  glow.addColorStop(0, 'rgba(255,220,130,0.55)'); glow.addColorStop(1, 'rgba(255,200,110,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y - 14 * s, 80 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b86a3a';
  ctx.beginPath(); ctx.ellipse(x, y, 16 * s, 7 * s, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 10 * s, y - 3 * s); ctx.lineTo(x + 22 * s, y - 6 * s); ctx.lineTo(x + 12 * s, y + 3 * s); ctx.fill();
  ctx.fillStyle = '#ffd35c';
  ctx.beginPath();
  ctx.moveTo(x + 21 * s, y - 20 * s * fl);
  ctx.quadraticCurveTo(x + 26 * s, y - 10 * s, x + 21 * s, y - 6 * s);
  ctx.quadraticCurveTo(x + 16 * s, y - 10 * s, x + 21 * s, y - 20 * s * fl);
  ctx.fill();
  ctx.fillStyle = '#fff6d0';
  ctx.beginPath(); ctx.ellipse(x + 21 * s, y - 10 * s, 2 * s, 3.5 * s, 0, 0, TAU); ctx.fill();
}

// The supper table: top at y, with bread, the cup and lamps
function drawTable(y, depth) {
  ctx.fillStyle = '#6e4122';
  ctx.fillRect(-offX, y + 14, viewW, depth);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(-offX, y + 14, viewW, 6);
  const tg = ctx.createLinearGradient(0, y, 0, y + 16);
  tg.addColorStop(0, '#b27a45'); tg.addColorStop(1, '#8a5530');
  ctx.fillStyle = tg;
  ctx.fillRect(-offX, y, viewW, 16);
  // linen runner
  ctx.fillStyle = '#efe3c4';
  ctx.fillRect(-offX, y + 2, viewW, 9);
  ctx.fillStyle = 'rgba(80,110,170,0.5)';
  ctx.fillRect(-offX, y + 5, viewW, 2);
  const cx = W / 2;
  // bread
  for (const bx of [cx - 150, cx + 250]) {
    ctx.fillStyle = '#d8a15c';
    ctx.beginPath(); ctx.ellipse(bx, y - 2, 26, 12, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#e9bd7c';
    ctx.beginPath(); ctx.ellipse(bx - 4, y - 7, 14, 4, -0.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8703a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx - 12, y - 10); ctx.lineTo(bx - 8, y - 4); ctx.moveTo(bx + 2, y - 12); ctx.lineTo(bx + 6, y - 5); ctx.stroke();
  }
  // the cup
  const ux = cx + 150;
  const cg = ctx.createLinearGradient(ux - 14, 0, ux + 14, 0);
  cg.addColorStop(0, '#b8862a'); cg.addColorStop(0.5, '#ffe08a'); cg.addColorStop(1, '#a8741a');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.moveTo(ux - 14, y - 38); ctx.quadraticCurveTo(ux - 13, y - 18, ux - 3, y - 14); ctx.lineTo(ux - 3, y - 6); ctx.lineTo(ux - 10, y); ctx.lineTo(ux + 10, y); ctx.lineTo(ux + 3, y - 6); ctx.lineTo(ux + 3, y - 14); ctx.quadraticCurveTo(ux + 13, y - 18, ux + 14, y - 38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a1f3a';
  ctx.beginPath(); ctx.ellipse(ux, y - 37, 13, 3.5, 0, 0, TAU); ctx.fill();
  drawLamp(cx - 250, y - 2, 0.8);
}

// ============================================================
//  People
// ============================================================
function drawHead(d, mood, hy, lx, ly) {
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  const blush = (a) => {
    ctx.fillStyle = `rgba(255,120,120,${a})`;
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  };
  const happyEyes = () => {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      happyEyes();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      blush(0.45);
      break;
    case 'giggle':
      // squeezed-shut laughing eyes > <
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-ex - 3.5, ey - 2.5); ctx.lineTo(-ex + 2.5, ey); ctx.lineTo(-ex - 3.5, ey + 2.5);
      ctx.moveTo(ex + 3.5, ey - 2.5); ctx.lineTo(ex - 2.5, ey); ctx.lineTo(ex + 3.5, ey + 2.5);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6.5, mouthY - 3); ctx.arc(0, mouthY - 3, 6.5, 0, Math.PI); ctx.closePath(); });
      blush(0.6);
      break;
    case 'relief':
      // contented closed eyes and a soft smile
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      brows(-8, -9, -8, -9);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4.5, 0.15 * Math.PI, 0.85 * Math.PI));
      blush(0.35);
      break;
    case 'refuse':
      // eyes shut tight, chin up, a stubborn frown
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-ex - 3.5, ey - 1); ctx.lineTo(-ex + 3, ey + 1);
      ctx.moveTo(ex + 3.5, ey - 1); ctx.lineTo(ex - 3, ey + 1);
      ctx.stroke();
      brows(-5, -9, -5, -9);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// A standing disciple (reference style), seen behind the table
function drawPerson(d, mood, x, y, s, lookX, lookY) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 8;
  ctx.save();
  ctx.translate(x, y - jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const wx = x, wy = y - 52 * s;
  const dx = lookX - wx, dy = lookY - wy, len = Math.hypot(dx, dy) || 1;
  const lx = dx / len, ly = dy / len;
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  }
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (mood !== 'joy') { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  drawHead(d, mood, -53, lx, ly);
  ctx.restore();
}

// The disciple on the stool in the close-up: robe, arms and big reacting face
function drawSeatedBody(c) {
  const d = c.d, cx = W / 2, s = SEAT_S, mood = c.mood;
  // stool
  ctx.fillStyle = '#7a4d2a'; roundRect(cx - 128, 446, 256, 20, 8); ctx.fill();
  ctx.fillStyle = '#5e3a1e'; ctx.fillRect(cx - 118, 466, 14, 22); ctx.fillRect(cx + 104, 466, 14, 22);
  // lap
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 56, 400);
  ctx.bezierCurveTo(cx - 130, 404, cx - 162, 430, cx - 160, 486);
  ctx.lineTo(cx + 160, 486);
  ctx.bezierCurveTo(cx + 162, 430, cx + 130, 404, cx + 56, 400);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = shade(d.robe, -30);
  ctx.beginPath(); ctx.moveTo(cx, 420); ctx.quadraticCurveTo(cx - 4, 450, cx, 484); ctx.stroke();

  ctx.save();
  ctx.translate(cx, SEAT_Y); ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // eyes follow the water
  const hwx = cx + c.slide * 0, hwy = SEAT_Y - 53 * s;
  let lx = 0, ly = 1;
  if (inWashPhase() || state === 'title') {
    const dx = pointer.x - hwx, dy = pointer.y - hwy, len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }
  const hands = !!c.hands;
  if (mood === 'joy' && !hands) {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  }
  // robe torso (reference shape)
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  if (!hands) {
    if (mood === 'refuse') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }       // arms folded
    else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }  // hands clasped
    else if (mood === 'giggle') arm(-11, -32, -29, 5);
    else if (mood !== 'joy' && mood !== 'wow' && mood !== 'dismay') { arm(-11, -32, -29, 5); arm(11, -32, 29, 5); }
  }
  // head (shakes when giggling, turns up when refusing)
  ctx.save();
  if (mood === 'giggle') ctx.translate(Math.sin(t * 40) * 1.2, 0);
  if (mood === 'refuse') { ctx.translate(0, -53); ctx.rotate(-0.12); ctx.translate(0, 53); }
  drawHead(d, mood, -53, lx, ly);
  ctx.restore();
  if (!hands) {
    if (mood === 'wow') { arm(-11, -32, -15, -49); arm(11, -32, 15, -49); }        // hands on cheeks
    else if (mood === 'giggle') arm(11, -32, 3, -44);                               // hand over mouth
    else if (mood === 'dismay') { arm(11, -32, 2, -56); ctx.fillStyle = d.skin; roundRect(-9, -61, 20, 9, 4); ctx.fill(); arm(-11, -32, -29, 5); }
  }
  ctx.restore();
}

// The robe over the shins, hiding the tops of the ankles
function drawShins(c) {
  const d = c.d;
  for (const side of [-1, 1]) {

    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 4;

// Peter's arms reaching out for the bonus round
function drawHandArms(c) {
  const d = c.d;
  ctx.lineCap = 'round';
  for (const h of c.hands) {
