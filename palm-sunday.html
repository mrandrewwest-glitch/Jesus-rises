  } else drawArrows(0, -150 - h / 2, arrow, 0.9);
}

// Big turn arrows: 'L', 'R' or 'T' (both ways)
function drawArrows(x, y, junc, s) {
  const one = (dir, cx) => {
    ctx.save(); ctx.translate(cx, y); ctx.scale(dir * s, s);
    ctx.fillStyle = '#d9480f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-34, -12); ctx.lineTo(4, -12); ctx.lineTo(4, -30); ctx.lineTo(38, 0); ctx.lineTo(4, 30); ctx.lineTo(4, 12); ctx.lineTo(-34, 12);
    ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore();
  };
  if (junc === 'T') { one(-1, x - 38 * s); one(1, x + 38 * s); }
  else one(junc === 'L' ? -1 : 1, x);
}

function drawWallBoard(junc) {
  // the arrow board on the wall where the road ends
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(-100, -160, 14, 160); ctx.fillRect(86, -160, 14, 160);
  ctx.fillStyle = '#ffe9a8'; ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 7;
  roundRect(-130, -250, 260, 110, 14); ctx.fill(); ctx.stroke();
  drawArrows(0, -195, junc, 1.35);
}

function drawDatePalm(s) {
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 26 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(30 * s, -300 * s, 10 * s, -560 * s); ctx.stroke();
  ctx.strokeStyle = '#6e5230'; ctx.lineWidth = 3 * s;
  ctx.beginPath();
  for (let y = -40; y > -540; y -= 45) { const x = 30 * s * Math.sin((-y / 560) * Math.PI) * 0.8; ctx.moveTo(x - 12 * s, y * s); ctx.lineTo(x + 12 * s, y * s - 8 * s); }
  ctx.stroke();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.5;
    drawPalm(10 * s, -560 * s, 240 * s, a + Math.PI / 2 + (i < 3 ? -0.4 : i > 3 ? 0.4 : 0), (i - 3) * 22 * s);
  }
}

function drawCrowdSimple(d, k) {
  // a far-away member of the crowd: robe, head and a waving palm
  const jump = d.mood === 'joy' ? Math.abs(Math.sin(t * 7 + d.phase)) * 12 : 0;
  const sc = d.child ? 0.74 : 1;
  ctx.save(); ctx.scale(k * sc, k * sc); ctx.translate(0, -jump);
  ctx.fillStyle = d.robe;
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-20, -95); ctx.lineTo(20, -95); ctx.lineTo(26, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, -124, 24, 0, TAU); ctx.fill();
  ctx.fillStyle = d.scarf || d.hair;
  ctx.beginPath(); ctx.arc(0, -128, 25, Math.PI, TAU); ctx.fill();
  if (d.palm) {
    ctx.strokeStyle = '#4caf3c'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    const w = d.mood === 'joy' ? Math.sin(t * 9 + d.phase) * 20 : 0;
    ctx.beginPath(); ctx.moveTo(26, -80); ctx.lineTo(40 + w, -170); ctx.stroke();
  }
  ctx.restore();
}

// Jerusalem on its hill, far ahead: walls, the Temple, and the Golden Gate
function drawCity(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = '#c2c68c';
  ctx.beginPath(); ctx.ellipse(0, 30, 380, 110, 0, Math.PI, TAU); ctx.fill();
  const houses = [[-270, 50, 40], [-215, 44, 62], [-160, 56, 48], [-100, 42, 70], [-40, 50, 55], [150, 50, 60], [205, 46, 44], [250, 44, 66]];
  for (const [x, w, h] of houses) {
    ctx.fillStyle = (x / 10) % 2 ? '#f3e5c0' : '#e8d3a2';
    ctx.fillRect(x, -60 - h, w, h);
    ctx.fillStyle = 'rgba(90,60,30,0.55)';
    ctx.fillRect(x + w * 0.3, -60 - h + 12, 7, 9);
  }
  // the Temple, white and gold
  ctx.fillStyle = '#e9dcb8';
  ctx.fillRect(-10, -120, 170, 50);
  ctx.fillStyle = '#fbf7ea'; ctx.strokeStyle = '#cdbf98'; ctx.lineWidth = 2;
  ctx.fillRect(20, -235, 110, 120); ctx.strokeRect(20, -235, 110, 120);
  ctx.fillRect(-5, -170, 160, 55); ctx.strokeRect(-5, -170, 160, 55);
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(20, -243, 110, 10);
  ctx.fillRect(-5, -176, 160, 7);
  ctx.fillStyle = '#d9a13a';
  roundRect(58, -218, 34, 60, [17, 17, 0, 0]); ctx.fill();
  // the city wall with towers
  const stone = '#dcc28c', dark = '#b89c64';
  ctx.fillStyle = stone; ctx.strokeStyle = dark; ctx.lineWidth = 2;
  ctx.fillRect(-320, -80, 640, 80); ctx.strokeRect(-320, -80, 640, 80);
  for (let x = -320; x < 320; x += 22) ctx.fillRect(x, -92, 12, 12);
  for (const tx of [-320, -170, 150, 290]) {
    ctx.fillStyle = stone;
    ctx.fillRect(tx - 6, -125, 42, 125); ctx.strokeRect(tx - 6, -125, 42, 125);
    for (let k = 0; k < 3; k++) ctx.fillRect(tx - 6 + k * 16, -136, 10, 12);
  }
  // the Golden Gate: twin arches crowned with gold
  ctx.fillStyle = '#ecd9a6'; ctx.strokeStyle = dark;
  ctx.fillRect(-75, -118, 150, 118); ctx.strokeRect(-75, -118, 150, 118);
  ctx.fillStyle = '#f5c542';
  for (const gx of [-35, 35]) { ctx.beginPath(); ctx.arc(gx, -118, 30, Math.PI, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(90,60,25,0.6)';
  for (const gx of [-35, 35]) { roundRect(gx - 20, -80, 40, 80, [20, 20, 0, 0]); ctx.fill(); }
  ctx.restore();
}

// ============================================================
//  The crowd lining the road
// ============================================================
const ROBES = ['#3f6fb5', '#6b8e3a', '#b5503f', '#d9a13a', '#7a4fa0', '#3c8f86', '#a0673a', '#5a6475', '#c46b8c', '#4b7f4b', '#b08a2e', '#2f8fbf', '#d0643a'];
const HAIRS = ['#8a8a8a', '#4a2f1a', '#2e1d10', '#6b3f1d', '#3a2716', '#1f140c', '#5c3a1c'];
const SKINS = ['#d9a066', '#c98d56', '#d7a070', '#e3b184', '#c58a55', '#b87a48', '#d39a66', '#bf8150'];
const SCARVES = ['#e8dcc0', '#c9b27a', '#d8c7a0', '#e6b8c8', '#b8d0e6', '#f0d9a0'];
const CROWD_GAP = 1.5;
const personSlot = { d: null, x: 0, y: 0, s: 1 };

function getPerson(key) {
  let p = crowdCache.get(key);
  if (!p) {
    const r = (s) => hrand(key, s);
    const child = r(1) < 0.22;
    p = {
      robe: ROBES[Math.floor(r(2) * ROBES.length)],
      hair: HAIRS[Math.floor(r(3) * HAIRS.length)],
      skin: SKINS[Math.floor(r(4) * SKINS.length)],
      beard: !child && r(5) < 0.5,
      scarf: r(6) < 0.35 ? SCARVES[Math.floor(r(12) * SCARVES.length)] : null,
      palm: r(7) < 0.7, child,
      i: Math.floor(r(13) * 12), phase: r(8) * TAU,
      mood: 'watch', switchT: 0, delay: 0.05 + r(9) * 0.35,
      blinkT: 1 + r(10) * 4, blink: 0,
    };
    crowdCache.set(key, p);
  }
  return p;
}

function personMood(p, z) {
  if (state === 'title') return p.palm ? 'joy' : 'wow';
  if (state === 'fail') return z < 40 ? (crashT < 0.9 ? 'shock' : 'dismay') : 'worried';
  if (shockT > 0 && z < 30) return 'shock';
  if (cheerT > 0 && z < 50) return 'joy';
  if (z < 24) return p.palm ? 'joy' : 'wow';
  if (z < 48) return 'wow';
  return 'watch';
}

function tickPerson(p, z) {
  const want = personMood(p, z);
  if (want !== p.mood) {
    p.switchT += frameDt;
    if (p.switchT > p.delay) { p.mood = want; p.switchT = 0; }
  } else p.switchT = 0;
  p.blinkT -= frameDt;
  if (p.blinkT <= 0) { p.blink = 0.13; p.blinkT = rand(1.5, 5); }
  if (p.blink > 0) p.blink -= frameDt;
}

// ============================================================
//  What is on screen: stretches of road ("pieces") and sprites
// ============================================================
const pieces = [];
for (let i = 0; i < 6; i++) pieces.push({ seg: null, ox: 0, oz: 0, dir: 0, a0: 0, a1: 0, square: false, crowd: false, content: false, branch: false });
let pieceN = 0;
function addPiece(seg, ox, oz, dir, a0, a1, square, crowd, content, branch) {
  const p = pieces[pieceN++];
  p.seg = seg; p.ox = ox; p.oz = oz; p.dir = dir & 3; p.a0 = a0; p.a1 = a1;
  p.square = square; p.crowd = crowd; p.content = content; p.branch = branch;
}
const turnDirs = (seg) => seg.junc === 'L' ? [-1] : seg.junc === 'R' ? [1] : [-1, 1];
const TURN_L = [-1], TURN_R = [1], TURN_T = [-1, 1];
const turnDirsFast = (seg) => seg.junc === 'L' ? TURN_L : seg.junc === 'R' ? TURN_R : TURN_T;

function buildPieces() {
  pieceN = 0;
  const pa = player.along;
  const reach0 = pa + FAR + 30;
  const sq = state !== 'title' && cur.len <= reach0;
  addPiece(cur, cur.ox, cur.oz, cur.dir, Math.max(0, pa - 12), Math.min(cur.len, reach0), sq, true, true, false);
  const toJ = cur.len - pa;
  if (state !== 'title' && toJ < FAR + 20) {
    const reach = FAR - toJ + 25;
    for (const d of turnDirsFast(cur)) addPiece(next, next.ox, next.oz, cur.dir + d + 4, 0, Math.min(next.len, reach), next.len < reach, true, true, true);
  }
  if (prev && pa < 45) {
    addPiece(prev, prev.ox, prev.oz, prev.dir, prev.len - 40, prev.len, true, true, false, false);
    if (prevAlt >= 0) addPiece(null, cur.ox, cur.oz, prevAlt, 0, 32, false, false, false, true);
  }
}

// Sprites are pooled and sorted far to near every frame
const SP_PERSON = 1, SP_OBS = 2, SP_ITEM = 3, SP_PLAYER = 4, SP_SIGN = 5, SP_WALL = 6, SP_BOARD = 7, SP_OLIVE = 8, SP_DPALM = 9, SP_HOUSE = 10;
const SPR = [];
const sprOrder = [];
let sprN = 0;
function addSpr(kind, ref, pc, a, l) {
  let o = SPR[sprN];
  if (!o) o = SPR[sprN] = { z: 0, kind: 0, ref: null, pc: null, a: 0, l: 0, x: 0, y: 0, s: 1 };
  sprN++;
  o.z = PZ; o.kind = kind; o.ref = ref; o.pc = pc; o.a = a; o.l = l; o.x = PX; o.y = PY; o.s = PS;
  return o;
}
const byDepth = (a, b) => b.z - a.z;

function collectPiece(pc) {
  const seg = pc.seg, ox = pc.ox, oz = pc.oz, dir = pc.dir;
  if (!seg) return;
  if (pc.content) {
    for (const o of seg.obs) {
      if (o.hit || o.along < pc.a0 || o.along > pc.a1) continue;
      if (!projectLocal(ox, oz, dir, o.along, o.lat, 0) || PZ > FAR) continue;
      addSpr(SP_OBS, o, pc, o.along, o.lat);
    }
    for (const it of seg.items) {
      if (it.got || it.along < pc.a0 || it.along > pc.a1) continue;
      if (!projectLocal(ox, oz, dir, it.along, it.lat, 0) || PZ > FAR) continue;
      addSpr(SP_ITEM, it, pc, it.along, it.lat);
    }
    for (const sg of seg.signs) {
      const side = sg.kind === 'turn' && seg.junc === 'L' ? -1 : 1;
      if (sg.along < pc.a0 || sg.along > pc.a1) continue;
      if (!projectLocal(ox, oz, dir, sg.along, side * (RH + 0.8), 0) || PZ > FAR) continue;
      addSpr(SP_SIGN, sg, pc, sg.along, side);
    }
  }
  if (pc.square) {
    // where the road ends: a low stone wall, an arrow board and an olive grove
    const e = seg.len + RH;
    if (projectLocal(ox, oz, dir, e + 0.6, 0, 0) && PZ < FAR + 10) {
      addSpr(SP_WALL, seg, pc, e, 0);
      if (projectLocal(ox, oz, dir, e + 0.1, 0, 0)) addSpr(SP_BOARD, seg, pc, e, 0);
      for (let i = -1; i <= 1; i++) if (projectLocal(ox, oz, dir, e + 3.5 + Math.abs(i), i * 3.6, 0)) addSpr(SP_OLIVE, null, pc, 0, 1.15);
    }
  }
  if (pc.crowd) collectCrowd(pc);
}

function collectCrowd(pc) {
  const seg = pc.seg, ox = pc.ox, oz = pc.oz, dir = pc.dir;
  const lo = Math.max(pc.a0, RH + 1.4), hi = Math.min(pc.a1, seg.len - RH - 1.4, seg === cur ? player.along + 80 : 1e9);
  const title = state === 'title';
  for (let k = Math.ceil(lo / CROWD_GAP); k * CROWD_GAP <= hi; k++) {
    const d = seg.start + k * CROWD_GAP;
    // the crowd grows as the ride goes on
    const dens = title ? 0.9 : Math.min(0.95, 0.5 + d / 3000);
    const dens2 = title ? 0.6 : clamp((d - 400) / 3000, 0, 0.85);
    for (let side = -1; side <= 1; side += 2) {
      for (let row = 0; row < 2; row++) {
        const key = seg.id * 100000 + k * 4 + (side > 0 ? 2 : 0) + row;
        if (hrand(key, 1) > (row ? dens2 : dens)) continue;
        const a = k * CROWD_GAP + (hrand(key, 2) - 0.5) * 0.9;
        const l = side * (RH + 0.95 + row * 0.95 + hrand(key, 3) * 0.3);
        if (!projectLocal(ox, oz, dir, a, l, 0) || PZ > 75 || (row && PZ > 50)) continue;
        const w = PS * 1.8;
        if (PX < -w || PX > viewW + w) continue;
        addSpr(SP_PERSON, key, pc, a, l);
      }
    }
  }
  // trees, houses and palms behind the crowd, depending on the place
  const zone = seg.zone;
  for (let k = Math.ceil(lo / 7); k * 7 <= hi; k++) {
    for (let side = -1; side <= 1; side += 2) {
      const key = seg.id * 100000 + k * 2 + (side > 0 ? 1 : 0);
      const h = hrand(key, 7), a = k * 7 + (hrand(key, 8) - 0.5) * 3;
      let kind = 0, l = 0;
      if (zone === 0) { if (h < 0.4) { kind = SP_HOUSE; l = VERGE + 1.2 + h * 3; } else if (h < 0.7) { kind = SP_DPALM; l = VERGE + 1.5 + h * 3; } }
      else if (zone === 1) { if (h < 0.85) { kind = SP_OLIVE; l = VERGE + 0.6 + h * 5; } }
      else if (zone === 2) { if (h < 0.55) { kind = SP_DPALM; l = VERGE + 4.6 + h * 2; } else if (h < 0.8) { kind = SP_OLIVE; l = VERGE + 5 + h * 2; } }
      else if (h < 0.75) { kind = SP_HOUSE; l = VERGE + 0.8 + h * 1.5; }
      if (!kind) continue;
      if (!projectLocal(ox, oz, dir, a, side * l, 0) || PZ > 105) continue;
      const w = PS * 6;
      if (PX < -w || PX > viewW + w) continue;
      addSpr(kind, key, pc, a, side * l);
    }
  }
}

const OBS_LOOK = { rock: 1.35, dog: 1.35, basket: 1.35, puddle: 1.2, cart: 1.1, jars: 1.1 };
const HOUSE_COLS = [['#f3e5c0', '#e2cf9e', '#d4bd88'], ['#ead9b0', '#d9c28e', '#c9ae78'], ['#f0dcc0', '#dfc4a0', '#cfae88']];
function drawSprite(sp) {
  const k = sp.s / 100;
  ctx.globalAlpha = clamp((FAR - sp.z) / 25, 0, 1);
  switch (sp.kind) {
    case SP_PERSON: {
      const d = getPerson(sp.ref);
      tickPerson(d, sp.z);
      if (sp.s * 1.65 > 44) {
        personSlot.d = d; personSlot.x = sp.x; personSlot.y = sp.y; personSlot.s = k * 2.4 * (d.child ? 0.74 : 1);
        drawPerson(personSlot);
      } else {
        ctx.save(); ctx.translate(sp.x, sp.y); drawCrowdSimple(d, k); ctx.restore();
      }
      break;
    }
    case SP_OBS: {
      const o = sp.ref;
      if (o.type === 'puddle') { drawPuddleGround(sp); }
      const vs = OBS_LOOK[o.type] || 1;       // small things are drawn a little larger, so they read from afar
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k * vs, k * vs);
      if (o.type === 'rock') drawRock(o);
      else if (o.type === 'dog') drawDog(o);
      else if (o.type === 'basket') drawBasket(o);
      else if (o.type === 'cart') drawCart(o);
      else if (o.type === 'jars') drawJars(o);
      else if (o.type === 'puddle') drawPuddleTop(o);
      else if (o.type === 'branch') drawBranch(o);
      else if (o.type === 'line') drawLine(o);
      else if (o.type === 'awning') drawAwning(o);
      ctx.restore();
      break;
    }
    case SP_ITEM: {
      const it = sp.ref;
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k, k);
      if (it.type === 'palm') drawPalmItem(it, k);
      else if (it.type === 'cloak') drawCloakItem(it);
      else drawChildItem(it);
      ctx.restore();
      break;
    }
    case SP_PLAYER:
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k, k);
      if (invulnT > 0 && state === 'play' && runT > GRACE - 0.01 && Math.sin(t * 30) > 0.4) ctx.globalAlpha = 0.6;
      drawRiderSprite();
      if (shieldOn || magnetT > 0) {
        ctx.globalAlpha = 0.5 + Math.sin(t * 6) * 0.15;
        ctx.strokeStyle = shieldOn ? '#ffd43b' : '#f08cff'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(0, -120 - player.y * 100, 80, 135, 0, 0, TAU); ctx.stroke();
        if (shieldOn) { ctx.fillStyle = 'rgba(255,230,120,0.18)'; ctx.fill(); }
      }
      ctx.restore();
      break;
    case SP_SIGN: {
      const sg = sp.ref;
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k, k);
      drawSignBoard(sg.kind, sp.pc.seg.junc, ZONES[sp.pc.seg.zone].name);
      ctx.restore();
      break;
    }
    case SP_WALL: {
      const pc = sp.pc, e = sp.a;
      drawBox(pc.ox, pc.oz, pc.dir, e + 0.3, e + 0.9, -VERGE, VERGE, 1.2, '#e9d6a6', '#cdb584', '#dcc494', '#a88a55');
      break;
    }
    case SP_BOARD:
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k, k);
      drawWallBoard(sp.pc.seg.junc);
      ctx.restore();
      break;
    case SP_OLIVE: {
      const s = sp.s * 4.2 * (sp.l === 1.15 ? 1.15 : 1) / 92;
      drawOliveTree(sp.x, sp.y, s);
      break;
    }
    case SP_DPALM:
      ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(k, k);
      drawDatePalm(1);
      ctx.restore();
      break;
    case SP_HOUSE: {
      const pc = sp.pc, cols = HOUSE_COLS[sp.ref % 3];
      const side = sp.l < 0 ? -1 : 1, hgt = 2.6 + hrand(sp.ref, 9) * 1.6, dep = 3 + hrand(sp.ref, 10) * 2;
      const l0 = side > 0 ? sp.l : sp.l - dep, l1 = side > 0 ? sp.l + dep : sp.l;
      drawBox(pc.ox, pc.oz, pc.dir, sp.a - 2.2, sp.a + 2.2, l0, l1, hgt, cols[0], cols[1], cols[2], '#b89c64');
      // a doorway facing the road
      const fl = side > 0 ? l0 : l1;
      if (projectLocal(pc.ox, pc.oz, pc.dir, sp.a, fl, 0)) {
        const x0 = PX, y0 = PY, s0 = PS;
        ctx.fillStyle = 'rgba(80,55,25,0.65)';
        roundRect(x0 - 0.4 * s0, y0 - 1.7 * s0, 0.8 * s0, 1.7 * s0, [0.4 * s0, 0.4 * s0, 0, 0]); ctx.fill();
      }
      break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawPuddleGround(sp) {
  // a muddy puddle lying on the road (drawn bigger than its bump zone so it shows from afar)
  const pc = sp.pc, o = sp.ref;
  for (let pass = 0; pass < 2; pass++) {
    const d = pass ? 1.0 : 1.25, w = o.w / 2 * (pass ? 1.05 : 1.25);
    ctx.fillStyle = pass ? '#4f9fd6' : '#a8844f';
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      if (!projectLocal(pc.ox, pc.oz, pc.dir, o.along + Math.sin(a) * d, o.lat + Math.cos(a) * w * (1 + 0.1 * Math.sin(a * 3)), 0)) return;
      if (i) ctx.lineTo(PX, PY); else ctx.moveTo(PX, PY);
    }
    ctx.closePath(); ctx.fill();
  }
  if (projectLocal(pc.ox, pc.oz, pc.dir, o.along + 0.3, o.lat - 0.2, 0)) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(PX, PY, 0.35 * PS, 0.05 * PS, 0, 0, TAU); ctx.fill();
  }
}

// The ground: verges first, then the roads on top
function drawPieceGround(pc, pass) {
  const ox = pc.ox, oz = pc.oz, dir = pc.dir, seg = pc.seg;
  const sideA0 = pc.branch ? pc.a0 + VERGE : pc.a0;
  if (pass === 0) {
    groundQuad(ox, oz, dir, pc.a0, pc.square ? pc.a1 + RH + 3 : pc.a1, -VERGE, VERGE, '#cbd893');
    if (seg && seg.zone === 2) {
      // the brook Kidron running beside the road
      const s1 = pc.square ? pc.a1 - VERGE - 3.5 : pc.a1;
      if (s1 > sideA0) {
        for (const s of [-1, 1]) {
          groundQuad(ox, oz, dir, sideA0, s1, s * VERGE, s * (VERGE + 3.6), '#6fb7e0');
          groundQuad(ox, oz, dir, sideA0, s1, s * (VERGE + 1.4), s * (VERGE + 1.9), '#a8dcf5');
        }
      }
    }
    return;
  }
  const r0 = pc.branch ? Math.max(pc.a0, RH) : pc.a0;
  const r1 = pc.square ? pc.a1 - RH : pc.a1;
  if (r1 > r0) {
    groundQuad(ox, oz, dir, r0, r1, -RH, RH, '#e8d29e');
    if (seg) {
      // soft bands across the road show the speed
      for (let b = Math.ceil(r0 / 5); b * 5 < r1; b++) {
        if (b & 1) continue;
        groundQuad(ox, oz, dir, b * 5, Math.min(b * 5 + 2.5, r1), -RH, RH, '#e0c78e');
      }
    }
    groundQuad(ox, oz, dir, r0, r1, -RH, -RH + 0.2, '#c4a56e');
    groundQuad(ox, oz, dir, r0, r1, RH - 0.2, RH, '#c4a56e');
    groundQuad(ox, oz, dir, r0, r1, -LW / 2 - 0.05, -LW / 2 + 0.05, 'rgba(255,255,255,0.45)');
    groundQuad(ox, oz, dir, r0, r1, LW / 2 - 0.05, LW / 2 + 0.05, 'rgba(255,255,255,0.45)');
  }
  if (pc.square) groundQuad(ox, oz, dir, pc.a1 - RH, pc.a1 + RH, -RH, RH, '#e8d29e');
}

// ============================================================
//  Particles (screen space, capped)
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 220) return null;
  const p = { x, y, vx, vy, life, max: life, color, size, grav, leaf: false, rot: 0, vr: 0 };
  particles.push(p);
  return p;
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.leaf ? Math.min(1, a * 3) : a;
    ctx.fillStyle = p.color;
    if (p.leaf) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot + t * p.vr);
      ctx.beginPath(); ctx.ellipse(0, 0, p.size * 2.4, p.size * 0.7, 0, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function leafConfetti(n) {
  for (let i = 0; i < n; i++) {
    const p = spawn(rand(0, viewW), rand(-60, viewH * 0.3), rand(-40, 40), rand(20, 120), rand(2.5, 4.5),
      ['#4caf3c', '#6fd04f', '#3d8a2a', '#a8e063', '#ffe27a'][i % 5], rand(3, 5), 40);
    if (p) { p.leaf = true; p.rot = rand(0, TAU); p.vr = rand(-4, 4); }
  }
}
function sparkle(x, y, n, cols) {
  for (let i = 0; i < n; i++) spawn(x, y, rand(-120, 120), rand(-200, -40), rand(0.4, 0.8), cols[i % cols.length], rand(2.5, 5), 300);
}

function addBubble(seg, a, l, text, dur = 1.8) {
  if (bubbles.length > 3) bubbles.shift();
  toWorld(seg.ox, seg.oz, seg.dir, a, l);
  bubbles.push({ wx: WX, wz: WZ, text, t: dur, max: dur });
}
function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Running, jumping, ducking and turning corners
// ============================================================
function jump() {
  const p = player;
  if (state !== 'play') return;
  if (p.air) { p.jumpBuf = 0.2; return; }      // pressed just before landing: jump again on landing
  p.duckT = 0;
  p.vy = JUMP_V; p.air = true; p.flick = 0.3;
  sfx.hop(1);
}

function duck() {
  const p = player;
  if (state !== 'play') return;
  if (p.air) p.vy = Math.min(p.vy, -12);      // drop quickly back to the road
  p.duckT = DUCK_TIME; p.jumpBuf = 0;
  sfx.duck();
}

function changeLane(d) {
  const n = clamp(player.lane + d, 0, 2);
  if (n === player.lane) return false;
  player.lane = n; player.flick = 0.3;
  sfx.lane(d);
  return true;
}

const turnWindow = () => cur.winT * Math.max(speed, 8);
const inTurnWindow = () => { const toJ = cur.len - player.along; return toJ <= turnWindow() + 1 && toJ > -(RH - 0.3); };

// Left / right: turn the corner if one is coming up that way, otherwise change lanes
function steer(d) {
  if (state !== 'play') return;
  const ok = cur.junc === 'T' || (cur.junc === 'L') === (d < 0);
  if (ok && !pendingTurn && inTurnWindow()) {
    pendingTurn = d; turnFlash = 0.6;
    sfx.turn();
    if (cur.len - player.along <= 0) doTurn(d);
    return;
  }
  changeLane(d);
}

function doTurn(d) {
  const p = player;
  toWorld(cur.ox, cur.oz, cur.dir, p.along, p.x);
  const px = WX, pz = WZ;
  const nd = (cur.dir + d + 4) & 3, n1 = (nd + 1) & 3;
  placeSeg(next, next.ox, next.oz, nd);
  const dx = px - next.ox, dz = pz - next.oz;
  p.along = dx * DIRX[nd] + dz * DIRZ[nd];
  p.x = dx * DIRX[n1] + dz * DIRZ[n1];
  prev = cur;
  prevAlt = cur.junc === 'T' ? (cur.dir - d + 4) & 3 : -1;
  cur = next;
  juncCentre(cur);
  next = makeSeg(cur.start + cur.len, cur.idx + 1, false, cur.zone);
  placeSeg(next, WX, WZ, 0);
  camYawT += d * Math.PI / 2;
  pendingTurn = 0; turnsDone++;
  p.wave = 1;
  cheerT = Math.max(cheerT, 1);
  // forget the crowd we have left behind
  const keep = prev.id * 100000;
  for (const key of crowdCache.keys()) if (key < keep) crowdCache.delete(key);
  if (cur.zone !== zoneNow) { zoneNow = cur.zone; milestone(); }
}

function milestone() {
  const z = ZONES[zoneNow];
  const v = Bible.verse(VERSES[z.verse]);
  banner = { title: z.name, text: `"${v.text.replace(/^[‘“"]+|[’”"]+$/g, '')}" — ${v.cite}`, t: 6, lines: null, w: 0 };
  cheerT = 2.5; player.joy = 1.6;
  leafConfetti(36);
  sfx.win();
}

function collect(it) {
  it.got = true;
  const x = jesus.x, y = jesus.y;
  if (it.type === 'palm') {
    palms++;
    popups.push({ x: x + rand(-20, 20), y: y - 30, text: '+1', t: 0.7, color: '#2b8a3e' });
    sparkle(x, y, 5, ['#6fd04f', '#ffe27a']);
    sfx.collect(palms);
    if (palms % 25 === 0) {
      cheerT = 1.8; player.joy = 1.1;
      showMessage(`${shout('hosanna')} ${palms} palms!`);
      sfx.hosanna();
      addBubble(cur, player.along + 16, (Math.random() < 0.5 ? -1 : 1) * (RH + 1), shout('hosannaHighest'), 2);
    }
  } else if (it.type === 'cloak') {
    magnetT = MAGNET_TIME; cheerT = 2; player.joy = 1;
    showMessage('Hosanna! Palms fly to you!');
    sparkle(x, y, 18, ['#f08cff', '#ffe27a', '#fff']);
    sfx.power();
  } else {
    shieldOn = true; player.wave = 1.5;
    showMessage('A child waves a palm: safe once!');
    sparkle(x, y, 18, ['#ffd43b', '#fff6d0']);
    sfx.power();
  }
}

function crash(cause, o) {
  if (state !== 'play') return;
  if (shieldOn) {
    // the child's palm keeps the donkey safe this time
    shieldOn = false; invulnT = 1.2;
    if (o) o.hit = true;
    sparkle(jesus.x, jesus.y, 22, ['#ffd43b', '#fff6d0', '#e9d6a8']);
    showMessage('Saved by the palm!');
    sfx.shieldPop();
    if (cause === 'wall') doTurn(turnDirs(cur)[0]);
    return;
  }
  state = 'fail'; syncAmbience();
  crashT = 0; crashCause = cause;
  shakeT = 0.45; shockT = 1.2; flashT = 0.2; cheerT = 0;
  bubbles.length = 0;
  player.air = false; player.y = 0; player.duckT = 0;
  if (cause === 'wall') player.along = cur.len + RH - 0.8;
  else player.along -= 0.25;
  speed = 0;
  const m = Math.floor(distRun);
  const score = m + palms * 10;
  newBest = score > best;
  if (newBest) { best = score; try { localStorage.setItem('palmSundayBest', best); } catch (e) {} }
  lastRun = { m, palms, score };
  sparkle(jesus.x, jesus.y - 40, 14, ['#e9d6a8', '#fff']);
  sfx.bump(); sfx.fail();
}

// ============================================================
//  Update
// ============================================================
let camOffX = 0, camOffZ = 0, riderGY = 0;
const TOUCH = matchMedia('(pointer: coarse)').matches;

function updateRider(dt) {
  const p = player;
  p.gait += dt * (speed * 0.9 + 2);
  p.duckF += ((p.duckT > 0 ? 1 : 0) - p.duckF) * Math.min(1, dt * 22);
  p.flick = Math.max(0, p.flick - dt);
  p.earT -= dt;
  if (p.earT <= 0) { p.flick = 0.3; p.earT = rand(1.2, 3.5); }
  p.wave = Math.max(0, p.wave - dt);
  p.joy = Math.max(0, p.joy - dt);
  // the camera swings round smoothly at a corner and keeps the rider near the middle
  camYaw += (camYawT - camYaw) * Math.min(1, dt * 8);
  if (Math.abs(camYawT - camYaw) < 0.0005) camYaw = camYawT;
  const d1 = (cur.dir + 1) & 3;
  const tx = -DIRX[d1] * p.x * 0.5, tz = -DIRZ[d1] * p.x * 0.5;
  camOffX += (tx - camOffX) * Math.min(1, dt * 6);
  camOffZ += (tz - camOffZ) * Math.min(1, dt * 6);
}

function updatePlay(dt) {
  const p = player;
  runT += dt;
  speed = speedAt(distRun);
  const step = speed * dt;
  p.along += step; distRun += step;
  p.x += (LANE_X[p.lane] - p.x) * Math.min(1, dt * 15);
  if (p.air) {
    p.vy -= GRAV * dt; p.y += p.vy * dt;
    if (p.y <= 0) {
      p.y = 0; p.vy = 0; p.air = false;
      for (let i = 0; i < 6; i++) spawn(jesus.x + rand(-30, 30), riderGY, rand(-60, 60), rand(-60, -15), 0.5, '#e9d6a8', rand(3, 6), 60);
      if (p.jumpBuf > 0) { p.jumpBuf = 0; jump(); }
    }
  }
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  p.duckT = Math.max(0, p.duckT - dt);
  invulnT = Math.max(0, invulnT - dt);
  magnetT = Math.max(0, magnetT - dt);
  turnFlash = Math.max(0, turnFlash - dt);
  updateRider(dt);

  // the corner
  const toJ = cur.len - p.along;
  if (pendingTurn && toJ <= 0) doTurn(pendingTurn);
  else if (toJ < -(RH - 0.6)) { crash('wall'); if (state !== 'play') return; }

  // bumps
  if (invulnT <= 0) {
    for (const o of cur.obs) {
      if (o.hit) continue;
      const od = OBS[o.type];
      if (Math.abs(o.along - p.along) > od.d + P_DEPTH) continue;
      if (Math.abs(p.x - o.lat) > o.w / 2 + 0.25) continue;
      if (od.kind === 'low' && p.y >= CLEAR_LOW) continue;
      if (od.kind === 'high' && p.duckT > 0 && p.y < 0.35) continue;
      crash(o.type, o);
      if (state !== 'play') return;
      break;
    }
  }

  // palms and gifts
  const mid = p.y + (p.duckT > 0 ? 0.55 : 1.0);
  for (const it of cur.items) {
    if (it.got) continue;
    let da = it.along - p.along;
    if (da > 18) continue;
    if (magnetT > 0 && it.type === 'palm' && (it.mag || (da > -1 && da < 16))) {
      it.mag = true;
      const f = Math.exp(-14 * dt);
      it.along = p.along + da * f; it.lat = p.x + (it.lat - p.x) * f; it.h = mid + (it.h - mid) * f;
      da = it.along - p.along;
    }
    if (Math.abs(da) > 0.9 || Math.abs(it.lat - p.x) > 0.8) continue;
    if (it.type === 'child' ? p.y > 1.2 : Math.abs(it.h - mid) > 0.95) continue;
    collect(it);
  }

  // the crowd calls out
  shoutT -= dt;
  if (shoutT <= 0) {
    shoutT = rand(1.3, 3);
    const a = p.along + rand(12, 32);
    if (a < cur.len - RH - 2) addBubble(cur, a, (Math.random() < 0.5 ? -1 : 1) * (RH + 1.1), randomShout(), 1.6);
  }

  // "how to" hints the first time each thing comes up in a run
  if (distRun < 900 && (!hint || hint.t <= 0)) {
    for (const o of cur.obs) {
      const da = o.along - p.along;
      if (da < 0 || da > speed * 2.4) continue;
      const kind = OBS[o.type].kind;
      if (!hintsShown[kind]) { hintsShown[kind] = true; hint = { kind, t: 2.6 }; }
      break;
    }
  }
  if (hint) hint.t -= dt;

  // every kilometre
  const km = Math.floor(distRun / 1000);
  if (km > Math.floor((distRun - step) / 1000)) {
    showMessage(`${km * 1000} m! Faster and faster!`);
    cheerT = 1.5; player.joy = 1; sfx.hosanna();
  }
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'title') {
    speed = 8;
    player.along += speed * dt;
    if (player.along > 3000) player.along -= 2000;
    shoutT -= dt;
    if (shoutT <= 0) { shoutT = rand(1.2, 2.6); addBubble(cur, player.along + rand(10, 24), (Math.random() < 0.5 ? -1 : 1) * (RH + 1.1), randomShout(), 1.6); }
    updateRider(dt);
  } else if (state === 'fail') {
    crashT += dt;
    updateRider(dt);
    if (crashT > 1.7 && !overlayShown) gameOverScreen();
  }
  shockT = Math.max(0, shockT - dt);
  cheerT = Math.max(0, cheerT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; popups[i].y -= 60 * dt; if (popups[i].t <= 0) popups.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
}

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

let overlayShown = false;

// A fresh road from Bethphage
function buildWorld(title) {
  segIdN = 0;
  cur = makeSeg(0, 0, title, -1);
  placeSeg(cur, 0, 0, 0);
  juncCentre(cur);
  next = makeSeg(cur.len, 1, false, cur.zone);
  placeSeg(next, WX, WZ, 0);
  prev = null; prevAlt = -1;
  player = newPlayer();
  camYaw = camYawT = 0; camOffX = camOffZ = 0;
  crowdCache.clear();
  zoneNow = 0;
}

function titleScreen() {
  state = 'title'; syncAmbience();
  buildWorld(true);
  speed = 8;
  const v = Bible.verse(VERSES.hosannaSonOfDavid);
  showOverlay('Palm Sunday', 'Hosanna! Ride into Jerusalem',
    `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>
     <ul>
       <li>Jesus rides the little donkey down the Mount of Olives. The road goes on and on, <b>faster and faster</b>!</li>
       <li><b>Swipe &larr; or &rarr;</b> to move to another path.</li>
       <li><b>Swipe &uarr;</b> to <b>jump</b> over rocks, puddles, baskets and sleepy dogs.</li>
       <li><b>Swipe &darr;</b> to <b>duck</b> under low branches, awnings and washing lines.</li>
       <li>When the road ends at a wall, <b>swipe the way the arrow points</b> to turn the corner!</li>
       <li>Collect <b>palm branches</b>. A purple <b>cloak</b> pulls palms to you, and a <b>child waving a palm</b> keeps you safe once.</li>
       <li><b>Keyboard:</b> <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move and turn, <kbd>&uarr;</kbd> / <kbd>W</kbd> / <kbd>Space</kbd> to jump, <kbd>&darr;</kbd> / <kbd>S</kbd> to duck.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     <p class="credit">${Bible.credits(VERSES).join(' ')}</p>`,
    'Ride into Jerusalem', () => startLevel());
}

// Start a run (also "Play Again" and "Restart Level")
function startLevel() {
  buildWorld(false);
  runs++;
  speed = speedAt(0); distRun = 0; palms = 0; runT = 0;
  pendingTurn = 0; turnsDone = 0; turnFlash = 0;
  invulnT = GRACE; shieldOn = false; magnetT = 0;
  crashT = 0; crashCause = ''; newBest = false; overlayShown = false;
  particles = []; bubbles = []; popups = []; ripples.length = 0;
  swipe.id = null;
  banner = null; hint = null; hintsShown = {};
  shockT = cheerT = flashT = shakeT = 0; shoutT = 1.5;
  state = 'play'; syncAmbience();
  hideOverlay();
  showMessage('From Bethphage… Go, little donkey!', 2.6);
  sfx.levelStart();
}

function gameOverScreen() {
  overlayShown = true;
  const r = lastRun;
  const v = Bible.verse(VERSES.kingCometh);
  showOverlay(newBest ? 'New best ride!' : 'Oh… bump!', CRASH_MSG[crashCause] || '',
    `<p class="score">Distance: <b>${r.m} m</b><br>Palm branches: <b>${r.palms}</b> &times; 10<br></p>
     <p class="score" style="font-size:1.35rem">Score: <b>${r.score}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
     <p style="text-align:center">The crowd is ready to cheer again. Can you ride even further?</p>
     <p class="verse">"${v.text}" &mdash; ${v.cite}</p>
     <p class="credit">${Bible.credits(VERSES).join(' ')}</p>`,
    'Play Again', () => startLevel());
}

function togglePause() {
  if (state === 'play') {
    state = 'pause'; syncAmbience();
    showOverlay('Paused', `${Math.floor(distRun)} m so far`,
      '<p style="text-align:center">The donkey is having a little rest. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to start the ride again.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play'; syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input: swipes (primary), taps on the left/right third, keyboard
// ============================================================
function act(dir) {
  if (state !== 'play') return;
  if (dir === 'left') steer(-1);
  else if (dir === 'right') steer(1);
  else if (dir === 'up') jump();
  else if (dir === 'down') duck();
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') act('left');
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') act('right');
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') act('up');
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') act('down');
});

function toView(e) { return { x: e.clientX * dpr / scale, y: e.clientY * dpr / scale }; }

// A swipe fires as soon as the finger has moved SWIPE_PX, without waiting for it to lift.
// Moving on in a new direction (without lifting) fires another swipe.
const swipe = { id: null, x0: 0, y0: 0, sx: 0, sy: 0, t0: 0, fired: false, last: '' };

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 8) { b.action(); return; }
  }
  if (state !== 'play' || swipe.id !== null) return;
  swipe.id = e.pointerId;
  swipe.x0 = swipe.sx = e.clientX; swipe.y0 = swipe.sy = e.clientY;
  swipe.t0 = e.timeStamp; swipe.fired = false; swipe.last = '';
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  ripples.push({ x: p.x, y: p.y, t: 0 });
});

function swipeDir(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'); }

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== swipe.id || state !== 'play') return;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_PX) return;
  const dir = swipeDir(dx, dy);
  if (dir !== swipe.last) act(dir);
  swipe.last = dir; swipe.fired = true;
  swipe.x0 = e.clientX; swipe.y0 = e.clientY;
});

function endSwipe(e) {
  sfx.init();   // iOS only unlocks audio on some gestures, so try again when the finger lifts
  if (e.pointerId !== swipe.id) return;
  swipe.id = null;
  if (swipe.fired || state !== 'play' || e.type === 'pointercancel') return;
  const dx = e.clientX - swipe.sx, dy = e.clientY - swipe.sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) >= SWIPE_PX * 0.7) { act(swipeDir(dx, dy)); return; }
  // a short tap on the left or right third changes lanes
  if (e.timeStamp - swipe.t0 < 400) {
    const f = e.clientX / window.innerWidth;
    if (f < 1 / 3) act('left'); else if (f > 2 / 3) act('right');
  }
}
canvas.addEventListener('pointerup', endSwipe);
canvas.addEventListener('pointercancel', endSwipe);

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Sung choir voices, used by the crowd's "Ho-san-na" below
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// The theme's ambient bed plays only during active play: never behind a card, while muted or once the page is hidden
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// ============================================================
//  Extra sounds: the crowd's "Ho-san-na", the donkey, the goat
// ============================================================
const SCORE_HOSANNA = [
  ['o', 0.5, 'D5', 'B4', 'G4', 'G3'], ['a', 0.5, 'E5', 'C5', 'G4', 'C3'], ['a', 1.4, 'D5', 'B4', 'G4', 'G3'],
];
function playHosanna(ac, out, t0) {
  const beat = 0.3, vols = [0.15, 0.1, 0.1, 0.12];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, SCORE_HOSANNA, part, vols[part], { swell: true });
  organ(ac, out, t0, beat, SCORE_HOSANNA, 0.03);
}

Object.assign(sfx, {
  hosanna() { if (this.ctx) playHosanna(this.ctx, this.master, this.ctx.currentTime + 0.02); },
  collect(n) {
    if (!this.ctx) return;
    Music.tap(((n - 1) % 5) / 4);
  },
  hop(p) { this.puff(0.16); this.tone(300 * p, 0.14, 'sine', 0.16, 0, 560 * p); },
  lane(d) { this.puff(0.08); this.tone(d < 0 ? 380 : 330, 0.1, 'sine', 0.1, 0, d < 0 ? 540 : 230); },
  bump() { this.bounce(); this.puff(0.4); },
  heeHaw() {
    // a happy "hee-haw, hee-haw!"
    [[0, 760, 920, 0.22], [0.26, 430, 270, 0.36], [0.72, 780, 940, 0.2], [0.96, 430, 260, 0.4]].forEach(([d, f1, f2, len]) =>
      this.tone(f1, len, 'sawtooth', 0.05, d, f2));
  },
  baa() {
    if (!this.ctx) return;
    const ac = this.ctx, t0 = ac.currentTime;
    const o = ac.createOscillator(), lfo = ac.createOscillator(), depth = ac.createGain();
    const lp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(380, t0); o.frequency.linearRampToValueAtTime(330, t0 + 0.5);
    lfo.frequency.value = 11; depth.gain.value = 22;
    lfo.connect(depth); depth.connect(o.frequency);
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 0.6); lfo.start(t0); lfo.stop(t0 + 0.6);
  },
});

Object.assign(sfx, {
  duck() { this.puff(0.1); this.tone(420, 0.14, 'sine', 0.12, 0, 210); },
  turn() { this.puff(0.14); this.tone(520, 0.12, 'triangle', 0.12, 0, 780); this.tone(780, 0.16, 'sine', 0.1, 0.08, 1040); },
  power() { if (!this.ctx) return; for (let i = 0; i < 5; i++) setTimeout(() => Music.tap(i / 4), i * 70); },
  shieldPop() { this.bounce(); this.tone(880, 0.3, 'sine', 0.14, 0.05, 1320); },
});

// ============================================================
//  Rendering
// ============================================================
const bgClouds = Array.from({ length: 9 }, (_, i) => ({ a: (i / 9) * TAU + rand(-0.2, 0.2), y: rand(0.2, 0.75), w: rand(90, 170) }));
const wrapA = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

function hillPath(amp, base, f1, f2, ph, col) {
  const hs = viewH / 900;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, HOR + 2);
  for (let sx = 0; sx <= viewW + 12; sx += 12) {
    const a = camYaw + Math.atan((sx - CX) / FOCAL);
    const y = HOR - (base + amp * (0.5 + 0.5 * Math.sin(a * f1 + ph)) + amp * 0.35 * Math.sin(a * f2 + ph * 2)) * hs;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(viewW + 12, HOR + 2); ctx.closePath(); ctx.fill();
}

function drawBackdrop() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, viewW, HOR + 2);
  // the sun, fixed in the sky as the road turns
  const sa = wrapA(0.6 - camYaw);
  if (Math.abs(sa) < 1.25) {
    const sx = CX + Math.tan(sa) * FOCAL, sy = HOR * 0.3;
    ctx.fillStyle = 'rgba(255,240,170,0.35)';
    ctx.beginPath(); ctx.arc(sx, sy, 70, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.arc(sx, sy, 42, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fffbe0';
    ctx.beginPath(); ctx.arc(sx, sy, 30, 0, TAU); ctx.fill();
  }
  for (const c of bgClouds) {
    const a = wrapA(c.a + t * 0.004 - camYaw);
    if (Math.abs(a) > 1.3) continue;
    drawCloud(CX + Math.tan(a) * FOCAL, HOR * c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.92)', 'rgba(220,235,250,0.85)');
  }
  hillPath(26, 14, 3, 7, 1, '#cfd9a3');
  // Jerusalem, always waiting at the end of the road: bigger as you near the Golden Gate
  const rel = wrapA(camYaw - cur.dir * Math.PI / 2);
  if (Math.abs(rel) < 1.2) {
    const s = ZONES[zoneNow].city * 0.5 * (viewH / 900) * (state === 'title' ? 0.9 : 1);
    drawCity(CX + Math.tan(-rel) * FOCAL, HOR - 3 * s, s);
  }
  hillPath(10, 2, 5, 11, 4, '#b6d08a');
}

function drawBubbles() {
  ctx.save();
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of bubbles) {
    if (!project(b.wx, 2.3, b.wz) || PZ > 60) continue;
    const lines = b.text.split('\n');
    let w = 0;
    for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    w += 22;
    const h = lines.length * 20 + 10;
    const x = clamp(PX, w / 2 + 6, viewW - w / 2 - 6), y = Math.max(PY, h + 80 + safeTop);
    const pop = Math.min(1, (b.max - b.t) / 0.15);
    ctx.globalAlpha = Math.min(1, b.t / 0.3);
    ctx.save();
    ctx.translate(x, y); ctx.scale(0.6 + pop * 0.4, 0.6 + pop * 0.4);
    ctx.fillStyle = '#fffdf2'; ctx.strokeStyle = '#d9a13a'; ctx.lineWidth = 2.5;
    const tx = clamp(PX - x, -w / 2 + 14, w / 2 - 14);
    roundRect(-w / 2, -h, w, h, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx - 8, -1); ctx.lineTo(tx, 12); ctx.lineTo(tx + 8, -1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillRect(tx - 8, -4, 16, 4);
    ctx.fillStyle = '#7a5200';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, -h + 15 + i * 20);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.font = '700 22px Fredoka, sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.3, 0, 1);
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

function drawScene() {
  // camera: behind the rider, looking along its (smoothly turning) heading
  toWorld(cur.ox, cur.oz, cur.dir, player.along, player.x);
  const px = WX, pz = WZ;
  cosY = Math.cos(camYaw); sinY = Math.sin(camYaw);
  camX = px + camOffX - sinY * CAM_BACK;
  camZ = pz + camOffZ - cosY * CAM_BACK;

  drawBackdrop();
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, HOR, viewW, viewH - HOR);

  buildPieces();
  for (let i = 0; i < pieceN; i++) drawPieceGround(pieces[i], 0);
  for (let i = 0; i < pieceN; i++) drawPieceGround(pieces[i], 1);
  ctx.fillStyle = hazeGrad;
  ctx.fillRect(0, HOR - 2, viewW, 38);

  // the rider's spot on screen, which the crowd looks towards
  project(px, 0, pz);
  jesus.x = PX; jesus.y = PY - 1.6 * PS; riderGY = PY;

  sprN = 0;
  for (let i = 0; i < pieceN; i++) collectPiece(pieces[i]);
  project(px, 0, pz);
  addSpr(SP_PLAYER, null, null, 0, 0);
  sprOrder.length = 0;
  for (let i = 0; i < sprN; i++) sprOrder.push(SPR[i]);
  sprOrder.sort(byDepth);
  for (let i = 0; i < sprOrder.length; i++) drawSprite(sprOrder[i]);
}

// ============================================================
//  HUD
// ============================================================
function hudText(text, x, y, size, color, align = 'center') {
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  ctx.textAlign = align;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function wrapLines(text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const top = safeTop;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  if (state === 'title') { ctx.restore(); return; }

  // distance in the middle, palms and score on the right
  const m = Math.floor(distRun);
  hudText(`${m} m`, viewW / 2 + 28, top + 38, 30, '#5a4210');
  const rx = viewW - 14;
  ctx.save();
  ctx.translate(rx - 12, top + 42); drawPalm(0, 0, 30, 0.25, 3);
  ctx.restore();
  hudText(`${palms}`, rx - 30, top + 36, 24, '#2b7a2b', 'right');
  hudText(`Score ${m + palms * 10}`, rx, top + 60, 15, '#7a5a20', 'right');

  // power-ups
  let py = top + 84;
  if (magnetT > 0) {
    const w = 110;
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; roundRect(rx - w, py - 10, w, 14, 7); ctx.fill();
    ctx.fillStyle = '#c05ad0'; roundRect(rx - w, py - 10, w * (magnetT / MAGNET_TIME), 14, 7); ctx.fill();
    hudText('Hosanna magnet', rx - w - 6, py + 2, 13, '#7a2a8a', 'right');
    py += 22;
  }
  if (shieldOn) hudText('Safe once ✓', rx, py + 2, 14, '#b07a00', 'right');

  // the corner: which way to swipe
  const toJ = cur.len - player.along;
  if (state === 'play' && ((!pendingTurn && inTurnWindow() && toJ < turnWindow() + speed * 0.3) || turnFlash > 0)) {
    const pulse = 1 + Math.sin(t * 12) * 0.08;
    const ay = HOR + (viewH - HOR) * 0.2;
    ctx.save();
    if (pendingTurn) {
      ctx.globalAlpha = clamp(turnFlash / 0.3, 0, 1);
      drawArrows(pendingTurn < 0 ? viewW * 0.22 : viewW * 0.78, ay, pendingTurn < 0 ? 'L' : 'R', 1.3);
    } else {
      const s = 1.25 * pulse;
      if (cur.junc !== 'R') drawArrows(viewW * 0.2, ay, 'L', s);
      if (cur.junc !== 'L') drawArrows(viewW * 0.8, ay, 'R', s);
      if (turnsDone < 3) {
        const way = cur.junc === 'L' ? '←' : cur.junc === 'R' ? '→' : '← or →';
        hudText(TOUCH ? `Swipe ${way} to turn!` : `Press ${way} to turn!`, viewW / 2, ay - 50, 26, '#b8430a');
      }
    }
    ctx.restore();
  }

  // first-time hints
  if (hint && hint.t > 0 && state === 'play') {
    const a = Math.min(1, hint.t / 0.4);
    const txt = {
      low: TOUCH ? 'Swipe ↑ to jump!' : 'Press ↑ or Space to jump!',
      high: TOUCH ? 'Swipe ↓ to duck!' : 'Press ↓ to duck!',
      block: TOUCH ? 'Swipe ← or → to go round!' : 'Press ← or → to go round!',
    }[hint.kind];
    ctx.globalAlpha = a;
    ctx.font = '700 22px Fredoka, sans-serif';
    const w = ctx.measureText(txt).width + 36, y = viewH * 0.93;
    ctx.fillStyle = 'rgba(255,252,240,0.92)'; ctx.strokeStyle = 'rgba(224,165,38,0.9)'; ctx.lineWidth = 3;
    roundRect(viewW / 2 - w / 2, y - 26, w, 44, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a4a10'; ctx.textAlign = 'center';
    ctx.fillText(txt, viewW / 2, y + 4);
    ctx.globalAlpha = 1;
  }

  // milestone verse banner
  if (banner) {
    const a = Math.min(1, banner.t / 0.5, (6 - banner.t) / 0.3);
    const bw = Math.min(viewW - 24, 560);
    ctx.font = '600 15px Fredoka, sans-serif';
    if (!banner.lines || banner.w !== bw) { banner.lines = wrapLines(banner.text, bw - 28); banner.w = bw; }
    const h = 44 + banner.lines.length * 19;
    const x = viewW / 2 - bw / 2, y = top + 96;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,252,240,0.93)'; ctx.strokeStyle = 'rgba(224,165,38,0.9)'; ctx.lineWidth = 3;
    roundRect(x, y, bw, h, 16); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c07a10'; ctx.font = '700 20px Fredoka, sans-serif';
    ctx.fillText(banner.title, viewW / 2, y + 27);
    ctx.fillStyle = '#6a5530'; ctx.font = 'italic 600 15px Fredoka, sans-serif';
    for (let i = 0; i < banner.lines.length; i++) ctx.fillText(banner.lines[i], viewW / 2, y + 50 + i * 19);
    ctx.globalAlpha = 1;
  }

  // messages
  if (message.t > 0) {
    ctx.globalAlpha = clamp(message.t / 0.5, 0, 1);
    hudText(message.text, viewW / 2, banner ? HOR + 30 : HOR - 30, 24, '#7a5200');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-5, 5) * shakeT * 2; sy = rand(-5, 5) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, sx * scale, sy * scale);
  drawScene();
  drawParticles();
  drawBubbles();
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  frameDt = dt;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
