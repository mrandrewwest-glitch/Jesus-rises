//  Rendering
// ============================================================
const bgClouds = Array.from({ length: 6 }, () => ({ f: Math.random(), y: rand(60, 330), w: rand(90, 170) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, 620);
  g.addColorStop(0, '#7cc6f2');
  g.addColorStop(0.55, '#bfe6fb');
  g.addColorStop(1, '#fff1cf');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);

  // the sun
  const sx = W * 0.82, sy = 120 - offY * 0.4;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(t * 0.05);
  ctx.fillStyle = 'rgba(255,240,170,0.35)';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -120); ctx.lineTo(14, -120); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 60);
  sg.addColorStop(0, '#fffbe0'); sg.addColorStop(0.6, '#ffe27a'); sg.addColorStop(1, 'rgba(255,226,122,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 60, 0, TAU); ctx.fill();

  const span = viewW + 340;
  for (const c of bgClouds) {
    let x = (c.f * span - dist * 0.04 - t * 6) % span;
    if (x < 0) x += span;
    drawCloud(-offX - 170 + x, c.y - offY * 0.3, c.w, c.w * 0.3, 'rgba(255,255,255,0.92)', 'rgba(220,235,250,0.85)');
  }
}

function hillLine(par, base, a1, p1, a2, p2) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1 + 20; x += 20) {
    const wx = x + dist * par;
    ctx.lineTo(x, base + Math.sin(wx / p1) * a1 + Math.sin(wx / p2) * a2);
  }
  ctx.lineTo(x1 + 20, H); ctx.closePath(); ctx.fill();
}

// Jerusalem on its hill, drawing nearer as the donkey travels
function drawCity(p) {
  const e = 1 - (1 - p) * (1 - p);
  const cx = lerp(W + 150, W * 0.66, e), s = lerp(0.5, 1.1, p);
  ctx.save();
  ctx.translate(cx, 606); ctx.scale(s, s);
  // the hill
  ctx.fillStyle = '#c2c68c';
  ctx.beginPath(); ctx.ellipse(0, 30, 360, 90, 0, Math.PI, TAU); ctx.fill();
  // houses behind the wall
  const houses = [[-270, 50, 40], [-215, 44, 62], [-160, 56, 48], [-100, 42, 70], [-40, 50, 55], [150, 50, 60], [205, 46, 44], [250, 44, 66]];
  for (const [x, w, h] of houses) {
    ctx.fillStyle = (x / 10) % 2 ? '#f3e5c0' : '#e8d3a2';
    ctx.fillRect(x, -60 - h, w, h);
    ctx.fillStyle = 'rgba(90,60,30,0.55)';
    ctx.fillRect(x + w * 0.3, -60 - h + 12, 7, 9);
    if (h > 50) ctx.fillRect(x + w * 0.6, -60 - h + 30, 7, 9);
  }
  // the Temple, white and gold
  ctx.fillStyle = '#e9dcb8';
  ctx.fillRect(-10, -120, 170, 50);                  // platform
  ctx.fillStyle = '#fbf7ea'; ctx.strokeStyle = '#cdbf98'; ctx.lineWidth = 2;
  ctx.fillRect(20, -235, 110, 120); ctx.strokeRect(20, -235, 110, 120);
  ctx.fillRect(-5, -170, 160, 55); ctx.strokeRect(-5, -170, 160, 55);
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(20, -243, 110, 10);
  ctx.fillRect(-5, -176, 160, 7);
  for (let x = 24; x <= 126; x += 12) { ctx.beginPath(); ctx.moveTo(x, -243); ctx.lineTo(x + 3, -253); ctx.lineTo(x + 6, -243); ctx.fill(); }
  ctx.fillStyle = '#d9a13a';
  roundRect(58, -218, 34, 60, [17, 17, 0, 0]); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(28, -228, 8, 100);
  // the city wall with towers
  const stone = '#dcc28c', dark = '#b89c64';
  ctx.fillStyle = stone; ctx.strokeStyle = dark; ctx.lineWidth = 2;
  ctx.fillRect(-300, -80, 600, 80); ctx.strokeRect(-300, -80, 600, 80);
  ctx.fillStyle = stone;
  for (let x = -300; x < 300; x += 22) ctx.fillRect(x, -92, 12, 12);
  for (const tx of [-300, -130, 110, 270]) {
    ctx.fillStyle = stone;
    ctx.fillRect(tx - 6, -125, 42, 125); ctx.strokeRect(tx - 6, -125, 42, 125);
    for (let k = 0; k < 3; k++) ctx.fillRect(tx - 6 + k * 16, -136, 10, 12);
    ctx.fillStyle = 'rgba(80,55,25,0.6)';
    roundRect(tx + 11, -105, 8, 18, [4, 4, 0, 0]); ctx.fill();
  }
  ctx.fillStyle = 'rgba(80,55,25,0.55)';     // the gate, far away
  roundRect(-20, -50, 44, 50, [22, 22, 0, 0]); ctx.fill();
  ctx.restore();
}

function drawOliveTree(x, y, s) {
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x + 2 * s, y - 55 * s); ctx.stroke();
  ctx.fillStyle = '#7d9460';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
    ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = 'rgba(200,220,160,0.35)';
  ctx.beginPath(); ctx.arc(x - 4 * s, y - 76 * s, 8 * s, 0, TAU); ctx.fill();
}

function drawLand(p) {
  // distant Judean hills
  ctx.fillStyle = '#cfd9a3';
  hillLine(0.06, 570, 22, 170, 7, 61);
  drawCity(p);
  // the slope of the Mount of Olives with its trees
  ctx.fillStyle = '#a9cf85';
  hillLine(0.3, 622, 12, 140, 5, 47);
  const gap = 210, left = -offX - 80 + dist * 0.3, right = W + offX + 80 + dist * 0.3;
  for (let k = Math.floor(left / gap); k <= Math.ceil(right / gap); k++) {
    if (hrand(k, 5) < 0.25) continue;
    const x = k * gap + hrand(k, 6) * 80 - dist * 0.3;
    drawOliveTree(x, 630 + hrand(k, 7) * 10, 0.55 + hrand(k, 8) * 0.25);
  }
  // grass beside the road
  ctx.fillStyle = '#93c46a';
  ctx.fillRect(-offX, ROAD_TOP - 18, viewW, 20);

  // the road down into Jerusalem
  const rg = ctx.createLinearGradient(0, ROAD_TOP, 0, ROAD_BOT);
  rg.addColorStop(0, '#e2c890'); rg.addColorStop(1, '#efdcad');
  ctx.fillStyle = rg;
  ctx.fillRect(-offX, ROAD_TOP, viewW, ROAD_BOT - ROAD_TOP);
  ctx.fillStyle = '#c9a96c';
  ctx.fillRect(-offX, ROAD_TOP, viewW, 4);
  // pebbles
  ctx.fillStyle = '#c9ad78';
  const pg = 37, pl = dist - DX() - offX - 20, pr = dist - DX() + W + offX + 20;
  for (let k = Math.floor(pl / pg); k <= Math.ceil(pr / pg); k++) {
    const x = toScreen(k * pg + hrand(k, 1) * 30), y = ROAD_TOP + 12 + hrand(k, 2) * (ROAD_BOT - ROAD_TOP - 24);
    ctx.beginPath(); ctx.ellipse(x, y, 1.5 + hrand(k, 3) * 2.5, 1 + hrand(k, 3) * 1.4, 0, 0, TAU); ctx.fill();
  }
  // near verge
  ctx.fillStyle = '#86b95d';
  ctx.fillRect(-offX, ROAD_BOT, viewW, H - ROAD_BOT + 20);
  ctx.fillStyle = '#74a84c';
  ctx.fillRect(-offX, ROAD_BOT, viewW, 5);
}

// The gate of Jerusalem: the finish line
function drawGate(gx) {
  if (state === 'title' || gx > W + offX + 160) return;
  const gy = ROAD_Y + 6, right = W + offX + 10;
  const stone = ctx.createLinearGradient(0, gy - 340, 0, gy);
  stone.addColorStop(0, '#f3e2b8'); stone.addColorStop(1, '#d2b57c');
  ctx.fillStyle = stone; ctx.strokeStyle = '#a88a55'; ctx.lineWidth = 2;
  // the wall runs on into the city
  if (right > gx + 110) {
    ctx.fillRect(gx + 110, gy - 250, right - gx - 110, 250);
    for (let x = gx + 120; x < right; x += 30) ctx.fillRect(x, gy - 266, 17, 17);
    ctx.strokeStyle = 'rgba(160,125,70,0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let y = gy - 225; y < gy; y += 28) { ctx.moveTo(gx + 110, y); ctx.lineTo(right, y); }
    ctx.stroke();
  }
  // gatehouse
  ctx.fillStyle = stone; ctx.strokeStyle = '#a88a55'; ctx.lineWidth = 2;
  ctx.fillRect(gx - 75, gy - 290, 150, 290);
  for (const tx of [gx - 130, gx + 60]) {
    ctx.fillRect(tx, gy - 340, 70, 340); ctx.strokeRect(tx, gy - 340, 70, 340);
    for (let k = 0; k < 3; k++) ctx.fillRect(tx + k * 26, gy - 356, 18, 17);
    ctx.fillStyle = 'rgba(80,55,25,0.6)';
    roundRect(tx + 29, gy - 300, 12, 30, [6, 6, 0, 0]); ctx.fill();
    roundRect(tx + 29, gy - 200, 12, 30, [6, 6, 0, 0]); ctx.fill();
    ctx.fillStyle = stone;
  }
  for (let k = 0; k < 4; k++) ctx.fillRect(gx - 64 + k * 34, gy - 305, 20, 16);
  // the open gateway
  const og = ctx.createLinearGradient(0, gy - 200, 0, gy);
  og.addColorStop(0, '#3a2c1c'); og.addColorStop(1, '#7a5a34');
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.moveTo(gx - 52, gy); ctx.lineTo(gx - 52, gy - 150);
  ctx.arc(gx, gy - 150, 52, Math.PI, TAU);
  ctx.lineTo(gx + 52, gy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9a86a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(gx - 56, gy); ctx.lineTo(gx - 56, gy - 150); ctx.arc(gx, gy - 150, 56, Math.PI, TAU); ctx.lineTo(gx + 56, gy); ctx.stroke();
  // warm light from the city within
  const lg = ctx.createRadialGradient(gx, gy - 40, 5, gx, gy - 40, 80);
  lg.addColorStop(0, 'rgba(255,230,150,0.55)'); lg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(gx - 52, gy - 200, 104, 200);
  // palm garlands over the gateway
  drawPalm(gx - 60, gy - 205, 56, -0.6, 6);
  drawPalm(gx + 60, gy - 205, 56, 0.6, -6);
  // banner
  ctx.fillStyle = '#b5503f';
  roundRect(gx - 46, gy - 258, 92, 26, 6); ctx.fill();
  ctx.fillStyle = '#fff5d6'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Jerusalem', gx, gy - 245);
  ctx.textBaseline = 'alphabetic';
}

function drawHeart(x, y, r, full) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
  ctx.closePath();
  ctx.fillStyle = full ? '#e8445a' : 'rgba(90,66,16,0.2)';
  ctx.fill();
  if (full) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(x - r * 0.45, y - r * 0.35, r * 0.22, 0, TAU); ctx.fill();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + joy hearts
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Palm Sunday' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('JOY', 12, 52);
  ctx.shadowBlur = 0;
  for (let i = 0; i < MAX_HEARTS; i++) {
    const pulse = i === hearts - 1 && hearts === 1 ? 1 + Math.sin(t * 10) * 0.12 : 1;
    drawHeart(50 + i * 24, 46, 9 * pulse, state === 'title' || i < hearts);
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score + Hosanna combo
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  if (state !== 'title') ctx.fillText(`Score ${totalScore + (state === 'win' ? 0 : levelPoints)}`, rx, 26);
  if (state !== 'title' && combo >= 2) {
    ctx.fillStyle = combo >= 5 ? '#c2410c' : '#8a6a1a';
    ctx.font = `700 ${combo >= 5 ? 17 : 15}px Fredoka, sans-serif`;
    ctx.fillText(`Hosanna ×${combo}`, rx, 50);
  }

  // Progress to the gate of Jerusalem
  if (state !== 'title') {
    const x0 = 132, x1 = viewW - 40, y = 84;
    const p = clamp(dist / cfg.len, 0, 1);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.22)';
    roundRect(x0, y - 5, x1 - x0, 10, 5); ctx.fill();
    const pg = ctx.createLinearGradient(x0, 0, x1, 0);
    pg.addColorStop(0, '#8fd16a'); pg.addColorStop(1, '#f7c948');
    ctx.fillStyle = pg;
    if (p > 0) { roundRect(x0, y - 5, (x1 - x0) * p, 10, 5); ctx.fill(); }
    // little gate at the end
    ctx.fillStyle = '#d2b57c'; ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 1.5;
    ctx.fillRect(x1 + 4, y - 14, 24, 24); ctx.strokeRect(x1 + 4, y - 14, 24, 24);
    ctx.fillStyle = '#5a4020';
    roundRect(x1 + 11, y - 4, 10, 14, [5, 5, 0, 0]); ctx.fill();
    // the donkey's marker
    const mx = x0 + (x1 - x0) * p;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, y, 8, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, y - 2, 4, 0, TAU); ctx.stroke();
  }

  // Level 1: show where to tap
  if (hintT > 0 && state === 'play') {
    const a = Math.min(1, hintT / 0.6);
    const sy = splitY();
    ctx.globalAlpha = a;
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(viewW, sy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'center';
    ctx.font = '700 19px Fredoka, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineJoin = 'round';
    ctx.fillStyle = '#2b6a1e';
    ctx.strokeText('↑ Tap up here to HOP', viewW / 2, sy - 16);
    ctx.fillText('↑ Tap up here to HOP', viewW / 2, sy - 16);
    ctx.fillStyle = '#8a4a10';
    ctx.strokeText('Tap down here to DUCK ↓', viewW / 2, sy + 30);
    ctx.fillText('Tap down here to DUCK ↓', viewW / 2, sy + 30);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.4);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, H * 0.4);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  jesus.x = DX(); jesus.y = ROAD_Y - donk.y - 90;
  drawSky();
  drawLand(state === 'title' ? 0.05 : clamp(dist / cfg.len, 0, 1));

  for (const s of crowdSlots(ROWS[0])) drawPerson(s);
  for (const o of obstacles) drawObstacle(o, 'back');
  drawGate(toScreen(cfg.len));
  for (const it of items) drawItem(it);
  for (const o of obstacles) drawObstacle(o, 'mid');
  drawDonkey(DX(), ROAD_Y);
  for (const o of obstacles) drawObstacle(o, 'front');
  drawParticles();
  for (const s of crowdSlots(ROWS[1])) drawPerson(s);
  drawBubbles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = r.duck ? `rgba(255,220,160,${0.8 * (1 - r.t / 0.4)})` : `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePlay(dt) {
  slowF = Math.min(1, slowF + dt * 0.6);
  speed = speedAt(dist) * slowF;
  dist += speed * dt;
  updateDonkey(dt);
  hintT = Math.max(0, hintT - dt);

  // stubborn goats wander toward the donkey and bleat
  for (const o of obstacles) {
    if (o.type !== 'goat' || o.hit) continue;
    const sx = toScreen(o.x);
    if (sx < W + offX + 100 && sx > DX() + 90) {
      o.x -= 20 * dt;
      if (!o.baa && sx < W - 40) { o.baa = true; addBubble(o.x - 20, ROAD_Y - 90, 'Baa!', 1.1, '#fff'); sfx.baa(); }
    }
  }

  if (donk.hitCd <= 0) {
    for (const o of obstacles) {
      const sx = toScreen(o.x);
      if (sx < DX() - 200) continue;
      if (sx > DX() + 220) break;
      if (!o.hit && obstacleHits(o)) { bump(o); break; }
    }
  }
  if (state !== 'play') return;
  for (const it of items) if (!it.got && itemHit(it)) collect(it);

  if (dist >= cfg.len - 180) win();
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  updateCrowd(dt);
  if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'win') {
    winT += dt;
    const before = dist;
    dist += (cfg.len - dist) * Math.min(1, dt * 2.2);
    speed = (dist - before) / dt;
    updateDonkey(dt);
    if (winStep === 0 && winT > 0.5) { addBubble(dist + 150, ROAD_Y - 280, 'Who is this?', 2.6); winStep = 1; }
    if (winStep === 1 && winT > 1.9) { addBubble(dist - 50, H - 92, 'This is Jesus the prophet\nof Nazareth of Galilee.', 3); winStep = 2; }
    if (Math.random() < dt * 5) leafConfetti(2);
  } else if (state === 'fail') {
    speed *= Math.pow(0.03, dt);
    dist += speed * dt;
    updateDonkey(dt);
  } else if (state === 'title') {
    speed = 110;
    dist += speed * dt;
    updateDonkey(dt);
  }
  shockT = Math.max(0, shockT - dt);
  worriedT = Math.max(0, worriedT - dt);
  cheerT = Math.max(0, cheerT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; if (popups[i].t <= 0) popups.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
