<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Palm Sunday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .credit { font-size: 0.72rem; color: #9a8a6a; margin-top: 8px; margin-bottom: 0; text-align: center; }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Palm Sunday</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'hallelujah', instrument: 'pipe', accent: 'harp', ambience: 'crowd', percussion: true };

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// The iPhone notch / status bar: keep the HUD below it
const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
document.body.appendChild(safeProbe);
let safeTop = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;
  safeTop = (safeProbe.offsetHeight || 0) * dpr / scale;
  layoutView();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// ============================================================
//  The 3D camera: it rides behind and above the donkey, looking down the
//  road to the vanishing point. The ground is flat; everything on it is
//  projected with a simple pinhole camera, so turning a corner is just
//  swinging the camera round.
// ============================================================
let FOCAL = 400, HOR = 300, CX = 240, CAM_H = 4;
const CAM_BACK = 4.6;           // how far behind the rider the camera sits (m)
const NEAR = 0.6;               // near clipping plane (m)
const FAR = 125;                // how far ahead the road is drawn (m)
let skyGrad = null, groundGrad = null, hazeGrad = null;

function layoutView() {
  CX = viewW / 2;
  FOCAL = Math.min(viewW * 0.86, viewH * 0.62);
  HOR = viewH * (viewW < viewH ? 0.34 : 0.36);
  const riderY = viewH * 0.8;                       // the donkey's hooves sit here on screen
  CAM_H = (riderY - HOR) * CAM_BACK / FOCAL;        // ...which sets the camera's height
  skyGrad = ctx.createLinearGradient(0, 0, 0, HOR);
  skyGrad.addColorStop(0, '#6fbdf0'); skyGrad.addColorStop(0.6, '#b9e2fa'); skyGrad.addColorStop(1, '#fff0cc');
  groundGrad = ctx.createLinearGradient(0, HOR, 0, viewH);
  groundGrad.addColorStop(0, '#c9d79a'); groundGrad.addColorStop(0.25, '#a6cc76'); groundGrad.addColorStop(1, '#86bd5a');
  hazeGrad = ctx.createLinearGradient(0, HOR - 2, 0, HOR + 36);
  hazeGrad.addColorStop(0, 'rgba(250,240,210,0.9)'); hazeGrad.addColorStop(1, 'rgba(250,240,210,0)');
}
window.addEventListener('resize', resize);

// Headings: 0 north, 1 east, 2 south, 3 west. The right of heading d is heading d+1.
const DIRX = [0, 1, 0, -1], DIRZ = [1, 0, -1, 0];
let camX = 0, camZ = 0, camYaw = 0, camYawT = 0, cosY = 1, sinY = 0, camLatF = 0;
let WX = 0, WZ = 0;               // result of toWorld()
let PX = 0, PY = 0, PZ = 0, PS = 1; // result of project(): screen x, y, depth, pixels per metre

// A spot on a stretch of road (along it, across it) -> world x/z
function toWorld(ox, oz, dir, a, l) {
  const d1 = (dir + 1) & 3;
  WX = ox + DIRX[dir] * a + DIRX[d1] * l;
  WZ = oz + DIRZ[dir] * a + DIRZ[d1] * l;
}
function project(wx, wy, wz) {
  const dx = wx - camX, dz = wz - camZ;
  PZ = dx * sinY + dz * cosY;
  const X = dx * cosY - dz * sinY;
  PS = FOCAL / Math.max(PZ, 0.01);
  PX = CX + X * PS;
  PY = HOR + (CAM_H - wy) * PS;
  return PZ > NEAR;
}
function projectLocal(ox, oz, dir, a, l, y) { toWorld(ox, oz, dir, a, l); return project(WX, y, WZ); }

// Ground polygons, clipped against the near plane (no per-frame allocations)
const QX = new Float64Array(8), QZ = new Float64Array(8), OXS = new Float64Array(16), OZS = new Float64Array(16);
function qpt(i, ox, oz, dir, a, l) {
  toWorld(ox, oz, dir, a, l);
  const dx = WX - camX, dz = WZ - camZ;
  QX[i] = dx * cosY - dz * sinY;
  QZ[i] = dx * sinY + dz * cosY;
}
function fillClipped(n, color) {
  let m = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, zi = QZ[i], zj = QZ[j];
    const inI = zi >= NEAR, inJ = zj >= NEAR;
    if (inI) { OXS[m] = QX[i]; OZS[m] = zi; m++; }
    if (inI !== inJ) {
      const f = (NEAR - zi) / (zj - zi);
      OXS[m] = QX[i] + (QX[j] - QX[i]) * f; OZS[m] = NEAR; m++;
    }
  }
  if (m < 3) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < m; i++) {
    const iz = FOCAL / OZS[i];
    const x = CX + OXS[i] * iz, y = HOR + CAM_H * iz;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
function groundQuad(ox, oz, dir, a0, a1, l0, l1, color) {
  qpt(0, ox, oz, dir, a0, l0); qpt(1, ox, oz, dir, a0, l1);
  qpt(2, ox, oz, dir, a1, l1); qpt(3, ox, oz, dir, a1, l0);
  if (QZ[0] < NEAR && QZ[1] < NEAR && QZ[2] < NEAR && QZ[3] < NEAR) return;
  fillClipped(4, color);
}

// A solid box standing on the ground (houses, walls), drawn with only its visible faces
const BXS = new Float64Array(8), BYS = new Float64Array(8);
function drawBox(ox, oz, dir, a0, a1, l0, l1, h, cTop, cSide, cFront, outline) {
  for (let i = 0; i < 8; i++) {
    if (!projectLocal(ox, oz, dir, i & 4 ? a1 : a0, i & 2 ? l1 : l0, i & 1 ? h : 0)) return;
    BXS[i] = PX; BYS[i] = PY;
  }
  // the camera, in the road's own frame
  const d1 = (dir + 1) & 3;
  const ca = (camX - ox) * DIRX[dir] + (camZ - oz) * DIRZ[dir];
  const cl = (camX - ox) * DIRX[d1] + (camZ - oz) * DIRZ[d1];
  ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
  const face = (a, b, c, d, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(BXS[a], BYS[a]); ctx.lineTo(BXS[b], BYS[b]); ctx.lineTo(BXS[c], BYS[c]); ctx.lineTo(BXS[d], BYS[d]);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  if (cl < l0) face(0, 1, 5, 4, cSide);          // side nearest the road's left
  if (cl > l1) face(2, 3, 7, 6, cSide);
  if (ca < a0) face(0, 1, 3, 2, cFront);         // the face looking back up the road
  if (ca > a1) face(4, 5, 7, 6, cFront);
  if (CAM_H > h) face(1, 3, 7, 5, cTop);
}

// ============================================================
//  Tuning
// ============================================================
const LW = 1.5;                  // metres between lane centres
const LANE_X = [-LW, 0, LW];
const RH = 2.4;                  // half the road's width
const VERGE = RH + 2.9;          // the crowd stands on the verge beside the road
const GRAV = 20;                 // m/s^2 on a jump
const JUMP_V = 7.5;              // take-off speed: about 0.75 s in the air, 1.4 m high
const DUCK_TIME = 0.75;          // seconds bowed low
const CLEAR_LOW = 0.55;          // hooves must be this high to clear a low obstacle
const P_DEPTH = 0.4;             // half the donkey's length, for bumps
const GRACE = 3;                 // seconds of protection at the very start of a run
const MAGNET_TIME = 8;           // the "Hosanna!" cloak pulls palms in for this long
const SWIPE_PX = 22;             // CSS px a finger must travel to count as a swipe

// Speed keeps rising for ever (m/s by metres travelled)
function speedAt(d) { return 10.5 + 13 * (1 - Math.exp(-d / 2600)) + d * 0.00045; }

// kind: low = jump it, high = duck under it, block = go round it
const OBS = {
  rock:   { kind: 'low', w: 0.9, d: 0.35 },
  puddle: { kind: 'low', w: 1.3, d: 0.5 },
  dog:    { kind: 'low', w: 1.1, d: 0.35 },
  basket: { kind: 'low', w: 1.1, d: 0.35 },
  cart:   { kind: 'block', w: 1.3, d: 0.7 },
  jars:   { kind: 'block', w: 1.1, d: 0.5 },
  branch: { kind: 'high', w: 2 * RH + 1, d: 0.3 },
  line:   { kind: 'high', w: 2 * RH + 1, d: 0.25 },
  awning: { kind: 'high', w: 0, d: 0.5 },
};
const LOW_TYPES = ['rock', 'dog', 'basket', 'puddle'];
const BLOCK_TYPES = ['cart', 'jars'];

const CRASH_MSG = {
  rock: 'Bonk! A big rock.', puddle: 'Splash! A muddy puddle.', dog: 'Woof! You woke the sleepy dog.',
  basket: 'Oops! A basket of bread.', cart: 'Bonk! A fruit cart.', jars: 'Clonk! Big water jars.',
  branch: 'Ouch! A low olive branch.', line: 'Oops! Tangled in the washing.', awning: 'Flump! A market awning.',
  wall: 'Oops! You missed the turn.',
};

// Scenic places along the road; they cycle as the ride goes on
const ZONES = [
  { name: 'Bethphage', verse: 'hosannaHighest', city: 0.42 },
  { name: 'The Mount of Olives', verse: 'kingCometh', city: 0.55 },
  { name: 'The Kidron Valley', verse: 'hosannaSonOfDavid', city: 0.8 },
  { name: 'The Golden Gate', verse: 'cityMoved', city: 1.15 },
];
const ZONE_LEN = 500;

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  hosannaSonOfDavid: { ref: 'Matthew 21:9', KJV: 'Hosanna to the Son of David: Blessed is he that cometh in the name of the Lord; Hosanna in the highest.', NKJV: 'Hosanna to the Son of David! ‘Blessed is He who comes in the name of the Lord!’ Hosanna in the highest!', NIV: 'Hosanna to the Son of David! Blessed is he who comes in the name of the Lord! Hosanna in the highest heaven!', NLT: 'Praise God for the Son of David! Blessings on the one who comes in the name of the Lord! Praise God in highest heaven!' },
  cityMoved: { ref: 'Matthew 21:10\u201311', KJV: 'And when he was come into Jerusalem, all the city was moved, saying, Who is this? And the multitude said, This is Jesus the prophet of Nazareth of Galilee.', NKJV: 'And when He had come into Jerusalem, all the city was moved, saying, “Who is this?” So the multitudes said, “This is Jesus, the prophet from Nazareth of Galilee.”', NIV: 'When Jesus entered Jerusalem, the whole city was stirred and asked, “Who is this?” The crowds answered, “This is Jesus, the prophet from Nazareth in Galilee.”', NLT: 'The entire city of Jerusalem was in an uproar as he entered. “Who is this?” they asked. And the crowds replied, “It’s Jesus, the prophet from Nazareth in Galilee.”' },
  kingCometh: { ref: 'Matthew 21:5', KJV: 'Behold, thy King cometh unto thee, meek, and sitting upon an ass, and a colt the foal of an ass.', NKJV: '‘Behold, your King is coming to you, Lowly, and sitting on a donkey, A colt, the foal of a donkey.’', NIV: '‘See, your king comes to you, gentle and riding on a donkey, and on a colt, the foal of a donkey.’', NLT: '‘Look, your King is coming to you. He is humble, riding on a donkey—riding on a donkey’s colt.’' },
  // short crowd shouts (speech bubbles and messages)
  hosanna: { ref: 'Matthew 21:9', KJV: 'Hosanna', NKJV: 'Hosanna', NIV: 'Hosanna', NLT: 'Praise God' },
  blessedIsHe: { ref: 'Matthew 21:9', KJV: 'Blessed is he', NKJV: '‘Blessed is He', NIV: 'Blessed is he', NLT: 'Blessings on the one' },
  hosannaSon: { ref: 'Matthew 21:9', KJV: 'Hosanna to the Son of David', NKJV: 'Hosanna to the Son of David', NIV: 'Hosanna to the Son of David', NLT: 'Praise God for the Son of David' },
  hosannaHighest: { ref: 'Matthew 21:9', KJV: 'Hosanna in the highest', NKJV: 'Hosanna in the highest', NIV: 'Hosanna in the highest heaven', NLT: 'Praise God in highest heaven' },
  whoIsThis: { ref: 'Matthew 21:10', KJV: 'Who is this?', NKJV: 'Who is this?', NIV: 'Who is this?', NLT: 'Who is this?' },
  thisIsJesus: { ref: 'Matthew 21:11', KJV: 'This is Jesus the prophet of Nazareth of Galilee.', NKJV: 'This is Jesus, the prophet from Nazareth of Galilee.', NIV: 'This is Jesus, the prophet from Nazareth in Galilee.', NLT: 'It’s Jesus, the prophet from Nazareth in Galilee.' },
};

// Break a bubble's text into two lines near the middle when it is long
function wrap2(text, max = 16) {
  if (text.length <= max) return text;
  const mid = text.length / 2;
  let best = -1;
  for (let i = 0; i < text.length; i++) if (text[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
  return best < 0 ? text : text.slice(0, best) + '\n' + text.slice(best + 1);
}
// A verse fragment as a joyful shout, in the chosen Bible version
const shout = (key) => wrap2(Bible.verse(VERSES[key]).text.replace(/[‘’“”]/g, '').replace(/[.,;:!]+$/, '') + '!');
const SHOUTS = ['hosanna', 'blessedIsHe', 'hosannaSon', 'hosannaHighest', 'hosanna', 'hosanna'];
const randomShout = () => shout(pick(SHOUTS));

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | pause | fail
let best = 0;
try { best = +localStorage.getItem('palmSundayBest') || 0; } catch (e) {}

let t = 0, frameDt = 1 / 60;
let jesus = { x: 0, y: 0 };      // screen spot the crowd looks at
let cur = null, next = null, prev = null, prevAlt = -1;
let segIdN = 0;
let player = null;
let speed = 0, distRun = 0, palms = 0, runT = 0;
let pendingTurn = 0, turnsDone = 0, turnFlash = 0;
let invulnT = 0, shieldOn = false, magnetT = 0;
let crashT = 0, crashCause = '', lastRun = null, newBest = false;
let particles = [], bubbles = [], popups = [], ripples = [];
let message = { text: '', t: 0 };
let banner = null;                   // milestone verse banner
let hint = null, hintsShown = {};    // first-time "how to" hints in a run
let shockT = 0, cheerT = 0, flashT = 0, shakeT = 0, shoutT = 2;
let zoneNow = 0, runs = 0;
const crowdCache = new Map();

function newPlayer() {
  return {
    along: 0, x: 0, lane: 1, y: 0, vy: 0, air: false,
    duckT: 0, duckF: 0, jumpBuf: 0, gait: 0,
    flick: 0, earT: 2, wave: 0, joy: 0, stars: 0,
  };
}

// ============================================================
//  The road: straight stretches joined by corners, made just ahead of the rider
// ============================================================
function makeSeg(start, idx, title, prevZone) {
  const seg = {
    id: ++segIdN, idx, start, dir: 0, ox: 0, oz: 0,
    len: title ? 6000 : idx === 0 ? 240 : Math.round(Math.max(85, rand(115, 200) - start * 0.004)),
    junc: 'L', obs: [], items: [], signs: [],
    zone: Math.floor(start / ZONE_LEN) % ZONES.length,
    // seconds of warning in which a swipe turns the corner: very forgiving at first
    winT: idx === 0 ? 2.4 : idx === 1 ? 2.1 : idx === 2 ? 1.8 : Math.max(0.95, 1.6 - start / 9000),
  };
  seg.junc = idx < 3 ? (Math.random() < 0.5 ? 'L' : 'R') : pick(['L', 'R', 'T', 'L', 'R']);
  if (title) seg.junc = 'L';
  else fillSeg(seg);
  if (!title && seg.zone !== prevZone) seg.signs.push({ kind: 'place', along: 14 });
  return seg;
}
function placeSeg(seg, ox, oz, dir) { seg.ox = ox; seg.oz = oz; seg.dir = dir; }
function juncCentre(seg) { toWorld(seg.ox, seg.oz, seg.dir, seg.len, 0); }

// Obstacles, palms and gifts along a stretch. Every pattern leaves a way through.
function fillSeg(seg) {
  const obs = seg.obs, items = seg.items;
  const O = (type, a, lane, extra) => {
    const o = { type, along: a, lat: lane < 0 ? 0 : LANE_X[lane], w: OBS[type].w, hit: false, phase: rand(0, TAU) };
    if (extra) Object.assign(o, extra);
    obs.push(o); return o;
  };
  const palmRow = (a0, lane, n, h = 0.8, gap = 2.4) => {
    for (let i = 0; i < n; i++) items.push({ type: 'palm', along: a0 + i * gap, lat: LANE_X[lane], h, got: false, mag: false, phase: rand(0, TAU) });
  };
  // palms in an arc that a jump over the obstacle at a will catch
  const palmArc = (a, lane, v) => {
    const half = v * 0.36;
    for (let i = -2; i <= 2; i++) {
      const f = i / 2.6;
      items.push({ type: 'palm', along: a + i * half / 2, lat: LANE_X[lane], h: 1.0 + 1.3 * (1 - f * f), got: false, mag: false, phase: rand(0, TAU) });
    }
  };
  const gift = (type, a, lane) => items.push({ type, along: a, lat: LANE_X[lane], h: type === 'child' ? 0 : 0.9, got: false, mag: false, phase: rand(0, TAU) });
  const others = (l) => [0, 1, 2].filter((k) => k !== l);
  const anyLane = () => Math.floor(Math.random() * 3);

  const endV = speedAt(seg.start + seg.len);
  const end = seg.len - (seg.winT * endV + 6);       // nothing in the way near the corner
  let a = seg.idx === 0 ? 58 : 20;

  if (seg.idx === 0) {
    // the first stretch teaches one thing at a time
    const v = speedAt(0);
    palmRow(26, 1, 6);
    for (const l of [0, 1, 2]) O(l === 1 ? 'basket' : 'rock', a, l);
    palmArc(a, 1, v);
    a += v * 3;
    O('cart', a, 1); palmRow(a - 8, 0, 4); palmRow(a - 8, 2, 4);
    a += v * 3;
    O('branch', a, -1); palmRow(a - 5, 1, 4, 0.7);
    a += v * 3;
    const l = anyLane(); O('jars', a, l); palmRow(a - 6, pick(others(l)), 4);
    a += v * 2.6;
    if (a < end) { const k = anyLane(); O('dog', a, k); palmArc(a, k, v); }
    seg.signs.push({ kind: 'turn', along: seg.len - 46 });
    return;
  }

  let sinceCloak = rand(0, 200), sinceChild = rand(100, 400);
  while (a < end) {
    const d = seg.start + a;
    const v = speedAt(d);
    const tier = d < 400 ? 0 : d < 1100 ? 1 : d < 2200 ? 2 : 3;
    const pats = ['low1', 'block1', 'duck'];
    if (tier >= 1) pats.push('lowRow', 'block2', 'lowBlock', 'block2');
    if (tier >= 2) pats.push('awning', 'jumpDuck', 'weave', 'block2');
    if (tier >= 3) pats.push('duckBlock', 'weave', 'jumpDuck', 'lowRow');
    const pat = pick(pats);
    let ext = 0;
    if (pat === 'low1') {
      const l = anyLane(); O(pick(LOW_TYPES), a, l);
      if (Math.random() < 0.6) palmArc(a, l, v); else palmRow(a - 6, pick(others(l)), 4);
    } else if (pat === 'block1') {
      const l = anyLane(); O(pick(BLOCK_TYPES), a, l); palmRow(a - 7, pick(others(l)), 4);
    } else if (pat === 'duck') {
      O(Math.random() < 0.5 ? 'branch' : 'line', a, -1); palmRow(a - 4.8, anyLane(), 5, 0.7);
    } else if (pat === 'lowRow') {
      for (const l of [0, 1, 2]) O(pick(LOW_TYPES), a, l);
      palmArc(a, anyLane(), v);
    } else if (pat === 'block2') {
      const f = anyLane();
      for (const l of others(f)) O(pick(BLOCK_TYPES), a, l);
      palmRow(a - 7, f, 4);
    } else if (pat === 'lowBlock') {
      const b = anyLane();
      for (const l of [0, 1, 2]) O(l === b ? pick(BLOCK_TYPES) : pick(LOW_TYPES), a, l);
      palmArc(a, pick(others(b)), v);
    } else if (pat === 'awning') {
      // a market stall's awning over two lanes: duck under it, or go round
      const l0 = Math.random() < 0.5 ? 0 : 1;
      O('awning', a, -1, { lat: (LANE_X[l0] + LANE_X[l0 + 1]) / 2, w: LW + 1.3, lanes: [l0, l0 + 1] });
      const free = l0 === 0 ? 2 : 0;
      if (tier >= 3 && Math.random() < 0.5) O(pick(BLOCK_TYPES), a, free);
      else palmRow(a - 6, free, 4);
    } else if (pat === 'jumpDuck') {
      for (const l of [0, 1, 2]) O(pick(LOW_TYPES), a, l);
      ext = v * 1.05;
      O(Math.random() < 0.5 ? 'branch' : 'line', a + ext, -1);
      palmRow(a + ext - 3, anyLane(), 3, 0.7);
    } else if (pat === 'weave') {
      const f1 = anyLane(), f2 = f1 === 1 ? pick([0, 2]) : 1;
      for (const l of others(f1)) O(pick(BLOCK_TYPES), a, l);
      ext = v * 0.95;
      for (const l of others(f2)) O(pick(BLOCK_TYPES), a + ext, l);
      palmRow(a - 4, f1, 3); palmRow(a + ext - 4, f2, 3);
    } else if (pat === 'duckBlock') {
      const f = anyLane();
      for (const l of others(f)) O(pick(BLOCK_TYPES), a, l);
      ext = v * 0.95;
      O(Math.random() < 0.5 ? 'branch' : 'line', a + ext, -1);
      palmRow(a - 5, f, 3);
    }
    const gapT = Math.max(0.9, 2.3 - d / 2300) * rand(1, 1.25);
    const gap = gapT * v;
    // the space before the next pattern: more palms, and now and then a gift
    const g0 = a + ext + 5, g1 = a + ext + gap - 6;
    if (g1 - g0 > 8) {
      sinceCloak += gap; sinceChild += gap;
      const l = anyLane(), mid = (g0 + g1) / 2;
      if (sinceChild > 700 && d > 250) { gift('child', mid, l); sinceChild = 0; }
      else if (sinceCloak > 420) { gift('cloak', mid, l); sinceCloak = 0; }
      else if (Math.random() < 0.75) palmRow(g0 + 1, l, Math.min(6, Math.floor((g1 - g0) / 2.4)));
    }
    a += ext + gap;
  }
  // a last row of palms leading into the corner
  palmRow(Math.max(a - 10, seg.len - seg.winT * endV - 4), 1, 3);
  seg.signs.push({ kind: 'turn', along: seg.len - 46 });
}

// Where a crowd member (or a tree) stands: a stable random from their slot
function hrand(k, salt) { const x = Math.sin(k * 127.1 + salt * 311.7) * 43758.5453; return x - Math.floor(x); }

// ============================================================
//  Cartoon art shared with the rest of the collection
// ============================================================
// A palm branch: stem along -y from the origin
function drawPalm(x, y, len, ang, sway = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.lineCap = 'round';
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const f = 0.28 + (i / 8) * 0.72;
    pts.push([sway * f * f, -len * f, len * 0.34 * (1.05 - f * 0.75)]);
  }
  for (const [col, lw] of [['#3d7a2a', Math.max(2.4, len * 0.075)], ['#5cbf45', Math.max(1.4, len * 0.045)]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (const [px, py, ll] of pts) {
      ctx.moveTo(px, py); ctx.quadraticCurveTo(px - ll * 0.5, py - ll * 0.1, px - ll * 0.9, py + ll * 0.45);
      ctx.moveTo(px, py); ctx.quadraticCurveTo(px + ll * 0.5, py - ll * 0.1, px + ll * 0.9, py + ll * 0.45);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = '#6b8f2a'; ctx.lineWidth = Math.max(1.5, len * 0.05);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(sway * 0.3, -len * 0.5, sway, -len); ctx.stroke();
  ctx.restore();
}

function drawPerson(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward Jesus
  let lx = 0, ly = -1;
  {
    const wx = x, wy = slot.y - 52 * s;
    const dx = jesus.x - wx, dy = (jesus.y - 50) - wy;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  // Arms raised for joy (waving a palm branch) / pointing in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    if (d.palm) drawPalm(24 - wave, -64, 48, 0.25 + Math.sin(t * 9 + d.phase) * 0.35, 6);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  } else if (d.palm && (mood === 'watch' || mood === 'wow')) {
    drawPalm(17, -26, 44, 0.15 + Math.sin(t * 2 + d.phase) * 0.08, 4);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || (mood === 'wow' && d.i % 3 !== 0)) {
    arm(-11, -32, -15, -12);
    if (d.palm) arm(11, -32, 17, -26); else arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function drawStar(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + (i * Math.PI) / 5;
    i === 0 ? ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function drawCloakOnRoad(x, y, c, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot * 0.15);
  // a garment spread on the road, with soft folds and tassels
  ctx.fillStyle = shade(c, -30);
  ctx.beginPath(); ctx.ellipse(2, 3, 30, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = c; ctx.strokeStyle = shade(c, -45); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-26, -8);
  ctx.quadraticCurveTo(-8, -12, 4, -8); ctx.quadraticCurveTo(18, -12, 28, -7);
  ctx.quadraticCurveTo(33, 0, 26, 8);
  ctx.quadraticCurveTo(8, 12, -6, 8); ctx.quadraticCurveTo(-20, 12, -30, 7);
  ctx.quadraticCurveTo(-34, -1, -26, -8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.85)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-18, -8); ctx.quadraticCurveTo(-20, 0, -21, 9); ctx.moveTo(19, -8); ctx.quadraticCurveTo(21, 0, 18, 9); ctx.stroke();
  ctx.strokeStyle = shade(c, -25); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-6, -8); ctx.quadraticCurveTo(-2, 0, -5, 8); ctx.moveTo(6, -8); ctx.quadraticCurveTo(10, 0, 6, 8); ctx.stroke();
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const k of [-4, 0, 4]) { ctx.moveTo(28 + k * 0.3, k); ctx.lineTo(34 + k * 0.3, k + 1); ctx.moveTo(-30 - k * 0.3, k); ctx.lineTo(-36 - k * 0.3, k + 1); }
  ctx.stroke();
  ctx.restore();
}

function drawOliveTree(x, y, s) {
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x + 2 * s, y - 55 * s); ctx.stroke();
  ctx.fillStyle = '#7d9460';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
    ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = 'rgba(200,220,160,0.35)';
  ctx.beginPath(); ctx.arc(x - 4 * s, y - 76 * s, 8 * s, 0, TAU); ctx.fill();
}

// ============================================================
//  Jesus on the little donkey, seen from behind (Matthew 21:7)
//  Units are centimetres; the origin is the ground under the hooves.
// ============================================================
const D_BODY = '#a39a90', D_DARK = '#6d625a', D_LIGHT = '#e6ddd2', D_FAR = '#8a8178';

function drawRiderSprite() {
  const p = player;
  const air = p.y * 100;
  const df = p.duckF;
  const hurt = state === 'fail';
  const moving = state === 'play' || state === 'title';

  // shadow on the road stays on the ground
  ctx.fillStyle = 'rgba(70,50,20,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 0, 50 - Math.min(air, 150) * 0.1, 13 - Math.min(air, 150) * 0.03, 0, 0, TAU); ctx.fill();

  ctx.save();
  ctx.translate(0, -air);
  // lean into a lane change, wobble when bumped
  ctx.rotate(clamp((LANE_X[p.lane] - p.x) * 0.1, -0.12, 0.12) + (hurt ? Math.sin(t * 9) * 0.05 * Math.max(0, 1 - crashT) : 0));
  const trot = p.air || !moving ? 0 : Math.sin(p.gait);
  const bob = p.air || !moving ? 0 : Math.abs(Math.cos(p.gait)) * 4;
  const low = df * 16;

  // legs: [x, phase sign, width, colour]; front legs peep between the hind legs
  const leg = (x0, ph, w, col, hip) => {
    const lift = p.air ? 16 : Math.max(0, ph * trot) * 14;
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, hip); ctx.quadraticCurveTo(x0 * 1.1, (hip - lift) / 2, x0, -lift - 7); ctx.stroke();
    ctx.fillStyle = '#4a3f38';
    roundRect(x0 - w * 0.7, -lift - 9, w * 1.4, 9, 3); ctx.fill();
  };
  leg(-10, -1, 10, D_FAR, -70 + low);
  leg(10, 1, 10, D_FAR, -70 + low);

  // the donkey's long ears, beyond the rider
  const flick = p.flick > 0 ? Math.sin(p.flick * 30) * 0.3 : 0;
  const droop = hurt ? 0.9 : df * 0.6;
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * 16, -148 + low * 1.8 - bob);
    ctx.rotate(s * (0.62 + droop) + (s > 0 ? flick : 0));
    ctx.fillStyle = D_BODY; ctx.strokeStyle = D_DARK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -20, 8, 23, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f0b8b0';
    ctx.beginPath(); ctx.ellipse(0, -19, 4, 16, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = D_DARK;
    ctx.beginPath(); ctx.ellipse(0, -40, 5, 4, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // the back of the donkey's head between the ears
  ctx.fillStyle = D_BODY; ctx.strokeStyle = D_DARK; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -140 + low * 1.8 - bob, 20, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = D_DARK;
  ctx.beginPath(); ctx.ellipse(0, -152 + low * 1.8 - bob, 8, 5, 0, 0, TAU); ctx.fill();

  // hind legs and rump
  leg(-20, 1, 13, D_BODY, -80 + low);
  leg(20, -1, 13, D_BODY, -80 + low);
  const by = -95 + low - bob;
  ctx.fillStyle = D_BODY; ctx.strokeStyle = D_DARK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, by, 37, 31, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = D_LIGHT;
  ctx.beginPath(); ctx.ellipse(0, by + 20, 20, 9, 0, 0, TAU); ctx.fill();
  // swishy tail
  const sw = Math.sin(t * 6) * 9;
  ctx.strokeStyle = D_DARK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, by - 14); ctx.quadraticCurveTo(sw * 0.4, by + 6, sw, by + 30); ctx.stroke();
  ctx.fillStyle = D_DARK;
  ctx.beginPath(); ctx.ellipse(sw, by + 36, 6, 11, sw / 40, 0, TAU); ctx.fill();

  // the disciples' cloaks laid on the colt, hanging down both sides
  const cy = by - 26;
  ctx.fillStyle = '#b5503f'; ctx.strokeStyle = '#8a3a2c'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-36, cy); ctx.quadraticCurveTo(0, cy - 10, 36, cy);
  ctx.lineTo(42, cy + 34); ctx.quadraticCurveTo(0, cy + 26, -42, cy + 34);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3f6fb5';
  ctx.beginPath(); ctx.moveTo(-34, cy + 2); ctx.quadraticCurveTo(0, cy - 8, 34, cy + 2); ctx.lineTo(35, cy + 10); ctx.quadraticCurveTo(0, cy, -35, cy + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let fx = -38; fx <= 38; fx += 6) { const fy = cy + 31 + Math.abs(fx) * 0.08; ctx.moveTo(fx, fy); ctx.lineTo(fx, fy + 5); }
  ctx.stroke();

  // Jesus, seated on the cloaks
  ctx.translate(0, cy + 2);
  drawJesusBack(df, hurt ? 'oops' : p.joy > 0 ? 'joy' : p.wave > 0 || state === 'title' ? 'wave' : 'ride');
  ctx.restore();

  // dizzy stars after a bump
  if (hurt) {
    for (let i = 0; i < 5; i++) {
      const a = t * 4 + (i * TAU) / 5;
      drawStar(Math.cos(a) * 46, -250 - air + Math.sin(a) * 10, 9, '#ffd43b');
    }
  }
}

// Same colours as drawJesus in "Jesus Rises": white robe, red sash, brown hair, golden halo
function drawJesusBack(df, pose) {
  const th = lerp(64, 30, df);                  // torso height; He bows low to duck
  const lean = df * 6;
  // robe hanging either side, with sandalled feet
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 14, -6); ctx.quadraticCurveTo(s * 40, -4, s * 44, 8);
    ctx.lineTo(s * 46, 30); ctx.quadraticCurveTo(s * 38, 34, s * 32, 30);
    ctx.lineTo(s * 26, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.ellipse(s * 40, 34, 6, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fdfcf6';
  }
  // body
  ctx.beginPath();
  ctx.moveTo(-23, 2);
  ctx.quadraticCurveTo(-24, -th * 0.6, -17, -th + lean);
  ctx.quadraticCurveTo(0, -th - 5 + lean, 17, -th + lean);
  ctx.quadraticCurveTo(24, -th * 0.6, 23, 2);
  ctx.quadraticCurveTo(0, 7, -23, 2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-20, -th + 4); ctx.lineTo(22, -th * 0.2); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(-2, -th, 4, th);
  ctx.restore();

  // arms: reins, a wave to the crowd, or both raised for joy
  const sy = -th + 8 + lean;
  const arm = (s, hx, hy, hand) => {
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(s * 16, sy); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 8.5;
    ctx.beginPath(); ctx.moveTo(s * 16, sy); ctx.lineTo(hx, hy); ctx.stroke();
    if (hand) { ctx.fillStyle = '#e0a877'; ctx.beginPath(); ctx.arc(hx, hy, 5, 0, TAU); ctx.fill(); }
  };
  const w = Math.sin(t * 14) * 6;
  if (pose === 'joy') { arm(-1, -34 - w, sy - 42, true); arm(1, 34 + w, sy - 42, true); }
  else if (pose === 'wave') { arm(-1, -22, sy + 26, false); arm(1, 34 + w, sy - 40, true); }
  else if (pose === 'oops') { arm(-1, -32, sy + 6, true); arm(1, 32, sy + 6, true); }
  else { arm(-1, -21, sy + 27, false); arm(1, 21, sy + 27, false); }

  // head from behind: long brown hair
  const hy = -th - 13 + lean * 1.6;
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, hy, 13.5, 15, 0, 0, TAU); ctx.fill();
  roundRect(-13, hy, 26, 17, 7); ctx.fill();
  ctx.fillStyle = '#e0a877';                       // ears peeping through
  ctx.beginPath(); ctx.ellipse(-13.5, hy + 2, 2.5, 4, 0, 0, TAU); ctx.ellipse(13.5, hy + 2, 2.5, 4, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-5, hy - 10); ctx.quadraticCurveTo(-7, hy + 4, -6, hy + 15); ctx.moveTo(5, hy - 10); ctx.quadraticCurveTo(7, hy + 4, 6, hy + 15); ctx.stroke();
  // halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 4;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.ellipse(0, hy - 2, 19, 19, 0, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawJars(o) {
  // big clay water jars stacked up
  ctx.fillStyle = 'rgba(70,50,20,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 62, 12, 0, 0, TAU); ctx.fill();
  const jar = (x, y, s) => {
    ctx.fillStyle = '#c8713f'; ctx.strokeStyle = '#8a4a26'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - 10 * s, y);
    ctx.quadraticCurveTo(x - 32 * s, y - 20 * s, x - 26 * s, y - 50 * s);
    ctx.quadraticCurveTo(x - 20 * s, y - 64 * s, x - 10 * s, y - 68 * s);
    ctx.lineTo(x - 12 * s, y - 78 * s); ctx.lineTo(x + 12 * s, y - 78 * s); ctx.lineTo(x + 10 * s, y - 68 * s);
    ctx.quadraticCurveTo(x + 20 * s, y - 64 * s, x + 26 * s, y - 50 * s);
    ctx.quadraticCurveTo(x + 32 * s, y - 20 * s, x + 10 * s, y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f0c080'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 26 * s, y - 40 * s); ctx.quadraticCurveTo(x, y - 34 * s, x + 26 * s, y - 40 * s); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';

  };
  jar(-28, 0, 1); jar(28, 0, 1); jar(0, -74, 0.95);
}

// Low things across the whole road: duck under them
function drawBranch(o) {
  const sw = Math.sin(t * 2 + o.phase) * 3;
  // two old olive trunks at the roadside
  ctx.strokeStyle = '#6b4a2b'; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.lineWidth = 30;
    ctx.beginPath(); ctx.moveTo(s * 290, 0); ctx.quadraticCurveTo(s * 305, -120, s * 270, -230); ctx.stroke();
  }
  // a thick bough stretched right across the road
  ctx.lineWidth = 24;
  ctx.beginPath(); ctx.moveTo(-280, -215); ctx.quadraticCurveTo(0, -250 + sw, 280, -218); ctx.stroke();
  // a big mass of silver-green leaves hanging low: duck under it!
  for (let row = 0; row < 3; row++) {
    for (let i = 0; i < 15; i++) {
      const x = -290 + i * 41 + row * 14, y = -250 + row * 30 - Math.sin((i / 14) * Math.PI) * 14 + sw;
      ctx.fillStyle = (i + row) % 2 ? '#6f8f52' : '#5a7a40';
      ctx.beginPath(); ctx.ellipse(x, y, 34, 22, 0.3 * (i % 3 - 1), 0, TAU); ctx.fill();
      if (row === 2) {
        ctx.fillStyle = '#9dba78';
        ctx.beginPath(); ctx.ellipse(x + 6, y + 12, 13, 6, 0.4, 0, TAU); ctx.fill();
      }
    }
  }
  ctx.fillStyle = '#3f4f22';
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(-250 + i * 72, -178 + (i % 2) * 8, 7, 0, TAU); ctx.fill(); }
}

function drawLine(o) {
  const sw = Math.sin(t * 3 + o.phase) * 5;
  ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-285, 0); ctx.lineTo(-285, -265); ctx.moveTo(285, 0); ctx.lineTo(285, -265); ctx.stroke();
  ctx.strokeStyle = '#f3ead2'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-285, -255); ctx.quadraticCurveTo(0, -225, 285, -255); ctx.stroke();
  // big tunics and cloths pegged out to dry, hanging low
  const cols = ['#c0392b', '#f3e5c0', '#2f6db5', '#d9a13a', '#7a4fa0', '#3c8f86', '#f3e5c0', '#c46b8c'];
  for (let i = 0; i < 8; i++) {
    const x = -250 + i * 71, y = -253 + 28 * (1 - Math.pow(x / 285, 2)) - 3;
    const w = i % 2 ? 60 : 52, bot = -152 - (i % 3) * 10;
    ctx.fillStyle = cols[i]; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x + w / 2 + 4 + sw * 0.4, bot); ctx.lineTo(x - w / 2 - 4 + sw * 0.4, bot);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x - w / 2 + 2 + sw * 0.4, bot - 12, w - 4, 5);
  }
}

function drawAwning(o) {
  // a market stall's striped awning over two lanes: duck under it, or go round
  const half = o.w * 50 + 10;
  ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-half, 0); ctx.lineTo(-half, -262); ctx.moveTo(half, 0); ctx.lineTo(half, -262); ctx.stroke();
  const n = 8, top = -268, bot = -168;
  const main = o.lanes && o.lanes[0] === 0 ? '#2f8fbf' : '#c0392b';
  for (let i = 0; i < n; i++) {
    const x0 = -half + (i * 2 * half) / n, x1 = x0 + (2 * half) / n;
    ctx.fillStyle = i % 2 ? '#f3e5c0' : main;
    ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x1, top); ctx.lineTo(x1, bot);
    ctx.quadraticCurveTo((x0 + x1) / 2, bot + 20, x0, bot); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 3;
  ctx.strokeRect(-half, top, half * 2, bot - top);
  // pots and fruit on top of the stall roof
  ctx.fillStyle = '#c8713f';
  for (const x of [-half * 0.5, half * 0.1, half * 0.6]) { ctx.beginPath(); ctx.ellipse(x, top - 16, 18, 18, 0, 0, TAU); ctx.fill(); }
}

function drawPalmItem(it, k) {
  const spin = Math.cos(t * 3 + it.phase);
  const y = -it.h * 100 + Math.sin(t * 4 + it.phase) * 5;
  ctx.fillStyle = 'rgba(255,240,150,0.35)';
  ctx.beginPath(); ctx.arc(0, y - 22, 34, 0, TAU); ctx.fill();
  if (k < 0.1) {       // far away: a simple green leaf
    ctx.fillStyle = '#4caf3c';
    ctx.beginPath(); ctx.ellipse(0, y - 22, 9 + 9 * Math.abs(spin), 26, 0, 0, TAU); ctx.fill();
    return;
  }
  ctx.save();
  ctx.translate(0, y + 12); ctx.scale(0.35 + 0.65 * Math.abs(spin), 1);
  drawPalm(0, 0, 66, 0.15, 5);
  ctx.restore();
}

function drawCloakItem(it) {
  const y = -it.h * 100 + Math.sin(t * 3 + it.phase) * 6;
  ctx.fillStyle = 'rgba(255,220,120,0.4)';
  ctx.beginPath(); ctx.arc(0, y, 52, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(0, y); ctx.scale(1.5 * (0.4 + 0.6 * Math.abs(Math.cos(t * 2 + it.phase))), 1.5);
  drawCloakOnRoad(0, 0, '#7a4fa0', 0);
  ctx.restore();
  for (let i = 0; i < 4; i++) {
    const a = t * 2.5 + (i * TAU) / 4;
    drawStar(Math.cos(a) * 58, y + Math.sin(a) * 26, 8, '#ffe27a');
  }
}
