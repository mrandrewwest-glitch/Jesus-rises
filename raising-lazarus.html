    ctx.globalAlpha = a;
    ctx.font = `700 ${p.size}px Fredoka, sans-serif`;
    const y = p.y - p.t * 40;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(p.text, p.x, y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, y);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const y = phase === 'unwrap' ? 250 : 185;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

// Level 1: a glowing finger-dot shows how to swipe along the first strip
function drawSwipeHint() {
  if (!uw || uw.hintT <= 0 || state !== 'play') return;
  const s = nextStrip();
  if (!s) return;
  const f = (t * 0.9) % 1;
  const y = lz.y + (s.top + s.bot) / 2 * lz.s;
  const x = lz.x + (-s.dir * 34 + s.dir * 68 * ease(f)) * lz.s;
  ctx.save();
  ctx.globalAlpha = clamp(uw.hintT, 0, 1) * (1 - Math.abs(f - 0.5) * 1.2);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawBar(label, x, y, frac, colors, flash) {
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.shadowBlur = 4;
  ctx.fillText(label, x, y + 10);
  ctx.shadowBlur = 0;
  const bx = x + ctx.measureText(label).width + 8;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(bx, y, 120, 13, 6.5); ctx.fill();
  const gg = ctx.createLinearGradient(bx, 0, bx + 120, 0);
  gg.addColorStop(0, colors[0]); gg.addColorStop(1, colors[1]);
  ctx.fillStyle = flash && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (frac > 0) { roundRect(bx, y, 120 * clamp(frac, 0, 1), 13, 6.5); ctx.fill(); }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + meter for the current part
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Lazarus, Come Forth!' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title' && phase === 'stone' && st) {
    drawBar('STRENGTH', 12, 38, st.S / 100, ['#f7c948', '#fff1a8'], st.S < 20);
  } else if (state !== 'title' && (phase === 'unwrap' || phase === 'done') && uw) {
    drawBar('UNWRAPPED', 12, 38, uw.removed / uw.total, ['#9fd3f2', '#e8f7ff'], false);
  }

  // Pause / mute buttons
  for (const b of hudButtons()) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: time left and which part we're in
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  let part = '', time = null;
  if (state !== 'title') {
    if (phase === 'intro') part = 'Bethany';
    else if (phase === 'stone') { part = 'PART 1 · THE STONE'; time = st.timeLeft; }
    else if (phase === 'call') part = 'PART 2 · COME FORTH';
    else { part = 'PART 3 · UNWRAP'; time = uw ? uw.timeLeft : null; }
  }
  ctx.font = '600 12px Fredoka, sans-serif';
  if (part) ctx.fillText(part, rx, 20);
  if (time !== null) {
    ctx.font = '700 22px Fredoka, sans-serif';
    ctx.fillStyle = time < 5 && Math.sin(t * 10) > 0 ? '#c92a2a' : '#5a4210';
    ctx.fillText(`${Math.ceil(time)}s`, rx, 46);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  const L = sceneLayout();
  placePeople(L);
  drawSky();
  drawGround(L);
  drawTomb(L);
  drawStone(L);
  // helpers stand nearest the stone; draw the far one first
  for (let k = helpers.length - 1; k >= 0; k--) drawPerson(helpers[k]);
  drawJesus(L.jesusX, GY + 4, 1.25);
  for (const p of friends) drawPerson(p);
  if (lz) drawLazarus();
  drawFlyers();
  drawParticles();
  if (state === 'play' && phase === 'stone') drawRing();
  drawSwipeHint();
  drawBubble(L);
  drawPops();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  // the swipe trail
  if (uw && uw.stroke && phase === 'unwrap') {
    const k = uw.stroke;
    ctx.strokeStyle = 'rgba(255,240,180,0.8)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(k.x0, k.y0); ctx.lineTo(k.x, k.y); ctx.stroke();
  }

  drawBanner();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (state === 'play') {
    phaseT += dt;
    if (phase === 'intro') {
      if (phaseT > 3.4) setPhase('stone');
    } else if (phase === 'stone') updateStone(dt);
    else if (phase === 'call') updateCall(dt);
    else if (phase === 'unwrap') updateUnwrap(dt);
  } else if (state === 'win') {
    if (Math.random() < dt * 14) spawn(lz.x + rand(-60, 60), lz.y - rand(0, 80) * lz.s * 0.4 - 60, rand(-10, 10), -30, 1, '#fff6d0', 3);
    lz.hop = Math.abs(Math.sin(t * 7)) * 6;
  }
  if (lz) lz.spinT = Math.max(0, lz.spinT - dt);
  if (banner) banner.t -= dt;
  if (bubble) bubble.t -= dt;
  shockT = Math.max(0, shockT - dt);
  laughT = Math.max(0, laughT - dt);
  missT = Math.max(0, missT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
