<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9c48a">
<title>The Good Samaritan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e9c48a;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Good Samaritan</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'harp', ambience: 'wind', percussion: false };

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Framing scene: the lawyer's question and Jesus's story
  neighbour:  { ref: 'Luke 10:29', KJV: 'And who is my neighbour?', NKJV: 'And who is my neighbor?', NIV: 'And who is my neighbor?', NLT: 'And who is my neighbor?' },
  certainMan: { ref: 'Luke 10:30', KJV: 'A certain man went down from Jerusalem to Jericho, and fell among thieves', NKJV: 'A certain man went down from Jerusalem to Jericho, and fell among thieves', NIV: 'A man was going down from Jerusalem to Jericho, when he was attacked by robbers', NLT: 'A Jewish man was traveling from Jerusalem down to Jericho, and he was attacked by bandits' },
  priest:     { ref: 'Luke 10:31', KJV: 'And by chance there came down a certain priest that way: and when he saw him, he passed by on the other side.', NKJV: 'Now by chance a certain priest came down that road. And when he saw him, he passed by on the other side.', NIV: 'A priest happened to be going down the same road, and when he saw the man, he passed by on the other side.', NLT: 'By chance a priest came along. But when he saw the man lying there, he crossed to the other side of the road and passed him by.' },
  levite:     { ref: 'Luke 10:32', KJV: 'And likewise a Levite, when he was at the place, came and looked on him, and passed by on the other side.', NKJV: 'Likewise a Levite, when he arrived at the place, came and looked, and passed by on the other side.', NIV: 'So too, a Levite, when he came to the place and saw him, passed by on the other side.', NLT: 'A Temple assistant walked over and looked at him lying there, but he also passed by on the other side.' },
  // Title card and the Samaritan's arrival
  compassion: { ref: 'Luke 10:33', KJV: 'But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him', NKJV: 'But a certain Samaritan, as he journeyed, came where he was. And when he saw him, he had compassion.', NIV: 'But a Samaritan, as he traveled, came where the man was; and when he saw him, he took pity on him.', NLT: 'Then a despised Samaritan came along, and when he saw the man, he felt compassion for him.' },
  // Tending, the donkey and the inn
  oilWine:    { ref: 'Luke 10:34', KJV: 'And went to him, and bound up his wounds, pouring in oil and wine', NKJV: 'So he went to him and bandaged his wounds, pouring on oil and wine', NIV: 'He went to him and bandaged his wounds, pouring on oil and wine', NLT: 'Going over to him, the Samaritan soothed his wounds with olive oil and wine and bandaged them' },
  beast:      { ref: 'Luke 10:34', KJV: 'And set him on his own beast, and brought him to an inn', NKJV: 'And he set him on his own animal, brought him to an inn', NIV: 'Then he put the man on his own donkey, brought him to an inn', NLT: 'Then he put the man on his own donkey and took him to an inn' },
  bound:      { ref: 'Luke 10:34', KJV: 'And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him.', NKJV: 'So he went to him and bandaged his wounds, pouring on oil and wine; and he set him on his own animal, brought him to an inn, and took care of him.', NIV: 'He went to him and bandaged his wounds, pouring on oil and wine. Then he put the man on his own donkey, brought him to an inn and took care of him.', NLT: 'Going over to him, the Samaritan soothed his wounds with olive oil and wine and bandaged them. Then he put the man on his own donkey and took him to an inn, where he took care of him.' },
  twoPence:   { ref: 'Luke 10:35', KJV: 'He took out two pence, and gave them to the host', NKJV: 'He took out two denarii, gave them to the innkeeper', NIV: 'He took out two denarii and gave them to the innkeeper', NLT: 'He handed the innkeeper two silver coins' },
  repay:      { ref: 'Luke 10:35', KJV: 'Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee.', NKJV: 'Take care of him; and whatever more you spend, when I come again, I will repay you.', NIV: 'Look after him, he said, and when I return, I will reimburse you for any extra expense you may have.', NLT: 'Take care of this man. If his bill runs higher than this, I’ll pay you the next time I’m here.' },
  // Back in the framing scene
  whichThree: { ref: 'Luke 10:36', KJV: 'Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?', NKJV: 'So which of these three do you think was neighbor to him who fell among the thieves?', NIV: 'Which of these three do you think was a neighbor to the man who fell into the hands of robbers?', NLT: 'Now which of these three would you say was a neighbor to the man who was attacked by bandits?' },
  mercy:      { ref: 'Luke 10:37', KJV: 'He that shewed mercy on him.', NKJV: 'He who showed mercy on him.', NIV: 'The one who had mercy on him.', NLT: 'The one who showed him mercy.' },
  likewise:   { ref: 'Luke 10:37', KJV: 'Go, and do thou likewise.', NKJV: 'Go and do likewise.', NIV: 'Go and do likewise.', NLT: 'Yes, now go and do the same.' },
  // Win card
  winCard:    { ref: 'Luke 10:36–37', KJV: 'Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves? And he said, He that shewed mercy on him. Then said Jesus unto him, Go, and do thou likewise.', NKJV: 'So which of these three do you think was neighbor to him who fell among the thieves? And he said, ‘He who showed mercy on him.’ Then Jesus said to him, ‘Go and do likewise.’', NIV: 'Which of these three do you think was a neighbor to the man who fell into the hands of robbers? The expert in the law replied, ‘The one who had mercy on him.’ Jesus told him, ‘Go and do likewise.’', NLT: '‘Now which of these three would you say was a neighbor to the man who was attacked by bandits?’ Jesus asked. The man replied, ‘The one who showed him mercy.’ Then Jesus said, ‘Yes, now go and do the same.’' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const ease = (f) => f * f * (3 - 2 * f);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Blend two #rrggbb colours (used to turn day into dusk)
function mix(a, b, f) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(lerp((na >> s) & 255, (nb >> s) & 255, clamp(f, 0, 1)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning
// ============================================================
const LANE_W = 84;                    // width of one lane on the road
const ROAD_HW = LANE_W * 1.5 + 18;    // half the road's width
const DY = 250;                       // the donkey's screen height on the road
const SLIDE_PX = 40;                  // CSS px of sideways slide per lane change
const POUR_RATE = 1.25;               // healing per second of pouring on a sore
const POUR_USE = 9;                   // oil & wine used per second of pouring

const LEVEL_NAMES = [
  'Down from Jerusalem',
  'The Winding Descent',
  'The Red Ascent',
  "Robbers' Rocks",
  'Dusk in the Wilderness',
  'The Last Mile to Jericho',
];

function makeConfig(n) {
  const c = {
    name: LEVEL_NAMES[n - 1] || `Journey ${n}`,
    wounds: Math.min(3 + (n - 1), 6),
    bandTurns: n === 1 ? 1.5 : 2,
    length: 4200 + (n - 1) * 1300,
    speed: Math.min(150 + (n - 1) * 14, 230),
    gapMin: Math.max(560 - (n - 1) * 60, 300),
    gapMax: Math.max(780 - (n - 1) * 70, 420),
    double: n === 1 ? 0 : Math.min(0.25 + (n - 2) * 0.12, 0.6),
    types: n === 1 ? ['rock', 'pothole', 'goat'] : n === 2 ? ['rock', 'pothole', 'goat', 'stones', 'drop'] : ['rock', 'pothole', 'goat', 'goat', 'stones', 'drop', 'drop'],
    wander: n >= 3,
    robbers: n === 1 ? 2 : Math.min(2 + n, 7),
    slack: Math.max(1.45 - (n - 1) * 0.07, 1.15),
    dusk: Math.min((n - 1) * 0.07, 0.3),
    amp: 30 + n * 20,
    dmg: 1 + (n - 1) * 0.12,
  };
  c.day = c.length / c.speed * c.slack + 3;
  return c;
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let phase = 'frame';      // frame | pass | tend | mount | road | inn
let sub = '';             // which part of a cutscene is showing
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('samaritanBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let script = null;        // the cutscene being played: { steps, i, t, then }
let particles = [];
let message = { text: '', t: 0 };
let shakeT = 0, flashT = 0, shockT = 0, joyT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let introSeen = {};
let tend = null;          // the tending mini-game
let tendScore = null;
// the road
let donk = null, obs = [], camY = 0, comfort = 100, dayLeft = 0;
let jugs = 0, branches = 0, arriveT = 0, robberNear = false, roadPh = 0;
// the inn
let coins = [], coinsGiven = 0, coinDoneT = 0;

// ============================================================
//  People
// ============================================================
const mk = (o) => ({ mood: 'watch', switchT: 0, delay: rand(0.05, 0.5), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU), i: 0, ...o });
const TRAV   = mk({ name: 'traveller', robe: '#6f8fbf', hair: '#3a2716', skin: '#e3b184', beard: true, i: 1 });
const SAM    = mk({ name: 'Samaritan', robe: '#2f8f83', hair: '#1f140c', skin: '#c98d56', beard: true, hat: 'turban', hatC: '#e8b64c', sash: '#e0a526', i: 2 });
const PRIEST = mk({ name: 'priest', robe: '#f4f1e6', hair: '#8a8a8a', skin: '#d9a066', beard: true, hat: 'priest', sash: '#3f6fb5', i: 3 });
const LEVITE = mk({ name: 'Levite', robe: '#8b5e3c', hair: '#4a2f1a', skin: '#d7a070', beard: true, hat: 'cap', hatC: '#e0c28a', i: 4 });
const LAWYER = mk({ name: 'lawyer', robe: '#34507a', hair: '#2e1d10', skin: '#d39a66', beard: true, scarf: '#e8dcc0', i: 5, delay: 0 });
const KEEPER = mk({ name: 'innkeeper', robe: '#b5503f', hair: '#4a2f1a', skin: '#c58a55', beard: true, apron: '#f1e6cc', i: 6 });
const CROWD = [
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56', fx: 0.07, row: 0 },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', fx: 0.19, row: 0 },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', fx: 0.42, row: 0, scarf: '#e8dcc0' },
  { robe: '#3c8f86', hair: '#1f140c', beard: false, skin: '#b87a48', fx: 0.53, row: 0 },
  { robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678', fx: 0.81, row: 0, scarf: '#f3d9e4' },
  { robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66', fx: 0.93, row: 0 },
  { robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066', fx: 0.1,  row: 1 },
  { robe: '#b08a2e', hair: '#1c120b', beard: false, skin: '#c78f5c', fx: 0.47, row: 1, scarf: '#d8c7a0' },
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070', fx: 0.9,  row: 1 },
].map((d, i) => mk({ ...d, i: i + 10 }));
const EVERYONE = [TRAV, SAM, PRIEST, LEVITE, LAWYER, KEEPER, ...CROWD];
const JESUS = { face: 'calm', blink: 0 };

// What the listening crowd feels right now
function frameMood() {
  if (state === 'win') return 'joy';
  const k = script && script.steps[script.i].say ? script.steps[script.i].say.key : '';
  if (k === 'certainMan') return 'worried';
  if (k === 'mercy') return 'wow';
  if (k === 'likewise') return 'joy';
  return 'watch';
}
function lawyerMood() {
  if (state === 'win') return 'joy';
  const k = script && script.steps[script.i].say ? script.steps[script.i].say.key : '';
  return { neighbour: 'doubt', certainMan: 'worried', whichThree: 'worried', mercy: 'wow', likewise: 'joy' }[k] || 'watch';
}

function updatePeople(dt) {
  const target = frameMood();
  for (const d of CROWD) {
    let want = target;
    if (d.i === 13 && want === 'watch') want = 'wow';          // one wide-eyed listener
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
  }
  LAWYER.mood = lawyerMood();
  for (const d of EVERYONE) {
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy' && mood !== 'dazed' && mood !== 'sleep';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  const sweat = (sx) => {
    ctx.fillStyle = '#7cc4f2';
    ctx.beginPath();
    ctx.moveTo(sx, hy - 8); ctx.quadraticCurveTo(sx + 4, hy - 1, sx, hy); ctx.quadraticCurveTo(sx - 4, hy - 1, sx, hy - 8);
    ctx.fill();
  };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      sweat(14);
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
    case 'awkward':         // looking anywhere but at the poor man
      eyes(3.5, 4, 1.9);
      brows(-8, -10, -10, -7);
      mouthLine(() => { ctx.moveTo(-5, mouthY - 1); ctx.lineTo(-2, mouthY); ctx.lineTo(1, mouthY - 1.5); ctx.lineTo(4, mouthY - 0.5); });
      sweat(-14);
      break;
    case 'dazed':           // swirly eyes after the robbers' visit
      ctx.strokeStyle = dark; ctx.lineWidth = 1.4;
      for (const sx of [-ex, ex]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(sx, ey, 4.2, 0, TAU); ctx.fill();
        ctx.beginPath();
        for (let a = 0; a < 4 * Math.PI; a += 0.35) {
          const r = a * 0.3, ang = a + t * 5 * (sx < 0 ? 1 : -1);
          const px = sx + Math.cos(ang) * r, py = ey + Math.sin(ang) * r;
          if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      mouthLine(() => { ctx.moveTo(-5, mouthY); ctx.quadraticCurveTo(-2.5, mouthY - 2.5, 0, mouthY); ctx.quadraticCurveTo(2.5, mouthY + 2.5, 5, mouthY); });
      break;
    case 'sleep':
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3 * Math.cos(0.15 * Math.PI), ey - 1 + 3 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      mouthLine(() => ctx.arc(0, mouthY - 3, 3, 0.25 * Math.PI, 0.75 * Math.PI));
      break;
  }
}

// A standing (or kneeling) person, drawn like the disciples in "Jesus Rises".
// o: mood, lx/ly (look direction), pose, dir (which way they face), walking/walk, dim, still
function drawPerson(d, x, y, s, o = {}) {
  const mood = o.mood || d.mood;
  const dir = o.dir || 1;
  let jump = 0;
  if (mood === 'joy' && !o.still) jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  const walk = o.walk || 0;
  const bob = o.walking ? Math.abs(Math.sin(walk)) * 2.5 : 0;
  ctx.save();
  ctx.translate(x, y - (jump + bob) * s);
  ctx.scale(s, s);
  if (o.dim) ctx.filter = 'brightness(0.92)';
  let pose = o.pose;
  if (!pose) {
    pose = { joy: 'up', worried: 'clasp', shock: 'face', doubt: 'fold', dismay: d.i % 2 === 0 ? 'palm' : 'rest' }[mood] || 'rest';
  }
  const kneel = pose === 'kneel' || pose === 'kneelReach';
  const yb = kneel ? -12 : 0;
  if (kneel) ctx.translate(0, 12);
  const lx = o.lx ?? 0, ly = o.ly ?? 0.3;

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Sandals
  ctx.fillStyle = '#6b4a2b';
  if (o.walking) {
    const k = Math.sin(walk) * 5;
    ctx.beginPath(); ctx.ellipse(-7 + k, 1, 6, 3, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - k, 1, 6, 3, 0, 0, TAU); ctx.fill();
  } else if (!kneel) {
    ctx.beginPath(); ctx.ellipse(-7, 1, 6, 3, 0, 0, TAU); ctx.ellipse(7, 1, 6, 3, 0, 0, TAU); ctx.fill();
  }

  // Arms raised for joy come behind the robe
  if (pose === 'up') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(kneel ? -22 : -18, yb);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, kneel ? 22 : 18, yb);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (d.apron) {
    ctx.fillStyle = d.apron;
    roundRect(-11, -24, 22, 22 + yb, 4); ctx.fill();
  }
  if (d.sash) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-18, yb); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37); ctx.quadraticCurveTo(17, -30, 18, yb); ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = d.sash; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-16, -18); ctx.quadraticCurveTo(0, -15, 16, -18); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }

  // Arms in front of the robe
  switch (pose) {
    case 'rest': case 'kneel': arm(-11, -32, -15, -12); arm(11, -32, 15, -12); break;
    case 'fold': arm(-11, -32, 4, -26); arm(11, -32, -4, -24); break;
    case 'clasp': arm(-11, -32, -2, -28); arm(11, -32, 2, -28); break;
    case 'point': arm(-11, -32, -15, -12); arm(11 * dir, -32, dir * 26, -44); break;
    case 'reach': case 'kneelReach':
      arm(-11 * dir, -32, dir * 14, -16); arm(11 * dir, -32, dir * 26, -20); break;
    case 'lift': arm(-11 * dir, -32, dir * 22, -40); arm(11 * dir, -32, dir * 30, -36); break;
    case 'hold': arm(-11 * dir, -32, -15 * dir, -12); arm(11 * dir, -32, dir * 28, -28); break;
    case 'scroll': {
      arm(-11, -32, -8, -22); arm(11, -32, 8, -22);
      ctx.fillStyle = '#f3e6c4'; ctx.strokeStyle = '#b89a5e'; ctx.lineWidth = 1.2;
      roundRect(-10, -29, 20, 12, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d9c28e';
      ctx.beginPath(); ctx.ellipse(-11, -23, 3, 7, 0, 0, TAU); ctx.ellipse(11, -23, 3, 7, 0, 0, TAU); ctx.fill();
      break;
    }
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  // Hats
  if (d.hat === 'priest') {
    ctx.fillStyle = '#fbf8ee'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
    roundRect(-15, hy - 36, 30, 26, [12, 12, 3, 3]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3f6fb5'; ctx.fillRect(-15, hy - 17, 30, 5);
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(0, hy - 24, 3, 0, TAU); ctx.fill();
  } else if (d.hat === 'cap') {
    ctx.fillStyle = d.hatC;
    ctx.beginPath(); ctx.arc(0, hy - 9, 13, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = shade(d.hatC, -50); ctx.lineWidth = 1.5; ctx.stroke();
  } else if (d.hat === 'turban') {
    ctx.fillStyle = d.hatC;
    ctx.beginPath(); ctx.ellipse(0, hy - 12, 18.5, 11, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(0, hy - 10, 17, 6, 0, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, hy - 15, 15, 5, 0, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = d.hatC;
    ctx.beginPath(); ctx.moveTo(-15, hy - 8); ctx.quadraticCurveTo(-22, hy + 4, -19, hy + 14); ctx.lineTo(-14, hy + 10); ctx.closePath(); ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (pose === 'face') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (pose === 'palm') {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  }
  ctx.restore();
}

// The wounds on the traveller, in his own drawing coordinates
const WOUND_SPOTS = [
  { lx: -7, ly: -58, kind: 'bump' },
  { lx: 13, ly: -18, kind: 'scrape' },
  { lx: -11, ly: -5, kind: 'scrape' },
  { lx: 7, ly: -60, kind: 'bump' },
  { lx: -13, ly: -18, kind: 'scrape' },
  { lx: 12, ly: -47, kind: 'scrape' },
];
const newWounds = (n) => WOUND_SPOTS.slice(0, n).map((w) => ({ ...w, heal: 0, glow: 0 }));

// The traveller, sitting down, with bumps, scrapes and a torn cloak.
// o: wounds, band (0..1 of the bandage wrapped), lx/ly, wave
function drawTraveller(x, y, s, mood, o = {}) {
  const d = TRAV;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const robe = d.robe, under = '#efe4c8';
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = shade(robe, -25); ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // Feet and knees
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.ellipse(-12, 2, 5.5, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, 2, 5.5, 3.2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = shade(robe, -12); ctx.strokeStyle = shade(robe, -45); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -5, 23, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // Body
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-17, -5); ctx.quadraticCurveTo(-16, -24, -11, -31);
  ctx.quadraticCurveTo(0, -35, 11, -31); ctx.quadraticCurveTo(16, -24, 17, -5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // The torn cloak
  ctx.fillStyle = under;
  ctx.beginPath(); ctx.moveTo(-21, -3); ctx.lineTo(-16, -10); ctx.lineTo(-12, -4); ctx.lineTo(-8, -11); ctx.lineTo(-4, -2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, -29); ctx.lineTo(12, -25); ctx.lineTo(8, -22); ctx.lineTo(12, -18); ctx.lineTo(5, -19); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -16); ctx.quadraticCurveTo(0, -13, 16, -16); ctx.stroke();
  // Arms
  if (mood === 'shock') { arm(-10, -28, -17, -44); arm(10, -28, 17, -44); }
  else if (o.wave) { arm(-10, -28, -14, -8); arm(10, -28, 22, -44 + Math.sin(t * 8) * 3); }
  else { arm(-10, -28, -14, -8); arm(10, -28, 14, -8); }
  // Head
  const hy = -46;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 15, 0, TAU); ctx.fill();
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 15.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 10, 0, hy - 9);
  ctx.quadraticCurveTo(-8, hy - 11, -15, hy + 1);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-14, hy + 2);
  ctx.quadraticCurveTo(-13, hy + 17, 0, hy + 18);
  ctx.quadraticCurveTo(13, hy + 17, 14, hy + 2);
  ctx.quadraticCurveTo(8, hy + 7, 0, hy + 7);
  ctx.quadraticCurveTo(-8, hy + 7, -14, hy + 2);
  ctx.fill();
  drawFace(d, mood, hy, o.lx || 0, o.ly ?? 0.2);

  // Bumps and scrapes: they glow gold as the oil and wine go on, then fade away
  for (const w of o.wounds || []) {
    const a = 1 - w.heal;
    if (w.glow > 0) {
      const g = ctx.createRadialGradient(w.lx, w.ly, 1, w.lx, w.ly, 6 + (1 - w.glow) * 10);
      g.addColorStop(0, `rgba(255,230,120,${w.glow * 0.9})`);
      g.addColorStop(1, 'rgba(255,230,120,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(w.lx, w.ly, 6 + (1 - w.glow) * 10, 0, TAU); ctx.fill();
    }
    if (a <= 0.02) continue;
    if (w.heal > 0) {
      ctx.fillStyle = `rgba(255,220,110,${0.5 * w.heal})`;
      ctx.beginPath(); ctx.arc(w.lx, w.ly, 7, 0, TAU); ctx.fill();
    }
    if (w.kind === 'bump') {
      ctx.fillStyle = `rgba(232,106,106,${a})`;
      ctx.beginPath(); ctx.arc(w.lx, w.ly, 4.5, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.7 * a})`;
      ctx.beginPath(); ctx.arc(w.lx - 1.4, w.ly - 1.6, 1.3, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = `rgba(240,140,140,${0.85 * a})`;
      ctx.beginPath(); ctx.ellipse(w.lx, w.ly, 4.5, 3, -0.4, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(215,95,95,${0.8 * a})`; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(w.lx - 2.5, w.ly - 0.5); ctx.lineTo(w.lx + 2, w.ly - 1.8); ctx.moveTo(w.lx - 2, w.ly + 1.5); ctx.lineTo(w.lx + 2.5, w.ly + 0.2); ctx.stroke();
    }
  }

  // The bandage, wrapped round his head
  const b = o.band || 0;
  if (b > 0) {
    const band = (cy, rx, ry, rot, f) => {
      if (f <= 0) return;
      for (const [c, lw] of [['#d8d0bc', 7], ['#fffdf5', 5]]) {
        ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.ellipse(0, cy, rx, ry, rot, Math.PI, Math.PI - Math.PI * f, true); ctx.stroke();
      }
    };
    band(hy - 11, 15, 3.2, 0, clamp(b * 2, 0, 1));
    band(hy - 15, 12.5, 3, -0.15, clamp(b * 2 - 1, 0, 1));
    if (b >= 1) {   // a neat knot
      ctx.fillStyle = '#fffdf5'; ctx.strokeStyle = '#d8d0bc'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(15, hy - 13, 3.5, 2.5, 0.5, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15, hy - 12); ctx.lineTo(20, hy - 4); ctx.lineTo(17, hy - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // Little stars circling a dazed head
  if (mood === 'dazed') {
    for (let k = 0; k < 3; k++) {
      const a = t * 3 + k * TAU / 3;
      drawStar(Math.cos(a) * 17, hy - 22 + Math.sin(a) * 4, 3.2, '#ffd43b');
    }
  }
  ctx.restore();
}

function drawStar(x, y, r, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function drawHeart(x, y, r, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
}

// The traveller asleep in his bed at the inn
function drawRestingMan(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#fffdf5';
  ctx.beginPath(); ctx.ellipse(-26, -4, 16, 8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = TRAV.skin;
  ctx.beginPath(); ctx.arc(-24, -10, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = TRAV.hair;
  ctx.beginPath(); ctx.arc(-24, -12, 11.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.strokeStyle = '#fffdf5'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(-24, -16, 11, 3, 0, Math.PI, 0, true); ctx.stroke();
  ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(-28, -10, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.moveTo(-17.8, -9); ctx.arc(-20, -10, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = '#c46b8c';
  roundRect(-14, -14, 50, 18, 8); ctx.fill();
  ctx.strokeStyle = '#a0506e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-6, 2); ctx.moveTo(10, -13); ctx.lineTo(10, 3); ctx.stroke();
  ctx.fillStyle = '#6a5a8a';
  ctx.font = '700 12px Fredoka, sans-serif';
  ctx.textAlign = 'left';
  const zz = (t * 0.8) % 1;
  ctx.globalAlpha = 1 - zz;
  ctx.fillText('z', -14 + zz * 8, -24 - zz * 16);
  ctx.globalAlpha = 1 - ((zz + 0.5) % 1);
  ctx.fillText('z', -14 + ((zz + 0.5) % 1) * 8, -24 - ((zz + 0.5) % 1) * 16);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ============================================================
//  Jesus (drawn like "Jesus Rises", standing on the ground)
// ============================================================
function drawJesus(x, y, s, face, gesture) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  if (face === 'joy') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Sandals
  ctx.fillStyle = '#6b4a2b';
  ctx.beginPath(); ctx.ellipse(-6, 1, 5, 2.5, 0, 0, TAU); ctx.ellipse(6, 1, 5, 2.5, 0, 0, TAU); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: open and welcoming, one raised while He speaks, both up for joy
  const up = gesture === 'bless';
  let hands = [[-20, -22], [20, -22]];
  if (gesture === 'speak') hands = [[-20, -22], [24, -40 + Math.sin(t * 3) * 2]];
  if (up) hands = [[-21, -66], [21, -66]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4 + 0.8, -53, 1.5, 0, TAU); ctx.arc(4 + 0.8, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (face === 'talk') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, Math.sin(t * 13) > 0 ? 2 : 1, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  Donkey, robbers, goats and things on the road
// ============================================================
const DONKEY = '#a39a95', DONKEY_DARK = '#7d7470', DONKEY_LIGHT = '#d9d2cc';

// Side view. dir 1 faces right. rider(x, y) draws whoever sits in the saddle.
function drawSideDonkey(x, y, s, dir, walkPh, walking, rider) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * dir, s);
  ctx.fillStyle = 'rgba(60,40,10,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 2, 46, 6, 0, 0, TAU); ctx.fill();
  // legs
  const legX = [-28, -18, 18, 28];
  legX.forEach((lx, k) => {
    const sw = walking ? Math.sin(walkPh + (k % 2) * Math.PI + (k > 1 ? 0.6 : 0)) * 7 : 0;
    ctx.strokeStyle = k % 2 ? DONKEY : DONKEY_DARK; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx, -32); ctx.lineTo(lx + sw, -3); ctx.stroke();
    ctx.fillStyle = '#3d3530';
    ctx.beginPath(); ctx.ellipse(lx + sw, -1, 4.5, 3, 0, 0, TAU); ctx.fill();
  });
  // tail
  ctx.strokeStyle = DONKEY_DARK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-40, -46); ctx.quadraticCurveTo(-50, -38 + Math.sin(t * 4) * 3, -48, -24); ctx.stroke();
  ctx.fillStyle = '#4a403b';
  ctx.beginPath(); ctx.ellipse(-48, -22, 3.5, 6, 0.2, 0, TAU); ctx.fill();
  // body
  ctx.fillStyle = DONKEY; ctx.strokeStyle = DONKEY_DARK; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -42, 42, 19, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = DONKEY_LIGHT;
  ctx.beginPath(); ctx.ellipse(2, -32, 30, 8, 0, 0, TAU); ctx.fill();
  // neck and head
  ctx.fillStyle = DONKEY;
  ctx.beginPath();
  ctx.moveTo(24, -54); ctx.quadraticCurveTo(34, -72, 46, -80); ctx.lineTo(56, -66); ctx.quadraticCurveTo(44, -52, 38, -36);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a403b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(26, -58); ctx.quadraticCurveTo(34, -74, 44, -82); ctx.stroke();
  // ears
  for (const [ex, rot] of [[44, -0.35], [50, -0.1]]) {
    ctx.fillStyle = DONKEY;
    ctx.beginPath(); ctx.ellipse(ex, -92, 4.5, 13, rot, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e9b8b0';
    ctx.beginPath(); ctx.ellipse(ex, -91, 2, 9, rot, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = DONKEY;
  ctx.beginPath(); ctx.ellipse(56, -72, 17, 11, 0.45, 0, TAU); ctx.fill();
  ctx.fillStyle = DONKEY_LIGHT;
  ctx.beginPath(); ctx.ellipse(66, -64, 9, 7.5, 0.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3d3530';
  ctx.beginPath(); ctx.arc(70, -63, 1.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(52, -77, 3.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12';
  ctx.beginPath(); ctx.arc(53, -77, 1.8, 0, TAU); ctx.fill();
  // saddle blanket
  ctx.fillStyle = '#c0392b';
  roundRect(-22, -62, 42, 17, 5); ctx.fill();
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(-22, -49, 42, 3);
  if (rider) {
    ctx.save();
    ctx.scale(dir, 1);       // never draw the rider mirrored
    rider(0, -54);
    ctx.restore();
  }
  ctx.restore();
}

// Front view, walking toward us down the road
function drawFrontDonkey(x, y, s, ph, walking, rider) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(60,40,10,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 3, 32, 8, 0, 0, TAU); ctx.fill();
  const lift = (k) => walking ? Math.max(0, Math.sin(ph + k * Math.PI)) * 4 : 0;
  // back legs
  ctx.strokeStyle = DONKEY_DARK; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (const [lx, k] of [[-17, 1], [17, 0]]) {
    ctx.beginPath(); ctx.moveTo(lx, -24); ctx.lineTo(lx, -6 - lift(k)); ctx.stroke();
  }
  // body
  ctx.fillStyle = DONKEY; ctx.strokeStyle = DONKEY_DARK; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -38, 30, 24, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c0392b';
  roundRect(-27, -60, 54, 18, 6); ctx.fill();
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(-27, -46, 54, 3);
  if (rider) rider(0, -50);
  // front legs
  ctx.strokeStyle = DONKEY; ctx.lineWidth = 8;
  for (const [lx, k] of [[-10, 0], [10, 1]]) {
    ctx.beginPath(); ctx.moveTo(lx, -20); ctx.lineTo(lx, 0 - lift(k)); ctx.stroke();
    ctx.fillStyle = '#3d3530';
    ctx.beginPath(); ctx.ellipse(lx, 1 - lift(k), 5, 3, 0, 0, TAU); ctx.fill();
  }
  // ears flop outward so the rider stays visible
  for (const sx of [-1, 1]) {
    ctx.fillStyle = DONKEY;
    ctx.beginPath(); ctx.ellipse(sx * 19, -44, 5, 15, sx * 1.05, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e9b8b0';
    ctx.beginPath(); ctx.ellipse(sx * 19, -44, 2.2, 10, sx * 1.05, 0, TAU); ctx.fill();
  }
  // head
  ctx.fillStyle = '#aaa19c'; ctx.strokeStyle = DONKEY_DARK; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, -28, 14, 18, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4a403b';
  ctx.beginPath(); ctx.ellipse(0, -45, 6, 4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = DONKEY_LIGHT;
  ctx.beginPath(); ctx.ellipse(0, -16, 11, 8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3d3530';
  ctx.beginPath(); ctx.arc(-4, -15, 1.6, 0, TAU); ctx.arc(4, -15, 1.6, 0, TAU); ctx.fill();
  for (const sx of [-7, 7]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, -32, 3.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.beginPath(); ctx.arc(sx, -31, 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Comic robber silhouettes scampering away with their sacks
function drawRunningRobber(x, y, s, ph) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const c = '#3f3552';
  ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const a = Math.sin(ph) * 11;
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-a, 0); ctx.moveTo(0, -18); ctx.lineTo(a, 0); ctx.stroke();
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(0, -30, 13, 16, 0.25, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -52, 11, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -60); ctx.lineTo(-10, -68); ctx.lineTo(4, -62); ctx.fill();
  // sack over the shoulder
  ctx.fillStyle = '#5d5078';
  ctx.beginPath(); ctx.ellipse(-12, -44, 10, 12, -0.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#5d5078'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, -54); ctx.lineTo(0, -40); ctx.stroke();
  // wide comic eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(8, -53, 3, 3.6, 0, 0, TAU); ctx.ellipse(15, -53, 3, 3.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1b1426';
  ctx.beginPath(); ctx.arc(9.5, -53, 1.5, 0, TAU); ctx.arc(16.5, -53, 1.5, 0, TAU); ctx.fill();
  // speed lines
  ctx.strokeStyle = 'rgba(80,60,40,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 3; k++) { ctx.moveTo(-22 - k * 4, -40 + k * 10); ctx.lineTo(-38 - k * 4, -40 + k * 10); }
  ctx.stroke();
  ctx.restore();
}

function drawBoulder(x, y, r, c = '#b59a78') {
  ctx.fillStyle = 'rgba(60,40,10,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 1.1, r * 0.35, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = c; ctx.strokeStyle = shade(c, -45); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - r, y + r * 0.3);
  ctx.quadraticCurveTo(x - r * 1.05, y - r * 0.6, x - r * 0.3, y - r * 0.85);
  ctx.quadraticCurveTo(x + r * 0.5, y - r * 1.05, x + r * 0.95, y - r * 0.2);
  ctx.quadraticCurveTo(x + r * 1.1, y + r * 0.3, x + r * 0.6, y + r * 0.4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - r * 0.5, r * 0.35, r * 0.18, -0.4, 0, TAU); ctx.fill();
}

// A robber peeking over a boulder, eyes following the donkey. They only peek!
function drawPeekingRobber(x, y, r, peek, lookX, scared) {
  if (peek > 0.02) {
    const hy = y - r * 0.55 - peek * 20;
    ctx.fillStyle = '#3f3552';
    ctx.beginPath(); ctx.arc(x, hy, 12, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 7, hy - 8); ctx.lineTo(x - 2, hy - 20); ctx.lineTo(x + 5, hy - 9); ctx.fill();
    const er = scared ? 3.8 : 3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x - 4.5, hy - 1, er, er * 1.2, 0, 0, TAU); ctx.ellipse(x + 4.5, hy - 1, er, er * 1.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1b1426';
    ctx.beginPath(); ctx.arc(x - 4.5 + lookX * 1.5, hy, 1.6, 0, TAU); ctx.arc(x + 4.5 + lookX * 1.5, hy, 1.6, 0, TAU); ctx.fill();
  }
  drawBoulder(x, y, r, '#a88f6e');
  if (peek > 0.6) {   // fingers on the rock
    ctx.fillStyle = '#3f3552';
    for (const fx of [-9, -5, 5, 9]) { ctx.beginPath(); ctx.ellipse(x + fx, y - r * 0.82, 2.2, 3, 0, 0, TAU); ctx.fill(); }
  }
}

// A stubborn goat, seen from the front
function drawGoat(x, y, s, o) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  if (o.fade != null) ctx.globalAlpha = clamp(o.fade, 0, 1);
  ctx.fillStyle = 'rgba(60,40,10,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 3, 22, 6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a7f70'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const lx of [-11, -4, 4, 11]) { ctx.beginPath(); ctx.moveTo(lx, -10); ctx.lineTo(lx, 1); ctx.stroke(); }
  ctx.fillStyle = '#f1ebdf'; ctx.strokeStyle = '#b9ad98'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, -18, 20, 13, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // horns
  ctx.strokeStyle = '#8b7a66'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-5, -40); ctx.quadraticCurveTo(-12, -52, -18, -46); ctx.moveTo(5, -40); ctx.quadraticCurveTo(12, -52, 18, -46); ctx.stroke();
  // ears
  ctx.fillStyle = '#e6decf';
  ctx.beginPath(); ctx.ellipse(-13, -34, 7, 3, 0.4, 0, TAU); ctx.ellipse(13, -34, 7, 3, -0.4, 0, TAU); ctx.fill();
  // head
  ctx.fillStyle = '#f7f2e8'; ctx.strokeStyle = '#b9ad98';
  ctx.beginPath(); ctx.ellipse(0, -30, 9, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d8cdb8';
  ctx.beginPath(); ctx.moveTo(-3, -20); ctx.lineTo(0, -12); ctx.lineTo(3, -20); ctx.fill();   // beard
  // eyes with sideways pupils, looking stubborn
  for (const sx of [-4.5, 4.5]) {
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath(); ctx.arc(sx, -33, 2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.fillRect(sx - 2, -33.6, 4, 1.4);
  }
  ctx.strokeStyle = '#6b5a48'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-4.5, -37.5); ctx.lineTo(-1.5, -36.5); ctx.moveTo(4.5, -37.5); ctx.lineTo(1.5, -36.5); ctx.stroke();
  const chew = Math.sin(t * 8 + o.phase) * 1;
  ctx.beginPath(); ctx.moveTo(-2.5, -23 + chew); ctx.lineTo(2.5, -23 - chew); ctx.stroke();
  ctx.restore();
}

function drawPothole(x, y, s) {
  ctx.fillStyle = '#c9a56a';
  ctx.beginPath(); ctx.ellipse(x, y, 32 * s, 15 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8a6a3e';
  ctx.beginPath(); ctx.ellipse(x, y + 1, 26 * s, 11 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6e5230';
  ctx.beginPath(); ctx.ellipse(x + 2, y + 3, 17 * s, 6 * s, 0, 0, TAU); ctx.fill();
}

function drawStones(x, y, rot) {
  const pts = [[-12, 2, 8], [6, -3, 10], [16, 6, 6]];
  for (const [dx, dy, r] of pts) {
    ctx.save();
    ctx.translate(x + dx, y + dy); ctx.rotate(rot * (10 / r));
    ctx.fillStyle = 'rgba(60,40,10,0.18)'; ctx.beginPath(); ctx.ellipse(0, r * 0.6, r, r * 0.35, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a9a29a'; ctx.strokeStyle = '#6f6860'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(r, 0);
    for (let k = 1; k < 7; k++) { const a = k * TAU / 7, rr = r * (0.8 + 0.2 * Math.sin(k * 3)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#8a837b'; ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.2); ctx.lineTo(r * 0.3, r * 0.3); ctx.stroke();
    ctx.restore();
  }
}

function drawJug(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createRadialGradient(0, -14, 2, 0, -14, 30);
  g.addColorStop(0, 'rgba(160,220,255,0.45)'); g.addColorStop(1, 'rgba(160,220,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -14, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9743a'; ctx.strokeStyle = '#8a4a20'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-5, -30); ctx.quadraticCurveTo(-15, -22, -12, -8); ctx.quadraticCurveTo(-9, 0, 0, 0);
  ctx.quadraticCurveTo(9, 0, 12, -8); ctx.quadraticCurveTo(15, -22, 5, -30); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillRect(-6, -34, 12, 5); ctx.strokeRect(-6, -34, 12, 5);
  ctx.strokeStyle = '#8a4a20'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-11, -22, 5, Math.PI * 0.6, Math.PI * 1.5); ctx.moveTo(11, -27); ctx.arc(11, -22, 5, -Math.PI * 0.5, Math.PI * 0.4); ctx.stroke();
  ctx.strokeStyle = '#f0c089'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-10, -14); ctx.quadraticCurveTo(0, -11, 10, -14); ctx.stroke();
  ctx.fillStyle = '#6ec6f5';
  ctx.beginPath(); ctx.ellipse(0, -33, 4.5, 1.8, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBranch(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createRadialGradient(0, -12, 2, 0, -12, 30);
  g.addColorStop(0, 'rgba(255,240,150,0.45)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -12, 30, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-2, -12, 14, -26); ctx.stroke();
  const leaves = [[-8, -6, -0.9], [-4, -10, 0.6], [2, -14, -0.8], [6, -18, 0.7], [11, -23, -0.6], [-1, -6, 1.8]];
  for (const [lx, ly, a] of leaves) {
    ctx.fillStyle = '#7d9460';
    ctx.beginPath(); ctx.ellipse(lx + Math.cos(a) * 6, ly + Math.sin(a) * 6, 7, 2.6, a, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#4a3a5a';
  ctx.beginPath(); ctx.arc(-2, -4, 2.6, 0, TAU); ctx.arc(8, -14, 2.4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawCoin(x, y, r, spin = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(spin, 1);
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, '#fff2b0'); g.addColorStop(0.5, '#e8c04a'); g.addColorStop(1, '#b8861e');
  ctx.fillStyle = g; ctx.strokeStyle = '#8a6214'; ctx.lineWidth = Math.max(1.5, r * 0.08);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(138,98,20,0.6)'; ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.stroke();
  // a simple profile on the coin
  ctx.fillStyle = 'rgba(138,98,20,0.55)';
  ctx.beginPath(); ctx.arc(r * 0.05, -r * 0.12, r * 0.3, 0, TAU); ctx.fill();
  ctx.fillRect(-r * 0.22, r * 0.12, r * 0.5, r * 0.3);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.45, r * 0.25, r * 0.12, -0.6, 0, TAU); ctx.fill();
  ctx.restore();

// ============================================================
//  Scenery
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 6 }, () => ({
  f: Math.random(), y: rand(30, 330), w: rand(80, 160), speed: rand(4, 9),
}));

function updateScenery(dt) {
  for (const c of bgClouds) {
    c.f += (c.speed * dt) / (viewW + 300);
    if (c.f > 1) c.f -= 1;
  }
}

function drawClouds(alpha = 1) {
  for (const c of bgClouds) {
    drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, `rgba(255,255,255,${0.8 * alpha})`, `rgba(235,225,215,${0.7 * alpha})`);
  }
}

function drawOlive(x, y, s) {
  const wob = Math.sin(t * 1.6 + x) * 1.5;
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x + wob * 0.5, y - 55 * s); ctx.stroke();
  ctx.fillStyle = '#7d9460';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
    ctx.moveTo(x + (dx + wob) * s + r * s, y + dy * s); ctx.arc(x + (dx + wob) * s, y + dy * s, r * s, 0, TAU);
  }
  ctx.fill();
}

function drawPalm(x, y, s) {
  ctx.strokeStyle = '#8a6a3e'; ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 4 * s, y - 25 * s, x + 2 * s, y - 50 * s); ctx.stroke();
  ctx.strokeStyle = '#5f8f3e'; ctx.lineWidth = 3.5 * s;
  for (const a of [-2.6, -2.1, -1.5, -0.9, -0.4]) {
    ctx.beginPath(); ctx.moveTo(x + 2 * s, y - 50 * s);
    ctx.quadraticCurveTo(x + 2 * s + Math.cos(a) * 14 * s, y - 50 * s + Math.sin(a) * 14 * s - 4 * s, x + 2 * s + Math.cos(a) * 24 * s, y - 50 * s + Math.sin(a) * 10 * s + 6 * s);
    ctx.stroke();
  }
}

// A little walled city on a hill
function drawCity(x, y, s, c = '#ead8ac') {
  ctx.fillStyle = c; ctx.strokeStyle = shade(c, -50); ctx.lineWidth = 1;

function hillY(x, base, amp, f1, f2, ph) { return base + Math.sin(x / f1 + ph) * amp + Math.sin(x / f2 + ph * 2) * amp * 0.35; }
function hillPath(base, amp, f1, f2, ph, color) {

  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
}

function nightAmount() {
  if (!cfg || phase === 'frame' || phase === 'tend' || phase === 'pass' || phase === 'mount') return 0;
