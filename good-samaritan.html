// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    if (p.kind === 1) drawHeart(p.x, p.y, p.size * (0.6 + a * 0.4), p.color);
    else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function hearts(x, y, n) {
  for (let i = 0; i < n; i++) spawn(x + rand(-20, 20), y + rand(-10, 10), rand(-30, 30), rand(-90, -40), rand(1, 1.6), pick(['#ff6b8a', '#ff8fab', '#ffb3c6']), rand(5, 8), -10, 1);
}
function sparkle(x, y, n, colors = ['#ffe27a', '#fff6d0', '#ffffff']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(30, 140);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1.1), pick(colors), rand(2, 4), 40);
  }
}

// ============================================================
//  Cutscenes: a list of steps, each tap moves on
// ============================================================
function readTime(text) { return clamp(1.4 + text.split(' ').length * 0.3, 2.6, 8); }
function stepText(st) { return st.say ? verseText(st.say.key) : st.banner ? verseText(st.banner) : ''; }

function runScript(steps, then) {
  script = { steps, i: -1, t: 0, then };
  nextStep();
}
function nextStep() {
  script.i++; script.t = 0;
  if (script.i >= script.steps.length) { const th = script.then; script = null; th(); return; }
  const st = script.steps[script.i];
  phase = st.phase; sub = st.sub || '';
  st.dur = Math.max(st.auto ?? readTime(stepText(st)), st.min || 0);
  if (st.start) st.start();
}
function curStep() { return script ? script.steps[script.i] : null; }
function stepU() { const st = curStep(); return st ? clamp(script.t / st.dur, 0, 1) : 1; }
function updateScript(dt) {
  if (!script) return;
  script.t += dt;
  const st = curStep();
  if (st.until ? st.until() : script.t >= st.dur) nextStep();
}
function tapScript(p) {
  const st = curStep();
  if (st.tap) { st.tap(p); return; }
  if (!st.until && script.t > 0.3) nextStep();
}

function introSteps() {
  const steps = [];
  steps.push({ phase: 'frame', say: { who: 'lawyer', key: 'neighbour' } });
  if (level === 1) steps.push({ phase: 'frame', say: { who: 'jesus', key: 'certainMan' } });
  steps.push({ phase: 'pass', sub: 'robbers', auto: 2.4, start: () => sfx.scurry() });
  steps.push({ phase: 'pass', sub: 'priest', banner: 'priest', min: 5.5 });
  steps.push({ phase: 'pass', sub: 'levite', banner: 'levite', min: 5.5 });
  steps.push({ phase: 'pass', sub: 'samaritan', banner: 'compassion', min: 4.5 });
  return steps;
}

// ============================================================
//  Part 1: tend his wounds
// ============================================================
function tendGeo() {
  const S = 3.5;
  const mx = W / 2 + 14, my = H - 175;
  return { S, mx, my, cx: mx, cy: my - 55 * S, rx: 27 * S, ry: 11 * S };
}
function woundPos(w) { const g = tendGeo(); return { x: g.mx + w.lx * g.S, y: g.my + w.ly * g.S }; }

function startTend() {
  phase = 'tend'; sub = '';
  script = null;
  tend = {
    stage: 'pour', wounds: newWounds(cfg.wounds), sel: 0, supply: 100, time: 0,
    band: 0, need: TAU * cfg.bandTurns, rollA: -Math.PI / 2, lastA: null,
    ptr: { down: false, x: 0, y: 0, id: null }, doneT: 0, pourSnd: 0, hintT: 0,
  };
  TRAV.mood = 'dazed';
  SAM.mood = 'worried';
}

function woundAt(x, y) {
  const g = tendGeo();
  let bestW = null, bd = Math.max(40, 13 * g.S);
  for (const w of tend.wounds) {
    if (w.heal >= 1) continue;
    const p = woundPos(w);
    const dd = Math.hypot(p.x - x, p.y - y);
    if (dd < bd) { bd = dd; bestW = w; }
  }
  return bestW;
}

function healWound(w, amt) {
  if (!w || w.heal >= 1) return;
  w.heal = Math.min(1, w.heal + amt);
  if (w.heal >= 1) {
    w.glow = 1;
    const p = woundPos(w);
    sparkle(p.x, p.y, 16);
    const done = tend.wounds.filter((q) => q.heal >= 1).length;
    sfx.healNote(done / tend.wounds.length);
    const next = tend.wounds.findIndex((q) => q.heal < 1);
    if (next >= 0) tend.sel = next;
  }
}

function ringAngle(x, y) { const g = tendGeo(); return Math.atan2((y - g.cy) / (g.ry / g.rx), x - g.cx); }
function onRing(x, y) {
  const g = tendGeo();
  const nr = Math.hypot((x - g.cx) / g.rx, (y - g.cy) / g.ry);
  return nr > 0.35 && nr < 1.9;
}
function windBandage(da) {
  da = clamp(da, -1.1, 1.1);
  tend.rollA += da;
  tend.band = Math.min(tend.need, tend.band + Math.abs(da));
  if (Math.random() < Math.abs(da) * 3) {
    const g = tendGeo();
    spawn(g.cx + Math.cos(tend.rollA) * g.rx, g.cy + Math.sin(tend.rollA) * g.ry, rand(-20, 20), rand(-30, 0), 0.5, '#fffdf5', rand(2, 4));
  }
}

function tendDown(p, id) {
  const tp = tend.ptr;
  tp.down = true; tp.x = p.x; tp.y = p.y; tp.id = id;
  if (tend.stage === 'pour') {
    healWound(woundAt(p.x, p.y), 0.18);   // every tap on a sore helps
  } else if (tend.stage === 'band') {
    if (onRing(p.x, p.y)) {
      const a = ringAngle(p.x, p.y);
      let da = Math.atan2(Math.sin(a - tend.rollA), Math.cos(a - tend.rollA));
      if (Math.abs(da) < 0.3) da = 0.6 * (da >= 0 ? 1 : -1);   // a tap on the roll gives it a turn
      windBandage(clamp(da, -0.9, 0.9));
      tend.lastA = a;
    } else tend.lastA = null;
  }
}
function tendMove(p) {
  const tp = tend.ptr;
  if (!tp.down) return;
  tp.x = p.x; tp.y = p.y;
  if (tend.stage === 'band' && tend.lastA !== null) {
    const a = ringAngle(p.x, p.y);
    const da = Math.atan2(Math.sin(a - tend.lastA), Math.cos(a - tend.lastA));
    windBandage(da);
    tend.lastA = a;
  }
}
function tendUp() { if (tend) { tend.ptr.down = false; tend.lastA = null; } }

function updateTend(dt) {
  const td = tend;
  for (const w of td.wounds) w.glow = Math.max(0, w.glow - dt * 0.8);
  td.hintT += dt;
  if (td.stage === 'pour') {
    td.time += dt;
    let target = null;
    if (td.ptr.down) target = { x: td.ptr.x, y: td.ptr.y };
    else if (keys.has('Space')) target = woundPos(td.wounds[td.sel]);
    td.pouring = target;
    if (target) {
      td.supply = Math.max(0, td.supply - POUR_USE * dt);
      const w = woundAt(target.x, target.y);
      healWound(w, POUR_RATE * dt);
      const wine = w ? w.heal > 0.5 : false;
      if (Math.random() < dt * 40) spawn(target.x + 26 + rand(-3, 3), target.y - 52, rand(-40, -20), rand(60, 120), 0.35, wine ? '#b8434f' : '#f2c14e', rand(2, 3.5), 300);
      td.pourSnd -= dt;
      if (td.pourSnd <= 0) { sfx.pour(); td.pourSnd = 0.14; }
    }
    const f = td.wounds.reduce((s, w) => s + w.heal, 0) / td.wounds.length;
    TRAV.mood = f < 0.34 ? 'dazed' : f < 0.75 ? 'worried' : 'watch';
    if (td.wounds.every((w) => w.heal >= 1)) {
      td.stage = 'band'; td.hintT = 0;
      TRAV.mood = 'watch';
      showMessage('Now wrap the bandage round!');
    }
  } else if (td.stage === 'band') {
    td.time += dt;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) windBandage(-4 * dt);
    if (keys.has('ArrowRight') || keys.has('KeyD')) windBandage(4 * dt);
    if (td.band >= td.need) {
      td.stage = 'done'; td.doneT = 0;
      TRAV.mood = 'joy'; SAM.mood = 'joy';
      const g = tendGeo();
      hearts(g.mx, g.my - 60 * g.S, 12);
      sfx.healed();
      showMessage('He feels much better!');
    }
  } else if (td.stage === 'done') {
    td.doneT += dt;
    if (td.doneT > 1.8) {
      const n = td.wounds.length;
      tendScore = { wounds: n * 100, oil: Math.round(td.supply) * 3, quick: Math.max(0, Math.round(450 - td.time * 12)) };
      TRAV.mood = 'watch';
      runScript([{ phase: 'mount', banner: 'beast', min: 3.6 }], startRoad);
    }
  }
}

// ============================================================
//  Part 2: the donkey and the winding road
// ============================================================
let roadRph = 0;
function roadAmp() { return Math.max(0, Math.min(cfg.amp, (W - 2 * ROAD_HW) / 2 - 45)); }
function roadCX(wy) {
  return W / 2 + roadAmp() * (0.65 * Math.sin(wy / 560 + roadRph) + 0.35 * Math.sin(wy / 230 + roadRph * 2));
}
function laneX(lf, wy) { return roadCX(wy) + (lf - 1) * LANE_W; }

function buildRoad() {
  obs = [];
  const add = (o) => obs.push({ hit: false, got: false, phase: rand(0, TAU), ...o });
  const item = (lane, wy) => add({ type: Math.random() < 0.4 ? 'jug' : 'branch', lane, laneF: lane, wy });
  const others = (l) => [0, 1, 2].filter((k) => k !== l);
  let y = 820;
  while (y < cfg.length - 380) {
    if (Math.random() < cfg.double) {
      const free = Math.floor(Math.random() * 3);
      for (const l of others(free)) add({ type: pick(['rock', 'pothole', 'rock']), lane: l, laneF: l, wy: y + rand(-20, 20) });
      item(free, y);
    } else {
      const type = pick(cfg.types);
      if (type === 'drop') {
        const lane = Math.random() < 0.5 ? 0 : 2, len = rand(300, 520);
        add({ type: 'drop', lane, laneF: lane, wy: y, len });
        if (Math.random() < 0.6) item(2 - lane, y + len * 0.5);
        y += len;
      } else if (type === 'stones') {
        const dir = Math.random() < 0.5 ? 1 : -1;
        add({ type: 'stones', lane: -1, laneF: dir > 0 ? -0.9 : 2.9, dir, wy: y, speed: rand(0.55, 0.8) + level * 0.03, active: false, rot: 0 });
      } else {
        const lane = Math.floor(Math.random() * 3);
        add({ type, lane, laneF: lane, wy: y, wt: rand(0.6, 1.4), fade: null });
        if (Math.random() < 0.55) item(pick(others(lane)), y + rand(-10, 10));
      }
    }
    const gap = rand(cfg.gapMin, cfg.gapMax);
    if (gap > 480 && Math.random() < 0.5) item(Math.floor(Math.random() * 3), y + gap * 0.5);
    y += gap;
  }
  // Robbers peeking from roadside boulders (they never come out)
  for (let k = 0; k < cfg.robbers; k++) {
    const wy = lerp(900, cfg.length - 500, (k + 0.5) / cfg.robbers) + rand(-80, 80);
    add({ type: 'robber', side: Math.random() < 0.5 ? -1 : 1, wy, peek: 0, eek: false, scare: false });
  }
  obs.sort((a, b) => a.wy - b.wy);
}

function startRoad() {
  phase = 'road'; sub = '';
  script = null;
  roadRph = rand(0, TAU);
  donk = { lane: 1, laneF: 1, wy: 0, stopT: 0, hitCd: 0, ph: 0 };
  camY = -DY;
  comfort = 100; dayLeft = cfg.day; jugs = 0; branches = 0; arriveT = 0; robberNear = false;
  shockT = 0; joyT = 0;
  particles = [];
  buildRoad();
  drag.id = null;
  TRAV.mood = 'watch';
  if (level === 1) setTimeout(() => {
    if (state === 'play' && phase === 'road' && donk.wy < 600) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap left or right to steer' : 'Steer with ← and →');
  }, 900);
}

function changeLane(dir) {
  if (state !== 'play' || phase !== 'road' || arriveT > 0) return;
  const nl = clamp(donk.lane + dir, 0, 2);
  if (nl !== donk.lane) { donk.lane = nl; sfx.clop(); }
}

function roadHit(dmg, stop, msg) {
  const d = donk;
  if (d.hitCd > 0) return false;
  comfort -= dmg * cfg.dmg;
  d.stopT = Math.max(d.stopT, stop);
  d.hitCd = 0.8;
  shockT = 0.9; shakeT = 0.3;
  showMessage(msg);
  sfx.bounce();
  const x = laneX(d.laneF, d.wy);
  for (let i = 0; i < 12; i++) spawn(x + rand(-30, 30), d.wy + rand(-5, 5), rand(-70, 70), rand(-60, -10), 0.6, '#e9d6a8', rand(3, 6), 90);
  return true;
}

function updateRoad(dt) {
  const d = donk;
  if (arriveT > 0) {
    arriveT += dt;
    d.laneF += (1 - d.laneF) * Math.min(1, dt * 4);
    if (d.wy < cfg.length + 60) { d.wy += 80 * dt; d.ph += dt * 6; }
    camY = d.wy - DY;
    if (arriveT > 1.4) startInn();
    return;
  }
  dayLeft -= dt;
  if (dayLeft <= 0) { dayLeft = 0; fail('night'); return; }
  d.laneF += (d.lane - d.laneF) * Math.min(1, dt * 12);
  if (Math.abs(d.lane - d.laneF) < 0.01) d.laneF = d.lane;
  d.hitCd = Math.max(0, d.hitCd - dt);
  if (d.stopT > 0) d.stopT -= dt;
  else { d.wy += cfg.speed * dt; d.ph += dt * 9; }
  camY = d.wy - DY;
  comfort = Math.min(100, comfort + 0.6 * dt);
  robberNear = false;
  const near = (lf) => Math.abs(lf - d.laneF) < 0.5;

  for (const o of obs) {
    const dy = o.wy - d.wy;
    if (dy > 900) break;                // sorted: nothing further matters yet
    switch (o.type) {
      case 'robber': {
        if (dy < 320 && dy > -30) o.peek = Math.min(1, o.peek + dt * 3);
        else if (dy <= -30) o.peek = Math.max(0, o.peek - dt * 5);
        o.scare = false;
        if (o.peek > 0.5 && dy > -30) {
          robberNear = true;
          if (Math.abs(d.laneF - (o.side < 0 ? 0 : 2)) < 0.6) {
            o.scare = true;
            comfort -= 8 * cfg.dmg * dt;
            if (!o.eek) { o.eek = true; sfx.eek(); showMessage('Hurry past the robbers!'); }
          }
        }
        continue;
      }
      case 'stones':
        if (!o.active && dy < 560) o.active = true;
        if (o.active) { o.laneF += o.dir * o.speed * dt; o.rot += o.dir * dt * 6; }
        break;
      case 'goat':
        if (o.hit) { o.laneF += o.shoo * dt * 1.5; o.fade = (o.fade ?? 1) - dt * 0.8; continue; }
        if (cfg.wander && dy > 140 && dy < 620) {
          o.wt -= dt;
          if (o.wt <= 0) {
            o.wt = rand(1.2, 2.2);
            const nl = clamp(o.lane + (Math.random() < 0.5 ? -1 : 1), 0, 2);
            o.lane = nl;
          }
        }
        o.laneF += (o.lane - o.laneF) * Math.min(1, dt * 5);
        break;
    }
    if (o.hit || o.got) continue;
    switch (o.type) {
      case 'rock':
        if (Math.abs(dy) < 26 && near(o.lane) && roadHit(12, 0.45, 'Bump! Mind the rocks!')) o.hit = true;
        break;
      case 'pothole':
        if (Math.abs(dy) < 26 && near(o.lane) && roadHit(10, 0.3, 'Oof! A pothole!')) o.hit = true;
        break;
      case 'stones':
        if (o.active && Math.abs(dy) < 26 && near(o.laneF) && roadHit(8, 0.2, 'Loose stones!')) o.hit = true;
        break;
      case 'goat':
        if (Math.abs(dy) < 30 && near(o.laneF) && roadHit(5, 0.9, 'Baa! A stubborn goat!')) {
          o.hit = true; o.shoo = o.laneF < 1 || (o.laneF === 1 && Math.random() < 0.5) ? -1 : 1; o.fade = 1;
          sfx.baa();
        }
        break;
      case 'drop':
        if (dy <= 10 && d.wy <= o.wy + o.len && near(o.lane)) {
          if (roadHit(14, 0.3, 'Whoa! Keep away from the edge!')) d.lane = 1;
        }
        break;
      case 'jug': case 'branch':
        if (Math.abs(dy) < 34 && near(o.lane)) {
          o.got = true;
          const x = laneX(o.lane, o.wy);
          sparkle(x, o.wy - 16, 14, o.type === 'jug' ? ['#9fdcff', '#ffffff', '#6ec6f5'] : ['#ffe27a', '#b8d38a', '#ffffff']);
          if (o.type === 'jug') { jugs++; comfort = Math.min(100, comfort + 15); showMessage('Fresh water!'); }
          else { branches++; showMessage('An olive branch!'); }
          joyT = 0.8;
          sfx.pickup();
        }
        break;
    }
  }
  if (comfort <= 0) { comfort = 0; fail('comfort'); return; }
  if (d.wy >= cfg.length) {
    arriveT = 0.001; d.stopT = 0; d.lane = 1;
    showMessage('The inn at last!');
    sfx.pickup();
  }
}

// ============================================================
//  Part 3: at the inn
// ============================================================
function innGeo() {
  const gy = H - 175, s = 1.6;
  const x0 = W * 0.5, x1 = Math.min(W * 0.97, x0 + 460);
  return {
    gy, s, x0, x1, doorX: lerp(x0, x1, 0.27), winX: lerp(x0, x1, 0.75),
    donkX: W * 0.17, samX: W * 0.38, keepX: lerp(x0, x1, 0.27),
  };
}

function startInn() {
  // Score for the journey is settled on arrival; it is added when the story ends
  lastScore = {
    tend: tendScore ? tendScore.wounds + tendScore.oil + tendScore.quick : 0,
    comfort: Math.round(comfort) * 10,
    items: jugs * 50 + branches * 100,
    time: Math.round(dayLeft) * 20,
    levelBonus: level * 500,
  };
  lastScore.score = lastScore.tend + lastScore.comfort + lastScore.items + lastScore.time + lastScore.levelBonus;
  const g = innGeo();
  coins = [-1, 1].map((k) => ({ x: W / 2 + k * 48, y: H - 62, given: false, fly: 0 }));
  coinsGiven = 0; coinDoneT = 0;
  TRAV.mood = 'watch'; SAM.mood = 'watch'; KEEPER.mood = 'watch';
  runScript([
    { phase: 'inn', sub: 'coins', banner: 'twoPence', until: () => coinsGiven >= 2 && coinDoneT > 0.9, tap: giveCoin },
    { phase: 'inn', sub: 'repay', say: { who: 'sam', key: 'repay' }, start: () => { KEEPER.mood = 'joy'; } },
    { phase: 'inn', sub: 'rest', auto: 2.6, start: () => { showMessage('He rests safe and sound.'); TRAV.mood = 'sleep'; sfx.healed(); hearts(g.winX, g.gy - 170, 8); } },
    { phase: 'frame', sub: 'finale', say: { who: 'jesus', key: 'whichThree' } },
    { phase: 'frame', sub: 'finale', say: { who: 'lawyer', key: 'mercy' } },
    { phase: 'frame', sub: 'finale', say: { who: 'jesus', key: 'likewise' }, min: 3.4, start: () => sfx.win() },
  ], win);
}

function giveCoin(p) {
  const left = coins.filter((c) => !c.given);
  if (!left.length) return;
  let c = left[0];
  if (p) for (const k of left) if (Math.hypot(k.x - p.x, k.y - p.y) < 50) c = k;
  c.given = true; c.fly = 0.001;
  sfx.coinTap();
  SAM.mood = 'joy';
}

function updateInn(dt) {
  const g = innGeo();
  for (const c of coins) {
    if (c.fly > 0 && c.fly < 1) {
      c.fly = Math.min(1, c.fly + dt * 1.9);
      if (c.fly >= 1) {
        coinsGiven++;
        sfx.coin();
        sparkle(g.keepX - 26, g.gy - 42 * g.s, 16);
        KEEPER.mood = 'wow';
      }
    }
  }
  if (coinsGiven >= 2) coinDoneT += dt;
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  phase = 'frame'; sub = 'finale';
  totalScore += lastScore.score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('samaritanBest', best); } catch (e) {} }
  for (let i = 0; i < 50; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(W * 0.27, H - 300, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  endTimer = 0.6;
}

function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  TRAV.mood = 'dismay'; SAM.mood = 'worried';
  if (donk) donk.stopT = 99;
  sfx.fail();
  endTimer = 1.4;
}

function showMessage(text) { message = { text, t: 2.2 }; }

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// A few small extra effects built from the same helpers
Object.assign(sfx, {
  coinTap() { this.tone(988, 0.08, 'triangle', 0.18); },
  coin() { this.tone(1319, 0.18, 'triangle', 0.28); this.tone(1976, 0.55, 'sine', 0.22, 0.07); },
  pour() { this.puff(0.05); },
  clop() { this.tone(320, 0.06, 'triangle', 0.12); },
  baa() { this.tone(390, 0.14, 'sawtooth', 0.07, 0, 340); this.tone(370, 0.32, 'sawtooth', 0.07, 0.15, 300); },
  eek() { this.tone(660, 0.16, 'sine', 0.12, 0, 990); },
  scurry() { for (let k = 0; k < 6; k++) this.tone(260 + k * 30, 0.05, 'triangle', 0.1, k * 0.09); },
  healNote(h) { if (this.ctx) Music.tap(0.3 + h * 0.7); },
  healed() { if (this.ctx) { Music.tap(0.6); Music.render(this.ctx, Music.out, this.ctx.currentTime + 0.2, 'tap', Music.theme, 1); } },
  pickup() { if (this.ctx) Music.tap(0.85); },
});

//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  phase = 'frame'; sub = '';
  script = null;
  cfg = makeConfig(1);
  showOverlay('The Good Samaritan', 'Who is my neighbour?',
    `${verseHTML('compassion')}
     <ul>
       <li>A lawyer asks Jesus, <i>"Who is my neighbour?"</i> Jesus answers with a story&hellip;</li>
       <li><b>Tend the wounds:</b> tap or drag on each sore to pour on oil and wine, then drag the bandage round and round. <kbd>Space</kbd> pours, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> choose or wrap.</li>
       <li><b>To the inn:</b> tap left or right of the donkey (or slide your finger) to change lanes. Keyboard: <kbd>&larr;</kbd> <kbd>&rarr;</kbd>.</li>
       <li>Keep him <b>comfortable</b>: miss the rocks, potholes, goats and steep edges. Grab water jugs and olive branches, and reach the inn <b>before nightfall</b>!</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Begin the Story', () => { level = 1; totalScore = 0; introSeen = {}; startLevel(); });
}

function resetLevelState() {
  cfg = makeConfig(level);
  particles = [];
  script = null;
  tend = null; tendScore = null; donk = null; obs = [];
  arriveT = 0; coins = []; coinsGiven = 0;
  shakeT = flashT = shockT = joyT = 0;
  message = { text: '', t: 0 };
  drag.id = null;
  for (const d of EVERYONE) d.mood = 'watch';
}

function startLevel(skipIntro = false) {
  resetLevelState();
  state = 'play';
  syncAmbience();
  hideOverlay();
  sfx.levelStart();
  if (!skipIntro && !introSeen[level]) {
    introSeen[level] = true;
    runScript(introSteps(), () => { startTend(); showMessage(`Level ${level}: ${cfg.name}`); });
  } else {
    startTend();
    showMessage(`Level ${level}: ${cfg.name}`);
  }
}

// Try again after a fail: back on the road if his wounds were already tended
function retryLevel() {
  const hadTend = tendScore;
  if (!hadTend) { startLevel(true); return; }
  resetLevelState();
  tendScore = hadTend;
  state = 'play';
  syncAmbience();
  hideOverlay();
  sfx.levelStart();
  startRoad();
  showMessage(`Level ${level}: ${cfg.name}`);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('A True Neighbour!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('winCard')}
       <p class="score">Wounds tended: <b>${s.tend}</b><br>Comfort kept: <b>${s.comfort}</b><br>Jugs &amp; branches: <b>${s.items}</b><br>Daylight left: <b>${s.time}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Journey', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'comfort'
      ? ['Too bumpy!', 'The poor man was jolted about too much. Steer gently round the rocks, holes and goats.']
      : ['Night has fallen!', 'It grew dark before you reached the inn. Keep the donkey moving and dodge the goats.'];
    showOverlay(`Oh… no! ${lines[0]}`, `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('bound')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', retryLevel);
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    sfx.thrust(0);
    if (tend) tendUp();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const keys = new Set();
const ripples = [];
const drag = { id: null, anchorX: 0, startX: 0, startT: 0, moved: false };

function actionKey() {
  if (script) { tapScript(null); return; }
  if (phase === 'tend' && tend) {
    if (tend.stage === 'pour') healWound(tend.wounds[tend.sel], 0.15);
    else if (tend.stage === 'band') windBandage(0.6);
  }
}
function sideKey(dir) {
  if (script) return;
  if (phase === 'road') { changeLane(dir); return; }
  if (phase === 'tend' && tend && tend.stage === 'pour') {
    const n = tend.wounds.length;
    for (let k = 1; k <= n; k++) {
      const i = (tend.sel + dir * k + n * 2) % n;
      if (tend.wounds[i].heal < 1) { tend.sel = i; break; }
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  keys.add(e.code);
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') actionKey();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') sideKey(-1);
  if (e.code === 'ArrowRight' || e.code === 'KeyD') sideKey(1);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (tend) tendUp(); });

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  if (phase !== 'road' || script) ripples.push({ x: p.x, y: p.y, t: 0 });
  if (script) { tapScript(p); return; }
  if (phase === 'tend' && tend) {
    tendDown(p, e.pointerId);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (phase === 'road' && drag.id === null) {
    drag.id = e.pointerId;
    drag.anchorX = drag.startX = e.clientX;
    drag.startT = e.timeStamp; drag.moved = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (state !== 'play') return;
  if (phase === 'tend' && tend && tend.ptr.id === e.pointerId) { tendMove(toPlayfield(e)); return; }
  if (phase !== 'road' || e.pointerId !== drag.id) return;
  // slide = change lanes, one lane per SLIDE_PX of movement
  while (Math.abs(e.clientX - drag.anchorX) >= SLIDE_PX) {
    const dir = e.clientX < drag.anchorX ? -1 : 1;
    changeLane(dir);
    drag.anchorX += dir * SLIDE_PX;
    drag.moved = true;
  }
});

function endPointer(e) {
  sfx.init();   // iOS only unlocks audio on some gestures, so try again when the finger lifts
  if (tend && tend.ptr.id === e.pointerId) tendUp();
  if (e.pointerId !== drag.id) return;
  drag.id = null;
  // a tap (no slide): step toward the side of the donkey you tapped
  if (state === 'play' && phase === 'road' && !drag.moved && e.timeStamp - drag.startT < 600) {
    const p = toPlayfield(e);
    const dx = laneX(donk.laneF, donk.wy);
    changeLane(p.x < dx ? -1 : 1);
    ripples.push({ x: p.x, y: p.y, t: 0 });
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Rendering: the scenes
// ============================================================
function frameGeo() {
  const gy = H - 250, sc = 1.72;
  return { gy, sc, js: 1.9, jx: W * 0.27, lx: W * 0.66 };
}

function drawFrameScene() {
  drawFrameBackground();
  const g = frameGeo();
  const speaking = curStep() && curStep().say ? curStep().say.who : '';
  const joy = state === 'win' || (curStep() && curStep().say && curStep().say.key === 'likewise');
  // back row listeners, looking toward whoever is talking
  const lookTo = speaking === 'lawyer' ? g.lx : g.jx;
  const person = (d, x, y, s, extra = {}) => {
    const dx = lookTo - x, len = Math.hypot(dx, 60) || 1;
    drawPerson(d, x, y, s, { lx: dx / len, ly: -0.3, ...extra });
  };
  for (const d of CROWD) if (d.row === 0) person(d, W * d.fx, g.gy - 40, 0.82 * g.sc, { dim: true });
  drawJesus(g.jx, g.gy, g.js, joy ? 'joy' : speaking === 'jesus' ? 'talk' : 'calm', joy ? 'bless' : speaking === 'jesus' ? 'speak' : 'open');
  const lm = LAWYER.mood;
  drawPerson(LAWYER, g.lx, g.gy, g.sc, { lx: -0.9, ly: -0.2, pose: lm === 'watch' || lm === 'wow' ? 'scroll' : undefined });
  for (const d of CROWD) if (d.row === 1) person(d, W * d.fx, g.gy + 66, g.sc);
}

function drawPassScene() {
  drawWilderness(0, true);
  const u = stepU();
  const st = curStep();
  const manX = W * 0.5, manY = 748;
  const woundsShown = phase === 'mount' ? [] : newWounds(4);
  let manPos = { x: manX, y: manY, s: 1.8 };
  let travMood = 'dazed';
  const walkers = [];   // drawn in order of depth

  if (sub === 'robbers') {
    for (let k = 0; k < 3; k++) {
      const f = clamp(u * 1.25 - k * 0.1, 0, 1);
      drawRunningRobber(lerp(manX + 70 + k * 44, W + offX + 120, f), lerp(640, 580, f) - k * 10, 1.35, t * 22 + k);
      if (Math.random() < 0.3) spawn(lerp(manX + 60, W + offX, f) + rand(-10, 10), lerp(640, 580, f), rand(-40, -10), rand(-20, 0), 0.6, '#e9d6a8', rand(4, 8));
    }
  } else if (sub === 'priest' || sub === 'levite') {
    const who = sub === 'priest' ? PRIEST : LEVITE;
    const x = lerp(-60 - offX, W + offX + 60, u);
    let y = 596;
    if (sub === 'levite') y += 70 * Math.exp(-Math.pow((x - manX + 60) / (W * 0.16), 2));
    const nearMan = Math.abs(x - manX) < W * 0.3;
    let mood = 'watch', lx = 0.7, ly = 0.2;
    if (sub === 'priest' && nearMan) { mood = 'awkward'; lx = 0.2; ly = -1; }
    if (sub === 'levite' && nearMan) {
      if (x < manX - 20) { mood = 'worried'; lx = (manX - x) / 120; ly = 0.8; lx = clamp(lx, -1, 1); }
      else { mood = 'awkward'; lx = 0.9; ly = -0.6; }
    }
    walkers.push({ y, draw: () => {
      drawPerson(who, x, y, 1.45, { mood, lx, ly, walking: true, walk: u * st.dur * 7, pose: mood === 'awkward' ? 'fold' : 'rest' });
      if (mood === 'awkward') drawNote(x + 26, y - 118 - Math.sin(t * 4) * 4);
    } });
  } else if (sub === 'samaritan') {
    const f = ease(clamp(u / 0.45, 0, 1));
    const sx = lerp(-80 - offX, manX - 90, f);
    const walking = f < 1;
    walkers.push({ y: 770, draw: () => drawSideDonkey(sx - 115, 772, 1.45, 1, t * 8, walking, null) });
    walkers.push({ y: 760, draw: () => drawPerson(SAM, sx, 762, 1.7, { mood: walking ? 'watch' : 'worried', walking, walk: t * 8, lx: 1, ly: 0.4, pose: walking ? 'rest' : 'reach', dir: 1 }) });
    if (!walking && Math.random() < 0.12) hearts(sx + 10, 610, 1);
    travMood = walking ? 'dazed' : 'wow';
  } else if (phase === 'mount') {
    const lift = ease(clamp((u - 0.15) / 0.4, 0, 1));
    const go = clamp((u - 0.62) / 0.38, 0, 1);
    const dx = manX - 190 + go * (W * 0.8 + offX);
    const walking = go > 0;
    const sx = manX - 70 + go * (W * 0.8 + offX);
    const saddle = { x: dx, y: 772 - 54 * 1.45 };
    manPos = null;
    travMood = lift < 1 ? 'wow' : 'joy';
    const riding = lift >= 1;
    walkers.push({ y: 772, draw: () => drawSideDonkey(dx, 772, 1.45, 1, t * 8, walking,
      riding ? (x, y) => drawTraveller(x, y, 0.85, travMood, { band: 1 }) : null) });
    if (!riding) {
      const mx = lerp(manX, saddle.x, lift), my = lerp(manY, saddle.y, lift) - Math.sin(lift * Math.PI) * 60;
      walkers.push({ y: 773, draw: () => drawTraveller(mx, my, lerp(1.8, 1.23, lift), travMood, { band: 1 }) });
    }
    walkers.push({ y: 776, draw: () => drawPerson(SAM, sx, 780, 1.7, { mood: 'joy', still: true, walking, walk: t * 8, pose: walking ? 'rest' : 'lift', dir: -1, lx: -0.6 }) });
  }
  if (manPos) walkers.push({ y: manY, draw: () => drawTraveller(manPos.x, manPos.y, manPos.s, travMood, { wounds: woundsShown, lx: sub === 'samaritan' ? -0.8 : 0 }) });
  walkers.sort((a, b) => a.y - b.y).forEach((w) => w.draw());
}

// A little hummed tune: someone pretending not to notice
function drawNote(x, y) {
  ctx.fillStyle = '#6a5a8a'; ctx.strokeStyle = '#6a5a8a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, 4, 3, -0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 3.5, y - 1); ctx.lineTo(x + 3.5, y - 16); ctx.quadraticCurveTo(x + 9, y - 12, x + 10, y - 7); ctx.stroke();
}

function drawTendScene() {
  drawWilderness(0, true);
  const g = tendGeo();
  const td = tend;
  // the donkey waits patiently behind
  drawSideDonkey(g.mx + 60 * g.S, g.my - 90, 1.45, -1, 0, false, null);
  const done = td.stage === 'done';
  drawTraveller(g.mx, g.my, g.S, TRAV.mood, {
    wounds: td.wounds, band: td.band / td.need, wave: done,
    lx: td.stage === 'band' ? Math.cos(td.rollA) * 0.8 : -0.5, ly: td.stage === 'band' ? Math.sin(td.rollA) * 0.8 : 0.3,
  });
  drawPerson(SAM, g.mx - 44 * g.S, g.my + 10, 2.4, { pose: done ? 'up' : 'kneelReach', dir: 1, lx: 0.9, ly: 0.2, still: true });

  if (td.stage === 'pour') {
    // rings round each sore show how much it still needs
    td.wounds.forEach((w, i) => {
      if (w.heal >= 1) return;
      const p = woundPos(w);
      const pulse = 0.5 + 0.5 * Math.sin(t * 5 + i);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 22 + pulse * 3, 0, TAU); ctx.stroke();
      if (w.heal > 0) {
        ctx.strokeStyle = w.heal > 0.5 ? '#b8434f' : '#f2c14e'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(p.x, p.y, 22 + pulse * 3, -Math.PI / 2, -Math.PI / 2 + TAU * w.heal); ctx.stroke();
      }
      if (i === td.sel && !matchMedia('(pointer: coarse)').matches) {
        ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.arc(p.x, p.y, 32, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    });
    // the pouring flask
    if (td.pouring) {
      const p = td.pouring;
      const w = woundAt(p.x, p.y);
      const wine = w ? w.heal > 0.5 : false;
      ctx.strokeStyle = wine ? 'rgba(184,67,79,0.85)' : 'rgba(242,193,78,0.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x + 30, p.y - 60); ctx.quadraticCurveTo(p.x + 14, p.y - 40, p.x, p.y); ctx.stroke();
      drawFlask(p.x + 44, p.y - 74, -2.1, wine);
    } else {
      drawFlask(W / 2 - 40, H - 44, -0.2, false);
      drawFlask(W / 2 + 40, H - 44, 0.2, true);
    }
  } else if (td.stage === 'band') {
    // a dotted ring round his head and the bandage roll
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.setLineDash([8, 7]);
    ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    const rx = g.cx + Math.cos(td.rollA) * g.rx, ry = g.cy + Math.sin(td.rollA) * g.ry;
    ctx.strokeStyle = '#fffdf5'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(g.cx - 8 * g.S, g.cy + 2 * g.S); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.fillStyle = '#fffdf5'; ctx.strokeStyle = '#cfc6b0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rx, ry, 16, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(rx, ry, 6, 0, TAU); ctx.stroke();
    // arrows showing which way to go round
    const pa = t * 2;
    ctx.fillStyle = 'rgba(224,165,38,0.9)';
    for (let k = 0; k < 3; k++) {
      const a = pa + k * TAU / 3;
      const ax = g.cx + Math.cos(a) * g.rx * 1.18, ay = g.cy + Math.sin(a) * g.ry * 1.35;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.atan2(Math.cos(a) * g.ry, -Math.sin(a) * g.rx));
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // hint line
  if (td.stage !== 'done') {
    const coarse = matchMedia('(pointer: coarse)').matches;
    const txt = td.stage === 'pour'
      ? (coarse ? 'Tap or drag on each sore to pour oil and wine' : 'Click or drag on each sore  ·  or ← → and hold Space')
      : (coarse ? 'Drag the bandage round and round his head' : 'Drag the roll round  ·  or hold ← / →');
    ctx.save();
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    const hy = td.stage === 'pour' ? H - 88 : H - 30;
    ctx.strokeText(txt, W / 2, hy);
    ctx.fillStyle = '#7a5200'; ctx.fillText(txt, W / 2, hy);
    ctx.restore();
  }
}

function drawRoadScene() {
  const d = donk;
  const top = -offY - 30, bot = H + 30;
  const x0 = -offX, x1 = W + offX;
  const dark = nightAmount();
  // ground
  ctx.fillStyle = '#d8b377';
  ctx.fillRect(x0, -offY, viewW, viewH);
  // scattered scrub and pebbles, fixed to the world
  const cell = 70;
  for (let wy0 = Math.floor((camY + top) / cell) * cell; wy0 < camY + bot; wy0 += cell) {
    for (let k = 0; k < 3; k++) {
      const h1 = hash(wy0 * 0.37 + k * 11.3), h2 = hash(wy0 * 0.91 + k * 5.1);
      const x = x0 + h1 * viewW, sy = wy0 - camY + h2 * cell;
      if (Math.abs(x - roadCX(wy0 + h2 * cell)) < ROAD_HW + 24) continue;
      if (k === 0) {
        ctx.fillStyle = '#9aa062';
        ctx.beginPath(); ctx.arc(x - 8, sy, 9, 0, TAU); ctx.arc(x + 5, sy - 4, 11, 0, TAU); ctx.arc(x + 15, sy + 2, 7, 0, TAU); ctx.fill();
      } else if (k === 1) {
        ctx.fillStyle = '#c29a60';
        ctx.beginPath(); ctx.ellipse(x, sy, 4 + h2 * 4, 3, 0, 0, TAU); ctx.ellipse(x + 9, sy + 4, 3, 2, 0, 0, TAU); ctx.fill();
      } else if (h1 > 0.6) {
        drawBoulder(x, sy, 12 + h2 * 10, '#bfa37e');
      }
    }
  }
  // cliffs beside the steep drops
  for (const o of obs) {
    if (o.type !== 'drop' || o.wy - camY > bot || o.wy + o.len - camY < top) continue;
    const s = o.lane === 0 ? -1 : 1;
    ctx.fillStyle = '#6e4a2c';
    ctx.beginPath();
    for (let wy = o.wy; wy <= o.wy + o.len; wy += 12) ctx.lineTo(roadCX(wy) + s * (ROAD_HW - 4), wy - camY);
    for (let wy = o.wy + o.len; wy >= o.wy; wy -= 12) ctx.lineTo(roadCX(wy) + s * (ROAD_HW + 70 + 22 * hash(Math.round(wy / 12))), wy - camY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a2e1a';
    ctx.beginPath();
    for (let wy = o.wy + 10; wy <= o.wy + o.len - 10; wy += 12) ctx.lineTo(roadCX(wy) + s * (ROAD_HW + 16), wy - camY);
    for (let wy = o.wy + o.len - 10; wy >= o.wy + 10; wy -= 12) ctx.lineTo(roadCX(wy) + s * (ROAD_HW + 56 + 14 * hash(Math.round(wy / 12) + 3)), wy - camY);
    ctx.closePath(); ctx.fill();
  }
  // the road itself
  ctx.fillStyle = '#efd9a6';
  ctx.beginPath();
  for (let sy = top; sy <= bot; sy += 10) ctx.lineTo(roadCX(camY + sy) - ROAD_HW, sy);
  for (let sy = bot; sy >= top; sy -= 10) ctx.lineTo(roadCX(camY + sy) + ROAD_HW, sy);
  ctx.closePath(); ctx.fill();
  const line = (off, color, w, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (let sy = top; sy <= bot; sy += 10) ctx.lineTo(roadCX(camY + sy) + off, sy);
    ctx.stroke(); ctx.setLineDash([]);
  };
  line(-ROAD_HW, '#c09a5e', 6); line(ROAD_HW, '#c09a5e', 6);
  line(-LANE_W / 2, 'rgba(190,150,90,0.35)', 3, [14, 22]);
  line(LANE_W / 2, 'rgba(190,150,90,0.35)', 3, [14, 22]);
  line(-LANE_W - 14, 'rgba(210,180,120,0.6)', 5); line(LANE_W + 14, 'rgba(210,180,120,0.6)', 5);
  // crumbling edge lanes by the drops
  for (const o of obs) {
    if (o.type !== 'drop' || o.wy - camY > bot || o.wy + o.len - camY < top) continue;
    const s = o.lane === 0 ? -1 : 1;
    ctx.fillStyle = 'rgba(160,110,60,0.55)';
    ctx.beginPath();
    for (let wy = o.wy; wy <= o.wy + o.len; wy += 12) ctx.lineTo(roadCX(wy) + s * ROAD_HW, wy - camY);
    for (let wy = o.wy + o.len; wy >= o.wy; wy -= 12) ctx.lineTo(roadCX(wy) + s * (LANE_W / 2 + 6 + 8 * hash(Math.round(wy / 12) + 7)), wy - camY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let wy = o.wy + 20; wy < o.wy + o.len - 20; wy += 46) {
      const cx = laneX(o.lane, wy), sy = wy - camY;
      ctx.moveTo(cx - 14, sy - 8); ctx.lineTo(cx - 2, sy); ctx.lineTo(cx - 8, sy + 10); ctx.moveTo(cx - 2, sy); ctx.lineTo(cx + 14, sy - 4);
    }
    ctx.stroke();
  }
  // the inn at the end of the road
  const innWy = cfg.length + 190;
  if (innWy - camY < bot + 200) drawRoadInn(roadCX(innWy), innWy - camY, dark);

  // things on the road, back to front, with the donkey among them
  const drawList = [];
  for (const o of obs) {
    if (o.type === 'drop') continue;
    const sy = o.wy - camY;
    if (sy < top - 60 || sy > bot + 60) continue;
    drawList.push({ y: o.wy, draw: () => drawObstacle(o, sy) });
  }
  drawList.push({ y: d.wy - 30, draw: () => drawPerson(SAM, laneX(d.laneF, d.wy) + 50, DY - 26, 0.78, { walking: d.stopT <= 0 && state === 'play', walk: d.ph, mood: SAM.mood === 'worried' || shockT > 0 ? 'worried' : 'watch', lx: -0.4, ly: 0.6 }) });
  drawList.push({ y: d.wy, draw: () => {
    const x = laneX(d.laneF, d.wy);
    const wob = shockT > 0 ? Math.sin(t * 40) * shockT * 4 : 0;
    drawFrontDonkey(x + wob, DY, 1.15, d.ph, d.stopT <= 0 && state === 'play', (rx, ry) => drawTraveller(rx, ry, 0.72, travMood(), { band: 1, wave: joyT > 0 }));
  } });
  drawList.sort((a, b) => a.y - b.y).forEach((it) => it.draw());

  // dusk: a lantern glow around the travellers, darker further away
  if (dark > 0.02) {
    const x = laneX(d.laneF, d.wy);
    const g = ctx.createRadialGradient(x, DY - 30, 60, x, DY - 30, 620);
    g.addColorStop(0, `rgba(30,20,70,${dark * 0.35})`);
    g.addColorStop(1, `rgba(30,20,70,${dark})`);
    ctx.fillStyle = g;
    ctx.fillRect(x0, -offY, viewW, viewH);
  }
}

function travMood() {
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'shock';
  if (joyT > 0 || arriveT > 0) return 'joy';
  if (robberNear || comfort < 35) return 'worried';
  return 'watch';
}

function drawObstacle(o, sy) {
  const x = laneX(o.laneF, o.wy);
  switch (o.type) {
    case 'rock': drawBoulder(x, sy, 22, '#b3a28a'); break;
    case 'pothole': drawPothole(x, sy, 1); break;
    case 'stones': drawStones(x, sy, o.rot); break;
    case 'goat':
      drawGoat(x, sy + 16, 1.1, o);
      if (o.hit && o.fade > 0.3) {
        ctx.save(); ctx.globalAlpha = clamp(o.fade, 0, 1);
        ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#6a5a3c';
        ctx.fillText('Baa!', x, sy - 50 - (1 - o.fade) * 20);
        ctx.restore();
      }
      break;
    case 'jug': if (!o.got) drawJug(x, sy + 14 + Math.sin(t * 3 + o.phase) * 3, 1); break;
    case 'branch': if (!o.got) drawBranch(x, sy + 12 + Math.sin(t * 3 + o.phase) * 3, 1.1); break;
    case 'robber': {
      const rx = roadCX(o.wy) + o.side * (ROAD_HW + 20);
      const dxl = laneX(donk.laneF, donk.wy) - rx;
      drawPeekingRobber(rx, sy, 26, o.peek, clamp(dxl / 80, -1, 1), o.scare);
      break;
    }
  }
}

function drawRoadInn(x, y, dark) {
  ctx.fillStyle = '#e6cf9c';
  ctx.beginPath(); ctx.ellipse(x, y + 10, 190, 60, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e8d3a8'; ctx.strokeStyle = '#b89a68'; ctx.lineWidth = 2;
  roundRect(x - 120, y - 110, 240, 120, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#cdb07e'; ctx.fillRect(x - 128, y - 122, 256, 16);
  ctx.fillStyle = '#7a4e2c'; roundRect(x - 20, y - 60, 40, 70, [20, 20, 0, 0]); ctx.fill();
  const lamp = 0.5 + dark;
  for (const wx of [-78, 58]) {
    ctx.fillStyle = `rgba(255,214,122,${clamp(lamp, 0, 1)})`; roundRect(x + wx, y - 80, 22, 26, [11, 11, 2, 2]); ctx.fill();
  }
  ctx.fillStyle = '#8a5a2a'; roundRect(x + 30, y - 104, 60, 22, 4); ctx.fill();
  ctx.fillStyle = '#fff3cf'; ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('INN', x + 60, y - 92);
  ctx.textBaseline = 'alphabetic';
}

function drawInnScene() {
  const dark = nightAmount();
  drawWilderness(dark, false);
  const g = innGeo();
  const { gy, s, x0, x1 } = g;
  // warm light spilling out
  const glow = ctx.createRadialGradient(g.doorX, gy - 60, 10, g.doorX, gy - 60, 260);
  glow.addColorStop(0, `rgba(255,210,120,${0.25 + dark * 0.5})`); glow.addColorStop(1, 'rgba(255,210,120,0)');
  // the inn
  const top = gy - 290;
  ctx.fillStyle = mix('#ecd8ae', '#9a8a8a', dark); ctx.strokeStyle = '#b89a68'; ctx.lineWidth = 2;
  roundRect(x0, top, x1 - x0, 290, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = mix('#d2b682', '#7a6a70', dark);
  ctx.fillRect(x0 - 8, top - 14, x1 - x0 + 16, 18);
  ctx.strokeStyle = 'rgba(160,130,80,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 1; k < 6; k++) { const yy = top + k * 42; ctx.moveTo(x0 + 6, yy); ctx.lineTo(x1 - 6, yy); }
  ctx.stroke();
  ctx.fillStyle = glow; ctx.fillRect(x0 - 200, gy - 330, x1 - x0 + 400, 340);
  // doorway
  ctx.fillStyle = '#ffd67a';
  roundRect(g.doorX - 36, gy - 138, 72, 138, [36, 36, 0, 0]); ctx.fill();
  ctx.fillStyle = '#7a4e2c';
  ctx.beginPath(); ctx.moveTo(g.doorX + 36, gy); ctx.lineTo(g.doorX + 36, gy - 100); ctx.lineTo(g.doorX + 58, gy - 94); ctx.lineTo(g.doorX + 58, gy + 4); ctx.closePath(); ctx.fill();
  // the resting window
  const wx = g.winX, wy = gy - 190;
  ctx.fillStyle = mix('#ffe6a0', '#ffd67a', dark);
  const ww = Math.min(60, (x1 - x0) * 0.22);
  roundRect(wx - ww, wy - 44, ww * 2, 84, [40, 40, 4, 4]); ctx.fill();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4;
  roundRect(wx - ww, wy - 44, ww * 2, 84, [40, 40, 4, 4]); ctx.stroke();
  ctx.fillStyle = '#b08a5a'; ctx.fillRect(wx - ww + 6, wy + 22, ww * 2 - 12, 10);
  if (sub === 'rest') drawRestingMan(wx + 4, wy + 22, Math.min(1.1, ww / 52));
  // sign
  ctx.fillStyle = '#8a5a2a'; roundRect(g.doorX - 34, gy - 176, 68, 28, 5); ctx.fill();
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff3cf'; ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText("INN", g.doorX, gy - 161);
  ctx.textBaseline = 'alphabetic';
  // lantern
  const lg = ctx.createRadialGradient(g.doorX - 50, gy - 140, 2, g.doorX - 50, gy - 140, 40);
  lg.addColorStop(0, 'rgba(255,220,130,0.95)'); lg.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(g.doorX - 50, gy - 140, 40, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(g.doorX - 56, gy - 150, 12, 18);

  // people
  const resting = sub === 'rest';
  drawSideDonkey(g.donkX, gy + 10, 1.5, 1, 0, false, resting ? null : (x, y) => drawTraveller(x, y, 0.85, TRAV.mood === 'sleep' ? 'watch' : TRAV.mood, { band: 1 }));
  const giving = sub === 'coins' && coins.some((c) => c.fly > 0 && c.fly < 1);
  drawPerson(SAM, g.samX, gy + 14, s, { pose: giving || sub === 'repay' ? 'hold' : 'rest', dir: 1, lx: 1, ly: -0.1 });
  drawPerson(KEEPER, g.keepX, gy, s, { pose: 'hold', dir: -1, lx: -1, ly: -0.1 });
  // coins in the innkeeper's hand
  const handX = g.keepX - 28 * s, handY = gy - 28 * s;
  let inHand = 0;
  for (const c of coins) {
    if (c.fly >= 1) { drawCoin(handX + inHand * 6, handY - 4 - inHand * 5, 9); inHand++; }
  }
  // coins waiting to be given, and in flight
  for (const c of coins) {
    if (!c.given) {
      const pulse = 1 + Math.sin(t * 5) * 0.06;
      const gl = ctx.createRadialGradient(c.x, c.y, 5, c.x, c.y, 50);
      gl.addColorStop(0, 'rgba(255,230,120,0.6)'); gl.addColorStop(1, 'rgba(255,230,120,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(c.x, c.y, 50, 0, TAU); ctx.fill();
      drawCoin(c.x, c.y, 26 * pulse);
    } else if (c.fly < 1) {
      const f = ease(c.fly);
      const x = lerp(c.x, handX, f), y = lerp(c.y, handY, f) - Math.sin(f * Math.PI) * 140;
      drawCoin(x, y, lerp(26, 9, f), Math.cos(c.fly * 18));
    }
  }
  if (sub === 'coins' && coins.some((c) => !c.given)) {
    ctx.save();
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText('Tap the coins to pay the innkeeper', W / 2, H - 106);
    ctx.fillStyle = '#7a5200'; ctx.fillText('Tap the coins to pay the innkeeper', W / 2, H - 106);
    ctx.restore();
  }
}

// ============================================================
//  Speech bubbles, story banner, HUD
// ============================================================
function speakerAnchor(who) {
  if (who === 'jesus') { const g = frameGeo(); return { x: g.jx, y: g.gy - 82 * g.js }; }
  if (who === 'lawyer') { const g = frameGeo(); return { x: g.lx, y: g.gy - 76 * g.sc }; }
  const g = innGeo(); return { x: g.samX, y: g.gy - 78 * g.s };
}

function drawSpeech(text, ax, ay) {
  ctx.save();
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 40, 430) - 26;
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(ax - w / 2, 14, W - 14 - w);
  const by = Math.max(-offY + 108, ay - 24 - h);
  const tx = clamp(ax, bx + 20, bx + w - 20);
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  // tail down to the speaker
  ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, ay); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, ay); ctx.lineTo(tx + 10, by + h); ctx.stroke();
  ctx.fillRect(tx - 11, by + h - 5, 22, 4);
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

// Jesus narrating the story, shown as a banner at the top
function drawBanner(text) {
  ctx.save();
  ctx.font = '600 18px Fredoka, sans-serif';
  const maxW = Math.min(W - 40, 640) - 30;
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width), 150);
  const w = tw + 30, h = lines.length * 23 + 38;
  const bx = W / 2 - w / 2, by = -offY + 108;
  ctx.fillStyle = 'rgba(255,251,232,0.95)'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b07a1a';
  ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('JESUS TELLS THE STORY', W / 2, by + 20);
  ctx.fillStyle = '#6a4a10';
  ctx.font = '600 18px Fredoka, sans-serif'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 30 + 11.5 + i * 23));
  ctx.restore();
}

function drawStoryText() {
  const st = curStep();
  if (!st) return;
  const fade = clamp(script.t / 0.25, 0, 1);
  ctx.globalAlpha = fade;
  if (st.say) { const a = speakerAnchor(st.say.who); drawSpeech(verseText(st.say.key), a.x, a.y); }
  if (st.banner) drawBanner(verseText(st.banner));
  ctx.globalAlpha = 1;
  if (!st.until && script.t > 0.6) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 4);
    ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'right';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText('tap to continue ›', W - 14, H - 14);
    ctx.fillStyle = '#7a5200'; ctx.fillText('tap to continue ›', W - 14, H - 14);
    ctx.restore();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + the meter for this part
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Good Samaritan' : `Level ${level} · ${cfg.name}`, 12, 26);
  const bar = (label, x, f, c0, c1, warn) => {
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(label, 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(x, 38, 120, 13, 6.5); ctx.fill();
    const gg = ctx.createLinearGradient(x, 0, x + 120, 0);
    gg.addColorStop(0, c0); gg.addColorStop(1, c1);
    ctx.fillStyle = warn && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
    if (f > 0) { roundRect(x, 38, 120 * clamp(f, 0, 1), 13, 6.5); ctx.fill(); }
  };
  if (state !== 'title' && phase === 'road' && donk) {
    bar('COMFORT', 76, comfort / 100, '#ff8fab', '#ffd1dc', comfort < 25);
    // items collected
    ctx.shadowBlur = 0;
    drawJug(138, 96, 0.55);
    drawBranch(190, 94, 0.55);
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210'; ctx.font = '700 15px Fredoka, sans-serif';
    ctx.fillText(`×${jugs}`, 150, 90);
    ctx.fillText(`×${branches}`, 202, 90);
  } else if (state !== 'title' && phase === 'tend' && tend) {
    bar('OIL & WINE', 82, tend.supply / 100, '#f2c14e', '#b8434f', false);
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: daylight and distance on the road, sores while tending
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  if (state !== 'title' && phase === 'road' && donk) {
    const f = clamp(dayLeft / cfg.day, 0, 1);
    ctx.shadowBlur = 4; ctx.fillStyle = '#5a4210'; ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('NIGHTFALL', rx, 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(40,30,80,0.35)'; roundRect(rx - 120, 26, 120, 12, 6); ctx.fill();
    const sg = ctx.createLinearGradient(rx - 120, 0, rx, 0);
    sg.addColorStop(0, '#f08a4b'); sg.addColorStop(1, '#ffe27a');
    ctx.fillStyle = f < 0.2 && Math.sin(t * 10) > 0 ? '#9a6ad0' : sg;
    if (f > 0) { roundRect(rx - 120, 26, 120 * f, 12, 6); ctx.fill(); }
    ctx.fillStyle = '#ffd43b'; ctx.strokeStyle = '#e8a21a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rx - 120 + 120 * f, 32, 7, 0, TAU); ctx.fill(); ctx.stroke();
    const p = clamp(donk.wy / cfg.length, 0, 1);
    ctx.shadowBlur = 4; ctx.fillStyle = '#5a4210'; ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('TO THE INN', rx, 58);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)'; roundRect(rx - 120, 64, 120, 10, 5); ctx.fill();
    ctx.fillStyle = '#8fc46a'; if (p > 0) { roundRect(rx - 120, 64, 120 * p, 10, 5); ctx.fill(); }
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(rx - 120 + 120 * p, 69, 5, 0, TAU); ctx.fill();
  } else if (state !== 'title' && phase === 'tend' && tend) {
    ctx.shadowBlur = 4; ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(tend.stage === 'pour' ? 'SORES TENDED' : 'BANDAGE', rx, 20);
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.fillText(tend.stage === 'pour' ? `${tend.wounds.filter((w) => w.heal >= 1).length} / ${tend.wounds.length}` : `${Math.round(clamp(tend.band / tend.need, 0, 1) * 100)}%`, rx, 42);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = phase === 'road' ? H * 0.52 : H * 0.44;
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (phase === 'frame') drawFrameScene();
  else if (phase === 'pass' || phase === 'mount') drawPassScene();
  else if (phase === 'tend' && tend) drawTendScene();
  else if (phase === 'road' && donk) drawRoadScene();
  else if (phase === 'inn') drawInnScene();

  if (phase === 'road') { ctx.save(); ctx.translate(0, -camY); drawParticles(); ctx.restore(); }
  else drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawStoryText();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateScenery(dt);
  updateParticles(dt);
  updatePeople(dt);
  if (state === 'play') {
    updateScript(dt);
    if (!script && phase === 'tend' && tend) updateTend(dt);
    else if (!script && phase === 'road' && donk) updateRoad(dt);
    if (phase === 'inn') updateInn(dt);
  } else if (state === 'win' && Math.random() < dt * 12) {
    spawn(W * 0.27 + rand(-50, 50), H - 190 - rand(0, 120), 0, -20, 1, '#fff6d0', 3);
  }
  shockT = Math.max(0, shockT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
