      ctx.strokeStyle = '#5e3413'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.lineWidth = 1.5; ctx.beginPath();
      for (let a = 0; a < 3; a++) { const an = a * Math.PI / 3 + (it.fly ? t * 10 : 0); ctx.moveTo(wx + Math.cos(an) * 11, -12 + Math.sin(an) * 11); ctx.lineTo(wx - Math.cos(an) * 11, -12 - Math.sin(an) * 11); }
      ctx.stroke();
    }
  } else if (k === 'rug') {
    ctx.fillStyle = '#b5303f'; roundRect(-32, -24, 60, 22, 10); ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
    for (const sx of [-18, -4, 10]) { ctx.beginPath(); ctx.moveTo(sx, -24); ctx.lineTo(sx, -2); ctx.stroke(); }
    ctx.fillStyle = '#8a1f2c'; ctx.beginPath(); ctx.ellipse(28, -13, 7, 11, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(28, -13, 4, 0, 5.5); ctx.stroke();
    ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); for (let i = 0; i < 5; i++) { ctx.moveTo(-32, -20 + i * 4); ctx.lineTo(-37, -20 + i * 4); } ctx.stroke();
  } else if (k === 'stool') {
    ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-12, -24); ctx.lineTo(-18, 0); ctx.moveTo(12, -24); ctx.lineTo(18, 0); ctx.moveTo(0, -24); ctx.lineTo(0, 2); ctx.stroke();
    ctx.fillStyle = '#b07a42'; ctx.beginPath(); ctx.ellipse(0, -27, 20, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c99060'; ctx.beginPath(); ctx.ellipse(0, -29, 17, 5, 0, 0, TAU); ctx.fill();
  } else if (k === 'lamp') {
    ctx.fillStyle = '#c56a3a';
    ctx.beginPath(); ctx.ellipse(0, -9, 18, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(26, -14); ctx.lineTo(24, -8); ctx.lineTo(12, -6); ctx.fill();
    ctx.fillStyle = '#8a4b1c'; ctx.beginPath(); ctx.arc(0, -14, 4, 0, TAU); ctx.fill();
    const fl = 1 + Math.sin(t * 14 + it.phase) * 0.15;
    ctx.fillStyle = '#ffb703';
    ctx.beginPath(); ctx.moveTo(25, -14); ctx.quadraticCurveTo(31, -22 * fl, 26, -30 * fl); ctx.quadraticCurveTo(21, -22 * fl, 25, -14); ctx.fill();
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(26, -19, 2, 4, 0, 0, TAU); ctx.fill();
  } else if (k === 'basket') {
    for (const [fx, fy, c] of [[-10, -30, '#e63946'], [2, -34, '#f4a261'], [12, -29, '#7a4fa0'], [-2, -27, '#6b8e3a']]) {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(fx, fy, 7, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#c9a15a';
    ctx.beginPath(); ctx.moveTo(-22, -28); ctx.lineTo(22, -28); ctx.lineTo(16, 0); ctx.lineTo(-16, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9a7432'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) { ctx.moveTo(-22 + i * 1.5, -28 + i * 7); ctx.lineTo(22 - i * 1.5, -28 + i * 7); }
    for (let i = -2; i <= 2; i++) { ctx.moveTo(i * 8, -28); ctx.lineTo(i * 6, 0); }
    ctx.stroke();
  } else if (k === 'silk') {
    const cols = ['#7a4fa0', '#2a9d8f', '#e9b949'];
    [[-12, -8], [12, -8], [0, -26]].forEach(([sx, sy], i) => {
      ctx.fillStyle = cols[i]; roundRect(sx - 14, sy - 9, 28, 18, 8); ctx.fill();
      ctx.fillStyle = shade(cols[i], -35); ctx.beginPath(); ctx.ellipse(sx + 13, sy, 4, 9, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = shade(cols[i], 50); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx - 10, sy - 4); ctx.lineTo(sx + 8, sy - 4); ctx.stroke();
    });
  } else if (k === 'scales') {
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -44); ctx.moveTo(-24, -40); ctx.lineTo(24, -40); ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-24, -40); ctx.lineTo(-30, -22); ctx.moveTo(-24, -40); ctx.lineTo(-18, -22); ctx.moveTo(24, -40); ctx.lineTo(18, -22); ctx.moveTo(24, -40); ctx.lineTo(30, -22); ctx.stroke();
    ctx.fillStyle = '#e0a526';
    ctx.beginPath(); ctx.ellipse(-24, -21, 9, 3.5, 0, 0, Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, -21, 9, 3.5, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(-8, -3, 16, 4);
    ctx.beginPath(); ctx.arc(0, -46, 3, 0, TAU); ctx.fill();
  } else if (k === 'casket') {
    ctx.fillStyle = '#7a3f7a'; ctx.strokeStyle = '#4a204a'; ctx.lineWidth = 1.5;
    roundRect(-20, -22, 40, 22, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a2a5a';
    ctx.beginPath(); ctx.moveTo(-20, -22); ctx.lineTo(-24, -40); ctx.lineTo(20, -40); ctx.lineTo(20, -22); ctx.fill();
    for (let i = 0; i < 6; i++) { ctx.fillStyle = '#f6f3ec'; ctx.beginPath(); ctx.arc(-14 + i * 5.6, -24 - (i % 2) * 3, 3.2, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#e0a526'; ctx.fillRect(-3, -16, 6, 6);
  }
  ctx.restore();
}

// ============================================================
//  Part 2: the pearl of great price
// ============================================================
function makePearl(perfect, m, flaw = null) {
  const p = {
    perfect, flaw: perfect ? null : flaw,
    size: 1, squash: 1, lustre: 1, tint: 0, tintCol: '#e6c77a',
    bump: 0, bumpA: rand(0, TAU), spot: 0, spotA: rand(0, TAU), spotD: rand(0.25, 0.6),
    crack: 0, crackA: rand(0, TAU), rot: rand(-0.6, 0.6), rejected: false, phase: rand(0, TAU),
    x: 0, y: 0, r: 20, stall: 0,
  };
  const mm = m * rand(0.9, 1.1);
  switch (p.flaw) {
    case 'shape': p.squash = 1 - 0.26 * mm; break;
    case 'bump': p.bump = 0.4 * mm; break;
    case 'dull': p.lustre = 1 - 0.8 * mm; break;
    case 'tint': p.tint = 0.8 * mm; p.tintCol = pick(['#e6c77a', '#b0a898', '#e7b0a0']); break;
    case 'spot': p.spot = 0.2 * mm; break;
    case 'crack': p.crack = mm; break;
    case 'small': p.size = 1 - 0.3 * mm; break;
  }
  return p;
}
const PERFECT = makePearl(true, 0);

function startPearl() {
  stage = 'pearl';
  pearls = [];
  const n = cfg.pearls;
  const bag = [];
  while (bag.length < n - 1) bag.push(...[...FLAWS].sort(() => Math.random() - 0.5));
  const good = Math.floor(Math.random() * n);
  for (let i = 0, j = 0; i < n; i++) pearls.push(i === good ? makePearl(true, 0) : makePearl(false, cfg.flaw, bag[j++]));
  // share them out between the stalls
  const S = cfg.stalls;
  pearls.forEach((p, i) => { p.stall = Math.floor(i * S / n); });
  timeLeft = cfg.marketTime;
  mistakes = 0;
  examining = null; exam = { t: 0, wrong: null, wrongT: 0 };
  pearlWon = null;
  pcursor = 0; pearlKb = false;
  particles = []; floaters = [];
  if (level === 1) hint = { t: 2.4, text: isTouch() ? 'Tap a pearl to look closely' : 'Click a pearl to look closely (or arrows + Space)' };
}

function marketLayout() {
  const S = cfg.stalls;
  const sw = Math.min((W - 24) / S, 480);
  const m = (W - sw * S) / 2;
  const L = { S, sw, awTop: 232, tableY: 440, trayTop: 458, trayBot: H - 132, stalls: [] };
  for (let s = 0; s < S; s++) {
    const x0 = m + s * sw;
    const list = pearls.filter((p) => p.stall === s);
    const n = list.length;
    const maxCols = Math.max(2, Math.floor((sw - 24) / 78));
    let cols = Math.min(maxCols, n);
    const rows = Math.ceil(n / cols);
    cols = Math.ceil(n / rows);
    const slotW = (sw - 24) / cols;
    const avail = L.trayBot - L.trayTop - 16;
    const slotH = Math.min(avail / rows, 110);
    const r = Math.min(slotW * 0.3, slotH * 0.32, 30);
    const yTop = L.trayTop + 8 + (avail - rows * slotH) / 2;
    list.forEach((p, i) => {
      const c = i % cols, row = Math.floor(i / cols);
      const rowN = Math.min(cols, n - row * cols);
      p.x = x0 + 12 + slotW * (c + 0.5 + (cols - rowN) / 2);
      p.y = yTop + slotH * (row + 0.5);
      p.r = r;
    });
    L.stalls.push({ x0, w: sw, cx: x0 + sw / 2 });
  }
  return L;
}

function lensLayout() {
  const R = Math.min(W * 0.34, 165);
  const cy = 440;
  return { cx: W / 2, cy, R, buy: { x: W / 2, y: cy + R + 58, w: 236, h: 54 }, back: { x: W / 2, y: cy + R + 122, w: 170, h: 44 } };
}
const inBtn = (b, x, y) => Math.abs(x - b.x) < b.w / 2 && Math.abs(y - b.y) < b.h / 2;

function pearlTap(x, y) {
  if (state !== 'play' || stage !== 'pearl' || trans || pearlWon) return;
  if (examining) {
    if (exam.wrong) return;
    const Ls = lensLayout();
    if (inBtn(Ls.buy, x, y)) buyPearl();
    else if (inBtn(Ls.back, x, y) || Math.hypot(x - Ls.cx, y - Ls.cy) > Ls.R + 10) closeExam();
    return;
  }
  marketLayout();
  let hit = null, bd = 1e9;
  for (const p of pearls) {
    if (p.rejected) continue;
    const d = Math.hypot(x - p.x, y - p.y);
    if (d < Math.max(p.r + 16, 30) && d < bd) { bd = d; hit = p; }
  }
  if (hit) openExam(hit);
}

function openExam(p) {
  if (p.rejected) return;
  examining = p;
  exam = { t: 0, wrong: null, wrongT: 0 };
  pcursor = pearls.indexOf(p);
  sfx.lens();
  hint = null;
}
function closeExam() { examining = null; exam.wrong = null; }

function buyPearl() {
  const p = examining;
  if (!p || exam.wrong) return;
  if (p.perfect) {
    pearlWon = { p, t: 0 };
    examining = null;
    pts.pearl = Math.round(timeLeft * 8) + (mistakes === 0 ? 300 : 0);
    sparkleBurst(p.x, p.y, 60);
    flashT = 0.3;
    showMessage('The pearl of great price!', 2.4);
    sfx.found();
    return;
  }
  // Not this one: the flaw shows up under the glass
  exam.wrong = FLAW_TEXT[p.flaw];
  exam.wrongT = 1.8;
  p.rejected = true;
  mistakes++;
  timeLeft = Math.max(0, timeLeft - cfg.wrongCost);
  flashMood(MERCHANT, 'worried', 1.4);
  flashMood(SELLERS[p.stall], 'worried', 1.4);
  const Ls = lensLayout();
  floater(W / 2, Ls.cy + Ls.R + 56, `−${cfg.wrongCost} seconds`, '#c92a2a', 1.6, 24);
  sfx.bounce();
}

function updatePearl(dt) {
  if (exam.wrongT > 0) {
    exam.wrongT -= dt;
    if (exam.wrongT <= 0) closeExam();
  }
  if (examining) exam.t += dt;
  if (pearlWon) {
    const was = pearlWon.t;
    pearlWon.t += dt;
    if (Math.random() < dt * 16) spawn(pearlWon.p.x + rand(-30, 30), pearlWon.p.y - rand(0, 60), 0, -30, 1, '#fff6d0', 3, 0, 'star');
    if (was < 2.8 && pearlWon.t >= 2.8) goStage(() => startSell('pearl'));
    return;
  }
  if (trans) return;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; fail('closed'); }
}

// Keyboard: walk along the pearls, look closely, buy or put back
function pearlKey(code) {
  if (pearlWon || trans) return;
  pearlKb = true;
  const live = pearls.map((p, i) => i).filter((i) => !pearls[i].rejected);
  if (!live.length) return;
  if (examining) {
    if (exam.wrong) return;
    if (code === 'Space' || code === 'Enter') buyPearl();
    else closeExam();
    return;
  }
  if (!live.includes(pcursor)) pcursor = live[0];
  const k = live.indexOf(pcursor);
  if (code === 'ArrowRight' || code === 'ArrowDown') pcursor = live[(k + 1) % live.length];
  else if (code === 'ArrowLeft' || code === 'ArrowUp') pcursor = live[(k - 1 + live.length) % live.length];
  else if (code === 'Space' || code === 'Enter') openExam(pearls[pcursor]);
}

// One pearl: round, bright and smooth, unless it has a flaw
function drawPearl(x, y, r, p) {
  const R = r * p.size;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(R * 0.1, R * 0.95 * p.squash, R * 0.85, R * 0.22, 0, 0, TAU); ctx.fill();
  ctx.rotate(p.rot);
  ctx.scale(1, p.squash);
  let body = p.tint ? mix('#f6f3ec', p.tintCol, p.tint) : '#f6f3ec';
  if (p.lustre < 1) body = mix(body, '#a9a59c', (1 - p.lustre) * 0.7);
  ctx.rotate(-p.rot);   // keep the light coming from the top-left
  const hx = -R * 0.35, hy = -R * 0.4;
  const g = ctx.createRadialGradient(hx, hy, R * 0.05, 0, 0, R * 1.15);
  g.addColorStop(0, mix(body, '#ffffff', 0.4 + 0.6 * p.lustre));
  g.addColorStop(0.45, body);
  g.addColorStop(1, shade(body, -55));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  if (p.bump) {
    const bx = Math.cos(p.bumpA) * R * 0.85, by = Math.sin(p.bumpA) * R * 0.85;
    ctx.moveTo(bx + R * p.bump, by); ctx.arc(bx, by, R * p.bump, 0, TAU);
  }
  ctx.fill();
  // the soft rainbow "orient" of a fine pearl
  if (p.lustre > 0.5) {
    ctx.globalAlpha = 0.28 * p.lustre;
    ctx.strokeStyle = '#ffc9e0'; ctx.lineWidth = R * 0.12;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.78, 0.2 * Math.PI, 0.7 * Math.PI); ctx.stroke();
    ctx.strokeStyle = '#c9f2e6';
    ctx.beginPath(); ctx.arc(0, 0, R * 0.78, 0.7 * Math.PI, 1.0 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // highlight
  ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.7 * p.lustre})`;
  ctx.beginPath(); ctx.ellipse(hx, hy, R * 0.26, R * 0.16, -0.6, 0, TAU); ctx.fill();
  if (p.spot) {
    ctx.fillStyle = 'rgba(80,60,45,0.9)';
    ctx.beginPath(); ctx.arc(Math.cos(p.spotA) * R * p.spotD, Math.sin(p.spotA) * R * p.spotD, R * p.spot, 0, TAU); ctx.fill();
  }
  if (p.crack) {
    ctx.strokeStyle = 'rgba(95,80,70,0.85)'; ctx.lineWidth = Math.max(0.8, R * 0.035);
    const a = p.crackA, len = R * 1.1 * p.crack;
    let cx = Math.cos(a) * R * 0.2, cy = Math.sin(a) * R * 0.2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    for (let k = 1; k <= 4; k++) {
      const f = k / 4;
      const px = Math.cos(a) * R * 0.2 + Math.cos(a + 0.2) * len * f + (k % 2 ? 1 : -1) * R * 0.06;
      const py = Math.sin(a) * R * 0.2 + Math.sin(a + 0.2) * len * f + (k % 2 ? -1 : 1) * R * 0.06;
      ctx.lineTo(clamp(px, -R * 0.9, R * 0.9), clamp(py, -R * 0.9, R * 0.9));
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Where to point at a flaw once it has been found
function flawSpot(p, R) {
  switch (p.flaw) {
    case 'bump': return { x: Math.cos(p.bumpA) * R * 0.95, y: Math.sin(p.bumpA) * R * 0.95, r: R * (p.bump + 0.25) };
    case 'spot': return { x: Math.cos(p.spotA) * R * p.spotD, y: Math.sin(p.spotA) * R * p.spotD, r: R * (p.spot + 0.18) };
    case 'crack': return { x: Math.cos(p.crackA) * R * 0.55, y: Math.sin(p.crackA) * R * 0.55, r: R * 0.5 };
    default: return { x: 0, y: 0, r: R * 1.15 };
  }
}

function drawPearlScene() {
  const L = marketLayout();
  // sky and the town
  const g = ctx.createLinearGradient(0, -offY, 0, 300);
  g.addColorStop(0, '#8fd0f7'); g.addColorStop(1, '#fdf1d8');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  drawCloud(W * 0.3, 100, 120, 32);
  for (let k = 0; k < 9; k++) {
    const hx = W * k / 8 - 30, hh = 50 + hash(k, 9) * 50;
    ctx.fillStyle = k % 2 ? '#e8d3aa' : '#dcc497';
    ctx.fillRect(hx, 250 - hh, 70, hh + 20);
    ctx.fillStyle = '#b89a6a'; ctx.fillRect(hx - 3, 246 - hh, 76, 6);
    ctx.fillStyle = '#6b5238'; ctx.fillRect(hx + 28, 250 - hh + 18, 12, 14);
  }
  ctx.fillStyle = '#e6cf9f'; ctx.fillRect(-offX, 250, viewW, H - 250);
  // the stalls, each with its keeper behind the table
  const cols = ['#e63946', '#2a9d8f', '#f4a261'];
  const sk = clamp(L.sw / 200, 0.85, 1.3);
  L.stalls.forEach((st, s) => {
    drawStallBack(st.x0 + 2, st.w - 4, L.awTop, L.tableY + 10, cols[s % 3], true);
    const seller = SELLERS[s];
    drawPerson(seller, st.cx, L.tableY + 16, 1.15 * sk, examining ? W / 2 : st.cx, examining ? 400 : L.trayTop + 60);
    // table and velvet tray
    ctx.fillStyle = '#a0703a'; roundRect(st.x0 + 4, L.tableY, st.w - 8, L.trayBot - L.tableY + 30, 8); ctx.fill();
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(st.x0 + 4, L.tableY, st.w - 8, 8);
    ctx.fillStyle = '#3b2a6b'; roundRect(st.x0 + 12, L.trayTop, st.w - 24, L.trayBot - L.trayTop, 10); ctx.fill();
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 2; ctx.stroke();
  });
  // the pearls
  pearls.forEach((p, i) => {
    if (pearlWon && pearlWon.p === p) return;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.35, 0, TAU); ctx.fill();
    ctx.globalAlpha = p.rejected ? 0.35 : 1;
    drawPearl(p.x, p.y, p.r, p);
    ctx.globalAlpha = 1;
    if (p.rejected) {
      ctx.strokeStyle = 'rgba(255,140,140,0.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(p.x - 8, p.y + p.r + 4); ctx.lineTo(p.x + 8, p.y + p.r + 12); ctx.moveTo(p.x + 8, p.y + p.r + 4); ctx.lineTo(p.x - 8, p.y + p.r + 12); ctx.stroke();
    }
    // on level 1 the perfect pearl twinkles now and then
    if (cfg.glint && p.perfect && !p.rejected) {
      const tw = Math.max(0, Math.sin(t * 2.2 + p.phase));
      if (tw > 0.85) { ctx.fillStyle = `rgba(255,255,240,${(tw - 0.85) * 6})`; drawStar(p.x - p.r * 0.35, p.y - p.r * 0.4, p.r * 0.7); }
    }
    if (pearlKb && i === pcursor && !examining) {
      ctx.strokeStyle = `rgba(255,215,90,${0.7 + 0.3 * Math.sin(t * 6)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 9, 0, TAU); ctx.stroke();
    }
  });
  // The merchant with his magnifying glass
  const mk = clamp(W / 640, 1, 1.25);
  MERCHANT.lens = true;
  drawPerson(MERCHANT, 44 * mk, H - 14, 1.1 * mk, W / 2, 500);
  MERCHANT.lens = false;
  // The found pearl lifted up in glory
  if (pearlWon) {
    const p = pearlWon.p;
    const f = ease(clamp(pearlWon.t / 1.2, 0, 1));
    const x = lerp(p.x, W / 2, f), y = lerp(p.y, 400, f);
    const r = lerp(p.r, 60, f);
    const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
    glow.addColorStop(0, 'rgba(255,248,220,0.9)'); glow.addColorStop(1, 'rgba(255,248,220,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
    drawPearl(x, y, r, p);
  }
  drawParticles();
  if (examining) drawLens();
  drawFloaters();
}

function drawLens() {
  const Ls = lensLayout();
  const p = examining;
  const f = ease(clamp(exam.t / 0.25, 0, 1));
  ctx.fillStyle = `rgba(30,20,50,${0.55 * f})`;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  ctx.save();
  ctx.translate(Ls.cx, Ls.cy); ctx.scale(0.6 + 0.4 * f, 0.6 + 0.4 * f);
  // handle
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(Ls.R * 0.72, Ls.R * 0.72); ctx.lineTo(Ls.R * 1.08, Ls.R * 1.08); ctx.stroke();
  // glass
  const bg = ctx.createRadialGradient(0, -Ls.R * 0.3, 10, 0, 0, Ls.R);
  bg.addColorStop(0, '#5a4a8a'); bg.addColorStop(1, '#2a1f4a');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, Ls.R, 0, TAU); ctx.fill();
  drawPearl(0, 0, Ls.R * 0.55, p);
  if (exam.wrong) {
    const fs = flawSpot(p, Ls.R * 0.55 * p.size);
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(fs.x, fs.y, fs.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  // glint on the glass and the gold rim
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(-Ls.R * 0.45, -Ls.R * 0.5, Ls.R * 0.3, Ls.R * 0.12, -0.7, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.arc(0, 0, Ls.R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, Ls.R + 6, 0, TAU); ctx.stroke();
  ctx.restore();
  if (f < 1) return;
  // caption and buttons
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 22px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.lineJoin = 'round';
  const cap = exam.wrong || 'Look closely… is it perfect?';
  ctx.strokeStyle = 'rgba(30,20,50,0.9)'; ctx.strokeText(cap, W / 2, Ls.cy - Ls.R - 30);
  ctx.fillStyle = exam.wrong ? '#ffb3b3' : '#fff3c4'; ctx.fillText(cap, W / 2, Ls.cy - Ls.R - 30);
  if (exam.wrong) return;
  const b = Ls.buy;
  ctx.fillStyle = '#a8741a'; roundRect(b.x - b.w / 2, b.y - b.h / 2 + 4, b.w, b.h, b.h / 2); ctx.fill();
  const bgr = ctx.createLinearGradient(0, b.y - b.h / 2, 0, b.y + b.h / 2);
  bgr.addColorStop(0, '#f7c948'); bgr.addColorStop(1, '#d9961c');
  ctx.fillStyle = bgr; roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 22px Fredoka, sans-serif';
  ctx.fillText('This is the one!', b.x, b.y + 1);
  const k = Ls.back;
  ctx.fillStyle = '#fff'; roundRect(k.x - k.w / 2, k.y - k.h / 2, k.w, k.h, k.h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(224,165,38,0.8)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#a8741a'; ctx.font = '600 17px Fredoka, sans-serif';
  ctx.fillText('Put it back', k.x, k.y + 1);
}

function win() {
  state = 'win';
  const levelBonus = level * 500;
  const score = pts.field + pts.sell1 + pts.pearl + pts.sell2 + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('treasureBest', best); } catch (e) {} }
  lastScore = { ...pts, levelBonus, score };
  const L = sellLayout();
  sparkleBurst(L.seller.x, L.seller.y - 90, 70);
  showMessage('Worth more than everything!', 2.6);
  sfx.win();
  endTimer = 2.6;
}

function fail(reason) {
  if (state !== 'play') return;
  state = 'fail';
  failStage = stage;
  failReason = reason;
  examining = null;
  hint = null;
  sfx.fail();
  endTimer = 1.6;
}

  if (message.t > 0.3) hint = { t: 1.3, text };

}

// ---- Jesus tells the story ----
const introDur = () => (level === 1 ? [4.2, 5.6] : [3.2, 4.2]);
function say(key, dur) { bubble = { key, t: dur }; }

function startIntro(n) {
  stage = n === 1 ? 'intro1' : 'intro2';
  introStep = 0; introT = 0;
  particles = []; floaters = [];
  say(n === 1 ? 'tell1' : 'tell3', introDur()[0]);
  if (n === 1) showMessage(level === 1 ? 'Jesus told the people a story…' : `Level ${level}: ${cfg.name}`, 2.4);
  else showMessage('Jesus went on…', 2);
}

function advanceIntro() {
  if (trans || state !== 'play') return;
  if (introStep === 0) {
    introStep = 1; introT = 0;
    say(stage === 'intro1' ? 'tell2' : 'pearlFound', introDur()[1]);
  } else {
    if (bubble) bubble.t = Math.min(bubble.t, 0.4);
    goStage(stage === 'intro1' ? startField : startPearl);
  }
}

function updateIntro(dt) {
  introT += dt;
  if (!trans && introT > introDur()[introStep]) advanceIntro();
}

// Fade out, switch scene, fade back in
function goStage(fn) {
  if (trans) return;
  trans = { t: 0, fn, called: false };
}
function updateTrans(dt) {
  if (!trans) return;
  trans.t += dt;
  if (!trans.called && trans.t >= 0.45) { trans.called = true; trans.fn(); }
  if (trans && trans.t >= 0.9) trans = null;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Worth everything!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('sellField')}
       <p style="text-align:center">Jesus said that belonging to God&rsquo;s kingdom is the greatest treasure of all &mdash; worth more than everything we have!</p>
       ${verseHTML('pearlWin')}
       <p class="score">Treasure found: <b>${s.field}</b><br>Sold all for the field: <b>${s.sell1}</b><br>Perfect pearl: <b>${s.pearl}</b><br>Sold all for the pearl: <b>${s.sell2}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failStage === 'pearl'
      ? ['The market closed!', 'The stalls packed up before the perfect pearl was found. Look through the glass: the best pearl is <b>round</b>, <b>bright</b> and perfectly <b>smooth</b>.']
      : ['The sun went down!', 'The day ended before the treasure was found. Watch the shimmer: <b>warm</b> colours mean you&rsquo;re close, so dig next to the hottest hole.'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('tell3')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', retryPart);
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,

  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

const keys = new Set();

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  keys.add(e.code);
  if (e.repeat && (e.code === 'Space' || e.code === 'Enter')) return;
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && endTimer < 1.8) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play' || trans) return;
  const act = e.code === 'Space' || e.code === 'Enter';
  if (stage === 'intro1' || stage === 'intro2') { if (act) advanceIntro(); return; }
  if (stage === 'field') {
    const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] }[e.code];
    if (mv) {
      if (cursor.show) { cursor.c = clamp(cursor.c + mv[0], 0, cfg.cols - 1); cursor.r = clamp(cursor.r + mv[1], 0, cfg.rows - 1); }
      cursor.show = true;
    } else if (act) { cursor.show = true; digAt(grid[cursor.r * cfg.cols + cursor.c]); }
    return;
  }
  if (stage === 'sell1' || stage === 'sell2') { if (act) sellNext(); return; }
  if (stage === 'pearl' && (act || e.code.startsWith('Arrow') || e.code === 'Backspace' || e.code === 'KeyX')) pearlKey(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note, pitched by height (0..1)
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // ---- Extra sounds for digging, selling and the market ----
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  dig() { this.noiseBurst(500, 0.22, 0.4, 0.7, 180, 'lowpass'); this.tone(140, 0.12, 'sine', 0.25, 0, 80); },
  clonk() { this.tone(330, 0.12, 'triangle', 0.25); this.tone(250, 0.16, 'triangle', 0.18, 0.07); },
  clunkWood() { this.tone(180, 0.2, 'triangle', 0.35, 0, 120); this.tone(240, 0.15, 'triangle', 0.2, 0.08, 160); },
  clink() { this.tone(1250, 0.14, 'triangle', 0.18); this.tone(1680, 0.2, 'triangle', 0.12, 0.07); },
  // The shimmer: more bells, higher and brighter, the closer the spade is to the chest
  shimmerPing(band) {
    if (!this.ctx) return;
    const n = 6 - band;
    const base = [1047, 1175, 1319, 1568, 1760, 2093, 2349];
    for (let i = 0; i < n; i++) this.tone(base[Math.min(i + (5 - band), 6)], 0.5, 'sine', 0.06 + (5 - band) * 0.012, 0.12 + i * 0.07);
  },
  found() {
    if (!this.ctx) return;
    [1568, 2093, 2637, 3136, 4186].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.13, i * 0.07));
  },
  sellNote(f) { this.tap(f); },
  lens() { this.noiseBurst(1800, 0.25, 0.12, 0.8, 3200); },
  baa() { this.tone(420, 0.35, 'sawtooth', 0.05, 0.05, 380); this.tone(400, 0.25, 'triangle', 0.08, 0.05, 360); },
  cluck() { for (let i = 0; i < 3; i++) this.tone(700 + i * 60, 0.06, 'square', 0.04, 0.05 + i * 0.09, 500); },
};

// ============================================================
//  HUD
// ============================================================
function hudMeter() {
  if (state === 'title') return null;
  if (stage === 'field') return { label: 'DAYLIGHT', f: digsLeft / cfg.digs, text: `${digsLeft} dig${digsLeft === 1 ? '' : 's'}`, cols: ['#ffb347', '#fff1a8'], low: digsLeft <= 3 };
  if (stage === 'sell1' || stage === 'sell2') return sell ? { label: 'COINS', f: sell.coins / sell.price, text: `${sell.coins} / ${sell.price}`, cols: ['#e0a526', '#fff1a8'], low: false } : null;
  if (stage === 'pearl') return { label: 'MARKET', f: timeLeft / cfg.marketTime, text: `${Math.ceil(timeLeft)}s`, cols: ['#9775fa', '#e5dbff'], low: timeLeft < 10 };
  return null;
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + the meter for this part of the story
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  const story = stage === 'intro1' || stage === 'intro2';
  ctx.fillText(state === 'title' ? 'The Hidden Treasure' : story ? 'Jesus tells a story' : `Level ${level} · ${cfg.name}`, 12, 26);
  const m = hudMeter();
  if (m) {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(m.label, 12, 49);
    const bx = 12 + ctx.measureText(m.label).width + 8, bw = 110;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(bx, 38, bw, 13, 6.5); ctx.fill();
    const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    gg.addColorStop(0, m.cols[0]); gg.addColorStop(1, m.cols[1]);
    ctx.fillStyle = m.low && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
    const f = clamp(m.f, 0, 1);
    if (f > 0) { roundRect(bx, 38, Math.max(13, bw * f), 13, 6.5); ctx.fill(); }
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '700 13px Fredoka, sans-serif';
    ctx.fillText(m.text, bx + bw + 8, 49);
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score, and the four parts of the story (dig, sell, pearl, sell)
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SCORE', rx, 20);
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.fillText(`${totalScore}`, rx, 40);
  if (state !== 'title') {
    ctx.shadowBlur = 0;
    const steps = ['field', 'sell1', 'pearl', 'sell2'];
    const at = stage === 'intro1' ? -0.5 : stage === 'intro2' ? 1.5 : steps.indexOf(stage);
    for (let i = 0; i < 4; i++) {
      const x = rx - 8 - (3 - i) * 26, y = 60;
      const done = i < at || state === 'win';
      const now = i === at && state !== 'win';
      ctx.fillStyle = done ? '#69b34c' : now ? '#f7c948' : 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(x, y, now ? 10 : 8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5; ctx.stroke();
      // tiny icons: spade, coin, pearl, coin
      ctx.save(); ctx.translate(x, y);
      if (i === 0) { ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(-3, -5); ctx.lineTo(2, 2); ctx.stroke(); ctx.fillStyle = '#5a4210'; ctx.beginPath(); ctx.ellipse(3, 3.5, 2.6, 3.4, -0.6, 0, TAU); ctx.fill(); }
      else if (i === 2) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, TAU); ctx.fill(); ctx.strokeStyle = '#9a8a6a'; ctx.lineWidth = 1; ctx.stroke(); }
      else { ctx.fillStyle = '#e0a526'; ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, TAU); ctx.fill(); ctx.strokeStyle = '#8a6a1e'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.restore();
    }
  }
  ctx.restore();
}

// Messages sit in open sky above each scene
function messageY() {
  if (inStory()) return 150 + Math.max(0, offY) * 0.4;
  if (stage === 'field') return offY + 176;
  if (stage === 'pearl') return offY + (examining ? 200 : 190);
  return offY + 318;
}
function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = messageY();
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

// ============================================================
//  Rendering
// ============================================================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (inStory()) drawStory();
  else if (stage === 'field') drawFieldScene();
  else if (stage === 'sell1' || stage === 'sell2') drawSellScene();
  else if (stage === 'pearl') drawPearlScene();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  if (trans) {
    const a = trans.t < 0.45 ? trans.t / 0.45 : 1 - (trans.t - 0.45) / 0.45;
    ctx.fillStyle = `rgba(255,246,220,${clamp(a, 0, 1)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  updateTrans(dt);
  if (state === 'play') {
    if (stage === 'intro1' || stage === 'intro2') updateIntro(dt);
    else if (stage === 'field') updateField(dt);
    else if (stage === 'sell1' || stage === 'sell2') updateSell(dt);
    else if (stage === 'pearl') updatePearl(dt);
  } else if (state === 'win') {
    if (Math.random() < dt * 10) spawn(rand(0, W), rand(120, 500), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  }
  if (hint) { hint.t -= dt; if (hint.t <= 0) { showMessage(hint.text, 2.4); hint = null; } }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0 && !(state === 'play' && (stage === 'intro1' || stage === 'intro2'))) bubble = null; }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
