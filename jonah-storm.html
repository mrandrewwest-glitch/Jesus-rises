function makeConfig(n) {
  const k = Math.min(n, 9) - 1;
  return {
    name: LEVEL_NAMES[n - 1] || `The Great Storm ${n - 5}`,
    dur: 36 + Math.min(k, 6) * 5,                    // seconds until the storm's end
    cargo: 6 + k * 2,                                 // cargo that comes up from the hold
    onDeck: Math.min(3 + k, 6),                       // cargo on deck at the start
    maxDeck: Math.min(5 + k, 9),
    cargoEvery: Math.max(2.2, 5.2 - k * 0.55),
    leakEvery: n === 1 ? 7.5 : Math.max(2.8, 6.4 - k * 0.7),
    leakRate: 0.012 + k * 0.0022,
    leakTaps: n >= 4 ? 2 : 1,
    maxLeaks: Math.min(2 + k, 6),
    waveEvery: Math.max(2.8, 7 - k * 0.8),
    wavePow: 0.55 + k * 0.13,
    splash: 0.04 + k * 0.007,
    gusts: n >= 3,
    gustEvery: Math.max(5.5, 11 - k),
    gustPow: 0.13 + k * 0.022,
    scoop: n === 1 ? 0.085 : n === 2 ? 0.07 : 0.06,
    limit: n === 1 ? 0.26 : Math.max(0.19, 0.25 - k * 0.012),
    sway: 0.4 + k * 0.12,                             // background rocking
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | pause | win | fail
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let ship = { a: 0, w: 0, assist: 0, bob: 0 };
let cargo = [], leaks = [], puddles = [], flying = [], waves = [];
let gust = null;
let storm = 0, stormTarget = 0;
let stormT = 0;
let nextCargo = 0, nextLeak = 0, nextWave = 0, nextGust = 0, cargoLeft = 0;
let tossed = 0, patched = 0, scoops = 0;
let water = 0;
let flashT = 0, shakeT = 0, lightT = 0, nextLight = 6;
let endTimer = 0, winT = 0, failT = 0, playT = 0;
let lastScore = null;
let told = {};
let introT = 0, introStep = 0, introFade = 0, introSteps = [];
let attempted = 0;
let jonah = { where: 'below', x: 0, y: 0, lift: 0 };
let fish = null;
let overT = 0;            // time spent tipped over the limit
let liftFx = [];          // little "heave!" arrows where the player tapped
let tapHints = [];        // bouncing hands for 5-year-olds

const SAILORS = [
  { robe: '#3f6fb5', hair: '#3a2716', beard: true,  skin: '#d9a066', band: '#e8dcc0', u: -0.62 },
  { robe: '#b5503f', hair: '#2e1d10', beard: false, skin: '#c98d56', band: '#f2c230', u: 0.32 },
  { robe: '#6b8e3a', hair: '#5c3a1c', beard: true,  skin: '#d7a070', band: '#c0392b', u: 0.7 },
].map((d, i) => ({ ...d, i, phase: rand(0, TAU), blink: 0, blinkT: rand(1, 4), cheer: 0 }));
const JONAH = { robe: '#8a5a9e', hair: '#4a2f1a', beard: true, skin: '#d9a066', belt: '#e0c070', blink: 0, phase: 0 };

// ============================================================
//  Ship geometry
// ============================================================
function half() { return clamp(W * 0.43, 205, 380); }
function hatchU() { return -0.2; }
function shipCenter() {
  const deckLoad = cargo.length;
  return { x: W / 2, y: SEA - 26 + ship.bob + water * 30 + deckLoad * 1.5 };
}
function toWorld(lx, ly) {
  const c = shipCenter(), ca = Math.cos(ship.a), sa = Math.sin(ship.a);
  return { x: c.x + lx * ca - ly * sa, y: c.y + lx * sa + ly * ca };
}
function toLocal(px, py) {
  const c = shipCenter(), ca = Math.cos(ship.a), sa = Math.sin(ship.a);
  const dx = px - c.x, dy = py - c.y;
  return { x: dx * ca + dy * sa, y: -dx * sa + dy * ca };
}
function mastH() { return Math.min(340, SEA - 150 + offY * 0.4); }

// The sea surface (playfield y) at x
function seaY(x, wk = 1) {
  const amp = 0.25 + storm * 0.75 * cfg.sway;
  let y = SEA + (Math.sin(x * 0.011 + t * 1.7) * 16 + Math.sin(x * 0.023 - t * 2.6) * 8) * amp * Math.max(0.15, storm);
  for (const w of waves) {
    const d = (x - w.x) / 110;
    y -= Math.exp(-d * d) * w.h * wk;
  }
  return y;
}

// ============================================================
//  Cargo, leaks and water
// ============================================================
const CARGO_KINDS = {
  crate:  { w: 52, h: 46, wt: 1.0 },
  barrel: { w: 44, h: 52, wt: 1.2 },
  jar:    { w: 34, h: 56, wt: 0.75 },
  sack:   { w: 50, h: 36, wt: 0.9 },
};
function addCargo(u, pop = 1) {
  const kind = pick(Object.keys(CARGO_KINDS));
  const k = CARGO_KINDS[kind];
  const c = { kind, w: k.w, h: k.h, wt: k.wt, lx: u * half(), v: 0, pop, wob: rand(0, TAU), col: pick(['#b8683a', '#a65a33', '#c47a45']) };
  cargo.push(c);
  return c;
}
function freeSpot() {
  const hf = half();
  for (let k = 0; k < 40; k++) {
    const u = rand(-0.8, 0.8);
    if (Math.abs(u - hatchU()) < 0.12 && k < 30) continue;
    if (cargo.every((c) => Math.abs(c.lx - u * hf) > 56)) return u;
  }
  return rand(-0.8, 0.8);
}
function addWater(lx, amt) {
  const hf = half();
  lx = clamp(lx, -hf + 40, hf - 40);
  let p = puddles.find((q) => Math.abs(q.lx - lx) < 70);
  if (!p) { p = { lx, amt: 0, ph: rand(0, TAU) }; puddles.push(p); }
  p.amt += amt;
  return p;
}
function puddleRx(p) { return Math.min(110, 18 + Math.sqrt(p.amt) * 95); }

function addLeak() {
  const hf = half();
  let u = 0;
  for (let k = 0; k < 30; k++) {
    u = rand(-0.78, 0.78);
    if (leaks.every((l) => Math.abs(l.lx - u * hf) > 70)) break;
  }
  const l = { lx: u * hf, taps: 0, need: cfg.leakTaps, age: 0, patchT: 0, done: false };
  leaks.push(l);
  sfx.knock();
  if (!told.leak) { told.leak = true; showMessage('A leak! Tap it to patch it', 2.6); }
  if (level <= 2) tapHints.push({ kind: 'leak', ref: l, t: 4 });
}

function spawnWave() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const pow = cfg.wavePow * rand(0.8, 1.15);
  waves.push({ x: W / 2 - dir * (W / 2 + 160), dir, pow, h: 0, maxH: 46 + pow * 34, hit: false, life: 0 });
  if (!told.wave) { told.wave = true; showMessage('A big wave is coming!', 2.2); }
}

function updateWaves(dt) {
  const c = shipCenter();
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life += dt;
    w.x += w.dir * 300 * dt;
    w.h = Math.min(w.maxH, w.life * 90) * storm;
    if (!w.hit && Math.abs(w.x - (c.x - w.dir * half() * 0.6)) < 30 && state === 'play') {
      w.hit = true;
      ship.w += w.dir * w.pow * 0.5;
      const sideX = -w.dir * half() * 0.72;
      addWater(sideX, cfg.splash * w.pow / cfg.wavePow * (1 + cargo.length * 0.1));
      const p = toWorld(sideX * 1.15, DECK - 20);
      splashBurst(p.x, p.y, 22);
      sfx.splash(0.8);
      shakeT = 0.25;
      if (!told.puddle) { told.puddle = true; showMessage('Tap the water to bail it out!', 2.6); }
    }
    if (Math.abs(w.x - W / 2) > W / 2 + 400) waves.splice(i, 1);
  }
}

// ============================================================
//  Tapping things
// ============================================================
function hitTest(px, py) {
  const L = toLocal(px, py);
  let bestHit = null, bestD = Infinity;
  for (const c of cargo) {
    if (c.pop < 0.6) continue;
    const dx = Math.abs(L.x - c.lx) - c.w / 2, top = DECK - c.h - 20, bot = DECK + 26;
    if (dx < 18 && L.y > top && L.y < bot) {
      const d = Math.hypot(L.x - c.lx, L.y - (DECK - c.h / 2));
      if (d < bestD) { bestD = d; bestHit = { kind: 'cargo', ref: c }; }
    }
  }
  for (const l of leaks) {
    if (l.done) continue;
    const d = Math.hypot(L.x - l.lx, (L.y - (DECK - 16)) * 0.8) * 0.7;
    if (d < 40 && d < bestD) { bestD = d; bestHit = { kind: 'leak', ref: l }; }
  }
  for (const p of puddles) {
    const rx = puddleRx(p);
    if (Math.abs(L.x - p.lx) < rx + 12 && L.y > DECK - 52 && L.y < DECK + 26) {
      const d = Math.abs(L.x - p.lx) * 0.6 + 14;
      if (d < bestD) { bestD = d; bestHit = { kind: 'puddle', ref: p }; }
    }
  }
  return bestHit;
}

function tossCargo(c) {
  const i = cargo.indexOf(c);
  if (i < 0) return;
  cargo.splice(i, 1);
  const side = c.lx >= 0 ? 1 : -1;
  const p = toWorld(c.lx, DECK - c.h / 2);
  flying.push({ ...c, x: p.x, y: p.y, vx: side * rand(240, 320), vy: -rand(380, 460), rot: ship.a, vr: side * rand(4, 7) });
  tossed++;
  sfx.whoosh();
  sfx.tap(0.3 + Math.min(0.6, tossed * 0.03));
  // the nearest sailor heaves
  let near = SAILORS[0];
  for (const s of SAILORS) if (Math.abs(s.u * half() - c.lx) < Math.abs(near.u * half() - c.lx)) near = s;
  near.cheer = 0.8;
  tapHints = tapHints.filter((h) => h.ref !== c);
}

function patchLeak(l) {
  l.taps++;
  sfx.knock();
  const p = toWorld(l.lx, DECK - 10);
  for (let k = 0; k < 6; k++) spawn(p.x, p.y, rand(-80, 80), rand(-160, -60), 0.5, '#c9a46a', 3, 500);
  if (l.taps >= l.need) {
    l.done = true; l.patchT = 0;
    patched++;
    sfx.ding();
    const pd = puddles.find((q) => Math.abs(q.lx - l.lx) < 70);
    if (pd) pd.amt = Math.max(0, pd.amt - cfg.scoop);
    tapHints = tapHints.filter((h) => h.ref !== l);
  } else if (!told.twoTaps) { told.twoTaps = true; showMessage('Big leaks need two taps!', 2.2); }
}

function scoopPuddle(p) {
  const amt = Math.min(p.amt, cfg.scoop);
  p.amt -= amt;
  scoops++;
  sfx.scoop();
  const side = p.lx >= 0 ? 1 : -1;
  const w = toWorld(p.lx, DECK - 14);
  for (let k = 0; k < 10; k++) spawn(w.x, w.y, side * rand(120, 260), rand(-360, -200), rand(0.6, 0.9), k % 2 ? '#bfe6ff' : '#ffffff', rand(3, 5), 900);
}

function liftSide(side) {
  // lifting a side turns the ship the other way
  ship.w += -side * 0.3;
  ship.assist = clamp(ship.assist - side * 0.95, -2.6, 2.6);
  const p = toWorld(side * half() * 0.8, -10);
  liftFx.push({ x: p.x, y: p.y, t: 0.6 });
  sfx.tap(0.15);
  for (const s of SAILORS) if (Math.sign(s.u) === side) s.cheer = 0.5;
}

function playTap(px, py) {
  const hit = hitTest(px, py);
  if (hit) {
    if (hit.kind === 'cargo') tossCargo(hit.ref);
    else if (hit.kind === 'leak') patchLeak(hit.ref);
    else scoopPuddle(hit.ref);
    return;
  }
  // anywhere else: lift that side of the ship
  liftSide(px < shipCenter().x ? -1 : 1);
}

// ============================================================
//  Overlay screens and the flow of a level
// ============================================================
function titleScreen() {
  state = 'title';
  syncAmbience();
  cfg = makeConfig(1);
  resetLevel();
  storm = stormTarget = 0.35;
  showOverlay('Storm at Sea', 'Jonah 1 · Keep the ship afloat!',
    `${verseHTML('storm')}
     <ul>
       <li>Jonah ran away from God on a ship. Now a <b>great storm</b> is shaking it!</li>
       <li><b>Tap the cargo</b> (crates, barrels, jars) to throw it overboard and make the ship lighter.</li>
       <li><b>Tap a leak</b> to patch it, and <b>tap the water</b> on the deck to bail it out.</li>
       <li>When the ship tips, <b>tap the low side</b> to lift it up again.</li>
       <li>Keep the water meter low until the storm ends!</li>
       <li><b>Keys:</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> lift a side, <kbd>Space</kbd> throws cargo, <kbd>&darr;</kbd> patches and bails.</li>
     </ul>
     ${verseHTML('cargo')}
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Set sail', () => { level = 1; totalScore = 0; attempted = 0; startLevel(); });
}

function resetLevel() {
  cfg = makeConfig(level);
  particles = []; flying = []; waves = []; leaks = []; puddles = []; cargo = []; liftFx = []; tapHints = [];
  ship = { a: 0, w: 0, assist: 0, bob: 0 };
  gust = null;
  stormT = 0; playT = 0; winT = 0; failT = 0; overT = 0;
  tossed = 0; patched = 0; scoops = 0; water = 0;
  flashT = shakeT = lightT = 0; nextLight = rand(5, 9);
  endTimer = 0;
  told = {};
  fish = null;
  jonah = { where: 'below', x: 0, y: 0, lift: 0 };
  keys.clear();
  for (let i = 0; i < cfg.onDeck; i++) addCargo(freeSpot(), 1);
  cargoLeft = cfg.cargo;
  nextCargo = cfg.cargoEvery * 0.8;
  nextLeak = level === 1 ? 5 : cfg.leakEvery * 0.6;
  nextWave = level === 1 ? 6 : cfg.waveEvery * 0.7;
  nextGust = cfg.gustEvery * 0.6;
  for (const s of SAILORS) s.cheer = 0;
}

function startLevel(retry = false) {
  resetLevel();
  hideOverlay();
  sfx.levelStart();
  if (retry || attempted > 0) { storm = stormTarget = 1; beginPlay(); return; }
  attempted++;
  state = 'intro';
  syncAmbience();
  introT = 0; introStep = 0; introFade = 0;
  introSteps = level === 1 ? ['flee', 'storm'] : ['asleep'];
  if (level === 1) { storm = stormTarget = 0.12; jonah.where = 'walk'; }
  else { storm = stormTarget = 0.8; }
  showMessage(level === 1 ? 'Jonah runs away…' : `Level ${level}: ${cfg.name}`, 2.2);
}

function advanceIntro() {
  if (introFade > 0) return;
  if (introStep < introSteps.length - 1) {
    introStep++; introT = 0;
    if (introSteps[introStep] === 'storm') { stormTarget = 1; jonah.where = 'below'; sfx.rumble(); flashT = 0.3; }
  } else introFade = 0.001;
}

function updateIntro(dt) {
  introT += dt;
  if (jonah.where === 'walk') {
    jonah.x = lerp(-0.9, hatchU(), clamp(introT / 2.4, 0, 1));
    if (introT > 2.8) jonah.where = 'below';
  }
  if (introFade > 0) {
    introFade += dt;
    if (introFade > 0.5) { stormTarget = 1; beginPlay(); }
    return;
  }
  if (introT > (level === 1 ? 5 : 4.2)) advanceIntro();
}

function beginPlay() {
  state = 'play';
  syncAmbience();
  introFade = 0;
  jonah.where = 'below';
  stormTarget = 1;
  attempted = Math.max(attempted, 1);
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  if (level === 1) {
    setTimeout(() => { if (state === 'play' && !told.cargo) { told.cargo = true; showMessage('Tap the cargo to throw it overboard!', 3); } }, 2300);
    tapHints.push({ kind: 'cargo', ref: cargo[0], t: 6 });
  }
}

function winLevel() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const survive = 300 + level * 200;
  const cargoBonus = tossed * 40;
  const patchBonus = patched * 40;
  const dryBonus = Math.round((1 - water) * 600);
  const score = survive + cargoBonus + patchBonus + dryBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
  lastScore = { survive, cargoBonus, patchBonus, dryBonus, score };
  waves = []; gust = null; leaks = [];
  tapHints = [];
  jonah.where = 'rise'; jonah.y = 0;
  fish = { y: SEA + 460, mouth: 0, wink: 0, show: false, gulped: false };
  showMessage('Jonah wakes up…', 2);
  endTimer = 11;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('Too much water in the ship!', 2.4);
  sfx.splash(1);
  sfx.fail();
  endTimer = 2.4;
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('The sea is calm!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('calm')}
       <p style="text-align:center">Jonah ran away from God, but God did not give up on him. God sent a great fish to keep him safe!</p>
       ${verseHTML('fish')}
       <p class="score">Kept afloat: <b>${s.survive}</b><br>Cargo thrown (${tossed}): <b>${s.cargoBonus}</b><br>Leaks patched (${patched}): <b>${s.patchBonus}</b><br>Dry deck: <b>${s.dryBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      level < 6 ? 'Next storm' : 'An even bigger storm!', () => { level++; attempted = 0; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Oh no… so much water!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Throw the <b>cargo</b> over quickly, <b>patch the leaks</b>, <b>bail the water</b>, and tap the <b>low side</b> when the ship tips.</p>
       ${verseHTML('cargo')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

// ============================================================
//  Updating the storm
// ============================================================
function updateShip(dt) {
  const hf = half();
  let torque = -K_RIGHT * ship.a + ship.assist;
  if (state === 'play') {
    for (const c of cargo) torque += (c.lx / hf) * c.wt * 0.55 * c.pop;
    for (const p of puddles) torque += (p.lx / hf) * p.amt * 1.2;
    if (gust) torque += gust.dir * cfg.gustPow * K_RIGHT * Math.min(1, gust.t / 0.4, (gust.dur - gust.t) / 0.4);
    // the storm keeps the ship rocking
    torque += Math.sin(t * 1.3) * 0.25 * storm * cfg.sway;
  } else if (state === 'win') {
    ship.a *= Math.exp(-2 * dt); ship.w *= Math.exp(-3 * dt);
  }
  ship.w += torque * dt;
  ship.w *= Math.exp(-DAMP * dt);
  ship.a = clamp(ship.a + ship.w * dt, -0.48, 0.48);
  ship.assist *= Math.exp(-1.5 * dt);
  const c = W / 2;
  ship.bob = ((seaY(c - hf * 0.5) + seaY(c + hf * 0.5)) / 2 - SEA) * 0.7;

  // cargo slides toward the low side
  const sa = Math.sin(ship.a);
  for (const k of cargo) {
    k.pop = Math.min(1, k.pop + dt * 3);
    k.v += sa * 560 * dt / k.wt;
    k.v *= Math.exp((Math.abs(sa) < 0.06 ? -6 : -1.4) * dt);
    k.lx += k.v * dt;
    const lim = hf - 26 - k.w / 2;
    if (Math.abs(k.lx) > lim) { k.lx = Math.sign(k.lx) * lim; k.v = 0; }
    k.wob += dt * (2 + Math.abs(k.v) * 0.05);
  }
  cargo.sort((a, b) => a.lx - b.lx);
  for (let i = 1; i < cargo.length; i++) {
    const a = cargo[i - 1], b = cargo[i];
    const need = (a.w + b.w) / 2 + 2 - (b.lx - a.lx);
    if (need > 0) { a.lx -= need / 2; b.lx += need / 2; const v = (a.v + b.v) / 2; a.v = b.v = v; }
  }
  // water sloshes toward the low side
  for (const p of puddles) {
    p.lx = clamp(p.lx + sa * 90 * dt, -hf + 40, hf - 40);
    p.ph += dt * 3;
  }
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i];
    if (p.amt < 0.004) { puddles.splice(i, 1); continue; }
    for (let j = 0; j < i; j++) if (Math.abs(puddles[j].lx - p.lx) < 40) { puddles[j].amt += p.amt; puddles.splice(i, 1); break; }
  }
}

function updatePlay(dt) {
  playT += dt;
  stormT += dt;
  const hf = half();

  // cargo comes up from the hold
  nextCargo -= dt;
  if (nextCargo <= 0 && cargoLeft > 0) {
    if (cargo.length < cfg.maxDeck) {
      const c = addCargo(hatchU(), 0);
      c.v = rand(-60, 60);
      cargoLeft--;
      sfx.bump();
      const p = toWorld(hatchU() * hf, DECK - 20);
      for (let k = 0; k < 6; k++) spawn(p.x, p.y, rand(-60, 60), rand(-120, -40), 0.5, 'rgba(200,190,170,0.7)', 5, 0, false, 'puff');
    }
    nextCargo = cfg.cargoEvery * rand(0.8, 1.2);
  }
  // leaks spring open
  nextLeak -= dt;
  if (nextLeak <= 0) {
    if (leaks.filter((l) => !l.done).length < cfg.maxLeaks) addLeak();
    nextLeak = cfg.leakEvery * rand(0.75, 1.25);
  }
  for (let i = leaks.length - 1; i >= 0; i--) {
    const l = leaks[i];
    l.age += dt;
    if (l.done) { l.patchT += dt; if (l.patchT > 3) leaks.splice(i, 1); continue; }
    addWater(l.lx, cfg.leakRate * dt * Math.min(1, l.age * 2));
  }
  // big waves
  nextWave -= dt;
  if (nextWave <= 0) { spawnWave(); nextWave = cfg.waveEvery * rand(0.8, 1.2); }
  // gusts of wind
  if (cfg.gusts) {
    if (gust) { gust.t += dt; if (gust.t > gust.dur) gust = null; }
    else {
      nextGust -= dt;
      if (nextGust <= 0) {
        gust = { dir: Math.random() < 0.5 ? -1 : 1, t: 0, dur: rand(2.4, 3.4) };
        nextGust = cfg.gustEvery * rand(0.8, 1.2);
        sfx.whoosh();
        if (!told.gust) { told.gust = true; showMessage('A gust of wind! Tap the LOW side!', 2.6); }
      }
    }
  }
  // tipped too far: the sea pours over the low side
  const over = Math.abs(ship.a) - cfg.limit;
  if (over > 0) {
    overT += dt;
    addWater(Math.sign(ship.a) * hf * 0.78, (0.03 + over * 1.6) * dt);
    if (Math.random() < dt * 14) { const p = toWorld(Math.sign(ship.a) * hf, DECK); splashBurst(p.x, p.y, 3); }
  } else overT = 0;
  if (Math.abs(ship.a) > cfg.limit * 0.65 && !told.tilt) { told.tilt = true; showMessage('The ship is tipping! Tap the LOW side!', 2.6); }

  water = puddles.reduce((s, p) => s + p.amt, 0);
  if (water >= 1) { water = 1; fail(); return; }
  if (stormT >= cfg.dur) winLevel();
}

function updateFlying(dt) {
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    f.vy += 900 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.vy > 0 && f.y > seaY(f.x) + 8) {
      splashBurst(f.x, seaY(f.x), 16);
      sfx.splash(0.6);
      flying.splice(i, 1);
    }
  }
}

function updateFinale(dt) {
  winT += dt;
  for (const p of puddles) p.amt = Math.max(0, p.amt - dt * 0.05);
  const hf = half();
  // Jonah climbs up and says "throw me into the sea"
  if (jonah.where === 'rise') {
    jonah.y = clamp(winT / 0.8, 0, 1);
    jonah.x = hatchU();
    if (winT > 3.6) {
      jonah.where = 'fly';
      const p = toWorld(hatchU() * hf, DECK);
      jonah.fx = p.x; jonah.fy = p.y; jonah.ft = 0;
      for (const s of SAILORS) s.cheer = 1;
      sfx.whoosh();
    }
  } else if (jonah.where === 'fly') {
    jonah.ft += dt;
    const f = clamp(jonah.ft / 1.1, 0, 1);
    const tx = W / 2 + hf * 0.62, ty = SEA + 110;
    jonah.x = lerp(jonah.fx, tx, f); jonah.y = lerp(jonah.fy, ty, f) - Math.sin(f * Math.PI) * 170;
    if (f >= 1) {
      jonah.where = 'swim';
      splashBurst(jonah.x, ty - 10, 30);
      sfx.splash(1.2);
      stormTarget = 0;
      showMessage('The sea is calm!', 2.4);
    }
  } else if (jonah.where === 'swim') {
    jonah.y = SEA + 110 + Math.sin(t * 3) * 4;
  }
  // the great fish comes, gently
  if (winT > 6.0 && fish) {
    fish.show = true;
    const f = ease(clamp((winT - 6.0) / 1.2, 0, 1));
    fish.y = lerp(SEA + 460, SEA + 165, f);
    fish.mouth = winT < 6.9 ? 0 : winT < 7.4 ? (winT - 6.9) / 0.5 : winT < 8.0 ? 1 : Math.max(0, 1 - (winT - 8.0) / 0.3);
    if (winT > 7.4 && jonah.where === 'swim') { jonah.where = 'gulp'; jonah.gx = jonah.x; jonah.gy = jonah.y; jonah.gt = 0; }
    if (jonah.where === 'gulp') {
      jonah.gt += dt;
      const m = fishMouth();
      const g = clamp(jonah.gt / 0.5, 0, 1);
      jonah.x = lerp(jonah.gx, m.x, g); jonah.y = lerp(jonah.gy, m.y, g);
      jonah.s = 1 - g * 0.7;
      if (g >= 1) { jonah.where = 'inside'; sfx.gulp(); fish.gulped = true; }
    }
    if (winT > 8.4 && !fish.hearts) { fish.hearts = true; const m = fishMouth(); sparkleBurst(m.x - 120, m.y - 60, 30); sfx.chime(); showMessage('Jonah is safe inside the great fish!', 3); }
    fish.wink = winT > 8.6 && winT < 9.3 ? 1 : 0;
    if (fish.hearts && Math.random() < dt * 4) { const m = fishMouth(); spawn(m.x - rand(40, 220) * fishScale(), fish.y - 120 * fishScale(), rand(-20, 20), -50, 1.6, '#ff8fb0', 8, -10, false, 'heart'); }
  }
}
function fishScale() { return clamp(W / 560, 0.82, 1.15); }
function fishX() { return W / 2 + half() * 0.62 - 178 * fishScale(); }
function fishMouth() { const s = fishScale(); return { x: fishX() + 165 * s, y: fish.y + 22 * s }; }

function updateSailors(dt) {
  for (const s of SAILORS) {
    s.blinkT -= dt;
    if (s.blinkT <= 0) { s.blink = 0.13; s.blinkT = rand(1.5, 5); }
    if (s.blink > 0) s.blink -= dt;
    s.cheer = Math.max(0, s.cheer - dt);
  }
  JONAH.blink = 0;
}

// ============================================================
//  Input
// ============================================================
function gameKey(e) {
  if (state === 'intro' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat) { advanceIntro(); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') liftSide(-1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') liftSide(1);
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    // throw the cargo nearest the low side
    if (cargo.length) {
      const s = Math.sign(ship.a) || 1;
      let c = cargo[0];
      for (const k of cargo) if (k.pop > 0.6 && k.lx * s > c.lx * s) c = k;
      tossCargo(c);
    }
  } else if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'KeyB') {
    const l = leaks.find((q) => !q.done);
    if (l) patchLeak(l);
    else if (puddles.length) scoopPuddle(puddles.reduce((a, b) => (b.amt > a.amt ? b : a)));
  }
}

function gamePress(p) {
  if (state === 'intro') { advanceIntro(); return; }
  if (state === 'win' && winT > 2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  playTap(p.x, p.y);
}

// For tests: where a thing is on the screen (CSS pixels)
function screenPos(x, y) { return { x: (x + offX) * scale / dpr, y: (y + offY) * scale / dpr }; }
function targetInfo() {
  return {
    cargo: cargo.filter((c) => c.pop > 0.6).map((c) => { const p = toWorld(c.lx, DECK - c.h / 2); return { ...screenPos(p.x, p.y), lx: c.lx }; }),
    leaks: leaks.filter((l) => !l.done).map((l) => { const p = toWorld(l.lx, DECK - 14); return { ...screenPos(p.x, p.y), lx: l.lx }; }),
    puddles: puddles.map((q) => { const p = toWorld(q.lx, DECK - 12); return { ...screenPos(p.x, p.y), amt: q.amt, lx: q.lx }; }),
    a: ship.a, limit: cfg.limit, water,
    left: screenPos(W / 2 - half() * 0.8, SEA + 120), right: screenPos(W / 2 + half() * 0.8, SEA + 120),
  };
}

// ============================================================
//  Rendering: sky, sea and storm
// ============================================================
function drawSky() {
  const top = -offY;
  const g = ctx.createLinearGradient(0, top, 0, SEA);
  const s = storm;
  g.addColorStop(0, mix('#7fbde6', '#232a44', s));
  g.addColorStop(0.7, mix('#bfe2f2', '#3d4a68', s));
  g.addColorStop(1, mix('#f3e3c0', '#56637e', s));
  ctx.fillStyle = g;
  ctx.fillRect(-offX - 2, top, viewW + 4, SEA - top + 40);
  // sun (when calm)
  if (s < 0.7) {
    ctx.globalAlpha = 1 - s / 0.7;
    const sx = W * 0.8, sy = Math.max(top + 150, 180);
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 140);
    sg.addColorStop(0, 'rgba(255,245,200,1)'); sg.addColorStop(0.3, 'rgba(255,230,150,0.6)'); sg.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 140, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // clouds: dark in the storm, white when calm
  const cTop = mix('#ffffff', '#4a5470', s), cUnder = mix('#e6eef6', '#363e58', s);
  for (let i = 0; i < 6; i++) {
    const w = 260 + (i % 3) * 90;
    const x = ((i * 337 + t * (8 + s * 30) * (i % 2 ? 1 : 0.7)) % (W + 600)) - 300;
    const y = top + 40 + (i % 3) * 70 + Math.max(0, offY) * 0.2 + (i > 2 ? 140 : 0);
    drawCloud(x, y, w, 70 + (i % 2) * 20, cTop, cUnder);
  }
  // far lightning glow
  if (lightT > 0) {
    ctx.fillStyle = `rgba(230,235,255,${lightT * 0.5})`;
    ctx.fillRect(-offX, top, viewW, SEA - top);
  }
}

function drawSeaLayer(back) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const s = storm;
  ctx.beginPath();
  ctx.moveTo(x0, H + 20);
  for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, seaY(x, back ? 1 : 0.35) + (back ? -10 : 18) + (back ? Math.sin(x * 0.02 + t) * 6 * s : 0));
  ctx.lineTo(x1, H + 20);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, SEA - 60, 0, H);
  if (back) {
    g.addColorStop(0, mix('#4fa6c8', '#2b5876', s)); g.addColorStop(1, mix('#2f7fa8', '#1b3550', s));
  } else {
    g.addColorStop(0, mix('#5bb4d4', '#33698a', s)); g.addColorStop(1, mix('#2a6f99', '#173049', s));
  }
  ctx.fillStyle = g;
  ctx.fill();
  if (!back) {
    // foam on the crests
    ctx.strokeStyle = `rgba(235,248,255,${0.35 + 0.35 * s})`;
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 12) { const y = seaY(x, 0.35) + 18; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    for (const w of waves) {
      if (w.h < 10) continue;
      ctx.fillStyle = 'rgba(240,250,255,0.85)';
      for (let k = -2; k <= 2; k++) {
        const x = w.x + k * 18 + w.dir * 30;
        ctx.beginPath(); ctx.arc(x, seaY(x) - 8, 7 - Math.abs(k), 0, TAU); ctx.fill();
      }
    }
  }
}

function drawRain() {
  if (storm < 0.25) return;
  const slant = (gust ? gust.dir * 0.6 : 0.2);
  ctx.strokeStyle = `rgba(210,225,245,${0.35 * storm})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const n = Math.round(70 * storm * (viewW / 600));
  const top = -offY;
  for (let i = 0; i < n; i++) {
    const x = ((hash(i, 1) * (viewW + 200) + t * 120 * slant) % (viewW + 200)) - offX - 100;
    const y = top + ((hash(i, 2) * (H + offY) + t * 700) % (H + offY));
    ctx.moveTo(x, y); ctx.lineTo(x - slant * 18, y + 22);
  }
  ctx.stroke();
  if (gust) {
    // wind streaks
    ctx.strokeStyle = 'rgba(240,248,255,0.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const x = ((hash(i, 5) * W + gust.t * 900 * gust.dir) % (W + 200) + W + 200) % (W + 200) - 100;
      const y = 180 + hash(i, 6) * 300;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + gust.dir * 40, y - 8, x + gust.dir * 90, y); ctx.stroke();
    }
  }
}

// ============================================================
//  Rendering: the ship
// ============================================================
function drawCargo(c) {
  ctx.save();
  ctx.translate(c.lx, DECK);
  const s = ease(clamp(c.pop, 0, 1));
  ctx.scale(s, s);
  ctx.rotate(Math.sin(c.wob) * Math.min(0.12, Math.abs(c.v) * 0.002));
  const w = c.w, h = c.h;
  ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  if (c.kind === 'crate') {
    ctx.fillStyle = '#c99556'; ctx.strokeStyle = '#7a5428';
    roundRect(-w / 2, -h, w, h, 5); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w / 2 + 5, -h + 5); ctx.lineTo(w / 2 - 5, -5); ctx.moveTo(w / 2 - 5, -h + 5); ctx.lineTo(-w / 2 + 5, -5); ctx.stroke();
    ctx.strokeRect(-w / 2 + 3, -h + 3, w - 6, h - 6);
  } else if (c.kind === 'barrel') {
    ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#6a4220';
    ctx.beginPath(); ctx.moveTo(-w / 2 + 5, 0); ctx.quadraticCurveTo(-w / 2 - 4, -h / 2, -w / 2 + 5, -h);
    ctx.lineTo(w / 2 - 5, -h); ctx.quadraticCurveTo(w / 2 + 4, -h / 2, w / 2 - 5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#4a4a52'; ctx.lineWidth = 3.5;
    for (const f of [0.18, 0.82]) { ctx.beginPath(); ctx.moveTo(-w / 2 + 1, -h * f); ctx.lineTo(w / 2 - 1, -h * f); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(90,50,20,0.5)'; ctx.lineWidth = 1.5;
    for (const f of [-0.2, 0.2]) { ctx.beginPath(); ctx.moveTo(f * w, -2); ctx.lineTo(f * w, -h + 2); ctx.stroke(); }
  } else if (c.kind === 'jar') {
    ctx.fillStyle = c.col; ctx.strokeStyle = shade(c.col, -50);
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-w / 2 - 2, -h * 0.35, -w / 2 + 2, -h * 0.6);
    ctx.quadraticCurveTo(-w / 2 + 6, -h * 0.82, -6, -h * 0.86); ctx.lineTo(-6, -h); ctx.lineTo(6, -h); ctx.lineTo(6, -h * 0.86);
    ctx.quadraticCurveTo(w / 2 - 6, -h * 0.82, w / 2 - 2, -h * 0.6); ctx.quadraticCurveTo(w / 2 + 2, -h * 0.35, 6, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,230,190,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 4, -h * 0.55); ctx.lineTo(w / 2 - 4, -h * 0.55); ctx.stroke();
    ctx.strokeStyle = shade(c.col, -50); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-9, -h * 0.8, 6, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -h * 0.8, 6, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  } else {
    ctx.fillStyle = '#d9c08a'; ctx.strokeStyle = '#9a7a40';
    ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.quadraticCurveTo(-w / 2 - 4, -h * 0.7, -w / 4, -h); ctx.quadraticCurveTo(0, -h - 8, w / 4, -h);
    ctx.quadraticCurveTo(w / 2 + 4, -h * 0.7, w / 2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, -h + 2); ctx.lineTo(8, -h + 2); ctx.stroke();
  }
  ctx.restore();
}

function drawLeak(l, front) {
  const y = DECK - 8;
  if (!front) {
    // the crack in the planks, or the patch over it
    if (l.done || l.taps > 0) {
      ctx.globalAlpha = l.done ? clamp(3 - l.patchT, 0, 1) : 1;
      ctx.fillStyle = '#d8b070'; ctx.strokeStyle = '#7a5428'; ctx.lineWidth = 2;
      roundRect(l.lx - 20, y - 8, 40, 16, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#555';
      for (const dx of [-15, 15]) { ctx.beginPath(); ctx.arc(l.lx + dx, y, 2, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
      if (l.done) return;
    }
    ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(l.lx - 16, y + 2); ctx.lineTo(l.lx - 5, y - 3); ctx.lineTo(l.lx + 3, y + 3); ctx.lineTo(l.lx + 15, y - 2); ctx.stroke();
    return;
  }
  if (l.done) return;
  // the spurting water
  const strength = (l.taps > 0 ? 0.5 : 1) * Math.min(1, l.age * 2);
  ctx.strokeStyle = 'rgba(200,236,255,0.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let k = -1; k <= 1; k++) {
    const hgt = (34 + Math.sin(t * 12 + k) * 6) * strength;
    ctx.beginPath(); ctx.moveTo(l.lx, y); ctx.quadraticCurveTo(l.lx + k * 10, y - hgt * 1.6, l.lx + k * 24, y - hgt * 0.2); ctx.stroke();
  }
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < 4; k++) {
    const f = (t * 2 + k / 4) % 1;
    ctx.beginPath(); ctx.arc(l.lx + Math.sin(k * 2.3) * 22 * f, y - Math.sin(f * Math.PI) * 52 * strength, 3, 0, TAU); ctx.fill();
  }
}

function drawPuddle(p) {
  const rx = puddleRx(p), ry = Math.min(14, 5 + rx * 0.09);
  const y = DECK - 12;
  ctx.fillStyle = 'rgba(80,160,210,0.75)';
  ctx.beginPath(); ctx.ellipse(p.lx, y, rx, ry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(220,245,255,0.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(p.lx + Math.sin(p.ph) * rx * 0.2, y - 1, rx * 0.5, ry * 0.45, 0, 0, TAU); ctx.stroke();
}

function drawShip() {
  const hf = half();
  const c = shipCenter();
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(ship.a);

  // deck (seen a little from above)
  ctx.fillStyle = '#c7955a';
  ctx.beginPath();
  ctx.moveTo(-hf + 4, -40); ctx.lineTo(hf - 8, -40); ctx.lineTo(hf - 26, BACKY + 4); ctx.lineTo(-hf + 20, BACKY + 4); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,70,30,0.35)'; ctx.lineWidth = 2;
  for (let y = BACKY + 16; y < -40; y += 13) { ctx.beginPath(); ctx.moveTo(-hf + 12, y); ctx.lineTo(hf - 14, y); ctx.stroke(); }
  // hatch to the hold
  const hx = hatchU() * hf;
  ctx.fillStyle = '#6b4220';
  roundRect(hx - 30, -78, 60, 26, 4); ctx.fill();
  ctx.strokeStyle = '#3e2410'; ctx.lineWidth = 2; ctx.stroke();

  // mast, yard and furled sail
  const mx = hf * 0.08, mh = mastH();
  ctx.fillStyle = '#7a4a22';
  ctx.fillRect(mx - 7, BACKY - mh + 20, 14, mh);
  ctx.strokeStyle = 'rgba(60,40,20,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mx, BACKY - mh + 26); ctx.lineTo(-hf + 10, -44);
  ctx.moveTo(mx, BACKY - mh + 26); ctx.lineTo(hf - 10, -44);
  ctx.stroke();
  const yy = BACKY - mh + 60;
  ctx.fillStyle = '#6a3e1c';
  ctx.fillRect(mx - hf * 0.55, yy - 5, hf * 1.1, 10);
  ctx.fillStyle = '#efe2c4';
  ctx.beginPath(); ctx.ellipse(mx, yy + 8, hf * 0.52, 12, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 2;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(mx + k * hf * 0.14, yy - 2); ctx.lineTo(mx + k * hf * 0.14 + 4, yy + 19); ctx.stroke(); }
  // flag
  ctx.fillStyle = '#d64545';
  const fw = Math.sin(t * 9) * 4;
  ctx.beginPath(); ctx.moveTo(mx + 7, BACKY - mh + 22); ctx.lineTo(mx + 46, BACKY - mh + 30 + fw); ctx.lineTo(mx + 7, BACKY - mh + 40); ctx.fill();

  // back rail
  ctx.strokeStyle = '#6a3e1c'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-hf + 18, BACKY - 18); ctx.lineTo(hf - 24, BACKY - 18); ctx.stroke();
  ctx.lineWidth = 4;
  for (let x = -hf + 24; x < hf - 20; x += 46) { ctx.beginPath(); ctx.moveTo(x, BACKY - 18); ctx.lineTo(x, BACKY + 4); ctx.stroke(); }

  // sailors
  for (const s of SAILORS) {
    let mood = 'worried', pose = 'stand';
    if (state === 'title' || (state === 'intro' && storm < 0.5)) mood = 'watch';
    if (state === 'fail') { mood = 'shock'; }
    if (s.cheer > 0) { pose = 'armsUp'; mood = state === 'win' ? 'wow' : 'shock'; }
    if (state === 'win' && winT > 4.6) { mood = 'joy'; pose = 'armsUp'; }
    drawPerson(s, s.u * hf, BACKY + 10, 0.9, mood, pose, 0, 0.3);
  }
  // Jonah on deck (walking aboard, or in the finale)
  if (jonah.where === 'walk' || jonah.where === 'rise') {
    const jy = jonah.where === 'rise' ? lerp(30, 0, jonah.y) : 0;
    ctx.save();
    if (jonah.where === 'rise') { ctx.beginPath(); ctx.rect(-hf - 60, -400, hf * 2 + 120, 400 - 66); ctx.clip(); }
    drawPerson(JONAH, jonah.x * hf, -60 + jy, 0.95, jonah.where === 'rise' ? 'watch' : 'grumpy', jonah.where === 'rise' && winT > 1 ? 'point' : 'stand', 0.5, 0.3);
    ctx.restore();
  }

  for (const p of puddles) drawPuddle(p);
  for (const l of leaks) drawLeak(l, false);
  for (const k of cargo) drawCargo(k);
  for (const l of leaks) drawLeak(l, true);

  // hull (front)
  const hg = ctx.createLinearGradient(0, -40, 0, 80);
  hg.addColorStop(0, '#a8672e'); hg.addColorStop(1, '#6e3f1a');
  ctx.fillStyle = hg;
  ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-hf - 26, -84);
  ctx.quadraticCurveTo(-hf + 6, 62, -hf * 0.5, 70);
  ctx.lineTo(hf * 0.5, 70);
  ctx.quadraticCurveTo(hf - 4, 60, hf + 34, -96);
  ctx.lineTo(hf + 18, -94);
  ctx.quadraticCurveTo(hf - 6, -46, hf - 14, -40);
  ctx.lineTo(-hf + 12, -40);
  ctx.quadraticCurveTo(-hf - 4, -46, -hf - 12, -84);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(60,30,10,0.35)'; ctx.lineWidth = 2;
  for (let y = -26; y < 80; y += 17) { ctx.beginPath(); ctx.moveTo(-hf - 30, y); ctx.quadraticCurveTo(0, y + 8, hf + 40, y - 6); ctx.stroke(); }
  // a stripe of paint
  ctx.strokeStyle = '#2f7f9a'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-hf - 30, -30); ctx.quadraticCurveTo(0, -22, hf + 40, -36); ctx.stroke();
  ctx.restore();
  // the window into the hold, where Jonah sleeps
  const wx = -hf * 0.42, wy = 4;
  ctx.fillStyle = '#2a1a10';
  roundRect(wx - 62, wy - 24, 124, 48, 22); ctx.fill();
  ctx.strokeStyle = '#d9a35a'; ctx.lineWidth = 4; ctx.stroke();
  ctx.save();
  roundRect(wx - 60, wy - 22, 120, 44, 20); ctx.clip();
  const lg = ctx.createRadialGradient(wx + 40, wy - 6, 2, wx + 40, wy - 6, 70);
  lg.addColorStop(0, 'rgba(255,210,120,0.55)'); lg.addColorStop(1, 'rgba(255,210,120,0)');
  ctx.fillStyle = lg; ctx.fillRect(wx - 62, wy - 24, 124, 48);
  if (jonah.where === 'below') {
    // Jonah lying down, fast asleep
    ctx.save();
    ctx.translate(wx - 6, wy + 16);
    ctx.rotate(-Math.PI / 2);
    drawPerson(JONAH, 0, 0, 0.62, 'sleep', 'stand', 0, 0);
    ctx.restore();
    // blanket
    ctx.fillStyle = '#c46b8c';
    roundRect(wx - 2, wy + 2, 52, 18, 8); ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  // Zzz (not rotated)
  if (jonah.where === 'below' && state !== 'title') {
    const p = toWorld(wx - 16, wy - 26);
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = 'rgba(20,20,40,0.7)'; ctx.lineWidth = 3;
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    for (let k = 0; k < 3; k++) {
      const f = (t * 0.6 + k / 3) % 1;
      ctx.globalAlpha = Math.sin(f * Math.PI);
      ctx.font = `700 ${12 + f * 12}px Fredoka, sans-serif`;
      ctx.strokeText('z', p.x - 10 + f * 24, p.y - f * 50);
      ctx.fillText('z', p.x - 10 + f * 24, p.y - f * 50);
    }
    ctx.restore();
  }
}

function drawFlying() {
  for (const f of flying) {
    ctx.save();
    ctx.translate(f.x, f.y + f.h / 2);
    ctx.rotate(f.rot);
    drawCargo({ ...f, lx: 0, pop: 1, v: 0, wob: 0 });
    ctx.restore();
  }
}

function drawJonahOutside() {
  if (jonah.where === 'fly') {
    ctx.save();
    ctx.translate(jonah.x, jonah.y);
    ctx.rotate(jonah.ft * 2.2);
    drawPerson(JONAH, 0, 30, 0.95, 'wow', 'armsUp', 0, 0);
    ctx.restore();
  } else if (jonah.where === 'swim' || jonah.where === 'gulp') {
    ctx.save();
    ctx.translate(jonah.x, jonah.y);
    const s = jonah.where === 'gulp' ? jonah.s : 1;
    ctx.scale(s, s);
    // just his head and waving arm above the water
    ctx.beginPath(); ctx.rect(-60, -120, 120, 104); ctx.clip();
    drawPerson(JONAH, 0, 30, 0.95, 'wow', 'wave', 0.6, 0.2);
    ctx.restore();
    ctx.strokeStyle = 'rgba(240,250,255,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(jonah.x, jonah.y - 14, 26 * s, 6 * s, 0, 0, TAU); ctx.stroke();
  }
}

function drawFinaleFish() {
  if (!fish || !fish.show) return;
  const s = fishScale();
  // light from God around the fish
  const m = fishMouth();
  const glow = ctx.createRadialGradient(fishX(), fish.y, 20, fishX(), fish.y, 280 * s);
  glow.addColorStop(0, 'rgba(255,250,210,0.35)'); glow.addColorStop(1, 'rgba(255,250,210,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(fishX(), fish.y, 280 * s, 0, TAU); ctx.fill();
  drawBigFish(fishX(), fish.y + Math.sin(t * 1.5) * 4, s, fish.mouth, fish.wink, t);
  if (jonah.where === 'inside' && winT > 8.2) {
    // a little thought bubble: Jonah safe and praying inside
    const bx = fishX() - 30 * s, by = fish.y - 150 * s - Math.sin(t * 2) * 4;
    ctx.fillStyle = 'rgba(255,252,240,0.95)';
    ctx.beginPath(); ctx.arc(bx, by, 44, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 26, by + 50, 9, 0, TAU); ctx.arc(bx + 36, by + 68, 5, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, 40, 0, TAU); ctx.clip();
    ctx.fillStyle = '#f2c98a'; ctx.fillRect(bx - 44, by - 44, 88, 88);
    drawPerson(JONAH, bx, by + 36, 0.85, 'pray', 'pray');
    ctx.restore();
    void m;
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  const playing = ['play', 'win', 'fail'].includes(state) || (state === 'pause' && pausedFrom === 'play');
  ctx.save();
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(14,18,34,0.85)'); hg.addColorStop(1, 'rgba(14,18,34,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, viewW, TOPH);
  ctx.fillStyle = '#ffe9a8';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Storm at Sea' : state === 'intro' || (state === 'pause' && pausedFrom === 'intro') ? 'Jonah runs away' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.restore();
  if (playing) {
    drawMeter(12, 38, Math.min(150, viewW * 0.3), water, 'WATER', ['#7cc4f2', '#2f86c8'], water > 0.7);
    const bw = Math.min(150, viewW * 0.28);
    const rem = state === 'win' ? 0 : 1 - clamp(stormT / cfg.dur, 0, 1);
    drawMeter(viewW - bw - 70, 14, bw, rem, 'STORM', ['#8fa0c8', '#4a5a88']);
    ctx.save();
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#ffe9a8';
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
    ctx.fillText(`Cargo thrown: ${tossed}`, viewW - 12, 48);
    const leakN = leaks.filter((l) => !l.done).length;
    ctx.fillText(leakN ? `Leaks: ${leakN}` : 'No leaks', viewW - 12, 66);
    ctx.restore();
    // tilt gauge
    drawTiltGauge(viewW - 40, 96);
  }
  drawHudButtons();
}

function drawTiltGauge(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, 24, Math.PI, TAU); ctx.fill();
  const lim = cfg.limit * 1.8;
  ctx.strokeStyle = '#7fd67f'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, 21, -Math.PI / 2 - lim, -Math.PI / 2 + lim); ctx.stroke();
  ctx.strokeStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI, -Math.PI / 2 - lim); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 21, -Math.PI / 2 + lim, 0); ctx.stroke();
  ctx.rotate(clamp(ship.a * 1.8, -1.5, 1.5));
  ctx.fillStyle = '#c47a3a';
  ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(14, -6); ctx.lineTo(9, 2); ctx.lineTo(-9, 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-1, -22, 2, 16);
  ctx.restore();
}

// Big pulsing arrows on the low side, and bouncing "tap" hands
function drawPlayHints() {
  if (state !== 'play') return;
  const lim = cfg.limit;
  if (Math.abs(ship.a) > lim * 0.6) {
    const side = Math.sign(ship.a);
    const p = toWorld(side * half() * 0.82, 40);
    const a = clamp((Math.abs(ship.a) - lim * 0.6) / (lim * 0.4), 0.3, 1);
    const b = Math.abs(Math.sin(t * 8)) * 10;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y + 60 - b);
    ctx.fillStyle = Math.abs(ship.a) > lim ? '#ff8a6b' : '#ffe27a';
    ctx.strokeStyle = 'rgba(40,20,10,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(26, -6); ctx.lineTo(10, -6); ctx.lineTo(10, 22); ctx.lineTo(-10, 22); ctx.lineTo(-10, -6); ctx.lineTo(-26, -6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeText('TAP!', 0, 44); ctx.fillStyle = '#fff'; ctx.fillText('TAP!', 0, 44);
    ctx.restore();
  }
  for (const h of tapHints) {
    let p = null;
    if (h.kind === 'cargo' && cargo.includes(h.ref)) p = toWorld(h.ref.lx, DECK - h.ref.h - 26);
    if (h.kind === 'leak' && !h.ref.done) p = toWorld(h.ref.lx, DECK - 70);
    if (!p) continue;
    const b = Math.abs(Math.sin(t * 6)) * 12;
    ctx.save();
    ctx.globalAlpha = clamp(h.t, 0, 1);
    ctx.translate(p.x, p.y - b);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -18); ctx.lineTo(-5, -18); ctx.lineTo(-5, -34); ctx.lineTo(5, -34); ctx.lineTo(5, -18); ctx.lineTo(12, -18); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  for (const f of liftFx) {
    ctx.save();
    ctx.globalAlpha = clamp(f.t / 0.6, 0, 1);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const y = f.y - (0.6 - f.t) * 60;
    ctx.beginPath(); ctx.moveTo(f.x, y + 20); ctx.lineTo(f.x, y - 10); ctx.moveTo(f.x - 10, y); ctx.lineTo(f.x, y - 12); ctx.lineTo(f.x + 10, y); ctx.stroke();
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawSky();
  drawSeaLayer(true);
  drawShip();
  drawFlying();
  drawSeaLayer(false);
  drawFinaleFish();
  drawJonahOutside();
  drawParticles(false);
  drawRain();
  drawPlayHints();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawParticles(true);
  if (flashT > 0) {
    ctx.fillStyle = `rgba(240,245,255,${flashT})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  if (introFade > 0) {
    ctx.fillStyle = `rgba(14,18,34,${clamp(introFade / 0.5, 0, 0.6)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  // story captions
  if (state === 'intro' || (state === 'pause' && pausedFrom === 'intro')) {
    drawCaption(introSteps[introStep], clamp(introT / 0.4, 0, 1) * (introFade > 0 ? 1 - introFade / 0.5 : 1), TOPH + 14);
    ctx.save(); ctx.font = '600 14px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Tap to go on', viewW / 2, viewH - 24); ctx.restore();
  }
  if (state === 'win' && endTimer > 0) {
    if (winT > 0.8 && winT < 4.4) drawCaption('throwMe', Math.min(1, (winT - 0.8) / 0.3, (4.4 - winT) / 0.3), TOPH + 14, 'Jonah');
    else if (winT > 4.6 && winT < 6.6) drawCaption('calm', Math.min(1, (winT - 4.6) / 0.3, (6.6 - winT) / 0.3), TOPH + 14);
    else if (winT > 6.8) drawCaption('fish', Math.min(1, (winT - 6.8) / 0.3), TOPH + 14);
  }
  drawMessageAt(viewH - 40 - (wrapText(message.text || '', viewW - 40).length - 1) * 28, true);
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  storm += (stormTarget - storm) * Math.min(1, dt * (stormTarget < storm ? 1.2 : 0.8));
  updateParticles(dt);
  updateSailors(dt);
  if (state !== 'title') updateWaves(dt);
  updateShip(dt);
  updateFlying(dt);
  // lightning far away
  if (storm > 0.6 && state !== 'title') {
    nextLight -= dt;
    if (nextLight <= 0) { lightT = 1; nextLight = rand(6, 11); setTimeout(() => sfx.rumble(), 300); }
  }
  lightT = Math.max(0, lightT - dt * 3);
  for (let i = liftFx.length - 1; i >= 0; i--) { liftFx[i].t -= dt; if (liftFx[i].t <= 0) liftFx.splice(i, 1); }
  for (let i = tapHints.length - 1; i >= 0; i--) { tapHints[i].t -= dt; if (tapHints[i].t <= 0) tapHints.splice(i, 1); }
  if (state === 'intro') updateIntro(dt);
  else if (state === 'play') updatePlay(dt);
  else if (state === 'win') updateFinale(dt);
  else if (state === 'fail') failT += dt;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
