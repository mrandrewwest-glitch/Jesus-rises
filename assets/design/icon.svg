<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc0ec"/>
      <stop offset="0.55" stop-color="#b9e0f7"/>
      <stop offset="1" stop-color="#fff3cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="430" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffe7a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd16a"/>
      <stop offset="1" stop-color="#5aa847"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6e38c"/>
      <stop offset="1" stop-color="#7cc25c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- sun rays -->
  <g transform="translate(512 430)" fill="#fff2b0" opacity="0.5">
    <path d="M0 0 L-40 -520 L40 -520Z"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(30)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(60)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(90)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(-30)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(-60)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(-90)"/>
  </g>
  <circle cx="512" cy="430" r="380" fill="url(#glow)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="170" cy="250" rx="95" ry="42"/><ellipse cx="225" cy="225" rx="62" ry="48"/><ellipse cx="130" cy="235" rx="50" ry="36"/>
    <ellipse cx="860" cy="200" rx="90" ry="38"/><ellipse cx="905" cy="178" rx="55" ry="42"/><ellipse cx="815" cy="186" rx="46" ry="32"/>
  </g>
  <!-- hills -->
  <path d="M-20 760 C 200 640, 380 700, 560 735 C 740 770, 880 690, 1044 700 L1044 1044 L-20 1044Z" fill="url(#hill2)"/>
  <path d="M-20 840 C 180 770, 360 800, 520 820 C 700 845, 860 780, 1044 800 L1044 1044 L-20 1044Z" fill="url(#hill)"/>
  <!-- cross on the hill -->
  <g transform="translate(512 0)">
    <rect x="-34" y="250" width="68" height="470" rx="18" fill="#a8741a"/>
    <rect x="-150" y="350" width="300" height="64" rx="18" fill="#a8741a"/>
    <rect x="-26" y="258" width="52" height="454" rx="14" fill="url(#gold)"/>
    <rect x="-142" y="358" width="284" height="48" rx="14" fill="url(#gold)"/>
    <rect x="-16" y="270" width="12" height="430" rx="6" fill="#fff6c8" opacity="0.7"/>
  </g>
  <!-- a little lamb -->
  <g transform="translate(250 820)">
    <rect x="-52" y="20" width="18" height="62" rx="9" fill="#5b4632"/><rect x="-18" y="26" width="18" height="60" rx="9" fill="#4a3826"/>
    <rect x="22" y="20" width="18" height="62" rx="9" fill="#5b4632"/><rect x="50" y="26" width="18" height="58" rx="9" fill="#4a3826"/>
    <g fill="#ffffff" stroke="#e3ecf2" stroke-width="5">
      <circle cx="-70" cy="-5" r="36"/><circle cx="-40" cy="-42" r="38"/><circle cx="5" cy="-52" r="40"/><circle cx="48" cy="-40" r="36"/>
      <circle cx="70" cy="0" r="34"/><circle cx="35" cy="28" r="36"/><circle cx="-10" cy="32" r="38"/><circle cx="-52" cy="24" r="34"/>
    </g>
    <ellipse cx="0" cy="-8" rx="80" ry="52" fill="#ffffff"/>
    <ellipse cx="96" cy="-46" rx="40" ry="36" fill="#5b4632"/>
    <ellipse cx="66" cy="-64" rx="24" ry="12" fill="#5b4632" transform="rotate(-30 66 -64)"/>
    <circle cx="86" cy="-82" r="18" fill="#ffffff"/><circle cx="104" cy="-86" r="15" fill="#ffffff"/>
    <circle cx="108" cy="-52" r="8" fill="#ffffff"/><circle cx="110" cy="-52" r="4" fill="#2a1d10"/>
    <path d="M104 -28 Q114 -22 124 -30" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- dove -->
  <g transform="translate(770 560) rotate(-12)">
    <ellipse cx="0" cy="0" rx="62" ry="30" fill="#ffffff"/>
    <circle cx="52" cy="-14" r="24" fill="#ffffff"/>
    <path d="M70 -14 L96 -8 L70 -2Z" fill="#f2a33a"/>
    <circle cx="58" cy="-20" r="4.5" fill="#2a1d10"/>
    <path d="M-10 -10 C -40 -90, 20 -110, 40 -40Z" fill="#ffffff" stroke="#d9e7f2" stroke-width="4"/>
    <path d="M-58 0 L-100 -22 L-96 18Z" fill="#ffffff"/>
    <path d="M36 0 C 46 22, 70 30, 90 26" stroke="#5aa847" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="78" cy="20" rx="10" ry="5" fill="#5aa847" transform="rotate(25 78 20)"/>
  </g>
</svg>
