<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d2f5c">
<title>Pharaoh's Dreams</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #3d2f5c;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(40, 30, 80, 0.25);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .tip { text-align: center; margin: 8px 0; }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Pharaoh's Dreams</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'odeToJoy', instrument: 'harp', accent: 'pipe', ambience: 'sea', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card: the fat cows
  fatCows: { ref: 'Genesis 41:17–18', KJV: 'In my dream, behold, I stood upon the bank of the river: And, behold, there came up out of the river seven kine, fatfleshed and well favoured', NKJV: 'Behold, in my dream I stood on the bank of the river. Suddenly seven cows came up out of the river, fine looking and fat', NIV: 'In my dream I was standing on the bank of the Nile, when out of the river there came up seven cows, fat and sleek', NLT: 'In my dream... I was standing on the bank of the Nile River, and I saw seven fat, healthy cows come up out of the river' },
  // Level cards
  thinCows: { ref: 'Genesis 41:19', KJV: 'Seven other kine came up after them, poor and very ill favoured and leanfleshed', NKJV: 'Seven other cows came up after them, poor and very ugly and gaunt', NIV: 'After them, seven other cows came up—scrawny and very ugly and lean.', NLT: 'But then I saw seven sick-looking cows, scrawny and thin, come up after them.' },
  fullEars: { ref: 'Genesis 41:22', KJV: 'And I saw in my dream, and, behold, seven ears came up in one stalk, full and good', NKJV: 'Also I saw in my dream, and suddenly seven heads came up on one stalk, full and good.', NIV: 'In my dream I saw seven heads of grain, full and good, growing on a single stalk.', NLT: 'In my dream I also saw seven heads of grain, full and beautiful, growing on a single stalk.' },
  thinEars: { ref: 'Genesis 41:23', KJV: 'And, behold, seven ears, withered, thin, and blasted with the east wind, sprung up after them', NKJV: 'Then behold, seven heads, withered, thin, and blighted by the east wind, sprang up after them.', NIV: 'After them, seven other heads sprouted—withered and thin and scorched by the east wind.', NLT: 'Then seven more heads of grain appeared, but these were blighted, shriveled, and withered by the east wind.' },
  answer: { ref: 'Genesis 41:16', KJV: 'It is not in me: God shall give Pharaoh an answer of peace.', NKJV: 'It is not in me; God will give Pharaoh an answer of peace.', NIV: 'I cannot do it... but God will give Pharaoh the answer he desires.', NLT: 'It is beyond my power to do this... But God can tell you what it means and set you at ease.' },
  dreamIsOne: { ref: 'Genesis 41:25', KJV: 'The dream of Pharaoh is one: God hath shewed Pharaoh what he is about to do.', NKJV: 'The dreams of Pharaoh are one; God has shown Pharaoh what He is about to do', NIV: 'The dreams of Pharaoh are one and the same. God has revealed to Pharaoh what he is about to do.', NLT: 'Both of Pharaoh’s dreams mean the same thing. God is telling Pharaoh in advance what he is about to do.' },
  plenty: { ref: 'Genesis 41:29–30', KJV: 'Behold, there come seven years of great plenty throughout all the land of Egypt: And there shall arise after them seven years of famine', NKJV: 'Indeed seven years of great plenty will come throughout all the land of Egypt; but after them seven years of famine will arise', NIV: 'Seven years of great abundance are coming throughout the land of Egypt, but seven years of famine will follow them.', NLT: 'The next seven years will be a period of great prosperity throughout the land of Egypt. But afterward there will be seven years of famine' },
  // Win card
  wise: { ref: 'Genesis 41:39', KJV: 'Forasmuch as God hath shewed thee all this, there is none so discreet and wise as thou art', NKJV: 'Inasmuch as God has shown you all this, there is no one as discerning and wise as you.', NIV: 'Since God has made all this known to you, there is no one so discerning and wise as you.', NLT: 'Since God has revealed the meaning of the dreams to you, clearly no one else is as intelligent or wise as you are.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;         // HUD strip
const RIVER_Y = 300;      // top of the Nile
const BANK_Y = 372;       // where the near bank begins (things come up here)
const MISS_Y = 770;       // anything that walks past this line is lost
const BTN_Y = 842;        // the two big sorting signs

const LEVELS = [
  { name: 'Seven Fat Cows',      count: 8,  speed: 62,  gap: 3.3, kinds: ['cow'],          tricky: 0,    shuffle: false, hearts: 4, verse: 'fatCows',
    tip: 'Fat cows go to the <b>green meadow</b> (tap the <b>left</b>). Thin cows go to the <b>dry field</b> (tap the <b>right</b>).' },
  { name: 'The Thin Cows Come',  count: 12, speed: 80,  gap: 2.5, kinds: ['cow'],          tricky: 0.15, shuffle: false, hearts: 3, verse: 'thinCows',
    tip: 'They walk a little faster now. Sort each cow before it reaches the <b>dotted line</b>.' },
  { name: 'Seven Heads of Grain', count: 12, speed: 86, gap: 2.3, kinds: ['grain'],        tricky: 0.2,  shuffle: false, hearts: 3, verse: 'fullEars',
    tip: 'Now heads of grain! <b>Full, fat grain</b> goes <b>left</b>. <b>Thin, dry grain</b> goes <b>right</b>.' },
  { name: 'Scorched by the Wind', count: 16, speed: 100, gap: 1.95, kinds: ['cow', 'grain'], tricky: 0.35, shuffle: false, hearts: 3, verse: 'thinEars',
    tip: 'Cows <b>and</b> grain together, and quicker!' },
  { name: 'Look Closely!',       count: 18, speed: 112, gap: 1.7, kinds: ['cow', 'grain'], tricky: 0.6,  shuffle: true,  hearts: 3, verse: 'answer',
    tip: 'Tricky! The colours are all mixed up. Only <b>fat</b> or <b>thin</b> matters.' },
  { name: 'The Dream Is One',    count: 22, speed: 128, gap: 1.42, kinds: ['cow', 'grain'], tricky: 0.75, shuffle: true,  hearts: 3, verse: 'dreamIsOne',
    tip: 'The last and fastest dream. Look carefully and be quick!' },
];
const COW_COLS = [
  { body: '#8a5a33', patch: '#f4ead8' },
  { body: '#f2e8d8', patch: '#7a4a2a' },
  { body: '#c98b4a', patch: '#f4ead8' },
  { body: '#5c3c26', patch: '#e9dcc4' },
];
const THIN_COLS = [
  { body: '#a39a8c', patch: '#cfc6b4' },
  { body: '#b8ad96', patch: '#8d826e' },
];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | pause | win | fail | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0, levelScore = 0;
let best = 0;
try { best = +localStorage.getItem('pharaohDreamsBest') || 0; } catch (e) {}

let cfg = LEVELS[0];
let t = 0;
let items = [];           // things coming up out of the river
let queue = [];           // what is still to come this level
let spawnT = 0;
let hearts = 3, mistakes = 0, combo = 0, bestCombo = 0, sortedN = 0;
let particles = [];
let message = { text: '', t: 0 };
let bubble = null;        // Joseph's speech bubble { text, t }
let shakeT = 0, flashT = 0;
let endTimer = 0;
let playT = 0, winT = 0, failT = 0;
let told = {};
let attempted = 0;
let pressFx = { left: 0, right: 0 };

const sfx = {};           // filled in below

function saveBest() {
  if (totalScore > best) {
    best = totalScore;
    try { localStorage.setItem('pharaohDreamsBest', String(best)); } catch (e) {}
  }
}

// ============================================================
//  Layout helpers (playfield coordinates)
// ============================================================
const CX = () => W / 2;
function pathHalf(y) { return lerp(34, 150, clamp((y - BANK_Y) / (H - BANK_Y), 0, 1)); }
function depthScale(y) { return lerp(0.6, 1.32, clamp((y - BANK_Y + 10) / (MISS_Y - BANK_Y), 0, 1.15)); }
function penRect(side) {
  const inner = CX() - 150;
  if (side === 'left') return { x0: 26, x1: Math.max(70, inner - 6), y0: 500, y1: 740 };
  return { x0: Math.min(W - 70, W - inner + 6), x1: W - 26, y0: 500, y1: 740 };
}
function signRect(side) {
  const w = clamp(W * 0.36, 170, 300), h = 78;
  const x = side === 'left' ? 14 : W - 14 - w;
  return { x, y: BTN_Y - h / 2, w, h };
}

// ============================================================
//  Items: cows and heads of grain
// ============================================================
function makeQueue() {
  const n = cfg.count;
  const good = [];
  const half = Math.floor(n / 2);
  for (let i = 0; i < n; i++) good.push(i < half + (n % 2 && Math.random() < 0.5 ? 1 : 0));
  // shuffle, but never more than three of a kind in a row
  for (let k = 0; k < 40; k++) {
    good.sort(() => Math.random() - 0.5);
    let run = 1, ok = true;
    for (let i = 1; i < n; i++) { run = good[i] === good[i - 1] ? run + 1 : 1; if (run > 3) { ok = false; break; } }
    if (ok) break;
  }
  return good.map((g, i) => {
    const kind = cfg.kinds.length === 1 ? cfg.kinds[0] : pick(cfg.kinds);
    const tricky = Math.random() < cfg.tricky && !(level === 1);
    let fat = g ? (tricky ? rand(0.66, 0.76) : rand(0.88, 1)) : (tricky ? rand(0.44, 0.52) : rand(0.08, 0.24));
    let col;
    if (cfg.shuffle) col = pick([...COW_COLS, ...THIN_COLS]);
    else col = g ? pick(COW_COLS) : pick(THIN_COLS);
    return { kind, good: g, fat, col, tricky, idx: i };
  });
}

function spawnItem() {
  const q = queue.shift();
  if (!q) return;
  const it = { ...q, x: CX() + rand(-6, 6), y: BANK_Y - 4, mode: 'rise', rise: 0, phase: rand(0, TAU), tx: 0, ty: 0, a: 1, wrong: false, bump: 0, look: 0 };
  items.push(it);
  sfx.splash();
  for (let k = 0; k < 10; k++) spawn(it.x + rand(-26, 26), BANK_Y - 10, rand(-60, 60), rand(-160, -60), 0.7, '#cfeefc', rand(3, 5), 420);
}

function lead() {
  let l = null;
  for (const it of items) if ((it.mode === 'walk' || it.mode === 'rise') && (!l || it.y > l.y)) l = it;
  return l;
}

function sortLead(side) {
  if (state !== 'play') return;
  pressFx[side] = 0.25;
  const it = lead();
  if (!it) { sfx.soft(); return; }
  const right = (side === 'left') === it.good;
  const p = penRect(it.good ? 'left' : 'right');
  it.mode = 'sorted';
  it.tx = rand(p.x0 + 20, p.x1 - 20);
  it.ty = rand(p.y0 + 10, p.y1);
  const sc = depthScale(it.y);
  if (right) {
    combo++; bestCombo = Math.max(bestCombo, combo);
    const quick = Math.round(clamp((MISS_Y - it.y) / (MISS_Y - BANK_Y), 0, 1) * 50);
    const mult = 1 + Math.floor(combo / 5) * 0.5;
    const pts = Math.round((50 + quick) * mult);
    levelScore += pts; totalScore += pts;
    sortedN++;
    floatText(it.x + offX, it.y - 70 * sc + offY, `+${pts}`, '#fff3b0');
    if (combo > 0 && combo % 5 === 0) { floatText(it.x + offX, it.y - 110 * sc + offY, `${combo} in a row!`, '#ffe066'); sfx.chime(); }
    sparkle(it.x, it.y - 40 * sc, 12);
    sfx.good(combo);
    if (it.kind === 'cow') sfx.moo(it.good);
    if (!told.firstGood && it.good) { told.firstGood = true; say(it.kind === 'cow' ? 'Fat cows mean good years with lots of food!' : 'Full grain means good harvests!'); }
    else if (!told.firstThin && !it.good) { told.firstThin = true; say(it.kind === 'cow' ? 'Thin cows mean hungry years.' : 'Thin grain means hungry years.'); }
  } else {
    // A wrong guess: Joseph shows where it really belongs
    it.wrong = true;
    combo = 0; mistakes++;
    loseHeart();
    sfx.wrong();
    floatText(it.x + offX, it.y - 70 * sc + offY, it.good ? 'That one was fat!' : 'That one was thin!', '#ffd0d0');
    say(it.good ? (it.kind === 'cow' ? 'Look — that cow is nice and fat!' : 'Look — that grain is full!') : (it.kind === 'cow' ? 'See its bony sides? It is thin.' : 'See how dry and thin it is?'));
  }
  checkEnd();
}

function loseHeart() {
  hearts--;
  shakeT = 0.35;
  if (hearts <= 0) { hearts = 0; fail(); }
}

function updateItems(dt) {
  for (const it of items) {
    it.phase += dt * (it.kind === 'grain' ? 9 : 7);
    it.bump = Math.max(0, it.bump - dt);
    if (it.mode === 'rise') {
      it.rise += dt / 0.7;
      if (it.rise >= 1) { it.rise = 1; it.mode = 'walk'; }
      if (state === 'play') it.y += cfg.speed * 0.25 * dt;
    } else if (it.mode === 'walk') {
      if (state !== 'play') continue;
      it.y += cfg.speed * (0.55 + 0.45 * depthScale(it.y)) * dt;
      it.x = lerp(it.x, CX() + Math.sin(it.idx * 1.7) * 8, dt);
      if (it.y >= MISS_Y) {
        it.mode = 'lost';
        combo = 0; mistakes++;
        sfx.miss();
        floatText(it.x + offX, it.y - 80 + offY, 'Too late!', '#ffd0d0');
        if (!told.miss) { told.miss = true; say('Quick! Sort each one before the dotted line.'); }
        loseHeart();
        checkEnd();
      }
    } else if (it.mode === 'sorted') {
      const dx = it.tx - it.x, dy = it.ty - it.y, d = Math.hypot(dx, dy);
      const sp = 330 * dt;
      if (d < sp) { it.x = it.tx; it.y = it.ty; it.mode = 'pen'; }
      else { it.x += dx / d * sp; it.y += dy / d * sp; }
    } else if (it.mode === 'lost') {
      it.y += 140 * dt;
      it.a -= dt * 1.2;
    }
  }
  items = items.filter((it) => it.mode !== 'lost' || it.a > 0);
}

function checkEnd() {
  if (state !== 'play') return;
  if (queue.length === 0 && !items.some((it) => it.mode === 'walk' || it.mode === 'rise')) win();
}

// ============================================================
//  Drawing: cows and grain
// ============================================================
function drawCow(it, x, y, s) {
  const fat = it.fat, c = it.col;
  const step = it.mode === 'pen' ? 0 : Math.sin(it.phase);
  const happy = fat > 0.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // shadow
  ctx.fillStyle = 'rgba(40,30,10,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 30 + 22 * fat, 8, 0, 0, TAU); ctx.fill();
  const bw = 16 + 26 * fat;      // half body width
  const legW = 4 + 4 * fat;
  // back legs
  ctx.fillStyle = shade(c.body, -35);
  for (const sx of [-1, 1]) {
    const lx = sx * (bw - 8);
    roundRect(lx - legW / 2, -26 - step * sx * 2, legW, 22, 3); ctx.fill();
  }
  // body
  ctx.fillStyle = c.body;
  ctx.strokeStyle = shade(c.body, -55); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, -34, bw, 20 + 6 * fat, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // patches on the body
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -34, bw - 1, 19 + 6 * fat, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = c.patch;
  ctx.beginPath(); ctx.ellipse(-bw * 0.55, -40, bw * 0.38, 9, 0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bw * 0.6, -28, bw * 0.3, 7, -0.3, 0, TAU); ctx.fill();
  ctx.restore();
  // ribs and hip bones on thin cows
  if (fat < 0.6) {
    ctx.strokeStyle = shade(c.body, -60); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const sx of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(sx * (bw - 3), -38 + k * 7, 7, sx > 0 ? Math.PI * 0.7 : -Math.PI * 0.3, sx > 0 ? Math.PI * 1.3 : Math.PI * 0.3);
        ctx.stroke();
      }
    }
  } else {
    // a glossy shine on fat cows
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.ellipse(-bw * 0.35, -46, bw * 0.3, 5, -0.2, 0, TAU); ctx.fill();
  }
  // front legs
  ctx.fillStyle = shade(c.body, -15);
  for (const sx of [-1, 1]) {
    const lx = sx * (bw * 0.45);
    const lift = Math.max(0, step * sx) * 4;
    roundRect(lx - legW / 2, -22 - lift, legW, 22, 3); ctx.fill();
    ctx.fillStyle = '#3a2a1c';
    roundRect(lx - legW / 2 - 0.5, -4 - lift, legW + 1, 5, 2); ctx.fill();
    if (fat < 0.4) { ctx.fillStyle = shade(c.body, -30); ctx.beginPath(); ctx.arc(lx, -12 - lift, legW * 0.7, 0, TAU); ctx.fill(); }
    ctx.fillStyle = shade(c.body, -15);
  }
  // head
  const hy = -58, hw = 15 + 3 * fat;
  // horns
  ctx.fillStyle = '#f2e6c8'; ctx.strokeStyle = '#b8a47a'; ctx.lineWidth = 1.2;
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sx * 7, hy - 14); ctx.quadraticCurveTo(sx * 18, hy - 20, sx * 17, hy - 28);
    ctx.quadraticCurveTo(sx * 14, hy - 18, sx * 4, hy - 11); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // ears (droopy on thin cows)
  ctx.fillStyle = c.body; ctx.strokeStyle = shade(c.body, -55); ctx.lineWidth = 1.5;
  for (const sx of [-1, 1]) {
    ctx.save();
    ctx.translate(sx * (hw + 2), hy - 8);
    ctx.rotate(sx * (happy ? -0.25 : 0.7));
    ctx.beginPath(); ctx.ellipse(sx * 7, 0, 9, 4.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8a0a0';
    ctx.beginPath(); ctx.ellipse(sx * 7, 0, 5, 2.2, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = c.body;
  }
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.ellipse(0, hy, hw, 17 - (1 - fat) * 2, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // forehead patch
  ctx.fillStyle = c.patch;
  ctx.beginPath(); ctx.ellipse(0, hy - 9, 6, 6, 0, 0, TAU); ctx.fill();
  // muzzle
  ctx.fillStyle = '#f2b8a8';
  ctx.beginPath(); ctx.ellipse(0, hy + 9, hw * 0.78, 8.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9a5a50';
  ctx.beginPath(); ctx.ellipse(-4.5, hy + 8, 1.8, 2.4, 0, 0, TAU); ctx.ellipse(4.5, hy + 8, 1.8, 2.4, 0, 0, TAU); ctx.fill();
  // mouth
  ctx.strokeStyle = '#7a3a30'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (happy) ctx.arc(0, hy + 10, 4, 0.2 * Math.PI, 0.8 * Math.PI);
  else ctx.arc(0, hy + 16, 3.5, 1.2 * Math.PI, 1.8 * Math.PI);
  ctx.stroke();
  // eyes
  const blink = Math.sin(t * 1.3 + it.idx * 2.1) > 0.985;
  for (const sx of [-1, 1]) {
    const ex = sx * 6.5, ey = hy - 3;
    if (blink) { ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex - 3, ey); ctx.lineTo(ex + 3, ey); ctx.stroke(); continue; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, 4, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(ex, ey + 1, 2.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 0.8, ey, 0.8, 0, TAU); ctx.fill();
    if (!happy) {   // sleepy eyelids
      ctx.fillStyle = shade(c.body, -10);
      ctx.beginPath(); ctx.ellipse(ex, ey - 2.5, 4.4, 3, 0, Math.PI, TAU); ctx.fill();
    }
  }
  if (happy) {
    ctx.fillStyle = 'rgba(255,120,120,0.35)';
    ctx.beginPath(); ctx.arc(-11, hy + 3, 3, 0, TAU); ctx.arc(11, hy + 3, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawGrain(it, x, y, s) {
  const fat = it.fat;
  const hop = it.mode === 'pen' ? 0 : Math.abs(Math.sin(it.phase)) * 8;
  const good = fat > 0.6;
  const shuffled = cfg.shuffle;
  const gold = shuffled ? (it.col.body === '#a39a8c' || it.col.body === '#b8ad96' ? '#e5c35a' : (it.idx % 2 ? '#e8b84a' : '#c9b06a')) : (good ? '#e8b84a' : '#c4a978');
  const droop = (1 - fat) * 0.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(40,30,10,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 18 - hop * 0.6, 5, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -hop);
  // little feet
  ctx.fillStyle = '#7a5a2a';
  ctx.beginPath(); ctx.ellipse(-6, -2, 5, 3, 0, 0, TAU); ctx.ellipse(6, -2, 5, 3, 0, 0, TAU); ctx.fill();
  // stalk
  const stalkCol = good ? '#9ab84a' : '#b8a466';
  ctx.strokeStyle = stalkCol; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -2); ctx.quadraticCurveTo(0, -30, droop * 22, -50); ctx.stroke();
  // leaves
  ctx.fillStyle = stalkCol;
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(0, -20); ctx.rotate(sx * (0.9 + droop * 1.3));
    ctx.beginPath(); ctx.ellipse(0, -11, 3 + 2 * fat, 12, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // the head of grain
  ctx.save();
  ctx.translate(droop * 22, -50);
  ctx.rotate(droop * 1.1);
  const hw = 7 + 10 * fat, hh = 34 + 10 * fat;
  ctx.fillStyle = gold;
  ctx.strokeStyle = shade(gold, -60); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -hh / 2, hw, hh / 2, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // kernels
  const rows = 5, cols = fat > 0.6 ? 3 : 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const kx = (c - (cols - 1) / 2) * hw * 0.62;
      const ky = -6 - r * (hh - 10) / rows;
      const kr = fat > 0.6 ? 3.6 + fat : 2 + fat * 1.5;
      ctx.fillStyle = shade(gold, r % 2 ? 18 : 30);
      ctx.beginPath(); ctx.ellipse(kx, ky, kr, kr * 1.3, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = shade(gold, -40); ctx.lineWidth = 0.8; ctx.stroke();
    }
  }
  // whiskers (awns)
  ctx.strokeStyle = shade(gold, -20); ctx.lineWidth = 1.2;
  for (let k = -2; k <= 2; k++) {
    ctx.beginPath(); ctx.moveTo(k * 2.5, -hh + 2); ctx.lineTo(k * 6, -hh - 14 + Math.abs(k) * 3); ctx.stroke();
  }
  // scorched tips on thin grain
  if (fat < 0.6) {
    ctx.fillStyle = 'rgba(110,70,30,0.55)';
    ctx.beginPath(); ctx.ellipse(0, -hh + 6, hw * 0.9, 7, 0, 0, TAU); ctx.fill();
  }
  // a little face
  const fy = -hh * 0.45;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-4, fy, 3, 3.6, 0, 0, TAU); ctx.ellipse(4, fy, 3, 3.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12';
  ctx.beginPath(); ctx.arc(-4, fy + 0.8, 1.7, 0, TAU); ctx.arc(4, fy + 0.8, 1.7, 0, TAU); ctx.fill();
  if (!good) {
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.ellipse(-4, fy - 1.8, 3.4, 2.2, 0, Math.PI, TAU); ctx.ellipse(4, fy - 1.8, 3.4, 2.2, 0, Math.PI, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#6a3a1e'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  if (good) ctx.arc(0, fy + 5, 3, 0.15 * Math.PI, 0.85 * Math.PI);
  else ctx.arc(0, fy + 9, 2.5, 1.2 * Math.PI, 1.8 * Math.PI);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawItem(it) {
  const s = it.mode === 'pen' || it.mode === 'sorted' ? lerp(depthScale(it.y), 0.66, it.mode === 'pen' ? 1 : 0.5) : depthScale(it.y);
  let y = it.y;
  ctx.save();
  ctx.globalAlpha = clamp(it.a, 0, 1);
  if (it.mode === 'rise') {
    // coming up out of the water
    ctx.beginPath(); ctx.rect(-50, -200, W + 100, BANK_Y + 200 + 4); ctx.clip();
    y += (1 - ease(it.rise)) * 70 * s;
  }
  if (it.kind === 'cow') drawCow(it, it.x, y, s);
  else drawGrain(it, it.x, y, s);
  ctx.restore();
}

// ============================================================
//  People: Pharaoh and Joseph
// ============================================================
const PHARAOH = { robe: '#f4efe2', skin: '#c68a55', hair: '#2a1a0e', i: 0, mood: 'wow', nemes: true, collar: '#3a7fb8' };
const JOSEPH = { robe: '#f8f4ea', skin: '#d39a66', hair: '#3a2515', i: 1, mood: 'watch', sash: true, collar: '#e0a526' };

function drawFace(mood, hy, look) {
  const ex = 6, ey = hy - 1, dark = '#2b1d12', mouthY = hy + 9;
  ctx.lineCap = 'round';
  const blink = Math.sin(t * 1.7 + hy) > 0.99 && mood !== 'joy';
  for (const sx of [-ex, ex]) {
    if (mood === 'joy') {
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(sx, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      continue;
    }
    if (blink) { ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke(); continue; }
    const big = mood === 'wow' || mood === 'shock';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sx, ey, big ? 4.2 : 3.6, big ? 5.4 : 4.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx + look * 1.5, ey + 0.5, 2.1, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#6a2a1e'; ctx.fillStyle = '#7a2e22'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mood === 'joy') { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  else if (mood === 'wow' || mood === 'shock') { ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU); ctx.fill(); }
  else if (mood === 'worried') { ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
  else { ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (mood === 'joy') {
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  }
}

function drawPerson(d, x, y, s, look = 0, point = 0) {
  const mood = d.mood;
  const jump = mood === 'joy' ? Math.abs(Math.sin(t * 7 + d.i)) * 10 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (mood === 'joy') { const w = Math.sin(t * 9 + d.i) * 4; arm(-11, -32, -24 + w, -66); arm(11, -32, 24 - w, -66); }
  // robe
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -50); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (d.sash) {
    // Joseph's sash, a reminder of his coat of many colours
    const cols = ['#c0392b', '#e0a526', '#3c8f86', '#7a4fa0'];
    cols.forEach((c, k) => { ctx.strokeStyle = c; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-12 + k * 2.4, -36 + k * 0.5); ctx.lineTo(10 + k * 2.4, -8 + k * 0.5); ctx.stroke(); });
  } else {
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }
  // collar
  ctx.fillStyle = d.collar;
  ctx.beginPath(); ctx.ellipse(0, -37, 13, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.ellipse(0, -37, 9, 2.5, 0, 0, TAU); ctx.fill();
  if (mood !== 'joy') {
    if (point) arm(11, -32, 11 + point * 18, -46);
    else arm(11, -32, 15, -12);
    arm(-11, -32, -15, -12);
  }
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.nemes) {
    // Pharaoh's striped head-cloth
    ctx.fillStyle = '#e0b040';
    ctx.beginPath();
    ctx.moveTo(-17, hy + 16); ctx.lineTo(-20, hy - 2); ctx.quadraticCurveTo(-18, hy - 22, 0, hy - 22);
    ctx.quadraticCurveTo(18, hy - 22, 20, hy - 2); ctx.lineTo(17, hy + 16); ctx.lineTo(12, hy + 16); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 13, -13, hy - 6); ctx.lineTo(-12, hy + 16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2f5fa0'; ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath(); ctx.moveTo(-19 + k * 0.6, hy - 6 + k * 6); ctx.lineTo(-13, hy - 6 + k * 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(19 - k * 0.6, hy - 6 + k * 6); ctx.lineTo(13, hy - 6 + k * 6); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, hy - 6, 15, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    // the little cobra badge, drawn as a simple gold bump
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(0, hy - 18, 3.5, 0, TAU); ctx.fill();
    // small royal beard
    ctx.fillStyle = '#3a2a1a'; roundRect(-2.5, hy + 14, 5, 9, 2); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  drawFace(mood, hy, look);
  ctx.restore();
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot', text = '') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind, text });
}
function sparkle(x, y, n) {
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), v = rand(60, 200);
    spawn(x + offX, y + offY, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, 0.8), pick(['#ffe27a', '#fff6d0', '#ffffff']), rand(2, 4), 120, 'star');
  }
}
function floatText(x, y, text, color) { spawn(x, y, 0, -60, 1.2, color, 22, 0, 'text', text); }
function updateParticles(dt) {
  for (const p of particles) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter((p) => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max * 1.5, 0, 1);
    ctx.globalAlpha = a;
    if (p.kind === 'text') {
      ctx.font = `700 ${p.size}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(40,25,60,0.85)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    } else if (p.kind === 'star') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const r = k % 2 ? p.size * 0.4 : p.size * 1.4, an = k * Math.PI / 4;
        ctx.lineTo(p.x + Math.cos(an) * r, p.y + Math.sin(an) * r);
      }
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const heartBonus = hearts * 100;
  const perfect = mistakes === 0 ? 300 : 0;
  const levelBonus = level * 100;
  levelScore += heartBonus + perfect + levelBonus;
  totalScore += heartBonus + perfect + levelBonus;
  lastBonus = { heartBonus, perfect, levelBonus };
  saveBest();
  JOSEPH.mood = 'joy'; PHARAOH.mood = 'joy';
  say(level === LEVELS.length ? 'God has shown Pharaoh what He will do!' : 'Well sorted! God is showing Pharaoh His plan.');
  sfx.win();
  endTimer = 2.4;
}
let lastBonus = null;

function fail() {
  if (state !== 'play') return;
  state = 'fail';
  syncAmbience();
  failT = 0;
  saveBest();
  JOSEPH.mood = 'worried'; PHARAOH.mood = 'worried';
  sfx.fail();
  endTimer = 1.8;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }
function say(text, dur = 2.6) { bubble = { text, t: dur }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1;
  cfg = LEVELS[0];
  resetLevel();
  showOverlay("Pharaoh's Dreams", 'Help Joseph explain the king’s dreams',
    `${verseHTML('fatCows')}
     <ul>
       <li>Pharaoh dreamed of <b>cows</b> and <b>heads of grain</b> coming up out of the river Nile. God showed Joseph what it meant!</li>
       <li><b>Fat cows</b> and <b>full grain</b>: tap the <b>left</b> side to send them to the green meadow.</li>
       <li><b>Thin cows</b> and <b>dry grain</b>: tap the <b>right</b> side to send them to the dry field.</li>
       <li>Sort the one at the front <b>before it reaches the dotted line</b>. Quick sorting and streaks score more!</li>
       <li><b>Keys:</b> <kbd>&larr;</kbd> and <kbd>&rarr;</kbd> to sort, <kbd>P</kbd> to pause.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Begin', () => { level = 1; totalScore = 0; attempted = 0; startLevel(); });
}

function resetLevel() {
  cfg = LEVELS[level - 1];
  items = []; particles = [];
  queue = makeQueue();
  spawnT = 0.6;
  hearts = cfg.hearts; mistakes = 0; combo = 0; bestCombo = 0; sortedN = 0; levelScore = 0;
  playT = 0; winT = 0; failT = 0; endTimer = 0;
  shakeT = flashT = 0;
  bubble = null;
  told = {};
  JOSEPH.mood = 'watch'; PHARAOH.mood = 'wow';
}

function startLevel(retry = false) {
  resetLevel();
  if (retry || attempted > 0) { beginPlay(); return; }
  attempted++;
  levelCard();
}

function levelCard() {
  state = 'intro';
  syncAmbience();
  showOverlay(`Level ${level}`, cfg.name,
    `${verseHTML(cfg.verse)}
     <p class="tip">${cfg.tip}</p>
     <p class="tip">Sort <b>${cfg.count}</b> &middot; Hearts: <b>${'♥'.repeat(cfg.hearts)}</b></p>`,
    'Go!', beginPlay);
}

function beginPlay() {
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  attempted = Math.max(attempted, 1);
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  if (level === 1) say('Fat ones go left. Thin ones go right!', 3.4);
  if (level === 3) say('Heads of grain! Full ones left, thin ones right.', 3.4);
  if (level === 5) say('Colours are mixed up! Look at the shape.', 3.4);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const b = lastBonus;
    const last = level === LEVELS.length;
    showOverlay(last ? 'Dreams explained!' : 'Well done!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(last ? 'plenty' : 'wise')}
       ${last ? '<p style="text-align:center">Joseph told Pharaoh: seven good years, then seven hungry years. Pharaoh put Joseph in charge of storing up food, so that everyone could be fed!</p>' : ''}
       <p class="score">Sorted: <b>${sortedN} / ${cfg.count}</b> &nbsp;&middot;&nbsp; Best streak: <b>${bestCombo}</b><br>Hearts left: <b>${b.heartBonus}</b>${b.perfect ? `<br>No mistakes!: <b>${b.perfect}</b>` : ''}<br>Level bonus: <b>${b.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      last ? 'Play again' : 'Next dream', last
        ? () => { level = 1; totalScore = 0; attempted = 0; startLevel(); }
        : () => { level++; attempted = 0; startLevel(); });
    if (last) state = 'done';
  } else if (state === 'fail') {
    showOverlay('Oh dear!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">Some got mixed up or walked past. Look at their <b>shape</b>: fat and full go <b>left</b>, thin and dry go <b>right</b>. Be quick!</p>
       ${verseHTML('answer')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => { totalScore -= levelScore; levelScore = 0; startLevel(true); });
  }
}

function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => { totalScore -= levelScore; levelScore = 0; startLevel(true); });
  } else if (state === 'pause') {
    if (pausedFrom === 'intro') { levelCard(); return; }
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { totalScore -= levelScore; levelScore = 0; startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && winT > 1.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') sortLead('left');
    if (e.code === 'ArrowRight' || e.code === 'KeyD') sortLead('right');
  }
});

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'win' && winT > 1.2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  sortLead(p.vx < viewW / 2 ? 'left' : 'right');
});

canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);

document.addEventListener('gesturestart', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
Object.assign(sfx, {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  good(combo) { if (this.ctx) Music.tap(clamp(0.2 + combo * 0.06, 0, 1)); },
  chime() { [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.4, 'sine', 0.1, i * 0.08)); },
  moo(fat) { this.tone(fat ? 170 : 210, 0.5, 'sawtooth', 0.05, 0.05, fat ? 120 : 160); },
  wrong() { this.tone(260, 0.22, 'triangle', 0.25, 0, 150); this.tone(200, 0.3, 'triangle', 0.2, 0.12, 110); },
  miss() { this.tone(330, 0.3, 'sine', 0.22, 0, 200); },
  soft() { this.tone(500, 0.08, 'sine', 0.08); },
  splash() { this.noiseBurst(1400, 0.35, 0.18, 0.7, 500); },
});

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Rendering: the dream by the Nile
// ============================================================
function drawSky() {
  // view coordinates: the whole screen
  const g = ctx.createLinearGradient(0, 0, 0, offY + RIVER_Y);
  g.addColorStop(0, '#4a3a7a');
  g.addColorStop(0.55, '#a978b8');
  g.addColorStop(1, '#f7c08e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, offY + RIVER_Y + 2);
  // twinkling dream stars
  for (let k = 0; k < 40; k++) {
    const x = hash(k, 1) * viewW, y = hash(k, 2) * (offY + RIVER_Y * 0.6);
    const a = 0.35 + 0.35 * Math.sin(t * 2 + k);
    ctx.fillStyle = `rgba(255,250,230,${a})`;
    ctx.beginPath(); ctx.arc(x, y, 1 + hash(k, 3) * 1.6, 0, TAU); ctx.fill();
  }
  // a big soft sun low over the river
  const sx = offX + W * 0.72, sy = offY + RIVER_Y - 40;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 120);
  sg.addColorStop(0, 'rgba(255,240,180,0.95)'); sg.addColorStop(0.35, 'rgba(255,210,130,0.6)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 120, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
  // drifting dream clouds
  for (let k = 0; k < 4; k++) {
    const cx = ((hash(k, 7) * viewW + t * (8 + k * 3)) % (viewW + 300)) - 150;
    const cy = offY * 0.5 + 40 + k * 55 + (offY > 0 ? 0 : 60);
    cloud(cx, cy, 90 + k * 20, 'rgba(255,235,245,0.55)');
  }
}

function cloud(x, y, w, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, w * 0.16, 0, 0, TAU);
  ctx.ellipse(x - w * 0.2, y - w * 0.08, w * 0.22, w * 0.16, 0, 0, TAU);
  ctx.ellipse(x + w * 0.12, y - w * 0.12, w * 0.26, w * 0.2, 0, 0, TAU);
  ctx.fill();
}

function drawFarBank() {
  // pyramids and palms on the far side of the river (playfield coords)
  const base = RIVER_Y + 2;
  ctx.fillStyle = '#e7b977';
  ctx.fillRect(-offX, base - 26, viewW, 28);
  const pyr = (x, w, h, c) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(x - w / 2, base - 18); ctx.lineTo(x, base - 18 - h); ctx.lineTo(x + w / 2, base - 18); ctx.fill();
    ctx.fillStyle = 'rgba(120,70,30,0.25)';
    ctx.beginPath(); ctx.moveTo(x, base - 18 - h); ctx.lineTo(x + w / 2, base - 18); ctx.lineTo(x + w * 0.1, base - 18); ctx.fill();
  };
  pyr(W * 0.18, 150, 96, '#e0a85e');
  pyr(W * 0.34, 100, 62, '#d89c56');
  pyr(W * 0.88, 120, 76, '#dca25a');
  for (const px of [W * 0.05, W * 0.5, W * 0.62, W * 0.97]) palm(px, base - 14, 0.7);
}

function palm(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -40, 2, -80); ctx.stroke();
  ctx.fillStyle = '#3f8f4a';
  for (let k = 0; k < 6; k++) {
    const a = -Math.PI / 2 + (k - 2.5) * 0.55 + Math.sin(t * 1.2 + x) * 0.05;
    ctx.save(); ctx.translate(2, -80); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(24, 0, 26, 7, 0.25, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawRiver() {
  const g = ctx.createLinearGradient(0, RIVER_Y, 0, BANK_Y);
  g.addColorStop(0, '#5fa7c9'); g.addColorStop(1, '#3f86b0');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, RIVER_Y, viewW, BANK_Y - RIVER_Y + 4);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let k = 0; k < 18; k++) {
    const x = ((hash(k, 4) * (viewW + 100) + t * 18 * (1 + hash(k, 5))) % (viewW + 100)) - offX - 50;
    const y = RIVER_Y + 12 + hash(k, 6) * (BANK_Y - RIVER_Y - 20);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 4, x + 22, y); ctx.stroke();
  }
  // reeds along the near edge
  for (let k = 0; k < Math.ceil(viewW / 26); k++) {
    const x = -offX + k * 26 + hash(k, 8) * 14;
    if (Math.abs(x - CX()) < 70) continue;
    const h = 22 + hash(k, 9) * 26, sw = Math.sin(t * 1.5 + k) * 3;
    ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, BANK_Y + 6); ctx.quadraticCurveTo(x + sw, BANK_Y - h / 2, x + sw * 2, BANK_Y - h); ctx.stroke();
    ctx.fillStyle = '#7a4a22';
    ctx.beginPath(); ctx.ellipse(x + sw * 2, BANK_Y - h, 3, 7, 0, 0, TAU); ctx.fill();
  }
}

function drawGround() {
  // near bank: a green meadow on the left, dry cracked ground on the right, the path between
  const g = ctx.createLinearGradient(0, BANK_Y, 0, H);
  g.addColorStop(0, '#d9b874'); g.addColorStop(1, '#caa25e');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, BANK_Y, viewW, H - BANK_Y + 2);
  // the meadow (left)
  const cx = CX();
  ctx.fillStyle = '#7cbf54';
  ctx.beginPath();
  ctx.moveTo(-offX, BANK_Y + 30);
  ctx.lineTo(cx - pathHalf(BANK_Y + 30) - 26, BANK_Y + 30);
  ctx.lineTo(cx - pathHalf(H) - 40, H);
  ctx.lineTo(-offX, H);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8fcf62';
  for (let k = 0; k < 40; k++) {
    const x = -offX + hash(k, 11) * (cx + offX - 160), y = BANK_Y + 50 + hash(k, 12) * (H - BANK_Y - 60);
    if (x > cx - pathHalf(y) - 40) continue;
    ctx.beginPath(); ctx.ellipse(x, y, 14, 5, 0, 0, TAU); ctx.fill();
  }
  // flowers
  for (let k = 0; k < 22; k++) {
    const x = -offX + hash(k, 13) * (cx + offX - 160), y = BANK_Y + 60 + hash(k, 14) * (H - BANK_Y - 70);
    if (x > cx - pathHalf(y) - 40) continue;
    ctx.fillStyle = pick2(k, ['#fff', '#ffd84a', '#ff9ab0']);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
  }
  // the dry field (right)
  ctx.fillStyle = '#c8a26a';
  ctx.beginPath();
  ctx.moveTo(W + offX, BANK_Y + 30);
  ctx.lineTo(cx + pathHalf(BANK_Y + 30) + 26, BANK_Y + 30);
  ctx.lineTo(cx + pathHalf(H) + 40, H);
  ctx.lineTo(W + offX, H);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,40,0.45)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 26; k++) {
    const x = cx + 170 + hash(k, 15) * (W + offX - cx - 170), y = BANK_Y + 60 + hash(k, 16) * (H - BANK_Y - 80);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y + 4); ctx.lineTo(x + 16, y - 2); ctx.moveTo(x + 10, y + 4); ctx.lineTo(x + 12, y + 12); ctx.stroke();
  }
  // dry shrubs
  for (let k = 0; k < 6; k++) {
    const x = cx + 180 + hash(k, 17) * (W + offX - cx - 200), y = BANK_Y + 70 + hash(k, 18) * (H - BANK_Y - 120);
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
    for (let j = -2; j <= 2; j++) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + j * 6, y - 14 - Math.abs(j) * -2); ctx.stroke(); }
  }
  // the path
  ctx.fillStyle = '#e9cf98';
  ctx.beginPath();
  ctx.moveTo(cx - pathHalf(BANK_Y), BANK_Y); ctx.lineTo(cx + pathHalf(BANK_Y), BANK_Y);
  ctx.lineTo(cx + pathHalf(H), H); ctx.lineTo(cx - pathHalf(H), H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(160,120,60,0.35)'; ctx.lineWidth = 2;
  ctx.stroke();
  // the dotted "too late" line
  ctx.setLineDash([10, 9]);
  ctx.strokeStyle = state === 'play' ? `rgba(200,60,60,${0.55 + 0.25 * Math.sin(t * 5)})` : 'rgba(200,60,60,0.5)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx - pathHalf(MISS_Y), MISS_Y); ctx.lineTo(cx + pathHalf(MISS_Y), MISS_Y); ctx.stroke();
  ctx.setLineDash([]);
}
function pick2(k, arr) { return arr[k % arr.length]; }

function drawSigns() {
  for (const side of ['left', 'right']) {
    const r = signRect(side);
    const press = pressFx[side] > 0 ? 3 : 0;
    const good = side === 'left';
    const it = lead();
    const hint = state === 'play' && it && level === 1 && sortedN + mistakes < 3 && (it.good === good) && it.mode === 'walk';
    ctx.save();
    ctx.translate(0, press);
    if (hint) {
      ctx.fillStyle = `rgba(255,240,150,${0.45 + 0.35 * Math.sin(t * 8)})`;
      roundRect(r.x - 7, r.y - 7, r.w + 14, r.h + 14, 24); ctx.fill();
    }
    ctx.fillStyle = 'rgba(60,30,10,0.3)';
    roundRect(r.x, r.y + 5, r.w, r.h, 20); ctx.fill();
    ctx.fillStyle = good ? '#5fae3e' : '#b07a3e';
    roundRect(r.x, r.y, r.w, r.h, 20); ctx.fill();
    ctx.strokeStyle = good ? '#3d7f26' : '#7a5022'; ctx.lineWidth = 3; ctx.stroke();
    // arrow
    ctx.fillStyle = '#fff';
    const ax = good ? r.x + 24 : r.x + r.w - 24, ay = r.y + r.h / 2, d = good ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(ax + d * 12, ay); ctx.lineTo(ax - d * 6, ay - 13); ctx.lineTo(ax - d * 6, ay + 13); ctx.fill();
    // icon: a little cow, fat or thin
    const ix = good ? r.x + 66 : r.x + r.w - 66;
    drawCow({ fat: good ? 0.95 : 0.12, col: good ? COW_COLS[0] : THIN_COLS[0], mode: 'pen', phase: 0, idx: good ? 1 : 2 }, ix, ay + 30, 0.62);
    ctx.fillStyle = '#fff';
    ctx.font = '700 19px Fredoka, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tx = good ? (ix + 26 + r.x + r.w) / 2 : (r.x + ix - 26) / 2;
    const room = good ? r.x + r.w - ix - 30 : ix - 30 - r.x;
    if (room > 70) {
      ctx.fillText(good ? 'FAT' : 'THIN', tx, ay - 10);
      ctx.font = '600 13px Fredoka, sans-serif';
      ctx.fillText(good ? 'good years' : 'hungry years', tx, ay + 12);
    }
    ctx.restore();
  }
}

function drawPeople() {
  const cx = CX();
  const it = lead();
  const look = it ? clamp((it.x - cx) / 100, -1, 1) : 0;
  const gap = Math.max(118, W * 0.17);
  if (state === 'play') { JOSEPH.mood = combo >= 5 ? 'joy' : 'watch'; if (combo < 5 && it && it.tricky) JOSEPH.mood = 'wow'; }
  drawPerson(PHARAOH, cx - gap, BANK_Y + 92, 0.95, 1);
  drawPerson(JOSEPH, cx + gap, BANK_Y + 92, 0.95, -1, state === 'play' && it ? -1 : 0);
}

function drawLeadMarker() {
  const it = lead();
  if (!it || state !== 'play') return;
  const s = depthScale(it.y);
  ctx.save();
  ctx.strokeStyle = `rgba(255,240,140,${0.6 + 0.3 * Math.sin(t * 8)})`;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(it.x, it.y, 46 * s + 6, 12 * s + 4, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawBubble() {
  if (!bubble) return;
  const a = clamp(bubble.t / 0.3, 0, 1);
  const gap = Math.max(118, W * 0.17);
  const jx = CX() + gap, jy = BANK_Y + 92 - 100;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 17px Fredoka, sans-serif';
  const lines = wrapText(bubble.text, Math.min(240, W * 0.5));
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 26, bh = lines.length * 21 + 16;
  let bx = clamp(jx - bw + 40, 8 - offX, W + offX - bw - 8), by = jy - bh - 12;
  ctx.fillStyle = 'rgba(255,252,240,0.96)';
  roundRect(bx, by, bw, bh, 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(jx - 4, by + bh - 1); ctx.lineTo(jx + 6, by + bh + 12); ctx.lineTo(jx + 14, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#4a3418'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 9 + i * 21));
  ctx.restore();
}

function drawDreamFrame() {
  // soft dreamy edges (view coordinates)
  const g = ctx.createRadialGradient(viewW / 2, viewH / 2, Math.min(viewW, viewH) * 0.45, viewW / 2, viewH / 2, Math.max(viewW, viewH) * 0.78);
  g.addColorStop(0, 'rgba(255,240,255,0)');
  g.addColorStop(1, 'rgba(230,200,255,0.45)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, viewH);
}

function drawHUD() {
  ctx.save();
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(40,28,70,0.85)'); hg.addColorStop(1, 'rgba(40,28,70,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, viewW, TOPH);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? "Pharaoh's Dreams" : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    ctx.font = '600 15px Fredoka, sans-serif';
    const done = sortedN + mistakes;
    ctx.fillText(`Sorted ${Math.min(done, cfg.count)} / ${cfg.count}`, 12, 50);
    // hearts
    for (let k = 0; k < cfg.hearts; k++) heart(viewW - 24 - k * 30, 44, k < hearts);
    ctx.textAlign = 'right';
    ctx.font = '700 18px Fredoka, sans-serif';
    ctx.fillText(`${totalScore}`, viewW - 12, 84);
    if (combo >= 3) {
      ctx.font = '600 14px Fredoka, sans-serif';
      ctx.fillStyle = '#ffe066';
      ctx.fillText(`streak ${combo}${combo >= 5 ? ' ×' + (1 + Math.floor(combo / 5) * 0.5) : ''}`, viewW - 12, 104);
    }
  }
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function heart(x, y, full) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = full ? '#e8505b' : 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-14, -2, -8, -14, 0, -6);
  ctx.bezierCurveTo(8, -14, 14, -2, 0, 8);
  ctx.fill();
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = offY + RIVER_Y - 60;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(40,25,60,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawSky();
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawFarBank();
  drawRiver();
  drawGround();
  // pens first (sorted ones), then the path walkers, nearest last
  const drawn = [...items].sort((a, b) => a.y - b.y);
  drawPeople();
  for (const it of drawn) if (it.mode === 'pen') drawItem(it);
  drawLeadMarker();
  for (const it of drawn) if (it.mode !== 'pen') drawItem(it);
  drawSigns();
  drawBubble();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawDreamFrame();
  drawParticles();
  if (state === 'fail') {
    ctx.fillStyle = `rgba(40,25,60,${clamp(failT / 1.5, 0, 0.35)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  pressFx.left = Math.max(0, pressFx.left - dt);
  pressFx.right = Math.max(0, pressFx.right - dt);
  if (state === 'play') {
    playT += dt;
    if (queue.length) {
      spawnT -= dt;
      // never let them crowd: wait until the last one has walked clear of the river
      const newest = items.filter((i) => i.mode === 'walk' || i.mode === 'rise').reduce((m, i) => Math.min(m, i.y), Infinity);
      if (spawnT <= 0 && newest > BANK_Y + 46) { spawnItem(); spawnT = cfg.gap * rand(0.85, 1.15); }
    }
    updateItems(dt);
  } else if (state === 'win' || state === 'done') {
    winT += dt;
    updateItems(dt);
    if (Math.random() < dt * 8) spawn(rand(0, viewW), rand(TOPH, viewH * 0.5), 0, -20, 1.2, '#fff6d0', 3, 0, 'star');
  } else if (state === 'fail') {
    failT += dt;
    updateItems(dt);
  } else {
    updateItems(dt);
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
