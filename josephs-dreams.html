<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1440">
<title>Joseph’s Dreams</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1440;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(60, 30, 10, 0.25);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Joseph’s Dreams</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'strings', ambience: 'night', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  dreamed: { ref: 'Genesis 37:5', KJV: 'And Joseph dreamed a dream, and he told it his brethren', NKJV: 'Now Joseph had a dream, and he told it to his brothers', NIV: 'Joseph had a dream, and when he told it to his brothers', NLT: 'One night Joseph had a dream, and when he told his brothers about it' },
  // Level cards: the first dream
  sheaves: { ref: 'Genesis 37:7', KJV: 'we were binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf.', NKJV: 'There we were, binding sheaves in the field. Then behold, my sheaf arose and also stood upright; and indeed your sheaves stood all around and bowed down to my sheaf.', NIV: 'We were binding sheaves of grain out in the field when suddenly my sheaf rose and stood upright, while your sheaves gathered around mine and bowed down to it.', NLT: 'We were out in the field, tying up bundles of grain. Suddenly my bundle stood up, and your bundles all gathered around and bowed low before mine!' },
  // Level cards: the second dream
  stars: { ref: 'Genesis 37:9', KJV: 'Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance to me.', NKJV: 'Look, I have dreamed another dream. And this time, the sun, the moon, and the eleven stars bowed down to me.', NIV: 'I had another dream, and this time the sun and moon and eleven stars were bowing down to me.', NLT: 'Listen, I have had another dream,” he said. “The sun, moon, and eleven stars bowed low before me!' },
  // Fail card
  listen: { ref: 'Genesis 37:6', KJV: 'Hear, I pray you, this dream which I have dreamed', NKJV: 'Please hear this dream which I have dreamed', NIV: 'Listen to this dream I had', NLT: 'Listen to this dream' },
  // Win card
  father: { ref: 'Genesis 37:11', KJV: 'but his father observed the saying.', NKJV: 'but his father kept the matter in mind.', NIV: 'but his father kept the matter in mind.', NLT: 'his father wondered what the dreams meant.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes tent roof above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}


// ============================================================
//  Levels
// ============================================================
const LEVELS = [
  { name: 'Sheaves in the Field',   kind: 'field', sheaves: 4,  sky: 0,  from: 2, to: 4, show: 0.95, timeout: 6.0, rot: 0 },
  { name: 'More Sheaves',           kind: 'field', sheaves: 6,  sky: 0,  from: 3, to: 5, show: 0.8,  timeout: 5.0, rot: 0 },
  { name: 'Sun, Moon and Stars',    kind: 'sky',   sheaves: 0,  sky: 6,  from: 3, to: 6, show: 0.7,  timeout: 4.5, rot: 0 },
  { name: 'The Eleven Stars',       kind: 'sky',   sheaves: 0,  sky: 13, from: 4, to: 6, show: 0.62, timeout: 4.0, rot: 0 },
  { name: 'Both Dreams',            kind: 'both',  sheaves: 5,  sky: 6,  from: 5, to: 7, show: 0.56, timeout: 3.6, rot: 0 },
  { name: 'The Turning Sky',        kind: 'sky',   sheaves: 0,  sky: 13, from: 5, to: 8, show: 0.52, timeout: 3.4, rot: 0.11 },
];
const NUM_LEVELS = LEVELS.length;
const HEARTS = 3;
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'Q', 'W', 'E'];
const RIBBONS = ['#d8443a', '#3b6fd1', '#46a84a', '#8a50c6', '#f2872a', '#ee7fb6', '#3fb5b0', '#c9a12a', '#6b4a2a', '#e84a5f', '#5a6475'];
const STAR_COLS = ['#fff7c2', '#cfe8ff', '#ffd6ec', '#d9ffd0', '#ffe2b0', '#e6dcff'];

function makeConfig(n) { return LEVELS[clamp(n, 1, NUM_LEVELS) - 1]; }

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | pause | win | fail
let pausedFrom = 'play';
let level = 1;
let totalScore = 0, levelScore = 0;
let best = 0;
try { best = +localStorage.getItem('josephDreamsBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let items = [];
let seq = [];             // the dream order (item indexes)
let phase = 'ready';      // ready | show | input | good | oops
let phaseT = 0, showI = 0, inputI = 0, timer = 0;
let hearts = HEARTS, mistakes = 0;
let rot = 0;
let particles = [];
let popups = [];
let message = { text: '', t: 0 };
let flashT = 0, shakeT = 0;
let endTimer = 0, winT = 0, failT = 0;
let told = {};
let lastScore = null;
let hintItem = -1;        // the item that should have been tapped (after a mistake)

// ============================================================
//  Layout (playfield coordinates)
// ============================================================
function layout() {
  const cx = W / 2, cy = 478;
  const rx = Math.min(W / 2 - 58, 430), ry = 262;
  return { cx, cy, rx, ry, s: clamp(rx / 190, 1, 1.45) };
}

function buildItems() {
  items = [];
  const add = (kind, extra = {}) => items.push({ kind, bow: 0, bowT: 0, shakeT: 0, glow: 0, ...extra });
  if (cfg.kind === 'field') {
    for (let i = 0; i < cfg.sheaves; i++) add('sheaf', { a: -Math.PI / 2 + (i + 0.5) * TAU / cfg.sheaves, ribbon: RIBBONS[i] });
  } else if (cfg.kind === 'sky') {
    const n = cfg.sky;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i + 0.5) * TAU / n;
      if (i === 0) add('sun', { a });
      else if (i === Math.floor(n / 2)) add('moon', { a });
      else add('star', { a, col: STAR_COLS[i % STAR_COLS.length], size: 0.85 + (i % 3) * 0.12 });
    }
  } else {
    // sky things across the top, sheaves across the bottom
    const ns = cfg.sky, nf = cfg.sheaves;
    for (let i = 0; i < ns; i++) {
      const a = Math.PI + 0.55 + (i / (ns - 1)) * (Math.PI - 1.1);
      if (i === 0) add('sun', { a });
      else if (i === ns - 1) add('moon', { a });
      else add('star', { a, col: STAR_COLS[i % STAR_COLS.length], size: 0.85 + (i % 3) * 0.12 });
    }
    for (let i = 0; i < nf; i++) add('sheaf', { a: 0.42 + (i / (nf - 1)) * (Math.PI - 0.84), ribbon: RIBBONS[i] });
  }
  items.forEach((it, i) => { it.i = i; it.note = items.length > 1 ? i / (items.length - 1) : 0.5; });
}

function itemPos(it, L = layout()) {
  const a = it.a + rot;
  return { x: L.cx + Math.cos(a) * L.rx, y: L.cy + Math.sin(a) * L.ry };
}
const TAP_R = 46;

// ============================================================
//  The dream
// ============================================================
function resetLevel() {
  cfg = makeConfig(level);
  buildItems();
  seq = [];
  for (let k = 0; k < cfg.from; k++) seq.push(nextItem());
  hearts = HEARTS; mistakes = 0;
  levelScore = 0;
  rot = 0;
  particles = []; popups = [];
  flashT = shakeT = 0;
  endTimer = 0; winT = 0; failT = 0;
  told = {};
  hintItem = -1;
  startShow(true);
}

function nextItem() {
  let c, k = 0;
  do { c = Math.floor(Math.random() * items.length); k++; } while (k < 20 && seq.length && (c === seq[seq.length - 1] || (level <= 2 && seq.includes(c) && seq.length < items.length)));
  return c;
}

function startShow(first = false) {
  phase = 'ready'; phaseT = first ? -0.6 : 0; showI = 0; inputI = 0;
}

function bowItem(it, dur) { it.bowT = dur; it.glow = 1; }

function updateDream(dt) {
  phaseT += dt;
  rot += cfg.rot * dt;
  if (phase === 'ready') {
    if (phaseT >= 0.9) { phase = 'show'; phaseT = 0; showI = 0; hintItem = -1; bowItem(items[seq[0]], cfg.show * 0.75); sfx.note(items[seq[0]]); }
  } else if (phase === 'show') {
    if (phaseT >= cfg.show) {
      showI++; phaseT = 0;
      if (showI >= seq.length) {
        phase = 'input'; inputI = 0; timer = cfg.timeout;
        if (!told.turn) { told.turn = true; showMessage('Your turn! Tap them in the same order', 2.2); }
      } else { bowItem(items[seq[showI]], cfg.show * 0.75); sfx.note(items[seq[showI]]); }
    }
  } else if (phase === 'input') {
    timer -= dt;
    if (timer <= 0) { timer = 0; mistake(null); }
  } else if (phase === 'good') {
    if (phaseT >= 1.1) {
      if (seq.length >= cfg.to) levelWon();
      else { seq.push(nextItem()); startShow(); }
    }
  } else if (phase === 'oops') {
    if (phaseT >= 1.5) startShow();
  }
}

function tapItem(k) {
  if (state !== 'play') return;
  const it = items[k];
  if (!it) return;
  if (phase !== 'input') {
    bowItem(it, 0.2);
    if (!told.watch && (phase === 'show' || phase === 'ready')) { told.watch = true; showMessage('Watch first… then it’s your turn', 1.6); }
    return;
  }
  bowItem(it, 0.32);
  sfx.note(it);
  if (k === seq[inputI]) {
    const pts = Math.round(10 * level + 20 * (timer / cfg.timeout));
    levelScore += pts;
    const p = itemPos(it);
    popups.push({ x: p.x, y: p.y - 50, text: `+${pts}`, t: 0.9, col: '#ffe27a' });
    for (let n = 0; n < 8; n++) spawn(p.x, p.y - 20, rand(-80, 80), rand(-120, -20), rand(0.4, 0.8), '#fff3b0', rand(2, 4), 120, false, 'star');
    inputI++;
    timer = cfg.timeout;
    if (inputI >= seq.length) {
      phase = 'good'; phaseT = 0;
      const bonus = 30 * seq.length;
      levelScore += bonus;
      showMessage(pick(['Well remembered!', 'Just like the dream!', 'Wonderful!', 'You got it!']) + ` +${bonus}`, 1.2);
      sfx.round();
      for (const o of items) bowItem(o, 0.6);
    }
  } else {
    it.shakeT = 0.5;
    mistake(it);
  }
}

function mistake(it) {
  hearts--; mistakes++;
  shakeT = 0.3;
  hintItem = seq[inputI];
  sfx.oops();
  showMessage(it ? 'Oops! Not that one. Watch again…' : 'Too slow! Watch again…', 1.6);
  if (hearts <= 0) { fail(); return; }
  phase = 'oops'; phaseT = 0;
}

// ============================================================
//  Win / fail
// ============================================================
function levelWon() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const heartBonus = hearts * 150;
  const levelBonus = level * 200;
  const score = levelScore + heartBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('josephDreamsBest', best); } catch (e) {} }
  lastScore = { dream: levelScore, heartBonus, levelBonus, score };
  flashT = 0.3;
  showMessage(cfg.kind === 'field' ? 'The sheaves bowed down!' : cfg.kind === 'sky' ? 'The sun, moon and stars bowed down!' : 'What a dream!', 2.4);
  const L = layout();
  for (let k = 0; k < 50; k++) spawn(L.cx + rand(-60, 60), L.cy + rand(-80, 20), rand(-200, 200), rand(-220, -40), rand(0.8, 1.6), pick(STAR_COLS), rand(3, 6), 100, false, 'star');
  sfx.win();
  endTimer = 3.4;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('Joseph woke up!', 2);
  sfx.fail();
  endTimer = 2.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';
  ovBtn2.classList.toggle('hidden', !btn2);
  ovAction2 = action2;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });


function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1;
  cfg = makeConfig(1);
  buildItems();
  showOverlay('Joseph’s Dreams', 'Remember what the dream showed',
    `${verseHTML('dreamed')}
     <ul>
       <li>Joseph is dreaming! In his dream the <b>sheaves of grain</b> (and later the <b>sun, moon and stars</b>) <b>bow down</b> one after another.</li>
       <li><b>Watch</b> the order carefully. Then <b>tap them in the same order</b>.</li>
       <li>Each time you get it right, the dream gets <b>one step longer</b>.</li>
       <li>Tap quickly for more points. A wrong tap, or waiting too long, costs a heart. Lose 3 hearts and Joseph <b>wakes up</b>!</li>
       <li>Listen too: every sheaf and star sings its <b>own note</b>.</li>
       <li><b>Keys:</b> the number shown on each one (<kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd>, <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd>).</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Start dreaming', () => { level = 1; totalScore = 0; levelCard(); });
}

const LEVEL_TIPS = [
  'Four sheaves. Watch them bow, then tap them in the same order.',
  'Six sheaves now, and longer dreams. Each sheaf has its own coloured ribbon.',
  'Joseph’s second dream: the sun, the moon and the stars! Listen for each one’s note.',
  'The sun, the moon and all eleven stars. Remember where each one is!',
  'Both dreams at once: stars in the sky and sheaves in the field, and the dream goes faster.',
  'The whole sky slowly turns as the dream goes on. Keep your eyes on the right stars!',
];

function levelCard() {
  state = 'title';
  syncAmbience();
  cfg = makeConfig(level);
  buildItems();
  showOverlay(`Level ${level}`, cfg.name,
    `<p style="text-align:center">${LEVEL_TIPS[level - 1]}</p>
     ${verseHTML(cfg.kind === 'field' ? 'sheaves' : 'stars')}
     <p class="score">Dreams from ${cfg.from} to ${cfg.to} steps long<br>Score so far: <b>${totalScore}</b></p>`,
    'Dream!', () => startLevel());
}

function startLevel(retry = false) {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(retry ? 'Watch the dream…' : `Level ${level}: ${cfg.name}`, 1.8);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= NUM_LEVELS;
    showOverlay(last ? 'Every dream remembered!' : 'Well remembered!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(last ? 'father' : cfg.kind === 'field' ? 'sheaves' : 'stars')}
       <p style="text-align:center">${last ? 'Joseph’s father kept the dreams in mind. Many years later, in Egypt, Joseph’s brothers really did bow down before him, and God used Joseph to save them all.' : 'Joseph told his family the dream. God had big plans for Joseph!'}</p>
       <p class="score">Dream steps: <b>${s.dream}</b><br>Hearts left (${hearts}): <b>${s.heartBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      last ? 'Play again' : 'Next dream', () => {
        if (last) titleScreen();
        else { level++; levelCard(); }
      });
  } else if (state === 'fail') {
    showOverlay('Joseph woke up!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The dream faded away. <b>Watch</b> and <b>listen</b> carefully, then tap them back in the <b>same order</b>.</p>
       ${verseHTML('listen')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

const keys = new Set();

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 1.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat) {
    const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code) || /^Key([QWE])$/.exec(e.code);
    if (m) {
      const k = KEYS.indexOf(m[1]);
      if (k >= 0 && k < items.length) tapItem(k);
    }
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}


function itemAt(px, py) {
  const L = layout();
  let bestK = -1, bd = TAP_R * L.s;
  for (const it of items) {
    const p = itemPos(it, L);
    const d = Math.hypot(px - p.x, py - (p.y - (it.kind === 'sheaf' ? 22 * L.s : 0)));
    if (d < bd) { bd = d; bestK = it.i; }
  }
  return bestK;
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'win' && winT > 1.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const k = itemAt(p.vx - offX, p.vy - offY);
  if (k >= 0) tapItem(k);
});

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and

const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });

document.addEventListener('gesturestart', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },

// ============================================================
//  Sound (tiny WebAudio synth + music.js)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  fail() { if (this.ctx) Music.fail(); },
  levelStart() { if (this.ctx) Music.start(); },
  note(it) { if (this.ctx) Music.tap(it.note); },
  round() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.35, 'sine', 0.09, i * 0.07)); },
  oops() { this.tone(330, 0.3, 'triangle', 0.2, 0, 220); this.noiseBurst(900, 0.35, 0.12, 0.7, 400); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Particles and popups
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, scr = false, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, scr, kind, rot: rand(0, TAU) });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 4;
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; popups[i].y -= 30 * dt; if (popups[i].t <= 0) popups.splice(i, 1); }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.kind === 'star') drawStar(p.x, p.y, p.size * 1.4, p.rot);
    else if (p.kind === 'thread') {
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p.x + Math.cos(p.rot) * 8, p.y + Math.sin(p.rot) * 8, p.x + 10, p.y + 3); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawStar(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}


// ============================================================
//  People
// ============================================================
const JOSEPH = { robe: '#e8dcc0', hair: '#4a2f1a', beard: false, skin: '#e3b184', kid: true, i: 3, blink: 0, blinkT: 3, phase: 1.3, stripes: ['#d8443a', '#f4c430', '#46a84a', '#3b6fd1', '#8a50c6'] };
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';
  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      eyes(3.5, 3, 2);
      brows(-9, -5, -9, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
  }
}

function drawScarf(d, hy) {
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
}

// d.stripes (optional): colours for a striped robe (Joseph's new coat)
function drawPerson(d, mood, x, y, s, lookX, lookY, holding = null) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (d.kid) s *= 0.8;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = d.stripes ? d.stripes[0] : shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const [lx, ly] = lookAt(x, y - 60 * s, lookX, lookY);
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  }
  // robe
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fillStyle = d.robe; ctx.fill();
  if (d.stripes) {
    ctx.save(); ctx.clip();
    const n = d.stripes.length, h = 41 / n;
    d.stripes.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-20, -41 + i * h, 40, h + 0.5); });
    ctx.restore();
  }
  ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5; ctx.stroke();
  if (!d.stripes) {
    ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }
  if (mood === 'watch' || mood === 'wow') {
    if (holding === 'needle') {
      arm(-11, -32, -15, -12);
      arm(11, -32, 20, -28);
      ctx.strokeStyle = '#cfd6de'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(18, -24); ctx.lineTo(28, -38); ctx.stroke();
    } else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried' || mood === 'dismay') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);
  }
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) drawScarf(d, hy);
  else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 24, 0, hy + 26);
    ctx.quadraticCurveTo(14, hy + 24, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);
  ctx.restore();
}


// ============================================================
//  Rendering
// ============================================================
const BG_STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.6, 1.8), p: rand(0, TAU) }));

function dreamFade() {
  if (state === 'fail') return clamp(1 - failT / 1.6, 0.15, 1);
  return 1;
}

function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, viewH);
  g.addColorStop(0, '#120e2e'); g.addColorStop(0.6, '#2b2160'); g.addColorStop(1, '#3d2c63');
  ctx.fillStyle = g; ctx.fillRect(0, 0, viewW, viewH);
  for (const s of BG_STARS) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.5 + s.p);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x * viewW, s.y * viewH * 0.85, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDreamWorld(L) {
  const fade = dreamFade();
  ctx.save();
  ctx.globalAlpha = fade;
  // the dream's soft glow
  const dg = ctx.createRadialGradient(L.cx, L.cy, 30, L.cx, L.cy, L.rx + 260);
  dg.addColorStop(0, 'rgba(255,236,170,0.35)'); dg.addColorStop(0.55, 'rgba(180,150,255,0.14)'); dg.addColorStop(1, 'rgba(180,150,255,0)');
  ctx.fillStyle = dg; ctx.fillRect(L.cx - L.rx - 300, L.cy - L.ry - 300, (L.rx + 300) * 2, (L.ry + 300) * 2);
  // a field of grain under the sheaves
  if (cfg.kind !== 'sky') {
    const fy = cfg.kind === 'both' ? L.cy + L.ry * 0.5 : L.cy + 10;
    const fr = cfg.kind === 'both' ? L.ry * 0.75 : L.ry + 60, frx = L.rx + 80;
    ctx.save();
    ctx.translate(L.cx, fy); ctx.scale(frx / fr, 1);
    const fg = ctx.createRadialGradient(0, 0, fr * 0.2, 0, 0, fr);
    fg.addColorStop(0, 'rgba(214,178,80,0.85)'); fg.addColorStop(0.7, 'rgba(170,135,60,0.6)'); fg.addColorStop(1, 'rgba(120,90,60,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, fr, 0, TAU); ctx.fill();
    ctx.restore();
    // little stalks of grain growing in the field
    ctx.strokeStyle = 'rgba(255,230,140,0.35)'; ctx.lineWidth = 2;
    for (let k = 0; k < 46; k++) {
      const a = k * 2.39996, r = Math.sqrt((k + 0.5) / 46) * 0.85;
      const x = L.cx + Math.cos(a) * r * frx, y = fy + Math.sin(a) * r * fr;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 12); ctx.moveTo(x, y); ctx.lineTo(x - 3, y - 10); ctx.stroke();
    }
  }
  // the dream ring
  ctx.strokeStyle = 'rgba(255,240,200,0.18)'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
  ctx.beginPath(); ctx.ellipse(L.cx, L.cy, L.rx, L.ry, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  // the middle: Joseph's sheaf, or Joseph himself
  const allBow = state === 'win' ? 1 : 0;
  if (cfg.kind === 'field') {
    drawSheaf(L.cx, L.cy + 40, L.s * 1.45, 0, '#f2d36b', 0.6 + 0.4 * Math.sin(t * 2), '#ffe27a');
  } else {
    ctx.save();
    ctx.shadowColor = '#ffe9a0'; ctx.shadowBlur = 30;
    drawPerson(JOSEPH, allBow ? 'joy' : 'watch', L.cx, L.cy + 50, L.s * 1.25, L.cx, L.cy + 200);
    ctx.restore();
  }
  // the things that bow
  for (const it of items) {
    const p = itemPos(it, L);
    let bow = it.bowT > 0 ? 1 : 0;
    bow = Math.max(bow, allBow);
    it.bow = lerp(it.bow, bow, 0.25);
    const shake = it.shakeT > 0 ? Math.sin(it.shakeT * 50) * 6 : 0;
    const lean = Math.sign(L.cx - p.x) || 1;
    if (it.glow > 0.01 || it.i === hintItem && phase === 'oops') {
      const ga = Math.max(it.glow, it.i === hintItem && phase === 'oops' ? 0.5 + 0.5 * Math.sin(t * 10) : 0);
      const gg = ctx.createRadialGradient(p.x, p.y - 20 * L.s, 4, p.x, p.y - 20 * L.s, 70 * L.s);
      gg.addColorStop(0, `rgba(255,240,160,${0.75 * ga})`); gg.addColorStop(1, 'rgba(255,240,160,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y - 20 * L.s, 70 * L.s, 0, TAU); ctx.fill();
    }
    if (it.kind === 'sheaf') drawSheaf(p.x + shake, p.y, L.s, lean * it.bow * 0.7, '#e0b84e', 0, it.ribbon);
    else {
      // sky things dip toward Joseph
      const dx = (L.cx - p.x) * 0.12 * it.bow, dy = (L.cy - p.y) * 0.12 * it.bow + 10 * it.bow;
      const sc = L.s * (1 + 0.18 * it.bow);
      if (it.kind === 'sun') drawSun(p.x + dx + shake, p.y + dy, sc, it.bow);
      else if (it.kind === 'moon') drawMoon(p.x + dx + shake, p.y + dy, sc, it.bow);
      else drawSkyStar(p.x + dx + shake, p.y + dy, sc * it.size, it.col, it.bow);
    }
    if (showKeyLabels()) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(KEYS[it.i], p.x, p.y + 30 * L.s);
    }
  }
  ctx.restore();
}

function showKeyLabels() { return !matchMedia('(pointer: coarse)').matches; }

function drawSheaf(x, y, s, lean, col, glow, ribbon) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 20, 5, 0, 0, TAU); ctx.fill();
  ctx.rotate(lean);
  if (glow) { ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 20 * glow; }
  // stalks
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(-6, -26); ctx.lineTo(-20, -52); ctx.quadraticCurveTo(0, -62, 20, -52); ctx.lineTo(6, -26); ctx.lineTo(14, 0);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = shade(col.length === 7 ? col : '#e0b84e', -50); ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const k of [-10, -4, 2, 8]) { ctx.moveTo(k * 0.9, -2); ctx.lineTo(k * 0.3, -26); ctx.lineTo(k * 1.4, -50); }
  ctx.stroke();
  // ears of grain on top
  ctx.fillStyle = shade(col, 20);
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath(); ctx.ellipse(k * 6, -56 - Math.abs(k) * -1.5, 3.5, 8, k * 0.25, 0, TAU); ctx.fill();
  }
  // the tie
  ctx.fillStyle = ribbon;
  roundRect(-9, -30, 18, 7, 3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-7, -16); ctx.lineTo(-2, -17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(7, -16); ctx.lineTo(2, -17); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSun(x, y, s, bow) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#ffcf3a';
  for (let k = 0; k < 12; k++) {
    const a = k * TAU / 12 + t * 0.4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a - 0.14) * 22, Math.sin(a - 0.14) * 22); ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34); ctx.lineTo(Math.cos(a + 0.14) * 22, Math.sin(a + 0.14) * 22); ctx.fill();
  }
  const g = ctx.createRadialGradient(-6, -6, 3, 0, 0, 24);
  g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#f7a928');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 23, 0, TAU); ctx.fill();
  drawSkyFace(bow, '#8a4a10');
  ctx.restore();
}
function drawMoon(x, y, s, bow) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f1edd6';
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(180,170,140,0.4)';
  ctx.beginPath(); ctx.arc(-9, -8, 5, 0, TAU); ctx.arc(10, 9, 4, 0, TAU); ctx.arc(8, -11, 3, 0, TAU); ctx.fill();
  drawSkyFace(bow, '#5a5440');
  ctx.restore();
}
function drawSkyStar(x, y, s, col, bow) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  drawStar(0, 0, 24, Math.sin(t * 1.3 + x) * 0.1);
  ctx.shadowBlur = 0;
  ctx.scale(0.7, 0.7);
  drawSkyFace(bow, '#6a5a2a');
  ctx.restore();
}
function drawSkyFace(bow, ink) {
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (bow > 0.5) {
    ctx.beginPath(); ctx.arc(-7, -1, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(7, -1, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-7, -2, 2.6, 0, TAU); ctx.arc(7, -2, 2.6, 0, TAU); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 5, 5, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,0.4)';
  ctx.beginPath(); ctx.arc(-12, 5, 3, 0, TAU); ctx.arc(12, 5, 3, 0, TAU); ctx.fill();
}

// Joseph asleep on his mat at the bottom, dreaming
function drawSleeper(L) {
  const x = L.cx, y = 838;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#7a4fa0';
  roundRect(-95, -6, 190, 26, 12); ctx.fill();
  ctx.fillStyle = '#e8dcc0';
  roundRect(-92, -14, 34, 18, 8); ctx.fill();
  const awake = state === 'fail' && failT > 0.4;
  if (awake) {
    // sitting up, rubbing his eyes
    ctx.fillStyle = '#c9b48a';
    roundRect(-70, -40, 150, 34, 14); ctx.fill();
    ctx.translate(-62, -34);
    ctx.fillStyle = JOSEPH.skin; ctx.beginPath(); ctx.arc(0, -20, 16, 0, TAU); ctx.fill();
    ctx.fillStyle = JOSEPH.hair; ctx.beginPath(); ctx.arc(0, -22, 16.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.beginPath(); ctx.arc(-6, -20, 3, 0, TAU); ctx.arc(6, -20, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -10, 3, 4, 0, 0, TAU); ctx.stroke();
  } else {
    // blanket
    ctx.fillStyle = '#c0392b';
    ctx.beginPath(); ctx.moveTo(-58, 2); ctx.quadraticCurveTo(-40, -30 - Math.sin(t * 1.6) * 2, 20, -26); ctx.quadraticCurveTo(70, -22, 86, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f4c430'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-40, -14); ctx.quadraticCurveTo(10, -28, 70, -8); ctx.stroke();
    // head on the pillow
    ctx.fillStyle = JOSEPH.skin; ctx.beginPath(); ctx.arc(-72, -20, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = JOSEPH.hair; ctx.beginPath(); ctx.arc(-74, -24, 15.5, Math.PI * 0.85, Math.PI * 1.95); ctx.fill();
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-78, -18, 3, 0.1 * Math.PI, 0.9 * Math.PI); ctx.arc(-66, -18, 3, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(-72, -10, 2.5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    // Z z z
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    for (let k = 0; k < 3; k++) {
      const f = ((t * 0.5 + k / 3) % 1);
      ctx.globalAlpha = Math.sin(f * Math.PI);
      ctx.font = `700 ${12 + f * 12}px Fredoka, sans-serif`;
      ctx.fillText('z', -60 + f * 40, -40 - f * 50);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // dream bubbles rising to the dream
  if (!(state === 'fail' && failT > 0.4)) {
    ctx.fillStyle = 'rgba(255,245,220,0.35)';
    for (const [dx, dy, r] of [[-100, -50, 5], [-118, -68, 7], [-140, -90, 9]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, TAU); ctx.fill(); }
  }
}

function drawStatus(L) {
  if (state !== 'play' && state !== 'pause') return;
  const y = 150;
  let text = '';
  if (phase === 'ready' || phase === 'show') text = 'Watch the dream…';
  else if (phase === 'input') text = 'Your turn!';
  else if (phase === 'good') text = 'Well remembered!';
  else if (phase === 'oops') text = 'Watch again…';
  if (message.t > 0) text = '';
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,14,46,0.9)';
  if (text) { ctx.strokeText(text, L.cx, y); ctx.fillStyle = phase === 'input' ? '#ffe27a' : '#e6dcff'; ctx.fillText(text, L.cx, y); }
  // progress dots
  const n = seq.length, gap = Math.min(26, (W - 60) / Math.max(1, n));
  for (let k = 0; k < n; k++) {
    const x = L.cx - gap * (n - 1) / 2 + k * gap;
    const done = phase === 'input' ? k < inputI : phase === 'show' ? k <= showI : phase === 'good';
    ctx.fillStyle = done ? '#ffe27a' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(x, y + 22, 7, 0, TAU); ctx.fill();
  }
  // time to answer
  if (phase === 'input') {
    const f = clamp(timer / cfg.timeout, 0, 1), bw = Math.min(260, W - 80);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    roundRect(L.cx - bw / 2, y + 38, bw, 10, 5); ctx.fill();
    ctx.fillStyle = f < 0.3 ? '#ff8a7a' : '#ffe27a';
    roundRect(L.cx - bw / 2, y + 38, bw * f, 10, 5); ctx.fill();
  }
  ctx.restore();
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = '700 20px Fredoka, sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.4, 0, 1);
    ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,14,46,0.9)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const inGame = state !== 'title';
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Joseph’s Dreams' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (inGame) {
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.fillText(`Score ${totalScore + (state === 'win' ? 0 : levelScore)}   ·   Dream ${seq.length} of ${cfg.to}`, 12, 50);
    ctx.shadowBlur = 0;
    for (let k = 0; k < HEARTS; k++) {
      const x = viewW - 26 - k * 32, y = 84;
      ctx.globalAlpha = k < hearts ? 1 : 0.25;
      drawHeart(x, y, 13, k < hearts ? '#e84a5f' : '#ffffff');
    }
    ctx.globalAlpha = 1;
  }
  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawHeart(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.8);
  ctx.bezierCurveTo(x - r * 1.3, y - r * 0.1, x - r * 0.6, y - r * 1.1, x, y - r * 0.35);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.1, x + r * 1.3, y - r * 0.1, x, y + r * 0.8);
  ctx.fill();
}

function drawMessage() {
  if (message.t <= 0 || state === 'title') return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, Math.min(viewW - 40, 600));
  const y0 = offY + 150;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,14,46,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBackdrop();
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  const L = layout();
  drawDreamWorld(L);
  drawSleeper(L);
  drawStatus(L);
  drawParticles();
  drawPopups();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.2})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  JOSEPH.blinkT -= dt;
  if (JOSEPH.blinkT <= 0) { JOSEPH.blink = 0.13; JOSEPH.blinkT = rand(1.5, 4.5); }
  if (JOSEPH.blink > 0) JOSEPH.blink -= dt;
  for (const it of items) {
    it.bowT = Math.max(0, it.bowT - dt);
    it.shakeT = Math.max(0, it.shakeT - dt);
    it.glow = Math.max(0, it.glow - dt * (it.bowT > 0 ? 0 : 3));
  }
  if (state === 'play') updateDream(dt);
  else if (state === 'win') {
    winT += dt;
    if (Math.random() < dt * 8) { const L = layout(); spawn(L.cx + rand(-L.rx, L.rx), L.cy + rand(-L.ry, L.ry), 0, -30, 1.2, pick(STAR_COLS), 4, 0, false, 'star'); }
  } else if (state === 'fail') failT += dt;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
