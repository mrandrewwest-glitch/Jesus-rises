<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>The Mustard Seed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Mustard Seed</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Overlay cards
  kingdom:   { ref: 'Matthew 13:31', KJV: 'The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field', NKJV: 'The kingdom of heaven is like a mustard seed, which a man took and sowed in his field', NIV: 'The kingdom of heaven is like a mustard seed, which a man took and planted in his field', NLT: 'The Kingdom of Heaven is like a mustard seed planted in a field' },
  greatest:  { ref: 'Matthew 13:32', KJV: 'But when it is grown, it is the greatest among herbs, and becometh a tree, so that the birds of the air come and lodge in the branches thereof.', NKJV: 'But when it is grown it is greater than the herbs and becomes a tree, so that the birds of the air come and nest in its branches.', NIV: 'Yet when it grows, it is the largest of garden plants and becomes a tree, so that the birds come and perch in its branches.', NLT: 'But it becomes the largest of garden plants; it grows into a tree, and birds come and make nests in its branches.' },
  grew:      { ref: 'Luke 13:19',    KJV: 'It is like a grain of mustard seed, which a man took, and cast into his garden; and it grew, and waxed a great tree', NKJV: 'It is like a mustard seed, which a man took and put in his garden; and it grew and became a large tree', NIV: 'It is like a mustard seed, which a man took and planted in his garden. It grew and became a tree', NLT: 'It is like a tiny mustard seed that a man planted in a garden; it grows and becomes a tree' },
  // Speech bubbles (Jesus telling the parable)
  least:     { ref: 'Matthew 13:32', KJV: 'Which indeed is the least of all seeds', NKJV: 'Which indeed is the least of all the seeds', NIV: 'Though it is the smallest of all seeds', NLT: 'It is the smallest of all seeds' },
  liken:     { ref: 'Mark 4:30',     KJV: 'Whereunto shall we liken the kingdom of God? or with what comparison shall we compare it?', NKJV: 'To what shall we liken the kingdom of God? Or with what parable shall we picture it?', NIV: 'What shall we say the kingdom of God is like, or what parable shall we use to describe it?', NLT: 'How can I describe the Kingdom of God? What story should I use to illustrate it?' },
  resemble:  { ref: 'Luke 13:18',    KJV: 'Unto what is the kingdom of God like? and whereunto shall I resemble it?', NKJV: 'What is the kingdom of God like? And to what shall I compare it?', NIV: 'What is the kingdom of God like? What shall I compare it to?', NLT: 'What is the Kingdom of God like? How can I illustrate it?' },
  branches:  { ref: 'Mark 4:32',     KJV: 'Shooteth out great branches', NKJV: 'Shoots out large branches', NIV: 'With such big branches', NLT: 'It grows long branches' },
  lodge:     { ref: 'Matthew 13:32', KJV: 'The birds of the air come and lodge in the branches thereof', NKJV: 'The birds of the air come and nest in its branches', NIV: 'The birds come and perch in its branches', NLT: 'Birds come and make nests in its branches' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => 1 - Math.pow(1 - clamp(f, 0, 1), 3);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Blend two #rrggbb colours
function mix(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = (s) => Math.round(lerp((x >> s) & 255, (y >> s) & 255, clamp(f, 0, 1)));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Camera: the garden is a little world (ground at y = 0, up is
//  negative). The camera eases back as the plant grows.
// ============================================================
const cam = { x: -110, z: 1.3, baseY: H - 190 };
function wp(wx, wy) { return { x: W / 2 + (wx - cam.x) * cam.z, y: cam.baseY + wy * cam.z }; }
function pw(px, py) { return { x: (px - W / 2) / cam.z + cam.x, y: (py - cam.baseY) / cam.z }; }
// On-screen size for bugs, weeds, birds and nests: steady, whatever the zoom
function es() { return clamp(Math.sqrt(cam.z / 0.85), 0.85, 1.45); }

function camTarget() {
  if (state === 'title' || state === 'intro') return { x: -150, z: 1.15, baseY: H - 190 };
  // Fit the plant into the space between the HUD and the ground (phones in
  // portrait have more height, so the tree can be drawn bigger there)
  const baseY = H - 160;
  const avail = baseY + offY - 250;
  if (state === 'win') {
    return { x: -20, z: Math.min(avail / 700, (W / 2) / 300), baseY: H - 130 };
  }
  let z;
  if (plant.stage >= 4) z = Math.min((W / 2 - 12) / 245, avail / 590);
  else z = clamp(Math.min(avail / (plant.h + 110), (W / 2 - 12) / (plant.h * 0.5 + 60)), 0.8, 4);
  // While zoomed in on a small plant, lift the ground so it sits nearer the middle
  const lift = clamp((z - 1) / 2.5, 0, 1) * (170 + offY * 0.6);
  return { x: 0, z, baseY: baseY - lift };
}
function updateCamera(dt) {
  const c = camTarget();
  const k = Math.min(1, dt * (state === 'win' ? 0.9 : 1.6));
  cam.x += (c.x - cam.x) * k;
  cam.z += (c.z - cam.z) * k;
  cam.baseY += (c.baseY - cam.baseY) * k;
}

// ============================================================
//  Tuning
// ============================================================
const STAGE_NAMES = ['Seed', 'Sprout', 'Bush', 'Young tree', 'Branches', 'Great tree'];
const JESUS_X = -200;   // where Jesus stands in the garden (world x)

const LEVEL_NAMES = [
  'A Tiny Seed',
  'The Busy Garden',
  'A Dry Spell',
  'A Windy Day',
  'Birds of the Air',
  'The Greatest Tree',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Great Tree ${n}`,
    needGap: Math.max(3, 8 - (n - 1) * 0.9),          // seconds between needs
    grace: Math.max(4.5, 11 - (n - 1) * 1.2),         // how long a need can wait
    drain: 2.5 + (n - 1) * 0.7,                       // health lost per second per late need
    passive: Math.max(2.5, 4.5 - (n - 1) * 0.3),      // growth while healthy
    stagePts: Math.min(130, 70 + n * 10),
    branchPts: Math.min(60, 35 + n * 4),
    weedGap: Math.max(4, 11 - n),
    maxWeeds: Math.min(6, 2 + Math.floor(n / 2)),
    pestGap: n === 1 ? 20 : Math.max(4.5, 13 - n * 1.5),
    maxPests: Math.min(4, 1 + Math.floor(n / 2)),
    pestSpeed: n === 1 ? 0.75 : 0.9 + (n - 2) * 0.12,
    dry: n === 3 || (n >= 6 && n % 2 === 0),
    wind: n === 4 || (n >= 5 && n % 2 === 1) ? Math.min(1 + (n - 4) * 0.15, 1.6) : 0,
    branches: Math.min(7, 4 + Math.floor(n / 2)),
    birds: Math.min(9, 2 + n),
    birdGap: Math.max(2.5, 5.5 - n * 0.4),
    patience: n >= 3 ? Math.max(8, 17 - (n - 3) * 2.5) : 0,
    par: 80 + n * 30,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | win | fail | pause
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('mustardBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let plant;
let needs = [], weeds = [], pests = [], birds = [], branches = [], spots = [];
let particles = [], tools = [];
let needTimer = 0, weedTimer = 0, pestTimer = 0, birdTimer = 0;
let message = { text: '', t: 0 };
let bubble = null;          // Jesus's speech bubble { text, t }
let introT = 0, introDur = 4;
let endTimer = 0, lastScore = null;
let selBird = null;
let kbCursor = 0, kbShow = false;
const cloud = { cover: 0, target: 0 };
let gust = 0, gustTarget = 0, gustTimer = 0;
let crowdEvent = { mood: 'watch', t: 0 };
let playTime = 0, healthSum = 0, healthN = 0;
let windKnockCd = 0, windHinted = false;
let flashT = 0;

function newPlant() {
  return {
    stage: 0, growth: 0, h: 5, health: 100, droop: 0, droopSide: Math.random() < 0.5 ? -1 : 1,
    mood: 'happy', joyT: 0, credits: 0, chosen: 0,
    soil: 1, soilTarget: 1, wet: 0.6, tilt: 0, sway: 0, pop: 0,
    blink: 0, blinkT: 2,
  };
}

// ============================================================
//  Plant geometry (world units)
// ============================================================
function trunkPt(f) {
  const h = plant.h, b = plant.tilt + plant.sway, d = plant.droop;
  return {
    x: b * h * f * f * 0.6 + d * h * 0.25 * f * f * f * plant.droopSide,
    y: -h * f * (1 - d * 0.14 * f),
  };
}
function trunkW0() { return plant.stage <= 2 ? 9 + plant.h * 0.07 : 14 + plant.h * 0.07; }
function trunkW(f) { return trunkW0() * (1 - f * 0.6); }
function topClumpR() { return plant.stage >= 3 ? 26 + (plant.h - 160) * 0.1 : 0; }

// The places a branch may grow from: five heights on each side of the trunk
const BUD_H = [0.42, 0.54, 0.66, 0.78, 0.9];
const BUDS = [];
BUD_H.forEach((hf, i) => [-1, 1].forEach((side) => BUDS.push({ hf, side, i })));

function budPos(b) {
  const p = trunkPt(b.hf);
  return { x: p.x + b.side * (trunkW(b.hf) / 2 + 4), y: p.y };
}
function budUsed(b) { return branches.some((br) => br.hf === b.hf && br.side === b.side); }

function branchGeom(br) {
  const o = trunkPt(br.hf);
  const a = (br.side > 0 ? -0.55 : Math.PI + 0.55) + (plant.tilt + plant.sway) * 1.2 + plant.droop * 0.5 * br.side;
  const L = br.len * ease(br.grow);
  const end = { x: o.x + Math.cos(a) * L, y: o.y + Math.sin(a) * L };
  const ctrl = { x: (o.x + end.x) / 2, y: (o.y + end.y) / 2 - L * 0.16 };
  return { o, end, ctrl, L };
}
function bez(g, f) {
  const u = 1 - f;
  return {
    x: u * u * g.o.x + 2 * u * f * g.ctrl.x + f * f * g.end.x,
    y: u * u * g.o.y + 2 * u * f * g.ctrl.y + f * f * g.end.y,
  };
}

// Nesting spots: sizes S / M / L, bigger spots on the lower, thicker branches
function spotWorld(s) {
  if (!s.br) { const p = trunkPt(1); return { x: p.x, y: p.y - topClumpR() * 0.55 }; }
  const p = bez(branchGeom(s.br), s.f);
  return { x: p.x, y: p.y - 6 };
}
function spotReady(s) { return plant.stage >= 5 && (!s.br || s.br.grow >= 1); }
const NEST_W = { S: 24, M: 32, L: 40 };
const SIZE_WORD = { S: 'little', M: 'middle-sized', L: 'big' };

function addBranch(b) {
  const len = lerp(165, 95, (b.hf - 0.42) / 0.48);
  const br = { hf: b.hf, side: b.side, len, grow: 0 };
  branches.push(br);
  const sizes = b.i <= 1 ? ['L', 'M'] : b.i <= 3 ? ['M', 'S'] : ['S', 'S'];
  spots.push({ br, f: 0.55, size: sizes[0], bird: null });
  spots.push({ br, f: 1, size: sizes[1], bird: null });
  plant.chosen++;
  plant.credits--;
  const p = wp(budPos(b).x, budPos(b).y);
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), sp = rand(30, 110);
    spawn(p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 1), ['#fff3a0', '#b6f07a', '#ffffff'][i % 3], rand(2, 4));
  }
  sfx.grow(0.4 + plant.chosen / cfg.branches * 0.6);
  plant.joyT = 1;
  kbCursor = 0;
}

function balanceInfo() {
  let sum = 0, tot = 0;
  for (const br of branches) { const w = br.len * ease(br.grow); sum += br.side * w; tot += w; }
  return { sum, tot, imbalance: tot ? Math.abs(sum) / tot : 0 };
}

function hTarget() {
  const g = clamp(plant.growth / cfg.stagePts, 0, 1);
  switch (plant.stage) {
    case 0: return 4 + g * 8;
    case 1: return 22 + g * 38;
    case 2: return 70 + g * 90;
    case 3: return 180 + g * 200;
    case 4: return 400 + (plant.chosen / cfg.branches) * 90;
    default: return 500;
  }
}

function growthFrac() {
  if (plant.stage < 4) return clamp(plant.growth / cfg.stagePts, 0, 1);
  if (plant.stage === 4) return clamp((plant.chosen + (plant.credits > 0 ? 0 : plant.growth / cfg.branchPts)) / cfg.branches, 0, 1);
  return clamp(nestedCount() / cfg.birds, 0, 1);
}

function nestedCount() { return birds.filter((b) => b.state === 'nest').length; }

// ============================================================
//  Needs: water, sunshine and compost, shown as bubbles
// ============================================================
const NEED_TYPES = ['water', 'sun', 'soil'];

function spawnNeed() {
  const free = NEED_TYPES.filter((k) => !needs.some((n) => n.type === k));
  if (!free.length) return;
  const weight = { water: cfg.dry ? 3.2 : 1.3, sun: 1, soil: level === 1 ? 0.6 : 0.9 };
  let r = Math.random() * free.reduce((s, k) => s + weight[k], 0);
  let type = free[0];
  for (const k of free) { r -= weight[k]; if (r <= 0) { type = k; break; } }
  const grace = cfg.grace * (type === 'water' && cfg.dry ? 0.8 : 1);
  needs.push({ type, age: 0, grace, pop: 0 });
  if (type === 'sun') cloud.target = 1;
  if (type === 'soil') plant.soilTarget = 0.2;
  if (type === 'water') plant.wet = 0;
  sfx.pip();
}

function meetNeed(type) {
  const i = needs.findIndex((n) => n.type === type);
  if (type === 'water') { tools.push({ type: 'water', t: 0 }); plant.wet = 1; sfx.splash(); }
  if (type === 'sun') { cloud.target = 0; sfx.puff(0.3); }
  if (type === 'soil') { tools.push({ type: 'soil', t: 0 }); plant.soilTarget = 1; sfx.puff(0.2); }
  if (i < 0) return false;
  const n = needs[i];
  needs.splice(i, 1);
  addGrowth(n.age < n.grace ? 25 : 15);
  plant.joyT = 1.3;
  const p = plantTopP();
  for (let k = 0; k < 12; k++) {
    const a = rand(0, TAU), sp = rand(30, 90);
    spawn(p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp - 30, rand(0.5, 1),
      type === 'water' ? '#8fd3ff' : type === 'sun' ? '#ffe27a' : '#b6f07a', rand(2, 4));
  }
  sfx.tap(0.2 + plant.stage * 0.15);
  return true;
}

function addGrowth(pts) {
  if (plant.stage >= 5) return;
  plant.growth += pts;
}

function plantTopP() {
  if (plant.stage === 0) return wp(0, -10);
  const p = trunkPt(1);
  return wp(p.x, p.y - topClumpR());
}

// Bubbles float in a row above the top of the plant
function bubbleLayout() {
  const top = plantTopP();
  const y = Math.max(top.y - 70, 205 - offY);
  const n = needs.length;
  return needs.map((nd, i) => ({ nd, x: clamp(top.x + (i - (n - 1) / 2) * 78, 40, W - 40), y }));
}

// ============================================================
//  Weeds and pests
// ============================================================
function visHalf() { return W / 2 / cam.z; }

function spawnWeed() {
  if (weeds.length >= cfg.maxWeeds) return;
  const reach = Math.min(150, visHalf() * 0.8);
  for (let tries = 0; tries < 8; tries++) {
    const x = (Math.random() < 0.5 ? -1 : 1) * rand(Math.min(28, reach * 0.5), reach);
    if (weeds.every((w) => Math.abs(w.x - x) > 22 / cam.z * 1.4)) {
      weeds.push({ x, grow: 0, phase: rand(0, TAU), pull: 0 });
      return;
    }
  }
}

function spawnPest() {
  if (plant.stage < 1 || pests.filter((p) => p.phase !== 'flick').length >= cfg.maxPests) return;
  const side = Math.random() < 0.5 ? -1 : 1;
  const type = level >= 2 && Math.random() < 0.4 ? 'snail' : 'cat';
  pests.push({ type, side, phase: 'ground', x: side * (visHalf() + 20), f: 0, wig: rand(0, TAU), vx: 0, vy: 0, px: 0, py: 0, rot: 0, life: 0 });
}

function pestP(pe) {
  if (pe.phase === 'flick') return { x: pe.px, y: pe.py, rot: pe.rot };
  if (pe.phase === 'ground') { const p = wp(pe.x, 0); return { x: p.x, y: p.y - 8 * es(), rot: 0 }; }
  const tp = trunkPt(pe.f);
  const p = wp(tp.x + pe.side * trunkW(pe.f) * 0.5, tp.y);
  return { x: p.x, y: p.y, rot: -Math.PI / 2 };   // head up, feet on the bark
}
function pestTop() { return plant.stage >= 3 ? 0.62 : plant.stage === 2 ? 0.75 : 0.85; }

function flick(pe) {
  const p = pestP(pe);
  pe.phase = 'flick';
  pe.px = p.x; pe.py = p.y; pe.rot = p.rot;
  pe.vx = pe.side * rand(220, 320); pe.vy = -rand(260, 360); pe.life = 1.6;
  addGrowth(10);
  sfx.boing();
  showMessage(pe.type === 'snail' ? pickLine(['Off you go, snail!', 'Boing! Bye, snail!']) : pickLine(['Wheee! Off you go!', 'Flick! Bye, caterpillar!']));
}

function pullWeed(w) {
  if (w.pull) return;
  w.pull = 0.01;
  addGrowth(8);
  const p = wp(w.x, 0);
  for (let i = 0; i < 10; i++) spawn(p.x, p.y, rand(-60, 60), rand(-140, -40), rand(0.5, 0.9), i % 2 ? '#7a5230' : '#5a9a34', rand(2, 4), 300);
  sfx.pop();
}

function pickLine(a) { return a[Math.floor(Math.random() * a.length)]; }

// ============================================================
//  Birds
// ============================================================
const BIRD_TYPES = [
  { name: 'sparrow',  size: 'S', body: '#a8764c', wing: '#6e4a2c', belly: '#ecd6b4', beak: '#e0a040' },
  { name: 'finch',    size: 'S', body: '#f2c230', wing: '#4a4030', belly: '#ffe98a', beak: '#f08a30' },
  { name: 'bluebird', size: 'M', body: '#3d8fd9', wing: '#2a64a8', belly: '#f3a468', beak: '#3a3a3a' },
  { name: 'robin',    size: 'M', body: '#8a6440', wing: '#5f432a', belly: '#ec6a3c', beak: '#e0a040' },
  { name: 'dove',     size: 'L', body: '#f2f2f7', wing: '#c9cedb', belly: '#ffffff', beak: '#e89aa0' },
  { name: 'hoopoe',   size: 'L', body: '#e59c5c', wing: '#3a3030', belly: '#f3c994', beak: '#4a3a30', crest: true },
];
const BIRD_R = { S: 13, M: 17, L: 22 };

function birdWaitSlot(i) { return { x: i === 0 ? 90 : W - 90, y: Math.max(150, 250 - offY) }; }

function spawnBird() {
  const waiting = birds.filter((b) => b.state === 'arrive' || b.state === 'wait');
  if (waiting.length >= 2 || nestedCount() + waiting.length >= cfg.birds) return;
  // Only send birds that have a free spot of their size waiting for them
  const count = { S: 0, M: 0, L: 0 };
  for (const s of spots) if (!s.bird && spotReady(s)) count[s.size]++;
  for (const b of waiting) count[b.size]--;
  const sizes = Object.keys(count).filter((k) => count[k] > 0);
  if (!sizes.length) return;
  const size = sizes[Math.floor(Math.random() * sizes.length)];
  const kinds = BIRD_TYPES.filter((k) => k.size === size);
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  const used = waiting.map((b) => b.slot);
  const slot = used.includes(0) ? 1 : 0;
  const tgt = birdWaitSlot(slot);
  const start = { x: slot === 0 ? -60 : W + 60, y: tgt.y - 80 };
  const ws = pw(start.x, start.y), wt = pw(tgt.x, tgt.y);
  birds.push({
    kind, size, slot, state: 'arrive', x: ws.x, y: ws.y, tx: wt.x, ty: wt.y,
    patience: cfg.patience, flap: rand(0, TAU), facing: slot === 0 ? 1 : -1, spot: null, nestT: 0, hop: 0,
  });
  sfx.chirp(size);
}

function birdP(b) {
  if (b.state === 'nest') {
    const s = wp(spotWorld(b.spot).x, spotWorld(b.spot).y);
    return { x: s.x, y: s.y - BIRD_R[b.size] * es() * 0.5 - Math.abs(Math.sin(b.hop)) * 3 };
  }
  return wp(b.x, b.y);
}

function sendToSpot(b, s) {
  b.state = 'fly';
  b.spot = s;
  s.bird = b;
  if (selBird === b) selBird = null;
  sfx.chirp(b.size);
}

function birdFlyAway(b, why) {
  if (b.spot) b.spot.bird = null;
  b.spot = null;
  b.state = 'leave';
  if (selBird === b) selBird = null;
  b.facing = b.x < 0 ? -1 : 1;
  if (why) showMessage(why);
}

function trySpot(s) {
  if (!spotReady(s) || s.bird) return false;
  let b = selBird;
  if (!b) b = birds.find((x) => x.state === 'wait' && x.size === s.size);
  if (!b) {
    const w = birds.find((x) => x.state === 'wait');
    if (w) showMessage(`That spot is for a ${SIZE_WORD[s.size]} bird.`);
    return true;
  }
  if (b.size !== s.size) {
    showMessage(BIRD_R[b.size] > BIRD_R[s.size] ? `Too small for the ${b.kind.name}!` : `Too big for a little ${b.kind.name}!`);
    sfx.bounce();
    return true;
  }
  sendToSpot(b, s);
  return true;
}

// ============================================================
//  The crowd (they watch Jesus tell the story, then the plant)
// ============================================================
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Mary',        robe: '#7a4fa0', hair: '#3a2716', beard: false, skin: '#c58a55', scarf: '#e8dcc0' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Martha',      robe: '#3c8f86', hair: '#1f140c', beard: false, skin: '#b87a48', scarf: '#d8c7a0' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { name: 'Child',       robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.5),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

// World positions: some beside Jesus on the left, the rest on the right of the garden
const CROWD = [
  { d: 1, x: -262, row: 0, s: 1.2 }, { d: 4, x: -312, row: 0, s: 1.15 }, { d: 0, x: -290, row: 1, s: 1.3 },
  { d: 8, x: -240, row: 1, s: 0.95 },
  { d: 2, x: 232, row: 0, s: 1.2 }, { d: 6, x: 292, row: 0, s: 1.15 }, { d: 5, x: 352, row: 0, s: 1.2 },
  { d: 3, x: 262, row: 1, s: 1.3 }, { d: 7, x: 330, row: 1, s: 1.3 },
];
let lookAt = { x: 0, y: 0 };

function crowdSlots() {
  return CROWD.map((c) => {
    const p = wp(c.x, 0);
    return { d: DISCIPLES[c.d], x: p.x, y: p.y + (c.row === 1 ? 8 : -6) * cam.z, s: c.s * cam.z, row: c.row };
  });
}

function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'intro') return introT > 1 ? 'wow' : 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (crowdEvent.t > 0) return crowdEvent.mood;
  if (plant.health < 35) return 'worried';
  if (pests.some((p) => p.phase === 'eat')) return 'worried';
  return 'watch';
}
function crowdReact(mood, dur = 1.6) { crowdEvent = { mood, t: dur }; }

function updateDisciples(dt) {
  const target = crowdMood();
  for (const d of DISCIPLES) {
    let want = target;
    if (d.name === 'Thomas' && want === 'watch') want = 'doubt';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

function drawDisciple(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward whatever everyone is watching
  let lx = 0, ly = -1;
  {
    const wx = x, wy = slot.y - 52 * s;
    const dx = lookAt.x - wx, dy = lookAt.y - wy;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  // Arms raised for joy / pointing up in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && d.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Jesus, holding up the tiny seed
// ============================================================
function drawJesus(x, y, s, pose, face) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  const up = pose === 'joy';

  if (up || pose === 'hold' || pose === 'teach') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 70);
    g.addColorStop(0, 'rgba(255,235,150,0.45)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 70, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: both raised for joy, one holding up the seed, pointing while teaching
  let hands = [[-20, -22], [20, -22]];
  if (up) hands = [[-21, -66], [21, -66]];
  else if (pose === 'hold') hands = [[-20, -22], [23, -68]];
  else if (pose === 'teach') hands = [[-20, -22], [26, -44 + Math.sin(t * 3) * 3]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (hy < -40 ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }
  // The tiny seed, twinkling between finger and thumb
  if (pose === 'hold') {
    const tw = 0.6 + 0.4 * Math.sin(t * 5);
    const g = ctx.createRadialGradient(23, -73, 0, 23, -73, 10);
    g.addColorStop(0, `rgba(255,240,160,${0.9 * tw})`);
    g.addColorStop(1, 'rgba(255,240,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(23, -73, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b8862e';
    ctx.beginPath(); ctx.arc(23, -72.5, 1.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,250,210,${tw})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(23, -80); ctx.lineTo(23, -77); ctx.moveTo(16, -73); ctx.lineTo(19, -73); ctx.moveTo(27, -73); ctx.lineTo(30, -73); ctx.stroke();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (face === 'talk') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 1 + Math.abs(Math.sin(t * 12)) * 1.4, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  ctx.restore();
}

function jesusPose() {
  if (state === 'win') return ['joy', 'joy'];
  const face = bubble ? 'talk' : 'calm';
  if (state === 'intro' && introT > 0.6) return ['hold', face];
  if (state === 'title' || bubble) return ['teach', face];
  return ['rest', face];
}

function say(text, dur) { bubble = { text, t: dur }; }

// ============================================================
//  Particles (playfield coordinates)
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Main play update
// ============================================================
function updateGust(dt) {
  gustTimer -= dt;
  if (gustTimer <= 0) {
    gustTarget = rand(-1, 1) * (Math.random() < 0.3 ? 1.6 : 1);
    gustTimer = rand(1, 3.5);
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 1.2);
}

// Weeds grow and bugs crawl (also runs behind the end screens so flicks finish)
function updateCritters(dt) {
  // --- Weeds ---
  let bigWeeds = 0;
  for (let i = weeds.length - 1; i >= 0; i--) {
    const w = weeds[i];
    if (w.pull) { w.pull += dt * 3; if (w.pull > 1) weeds.splice(i, 1); continue; }
    w.grow = Math.min(1, w.grow + dt / Math.max(4, 8 - level * 0.6));
    if (w.grow >= 1) bigWeeds++;
  }

  // --- Pests ---
  let eating = 0;
  const pz = cam.z;
  for (let i = pests.length - 1; i >= 0; i--) {
    const pe = pests[i];
    const spd = cfg.pestSpeed * (pe.type === 'snail' ? 0.6 : 1);
    pe.wig += dt * (pe.phase === 'eat' ? 10 : 6) * spd;
    if (pe.phase === 'flick') {
      pe.vy += 700 * dt; pe.px += pe.vx * dt; pe.py += pe.vy * dt; pe.rot += pe.side * 8 * dt;
      pe.life -= dt;
      if (pe.life <= 0) pests.splice(i, 1);
      continue;
    }
    if (pe.phase === 'ground') {
      pe.x -= pe.side * 40 * spd / pz * dt;
      if (pe.side * pe.x <= trunkW0() * 0.5) { pe.phase = 'climb'; pe.f = 0; }
    } else if (pe.phase === 'climb') {
      pe.f += dt * 0.13 * spd * (plant.stage >= 3 ? 0.75 : 1);
      if (pe.f >= pestTop() && state === 'play') {
        pe.phase = 'eat';
        pe.f = pestTop();
        showMessage(pe.type === 'snail' ? 'A snail is nibbling the leaves!' : 'A caterpillar is munching!');
        crowdReact('shock', 1.2);
      }
    } else if (pe.phase === 'eat') {
      eating++;
      if (Math.random() < dt * 6) {
        const q = pestP(pe);
        spawn(q.x, q.y, rand(-30, 30), rand(-20, 10), 0.6, '#6fbf45', rand(1.5, 3), 200);
      }
    }
  }

  return { bigWeeds, eating };
}

function updatePlay(dt) {
  const p = plant;
  playTime += dt;

  // --- Spawners ---
  needTimer -= dt * (p.stage >= 5 ? 0.7 : 1);
  if (needTimer <= 0) { spawnNeed(); needTimer = cfg.needGap * rand(0.75, 1.25); }
  weedTimer -= dt;
  if (weedTimer <= 0) { spawnWeed(); weedTimer = cfg.weedGap * rand(0.7, 1.3); }
  pestTimer -= dt;
  if (pestTimer <= 0) { spawnPest(); pestTimer = cfg.pestGap * rand(0.7, 1.3); }
  if (p.stage >= 5) {
    birdTimer -= dt;
    if (birdTimer <= 0) { spawnBird(); birdTimer = cfg.birdGap * rand(0.8, 1.2); }
  }

  // --- Needs ---
  let late = 0;
  for (const n of needs) {
    n.age += dt;
    n.pop = Math.min(1, n.pop + dt * 4);
    if (n.age > n.grace) late++;
  }

  const { bigWeeds, eating } = updateCritters(dt);

  // --- Health ---
  let drain = late * cfg.drain + bigWeeds * 0.8 + eating * 3;
  if (drain > 0) p.health -= drain * dt;
  else p.health = Math.min(100, p.health + 4 * dt);
  healthSum += p.health * dt; healthN += dt;

  // --- Growth ---
  if (p.health > 45 && late === 0 && eating === 0) addGrowth(cfg.passive * dt);
  if (p.stage < 4 && p.growth >= cfg.stagePts) nextStage();
  else if (p.stage === 4) {
    const remaining = cfg.branches - p.chosen - p.credits;
    if (remaining <= 0) p.growth = 0;
    else if (p.growth >= cfg.branchPts) {
      p.growth -= cfg.branchPts;
      p.credits++;
      if (p.credits === 1) { showMessage('A new bud! Tap it to grow a branch'); sfx.pip(); }
    }
    for (const br of branches) br.grow = Math.min(1, br.grow + dt * 0.9);
    if (p.chosen >= cfg.branches && branches.every((br) => br.grow >= 1)) nextStage();
  }

  // --- Soil & water shading ---
  p.soil += (p.soilTarget - p.soil) * Math.min(1, dt * 2);
  p.wet = Math.max(0, p.wet - dt * 0.05);

  // --- Birds ---
  updateBirds(dt);

  // --- Wind and balance ---
  const bal = balanceInfo();
  p.tilt += ((bal.tot ? bal.sum / (bal.tot + 150) : 0) * 0.12 - p.tilt) * Math.min(1, dt * 2);
  const windSway = cfg.wind ? gust * cfg.wind * (0.025 + bal.imbalance * 0.12) : 0;
  p.sway = Math.sin(t * 1.3) * 0.012 + windSway;
  if (cfg.wind && p.stage >= 4 && bal.imbalance > 0.35 && !windHinted) {
    windHinted = true;
    showMessage('Windy! Keep the branches balanced');
  }
  windKnockCd = Math.max(0, windKnockCd - dt);
  if (cfg.wind && p.stage >= 5 && Math.abs(gust) > 0.85 && bal.imbalance > 0.3 && windKnockCd <= 0) {
    const heavy = Math.sign(bal.sum);
    const nb = birds.find((b) => b.state === 'nest' && b.spot.br && b.spot.br.side === heavy);
    if (nb) {
      birdFlyAway(nb, 'Whoosh! The lopsided tree swayed. A bird flew off!');
      crowdReact('worried', 1.5);
      windKnockCd = 6;
    }
  }

  // --- Droop and the plant's face ---
  const want = late > 0 || p.health < 45 ? clamp(1.1 - p.health / 100, 0.25, 1) : 0;
  p.droop += (want - p.droop) * Math.min(1, dt * 1.5);
  p.joyT = Math.max(0, p.joyT - dt);
  p.pop = Math.max(0, p.pop - dt * 1.5);
  if (p.joyT > 0) p.mood = 'joy';
  else if (eating) p.mood = 'ouch';
  else if (p.health < 35) p.mood = 'sad';
  else if (late) p.mood = 'worried';
  else p.mood = 'happy';

  if (p.health <= 0) { p.health = 0; fail(); return; }
  if (p.stage >= 5 && nestedCount() >= cfg.birds) win();
}

function nextStage() {
  const p = plant;
  p.stage++;
  p.growth = 0;
  p.pop = 1;
  p.joyT = 1.6;
  crowdReact('wow', 1.8);
  sfx.grow(p.stage / 5);
  const q = plantTopP();
  for (let i = 0; i < 30; i++) {
    const a = rand(0, TAU), sp = rand(40, 160);
    spawn(q.x, q.y + 30, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.7, 1.4), ['#fff3a0', '#b6f07a', '#ffffff', '#ffd966'][i % 4], rand(2, 4.5), 40);
  }
  const lines = ['', 'Look! A little sprout!', 'It’s a bushy plant now!', 'It’s becoming a tree!', 'Tap a glowing bud to grow a branch!', 'A great tree! Now invite the birds'];
  showMessage(lines[p.stage]);
  if (p.stage === 4) { p.credits = 1; say(verseText('branches'), 3.2); }
  if (p.stage === 5) {
    spots.push({ br: null, f: 1, size: 'M', bird: null });
    say(verseText('lodge'), 4);
    birdTimer = 1.2;
    setTimeout(() => {
      if (state === 'play' && nestedCount() === 0) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap a bird, then a nest spot' : 'Click a bird, then a nest spot');
    }, 4200);
  }
}

function updateBirds(dt) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.flap += dt * (b.state === 'nest' ? 0 : 14);
    if (b.state === 'arrive' || b.state === 'wait') {
      b.x += (b.tx - b.x) * Math.min(1, dt * 2.2);
      b.y += (b.ty + (b.state === 'wait' ? Math.sin(t * 2 + b.slot) * 6 : 0) - b.y) * Math.min(1, dt * 2.2);
      if (b.state === 'arrive' && Math.hypot(b.tx - b.x, b.ty - b.y) < 8) b.state = 'wait';
      if (cfg.patience && b.state === 'wait') {
        b.patience -= dt;
        if (b.patience <= 0) birdFlyAway(b, `The ${b.kind.name} flew on… more will come!`);
      }
    } else if (b.state === 'fly') {
      const s = spotWorld(b.spot);
      const dx = s.x - b.x, dy = s.y - b.y;
      b.facing = dx >= 0 ? 1 : -1;
      const d = Math.hypot(dx, dy);
      const step = Math.min(d, (260 / cam.z) * dt + d * dt * 2);
      if (d < 4) {
        b.state = 'nest'; b.nestT = 0;
        sfx.chirp(b.size);
        crowdReact('joy', 1.4);
        plant.joyT = 1.2;
        const q = birdP(b);
        for (let k = 0; k < 14; k++) spawn(q.x, q.y, rand(-70, 70), rand(-90, 10), rand(0.5, 1), ['#ffd1e8', '#fff3a0', '#ffffff'][k % 3], rand(2, 3.5));
        showMessage(pickLine(['Tweet tweet! A cosy nest!', 'A happy new home!', 'Chirp! Welcome, little bird!']));
      } else { b.x += dx / d * step; b.y += dy / d * step; }
    } else if (b.state === 'nest') {
      b.nestT += dt;
      b.hop += dt * (b.nestT < 1.5 ? 6 : 1.2);
      if (b.nestT > 1.6 && !b.chicks) { b.chicks = b.size === 'S' ? 2 : 3; sfx.chirp('S'); }
    } else if (b.state === 'leave') {
      b.x += b.facing * (320 / cam.z) * dt;
      b.y -= (120 / cam.z) * dt;
      if (Math.abs(wp(b.x, b.y).x - W / 2) > W / 2 + 120) birds.splice(i, 1);
    }
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const bal = balanceInfo();
  const nested = nestedCount();
  const speed = Math.max(0, Math.round((cfg.par - playTime) * 10));
  const healthPts = Math.round((healthN ? healthSum / healthN : 100) * 8);
  const birdPts = nested * 150;
  const balancePts = Math.round((1 - bal.imbalance) * 500);
  const levelBonus = level * 500;
  const score = speed + healthPts + birdPts + balancePts + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('mustardBest', best); } catch (e) {} }
  lastScore = { speed, healthPts, birdPts, balancePts, levelBonus, score, nested };
  needs.length = 0; cloud.target = 0;
  for (const pe of pests) if (pe.phase !== 'flick') flick(pe);
  for (const w of weeds) pullWeed(w);
  for (const b of birds) if (b.state !== 'nest') birdFlyAway(b);
  selBird = null;
  plant.joyT = 99; plant.mood = 'joy'; plant.droop = 0;
  message.t = 0;
  bubble = null;
  setTimeout(() => { if (state === 'win') showMessage('Hallelujah! A great tree!'); }, 700);
  sfx.win();
  endTimer = 3.4;
}

function fail() {
  state = 'fail';
  plant.mood = 'sad';
  plant.droop = Math.max(plant.droop, 0.6);
  selBird = null;
  bubble = null;
  showMessage('Oh… the plant has wilted');
  sfx.fail();
  endTimer = 2;
}

function showMessage(text) { message = { text, t: 2.6 }; }

function resetLevelState() {
  cfg = makeConfig(level);
  plant = newPlant();
  needs = []; weeds = []; pests = []; birds = []; branches = []; spots = [];
  particles = []; ripples.length = 0; tools = [];
  needTimer = level === 1 ? 3.5 : 2.5;
  weedTimer = level === 1 ? 7 : 4;
  pestTimer = level === 1 ? 14 : 7;
  birdTimer = 1;
  cloud.cover = 0; cloud.target = 0;
  gust = 0; gustTarget = 0; gustTimer = 0;
  crowdEvent = { mood: 'watch', t: 0 };
  playTime = 0; healthSum = 0; healthN = 0;
  windKnockCd = 0; windHinted = false;
  selBird = null; kbCursor = 0; kbShow = false;

}

function titleScreen() {

function startLevel() {

function beginPlay() {

  for (let i = 0; i < 12; i++) spawn(q.x + rand(-20, 20), q.y, rand(-50, 50), rand(-90, -30), 0.7, '#8a5a33', rand(2, 4), 300);
  if (level === 1) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap the bubbles to help it grow!' : 'Click the bubbles (or press 1, 2, 3, 4)');
  else if (cfg.dry) showMessage('A dry spell! Keep the water coming');
  else if (cfg.wind) showMessage('A windy day! Balance your branches');
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Hallelujah!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('greatest')}
       <p style="text-align:center">God's kingdom starts tiny, like a seed, but it grows and grows until there is room for everyone &mdash; like birds finding a home in the branches.</p>
       <p class="score">Growing speed: <b>${s.speed}</b><br>Health kept: <b>${s.healthPts}</b><br>Birds nested (${s.nested}): <b>${s.birdPts}</b><br>Balance bonus: <b>${s.balancePts}</b><br>Level bonus: <b>${s.levelBonus}</b></p>

function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;

    sfx.thrust(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,

// ============================================================
//  Input
// ============================================================
const keys = new Set();
const ripples = [];

// Everything you can tap, nearest the finger first
function tapAt(x, y) {
  const E = es();
  // Sunshine: the cloud over the sun (HUD space, converted to playfield)
  if (cloud.cover > 0.4) {
    const c = cloudPos();
    if (Math.hypot(x - c.x, y - c.y) < 70) { meetNeed('sun'); return; }
  }
  // Need bubbles
  for (const b of bubbleLayout()) {
    if (Math.hypot(x - b.x, y - b.y) < 36) { meetNeed(b.nd.type); return; }
  }
  // Pests
  let bestPe = null, bd = 44 * E;
  for (const pe of pests) {
    if (pe.phase === 'flick') continue;
    const p = pestP(pe);
    const d = Math.hypot(x - p.x, y - p.y);
    if (d < bd) { bd = d; bestPe = pe; }
  }
  if (bestPe) { flick(bestPe); return; }
  // Weeds
  for (const w of weeds) {
    if (w.pull) continue;
    const p = wp(w.x, 0);
    if (Math.hypot(x - p.x, y - (p.y - 16 * E)) < 36 * E) { pullWeed(w); return; }
  }
  // Birds
  if (plant.stage >= 5) {
    for (const b of birds) {
      if (b.state !== 'wait' && b.state !== 'arrive') continue;
      const p = birdP(b);
      if (Math.hypot(x - p.x, y - p.y) < BIRD_R[b.size] * E + 24) {
        selBird = selBird === b ? null : b;
        if (selBird) sfx.chirp(b.size);
        return;
      }
    }
    let bs = null, sd = 40 * E;
    for (const s of spots) {
      if (!spotReady(s) || s.bird) continue;
      const w = spotWorld(s), p = wp(w.x, w.y);
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < sd) { sd = d; bs = s; }
    }
    if (bs) { trySpot(bs); return; }
  }
  // Buds
  if (plant.stage === 4) {
    for (const b of BUDS) {
      if (budUsed(b)) continue;
      const w = budPos(b), p = wp(w.x, w.y);
      if (Math.hypot(x - p.x, y - p.y) < 30 * E) {
        if (plant.credits > 0) addBranch(b);
        else showMessage('Keep caring for the tree to grow a new bud');
        return;
      }
    }
  }
}

// Keyboard: arrows pick a bud / bird / nest spot, Space chooses it
function kbTargets() {
  if (state !== 'play') return [];
  const list = [];
  if (plant.stage === 4 && plant.credits > 0) {
    for (const b of BUDS) {
      if (budUsed(b)) continue;
      const w = budPos(b), p = wp(w.x, w.y);
      list.push({ x: p.x, y: p.y, r: 22, act: () => addBranch(b) });
    }
  }
  if (plant.stage >= 5) {
    if (selBird) {
      for (const s of spots) {
        if (!spotReady(s) || s.bird || s.size !== selBird.size) continue;
        const w = spotWorld(s), p = wp(w.x, w.y);
        list.push({ x: p.x, y: p.y, r: NEST_W[s.size] * es() * 0.6 + 6, act: () => trySpot(s) });
      }
    } else {
      for (const b of birds) {
        if (b.state !== 'wait') continue;
        const p = birdP(b);
        list.push({ x: p.x, y: p.y, r: BIRD_R[b.size] * es() + 10, act: () => { selBird = b; kbCursor = 0; sfx.chirp(b.size); } });
      }
    }
  }
  list.sort((a, b) => a.x - b.x || a.y - b.y);
  return list;
}

function keyHelp(code) {
  if (code === 'Digit1' || code === 'Numpad1') { meetNeed('water'); return true; }
  if (code === 'Digit2' || code === 'Numpad2') { if (cloud.cover > 0.2 || needs.some((n) => n.type === 'sun')) meetNeed('sun'); return true; }
  if (code === 'Digit4' || code === 'Numpad4') { meetNeed('soil'); return true; }
  if (code === 'Digit3' || code === 'Numpad3') {
    // The bug highest up is the most urgent; otherwise pull the biggest weed
    const live = pests.filter((p) => p.phase !== 'flick');
    if (live.length) {
      live.sort((a, b) => (b.phase === 'ground' ? -1 : b.f) - (a.phase === 'ground' ? -1 : a.f));
      flick(live[0]);
    } else {
      const ws = weeds.filter((w) => !w.pull).sort((a, b) => b.grow - a.grow);
      if (ws.length) pullWeed(ws[0]);
    }
    return true;
  }
  return false;
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'intro' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat) { beginPlay(); return; }
  if (state !== 'play') return;
  if (keyHelp(e.code)) return;
  const list = kbTargets();
  if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(e.code)) {
    kbShow = true;
    if (list.length) {
      const dir = e.code === 'ArrowLeft' || e.code === 'ArrowUp' ? -1 : 1;
      kbCursor = (clamp(kbCursor, 0, list.length - 1) + dir + list.length) % list.length;
    }
    return;
  }
  if (e.code === 'Space' && !e.repeat) {
    if (list.length) { kbShow = true; list[clamp(kbCursor, 0, list.length - 1)].act(); }
    else if (selBird) selBird = null;
    return;
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {

});
