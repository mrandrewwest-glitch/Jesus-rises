// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Little garden sounds, made with the same tone()/noise helpers
Object.assign(sfx, {
  pip() { this.tone(880, 0.12, 'sine', 0.12); this.tone(1320, 0.1, 'sine', 0.08, 0.08); },
  pop() { this.tone(260, 0.14, 'sine', 0.3, 0, 640); },
  boing() { this.tone(640, 0.3, 'triangle', 0.22, 0, 170); this.tone(900, 0.12, 'sine', 0.08, 0.05, 1400); },
  splash() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 1);
    for (let i = 0; i < 4; i++) this.tone(rand(900, 1500), 0.06, 'sine', 0.06, 0.1 + i * 0.12, rand(500, 800));
  },
  chirp(size = 'S') {
    const f = { S: 3000, M: 2300, L: 1500 }[size];
    for (let i = 0; i < 3; i++) this.tone(f * (1 + i * 0.04), 0.07, 'sine', 0.11, i * 0.1, f * 1.35);
  },
  grow(h) {
    if (!this.ctx) return;
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, h);
    this.tone(1760, 0.3, 'sine', 0.06, 0.12);
    this.tone(2640, 0.3, 'sine', 0.04, 0.2);
  },
});

// ============================================================
//  Rendering: sky, sun, hills and the garden
// ============================================================
function sunP() { return { x: viewW - 72 - offX, y: 150 - offY }; }
function cloudPos() { const s = sunP(); return { x: s.x + (1 - cloud.cover) * 200, y: s.y + 8 }; }

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 5 }, () => ({ f: Math.random(), y: rand(-120, 260), w: rand(80, 150), speed: rand(4, 9) }));
const streaks = Array.from({ length: 26 }, () => ({ f: Math.random(), y: rand(0, H - 200), len: rand(0.5, 1.2) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, cam.baseY);
  if (cfg.dry) { g.addColorStop(0, '#8cc6ec'); g.addColorStop(1, '#fbe7b8'); }
  else { g.addColorStop(0, '#7fc0ec'); g.addColorStop(0.7, '#c4e6f8'); g.addColorStop(1, '#eef8fb'); }
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  for (const c of bgClouds) {
    const x = -offX - 150 + c.f * (viewW + 300);
    drawCloud(x, c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');
  }
}

function drawSun() {
  const s = sunP();
  const R = cfg.dry ? 38 : 32;
  ctx.save();
  ctx.translate(s.x, s.y);
  const g = ctx.createRadialGradient(0, 0, R * 0.6, 0, 0, R * 2.6);
  g.addColorStop(0, 'rgba(255,236,150,0.6)'); g.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 2.6, 0, TAU); ctx.fill();
  ctx.rotate(t * 0.3);
  ctx.strokeStyle = '#ffc93a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU;
    ctx.moveTo(Math.cos(a) * (R + 7), Math.sin(a) * (R + 7));
    ctx.lineTo(Math.cos(a) * (R + 16), Math.sin(a) * (R + 16));
  }
  ctx.stroke();
  ctx.rotate(-t * 0.3);
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  // A sunny smile
  ctx.fillStyle = '#b8741a';
  ctx.beginPath(); ctx.arc(-9, -5, 2.6, 0, TAU); ctx.arc(9, -5, 2.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#b8741a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 3, 9, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,130,90,0.4)';
  ctx.beginPath(); ctx.arc(-16, 5, 4, 0, TAU); ctx.arc(16, 5, 4, 0, TAU); ctx.fill();
  ctx.restore();

  // The sleepy grey cloud that hides the sun
  if (cloud.cover > 0.02) {
    const c = cloudPos();
    const bob = Math.sin(t * 2) * 3;
    ctx.globalAlpha = clamp(cloud.cover * 1.5, 0, 1);
    drawCloud(c.x, c.y + bob, 130, 52, '#b9c2d3', '#8f99ad');
    ctx.strokeStyle = '#4e5668'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(c.x - 14, c.y - 10 + bob, 5, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.moveTo(c.x + 19, c.y - 10 + bob); ctx.arc(c.x + 14, c.y - 10 + bob, 5, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = '#4e5668';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 6 + bob, 4, 3 + Math.sin(t * 3) * 1, 0, 0, TAU); ctx.fill();
    // "z" to show it's dozing
    ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('z', c.x - 60, c.y - 30 + bob - (t * 10) % 8);
    ctx.globalAlpha = 1;
    if (state === 'play' && needs.some((n) => n.type === 'sun')) {
      ctx.fillStyle = '#5a4210'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('tap me!', c.x, c.y + 44 + bob);
    }
  }
}

function drawHills() {
  const x0 = -offX - 10, x1 = W + offX + 10, by = cam.baseY;
  const par = cam.x * cam.z * 0.15;
  ctx.fillStyle = cfg.dry ? '#d6d49a' : '#b7dba0';
  ctx.beginPath(); ctx.moveTo(x0, by + 5);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, by - 70 + Math.sin((x + par) / 110) * 22 + Math.sin((x + par) / 43) * 7);
  ctx.lineTo(x1, by + 5); ctx.fill();
  // distant olive trees on the far hills
  for (let k = 0; k < 9; k++) {
    const x = ((k * 173 - par * 1.4) % (viewW + 100) + viewW + 100) % (viewW + 100) - offX - 50;
    const y = by - 66 + Math.sin((x + par) / 110) * 22 + Math.sin((x + par) / 43) * 7;
    ctx.fillStyle = '#7a9a5e';
    ctx.beginPath(); ctx.arc(x, y - 8, 8, 0, TAU); ctx.arc(x + 7, y - 5, 6, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = cfg.dry ? '#c6c983' : '#9fcd7d';
  ctx.beginPath(); ctx.moveTo(x0, by + 5);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, by - 32 + Math.sin((x + par * 2) / 70) * 10);
  ctx.lineTo(x1, by + 5); ctx.fill();
}

const FLOWERS = [-620, -540, -455, -170, 175, 440, 520, 640].map((x, i) => ({ x, y: 30 + (i % 3) * 14, c: ['#ff8fb1', '#ffd23f', '#b18cff', '#ff9f5a'][i % 4] }));

function drawGround() {
  const xa = pw(-offX - 20, 0).x, xb = pw(W + offX + 20, 0).x;
  const yb = (H + offY + 20 - cam.baseY) / cam.z + 20;
  const grass = cfg.dry ? '#b8c46a' : '#86c35a';
  const g = ctx.createLinearGradient(0, 0, 0, 200);
  g.addColorStop(0, grass); g.addColorStop(1, cfg.dry ? '#9aa850' : '#6aa844');
  ctx.fillStyle = g;
  ctx.fillRect(xa, 0, xb - xa, yb);
  ctx.strokeStyle = cfg.dry ? '#98a650' : '#6aa844'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(xa, 1); ctx.lineTo(xb, 1); ctx.stroke();

  // The garden bed
  const soil = mix('#c2a57a', '#6a4424', plant.soil * 0.7 + plant.wet * 0.3);
  ctx.fillStyle = soil;
  ctx.beginPath(); ctx.ellipse(0, 6, 180, 16, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(cfg.dry ? '#a08a60' : '#5a3a1e', -10); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 6, 180, 16, 0, 0, TAU); ctx.stroke();
  // pebbles and dry cracks
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const [x, y] of [[-140, 8], [-95, 14], [-40, 2], [62, 12], [118, 5], [150, 12]]) {
    ctx.beginPath(); ctx.ellipse(x, y, 4, 2.5, 0, 0, TAU); ctx.fill();
  }
  if (cfg.dry && plant.wet < 0.4) {
    ctx.strokeStyle = 'rgba(90,60,30,0.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const x of [-120, -60, 40, 100]) { ctx.moveTo(x, 2); ctx.lineTo(x + 6, 8); ctx.lineTo(x + 2, 14); ctx.moveTo(x + 6, 8); ctx.lineTo(x + 13, 10); }
    ctx.stroke();
  }

  // Flowers in the grass
  const sway = cfg.wind ? gust * 3 : 0;
  for (const f of FLOWERS) {
    ctx.strokeStyle = '#4f8f32'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x, f.y - 8, f.x + sway, f.y - 16); ctx.stroke();
    ctx.fillStyle = f.c;
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU;
      ctx.beginPath(); ctx.arc(f.x + sway + Math.cos(a) * 4, f.y - 16 + Math.sin(a) * 4, 3.2, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#ffe98a'; ctx.beginPath(); ctx.arc(f.x + sway, f.y - 16, 2.6, 0, TAU); ctx.fill();
  }
}

// ============================================================
//  The mustard plant (world coordinates)
// ============================================================
function leafColours() {
  const d = plant.droop;
  return {
    dark: mix('#4a9a2c', '#8c8a3c', d),
    mid: mix('#6cc03f', '#aaa24c', d),
    light: mix('#a3e36a', '#cfc47a', d),
  };
}

function drawLeaf(x, y, len, ang, col) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = col.mid; ctx.strokeStyle = col.dark; ctx.lineWidth = Math.max(0.8, len * 0.06);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -len * 0.38, len, 0);
  ctx.quadraticCurveTo(len * 0.5, len * 0.38, 0, 0);
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.85, 0); ctx.stroke();
  ctx.restore();
}

const CLUMP = [[0, 0, 1], [-0.62, 0.22, 0.72], [0.62, 0.22, 0.72], [-0.32, -0.42, 0.7], [0.36, -0.4, 0.66]];
function drawClump(x, y, r, seed, col, flowers) {
  if (r < 1) return;
  ctx.fillStyle = col.dark;
  ctx.beginPath();
  for (const [dx, dy, rr] of CLUMP) { const cx = x + dx * r, cy = y + dy * r + r * 0.18; ctx.moveTo(cx + rr * r, cy); ctx.arc(cx, cy, rr * r, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = col.mid;
  ctx.beginPath();
  for (const [dx, dy, rr] of CLUMP) { const cx = x + dx * r, cy = y + dy * r; ctx.moveTo(cx + rr * r, cy); ctx.arc(cx, cy, rr * r, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = col.light;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  for (const [dx, dy, rr] of CLUMP) {
    const cx = x + dx * r - rr * r * 0.25, cy = y + dy * r - rr * r * 0.3;
    ctx.moveTo(cx + rr * r * 0.42, cy); ctx.arc(cx, cy, rr * r * 0.42, 0, TAU);
  }
  ctx.fill();
  ctx.globalAlpha = 1;
  // Little yellow mustard flowers
  if (flowers && plant.droop < 0.6) {
    const fr = Math.max(1.6, r * 0.075);
    for (let k = 0; k < 5; k++) {
      const a = seed * 2.3 + k * 1.9;
      const d = r * (0.25 + 0.5 * ((Math.sin(seed * 7.1 + k * 3.3) + 1) / 2));
      const fx = x + Math.cos(a) * d, fy = y + Math.sin(a) * d * 0.8 - r * 0.1;
      ctx.fillStyle = '#ffd93a';
      ctx.beginPath();
      for (let q = 0; q < 4; q++) { const b = q / 4 * TAU + 0.4; ctx.moveTo(fx + Math.cos(b) * fr + fr, fy + Math.sin(b) * fr); ctx.arc(fx + Math.cos(b) * fr, fy + Math.sin(b) * fr, fr, 0, TAU); }
      ctx.fill();
      ctx.fillStyle = '#f0a020'; ctx.beginPath(); ctx.arc(fx, fy, fr * 0.7, 0, TAU); ctx.fill();
    }
  }
}

// The plant's cheerful cartoon face
function drawPlantFace(x, y, r, mood) {
  const dark = '#2b1d12';
  const ex = r * 0.4, ey = y - r * 0.12;
  const blink = plant.blink > 0 && mood !== 'joy' && mood !== 'ouch';
  ctx.lineCap = 'round';
  // cheeks
  ctx.fillStyle = 'rgba(255,120,120,0.45)';
  ctx.beginPath(); ctx.arc(x - r * 0.62, y + r * 0.22, r * 0.17, 0, TAU); ctx.arc(x + r * 0.62, y + r * 0.22, r * 0.17, 0, TAU); ctx.fill();
  const eyes = (ry, look) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1, r * 0.1);
        ctx.beginPath(); ctx.moveTo(x + sx - r * 0.15, ey); ctx.lineTo(x + sx + r * 0.15, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x + sx, ey, r * 0.21, r * ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(x + sx, ey + look * r * 0.06, r * 0.12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + sx - r * 0.04, ey + look * r * 0.06 - r * 0.05, r * 0.04, 0, TAU); ctx.fill();
    }
  };
  ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = Math.max(1, r * 0.1);
  switch (mood) {
    case 'joy':
      ctx.strokeStyle = dark;
      ctx.beginPath();
      ctx.arc(x - ex, ey + r * 0.08, r * 0.17, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(x + ex + r * 0.17 * Math.cos(Math.PI * 1.1), ey + r * 0.08 + r * 0.17 * Math.sin(Math.PI * 1.1));
      ctx.arc(x + ex, ey + r * 0.08, r * 0.17, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      ctx.fillStyle = '#7a2e22';
      ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * 0.2); ctx.arc(x, y + r * 0.2, r * 0.3, 0, Math.PI); ctx.closePath(); ctx.fill();
      break;
    case 'worried':
      eyes(0.26, -1);
      ctx.strokeStyle = dark;
      ctx.beginPath();
      ctx.moveTo(x - ex - r * 0.2, ey - r * 0.3); ctx.lineTo(x - ex + r * 0.15, ey - r * 0.42);
      ctx.moveTo(x + ex + r * 0.2, ey - r * 0.3); ctx.lineTo(x + ex - r * 0.15, ey - r * 0.42);
      ctx.stroke();
      ctx.strokeStyle = '#6a2a1e';
      ctx.beginPath();
      ctx.moveTo(x - r * 0.25, y + r * 0.35);
      ctx.quadraticCurveTo(x - r * 0.12, y + r * 0.25, x, y + r * 0.35);
      ctx.quadraticCurveTo(x + r * 0.12, y + r * 0.45, x + r * 0.25, y + r * 0.35);
      ctx.stroke();
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(x + r * 0.85, y - r * 0.5); ctx.quadraticCurveTo(x + r * 1.05, y - r * 0.15, x + r * 0.85, y - r * 0.1);
      ctx.quadraticCurveTo(x + r * 0.65, y - r * 0.15, x + r * 0.85, y - r * 0.5); ctx.fill();
      break;
    case 'sad':
      eyes(0.18, 1);
      ctx.beginPath(); ctx.arc(x, y + r * 0.55, r * 0.22, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
      break;
    case 'ouch':
      ctx.strokeStyle = dark;
      ctx.beginPath();
      ctx.moveTo(x - ex - r * 0.15, ey - r * 0.12); ctx.lineTo(x - ex + r * 0.12, ey); ctx.lineTo(x - ex - r * 0.15, ey + r * 0.12);
      ctx.moveTo(x + ex + r * 0.15, ey - r * 0.12); ctx.lineTo(x + ex - r * 0.12, ey); ctx.lineTo(x + ex + r * 0.15, ey + r * 0.12);
      ctx.stroke();
      ctx.fillStyle = '#7a2e22';
      ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 0.15, r * (0.12 + Math.abs(Math.sin(t * 8)) * 0.1), 0, 0, TAU); ctx.fill();
      break;
    default:
      eyes(0.26, 0);
      ctx.beginPath(); ctx.arc(x, y + r * 0.12, r * 0.28, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
}

function drawPlant() {
  const p = plant;
  const col = leafColours();
  const mound = mix('#c2a57a', '#5e3b1e', p.soil * 0.7 + p.wet * 0.3);
  const sq = 1 + p.pop * 0.1 * Math.sin(p.pop * 18);
  ctx.save();
  ctx.scale(2 - sq, sq);

  if (p.stage === 0) {
    // The tiny seed, peeking out of the soil
    const g = clamp(p.growth / cfg.stagePts, 0, 1);
    if (g > 0.3) {
      const sh = (g - 0.3) * 22;
      ctx.strokeStyle = col.mid; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(2, -9); ctx.quadraticCurveTo(5, -9 - sh * 0.6, 1, -9 - sh); ctx.stroke();
      drawLeaf(1, -9 - sh, 4 + sh * 0.3, -0.5, col);
    }
    const sg = ctx.createLinearGradient(0, -14, 0, 2);
    sg.addColorStop(0, '#e8bd6a'); sg.addColorStop(1, '#9a6a2a');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(0, -4, 10, 8.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a5a22'; ctx.lineWidth = 0.8; ctx.stroke();
    drawPlantFace(0, -5, 7, p.mood);
    ctx.fillStyle = mound;
    ctx.beginPath(); ctx.ellipse(0, 4, 20, 5.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  // Soil mound round the stem
  ctx.fillStyle = mound;
  ctx.beginPath(); ctx.ellipse(0, 2, 16 + Math.min(p.h, 300) * 0.1, 6 + Math.min(p.h, 300) * 0.015, 0, 0, TAU); ctx.fill();

  const woody = p.stage >= 3;
  const steps = 12;

  // Bush: leafy side shoots behind the stem
  if (p.stage === 2) {
    for (let k = 0; k < 5; k++) {
      const f0 = 0.28 + k * 0.13, side = k % 2 ? 1 : -1;
      const o = trunkPt(f0);
      const len = p.h * (0.42 - k * 0.05);
      const a = (side > 0 ? -0.75 : Math.PI + 0.75) + p.droop * 0.6 * side + p.sway;
      const ex = o.x + Math.cos(a) * len, ey = o.y + Math.sin(a) * len;
      ctx.strokeStyle = col.dark; ctx.lineWidth = Math.max(2, trunkW(f0) * 0.45); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.quadraticCurveTo((o.x + ex) / 2, (o.y + ey) / 2 - len * 0.2, ex, ey); ctx.stroke();
      drawClump(ex, ey, 9 + p.h * 0.075, k + 1, col, true);
    }
  }

  // Branches (behind the trunk's leaves)
  for (const br of branches) {
    const g = branchGeom(br);
    const w0 = trunkW(br.hf) * 0.6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5e3a1a'; ctx.lineWidth = w0 + 3;
    ctx.beginPath(); ctx.moveTo(g.o.x, g.o.y); ctx.quadraticCurveTo(g.ctrl.x, g.ctrl.y, g.end.x, g.end.y); ctx.stroke();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = w0;
    ctx.beginPath(); ctx.moveTo(g.o.x, g.o.y); ctx.quadraticCurveTo(g.ctrl.x, g.ctrl.y, g.end.x, g.end.y); ctx.stroke();
  }

  // Trunk / stem
  const L = [], R = [];
  for (let i = 0; i <= steps; i++) {
    const f = i / steps, q = trunkPt(f), w = trunkW(f) / 2;
    L.push([q.x - w, q.y]); R.push([q.x + w, q.y]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0] - (woody ? 6 : 1), L[0][1] + 2);
  for (const [x, y] of L) ctx.lineTo(x, y);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.lineTo(R[0][0] + (woody ? 6 : 1), R[0][1] + 2);
  ctx.closePath();
  const w0 = trunkW0();
  const tg = ctx.createLinearGradient(-w0 / 2, 0, w0 / 2, 0);
  if (woody) { tg.addColorStop(0, '#6e4520'); tg.addColorStop(0.45, '#a06a36'); tg.addColorStop(1, '#6e4520'); }
  else { tg.addColorStop(0, col.dark); tg.addColorStop(0.45, col.light); tg.addColorStop(1, col.dark); }
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = woody ? '#5e3a1a' : col.dark; ctx.lineWidth = woody ? 2 : 1; ctx.stroke();
  if (woody) {
    // bark lines
    ctx.strokeStyle = 'rgba(80,45,20,0.45)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (const [f, dx] of [[0.1, -0.2], [0.35, 0.15], [0.5, -0.1], [0.65, 0.2]]) {
      const q = trunkPt(f), w = trunkW(f);
      ctx.moveTo(q.x + dx * w, q.y); ctx.quadraticCurveTo(q.x + dx * w + 3, q.y - 10, q.x + dx * w, q.y - 20);
    }
    ctx.stroke();
  }

  // Leaves
  const top = trunkPt(1);
  if (p.stage === 1) {
    const len = 8 + p.h * 0.28;
    const d = p.droop * 0.9;
    drawLeaf(top.x, top.y, len, -Math.PI + 0.55 - d, col);
    drawLeaf(top.x, top.y, len, -0.55 + d, col);
    drawLeaf(top.x, top.y, len * 0.6, -Math.PI / 2 + p.droop * p.droopSide, col);
  } else if (p.stage === 2) {
    drawClump(top.x, top.y, 12 + p.h * 0.09, 9, col, true);
  } else {
    for (const br of branches) {
      const g = branchGeom(br);
      const m = bez(g, 0.55);
      drawClump(m.x, m.y - 4, 24 * ease(br.grow), br.hf * 10, col, true);
      drawClump(g.end.x, g.end.y - 4, 32 * ease(br.grow), br.hf * 13 + br.side, col, true);
    }
    const tr = topClumpR();
    const s1 = trunkPt(0.84);
    drawClump(s1.x - tr * 0.7, s1.y, tr * 0.65, 3, col, true);
    drawClump(s1.x + tr * 0.7, s1.y, tr * 0.65, 5, col, true);
    drawClump(top.x, top.y - tr * 0.3, tr, 7, col, true);
  }

  // The face
  const ff = p.stage === 1 ? 0.42 : p.stage === 2 ? 0.34 : 0.22;
  const fq = trunkPt(ff);
  drawPlantFace(fq.x, fq.y, trunkW(ff) * (woody ? 0.68 : 0.62), p.mood);
  ctx.restore();
}

// ============================================================
//  Buds, nest spots, birds, weeds and bugs (screen sized)
// ============================================================
function drawBuds() {
  if (plant.stage !== 4 || state !== 'play') return;
  const E = es();
  for (const b of BUDS) {
    if (budUsed(b)) continue;
    const w = budPos(b), p = wp(w.x, w.y);
    if (plant.credits > 0) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 5 + b.hf * 9);
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 26 * E);
      g.addColorStop(0, `rgba(255,250,170,${0.7 + pulse * 0.3})`);
      g.addColorStop(1, 'rgba(255,250,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, 26 * E, 0, TAU); ctx.fill();
      ctx.fillStyle = '#9be05e'; ctx.strokeStyle = '#4a9a2c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, (8 + pulse * 2) * E, (10 + pulse * 2) * E, b.side * 0.6, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff6a0';
      ctx.beginPath(); ctx.arc(p.x - 2 * E, p.y - 3 * E, 3 * E, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(130,180,80,0.8)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 4.5 * E, 6 * E, b.side * 0.6, 0, TAU); ctx.fill();
    }
  }
}

function drawNest(x, y, w, part) {
  // part 'back' is the inside of the bowl, 'front' is the woven rim
  if (part === 'back') {
    ctx.fillStyle = '#5e3c1e';
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.45, w * 0.14, 0, 0, TAU); ctx.fill();
    return;
  }
  ctx.fillStyle = '#a0703c'; ctx.strokeStyle = '#6e4622'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.5, y);
  ctx.quadraticCurveTo(x - w * 0.45, y + w * 0.38, x, y + w * 0.38);
  ctx.quadraticCurveTo(x + w * 0.45, y + w * 0.38, x + w * 0.5, y);
  ctx.quadraticCurveTo(x, y + w * 0.1, x - w * 0.5, y);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k < 3; k++) {
    const yy = y + w * (0.1 + k * 0.09);
    ctx.moveTo(x - w * (0.45 - k * 0.07), yy); ctx.quadraticCurveTo(x, yy + w * 0.08, x + w * (0.45 - k * 0.07), yy);
  }
  ctx.moveTo(x - w * 0.5, y); ctx.lineTo(x - w * 0.62, y - w * 0.08);
  ctx.moveTo(x + w * 0.5, y); ctx.lineTo(x + w * 0.64, y - w * 0.05);
  ctx.stroke();
}

function drawSpots() {
  if (plant.stage < 5) return;
  const E = es();
  for (const s of spots) {
    if (!spotReady(s) || s.bird) continue;
    const w = spotWorld(s), p = wp(w.x, w.y);
    const r = NEST_W[s.size] * E * 0.55;
    const fits = selBird && selBird.size === s.size;
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    if (fits) {
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r * 2);
      g.addColorStop(0, 'rgba(255,240,150,0.9)'); g.addColorStop(1, 'rgba(255,240,150,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 2, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = selBird && !fits ? 0.35 : 1;
    // a little twig platform shows where a nest can go
    ctx.strokeStyle = '#6e4622'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x - r * 0.8, p.y + 4); ctx.quadraticCurveTo(p.x, p.y + 9, p.x + r * 0.8, p.y + 4); ctx.stroke();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = fits ? '#e0a526' : 'rgba(255,255,255,0.95)';
    ctx.lineWidth = fits ? 3.5 : 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + (fits ? pulse * 3 : 0), 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
}

function drawBird(x, y, kind, r, flap, facing, sitting) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);
  // tail
  ctx.fillStyle = kind.wing;
  ctx.beginPath(); ctx.moveTo(-r * 0.7, -r * 0.1); ctx.lineTo(-r * 1.45, -r * 0.45); ctx.lineTo(-r * 1.35, r * 0.2); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = kind.body; ctx.strokeStyle = shade(kind.wing, -20); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.78, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = kind.belly;
  ctx.beginPath(); ctx.ellipse(r * 0.2, r * 0.22, r * 0.62, r * 0.48, 0, 0, TAU); ctx.fill();
  // head
  const hx = r * 0.72, hy = -r * 0.58;
  if (kind.crest) {
    for (let k = 0; k < 3; k++) {
      const a = -2.1 + k * 0.45;
      ctx.strokeStyle = '#e59c5c'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(a) * r * 0.95, hy + Math.sin(a) * r * 0.95); ctx.stroke();
      ctx.fillStyle = '#2e2e2e';
      ctx.beginPath(); ctx.arc(hx + Math.cos(a) * r * 0.95, hy + Math.sin(a) * r * 0.95, r * 0.11, 0, TAU); ctx.fill();
    }
  }
  ctx.fillStyle = kind.body;
  ctx.beginPath(); ctx.arc(hx, hy, r * 0.52, 0, TAU); ctx.fill(); ctx.stroke();
  // beak
  ctx.fillStyle = kind.beak;
  ctx.beginPath(); ctx.moveTo(hx + r * 0.45, hy - r * 0.1); ctx.lineTo(hx + r * 0.9, hy + r * 0.04); ctx.lineTo(hx + r * 0.45, hy + r * 0.16); ctx.closePath(); ctx.fill();
  // eye and cheek
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hx + r * 0.16, hy - r * 0.08, r * 0.17, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1e140c';
  ctx.beginPath(); ctx.arc(hx + r * 0.2, hy - r * 0.08, r * 0.1, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,140,0.5)';
  ctx.beginPath(); ctx.arc(hx + r * 0.05, hy + r * 0.22, r * 0.11, 0, TAU); ctx.fill();
  // wing
  ctx.fillStyle = kind.wing;
  ctx.save();
  ctx.translate(-r * 0.1, -r * 0.2);
  ctx.rotate(sitting ? 0.25 : -0.4 + Math.sin(flap) * 0.9);
  ctx.beginPath(); ctx.ellipse(-r * 0.3, 0, r * 0.7, r * 0.34, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawBirds() {
  const E = es();
  for (const b of birds) {
    const r = BIRD_R[b.size] * E;
    const p = birdP(b);
    if (b.state === 'nest') {
      const sw = spotWorld(b.spot), sp = wp(sw.x, sw.y);
      const nw = NEST_W[b.size] * E * 1.15;
      drawNest(sp.x, sp.y, nw, 'back');
      drawBird(sp.x, p.y - r * 0.1, b.kind, r, 0, b.spot.br ? -b.spot.br.side : 1, true);
      if (b.chicks) {
        for (let k = 0; k < b.chicks; k++) {
          const cx = sp.x + (k - (b.chicks - 1) / 2) * nw * 0.3;
          const cy = sp.y - Math.abs(Math.sin(t * 5 + k * 1.7)) * 3 * E;
          ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#d9a41c'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(cx, cy, 4.2 * E, 0, TAU); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#f08a30';
          const open = Math.sin(t * 8 + k) > 0 ? 2 : 0.6;
          ctx.beginPath(); ctx.moveTo(cx - 2 * E, cy - 1 * E); ctx.lineTo(cx, cy - (4 + open) * E); ctx.lineTo(cx + 2 * E, cy - 1 * E); ctx.fill();
          ctx.fillStyle = '#1e140c';
          ctx.beginPath(); ctx.arc(cx - 1.6 * E, cy - 1.2 * E, 0.9 * E, 0, TAU); ctx.arc(cx + 1.6 * E, cy - 1.2 * E, 0.9 * E, 0, TAU); ctx.fill();
        }
      }
      drawNest(sp.x, sp.y, nw, 'front');
      continue;
    }
    if (b === selBird) {
      const g = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 2.2);
      g.addColorStop(0, 'rgba(255,240,150,0.9)'); g.addColorStop(1, 'rgba(255,240,150,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.2, 0, TAU); ctx.fill();
    }
    const hop = b === selBird ? Math.abs(Math.sin(t * 8)) * 4 : 0;
    drawBird(p.x, p.y - hop, b.kind, r, b.flap, b.state === 'wait' ? (b.slot === 0 ? 1 : -1) : b.facing, false);
    if (b.state === 'wait') {
      // size tag, and (on later levels) how long it will wait
      ctx.font = `700 ${Math.round(11 * E)}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const label = b.kind.name;
      const tw = ctx.measureText(label).width + 10;
      roundRect(p.x - tw / 2, p.y + r + 6, tw, 16 * E, 8 * E); ctx.fill();
      ctx.fillStyle = '#5a4210';
      ctx.fillText(label, p.x, p.y + r + 6 + 12 * E);
      if (cfg.patience) {
        const f = clamp(b.patience / cfg.patience, 0, 1);
        ctx.strokeStyle = f > 0.5 ? '#40c057' : f > 0.25 ? '#fab005' : '#fa5252';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.55, -Math.PI / 2, -Math.PI / 2 + f * TAU); ctx.stroke();
      }
    }
  }
}

function drawWeeds() {
  const E = es();
  for (const w of weeds) {
    const p = wp(w.x, 0);
    const s = E * (0.35 + 0.65 * w.grow) * (w.pull ? 1 - w.pull * 0.5 : 1);
    const lift = w.pull ? w.pull * 60 : 0;
    ctx.save();
    ctx.translate(p.x, p.y + 2 - lift);
    if (w.pull) ctx.rotate(w.pull * 1.5);
    ctx.globalAlpha = w.pull ? 1 - w.pull : 1;
    ctx.scale(s, s);
    const wob = Math.sin(t * 2 + w.phase) * 0.08;
    ctx.fillStyle = '#3f7f2a'; ctx.strokeStyle = '#2c5e1c'; ctx.lineWidth = 1.5;
    for (let k = -2; k <= 2; k++) {
      ctx.save();
      ctx.rotate(k * 0.42 + wob);
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.lineTo(-6, -10); ctx.lineTo(-2, -12); ctx.lineTo(-5, -22); ctx.lineTo(0, -32 + Math.abs(k) * 5);
      ctx.lineTo(5, -22); ctx.lineTo(2, -12); ctx.lineTo(6, -10); ctx.lineTo(3, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (w.grow >= 1) {
      ctx.strokeStyle = '#2c5e1c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(wob * 30, -40); ctx.stroke();
      ctx.fillStyle = '#9b59b6';
      ctx.beginPath(); ctx.arc(wob * 30, -44, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c38fe0'; ctx.beginPath(); ctx.arc(wob * 30 - 1.5, -46, 2.5, 0, TAU); ctx.fill();
    }
    // a cheeky little face
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3.5, -9, 2.6, 0, TAU); ctx.arc(3.5, -9, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1e140c';
    ctx.beginPath(); ctx.arc(-3, -8.5, 1.3, 0, TAU); ctx.arc(4, -8.5, 1.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1e140c'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-6, -13); ctx.lineTo(-1.5, -11.5); ctx.moveTo(6, -13); ctx.lineTo(1.5, -11.5); ctx.stroke();
    ctx.restore();
  }
}

function drawPests() {
  const E = es();
  for (const pe of pests) {
    const q = pestP(pe);
    let fx = 1, fy = 1;
    if (pe.phase === 'ground') fx = pe.side > 0 ? -1 : 1;
    else if (pe.phase !== 'flick') fy = pe.side > 0 ? -1 : 1;
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(q.rot);
    ctx.scale(fx * E, fy * E);
    if (pe.type === 'cat') drawCaterpillar(pe);
    else drawSnail(pe);
    ctx.restore();
  }
}

function drawCaterpillar(pe) {
  const eat = pe.phase === 'eat';
  for (let k = 0; k < 5; k++) {
    const cx = -22 + k * 9, cy = -7 - Math.abs(Math.sin(pe.wig + k * 0.9)) * 3;
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.arc(cx, 0, 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = k % 2 ? '#5cbf3a' : '#7ed957';
    ctx.strokeStyle = '#3e8a26'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, k === 4 ? 8.5 : 7, 0, TAU); ctx.fill(); ctx.stroke();
    if (k < 4) { ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(cx, cy - 3, 1.6, 0, TAU); ctx.fill(); }
  }
  const hx = 14, hy = -7 - Math.abs(Math.sin(pe.wig + 3.6)) * 3;
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(hx - 2, hy - 7); ctx.lineTo(hx - 5, hy - 14); ctx.moveTo(hx + 2, hy - 7); ctx.lineTo(hx + 4, hy - 14); ctx.stroke();
  ctx.fillStyle = '#ff6b8a';
  ctx.beginPath(); ctx.arc(hx - 5, hy - 14, 2, 0, TAU); ctx.arc(hx + 4, hy - 14, 2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hx - 1, hy - 2, 2.6, 0, TAU); ctx.arc(hx + 4, hy - 2, 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1e140c';
  ctx.beginPath(); ctx.arc(hx, hy - 2, 1.3, 0, TAU); ctx.arc(hx + 5, hy - 2, 1.3, 0, TAU); ctx.fill();
  if (eat) { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(hx + 3, hy + 4, 2, 1 + Math.abs(Math.sin(pe.wig)) * 2, 0, 0, TAU); ctx.fill(); }
  else { ctx.strokeStyle = '#1e140c'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(hx + 2, hy + 2, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
}

function drawSnail(pe) {
  const st = Math.sin(pe.wig) * 1.5;
  ctx.fillStyle = '#d8c3a0'; ctx.strokeStyle = '#a88f68'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-4, -2 - st * 0.3, 16, -2);
  ctx.quadraticCurveTo(24, -4, 22, -12); ctx.quadraticCurveTo(18, -16, 14, -10);
  ctx.lineTo(-18, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
  // eye stalks
  ctx.strokeStyle = '#a88f68'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(18, -12); ctx.lineTo(16 + st, -24); ctx.moveTo(21, -12); ctx.lineTo(24 + st, -23); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(16 + st, -25, 3, 0, TAU); ctx.arc(24 + st, -24, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1e140c';
  ctx.beginPath(); ctx.arc(16.8 + st, -25, 1.4, 0, TAU); ctx.arc(24.8 + st, -24, 1.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(20, -8, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  // shell
  ctx.fillStyle = '#e39650'; ctx.strokeStyle = '#9a5a2a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-4, -13, 12, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (let a = 0; a < TAU * 2.2; a += 0.2) {
    const r = 10 - a * 0.7;
    const x = -4 + Math.cos(a) * r, y = -13 + Math.sin(a) * r;
    a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

//  Bubbles, tools, speech and messages

function drawNeedIcon(type, x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  if (type === 'water') {
    const g = ctx.createLinearGradient(0, -14, 0, 12);
    g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#2f8ee0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -15); ctx.bezierCurveTo(4, -6, 11, 0, 11, 5); ctx.arc(0, 5, 11, 0, Math.PI); ctx.bezierCurveTo(-11, 0, -4, -6, 0, -15); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-4, 3, 2.5, 4, 0.3, 0, TAU); ctx.fill();
  } else if (type === 'sun') {
    ctx.strokeStyle = '#f5a800'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16); }
    ctx.stroke();
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#7a4e2a';
    ctx.beginPath(); ctx.moveTo(-15, 10); ctx.quadraticCurveTo(-10, -6, 0, -7); ctx.quadraticCurveTo(10, -6, 15, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a0703c';
    ctx.beginPath(); ctx.arc(-5, 2, 2.5, 0, TAU); ctx.arc(4, -1, 2, 0, TAU); ctx.arc(7, 6, 2.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4a9a2c'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, -14); ctx.stroke();
    ctx.fillStyle = '#6cc03f';
    ctx.beginPath(); ctx.ellipse(-4, -14, 4, 2.2, -0.4, 0, TAU); ctx.ellipse(4, -14, 4, 2.2, 0.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawNeedBubbles() {
  if (state !== 'play') return;
  const top = plantTopP();
  for (const b of bubbleLayout()) {
    const n = b.nd;
    const u = n.age / n.grace;
    const late = u > 1;
    const sx = late ? Math.sin(t * 30) * 2.5 : 0;
    const s = ease(n.pop) * (1 + Math.sin(t * 4 + b.x) * 0.03);
    const x = b.x + sx, y = b.y;
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    // little tail pointing down at the plant
    ctx.fillStyle = '#fffdf2';
    const tx = clamp((top.x - x) * 0.25, -14, 14);
    ctx.beginPath(); ctx.moveTo(-8, 22); ctx.lineTo(tx, 38); ctx.lineTo(8, 22); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.fill();
    ctx.strokeStyle = late ? (Math.sin(t * 10) > 0 ? '#fa5252' : '#ffa8a8') : 'rgba(224,165,38,0.8)';
    ctx.lineWidth = 3; ctx.stroke();
    // time left
    if (!late) {
      ctx.strokeStyle = u < 0.5 ? '#40c057' : u < 0.8 ? '#fab005' : '#fd7e14';
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 33, -Math.PI / 2, -Math.PI / 2 + (1 - u) * TAU); ctx.stroke();
    }
    ctx.restore();
    drawNeedIcon(n.type, x, y, s);
    if (late) {
      ctx.fillStyle = '#fa5252';
      ctx.beginPath(); ctx.arc(x + 21 * s, y - 21 * s, 9 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(14 * s)}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', x + 21 * s, y - 20 * s);
      ctx.textBaseline = 'alphabetic';
    }
  }
}

function updateTools(dt) {
  for (let i = tools.length - 1; i >= 0; i--) {
    const tl = tools[i];
    tl.t += dt;
    const top = plantTopP(), base = wp(0, 0);
    const sx = top.x - 46, sy = Math.min(top.y, base.y - 40) - 30;
    if (tl.t > 0.25 && tl.t < 1.1 && Math.random() < dt * 40) {
      if (tl.type === 'water') spawn(sx + 30 + rand(-4, 4), sy + 10, rand(10, 50), rand(20, 60), 1.4, Math.random() < 0.5 ? '#6cc4ff' : '#bfe6ff', rand(2, 3.5), 500);
      else spawn(base.x + rand(-30, 30), base.y - 70, rand(-10, 10), rand(20, 60), 0.8, Math.random() < 0.5 ? '#6a4424' : '#8a5a33', rand(2.5, 4), 400);
    }
    if (tl.t > 1.3) tools.splice(i, 1);
  }
}

function drawTools() {
  for (const tl of tools) {
    const a = clamp(Math.min(tl.t / 0.2, (1.3 - tl.t) / 0.2), 0, 1);
    const top = plantTopP(), base = wp(0, 0);
    ctx.save();
    ctx.globalAlpha = a;
    if (tl.type === 'water') {
      const sx = top.x - 46, sy = Math.min(top.y, base.y - 40) - 30;
      ctx.translate(sx, sy);
      ctx.rotate(0.5 * ease(tl.t / 0.3));
      ctx.fillStyle = '#4bb3a0'; ctx.strokeStyle = '#2f7f70'; ctx.lineWidth = 2;
      roundRect(-18, -12, 32, 26, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(32, -12); ctx.lineTo(34, -8); ctx.lineTo(14, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-4, -14, 10, Math.PI, TAU); ctx.stroke();
    } else {
      ctx.translate(base.x + 26, base.y - 86);
      ctx.rotate(-0.6 * ease(tl.t / 0.3));
      ctx.fillStyle = '#d9b77a'; ctx.strokeStyle = '#9a7a40'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-14, -18); ctx.lineTo(14, -18); ctx.quadraticCurveTo(18, 14, 10, 18); ctx.lineTo(-10, 18); ctx.quadraticCurveTo(-18, 14, -14, -18); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6a4424'; ctx.beginPath(); ctx.ellipse(0, -18, 13, 4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5a9a34'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('☘', 0, 6);
    }
    ctx.restore();
  }
}

function drawJesusBubble() {
  if (!bubble) return;
  const jp = wp(JESUS_X, 0);
  const s = 1.35 * cam.z;
  const hx = jp.x, hy = jp.y - 80 * s;
  const onScreen = hx > -10 && hx < W + 10;
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 60, 420);
  const lines = wrapText(bubble.text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(hx - 40, 14, W - w - 14);
  const by = onScreen ? Math.max(hy - 26 - h, 118 - offY) : 180 - offY;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  if (onScreen && hy - 8 > by + h) {
    // tail down to Jesus
    const ax = clamp(hx + 6, bx + 16, bx + w - 16);
    ctx.beginPath(); ctx.moveTo(ax - 9, by + h - 1.5); ctx.lineTo(hx + 4, hy - 8); ctx.lineTo(ax + 9, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ax - 9, by + h); ctx.lineTo(hx + 4, hy - 8); ctx.lineTo(ax + 9, by + h); ctx.stroke();
  }
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0 || !message.text) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 23px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  const lines = wrapText(message.text, Math.min(W - 150, 560));
  const y0 = 140 - offY;
  lines.forEach((l, i) => {
    ctx.strokeText(l, W / 2, y0 + i * 28);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(l, W / 2, y0 + i * 28);
  });
  ctx.restore();
}

function drawKbCursor() {
  if (!kbShow || state !== 'play') return;
  const list = kbTargets();
  if (!list.length) return;
  const tg = list[clamp(kbCursor, 0, list.length - 1)];
  const r = tg.r + 6 + Math.sin(t * 6) * 3;
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(tg.x, tg.y, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#e0a526';
  ctx.beginPath(); ctx.moveTo(tg.x - 8, tg.y - r - 14); ctx.lineTo(tg.x + 8, tg.y - r - 14); ctx.lineTo(tg.x, tg.y - r - 4); ctx.fill();
}

function drawStreaks() {
  if (!cfg.wind) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineCap = 'round'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const s of streaks) {
    const x = -offX - 100 + s.f * (viewW + 200);
    const len = (12 + Math.abs(gust) * 30) * s.len;
    const wav = Math.sin(t * 3 + s.y) * 2;
    ctx.moveTo(x, s.y + wav); ctx.lineTo(x - Math.sign(gust || 1) * len, s.y + wav);
  }
  ctx.stroke();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + health
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Mustard Seed' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('HEALTH', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(64, 38, 124, 13, 6.5); ctx.fill();
  const hl = plant ? plant.health / 100 : 1;
  const hg = ctx.createLinearGradient(64, 0, 188, 0);
  hg.addColorStop(0, '#5cbf3a'); hg.addColorStop(1, '#b6f07a');
  ctx.fillStyle = hl < 0.25 && Math.sin(t * 10) > 0 ? '#ff6b6b' : hl < 0.45 ? '#fab005' : hg;
  if (hl > 0) { roundRect(64, 38, 124 * hl, 13, 6.5); ctx.fill(); }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: growth stage, birds and balance
  if (plant && state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText(`GROWTH · ${STAGE_NAMES[plant.stage].toUpperCase()}`, rx, 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(rx - 124, 27, 124, 12, 6); ctx.fill();
    const gf = growthFrac();
    const gg = ctx.createLinearGradient(rx - 124, 0, rx, 0);
    gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
    ctx.fillStyle = gg;
    if (gf > 0) { roundRect(rx - 124, 27, 124 * gf, 12, 6); ctx.fill(); }
    // birds
    ctx.shadowBlur = 4;
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillStyle = '#5a4210';
    ctx.fillText(`${nestedCount()} / ${cfg.birds}`, rx, 62);
    ctx.shadowBlur = 0;
    const tw = ctx.measureText(`${nestedCount()} / ${cfg.birds}`).width;
    drawBird(rx - tw - 18, 55, BIRD_TYPES[2], 8, 0, 1, true);
    if (plant.stage >= 4) {
      const bal = Math.round((1 - balanceInfo().imbalance) * 100);
      ctx.shadowBlur = 4;
      ctx.font = '600 13px Fredoka, sans-serif';
      ctx.fillStyle = bal >= 75 ? '#2b8a3e' : bal >= 50 ? '#d9480f' : '#c92a2a';
      ctx.fillText(`Balance ${bal}%`, rx, 82);
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);

  drawSky();
  drawSun();
  drawHills();

  // The garden, in world coordinates
  ctx.save();
  ctx.translate(W / 2 - cam.x * cam.z, cam.baseY);
  ctx.scale(cam.z, cam.z);
  drawGround();
  ctx.restore();

  // Jesus and the listening crowd
  const jp = wp(JESUS_X, 0), js = 1.35 * cam.z;
  if (state === 'title' || state === 'intro') lookAt = { x: jp.x, y: jp.y - 70 * js };
  else { const tp = plantTopP(), bp = wp(0, 0); lookAt = { x: tp.x, y: lerp(tp.y, bp.y, 0.3) }; }
  const slots = crowdSlots();
  for (const s of slots) if (s.row === 0) drawDisciple(s);
  const [pose, face] = jesusPose();
  drawJesus(jp.x, jp.y, js, pose, face);
  for (const s of slots) if (s.row === 1) drawDisciple(s);

  ctx.save();
  ctx.translate(W / 2 - cam.x * cam.z, cam.baseY);
  ctx.scale(cam.z, cam.z);
  drawPlant();
  ctx.restore();

  // A dull shadow while the cloud hides the sun
  if (cloud.cover > 0.05) {
    ctx.fillStyle = `rgba(60,70,100,${0.12 * cloud.cover})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  drawBuds();
  drawSpots();
  drawWeeds();
  drawPests();
  drawBirds();
  drawTools();
  drawParticles();
  drawStreaks();

  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawNeedBubbles();
  drawKbCursor();
  drawJesusBubble();
  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateGust(dt);
  updateParticles(dt);
  updateDisciples(dt);
  updateCamera(dt);
  for (const c of bgClouds) { c.f += c.speed * (1 + (cfg.wind ? Math.abs(gust) * 3 : 0)) * dt / (viewW + 300); if (c.f > 1) c.f -= 1; }
  if (cfg.wind) for (const s of streaks) { s.f += gust * 0.5 * dt; if (s.f > 1) s.f -= 1; if (s.f < 0) s.f += 1; }
  crowdEvent.t = Math.max(0, crowdEvent.t - dt);
  cloud.cover += (cloud.target - cloud.cover) * Math.min(1, dt * 2.5);
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  plant.blinkT -= dt;
  if (plant.blinkT <= 0) { plant.blink = 0.14; plant.blinkT = rand(2, 5); }
  if (plant.blink > 0) plant.blink -= dt;

  if (state === 'intro') {
    introT += dt;
    if (introT >= introDur) beginPlay();
  } else if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'win' || state === 'fail') {
    updateCritters(dt);
    updateBirds(dt);
    for (const br of branches) br.grow = Math.min(1, br.grow + dt);
    if (state === 'fail') { plant.droop = Math.min(1, plant.droop + dt * 0.5); plant.mood = 'sad'; }
    if (state === 'win' && Math.random() < dt * 10) {
      const q = plantTopP();
      spawn(q.x + rand(-160, 160) * cam.z, q.y + rand(0, 300) * cam.z, 0, -20, 1.2, Math.random() < 0.5 ? '#fff6d0' : '#ffe27a', 3);
    }
    plant.h += (hTarget() - plant.h) * Math.min(1, dt * 2);
  }
  if (state === 'play') plant.h += (hTarget() - plant.h) * Math.min(1, dt * 2);
  updateTools(dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' && cfg.wind ? Math.abs(gust) * 0.35 : 0);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
