<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#21160f">
<title>The Cave of En Gedi</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #21160f;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(20, 14, 10, 0.35);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .new {
    text-align: center;
    background: #fff3cf;
    border-radius: 12px;
    padding: 6px 10px;
    margin: 8px 0;
  }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'strings', ambience: 'wind', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  creptUp: { ref: '1 Samuel 24:4', KJV: 'Then David arose, and cut off the skirt of Saul\'s robe privily.', NKJV: 'And David arose and secretly cut off a corner of Saul’s robe.', NIV: 'Then David crept up unnoticed and cut off a corner of Saul’s robe.', NLT: 'So David crept forward and cut off a piece of the hem of Saul’s robe.' },
  // Level 1 card: where David hides
  inCave: { ref: '1 Samuel 24:3', KJV: 'David and his men remained in the sides of the cave.', NKJV: 'David and his men were staying in the recesses of the cave.', NIV: 'David and his men were far back in the cave.', NLT: 'David and his men were hiding farther back in that very cave!' },
  // What David's men whisper
  yourChance: { ref: '1 Samuel 24:4', KJV: 'Behold the day of which the Lord said unto thee, Behold, I will deliver thine enemy into thine hand', NKJV: 'This is the day of which the Lord said to you, ‘Behold, I will deliver your enemy into your hand', NIV: 'This is the day the Lord spoke of when he said to you, ‘I will give your enemy into your hands', NLT: 'Now’s your opportunity!” David’s men whispered to him. “Today the Lord is telling you, ‘I will certainly put your enemy into your power' },
  // David's answer (speech bubble when the men are hushed)
  notMyHand: { ref: '1 Samuel 24:10', KJV: 'I will not put forth mine hand against my lord; for he is the Lord\'s anointed.', NKJV: 'I will not stretch out my hand against my lord, for he is the Lord’s anointed.', NIV: 'I will not lay my hand on my lord, because he is the Lord’s anointed.', NLT: 'I will never harm the king—he is the Lord’s anointed one.' },
  spared: { ref: '1 Samuel 24:10', KJV: 'the Lord had delivered thee to day into mine hand in the cave: and some bade me kill thee: but mine eye spared thee', NKJV: 'the Lord delivered you today into my hand in the cave, and someone urged me to kill you. But my eye spared you', NIV: 'the Lord delivered you into my hands in the cave. Some urged me to kill you, but I spared you', NLT: 'the Lord placed you at my mercy back there in the cave. Some of my men told me to kill you, but I spared you.' },
  // David calls out from the cave mouth (bubble) and the win card
  seeHand: { ref: '1 Samuel 24:11', KJV: 'my father, see, yea, see the skirt of thy robe in my hand', NKJV: 'my father, see! Yes, see the corner of your robe in my hand!', NIV: 'See, my father, look at this piece of your robe in my hand!', NLT: 'Look, my father, at what I have in my hand. It is a piece of the hem of your robe!' },
  seeRobe: { ref: '1 Samuel 24:11', KJV: 'see the skirt of thy robe in my hand: for in that I cut off the skirt of thy robe, and killed thee not', NKJV: 'see the corner of your robe in my hand! For in that I cut off the corner of your robe, and did not kill you', NIV: 'look at this piece of your robe in my hand! I cut off the corner of your robe but did not kill you.', NLT: 'It is a piece of the hem of your robe! I cut it off, but I didn’t kill you.' },
  judge: { ref: '1 Samuel 24:12', KJV: 'The Lord judge between me and thee... but mine hand shall not be upon thee.', NKJV: 'Let the Lord judge between you and me... But my hand shall not be against you.', NIV: 'May the Lord judge between you and me... but my hand will not touch you.', NLT: 'May the Lord judge between us... but I will never harm you.' },
  // Saul is moved (bubble and the last card)
  righteous: { ref: '1 Samuel 24:17', KJV: 'Thou art more righteous than I: for thou hast rewarded me good, whereas I have rewarded thee evil.', NKJV: 'You are more righteous than I; for you have rewarded me with good, whereas I have rewarded you with evil.', NIV: 'You are more righteous than I,” he said. “You have treated me well, but I have treated you badly.', NLT: 'You are a better man than I am, for you have repaid me good for evil.' },
  moreRighteous: { ref: '1 Samuel 24:17', KJV: 'Thou art more righteous than I', NKJV: 'You are more righteous than I', NIV: 'You are more righteous than I', NLT: 'You are a better man than I am' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function bubbleText(key) {
  return Bible.verse(VERSES[key]).text.replace(/^\.\.\.\s*/, '…').replace(/[,:]$/, '…').replace(/[“”]/g, '');
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes cave roof above the playfield
  if (path) layoutLevel(true);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;          // HUD strip at the top of the screen
const HOP_T = 0.24;        // seconds for one step
const SENT_BACK = 5;       // stones David scurries back when he is caught
const GRACE = 0.14;        // a step in the first moment of a stir still counts

const LEVELS = [
  { name: 'Into the Cave',      stones: 7,  pebbles: 0, drips: 0, bats: 0, guard: 0, snore: [6, 8],     warn: 1.7,  look: [1.5, 1.8], breath: [1.9, 1.9], nap: 55,  whispers: 1, hushT: 5,   snipSpeed: 0.55, zone: 0.34 },
  { name: 'Crunchy Pebbles',    stones: 10, pebbles: 2, drips: 0, bats: 0, guard: 0, snore: [4.5, 6.5], warn: 1.35, look: [1.6, 2.0], breath: [1.7, 1.8], nap: 55,  whispers: 1, hushT: 4,   snipSpeed: 0.7,  zone: 0.3 },
  { name: 'Drip, Drop',         stones: 12, pebbles: 2, drips: 2, bats: 0, guard: 0, snore: [3.5, 5.5], warn: 1.1,  look: [1.6, 2.2], breath: [1.5, 1.8], nap: 60,  whispers: 1, hushT: 3.5, snipSpeed: 0.85, zone: 0.26 },
  { name: 'Bats in the Dark',   stones: 14, pebbles: 3, drips: 2, bats: 2, guard: 0, snore: [2.6, 5],   warn: 0.95, look: [1.6, 2.4], breath: [1.2, 2.0], nap: 60,  whispers: 2, hushT: 3,   snipSpeed: 1.0,  zone: 0.23},
  { name: 'Saul’s Guards',      stones: 16, pebbles: 3, drips: 2, bats: 2, guard: 1, snore: [2.4, 4.6], warn: 0.85, look: [1.7, 2.4], breath: [1.2, 2.0], nap: 65,  whispers: 2, hushT: 2.8, snipSpeed: 1.1,  zone: 0.21 },
  { name: 'The Deepest Dark',   stones: 19, pebbles: 4, drips: 3, bats: 3, guard: 2, snore: [2.0, 4.2], warn: 0.72, look: [1.8, 2.6], breath: [1.0, 2.1], nap: 65, whispers: 2, hushT: 2.4, snipSpeed: 1.2,  zone: 0.2  },
];
const NEW_THINGS = [
  '',
  '<b>New: crunchy pebbles!</b> Step onto them only on Saul’s big loud <b>SNORE</b> so he can’t hear the crunch.',
  '<b>New: drips!</b> Water drips from the roof. Don’t stand under a drip when the drop falls.',
  '<b>New: bats!</b> Don’t stop under the sleeping bats for long, or they flap away squeaking.',
  '<b>New: Saul’s guard!</b> He walks in with a lamp. <b>Freeze</b> while his light shines on you.',
  'The guard walks faster, and Saul hardly sleeps at all. Be brave and patient!',
];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | pause | win | fail | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('caveBest') || 0; } catch (e) {}

let cfg = LEVELS[0];
let t = 0;
let path = null;           // { stones, rows, saul, men, mouth }
let david = null;
let saul = null;
let guard = null;
let whisper = null;
let snip = null;
let particles = [];
let zees = [];
let message = { text: '', t: 0 };
let bubbles = [];          // speech bubbles { key|text, who, t }
let flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let playT = 0, winT = 0, failT = 0;
let napLeft = 60;
let chances = 3;
let noises = 0, hushed = 0, snipMiss = 0, caughtCount = 0;
let failWhy = '';
let told = {};

// ============================================================
//  Building the cave and the path of stepping stones
// ============================================================
function rowsY() { return W > 820 ? [440, 748] : [300, 522, 748]; }

function layoutLevel(keep) {
  const rows = rowsY();
  const nR = rows.length;
  const rad = (k) => (rows[k + 1] - rows[k]) / 2;
  let maxRL = 0, maxRR = 0;
  const dirs = rows.map((_, k) => ((nR - 1 - k) % 2 === 0 ? 1 : -1));   // the last row runs left to right, toward Saul
  for (let k = 0; k < nR - 1; k++) { if (dirs[k] > 0) maxRR = Math.max(maxRR, rad(k)); else maxRL = Math.max(maxRL, rad(k)); }
  const xL = 38 + maxRL, xR = W - 38 - maxRR;
  const sx = W - 150, sy = rows[nR - 1] + 30;
  const endX = sx - 132;
  // the winding path as a fine polyline
  const pts = [];
  for (let k = 0; k < nR; k++) {
    const a = dirs[k] > 0 ? xL : xR, b = k === nR - 1 ? endX : dirs[k] > 0 ? xR : xL;
    const n = Math.max(1, Math.round(Math.abs(b - a) / 4));
    for (let i = 0; i <= n; i++) pts.push([lerp(a, b, i / n), rows[k]]);
    if (k < nR - 1) {
      const r = rad(k), cy = rows[k] + r;
      if (dirs[k] > 0) for (let q = -Math.PI / 2; q <= Math.PI / 2; q += 0.04) pts.push([xR + r * Math.cos(q), cy + r * Math.sin(q)]);
      else for (let q = Math.PI * 1.5; q >= Math.PI / 2; q -= 0.04) pts.push([xL + r * Math.cos(q), cy + r * Math.sin(q)]);
    }
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = cum[cum.length - 1];
  const N = cfg.stones;
  const sp = Math.min(W > 900 ? 112 : 96, L / (N - 1));
  const at = (s) => {
    let i = 1;
    while (i < cum.length - 1 && cum[i] < s) i++;
    const f = (s - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
    return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
  };
  const old = keep && path ? path.stones : null;
  const stones = [];
  for (let i = 0; i < N; i++) {
    const [x, y] = at(L - (N - 1 - i) * sp);
    const st = old ? old[i] : { kind: 'plain', batT: 0, batGone: false, dripOff: rand(0, 3), r: 26 + hash(i, 3) * 5 };
    st.x = x; st.y = y;
    stones.push(st);
  }
  const start = stones[0];
  // David's men hide behind a boulder just behind the first stone
  const dx = stones[1].x - start.x;
  const men = { x: clamp(start.x - Math.sign(dx || 1) * 92, 74, W - 74), y: start.y + 4 };
  if (Math.abs(men.x - start.x) < 60) { men.x = start.x; men.y = start.y - 70; }
  // the trail itself, drawn faintly from the first stone onward
  const trail = pts.filter((p, i) => cum[i] >= L - (N - 1) * sp - 30);
  path = { stones, rows, saul: { x: sx, y: sy }, men, trail, sp };
  if (!keep) {
    // hazards on the stones (never the first or the last two)
    const free = [];
    for (let i = 1; i < N - 2; i++) free.push(i);
    free.sort(() => Math.random() - 0.5);
    const used = new Set();
    const take = (kind, n) => {
      for (let k = 0; k < n; k++) {
        const j = free.findIndex((i) => !used.has(i) && !used.has(i - 1) && !used.has(i + 1));
        const idx = j >= 0 ? free.splice(j, 1)[0] : free.shift();
        if (idx == null) return;
        used.add(idx);
        stones[idx].kind = kind;
      }
    };
    take('pebble', cfg.pebbles);
    take('drip', cfg.drips);
    take('bat', cfg.bats);
  }
  if (david) { const s = stones[david.i]; if (!david.hop) { david.x = s.x; david.y = s.y; } }
  if (guard) guard.y = guardY();
}

// ============================================================
//  Level flow
// ============================================================
function resetLevel() {
  cfg = LEVELS[level - 1];
  path = null; david = null; guard = null;
  layoutLevel(false);
  const s0 = path.stones[0];
  david = { i: 0, x: s0.x, y: s0.y, hop: null, back: null, mood: 'watch', shiver: 0, holdCorner: false, face: 1, blink: 0, blinkT: 2, out: null };
  saul = { headX: path.saul.x + 66, headY: path.saul.y - 8, phase: 'snore', pt: 0, dur: rand(...cfg.snore), breathT: 0, breathP: rand(...cfg.breath), loud: false, lookExtra: 0, cut: false, stand: null, walkX: 0, blink: 0 };
  guard = cfg.guard ? { mode: 'away', timer: rand(5, 7), x: W + 80, y: guardY(), step: 0 } : null;
  const N = cfg.stones;
  const triggers = cfg.whispers === 1 ? [Math.floor(N * 0.4)] : [Math.floor(N * 0.3), Math.floor(N * 0.68)];
  whisper = { triggers, active: false, t: 0, done: 0 };
  snip = { u: 0, ph: 0, cut: false };
  particles = []; zees = []; bubbles = [];
  napLeft = cfg.nap;
  chances = 3;
  noises = 0; hushed = 0; snipMiss = 0; caughtCount = 0;
  playT = 0; winT = 0; failT = 0;
  flashT = shakeT = 0;
  endTimer = 0;
  failWhy = '';
  told = {};
  keys.clear();
}

function startLevel() {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  if (level === 1) setTimeout(() => { if (state === 'play' && david.i === 0) showMessage('Saul is snoring… Tap to tiptoe!', 3); }, 2300);
}

// ============================================================
//  King Saul's nap
// ============================================================
function saulAwake() {
  return (saul.phase === 'stir' && saul.pt > GRACE) || saul.phase === 'look' || saul.phase === 'alarm';
}

function updateSaul(dt) {
  saul.pt += dt;
  saul.blink = Math.max(0, saul.blink - dt);
  if (saul.phase === 'snore') {
    saul.breathT += dt;
    if (saul.breathT >= saul.breathP) { saul.breathT = 0; saul.breathP = rand(...cfg.breath); }
    const wasLoud = saul.loud;
    saul.loud = saul.breathT / saul.breathP > 0.56;
    if (saul.loud && !wasLoud) {
      sfx.snore();
      for (let k = 0; k < 3; k++) zees.push({ x: saul.headX + 16, y: saul.headY - 24, vx: rand(10, 30), vy: rand(-46, -34), t: 0, life: 1.8, s: rand(0.8, 1.2) + k * 0.25, d: k * 0.18 });
    }
    if (saul.pt >= saul.dur) startStir();
  } else {
    saul.loud = false;
    if (saul.phase === 'stir' && saul.pt >= cfg.warn) {
      saul.phase = 'look'; saul.pt = 0; saul.dur = rand(...cfg.look) + saul.lookExtra; saul.lookExtra = 0;
      sfx.hmm(true);
    } else if (saul.phase === 'look' && saul.pt >= saul.dur + saul.lookExtra) {
      backToSleep();
    } else if (saul.phase === 'alarm' && saul.pt >= saul.dur) {
      backToSleep();
    }
  }
}
function startStir() {
  saul.phase = 'stir'; saul.pt = 0; saul.lookExtra = 0;
  sfx.hmm(false);
  if (!told.stir) { told.stir = true; showMessage('He’s stirring… STOP!', 2.2); }
}
function backToSleep() {
  saul.phase = 'snore'; saul.pt = 0; saul.dur = rand(...cfg.snore); saul.breathT = 0; saul.breathP = rand(...cfg.breath);
  saul.lookExtra = 0;
}

// Something made a noise: Saul starts to wake (or stays awake longer)
function makeNoise(text) {
  noises++;
  showMessage(text, 2);
  if (saul.phase === 'snore') startStir();
  else saul.lookExtra += 1.0;
  shakeT = 0.15;
}

// ============================================================
//  The guard with his lamp (later levels)
// ============================================================
const GUARD_R = 165;
function guardY() { const r = path.rows, n = r.length; return n > 2 ? (r[n - 2] + r[n - 1]) / 2 + 20 : r[n - 1] - 120; }
function guardLight() {
  if (!guard || !['in', 'pause', 'out'].includes(guard.mode)) return null;
  return { x: guard.x + 34 * guardFace(), y: guard.y - 40, r: GUARD_R };
}
function guardFace() { return guard && guard.mode === 'out' ? 1 : -1; }
function inLight(x, y) {
  const L = guardLight();
  return L && Math.hypot(x - L.x, y - L.y) < L.r - 10;
}
function updateGuard(dt) {
  if (!guard) return;
  const speed = cfg.guard === 2 ? 135 : 95;
  const turnX = cfg.guard === 2 ? W * 0.18 : W * 0.34;
  guard.timer -= dt;
  if (guard.mode === 'away') {
    if (guard.timer <= 0) { guard.mode = 'coming'; guard.timer = 1.8; sfx.footsteps(); if (!told.guard) { told.guard = true; showMessage('A guard is coming with a lamp!', 2.4); } }
  } else if (guard.mode === 'coming') {
    if (guard.timer <= 0) { guard.mode = 'in'; guard.x = W + 70; }
  } else if (guard.mode === 'in') {
    guard.x -= speed * dt; guard.step += dt * 6;
    if (guard.x <= turnX) { guard.mode = 'pause'; guard.timer = rand(1, 1.6); }
  } else if (guard.mode === 'pause') {
    if (guard.timer <= 0) guard.mode = 'out';
  } else if (guard.mode === 'out') {
    guard.x += speed * dt; guard.step += dt * 6;
    if (guard.x > W + 80) { guard.mode = 'away'; guard.timer = rand(4.5, 8); }
  }
  const L = guardLight();
  if (L && inLight(david.x, david.y) && !told.freeze) { told.freeze = true; showMessage('Freeze in the lamplight!', 2); }
}

// ============================================================
//  David's steps
// ============================================================
function act() {
  if (state !== 'play') return;
  if (david.hop || david.back || david.out) return;
  if (snipReady()) { trySnip(); return; }
  const next = path.stones[david.i + 1];
  if (!next) return;
  if (saulAwake()) { caught('saul'); return; }
  if (inLight(david.x, david.y) || inLight(next.x, next.y)) { caught('guard'); return; }
  const from = path.stones[david.i];
  david.hop = { fx: from.x, fy: from.y, tx: next.x, ty: next.y, t: 0 };
  david.i++;
  david.face = next.x >= from.x ? 1 : -1;
  if (from.kind === 'bat') from.batT = 0;
  // the crunchy pebbles
  if (next.kind === 'pebble' && !next.quiet) {
    if (saul.loud) { next.quiet = true; sfx.step(true); showMessage('The snore covered the crunch!', 1.6); }
    else { sfx.crunch(); makeNoise('CRUNCH! The pebbles!'); for (let k = 0; k < 8; k++) spawn(next.x, next.y, rand(-70, 70), rand(-120, -50), 0.6, '#9a8a78', rand(2, 4), 300); }
  } else sfx.step(false);
  // David's men whisper as he passes
  if (whisper.done < whisper.triggers.length && david.i >= whisper.triggers[whisper.done] && !whisper.active) {
    whisper.active = true; whisper.t = 0; whisper.done++;
    sfx.whisper();
    if (!told.hush) { told.hush = true; showMessage('Tap your men to hush them!', 2.6); }
  }
}

function snipReady() { return david.i === path.stones.length - 1 && !snip.cut; }

function trySnip() {
  if (saulAwake()) { caught('saul'); return; }
  if (inLight(david.x, david.y)) { caught('guard'); return; }
  const d = Math.abs(snip.u - SNIP_ZONE);
  if (d <= cfg.zone / 2) {
    snip.cut = true; saul.cut = true;
    sfx.snip();
    sparkleBurst(snipPoint(SNIP_ZONE).x, snipPoint(SNIP_ZONE).y, 30);
    win();
  } else {
    snipMiss++;
    sfx.tug();
    makeNoise('Oops! That tugged the robe!');
  }
}

function caught(who) {
  caughtCount++;
  chances--;
  sfx.caught();
  shakeT = 0.3;
  saul.phase = 'alarm'; saul.pt = 0; saul.dur = 2.2; saul.lookExtra = 0;
  bubbles.push({ text: who === 'guard' ? 'Who goes there?!' : 'Who’s there?!', who: who === 'guard' ? 'guard' : 'saul', t: 1.8 });
  if (chances <= 0) { fail(who === 'guard' ? 'The guard saw you moving in the lamplight.' : 'Saul saw you moving while he was awake.'); return; }
  showMessage(who === 'guard' ? 'Spotted in the lamplight! Back to the shadows…' : 'Saul saw you move! Back to the shadows…', 2.4);
  const to = Math.max(0, david.i - SENT_BACK);
  david.back = { from: david.i, to, t: 0 };
  david.hop = null;
  if (guard && guard.mode !== 'away') { guard.mode = 'out'; }
}

function updateDavid(dt) {
  david.blinkT -= dt;
  if (david.blinkT <= 0) { david.blink = 0.13; david.blinkT = rand(1.5, 4); }
  if (david.blink > 0) david.blink -= dt;
  david.shiver = Math.max(0, david.shiver - dt);
  if (david.hop) {
    david.hop.t += dt / HOP_T;
    const f = Math.min(1, david.hop.t);
    david.x = lerp(david.hop.fx, david.hop.tx, f);
    david.y = lerp(david.hop.fy, david.hop.ty, f) - Math.sin(f * Math.PI) * 16;
    if (f >= 1) { david.hop = null; david.x = path.stones[david.i].x; david.y = path.stones[david.i].y; }
  } else if (david.back) {
    // scurry back along the stones
    david.back.t += dt;
    const k = david.back.t / 0.13;
    const i = Math.max(david.back.to, david.back.from - Math.floor(k));
    const j = Math.max(david.back.to, i - 1);
    const f = k - Math.floor(k);
    const a = path.stones[i], b = path.stones[j];
    david.face = b.x >= a.x ? 1 : -1;
    david.x = lerp(a.x, b.x, i === j ? 0 : f); david.y = lerp(a.y, b.y, i === j ? 0 : f) - Math.sin(f * Math.PI) * 10;
    if (i === david.back.to) { david.i = david.back.to; david.x = a.x; david.y = a.y; david.back = null; }
  }
  // hazards where David stands
  const st = path.stones[david.i];
  if (!david.hop && !david.back) {
    if (st.kind === 'bat' && !st.batGone) {
      st.batT += dt;
      if (st.batT > 0.5 && !told.bat) { told.bat = true; showMessage('Don’t stop under the bats!', 1.8); }
      if (st.batT >= (level >= 5 ? 1.15 : 1.35)) {
        st.batGone = true;
        flyBats(st);
        makeNoise('Squeak! The bats flew off!');
      }
    }
  }
  for (const s of path.stones) if (s !== st && s.kind === 'bat' && s.batT > 0) s.batT = Math.max(0, s.batT - dt * 2);
}

// Drips fall on a steady beat; standing under one when it lands gives David a cold shock
const DRIP_P = 2.7;
function dripPhase(st) { return ((t + st.dripOff) % DRIP_P) / DRIP_P; }
function updateDrips() {
  for (const st of path.stones) {
    if (st.kind !== 'drip') continue;
    const f = dripPhase(st);
    if (st.lastF != null && st.lastF < 0.9 && f >= 0.9) {
      sfx.plip();
      for (let k = 0; k < 6; k++) spawn(st.x, st.y - 8, rand(-60, 60), rand(-90, -40), 0.45, '#9fd4f0', rand(2, 3.5), 320);
      if (state === 'play' && path.stones[david.i] === st && !david.back && (!david.hop || david.hop.t < 0.5)) {
        david.shiver = 1;
        makeNoise('Brrr! A cold drip!');
      }
    }
    st.lastF = f;
    if (!told.drip && state === 'play' && path.stones[david.i + 1] === st) { told.drip = true; showMessage('Drip! Wait for the drop to fall first', 2.4); }
  }
}

function updateWhisper(dt) {
  if (!whisper.active) return;
  whisper.t += dt;
  if (whisper.t >= cfg.hushT) {
    whisper.active = false;
    makeNoise('The whispers woke Saul!');
  }
}
function hush() {
  if (!whisper.active) return;
  whisper.active = false;
  hushed++;
  sfx.shh();
  bubbles.push({ key: 'notMyHand', who: 'david', t: 4.2 });
  sparkleBurst(path.men.x, path.men.y - 30, 12, ['#fff6d0', '#ffe27a']);
}

function flyBats(st) {
  sfx.bats();
  for (let k = 0; k < 3; k++) particles.push({ kind: 'bat', x: st.x + (k - 1) * 14, y: st.y - 130, vx: rand(-140, 140), vy: rand(-160, -90), life: 2.2, t: 0, flap: rand(0, 6) });
}

// ============================================================
//  The snip
// ============================================================
const SNIP_ZONE = 0.18;    // where along the hem the corner is (0 = tip of the corner)
function hemEnds() {
  const s = path.saul;
  return { ax: s.x - 112, ay: s.y + 18, bx: s.x - 42, by: s.y + 28 };
}
function snipPoint(u) {
  const h = hemEnds();
  return { x: lerp(h.ax, h.bx, u), y: lerp(h.ay, h.by, u) - Math.sin(u * Math.PI) * 18 };
}
function updateSnip(dt) {
  if (!snipReady() || david.hop) return;
  snip.ph += dt * cfg.snipSpeed * Math.PI;
  snip.u = 0.5 - 0.5 * Math.cos(snip.ph);
  if (!told.snip) { told.snip = true; showMessage('Tap when the sparkle is on the corner!', 2.8); }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  david.holdCorner = true;
  const napBonus = Math.round(napLeft * 8);
  const chanceBonus = chances * 250;
  const quietBonus = Math.max(0, 400 - noises * 100);
  const mercyBonus = hushed * 150;
  const snipBonus = snipMiss === 0 ? 300 : 100;
  const levelBonus = level * 400;
  const score = napBonus + chanceBonus + quietBonus + mercyBonus + snipBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('caveBest', best); } catch (e) {} }
  lastScore = { napBonus, chanceBonus, quietBonus, mercyBonus, snipBonus, levelBonus, score };
  showMessage('Snip! A corner of the king’s robe!', 2.4);
  sfx.win();
  endTimer = 10;
}

function fail(why) {
  state = 'fail';
  syncAmbience();
  failT = 0;
  failWhy = why;
  saul.phase = 'alarm'; saul.pt = 0; saul.dur = 99;
  sfx.fail();
  endTimer = 2.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  particles.push({ x, y, vx, vy, life, t: 0, color, size, grav });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(40, 200);
    particles.push({ kind: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.6, 1.2), t: 0, color: pick(cols), size: rand(2, 5), grav: 60 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    if (p.kind === 'bat') { p.flap += dt * 20; p.vy -= 20 * dt; }
    p.vy += (p.grav || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = zees.length - 1; i >= 0; i--) {
    const z = zees[i];
    z.t += dt;
    if (z.t - z.d >= z.life) { zees.splice(i, 1); continue; }
    if (z.t < z.d) continue;
    z.x += z.vx * dt; z.y += z.vy * dt;
  }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
}

const ovBtn2 = document.getElementById('ovBtn2');

function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {

function titleScreen() {
  state = 'title';
  syncAmbience();
  level = 1; cfg = LEVELS[0];
  resetLevel();
  showOverlay('The Cave of En Gedi', 'David spares King Saul',
    `${verseHTML('creptUp')}
     <ul>
       <li>King Saul is chasing David, but now Saul is <b>fast asleep</b> in the very cave where David hides!</li>
       <li><b>Tap</b> to take one tiptoe step while Saul snores <b>Zzz</b>.</li>
       <li>When Saul <b>wobbles and stirs, STOP!</b> If he sees you move, you are sent back.</li>
       <li>When David’s men whisper, <b>tap them</b> to hush them. David will not hurt the king.</li>

     ${creditHTML()}`,

// A short card before each level with its verse and anything new
function levelCard() {
  const c = LEVELS[level - 1];
  const vk = ['inCave', 'yourChance', 'spared', 'notMyHand', 'judge', 'creptUp'][level - 1];
  showOverlay(`Level ${level}`, c.name,
    `${verseHTML(vk)}
     ${NEW_THINGS[level - 1] ? `<p class="new">${NEW_THINGS[level - 1]}</p>` : '<p style="text-align:center">Tap to tiptoe while Saul snores. <b>Stop</b> when he stirs!</p>'}
     <p class="score">Steps to the king: <b>${c.stones}</b></p>`,

}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    const last = level >= LEVELS.length;
    showOverlay(last ? 'Mercy wins!' : 'You spared the king!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(last ? 'righteous' : 'seeRobe', '…')}
       <p style="text-align:center">David could have hurt Saul, but he chose mercy and trusted God instead.</p>
       <p class="score">Saul’s nap left: <b>${s.napBonus}</b><br>Chances left: <b>${s.chanceBonus}</b><br>Quiet feet (${noises} noises): <b>${s.quietBonus}</b><br>Men hushed: <b>${s.mercyBonus}</b><br>Neat snip: <b>${s.snipBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${last ? '<p style="text-align:center"><b>You finished every level!</b></p>' : ''}
       ${creditHTML()}`,
      last ? 'Play again' : 'Next level', () => {
        if (last) { level = 1; totalScore = 0; } else level++;
        levelCard();
      });
    state = 'done';
  } else if (state === 'fail') {
    showOverlay('Saul woke up!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${failWhy} Wait for the <b>Zzz</b>, and <b>stop</b> as soon as he wobbles.</p>
       ${verseHTML('inCave')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
    state = 'done';
  }
}

function togglePause() {
  if (state === 'play') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Shh… Saul is still asleep. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel());
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat) {
    if (e.code === 'KeyH' || e.code === 'ArrowDown') { hush(); return; }
    if (['Space', 'ArrowRight', 'ArrowUp', 'KeyD', 'Enter'].includes(e.code)) act();
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 8) { b.action(); return; }
  }
  if (state === 'win' && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const lx = p.vx - offX, ly = p.vy - offY;
  if (whisper.active && Math.hypot(lx - path.men.x, ly - (path.men.y - 20)) < 95) { hush(); return; }
  act();
});

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and

canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });

  return [

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass', delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  step(soft) { this.noiseBurst(soft ? 500 : 700, 0.09, soft ? 0.05 : 0.08, 1.2); if (this.ctx) Music.tap(clamp(david.i / cfg.stones, 0, 1) * 0.8); },
  crunch() { for (let i = 0; i < 4; i++) this.noiseBurst(3200 + i * 300, 0.07, 0.3, 1.5, null, 'bandpass', i * 0.05); },
  snore() { this.noiseBurst(260, 0.7, 0.16, 2, 160, 'lowpass'); this.tone(85, 0.6, 'sawtooth', 0.05, 0.05, 70); },
  hmm(look) { this.tone(look ? 200 : 170, 0.4, 'triangle', 0.16, 0, look ? 260 : 150); },
  plip() { this.tone(1300, 0.14, 'sine', 0.13, 0, 600); },
  bats() { for (let i = 0; i < 6; i++) { this.tone(3200 + Math.random() * 900, 0.06, 'sine', 0.07, i * 0.07); this.noiseBurst(900, 0.08, 0.1, 1, null, 'bandpass', i * 0.06); } },
  whisper() { for (let i = 0; i < 3; i++) this.noiseBurst(4200, 0.25, 0.08, 3, 3000, 'bandpass', i * 0.3); },
  shh() { this.noiseBurst(5200, 0.5, 0.12, 2, 4200); },
  snip() { this.noiseBurst(6000, 0.08, 0.25, 2); this.noiseBurst(6500, 0.08, 0.2, 2, null, 'bandpass', 0.1); [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.4, 'sine', 0.1, 0.15 + i * 0.07)); },
  tug() { this.tone(240, 0.2, 'triangle', 0.18, 0, 160); },
  caught() { this.tone(520, 0.18, 'square', 0.12, 0, 340); this.tone(340, 0.3, 'square', 0.1, 0.16, 220); },
  footsteps() { for (let i = 0; i < 4; i++) this.noiseBurst(300, 0.1, 0.12, 1, null, 'lowpass', i * 0.4); },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && state === 'play');
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Drawing people
// ============================================================
const DAVID = { robe: '#3c8f86', hair: '#a8532a', skin: '#e3b184', beard: false, sash: '#e0a526' };
const MEN = [
  { robe: '#6b8e3a', hair: '#3a2716', skin: '#c98d56', beard: true },
  { robe: '#b5503f', hair: '#2e1d10', skin: '#d7a070', beard: true },
  { robe: '#5a6475', hair: '#4a2f1a', skin: '#c88e5a', beard: false },
];

function eyes(x, y, lx, ly, closed, big = 1) {
  const dark = '#2b1d12';
  for (const sx of [-6, 6]) {
    if (closed) {
      ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + sx, y - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x + sx, y, 3.6 * big, 4.6 * big, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(x + sx + lx * 1.6, y + ly * 2, 2.1, 0, TAU); ctx.fill();
  }
}

// A standing figure: d = colours, pose = 'creep' | 'stand' | 'hold' | 'call' | 'walk'
function drawFigure(d, x, y, s, opt = {}) {
  const pose = opt.pose || 'stand';
  const face = opt.face || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s, s);
  const crouch = pose === 'creep' ? 8 : 0;
  ctx.translate(0, crouch * 0.5);
  if (opt.shiver) ctx.translate(Math.sin(t * 60) * 1.6, 0);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // feet
  const stepA = pose === 'walk' ? Math.sin(opt.step || 0) * 5 : 0;
  ctx.fillStyle = '#7a4a28';
  ctx.beginPath(); ctx.ellipse(-7 + stepA, -2, 6, 3.5, 0, 0, TAU); ctx.ellipse(7 - stepA, -2, 6, 3.5, 0, 0, TAU); ctx.fill();
  // robe
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-17, -2);
  ctx.quadraticCurveTo(-16, -30, -11, -37 + crouch);
  ctx.quadraticCurveTo(0, -41 + crouch, 11, -37 + crouch);
  ctx.quadraticCurveTo(16, -30, 17, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = d.sash || '#c9b07a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-15, -18 + crouch * 0.4); ctx.quadraticCurveTo(0, -15 + crouch * 0.4, 15, -18 + crouch * 0.4); ctx.stroke();
  const sh = -32 + crouch;
  if (pose === 'creep') { arm(-11, sh, -18 * face, sh + 14); arm(11, sh, 22 * face, sh + 6); }
  else if (pose === 'hold') { arm(-11, sh, -14, sh + 20); arm(11 * face, sh, 22 * face, sh - 36); }
  else if (pose === 'call') { arm(-11, sh, -24, sh - 30); arm(11, sh, 24, sh - 30); }
  else if (pose === 'lamp' || pose === 'walk') { arm(11 * face, sh, 30 * face, sh + 14); arm(-11 * face, sh, -15 * face, sh + 20); }
  else { arm(-11, sh, -15, sh + 20); arm(11, sh, 15, sh + 20); }
  // head
  const hy = -53 + crouch;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.helmet) {
    ctx.fillStyle = '#9aa4ad';
    ctx.beginPath(); ctx.arc(0, hy - 3, 17, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#c0392b'; roundRect(-3, hy - 26, 6, 10, 3); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
    if (!d.beard) { // David's curls
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-12 + k * 6, hy - 13 + Math.abs(k - 2), 4, 0, TAU); ctx.fill(); }
    }
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  if (d.crown) drawCrown(0, hy - 14, 1);
  const closed = opt.blink;
  eyes(0, hy - 1, opt.lx != null ? opt.lx : face * 0.6, opt.ly || 0, closed, opt.wide ? 1.2 : 1);
  // mouth
  ctx.lineCap = 'round';
  if (opt.mouth === 'o') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(0, hy + 9, 3, 4, 0, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'shh') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.arc(0, hy + 9, 2.4, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'grin') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.moveTo(-6, hy + 6); ctx.arc(0, hy + 6, 6, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  else { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, hy + 6, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (opt.holdCorner) drawCorner(22 * face, sh - 44, 1.1);
  ctx.restore();
}

function drawCrown(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-13, 4); ctx.lineTo(-14, -8); ctx.lineTo(-7, -2); ctx.lineTo(0, -11); ctx.lineTo(7, -2); ctx.lineTo(14, -8); ctx.lineTo(13, 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
  ctx.restore();
}

// The cut-off corner of Saul's robe
function drawCorner(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#7b4bb0'; ctx.strokeStyle = '#4a2a72'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(12, -6); ctx.lineTo(-6, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(-6, 12); ctx.stroke();
  ctx.strokeStyle = '#3a7bd5'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 4; k++) { const f = (k + 0.5) / 4; const px = lerp(12, -6, f), py = lerp(-6, 12, f); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 4, py + 5); ctx.stroke(); }
  ctx.restore();
}

// King Saul asleep on his cloak, head toward the cave mouth
function drawSaul() {
  const s = path.saul;
  const ph = saul.phase;
  if (saul.stand) return;
  const breath = ph === 'snore' ? Math.sin((saul.breathT / saul.breathP) * TAU - Math.PI / 2) * 0.5 + 0.5 : 0.4;
  let wob = 0;
  if (ph === 'stir') wob = Math.sin(t * 26) * 0.09 * (1 - saul.pt / cfg.warn * 0.4);
  const lift = ph === 'look' || ph === 'alarm' ? Math.min(1, saul.pt / 0.25) : ph === 'stir' ? 0.15 : 0;
  ctx.save();
  // the cloak he lies on
  ctx.fillStyle = '#8a5a3a';
  ctx.beginPath(); ctx.ellipse(s.x - 10, s.y + 30, 140, 20, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(s.x - 10, s.y + 36, 135, 12, 0, 0, TAU); ctx.fill();
  // feet
  ctx.fillStyle = '#7a4a28';
  ctx.beginPath(); ctx.ellipse(s.x - 120, s.y + 18, 7, 11, 0.2, 0, TAU); ctx.fill();
  // body (robe), breathing
  ctx.save();
  ctx.translate(s.x - 20, s.y + 22);
  ctx.rotate(wob * 0.4);
  ctx.scale(1, 1 + breath * 0.08);
  ctx.fillStyle = '#7b4bb0'; ctx.strokeStyle = '#4a2a72'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-96, 6);
  ctx.quadraticCurveTo(-100, -26, -40, -36);
  ctx.quadraticCurveTo(30, -50, 70, -30);
  ctx.quadraticCurveTo(84, -10, 74, 8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // gold trim along the hem
  ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-96, 6); ctx.lineTo(74, 8); ctx.stroke();
  ctx.restore();
  // the corner of the robe (the hem flap near his feet)
  if (!saul.cut) {
    const h = hemEnds();
    ctx.fillStyle = '#7b4bb0'; ctx.strokeStyle = '#4a2a72'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h.ax, h.ay); ctx.quadraticCurveTo(lerp(h.ax, h.bx, 0.5), h.ay - 30, h.bx, h.by - 6); ctx.lineTo(h.bx, h.by); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#3a7bd5'; ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++) { const p = snipPoint(k / 6); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 2, p.y + 7); ctx.stroke(); }
  } else {
    const h = hemEnds();
    ctx.strokeStyle = '#4a2a72'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h.ax + 18, h.ay + 4); ctx.lineTo(h.ax + 24, h.ay - 4); ctx.lineTo(h.ax + 30, h.ay + 4); ctx.stroke();
  }
  // arm resting on his side
  ctx.strokeStyle = '#5e3790'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(s.x + 20, s.y - 6); ctx.quadraticCurveTo(s.x - 10, s.y + 2, s.x - 34, s.y - 6); ctx.stroke();
  ctx.fillStyle = '#d7a070'; ctx.beginPath(); ctx.arc(s.x - 36, s.y - 6, 5, 0, TAU); ctx.fill();
  // head, lifts and turns when he wakes
  const hx = s.x + 66 - lift * 6, hy = s.y - 8 - lift * 30;
  saul.headX = hx; saul.headY = hy;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(wob - 0.25 * (1 - lift));
  ctx.fillStyle = '#d7a070';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  // hair, beard and crown
  ctx.fillStyle = '#3a2716';
  ctx.beginPath(); ctx.arc(0, -3, 21.5, Math.PI * 0.95, Math.PI * 2.05); ctx.quadraticCurveTo(0, -14, -21, 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-19, 3); ctx.quadraticCurveTo(-18, 28, 0, 29); ctx.quadraticCurveTo(18, 28, 19, 3); ctx.quadraticCurveTo(10, 11, 0, 11); ctx.quadraticCurveTo(-10, 11, -19, 3); ctx.fill();
  drawCrown(0, -21, 1.25);
  // face
  const look = ph === 'look' || ph === 'alarm';
  if (look) {
    ctx.save(); ctx.scale(1.25, 1.25); eyes(0, -2, -1, 0.2, false, ph === 'alarm' ? 1.25 : 1); ctx.restore();
    ctx.fillStyle = '#6a2a1e';
    if (ph === 'alarm') { ctx.beginPath(); ctx.ellipse(0, 12, 4, 5, 0, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(5, 11); ctx.stroke(); }
    // frowny brows
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-13, -12); ctx.lineTo(-3, -9); ctx.moveTo(13, -12); ctx.lineTo(3, -9); ctx.stroke();
  } else if (ph === 'stir') {
    // eyes flutter half open
    const open = Math.sin(t * 14) > 0.2;
    ctx.save(); ctx.scale(1.25, 1.25); eyes(0, -2, -0.5, 0, !open); ctx.restore();
    ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-5, 12); ctx.quadraticCurveTo(0, 9, 5, 12); ctx.stroke();
  } else {
    ctx.save(); ctx.scale(1.25, 1.25); eyes(0, -2, 0, 0, true); ctx.restore();
    ctx.fillStyle = '#6a2a1e';
    const o = saul.loud ? 5.5 : 2.5;
    ctx.beginPath(); ctx.ellipse(0, 12, o * 0.8, o, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

// David's men peeking out from behind a boulder
function drawMen() {
  const m = path.men;
  const pop = whisper.active ? Math.min(1, whisper.t / 0.25) : 0;
  for (let k = 0; k < 3; k++) {
    const d = MEN[k];
    const x = m.x + (k - 1) * 34, up = (k === 1 ? pop * 26 : 0) + Math.sin(t * 2 + k) * 1.5;
    const y = m.y - 38 - up;
    ctx.fillStyle = d.skin;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = d.hair;
    ctx.beginPath(); ctx.arc(x, y - 2, 14.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    if (d.beard) { ctx.beginPath(); ctx.moveTo(x - 13, y + 2); ctx.quadraticCurveTo(x, y + 22, x + 13, y + 2); ctx.quadraticCurveTo(x, y + 8, x - 13, y + 2); ctx.fill(); }
    eyes(x, y - 1, clamp((david.x - x) / 200, -1, 1), 0.2, false, 0.85);
  }
  // the boulder they hide behind
  ctx.fillStyle = '#7a5f48';
  ctx.beginPath(); ctx.ellipse(m.x, m.y, 62, 34, 0, Math.PI, TAU); ctx.lineTo(m.x + 62, m.y + 8); ctx.lineTo(m.x - 62, m.y + 8); ctx.fill();
  ctx.fillStyle = '#937458';
  ctx.beginPath(); ctx.ellipse(m.x - 12, m.y - 16, 38, 11, -0.1, 0, TAU); ctx.fill();
  if (whisper.active) {
    // "Now's your chance!" and a pulsing hush button
    const left = cfg.hushT - whisper.t;
    const bx = m.x + 70 > W - 150 ? m.x - 160 : m.x + 50, by = m.y - 120;
    speech(bx, by, 'Now’s your chance!', m.x, m.y - 64, '#fff2f0', '#c0392b', 16);
    const pulse = 0.5 + 0.5 * Math.sin(t * 10);
    ctx.save();
    ctx.strokeStyle = `rgba(255,230,120,${0.5 + pulse * 0.5})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(m.x, m.y - 30, 58 + pulse * 6, 0, TAU); ctx.stroke();
    // countdown ring
    ctx.strokeStyle = '#ff7b5c'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(m.x, m.y - 30, 70, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(left / cfg.hushT, 0, 1)); ctx.stroke();
    ctx.font = '700 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,20,10,0.9)'; ctx.strokeText('Tap: Shh!', m.x, m.y + 30);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText('Tap: Shh!', m.x, m.y + 30);
    ctx.restore();
  }
}

function drawGuard() {
  if (!guard) return;
  if (guard.mode === 'coming') {
    // glow at the cave mouth before he walks in
    const a = 1 - guard.timer / 1.8;
    const g = ctx.createRadialGradient(W, guard.y - 40, 10, W, guard.y - 40, 150);
    g.addColorStop(0, `rgba(255,210,110,${0.5 * a})`); g.addColorStop(1, 'rgba(255,210,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W, guard.y - 40, 150, 0, TAU); ctx.fill();
    return;
  }
  if (guard.mode === 'away') return;
  const L = guardLight();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(L.x, L.y, 10, L.x, L.y, L.r);
  g.addColorStop(0, 'rgba(255,200,100,0.42)'); g.addColorStop(0.75, 'rgba(255,190,90,0.2)'); g.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.x, L.y, L.r, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,215,120,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(L.x, L.y, L.r - 10, 0, TAU); ctx.stroke();
  ctx.restore();
  const face = guardFace();
  drawFigure({ robe: '#8a3a2e', hair: '#2a1a0e', skin: '#c88e5a', beard: true, helmet: true, sash: '#9aa4ad' }, guard.x, guard.y, 1.05, { pose: guard.mode === 'pause' ? 'lamp' : 'walk', step: guard.step, face, lx: face, wide: true });
  // the lamp
  ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(L.x - 10 * face, L.y - 6); ctx.lineTo(L.x, L.y - 2); ctx.stroke();
  ctx.fillStyle = '#b8683a'; ctx.beginPath(); ctx.ellipse(L.x, L.y + 2, 9, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd25a'; ctx.beginPath(); ctx.ellipse(L.x, L.y - 6, 3.5, 6 + Math.sin(t * 20), 0, 0, TAU); ctx.fill();
}

// Speech bubble with a tail pointing to (ax, ay)
function speech(x, y, text, ax, ay, fill = '#fffbe8', ink = '#8a5a00', size = 17, maxW = 300) {
  ctx.save();
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 24, h = lines.length * (size + 5) + 14;
  const bx = clamp(x, 8, W - w - 8), by = Math.max(TOPH - offY + 6, y - h);
  ctx.fillStyle = fill; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(ax, bx + 18, bx + w - 34);
  if (ay > by + h) {
    ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay); ctx.lineTo(tx + 16, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(ax, ay); ctx.lineTo(tx + 16, by + h); ctx.stroke();
  }
  ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 12, by + 7 + (size + 5) / 2 + i * (size + 5)));
  ctx.restore();
  return { bx, by, w, h };
}

// ============================================================
//  Drawing the cave
// ============================================================
function lastRowY() { return path.rows[path.rows.length - 1]; }
function mouthTop() { return lastRowY() - 210; }

function drawCave() {
  const L = -offX, R = W + offX, T = -offY;
  // deep rock
  const g = ctx.createLinearGradient(0, T, 0, H);
  g.addColorStop(0, '#1c130d'); g.addColorStop(0.5, '#33241a'); g.addColorStop(1, '#3d2c1f');
  ctx.fillStyle = g; ctx.fillRect(L, T, R - L, H - T);
  // the cave mouth: daylight outside
  const my = mouthTop(), mx = W - 96;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(mx, H + 10);
  ctx.lineTo(mx - 10, my + 120);
  ctx.quadraticCurveTo(mx + 6, my - 10, mx + 90, my);
  ctx.lineTo(R + 10, my - 30); ctx.lineTo(R + 10, H + 10);
  ctx.closePath();
  ctx.clip();
  const sky = ctx.createLinearGradient(0, my, 0, H);
  sky.addColorStop(0, '#ffe9b0'); sky.addColorStop(0.6, '#bfe3f5'); sky.addColorStop(1, '#d9eac0');
  ctx.fillStyle = sky; ctx.fillRect(mx - 20, my - 40, R - mx + 40, H - my + 60);
  ctx.fillStyle = '#c9b77a';
  ctx.beginPath(); ctx.moveTo(mx - 20, H); ctx.quadraticCurveTo(mx + 60, my + 110, R + 20, my + 140); ctx.lineTo(R + 20, H); ctx.fill();
  ctx.fillStyle = '#9fbf6a';
  ctx.beginPath(); ctx.moveTo(mx - 20, H); ctx.quadraticCurveTo(mx + 90, my + 190, R + 20, my + 200); ctx.lineTo(R + 20, H); ctx.fill();
  ctx.restore();
  // warm light pouring in
  const lg = ctx.createRadialGradient(W + 20, H - 120, 20, W + 20, H - 120, Math.max(520, W * 0.6));
  lg.addColorStop(0, 'rgba(255,214,140,0.42)'); lg.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = lg; ctx.fillRect(L, T, R - L, H - T);
  // floor ledges under each row of the path
  for (let r = 0; r < path.rows.length; r++) {
    const y = path.rows[r] + 26;
    ctx.fillStyle = r === path.rows.length - 1 ? '#5b4331' : '#4d392a';
    ctx.beginPath();
    ctx.moveTo(L, y + 60);
    for (let x = L; x <= R; x += 30) ctx.lineTo(x, y + Math.sin(x / 70 + r) * 6 + hash(Math.floor(x / 30), r) * 6);
    ctx.lineTo(R, y + 120); ctx.lineTo(L, y + 120);
    ctx.fill();
  }
  const lastRow = path.rows[path.rows.length - 1];
  ctx.fillStyle = '#5b4331'; ctx.fillRect(L, lastRow + 90, R - L, H - lastRow);
  // stalactites hanging from the roof
  ctx.fillStyle = '#2a1d14';
  for (let k = 0; k < Math.ceil((R - L) / 46); k++) {
    const x = L + k * 46 + hash(k, 9) * 20, len = 30 + hash(k, 8) * 80;
    const top = T;
    ctx.beginPath(); ctx.moveTo(x - 14, top); ctx.lineTo(x, Math.max(top + 110, 40) + len); ctx.lineTo(x + 14, top); ctx.fill();
  }
  // trail dust
  ctx.strokeStyle = 'rgba(120,95,70,0.35)'; ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  path.trail.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1] + 6) : ctx.moveTo(p[0], p[1] + 6)));
  ctx.stroke();
}

function drawStones() {
  const N = path.stones.length;
  path.stones.forEach((st, i) => {
    const next = state === 'play' && i === david.i + 1;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(st.x, st.y + 8, st.r + 3, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = i === N - 1 ? '#9c8468' : '#8a7560';
    ctx.beginPath(); ctx.ellipse(st.x, st.y + 3, st.r, 11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a89078';
    ctx.beginPath(); ctx.ellipse(st.x - 3, st.y, st.r - 6, 7, 0, 0, TAU); ctx.fill();
    if (next) {
      ctx.strokeStyle = `rgba(255,233,168,${0.4 + 0.3 * Math.sin(t * 6)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(st.x, st.y + 3, st.r + 6, 15, 0, 0, TAU); ctx.stroke();
    }
    if (st.kind === 'pebble' && !st.quiet) {
      for (let k = 0; k < 7; k++) {
        ctx.fillStyle = k % 2 ? '#cfc2b0' : '#e6dccb';
        ctx.beginPath(); ctx.arc(st.x - 15 + (k * 37 % 30), st.y - 2 + (k * 13 % 7), 3.4, 0, TAU); ctx.fill();
      }
    }
  });
}

// Overhangs above the drip and bat stones
function drawHazardsAbove() {
  for (const st of path.stones) {
    if (st.kind !== 'drip' && st.kind !== 'bat') continue;
    const oy = st.y - 108;
    // a rock hanging down from the ledge above (or from the roof)
    const k = path.rows.findIndex((y) => Math.abs(y - st.y) < 2);
    let top = k > 0 ? path.rows[k - 1] + 118 : k === 0 ? oy - 220 : oy - 60;
    top = clamp(top, Math.max(-offY, oy - 220), oy - 40);
    ctx.fillStyle = '#2e2017';
    ctx.beginPath(); ctx.moveTo(st.x - 30, top); ctx.quadraticCurveTo(st.x - 34, oy - 20, st.x - 16, oy - 2); ctx.quadraticCurveTo(st.x, oy + 4, st.x + 16, oy - 2); ctx.quadraticCurveTo(st.x + 34, oy - 20, st.x + 30, top); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,170,0.08)';
    ctx.beginPath(); ctx.moveTo(st.x - 22, top); ctx.quadraticCurveTo(st.x - 26, oy - 22, st.x - 10, oy - 6); ctx.lineTo(st.x - 14, top); ctx.fill();
    ctx.fillStyle = '#2e2017';
    if (st.kind === 'drip') {
      ctx.beginPath(); ctx.moveTo(st.x - 9, oy - 4); ctx.lineTo(st.x, oy + 14); ctx.lineTo(st.x + 9, oy - 4); ctx.fill();
      const f = dripPhase(st);
      ctx.fillStyle = '#9fd4f0';
      if (f < 0.78) {
        const r = 2 + f / 0.78 * 5;
        ctx.beginPath(); ctx.arc(st.x, oy + 14 + r, r, 0, TAU); ctx.fill();
      } else if (f < 0.9) {
        const y = lerp(oy + 20, st.y - 6, (f - 0.78) / 0.12);
        ctx.beginPath(); ctx.moveTo(st.x, y - 10); ctx.quadraticCurveTo(st.x + 6, y, st.x, y + 4); ctx.quadraticCurveTo(st.x - 6, y, st.x, y - 10); ctx.fill();
      }
      // a small puddle
      ctx.fillStyle = 'rgba(140,200,235,0.45)';
      ctx.beginPath(); ctx.ellipse(st.x + 8, st.y + 4, 13, 4, 0, 0, TAU); ctx.fill();
    } else if (!st.batGone) {
      const wr = st.batT > 0.4 ? Math.sin(t * 30) * st.batT * 0.25 : 0;
      for (let k = -1; k <= 1; k++) drawBat(st.x + k * 16, oy + 10, 0.8, false, wr * (k === 0 ? 1 : -1), st.batT > 0.6);
    }
  }
}

function drawBat(x, y, s, flying, wobble = 0, eyesOpen = false, flap = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(wobble);
  ctx.fillStyle = '#4a3a5a';
  if (flying) {
    const w = Math.sin(flap) * 10;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14, -8 - w, -26, -2 - w); ctx.quadraticCurveTo(-16, 2, -10, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -8 - w, 26, -2 - w); ctx.quadraticCurveTo(16, 2, 10, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 7, 9, 0, 0, TAU); ctx.fill();
  } else {
    // hanging upside down, wings wrapped
    ctx.beginPath(); ctx.ellipse(0, 10, 8, 13, 0, 0, TAU); ctx.fill();
    ctx.fillRect(-1, -4, 2, 6);
  }
  // ears and face
  const fy = flying ? -4 : 18;
  ctx.beginPath(); ctx.moveTo(-6, fy + (flying ? -2 : 2)); ctx.lineTo(-7, fy + (flying ? -10 : 10)); ctx.lineTo(-2, fy); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, fy + (flying ? -2 : 2)); ctx.lineTo(7, fy + (flying ? -10 : 10)); ctx.lineTo(2, fy); ctx.fill();
  if (flying || eyesOpen) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, fy + (flying ? 2 : 4), 2.2, 0, TAU); ctx.arc(3, fy + (flying ? 2 : 4), 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-3, fy + (flying ? 2 : 4), 1, 0, TAU); ctx.arc(3, fy + (flying ? 2 : 4), 1, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-5, fy + 4); ctx.lineTo(-1, fy + 4); ctx.moveTo(1, fy + 4); ctx.lineTo(5, fy + 4); ctx.stroke();
  }
  ctx.restore();
}

function drawDavid() {
  const awake = saulAwake() || inLight(david.x, david.y);
  const pose = state === 'win' && david.holdCorner && winT > 4.3 ? 'hold' : david.back ? 'stand' : 'creep';
  // a ring under David: green when it's safe to move, red when he must freeze
  if (state === 'play' && !david.back) {
    ctx.strokeStyle = awake ? 'rgba(255,90,70,0.9)' : saul.phase === 'stir' ? 'rgba(255,190,60,0.9)' : 'rgba(120,230,120,0.85)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(david.x, david.y + 4, 30, 11, 0, 0, TAU); ctx.stroke();
  }
  drawFigure(DAVID, david.x, david.y, 1.1, {
    pose, face: david.face, blink: david.blink > 0, shiver: david.shiver > 0,
    mouth: david.back ? 'o' : state === 'win' ? 'grin' : (awake ? 'shh' : 'smile'),
    wide: awake || david.back, holdCorner: pose === 'hold',
    lx: state === 'play' ? (path.saul.x > david.x ? 0.8 : -0.8) : david.face * 0.6,
  });
  if (david.shiver > 0) {
    ctx.fillStyle = '#9fd4f0';
    ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('brrr!', david.x, david.y - 90);
  }
}

function drawSnip() {
  if (state !== 'play' || !snipReady() || david.hop) return;
  const h = hemEnds();
  // the cut zone on the corner of the robe
  const z0 = snipPoint(clamp(SNIP_ZONE - cfg.zone / 2, 0, 1));
  ctx.save();
  ctx.strokeStyle = 'rgba(120,240,140,0.95)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let u = Math.max(0, SNIP_ZONE - cfg.zone / 2), k = 0; u <= Math.min(1, SNIP_ZONE + cfg.zone / 2) + 1e-6; u += 0.01, k++) {
    const p = snipPoint(u); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(h.ax, h.ay); for (let u = 0; u <= 1; u += 0.05) { const p = snipPoint(u); ctx.lineTo(p.x, p.y); } ctx.stroke();
  ctx.setLineDash([]);
  // the moving sparkle (David's little knife)
  const p = snipPoint(snip.u);
  const inZone = Math.abs(snip.u - SNIP_ZONE) <= cfg.zone / 2;
  const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, 18);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, inZone ? '#b8ffb0' : '#ffe27a'); g.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, TAU); ctx.fill();
  ctx.font = '700 17px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,20,10,0.85)'; ctx.strokeText('SNIP here!', z0.x + 6, z0.y + 40);
  ctx.fillStyle = '#c8ffc0'; ctx.fillText('SNIP here!', z0.x + 6, z0.y + 40);
  ctx.restore();
}

// The big sign by Saul: is it safe to move?
function drawSaulSign() {
  if (state !== 'play') return;
  const s = path.saul;
  let txt, col;
  if (saul.phase === 'snore') { txt = saul.loud ? 'ZZZ! GO!' : 'Zzz… GO!'; col = '#3fae4a'; }
  else if (saul.phase === 'stir') { txt = 'Stirring… STOP!'; col = '#e8962a'; }
  else { txt = 'Awake! FREEZE!'; col = '#d9453a'; }
  ctx.save();
  ctx.font = '700 22px Fredoka, sans-serif';
  const w = ctx.measureText(txt).width + 30;
  const x = clamp(s.x - w / 2 + 20, 10, W - w - 10), y = s.y - 140;
  let sc = 1;
  if (saul.phase === 'stir') sc = 1 + Math.sin(t * 22) * 0.05;
  ctx.translate(x + w / 2, y + 20); ctx.scale(sc, sc);
  ctx.fillStyle = col; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  roundRect(-w / 2, -20, w, 40, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, 0, 1);
  ctx.restore();
}

function drawZees() {
  ctx.save();
  ctx.textAlign = 'center';
  for (const z of zees) {
    if (z.t < z.d) continue;
    const f = (z.t - z.d) / z.life;
    ctx.globalAlpha = 1 - f;
    ctx.font = `700 ${Math.round(22 * z.s)}px Fredoka, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,30,60,0.6)';
    ctx.strokeText('Z', z.x, z.y);
    ctx.fillStyle = '#e8e2ff'; ctx.fillText('Z', z.x, z.y);
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    if (p.kind === 'bat') { drawBat(p.x, p.y, 0.9, true, 0, true, p.flap); continue; }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 4);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const r = k % 2 ? p.size * 0.45 : p.size * 1.3; ctx.lineTo(Math.cos(k * Math.PI / 5) * r, Math.sin(k * Math.PI / 5) * r); }
      ctx.fill(); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawBubbles() {
  for (const b of bubbles) {
    ctx.save();
    ctx.globalAlpha = clamp(b.t / 0.3, 0, 1);
    const text = b.key ? '“' + bubbleText(b.key) + '”' : b.text;
    if (b.who === 'david') speech(david.x - 120, david.y - 100, text, david.x, david.y - 80, '#fffbe8', '#8a5a00', 17, Math.min(320, W - 60));
    else if (b.who === 'saul') speech(path.saul.x - 160, path.saul.y - 170, text, saul.headX || path.saul.x, (saul.headY || path.saul.y) - 26, '#fff2f0', '#a0302a', 20);
    else if (b.who === 'guard') speech(guard ? guard.x - 120 : W - 220, (guard ? guard.y : 600) - 130, text, guard ? guard.x : W - 100, (guard ? guard.y : 600) - 90, '#fff2f0', '#a0302a', 20);
    else if (b.who === 'outro') speech(b.x, b.y, text, b.ax, b.ay, '#fffbe8', '#8a5a00', 18, Math.min(360, W - 60));
    ctx.restore();
  }
}

// Darkness creeping in from the back of the cave
function drawGloom() {
  const L = -offX, R = W + offX, T = -offY;
  const g = ctx.createRadialGradient(W * 0.95, H * 0.85, 120, W * 0.95, H * 0.85, Math.max(W, H) * 1.15);
  g.addColorStop(0, 'rgba(10,6,4,0)'); g.addColorStop(1, 'rgba(10,6,4,0.55)');
  ctx.fillStyle = g; ctx.fillRect(L, T, R - L, H - T);
}

// ============================================================
//  The ending: Saul leaves, David calls from the cave mouth
// ============================================================
function updateWin(dt) {
  winT += dt;
  const s = path.saul;
  if (winT > 1.6 && !saul.stand) { saul.stand = { x: s.x + 20, y: s.y + 24, step: 0 }; sfx.hmm(false); }
  if (saul.stand) {
    if (winT > 2.2 && saul.stand.x < W - 45) { saul.stand.x = Math.min(W - 45, saul.stand.x + 110 * dt); saul.stand.step += dt * 7; }
  }
  // David hurries along to the mouth of the cave
  if (winT > 3 && !david.out) david.out = { fx: david.x, fy: david.y, t: 0 };
  if (david.out) {
    david.out.t = Math.min(1, david.out.t + dt / 1.1);
    const f = ease(david.out.t);
    david.x = lerp(david.out.fx, W - 180, f); david.y = lerp(david.out.fy, lastRowY() + 34, f) - Math.abs(Math.sin(f * Math.PI * 4)) * 10;
    david.face = 1;
  }
  if (winT > 4.3 && !david.called) {
    david.called = true;
    bubbles.push({ key: 'seeHand', who: 'outro', t: 3.4, x: W - 360, y: lastRowY() - 150, ax: W - 180, ay: lastRowY() - 60 });
    sparkleBurst(W - 96, lastRowY() - 40, 24);
  }
  if (winT > 7.6 && !david.answered) {
    david.answered = true;
    bubbles.push({ key: 'moreRighteous', who: 'outro', t: 2.6, x: W - 300, y: lastRowY() - 120, ax: W - 45, ay: lastRowY() - 50 });
    sfx.levelStart();
  }
  if (Math.random() < dt * 8) particles.push({ kind: 'star', x: rand(0, W), y: rand(TOPH - offY, H * 0.5), vx: 0, vy: -20, life: 1.2, t: 0, color: '#fff6d0', size: 3, grav: 0 });
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  const inGame = state === 'play' || state === 'win' || state === 'fail' || state === 'pause';
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(20,14,10,0.95)'); hg.addColorStop(1, 'rgba(20,14,10,0.55)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, viewW, TOPH);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9a8';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Cave of En Gedi' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (inGame) {
    // Saul's nap: when it runs out he gets up and leaves
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('NAP', 12, 49);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,233,168,0.22)';
    roundRect(44, 38, 144, 13, 6.5); ctx.fill();
    const f = clamp(napLeft / cfg.nap, 0, 1);
    const og = ctx.createLinearGradient(44, 0, 188, 0);
    og.addColorStop(0, '#8e7cc3'); og.addColorStop(1, '#c9b8ff');
    ctx.fillStyle = f < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : og;
    if (f > 0) { roundRect(44, 38, 144 * f, 13, 6.5); ctx.fill(); }
    // chances
    for (let k = 0; k < 3; k++) {
      const x = 212 + k * 24, y = 45;
      ctx.globalAlpha = k < chances ? 1 : 0.25;
      ctx.fillStyle = '#ff7b7b';
      ctx.beginPath(); ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 12, y - 2, x - 6, y - 11, x, y - 4); ctx.bezierCurveTo(x + 6, y - 11, x + 12, y - 2, x, y + 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // steps
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#ffe9a8';
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`Steps ${david.i}/${cfg.stones - 1}`, viewW - 12, 49);
    ctx.fillText(`Score ${totalScore}`, viewW - 12, 26);
  }
  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = TOPH + 34;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,12,8,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  if (path) {
    drawCave();
    drawStones();
    drawHazardsAbove();
    drawMen();
    drawSaul();
    if (saul.stand) drawFigure({ robe: '#7b4bb0', hair: '#3a2716', skin: '#d7a070', beard: true, crown: true, sash: '#f2c230' }, saul.stand.x, saul.stand.y, 1.3, { pose: winT > 2.2 && saul.stand.x < W - 46 ? 'walk' : 'stand', step: saul.stand.step, face: winT > 4.5 ? -1 : 1, lx: winT > 4.5 ? -1 : 1, mouth: winT > 7.6 ? 'o' : 'smile' });
    drawGuard();
    drawDavid();
    drawSnip();
    drawGloom();
    drawZees();
    drawParticles();
    drawSaulSign();
    drawBubbles();
  }
  if (flashT > 0) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (!path) return;
  if (state === 'play') {
    playT += dt;
    napLeft -= dt;
    if (napLeft <= 0) { napLeft = 0; fail('Saul’s nap is over: he got up and left the cave.'); return; }
    if (napLeft < cfg.nap * 0.25 && !told.nap) { told.nap = true; showMessage('Hurry! Saul will wake up soon.', 2.2); }
    updateSaul(dt);
    updateGuard(dt);
    updateDavid(dt);
    updateDrips();
    updateWhisper(dt);
    updateSnip(dt);
    const nx = path.stones[david.i + 1];
    if (nx && nx.kind === 'pebble' && !nx.quiet && !told.pebble) { told.pebble = true; showMessage('Crunchy pebbles! Step on the big SNORE', 2.6); }
  } else if (state === 'win' || state === 'done') {
    updateWin(dt);
    updateDavid(dt);
    updateDrips();
  } else if (state === 'fail') {
    failT += dt;
    updateDavid(dt);
  } else if (state === 'title') {
    updateSaul(dt);
  }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
titleScreen();
requestAnimationFrame(frame);
</script>
