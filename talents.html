function drawCart() {
  const slots = crateSlots();
  const last = slots[slots.length - 1];
  const rows = Math.round((last.y - slots[0].y) / 64) + 1;
  const x0 = slots[0].x - 8, x1 = Math.max(...slots.map((s) => s.x + s.w)) + 8;
  // cart bed with wheels
  ctx.fillStyle = '#8a5a2b';
  roundRect(x0, CART_Y + 8, x1 - x0, rows * 64 + 6, 10); ctx.fill();
  ctx.fillStyle = '#d9b77a';
  roundRect(x0 + 4, CART_Y + 12, x1 - x0 - 8, rows * 64 - 2, 8); ctx.fill();
  ctx.fillStyle = '#5a3a1c';
  for (const wx of [x0 + 22, x1 - 22]) {
    const wy = CART_Y + rows * 64 + 16;
    ctx.beginPath(); ctx.arc(wx, wy, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c98d56'; ctx.beginPath(); ctx.arc(wx, wy, 4, 0, TAU); ctx.fill(); ctx.fillStyle = '#5a3a1c';
  }
  // label
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 15px Fredoka, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`Your cart ${crates.length}/${cfg.cap}  ·  tap a crate to sell it`, x0 + 2, CART_Y + 3);
  // empty spaces
  ctx.strokeStyle = 'rgba(138,90,43,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
  for (let i = crates.length; i < slots.length; i++) { const s = slots[i]; roundRect(s.x + 2, s.y + 18, s.w - 4, s.h - 20, 6); ctx.stroke(); }
  ctx.setLineDash([]);
  // crates, each showing what it would earn if sold now
  crates.forEach((c, i) => {
    const s = slots[i];
    if (!s) return;
    const f = ease(clamp(c.fly, 0, 1));
    const x = lerp(c.fx - s.w / 2, s.x, f), y = lerp(c.fy - s.h, s.y, f) - Math.sin(f * Math.PI) * 60;
    drawCrate(c, x, y, s.w, s.h);
    if (f >= 1 && (state === 'play' || state === 'dayend')) {
      const st = stallOf(c.g);
      const pr = st.price - c.paid;
      const col = pr > 0 ? '#2b8a3e' : pr < 0 ? '#c92a2a' : '#8a7650';
      ctx.fillStyle = col;
      roundRect(s.x + s.w - 26, s.y - 2, 30, 18, 9); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 13px Fredoka, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pr > 0 ? `+${pr}` : pr < 0 ? `−${-pr}` : '0', s.x + s.w - 11, s.y + 7);
    }
  });
  // the player's servant
  const hero = SERVANTS[cfg.servant];
  drawPerson(hero, 48, 886, 1.1, heroMoodNow(), { look: [0.6, -0.3] });
  ctx.fillStyle = '#a8741a';
  ctx.font = '700 14px Fredoka, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const ly = 886 - 96 * 1.1 - 4 - Math.sin(t * 3) * 2;
  ctx.fillText('You', 48, ly - 8);
  ctx.beginPath(); ctx.moveTo(42, ly - 3); ctx.lineTo(54, ly - 3); ctx.lineTo(48, ly + 4); ctx.fill();
}

function drawMarket() {
  drawMarketSky();

function drawCourt() {
  const state = effState();
  drawCourtBG();
  const P = courtPos();
  const you = cfg.servant;
  // master: walks in when he returns
  let mx = P.master.x, walk = 0;
  if (state === 'return' && retT < 2.4) { mx = lerp(-60, P.master.x, ease(retT / 2.4)); walk = 1; }
  const giving = state === 'intro';
  const decided = state === 'win' || state === 'fail';
  const shaking = state === 'win' && retT > 6.4 && retT < 8.6;
  let mMood = 'watch';
  if (state === 'win' && !shaking) mMood = 'joy';
  let mLook = { x: P.serv[you].x, y: 740 };
  if (giving) mLook = { x: P.serv[1].x, y: 760 };
  if (shaking) mLook = { x: P.serv[2].x, y: 750 };
  const bobY = walk ? Math.abs(Math.sin(t * 8)) * 3 : 0;
  const offerArm = giving ? [[11, -32, 26, -34]] : null;
  drawPerson(MASTER, mx, P.master.y - bobY, 1.45, mMood, {
    trim: true, still: true, lookAt: mLook,
    headDX: shaking ? Math.sin(t * 9) * 2.5 : 0,
    arms: offerArm ? [[-11, -32, -15, -12], ...offerArm] : walk ? [[-11, -32, -14, -12], [11, -32, 20, -20]] : null,
    props: walk ? () => {   // travelling staff
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(22, -60); ctx.lineTo(22, 0); ctx.stroke();
    } : null,
  });

  // servants with their bags
  const baseY = 872;
  for (let i = 0; i < 3; i++) {
    const sp = P.serv[i];
    let mood = 'watch';
    if (giving) mood = i === 2 ? 'worried' : 'wow';
    else if (state === 'return') mood = i === 2 ? 'worried' : 'watch';
    else if (state === 'win') mood = i === 2 ? 'sad' : 'joy';
    else if (state === 'fail') mood = i === 2 ? 'sad' : i === you ? 'worried' : 'watch';
    drawPerson(SERVANTS[i], sp.x, sp.y, 1.3, mood, { lookAt: { x: mx, y: 640 }, still: mood === 'joy' && i !== you });
    // bags
    if (giving) {
      const n = bagsLanded(i);
      for (let k = 0; k < n; k++) { const q = pileSpot(sp.x, baseY, k); drawBag(q.x, q.y, 0.7); }
    } else if (state === 'return' || decided) {
      if (i === 2) {
        drawBag(sp.x - 6, baseY, 0.7, 'dusty');
        ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sp.x + 10, baseY); ctx.lineTo(sp.x + 34, baseY - 26); ctx.stroke();
      } else {
        const given = TALENTS[i];
        const n = i === you ? Math.min(15, Math.floor(retCount / SILVER_PER_TALENT)) : given * 2;
        for (let k = 0; k < n; k++) { const q = pileSpot(sp.x, baseY, k); drawBag(q.x, q.y, 0.7, k < given ? 'silver' : 'gold'); }
      }
    }
    if (i === you) {
      ctx.fillStyle = '#a8741a';
      ctx.font = '700 16px Fredoka, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      const ly = sp.y - 128 - Math.sin(t * 3) * 2;
      ctx.fillText('You', sp.x, ly);
      ctx.beginPath(); ctx.moveTo(sp.x - 6, ly + 5); ctx.lineTo(sp.x + 6, ly + 5); ctx.lineTo(sp.x, ly + 12); ctx.fill();
    }
  }
  // bags flying from the master's hand
  if (giving && introPhase === 'give') {
    for (const b of GIVE) {
      const f = (introT - hillDur - b.delay) / 0.55;
      if (f <= 0 || f >= 1) continue;
      const sp = P.serv[b.to];
      const q = pileSpot(sp.x, baseY, b.k);
      const x = lerp(mx + 38, q.x, f), y = lerp(P.master.y - 50, q.y, f) - Math.sin(f * Math.PI) * 90;
      drawBag(x, y, 0.7);
    }
  }
  // the count of silver in front of your servant
  if ((state === 'return' && retT > 2.4) || decided) {
    const sp = P.serv[you];
    const shown = decided ? silver : Math.round(retCount);
    ctx.save();
    ctx.font = '700 22px Fredoka, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = `${shown} / ${cfg.goal}`;
    const w = ctx.measureText(txt).width + 38;
    const bx = clamp(sp.x - w / 2, 8, W - 8 - w);
    ctx.fillStyle = shown >= cfg.goal ? '#fff3b0' : 'rgba(255,252,240,0.95)';
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 2.5;
    const by = sp.y - 190;
    roundRect(bx, by, w, 34, 17); ctx.fill(); ctx.stroke();
    drawCoin(bx + 18, by + 17, 8);
    ctx.fillStyle = shown >= cfg.goal ? '#2b8a3e' : '#5a4210';
    ctx.fillText(txt, bx + w / 2 + 10, by + 18);
    ctx.restore();
  }
}

// Bags handed out during the intro: five, two and one
const GIVE = [];
[5, 2, 1].forEach((n, to) => { for (let k = 0; k < n; k++) GIVE.push({ to, k, delay: 0.4 + GIVE.length * 0.3 }); });
function bagsLanded(i) {
  if (introPhase !== 'give') return 0;
  return GIVE.filter((b) => b.to === i && introT - hillDur - b.delay >= 0.55).length;
}

// ---------- Jesus telling the story on the hillside ----------
function hillY(x) {
  const d = (x - W / 2) / (W * 0.25);
  return H - 110 - 60 * Math.exp(-d * d);
}
const JESUS = { x: 0, y: 0, vx: 0, vy: 0, face: 'calm', noCloud: true, glow: false, thrust: { up: false, left: false, right: false } };

function crowdSlots() {
  const slots = [];
  const back = [1, 4, 6, 9];
  const front = [0, 2, 8, 3, 10, 5, 7];
  back.forEach((idx, k) => {
    const x = W * [0.07, 0.25, 0.75, 0.93][k];
    slots.push({ d: CROWD[idx], x, y: hillY(x) - 18, s: 0.85, row: 0 });
  });
  front.forEach((idx, k) => {
    const x = k < 3 ? lerp(34, W / 2 - 80, k / 2) : k === 3 ? W / 2 : lerp(W / 2 + 80, W - 34, (k - 4) / 2);
    const kid = CROWD[idx].kid;
    slots.push({ d: CROWD[idx], x, y: H - 22 + (k === 3 ? 6 : 0), s: kid ? 0.8 : 1.05, row: 1 });
  });
  return slots;
}

function drawHill() {
  const state = effState();
  skyGradient(-offY, H - 150, [[0, '#8fcaf0'], [0.7, '#cfeaf8'], [1, '#fff3cf']]);
  for (const c of bgClouds) drawCloud(-offX - 150 + c.f * (viewW + 300), c.y + 60, c.w, c.w * 0.3, 'rgba(255,255,255,0.9)', 'rgba(230,238,248,0.7)');
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Sea of Galilee far away and hills
  ctx.fillStyle = '#7fb8dc'; ctx.fillRect(x0, H - 250, x1 - x0, 40);
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, H - 215 + Math.sin(x / 90) * 14 + Math.sin(x / 37) * 5);
  ctx.lineTo(x1, H); ctx.fill();
  const gyAt = (x) => (x < 0 || x > W ? H - 110 : hillY(x));
  ctx.fillStyle = '#86b95d';
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, gyAt(x));
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6f9e4a'; ctx.fillRect(x0, H - 50, x1 - x0, 60);
  // flowers
  for (let i = 0; i < 12; i++) {
    const x = ((i * 97) % 100) / 100 * W, y = gyAt(x) + 14 + (i % 3) * 8;
    ctx.fillStyle = ['#fff', '#ffd43b', '#ff8fab'][i % 3];
    ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
  }

  // rock where Jesus stands
  const jx = W / 2, top = hillY(jx) - 24;
  ctx.fillStyle = '#b8ab94'; ctx.strokeStyle = '#8c806a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(jx, top + 14, 50, 20, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#cfc3ad'; ctx.beginPath(); ctx.ellipse(jx - 8, top + 8, 30, 8, 0, 0, TAU); ctx.fill();

  JESUS.x = jx; JESUS.y = top + 4;
  JESUS.face = state === 'win' ? 'joy' : 'calm';
  JESUS.glow = state === 'win';
  JESUS.thrust.left = !!(bubble && bubble.who === 'jesus' && Math.sin(t * 2.4) > -0.2);
  JESUS.thrust.right = false;
  const slots = crowdSlots();
  const look = { x: jx, y: JESUS.y - 50 };
  for (const s of slots) if (s.row === 0) drawPerson(s.d, s.x, s.y, s.s, s.d.mood, { dim: true, lookAt: look });
  ctx.save(); ctx.translate(JESUS.x, JESUS.y); ctx.scale(1.5, 1.5); ctx.translate(-JESUS.x, -JESUS.y);
  drawJesus(JESUS);
  ctx.restore();
  for (const s of slots) if (s.row === 1) drawPerson(s.d, s.x, s.y, s.s, s.d.mood, { lookAt: look });
}

// Story narration on a parchment scroll near the top
function drawBanner() {
  if (banner.t <= 0 || !banner.text) return;
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1);
  ctx.font = 'italic 600 19px Fredoka, sans-serif';
  const maxW = Math.min(W - 60, 600);
  const lines = wrapLines(`“${banner.text}”`, maxW);
  const lh = 24;
  const w = Math.min(W - 24, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 40);
  const h = lines.length * lh + 20;
  const bx = W / 2 - w / 2, by = 112;
  ctx.fillStyle = '#fbf0d2'; ctx.strokeStyle = '#c9a36b'; ctx.lineWidth = 2.5;
  roundRect(bx, by, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8d3a0';
  roundRect(bx - 6, by - 4, 12, h + 8, 6); ctx.fill(); roundRect(bx + w - 6, by - 4, 12, h + 8, 6); ctx.fill();
  ctx.fillStyle = '#5a4210'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 10 + lh / 2 + i * lh));
  // point at the digging servant
  if (banner.digger && scene === 'market') {
    const px = W - 62, py = 222;
    ctx.strokeStyle = '#a8741a'; ctx.fillStyle = '#a8741a'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    const sx = Math.min(bx + w - 30, px), sy = by + h + 4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py - 6); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(px, py - 4, 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawHint() {
  if (state !== 'play' && state !== 'dayend') return;
  const h = state === 'dayend' ? { text: 'Crates are kept safe overnight.', hot: false } : hintText();
  ctx.save();
  let size = 18;
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  while (ctx.measureText(h.text).width > W - 56 && size > 13) { size--; ctx.font = `700 ${size}px Fredoka, sans-serif`; }
  const w = Math.min(W - 16, ctx.measureText(h.text).width + 36);
  const bx = W / 2 - w / 2, by = STALL_TOP - 36;
  const glowA = h.hot ? 0.5 + 0.5 * Math.sin(t * 8) : 0;
  ctx.fillStyle = h.hot ? `rgba(255,${226 - glowA * 30},${122 - glowA * 60},0.97)` : 'rgba(255,250,235,0.94)';
  ctx.strokeStyle = h.hot ? '#d9961c' : '#c9a36b'; ctx.lineWidth = 2;
  if (h.hot) { ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 10 + glowA * 10; }
  roundRect(bx, by, w, 30, 15); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  ctx.fillStyle = '#5a4210'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(h.text, W / 2, by + 16);
  ctx.restore();
}

let dayStartWorth = 0;
function drawDayEnd() {
  const f = ease(clamp(dayEndT / 1.8, 0, 1));
  const shown = Math.round(lerp(dayStartWorth, worth(), f));
  const n = cfg.goal / SILVER_PER_TALENT;
  const size = Math.min(34, (W - 80) / n);
  const w = Math.max(n * size + 40, 300), h = 132;
  const bx = W / 2 - w / 2, by = 420;
  ctx.save();
  ctx.globalAlpha = clamp(dayEndT / 0.3, 0, 1);
  ctx.fillStyle = 'rgba(255,248,228,0.97)'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 18); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a4210'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 20px Fredoka, sans-serif';
  ctx.fillText(`Day ${day} done — the master's silver`, W / 2, by + 24);
  for (let i = 0; i < n; i++) {
    const x = W / 2 + (i - (n - 1) / 2) * size;
    const full = shown >= (i + 1) * SILVER_PER_TALENT;
    ctx.globalAlpha = full ? 1 : 0.28;
    drawBag(x, by + 84, size / 32, i < cfg.start / SILVER_PER_TALENT ? 'silver' : 'gold');
  }
  ctx.globalAlpha = 1;
  ctx.font = '700 22px Fredoka, sans-serif';
  ctx.fillStyle = shown >= cfg.goal ? '#2b8a3e' : '#5a4210';
  ctx.fillText(`${shown} / ${cfg.goal}${shown >= cfg.goal ? '  Doubled!' : ''}`, W / 2, by + 112);
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  let size = 26;
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  while (ctx.measureText(message.text).width > W - 30 && size > 16) { size--; ctx.font = `700 ${size}px Fredoka, sans-serif`; }
  const y = scene === 'market' ? 250 : scene === 'court' ? 300 : H * 0.36;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function drawFloats() {
  for (const f of floats) {
    const a = clamp(1.4 - f.t, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `700 ${f.size}px Fredoka, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = f.y - f.t * 50;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineJoin = 'round';
    ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, y);
    ctx.restore();
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Talents' : `Level ${level} · ${cfg.name}`, 12, 26);
  const trading = ['play', 'dayend', 'return', 'win', 'fail'].includes(state) || (state === 'pause' && pausedFrom !== 'intro');
  if (trading && scene !== 'hill') {
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.shadowBlur = 0;
    drawCoin(20, 44, 7);
    ctx.fillStyle = '#5a4210';
    ctx.shadowBlur = 4;
    ctx.fillText(`${silver} silver  ·  goal ${cfg.goal}`, 32, 50);
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  if (trading && scene === 'market') {
    // Goal: bags of the master's money (silver = given, gold = earned)
    const n = cfg.goal / SILVER_PER_TALENT;
    const wv = worth();
    const x0 = 132, avail = Math.min(viewW - 12, offX + W) - x0 - 76;
    const size = clamp(avail / n, 14, 30);
    for (let i = 0; i < n; i++) {
      const x = x0 + i * size + size / 2;
      const full = wv >= (i + 1) * SILVER_PER_TALENT;
      const part = !full && wv > i * SILVER_PER_TALENT;
      ctx.globalAlpha = full ? 1 : part ? 0.55 : 0.22;
      drawBag(x, 96, size / 30, i < cfg.start / SILVER_PER_TALENT ? 'silver' : 'gold');
    }
    ctx.globalAlpha = 1;
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillStyle = wv >= cfg.goal ? '#2b8a3e' : '#5a4210';
    ctx.textAlign = 'left';
    ctx.shadowBlur = 4;
    ctx.fillText(`${wv}/${cfg.goal}`, x0 + n * size + 6, 90);

    // Right: day and best trade
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#5a4210';
    ctx.font = '700 16px Fredoka, sans-serif';
    ctx.fillText(`Day ${day} of ${cfg.days}`, rx, 24);
    ctx.font = '600 13px Fredoka, sans-serif';
    ctx.fillText(`Best trade +${bestTrade}`, rx, 44);
  }
  ctx.restore();
}

// ============================================================
//  Rendering
// ============================================================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-3, 3) * shakeT * 2; sy = rand(-3, 3) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (scene === 'market') drawMarket();
  else if (scene === 'court') drawCourt();
  else drawHill();

  drawParticles();
  drawFloats();
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  if (bubble && bubble.t > 0) {
    if (bubble.who === 'jesus' && scene === 'hill') drawSpeech(bubble.text, JESUS.x, JESUS.y - 118);
    if (bubble.who === 'master' && scene === 'court') drawSpeech(bubble.text, courtPos().master.x + 10, 800 - 150);
  }
  drawBanner();
  drawMessage();
  if (state === 'intro' || (state === 'return' && !retDecided)) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t * 3);
    ctx.fillStyle = '#5a4210'; ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Tap to continue', W / 2, H - 8);
    ctx.restore();
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  for (const c of bgClouds) { c.f += (c.speed * dt) / (W + 300); if (c.f > 1) c.f -= 1; }
  updateParticles(dt);
  updatePeople(dt);
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1.4) floats.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  for (const c of crates) { c.fly = Math.min(1, c.fly + dt * 3); c.pop += dt; }
  message.t -= dt; banner.t -= dt; afterMsg.t -= dt; heroMood.t -= dt;
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }

  if (state === 'intro') {
    introT += dt;
    if (introPhase === 'hill' && introT >= hillDur) toGive();
    else if (introPhase === 'give') {
      const landed = GIVE.filter((b) => introT - hillDur - b.delay >= 0.55).length;
      const before = GIVE.filter((b) => introT - dt - hillDur - b.delay >= 0.55).length;
      if (landed > before) sfx.tick(landed);
      if (introT >= hillDur + giveDur) beginDay();
    }
  } else if (state === 'play') {
    if (dayT === 0) dayStartWorth = worth();
    mt += dt; dayT += dt;
    updateEvents(dt);
    updatePrices(dt);
    if (caravan) { caravan.x -= 70 * dt; if (caravan.x < -260) caravan = null; }
    // dirt flying from the one-talent servant's hole
    if (Math.random() < dt * 3) spawn(W - 62 + 16, 292, rand(10, 50), rand(-90, -50), 0.6, '#8a5a2b', rand(2, 3.5), 260);
    if (dayT >= cfg.dayLen) endDay();
  } else if (state === 'dayend') {
    dayEndT += dt;
    if (dayEndT >= 3.2) afterDayEnd();
  } else if (state === 'return') {
    retT += dt;
    if (retT > 2.4) {
      const before = Math.floor(retCount / SILVER_PER_TALENT);
      retCount = lerp(0, silver, ease(clamp((retT - 2.4) / 2.4, 0, 1)));
      const now = Math.floor(retCount / SILVER_PER_TALENT);
      if (now > before) sfx.tick(now);
    }
    if (retT >= 4.9 && !retDecided) decide();
  } else if (state === 'win' || state === 'fail') {
    retT += dt;
    if (state === 'win' && scene === 'court' && Math.random() < dt * 10) {
      spawn(rand(0, W), rand(380, 500), rand(-20, 20), rand(40, 90), 2, ['#ffe27a', '#ffd1e8', '#9fe0a0'][Math.floor(rand(0, 3))], 3.5);
    }
    if (state === 'win' && scene === 'hill' && Math.random() < dt * 8) {
      spawn(JESUS.x + rand(-60, 60), JESUS.y - rand(0, 110), 0, -20, 1, '#fff6d0', 3);
    }
  }
  shakeT = Math.max(0, shakeT - dt);
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
