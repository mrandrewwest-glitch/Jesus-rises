function startLevel(retry = false) {
  resetLevel();
  hideOverlay();
  sfx.levelStart();
  if (retry || attempted > 0) { beginPlay(); return; }
  attempted++;
  // Jesus tells the story first
  state = 'intro';
  syncAmbience();
  introT = 0; introStep = 0; introFade = 0;
  say('woman1', level === 1 ? 3.6 : 2.8);
  showMessage(level === 1 ? 'Jesus told them another story…' : `Level ${level}: ${cfg.name}`, 2.2);
}

const introDur = () => (level === 1 ? [3.6, 4.4] : [2.8, 3.4]);
function say(key, dur) { bubble = { key, t: dur, who: 'jesus' }; }

function advanceIntro() {
  if (introFade > 0) return;
  if (introStep === 0) { introStep = 1; introT = 0; say('woman2', introDur()[1]); }
  else { introFade = 0.001; if (bubble) bubble.t = Math.min(bubble.t, 0.4); }
}

function updateIntro(dt) {
  introT += dt;
  if (introFade > 0) {
    introFade += dt;
    if (introFade > 0.7) beginPlay();
    return;
  }
  if (introT > introDur()[introStep]) advanceIntro();
}

function beginPlay() {
  state = 'play';
  syncAmbience();
  bubble = null;
  introFade = 0;
  attempted = Math.max(attempted, 1);
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  setTimeout(() => { if (state === 'play' && !lamp.lit) showMessage('Tap the lamp to light it', 2.6); }, 2300);
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Rejoice with me!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('friends')}
       <p style="text-align:center">Jesus said heaven is just as happy when one person who was lost comes home to God.</p>
       ${verseHTML('joy')}
       <p class="score">Oil left: <b>${s.oilBonus}</b><br>Careful searching (${wrong} wrong): <b>${s.careBonus}</b><br>Extras found: <b>${s.extraBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next house', () => { level++; attempted = 0; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Oh… no', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The lamp ran out of oil before the coin was found. Look for the <b>glints</b>, listen for the <b>shimmer</b>, and don't forget the oil jar!</p>
       ${verseHTML('sweep', '…')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    sfx.shimmer(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Camera
// ============================================================
function clampCam(cx, cy) {
  const w = world, vh = viewH - TOPH;
  const x = w.w <= viewW ? (w.w - viewW) / 2 : clamp(cx, -10, w.w - viewW + 10);
  const y = w.h <= vh ? (w.h - vh) / 2 - TOPH : clamp(cy, -TOPH - 10, w.h - viewH + 10);
  return { x, y };
}
function snapCamera() {
  const c = clampCam(lamp.x - viewW / 2, lamp.y - TOPH - (viewH - TOPH) / 2);
  cam.x = c.x; cam.y = c.y;
}
function updateCamera(dt) {
  // keep the lamp inside the middle of the screen
  let tx = cam.x, ty = cam.y;
  const ax = viewW * 0.3, bx = viewW * 0.7;
  const ay = TOPH + (viewH - TOPH) * 0.3, by = TOPH + (viewH - TOPH) * 0.72;
  if (lamp.x - cam.x < ax) tx = lamp.x - ax;
  if (lamp.x - cam.x > bx) tx = lamp.x - bx;
  if (lamp.y - cam.y < ay) ty = lamp.y - ay;
  if (lamp.y - cam.y > by) ty = lamp.y - by;
  const c = clampCam(tx, ty);
  const k = 1 - Math.pow(0.004, dt);
  const mx = clamp((c.x - cam.x) * k, -520 * dt, 520 * dt), my = clamp((c.y - cam.y) * k, -520 * dt, 520 * dt);
  cam.x += mx; cam.y += my;
}

// ============================================================
//  Updating the search
// ============================================================
function updateLamp(dt) {
  if (!lamp.lit) return;
  lamp.litT += dt;
  // keyboard carries the lamp directly
  let kx = 0, ky = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) ky -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) ky += 1;
  const px = lamp.x, py = lamp.y;
  if (kx || ky) {
    const n = Math.hypot(kx, ky);
    lamp.tx = lamp.x + kx / n * LAMP_SPEED * dt;
    lamp.ty = lamp.y + ky / n * LAMP_SPEED * dt;
    lamp.x = lamp.tx; lamp.y = lamp.ty;
  } else {
    // the light follows the finger or the mouse (its screen spot moves with the camera)
    if (pointer.active) { lamp.tx = pointer.vx + cam.x; lamp.ty = pointer.vy + cam.y; }
    const k = 1 - Math.pow(0.0005, dt);
    lamp.x += (lamp.tx - lamp.x) * k;
    lamp.y += (lamp.ty - lamp.y) * k;
  }
  lamp.x = clamp(lamp.x, 0, world.w); lamp.y = clamp(lamp.y, 0, world.h);
  lamp.tx = clamp(lamp.tx, 0, world.w); lamp.ty = clamp(lamp.ty, 0, world.h);
  // Space held while moving sweeps along the way
  if (keys.has('Space') && (kx || ky)) sweepAlong(px, py, lamp.x, lamp.y);

  // The oil burns down
  oil -= dt / cfg.oilTime;
  if (oil < 0.3 && !told.lowOil) {
    told.lowOil = true;
    showMessage(refillUsed ? 'The oil is running low!' : 'Low oil! Tap the oil jar to refill', 2.6);
  }
  if (oil <= 0) { oil = 0; fail(); return; }

  // The shimmer of the lost coin grows louder as the lamp comes near
  const c = coinItem();
  const d = Math.hypot(c.x - lamp.x, c.y - lamp.y);
  shimmerNear = clamp(1 - d / (cfg.radius * 3), 0, 1);
  sfx.shimmer(shimmerNear * shimmerNear);
  if (shimmerNear > 0.7 && !told.shimmer && level <= 2) { told.shimmer = true; showMessage('Listen… a shimmer! It’s close.', 2); }
}

// ============================================================
//  Input
// ============================================================
const keys = new Set();
const pointer = { active: false, vx: 0, vy: 0, mouse: false };
let down = null;          // the press in progress

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'intro' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat) { advanceIntro(); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play') {
    if (e.code === 'KeyO' && !e.repeat) { refillOil(); return; }
    if (e.code === 'Space' && !e.repeat) { tapAt(lamp.x, lamp.y, 46); }
    if (e.code.startsWith('Arrow') || ['KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) pointer.active = false;
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function oilJarButton() { return { x: 214, y: 50, r: 15 }; }

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'play') {
    const o = oilJarButton();
    if (Math.hypot(p.vx - o.x, p.vy - o.y) < o.r + 8) { refillOil(); return; }
  }
  if (state === 'intro') { advanceIntro(); return; }
  if (state === 'win' && winT > 2) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const mouse = e.pointerType === 'mouse';
  const wx = p.vx + cam.x, wy = p.vy + cam.y;
  // Touch drags that start on dust sweep it; other touch drags just carry the light.
  const onCover = world.props.some((q) => q.amt > 0 && (q.kind === 'rug'
    ? Math.abs(wx - q.x) < q.rw / 2 && Math.abs(wy - q.y) < q.rh / 2
    : Math.hypot(wx - q.x, wy - q.y) < q.r + 12));
  down = { sx: p.vx, sy: p.vy, wx, wy, moved: false, broom: mouse || onCover, time: performance.now(), id: e.pointerId };
  pointer.active = true; pointer.vx = p.vx; pointer.vy = p.vy; pointer.mouse = mouse;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', (e) => {
  const p = toView(e);
  const mouse = e.pointerType === 'mouse';
  if (mouse || down) { pointer.active = true; pointer.vx = p.vx; pointer.vy = p.vy; pointer.mouse = mouse; }
  if (!down || state !== 'play') return;
  const wx = p.vx + cam.x, wy = p.vy + cam.y;
  if (!down.moved && Math.hypot(p.vx - down.sx, p.vy - down.sy) > 12) down.moved = true;
  if (down.moved && down.broom && lamp.lit) sweepAlong(down.wx, down.wy, wx, wy);
  down.wx = wx; down.wy = wy;
});

function endPress(e) {
  sfx.init();
  if (!down) return;
  const d = down;
  down = null;
  if (!pointer.mouse) pointer.active = false;
  if (state !== 'play' || d.moved) return;
  const p = toView(e);
  tapAt(p.vx + cam.x, p.vy + cam.y);
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', () => { down = null; if (!pointer.mouse) pointer.active = false; });
canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !down) pointer.active = false; });

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, thrustGain: null, shimGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
      // The lost coin's shimmer: two high bells with a tremble, silent until the lamp comes near
      this.shimGain = this.ctx.createGain();
      this.shimGain.gain.value = 0;
      const trem = this.ctx.createGain(); trem.gain.value = 0.6;
      const lfo = this.ctx.createOscillator(), lfoDepth = this.ctx.createGain();
      lfo.frequency.value = 7; lfoDepth.gain.value = 0.4;
      lfo.connect(lfoDepth); lfoDepth.connect(trem.gain);
      [[2093, 1], [3136, 0.55], [4186, 0.25]].forEach(([f, a]) => {
        const o = this.ctx.createOscillator(), og = this.ctx.createGain();
        o.frequency.value = f; og.gain.value = a;
        o.connect(og); og.connect(trem); o.start();
      });
      trem.connect(this.shimGain); this.shimGain.connect(this.master);
      lfo.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // ---- Extra sounds for the house search ----
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  swish(v = 1) { this.noiseBurst(2400, 0.22, 0.22 * v, 0.9, 900); },
  clonk() { this.tone(330, 0.12, 'triangle', 0.25); this.tone(250, 0.16, 'triangle', 0.18, 0.07); },
  thud() { this.tone(110, 0.25, 'sine', 0.45, 0, 60); this.noiseBurst(300, 0.25, 0.3, 0.7, 150, 'lowpass'); },
  clink() { this.tone(1250, 0.14, 'triangle', 0.18); this.tone(900, 0.2, 'triangle', 0.12, 0.08); },
  meow() { this.tone(620, 0.22, 'triangle', 0.14, 0, 900); this.tone(900, 0.35, 'triangle', 0.12, 0.2, 480); },
  scuttle() { for (let i = 0; i < 9; i++) setTimeout(() => this.noiseBurst(5000, 0.04, 0.12, 2), i * 55); },
  lightUp() { this.noiseBurst(600, 0.35, 0.3, 0.6, 2000); this.tone(660, 0.4, 'sine', 0.12, 0.05, 990); },
  glug() { for (let i = 0; i < 3; i++) this.tone(320 - i * 40, 0.14, 'sine', 0.25, i * 0.13, 200 - i * 20); },
  snuff() { this.noiseBurst(1200, 0.6, 0.25, 0.6, 300); },
  extra() { if (this.ctx) Music.tap(0.9); },
  found() {
    if (!this.ctx) return;
    [1568, 2093, 2637, 3136, 4186].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.13, i * 0.07));
  },
  ping() { [2637, 3136].forEach((f, i) => this.tone(f, 0.6, 'sine', 0.12, i * 0.09)); },
  shimmer(level) {
    if (!this.shimGain) return;
    this.shimGain.gain.setTargetAtTime(level * 0.06, this.ctx.currentTime, 0.12);
  },
};

// Ambient bed (music.js): only during active play; off behind cards, when paused, muted or hidden
function syncAmbience() {
  Music.ambience(!sfx.muted && !document.hidden && ['intro', 'play'].includes(state));
}
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pageshow', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

// ============================================================
//  Rendering: the story scene (Jesus and the listening crowd)
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#e6eef6') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

function storyLayout() {
  const k = clamp(W / 640, 1, 1.4);      // bigger figures on wide screens
  const jx = Math.max(80, W * 0.2);
  const gy = H - 150;
  const slots = [];
  const x0 = jx + 95 * k, x1 = W - 34 * k;
  const nBack = clamp(Math.floor((x1 - x0) / (62 * k)), 3, 8), nFront = clamp(Math.floor((x1 - x0 + 40) / (70 * k)), 3, 8);
  for (let i = 0; i < nBack; i++) slots.push({ d: PEOPLE[(i * 2 + 1) % PEOPLE.length], x: lerp(x0 + 20, x1, nBack === 1 ? 0.5 : i / (nBack - 1)), y: gy - 26, s: 1.05 * k, row: 0 });
  for (let i = 0; i < nFront; i++) slots.push({ d: PEOPLE[(i * 2) % PEOPLE.length], x: lerp(x0 - 10, x1 - 16, nFront === 1 ? 0.5 : i / (nFront - 1)), y: gy + 40, s: 1.25 * k, row: 1 });
  return { jx, gy, slots, k };
}

function drawStory() {
  const L = storyLayout();
  // warm afternoon sky
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#fff3cf'); g.addColorStop(0.35, '#ffe0a8'); g.addColorStop(0.62, '#bfe3f5'); g.addColorStop(1, '#9fd1ee');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // sun
  const sg = ctx.createRadialGradient(W * 0.78, 190, 10, W * 0.78, 190, 140);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * 0.78, 190, 140, 0, TAU); ctx.fill();
  // soft clouds drifting by
  for (let k = 0; k < 5; k++) {
    const cw = 90 + hash(k, 5) * 90;
    const cx = ((hash(k, 4) * (viewW + 300) + t * (6 + k * 2)) % (viewW + 300)) - offX - 150;
    const cy = lerp(-offY + 70, H - 420, hash(k, 6));
    drawCloud(cx, cy, cw, cw * 0.32);
  }
  // distant hills and a village of little houses
  ctx.fillStyle = '#b9d49a';
  ctx.beginPath(); ctx.moveTo(-offX, H);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, H - 330 + Math.sin(x / 110) * 26 + Math.sin(x / 41) * 8);
  ctx.lineTo(W + offX, H); ctx.fill();
  for (let k = 0; k < 6; k++) {
    const hx = W * 0.42 + k * 44 - (k > 2 ? 20 : 0), hy = H - 350 + Math.sin(hx / 110) * 26 + (k % 2) * 12;
    ctx.fillStyle = k % 2 ? '#e8d3aa' : '#dcc497';
    ctx.fillRect(hx, hy, 36, 28);
    ctx.fillStyle = '#b89a6a'; ctx.fillRect(hx - 2, hy - 4, 40, 5);
    ctx.fillStyle = k === 3 ? '#ffcf5a' : '#6b5238';
    ctx.fillRect(hx + 13, hy + 12, 9, 16);
  }
  // near hill where the crowd sits
  ctx.fillStyle = '#8fc06a';
  ctx.beginPath(); ctx.moveTo(-offX, H + 10);
  for (let x = -offX; x <= W + offX + 10; x += 10) ctx.lineTo(x, L.gy - 60 + Math.sin(x / 160) * 10);
  ctx.lineTo(W + offX, H + 10); ctx.fill();
  ctx.fillStyle = '#7aae55';
  ctx.fillRect(-offX, H - 60, viewW, 70);
  // flowers
  for (let k = 0; k < 18; k++) {
    const fx = hash(k, 1) * W, fy = L.gy - 30 + hash(k, 2) * 170;
    ctx.fillStyle = ['#fff', '#ffd166', '#f28fb1'][k % 3];
    ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
  }
  // the rock Jesus stands on
  ctx.fillStyle = '#a89a86';
  ctx.beginPath(); ctx.ellipse(L.jx, L.gy + 6, 50 * L.k, 20 * L.k, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c2b5a0';
  ctx.beginPath(); ctx.ellipse(L.jx - 6, L.gy - 2, 40 * L.k, 12 * L.k, 0, 0, TAU); ctx.fill();

  const speaking = state === 'intro' && bubble && bubble.t > 0.3;
  const js = 1.55 * L.k;
  const jHead = { x: L.jx, y: L.gy - 4 - 55 * js };
  for (const s of L.slots) if (s.row === 0) drawPerson(s.d, s.x, s.y, s.s, jHead.x, jHead.y);
  drawJesus({ x: L.jx, y: L.gy - 4, s: js, face: 'calm', speaking });
  for (const s of L.slots) if (s.row === 1) drawPerson(s.d, s.x, s.y, s.s, jHead.x, jHead.y);

  if (state === 'intro' || (state === 'pause' && pausedFrom === 'intro')) drawStoryBubble(L);
  if (state === 'intro' && introT > 0.8 && introFade <= 0) {
    ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(90,66,16,${0.5 + 0.3 * Math.sin(t * 4)})`;
    ctx.fillText(isTouch() ? 'Tap to continue' : 'Click or press Space to continue', W / 2, H - 24);
  }
}

function drawStoryBubble(L) {
  if (!bubble) return;
  const text = '“' + bubbleText(bubble.key) + '”';
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '700 19px Fredoka, sans-serif';
  const maxW = Math.min(W - 64, 520);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 30, h = lines.length * 24 + 20;
  const ax = L.jx + 14, ay = L.gy - 104 * L.k;       // just above His head
  const bx = clamp(L.jx - 40, 14, W - w - 14), by = L.gy - 110 - 60 * L.k - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  const tx = clamp(ax, bx + 20, bx + w - 40);
  ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay - 8); ctx.lineTo(tx + 22, by + h - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(ax, ay - 8); ctx.lineTo(tx + 22, by + h); ctx.stroke();
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 15, by + 10 + 12 + i * 24));
  ctx.restore();
}

function drawHouse() {
  const w = world;
  ctx.fillStyle = '#140e18';
  ctx.fillRect(cam.x - 20, cam.y - 20, viewW + 40, viewH + 40);
  drawFloor();
  drawWalls();

  const shown = (it) => (!it.found && (!hidden(it) || (it.cover && it.cover.kind === 'rug'))) || it.run;
  // items under mats, then the mats, then everything else on the floor
  for (const it of w.items) if (it.cover && it.cover.kind === 'rug' && shown(it)) drawItem(it);
  for (const p of w.props) if (p.kind === 'rug') drawRug(p);
  for (const it of w.items) if (!(it.cover && it.cover.kind === 'rug') && shown(it) && !it.run) drawItem(it);
  for (const p of w.props) { if (p.kind === 'dust') drawDust(p); else if (p.kind === 'straw') drawStraw(p); }
  const tall = w.props.filter((p) => ['jar', 'basket', 'chest', 'cat', 'well', 'wood', 'trough', 'fig'].includes(p.kind));
  tall.sort((a, b) => (a.y + a.oy || a.y) - (b.y + b.oy || b.y));
  for (const p of tall) drawProp(p);
  for (const it of w.items) if (it.run) drawItem(it);
  drawBroomFx();
  drawParticles(false);
}

function drawDarkness() {
  let dark = 0.93;
  if (state === 'win') dark = 0.93 * (1 - clamp((winT - 0.5) / 1.2, 0, 1));
  if (dark <= 0.01) return;
  const k = scale / 2;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, darkC.width, darkC.height);
  dctx.fillStyle = `rgba(10,6,22,${dark})`;
  dctx.fillRect(0, 0, darkC.width, darkC.height);
  dctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
  dctx.globalCompositeOperation = 'destination-out';
  // moonlight in the courtyard, and a little through the window
  if (world.court) {
    dctx.fillStyle = 'rgba(0,0,0,0.2)';
    dctx.fillRect(world.court.x, world.court.y, world.court.w, world.court.h);
  }
  const wx = world.win.x;
  const mg = dctx.createRadialGradient(wx, BACK + 40, 5, wx, BACK + 40, 90);
  mg.addColorStop(0, 'rgba(0,0,0,0.22)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = mg; dctx.beginPath(); dctx.arc(wx, BACK + 40, 90, 0, TAU); dctx.fill();
  dctx.fillStyle = 'rgba(0,0,0,0.5)';
  dctx.fillRect(wx - 24, 36, 48, 56);
  // the unlit lamp shows faintly so you can find it
  if (!lamp.lit) {
    const ls = world.lampstand;
    const pg = dctx.createRadialGradient(ls.x, ls.y - 70, 5, ls.x, ls.y - 70, 110);
    pg.addColorStop(0, `rgba(0,0,0,${0.55 + 0.15 * Math.sin(t * 3)})`); pg.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = pg; dctx.beginPath(); dctx.arc(ls.x, ls.y - 70, 110, 0, TAU); dctx.fill();
  }
  const R = lampR();
  if (R > 1) {
    const lg = dctx.createRadialGradient(lamp.x, lamp.y, R * 0.1, lamp.x, lamp.y, R);
    lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(0.55, 'rgba(0,0,0,0.94)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = lg; dctx.beginPath(); dctx.arc(lamp.x, lamp.y, R, 0, TAU); dctx.fill();
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(darkC, 0, 0, darkC.width, darkC.height, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  // warm lamplight tint
  if (R > 1) {
    const wg = ctx.createRadialGradient(lamp.x, lamp.y, 4, lamp.x, lamp.y, R);
    wg.addColorStop(0, 'rgba(255,190,90,0.2)'); wg.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = wg; ctx.beginPath(); ctx.arc(lamp.x, lamp.y, R, 0, TAU); ctx.fill();
  }
}

function drawOverDark() {
  drawGlints();
  // things just picked up float away
  for (const it of world.items) {
    if (it.found && it.pickT > 0 && !it.run) {
      ctx.save();
      ctx.globalAlpha = clamp(it.pickT / 0.4, 0, 1);
      ctx.translate(0, -(0.9 - it.pickT) * 50);
      drawItem(it);
      ctx.restore();
    }
  }
  // the found coin, spinning in the light before it flies home
  const c = coinItem();
  if (state === 'win' && winT < 0.9 && c) {
    ctx.save();
    ctx.translate(0, -winT * 30);
    ctx.translate(c.x, c.y); ctx.scale(2, 2); ctx.translate(-c.x, -c.y);
    drawItem(c);
    ctx.restore();
    drawGlint(c.x + 6, c.y - winT * 30 - 8, 14 + Math.sin(t * 10) * 4, 1, false);
  }
  // unlit lamp: show where to tap
  if (!lamp.lit && state === 'play') {
    const ls = world.lampstand;
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    drawLampstand(ls.x, ls.y, true);
    ctx.strokeStyle = `rgba(255,215,110,${0.5 + pulse * 0.5})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ls.x + 4, ls.y - 114, 26 + pulse * 6, 0, TAU); ctx.stroke();
    ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'left';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,20,10,0.8)'; ctx.lineJoin = 'round';
    ctx.strokeText('Tap the lamp', ls.x + 40, ls.y - 108);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText('Tap the lamp', ls.x + 40, ls.y - 108);
  }
  // the lamp she carries
  if (lamp.lit && state !== 'win') {
    const flame = state === 'fail' ? Math.max(0, 1 - failT / 0.8) : oil < 0.2 ? 0.6 + oil * 2 : 1;
    drawOilLamp(lamp.x, lamp.y + 4, 1.1, flame);
  }
}

// Celebration: she calls her friends and neighbours in (drawn on the screen, over the lit house)
function drawCelebration() {
  if (winT < 1.5) return;
  const f = ease(clamp((winT - 1.5) / 1.3, 0, 1));
  const baseY = Math.min(viewH - 70, TOPH + (viewH - TOPH) * 0.82);
  const cx = viewW / 2;
  ctx.fillStyle = `rgba(255,236,190,${0.35 * f})`;
  ctx.fillRect(0, TOPH, viewW, viewH - TOPH);
  const n = viewW < 700 ? 4 : 6;
  const gap = Math.min(92, (viewW - 60) / (n + 1));
  const headY = baseY - 70;
  // friends pour in from both sides
  for (let k = 0; k < n; k++) {
    const side = k % 2 ? 1 : -1, rank = Math.floor(k / 2) + 1;
    const tx = cx + side * rank * gap, sx = side < 0 ? -80 : viewW + 80;
    const d = PEOPLE[(k * 3 + 1) % PEOPLE.length];
    d.mood = f > 0.6 ? 'joy' : 'wow';
    drawPerson(d, lerp(sx, tx, clamp(f * 1.2 - rank * 0.1, 0, 1)), baseY - (rank % 2) * 10, 1.35, cx, headY);
  }
  WOMAN.mood = 'joy';
  drawPerson(WOMAN, cx, baseY + 6, 1.55, cx, headY + 200);
  if (winT > 2) {
    if (Math.random() < 0.3) spawn(rand(0, viewW), TOPH - 10, rand(-30, 30), rand(40, 90), 3, pick(['#ffe27a', '#f28fb1', '#fff6d0', '#9fd1ee']), rand(3, 5), 10, true, pick(['heart', 'star', 'dot']));
    drawWomanBubble(cx, baseY - 120);
  }
}

function drawWomanBubble(cx, ty) {
  const text = '“' + bubbleText('rejoice') + '”';
  ctx.save();
  ctx.globalAlpha = clamp((winT - 2) / 0.3, 0, 1);
  ctx.font = '700 19px Fredoka, sans-serif';
  const maxW = Math.min(viewW - 60, 440);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 30, h = lines.length * 24 + 20;
  const bx = clamp(cx - w / 2, 12, viewW - w - 12), by = ty - 40 - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 12, by + h - 1.5); ctx.lineTo(cx, ty - 8); ctx.lineTo(cx + 12, by + h - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 12, by + h); ctx.lineTo(cx, ty - 8); ctx.lineTo(cx + 12, by + h); ctx.stroke();
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 15, by + 22 + i * 24));
  ctx.restore();
}

function portraitPos() { return { x: viewW - 50, y: 52, s: 1.6 }; }
function gapScreenPos() {
  const P = portraitPos();
  const [gx, gy] = coinBandPos(GAP, -53);
  return { x: P.x + gx * P.s, y: P.y + 4 + (gy + 53) * P.s };
}

function drawPortrait() {
  const P = portraitPos();
  ctx.save();
  ctx.fillStyle = 'rgba(255,248,230,0.92)';
  ctx.beginPath(); ctx.arc(P.x, P.y, 40, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(P.x, P.y, 38.5, 0, TAU); ctx.clip();
  // her head and shoulders, scaled up: head centre at the middle of the frame
  ctx.translate(P.x, P.y + 4 + 53 * P.s);
  ctx.scale(P.s, P.s);
  const d = WOMAN;
  ctx.fillStyle = d.robe;
  ctx.beginPath(); ctx.moveTo(-22, 0); ctx.quadraticCurveTo(-20, -34, 0, -38); ctx.quadraticCurveTo(20, -34, 22, 0); ctx.fill();
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, -53, 16, 0, TAU); ctx.fill();
  drawScarf(d, -53);
  let lx = 0, ly = 0.3;
  if (state === 'play' && lamp.lit) { lx = clamp((lamp.x - cam.x - viewW / 2) / viewW, -0.8, 0.8); ly = 0.5; }
  drawFace(d, d.mood, -53, lx, ly);
  ctx.restore();
  // coins counter under the portrait
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 13px Fredoka, sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.fillText(`${coinBack ? 10 : 9} / 10 coins`, P.x, P.y + 56);
  if (state === 'play' || state === 'fail' || state === 'pause') {
    ctx.font = '600 12px Fredoka, sans-serif';

    ctx.textAlign = 'right';
    ctx.fillText(`wrong ${wrong}${ex}`, viewW - 10, P.y + 72);
  }
  ctx.restore();
}

function drawHUD() {
  const inHouse = state === 'play' || state === 'win' || state === 'fail' || (state === 'pause' && pausedFrom === 'play');
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  if (inHouse) {
    const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
    hg.addColorStop(0, 'rgba(20,14,24,0.95)'); hg.addColorStop(1, 'rgba(20,14,24,0.6)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, viewW, TOPH);
  }
  const ink = inHouse ? '#ffe9a8' : '#5a4210';
  ctx.shadowColor = inHouse ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Lost Coin' : state === 'intro' || pausedFrom === 'intro' && state === 'pause' ? 'Jesus tells a story' : `Level ${level} · ${cfg.name}`, 12, 26);

  if (inHouse) {
    // Oil meter and the oil jar
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('OIL', 12, 49);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,233,168,0.22)';
    roundRect(44, 38, 144, 13, 6.5); ctx.fill();
    const og = ctx.createLinearGradient(44, 0, 188, 0);
    og.addColorStop(0, '#f2a93b'); og.addColorStop(1, '#ffe27a');
    ctx.fillStyle = oil < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : og;
    if (oil > 0) { roundRect(44, 38, 144 * oil, 13, 6.5); ctx.fill(); }
    const o = oilJarButton();
    const pulse = !refillUsed && oil < 0.35 && lamp.lit ? 0.5 + 0.5 * Math.sin(t * 6) : 0;
    ctx.fillStyle = refillUsed ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, TAU); ctx.fill();
    if (pulse) { ctx.strokeStyle = `rgba(255,210,90,${pulse})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 4 + pulse * 3, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = refillUsed ? 0.4 : 1;
    ctx.fillStyle = '#a65a33';
    ctx.beginPath(); ctx.ellipse(o.x, o.y + 3, 7, 8, 0, 0, TAU); ctx.fill();
    ctx.fillRect(o.x - 3.5, o.y - 9, 7, 6);
    ctx.fillStyle = '#e8b53a';
    ctx.beginPath(); ctx.moveTo(o.x, o.y - 2); ctx.quadraticCurveTo(o.x + 4, o.y + 4, o.x, o.y + 6); ctx.quadraticCurveTo(o.x - 4, o.y + 4, o.x, o.y - 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (refillUsed) {
      ctx.strokeStyle = 'rgba(255,233,168,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.x - 9, o.y + 9); ctx.lineTo(o.x + 9, o.y - 9); ctx.stroke();
    }
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();

  if (inHouse) drawPortrait();

  // the found coin flying home to her head-dress
  if (coinFly && state === 'win' && winT >= 0.9 && !coinBack) {
    const f = ease(clamp((winT - 0.9) / 1.0, 0, 1));
    const g = gapScreenPos();
    const x = lerp(coinFly.x, g.x, f), y = lerp(coinFly.y, g.y, f) - Math.sin(f * Math.PI) * 120;
    const sc = lerp(2, 0.45, f);
    ctx.save();
    ctx.translate(x, y); ctx.scale(sc, sc);
    drawItem({ kind: 'coin', x: 0, y: 0, spin: t * 12 });
    ctx.restore();
    drawGlint(x + 4, y - 4, 10, 1, false);
    if (f >= 1) {
      coinBack = true;
      sparkleBurst(g.x, g.y, 30, true);
      sfx.ping();
    }
  }
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const inHouse = state !== 'title' && state !== 'intro' && !(state === 'pause' && pausedFrom === 'intro');
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = inHouse ? viewH - 34 - (lines.length - 1) * 28 : 150 + Math.max(0, offY) * 0.4;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = inHouse ? 'rgba(20,12,24,0.9)' : 'rgba(255,255,255,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = inHouse ? '#ffe9a8' : '#7a5200';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }

  const story = state === 'title' || state === 'intro' || (state === 'pause' && pausedFrom === 'intro');
  if (story) {
    ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);
    drawStory();
    if (introFade > 0) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = `rgba(20,14,24,${clamp(introFade / 0.6, 0, 1)})`;
      ctx.fillRect(0, 0, viewW, viewH);
    }
  } else if (world) {
    ctx.setTransform(scale, 0, 0, scale, (-cam.x + sx) * scale, (-cam.y + sy) * scale);
    drawHouse();
    drawDarkness();
    drawOverDark();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (state === 'win') drawCelebration();
    drawParticles(true);
    if (state === 'play' && playT < 0.6) {
      ctx.fillStyle = `rgba(20,14,24,${1 - playT / 0.6})`;
      ctx.fillRect(0, 0, viewW, viewH);
    }
  }

  if (flashT > 0) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  for (let i = broomFx.length - 1; i >= 0; i--) { broomFx[i].t -= dt; if (broomFx[i].t <= 0) broomFx.splice(i, 1); }
  sweepSoundT -= dt;
  if (state === 'intro') {
    updateIntro(dt);
  } else if (state === 'play') {
    playT += dt;
    updateLamp(dt);
    if (state === 'play') { updateProps(dt); updateItems(dt); updateCamera(dt); }
  } else if (state === 'win') {
    winT += dt;
    updateProps(dt); updateItems(dt);
    if (Math.random() < dt * 10) spawn(rand(0, viewW), rand(TOPH, viewH * 0.6), 0, -20, 1.2, '#fff6d0', 3, 0, true, 'star');
  } else if (state === 'fail') {
    failT += dt;
    updateItems(dt);
  }
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0 && state !== 'intro') bubble = null; }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
