<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1f2e">
<title>The Lost Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2a1f2e;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Lost Coin</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'pipe', ambience: 'none', percussion: false };

// Scripture shown in this game, in every version the menu offers.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Title card
  tenPieces: { ref: 'Luke 15:8', KJV: 'Either what woman having ten pieces of silver, if she lose one piece, doth not light a candle, and sweep the house, and seek diligently till she find it?', NKJV: 'Or what woman, having ten silver coins, if she loses one coin, does not light a lamp, sweep the house, and search carefully until she finds it?', NIV: 'Or suppose a woman has ten silver coins and loses one. Doesn’t she light a lamp, sweep the house and search carefully until she finds it?', NLT: 'Or suppose a woman has ten silver coins and loses one. Won’t she light a lamp and sweep the entire house and search carefully until she finds it?' },
  // Jesus telling the story (speech bubbles)
  woman1: { ref: 'Luke 15:8', KJV: 'What woman having ten pieces of silver, if she lose one piece,', NKJV: 'What woman, having ten silver coins, if she loses one coin,', NIV: 'Suppose a woman has ten silver coins and loses one.', NLT: 'Suppose a woman has ten silver coins and loses one.' },
  woman2: { ref: 'Luke 15:8', KJV: '...doth not light a candle, and sweep the house, and seek diligently till she find it?', NKJV: '...does not light a lamp, sweep the house, and search carefully until she finds it?', NIV: 'Doesn’t she light a lamp, sweep the house and search carefully until she finds it?', NLT: 'Won’t she light a lamp and sweep the entire house and search carefully until she finds it?' },
  // Fail card
  sweep: { ref: 'Luke 15:8', KJV: 'light a candle, and sweep the house, and seek diligently till she find it', NKJV: 'light a lamp, sweep the house, and search carefully until she finds it', NIV: 'light a lamp, sweep the house and search carefully until she finds it', NLT: 'light a lamp and sweep the entire house and search carefully until she finds it' },
  // Win card and the woman's speech bubble
  friends: { ref: 'Luke 15:9', KJV: 'And when she hath found it, she calleth her friends and her neighbours together, saying, Rejoice with me; for I have found the piece which I had lost.', NKJV: 'And when she has found it, she calls her friends and neighbors together, saying, ‘Rejoice with me, for I have found the piece which I lost!’', NIV: 'And when she finds it, she calls her friends and neighbors together and says, ‘Rejoice with me; I have found my lost coin.’', NLT: 'And when she finds it, she will call in her friends and neighbors and say, ‘Rejoice with me because I have found my lost coin.’' },
  rejoice: { ref: 'Luke 15:9', KJV: 'Rejoice with me; for I have found the piece which I had lost.', NKJV: 'Rejoice with me, for I have found the piece which I lost!', NIV: 'Rejoice with me; I have found my lost coin.', NLT: 'Rejoice with me because I have found my lost coin.' },
  joy: { ref: 'Luke 15:10', KJV: 'Likewise, I say unto you, there is joy in the presence of the angels of God over one sinner that repenteth.', NKJV: 'Likewise, I say to you, there is joy in the presence of the angels of God over one sinner who repents.', NIV: 'In the same way, I tell you, there is rejoicing in the presence of the angels of God over one sinner who repents.', NLT: 'In the same way, there is joy in the presence of God’s angels when even one sinner repents.' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
// Bubble text: a leading "..." or trailing comma becomes a "…" so a quote split over two bubbles reads on
function bubbleText(key) {
  return Bible.verse(VERSES[key]).text.replace(/^\.\.\.\s*/, '…').replace(/,$/, '…');
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  darkC.width = Math.ceil(canvas.width / 2);
  darkC.height = Math.ceil(canvas.height / 2);
}
// The darkness is painted at half resolution on its own canvas, then laid over the room
const darkC = document.createElement('canvas');
const dctx = darkC.getContext('2d');
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

// Tiny repeatable noise so each floor stone keeps its colour
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;         // HUD strip at the top of the screen; the house sits below it
const BACK = 132;         // height of the back wall of the house (seen face-on)
const CBACK = 74;         // the courtyard's low back wall
const WALL = 18;          // thickness of the side walls
const TAP_R = 40;         // how close a tap must be to pick something up
const BROOM_R = 32;       // reach of the broom when sweeping by dragging
const LAMP_SPEED = 360;   // keyboard lamp speed (px/s)
const WRONG_COST = 200;   // points lost from the care bonus per wrong guess
const EXTRA_PTS = 300;    // bonus for each extra lost thing found

const LEVEL_NAMES = [
  'One Dim Room',
  'Out to the Courtyard',
  'Under the Grain Chest',
  'A Very Messy House',
  'Every Nook and Cranny',
  'The Busiest House in Town',
];

const DECOY_SETS = [
  ['button'],
  ['button', 'sherd', 'beetle'],
  ['button', 'sherd', 'beetle', 'sherd'],
  ['button', 'sherd', 'beetle', 'sherd', 'button'],
  ['button', 'sherd', 'beetle', 'sherd', 'button', 'beetle'],
];
const EXTRA_SETS = [[], ['ring'], ['ring', 'toy'], ['ring', 'toy', 'sandal']];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `The Lost Coin ${n}`,
    court: n >= 2,
    grow: n === 2 ? 1.45 : n === 3 ? 1.6 : 1.8,
    growY: n >= 4 ? 1.2 : 1,
    radius: n === 1 ? 205 : Math.max(125, 185 - (n - 2) * 15),
    oilTime: n === 1 ? 120 : Math.max(90, 112 - (n - 2) * 6),  // seconds a full lamp burns
    rugs: n === 1 ? 1 : n < 4 ? 2 : 3,
    jars: n === 1 ? 2 : Math.min(3 + (n - 2), 6),
    baskets: n === 1 ? 1 : n < 4 ? 2 : 3,
    chest: n >= 3,
    dust: n === 1 ? 4 : Math.min(5 + n, 12),
    straw: n === 1 ? 2 : Math.min(3 + n, 9),
    decoys: DECOY_SETS[Math.min(n, DECOY_SETS.length) - 1],
    extras: EXTRA_SETS[Math.min(n, EXTRA_SETS.length) - 1],
    chestP: n >= 3 ? 0.55 : 0,     // chance the coin has rolled under the heavy chest
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | win | fail | pause
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('lostCoinBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let world = null;
let lamp = { x: 0, y: 0, tx: 0, ty: 0, lit: false, litT: 0 };
let oil = 1, refillUsed = false;
let wrong = 0, extrasFound = 0;
let particles = [];
let broomFx = [];
let message = { text: '', t: 0 };
let bubble = null;          // speech bubble { text, t, who }
let flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let playT = 0;
let winT = 0, failT = 0;
let coinFly = null;         // the found coin flying back to her headdress
let coinBack = false;       // the gap in the headdress is filled
let womanMood = 'worried', moodT = 0;
let shimmerNear = 0;        // 0..1, how close the lamp is to the coin
let told = {};              // one-time hints already shown this level
let introT = 0, introStep = 0, introFade = 0;
let attempted = 0;          // attempts at the current level (retries skip the story)
const cam = { x: 0, y: 0 };

// ============================================================
//  Building the house
// ============================================================
function buildWorld() {
  // Level 1 is a small room even on a big screen; later houses grow from it
  const baseW = Math.min(W, 980);
  const baseH = Math.max(600, Math.min(viewH - TOPH - 12, 940));
  const w = { props: [], items: [], areas: [], split: null };
  if (cfg.court) {
    if (baseH > baseW * 1.25) {
      // Tall screens: the courtyard lies below the room
      w.w = baseW; w.h = Math.round(baseH * cfg.grow * 0.95);
      w.roomW = w.w; w.roomH = Math.round(w.h * 0.56);
      w.split = 'h';
      w.court = { x: 0, y: w.roomH, w: w.w, h: w.h - w.roomH };
      w.door = { x: w.w / 2, y: w.roomH, len: 120 };
    } else {
      // Wide screens: the courtyard lies beside the room
      w.w = Math.round(Math.max(baseW * cfg.grow, baseW + 380)); w.h = Math.round(baseH * cfg.growY);
      w.roomW = Math.round(w.w * 0.58); w.roomH = w.h;
      w.split = 'v';
      w.court = { x: w.roomW, y: 0, w: w.w - w.roomW, h: w.h };
      w.door = { x: w.roomW, y: BACK + (w.h - BACK) * 0.55, len: 120 };
    }
  } else {
    w.w = baseW; w.h = baseH; w.roomW = w.w; w.roomH = w.h; w.court = null;
  }
  const m = 16;
  w.room = { x0: WALL + m, y0: BACK + m, x1: w.roomW - WALL - m, y1: w.roomH - WALL - m };
  w.areas.push(w.room);
  if (w.split === 'v') w.courtArea = { x0: w.roomW + WALL + m, y0: CBACK + m, x1: w.w - WALL - m, y1: w.h - WALL - m };
  if (w.split === 'h') w.courtArea = { x0: WALL + m, y0: w.roomH + WALL + m, x1: w.w - WALL - m, y1: w.h - WALL - m };
  if (w.courtArea) w.areas.push(w.courtArea);

  w.lampstand = { x: WALL + 64, y: BACK + 6 };
  w.loom = { x: w.roomW - WALL - 84 };
  w.win = { x: (w.lampstand.x + w.loom.x) / 2 };
  w.frontDoor = { x: w.roomW * 0.68 };
  world = w;

  // Keep the space in front of the lampstand clear
  addProp({ kind: 'clear', x: w.lampstand.x + 10, y: BACK + 40, r: 44 });

  // Courtyard furniture (it only gets in the way)
  if (w.courtArea) {
    const A = w.courtArea;
    addProp({ kind: 'fig', x: A.x1 - 50, y: A.y0 + 56, r: 62 });
    const well = place(A, 46); if (well) addProp({ kind: 'well', ...well, r: 46 });
    const wood = place(A, 32); if (wood) addProp({ kind: 'wood', ...wood, r: 32 });
    const bed = place(A, 36); if (bed) addProp({ kind: 'trough', ...bed, r: 36 });
  }
  // Rugs and mats
  for (let i = 0; i < cfg.rugs; i++) {
    const p = place(i === 0 ? w.room : pick(w.areas), 64);
    if (p) addProp({ kind: 'rug', ...p, r: 64, rw: 132, rh: 82, amt: 1, col: pick(['#b5503f', '#3c7f86', '#b08a2e', '#7a4fa0']) });
  }
  // The cat, fast asleep
  const cp = place(w.room, 34);
  if (cp) addProp({ kind: 'cat', ...cp, r: 34, h: 30, ox: 0, oy: 0, moved: false, awake: 0, walk: null, face: 1, zT: 0 });
  // The heavy grain chest
  if (cfg.chest) {
    const p = place(w.room, 44);
    if (p) addProp({ kind: 'chest', ...p, r: 44, h: 58, ox: 0, oy: 0, moved: false, push: 0, wob: 0 });
  }
  for (let i = 0; i < cfg.jars; i++) {
    const p = place(i % 2 ? pick(w.areas) : w.room, 26);
    if (p) addProp({ kind: 'jar', ...p, r: 26, h: 56, ox: 0, oy: 0, moved: false, wob: 0, col: pick(['#b8683a', '#a65a33', '#c47a45', '#9c6b43']) });
  }
  for (let i = 0; i < cfg.baskets; i++) {
    const p = place(pick(w.areas), 30);
    if (p) addProp({ kind: 'basket', ...p, r: 30, h: 38, ox: 0, oy: 0, moved: false, wob: 0 });
  }
  // Dust gathers in the corners; straw blows in from the courtyard
  const corners = [];
  for (const A of w.areas) corners.push([A.x0 + 26, A.y0 + 20], [A.x1 - 26, A.y0 + 20], [A.x0 + 26, A.y1 - 20], [A.x1 - 26, A.y1 - 20]);
  corners.sort(() => Math.random() - 0.5);
  for (let i = 0; i < cfg.dust; i++) {
    let p = null;
    if (i < corners.length) p = place({ x0: corners[i][0] - 24, y0: corners[i][1] - 18, x1: corners[i][0] + 24, y1: corners[i][1] + 18 }, 34, 20);
    if (!p) p = place(pick(w.areas), 34);
    if (p) addProp({ kind: 'dust', ...p, r: 34, amt: 1, blobs: makeBlobs() });
  }
  for (let i = 0; i < cfg.straw; i++) {
    const p = place(w.courtArea && i % 2 ? w.courtArea : pick(w.areas), 36);
    if (p) addProp({ kind: 'straw', ...p, r: 36, amt: 1, bits: makeStraw() });
  }

  hideThings();
}

function addProp(p) { world.props.push(p); return p; }

function place(A, r, tries = 90) {
  for (let k = 0; k < tries; k++) {
    const x = rand(A.x0 + r * 0.6, A.x1 - r * 0.6), y = rand(A.y0 + r * 0.5, A.y1 - r * 0.4);
    if (x < A.x0 || x > A.x1 || y < A.y0 || y > A.y1) continue;
    let ok = true;
    for (const p of world.props) if (Math.hypot(p.x - x, p.y - y) < p.r + r + 6) { ok = false; break; }
    if (ok) return { x, y };
  }
  return null;
}

function makeBlobs() {
  return Array.from({ length: 6 }, (_, i) => ({ dx: rand(-20, 20), dy: rand(-10, 10), rx: rand(12, 20), ry: rand(7, 11), c: i % 2 ? '#a8977d' : '#8e7e66' }));
}
function makeStraw() {
  return Array.from({ length: 30 }, () => ({ dx: rand(-26, 26), dy: rand(-15, 15), a: rand(0, Math.PI), l: rand(10, 22), c: pick(['#e0c068', '#c9a146', '#f0d888']) }));
}

// Hide the coin, the decoys and the extras under covers, pots, the cat or the chest
function hideThings() {
  const spots = world.props.filter((p) => ['dust', 'straw', 'rug', 'jar', 'basket', 'cat'].includes(p.kind));
  spots.sort(() => Math.random() - 0.5);
  const chest = world.props.find((p) => p.kind === 'chest');
  const take = (filter) => {
    const i = spots.findIndex(filter);
    return i >= 0 ? spots.splice(i, 1)[0] : null;
  };

  let coinSpot = null;
  if (chest && Math.random() < cfg.chestP) coinSpot = chest;
  else if (level === 1) coinSpot = take((s) => ['dust', 'jar', 'rug', 'cat'].includes(s.kind));
  else coinSpot = take(() => true);
  addItem('coin', coinSpot);

  for (const k of cfg.decoys) {
    const s = Math.random() < 0.8 ? take((s) => k !== 'beetle' || s.kind === 'straw' || s.kind === 'dust') : null;
    addItem(k, s);
  }
  for (const k of cfg.extras) addItem(k, Math.random() < 0.8 ? take(() => true) : null);
}

function addItem(kind, spot) {
  const it = { kind, x: 0, y: 0, cover: null, mover: null, found: false, pickT: 0, run: null, phase: rand(0, TAU) };
  if (!spot) {
    const p = place(pick(world.areas), 16) || { x: world.room.x0 + 40, y: world.room.y1 - 30 };
    it.x = p.x; it.y = p.y;
  } else if (spot.kind === 'rug') {
    it.x = spot.x + rand(-40, 40); it.y = spot.y + rand(-20, 20); it.cover = spot;
  } else if (spot.kind === 'dust' || spot.kind === 'straw') {
    it.x = spot.x + rand(-8, 8); it.y = spot.y + rand(-5, 5); it.cover = spot;
  } else {
    it.x = spot.x + rand(-4, 4); it.y = spot.y - 3; it.mover = spot;
  }
  spot && (spot.holds = it);
  world.items.push(it);
  return it;
}

function hidden(it) {
  if (it.cover && it.cover.amt > 0.35) return true;
  if (it.mover && !it.mover.moved) return true;
  return false;
}

function coinItem() { return world && world.items.find((i) => i.kind === 'coin'); }

// How brightly the lamp lights a point (0..1)
function lampR() {
  if (!lamp.lit) return 0;
  let r = cfg.radius * (0.92 + 0.08 * Math.min(1, lamp.litT * 2));
  if (oil < 0.2) r *= lerp(0.7, 1, oil / 0.2);
  if (state === 'fail') r *= Math.max(0, 1 - failT / 0.9);
  return r * (1 + Math.sin(t * 13) * 0.012 + Math.sin(t * 7.3) * 0.015);
}
function lightAt(x, y) {
  if (state === 'win') return 1;
  const R = lampR();
  if (R <= 0) return 0;
  const d = Math.hypot(x - lamp.x, y - lamp.y);
  return d < R * 0.55 ? 1 : clamp((R - d) / (R * 0.45), 0, 1);
}

// ============================================================
//  People
// ============================================================
// The listening crowd in the story scene, and the friends and neighbours who rejoice
const PEOPLE = [
  { robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { robe: '#c46b8c', hair: '#3a2716', beard: false, skin: '#d7a070', scarf: '#e8dcc0' },
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', kid: true },
  { robe: '#7a4fa0', hair: '#3a2716', beard: false, skin: '#c58a55', scarf: '#f0c9a0' },
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { robe: '#3c8f86', hair: '#1f140c', beard: false, skin: '#b87a48', scarf: '#d8c7a0' },
  { robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { robe: '#e07a5f', hair: '#5c3a1c', beard: false, skin: '#dca678', kid: true },
  { robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c' },
  { robe: '#4b7f4b', hair: '#2d1b0f', beard: false, skin: '#bf8150', scarf: '#e8dcc0' },
  { robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
].map((d, i) => ({ ...d, i, mood: 'watch', switchT: 0, delay: rand(0.05, 0.5), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU) }));

// The woman herself (her head-dress holds her ten silver coins)
const WOMAN = { robe: '#2f7f9a', hair: '#3a2716', beard: false, skin: '#d9a066', scarf: '#c0392b', coins: true, i: 1, mood: 'worried', blinkT: 2, blink: 0, phase: 0 };

function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'intro') return introStep === 0 ? 'worried' : 'wow';
  if (state === 'win') return 'joy';
  return 'watch';
}

function updatePeople(dt) {
  const target = crowdMood();
  for (const d of PEOPLE) {
    let want = target;
    if (want === 'worried' && d.i % 3 === 1) want = 'shock';
    if (want === 'wow' && d.i % 4 === 2) want = 'watch';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
  WOMAN.blinkT -= dt;
  if (WOMAN.blinkT <= 0) { WOMAN.blink = 0.13; WOMAN.blinkT = rand(1.5, 4); }
  if (WOMAN.blink > 0) WOMAN.blink -= dt;
  // Her face follows the search
  moodT = Math.max(0, moodT - dt);
  let m = 'worried';
  if (state === 'win') m = 'joy';
  else if (state === 'fail') m = 'dismay';
  else if (moodT > 0) m = womanMood;
  else if (state === 'play' && lamp.lit && (shimmerNear > 0.72 || coinGlinting())) m = 'wow';
  else if (state === 'play' && lamp.lit) m = 'watch';
  WOMAN.mood = m;
}
function setMood(m, dur = 1.3) { womanMood = m; moodT = dur; }

function coinGlinting() {
  const c = coinItem();
  return c && !c.found && !hidden(c) && lightAt(c.x, c.y) > 0.3;
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// Head covering, with her band of ten silver coins when it's the woman
function drawScarf(d, hy) {
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  if (d.coins) drawCoinBand(hy, coinBack || state === 'win' && winT > 1.9);
}

const GAP = 6;            // which coin of the ten is missing
function coinBandPos(k, hy) {
  const a = Math.PI * (1.14 + 0.72 * k / 9);
  return [Math.cos(a) * 14.5, hy - 1 + Math.sin(a) * 14.5];
}
function drawCoinBand(hy, full) {
  for (let k = 0; k < 10; k++) {
    const [x, y] = coinBandPos(k, hy);
    if (k === GAP && !full) {
      ctx.strokeStyle = 'rgba(60,30,20,0.8)'; ctx.lineWidth = 1;
      ctx.setLineDash([1.5, 1.5]);
      ctx.beginPath(); ctx.arc(x, y, 2.9, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const g = ctx.createRadialGradient(x - 1, y - 1, 0.3, x, y, 3.2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a9b4bf');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6f7a86'; ctx.lineWidth = 0.7; ctx.stroke();
  }
}

function drawPerson(d, x, y, s, lookX, lookY) {
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  if (d.kid) s *= 0.78;

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const [lx, ly] = lookAt(x, y - 60 * s, lookX, lookY);

  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 2 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  if (mood === 'watch' || (mood === 'wow' && d.i % 2 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) drawScarf(d, hy);
  else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);

  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }
  ctx.restore();
}

// ============================================================
//  Jesus (drawn as in Jesus Rises, standing on a rock to teach)
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);

  const up = j.face === 'joy';

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: open and welcoming; one hand lifted as He tells the story
  const hands = up ? [[-21, -66], [21, -66]] : [[-20, -22], [20, -22]];
  if (!up && j.speaking) hands[1] = [23, -34 - Math.max(0, Math.sin(t * 3)) * 6];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4 + 1, -53, 1.5, 0, TAU); ctx.arc(4 + 1, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.speaking && Math.sin(t * 14) > 0) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46.5, 2, 1.8, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  The house: floor, walls, lampstand, loom, window
// ============================================================
function drawFloor() {
  const w = world;
  const x0 = Math.max(0, cam.x - 10), x1 = Math.min(w.w, cam.x + viewW + 10);
  const y0 = Math.max(0, cam.y - 10), y1 = Math.min(w.h, cam.y + viewH + 10);

  // Room: stone flags
  ctx.save();
  ctx.beginPath(); ctx.rect(0, BACK, w.roomW, w.roomH - BACK); ctx.clip();
  ctx.fillStyle = '#5e5042';
  ctx.fillRect(0, BACK, w.roomW, w.roomH - BACK);
  const TW = 70, TH = 50;
  for (let r = Math.floor((Math.max(y0, BACK) - BACK) / TH); BACK + r * TH < Math.min(y1, w.roomH); r++) {
    const off = (r % 2) * TW / 2;
    for (let c = Math.floor((x0 - off) / TW) - 1; c * TW + off < x1; c++) {
      const h = hash(c, r);
      const base = 128 + Math.round(h * 26);
      ctx.fillStyle = `rgb(${base + 12},${base},${base - 22})`;
      roundRect(c * TW + off + 2.5, BACK + r * TH + 2.5, TW - 5, TH - 5, 9); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      roundRect(c * TW + off + 6, BACK + r * TH + 5, TW - 18, 8, 4); ctx.fill();
    }
  }
  ctx.restore();

  // Courtyard: packed earth with a few paving stones
  if (w.court) {
    const C = w.court;
    ctx.fillStyle = '#8f7650';
    ctx.fillRect(C.x, C.y, C.w, C.h);
    for (let i = 0; i < 70; i++) {
      const px = C.x + hash(i, 3) * C.w, py = C.y + hash(i, 7) * C.h;
      if (px < x0 - 20 || px > x1 + 20 || py < y0 - 20 || py > y1 + 20) continue;
      ctx.fillStyle = i % 3 ? 'rgba(70,52,30,0.25)' : 'rgba(255,240,200,0.12)';
      ctx.beginPath(); ctx.ellipse(px, py, 3 + hash(i, 9) * 18, 2 + hash(i, 11) * 8, 0, 0, TAU); ctx.fill();
    }
    // a path of paving stones from the door
    const d = w.door;
    for (let k = 0; k < 6; k++) {
      const px = w.split === 'v' ? d.x + 40 + k * 46 : d.x + Math.sin(k) * 12;
      const py = w.split === 'v' ? d.y + Math.sin(k) * 12 : d.y + 40 + k * 46;
      ctx.fillStyle = '#a89478';
      ctx.beginPath(); ctx.ellipse(px, py, 20, 14, 0.3 * k, 0, TAU); ctx.fill();
    }
  }
}

function stoneWall(x, y, w, h) {
  ctx.fillStyle = '#6d5a47';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#85705a';
  const s = 22;
  for (let yy = y; yy < y + h; yy += s) {
    for (let xx = x + (Math.round((yy - y) / s) % 2) * (s / 2) - s; xx < x + w; xx += s) {
      const cx = Math.max(xx + 1.5, x), cw = Math.min(xx + s - 1.5, x + w) - cx;
      const cy = yy + 1.5, ch = Math.min(s - 3, y + h - cy);
      if (cw > 2 && ch > 2) { roundRect(cx, cy, cw, ch, 4); ctx.fill(); }
    }
  }
}

function drawWalls() {
  const w = world;
  // Back wall of the room, seen face-on: plaster over stone
  const g = ctx.createLinearGradient(0, 0, 0, BACK);
  g.addColorStop(0, '#b89770'); g.addColorStop(1, '#d6b98f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w.roomW, BACK);
  ctx.strokeStyle = 'rgba(120,90,60,0.25)'; ctx.lineWidth = 2;
  for (let yy = 26; yy < BACK - 10; yy += 26) {
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(w.roomW, yy); ctx.stroke();
  }
  // wooden beams of the roof
  ctx.fillStyle = '#5a3e25';
  ctx.fillRect(0, 0, w.roomW, 12);
  for (let bx = 30; bx < w.roomW; bx += 120) { roundRect(bx - 7, 0, 14, 20, 4); ctx.fill(); }
  // floor edge shadow
  ctx.fillStyle = 'rgba(40,25,10,0.35)';
  ctx.fillRect(0, BACK - 8, w.roomW, 8);

  // Window with the night sky and a star
  const wx = w.win.x;
  ctx.fillStyle = '#6b4a2b';
  roundRect(wx - 30, 30, 60, 66, [28, 28, 4, 4]); ctx.fill();
  const sky = ctx.createLinearGradient(0, 34, 0, 92);
  sky.addColorStop(0, '#1d2a5a'); sky.addColorStop(1, '#3b4f8f');
  ctx.fillStyle = sky;
  roundRect(wx - 24, 36, 48, 56, [24, 24, 2, 2]); ctx.fill();
  ctx.fillStyle = '#fff6c8';
  ctx.beginPath(); ctx.arc(wx + 9, 52, 2.2, 0, TAU); ctx.arc(wx - 10, 66, 1.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f4ecd0';
  ctx.beginPath(); ctx.arc(wx - 6, 50, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2a3a70';
  ctx.beginPath(); ctx.arc(wx - 3, 48, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8a6a44'; ctx.fillRect(wx - 34, 94, 68, 7);

  // A niche with bowls between the window and the loom
  if (w.loom.x - wx > 150) {
    const nx = (wx + w.loom.x) / 2 + 10;
    ctx.fillStyle = '#8f7254';
    roundRect(nx - 30, 44, 60, 40, [18, 18, 2, 2]); ctx.fill();
    ctx.fillStyle = '#c47a45';
    ctx.beginPath(); ctx.ellipse(nx - 12, 78, 11, 6, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#e0c49a';
    ctx.beginPath(); ctx.ellipse(nx + 12, 78, 10, 7, 0, 0, Math.PI); ctx.fill();
  }
  // Herbs hanging from a beam
  if (wx - w.lampstand.x > 140) {
    const hx = (wx + w.lampstand.x) / 2 + 10;
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = '#6a8a3a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hx + k * 14, 12); ctx.lineTo(hx + k * 14 + 2, 40); ctx.stroke();
      ctx.fillStyle = '#7fa04a';
      ctx.beginPath(); ctx.ellipse(hx + k * 14 + 2, 44, 6, 10, 0, 0, TAU); ctx.fill();
    }
  }

  drawLoom(w.loom.x);
  drawLampstand(w.lampstand.x, w.lampstand.y, !lamp.lit);

  // Side and front walls
  stoneWall(0, BACK - 4, WALL, w.roomH - BACK + 4);
  stoneWall(w.roomW - WALL, BACK - 4, WALL, w.roomH - BACK + 4);
  // Front wall with the house door
  const fx = w.frontDoor.x;
  if (w.split !== 'h') {
    stoneWall(0, w.roomH - WALL, fx - 45, WALL);
    stoneWall(fx + 45, w.roomH - WALL, w.roomW - fx - 45, WALL);
    ctx.fillStyle = '#3a2a1a'; ctx.fillRect(fx - 45, w.roomH - WALL, 90, WALL);
    ctx.fillStyle = '#b39a78'; ctx.fillRect(fx - 45, w.roomH - 6, 90, 6);
  }
  if (w.court) drawCourtWalls();
}

function drawCourtWalls() {
  const w = world, C = w.court, d = w.door;
  if (w.split === 'v') {
    // Low courtyard wall with a vine at the back
    stoneWall(C.x, 0, C.w, CBACK);
    ctx.fillStyle = 'rgba(40,25,10,0.3)'; ctx.fillRect(C.x, CBACK - 6, C.w, 6);
    for (let k = 0; k < C.w / 36; k++) {
      ctx.fillStyle = k % 2 ? '#5f8a3a' : '#6f9e4a';
      ctx.beginPath(); ctx.ellipse(C.x + 18 + k * 36, 18 + Math.sin(k * 1.7) * 8, 16, 11, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#7a4fa0';
    for (let k = 1; k < C.w / 90; k++) { ctx.beginPath(); ctx.arc(C.x + k * 90, 32, 4, 0, TAU); ctx.arc(C.x + k * 90 + 6, 36, 4, 0, TAU); ctx.fill(); }
    // wall between room and courtyard, with a doorway
    stoneWall(C.x - WALL, BACK - 4, WALL * 2, d.y - d.len / 2 - BACK + 4);
    stoneWall(C.x - WALL, d.y + d.len / 2, WALL * 2, w.h - d.y - d.len / 2);
    ctx.fillStyle = '#b39a78'; ctx.fillRect(C.x - WALL, d.y - d.len / 2, WALL * 2, d.len);
    stoneWall(w.w - WALL, CBACK - 4, WALL, w.h - CBACK + 4);
    stoneWall(C.x + WALL, w.h - WALL, C.w - WALL, WALL);
  } else {
    // wall between room (above) and courtyard (below), with a doorway
    stoneWall(0, C.y - WALL, d.x - d.len / 2, WALL * 2);
    stoneWall(d.x + d.len / 2, C.y - WALL, w.w - d.x - d.len / 2, WALL * 2);
    ctx.fillStyle = '#b39a78'; ctx.fillRect(d.x - d.len / 2, C.y - WALL, d.len, WALL * 2);
    stoneWall(0, C.y + WALL, WALL, C.h - WALL);
    stoneWall(w.w - WALL, C.y + WALL, WALL, C.h - WALL);
    stoneWall(0, w.h - WALL, w.w, WALL);
  }
}

function drawLoom(x) {
  // An upright weaving loom leaning on the back wall
  ctx.fillStyle = '#7a5230';
  roundRect(x - 52, 18, 9, BACK - 12, 3); ctx.fill();
  roundRect(x + 43, 18, 9, BACK - 12, 3); ctx.fill();
  roundRect(x - 58, 20, 116, 9, 4); ctx.fill();
  // woven cloth
  const cols = ['#c0392b', '#e8dcc0', '#2f7f9a', '#e8dcc0', '#d9a13a'];
  for (let k = 0; k < 5; k++) { ctx.fillStyle = cols[k]; ctx.fillRect(x - 42, 29 + k * 8, 84, 8); }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.moveTo(x - 36 + k * 12, 45); ctx.lineTo(x - 30 + k * 12, 53); ctx.lineTo(x - 24 + k * 12, 45); ctx.fill(); }
  // warp threads and loom weights
  ctx.strokeStyle = '#efe4c8'; ctx.lineWidth = 1;
  for (let k = 0; k < 12; k++) {
    ctx.beginPath(); ctx.moveTo(x - 40 + k * 7.3, 69); ctx.lineTo(x - 40 + k * 7.3, BACK - 24); ctx.stroke();
  }
  ctx.fillStyle = '#8c8272';
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.ellipse(x - 36 + k * 14.5, BACK - 20, 5, 6.5, 0, 0, TAU); ctx.fill(); }
}

function drawLampstand(x, y, withLamp) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y, 20, 6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 16, y); ctx.lineTo(x, y - 18); ctx.lineTo(x + 16, y);
  ctx.moveTo(x, y); ctx.lineTo(x, y - 104);
  ctx.stroke();
  ctx.fillStyle = '#a8803e';
  ctx.beginPath(); ctx.ellipse(x, y - 106, 18, 5, 0, 0, TAU); ctx.fill();
  if (withLamp) drawOilLamp(x, y - 112, 1, false);
}

// A little clay oil lamp; `flame` is its brightness (0 = unlit)
function drawOilLamp(x, y, s, flame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // handle
  ctx.strokeStyle = '#8a4f28'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-15, -1, 4, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  // body and spout
  ctx.fillStyle = '#b86e3c';
  ctx.beginPath();
  ctx.ellipse(-2, 0, 13, 7.5, 0, 0, TAU);
  ctx.moveTo(6, -4); ctx.quadraticCurveTo(16, -3, 19, -1); ctx.quadraticCurveTo(16, 4, 6, 4);
  ctx.fill();
  ctx.fillStyle = '#d98d52';
  ctx.beginPath(); ctx.ellipse(-3, -2.5, 8, 3.2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5a3218';
  ctx.beginPath(); ctx.arc(-3, -2.5, 2, 0, TAU); ctx.fill();
  if (flame) {
    const f = flame * (1 + Math.sin(t * 17) * 0.08 + Math.sin(t * 11) * 0.06);
    const gl = ctx.createRadialGradient(19, -8, 1, 19, -8, 22 * f);
    gl.addColorStop(0, 'rgba(255,220,120,0.7)'); gl.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(19, -8, 22 * f, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffb33b';
    ctx.beginPath();
    ctx.moveTo(19, -2); ctx.quadraticCurveTo(12, -9, 19 + Math.sin(t * 9) * 1.5, -18 * f); ctx.quadraticCurveTo(26, -9, 19, -2);
    ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.ellipse(19, -6, 2.2, 4 * f, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  Things on the floor

function drawRug(r) {
  const x = r.x - r.rw / 2, y = r.y - r.rh / 2;
  const rolled = 1 - r.amt;
  const lw = r.rw * r.amt;          // still flat
  if (lw > 4) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x + r.rw - lw, y - 6, lw + 8, r.rh + 12); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    roundRect(x + 3, y + 4, r.rw, r.rh, 6); ctx.fill();
    ctx.fillStyle = r.col;
    roundRect(x, y, r.rw, r.rh, 6); ctx.fill();
    ctx.fillStyle = '#efe0bc';
    ctx.fillRect(x + 8, y + 10, r.rw - 16, 7); ctx.fillRect(x + 8, y + r.rh - 17, r.rw - 16, 7);
    ctx.fillStyle = shade(r.col, -35);
    for (let k = 0; k < 5; k++) {
      const cx = x + 22 + k * (r.rw - 44) / 4, cy = y + r.rh / 2;
      ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 9, cy); ctx.lineTo(cx, cy + 11); ctx.lineTo(cx - 9, cy); ctx.fill();
    }
    // fringe
    ctx.strokeStyle = '#efe0bc'; ctx.lineWidth = 1.5;
    for (let k = 0; k < 8; k++) {
      const fy = y + 6 + k * (r.rh - 12) / 7;
      ctx.beginPath(); ctx.moveTo(x + r.rw, fy); ctx.lineTo(x + r.rw + 6, fy); ctx.stroke();
    }
    ctx.restore();
  }
  if (rolled > 0.02) {
    // the rolled-up part lies along the left edge
    const rx = x + r.rw - lw;
    const rad = 6 + rolled * 9;
    ctx.fillStyle = shade(r.col, -20);
    roundRect(rx - rad, y - 2, rad * 2, r.rh + 4, rad); ctx.fill();
    ctx.strokeStyle = shade(r.col, -50); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(rx, y + 2); ctx.lineTo(rx, y + r.rh - 2); ctx.stroke();
  }
}

function drawDust(p) {
  if (p.amt <= 0) return;
  const a = p.amt;
  for (const b of p.blobs) {
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(p.x + b.dx * (0.6 + a * 0.4), p.y + b.dy * (0.6 + a * 0.4), b.rx * a + 2, b.ry * a + 1.5, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,245,220,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x - 6 * a, p.y - 6 * a, 10 * a, 4 * a, 0, 0, TAU); ctx.fill();
  // bits of fluff
  ctx.fillStyle = '#6f624e';
  for (let k = 0; k < 5 * a; k++) { ctx.beginPath(); ctx.arc(p.x + p.blobs[k].dx * 1.2, p.y + p.blobs[k].dy * 1.3 + 3, 1.6, 0, TAU); ctx.fill(); }
}

function drawStraw(p) {
  if (p.amt <= 0) return;
  const n = Math.ceil(p.bits.length * p.amt);
  ctx.lineCap = 'round'; ctx.lineWidth = 2.4;
  for (let k = 0; k < n; k++) {
    const b = p.bits[k];
    ctx.strokeStyle = b.c;
    const cx = p.x + b.dx, cy = p.y + b.dy;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(b.a) * b.l / 2, cy - Math.sin(b.a) * b.l / 4);
    ctx.lineTo(cx + Math.cos(b.a) * b.l / 2, cy + Math.sin(b.a) * b.l / 4);
    ctx.stroke();
  }
}

function drawJar(m) {
  const x = m.x + m.ox, y = m.y + m.oy;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(m.wob * 30) * m.wob * 0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 6, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(-22, 0, 22, 0);
  g.addColorStop(0, shade(m.col, -30)); g.addColorStop(0.4, shade(m.col, 20)); g.addColorStop(1, shade(m.col, -40));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.quadraticCurveTo(-26, -18, -18, -36);
  ctx.quadraticCurveTo(-12, -44, -8, -46);
  ctx.lineTo(8, -46);
  ctx.quadraticCurveTo(12, -44, 18, -36);
  ctx.quadraticCurveTo(26, -18, 8, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(m.col, -10);
  roundRect(-10, -54, 20, 9, 3); ctx.fill();
  ctx.fillStyle = '#2e1c10';
  ctx.beginPath(); ctx.ellipse(0, -54, 8, 2.8, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,210,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-17, -28); ctx.quadraticCurveTo(0, -22, 17, -28); ctx.stroke();
  ctx.restore();
}

function drawBasket(m) {
  const x = m.x + m.ox, y = m.y + m.oy;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(m.wob * 30) * m.wob * 0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c99a52';
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(-26, -30); ctx.lineTo(26, -30); ctx.lineTo(22, 0);
  ctx.quadraticCurveTo(0, 6, -22, 0); ctx.fill();
  ctx.strokeStyle = '#9a6f32'; ctx.lineWidth = 1.6;
  for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-26 + k, -30 + k * 7.5); ctx.quadraticCurveTo(0, -24 + k * 7.5, 26 - k, -30 + k * 7.5); ctx.stroke(); }
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(k * 7, -28); ctx.lineTo(k * 6.2, 1); ctx.stroke(); }
  ctx.fillStyle = '#6e4a22';
  ctx.beginPath(); ctx.ellipse(0, -30, 26, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0c060';
  ctx.beginPath(); ctx.ellipse(0, -31, 22, 5, 0, 0, TAU); ctx.fill();   // grain inside
  ctx.restore();
}

function drawChest(m) {
  const x = m.x + m.ox, y = m.y + m.oy;
  ctx.save();
  ctx.translate(x + Math.sin(m.wob * 40) * m.wob * 6, y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 2, 46, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4f2c';
  roundRect(-42, -44, 84, 46, 4); ctx.fill();
  ctx.fillStyle = '#946239';
  roundRect(-42, -58, 84, 18, [6, 6, 0, 0]); ctx.fill();
  ctx.fillStyle = '#5a3a1e';
  ctx.fillRect(-42, -42, 84, 3);
  ctx.fillStyle = '#b8903e';
  ctx.fillRect(-30, -58, 6, 60); ctx.fillRect(24, -58, 6, 60);
  roundRect(-6, -40, 12, 10, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,230,180,0.18)';
  ctx.fillRect(-40, -56, 80, 4);
  ctx.restore();
}

function drawCat(c) {
  const x = c.x + c.ox, y = c.y + c.oy;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(c.face, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 28, 7, 0, 0, TAU); ctx.fill();
  const fur = '#e59a4a', dark = '#b8692a';
  if (c.walk || c.awake > 0) {
    // up on four paws
    const ph = c.walk ? t * 14 : 0;
    ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const [lx, o] of [[-14, 0], [-7, Math.PI], [8, Math.PI], [15, 0]]) {
      ctx.beginPath(); ctx.moveTo(lx, -14); ctx.lineTo(lx + Math.sin(ph + o) * 4, 0); ctx.stroke();
    }
    ctx.strokeStyle = fur; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-20, -18); ctx.quadraticCurveTo(-34, -26, -30, -44 + Math.sin(t * 5) * 3); ctx.stroke();
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, -20, 22, 10, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 8, -29); ctx.lineTo(k * 8 + 2, -22); ctx.stroke(); }
    drawCatHead(22, -30, true);
  } else {
    // curled up asleep
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, -10, 26, 14, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.arc(k * 9 - 4, -12, 8, Math.PI * 1.2, Math.PI * 1.6); ctx.stroke(); }
    ctx.strokeStyle = fur; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-22, -4); ctx.quadraticCurveTo(-8, 6, 16, 0); ctx.stroke();
    ctx.strokeStyle = dark; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(12, 1); ctx.lineTo(18, -1); ctx.stroke();
    drawCatHead(17, -12, false);
  }
  ctx.restore();
  // floating Zzz
  if (!c.walk && c.awake <= 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
    for (let k = 0; k < 2; k++) {
      const f = (t * 0.5 + k * 0.5) % 1;
      ctx.globalAlpha = Math.sin(f * Math.PI);
      ctx.fillText('z', x + 20 * c.face + f * 14, y - 28 - f * 22);
    }
    ctx.globalAlpha = 1;
  }
}
function drawCatHead(hx, hy, awake) {
  const fur = '#e59a4a';
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.moveTo(hx - 9, hy - 4); ctx.lineTo(hx - 8, hy - 16); ctx.lineTo(hx - 2, hy - 8);
  ctx.moveTo(hx + 9, hy - 4); ctx.lineTo(hx + 8, hy - 16); ctx.lineTo(hx + 2, hy - 8);
  ctx.fill();
  ctx.beginPath(); ctx.arc(hx, hy, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f7c9a0';
  ctx.beginPath(); ctx.ellipse(hx, hy + 4, 5, 3.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  if (awake) {
    ctx.fillStyle = '#6fbf4a';
    ctx.beginPath(); ctx.ellipse(hx - 4, hy - 2, 2.2, 2.8, 0, 0, TAU); ctx.ellipse(hx + 4, hy - 2, 2.2, 2.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1208';
    ctx.fillRect(hx - 4.5, hy - 4, 1, 4); ctx.fillRect(hx + 3.5, hy - 4, 1, 4);
  } else {
    ctx.beginPath(); ctx.arc(hx - 4, hy - 2, 2.2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.arc(hx + 4, hy - 2, 2.2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  }
  ctx.fillStyle = '#d9607a';
  ctx.beginPath(); ctx.arc(hx, hy + 2.5, 1.4, 0, TAU); ctx.fill();
}

function drawWell(p) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, 46, 16, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8c7a66';
  ctx.beginPath(); ctx.ellipse(p.x, p.y - 8, 42, 22, 0, 0, TAU); ctx.fill();
  ctx.fillRect(p.x - 42, p.y - 8, 84, 10);
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, 42, 18, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#1c2436';
  ctx.beginPath(); ctx.ellipse(p.x, p.y - 9, 30, 14, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(160,190,255,0.35)';
  ctx.beginPath(); ctx.ellipse(p.x + 6, p.y - 7, 12, 4, 0, 0, TAU); ctx.fill();
}

function drawWood(p) {
  for (let k = 0; k < 5; k++) {
    const lx = p.x - 22 + (k % 3) * 20 + (k > 2 ? 10 : 0), ly = p.y - (k > 2 ? 14 : 0);
    ctx.fillStyle = '#7a5230';
    roundRect(lx - 14, ly - 8, 28, 13, 6); ctx.fill();
    ctx.fillStyle = '#c9a070';
    ctx.beginPath(); ctx.ellipse(lx + 12, ly - 1.5, 4, 6, 0, 0, TAU); ctx.fill();
  }
}

function drawTrough(p) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, 38, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8c7a66';
  roundRect(p.x - 36, p.y - 26, 72, 28, 6); ctx.fill();
  ctx.fillStyle = '#d9b85c';
  roundRect(p.x - 30, p.y - 30, 60, 12, 5); ctx.fill();
}

function drawFig(p) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, 60, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a2b';
  roundRect(p.x - 7, p.y - 50, 14, 56, 5); ctx.fill();
  for (const [dx, dy, r, c] of [[-30, -70, 30, '#557f35'], [28, -72, 30, '#557f35'], [0, -94, 34, '#6a9a42'], [-18, -60, 24, '#6a9a42'], [20, -58, 24, '#6a9a42']]) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(p.x + dx, p.y + dy, r, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#7a3f6a';
  for (const [dx, dy] of [[-20, -80], [16, -64], [6, -100], [30, -84]]) { ctx.beginPath(); ctx.arc(p.x + dx, p.y + dy, 4, 0, TAU); ctx.fill(); }
}

function drawProp(p) {
  switch (p.kind) {
    case 'jar': drawJar(p); break;
    case 'basket': drawBasket(p); break;
    case 'chest': drawChest(p); break;
    case 'cat': drawCat(p); break;
    case 'well': drawWell(p); break;
    case 'wood': drawWood(p); break;
    case 'trough': drawTrough(p); break;
    case 'fig': drawFig(p); break;
  }
}

// ============================================================
//  The coin, the decoys and the extras
// ============================================================
function drawItem(it) {
  const x = it.x, y = it.y;
  ctx.save();
  ctx.translate(x, y);
  switch (it.kind) {
    case 'coin': {
      const spin = it.spin ? Math.cos(it.spin) : 1;
      ctx.scale(Math.abs(spin) * 0.9 + 0.1, 1);
      const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, 10);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#d5dde5'); g.addColorStop(1, '#9aa6b2');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 8, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#7d8995'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(110,120,135,0.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, 4.5, Math.PI * 0.2, Math.PI * 1.7); ctx.stroke();
      break;
    }
    case 'button':
      ctx.fillStyle = '#e8dcc0';
      ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 6, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#a8977a'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#6a5a40';
      ctx.beginPath(); ctx.arc(-2.3, 0, 1.2, 0, TAU); ctx.arc(2.3, 0, 1.2, 0, TAU); ctx.fill();
      break;
    case 'sherd':
      ctx.fillStyle = '#c96f3a';
      ctx.beginPath(); ctx.moveTo(-10, 3); ctx.lineTo(-3, -7); ctx.lineTo(9, -4); ctx.lineTo(7, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a1a10';
      ctx.fillRect(-6, -1, 12, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(1, -3, 3, 1.4, 0.3, 0, TAU); ctx.fill();
      break;
    case 'beetle': {
      const run = it.run ? t * 40 : 0;
      if (it.run) ctx.rotate(Math.atan2(it.run.vy, it.run.vx) + Math.PI / 2);
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.4;
      for (let k = -1; k <= 1; k++) for (const sd of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(0, k * 4); ctx.lineTo(sd * 9, k * 5 + Math.sin(run + k + sd) * 2.5); ctx.stroke();
      }
      ctx.fillStyle = '#1f6b5a';
      ctx.beginPath(); ctx.ellipse(0, 1, 6, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#123c34';
      ctx.beginPath(); ctx.arc(0, -8, 3.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(140,255,220,0.8)';
      ctx.beginPath(); ctx.ellipse(-2, -1, 1.8, 4, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#123c34'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 9); ctx.stroke();
      break;
    }
    case 'ring':
      ctx.strokeStyle = '#e9b93a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 1, 7, 5, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#d63a4a';
      ctx.beginPath(); ctx.arc(0, -4, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-1, -5, 1, 0, TAU); ctx.fill();
      break;
    case 'toy':
      // a little wooden spinning top
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(9, -4); ctx.lineTo(0, 9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f2c14e'; ctx.fillRect(-7, -2, 14, 3);
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-1.5, -10, 3, 7);
      break;
    case 'sandal':
      ctx.rotate(0.5);
      ctx.fillStyle = '#9a6a3a';
      ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 13, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(6, -3); ctx.moveTo(-6, 4); ctx.lineTo(6, 4); ctx.moveTo(0, -12); ctx.lineTo(0, -3); ctx.stroke();
      break;
  }
  ctx.restore();
}

// A twinkling star where something shiny catches the lamplight
function drawGlint(x, y, size, alpha, gold) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.6);
  g.addColorStop(0, gold ? 'rgba(255,230,140,0.9)' : 'rgba(255,255,255,0.9)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, size * 1.6, 0, TAU); ctx.fill();
  ctx.fillStyle = gold ? '#fff2b8' : '#ffffff';
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 + t * 0.6;
    const r = k % 2 ? size * 0.28 : size;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGlints() {
  for (const it of world.items) {
    if (it.found) continue;
    const L = lightAt(it.x, it.y);
    if (L <= 0.05) continue;
    const tw = Math.pow(Math.max(0, Math.sin(t * 2.6 + it.phase)), 4);
    const gold = it.kind === 'ring' || it.kind === 'toy' || it.kind === 'sandal';
    if (!hidden(it)) {
      drawGlint(it.x + 3, it.y - 4, 6 + tw * 9, L * (0.55 + tw * 0.45), gold);
    } else if (it.cover && it.cover.amt < 0.75) {
      // peeping out from a half-swept pile
      drawGlint(it.x + 5, it.y - 2, 4 + tw * 5, L * 0.5 * tw, gold);
    } else if (it.mover && it.mover.kind === 'chest') {
      // something shines just under the edge of the heavy chest
      drawGlint(it.mover.x + it.mover.ox + 30 * Math.sin(it.phase), it.mover.y + 4, 4 + tw * 6, L * 0.8 * tw, false);
    }
  }
}

function drawBroomFx() {
  for (const b of broomFx) {
    const a = clamp(b.t / 0.12, 0, 1);
    const sw = Math.sin((0.4 - b.t) * 30) * 0.45;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(b.x, b.y);
    ctx.rotate(sw);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(26, -64); ctx.lineTo(4, -14); ctx.stroke();
    ctx.fillStyle = '#d9b85c';
    ctx.beginPath(); ctx.moveTo(-2, -18); ctx.lineTo(10, -12); ctx.lineTo(8, 4); ctx.lineTo(-16, 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b08a3e'; ctx.lineWidth = 1.2;
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(2 + k, -14); ctx.lineTo(-14 + k * 5, 2); ctx.stroke(); }
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-1, -19, 10, 3);
    ctx.restore();
  }
}

// ============================================================
//  Particles (world or screen)
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, scr = false, kind = 'dot') {
  if (particles.length > 500) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, scr, kind });
}

function dustPuff(x, y, n = 10, col = null) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-16, 16), y + rand(-8, 6), rand(-50, 50), rand(-60, -10), rand(0.5, 1.1),
      col || pick(['rgba(190,170,140,0.8)', 'rgba(215,200,170,0.75)', 'rgba(160,140,110,0.7)']), rand(4, 10), -10, false, 'puff');
  }
}

function sparkleBurst(x, y, n, scr = false, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#e0e8f0']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 220);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.5), cols[i % cols.length], rand(2, 4.5), 40, scr, i % 3 ? 'dot' : 'star');
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    if (p.kind === 'puff') { p.vx *= Math.pow(0.2, dt); p.vy *= Math.pow(0.3, dt); p.size += dt * 8; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles(scr) {
  for (const p of particles) {
    if (p.scr !== scr) continue;
    const a = p.life / p.max;
    ctx.globalAlpha = p.kind === 'puff' ? a * 0.8 : a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const s = p.size * 1.6;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4, r = k % 2 ? s * 0.35 : s; ctx.lineTo(p.x + Math.cos(an) * r, p.y + Math.sin(an) * r); }
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'heart') {
      const s = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + s * 0.9);
      ctx.bezierCurveTo(p.x - s * 1.4, p.y - s * 0.2, p.x - s * 0.5, p.y - s * 1.3, p.x, p.y - s * 0.4);
      ctx.bezierCurveTo(p.x + s * 0.5, p.y - s * 1.3, p.x + s * 1.4, p.y - s * 0.2, p.x, p.y + s * 0.9);
      ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Searching: the lamp, the broom, and moving things
// ============================================================
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function lightLamp() {
  lamp.lit = true;
  lamp.litT = 0;
  const ls = world.lampstand;
  lamp.x = lamp.tx = ls.x + 20; lamp.y = lamp.ty = ls.y - 110;
  sparkleBurst(lamp.x, lamp.y, 24, false, ['#ffe27a', '#ffb33b', '#fff6d0']);
  flashT = 0.2;
  sfx.lightUp();
  showMessage('The lamp is lit!', 1.6);
  if (level === 1) {
    setTimeout(() => {
      if (state === 'play') showMessage(isTouch() ? 'Drag to carry the light · tap to sweep' : 'Move the mouse to carry the light · click to sweep', 3.2);
    }, 1700);
  }
}

function refillOil() {
  if (state !== 'play' || refillUsed) return;
  if (!lamp.lit) { showMessage('Light the lamp first'); return; }
  refillUsed = true;
  oil = Math.min(1, oil + 0.5);
  showMessage('More oil for the lamp!', 1.6);
  sfx.glug();
}

// Tap / click / Space at a point in the house
function tapAt(x, y, r = TAP_R) {
  if (!lamp.lit) {
    const ls = world.lampstand;
    if (Math.hypot(x - ls.x, y - (ls.y - 70)) < 90 || r > TAP_R) lightLamp();
    else { showMessage('Tap the lamp to light it'); told.lampHint = 3; }
    return;
  }
  // 1. Something shiny that can be seen
  let best = null, bd = r;
  for (const it of world.items) {
    if (it.found || hidden(it)) continue;
    const d = Math.hypot(it.x - x, it.y - y);
    if (d < bd) { bd = d; best = it; }
  }
  if (best) { pickUp(best); return; }
  // 2. Pots, baskets, the chest and the cat
  const movers = world.props.filter((p) => ['jar', 'basket', 'chest', 'cat'].includes(p.kind) && !p.walk);
  movers.sort((a, b) => b.y - a.y);
  for (const m of movers) {
    const mx = m.x + m.ox, my = m.y + m.oy;
    if (Math.abs(x - mx) < m.r + 8 && y > my - m.h - 12 && y < my + 16) { useMover(m); return; }
  }
  // 3. Dust, straw and mats: sweep them
  let swept = false;
  for (const p of world.props) {
    if (!(p.amt > 0)) continue;
    const hit = p.kind === 'rug'
      ? Math.abs(x - p.x) < p.rw / 2 + 6 && Math.abs(y - p.y) < p.rh / 2 + 6
      : Math.hypot(x - p.x, y - p.y) < p.r + 10;
    if (hit) { sweepCover(p, p.kind === 'dust' ? 0.5 : p.kind === 'straw' ? 0.34 : 1); swept = true; }
  }
  // 4. Bare floor: a quick sweep anyway
  broomFx.push({ x, y, t: 0.4 });
  if (!swept) { dustPuff(x, y, 4, 'rgba(200,185,160,0.5)'); sfx.swish(0.5); }
}

function sweepCover(p, amount) {
  const before = p.amt;
  p.amt = Math.max(0, p.amt - amount);
  if (p.kind === 'rug') {
    sfx.swish(1);
    dustPuff(p.x - p.rw / 2, p.y, 8);
  } else {
    dustPuff(p.x, p.y, p.kind === 'straw' ? 6 : 12, p.kind === 'straw' ? 'rgba(230,200,110,0.8)' : null);
    sfx.swish(0.9);
  }
  if (p.amt <= 0 && before > 0 && p.kind !== 'rug') dustPuff(p.x, p.y, 8);
  if (before > 0.35 && p.amt <= 0.35 && p.holds && !p.holds.found) {
    showMessage('Something glints!', 1.4);
    setMood('wow', 1);
  }
}

// Press and drag across dust: sweep along the broom's path
function sweepAlong(x0, y0, x1, y1) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 0.5) return;
  let any = false;
  for (const p of world.props) {
    if (!(p.amt > 0)) continue;
    const hit = p.kind === 'rug'
      ? Math.abs(x1 - p.x) < p.rw / 2 + 4 && Math.abs(y1 - p.y) < p.rh / 2 + 4
      : Math.hypot(x1 - p.x, y1 - p.y) < p.r + BROOM_R;
    if (!hit) continue;
    const before = p.amt;
    p.amt = Math.max(0, p.amt - len * (p.kind === 'dust' ? 0.006 : p.kind === 'straw' ? 0.0045 : 0.005));
    any = true;
    if (Math.random() < len * 0.08) dustPuff(x1, y1, 2, p.kind === 'straw' ? 'rgba(230,200,110,0.8)' : null);
    if (before > 0.35 && p.amt <= 0.35 && p.holds && !p.holds.found) { showMessage('Something glints!', 1.4); setMood('wow', 1); }
  }
  const last = broomFx[broomFx.length - 1];
  if (last && last.drag) { last.x = x1; last.y = y1; last.t = 0.4; } else broomFx.push({ x: x1, y: y1, t: 0.4, drag: true });
  if (any && sweepSoundT <= 0) { sfx.swish(0.6); sweepSoundT = 0.14; }
}
let sweepSoundT = 0;

function useMover(m) {
  if (m.kind === 'cat') { wakeCat(m); return; }
  if (m.moved) {
    m.wob = 0.3;
    showMessage(m.kind === 'chest' ? 'Nothing more under the chest' : `Nothing else behind the ${m.kind}`, 1.3);
    sfx.bounce();
    return;
  }
  if (m.kind === 'chest' && m.push < 1) {
    m.push++;
    m.wob = 0.5; shakeT = 0.15;
    showMessage('Heave! It’s heavy… tap again!', 1.6);
    sfx.thud();
    return;
  }
  m.moved = true;
  // slide it toward the middle of its area so it stays inside the walls
  const A = world.areas.find((a) => m.x >= a.x0 - 5 && m.x <= a.x1 + 5 && m.y >= a.y0 - 5 && m.y <= a.y1 + 5) || world.room;
  const dir = m.x < (A.x0 + A.x1) / 2 ? 1 : -1;
  m.slide = { tx: dir * (m.kind === 'chest' ? 92 : 62), ty: -8, t: 0 };
  m.wob = 0.35;
  if (m.kind === 'chest') { sfx.thud(); shakeT = 0.2; } else sfx.clonk();
  dustPuff(m.x, m.y, 6);
  if (m.holds && !m.holds.found) { setTimeout(() => { if (state === 'play') showMessage('Something glints!', 1.4); }, 250); setMood('wow', 1); }
  else showMessage(m.kind === 'chest' ? 'Just dust under the chest' : `Nothing behind the ${m.kind}`, 1.3);
}

function wakeCat(c) {
  if (c.walk) return;
  c.moved = true;
  c.awake = 0.5;
  sfx.meow();
  showMessage(pick(['Mrrow? The cat moves over.', 'Prrrp! Sorry, puss!', 'The cat stretches and wanders off.']), 1.8);
  // find a free spot to curl up again, away from anything shiny
  const A = pick(world.areas);
  let spot = null;
  for (let k = 0; k < 60 && !spot; k++) {
    const x = rand(A.x0 + 30, A.x1 - 30), y = rand(A.y0 + 20, A.y1 - 20);
    if (Math.hypot(x - c.x, y - c.y) < 90) continue;
    if (world.props.some((p) => p !== c && Math.hypot(p.x - x, p.y - y) < p.r + 40)) continue;
    if (world.items.some((i) => !i.found && Math.hypot(i.x - x, i.y - y) < 60)) continue;
    spot = { x, y };
  }
  if (!spot) spot = { x: c.x + 70 * (c.x < world.room.x1 / 2 ? 1 : -1), y: c.y };
  c.walk = { x0: c.x + c.ox, y0: c.y + c.oy, x1: spot.x, y1: spot.y, t: 0, dur: Math.hypot(spot.x - c.x, spot.y - c.y) / 150 + 0.3 };
  c.face = spot.x > c.x ? 1 : -1;
}

function updateProps(dt) {
  for (const p of world.props) {
    if (p.wob > 0) p.wob = Math.max(0, p.wob - dt);
    if (p.slide) {
      p.slide.t = Math.min(1, p.slide.t + dt * 3);
      const f = ease(p.slide.t);
      p.ox = p.slide.tx * f; p.oy = p.slide.ty * f;
    }
    if (p.kind === 'cat') {
      if (p.awake > 0 && !p.walk) p.awake -= dt;
      if (p.walk) {
        const w = p.walk;
        w.t += dt;
        const f = clamp((w.t - 0.3) / (w.dur - 0.3), 0, 1);
        // the cat's resting spot moves with it, so it never covers the old spot again
        const cx = lerp(w.x0, w.x1, f), cy = lerp(w.y0, w.y1, f);
        p.ox = cx - p.x; p.oy = cy - p.y;
        if (f >= 1) {
          p.x = w.x1; p.y = w.y1; p.ox = 0; p.oy = 0;
          p.walk = null; p.awake = 0.6;
        }
      }
    }
  }
}

function pickUp(it) {
  if (it.kind === 'coin') { foundCoin(it); return; }
  it.found = true;
  it.pickT = 0.9;
  if (it.kind === 'button' || it.kind === 'sherd' || it.kind === 'beetle') {
    wrong++;
    if (it.kind === 'beetle') {
      const a = rand(0, TAU);
      it.run = { vx: Math.cos(a) * 260, vy: Math.sin(a) * 260 };
      it.pickT = 0;
      showMessage('A shiny beetle! Scuttle, scuttle…', 2);
      setMood('shock', 1.2);
      sfx.scuttle();
    } else {
      showMessage(it.kind === 'button' ? 'Just a button…' : 'Only a bit of broken pot!', 1.8);
      setMood('dismay', 1.2);
      sfx.clink();
    }
  } else {
    extrasFound++;
    const name = { ring: 'A lost ring!', toy: 'A toy top!', sandal: 'A missing sandal!' }[it.kind];
    showMessage(`${name} +${EXTRA_PTS}`, 1.8);
    setMood('wow', 1.2);
    sparkleBurst(it.x, it.y, 18, false, ['#ffe27a', '#ffd166', '#fff6d0']);
    sfx.extra();
  }
}

function updateItems(dt) {
  for (let i = world.items.length - 1; i >= 0; i--) {
    const it = world.items[i];
    if (it.pickT > 0) it.pickT -= dt;
    if (it.run) {
      it.x += it.run.vx * dt; it.y += it.run.vy * dt;
      // wiggle away, and out of the house
      it.run.vx += Math.sin(t * 9 + it.phase) * 400 * dt;
      if (it.x < -40 || it.y < -40 || it.x > world.w + 40 || it.y > world.h + 40) world.items.splice(i, 1);
    }
    if (it.spin != null) it.spin += dt * 12;
  }
}

// ============================================================
//  Found it! / The lamp goes out
// ============================================================
function foundCoin(it) {
  state = 'win';
  syncAmbience();
  winT = 0;
  it.found = true;
  it.spin = 0;
  const oilBonus = Math.round(oil * 1000);
  const careBonus = Math.max(0, 600 - wrong * WRONG_COST);
  const extraBonus = extrasFound * EXTRA_PTS;
  const levelBonus = level * 500;
  const score = oilBonus + careBonus + extraBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('lostCoinBest', best); } catch (e) {} }
  lastScore = { oilBonus, careBonus, extraBonus, levelBonus, score };
  sparkleBurst(it.x, it.y, 80);
  flashT = 0.35;
  coinFly = { x: it.x - cam.x, y: it.y - cam.y, t: 0 };
  showMessage('She found it!', 2);
  sfx.found();
  sfx.win();
  sfx.shimmer(0);
  endTimer = 6.2;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  showMessage('The lamp went out…', 2.2);
  for (let i = 0; i < 16; i++) spawn(lamp.x + 18, lamp.y - 10, rand(-10, 10), rand(-50, -25), rand(1, 2), 'rgba(120,110,110,0.6)', rand(4, 8), -5, false, 'puff');
  sfx.shimmer(0);
  sfx.snuff();
  sfx.fail();
  endTimer = 2.2;
}

function resetLevel() {
  cfg = makeConfig(level);

  lamp = { x: 0, y: 0, tx: 0, ty: 0, lit: false, litT: 0 };
  oil = 1; refillUsed = false;
  wrong = 0; extrasFound = 0;
  playT = 0; winT = 0; failT = 0;
  coinFly = null; coinBack = false;
  flashT = shakeT = 0;
  endTimer = 0;
  moodT = 0; shimmerNear = 0;
  told = {};
  bubble = null;
  keys.clear();
  down = null;
