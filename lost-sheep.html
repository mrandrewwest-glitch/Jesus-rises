<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8cc865">
<title>The Lost Sheep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #5d8f45;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin: 8px 0 0;
    line-height: 1.3;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>

<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Lost Sheep</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  hundredSheep: { ref: 'Luke 15:4', KJV: 'What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?', NKJV: 'What man of you, having a hundred sheep, if he loses one of them, does not leave the ninety-nine in the wilderness, and go after the one which is lost until he finds it?', NIV: 'Suppose one of you has a hundred sheep and loses one of them. Doesn’t he leave the ninety-nine in the open country and go after the lost sheep until he finds it?', NLT: 'If a man has a hundred sheep and one of them gets lost, what will he do? Won’t he leave the ninety-nine others in the wilderness and go to search for the one that is lost until he finds it?' },
  cometHome: { ref: 'Luke 15:6', KJV: 'And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost.', NKJV: 'And when he comes home, he calls together his friends and neighbors, saying to them, ‘Rejoice with me, for I have found my sheep which was lost!’', NIV: 'Then he calls his friends and neighbors together and says, ‘Rejoice with me; I have found my lost sheep.’', NLT: 'When he arrives, he will call together his friends and neighbors, saying, ‘Rejoice with me because I have found my lost sheep.’' },
  goodShepherd: { ref: 'John 10:11', KJV: 'I am the good shepherd: the good shepherd giveth his life for the sheep.', NKJV: 'I am the good shepherd. The good shepherd gives His life for the sheep.', NIV: 'I am the good shepherd. The good shepherd lays down his life for the sheep.', NLT: 'I am the good shepherd. The good shepherd sacrifices his life for the sheep.' },
  shoulders: { ref: 'Luke 15:5', KJV: 'On His shoulders, rejoicing!', NKJV: 'On his shoulders, rejoicing!', NIV: 'He joyfully puts it on his shoulders!', NLT: 'He will joyfully carry it home on his shoulders!' },                 // on-screen message
  rejoice: { ref: 'Luke 15:6', KJV: 'Rejoice with me!', NKJV: '‘Rejoice with me!', NIV: '‘Rejoice with me!', NLT: '‘Rejoice with me!' },                            // message + win card heading (the ‘ is the modern verses' own quote mark; display strips it)
  foundSheep: { ref: 'Luke 15:6', KJV: 'I have found my sheep which was lost!', NKJV: 'I have found my sheep which was lost!', NIV: 'I have found my lost sheep!', NLT: 'I have found my lost sheep!' },    // on-screen message
};

// Card markup for a verse and the translation credit, looked up in the current version.
function verseHTML(entry) {
  const v = Bible.verse(entry);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() { return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`; }


// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height simply shows more of the hills
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Tuning
// ============================================================
const CS = 20;            // collision & path-finding grid cell (px)
const BODY_R = 15;        // everyone's footprint: obstacles are inflated by this
const WALK = 230;         // the Shepherd's walking speed (px/s)
const CARRY_MUL = 0.7;    // slower with a sheep on His shoulders
const THORN_MUL = 0.5;    // thorns slow everyone down
const FIND_R = 70;        // walking this close to the hidden sheep finds it
const REACH = 95;         // how close He must be to free the sheep from the thorns
const PICK_R = 46;        // walk into a loose sheep to pick it up
const SHOO_R = 240;       // the crook reaches a wolf this far away
const SHOO_CD = 3.5;      // seconds between shoos
const CATCH_R = 36;       // a wolf this close has caught up with you
const SAFE_R = 400;       // wolves keep this far from the fold gate
const CROSS_R = 72;       // radius of a stepping-stone ford
const CHAR = 1.25;        // drawing scale for people and wolves

// The sheepfold always sits in the top-left corner of the hills
const FOLD = { x: 70, y: 90, w: 360, h: 290 };
const GATE = { x: FOLD.x + FOLD.w / 2, y: FOLD.y + FOLD.h, gap: 74 };
const HOME = { x: GATE.x, y: GATE.y + 36 };     // carry the sheep here to win

const LEVEL_NAMES = [
  "The Shepherd's Field",
  'Hills of Judea',
  'Thorny Thickets',
  'Valley of Shadows',
  'Wilderness at Dusk',
  'Wolves at Nightfall',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Wilderness ${n}`,
    ww: Math.min(1700 + (n - 1) * 330, 3200),
    wh: Math.min(1500 + (n - 1) * 300, 3000),
    // [vertical?, position as a fraction of the map]
    streams: n === 1 ? [[1, 0.52]] : n === 2 ? [[1, 0.46], [0, 0.64]] : [[1, 0.4], [0, 0.6], [1, 0.78]],
    ravines: n >= 3 ? Math.min(n - 2, 3) : 0,
    rockD: 4.5, treeD: 5.5, bushD: 5 + n * 1.5,      // obstacles per million px^2
    wolves: n === 1 ? 0 : n < 4 ? 1 : n < 6 ? 2 : 3,
    wolfSpeed: Math.min(196 + n * 6, 240),
    sight: Math.min(260 + n * 15, 360),               // how far a wolf spots you
    taps: Math.min(2 + n, 7),                         // taps to free the sheep
    day: 70 + n * 10,                                 // seconds until sunset
    fogR: Math.max(330, 560 - (n - 1) * 45),          // how far He can see
    darkBase: Math.min(0.12 + (n - 1) * 0.1, 0.55),
    darkMax: Math.min(0.62 + n * 0.05, 0.93),
    dusk: n >= 4,                                     // starts in the evening glow
    baaEvery: Math.min(3.4 + n * 0.4, 6),
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('lostSheepBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let world = null;
let shep = null;          // the Good Shepherd
let sheep = null;         // the one that was lost
let wolves = [];
let particles = [];
let ripples = [];         // tap markers
let baaRings = [];        // "baa!" hint rings
let message = { text: '', t: 0 };
const msgQueue = [];
let hint = { text: '', t: 0, color: '#7a5200' };
let shakeT = 0, flashT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let dayLeft = 90;
let caught = 0;
let baaT = 2;
let lastBaaDist = null;
let wolfWarned = false, nearWarned = false;
let nightF = 0;           // smoothed darkness 0..1
const cam = { x: 0, y: 0 };

// ============================================================
//  World generation
// ============================================================
function distToPoly(s, x, y) {
  let best2 = Infinity;
  const p = s.pts;
  for (let i = 0; i < p.length - 1; i++) {
    const ax = p[i].x, ay = p[i].y, bx = p[i + 1].x - ax, by = p[i + 1].y - ay;
    const f = clamp(((x - ax) * bx + (y - ay) * by) / (bx * bx + by * by || 1), 0, 1);
    const dx = x - (ax + bx * f), dy = y - (ay + by * f);
    const d2 = dx * dx + dy * dy;
    if (d2 < best2) best2 = d2;
  }
  return Math.sqrt(best2);
}

function withBBox(s) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of s.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  s.bbox = { x0, y0, x1, y1 };
  return s;
}

// A wandering brook running right across the map
function makeStream(vertical, f, ww, wh) {
  const base = f * (vertical ? ww : wh), len = vertical ? wh : ww;
  const a1 = rand(50, 90), a2 = rand(15, 30), p1 = rand(0, TAU), p2 = rand(0, TAU);
  const w1 = rand(150, 220), w2 = rand(55, 80);
  const pts = [];
  for (let s = -60; s <= len + 60; s += 20) {
    const o = base + a1 * Math.sin(s / w1 + p1) + a2 * Math.sin(s / w2 + p2);
    pts.push(vertical ? { x: o, y: s } : { x: s, y: o });
  }
  return withBBox({ pts, hw: rand(26, 32), vertical, crossings: [], kind: 'water' });
}

// A short rocky cleft you have to walk around
function makeRavine(ww, wh) {
  const len = rand(380, 620), ang = rand(0, TAU), ph = rand(0, TAU);
  const cx = rand(300, ww - 300), cy = rand(300, wh - 300);
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const pts = [];
  for (let s = -len / 2; s <= len / 2; s += 20) {
    const o = Math.sin(s / 120 + ph) * 25;
    pts.push({ x: cx + dx * s - dy * o, y: cy + dy * s + dx * o });
  }
  return withBBox({ pts, hw: rand(22, 28), crossings: [], kind: 'ravine' });
}

function inFoldZone(x, y, pad) {
  return x > FOLD.x - pad && x < FOLD.x + FOLD.w + pad && y > FOLD.y - pad && y < FOLD.y + FOLD.h + pad;
}

function solidAt(w, x, y, R) {
  if (x < R + 8 || y < R + 8 || x > w.w - R - 8 || y > w.h - R - 8) return true;
  if (inFoldZone(x, y, R)) return true;
  for (const o of w.solids) {
    const dx = x - o.x, dy = y - o.y, rr = o.sr + R;
    if (dx * dx + dy * dy < rr * rr) return true;
  }
  for (const s of w.streams) {
    const lim = s.hw + R, b = s.bbox;
    if (x < b.x0 - lim || x > b.x1 + lim || y < b.y0 - lim || y > b.y1 + lim) continue;
    if (distToPoly(s, x, y) < lim) {
      if (!s.crossings.some((c) => (x - c.x) ** 2 + (y - c.y) ** 2 < CROSS_R * CROSS_R)) return true;
    }
  }
  return false;
}

function tryWorld(c) {
  const w = {
    w: c.ww, h: c.wh, start: { x: GATE.x + 40, y: GATE.y + 90 },
    streams: [], rocks: [], trees: [], bushes: [], solids: [], decor: [], patches: [], border: [],
  };
  const start = w.start;

  // Brooks with stepping-stone fords
  for (const [v, f] of c.streams) w.streams.push(makeStream(!!v, f, w.w, w.h));
  const waters = w.streams.slice();
  for (const s of waters) {
    const n = s.pts.length;
    for (const [a, b] of [[0.12, 0.42], [0.58, 0.9]]) {
      for (let k = 0; k < 30; k++) {
        const i = Math.round(rand(a, b) * (n - 3)) + 1;
        const p = s.pts[i];
        if (p.x < 120 || p.y < 120 || p.x > w.w - 120 || p.y > w.h - 120) continue;
        if (waters.some((o) => o !== s && distToPoly(o, p.x, p.y) < CROSS_R + o.hw + 90)) continue;
        const tx = s.pts[i + 1].x - s.pts[i - 1].x, ty = s.pts[i + 1].y - s.pts[i - 1].y;
        const tl = Math.hypot(tx, ty) || 1;
        s.crossings.push({ x: p.x, y: p.y, tx: tx / tl, ty: ty / tl });
        break;
      }
    }
    if (s.crossings.length < 2) return null;
  }

  // Ravines
  for (let r = 0; r < c.ravines; r++) {
    let ok = null;
    for (let k = 0; k < 40 && !ok; k++) {
      const rv = makeRavine(w.w, w.h);
      const good = rv.pts.every((p) =>
        p.x > 90 && p.y > 90 && p.x < w.w - 90 && p.y < w.h - 90 &&
        !inFoldZone(p.x, p.y, 220) && Math.hypot(p.x - start.x, p.y - start.y) > 300 &&
        w.streams.every((o) => distToPoly(o, p.x, p.y) > o.hw + rv.hw + (o.kind === 'water' ? 130 : 200)) &&
        waters.every((o) => o.crossings.every((cr) => Math.hypot(p.x - cr.x, p.y - cr.y) > CROSS_R + 150)));
      if (good) ok = rv;
    }
    if (ok) w.streams.push(ok);
  }

  // Is this spot free for a rock / tree / bush of radius r?
  const all = [];
  const free = (x, y, r) => {
    if (x < r + 40 || y < r + 40 || x > w.w - r - 40 || y > w.h - r - 40) return false;
    if (inFoldZone(x, y, 110 + r)) return false;
    if (Math.hypot(x - start.x, y - start.y) < 150 + r) return false;
    if (Math.hypot(x - 150, y - 455) < 110 + r) return false;         // the neighbours
    for (const s of w.streams) {
      if (distToPoly(s, x, y) < s.hw + r + 30) return false;
      for (const cr of s.crossings) if (Math.hypot(x - cr.x, y - cr.y) < CROSS_R + r + 50) return false;
    }
    for (const o of all) if (Math.hypot(x - o.x, y - o.y) < r + o.r + 26) return false;
    return true;
  };
  const place = (count, rMin, rMax, fn) => {
    for (let i = 0, tries = 0; i < count && tries < count * 40; tries++) {
      const r = rand(rMin, rMax), x = rand(0, w.w), y = rand(0, w.h);
      if (!free(x, y, r)) continue;
      const o = fn(x, y, r);
      all.push(o); i++;
    }
  };
  const area = (w.w * w.h) / 1e6;
  place(Math.round(area * c.treeD), 26, 38, (x, y, r) => {
    const o = { x, y, r, sr: r * 0.42, kind: Math.random() < 0.6 ? 'olive' : 'terebinth', ph: rand(0, TAU) };
    w.trees.push(o); w.solids.push(o); return o;
  });
  place(Math.round(area * c.rockD), 18, 36, (x, y, r) => {
    const o = { x, y, r, sr: r * 0.9, jag: Array.from({ length: 8 }, () => rand(0.82, 1.08)) };
    w.rocks.push(o); w.solids.push(o); return o;
  });
  place(Math.round(area * c.bushD), 30, 44, (x, y, r) => {
    const o = { x, y, r, ph: rand(0, TAU), wig: 0,
      puffs: Array.from({ length: 9 }, (_, k) => [Math.cos(k / 9 * TAU) * r * 0.62 + rand(-5, 5), Math.sin(k / 9 * TAU) * r * 0.3 + rand(-4, 4), r * rand(0.34, 0.46)]) };
    w.bushes.push(o); return o;
  });

  // The friends and neighbours by the fold count as solid
  for (const nb of NEIGHBOURS) w.solids.push({ x: nb.x, y: nb.y, sr: 14 });

  // Collision grid: every obstacle inflated by BODY_R, so a walker is just a point
  const gw = Math.ceil(w.w / CS), gh = Math.ceil(w.h / CS);
  const grid = new Uint8Array(gw * gh), thorn = new Uint8Array(gw * gh);
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const x = (i + 0.5) * CS, y = (j + 0.5) * CS;
      grid[j * gw + i] = solidAt(w, x, y, BODY_R) ? 1 : 0;
      for (const b of w.bushes) if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r * 0.9) ** 2) { thorn[j * gw + i] = 1; break; }
    }
  }
  Object.assign(w, { gw, gh, grid, thorn });

  // Which cells can be walked to from the start?
  const reach = new Uint8Array(gw * gh);
  const s0 = Math.floor(start.y / CS) * gw + Math.floor(start.x / CS);
  if (grid[s0]) return null;
  const q = [s0]; reach[s0] = 1;
  while (q.length) {
    const cc = q.pop(), cx = cc % gw, cy = (cc / gw) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
      const n = ny * gw + nx;
      if (!reach[n] && !grid[n]) { reach[n] = 1; q.push(n); }
    }
  }
  w.reach = reach;
  const reachable = (x, y) => {
    const i = Math.floor(x / CS), j = Math.floor(y / CS);
    return i >= 0 && j >= 0 && i < gw && j < gh && reach[j * gw + i] === 1;
  };
  // the fold gate must be reachable too
  if (!reachable(HOME.x, HOME.y + 10)) return null;

  // Hide the lost sheep in a far-off thicket
  const cands = w.bushes.filter((b) => reachable(b.x, b.y + b.r * 0.2) || reachable(b.x, b.y))
    .map((b) => ({ b, d: Math.hypot(b.x - HOME.x, b.y - HOME.y) }));
  if (!cands.length) return null;
  const maxD = Math.max(...cands.map((o) => o.d));
  const far = cands.filter((o) => o.d > Math.max(maxD * 0.62, 700));
  if (!far.length) return null;
  w.sheepBush = far[Math.floor(Math.random() * far.length)].b;

  // Wolves' dens
  w.wolfSpawns = [];
  for (let k = 0; k < c.wolves; k++) {
    for (let tries = 0; tries < 300; tries++) {
      const x = rand(80, w.w - 80), y = rand(80, w.h - 80);
      if (!reachable(x, y) || Math.hypot(x - start.x, y - start.y) < Math.max(900, (w.w + w.h) * 0.3)) continue;
      if (Math.hypot(x - w.sheepBush.x, y - w.sheepBush.y) < 280) continue;
      if (w.wolfSpawns.some((o) => Math.hypot(o.x - x, o.y - y) < 500)) continue;
      w.wolfSpawns.push({ x, y });
      break;
    }
  }

  // Grass patches, tufts and anemones ("lilies of the field")
  for (let i = 0; i < area * 14; i++) {
    w.patches.push({ x: rand(0, w.w), y: rand(0, w.h), rx: rand(60, 170), ry: rand(30, 80), light: Math.random() < 0.55 });
  }
  const flowers = ['#e5484d', '#e5484d', '#f7c948', '#ffffff', '#c77dff'];
  for (let i = 0; i < area * 170; i++) {
    const x = rand(20, w.w - 20), y = rand(20, w.h - 20);
    const ci = Math.floor(x / CS) + Math.floor(y / CS) * gw;
    if (grid[ci] && !inFoldZone(x, y, 0) && w.streams.some((s) => distToPoly(s, x, y) < s.hw + 8)) continue;
    if (inFoldZone(x, y, 4)) continue;
    w.decor.push({ x, y, kind: Math.random() < 0.3 ? flowers[Math.floor(Math.random() * flowers.length)] : null, s: rand(0.7, 1.2) });
  }
  // Scrubby woods just past the edge of the map
  for (let x = -60; x < w.w + 100; x += 95) {
    w.border.push({ x: x + rand(-20, 20), y: rand(-70, -35), r: rand(40, 58) });
    w.border.push({ x: x + rand(-20, 20), y: w.h + rand(35, 70), r: rand(40, 58) });
  }
  for (let y = 40; y < w.h; y += 95) {
    w.border.push({ x: rand(-70, -35), y: y + rand(-20, 20), r: rand(40, 58) });
    w.border.push({ x: w.w + rand(35, 70), y: y + rand(-20, 20), r: rand(40, 58) });
  }
  return w;
}

function buildWorld(c) {
  for (let k = 0; k < 40; k++) {
    const w = tryWorld(c);
    if (w) return w;
  }
  // Very unlikely: fall back to a sparser map
  return tryWorld({ ...c, rockD: 2, treeD: 2, bushD: 4, ravines: 0 }) || tryWorld({ ...c, rockD: 0, treeD: 0, bushD: 3, ravines: 0 });
}

// ============================================================
//  Grid helpers & path finding
// ============================================================
function cellIdx(x, y) {
  const i = Math.floor(x / CS), j = Math.floor(y / CS);
  if (i < 0 || j < 0 || i >= world.gw || j >= world.gh) return -1;
  return j * world.gw + i;
}
function blockedAt(x, y) { const c = cellIdx(x, y); return c < 0 || world.grid[c] === 1; }
function thornAt(x, y) { const c = cellIdx(x, y); return c >= 0 && world.thorn[c] === 1; }

function nearestFree(c) {
  // the nearest open cell that can be reached from the fold (never an island)
  if (c < 0) return -1;
  if (!world.grid[c] && world.reach[c]) return c;
  const gw = world.gw, cx = c % gw, cy = (c / gw) | 0;
  let bestC = -1, bestD = Infinity;
  for (let r = 1; r <= 14 && bestC < 0; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= gw || ny >= world.gh) continue;
      const n = ny * gw + nx;
      if (!world.grid[n] && world.reach[n] && dx * dx + dy * dy < bestD) { bestD = dx * dx + dy * dy; bestC = n; }
    }
  }
  return bestC;
}

// Can you walk in a straight line from a to b? (thickets count as walls unless b is in one)
function lineClear(a, b) {
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const n = Math.max(1, Math.ceil(len / 8));
  const thornOk = thornAt(b.x, b.y) || thornAt(a.x, a.y);
  for (let k = 1; k <= n; k++) {
    const x = lerp(a.x, b.x, k / n), y = lerp(a.y, b.y, k / n);
    if (blockedAt(x, y)) return false;
    if (!thornOk && thornAt(x, y)) return false;
  }
  return true;
}

const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];

// A* over the grid (thickets cost extra), then pull the string tight
function findPath(x0, y0, x1, y1) {
  const { gw, gh, grid, thorn } = world;
  const s = nearestFree(cellIdx(x0, y0)), e = nearestFree(cellIdx(x1, y1));
  if (s < 0 || e < 0) return null;
  const endFree = !blockedAt(x1, y1) && cellIdx(x1, y1) === e;
  if (s === e) return [endFree ? { x: x1, y: y1 } : { x: (e % gw + 0.5) * CS, y: (((e / gw) | 0) + 0.5) * CS }];
  const N = gw * gh;
  const gS = new Float32Array(N).fill(1e9);
  const from = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const hI = [], hF = [];
  const push = (i, f) => {
    hI.push(i); hF.push(f);
    let k = hI.length - 1;
    while (k > 0) {
      const p = (k - 1) >> 1;
      if (hF[p] <= hF[k]) break;
      [hI[p], hI[k]] = [hI[k], hI[p]]; [hF[p], hF[k]] = [hF[k], hF[p]];
      k = p;
    }
  };
  const pop = () => {
    const top = hI[0];
    const li = hI.pop(), lf = hF.pop();
    if (hI.length) {
      hI[0] = li; hF[0] = lf;
      let k = 0;
      for (;;) {
        const l = 2 * k + 1, r = l + 1;
        let m = k;
        if (l < hI.length && hF[l] < hF[m]) m = l;
        if (r < hI.length && hF[r] < hF[m]) m = r;
        if (m === k) break;
        [hI[m], hI[k]] = [hI[k], hI[m]]; [hF[m], hF[k]] = [hF[k], hF[m]];
        k = m;
      }
    }
    return top;
  };
  const ex = e % gw, ey = (e / gw) | 0;
  const hfn = (i) => {
    const dx = Math.abs(i % gw - ex), dy = Math.abs(((i / gw) | 0) - ey);
    return dx + dy - 0.5858 * Math.min(dx, dy);
  };
  gS[s] = 0; push(s, hfn(s));
  let found = false;
  while (hI.length) {
    const c = pop();
    if (c === e) { found = true; break; }
    if (closed[c]) continue;
    closed[c] = 1;
    const cx = c % gw, cy = (c / gw) | 0;
    for (let k = 0; k < 8; k++) {
      const dx = DX8[k], dy = DY8[k], nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
      const n = ny * gw + nx;
      if (grid[n] || closed[n]) continue;
      if (dx && dy && (grid[cy * gw + nx] || grid[ny * gw + cx])) continue;   // no corner cutting
      const g = gS[c] + (dx && dy ? 1.4142 : 1) * (thorn[n] ? 3 : 1);
      if (g < gS[n]) { gS[n] = g; from[n] = c; push(n, g + hfn(n)); }
    }
  }
  if (!found) return null;
  const cells = [];
  for (let c = e; c !== s && c !== -1; c = from[c]) cells.push(c);
  cells.reverse();
  const pts = cells.map((c) => ({ x: (c % gw + 0.5) * CS, y: (((c / gw) | 0) + 0.5) * CS }));
  if (endFree) pts[pts.length - 1] = { x: x1, y: y1 };
  // String pulling: skip waypoints that can be seen directly
  const out = [];
  let cur = { x: x0, y: y0 }, i = 0;
  while (i < pts.length) {
    let j = Math.min(pts.length - 1, i + 30);
    while (j > i && !lineClear(cur, pts[j])) j--;
    out.push(pts[j]); cur = pts[j]; i = j + 1;
  }
  return out;
}

// Move with sliding: try each axis on its own
function moveBy(e, dx, dy) {
  const ox = e.x, oy = e.y;
  if (!blockedAt(e.x + dx, e.y)) e.x += dx;
  if (!blockedAt(e.x, e.y + dy)) e.y += dy;
  return Math.hypot(e.x - ox, e.y - oy);
}

function followPath(e, speed, dt) {
  while (e.path.length && Math.hypot(e.path[0].x - e.x, e.path[0].y - e.y) < 5) e.path.shift();
  if (!e.path.length) return false;
  const p = e.path[0];
  const dx = p.x - e.x, dy = p.y - e.y, len = Math.hypot(dx, dy);
  const step = Math.min(len, speed * dt);
  const moved = moveBy(e, dx / len * step, dy / len * step);
  if (Math.abs(dx) > 2) e.facing = dx > 0 ? 1 : -1;
  if (moved < step * 0.25) {
    e.stuckT = (e.stuckT || 0) + dt;
    if (e.stuckT > 0.5) { e.path.shift(); e.stuckT = 0; }
  } else e.stuckT = 0;
  e.walkPh = (e.walkPh || 0) + moved * 0.12;
  return moved > 0.01;
}

// ============================================================
//  Characters
// ============================================================
function newShepherd(p) {
  return {
    x: p.x, y: p.y, facing: 1, walkPh: 0, moving: false, path: [], target: null,
    carrying: false, face: 'calm', crookCd: 0, crookT: 0, stunT: 0, stuckT: 0,
  };
}

function newLostSheep(bush) {
  return {
    x: bush.x + bush.r * 0.2, y: bush.y + 2, bush, state: 'hidden', found: false,
    taps: cfg.taps, maxTaps: cfg.taps, mood: 'worried', path: [], facing: 1, walkPh: 0, hop: 0,
    d: { i: 1, blink: 0, blinkT: 2, hair: '#8a6f5a' },
  };
}

function newWolf(p, i) {
  return {
    x: p.x, y: p.y, home: { x: p.x, y: p.y }, state: 'patrol', path: [], idleT: rand(0.5, 2),
    repathT: 0, fleeT: 0, facing: 1, walkPh: 0, moving: false, alertT: 0, i, stuckT: 0,
  };
}

// The ninety and nine, snug in the fold
const FLOCK = [];
for (let r = 0; r < 9; r++) {
  for (let c = 0; c < 11; c++) {
    FLOCK.push({
      x: FOLD.x + 30 + c * ((FOLD.w - 60) / 10) + rand(-4, 4) + (r % 2 ? 6 : -6),
      y: FOLD.y + 52 + r * ((FOLD.h - 76) / 8) + rand(-3, 3),
      i: FLOCK.length, mood: 'worried', switchT: 0, delay: rand(0.05, 0.7),
      blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU), hair: '#8a6f5a', flip: Math.random() < 0.5 ? -1 : 1,
    });
  }
}

// Friends and neighbours who will rejoice (Luke 15:6)
const NEIGHBOURS = [
  { name: 'Miriam', robe: '#c46b8c', hair: '#3a2716', beard: false, skin: '#d7a070', scarf: '#e8dcc0', x: 98, y: 447, s: 0.95 },
  { name: 'Eli',    robe: '#5a6475', hair: '#9a9a9a', beard: true,  skin: '#c88e5a', x: 150, y: 463, s: 1 },
  { name: 'Tobiah', robe: '#6b8e3a', hair: '#4a2f1a', beard: false, skin: '#e3b184', x: 197, y: 450, s: 0.78 },
].map((d, i) => ({ ...d, i, mood: 'worried', switchT: 0, delay: rand(0.05, 0.5), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU) }));

function crowdMood() {
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (state === 'title' || !shep) return 'worried';
  if (shep.carrying && dist(shep, HOME) < 560) return 'wow';
  if (wolves.some((w) => w.state === 'chase' && dist(w, HOME) < 700)) return 'shock';
  return 'worried';
}

function updateCrowd(dt) {
  const target = crowdMood();
  for (const d of [...FLOCK, ...NEIGHBOURS]) {
    let want = target;
    // a few keep a hopeful eye on the Shepherd
    if (want === 'worried' && d.i % 4 === 0) want = 'watch';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
  const sd = sheep && sheep.d;
  if (sd) {
    sd.blinkT -= dt;
    if (sd.blinkT <= 0) { sd.blink = 0.13; sd.blinkT = rand(1.5, 4); }
    if (sd.blink > 0) sd.blink -= dt;
  }
}

// ============================================================
//  Faces (shared by sheep and people)
// ============================================================
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        eyes(3.5, 4, 2);
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

// ============================================================
//  Sheep
// ============================================================
// Head centred at (0, 0) with radius ~16, so drawFace fits exactly
function drawSheepHead(d, mood, lx, ly) {
  // ears
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#6b5548';
    ctx.beginPath(); ctx.ellipse(s * 18, -2, 9, 4.8, s * 0.35, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8a8a0';
    ctx.beginPath(); ctx.ellipse(s * 18.5, -1.5, 5.5, 2.4, s * 0.35, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#ecd0b2'; ctx.strokeStyle = '#c9a07c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 1, 15, 16, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // woolly fringe
  ctx.fillStyle = '#fbfaf4';
  ctx.beginPath();
  for (const [x, y, r] of [[-8, -13, 6], [0, -15, 7], [8, -13, 6]]) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  ctx.fill();
  // nose
  ctx.fillStyle = '#c98f7a';
  ctx.beginPath(); ctx.ellipse(0, 6, 3, 2, 0, 0, TAU); ctx.fill();
  drawFace(d, mood, 0, lx, ly);
}

function woolPuffs(cx, cy, rx, ry, r, n) {
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const a = (k / n) * TAU;
    const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
    ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU);
  }
  ctx.moveTo(cx + rx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
}

// A whole sheep standing at (x, y), front view
function drawSheep(x, y, s, d, mood, opts = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 30 * s, 8 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -(opts.jump || 0));
  ctx.scale(s, s);
  // legs
  for (const [lx, ph] of [[-20, 0], [-8, Math.PI], [8, 0], [20, Math.PI]]) {
    const lift = opts.walk ? Math.max(0, Math.sin(opts.walk + ph)) * 5 : 0;
    ctx.fillStyle = '#4a3f3a';
    roundRect(lx - 3.5, -18 - lift, 7, 18, 3); ctx.fill();
  }
  // body wool
  ctx.fillStyle = '#d9d5c8';
  woolPuffs(0, -30, 26, 13, 12, 10); ctx.fill();
  ctx.fillStyle = '#fbfaf4';
  woolPuffs(0, -33, 25, 12, 11.5, 10); ctx.fill();
  // tail peeking out
  ctx.beginPath(); ctx.arc(-30 * (opts.flip || 1), -38, 7, 0, TAU); ctx.fill();
  // head
  ctx.save();
  ctx.translate((opts.flip || 1) * 4, -30);
  drawSheepHead(d, mood, opts.lx || 0, opts.ly || 0);
  ctx.restore();
  ctx.restore();
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

// ============================================================
//  Neighbours (drawn like the disciples)
// ============================================================
function drawPerson(d) {
  const mood = d.mood, s = d.s;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s * CHAR, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s * CHAR, s * CHAR);

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  let lx = 0, ly = 0;
  if (shep) [lx, ly] = lookAt(d.x, d.y - 60, shep.x, shep.y - 50);

  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 2 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  if (mood === 'watch' || (mood === 'wow' && d.i % 2 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(d, mood, hy, lx, ly);

  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }
  ctx.restore();
}

// ============================================================
//  The Good Shepherd
// ============================================================
function drawCrook(x0, y0, x1, y1) {
  // staff from (x0,y0) (bottom) to (x1,y1) (top), with the hook curling forward
  const ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.lineCap = 'round';
  for (const [col, lw] of [['#5e3b1c', 5], ['#9a6a3a', 3]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    const cx = x1 + Math.cos(ang + Math.PI / 2) * -7, cy = y1 + Math.sin(ang + Math.PI / 2) * -7;
    ctx.arc(cx, cy, 7, ang + Math.PI / 2, ang + Math.PI / 2 - Math.PI * 1.25, true);
    ctx.stroke();
  }
}

function drawShepherd(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 7.5, 0, 0, TAU); ctx.fill();
  ctx.scale(CHAR * j.facing, CHAR);

  // sandals peeking out as He walks
  const step = j.moving ? Math.sin(j.walkPh) * 3.5 : 0;
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.ellipse(-5 + step, -1, 4.5, 2.6, 0, 0, TAU); ctx.ellipse(5 - step, -1, 4.5, 2.6, 0, 0, TAU); ctx.fill();
  const bob = j.moving ? Math.abs(Math.sin(j.walkPh)) * 2.2 : 0;
  ctx.translate(0, -bob);

  if (state === 'win') {
    const g = ctx.createRadialGradient(0, -38, 5, 0, -38, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -38, 75, 0, TAU); ctx.fill();
  }

  const carrying = j.carrying;
  // crook slung across His back while both hands hold the sheep
  if (carrying) drawCrook(-17, -4, 15, -76);

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  const arm = (hx, hy) => {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  };

  if (carrying) {
    // "he layeth it on his shoulders, rejoicing" (Luke 15:5)
    ctx.fillStyle = '#d9d5c8';
    woolPuffs(0, -45, 22, 8, 8.5, 9); ctx.fill();
    ctx.fillStyle = '#fbfaf4';
    woolPuffs(0, -47, 21, 7, 8, 9); ctx.fill();
    // dangling legs, held in His hands
    ctx.fillStyle = '#4a3f3a';
    roundRect(-26, -46, 6, 13, 3); ctx.fill(); roundRect(-21, -45, 6, 13, 3); ctx.fill();
    roundRect(15, -45, 6, 13, 3); ctx.fill(); roundRect(20, -46, 6, 13, 3); ctx.fill();
    arm(-21, -36); arm(21, -36);
  } else {
    let swing = j.crookT > 0 ? Math.sin((1 - j.crookT / 0.45) * Math.PI) : 0;
    arm(-18, -21);
    ctx.save();
    ctx.translate(21, -30);
    ctx.rotate(swing * 1.0);
    drawCrook(1, 32, 1, -46);
    ctx.restore();
    arm(21, -30);
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (j.face === 'oops') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -53, 2.8, 0, TAU); ctx.arc(4, -53, 2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.3, 0, TAU); ctx.arc(4, -53, 1.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
    if (j.face === 'effort') {
      ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6.5, -57.5); ctx.lineTo(-2, -56.5); ctx.moveTo(6.5, -57.5); ctx.lineTo(2, -56.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.face === 'oops') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 2, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  // The sheep's happy little head beside His
  if (carrying && sheep) {
    ctx.save();
    ctx.translate(25, -52);
    ctx.scale(0.55, 0.55);
    drawSheepHead(sheep.d, sheep.mood, 0.3, 0.2);
    ctx.restore();
  }
  ctx.restore();
}

// ============================================================
//  Wolves
// ============================================================
function drawWolf(w) {
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 8, 0, 0, TAU); ctx.fill();
  ctx.scale(CHAR * 0.95 * w.facing, CHAR * 0.95);
  const run = w.moving ? w.walkPh * 1.3 : 0;
  const bob = w.moving ? Math.abs(Math.sin(run)) * 2 : 0;
  const fleeing = w.state === 'flee', hunting = w.state === 'chase';

  // tail
  ctx.fillStyle = '#7d828c';
  ctx.beginPath();
  const tw = fleeing ? 10 : Math.sin(t * 6 + w.i) * 4;
  ctx.moveTo(-20, -26 - bob);
  ctx.quadraticCurveTo(-38, -30 - tw, -44, fleeing ? -12 : -40 - tw);
  ctx.quadraticCurveTo(-34, -24, -20, -20 - bob);
  ctx.fill();
  // legs
  ctx.fillStyle = '#6b707a';
  for (const [lx, ph] of [[-15, 0], [-8, Math.PI], [11, Math.PI], [18, 0]]) {
    const sw = w.moving ? Math.sin(run + ph) * 5 : 0;
    ctx.save(); ctx.translate(lx, -18 - bob); ctx.rotate(sw * 0.06);
    roundRect(-3, 0, 6, 18 + bob, 3); ctx.fill();
    ctx.restore();
  }
  ctx.translate(0, -bob);
  // body
  const g = ctx.createLinearGradient(0, -38, 0, -12);
  g.addColorStop(0, '#9aa0aa'); g.addColorStop(1, '#6f747e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, -26, 25, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d5d8dc';
  ctx.beginPath(); ctx.ellipse(4, -19, 15, 5, 0, 0, TAU); ctx.fill();
  // head
  ctx.save();
  ctx.translate(24, -36);
  ctx.fillStyle = '#8e939d';
  ctx.beginPath();
  ctx.moveTo(-5, -6); ctx.lineTo(-2, -20); ctx.lineTo(5, -8);
  ctx.moveTo(3, -8); ctx.lineTo(9, -19); ctx.lineTo(12, -4);
  ctx.fill();
  ctx.fillStyle = '#e3a9a0';
  ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(-1.5, -15); ctx.lineTo(2.5, -8); ctx.fill();
  ctx.fillStyle = '#8e939d';
  ctx.beginPath(); ctx.arc(2, 0, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9ccd1';
  ctx.beginPath(); ctx.ellipse(12, 3, 9, 5.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(20, 1.5, 2.6, 0, TAU); ctx.fill();
  // eye
  ctx.fillStyle = hunting ? '#ffe066' : '#fff';
  ctx.beginPath(); ctx.ellipse(5, -3, fleeing ? 3.6 : 3, fleeing ? 4 : 2.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(fleeing ? 4 : 6, -3, fleeing ? 1.4 : 1.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3b3f47'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (hunting) { ctx.moveTo(1, -8); ctx.lineTo(9, -5); }          // grumpy brow
  else if (fleeing) { ctx.moveTo(1, -9); ctx.lineTo(8, -10); }    // alarmed brow
  else { ctx.moveTo(1, -5.5); ctx.lineTo(9, -5.5); }             // sleepy lid
  ctx.stroke();
  // mouth
  ctx.strokeStyle = '#3b2020'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (fleeing) { ctx.fillStyle = '#7a2e22'; ctx.ellipse(13, 7, 3, 2.5, 0, 0, TAU); ctx.fill(); }
  else if (hunting) { ctx.moveTo(8, 7); ctx.lineTo(11, 6); ctx.lineTo(14, 7.5); ctx.lineTo(18, 6); ctx.stroke(); }
  else { ctx.arc(13, 5, 3, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (fleeing) {
    ctx.fillStyle = '#7cc4f2';
    ctx.beginPath(); ctx.moveTo(-6, -12); ctx.quadraticCurveTo(-2, -5, -6, -4); ctx.quadraticCurveTo(-10, -5, -6, -12); ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  if (w.alertT > 0) {
    ctx.font = '700 30px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText('!', w.x, w.y - 78);
    ctx.fillStyle = '#d9480f'; ctx.fillText('!', w.x, w.y - 78);
  }
}

// ============================================================
//  Scenery
// ============================================================
function drawTree(o) {
  const { x, y, r } = o;
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(x + 8, y + 2, r * 1.15, r * 0.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a2b';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.2, y); ctx.quadraticCurveTo(x - r * 0.1, y - r * 0.7, x - r * 0.06, y - r * 1.3);
  ctx.lineTo(x + r * 0.1, y - r * 1.3); ctx.quadraticCurveTo(x + r * 0.12, y - r * 0.6, x + r * 0.22, y);
  ctx.closePath(); ctx.fill();
  // fade the canopy if the Shepherd walks behind it
  const behind = shep && shep.y < y && shep.y > y - r * 2.6 && Math.abs(shep.x - x) < r * 1.2;
  ctx.globalAlpha = behind ? 0.55 : 1;
  const cy = y - r * 1.55;
  const olive = o.kind === 'olive';
  const cols = olive ? ['#5f8448', '#7d9f5d', '#a3c07f'] : ['#3f7a3a', '#56994a', '#7cbf61'];
  const blob = [[-0.6, 0.1, 0.62], [0.55, 0.12, 0.6], [0, -0.35, 0.72], [-0.2, 0.3, 0.55], [0.3, 0.32, 0.5]];
  for (let k = 0; k < 3; k++) {
    ctx.fillStyle = cols[k];
    ctx.beginPath();
    for (const [dx, dy, rr] of blob) {
      const R = r * rr * (1 - k * 0.22), X = x + dx * r - k * r * 0.12, Y = cy + dy * r - k * r * 0.14;
      ctx.moveTo(X + R, Y); ctx.arc(X, Y, R, 0, TAU);
    }
    ctx.fill();
  }
  if (olive) {   // a few olives
    ctx.fillStyle = '#4a3a5a';
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(o.ph + k * 1.7) * r * 0.5, cy + Math.sin(o.ph + k * 2.3) * r * 0.35, 2.4, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawRock(o) {
  const { x, y, r } = o;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x + 4, y + 2, r * 1.1, r * 0.42, 0, 0, TAU); ctx.fill();
  const cy = y - r * 0.4;
  const g = ctx.createLinearGradient(x - r, cy - r, x + r, cy + r);
  g.addColorStop(0, '#cfc8ba'); g.addColorStop(1, '#8d867a');
  ctx.fillStyle = g; ctx.strokeStyle = '#6f695f'; ctx.lineWidth = 2;
  ctx.beginPath();
  const n = o.jag.length;
  for (let k = 0; k <= n; k++) {
    const a = (k / n) * TAU, rr = r * o.jag[k % n];
    const px = x + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.8;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.3, cy - r * 0.35, r * 0.35, r * 0.18, -0.4, 0, TAU); ctx.fill();
}

function drawBush(o) {
  const { x, y, r } = o;
  const wig = o.wig > 0 ? Math.sin(t * 40) * o.wig * 3 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(x + 3, y + 3, r * 1.05, r * 0.42, 0, 0, TAU); ctx.fill();
  const cy = y - r * 0.35;
  ctx.save();
  ctx.translate(x + wig, cy);
  for (const [col, dy, k] of [['#35592a', 4, 1.05], ['#4f7a3a', 0, 1], ['#658f45', -4, 0.72]]) {
    ctx.fillStyle = col;
    ctx.beginPath();
    for (const [px, py, pr] of o.puffs) { ctx.moveTo(px * k + pr * k, py * k + dy); ctx.arc(px * k, py * k + dy, pr * k, 0, TAU); }
    ctx.fill();
  }
  // thorns and berries
  ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = o.ph + k * 2.4, rr = r * (0.55 + (k % 3) * 0.12);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.45 - 4;
    ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 6, py + Math.sin(a) * 4 - 2);
  }
  ctx.stroke();
  ctx.fillStyle = '#c0392b';
  for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(Math.cos(o.ph * 3 + k * 1.3) * r * 0.5, Math.sin(o.ph + k * 1.9) * r * 0.25 - 6, 2.2, 0, TAU); ctx.fill(); }
  ctx.restore();
  // the lost sheep peeking out
  if (sheep && sheep.bush === o && (sheep.state === 'hidden' || sheep.state === 'stuck')) {
    ctx.save();
    ctx.translate(x + r * 0.25 + wig, y - r * 0.75 - (sheep.found ? 4 : 0));
    ctx.rotate(Math.sin(t * 2) * 0.08);
    ctx.scale(0.72, 0.72);
    const [lx, ly] = shep ? lookAt(x, y, shep.x, shep.y) : [0, 0];
    drawSheepHead(sheep.d, sheep.mood, lx, ly);
    ctx.restore();
    // a little thorny branch across the front
    ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - r * 0.2 + wig, y - r * 0.35); ctx.lineTo(x + r * 0.75 + wig, y - r * 0.8); ctx.stroke();
  }
}

function drawStreamPath(s) {
  if (!s.path) {
    const p = new Path2D(), pts = s.pts;
    p.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      p.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
    }
    p.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    s.path = p;
  }
  return s.path;
}

function drawWaters(v) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of world.streams) {
    const b = s.bbox;
    if (b.x1 + 80 < v.x0 || b.x0 - 80 > v.x1 || b.y1 + 80 < v.y0 || b.y0 - 80 > v.y1) continue;
    const p = drawStreamPath(s);
    if (s.kind === 'water') {
      ctx.strokeStyle = '#d9c68f'; ctx.lineWidth = s.hw * 2 + 16; ctx.stroke(p);
      ctx.strokeStyle = '#3f95d4'; ctx.lineWidth = s.hw * 2; ctx.stroke(p);
      ctx.strokeStyle = '#6bb8ec'; ctx.lineWidth = s.hw * 2 - 16; ctx.stroke(p);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
      ctx.setLineDash([14, 34]); ctx.lineDashOffset = -t * 40;
      ctx.stroke(p);
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = '#a08a68'; ctx.lineWidth = s.hw * 2 + 14; ctx.stroke(p);
      ctx.strokeStyle = '#5a4332'; ctx.lineWidth = s.hw * 2; ctx.stroke(p);
      ctx.strokeStyle = '#2b1f16'; ctx.lineWidth = s.hw * 1.1; ctx.stroke(p);
    }
  }
  // stepping-stone fords
  for (const s of world.streams) {
    for (const c of s.crossings) {
      if (c.x < v.x0 - 100 || c.x > v.x1 + 100 || c.y < v.y0 - 100 || c.y > v.y1 + 100) continue;
      const nx = -c.ty, ny = c.tx;
      for (let row = -1; row <= 1; row++) {
        for (let k = -2; k <= 2; k++) {
          const off = (k + (row === 0 ? 0.5 : 0)) * s.hw * 0.48;
          if (Math.abs(off) > s.hw + 6) continue;
          const sx = c.x + nx * off + c.tx * row * 20, sy = c.y + ny * off + c.ty * row * 20;
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.beginPath(); ctx.ellipse(sx + 1, sy + 3, 11, 8, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = '#b9b2a4';
          ctx.beginPath(); ctx.ellipse(sx, sy, 11, 8, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = '#d8d2c6';
          ctx.beginPath(); ctx.ellipse(sx - 2, sy - 2, 6, 3.5, 0, 0, TAU); ctx.fill();
        }
      }
    }
  }
}

function drawGround(v) {
  // beyond the map: thick scrub
  ctx.fillStyle = '#4f7e3a';
  ctx.fillRect(v.x0 - 10, v.y0 - 10, v.x1 - v.x0 + 20, v.y1 - v.y0 + 20);
  const g = ctx.createLinearGradient(0, 0, world.w, world.h);
  g.addColorStop(0, '#98cf6c'); g.addColorStop(1, '#84c060');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, world.w, world.h);
  for (const p of world.patches) {
    if (p.x + p.rx < v.x0 || p.x - p.rx > v.x1 || p.y + p.ry < v.y0 || p.y - p.ry > v.y1) continue;
    ctx.fillStyle = p.light ? 'rgba(190,230,140,0.35)' : 'rgba(90,150,60,0.22)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU); ctx.fill();
  }
  // tufts and flowers
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#5f9a42'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const d of world.decor) {
    if (d.x < v.x0 - 10 || d.x > v.x1 + 10 || d.y < v.y0 - 10 || d.y > v.y1 + 10 || d.kind) continue;
    const s = d.s * 5;
    ctx.moveTo(d.x - s, d.y - s * 1.2); ctx.lineTo(d.x, d.y); ctx.lineTo(d.x + s, d.y - s * 1.2);
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - s * 1.5);
  }
  ctx.stroke();
  for (const d of world.decor) {
    if (!d.kind || d.x < v.x0 - 10 || d.x > v.x1 + 10 || d.y < v.y0 - 10 || d.y > v.y1 + 10) continue;
    ctx.fillStyle = d.kind;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; ctx.moveTo(d.x + Math.cos(a) * 3.2 + 2.6, d.y + Math.sin(a) * 3.2); ctx.arc(d.x + Math.cos(a) * 3.2, d.y + Math.sin(a) * 3.2, 2.6, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = '#3b2f1e';
    ctx.beginPath(); ctx.arc(d.x, d.y, 1.6, 0, TAU); ctx.fill();
  }
  // the edge of the pasture
  ctx.strokeStyle = 'rgba(60,100,40,0.5)'; ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, world.w, world.h);
}

function drawBorderTrees(v) {
  for (const b of world.border) {
    if (b.x + b.r < v.x0 || b.x - b.r > v.x1 || b.y + b.r < v.y0 - 40 || b.y - b.r > v.y1 + 40) continue;
    ctx.fillStyle = '#3d6b2e';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4c7f37';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.65, 0, TAU); ctx.fill();
  }
}

// The sheepfold: a low stone wall, straw inside, the gate open wide
function stoneRow(x0, y0, x1, y1, thick) {
  const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / 17));
  for (let k = 0; k < n; k++) {
    const f = (k + 0.5) / n;
    const x = lerp(x0, x1, f), y = lerp(y0, y1, f);
    const shadeK = ((k * 7) % 5) * 8;
    ctx.fillStyle = `rgb(${160 + shadeK},${152 + shadeK},${138 + shadeK})`;
    roundRect(x - 9, y - thick / 2, 18, thick, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(80,70,60,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}

function drawFoldBack() {
  const f = FOLD, th = 18;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  roundRect(f.x - 4, f.y + 6, f.w + 12, f.h + 6, 14); ctx.fill();
  ctx.fillStyle = '#e8d49a';
  roundRect(f.x, f.y, f.w, f.h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(190,160,90,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let k = 0; k < 60; k++) {
    const x = f.x + 12 + ((k * 53) % (f.w - 24)), y = f.y + 16 + ((k * 37) % (f.h - 30));
    ctx.moveTo(x, y); ctx.lineTo(x + 7, y - 3);
  }
  ctx.stroke();
  // back and side walls
  stoneRow(f.x + 6, f.y + th / 2, f.x + f.w - 6, f.y + th / 2, th);
  stoneRow(f.x + th / 2, f.y + th, f.x + th / 2, f.y + f.h - 4, th);
  stoneRow(f.x + f.w - th / 2, f.y + th, f.x + f.w - th / 2, f.y + f.h - 4, th);
}

function drawFoldFront() {
  const f = FOLD, th = 20, gx0 = GATE.x - GATE.gap / 2, gx1 = GATE.x + GATE.gap / 2;
  const y = f.y + f.h - th / 2;
  stoneRow(f.x + 4, y, gx0, y, th);
  stoneRow(gx1, y, f.x + f.w - 4, y, th);
  // gate posts and the open wooden gate
  ctx.fillStyle = '#7a5230';
  roundRect(gx0 - 6, y - 26, 12, 34, 3); ctx.fill();
  roundRect(gx1 - 6, y - 26, 12, 34, 3); ctx.fill();
  ctx.strokeStyle = '#a97a48'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(gx1 + 4, y - 18); ctx.lineTo(gx1 + 30, y + 26);
  ctx.moveTo(gx1 + 4, y - 4); ctx.lineTo(gx1 + 30, y + 38);
  ctx.moveTo(gx1 + 6, y - 14); ctx.lineTo(gx1 + 28, y + 34);
  ctx.stroke();
  // lantern on the gate post
  const glow = 0.5 + nightF * 0.5;
  const lg = ctx.createRadialGradient(gx0, y - 34, 2, gx0, y - 34, 40);
  lg.addColorStop(0, `rgba(255,220,120,${0.7 * glow})`); lg.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(gx0, y - 34, 40, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd766';
  roundRect(gx0 - 5, y - 42, 10, 12, 3); ctx.fill();
  ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawFlock(v) {
  if (FOLD.x + FOLD.w < v.x0 - 40 || FOLD.x > v.x1 + 40 || FOLD.y + FOLD.h < v.y0 - 40 || FOLD.y > v.y1 + 60) return;
  const lookX = shep ? shep.x : HOME.x, lookY = shep ? shep.y - 40 : HOME.y;
  for (const d of FLOCK) {
    let jump = 0;
    if (d.mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 14;
    else if (d.mood === 'shock') jump = Math.max(0, Math.sin(t * 30 + d.phase)) * 2;
    else if (d.mood === 'wow') jump = Math.abs(Math.sin(t * 4 + d.phase)) * 3;
    const [lx, ly] = lookAt(d.x, d.y - 20, lookX, lookY);
    drawSheep(d.x, d.y, 0.48, d, d.mood, { jump, lx, ly, flip: d.flip });
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, heart = false) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, heart });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = p.size * (0.5 + a * 0.5);
    ctx.beginPath();
    if (p.heart) {
      ctx.moveTo(p.x, p.y + s);
      ctx.bezierCurveTo(p.x - s * 1.6, p.y - s * 0.2, p.x - s * 0.6, p.y - s * 1.4, p.x, p.y - s * 0.4);
      ctx.bezierCurveTo(p.x + s * 0.6, p.y - s * 1.4, p.x + s * 1.6, p.y - s * 0.2, p.x, p.y + s);
    } else ctx.arc(p.x, p.y, s, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function hearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    spawn(x + rand(-20, 20), y + rand(-10, 10), rand(-40, 40), rand(-90, -40), rand(0.9, 1.6),
      ['#ff6b8a', '#ffd1e8', '#ffe27a'][i % 3], rand(4, 7), 20, i % 3 !== 2);
  }
}

// ============================================================
//  Play logic
// ============================================================
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function setWalkTarget(x, y) {
  const p = findPath(shep.x, shep.y, x, y);
  shep.path = p || [{ x, y }];
  shep.target = { x, y };
  shep.stuckT = 0;
}

function keyDir() {
  let x = 0, y = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
  const l = Math.hypot(x, y);
  return l ? { x: x / l, y: y / l } : null;
}

function updateShepherd(dt) {
  const j = shep;
  j.crookCd = Math.max(0, j.crookCd - dt);
  j.crookT = Math.max(0, j.crookT - dt);
  j.stunT = Math.max(0, j.stunT - dt);
  const inThorn = thornAt(j.x, j.y);
  const speed = WALK * (j.carrying ? CARRY_MUL : 1) * (inThorn ? THORN_MUL : 1);
  j.moving = false;
  if (j.stunT <= 0) {
    const kd = keyDir();
    if (kd) {
      j.path = []; j.target = null;
      const moved = moveBy(j, kd.x * speed * dt, kd.y * speed * dt);
      if (kd.x) j.facing = kd.x > 0 ? 1 : -1;
      j.walkPh += moved * 0.12;
      j.moving = moved > 0.01;
    } else if (j.path.length) {
      j.moving = followPath(j, speed, dt);
      if (!j.path.length) j.target = null;
    }
  }
  if (j.moving && inThorn && Math.random() < dt * 8) {
    spawn(j.x + rand(-14, 14), j.y - rand(0, 20), rand(-30, 30), rand(-50, -20), 0.5, '#4f7a3a', rand(2, 3.5), 80);
  }
  // Face
  if (j.stunT > 0) j.face = 'oops';
  else if (j.carrying) j.face = 'joy';
  else if (inThorn && j.moving) j.face = 'effort';
  else j.face = 'calm';

  // Finding the sheep
  const d = dist(j, sheep);
  if (sheep.state === 'hidden' && d < FIND_R) {
    sheep.found = true;
    sheep.state = 'stuck';
    sheep.bush.wig = 0.6;
    j.path = []; j.target = null;
    showMessage('Found it! Caught in the thorns...', 2);
    queueMessage(isTouch() ? `Tap the sheep to free it (${sheep.taps}×)` : `Press Space to free it (${sheep.taps}×)`, 2.4);
    sfx.baa(0.55, 0, 1, 1.15);
    playFound();
  } else if (sheep.state === 'free' && d < PICK_R) {
    pickUp();
  }

  // Home to the fold!
  if (j.carrying && dist(j, HOME) < 75) win();
}

function playFound() { if (sfx.ctx) playTapNote(sfx.ctx, sfx.master, sfx.ctx.currentTime + 0.05, 0.8); }

function freeStep() {
  if (sheep.state !== 'stuck' || dist(shep, sheep) > REACH) return false;
  sheep.taps--;
  sheep.bush.wig = 0.35;
  shep.crookT = 0.3;
  shep.facing = sheep.x >= shep.x ? 1 : -1;
  for (let i = 0; i < 8; i++) {
    spawn(sheep.x + rand(-20, 20), sheep.y - rand(10, 40), rand(-80, 80), rand(-120, -40), 0.7,
      i % 3 ? '#4f7a3a' : '#6b3f1f', rand(2, 4), 220);
  }
  sfx.puff(0.3);
  if (sfx.ctx) playTapNote(sfx.ctx, sfx.master, sfx.ctx.currentTime + 0.01, 1 - sheep.taps / sheep.maxTaps);
  if (sheep.taps <= 0) pickUp();
  else hint = { text: `${sheep.taps} more!`, t: 1, color: '#7a5200' };
  return true;
}

function pickUp() {
  sheep.state = 'carried';
  sheep.found = true;
  shep.carrying = true;
  shep.path = []; shep.target = null;
  hearts(shep.x, shep.y - 70, 10);
  hint.t = 0;
  showMessage(Bible.verse(VERSES.shoulders).text, 2.2);
  queueMessage('Now carry it home to the fold', 2.2);
  sfx.baa(0.5, 0, 1, 1.25);
  playFound();
}

function dropSheep(w) {
  shep.carrying = false;
  sheep.state = 'fleeing';
  sheep.x = shep.x; sheep.y = shep.y;
  // bolt away from the wolf
  let best = null;
  for (let k = 0; k < 24 && !best; k++) {
    const away = Math.atan2(shep.y - w.y, shep.x - w.x) + rand(-1.2, 1.2);
    const r = rand(170, 260);
    const tx = shep.x + Math.cos(away) * r, ty = shep.y + Math.sin(away) * r;
    const c = cellIdx(tx, ty);
    if (c >= 0 && !world.grid[c] && world.reach[c]) best = { x: tx, y: ty };
  }
  sheep.path = best ? (findPath(sheep.x, sheep.y, best.x, best.y) || []) : [];
  showMessage('Oh no! The sheep took fright and ran!', 2.4);
  sfx.baa(0.6, 0, 1, 1.35);
}

function updateSheep(dt) {
  const s = sheep;
  const wolfNear = wolves.some((w) => dist(w, s) < 260 && w.state !== 'flee');
  if (s.bush.wig > 0) s.bush.wig = Math.max(0, s.bush.wig - dt);
  s.hop = Math.max(0, s.hop - dt);
  switch (s.state) {
    case 'hidden':
    case 'stuck':
      s.mood = wolfNear ? 'shock' : dist(s, shep) < 300 ? 'wow' : 'worried';
      break;
    case 'fleeing':
      s.mood = 'shock';
      if (!followPath(s, 190, dt) || !s.path.length) { s.state = 'free'; s.path = []; }
      break;
    case 'free':
      s.mood = wolfNear ? 'shock' : 'worried';
      break;
    case 'carried':
      s.x = shep.x; s.y = shep.y;
      s.mood = wolfNear ? 'shock' : 'joy';
      break;
    case 'home':
      s.mood = 'joy';
      break;
  }
}

// The lost sheep calls out now and then; the nearer you are, the louder
function updateBaa(dt) {
  for (let i = baaRings.length - 1; i >= 0; i--) { baaRings[i].t += dt; if (baaRings[i].t > 1.5) baaRings.splice(i, 1); }
  if (sheep.state === 'carried' || sheep.state === 'home') return;
  baaT -= dt;
  if (baaT > 0) return;
  const d = dist(shep, sheep);
  baaT = d < 450 ? 2.2 : cfg.baaEvery;
  const prox = clamp(1 - d / 2400, 0, 1);
  sfx.baa(0.05 + 0.55 * prox * prox, clamp((sheep.x - shep.x) / 700, -1, 1), prox, 1.1);
  baaRings.push({ t: 0, x: sheep.x, y: sheep.y - 20, warm: clamp(1 - d / 1600, 0, 1) });
  if (sheep.bush && sheep.state !== 'free') sheep.bush.wig = Math.max(sheep.bush.wig, 0.3);
  sheep.hop = 0.3;
  if (sheep.state === 'hidden') {
    if (d < 320 && !nearWarned) { nearWarned = true; hint = { text: 'Very close now!', t: 1.8, color: '#d9480f' }; }
    else if (lastBaaDist !== null) {
      if (d < lastBaaDist - 50) hint = { text: 'Warmer...', t: 1.6, color: '#d9480f' };
      else if (d > lastBaaDist + 50) hint = { text: 'Colder...', t: 1.6, color: '#2c7fb8' };
    }
    lastBaaDist = d;
  }
}

function randomPatrolPoint(w) {
  for (let k = 0; k < 20; k++) {
    const a = rand(0, TAU), r = rand(120, 520);
    const x = w.home.x + Math.cos(a) * r, y = w.home.y + Math.sin(a) * r;
    const c = cellIdx(x, y);
    if (c >= 0 && !world.grid[c] && world.reach[c] && Math.hypot(x - HOME.x, y - HOME.y) > SAFE_R + 100) return { x, y };
  }
  return { x: w.home.x, y: w.home.y };
}

function updateWolves(dt) {
  for (const w of wolves) {
    const d = dist(w, shep);
    const homeD = dist(shep, HOME);
    const slow = thornAt(w.x, w.y) ? THORN_MUL : 1;
    w.alertT = Math.max(0, w.alertT - dt);
    if (w.state === 'flee') {
      w.fleeT -= dt;
      let ax = w.x - shep.x, ay = w.y - shep.y;
      const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
      const sp = 250 * slow * dt;
      let moved = moveBy(w, ax * sp, ay * sp);
      if (moved < sp * 0.3) moved += moveBy(w, -ay * sp * (w.i % 2 ? 1 : -1), ax * sp * (w.i % 2 ? 1 : -1));
      w.walkPh += moved * 0.12;
      w.moving = moved > 0.01;
      if (Math.abs(ax) > 0.1) w.facing = ax > 0 ? 1 : -1;
      if (w.fleeT <= 0) { w.state = 'patrol'; w.path = []; w.idleT = 1.5; w.home = { x: w.x, y: w.y }; }
      continue;
    }
    if (w.state === 'patrol') {
      if (d < cfg.sight && homeD > SAFE_R) {
        w.state = 'chase'; w.alertT = 1; w.repathT = 0;
        sfx.growl();
        if (!wolfWarned) {
          wolfWarned = true;
          showMessage(isTouch() ? 'A wolf! Tap it to shoo it away' : 'A wolf! Press Space to shoo it away', 2.6);
        }
      } else {
        if (!w.path.length) {
          w.moving = false;
          w.idleT -= dt;
          if (w.idleT <= 0) { const p = randomPatrolPoint(w); w.path = findPath(w.x, w.y, p.x, p.y) || []; w.idleT = rand(1, 2.5); }
        } else w.moving = followPath(w, 75 * slow, dt);
        continue;
      }
    }
    if (w.state === 'chase') {
      if (d > cfg.sight + 260 || homeD < SAFE_R) {
        w.state = 'patrol'; w.path = []; w.idleT = 1.5;
        continue;
      }
      w.repathT -= dt;
      if (d < 70 && lineClear(w, shep)) w.path = [{ x: shep.x, y: shep.y }];
      else if (w.repathT <= 0) { w.path = findPath(w.x, w.y, shep.x, shep.y) || [{ x: shep.x, y: shep.y }]; w.repathT = 0.4; }
      w.moving = followPath(w, cfg.wolfSpeed * slow, dt);
      if (d < CATCH_R) wolfCatch(w);
    }
  }
}

function wolfCatch(w) {
  caught++;
  w.state = 'flee'; w.fleeT = 3.5; w.path = [];
  shep.stunT = 0.6;
  shakeT = 0.4;
  sfx.growl();
  sfx.bounce();
  if (shep.carrying) dropSheep(w);
  else {
    dayLeft = Math.max(0.5, dayLeft - 6);
    showMessage('The wolf gave Him a fright! (−6s of daylight)', 2.4);
  }
}

function tryShoo(w) {
  if (dist(w, shep) > SHOO_R) { hint = { text: 'Get closer to shoo the wolf', t: 1.4, color: '#7a5200' }; return false; }
  if (shep.crookCd > 0) { hint = { text: `Crook ready in ${shep.crookCd.toFixed(1)}s`, t: 1.2, color: '#7a5200' }; return false; }
  w.state = 'flee'; w.fleeT = 5; w.path = []; w.alertT = 0;
  shep.crookCd = SHOO_CD; shep.crookT = 0.45;
  shep.facing = w.x >= shep.x ? 1 : -1;
  for (let i = 0; i < 14; i++) {
    const a = rand(0, TAU);
    spawn(w.x + Math.cos(a) * 20, w.y - 30 + Math.sin(a) * 14, Math.cos(a) * 90, Math.sin(a) * 60, 0.6, i % 2 ? '#ffe27a' : '#ffffff', rand(2, 4));
  }
  showMessage(['Shoo! Off you go!', 'Away, wolf!', 'Not My sheep!'][Math.floor(Math.random() * 3)], 1.4);
  sfx.shoo();
  return true;
}

function actionKey() {
  if (state !== 'play') return;
  const near = wolves.filter((w) => w.state !== 'flee' && dist(w, shep) < SHOO_R).sort((a, b) => dist(a, shep) - dist(b, shep))[0];
  if (near) { tryShoo(near); return; }
  if (!freeStep() && sheep.state === 'stuck') hint = { text: 'Get closer to the sheep', t: 1.2, color: '#7a5200' };
}

function handleTap(x, y) {
  ripples.push({ x, y, t: 0 });
  // a wolf?
  for (const w of wolves) {
    if (w.state !== 'flee' && Math.hypot(x - w.x, y - (w.y - 25)) < 70) {
      if (tryShoo(w) || dist(w, shep) <= SHOO_R) return;
    }
  }
  // the stuck sheep?
  if (sheep.state === 'stuck' && Math.hypot(x - sheep.x, y - (sheep.y - 25)) < 75) {
    if (freeStep()) return;
  }
  setWalkTarget(x, y);
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  shep.carrying = false;
  shep.path = []; shep.target = null; shep.face = 'joy';
  sheep.state = 'home';
  sheep.x = GATE.x - 34; sheep.y = GATE.y + 22;
  const timeBonus = Math.round(dayLeft) * 15;
  const wolfBonus = caught === 0 ? 400 : 0;
  const levelBonus = level * 500;
  const score = timeBonus + wolfBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('lostSheepBest', best); } catch (e) {} }
  lastScore = { timeBonus, wolfBonus, levelBonus, score };
  hearts(shep.x, shep.y - 60, 24);
  for (let i = 0; i < 60; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(HOME.x, HOME.y - 60, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  for (const w of wolves) { w.state = 'flee'; w.fleeT = 99; }
  showMessage(Bible.verse(VERSES.rejoice).text.replace(/[‘’]/g, ''), 2.4);
  queueMessage(Bible.verse(VERSES.foundSheep).text, 2.4);
  sfx.win();
  sfx.flockBaa();
  endTimer = 4;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  shep.face = 'oops';
  shep.path = [];
  showMessage('The sun has set...', 2.4);
  sfx.fail();
  endTimer = 2.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; msgQueue.length = 0; }
function queueMessage(text, dur = 2.2) {
  if (message.t <= 0) message = { text, t: dur };
  else msgQueue.push({ text, t: dur });
}

function startLevel() {
  cfg = makeConfig(level);
  world = buildWorld(cfg);
  resetLevelState();
  wolves = world.wolfSpawns.map(newWolf);
  wolfWarned = level > 2;
  nightF = cfg.darkBase;
  snapCamera();
  state = 'play';
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  queueMessage('...97, 98, 99. One is missing!', 2.4);
  if (level === 1) queueMessage(isTouch() ? 'Tap where you want to walk' : 'Walk with the arrow keys or WASD', 2.6);
  queueMessage('Listen for the baa...', 2.2);
  sfx.levelStart();

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay(Bible.verse(VERSES.rejoice).text.replace(/[‘’]/g, ''), `Level ${level} complete — ${cfg.name}`,
      `${verseHTML(VERSES.cometHome)}
       <p class="score">Daylight left: <b>${s.timeBonus}</b><br>${s.wolfBonus ? `No wolf trouble: <b>${s.wolfBonus}</b><br>` : ''}Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Field', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    showOverlay('Night has fallen', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The sun set before the little sheep was home. But the Good Shepherd never gives up &mdash; try again at first light!</p>
       ${verseHTML(VERSES.goodShepherd)}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

const keys = new Set();
let downInfo = null;
function tapQueueClear() { downInfo = null; }

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if ((e.code === 'Space' || e.code === 'KeyE') && !e.repeat) { actionKey(); return; }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toScreen(e) {
  return { x: e.clientX * dpr / scale, y: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toScreen(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 6) { b.action(); downInfo = null; return; }
  }
  downInfo = { x: p.x, y: p.y };
});
// A tap is a press and release in (roughly) the same spot
canvas.addEventListener('pointerup', (e) => {
  sfx.init();   // iOS only unlocks audio on some gestures, so try again when the finger lifts
  if (!downInfo) return;
  const p = toScreen(e);
  const moved = Math.hypot(p.x - downInfo.x, p.y - downInfo.y);
  downInfo = null;
  if (state !== 'play' || moved > 40) return;
  handleTap(p.x + cam.x, p.y + cam.y);
});
canvas.addEventListener('pointercancel', () => { downInfo = null; });
