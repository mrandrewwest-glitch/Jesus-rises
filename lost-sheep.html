// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note, pitched by a 0..1 "height"
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // A sheep's "baa-aa": a buzzy voice through bleat formants, with a wobbly tremolo.
  // Quiet, muffled and panned to one side when far away; loud and clear up close.
  baa(vol = 0.3, pan = 0, bright = 1, pitch = 1, delay = 0) {
    if (!this.ctx) return;
    const ac = this.ctx, t0 = ac.currentTime + 0.01 + delay, dur = 0.8;
    const f0 = 300 * pitch;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 * 1.18, t0);
    o.frequency.linearRampToValueAtTime(f0, t0 + 0.1);
    o.frequency.linearRampToValueAtTime(f0 * 0.9, t0 + dur);
    const vib = ac.createOscillator(), vibD = ac.createGain();
    vib.frequency.value = 7.5; vibD.gain.value = f0 * 0.04;
    vib.connect(vibD); vibD.connect(o.frequency);
    const mix = ac.createGain(); mix.gain.value = 1;
    [[620, 5, 1], [1650, 8, 0.6], [2600, 10, 0.3]].forEach(([f, q, a]) => {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const g = ac.createGain(); g.gain.value = a * 3;
      o.connect(bp); bp.connect(g); g.connect(mix);
    });
    // "b-a-a-a": amplitude tremolo
    const trem = ac.createGain(); trem.gain.value = 0.65;
    const tl = ac.createOscillator(), tlD = ac.createGain();
    tl.frequency.value = 11; tlD.gain.value = 0.35;
    tl.connect(tlD); tlD.connect(trem.gain);
    const env = ac.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(vol, t0 + 0.05);
    env.gain.setValueAtTime(vol, t0 + dur * 0.55);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700 + 5000 * clamp(bright, 0, 1);
    mix.connect(trem); trem.connect(env); env.connect(lp);
    let last = lp;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); lp.connect(p); last = p; }
    last.connect(this.master);
    for (const n of [o, vib, tl]) { n.start(t0); n.stop(t0 + dur + 0.05); }
  },
  // The ninety and nine join in
  flockBaa() {
    for (let k = 0; k < 8; k++) this.baa(0.12, rand(-0.8, 0.8), 1, rand(0.85, 1.35), 0.2 + k * 0.22);
  },
  growl() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 6;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.7, t0 + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.75);
  },
  shoo() {
    this.puff(0.4);
    this.tone(520, 0.25, 'triangle', 0.25, 0, 260);
  },
};

// ============================================================
//  Camera & rendering
// ============================================================
function camTarget() {
  if (state === 'title' || !shep) return { x: FOLD.x + FOLD.w / 2 + 60 - viewW / 2, y: FOLD.y + FOLD.h / 2 + 70 - viewH / 2 };
  return { x: shep.x - viewW / 2, y: shep.y - 40 - viewH / 2 };
}
function clampCam(c) {
  const pad = 60;
  c.x = world.w + pad * 2 < viewW ? (world.w - viewW) / 2 : clamp(c.x, -pad, world.w - viewW + pad);
  c.y = world.h + pad * 2 < viewH ? (world.h - viewH) / 2 : clamp(c.y, -pad, world.h - viewH + pad);
  return c;
}
function snapCamera() { const c = clampCam(camTarget()); cam.x = c.x; cam.y = c.y; }
function updateCamera(dt) {
  const c = clampCam(camTarget());
  const f = 1 - Math.pow(0.002, dt);
  cam.x = lerp(cam.x, c.x, f); cam.y = lerp(cam.y, c.y, f);
}

function dayFrac() { return clamp(dayLeft / cfg.day, 0, 1); }

// Screen point on the edge of the view in the direction of a world point (or null if visible)
function edgePoint(wx, wy, top = 118, m = 34) {
  const sx = wx - cam.x, sy = wy - cam.y;
  if (sx > m && sx < viewW - m && sy > top && sy < viewH - m) return null;
  const cx = shep.x - cam.x, cy = shep.y - 40 - cam.y;
  const dx = sx - cx, dy = sy - cy;
  let k = Infinity;
  if (dx > 0) k = Math.min(k, (viewW - m - cx) / dx);
  if (dx < 0) k = Math.min(k, (m - cx) / dx);
  if (dy > 0) k = Math.min(k, (viewH - m - cy) / dy);
  if (dy < 0) k = Math.min(k, (top - cy) / dy);
  return { x: cx + dx * k, y: cy + dy * k, ang: Math.atan2(dy, dx) };
}

const fogC = document.createElement('canvas');
const fctx = fogC.getContext('2d');

function drawNight() {
  const df = state === 'title' ? 1 : dayFrac();
  // warm evening glow as the sun goes down
  const eve = state === 'title' ? 0 : clamp(1 - df * 1.5 + (cfg.dusk ? 0.35 : 0), 0, 1);
  if (eve > 0) {
    ctx.fillStyle = `rgba(255,140,50,${0.16 * eve * (1 - nightF * 0.6)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  if (nightF <= 0.01) return;
  const fw = Math.ceil(viewW / 4), fh = Math.ceil(viewH / 4);
  if (fogC.width !== fw || fogC.height !== fh) { fogC.width = fw; fogC.height = fh; }
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fw, fh);
  fctx.fillStyle = `rgba(10,16,48,${nightF})`;
  fctx.fillRect(0, 0, fw, fh);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.setTransform(0.25, 0, 0, 0.25, 0, 0);
  const hole = (x, y, r, a) => {
    const g = fctx.createRadialGradient(x, y, r * 0.4, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(x, y, r, 0, TAU); fctx.fill();
  };
  if (shep && state !== 'title') {
    const r = cfg.fogR * (0.62 + 0.38 * df);
    hole(shep.x - cam.x, shep.y - 40 - cam.y, r, 1);
  }
  hole(GATE.x - GATE.gap / 2 - cam.x, GATE.y - 30 - cam.y, 230, 0.85);   // the fold's lantern
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fogC, 0, 0, fw * 4, fh * 4);
}

function warmColor(w, a) {
  const r = Math.round(lerp(124, 255, w)), g = Math.round(lerp(196, 138, w)), b = Math.round(lerp(242, 61, w));
  return `rgba(${r},${g},${b},${a})`;
}

// Hints drawn on top of the night: baa rings, the way home, the stuck-sheep prompt, wolves' eyes
function drawHints() {
  if (!shep || state === 'title') return;
  ctx.lineCap = 'round';
  for (const r of baaRings) {
    const a = 1 - r.t / 1.5;
    const e = edgePoint(r.x, r.y);
    const x = e ? e.x : r.x - cam.x, y = e ? e.y : r.y - cam.y;
    ctx.lineWidth = 4;
    for (let k = 0; k < 3; k++) {
      const rr = 10 + (r.t * 60 + k * 16) % 60;
      ctx.strokeStyle = warmColor(r.warm, a * (1 - rr / 75));
      ctx.beginPath();
      if (e) ctx.arc(x, y, rr, e.ang + Math.PI - 0.9, e.ang + Math.PI + 0.9);
      else ctx.arc(x, y, rr + 10, 0, TAU);
      ctx.stroke();
    }
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    const tx = e ? x - Math.cos(e.ang) * 38 : x + 52, ty = e ? y - Math.sin(e.ang) * 38 + 6 : y - 30;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.strokeText('baa!', tx, ty);
    ctx.fillStyle = r.warm > 0.5 ? '#c2410c' : '#2c6fa8';
    ctx.fillText('baa!', tx, ty);
    ctx.globalAlpha = 1;
  }

  // the way home, once the sheep is on His shoulders
  if (shep.carrying || sheep.state === 'fleeing' || sheep.state === 'free') {
    const goal = shep.carrying ? HOME : sheep;
    const e = edgePoint(goal.x, goal.y - 20);
    if (e) {
      const pulse = 1 + Math.sin(t * 5) * 0.08;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
      ctx.save(); ctx.rotate(e.ang);
      ctx.fillStyle = '#e0a526';
      ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(19, -8); ctx.lineTo(19, 8); ctx.fill();
      ctx.restore();
      if (shep.carrying) {    // a little house
        ctx.fillStyle = '#a8741a';
        ctx.beginPath(); ctx.moveTo(-10, -1); ctx.lineTo(0, -10); ctx.lineTo(10, -1); ctx.fill();
        ctx.fillRect(-7, -2, 14, 10);
      } else {
        ctx.fillStyle = '#d9d5c8'; ctx.beginPath(); ctx.arc(0, 1, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#4a3f3a'; ctx.beginPath(); ctx.arc(0, 2, 4.5, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  // tap prompt over the sheep in the thorns
  if (sheep.state === 'stuck' && state === 'play') {
    const x = sheep.x - cam.x, y = sheep.y - cam.y - 104;
    const near = dist(shep, sheep) <= REACH;
    const pulse = 1 + Math.sin(t * 8) * 0.1;
    ctx.save();
    ctx.translate(x, y); ctx.scale(pulse, pulse);
    ctx.fillStyle = near ? 'rgba(255,215,90,0.95)' : 'rgba(255,255,255,0.85)';
    roundRect(-44, -15, 88, 30, 15); ctx.fill();
    ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#5a4210'; ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(near ? `${isTouch() ? 'Tap' : 'Space'} ×${sheep.taps}` : 'Come closer', 0, 5);
    ctx.restore();
  }

  // wolves' eyes glinting in the dark
  if (nightF > 0.35) {
    for (const w of wolves) {
      const x = w.x - cam.x + (24 + 5) * CHAR * 0.95 * w.facing, y = w.y - cam.y - (36 + 3) * CHAR * 0.95;
      if (x < -20 || x > viewW + 20 || y < -20 || y > viewH + 20) continue;
      ctx.fillStyle = `rgba(255,230,90,${nightF})`;
      ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, TAU); ctx.arc(x - 6 * w.facing, y + 1, 2.2, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + daylight, on a soft parchment panel so it reads over any scenery
  const title = state === 'title' ? 'The Lost Sheep' : `Level ${level} · ${cfg.name}`;
  ctx.font = '700 17px Fredoka, sans-serif';
  const tw = ctx.measureText(title).width;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,250,232,0.72)';
  roundRect(4, 6, Math.max(tw, 196) + 16, 54, 12); ctx.fill();
  ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3408';
  ctx.fillText(title, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('DAYLIGHT', 12, 48);
  ctx.shadowBlur = 0;
  const bx = 76, bw = 120;
  ctx.fillStyle = 'rgba(40,30,10,0.3)';
  roundRect(bx, 38, bw, 13, 6.5); ctx.fill();
  const df = state === 'title' ? 1 : dayFrac();
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0, '#ff8a3d'); gg.addColorStop(1, '#ffe27a');
  ctx.fillStyle = df < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (df > 0) { roundRect(bx, 38, Math.max(13, bw * df), 13, 6.5); ctx.fill(); }
  // the sun sinking along the bar
  const sx = bx + bw * df;
  ctx.fillStyle = df > 0.25 ? '#ffd23f' : '#ff7b39';
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(sx, 44.5, 8, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: what to do now, and the crook
  if (state !== 'title' && sheep) {
    const rx = viewW - 12;
    // on a narrow phone the right-hand panel sits lower, beside the buttons
    const ry = viewW < 720 ? 76 : 24;
    const status = { hidden: 'Find the lost sheep', stuck: 'Free it from the thorns!', fleeing: 'Catch the sheep!',
      free: 'Pick it up again!', carried: 'Carry it home!', home: 'Home safe!' }[sheep.state];
    ctx.font = '700 15px Fredoka, sans-serif';
    const sw = Math.max(ctx.measureText(status).width, cfg.wolves ? 88 : 0);
    ctx.fillStyle = 'rgba(255,250,232,0.72)';
    roundRect(rx - sw - 8, ry - 18, sw + 16, cfg.wolves ? 62 : 26, 12); ctx.fill();
    ctx.textAlign = 'right';
    ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
    ctx.fillStyle = '#4a3408';
    ctx.fillText(status, rx, ry);
    if (cfg.wolves) {
      ctx.font = '600 13px Fredoka, sans-serif';
      const ready = shep.crookCd <= 0;
      ctx.fillStyle = ready ? '#2b8a3e' : '#8a6a2a';
      ctx.fillText(ready ? 'Crook ready' : `Crook ${shep.crookCd.toFixed(1)}s`, rx, ry + 19);
      ctx.fillStyle = '#4a3408';
      ctx.fillText(`Wolves: ${wolves.length}`, rx, ry + 37);
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawMessage() {
  const y = viewH * 0.3;
  if (message.t > 0) {
    const a = clamp(message.t / 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    let size = 24;
    ctx.font = `700 ${size}px Fredoka, sans-serif`;
    while (ctx.measureText(message.text).width > viewW - 30 && size > 14) { size -= 1; ctx.font = `700 ${size}px Fredoka, sans-serif`; }
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(message.text, viewW / 2, y);
    ctx.fillStyle = '#7a5200';
    ctx.fillText(message.text, viewW / 2, y);
    ctx.restore();
  }
  if (hint.t > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(hint.t / 0.4, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '700 19px Fredoka, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(hint.text, viewW / 2, y + 34);
    ctx.fillStyle = hint.color;
    ctx.fillText(hint.text, viewW / 2, y + 34);
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!world) return;
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (-cam.x + sx) * scale, (-cam.y + sy) * scale);
  const v = { x0: cam.x - 20, y0: cam.y - 20, x1: cam.x + viewW + 20, y1: cam.y + viewH + 20 };

  drawGround(v);
  drawWaters(v);

  // walk-to marker
  if (shep && shep.target && state === 'play') {
    const p = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.strokeStyle = `rgba(224,165,38,${0.6 + p * 0.4})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(shep.target.x, shep.target.y, 12 + p * 3, 6 + p * 1.5, 0, 0, TAU); ctx.stroke();
  }

  drawFoldBack();
  drawFlock(v);
  drawFoldFront();

  // Everything that stands up, sorted back to front
  const items = [];
  const vis = (x, y, m) => x > v.x0 - m && x < v.x1 + m && y > v.y0 - m && y < v.y1 + m * 1.5;
  for (const o of world.trees) if (vis(o.x, o.y, 90)) items.push([o.y, drawTree, o]);
  for (const o of world.rocks) if (vis(o.x, o.y, 60)) items.push([o.y, drawRock, o]);
  for (const o of world.bushes) if (vis(o.x, o.y, 70)) items.push([o.y, drawBush, o]);
  for (const o of NEIGHBOURS) if (vis(o.x, o.y, 90)) items.push([o.y, drawPerson, o]);
  for (const o of wolves) if (vis(o.x, o.y, 90)) items.push([o.y, drawWolf, o]);
  if (shep) items.push([shep.y + 0.5, drawShepherd, shep]);
  if (sheep && (sheep.state === 'free' || sheep.state === 'fleeing' || sheep.state === 'home')) {
    items.push([sheep.y, (s) => {
      const jump = s.state === 'home' ? Math.abs(Math.sin(t * 8)) * 16 : s.hop > 0 ? Math.sin(s.hop / 0.3 * Math.PI) * 6 : 0;
      const [lx, ly] = lookAt(s.x, s.y - 30, shep.x, shep.y - 40);
      drawSheep(s.x, s.y, 0.72, s.d, s.mood, { jump, lx, ly, walk: s.state === 'fleeing' ? s.walkPh * 1.5 : 0, flip: s.facing });
    }, sheep]);
  }
  items.sort((a, b) => a[0] - b[0]);
  for (const [, fn, o] of items) fn(o);
  drawBorderTrees(v);
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 50, 0, TAU); ctx.stroke();
  }

  // Screen space from here on
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawNight();
  drawHints();
  drawMessage();
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateCrowd(dt);
  if (state === 'play') {
    dayLeft -= dt;
    updateShepherd(dt);
    if (state === 'play') updateSheep(dt);
    if (state === 'play') updateWolves(dt);
    if (state === 'play') updateBaa(dt);
    if (state === 'play' && dayLeft <= 0) { dayLeft = 0; fail('night'); }
  } else if (state === 'win' || state === 'fail') {
    updateSheep(dt);
    if (state === 'win') {
      for (const w of wolves) if (w.state === 'flee') { moveBy(w, (w.x - shep.x > 0 ? 1 : -1) * 200 * dt, 0); w.moving = true; w.walkPh += 200 * dt * 0.12; }
      if (Math.random() < dt * 10) spawn(HOME.x + rand(-160, 160), FOLD.y + rand(30, FOLD.h), 0, -30, 1.2, '#fff6d0', 3);
      if (Math.random() < dt * 3) hearts(FOLD.x + rand(40, FOLD.w - 40), FOLD.y + rand(40, FOLD.h - 40), 1);
    }
  }
  // how dark it is
  let dark = 0;
  if (state === 'play' || state === 'pause') dark = cfg.darkBase + (cfg.darkMax - cfg.darkBase) * Math.pow(1 - dayFrac(), 1.6);
  else if (state === 'fail') dark = 0.95;
  else if (state === 'win') dark = Math.max(0, nightF - dt * 0.5);
  nightF = state === 'win' ? dark : lerp(nightF, dark, 1 - Math.pow(0.05, dt));
  if (world) updateCamera(dt);
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  message.t -= dt;
  if (message.t <= 0 && msgQueue.length) message = msgQueue.shift();
  hint.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
