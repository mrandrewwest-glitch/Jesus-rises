<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5d6a84">
<title>Two by Two</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2a1f2e;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #overlay .card { -webkit-overflow-scrolling: touch; }
  #overlay:not(.hidden) .card { overscroll-behavior: contain; }   /* only while shown: on a hidden card it makes Chrome treat canvas taps as scrolls */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Two by Two</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'jesusLovesMe', instrument: 'harp', accent: 'pipe', ambience: 'birds', percussion: false };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  twoOfEvery: { ref: 'Genesis 6:19', KJV: 'And of every living thing of all flesh, two of every sort shalt thou bring into the ark, to keep them alive with thee; they shall be male and female.', NKJV: 'And of every living thing of all flesh you shall bring two of every sort into the ark, to keep them alive with you; they shall be male and female.', NIV: 'You are to bring into the ark two of all living creatures, male and female, to keep them alive with you.', NLT: 'Bring a pair of every kind of animal—a male and a female—into the boat with you to keep them alive during the flood.' },
  // Win card
  twoAndTwo: { ref: 'Genesis 7:9', KJV: 'There went in two and two unto Noah into the ark, the male and the female, as God had commanded Noah.', NKJV: 'Two by two they went into the ark to Noah, male and female, as God had commanded Noah.', NIV: 'Male and female, came to Noah and entered the ark, as God had commanded Noah.', NLT: 'They entered the boat in pairs, male and female, just as God had commanded Noah.' },
  shut: { ref: 'Genesis 7:16', KJV: 'And they that went in, went in male and female of all flesh, as God had commanded him: and the Lord shut him in.', NKJV: 'So those that entered, male and female of all flesh, went in as God had commanded him; and the Lord shut him in.', NIV: 'The animals going in were male and female of every living thing, as God had commanded Noah. Then the Lord shut him in.', NLT: 'A male and female of each kind entered, just as God had commanded Noah. Then the Lord closed the door behind them.' },
  // Fail card
  keepAlive: { ref: 'Genesis 6:19', KJV: 'two of every sort shalt thou bring into the ark, to keep them alive with thee', NKJV: 'you shall bring two of every sort into the ark, to keep them alive with you', NIV: 'bring into the ark two of all living creatures, male and female, to keep them alive with you', NLT: 'Bring a pair of every kind of animal... into the boat with you to keep them alive' },
};

let state = 'title';      // title | intro (level card) | play | pause | win | fail
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('twoByTwoBest') || 0; } catch (e) {}
let t = 0;

function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#e6eef6') {
  const n = Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// ============================================================
//  People (Noah and his family)
// ============================================================
function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';
  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  switch (mood) {
    case 'wow':
      eyes(4, 5.5, 2.1); brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2); brows(-10, -6, -10, -6);
      mouthLine(() => { ctx.moveTo(-5, mouthY); ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY); ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY); });
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      eyes(3.5, 4, 2); brows(-9, -5, -9, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    default:  // watch / work
      eyes(3.5, 4.5, 2); brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
  }
}

function drawScarf(d, hy) {
  ctx.fillStyle = d.scarf;
  ctx.beginPath();
  ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
  ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
}

// d: { robe, hair, skin, beard, longBeard, scarf, kid, blink }
// mood: watch | work | wow | worried | joy | dismay | point
function drawPerson(d, x, y, s, mood, lookX = 0, lookY = 0.2, extra = 0) {
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + (d.phase || 0))) * 12;
  if (d.kid) s *= 0.78;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -jump * s);
  ctx.scale(s, s);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + (d.phase || 0)) * 4;
    arm(-11, -32, -24 + wave, -66); arm(11, -32, 24 - wave, -66);
  } else if (mood === 'point') {
    arm(11, -32, 30, -50 + Math.sin(t * 5) * 2);
  }
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-17, -30, -11, -37); ctx.quadraticCurveTo(0, -41, 11, -37); ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  if (mood === 'watch' || mood === 'wow' || mood === 'dismay') { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }
  else if (mood === 'point') arm(-11, -32, -15, -12);
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) drawScarf(d, hy);
  else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    const L = d.longBeard ? 34 : 21;
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + L, 0, hy + L + 1);
    ctx.quadraticCurveTo(14, hy + L, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
    if (d.longBeard) { ctx.strokeStyle = shade(d.hair, -30); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-4, hy + 14); ctx.lineTo(-3, hy + L - 4); ctx.moveTo(4, hy + 14); ctx.lineTo(3, hy + L - 4); ctx.stroke(); }
  }
  drawFace(d, mood === 'work' || mood === 'point' ? 'watch' : mood, hy, lookX, lookY);
  if (mood === 'work') {
    // swinging a mallet
    const a = -0.6 + Math.max(0, Math.sin(extra)) * 1.3;
    ctx.save(); ctx.translate(14, -32); ctx.rotate(a);
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, 10); ctx.stroke();
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(16, -14); ctx.stroke();
    ctx.fillStyle = '#6b4423'; roundRect(8, -22, 16, 9, 2); ctx.fill();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(14, 10, 4, 0, TAU); ctx.fill();
    ctx.restore();
    arm(-11, -32, -15, -12);
  }
  ctx.restore();
}

// A friendly pointing hand (for first-time hints)
function drawHand(x, y, ang = -Math.PI / 2) {
  // a cartoon pointing hand: index finger out, thumb at the side, the other fingers curled into the fist
  const bob = Math.sin(t * 6) * 6;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.translate(0, 18 + bob);
  ctx.fillStyle = '#ffe0bd'; ctx.strokeStyle = '#a0643a'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // fist (sits to the right of the finger)
  roundRect(-6, 18, 26, 30, 9); ctx.fill(); ctx.stroke();
  // curled fingers: knuckle creases across the front of the fist
  ctx.beginPath();
  for (const ky of [26, 33, 40]) { ctx.moveTo(7, ky); ctx.quadraticCurveTo(13, ky + 2.5, 19, ky); }
  ctx.stroke();
  // thumb, tucked along the left side
  ctx.beginPath(); ctx.ellipse(-8, 32, 5, 9, 0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // pointing index finger
  ctx.beginPath();
  ctx.moveTo(-5, 26); ctx.lineTo(-5, 4); ctx.quadraticCurveTo(-5, -2, 0, -2); ctx.quadraticCurveTo(5, -2, 5, 4); ctx.lineTo(5, 26);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe0bd'; ctx.fillRect(-3.5, 18, 7, 9);   // join finger and fist smoothly
  ctx.strokeStyle = 'rgba(160,100,58,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-2.5, 11); ctx.lineTo(2.5, 11); ctx.stroke();   // finger crease
  ctx.restore();
}

// ============================================================
//  Particles (playfield coordinates)
// ============================================================
let particles = [];
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function sparkleBurst(x, y, n, cols = ['#ffe27a', '#fff6d0', '#ffffff', '#ffd0e0']) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, 260);
    spawn(x, y, Math.cos(a) * v, Math.sin(a) * v - 40, rand(0.5, 1.1), pick(cols), rand(2.5, 5), 160, i % 3 ? 'dot' : 'star');
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const r = p.size * 1.6;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.35 : r; ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); }
      ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;

//  Sound (tiny WebAudio synth + music.js)

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {

    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass') {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  tap(h) { if (this.ctx) Music.tap(clamp(h, 0, 1)); },
  bonk() { this.tone(220, 0.2, 'triangle', 0.25, 0, 130); },
  pop() { this.tone(520, 0.12, 'sine', 0.25, 0, 900); },
  sparkle() { [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.4, 'sine', 0.1, i * 0.07)); },
  whoosh() { this.noiseBurst(500, 0.9, 0.3, 0.6, 1600); },

function drawAnimal(kind, x, y, s, o = {}) {

    const lift = o.walk ? Math.max(0, Math.sin(walk + ph)) * 5 : 0;
    ctx.fillStyle = legC;

function puffs(cx, cy, rx, ry, r, n) {

  if (A.trunk) {
    ctx.fillStyle = A.head; ctx.strokeStyle = outline;
    ctx.beginPath(); ctx.moveTo(-4.5, 3); ctx.quadraticCurveTo(-5, 16, 2, 20 + Math.sin(t * 3) * 1.5); ctx.lineTo(6, 17); ctx.quadraticCurveTo(3, 13, 4.5, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (A.bird) {
    ctx.fillStyle = A.beak; ctx.beginPath(); ctx.ellipse(0, 5, 7, 3.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(A.beak, -50); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(6, 5); ctx.stroke();
  } else if (A.muzzle) {
    ctx.fillStyle = A.muzzle;
    ctx.beginPath(); ctx.ellipse(0, my, A.wide ? 12 : A.long ? 8 : 7, A.long ? 6 : 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = A.wide || A.long ? shade(A.muzzle, -70) : '#3a2a22';
    if (A.wide || A.long) { ctx.beginPath(); ctx.arc(-3.5, my, 1.3, 0, TAU); ctx.arc(3.5, my, 1.3, 0, TAU); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(0, my - 2, 2.6, 1.8, 0, 0, TAU); ctx.fill(); }
  }
  if (A.beard) { ctx.fillStyle = '#e8dcc6'; ctx.beginPath(); ctx.moveTo(-3, my + 4); ctx.lineTo(0, my + 13); ctx.lineTo(3, my + 4); ctx.fill(); }
  // eyes
  const ey = A.long ? -4 : -3;
  const ex = A.wide ? 7 : 5.5;
  const blink = Math.sin(t * 1.3 + (o.phase || 0) * 7) > 0.985;
  if (mood === 'joy' || blink) {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 2;
    for (const sx of [-ex, ex]) { ctx.beginPath(); ctx.arc(sx, ey + 1.5, 2.8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else {
    for (const sx of [-ex, ex]) {
      ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.ellipse(sx, ey, 2.8, 3.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx + 1, ey - 1.2, 1.1, 0, TAU); ctx.fill();
    }
  }
  // cheeks and smile
  ctx.fillStyle = 'rgba(255,120,130,0.35)';
  ctx.beginPath(); ctx.arc(-ex - 3.5, ey + 5, 2.6, 0, TAU); ctx.arc(ex + 3.5, ey + 5, 2.6, 0, TAU); ctx.fill();
  if (!A.bird && !A.trunk) {
    ctx.strokeStyle = '#4a2a1e'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, my + 1.5, mood === 'worried' ? 0 : 2.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
}

function drawTortoise(A, walk, mood) {
  for (const [lx, ph] of [[-14, 0], [-5, Math.PI], [5, 0], [14, Math.PI]]) {
    const lift = walk ? Math.max(0, Math.sin(walk + ph)) * 3 : 0;
    ctx.fillStyle = '#9ab060'; roundRect(lx - 4, -10 - lift, 8, 10, 3.5); ctx.fill();
  }
  ctx.fillStyle = '#5a8a3a'; ctx.strokeStyle = '#3a5a22'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -12, 22, 16, 0, Math.PI, TAU); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7aaa50';
  for (const [x, y] of [[-10, -17], [0, -21], [10, -17], [-4, -12], [6, -12]]) { ctx.beginPath(); ctx.arc(x, y, 3.6, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#c8b070'; ctx.fillRect(-22, -13, 44, 3);
  ctx.save(); ctx.translate(0, -24); ctx.scale(0.8, 0.8);
  drawAnimalHead(A, mood, {});
  ctx.restore();
}
// ============================================================
//  Tuning
// ============================================================
const LEVELS = [
  { name: 'The First Animals',  pairs: 4,  time: 80,  peek: 3,   look: 0, shuffle: false, missCost: 0 },
  { name: 'More Are Coming',    pairs: 6,  time: 90,  peek: 2.5, look: 0, shuffle: false, missCost: 0 },
  { name: 'Look Twice!',        pairs: 8,  time: 100, peek: 2,   look: 2, shuffle: false, missCost: 0.5 },
  { name: 'A Windy Shuffle',    pairs: 10, time: 100, peek: 1.6, look: 2, shuffle: true,  missCost: 0.8 },
  { name: 'The Rain Gets Heavy', pairs: 12, time: 110, peek: 1.4, look: 3, shuffle: true,  missCost: 1 },
  { name: 'The Door Is Closing', pairs: 15, time: 125, peek: 1.2, look: 4, shuffle: true,  missCost: 1 },
];
function makeConfig(n) {
  const L = LEVELS[Math.min(n, LEVELS.length) - 1];
  const extra = Math.max(0, n - LEVELS.length);
  return { ...L, n, time: extra ? Math.max(100, L.time - extra * 8) : L.time, name: extra ? `${L.name} ${extra + 1}` : L.name };
}
// pairs of animals that look alike, added on later levels
const LOOKALIKES = [['horse', 'donkey'], ['sheep', 'goat'], ['lion', 'fox'], ['zebra', 'horse'], ['bear', 'monkey']];
const OTHERS = ['elephant', 'giraffe', 'cow', 'rabbit', 'duck', 'hippo', 'pig', 'tortoise', 'lion', 'zebra', 'bear', 'fox', 'monkey', 'sheep', 'horse'];

// ============================================================
//  Game state
// ============================================================
let cfg = makeConfig(1);
let cards = [];
let open = [];            // cards turned face up this turn (up to 2)
let closeT = 0;           // when a wrong pair turns back over
let walkers = [];         // matched pairs walking up the ramp
let pending = [];         // matched pairs about to hop down to the ramp
let aboard = 0;
let misses = 0;
let timeLeft = 0;
let playT = 0, winT = 0, failT = 0, endTimer = 0;
let peekT = 0;
let shuffled = false, shuffleAnim = 0;
let doorShut = 0;         // 0 open .. 1 shut
let rain = [];
let told = {};
let lastScore = null;
let cursor = 0;
let shakeT = 0;
const NOAH = { robe: '#8a6a45', hair: '#f4f1ea', skin: '#d9a066', beard: true, longBeard: true, scarf: '#e8dcc0', blink: 0 };

// ============================================================
//  Layout
// ============================================================
function scene() {
  // the ark and its ramp along the bottom of the playfield
  const ax = W - Math.min(170, W * 0.3);
  const s = clamp(W / 700, 0.75, 1.15);
  const ay = 878;
  const door = { x: ax - 92 * s, y: ay - 70 * s };
  const foot = { x: Math.max(70, door.x - 190 * s), y: 868 };
  return { ax, ay, s, door, foot, top: ay - 210 * s };
}
function grid() {
  const n = cards.length || cfg.pairs * 2;
  const top = Math.max(16, 128 - offY), bottom = scene().top - 14;
  const left = 14, right = W - 14;
  const aw = right - left, ah = bottom - top;
  let bestG = null;
  for (let cols = 2; cols <= 10; cols++) {
    const rows = Math.ceil(n / cols);
    const cw = Math.min(aw / cols, (ah / rows) * 0.86);
    if (!bestG || cw > bestG.cw) bestG = { cols, rows, cw };
  }
  const cw = Math.min(bestG.cw, 150), ch = cw / 0.86;
  const gw = bestG.cols * cw, gh = bestG.rows * ch;
  return { ...bestG, cw, ch, x0: W / 2 - gw / 2, y0: top + (ah - gh) / 2 };
}
function cellPos(i) {
  const G = grid();
  const c = i % G.cols, r = Math.floor(i / G.cols);
  // centre a short last row
  const inLast = cards.length - Math.floor((cards.length - 1) / G.cols) * G.cols;
  const shift = r === G.rows - 1 ? (G.cols - inLast) * G.cw / 2 : 0;
  return { x: G.x0 + c * G.cw + G.cw / 2 + shift, y: G.y0 + r * G.ch + G.ch / 2, w: G.cw - 8, h: G.ch - 8 };
}

// ============================================================
//  Dealing
// ============================================================
function deal() {
  const kinds = [];
  for (let i = 0; i < cfg.look && i < LOOKALIKES.length; i++) for (const k of LOOKALIKES[i]) if (!kinds.includes(k)) kinds.push(k);
  for (const k of OTHERS.slice().sort(() => Math.random() - 0.5)) { if (kinds.length >= cfg.pairs) break; if (!kinds.includes(k)) kinds.push(k); }
  kinds.length = cfg.pairs;
  const list = [];
  for (const k of kinds) list.push(k, k);
  list.sort(() => Math.random() - 0.5);
  cards = list.map((kind, i) => ({ kind, slot: i, up: 0, want: 0, matched: false, gone: false, x: 0, y: 0, glow: 0, shake: 0, phase: rand(0, 1), fly: null }));
  for (const c of cards) { const p = cellPos(c.slot); c.x = p.x; c.y = p.y; }
}

// ============================================================
//  Turning cards over
// ============================================================
function flip(c) {
  if (state !== 'play' || peekT > 0 || shuffleAnim > 0) return;
  if (c.matched || c.gone || open.includes(c)) return;
  if (open.length >= 2) { for (const o of open) o.want = 0; open = []; closeT = 0; }
  c.want = 1;
  open.push(c);
  sfx.flip();
  if (open.length === 2) {
    const [a, b] = open;
    if (a.kind === b.kind) {
      a.matched = b.matched = true;
      a.glow = b.glow = 1;
      open = [];
      sfx.tap(0.4 + aboard / cfg.pairs * 0.6);
      sfx.sparkle();
      sparkleBurst(a.x, a.y, 12); sparkleBurst(b.x, b.y, 12);
      pending.push({ a, b, t: 0.65, stage: 0 });   // game time, so pausing or restarting can't lose a pair
      if (!told.match) { told.match = true; showMessage(`Two ${ANIMALS[a.kind].name}s! Into the ark they go.`, 2.2); }
    } else {
      misses++;
      a.shake = b.shake = 0.4;
      closeT = 1.0;
      timeLeft = Math.max(0, timeLeft - cfg.missCost);
      sfx.bonk();
      const look = LOOKALIKES.some(([x, y]) => (a.kind === x && b.kind === y) || (a.kind === y && b.kind === x));
      if (look && !told.look) { told.look = true; showMessage(`Look closely: a ${ANIMALS[a.kind].name} and a ${ANIMALS[b.kind].name}!`, 2.4); }
    }
  }
}

function sendAboard(a, b) {
  if (state !== 'play' && state !== 'win') return;
  const S = scene();
  for (const [c, k] of [[a, 0], [b, 1]]) c.fly = { t: 0, x0: c.x, y0: c.y, x1: S.foot.x - 10 - k * 34, y1: S.foot.y };
}
function updatePending(dt) {
  for (const q of pending) {
    q.t -= dt;
    if (q.t > 0) continue;
    if (q.stage === 0) { q.stage = 1; q.t = 0.6; sendAboard(q.a, q.b); }
    else { q.stage = 2; q.a.gone = q.b.gone = true; walkers.push({ kind: q.a.kind, t: 0, dur: 2.4 }); }
  }
  pending = pending.filter((q) => q.stage < 2);
}

function doShuffle() {
  shuffled = true;
  shuffleAnim = 1.2;
  const free = cards.filter((c) => !c.matched);
  const slotsFree = free.map((c) => c.slot).sort(() => Math.random() - 0.5);
  free.forEach((c, i) => { c.slot = slotsFree[i]; c.want = 0; });
  open = []; closeT = 0;
  sfx.whoosh();
  showMessage('Whoosh! The wind has mixed up the cards!', 2.4);
}

// ============================================================
//  Win / fail
// ============================================================
function allAboard() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const timeBonus = Math.round(timeLeft * 12);
  const memBonus = Math.max(0, cfg.pairs * 120 - misses * 40);
  const levelBonus = level * 300;
  const score = timeBonus + memBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('twoByTwoBest', best); } catch (e) {} }
  lastScore = { timeBonus, memBonus, levelBonus, score };
  showMessage('Everyone is in! And the LORD shut the door.', 3);
  sfx.win();
  endTimer = 5;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  for (const c of cards) if (!c.matched) c.want = 1;
  showMessage('The water rose too high…', 2.4);
  sfx.fail();
  endTimer = 3.2;
}

// ============================================================
//  Screens
// ============================================================
function titleScreen() {
  state = 'title';
  syncAmbience();
  cfg = makeConfig(1);
  cards = [];
  showOverlay('Two by Two', 'The animals come to Noah in pairs',
    `${verseHTML('twoOfEvery')}
     <ul>
       <li>The rain is starting! Help the animals go into the ark <b>two by two</b>.</li>
       <li><b>Tap a card</b> to turn it over, then <b>tap another</b>. If the two animals <b>match</b>, they walk up the ramp into the ark together.</li>
       <li>If they don't match, they turn back over. <b>Remember where each animal is!</b></li>
       <li>Be quick: the <b>water is rising</b>. Later on, watch for animals that <b>look alike</b> (a horse and a donkey!) and a <b>wind that mixes the cards</b>.</li>
       <li><b>Keys:</b> arrow keys move, <kbd>Space</kbd> turns a card.</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Open the ark', () => { level = 1; totalScore = 0; levelCard(); });
}

// The card before each level: what's new
const LEVEL_TIPS = [
  'Look at the animals before the cards turn over. Then <b>tap two cards</b> to find a matching pair!',
  'More animals are coming to the ark. <b>Remember</b> where each one is hiding!',
  'Some animals <b>look alike</b>: a horse and a donkey, a sheep and a goat. Look twice! A wrong pair now lets the water rise a little.',
  'A <b>windy shuffle</b>! After a few pairs, the wind mixes up the cards that are left. Watch closely!',
  'The rain gets heavy, with more look-alikes and a quicker peek. Hurry!',
  'Fifteen pairs, and the door is closing. Can you bring them all in?',
];
function levelCard() {
  state = 'intro';
  resetLevel();
  syncAmbience();
  showOverlay(`Level ${level}`, cfg.name,
    `<p style="text-align:center">${LEVEL_TIPS[Math.min(level, LEVEL_TIPS.length) - 1]}</p>
     <p class="score">Pairs to bring in: <b>${cfg.pairs}</b> &middot; Time: <b>${cfg.time}s</b></p>
     ${verseHTML(level % 2 ? 'twoOfEvery' : 'twoAndTwo')}`,
    'Start', () => startLevel());
}

function resetLevel() {
  cfg = makeConfig(level);
  deal();
  open = []; closeT = 0; walkers = []; pending = []; aboard = 0; misses = 0;
  timeLeft = cfg.time;
  playT = 0; winT = 0; failT = 0; endTimer = 0;
  peekT = cfg.peek; shuffled = !cfg.shuffle; shuffleAnim = 0;
  doorShut = 0; rain = []; particles = [];
  told = {}; cursor = 0; shakeT = 0;
}

function startLevel(retry = false) {
  if (retry || state !== 'intro') resetLevel();
  for (const c of cards) c.want = 1;   // they all turn over for a peek
  peekT = cfg.peek + 0.2;              // (plus the moment it takes them to turn)
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}. Look carefully!`, Math.max(1.8, cfg.peek));
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Two by two!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('twoAndTwo')}
       <p style="text-align:center">God kept every animal safe in the ark with Noah. Then God Himself closed the door.</p>
       ${verseHTML('shut')}
       <p class="score">Time left: <b>${s.timeBonus}</b><br>Good memory (${misses} miss${misses === 1 ? '' : 'es'}): <b>${s.memBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      level < LEVELS.length ? 'More animals!' : 'Play again, faster!', () => { level++; levelCard(); });
  } else if (state === 'fail') {
    const left = cfg.pairs - aboard;
    showOverlay('Wait for us!', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${left} pair${left > 1 ? 's' : ''} still had to come aboard. Try to <b>remember</b> where each animal is hiding, so you can find its partner quickly!</p>
       ${verseHTML('keepAlive')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Updating
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  NOAH.blink = Math.max(0, NOAH.blink - dt);
  if (Math.random() < dt * 0.4) NOAH.blink = 0.13;
  shakeT = Math.max(0, shakeT - dt);
  for (const c of cards) {
    c.up += clamp(c.want - c.up, -dt * 5, dt * 5);
    c.glow = Math.max(0, c.glow - dt * 0.8);
    c.shake = Math.max(0, c.shake - dt);
    if (c.fly) {
      c.fly.t = Math.min(1, c.fly.t + dt / 0.6);
      const f = ease(c.fly.t);
      c.x = lerp(c.fly.x0, c.fly.x1, f); c.y = lerp(c.fly.y0, c.fly.y1, f) - Math.sin(f * Math.PI) * 80;
    } else {
      const p = cellPos(c.slot);
      const k = 1 - Math.pow(shuffleAnim > 0 ? 0.02 : 0.0001, dt);
      c.x += (p.x - c.x) * k; c.y += (p.y - c.y) * k;
    }
  }
  if (state === 'play' || state === 'win') updatePending(dt);
  for (const w of walkers) {
    w.t += dt;
    if (w.t >= w.dur && !w.in) {
      w.in = true; aboard++;
      sfx.pop();
      if (aboard >= cfg.pairs && state === 'play') allAboard();
    }
  }
  walkers = walkers.filter((w) => w.t < w.dur + 0.2);
  if (state === 'play') {
    playT += dt;
    if (peekT > 0) {
      peekT -= dt;
      if (peekT <= 0) { for (const c of cards) c.want = 0; showMessage('Now find the pairs!', 1.6); }
    } else {
      timeLeft -= dt;
      if (closeT > 0) { closeT -= dt; if (closeT <= 0) { for (const o of open) o.want = 0; open = []; } }
      if (!shuffled && aboard >= Math.ceil(cfg.pairs * 0.4) && open.length === 0 && closeT <= 0) doShuffle();
      shuffleAnim = Math.max(0, shuffleAnim - dt);
      if (timeLeft < cfg.time * 0.25 && !told.hurry) { told.hurry = true; showMessage('The water is rising — hurry!', 2); }
      if (timeLeft <= 0 && cards.filter((c) => c.matched).length < cards.length) { timeLeft = 0; fail(); }
      timeLeft = Math.max(0, timeLeft);
    }
    updateRain(dt, 0.25 + 0.75 * (1 - timeLeft / cfg.time));
  } else if (state === 'win') {
    winT += dt;
    doorShut = clamp((winT - 0.4) / 1.4, 0, 1);
    if (doorShut >= 1 && !told.shut) { told.shut = true; sfx.thump(); shakeT = 0.3; const S = scene(); sparkleBurst(S.door.x, S.door.y - 20, 40); }
    updateRain(dt, 0.6);
  } else if (state === 'fail') {
    failT += dt;
    updateRain(dt, 1);
  }
  message.t -= dt;
  endScreens(dt);
}

function updateRain(dt, amount) {
  if (Math.random() < dt * 50 * amount) for (let i = 0; i < 2; i++) rain.push({ x: rand(-offX, W + offX + 100), y: -offY - 20, v: rand(550, 750) });
  for (let i = rain.length - 1; i >= 0; i--) {
    const r = rain[i];
    r.y += r.v * dt; r.x -= r.v * dt * 0.15;
    if (r.y > waterY() + 4) rain.splice(i, 1);
  }
}

// The flood: rises from below the hill towards the ramp
function waterY() {
  const f = state === 'title' ? 0 : 1 - timeLeft / cfg.time;
  return lerp(H + 30, scene().foot.y - 34, ease(clamp(f, 0, 1)));
}

// ============================================================
//  Input
// ============================================================
function toPlay(p) { return { x: p.vx - offX, y: p.vy - offY }; }
function cardAt(x, y) {
  for (const c of cards) {
    if (c.gone || c.fly) continue;
    const p = cellPos(c.slot);
    if (Math.abs(x - c.x) < p.w / 2 + 3 && Math.abs(y - c.y) < p.h / 2 + 3) return c;
  }
  return null;
}
canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const v = toView(e);
  if (hudHit(v)) return;
  if (state === 'win' && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const { x, y } = toPlay(v);
  const c = cardAt(x, y);
  if (c) { cursor = c.slot; flip(c); }
});

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play' || e.repeat) return;
  const G = grid();
  const n = cards.length;
  if (e.code === 'ArrowLeft') cursor = (cursor + n - 1) % n;
  if (e.code === 'ArrowRight') cursor = (cursor + 1) % n;
  if (e.code === 'ArrowUp') cursor = (cursor - G.cols + n) % n;
  if (e.code === 'ArrowDown') cursor = (cursor + G.cols) % n;
  if (e.code === 'Space' || e.code === 'Enter') { const c = cards.find((q) => q.slot === cursor && !q.gone); if (c) flip(c); }
  told.keys = true;
});

// ============================================================
//  Extra sounds
// ============================================================
sfx.flip = function () { this.noiseBurst(2600, 0.1, 0.18, 1.2, 1200); };
sfx.thump = function () { this.tone(90, 0.4, 'sine', 0.5, 0, 50); this.noiseBurst(200, 0.35, 0.35, 0.7, 80, 'lowpass'); };

// ============================================================
//  Drawing
// ============================================================
function drawSky() {
  const f = state === 'title' ? 0.2 : state === 'win' ? 0.6 : 0.3 + 0.6 * (1 - timeLeft / cfg.time);
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, mix('#9fd4f2', '#5d6a84', f)); g.addColorStop(0.7, mix('#d6ecf6', '#8d97a8', f)); g.addColorStop(1, mix('#eef4e0', '#a6aba6', f));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  for (let i = 0; i < 6; i++) {
    const x = ((hash(i, 2) * (W + 400) + t * (6 + i * 2)) % (W + 400)) - 200;
    const y = -offY * 0.7 + 60 + hash(i, 4) * 260;
    const w = 160 + hash(i, 6) * 140;
    drawCloud(x, y, w, w * 0.33, mix('#ffffff', '#7a8296', f), mix('#e1e8f0', '#5e6678', f));
  }
}
function mix(a, b, f) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const c = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, clamp(f, 0, 1)));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

function drawHill() {
  const S = scene();
  ctx.fillStyle = '#8fbf62';
  ctx.beginPath(); ctx.moveTo(-offX, H + 10);
  ctx.lineTo(-offX, S.foot.y - 40);
  ctx.quadraticCurveTo(S.foot.x - 60, S.foot.y - 30, S.foot.x + 40, S.foot.y + 4);
  ctx.lineTo(W + offX, S.ay + 6); ctx.lineTo(W + offX, H + 10); ctx.fill();
  ctx.fillStyle = '#7aae55';
  ctx.fillRect(-offX, S.ay, viewW, H - S.ay + 10);
}

function drawArkScene() {
  const S = scene();
  const s = S.s;
  const bobY = state === 'win' ? Math.sin(t * 1.5) * 2 : 0;
  ctx.save();
  ctx.translate(S.ax, S.ay + bobY);
  ctx.scale(s, s);
  // hull
  ctx.fillStyle = '#a8693a'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-150, -95); ctx.lineTo(150, -95); ctx.quadraticCurveTo(140, -10, 110, 0); ctx.lineTo(-110, 0); ctx.quadraticCurveTo(-140, -10, -150, -95); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,40,10,0.45)'; ctx.lineWidth = 2;
  for (const y of [-70, -45, -22]) { ctx.beginPath(); ctx.moveTo(-145 + (y + 95) * 0.25, y); ctx.lineTo(145 - (y + 95) * 0.25, y); ctx.stroke(); }
  // cabin
  ctx.fillStyle = '#c08850'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 3;
  ctx.fillRect(-105, -165, 210, 70); ctx.strokeRect(-105, -165, 210, 70);
  ctx.fillStyle = '#7a4a2a';
  ctx.beginPath(); ctx.moveTo(-122, -163); ctx.lineTo(-85, -205); ctx.lineTo(85, -205); ctx.lineTo(122, -163); ctx.closePath(); ctx.fill(); ctx.stroke();
  // windows with animals peeking out
  const peek = ['elephant', 'giraffe', 'lion', 'sheep'];
  for (let i = 0; i < 3; i++) {
    const wx = -10 + i * 40, wy = -140;
    ctx.fillStyle = '#4a2e1a'; ctx.fillRect(wx - 14, wy - 14, 28, 24);
    if (aboard > i * Math.max(1, cfg.pairs / 3) || state === 'win') {
      ctx.save(); ctx.beginPath(); ctx.rect(wx - 14, wy - 14, 28, 24); ctx.clip();
      ctx.translate(wx, wy + 10); ctx.scale(0.75, 0.75);
      drawAnimalHead(ANIMALS[peek[i]], state === 'win' ? 'joy' : 'happy', { phase: i });
      ctx.restore();
    }
    ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 2.5; ctx.strokeRect(wx - 14, wy - 14, 28, 24);
  }
  ctx.restore();
  // the doorway and the ramp (it swings up to shut the door)
  const d = S.door, f = S.foot;
  ctx.fillStyle = '#3a2412';
  roundRect(d.x - 4, d.y - 52 * s, 34 * s, 54 * s, 6); ctx.fill();
  const len = Math.hypot(d.x - f.x, d.y - f.y);
  const a0 = Math.atan2(f.y - d.y, f.x - d.x);
  const a = lerp(a0, -Math.PI / 2 + 0.02, ease(doorShut));
  if (doorShut < 0.9) {
  ctx.save();
  ctx.globalAlpha = clamp((0.9 - doorShut) / 0.2, 0, 1);
  ctx.translate(d.x, d.y + 2);
  ctx.rotate(a);
  const rl = doorShut > 0.5 ? 56 * s : len;
  ctx.fillStyle = '#b07a48'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 2.5;
  roundRect(0, -6, rl, 12, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,40,10,0.5)'; ctx.lineWidth = 2;
  for (let x = 16; x < rl - 4; x += 16) { ctx.beginPath(); ctx.moveTo(x, -6); ctx.lineTo(x, 6); ctx.stroke(); }
  ctx.restore();
  }
  if (doorShut > 0.8) {
    // the door, shut tight
    ctx.globalAlpha = clamp((doorShut - 0.8) / 0.2, 0, 1);
    ctx.fillStyle = '#9a6538'; ctx.strokeStyle = '#5a3818'; ctx.lineWidth = 2.5;
    roundRect(d.x - 6, d.y - 54 * s, 38 * s, 58 * s, 6); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,35,10,0.5)'; ctx.lineWidth = 2;
    for (let k = 1; k < 3; k++) { const x = d.x - 6 + k * 38 * s / 3; ctx.beginPath(); ctx.moveTo(x, d.y - 52 * s); ctx.lineTo(x, d.y + 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  if (doorShut >= 1) {
    // God shut them in: warm light shining down on the ark
    const a = clamp(winT - 1.8, 0, 1);
    const cx = d.x + 14 * s, cy = d.y - 30 * s;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(0, -offY, 0, cy);
    beam.addColorStop(0, `rgba(255,236,170,${0.35 * a})`); beam.addColorStop(1, `rgba(255,236,170,${0.12 * a})`);
    ctx.fillStyle = beam;
    ctx.beginPath(); ctx.moveTo(cx - 40, -offY); ctx.lineTo(cx + 70, -offY); ctx.lineTo(cx + 150, cy + 40); ctx.lineTo(cx - 120, cy + 40); ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(cx, cy, 5, cx, cy, 150);
    g.addColorStop(0, `rgba(255,240,180,${0.6 * a})`); g.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 150, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawWalkers() {
  const S = scene();
  for (const w of walkers) {
    const f = clamp(w.t / w.dur, 0, 1);
    for (let k = 0; k < 2; k++) {
      const g = clamp(f * 1.15 - k * 0.15, 0, 1);
      const x = lerp(S.foot.x - 10, S.door.x + 14, g), y = lerp(S.foot.y, S.door.y, g);
      if (g >= 1) continue;
      const sc = 0.62 * S.s * (g > 0.88 ? (1 - g) / 0.12 : 1);
      drawAnimal(w.kind, x, y + 2, sc, { walk: t * 12 + k, phase: k, shadow: false });
    }
  }
}

function drawWater() {
  const y = waterY();
  if (y > H + 20) return;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, 'rgba(70,140,200,0.85)'); g.addColorStop(1, 'rgba(30,80,150,0.95)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-offX, H + 20);
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, y + Math.sin(x / 40 + t * 2) * 4);
  ctx.lineTo(W + offX, H + 20); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = -offX; x <= W + offX + 20; x += 20) ctx.lineTo(x, y + Math.sin(x / 40 + t * 2) * 4);
  ctx.stroke();
  ctx.restore();
}

function drawRain() {
  ctx.strokeStyle = 'rgba(200,225,255,0.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + 3, r.y - 16); }
  ctx.stroke();
}

function drawCard(c) {
  const p = cellPos(c.slot);
  let w = p.w, h = p.h;
  if (c.fly) { const f = c.fly.t; w *= lerp(1, 0.45, f); h *= lerp(1, 0.45, f); }
  const sx = Math.abs(Math.cos(c.up * Math.PI));
  const faceUp = c.up > 0.5;
  ctx.save();
  ctx.translate(c.x + (c.shake > 0 ? Math.sin(c.shake * 50) * 4 : 0), c.y);
  ctx.scale(Math.max(0.03, sx), 1);
  ctx.shadowColor = c.glow > 0 ? `rgba(255,220,90,${c.glow})` : 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = c.glow > 0 ? 24 : 6; ctx.shadowOffsetY = c.glow > 0 ? 0 : 3;
  if (faceUp) {
    ctx.fillStyle = c.matched ? '#fff4c8' : '#fffaf0';
    roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = c.matched ? '#f2b632' : '#d8c49a'; ctx.lineWidth = c.matched ? 4 : 2.5; ctx.stroke();
    ctx.save();
    ctx.beginPath(); roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4, 9); ctx.clip();
    // a little meadow on the card
    ctx.fillStyle = '#dff0d0'; ctx.fillRect(-w / 2, h * 0.18, w, h);
    const sc = Math.min(w, h) / 98;
    const A = ANIMALS[c.kind];
    drawAnimal(c.kind, 0, h * 0.36, sc * (A.neck ? 0.82 : 0.95), { mood: c.matched ? 'joy' : 'happy', phase: c.phase, shadow: true });
    ctx.restore();
  } else {
    // card back: planks with a dove
    ctx.fillStyle = '#b97a45';
    roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = '#6a3f1c'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.save(); ctx.beginPath(); roundRect(-w / 2, -h / 2, w, h, 10); ctx.clip();
    ctx.strokeStyle = 'rgba(90,50,20,0.35)'; ctx.lineWidth = 2;
    for (let y = -h / 2 + h / 4; y < h / 2; y += h / 4) { ctx.beginPath(); ctx.moveTo(-w / 2, y); ctx.lineTo(w / 2, y); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,248,225,0.9)';
    ctx.beginPath(); ctx.arc(0, 0, Math.min(w, h) * 0.28, 0, TAU); ctx.fill();
    drawLittleArk(0, 4, Math.min(w, h) / 120);
  }
  ctx.restore();
  if (!faceUp && cursor === c.slot && told.keys && state === 'play') {
    ctx.strokeStyle = '#fff3a0'; ctx.lineWidth = 3; roundRect(c.x - w / 2 - 4, c.y - h / 2 - 4, w + 8, h + 8, 12); ctx.stroke();
  }
}
function drawLittleArk(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.moveTo(-26, -8); ctx.lineTo(26, -8); ctx.quadraticCurveTo(22, 6, 16, 8); ctx.lineTo(-16, 8); ctx.quadraticCurveTo(-22, 6, -26, -8); ctx.fill();
  ctx.fillStyle = '#c08850'; ctx.fillRect(-14, -20, 28, 12);
  ctx.fillStyle = '#6a3f1c'; ctx.beginPath(); ctx.moveTo(-17, -20); ctx.lineTo(-10, -27); ctx.lineTo(10, -27); ctx.lineTo(17, -20); ctx.fill();
  ctx.fillStyle = '#5aa0d8'; ctx.beginPath(); ctx.moveTo(-30, 10); ctx.quadraticCurveTo(-15, 4, 0, 10); ctx.quadraticCurveTo(15, 16, 30, 10); ctx.lineTo(30, 14); ctx.lineTo(-30, 14); ctx.fill();
  ctx.restore();
}

function drawNoah() {
  const S = scene();
  const mood = state === 'win' ? 'joy' : state === 'fail' ? 'worried' : timeLeft < cfg.time * 0.25 ? 'worried' : 'point';
  drawPerson(NOAH, S.door.x + 14 * S.s, S.door.y - 4, 0.95 * S.s, mood, -0.6, 0.3);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-3, 3) * shakeT * 3; sy = rand(-3, 3) * shakeT * 3; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  drawSky();
  drawRain();
  drawHill();
  drawArkScene();
  if (state !== 'title' && !(state === 'win' && doorShut > 0.6)) drawNoah();
  drawWalkers();
  drawWater();
  for (const c of cards) if (!c.gone && !c.fly) drawCard(c);
  for (const c of cards) if (!c.gone && c.fly) drawCard(c);
  drawParticles();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHudTitle(state === 'title' ? 'Two by Two' : `Level ${level} · ${cfg.name}`);
  if (state !== 'title') {
    drawMeter(`Aboard ${aboard}/${cfg.pairs} · Water`, 1 - timeLeft / cfg.time, timeLeft < cfg.time * 0.25 ? '#ff9a6b' : '#5aa0d8', timeLeft < cfg.time * 0.15 && state === 'play');
  }
  drawHudButtons();
  drawMessage(viewH - 70);
}

// ============================================================
//  Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
