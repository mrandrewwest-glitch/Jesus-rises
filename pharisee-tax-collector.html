<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Two Men Who Prayed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Two Men Who Prayed</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Scripture shown in this game (Luke 18:9-14), looked up in the chosen version.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  twoMen:  { ref: 'Luke 18:10', KJV: 'Two men went up into the temple to pray; the one a Pharisee, and the other a publican.', NKJV: 'Two men went up to the temple to pray, one a Pharisee and the other a tax collector.', NIV: 'Two men went up to the temple to pray, one a Pharisee and the other a tax collector.', NLT: 'Two men went to the Temple to pray. One was a Pharisee, and the other was a despised tax collector.' },
  proud:   { ref: 'Luke 18:11', KJV: 'God, I thank thee, that I am not as other men are', NKJV: 'God, I thank You that I am not like other men', NIV: 'God, I thank you that I am not like other people', NLT: 'I thank you, God, that I am not like other people' },
  mercy:   { ref: 'Luke 18:13', KJV: 'God be merciful to me a sinner.', NKJV: 'God, be merciful to me a sinner!', NIV: 'God, have mercy on me, a sinner.', NLT: 'O God, be merciful to me, for I am a sinner.' },
  exalted: { ref: 'Luke 18:14', KJV: 'For every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted.', NKJV: 'For everyone who exalts himself will be humbled, and he who humbles himself will be exalted.', NIV: 'For all those who exalt themselves will be humbled, and those who humble themselves will be exalted.', NLT: 'For those who exalt themselves will be humbled, and those who humble themselves will be exalted.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}
const verseText = (key) => Bible.verse(VERSES[key]).text;

// The shared sound engine (music.js): harp with the shepherd's pipe, and a temple crowd murmuring
Music.theme = { tune: 'amazingGrace', instrument: 'harp', accent: 'pipe', ambience: 'crowd', percussion: false };

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const isTouch = () => matchMedia('(pointer: coarse)').matches;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Blend two hex colours (f = 0 gives a, 1 gives b)
function mix(a, b, f) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = (s) => Math.round(lerp((x >> s) & 255, (y >> s) & 255, f));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning
// ============================================================
const FLOOR_Y = 690;      // back edge of the temple court floor
const BUB_R = 54;         // thought bubble radius
const TAP_SLOP = 14;      // extra tap radius around a bubble

const LEVEL_NAMES = [
  'The Morning Prayer',
  'The Hour of Incense',
  'A Busy Feast Day',
  'Passover Crowds',
  'The Evening Sacrifice',
  "Solomon's Porch",
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Temple Court ${n}`,
    speed: Math.min(50 + (n - 1) * 13, 150),        // how fast thoughts float up
    interval: Math.max(0.6, 1.75 - (n - 1) * 0.2),   // seconds between thoughts
    target: Math.min(6 + (n - 1) * 2, 19),           // humble prayers to gather
    prideMax: [6, 5, 5, 4, 4, 3][n - 1] || 3,        // proud thoughts that may escape
    time: Math.min(60 + (n - 1) * 4, 84),            // seconds until sunset
    proudFrac: Math.min(0.42 + (n - 1) * 0.04, 0.6),
    sway: 10 + n * 4,
    sameColour: n >= 3,    // from level 3 every thought wears the same colour
    sameShape: n >= 5,     // from level 5 they are all round: read the words!
    sneaky: n >= 3,        // proud thoughts dressed up as humble ones
  };
}

// Silly proud thoughts (not scripture) and humble prayers
const PROUD = [
  "I'm better than him!", 'Look at me pray!', 'My robe is the fanciest!', 'Did everyone see me?',
  "I'm SO good!", "Aren't I wonderful?", 'Me, me, me!', "I'm the best at praying!",
  "Glad I'm not like him!", 'Trumpets, please!', 'I deserve a medal!', 'Everyone, listen to me!',
  'I never get it wrong!', 'My prayers are longest!',
];
const SNEAKY = ["I'm the MOST humble!", 'Humbler than everyone!', 'See how humble I am?', 'Nobody prays like me!'];
const HUMBLE = [
  'Please help me', "I'm sorry", 'Have mercy on me', 'I need You, Lord', 'Thank You, God',
  'Forgive me', 'Help me do better', 'You are good, Lord', 'Help my neighbour too', "I'm listening",
  'Change my heart', 'Lord, hear me',
];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | intro | play | win | fail | pause
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('humbleBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let bubbles = [];         // floating thoughts
let puffs = [];           // popped proud thoughts drifting away as silly clouds
let orbs = [];            // gathered prayers flying to the tax collector (or proud ones to the pride cloud)
let particles = [];
let message = { text: '', t: 0 };
let speech = null;        // { who, key, t } words above the Pharisee or the tax collector
let speechQueue = [];
let bubble = null;        // Jesus's story bubble in the framing scene
let introT = 0, introStep = 0, introFade = 0;
let storyTold = false;
let prayer = 0, pride = 0, popped = 0, gathered = 0, streak = 0;
let timeLeft = 60, spawnT = 0, scripted = 0;
let wowT = 0, shockT = 0, flashT = 0, glowT = 0, endT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';

// ============================================================
//  People
// ============================================================
const PHARISEE = { robe: '#34589c', hair: '#6d6d6d', beard: true, skin: '#d9a066', scarf: '#f4efe0', fancy: true, i: 0, blink: 0, blinkT: 2, phase: 0.4, mood: 'smug', pose: 'proud' };
const TAXMAN   = { robe: '#8a6a48', hair: '#3a2716', beard: true, skin: '#c98d56', scarf: '#b9a27c', i: 1, blink: 0, blinkT: 3, phase: 1.3, mood: 'sorry', pose: 'breast' };
// Worshippers in the temple court (they react to everything)
const ONLOOKERS = [
  { robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070', f: 0.1 },
  { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', f: 0.56, scarf: '#e8dcc0' },
  { robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48', f: 0.68 },
  { robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678', f: 0.9, scarf: '#f0e2c8' },
].map((d, i) => ({ ...d, i: i + 2, mood: 'watch', switchT: 0, delay: rand(0.05, 0.4), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU) }));
// The crowd listening to Jesus in the framing scene (one is a Pharisee, arms folded)
const LISTENERS = [
  { robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { robe: '#34589c', hair: '#5a5a5a', beard: true,  skin: '#d39a66', scarf: '#f4efe0', fancy: true, pharisee: true },
  { robe: '#e3a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184', scarf: '#e8dcc0' },
  { robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55' },
  { robe: '#a0673a', hair: '#3a2515', beard: false, skin: '#dca678' },
  { robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150', scarf: '#d8c7a0' },
].map((d, i) => ({ ...d, i, mood: 'watch', switchT: 0, delay: rand(0.05, 0.5), blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU) }));

// Where everything stands in the temple court
function layout() {
  const k = W > 800 ? 1.2 : 1;                     // a little larger on wide screens
  return {
    px: W * 0.3, py: H - 150, ps: 1.45 * k,        // the Pharisee, up near the sanctuary
    cx: W - Math.max(60, W * 0.1), cy: H - 70, cs: 1.4 * k,  // the tax collector, standing afar off
    cloudX: clamp(W * 0.55, 200, W - 150), cloudY: -offY + 140,
    line: -offY + 160,                              // proud thoughts that rise past here puff up the pride cloud
  };
}

function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'worried';
  if (wowT > 0) return 'wow';
  return 'watch';
}

function listenerMood(d) {
  if (introStep === 0) return d.pharisee ? 'doubt' : 'watch';
  return d.pharisee ? 'worried' : 'wow';
}

function blinkPerson(d, dt) {
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
  if (d.blink > 0) d.blink -= dt;
}

function updatePeople(dt) {
  const target = crowdMood();
  for (const d of ONLOOKERS) {
    if (target !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = target; d.switchT = 0; }
    } else d.switchT = 0;
    blinkPerson(d, dt);
  }
  for (const d of LISTENERS) {
    const want = listenerMood(d);
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    blinkPerson(d, dt);
  }
  blinkPerson(PHARISEE, dt);
  blinkPerson(TAXMAN, dt);
  // The Pharisee stays pleased with himself; at the end he is simply amazed
  PHARISEE.mood = state === 'win' ? 'wow' : 'smug';
  PHARISEE.pose = state === 'win' ? 'rest' : 'proud';
  // The tax collector bows his head, and looks up in joy when his prayer rises
  TAXMAN.mood = state === 'win' ? 'joy' : glowT > 0 ? 'hope' : 'sorry';
  TAXMAN.pose = state === 'win' ? 'rest' : 'breast';
}

// A person in the house style. dim darkens colours for people further back.
// sx widens the figure (the Pharisee puffs up with pride!).
function drawPerson(d, x, y, s, lx, ly, dim = 0, sx = 1) {
  const mood = d.mood, pose = d.pose || 'rest';
  const col = (hex, amt = 0) => shade(hex, amt - dim);
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 10;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, y - jump * s);
  ctx.scale(s * sx, s);

  const sleeve = col(d.robe, -25);
  const skin = col(d.skin);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Arms raised behind the head: joy, or the Pharisee's grand prayer
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (pose === 'proud') {
    const wave = Math.sin(t * 2.2 + d.phase) * 3;
    arm(-11, -32, -30, -64 + wave);
    arm(11, -32, 30, -64 - wave);
  }

  // Robe
  ctx.fillStyle = col(d.robe);
  ctx.strokeStyle = col(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (d.fancy) {
    // Prayer shawl with blue stripes, a golden hem and tassels on the corners
    ctx.save(); ctx.clip();
    ctx.fillStyle = col('#f7f2e2');
    ctx.beginPath();
    ctx.moveTo(-19, -20); ctx.quadraticCurveTo(-12, -40, 0, -41); ctx.quadraticCurveTo(12, -40, 19, -20);
    ctx.lineTo(10, -16); ctx.quadraticCurveTo(0, -30, -10, -16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col('#3d63b0'); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-17, -22); ctx.lineTo(-9, -18.5); ctx.moveTo(17, -22); ctx.lineTo(9, -18.5); ctx.stroke();
    ctx.fillStyle = col('#e8b84a');
    ctx.fillRect(-20, -5, 40, 5);
    ctx.restore();
    ctx.strokeStyle = col('#f7f2e2'); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const tx of [-16, -13, 13, 16]) { ctx.moveTo(tx, 0); ctx.lineTo(tx + Math.sin(t * 3 + tx) * 1.2, 7); }
    ctx.stroke();
  } else {
    ctx.strokeStyle = col('#c9b07a'); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();
  }

  // Resting / folded / clasped arms in front
  if (mood !== 'joy' && pose !== 'proud') {
    if (pose === 'breast') {
      // one hand gently on his heart, the other hanging low
      const beat = Math.max(0, Math.sin(t * 4.2)) * 3;
      arm(-11, -32, -14, -12);
      arm(11, -32, 1 + beat, -29);
    } else if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); }
    else if (mood === 'worried') { arm(-11, -32, -2, -28); arm(11, -32, 2, -28); }
    else if (mood !== 'shock' && !(mood === 'dismay' && d.i % 2 === 0)) { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
    else if (mood === 'dismay') { arm(-11, -32, -15, -12); }
  }

  // Head: raised high when pleased with himself, bowed when sorry
  const bow = mood === 'sorry' ? 4 : mood === 'hope' ? 2 : 0;
  const hy = -53 + bow;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.scarf) {
    ctx.fillStyle = col(d.scarf);
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = d.fancy ? col('#3d63b0') : col(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    if (d.fancy) {
      // a little prayer box on his forehead
      ctx.fillStyle = col('#3a3030');
      roundRect(-4, hy - 19, 8, 7, 1.5); ctx.fill();
    }
  } else {
    ctx.fillStyle = col(d.hair);
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (d.beard) {
    ctx.fillStyle = col(d.hair);
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(-11, -32, -15, -12);
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy' && mood !== 'smug';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'smug':
      // eyes contentedly shut, eyebrows way up, a pleased little smirk
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3.5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3.5 * Math.cos(0.15 * Math.PI), ey - 1 + 3.5 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3.5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      brows(-11, -10, -11, -10);
      mouthLine(() => { ctx.moveTo(-4, mouthY - 1); ctx.quadraticCurveTo(1, mouthY + 1.5, 6, mouthY - 3); });
      ctx.fillStyle = 'rgba(255,120,120,0.35)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'sorry':
      // eyes cast down, a sorry little frown
      eyes(3.2, 3.6, 1.9);
      ctx.fillStyle = shade(d.skin, -12);
      ctx.fillRect(-ex - 4, ey - 4, 8, 2.5); ctx.fillRect(ex - 4, ey - 4, 8, 2.5);
      brows(-8, -5, -8, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 3.5, 1.25 * Math.PI, 1.75 * Math.PI));
      break;
    case 'hope':
      eyes(3.6, 4.4, 2);
      brows(-9, -7, -9, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 3.5, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function lookAt(x, y, tx, ty) {
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

// ============================================================
//  Jesus (framing scene)
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s, j.s);

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: one open toward the crowd as He tells the story
  const lift = j.speaking ? Math.sin(t * 3) * 3 : 0;
  const hands = [[-20, -22], [23, -34 + lift]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.speaking && Math.sin(t * 14) > -0.2) {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46.5, 2.2, 1.6 + Math.abs(Math.sin(t * 14)) * 0.8, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
//  Thought bubbles
// ============================================================
function spawnBubble(kind, x) {
  const k = kind || (Math.random() < cfg.proudFrac ? 'proud' : 'humble');
  let text;
  if (k === 'proud') text = cfg.sneaky && Math.random() < 0.3 ? pick(SNEAKY) : pick(PROUD);
  else text = pick(HUMBLE);
  // Pick a spot away from the thoughts that are already rising low down
  if (x === undefined) {
    let bestX = W / 2, bestD = -1;
    for (let i = 0; i < 6; i++) {
      const cx = rand(BUB_R + 10, W - BUB_R - 10);
      let dmin = 1e9;
      for (const b of bubbles) if (b.y > H - 260) dmin = Math.min(dmin, Math.abs(b.x - cx));
      if (dmin > bestD) { bestD = dmin; bestX = cx; }
    }
    x = bestX;
  }
  bubbles.push({
    kind: k, text, x, baseX: x, y: H + BUB_R + 10, r: BUB_R,
    vy: cfg.speed * rand(0.9, 1.1), phase: rand(0, TAU), age: 0, wob: 0,
  });
}

function updateBubbles(dt, live) {
  const L = layout();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.age += dt;
    b.y -= b.vy * dt;
    b.x = b.baseX + Math.sin(b.age * 1.3 + b.phase) * cfg.sway;
    b.wob = Math.max(0, b.wob - dt);
    // Gently nudge overlapping thoughts apart
    for (const o of bubbles) {
      if (o === b) continue;
      const dx = b.baseX - o.baseX, dy = b.y - o.y;
      const d = Math.hypot(dx, dy);
      if (d < b.r * 2 && d > 0) b.baseX += (dx / d) * 30 * dt;
    }
    b.baseX = clamp(b.baseX, b.r, W - b.r);
    if (b.kind === 'proud' && b.y < L.line) {
      bubbles.splice(i, 1);
      if (live) {
        // It floats up and puffs the Pharisee's pride cloud bigger
        orbs.push({ kind: 'pride', x0: b.x, y0: b.y, x: b.x, y: b.y, tx: L.cloudX, ty: L.cloudY, t: 0, dur: 0.5 });
        streak = 0;
      }
    } else if (b.kind === 'humble' && b.y < -offY - b.r) {
      bubbles.splice(i, 1);    // it rises on to heaven all the same
    }
  }
}

// Tap on a thought: pop the proud ones, gather the humble ones
function handleTap(x, y) {
  let hit = null, hd = 1e9;
  for (const b of bubbles) {
    const d = Math.hypot(x - b.x, y - b.y);
    if (d < b.r + TAP_SLOP && d < hd) { hit = b; hd = d; }
  }
  if (!hit) return false;
  bubbles.splice(bubbles.indexOf(hit), 1);
  streak++;
  if (hit.kind === 'proud') {
    popped++;
    totalScore += 50;
    puffs.push({ x: hit.x, y: hit.y, vx: (hit.x < W / 2 ? -1 : 1) * rand(60, 110), vy: rand(-40, -15), t: 0, r: hit.r * 0.75, spin: rand(-1, 1) });
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), sp = rand(40, 130);
      spawn(hit.x, hit.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.4, 0.8), '#ffffff', rand(4, 8));
    }
    sfx.pop();
    showMessage(pick(['Pop!', 'Pfft!', 'Poof!', 'Puff!']), 0.8);
  } else {
    gathered++;
    totalScore += 100;
    const L = layout();
    orbs.push({ kind: 'prayer', x0: hit.x, y0: hit.y, x: hit.x, y: hit.y, tx: L.cx, ty: L.cy - 42 * L.cs, t: 0, dur: 0.7 });
    for (let i = 0; i < 10; i++) {
      const a = rand(0, TAU), sp = rand(30, 90);
      spawn(hit.x, hit.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 0.9), Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4));
    }
    sfx.gather();
  }
  if (streak > 0 && streak % 6 === 0) showMessage(`A humble heart! ${streak} in a row`, 1.6);
  return true;
}

function updateFx(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy -= 10 * dt;
    if (p.t > 2.2) puffs.splice(i, 1);
  }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt;
    const f = clamp(o.t / o.dur, 0, 1);
    const e = f * f * (3 - 2 * f);
    const mx = (o.x0 + o.tx) / 2, my = Math.min(o.y0, o.ty) - 60;
    o.x = (1 - e) * (1 - e) * o.x0 + 2 * (1 - e) * e * mx + e * e * o.tx;
    o.y = (1 - e) * (1 - e) * o.y0 + 2 * (1 - e) * e * my + e * e * o.ty;
    if (o.kind === 'prayer' && Math.random() < dt * 30) spawn(o.x, o.y, rand(-10, 10), rand(-10, 10), 0.5, '#fff1a8', 2.5);
    if (f >= 1) {
      orbs.splice(i, 1);
      if (o.kind === 'prayer') arrivePrayer();
      else arrivePride();
    }
  }
}

function arrivePrayer() {
  if (state !== 'play') return;
  prayer++;
  glowT = 0.9; wowT = 0.9;
  const L = layout();
  for (let i = 0; i < 14; i++) spawn(L.cx + rand(-24, 24), L.cy - rand(40, 120), rand(-10, 10), rand(-140, -60), rand(0.8, 1.4), Math.random() < 0.5 ? '#ffe27a' : '#fffbe0', rand(2, 4));
  if (prayer >= cfg.target) win();
}

function arrivePride() {
  if (state !== 'play') return;
  pride++;
  shockT = 1; flashT = 0;
  const L = layout();
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), sp = rand(30, 90);
    spawn(L.cloudX, L.cloudY, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 0.9), '#e6ddf5', rand(4, 7));
  }
  sfx.puffUp();
  if (pride >= cfg.prideMax) { fail('pride'); return; }
  showMessage(pride === cfg.prideMax - 1 ? 'The pride cloud is nearly full!' : 'Puffed up!', 1.4);
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  endT = 0;
  const gatheredScore = gathered * 100, poppedScore = popped * 50;
  const timeBonus = Math.round(timeLeft) * 10;
  const humbleBonus = (cfg.prideMax - pride) * 100;
  const levelBonus = level * 500;
  const bonus = timeBonus + humbleBonus + levelBonus;
  totalScore += bonus;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('humbleBest', best); } catch (e) {} }
  lastScore = { gatheredScore, poppedScore, timeBonus, humbleBonus, levelBonus, score: gatheredScore + poppedScore + bonus };
  // The leftover proud thoughts all pop into little clouds; the humble ones rise home
  for (const b of bubbles) {
    if (b.kind === 'proud') puffs.push({ x: b.x, y: b.y, vx: (b.x < W / 2 ? -1 : 1) * rand(60, 110), vy: rand(-40, -15), t: 0, r: b.r * 0.75, spin: rand(-1, 1) });
    else for (let i = 0; i < 6; i++) spawn(b.x, b.y, rand(-20, 20), rand(-120, -60), 1.2, '#fff1a8', 3);
  }
  bubbles = [];
  const L = layout();
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(L.cx, L.cy - 60 * L.cs, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  speech = { who: 'tc', key: 'mercy', t: 3 };
  speechQueue = [];
  showMessage('His prayer rose to heaven!', 2.2);
  syncAmbience();
  sfx.win();
  endTimer = 2.4;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  endT = 0;
  speech = null; speechQueue = [];
  syncAmbience();
  sfx.fail();
  showMessage(reason === 'pride' ? 'All puffed up!' : 'The sun has set…', 2);
  endTimer = 1.6;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

// ============================================================
//  Overlay screens
// ============================================================
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');
let ovAction = null, ovAction2 = null;

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
  ovBody.innerHTML = body;
  ovBtn.textContent = btn;
  ovAction = action;
  ovBtn2.textContent = btn2 || '';

  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); ovAction = null; ovAction2 = null; }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  cfg = makeConfig(1);
  resetLevel();
  showOverlay('Two Men Who Prayed', 'The Pharisee and the Tax Collector',
    `${verseHTML('twoMen')}
     <ul>
       <li>Thought bubbles float up in the temple court. Some are <b>proud</b> and puffed up, some are <b>humble</b> prayers.</li>
       <li><b>Tap</b> (or click) a <b>proud</b> thought to pop it into a silly little cloud. Don't let them float away, or they puff up the pride cloud!</li>
       <li><b>Tap</b> a <b>humble</b> prayer to gather it, and help the tax collector's prayer rise as glowing light.</li>
       <li>Gather enough before the sun sets. Later on, the thoughts all look alike&hellip; read what they say!</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Hear the Story', () => { level = 1; totalScore = 0; startLevel(); });
}

function resetLevel() {
  cfg = makeConfig(level);
  bubbles = []; puffs = []; orbs = []; particles = [];
  ripples.length = 0;
  prayer = 0; pride = 0; popped = 0; gathered = 0; streak = 0;
  timeLeft = cfg.time; spawnT = 1.2; scripted = 0;
  wowT = shockT = flashT = glowT = 0;
  speech = null; speechQueue = []; bubble = null;
  endTimer = 0;
}

function startLevel(retry = false) {
  resetLevel();
  hideOverlay();
  sfx.levelStart();
  syncAmbience();
  if (!storyTold && !retry) {
    // Jesus tells the story to the crowd first
    state = 'intro';
    introT = 0; introStep = 0; introFade = 0;
    bubble = { key: 'twoMen', t: introDur()[0] };
    showMessage('Jesus told them a story…', 2.2);
    return;
  }
  beginPlay();
}

const introDur = () => [5.2, 4.2];

function advanceIntro() {
  if (introFade > 0) return;
  if (introStep === 0) { introStep = 1; introT = 0; bubble = { key: 'mercy', t: introDur()[1] }; }
  else { introFade = 0.001; if (bubble) bubble.t = Math.min(bubble.t, 0.4); }
}

function updateIntro(dt) {
  introT += dt;
  if (bubble) bubble.t = Math.max(0.35, bubble.t - dt);
  if (introFade > 0) {
    introFade += dt;
    if (introFade > 0.7) beginPlay();
    return;
  }
  if (introT > introDur()[introStep]) advanceIntro();
}

function beginPlay() {
  state = 'play';
  storyTold = true;
  bubble = null;
  introFade = 0;
  // Each man says his prayer as the level begins
  const d = level === 1 ? 3 : 2.4;
  speechQueue = [['pharisee', 'proud', d], ['tc', 'mercy', d]];
  speech = null;
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  syncAmbience();
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Exalted!', `Level ${level} complete — ${cfg.name}`,
      `<p style="text-align:center">The tax collector went home forgiven and glad.</p>
       ${verseHTML('exalted')}
       <p class="score">Humble prayers gathered: <b>${s.gatheredScore}</b><br>Proud thoughts popped: <b>${s.poppedScore}</b><br>Before sunset: <b>${s.timeBonus}</b><br>Humble heart bonus: <b>${s.humbleBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Prayer', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = failReason === 'pride'
      ? ['All puffed up!', 'Too many proud thoughts floated up and puffed the pride cloud full. Pop them before they drift away!']
      : ['The sun has set', 'Evening came before the prayer was gathered. Tap the humble prayers a little quicker!'];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('proud')}
       <p style="text-align:center;font-size:0.9rem;color:#7a6640">(That's the proud prayer. Let's try again!)</p>
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));
  }
}

function togglePause() {
  if (state === 'play' || state === 'intro') {
    pausedFrom = state;
    state = 'pause';
    syncAmbience();
    showOverlay('Paused', pausedFrom === 'intro' ? 'Jesus tells a story' : `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', () => startLevel(true));
  } else if (state === 'pause') {
    state = pausedFrom;
    hideOverlay();
    syncAmbience();
  }
}

const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (state === 'intro' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat) { advanceIntro(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(true); return; }
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'intro') { advanceIntro(); return; }
  if (state !== 'play') return;
  handleTap(p.x, p.y);
  ripples.push({ x: p.x, y: p.y, t: 0 });
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // A comic "pop" for a proud thought: a puff of air and a little boing downward
  pop() { this.puff(0.3); this.tone(520, 0.22, 'triangle', 0.22, 0, 180); },
  // A gathered prayer sings a note that climbs as the prayer grows
  gather() { this.tap(prayer / Math.max(1, cfg.target)); },
  // A proud thought joins the pride cloud: a silly swelling "pfffff"
  puffUp() { this.puff(0.22); this.tone(140, 0.4, 'sine', 0.25, 0, 260); },
};

// ============================================================
//  Rendering: the framing scene (Jesus tells the story)
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffsArr = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffsArr.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffsArr) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

const bgClouds = Array.from({ length: 5 }, () => ({ f: Math.random(), y: rand(120, 360), w: rand(90, 160), speed: rand(4, 9) }));

function storyLayout() {
  const gy = H - 170;
  const jx = W * 0.2;
  const slots = [];
  const n = LISTENERS.length;
  const x0 = W * 0.42, x1 = W - 40;
  LISTENERS.forEach((d, k) => {
    const back = k % 2 === 1;
    const x = lerp(x0, x1, k / (n - 1));
    slots.push({ d, x, y: gy + (back ? -18 : 20), s: back ? 1.05 : 1.25, row: back ? 0 : 1 });
  });
  return { gy, jx, slots };
}

function drawStoryScene() {
  const L = storyLayout();
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#8fcaf0'); g.addColorStop(0.6, '#cfeaf7'); g.addColorStop(1, '#fff3cf');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  for (const c of bgClouds) drawCloud(-offX - 150 + ((c.f + t * c.speed / 1000) % 1) * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.85)', 'rgba(220,235,250,0.7)');
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Distant Jerusalem on the hills
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, L.gy - 90 + Math.sin(x / 90) * 18 + Math.sin(x / 37) * 6);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#86b95d';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, L.gy - 20 + Math.sin(x / 140) * 10);
  ctx.lineTo(x1, H); ctx.fill();
  ctx.fillStyle = '#6f9e4a';
  ctx.fillRect(x0, L.gy + 60, x1 - x0, H - L.gy);
  // the rock Jesus stands on
  ctx.fillStyle = '#a89a86';
  ctx.beginPath(); ctx.ellipse(L.jx, L.gy + 6, 55, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c2b5a0';
  ctx.beginPath(); ctx.ellipse(L.jx - 6, L.gy - 2, 44, 13, 0, 0, TAU); ctx.fill();

  const speaking = state === 'intro' && bubble && bubble.t > 0.4 && introFade <= 0;
  const js = 1.7;
  const jHead = { x: L.jx, y: L.gy - 4 - 55 * js };
  for (const s of L.slots) if (s.row === 0) { const [lx, ly] = lookAt(s.x, s.y - 52 * s.s, jHead.x, jHead.y); drawPerson(s.d, s.x, s.y, s.s, lx, ly, 14); }
  drawJesus({ x: L.jx, y: L.gy - 4, s: js, speaking });
  for (const s of L.slots) if (s.row === 1) { const [lx, ly] = lookAt(s.x, s.y - 52 * s.s, jHead.x, jHead.y); drawPerson(s.d, s.x, s.y, s.s, lx, ly); }

  if (bubble) drawStoryBubble(L);
  if (state === 'intro' && introT > 0.8 && introFade <= 0) {
    ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(90,66,16,${0.5 + 0.3 * Math.sin(t * 4)})`;
    ctx.fillText(isTouch() ? 'Tap to continue' : 'Click or press Space to continue', W / 2, H - 24);
  }
}

function drawStoryBubble(L) {
  const text = '“' + verseText(bubble.key) + '”';
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  ctx.font = '700 19px Fredoka, sans-serif';
  const maxW = Math.min(W - 64, 520);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 30, h = lines.length * 24 + 20;
  const ax = L.jx + 14, ay = L.gy - 4 - 76 * 1.7;       // just above His head
  const bx = clamp(L.jx - 40, 14, W - w - 14), by = ay - 40 - h;
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 16); ctx.fill(); ctx.stroke();
  const tx = clamp(ax, bx + 20, bx + w - 40);
  ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 22, by + h - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(ax, ay - 4); ctx.lineTo(tx + 22, by + h); ctx.stroke();
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 15, by + 10 + 12 + i * 24));
  ctx.restore();
}

// ============================================================
//  Rendering: the temple court
// ============================================================
function sunsetF() {
  if (state === 'title') return 0;
  return clamp(1 - timeLeft / cfg.time, 0, 1);
}

function drawSky() {
  const f = sunsetF();
  const g = ctx.createLinearGradient(0, -offY, 0, FLOOR_Y);
  g.addColorStop(0, mix('#86c3ee', '#6f7fc6', f));
  g.addColorStop(0.6, mix('#bfe3f6', '#f3a37a', f));
  g.addColorStop(1, mix('#fff3cf', '#ffd08a', f));
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, FLOOR_Y + offY + 2);
  // The sun sinks toward the temple roof as evening comes
  const sx = W * 0.8, sy = lerp(-offY + 200, FLOOR_Y - 250, f);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
  sg.addColorStop(0, 'rgba(255,245,200,0.9)'); sg.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 90, 0, TAU); ctx.fill();
  ctx.fillStyle = mix('#fff1a8', '#ff9a4a', f);
  ctx.beginPath(); ctx.arc(sx, sy, 32, 0, TAU); ctx.fill();
  for (const c of bgClouds) drawCloud(-offX - 150 + ((c.f + t * c.speed / 1000) % 1) * (viewW + 300), c.y - offY * 0.5, c.w, c.w * 0.3, 'rgba(255,255,255,0.8)', 'rgba(230,225,245,0.7)');
}

function drawTemple() {
  const cx = W / 2;
  const bw = Math.min(W - 30, 780);
  const stone = '#f3e9d2', stoneDark = '#dccaa6', gold = '#e8b84a', goldDark = '#b9861f';
  const base = FLOOR_Y - 28;

  // Distant city walls behind
  ctx.fillStyle = '#e6d6b4';
  ctx.fillRect(-offX, FLOOR_Y - 150, viewW, 150);
  ctx.fillStyle = '#d6c39c';
  for (let x = -offX; x < viewW; x += 26) ctx.fillRect(x, FLOOR_Y - 162, 14, 14);

  // Side wings with columns
  const wingTop = base - 250;
  ctx.fillStyle = stone; ctx.strokeStyle = stoneDark; ctx.lineWidth = 2;
  ctx.fillRect(cx - bw / 2, wingTop, bw, base - wingTop);
  ctx.strokeRect(cx - bw / 2, wingTop, bw, base - wingTop);
  ctx.fillStyle = gold;
  ctx.fillRect(cx - bw / 2 - 8, wingTop - 14, bw + 16, 16);
  ctx.fillStyle = goldDark;
  ctx.fillRect(cx - bw / 2 - 8, wingTop, bw + 16, 3);
  // little golden spikes along the roof
  ctx.fillStyle = gold;
  for (let x = cx - bw / 2; x <= cx + bw / 2; x += 18) {
    ctx.beginPath(); ctx.moveTo(x - 3, wingTop - 14); ctx.lineTo(x, wingTop - 26); ctx.lineTo(x + 3, wingTop - 14); ctx.fill();
  }
  // columns
  const cols = Math.max(4, Math.round(bw / 70));
  for (let i = 0; i < cols; i++) {
    const x = cx - bw / 2 + 24 + (i / (cols - 1)) * (bw - 48);
    if (Math.abs(x - cx) < bw * 0.2) continue;
    ctx.fillStyle = '#fbf5e6';
    ctx.fillRect(x - 9, wingTop + 20, 18, base - wingTop - 20);
    ctx.fillStyle = stoneDark;
    ctx.fillRect(x + 4, wingTop + 20, 5, base - wingTop - 20);
    ctx.fillStyle = gold;
    ctx.fillRect(x - 12, wingTop + 14, 24, 8);
  }

  // The tall central porch
  const pw = Math.max(170, bw * 0.4), ptop = base - 390;
  const pg = ctx.createLinearGradient(cx - pw / 2, 0, cx + pw / 2, 0);
  pg.addColorStop(0, '#efe2c4'); pg.addColorStop(0.5, '#fbf4e2'); pg.addColorStop(1, '#e9dab8');
  ctx.fillStyle = pg; ctx.strokeStyle = stoneDark;
  ctx.fillRect(cx - pw / 2, ptop, pw, base - ptop);
  ctx.strokeRect(cx - pw / 2, ptop, pw, base - ptop);
  ctx.fillStyle = gold;
  ctx.fillRect(cx - pw / 2 - 10, ptop - 16, pw + 20, 18);
  for (let x = cx - pw / 2; x <= cx + pw / 2; x += 16) {
    ctx.beginPath(); ctx.moveTo(x - 3, ptop - 16); ctx.lineTo(x, ptop - 30); ctx.lineTo(x + 3, ptop - 16); ctx.fill();
  }
  ctx.fillStyle = goldDark;
  ctx.fillRect(cx - pw / 2 - 10, ptop + 2, pw + 20, 3);
  // golden vine over the doorway
  ctx.strokeStyle = gold; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = cx - pw * 0.36; x <= cx + pw * 0.36; x += 6) ctx.lineTo(x, ptop + 40 + Math.sin(x / 12) * 5);
  ctx.stroke();
  ctx.fillStyle = '#9b6fb0';
  for (let x = cx - pw * 0.33; x <= cx + pw * 0.33; x += 24) { ctx.beginPath(); ctx.arc(x, ptop + 52, 4, 0, TAU); ctx.fill(); }
  // The great doorway with its many-coloured curtain
  const dw = pw * 0.42, dtop = ptop + 80;
  ctx.fillStyle = gold;
  roundRect(cx - dw / 2 - 8, dtop - 8, dw + 16, base - dtop + 8, [dw / 2 + 8, dw / 2 + 8, 0, 0]); ctx.fill();
  const cg = ctx.createLinearGradient(cx - dw / 2, 0, cx + dw / 2, 0);
  cg.addColorStop(0, '#3a55a8'); cg.addColorStop(0.33, '#7b3fa0'); cg.addColorStop(0.66, '#b8323f'); cg.addColorStop(1, '#3a55a8');
  ctx.fillStyle = cg;
  roundRect(cx - dw / 2, dtop, dw, base - dtop, [dw / 2, dw / 2, 0, 0]); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 1; k < 6; k++) { const x = cx - dw / 2 + (k / 6) * dw; ctx.moveTo(x, dtop + 20); ctx.lineTo(x, base); }
  ctx.stroke();

  // Steps up to the sanctuary
  for (let k = 0; k < 3; k++) {
    ctx.fillStyle = k % 2 ? '#eadbb9' : '#f5ecd6';
    ctx.fillRect(cx - pw / 2 - 30 - k * 20, base + k * 9.5, pw + 60 + k * 40, 10);
  }
}

function drawFloor() {
  const x0 = -offX, x1 = W + offX;
  const fg = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  fg.addColorStop(0, '#e9dcbf'); fg.addColorStop(1, '#d8c59e');
  ctx.fillStyle = fg;
  ctx.fillRect(x0, FLOOR_Y, x1 - x0, H - FLOOR_Y + 2);
  // stone tiles in perspective
  ctx.strokeStyle = 'rgba(150,120,70,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  let y = FLOOR_Y + 6, gap = 10;
  while (y < H) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); gap *= 1.35; y += gap; }
  const vx = W / 2, vy = FLOOR_Y - 260;
  for (let k = -14; k <= 14; k++) {
    const bx = W / 2 + k * 90;
    const f = (FLOOR_Y - vy) / (H - vy);
    ctx.moveTo(lerp(vx, bx, f), FLOOR_Y); ctx.lineTo(bx, H);
  }
  ctx.stroke();
}

// The Pharisee's pride cloud: every proud thought that floats away makes it bigger
function drawPrideCloud(L) {
  const k = pride / cfg.prideMax;
  const w = 70 + 150 * k, h = 30 + 30 * k;
  const bob = Math.sin(t * 1.6) * 3;
  const y = L.cloudY + bob;
  ctx.globalAlpha = state === 'title' ? 0.6 : 0.95;
  drawCloud(L.cloudX, y, w, h, '#ece6f7', '#c9bde2');
  ctx.globalAlpha = 1;
  // a pleased, puffed-up face with rosy cheeks
  const fy = y - h * 0.15;
  ctx.strokeStyle = '#6d5a8c'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(L.cloudX - 10, fy, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.moveTo(L.cloudX + 14, fy + 2);
  ctx.arc(L.cloudX + 10, fy, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,140,160,0.45)';
  ctx.beginPath(); ctx.arc(L.cloudX - 20, fy + 8, 4.5, 0, TAU); ctx.arc(L.cloudX + 20, fy + 8, 4.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.strokeStyle = '#6d5a8c';
  ctx.moveTo(L.cloudX - 5, fy + 9); ctx.quadraticCurveTo(L.cloudX, fy + 12, L.cloudX + 6, fy + 7); ctx.stroke();
  if (state !== 'title') {
    ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#6d5a8c';
    ctx.fillText(`Pride ${pride}/${cfg.prideMax}`, L.cloudX, y + h * 0.75 + 14);
  }
}

// The tax collector's prayer rising as a column of light
function drawPrayerLight(L) {
  const f = state === 'win' ? 1 : prayer / cfg.target;
  const top = -offY;
  const bottom = L.cy - 30 * L.cs;
  const w = 36 + 40 * f + (state === 'win' ? Math.sin(t * 5) * 6 + 20 : 0);
  const a = 0.12 + 0.5 * f + glowT * 0.25;
  const g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, `rgba(255,240,170,${a * 0.6})`);
  g.addColorStop(1, `rgba(255,250,215,${a})`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(L.cx - w * 0.3, bottom); ctx.lineTo(L.cx - w / 2 - 12, top);
  ctx.lineTo(L.cx + w / 2 + 12, top); ctx.lineTo(L.cx + w * 0.3, bottom);
  ctx.closePath(); ctx.fill();
  // how far the prayer has risen
  const rise = lerp(bottom, top, f);
  ctx.fillStyle = `rgba(255,236,140,${0.4 + 0.2 * Math.sin(t * 4)})`;
  ctx.beginPath(); ctx.ellipse(L.cx, rise, w * 0.7, 10, 0, 0, TAU); ctx.fill();
  const hg = ctx.createRadialGradient(L.cx, L.cy - 45 * L.cs, 5, L.cx, L.cy - 45 * L.cs, 70 + 30 * f);
  hg.addColorStop(0, `rgba(255,240,170,${0.25 + 0.4 * f})`); hg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(L.cx, L.cy - 45 * L.cs, 100, 0, TAU); ctx.fill();
}

function drawThought(b) {
  const humble = b.kind === 'humble';
  const same = cfg.sameColour;
  const round = humble || cfg.sameShape;
  const bob = Math.sin(t * 2 + b.phase) * 2;
  const x = b.x, y = b.y + bob, r = b.r;
  // Fill colours: gold for humble, lilac for proud (the same pale blue on later levels)
  const fill = same ? ['#ffffff', '#e4f0fa'] : humble ? ['#fffbe6', '#ffe08a'] : ['#faf6ff', '#d7c9f0'];
  const edge = same ? '#8fb3d3' : humble ? '#e0a526' : '#9c86c9';
  if (humble && !same) {
    const gl = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.35);
    gl.addColorStop(0, 'rgba(255,230,140,0.45)'); gl.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, TAU); ctx.fill();
  }
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
  ctx.fillStyle = g; ctx.strokeStyle = edge; ctx.lineWidth = 3;
  ctx.beginPath();
  if (round) ctx.arc(x, y, r, 0, TAU);
  else {
    // a puffed-up, scalloped outline
    const n = 9;
    for (let i = 0; i <= n; i++) {
      const a0 = (i / n) * TAU + t * 0.3;
      const px = x + Math.cos(a0) * r * 0.86, py = y + Math.sin(a0) * r * 0.86;
      if (i === 0) ctx.moveTo(px + r * 0.26 * Math.cos(a0), py + r * 0.26 * Math.sin(a0));
      ctx.arc(px, py, r * 0.27, a0 - 1.4, a0 + 1.4);
    }
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  // little thought dots trailing underneath
  ctx.fillStyle = fill[1];
  ctx.beginPath(); ctx.arc(x - r * 0.5, y + r + 10, 7, 0, TAU); ctx.arc(x - r * 0.72, y + r + 26, 4, 0, TAU); ctx.fill();
  ctx.stroke();
  // icon on top: a tiny crown for proud thoughts, a heart for humble prayers
  ctx.save();
  ctx.translate(x, y - r + 2);
  if (humble) {
    ctx.fillStyle = '#e8577a';
    ctx.beginPath();
    ctx.moveTo(0, 7); ctx.bezierCurveTo(-13, -3, -6, -12, 0, -5); ctx.bezierCurveTo(6, -12, 13, -3, 0, 7);
    ctx.fill();
  } else {
    ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#b9861f'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-11, 5); ctx.lineTo(-12, -8); ctx.lineTo(-5, -1); ctx.lineTo(0, -10); ctx.lineTo(5, -1); ctx.lineTo(12, -8); ctx.lineTo(11, 5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // the words
  ctx.fillStyle = humble && !same ? '#7a4f00' : same ? '#34506b' : '#4e3a78';
  ctx.font = '700 15px Fredoka, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = wrapText(b.text, r * 1.55);
  lines.forEach((l, i) => ctx.fillText(l, x, y + 3 + (i - (lines.length - 1) / 2) * 17));
  ctx.textBaseline = 'alphabetic';
}

// A popped proud thought drifts away as a silly little cloud with puffed cheeks
function drawPuff(p) {
  const a = clamp(1 - (p.t - 1.2), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.sin(p.t * 3) * 0.15 * p.spin);
  const s = 0.7 + Math.min(p.t * 2, 0.3);
  ctx.scale(s, s);
  drawCloud(0, 0, p.r * 2, p.r * 0.9, '#ffffff', '#dcd4ee');
  ctx.strokeStyle = '#6d5a8c'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, -8); ctx.lineTo(-6, -5); ctx.lineTo(-12, -2);
  ctx.moveTo(12, -8); ctx.lineTo(6, -5); ctx.lineTo(12, -2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,140,160,0.5)';
  ctx.beginPath(); ctx.arc(-17, 3, 5, 0, TAU); ctx.arc(17, 3, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6d5a8c';
  ctx.beginPath(); ctx.ellipse(0, 5, 3, 2.4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawOrb(o) {
  if (o.kind === 'prayer') {
    const g = ctx.createRadialGradient(o.x, o.y, 2, o.x, o.y, 24);
    g.addColorStop(0, 'rgba(255,255,235,1)'); g.addColorStop(0.4, 'rgba(255,225,120,0.8)'); g.addColorStop(1, 'rgba(255,225,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, 24, 0, TAU); ctx.fill();
  } else {
    drawCloud(o.x, o.y, 44, 20, '#f3eefb', '#cfc3e6');
  }
}

// Words spoken by the Pharisee or the tax collector
function drawSpeech(L) {
  if (!speech) return;
  const text = '“' + verseText(speech.key) + '”';
  const who = speech.who;
  ctx.save();
  ctx.globalAlpha = clamp(speech.t / 0.3, 0, 1);
  ctx.font = '700 16px Fredoka, sans-serif';
  const maxW = Math.min(W * 0.55, 300);
  const lines = wrapText(text, maxW);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 24, h = lines.length * 20 + 16;
  const hx = who === 'pharisee' ? L.px : L.cx;
  const hyTop = who === 'pharisee' ? L.py - 78 * L.ps : L.cy - 78 * L.cs;
  const bx = clamp(hx - w / 2, 10, W - w - 10), by = hyTop - 22 - h;
  ctx.fillStyle = who === 'pharisee' ? '#f6f1ff' : '#fffbe8';
  ctx.strokeStyle = who === 'pharisee' ? '#9c86c9' : '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(hx - 10, bx + 14, bx + w - 34);
  ctx.beginPath(); ctx.moveTo(tx, by + h - 1.5); ctx.lineTo(hx, hyTop - 4); ctx.lineTo(tx + 20, by + h - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(hx, hyTop - 4); ctx.lineTo(tx + 20, by + h); ctx.stroke();
  ctx.fillStyle = who === 'pharisee' ? '#4e3a78' : '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 12, by + 8 + 10 + i * 20));
  ctx.restore();
}

function drawCourt() {
  const L = layout();
  drawSky();
  drawTemple();
  drawFloor();

  // Worshippers near the sanctuary
  for (const d of ONLOOKERS) {
    const x = W * d.f, y = FLOOR_Y + 26;
    const [lx, ly] = lookAt(x, y - 40, L.cx, L.cy - 60);
    drawPerson(d, x, y, 0.8, lx, ly, 16);
  }

  drawPrayerLight(L);
  drawPrideCloud(L);

  // The Pharisee, puffing up a little with every proud thought that gets away
  const puffUp = 1 + 0.05 * pride;
  drawPerson(PHARISEE, L.px, L.py, L.ps, 0, -1, 0, puffUp);
  // The tax collector, standing afar off
  const [tlx, tly] = state === 'win' ? [0, -1] : [0.2, 1];
  drawPerson(TAXMAN, L.cx, L.cy, L.cs, tlx, tly);

  for (const b of bubbles) drawThought(b);
  for (const p of puffs) drawPuff(p);
  for (const o of orbs) drawOrb(o);
  drawParticles();
  drawSpeech(L);
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const story = state === 'intro' || (state === 'pause' && pausedFrom === 'intro');

  // Left: level + prayer meter
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Two Men Who Prayed' : story ? 'Jesus tells a story' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (!story && state !== 'title') {
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('PRAYER', 12, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(64, 38, 124, 13, 6.5); ctx.fill();
    const pf = state === 'win' ? 1 : prayer / cfg.target;
    const gg = ctx.createLinearGradient(64, 0, 188, 0);
    gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
    ctx.fillStyle = gg;
    if (pf > 0) { roundRect(64, 38, 124 * pf, 13, 6.5); ctx.fill(); }
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '700 12px Fredoka, sans-serif';
    ctx.fillText(`${Math.min(prayer, cfg.target)}/${cfg.target}`, 194, 49);
  }

  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: time until sunset
  if (!story && state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#5a4210';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('SUNSET', rx, 20);
    ctx.shadowBlur = 0;
    const f = clamp(timeLeft / cfg.time, 0, 1);
    ctx.fillStyle = 'rgba(90,66,16,0.25)';
    roundRect(rx - 100, 28, 100, 11, 5.5); ctx.fill();
    ctx.fillStyle = f < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : mix('#ff9a4a', '#ffd35a', f);
    if (f > 0) { roundRect(rx - 100 * f, 28, 100 * f, 11, 5.5); ctx.fill(); }
    ctx.fillStyle = '#5a4210';
    ctx.font = '700 15px Fredoka, sans-serif';
    ctx.shadowBlur = 4;
    ctx.fillText(`${Math.ceil(timeLeft)}s`, rx, 60);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.3);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, H * 0.3);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX * scale, offY * scale);

  const story = state === 'intro' || (state === 'pause' && pausedFrom === 'intro');
  if (story) {
    drawStoryScene();
    if (introFade > 0) {
      ctx.fillStyle = `rgba(255,250,235,${clamp(introFade / 0.6, 0, 1)})`;
      ctx.fillRect(-offX, -offY, viewW, viewH);
    }
  } else {
    drawCourt();
  }

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePlay(dt) {
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; fail('sunset'); return; }

  // Each man's words at the start of the level
  if (speech) { speech.t -= dt; if (speech.t <= 0) speech = null; }
  if (!speech && speechQueue.length) { const [who, key, d] = speechQueue.shift(); speech = { who, key, t: d }; }

  // New thoughts: on level 1 the first two are placed to teach the two taps
  spawnT -= dt;
  if (spawnT <= 0) {
    if (level === 1 && scripted < 2) {
      spawnBubble(scripted === 0 ? 'proud' : 'humble', scripted === 0 ? W * 0.4 : W * 0.62);
      showMessage(scripted === 0 ? 'Tap the proud thought to pop it!' : 'Tap the humble prayer to gather it!', 3);
      scripted++;
      spawnT = 2.6;
    } else {
      spawnBubble();
      spawnT = cfg.interval * rand(0.8, 1.2);
    }
  }
  updateBubbles(dt, true);
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (state === 'intro') updateIntro(dt);
  else if (state === 'play') { updatePlay(dt); updateFx(dt); }
  else if (state === 'win' || state === 'fail') {
    endT += dt;
    updateBubbles(dt, false);
    updateFx(dt);
    if (speech) { speech.t -= dt; if (speech.t <= 0) speech = null; }
    if (state === 'win' && Math.random() < dt * 14) {
      const L = layout();
      spawn(L.cx + rand(-30, 30), L.cy - rand(40, 140), 0, rand(-120, -60), 1.4, '#fff6d0', 3);
    }
  }
  wowT = Math.max(0, wowT - dt);
  shockT = Math.max(0, shockT - dt);
  flashT = Math.max(0, flashT - dt);
  glowT = Math.max(0, glowT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
