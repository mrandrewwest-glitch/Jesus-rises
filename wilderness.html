<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f29a7a">
<title>Jesus in the Wilderness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f29a7a;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Jesus in the Wilderness</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';

// Sound: the shared music engine (music.js) with this game's tune, instruments and ambience
Music.theme = { tune: 'amazingGrace', instrument: 'pipe', accent: 'harp', ambience: 'wind', percussion: false };

// Scripture shown in this game. Bible.verse() falls back to the KJV (labelled KJV)
// when a version is missing.
const VERSES = {
  led:       { ref: 'Matthew 4:1', KJV: 'Then was Jesus led up of the Spirit into the wilderness to be tempted of the devil.', NKJV: 'Then Jesus was led up by the Spirit into the wilderness to be tempted by the devil.', NIV: 'Then Jesus was led by the Spirit into the wilderness to be tempted by the devil.', NLT: 'Then Jesus was led by the Spirit into the wilderness to be tempted there by the devil.' },
  // The tempter's three offers (speech bubbles)
  stones:    { ref: 'Matthew 4:3', KJV: 'If thou be the Son of God, command that these stones be made bread.', NKJV: 'If You are the Son of God, command that these stones become bread.', NIV: 'If you are the Son of God, tell these stones to become bread.', NLT: 'If you are the Son of God, tell these stones to become loaves of bread.' },
  castDown:  { ref: 'Matthew 4:6', KJV: 'If thou be the Son of God, cast thyself down', NKJV: 'If You are the Son of God, throw Yourself down.', NIV: 'If you are the Son of God... throw yourself down.', NLT: 'If you are the Son of God, jump off!' },
  kingdoms:  { ref: 'Matthew 4:9', KJV: 'All these things will I give thee, if thou wilt fall down and worship me.', NKJV: 'All these things I will give You if You will fall down and worship me.', NIV: 'All this I will give you... if you will bow down and worship me.', NLT: 'I will give it all to you... if you will kneel down and worship me.' },
  // Jesus's three answers (the right scrolls)
  bread:     { ref: 'Matthew 4:4', KJV: 'Man shall not live by bread alone', NKJV: 'Man shall not live by bread alone', NIV: 'Man shall not live on bread alone', NLT: 'People do not live by bread alone' },
  tempt:     { ref: 'Matthew 4:7', KJV: 'Thou shalt not tempt the Lord thy God.', NKJV: 'You shall not tempt the Lord your God.', NIV: 'Do not put the Lord your God to the test.', NLT: 'You must not test the Lord your God.' },
  worship:   { ref: 'Matthew 4:10', KJV: 'Thou shalt worship the Lord thy God, and him only shalt thou serve.', NKJV: 'You shall worship the Lord your God, and Him only you shall serve.', NIV: 'Worship the Lord your God, and serve him only.', NLT: 'You must worship the Lord your God and serve only him.' },
  // Cards
  everyWord: { ref: 'Matthew 4:4', KJV: 'Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.', NKJV: 'Man shall not live by bread alone, but by every word that proceeds from the mouth of God.', NIV: 'Man shall not live on bread alone, but on every word that comes from the mouth of God.', NLT: 'People do not live by bread alone, but by every word that comes from the mouth of God.' },
  angels:    { ref: 'Matthew 4:10–11', KJV: 'Get thee hence, Satan... Then the devil leaveth him, and, behold, angels came and ministered unto him.', NKJV: 'Away with you, Satan!... Then the devil left Him, and behold, angels came and ministered to Him.', NIV: 'Away from me, Satan!... Then the devil left him, and angels came and attended him.', NLT: 'Get out of here, Satan... Then the devil went away, and angels came and took care of Jesus.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// The three temptations. The wrong scrolls are our own plausible-sounding (but wrong)
// ideas, not Scripture; they come in an old-fashioned wording for the KJV and a
// modern wording for the other versions, so the style never gives the answer away.
const ROUNDS = [
  { offer: 'stones', answer: 'bread', prop: 'stones',
    wrong: [
      { KJV: 'A hungry man may make bread by any means he can.', modern: 'A hungry man may make bread any way he can.' },
      { KJV: 'Take and eat, for thou hast fasted long enough.', modern: 'Take and eat, for you have fasted long enough.' },
      { KJV: 'Bread first, and afterward the word of God.', modern: 'Bread first, and after that the word of God.' },
    ] },
  { offer: 'castDown', answer: 'tempt', prop: 'temple',
    wrong: [
      { KJV: 'The angels shall catch me, so I will leap.', modern: 'The angels will catch me, so I will jump.' },
      { KJV: 'Show them a great sign, and all shall believe.', modern: 'Show them a great sign, and everyone will believe.' },
      { KJV: 'Test the Lord, and see if He keepeth His promise.', modern: 'Test the Lord, and see if He keeps His promise.' },
    ] },
  { offer: 'kingdoms', answer: 'worship', prop: 'kingdoms',
    wrong: [
      { KJV: 'Bow down but once, and rule the world for good.', modern: 'Bow down just once, and rule the world for good.' },
      { KJV: 'Worship whosoever giveth thee the most.', modern: 'Worship whoever gives you the most.' },
      { KJV: 'Take the kingdoms now, and give them back to God later.', modern: 'Take the kingdoms now, and give them back to God later.' },
    ] },
];

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const hash = (k) => { const s = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning & layout
// ============================================================
const HORIZON = 470;      // where the sand meets the sky
const FEET_Y = 540;       // where Jesus and the tempter stand
const J_SCALE = 1.5;      // Jesus is drawn a little larger than in Jesus Rises
const ANGEL_CY = 182;     // the angels' little cloud in the sky
const SCROLL_H = 84;      // answer scroll height
const WATER_GAIN = 22;    // strength from a spring
const SHADE_GAIN = 15;    // strength from resting in shade
const MIRAGE_COST = 10;   // strength lost chasing a mirage

const jx = () => W * 0.27;                    // Jesus's x
const tempterX = () => W * 0.73 + tempter.dx; // the tempter's x
const slotY = (i) => 636 + i * 94;            // centre of each answer scroll slot

const LEVEL_NAMES = [
  'Into the Wilderness',
  'Stones and Sand',
  'The Dry Hills',
  'The Holy City',
  'The High Mountain',
  'The Fortieth Night',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Wilderness ${n}`,
    time: Math.max(5, 13 - (n - 1) * 2),        // seconds in the sand timer
    shuffles: Math.min(n - 1, 3),               // how often the scrolls swap places
    shuffleDur: Math.max(0.4, 0.75 - n * 0.06), // how fast they swap
    walkTime: 11 + Math.min(n, 4),              // seconds of desert walking
    speed: 110 + n * 15,                        // walking speed (px/s)
    drain: 4.5 + n * 1.2,                       // strength lost per second walking
    reach: Math.max(150, 270 - (n - 1) * 30),   // how far He can reach shade/water
    gap: 230 + n * 20,                          // distance between springs & shade
    mirage: n >= 2 ? Math.min(0.15 + (n - 2) * 0.07, 0.35) : 0,
    wrongCost: 25 + n * 5,                      // strength lost for a wrong scroll
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('wildernessBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let phase = 'title';      // title | tempt | walk
let round = 0;            // which temptation (0..2)
let phaseT = 0;
let strength = 100;
let timeLeft = 0, timerOn = false, answered = false, answerT = 0, leaving = false;
let scrolls = [];
let shuffleAt = [];
let walkX = 0;
let items = [];
let tempter = { alpha: 0, mood: 'sly', moodT: 0, dx: 0 };
let jesus = { face: 'calm', faceT: 0, pose: 'open', walkPhase: 0 };
let particles = [];
let message = { text: '', t: 0 };
let shockT = 0, joyT = 0, wowT = 0, flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let trans = null;          // fade between the temptation and the desert walk
let winT = 0;
let tickCd = 0;
let stats = { answerPts: 0, gatherPts: 0 };
let hintShown = {};

// ============================================================
//  Angels, watching from a little cloud (they come down at the end, Matthew 4:11)
// ============================================================
const ANGELS = [
  { name: 'Gold',  robe: '#fbf8ff', hair: '#e2b64f', beard: false, skin: '#f1c49a', carry: 'bread' },
  { name: 'Brown', robe: '#fbf8ff', hair: '#7a4a22', beard: false, skin: '#c98d56', carry: 'jar' },
  { name: 'Dark',  robe: '#fbf8ff', hair: '#2e1d10', beard: false, skin: '#8d5a3a', carry: null },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: i === 0 ? 0 : rand(0.05, 0.45),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'shock';
  if (joyT > 0) return 'joy';
  if (wowT > 0) return 'wow';
  if (phase === 'tempt' && timerOn && !answered && timeLeft / cfg.time < 0.35) return 'worried';
  if (strength < 25) return 'worried';
  return 'watch';
}

function updateAngels(dt) {
  const target = crowdMood();
  for (const d of ANGELS) {
    const want = target;
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

function descendF() { return state === 'win' ? ease(clamp((winT - 0.9) / 1.5, 0, 1)) : 0; }

function angelSlots() {
  const cx = jx(), cy = ANGEL_CY;
  const sky = [[cx - 50, cy, 0.7], [cx, cy - 6, 0.74], [cx + 50, cy, 0.7]];
  const ground = [[cx - 72, FEET_Y + 4, 0.95], [cx + 72, FEET_Y + 4, 0.95], [cx + 142, FEET_Y - 2, 0.85]];
  const f = descendF();
  return ANGELS.map((d, i) => {
    const bob = Math.sin(t * 1.8 + d.phase) * 3 * (1 - f);
    return {
      d, x: lerp(sky[i][0], ground[i][0], f), y: lerp(sky[i][1], ground[i][1], f) + bob,
      s: lerp(sky[i][2], ground[i][2], f), flying: f > 0 && f < 1, landed: f >= 1,
    };
  });
}

function drawAngel(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy' && !slot.flying) jump = Math.abs(Math.sin(t * 7 + d.phase)) * (slot.landed ? 5 : 8);
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);

  // Wings, flapping hard while flying down
  const flap = Math.sin(t * (slot.flying ? 14 : 3) + d.phase) * (slot.flying ? 0.35 : 0.1);
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 7, -33);
    ctx.rotate(side * (0.35 + flap));
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#cfd8ee'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(side * 19, -8, 22, 11, side * -0.5, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#dde4f4';
    ctx.beginPath();
    for (const k of [0.3, 0.55, 0.8]) { ctx.moveTo(side * 6, -2); ctx.lineTo(side * (8 + 30 * k), -2 - 16 * k + 6); }
    ctx.stroke();
    ctx.restore();
  }

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward Jesus
  const jX = jx(), jY = FEET_Y - 75;
  const wx = x, wy = slot.y - 52 * s;
  const len = Math.hypot(jX - wx, jY - wy) || 1;
  const lx = (jX - wx) / len, ly = (jY - wy) / len;
  const dir = jX < x ? -1 : 1;
  const carrying = d.carry && slot.landed;

  // Arms raised for joy / pointing in wonder
  if (!carrying) {
    if (mood === 'joy') {
      const wave = Math.sin(t * 9 + d.phase) * 4;
      arm(-11, -32, -24 + wave, -66);
      arm(11, -32, 24 - wave, -66);
    } else if (mood === 'wow' && d.i % 3 === 0) {
      arm(11, -32, 20 + lx * 6, -70);
    }
  }

  // Robe with a golden sash
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f0c040'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (carrying) {
    arm(-11, -32, dir * 20 - 4, -30);
    arm(11, -32, dir * 20 + 4, -30);
  } else if (mood === 'watch' || (mood === 'wow' && d.i % 3 !== 0)) {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  ctx.fillStyle = d.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
  ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
  ctx.closePath(); ctx.fill();

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (!carrying) {
    if (mood === 'shock') {
      arm(-11, -32, -15, hy + 4);
      arm(11, -32, 15, hy + 4);
    } else if (mood === 'dismay' && d.i % 2 === 0) {
      arm(11, -32, 2, hy - 3);   // facepalm
      ctx.fillStyle = d.skin;
      roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
    } else if (mood === 'dismay') {
      arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
    }
  }

  // Bread and water for Him (Matthew 4:11: they ministered unto him)
  if (carrying) {
    const cx = dir * 22, cy = -36;
    if (d.carry === 'bread') {
      ctx.fillStyle = '#c98a3e'; ctx.strokeStyle = '#8a5a22'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, 13, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f2cf8a'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (const k of [-5, 0, 5]) { ctx.moveTo(cx + k - 2, cy - 5); ctx.lineTo(cx + k + 2, cy - 1); }
      ctx.stroke();
    } else {
      ctx.fillStyle = '#c0703a'; ctx.strokeStyle = '#7a4020'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy - 14); ctx.lineTo(cx + 5, cy - 14);
      ctx.quadraticCurveTo(cx + 13, cy - 4, cx + 8, cy + 8);
      ctx.lineTo(cx - 8, cy + 8);
      ctx.quadraticCurveTo(cx - 13, cy - 4, cx - 5, cy - 14);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath(); ctx.ellipse(cx, cy - 14, 5, 2, 0, 0, TAU); ctx.fill();
    }
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.ellipse(0, hy - 24, 12, 4, 0, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Jesus (drawn like Jesus Rises, standing on the sand instead of a cloud)
// ============================================================
function drawJesus(x, y) {
  const j = jesus;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(J_SCALE, J_SCALE);

  // soft shadow on the sand
  ctx.fillStyle = 'rgba(90,40,40,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 5, 0, 0, TAU); ctx.fill();

  const walking = j.pose === 'walk';
  const up = j.pose === 'raised';
  const step = walking ? Math.sin(j.walkPhase) : 0;
  const bob = walking ? Math.abs(Math.sin(j.walkPhase)) * 2 : 0;

  // Sandalled feet peeking out below the robe
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath();
  ctx.ellipse(-6 + step * 5, 0, 5, 2.6, 0, 0, TAU);
  ctx.ellipse(6 - step * 5, 0, 5, 2.6, 0, 0, TAU);
  ctx.fill();
  ctx.translate(0, -2 - bob);

  if (up || state === 'win') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: raised in praise, swinging as He walks, open and welcoming otherwise
  let hands = [[-20, -22], [20, -22]];
  if (up) hands = [[-21, -66], [21, -66]];
  else if (walking) hands = [[-17 - step * 4, -20], [17 - step * 4, -20]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (j.face === 'oops') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -53, 2.8, 0, TAU); ctx.arc(4, -53, 2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.3, 0, TAU); ctx.arc(4, -53, 1.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
    if (j.face === 'effort') {
      ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6.5, -57.5); ctx.lineTo(-2, -56.5); ctx.moveTo(6.5, -57.5); ctx.lineTo(2, -56.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.face === 'oops') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 2, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  ctx.restore();
}

function setFace(face, dur) { jesus.face = face; jesus.faceT = dur; }

// ============================================================
//  The tempter: only a shadowy, sly silhouette with glowing eyes
// ============================================================
function drawTempter(x, y, a, mood) {
  if (a <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = a;
  const sway = Math.sin(t * 1.6) * 4;
  const shrink = mood === 'recoil' ? 0.92 : 1;
  ctx.scale(shrink, shrink);

  ctx.fillStyle = 'rgba(40,20,50,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 4, 46, 9, 0, 0, TAU); ctx.fill();

  // Wispy cloak, fading out toward the sand
  const g = ctx.createLinearGradient(0, -175, 0, 8);
  g.addColorStop(0, '#2b1a45');
  g.addColorStop(0.55, '#3b2560');
  g.addColorStop(1, 'rgba(70,40,110,0.08)');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(120,70,190,0.6)'; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(-44, -6);
  for (let i = 1; i <= 8; i++) {
    ctx.lineTo(-44 + i * 11, -6 + Math.sin(t * 3 + i * 1.3) * 4 + (i % 2 ? 7 : 0));
  }
  ctx.quadraticCurveTo(46, -70, 30 + sway * 0.5, -110);
  ctx.quadraticCurveTo(26, -150, 6 + sway, -168);
  ctx.quadraticCurveTo(-14 + sway, -180, -26 + sway, -164);   // hood tip curls toward Jesus
  ctx.quadraticCurveTo(-38, -140, -34, -110);
  ctx.quadraticCurveTo(-50, -60, -44, -6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // A wisp of a hand gesturing at the offer
  const wave = Math.sin(t * 2.2) * 6;
  ctx.strokeStyle = '#3a2560'; ctx.lineCap = 'round';
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-24, -86); ctx.quadraticCurveTo(-52, -84 + wave, -70, -64 + wave * 0.5); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(-74, -66 + wave * 0.5, 5, 0, Math.PI * 1.5); ctx.stroke();

  // The dark hood opening
  const fx = -6 + sway * 0.6;
  ctx.fillStyle = '#140b22';
  ctx.beginPath(); ctx.ellipse(fx, -124, 22, 19, 0, 0, TAU); ctx.fill();

  // Glowing eyes, glancing sideways at Jesus
  ctx.fillStyle = '#ffd65a';
  ctx.shadowColor = '#ffcf4a'; ctx.shadowBlur = 10;
  for (const side of [-1, 1]) {
    const ex = fx + side * 9, ey = -127;
    ctx.beginPath();
    if (mood === 'recoil') {
      ctx.arc(ex, ey, 4.6, 0, TAU);
    } else if (mood === 'smug') {
      ctx.moveTo(ex - 6, ey + 1); ctx.quadraticCurveTo(ex, ey - 4, ex + 6, ey + 1);
      ctx.quadraticCurveTo(ex, ey - 1, ex - 6, ey + 1);
    } else {
      // sly: the lids slope down toward the middle
      ctx.moveTo(ex - 6, ey + 1);
      ctx.lineTo(ex - 6, ey - (side < 0 ? 4 : 1));
      ctx.lineTo(ex + 6, ey - (side < 0 ? 1 : 4));
      ctx.lineTo(ex + 6, ey + 1);
      ctx.quadraticCurveTo(ex, ey + 4, ex - 6, ey + 1);
    }
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (mood !== 'smug') {
    ctx.fillStyle = '#3a1d05';
    const px = mood === 'recoil' ? 0 : -2.5;
    ctx.beginPath(); ctx.arc(fx - 9 + px, -126, 1.6, 0, TAU); ctx.arc(fx + 9 + px, -126, 1.6, 0, TAU); ctx.fill();
  }

  // A thin, lopsided grin
  ctx.strokeStyle = 'rgba(255,214,90,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mood === 'recoil') ctx.ellipse(fx, -113, 3, 4, 0, 0, TAU);
  else if (mood === 'smug') { ctx.moveTo(fx - 12, -117); ctx.quadraticCurveTo(fx, -105, fx + 12, -118); }
  else { ctx.moveTo(fx - 11, -114); ctx.quadraticCurveTo(fx - 2, -108, fx + 9, -117); ctx.lineTo(fx + 11, -119); }
  ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Temptation rounds
// ============================================================
function startTempt() {
  phase = 'tempt';
  phaseT = 0;
  timeLeft = cfg.time;
  timerOn = false;
  answered = false; answerT = 0; leaving = false;
  tempter = { alpha: 0, mood: 'sly', moodT: 0, dx: 40 };
  jesus.pose = 'open';
  const R = ROUNDS[round];
  const wrong = [...R.wrong].sort(() => Math.random() - 0.5).slice(0, 2);
  const opts = [{ correct: true, key: R.answer }, ...wrong.map((w) => ({ correct: false, w }))];
  opts.sort(() => Math.random() - 0.5);
  scrolls = opts.map((o, i) => ({
    ...o, slot: i,
    py: H + 140 + i * 90, from: H + 140 + i * 90, to: slotY(i),
    animT: 0, dur: 0.8 + i * 0.12, delay: 1.0, latAmp: 0, lat: 0,
    dead: false, crumble: 0, glow: 0,
  }));
  // shuffles happen partway through the countdown
  shuffleAt = [];
  for (let i = 0; i < cfg.shuffles; i++) shuffleAt.push(cfg.time * 0.75 * (i + 1) / (cfg.shuffles + 1));
  sfx.whoosh();
}

function scrollRect(s) {
  const sw = Math.min(W - 36, 560);
  const bob = s.animT >= s.dur ? Math.sin(t * 2 + s.slot * 1.7) * 2 : 0;
  return { x: W / 2 - sw / 2 + s.lat, y: s.py - SCROLL_H / 2 + bob, w: sw, h: SCROLL_H };
}

function shuffleScrolls() {
  const k = Math.random() < 0.5 ? 1 : 2;   // rotate slots so every scroll moves
  for (const s of scrolls) {
    const ns = (s.slot + k) % 3;
    s.from = s.py; s.to = slotY(ns); s.slot = ns;
    s.animT = 0; s.delay = 0; s.dur = cfg.shuffleDur;
    s.latAmp = (s.to > s.from ? 1 : -1) * 80;
  }
  sfx.puff(0.25);
  if (!hintShown.shuffle) { hintShown.shuffle = true; showMessage('The scrolls are shuffling!'); }
}

function updateScrolls(dt) {
  for (const s of scrolls) {
    if (s.delay > 0) { s.delay -= dt; continue; }
    if (s.animT < s.dur) {
      s.animT = Math.min(s.dur, s.animT + dt);
      const p = ease(s.animT / s.dur);
      s.py = lerp(s.from, s.to, p);
      s.lat = s.latAmp * Math.sin(Math.PI * p);
    }
    if (s.dead) s.crumble = Math.min(1, s.crumble + dt * 1.4);
    if (answered && s.correct) s.glow = Math.min(1, s.glow + dt * 3);
  }
}

function updateTempt(dt) {
  phaseT += dt;
  tempter.alpha = Math.min(1, tempter.alpha + dt * 1.4);
  tempter.dx = Math.max(0, tempter.dx - dt * 60);
  if (tempter.moodT > 0) { tempter.moodT -= dt; if (tempter.moodT <= 0) tempter.mood = 'sly'; }
  updateScrolls(dt);

  if (!timerOn && phaseT >= 2.1) {
    timerOn = true;
    if (level === 1 && round === 0) showMessage('Tap the scroll with Jesus’s answer!');
  }
  if (timerOn && !answered) {
    const before = cfg.time - timeLeft;
    timeLeft = Math.max(0, timeLeft - dt);
    const el = cfg.time - timeLeft;
    for (const at of shuffleAt) if (before < at && el >= at) shuffleScrolls();
    if (timeLeft < 3.5) {
      tickCd -= dt;
      if (tickCd <= 0) { sfx.tick(); tickCd = 0.5; }
    }
    if (timeLeft <= 0) { fail('time'); return; }
  }
  if (answered) {
    answerT += dt;
    tempter.dx += dt * 30;
    if (answerT > 1.7 && !leaving) {
      leaving = true;
      if (round < 2) startTransition(startWalk);
      else victory();
    }
  }
}

function choose(s) {
  if (answered || s.dead || !timerOn || state !== 'play') return;
  const r = scrollRect(s);
  if (s.correct) {
    answered = true;
    answerT = 0;
    const pts = 150 + Math.round((timeLeft / cfg.time) * 250);
    stats.answerPts += pts;
    joyT = 1.8;
    tempter.mood = 'recoil'; tempter.moodT = 99;
    jesus.pose = 'raised';
    setFace('joy', 1.8);
    showMessage(`It is written!  +${pts}`);
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU), sp = rand(40, 170);
      spawn(r.x + r.w / 2 + rand(-r.w / 3, r.w / 3), r.y + r.h / 2, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.3),
        ['#ffe27a', '#fff6d0', '#ffffff'][i % 3], rand(2, 4));
    }
    flashT = 0.15;
    sfx.right();
  } else {
    s.dead = true;
    strength = Math.max(0, strength - cfg.wrongCost);
    shockT = 1;
    tempter.mood = 'smug'; tempter.moodT = 1.3;
    setFace('oops', 0.9);
    shakeT = 0.25;
    showMessage(Math.random() < 0.5 ? 'That is not what is written...' : 'Not His answer! Try another');
    for (let i = 0; i < 26; i++) {
      spawn(r.x + rand(20, r.w - 20), r.y + rand(0, r.h), rand(-50, 50), rand(-60, 10), rand(0.6, 1.1),
        i % 2 ? '#e8d3a2' : '#c9a86a', rand(2.5, 5), 260);
    }
    sfx.wrong();
    if (strength <= 0) fail('wrong');
  }
}

function pickSlot(n) {
  const s = scrolls.find((sc) => sc.slot === n && !sc.dead);
  if (s) choose(s);
}

// ============================================================
//  Desert walk between temptations: tap shade and water
// ============================================================
function startWalk() {
  round++;
  phase = 'walk';
  phaseT = 0;
  leaving = false;
  jesus.pose = 'walk';
  tempter.alpha = 0;
  scrolls = [];
  items = [];
  const dist = cfg.speed * cfg.walkTime;
  let x = walkX + W + 40;
  while (x - walkX < dist + jx() - 60) {
    const r = Math.random();
    const type = r < cfg.mirage ? 'mirage' : r < cfg.mirage + (1 - cfg.mirage) * 0.5 ? 'water' : 'shade';
    items.push({ x, type, used: false, fade: 0 });
    x += cfg.gap * rand(0.8, 1.25);
  }
  if (level === 1 && round === 1) showMessage('Tap shade & water when He is near!');
  else if (cfg.mirage > 0 && !hintShown.mirage) { hintShown.mirage = true; showMessage('Beware of shimmering mirages!'); }
  else showMessage('On through the desert...');
}

function inReach(it) {
  return !it.used && Math.abs(it.x - walkX - jx()) < cfg.reach;
}

function itemHit(it, p) {
  const sx = it.x - walkX;
  return Math.abs(p.x - sx) < 75 && p.y > FEET_Y - 160 && p.y < FEET_Y + 60;
}

function gather(it) {
  const sx = it.x - walkX, by = FEET_Y + 8;
  it.used = true;
  if (it.type === 'mirage') {
    strength = Math.max(0, strength - MIRAGE_COST);
    shockT = 0.8;
    setFace('oops', 0.8);
    showMessage('Just a mirage!');
    for (let i = 0; i < 16; i++) spawn(sx + rand(-40, 40), by - rand(0, 10), rand(-30, 30), rand(-60, -20), 0.8, '#bfe6f7', rand(2, 4));
    sfx.bounce();
    if (strength <= 0) fail('weary');
    return;
  }
  const water = it.type === 'water';
  strength = Math.min(100, strength + (water ? WATER_GAIN : SHADE_GAIN));
  stats.gatherPts += 20;
  wowT = 1;
  setFace('joy', 0.9);
  showMessage(water ? (Math.random() < 0.5 ? 'Cool water!' : 'Refreshing!') : 'A little shade');
  for (let i = 0; i < 18; i++) {
    const c = water ? (i % 2 ? '#7cc4f2' : '#ffffff') : (i % 2 ? '#a8d08d' : '#fff6d0');
    spawn(sx + rand(-40, 40), by - rand(0, 30), rand(-50, 50), rand(-120, -40), rand(0.6, 1), c, rand(2, 4), 160);
  }
  sfx.tap(water ? 0.8 : 0.5);
}

function reachNearest() {
  let bestIt = null;
  for (const it of items) {
    if (!inReach(it) || it.type === 'mirage') continue;
    if (!bestIt || Math.abs(it.x - walkX - jx()) < Math.abs(bestIt.x - walkX - jx())) bestIt = it;
  }
  if (bestIt) gather(bestIt);
  else showMessage('Nothing within reach yet...');
}

function updateWalk(dt) {
  phaseT += dt;
  walkX += cfg.speed * dt;
  jesus.walkPhase += dt * 8;
  strength = Math.max(0, strength - cfg.drain * dt);
  for (const it of items) if (it.used) it.fade = Math.min(1, it.fade + dt * 2);
  if (strength <= 0) { fail('weary'); return; }
  if (phaseT >= cfg.walkTime) {
    phaseT = cfg.walkTime;
    if (!leaving) { leaving = true; startTransition(() => { leaving = false; startTempt(); }); }
  }
}

// Fade through a dusky veil between scenes
function startTransition(fn) { trans = { t: 0, fn }; }
function updateTransition(dt) {
  if (!trans) return;
  trans.t += dt;
  if (trans.t >= 0.45 && trans.fn) { const f = trans.fn; trans.fn = null; f(); }
  if (trans.t >= 0.9) trans = null;
}
function veilAlpha() {
  if (!trans) return 0;
  return trans.t < 0.45 ? trans.t / 0.45 : 1 - (trans.t - 0.45) / 0.45;
}

// ============================================================
//  Win / fail
// ============================================================
function victory() {
  state = 'win';
  syncAmbience();
  winT = 0;
  jesus.pose = 'open';
  setFace('joy', 99);
  const strengthBonus = Math.round(strength) * 3;
  const levelBonus = level * 300;
  const score = stats.answerPts + stats.gatherPts + strengthBonus + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('wildernessBest', best); } catch (e) {} }
  lastScore = { answers: stats.answerPts, gathered: stats.gatherPts, strengthBonus, levelBonus, score };
  showMessage('The tempter slips away!');
  sfx.whoosh();
  sfx.win();
  endTimer = 3.6;
}

function fail(reason) {
  state = 'fail';
  syncAmbience();
  failReason = reason;
  setFace('oops', 99);
  if (phase === 'walk') jesus.pose = 'open';
  tempter.mood = 'smug'; tempter.moodT = 99;
  sfx.fail();
  endTimer = 1.4;
}

function showMessage(text, dur = 2.2) { message = { text, t: dur }; }

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');

const ovBtn2 = document.getElementById('ovBtn2');

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {
  ovTitle.textContent = title;
  ovSub.textContent = sub;
