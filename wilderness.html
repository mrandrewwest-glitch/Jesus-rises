ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });
ovBtn2.addEventListener('click', () => { sfx.init(); if (ovAction2) ovAction2(); });

function titleScreen() {
  state = 'title';
  syncAmbience();
  phase = 'title';
  cfg = makeConfig(1);
  tempter = { alpha: 0.55, mood: 'sly', moodT: 0, dx: 0 };
  jesus = { face: 'calm', faceT: 0, pose: 'open', walkPhase: 0 };
  showOverlay('Jesus in the Wilderness', 'Forty days in the desert',
    `${verseHTML('led')}
     <ul>
       <li>Three times the <b>tempter</b> comes with a sly offer. Three scrolls float up: tap the one with <b>Jesus's real answer from Scripture</b> before the sand timer runs out.</li>
       <li>Between temptations, walk the desert at dusk: tap <b>shade</b> and <b>water</b> when Jesus is near to keep up His <b>strength</b>.</li>
       <li><b>Keyboard:</b> <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> pick a scroll (top to bottom), <kbd>Space</kbd> reaches for shade or water.</li>
       <li>Each level the sand runs faster and the scrolls shuffle. The angels are watching&hellip;</li>
     </ul>
     ${best ? `<p class="score">Best score: <b>${best}</b></p>` : ''}
     ${creditHTML()}`,
    'Into the Wilderness', () => { level = 1; totalScore = 0; startLevel(); });
}

function startLevel() {
  cfg = makeConfig(level);
  strength = 100;
  stats = { answerPts: 0, gatherPts: 0 };
  round = 0;
  walkX = 0;
  items = [];
  particles = [];
  ripples.length = 0;
  trans = null;
  shockT = joyT = wowT = flashT = shakeT = 0;
  endTimer = 0;
  jesus = { face: 'calm', faceT: 0, pose: 'open', walkPhase: 0 };
  state = 'play';
  syncAmbience();
  startTempt();
  hideOverlay();
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
}

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('Angels came!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('angels')}
       <p class="score">Answers from Scripture: <b>${s.answers}</b><br>Shade &amp; water: <b>${s.gathered}</b><br>Strength left: <b>${s.strengthBonus}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(); });
  } else if (state === 'fail') {
    const lines = {
      time: ['The sand ran out!', 'The tempter was left waiting for an answer. Look for the words that are written in Scripture.'],
      wrong: ['Not quite!', 'Those scrolls did not hold the words Jesus spoke. Look for what is written!'],
      weary: ['So weary...', 'Jesus grew too tired in the hot desert. Tap shade and water when He is near.'],
    }[failReason] || ['Try again!', ''];
    showOverlay(lines[0], `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">${lines[1]}</p>
       ${verseHTML('everyWord')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel());
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    syncAmbience();
    sfx.thrust(0);
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Rest a moment. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', startLevel);
  } else if (state === 'pause') {
    state = 'play';
    syncAmbience();
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state !== 'play' || trans || e.repeat) return;
  const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
  if (phase === 'tempt' && n !== undefined) pickSlot(n);
  if (phase === 'walk' && ['Space', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) reachNearest();
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

function handleTap(p) {
  if (state !== 'play' || trans) return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  if (phase === 'tempt') {
    for (const s of scrolls) {
      if (s.dead) continue;
      const r = scrollRect(s);
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y - 4 && p.y <= r.y + r.h + 4) { choose(s); return; }
    }
  } else if (phase === 'walk') {
    for (const it of items) {
      if (it.used || !itemHit(it, p)) continue;
      if (inReach(it)) gather(it);
      else showMessage(it.x - walkX > jx() ? 'Wait until He is closer...' : 'Too far behind now!');
      return;
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  handleTap(p);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
    { x: 102, y: 84, r: 16, icon: sfx.muted ? 'muted' : 'sound', action: () => sfx.toggleMute() },
  ];
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// A few extra little sounds made with the same helpers
Object.assign(sfx, {
  right() {   // three rising sung notes for a right answer
    if (!Music.ac) return;
    const t0 = Music.ac.currentTime;
    [0.2, 0.55, 0.9].forEach((h, i) => Music.render(Music.ac, Music.out, t0 + 0.02 + i * 0.13, 'tap', Music.theme, h));
  },
  wrong() { this.puff(0.3); this.tone(330, 0.3, 'triangle', 0.22, 0, 165); },
  tick() { this.tone(1400, 0.05, 'square', 0.04); },
  whoosh() {  // the tempter slipping in or out
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(1200, t0 + 0.6);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 1);
  },
});

// ============================================================
//  Rendering: the desert at dusk
// ============================================================
const STARS = Array.from({ length: 70 }, () => ({ f: Math.random(), y: rand(-320, HORIZON - 130), r: rand(0.8, 2), tw: rand(0, TAU) }));

// The light fades from golden dusk to twilight as the level goes on
function duskLevel() {
  if (phase === 'title') return 0.15;
  let k = round * 2;
  if (phase === 'walk') k = (round - 1) * 2 + 1 + clamp(phaseT / cfg.walkTime, 0, 1);
  return clamp(0.12 + k * 0.17, 0, 0.9);
}

function drawSky(dusk) {
  const top = -offY;
  const g1 = ctx.createLinearGradient(0, top, 0, HORIZON);
  g1.addColorStop(0, '#7b6bb8'); g1.addColorStop(0.55, '#f2a07e'); g1.addColorStop(1, '#ffd68f');
  ctx.fillStyle = g1;
  ctx.fillRect(-offX, top, viewW, HORIZON - top + 20);
  const g2 = ctx.createLinearGradient(0, top, 0, HORIZON);
  g2.addColorStop(0, '#1d2154'); g2.addColorStop(0.55, '#5b3f80'); g2.addColorStop(1, '#e8865c');
  ctx.globalAlpha = dusk;
  ctx.fillStyle = g2;
  ctx.fillRect(-offX, top, viewW, HORIZON - top + 20);
  ctx.globalAlpha = 1;

  // Stars come out as it gets darker
  const sa = clamp((dusk - 0.3) * 1.6, 0, 1);
  if (sa > 0) {
    ctx.fillStyle = '#fff8e0';
    for (const s of STARS) {
      ctx.globalAlpha = sa * (0.55 + 0.45 * Math.sin(t * 2 + s.tw));
      ctx.beginPath(); ctx.arc(-offX + s.f * viewW, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // The setting sun
  const sx = W * 0.62, sy = HORIZON - 40 + dusk * 70, r = 46;
  const glow = ctx.createRadialGradient(sx, sy, r * 0.6, sx, sy, r * 3.2);
  glow.addColorStop(0, 'rgba(255,215,130,0.55)');
  glow.addColorStop(1, 'rgba(255,215,130,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, r * 3.2, 0, TAU); ctx.fill();
  ctx.fillStyle = dusk > 0.5 ? '#ff9a5a' : '#ffc86a';
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
}

function drawLand() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  // Far hills of Judea
  const m = walkX * 0.08;
  ctx.fillStyle = '#9a6a8e';
  ctx.beginPath(); ctx.moveTo(x0, HORIZON + 10);
  for (let x = x0; x <= x1 + 10; x += 12) ctx.lineTo(x, HORIZON - 38 - 26 * Math.sin((x + m) / 150) - 14 * Math.sin((x + m) / 57 + 1));
  ctx.lineTo(x1 + 10, HORIZON + 10); ctx.fill();
  // Dunes
  const d1 = walkX * 0.3;
  ctx.fillStyle = '#d98f5c';
  ctx.beginPath(); ctx.moveTo(x0, HORIZON + 14);
  for (let x = x0; x <= x1 + 10; x += 10) ctx.lineTo(x, HORIZON - 8 - 12 * Math.sin((x + d1) / 120) - 6 * Math.sin((x + d1) / 47));
  ctx.lineTo(x1 + 10, HORIZON + 14); ctx.fill();
  // The sand
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#eab070'); g.addColorStop(0.5, '#e6a866'); g.addColorStop(1, '#d8935a');
  ctx.fillStyle = g;
  const d2 = walkX * 0.55;
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1 + 10; x += 10) ctx.lineTo(x, HORIZON + 8 + 6 * Math.sin((x + d2) / 170));
  ctx.lineTo(x1 + 10, H + 10); ctx.closePath(); ctx.fill();
  // ripples in the sand
  ctx.strokeStyle = 'rgba(190,120,70,0.25)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 9; k++) {
    const y = HORIZON + 40 + k * 44;
    const off = ((walkX * (0.6 + k * 0.05)) % 260 + 260) % 260;
    for (let x = x0 - off; x < x1; x += 260) {
      ctx.moveTo(x + 40, y); ctx.quadraticCurveTo(x + 80, y - 6, x + 120, y);
    }
  }
  ctx.stroke();
}

function drawRock(x, y, s) {
  ctx.fillStyle = 'rgba(90,40,30,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 16 * s, 4 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b3876a';
  ctx.beginPath(); ctx.ellipse(x, y - 6 * s, 14 * s, 9 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c99c7c';
  ctx.beginPath(); ctx.ellipse(x - 4 * s, y - 9 * s, 7 * s, 4 * s, -0.3, 0, TAU); ctx.fill();
}

function drawScrub(x, y, s) {
  ctx.strokeStyle = '#7b6a3e'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const a of [-0.9, -0.4, 0, 0.4, 0.9]) { ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(a) * 16 * s, y - Math.cos(a) * 16 * s); }
  ctx.stroke();
  ctx.fillStyle = '#8f9a55';
  ctx.beginPath();
  for (const a of [-0.9, -0.4, 0, 0.4, 0.9]) { const px = x + Math.sin(a) * 16 * s, py = y - Math.cos(a) * 16 * s; ctx.moveTo(px + 4 * s, py); ctx.arc(px, py, 4 * s, 0, TAU); }
  ctx.fill();
}

// Rocks and scrub dotted over the sand, scrolling past as He walks
function drawDecor() {
  const step = 150;
  const k0 = Math.floor((walkX - offX - 200) / step), k1 = Math.floor((walkX + W + offX + 200) / step);
  for (let k = k0; k <= k1; k++) {
    const h1 = hash(k), h2 = hash(k + 101), h3 = hash(k + 211);
    const x = k * step + h1 * step - walkX;
    const far = h2 < 0.35;
    const y = far ? lerp(HORIZON + 25, FEET_Y - 25, h3) : lerp(FEET_Y + 45, H - 20, h3);
    const s = far ? 0.55 + h3 * 0.3 : 0.9 + h3 * 0.5;
    if (h1 < 0.55) drawRock(x, y, s); else drawScrub(x, y, s);
  }
}

// ---------- The tempter's offers, shown behind / beside him ----------
function drawTemple(x, a) {
  if (a <= 0) return;
  const base = HORIZON + 6;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#f3e3c3'; ctx.strokeStyle = '#c9a66b'; ctx.lineWidth = 1.5;
  // city wall with battlements
  ctx.fillRect(x - 120, base - 30, 240, 30); ctx.strokeRect(x - 120, base - 30, 240, 30);
  for (let bx = x - 120; bx < x + 120; bx += 16) { ctx.fillRect(bx, base - 37, 9, 8); ctx.strokeRect(bx, base - 37, 9, 8); }
  // the temple
  ctx.fillRect(x - 46, base - 96, 92, 66); ctx.strokeRect(x - 46, base - 96, 92, 66);
  ctx.fillStyle = '#e6b33a';
  ctx.fillRect(x - 52, base - 104, 104, 9);
  ctx.strokeStyle = '#d8c39a';
  ctx.beginPath();
  for (let cx = x - 34; cx <= x + 34; cx += 17) { ctx.moveTo(cx, base - 94); ctx.lineTo(cx, base - 32); }
  ctx.stroke();
  ctx.fillStyle = '#7a5a3a';
  ctx.beginPath(); ctx.moveTo(x - 10, base - 30); ctx.lineTo(x - 10, base - 50); ctx.arc(x, base - 50, 10, Math.PI, TAU); ctx.lineTo(x + 10, base - 30); ctx.fill();
  // the pinnacle
  ctx.fillStyle = '#f3e3c3'; ctx.strokeStyle = '#c9a66b';
  ctx.fillRect(x + 54, base - 150, 24, 120); ctx.strokeRect(x + 54, base - 150, 24, 120);
  ctx.fillStyle = '#e6b33a';
  ctx.beginPath(); ctx.moveTo(x + 50, base - 150); ctx.lineTo(x + 66, base - 176); ctx.lineTo(x + 82, base - 150); ctx.fill();
  const tw = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.fillStyle = `rgba(255,240,160,${0.5 + tw * 0.5})`;
  ctx.beginPath(); ctx.arc(x + 66, base - 178, 3 + tw * 2, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawKingdoms(a) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  const n = Math.max(3, Math.round(W / 190));
  for (let i = 0; i < n; i++) {
    const cx = W * (i + 0.5) / n + (hash(i + 7) - 0.5) * 40;
    const base = HORIZON + 6;
    for (let b = 0; b < 4; b++) {
      const bw = 14 + hash(i * 5 + b) * 16, bh = 22 + hash(i * 9 + b) * 40;
      const bx = cx - 40 + b * 20;
      ctx.fillStyle = b % 2 ? '#e9d2a8' : '#f4e2bd';
      ctx.fillRect(bx, base - bh, bw, bh);
      if (hash(i * 3 + b) > 0.45) {   // golden domes
        ctx.fillStyle = '#f0b93a';
        ctx.beginPath(); ctx.arc(bx + bw / 2, base - bh, bw / 2, Math.PI, TAU); ctx.fill();
      }
      // twinkling windows
      ctx.fillStyle = `rgba(255,220,110,${0.5 + 0.5 * Math.sin(t * 3 + i + b * 2)})`;
      ctx.fillRect(bx + bw / 2 - 2, base - bh * 0.6, 4, 5);
    }
  }
  // sparkles of worldly glory
  for (let i = 0; i < 12; i++) {
    const sx = W * hash(i + 31), sy = HORIZON - 30 - hash(i + 57) * 60;
    const tw = Math.max(0, Math.sin(t * 2.5 + i * 1.7));
    ctx.fillStyle = `rgba(255,236,150,${tw})`;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 6 * tw); ctx.lineTo(sx + 2, sy); ctx.lineTo(sx, sy + 6 * tw); ctx.lineTo(sx - 2, sy); ctx.closePath();
    ctx.moveTo(sx - 6 * tw, sy); ctx.lineTo(sx, sy + 2); ctx.lineTo(sx + 6 * tw, sy); ctx.lineTo(sx, sy - 2); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Stones that the tempter says could be bread (one glows like a warm loaf)
function drawStones(a) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  const cx = tempterX() - 88, y = FEET_Y + 12;
  const list = [[-34, 0, 11], [-12, 4, 13], [12, -2, 12], [34, 5, 10], [0, 12, 9]];
  list.forEach(([dx, dy, r], i) => {
    const loaf = i === 1;
    if (loaf) {
      const g = ctx.createRadialGradient(cx + dx, y + dy - 4, 2, cx + dx, y + dy - 4, 30);
      g.addColorStop(0, `rgba(255,215,120,${0.45 + 0.25 * Math.sin(t * 3)})`);
      g.addColorStop(1, 'rgba(255,215,120,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + dx, y + dy - 4, 30, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(90,40,30,0.2)';
    ctx.beginPath(); ctx.ellipse(cx + dx, y + dy + 2, r * 1.1, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = loaf ? '#d4a064' : '#b9a58a';
    ctx.beginPath(); ctx.ellipse(cx + dx, y + dy - r * 0.45, r * 1.15, r * 0.75, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = loaf ? '#ecc488' : '#d0bea2';
    ctx.beginPath(); ctx.ellipse(cx + dx - r * 0.3, y + dy - r * 0.7, r * 0.5, r * 0.28, -0.3, 0, TAU); ctx.fill();
  });
  ctx.restore();
}

// ---------- Desert walk: springs, shade and mirages ----------
function drawWater(x, y, used) {
  ctx.fillStyle = 'rgba(90,40,30,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y + 4, 60, 12, 0, 0, TAU); ctx.fill();
  // palm tree
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 36, y - 2); ctx.quadraticCurveTo(x + 30, y - 50, x + 46, y - 96); ctx.stroke();
  ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 6;
  ctx.beginPath();
  for (const a of [-2.6, -2.0, -1.2, -0.5, 0.1]) {
    const ex = x + 46 + Math.cos(a) * 38, ey = y - 96 + Math.sin(a) * 20 + 14;
    ctx.moveTo(x + 46, y - 96); ctx.quadraticCurveTo((x + 46 + ex) / 2, y - 112 + Math.sin(a) * 10, ex, ey);
  }
  ctx.stroke();
  // rocks round the spring
  for (const [dx, r] of [[-46, 9], [-36, 7], [40, 8], [48, 6]]) {
    ctx.fillStyle = '#a98266';
    ctx.beginPath(); ctx.ellipse(x + dx, y - 2, r * 1.3, r, 0, 0, TAU); ctx.fill();
  }
  // the pool
  const r = used ? 0.55 : 1;
  ctx.fillStyle = used ? '#8fb8c4' : '#4fb3d9';
  ctx.beginPath(); ctx.ellipse(x, y, 40 * r, 11 * r, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(x - 10 * r, y - 3 * r, 14 * r, 3 * r, 0, 0, TAU); ctx.fill();
  if (!used) {
    const tw = Math.max(0, Math.sin(t * 4 + x));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(x + 14, y - 2, 2.5, 0, TAU); ctx.fill();
  }
  // reeds
  ctx.strokeStyle = '#6f9a45'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (const dx of [-30, -26, 24, 29]) { ctx.moveTo(x + dx, y - 4); ctx.lineTo(x + dx + (dx < 0 ? -3 : 3), y - 24); }
  ctx.stroke();
}

function drawShade(x, y, used) {
  // cool shade under a broom tree beside a boulder
  ctx.fillStyle = used ? 'rgba(70,40,60,0.18)' : 'rgba(70,40,70,0.3)';
  ctx.beginPath(); ctx.ellipse(x - 4, y + 2, 62, 13, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9e7658';
  ctx.beginPath(); ctx.ellipse(x + 24, y - 16, 30, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b88d6c';
  ctx.beginPath(); ctx.ellipse(x + 16, y - 24, 14, 8, -0.3, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.quadraticCurveTo(x - 24, y - 40, x - 14, y - 70); ctx.stroke();
  ctx.fillStyle = '#7f9a4c';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-34, -70, 20], [-12, -84, 24], [8, -70, 19], [-20, -58, 16]]) { ctx.moveTo(x + dx + r, y + dy); ctx.arc(x + dx, y + dy, r, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(x - 18, y - 92, 9, 0, TAU); ctx.fill();
}

function drawMirage(x, y, fade) {
  const a = (0.42 + 0.18 * Math.sin(t * 5 + x)) * (1 - fade);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  const wob = Math.sin(t * 6) * 4;
  ctx.fillStyle = '#9ad8f2';
  ctx.beginPath(); ctx.ellipse(x + wob, y, 46, 11, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 3; k++) {
    const yy = y - 20 - k * 12;
    ctx.moveTo(x - 40, yy);
    for (let dx = -40; dx <= 40; dx += 10) ctx.lineTo(x + dx, yy + Math.sin(t * 8 + dx * 0.2 + k) * 3);
  }
  ctx.stroke();
  // a wobbly, see-through palm
  ctx.strokeStyle = '#6fa4a8'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x + 30, y - 4); ctx.quadraticCurveTo(x + 26 + wob, y - 40, x + 38 + wob * 2, y - 78); ctx.stroke();
  ctx.restore();
}

function drawReachZone() {
  if (state !== 'play') return;
  ctx.save();
  ctx.setLineDash([10, 9]);
  ctx.strokeStyle = 'rgba(255,238,160,0.75)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(jx(), FEET_Y + 8, cfg.reach, 20, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawItems() {
  for (const it of items) {
    const sx = it.x - walkX;
    if (sx < -offX - 140 || sx > W + offX + 140) continue;
    const by = FEET_Y + 8;
    if (it.type === 'water') drawWater(sx, by, it.used);
    else if (it.type === 'shade') drawShade(sx, by, it.used);
    else drawMirage(sx, by, it.fade);
    // a bouncing "tap" arrow when Jesus can reach it
    if (state === 'play' && inReach(it)) {
      const bob = Math.abs(Math.sin(t * 6)) * 8;
      const ay = by - 128 - bob;
      ctx.fillStyle = '#fff1a8'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx - 11, ay); ctx.lineTo(sx + 11, ay); ctx.lineTo(sx, ay + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
      ctx.strokeText('tap!', sx, ay - 6);
      ctx.fillStyle = '#8a5a00'; ctx.fillText('tap!', sx, ay - 6);
    }
  }
}

// ---------- Temptation UI: sand timer, speech bubble, scrolls ----------
function drawHourglass(cx, cy, frac, low) {
  const hw = 20, hh = 38;
  ctx.save();
  // wooden frame
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(cx - hw - 5, cy - hh, 4, hh * 2);
  ctx.fillRect(cx + hw + 1, cy - hh, 4, hh * 2);
  // glass
  const glass = () => {
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy - hh); ctx.lineTo(cx + hw, cy - hh);
    ctx.quadraticCurveTo(cx + hw, cy - 8, cx + 3, cy);
    ctx.quadraticCurveTo(cx + hw, cy + 8, cx + hw, cy + hh);
    ctx.lineTo(cx - hw, cy + hh);
    ctx.quadraticCurveTo(cx - hw, cy + 8, cx - 3, cy);
    ctx.quadraticCurveTo(cx - hw, cy - 8, cx - hw, cy - hh);
    ctx.closePath();
  };
  glass();
  ctx.fillStyle = 'rgba(225,242,255,0.6)'; ctx.fill();
  ctx.save(); glass(); ctx.clip();
  const sand = low && Math.sin(t * 12) > 0 ? '#ff7a4a' : '#f0a93c';
  ctx.fillStyle = sand;
  ctx.fillRect(cx - hw, cy - (hh - 2) * frac, hw * 2, (hh - 2) * frac);
  const pile = (hh - 2) * (1 - frac);
  ctx.beginPath();
  ctx.moveTo(cx - hw, cy + hh); ctx.lineTo(cx - hw, cy + hh - pile * 0.7);
  ctx.quadraticCurveTo(cx, cy + hh - pile * 1.3, cx + hw, cy + hh - pile * 0.7); ctx.lineTo(cx + hw, cy + hh);
  ctx.fill();
  if (frac > 0 && frac < 1) { ctx.fillRect(cx - 1.2, cy, 2.4, hh - pile * 0.9); }
  ctx.restore();
  glass();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
  // top and bottom caps
  ctx.fillStyle = '#a8743c'; ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
  roundRect(cx - hw - 9, cy - hh - 9, (hw + 9) * 2, 10, 4); ctx.fill(); ctx.stroke();
  roundRect(cx - hw - 9, cy + hh - 1, (hw + 9) * 2, 10, 4); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawOfferBubble(a) {
  if (a <= 0) return;
  const v = Bible.verse(VERSES[ROUNDS[round].offer]);
  const bw = Math.min(W - 32, 620), bx = W / 2 - bw / 2;
  let size = 21;
  ctx.font = `italic 600 ${size}px Fredoka, sans-serif`;
  let lines = wrapText(`“${v.text}”`, bw - 40);
  while (lines.length > 3 && size > 16) {
    size--;
    ctx.font = `italic 600 ${size}px Fredoka, sans-serif`;
    lines = wrapText(`“${v.text}”`, bw - 40);
  }
  const lh = size * 1.25;
  const bh = 20 + lines.length * lh + 22;
  const by = FEET_Y - 195 - bh;   // the bubble sits just above the tempter's hood
  ctx.save();
  ctx.globalAlpha = a;
  // tail pointing down to the tempter's hood
  const tx = tempterX() - 10, ty = FEET_Y - 158;
  ctx.fillStyle = 'rgba(46,30,72,0.93)';
  ctx.beginPath();
  ctx.moveTo(clamp(tx - 44, bx + 24, bx + bw - 70), by + bh - 2);
  ctx.lineTo(tx, ty);
  ctx.lineTo(clamp(tx - 8, bx + 50, bx + bw - 30), by + bh - 2);
  ctx.fill();
  roundRect(bx, by, bw, bh, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,207,74,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fdf0d0';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, by + 18 + lh * (i + 0.5)));
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillStyle = '#e0c07a';
  ctx.textAlign = 'right';
  ctx.fillText(`The tempter — ${v.cite}`, bx + bw - 16, by + bh - 12);
  ctx.restore();
}

function drawScrolls() {
  const modern = Bible.verse(VERSES.bread).version !== 'KJV';
  const fadeAll = state === 'win' ? 1 - clamp(winT * 1.5, 0, 1) : 1;
  if (fadeAll <= 0) return;
  for (const s of scrolls) {
    if (s.crumble >= 1) continue;
    const text = s.correct ? Bible.verse(VERSES[s.key]).text : (modern ? s.w.modern : s.w.KJV);
    const r = scrollRect(s);
    ctx.save();
    ctx.globalAlpha = fadeAll * (1 - s.crumble);
    if (s.dead) {
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2 + s.crumble * 40);
      ctx.rotate(s.crumble * 0.15);
      ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
    }
    // parchment
    if (s.glow > 0) { ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 34 * s.glow; }
    const pg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    pg.addColorStop(0, s.dead ? '#d9cdb4' : '#fff6dc');
    pg.addColorStop(1, s.dead ? '#bfae8c' : '#f0d8a0');
    ctx.fillStyle = pg;
    roundRect(r.x + 12, r.y, r.w - 24, r.h, 6); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = s.glow > 0 ? '#e0a526' : '#b88a4a'; ctx.lineWidth = s.glow > 0 ? 3 : 1.5; ctx.stroke();
    // rolled ends
    for (const ex of [r.x, r.x + r.w - 22]) {
      const rg = ctx.createLinearGradient(ex, 0, ex + 22, 0);
      rg.addColorStop(0, '#9c6a34'); rg.addColorStop(0.5, '#e0b070'); rg.addColorStop(1, '#9c6a34');
      ctx.fillStyle = rg;
      roundRect(ex, r.y - 6, 22, r.h + 12, 10); ctx.fill();
      ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    // number badge (keys 1 2 3, top to bottom)
    const cy = r.y + r.h / 2;
    ctx.fillStyle = '#a8741a';
    ctx.beginPath(); ctx.arc(r.x + 44, cy, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px Fredoka, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${s.slot + 1}`, r.x + 44, cy + 1);
    // the words
    const tx0 = r.x + 64, tw = r.w - 64 - 32;
    let size = 19;
    ctx.font = `600 ${size}px Fredoka, sans-serif`;
    let lines = wrapText(text, tw);
    while (lines.length > 3 && size > 14) { size--; ctx.font = `600 ${size}px Fredoka, sans-serif`; lines = wrapText(text, tw); }
    const lh = size * 1.2;
    ctx.fillStyle = s.dead ? '#7a6a50' : '#3b2f1e';
    lines.forEach((ln, i) => ctx.fillText(ln, tx0 + tw / 2, cy + (i - (lines.length - 1) / 2) * lh));
    ctx.restore();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(40,20,60,0.85)'; ctx.shadowBlur = 4;

  // Left: level + strength
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff6dc';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Jesus in the Wilderness' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('STRENGTH', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(40,20,60,0.35)';
  roundRect(80, 38, 120, 13, 6.5); ctx.fill();
  const sl = strength / 100;
  const sg = ctx.createLinearGradient(80, 0, 200, 0);
  sg.addColorStop(0, '#5fb8e6'); sg.addColorStop(1, '#c8eeff');
  ctx.fillStyle = sl < 0.25 && Math.sin(t * 10) > 0 ? '#ff6b6b' : sg;
  if (sl > 0) { roundRect(80, 38, 120 * sl, 13, 6.5); ctx.fill(); }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: score + the three temptations
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#fff6dc';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SCORE', rx, 20);
  ctx.font = '700 16px Fredoka, sans-serif';
  const running = state === 'play' || state === 'pause' || state === 'fail' ? stats.answerPts + stats.gatherPts : 0;
  ctx.fillText(`${totalScore + running}`, rx, 40);
  if (state !== 'title') {
    const done = state === 'win' ? 3 : round + (phase === 'tempt' && answered ? 1 : 0);
    ctx.font = '600 11px Fredoka, sans-serif';
    ctx.fillText('ANSWERED', rx - 60, 66);
    ctx.shadowBlur = 0;
    for (let i = 0; i < 3; i++) {
      const cx = rx - 46 + i * 20;
      ctx.beginPath(); ctx.arc(cx + 6, 62, 7, 0, TAU);
      ctx.fillStyle = i < done ? '#f7c948' : 'rgba(255,255,255,0.35)'; ctx.fill();
      ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  const y = phase === 'tempt' ? FEET_Y + 32 : 290;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a4200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  const dusk = duskLevel();
  drawSky(dusk);
  drawLand();

  // What the tempter is offering, behind him
  const R = ROUNDS[Math.min(round, 2)];
  let propA = 0;
  if (phase === 'tempt') propA = state === 'win' ? tempter.alpha : clamp(phaseT * 1.5, 0, 1);
  if (phase === 'tempt' && R.prop === 'temple') drawTemple(W * 0.6, propA);
  if (phase === 'tempt' && R.prop === 'kingdoms') drawKingdoms(propA);
  drawDecor();

  if (phase === 'walk') { drawReachZone(); drawItems(); }

  // Angels on their little cloud, then Jesus and the tempter
  const f = descendF();
  if (f < 1) drawCloud(jx(), ANGEL_CY + 10, 180, 32, `rgba(255,250,245,${0.92 * (1 - f)})`, `rgba(255,205,215,${0.85 * (1 - f)})`);
  for (const s of angelSlots()) drawAngel(s);
  if (f < 1) drawCloud(jx(), ANGEL_CY + 22, 170, 20, `rgba(255,250,245,${0.95 * (1 - f)})`, `rgba(255,205,215,${0.9 * (1 - f)})`, 7);

  drawJesus(jx(), FEET_Y);
  if (phase === 'tempt' || phase === 'title') drawTempter(tempterX(), FEET_Y + 5, tempter.alpha, tempter.mood);
  if (phase === 'tempt' && R.prop === 'stones') drawStones(propA);

  // twilight tint over the world
  ctx.fillStyle = `rgba(40,20,90,${dusk * 0.16})`;
  ctx.fillRect(-offX, -offY, viewW, viewH);

  drawParticles();

  if (phase === 'tempt' && state !== 'win') {
    const hx = jx() + (W * 0.73 - jx()) * 0.42;
    if (phaseT > 0.8) drawHourglass(hx, 440, timerOn ? timeLeft / cfg.time : 1, timerOn && timeLeft / cfg.time < 0.35);
    drawOfferBubble(clamp((phaseT - 0.5) * 3, 0, 1) * (answered ? clamp(1 - answerT * 1.2, 0, 1) : 1));
  }
  if (phase === 'tempt') drawScrolls();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,250,220,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  const va = veilAlpha();
  if (va > 0) {
    ctx.fillStyle = `rgba(45,25,70,${va * 0.85})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateAngels(dt);
  if (jesus.faceT > 0) jesus.faceT -= dt;
  if (jesus.faceT <= 0) jesus.face = state === 'play' && strength < 25 ? 'effort' : 'calm';

  if (state === 'play') {
    updateTransition(dt);
    if (!trans) {
      if (phase === 'tempt') updateTempt(dt);
      else if (phase === 'walk') updateWalk(dt);
    } else if (phase === 'walk') {
      walkX += cfg.speed * dt * 0.5;      // keep strolling through the fade
      jesus.walkPhase += dt * 8;
    }
  } else if (state === 'win') {
    winT += dt;
    tempter.alpha = Math.max(0, tempter.alpha - dt * 0.9);
    tempter.dx += dt * 50;
    tempter.mood = 'recoil';
    updateScrolls(dt);
    if (winT - dt < 1.7 && winT >= 1.7) showMessage('Angels come to care for Him!', 2.4);
    if (Math.random() < dt * 14) {
      spawn(jx() + rand(-60, 60), FEET_Y - rand(0, 120), 0, -20, 1, Math.random() < 0.5 ? '#fff6d0' : '#ffe27a', 3);
    }
  } else if (state === 'fail') {
    updateScrolls(dt);
  } else if (state === 'title') {
    tempter.alpha = 0.55;
  }
  shockT = Math.max(0, shockT - dt);
  joyT = Math.max(0, joyT - dt);
  wowT = Math.max(0, wowT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  sfx.thrust(state === 'play' && phase === 'walk' ? 0.12 : 0);   // a soft desert wind while walking
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
