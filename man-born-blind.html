// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// The theme's ambient bed plays only during active play, with sound on and the page in view
function syncAmbience() { Music.ambience(state === 'play' && !sfx.muted && !document.hidden); }
document.addEventListener('visibilitychange', syncAmbience);
window.addEventListener('pagehide', () => Music.ambience(false));

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);   // the shared music plays through the same mute
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { Music.win(); },
  levelStart() { Music.start(); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    Music.tap(height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { Music.fail(); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// Extra sounds for this game: voices heard from left or right, water, footsteps
Object.assign(sfx, {
  panned(pan, vol) {
    const ac = this.ctx;
    const g = ac.createGain(); g.gain.value = vol;
    if (ac.createStereoPanner) {
      const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
      g.connect(p); p.connect(this.master);
    } else g.connect(this.master);
    return g;
  },
  // A friendly neighbour singing out "Hel-lo!" from where they stand
  voice(pan, vol, notes) {
    if (!this.ctx) return;
    const out = this.panned(pan, vol);
    const [a, b] = notes;
    singPart(this.ctx, out, this.ctx.currentTime + 0.02, 0.2, [['e', 1, a, a, a, a], ['o', 1.8, b, b, b, b]], 0, 0.17);
  },
  callOut() {
    if (!this.ctx) return;
    singPart(this.ctx, this.master, this.ctx.currentTime + 0.02, 0.2, [['a', 1, 'D4', 'D4', 'D4', 'D4'], ['a', 1.6, 'A4', 'A4', 'A4', 'A4']], 0, 0.12);
  },
  // Bubbling water: a few rising droplets and a soft hiss
  water(pan, vol) {
    if (!this.ctx) return;
    const ac = this.ctx, out = this.panned(pan, vol);
    const t0 = ac.currentTime;
    for (let k = 0; k < 4; k++) {
      const o = ac.createOscillator(), g = ac.createGain();
      const s = t0 + k * 0.13 + Math.random() * 0.05, f = 500 + Math.random() * 500;
      o.frequency.setValueAtTime(f, s); o.frequency.exponentialRampToValueAtTime(f * 2.2, s + 0.08);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.22, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.1);
      o.connect(g); g.connect(out); o.start(s); o.stop(s + 0.12);
    }
    const src = ac.createBufferSource(); src.buffer = this.noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.9;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
    src.connect(bp); bp.connect(g); g.connect(out);
    src.start(t0, Math.random()); src.stop(t0 + 0.75);
  },
  splash() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.6, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.75);
    this.water(0, 0.8);
  },
  step() {
    this.tone(130 + Math.random() * 20, 0.08, 'triangle', 0.16);
    this.puff(0.05);
  },
  cluck() {
    this.tone(720, 0.07, 'square', 0.08);
    this.tone(900, 0.09, 'square', 0.08, 0.09, 600);
  },
  reach() {
    this.tone(880, 0.25, 'sine', 0.16);
    this.tone(1320, 0.35, 'sine', 0.14, 0.1);
  },
});

// ============================================================
//  Rendering
// ============================================================
function focusPoint() {
  if (!man) return { x: 0, y: 0 };
  if (phase === 'intro' || state === 'title') return { x: (man.x + jesus.x) / 2, y: man.y - 30 };
  return { x: man.x, y: man.y - 30 };
}

// Clear things drawn over his dark, blurry sight
function drawSharp() {
  drawRings();
  // the man himself, always clear so you know where he is
  if (clarity < 1 && man) drawMan(man);

  // at the pool: a gentle glow on the water
  if (phase === 'wash' && state === 'play') {
    const pc = poolCentre();
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const g = ctx.createRadialGradient(pc.x, pc.y, 10, pc.x, pc.y, T * 1.3);
    g.addColorStop(0, `rgba(150,215,255,${0.5 + pulse * 0.3})`);
    g.addColorStop(1, 'rgba(150,215,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pc.x, pc.y, T * 1.3, 0, TAU); ctx.fill();
  }

  drawParticles();

  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }
  drawBubbles();
}

// A little golden marker at the edge of the view pointing to a voice out of sight
function drawVoiceArrow() {
  if (state !== 'play' || phase !== 'walk') return;
  const c = activeCaller();
  const hint = c === 'pool' ? poolHintT : c.hintT;
  if (!(hint > 0)) return;
  const p = callerPos(c);
  const v = viewRect();
  const m = 34;
  if (p.x > v.l + m && p.x < v.r - m && p.y > v.t + 110 && p.y < v.b - m) return;
  const cx = viewW / 2, cy = viewH / 2 - 30;
  const dx = p.x - camX, dy = p.y - camY;
  const k = Math.min((viewW / 2 - m) / Math.abs(dx || 1e-6), (viewH / 2 - m - 40) / Math.abs(dy || 1e-6));
  const ax = cx + dx * k, ay = clamp(cy + dy * k, 130, viewH - m);
  const ang = Math.atan2(dy, dx);
  ctx.save();
  ctx.globalAlpha = clamp(hint / 0.5, 0, 1);
  ctx.translate(ax, ay);
  ctx.fillStyle = c === 'pool' ? 'rgba(160,215,255,0.95)' : 'rgba(255,214,110,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
  ctx.rotate(ang);
  ctx.fillStyle = '#5a4210';
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, -8); ctx.lineTo(-2, 0); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  const dark = clarity < 0.5 && state !== 'title';
  const ink = dark ? '#fff1c8' : '#4a3510';
  ctx.shadowColor = dark ? 'rgba(0,0,0,0.9)' : 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + steadiness
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Man Born Blind' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('STEADY', 12, 48);
  ctx.shadowBlur = 0;
  for (let k = 0; k < cfg.bumps; k++) {
    const left = k < cfg.bumps - bumps;
    ctx.fillStyle = left ? '#f7c948' : 'rgba(150,130,100,0.45)';
    ctx.strokeStyle = left ? '#a8741a' : 'rgba(120,100,70,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(68 + k * 17, 44, 6, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: steps and voices found
  if (state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = ink;
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('STEPS', rx, 20);
    ctx.fillText('VOICES', rx - 62, 20);
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`${steps}`, rx, 41);
    ctx.fillText(`${helpers.filter((h) => h.reached).length}/${helpers.length}`, rx - 62, 41);
  }
  ctx.restore();
}

function render() {
  // The world is drawn small then stretched: that is how blurry his eyes are.
  const blurPx = lerp(cfg.blur, 0, clarity);
  const k = Math.max(1, blurPx * dpr);
  const ow = Math.max(1, Math.round(canvas.width / k)), oh = Math.max(1, Math.round(canvas.height / k));
  if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
  const f = ow / canvas.width;
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  const ox = viewW / 2 - camX + sx, oy = viewH / 2 - camY + sy;

  ctx = offCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ow, oh);
  ctx.setTransform(scale * f, 0, 0, scale * f, ox * scale * f, oy * scale * f);
  drawWorld();

  ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, ow, oh, 0, 0, canvas.width, canvas.height);

  // Darkness everywhere except a small, dim circle around him
  const dim = 1 - clarity;
  if (dim > 0.01 && man) {
    ctx.save();
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = 0.6 * dim;
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    const mx = (man.x + ox) * scale, my = (man.y - 34 + oy) * scale;
    // in the win reveal the circle of sight bursts outward
    const R = cfg.sight * T * scale * (state === 'win' ? 1 + (1 - dim) * 14 : 1);
    const a = cfg.dark * Math.min(1, dim * 1.4);
    const g = ctx.createRadialGradient(mx, my, R * 0.25, mx, my, R);
    g.addColorStop(0, 'rgba(16,11,30,0)');
    g.addColorStop(0.55, `rgba(16,11,30,${a * 0.45})`);
    g.addColorStop(1, `rgba(16,11,30,${a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.setTransform(scale, 0, 0, scale, ox * scale, oy * scale);
  drawSharp();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawVoiceArrow();
  drawMessage();
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,235,${flashT * 1.6})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win') {
    updateWin(dt);
    if (man.moveT > 0) { man.moveT = 0; man.x = man.toX; man.y = man.toY; }
  }
  // the camera follows him
  const fp = focusPoint();
  const k = Math.min(1, dt * 6);
  camX += (fp.x - camX) * k;
  camY += (fp.y - camY) * k;
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 1.9) rings.splice(i, 1); }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  syncAmbience();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
