<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1236">
<title>Follow the Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b1236;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Follow the Star</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  // Overlay cards
  worship:    { ref: 'Matthew 2:2',  KJV: '...we have seen his star in the east, and are come to worship him.', NKJV: '...we have seen His star in the East and have come to worship Him.', NIV: '...We saw his star when it rose and have come to worship him.', NLT: '...We saw his star as it rose, and we have come to worship him.' },
  joy:        { ref: 'Matthew 2:10', KJV: 'When they saw the star, they rejoiced with exceeding great joy.', NKJV: 'When they saw the star, they rejoiced with exceedingly great joy.', NIV: 'When they saw the star, they were overjoyed.', NLT: 'When they saw the star, they were filled with joy!' },
  gifts:      { ref: 'Matthew 2:11', KJV: '...they presented unto him gifts; gold, and frankincense, and myrrh.', NKJV: '...they presented gifts to Him: gold, frankincense, and myrrh.', NIV: '...presented him with gifts of gold, frankincense and myrrh.', NLT: '...gave him gifts of gold, frankincense, and myrrh.' },
  wentBefore: { ref: 'Matthew 2:9',  KJV: '...and, lo, the star, which they saw in the east, went before them.', NKJV: '...and behold, the star which they had seen in the East went before them.', NIV: '...the star they had seen when it rose went ahead of them.', NLT: '...the star they had seen in the east guided them to Bethlehem. It went ahead of them.' },
  // Speech bubbles and story banners
  whereIsHe:  { ref: 'Matthew 2:2',  KJV: 'Where is he that is born King of the Jews?', NKJV: 'Where is He who has been born King of the Jews?', NIV: 'Where is the one who has been born king of the Jews?', NLT: 'Where is the newborn king of the Jews?' },
  herod:      { ref: 'Matthew 2:8',  KJV: 'Go and search diligently for the young child; and when ye have found him, bring me word again.', NKJV: 'Go and search carefully for the young Child, and when you have found Him, bring back word to me.', NIV: 'Go and search carefully for the child. As soon as you find him, report to me.', NLT: 'Go to Bethlehem and search carefully for the child. And when you find him, come back and tell me.' },
  stoodOver:  { ref: 'Matthew 2:9',  KJV: '...till it came and stood over where the young child was.', NKJV: '...till it came and stood over where the young Child was.', NIV: '...until it stopped over the place where the child was.', NLT: '...It went ahead of them and stopped over the place where the child was.' },
  joyShort:   { ref: 'Matthew 2:10', KJV: 'They rejoiced with exceeding great joy.', NKJV: 'They rejoiced with exceedingly great joy.', NIV: 'They were overjoyed.', NLT: 'They were filled with joy!' },
  dream:      { ref: 'Matthew 2:12', KJV: 'And being warned of God in a dream that they should not return to Herod, they departed into their own country another way.', NKJV: 'Then, being divinely warned in a dream that they should not return to Herod, they departed for their own country another way.', NIV: 'And having been warned in a dream not to go back to Herod, they returned to their country by another route.', NLT: 'When it was time to leave, they returned to their own country by another route, for God had warned them in a dream not to return to Herod.' },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hash = (k) => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ============================================================
//  Tuning
// ============================================================
const HORIZON = 665;               // where the flat sand begins
const LANE_Y = [708, 778, 848];    // hoof line of the far, middle and near paths
const laneY = (f) => lerp(LANE_Y[0], LANE_Y[2], clamp(f, 0, 2) / 2);
const laneS = (f) => lerp(0.84, 1, clamp(f, 0, 2) / 2);   // nearer paths look a little bigger
let CS = 0.74;                     // camel drawing scale (bigger on wide screens)
let SP = 80;                       // gap between the camels in the caravan
function sizeCaravan() {
  CS = W > 760 ? 0.88 : 0.74;
  SP = Math.round(80 * CS / 0.74);
}
sizeCaravan();
window.addEventListener('resize', sizeCaravan);
const LANE_STEP_PX = 55;           // CSS px of vertical slide per path change
const BUMP_COST = 10;              // guidance lost when the caravan bumps into something
const SPOT_Y = 778;                // centre of the lit patch of sand

const LEVEL_NAMES = [
  'From the East',
  'Across the Great Desert',
  'Winds of Arabia',
  'The Long Road',
  'Sea of Sand',
  'Road to Bethlehem',
];

function makeConfig(n) {
  return {
    name: LEVEL_NAMES[n - 1] || `Journey ${n}`,
    speed: Math.min(150 + (n - 1) * 15, 240),
    leg1: 2800 + (n - 1) * 500,                        // distance to Jerusalem
    leg2: n === 1 ? 3000 : 3600 + (n - 1) * 700,        // Jerusalem to Bethlehem
    amp: Math.min(0.6 + (n - 1) * 0.12, 1),              // how far the star wanders
    starSpeed: Math.min(0.28 + (n - 1) * 0.07, 0.7),
    hwF: Math.max(0.62 - (n - 1) * 0.07, 0.32),         // width of the beam
    fill: 22,
    drain: Math.min(8 + (n - 1) * 3, 22),
    gap: Math.max(620 - (n - 1) * 70, 320),
    types: n === 1 ? ['rock', 'cactus', 'dune'] : ['rock', 'cactus', 'dune', 'snake'],
    multi: n === 1 ? 0 : Math.min(0.2 + (n - 2) * 0.12, 0.6),   // chance of a two-path block
    storms: n >= 3 ? Math.min(n - 2, 3) : 0,
    stormDur: Math.min(2.6 + (n - 3) * 0.3, 3.8),
    fork: n >= 2,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | scene | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('followStarBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let dist = 0, speed = 0;
let herodAt = 0, endAt = 0, herodDone = false;
let guidance = 80, inBeam = false, playT = 0, inBeamT = 0;
let bumps = 0, giftPts = 0, got = { coin: 0, frank: 0, myrrh: 0, water: 0 };
let fork = null, forkChosen = false;
let obstacles = [], items = [], storms = [], particles = [], floaters = [], sand = [];
let stormA = 0;
let caravan;
let star = { x: 300, y: 250, a: 1, lean: 50 };
let starT = 0, starPh = 0;
let scene = null;
let interior = false;
let bubble = null;        // speech bubble { who, text, t }
let banner = null;        // scripture banner { key, y, age }
let message = { text: '', t: 0 };
let msgQueue = [];
let fade = null;
let shockT = 0, joyT = 0, flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let introT = 0, hintT = 0, chatT = 0, worryCd = 0;
let pausedFrom = 'play';

function newCaravan() {
  const r = range();
  return {
    mx: (r.lo + r.hi) / 2, tx: (r.lo + r.hi) / 2, lane: 1, walk: 0, moving: 0,
    camels: [{ laneF: 1 }, { laneF: 1 }, { laneF: 1 }],
  };
}

// Where the middle camel may stand
function range() {
  const lo = SP + 55, hi = Math.max(lo + 60, W - SP - 70);
  return { lo, hi, c: (lo + hi) / 2, half: (hi - lo) / 2 };
}
function stepSize() { return clamp(range().half * 0.36, 42, 120); }

// Camel i: 0 leads, 2 is at the back
function camelPos(i) {
  const lf = caravan.camels[i].laneF;
  return { x: caravan.mx + (1 - i) * SP, y: laneY(lf), s: CS * laneS(lf), lf };
}

// ============================================================
//  The wise men
// ============================================================
const MAGI = [
  { name: 'Melchior',  robe: '#7b3fa0', hair: '#e8e4dc', beard: true,  skin: '#e2ae80', hat: 'crown',
    gift: 'gold',  blanket: '#d9483b', stripe: '#f2c230', box: '#f2c230', ribbon: '#c0392b' },
  { name: 'Caspar',    robe: '#c0392b', hair: '#4a2f1a', beard: false, skin: '#d9a066', hat: 'turban',
    turban: '#f4f1e6', jewel: '#3fa7d6', gift: 'frank', blanket: '#2f8f83', stripe: '#f4f1e6', box: '#3fa7d6', ribbon: '#f2c230' },
  { name: 'Balthazar', robe: '#2e8b57', hair: '#1c120b', beard: true,  skin: '#8d5a35', hat: 'turbanCrown',
    turban: '#f0b43a', jewel: '#e84a5f', gift: 'myrrh', blanket: '#3d5fb0', stripe: '#f2c230', box: '#9b59b6', ribbon: '#f4f1e6' },
].map((m, i) => ({
  ...m, i,
  mood: 'watch', switchT: 0,
  delay: i === 0 ? 0 : rand(0.05, 0.4),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

function crowdMood() {
  if (state === 'title') return 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  const st = state === 'pause' ? pausedFrom : state;
  if (st === 'scene' && scene) {
    if (scene.type === 'dream') return 'sleep';
    if (scene.type === 'herod') return scene.beat === 0 ? 'watch' : 'wow';
    if (scene.type === 'arrive') return scene.t > 1.2 ? 'joy' : 'wow';
  }
  if (shockT > 0) return 'shock';
  if (joyT > 0) return 'joy';
  if (stormA > 0.5) return 'worried';
  if (guidance < 30) return 'worried';
  return 'watch';
}

function updateMagi(dt) {
  const target = crowdMood();
  for (const m of MAGI) {
    let want = target;
    // Balthazar doesn't quite trust the king
    if (m.i === 2 && state === 'scene' && scene && scene.type === 'herod' && scene.beat === 0) want = 'doubt';
    if (want !== m.mood) {
      m.switchT += dt;
      if (m.switchT > m.delay) { m.mood = want; m.switchT = 0; }
    } else m.switchT = 0;
    m.blinkT -= dt;
    if (m.blinkT <= 0) { m.blink = 0.13; m.blinkT = rand(1.5, 5); }
    if (m.blink > 0) m.blink -= dt;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, d.hair === '#e8e4dc' ? -60 : -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'sleep':
      ctx.strokeStyle = dark; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.moveTo(ex + 3.2 * Math.cos(0.15 * Math.PI), ey - 1 + 3.2 * Math.sin(0.15 * Math.PI));
      ctx.arc(ex, ey - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      mouthFill(() => ctx.ellipse(0, mouthY, 2, 2.6, 0, 0, TAU));
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function goldGrad(x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#c98e1b'); g.addColorStop(0.5, '#ffd766'); g.addColorStop(1, '#c98e1b');
  return g;
}

// A crown whose base sits at (cx, y)
function drawCrown(cx, y, w, h) {
  ctx.fillStyle = goldGrad(cx - w / 2, cx + w / 2);
  ctx.strokeStyle = '#9a6a12'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, y);
  ctx.lineTo(cx - w / 2 - 1, y - h * 0.75);
  ctx.lineTo(cx - w / 4, y - h * 0.35);
  ctx.lineTo(cx, y - h);
  ctx.lineTo(cx + w / 4, y - h * 0.35);
  ctx.lineTo(cx + w / 2 + 1, y - h * 0.75);
  ctx.lineTo(cx + w / 2, y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.arc(cx, y - h, 2.4, 0, TAU);
  ctx.arc(cx - w / 2 - 1, y - h * 0.75, 2, 0, TAU);
  ctx.arc(cx + w / 2 + 1, y - h * 0.75, 2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#4dabf7';
  ctx.beginPath(); ctx.arc(cx, y - h * 0.22, 2.4, 0, TAU); ctx.fill();
}

// Head, hair, beard, face and headwear of one wise man (head centre at 0, hy)
function drawMagusHead(m, hy, mood, lx, ly) {
  ctx.fillStyle = m.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair
  ctx.fillStyle = m.hair;
  ctx.beginPath();
  ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
  ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
  ctx.closePath(); ctx.fill();
  // Beard
  if (m.beard) {
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 23, 0, hy + 25);
    ctx.quadraticCurveTo(14, hy + 23, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  drawFace(m, mood, hy, lx, ly);
  // Headwear
  if (m.hat === 'crown') {
    drawCrown(0, hy - 10, 26, 18);
  } else {
    // a wrapped turban with a jewel
    ctx.fillStyle = m.turban; ctx.strokeStyle = shade(m.turban, -45); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, hy - 13, 19, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-17, hy - 10); ctx.quadraticCurveTo(0, hy - 18, 17, hy - 15);
    ctx.moveTo(-15, hy - 16); ctx.quadraticCurveTo(0, hy - 23, 14, hy - 19);
    ctx.stroke();
    if (m.hat === 'turbanCrown') drawCrown(0, hy - 21, 18, 13);
    else {
      // a feather plume
      ctx.strokeStyle = '#e8739a'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, hy - 16); ctx.quadraticCurveTo(-4, hy - 32, 6, hy - 38); ctx.stroke();
    }
    ctx.fillStyle = m.jewel;
    ctx.beginPath(); ctx.arc(0, hy - 12, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-1, hy - 13, 1.2, 0, TAU); ctx.fill();
  }
}

// A wise man sitting on the hump (origin = saddle top)
function drawRider(m, lx, ly, bob) {
  const mood = m.mood;
  const sleeve = shade(m.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = m.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + m.phase)) * 5;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;
  ctx.save();
  ctx.translate(0, bob - jump);
  const hy = -46;

  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + m.phase) * 4;
    arm(-11, -26, -24 + wave, -60);
    arm(11, -26, 24 - wave, -60);
  } else if (mood === 'wow' && m.i !== 1) {
    arm(11, -26, 22 + lx * 4, -64);
  }
  // Leg hanging down the camel's side
  ctx.fillStyle = m.robe;
  ctx.beginPath();
  ctx.moveTo(-6, -4); ctx.lineTo(12, -4); ctx.lineTo(12, 18); ctx.quadraticCurveTo(4, 24, -2, 16); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#6b4a2b';
  ctx.beginPath(); ctx.ellipse(8, 21, 7, 4, 0, 0, TAU); ctx.fill();
  // Robe
  ctx.fillStyle = m.robe;
  ctx.strokeStyle = shade(m.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-16, 2);
  ctx.quadraticCurveTo(-15, -22, -11, -30);
  ctx.quadraticCurveTo(0, -34, 11, -30);
  ctx.quadraticCurveTo(15, -22, 16, 2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-15, -12); ctx.quadraticCurveTo(0, -9, 15, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -31); ctx.lineTo(0, 0); ctx.stroke();

  if (mood === 'watch' || mood === 'doubt' || mood === 'sleep' || (mood === 'wow' && m.i === 1)) {
    if (mood === 'doubt') { arm(-11, -26, 4, -20); arm(11, -26, -4, -18); }   // folded arms
    else { arm(-11, -26, 6, -8); arm(11, -26, 20, -10); }                    // holding the reins
  } else if (mood === 'worried') {
    arm(-11, -26, -2, -22); arm(11, -26, 2, -22);
  }

  drawMagusHead(m, hy, mood, lx, ly);

  if (mood === 'shock') {
    arm(-11, -26, -15, hy + 4);
    arm(11, -26, 15, hy + 4);
  } else if (mood === 'dismay' && m.i % 2 === 0) {
    arm(11, -26, 2, hy - 3);   // facepalm
    ctx.fillStyle = m.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -26, -6, -8); arm(11, -26, 12, -8);
  }
  if (mood === 'sleep') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '700 14px Fredoka, sans-serif';
    ctx.textAlign = 'left';
    const z = (t * 0.8 + m.i * 0.33) % 1;
    ctx.globalAlpha = 1 - z;
    ctx.fillText('z', 16 + z * 10, hy - 20 - z * 22);
    ctx.font = '700 10px Fredoka, sans-serif';
    ctx.fillText('z', 24 + z * 10, hy - 30 - z * 22);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ============================================================
//  Camels
// ============================================================
function drawCamel(x, y, s, m, walk, moving) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // soft shadow
  ctx.fillStyle = 'rgba(20,14,40,0.3)';
  ctx.beginPath(); ctx.ellipse(6, 2, 52, 7, 0, 0, TAU); ctx.fill();

  const fur = '#caa06a', furDark = '#a37646';
  const bob = Math.sin(walk * 2) * 1.6 * moving;
  const leg = (hx, off, col) => {
    const sw = Math.sin(walk + off) * 11 * moving;
    const lift = Math.max(0, Math.cos(walk + off)) * 6 * moving;
    ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, -54 + bob);
    ctx.lineTo(hx + sw * 0.4 + 3, -27 - lift * 0.5);
    ctx.lineTo(hx + sw, -4 - lift);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(hx + sw + 2, -3 - lift, 6, 3.2, 0, 0, TAU); ctx.fill();
  };
  leg(-22, Math.PI, furDark); leg(22, 0, furDark);     // far legs

  ctx.translate(0, bob);
  // tail
  ctx.strokeStyle = furDark; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-36, -70); ctx.quadraticCurveTo(-47, -60, -43 + Math.sin(t * 3 + m.i) * 3, -44); ctx.stroke();
  // body and hump
  ctx.fillStyle = fur; ctx.strokeStyle = furDark; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, -66, 39, 19, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-27, -76); ctx.bezierCurveTo(-22, -108, 16, -108, 22, -76); ctx.fill(); ctx.stroke();
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, -68, 36, 15, 0, 0, TAU); ctx.fill();
  // neck
  ctx.beginPath();
  ctx.moveTo(24, -80);
  ctx.quadraticCurveTo(40, -82, 44, -108);
  ctx.lineTo(58, -110);
  ctx.quadraticCurveTo(54, -78, 36, -56);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = furDark;
  ctx.beginPath(); ctx.moveTo(44, -106); ctx.quadraticCurveTo(52, -80, 36, -58); ctx.stroke();
  // near legs
  ctx.translate(0, -bob);
  leg(-16, 0, fur); leg(28, Math.PI, fur);
  ctx.translate(0, bob);

  // head
  const hb = Math.sin(walk * 2 + 0.6) * 1.5 * moving;
  ctx.save();
  ctx.translate(0, hb);
  ctx.fillStyle = fur; ctx.strokeStyle = furDark;
  ctx.beginPath(); ctx.ellipse(58, -112, 15, 9, 0.18, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(49, -122, 3, 5, -0.4, 0, TAU); ctx.fill(); ctx.stroke();   // ear
  ctx.fillStyle = '#2b1d12';
  ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.8;
  if (m.mood === 'sleep') { ctx.beginPath(); ctx.arc(56, -116, 2.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(56, -116, 2.2, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(64, -106, 4, 0.1 * Math.PI, 0.8 * Math.PI); ctx.stroke();   // a contented smile
  ctx.beginPath(); ctx.arc(70, -111, 1.3, 0, TAU); ctx.stroke();                       // nostril
  // bridle
  ctx.strokeStyle = m.blanket; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(52, -118); ctx.lineTo(60, -104); ctx.moveTo(51, -108); ctx.lineTo(68, -110); ctx.stroke();
  ctx.restore();

  // saddle blanket with tassels
  ctx.fillStyle = m.blanket;
  ctx.beginPath();
  ctx.moveTo(-26, -76); ctx.bezierCurveTo(-20, -104, 14, -104, 20, -76);
  ctx.lineTo(22, -62); ctx.lineTo(-26, -62); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = m.stripe; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-26, -68); ctx.lineTo(22, -68); ctx.stroke();
  ctx.fillStyle = m.stripe;
  for (let k = 0; k < 6; k++) {
    ctx.beginPath(); ctx.arc(-22 + k * 8.5, -59 + Math.sin(walk * 2 + k) * moving, 2.2, 0, TAU); ctx.fill();
  }
  // reins
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(14, -108); ctx.quadraticCurveTo(40, -98, 60, -106 + hb); ctx.stroke();

  // gift box on the camel's back
  ctx.fillStyle = m.box; ctx.strokeStyle = shade(m.box, -50); ctx.lineWidth = 1.5;
  roundRect(-46, -98, 22, 18, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = m.ribbon;
  ctx.fillRect(-37, -98, 4, 18);
  ctx.fillRect(-46, -91, 22, 4);
  ctx.beginPath(); ctx.ellipse(-39, -101, 4, 2.5, -0.5, 0, TAU); ctx.ellipse(-31, -101, 4, 2.5, 0.5, 0, TAU); ctx.fill();

  // the wise man, eyes on the star
  let lx = 0.5, ly = -0.8;
  if (!interior) {
    const hx = x + (-2) * s, hyW = y - 140 * s;
    const dx = (star.x - star.lean) - hx, dy = star.y - hyW;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }
  ctx.translate(-2, -98);
  ctx.scale(0.86, 0.86);
  drawRider(m, lx, ly, Math.sin(walk * 2 + 1) * 1.2 * moving);
  ctx.restore();
}

// ============================================================
//  Obstacles, gifts and supplies
// ============================================================
const OBST = {
  rock:   { w: 50 },
  cactus: { w: 42 },
  snake:  { w: 58 },
  dune:   { w: 130 },
};
const ITEMS = {
  coin:  { pts: 50, label: '+50' },
  frank: { pts: 75, label: '+75' },
  myrrh: { pts: 75, label: '+75' },
  water: { pts: 30, label: 'Water!' },
};

function buildLevel() {
  obstacles = []; items = []; storms = [];
  const legs = [[1000, herodAt - 150], [herodAt + 1400, endAt - 150]];
  const r = range();
  fork = null;
  if (cfg.fork) {
    const a = legs[1][0], b = legs[1][1];
    fork = { x: a + (b - a) * 0.5, side: Math.random() < 0.5 ? 0 : 2, done: false, pending: false, tries: 0 };
  }
  const inFork = (x) => fork && x > fork.x - 1000 && x < fork.x + 750;
  const obs = (type, lane, x, lanes = 1) =>
    obstacles.push({ type, lane, lanes, x, w: OBST[type].w * (lanes === 2 ? 1.25 : 1), hit: false, phase: rand(0, TAU) });
  const item = (type, lane, x) => items.push({ type, lane, x, got: false, phase: rand(0, TAU) });
  const coins = (x0, lane, n) => { for (let i = 0; i < n; i++) item('coin', lane, x0 + i * 55); };
  let sinceWater = 0;
  for (const [a, b] of legs) {
    let x = a;
    while (x < b - 150) {
      if (inFork(x)) { x = fork.x + 800; continue; }
      const lanes = [0, 1, 2];
      if (Math.random() < cfg.multi) {
        // two paths blocked: find the free one
        const free = pick(lanes);
        const blocked = lanes.filter((l) => l !== free);
        if (blocked[1] - blocked[0] === 1 && Math.random() < 0.5) obs('dune', blocked[0], x, 2);
        else for (const l of blocked) obs(pick(cfg.types), l, x + rand(-20, 20));
        coins(x - 55, free, 3);
      } else {
        const lane = pick(lanes);
        obs(pick(cfg.types), lane, x);
        const other = pick(lanes.filter((l) => l !== lane));
        const roll = Math.random();
        if (roll < 0.5) coins(x - 55, other, 3);
        else item(roll < 0.75 ? 'frank' : 'myrrh', other, x);
      }
      sinceWater += 1;
      const g = cfg.gap * rand(0.85, 1.2);
      if (sinceWater >= 3 && x + g / 2 < b) { item('water', pick([0, 1, 2]), x + g / 2); sinceWater = 0; }
      else if (Math.random() < 0.35 && x + g / 2 < b) item(pick(['frank', 'myrrh', 'coin']), pick([0, 1, 2]), x + g / 2);
      x += g;
    }
  }
  // Sandstorms, spread through the journey (by distance travelled)
  for (let k = 0; k < cfg.storms; k++) {
    let at = lerp(600, endAt - 900, (k + 0.5) / cfg.storms);
    if (Math.abs(at - herodAt) < 700) at = herodAt + 900;
    if (fork && Math.abs(at + r.c - fork.x) < 1200) at = fork.x - r.c - 1300;
    storms.push({ at, st: 0, t: 0 });
  }
}

function drawObstacle(o) {
  const lf = o.lane + (o.lanes - 1) / 2;
  const sx = o.x - dist;
  if (sx < -offX - 150 || sx > W + offX + 150) return;
  const s = laneS(lf);
  ctx.save();
  ctx.translate(sx, laneY(lf));
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(20,14,40,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 2, o.w * 0.55, 7, 0, 0, TAU); ctx.fill();
  if (o.hit && o.type !== 'snake') ctx.rotate(Math.sin(t * 20) * 0.03 * Math.max(0, 1 - (t - o.hitT)));
  switch (o.type) {
    case 'rock': {
      ctx.fillStyle = '#7a6e78'; ctx.strokeStyle = '#524a58'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-30, -24, -10, -34); ctx.quadraticCurveTo(10, -42, 22, -24);
      ctx.quadraticCurveTo(30, -10, 26, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#a49aa6';
      ctx.beginPath(); ctx.ellipse(-6, -28, 10, 5, -0.3, 0, TAU); ctx.fill();
      break;
    }
    case 'cactus': {
      const g = '#4f9a52', gd = '#357a3a';
      ctx.fillStyle = g; ctx.strokeStyle = gd; ctx.lineWidth = 2;
      roundRect(-10, -74, 20, 74, 10); ctx.fill(); ctx.stroke();
      roundRect(-28, -50, 11, 26, 5.5); ctx.fill(); ctx.stroke();
      roundRect(-28, -30, 22, 10, 5); ctx.fill();
      roundRect(17, -62, 11, 26, 5.5); ctx.fill(); ctx.stroke();
      roundRect(6, -42, 22, 10, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-3, -68); ctx.lineTo(-3, -6); ctx.stroke();
      ctx.fillStyle = '#e8f5c8';
      for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.arc(k % 2 ? 5 : -6, -66 + k * 9, 1, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#ff8fb8';
      ctx.beginPath(); ctx.arc(0, -76, 4, 0, TAU); ctx.fill();
      break;
    }
    case 'dune': {
      const hw = o.w * 0.55, hh = o.lanes === 2 ? 90 : 58;
      const g = ctx.createLinearGradient(0, -hh, 0, 0);
      g.addColorStop(0, '#e3c38e'); g.addColorStop(1, '#a88560');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-hw, 0); ctx.bezierCurveTo(-hw * 0.5, -hh * 0.9, -hw * 0.1, -hh * 1.08, hw * 0.2, -hh);
      ctx.bezierCurveTo(hw * 0.55, -hh * 0.9, hw * 0.8, -hh * 0.3, hw, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(60,40,80,0.2)';   // shaded side
      ctx.beginPath();
      ctx.moveTo(hw * 0.2, -hh); ctx.bezierCurveTo(hw * 0.55, -hh * 0.9, hw * 0.8, -hh * 0.3, hw, 0);
      ctx.lineTo(hw * 0.1, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,210,0.35)'; ctx.lineWidth = 2;
      for (let k = 1; k <= 3; k++) {
        ctx.beginPath(); ctx.moveTo(-hw * 0.6 + k * 8, -hh * 0.18 * k); ctx.quadraticCurveTo(0, -hh * 0.18 * k - 8, hw * 0.4 - k * 6, -hh * 0.16 * k); ctx.stroke();
      }
      break;
    }
    case 'snake': drawSnake(o); break;
  }
  ctx.restore();
}

function drawSnake(o) {
  const g = '#79b85a', gd = '#4e8a3a';
  ctx.fillStyle = g; ctx.strokeStyle = gd; ctx.lineWidth = 2;
  // coils
  ctx.beginPath(); ctx.ellipse(0, -8, 26, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-2, -18, 20, 7.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2d14b';
  for (const [dx, dy] of [[-16, -8], [-4, -6], [10, -8], [-10, -18], [4, -19]]) {
    ctx.beginPath(); ctx.moveTo(dx, dy - 3); ctx.lineTo(dx + 3, dy); ctx.lineTo(dx, dy + 3); ctx.lineTo(dx - 3, dy); ctx.fill();
  }
  const awake = o.hit && t - o.hitT < 2.5;
  const hx = awake ? 16 : 12, hy = awake ? -52 : -27;
  // neck
  ctx.strokeStyle = g; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(8, -20); ctx.quadraticCurveTo(awake ? 22 : 16, awake ? -34 : -24, hx, hy); ctx.stroke();
  // head
  ctx.fillStyle = g; ctx.strokeStyle = gd; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(hx + 4, hy, 11, 7.5, 0.1, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,0.4)';
  ctx.beginPath(); ctx.arc(hx + 9, hy + 3, 2.5, 0, TAU); ctx.fill();
  if (awake) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx + 1, hy - 3, 3.6, 0, TAU); ctx.arc(hx + 8, hy - 3, 3.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b1d12';
    ctx.beginPath(); ctx.arc(hx + 1.5, hy - 3, 1.6, 0, TAU); ctx.arc(hx + 8.5, hy - 3, 1.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e03a3a'; ctx.lineWidth = 1.6;
    const fl = Math.sin(t * 30) * 2;
    ctx.beginPath(); ctx.moveTo(hx + 14, hy + 2); ctx.lineTo(hx + 22, hy + 2 + fl); ctx.lineTo(hx + 26, hy - 1 + fl);
    ctx.moveTo(hx + 22, hy + 2 + fl); ctx.lineTo(hx + 26, hy + 5 + fl); ctx.stroke();
  } else {
    ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hx - 1, hy - 2); ctx.lineTo(hx + 3, hy - 2); ctx.moveTo(hx + 6, hy - 2); ctx.lineTo(hx + 10, hy - 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 7, hy + 2, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    // Zzz
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'left';
    const z = (t * 0.7 + o.phase) % 1;
    ctx.globalAlpha = 1 - z;
    ctx.fillText('z', hx + 12 + z * 8, hy - 10 - z * 18);
    ctx.globalAlpha = 1;
  }
}

// Gift / supply picture with its base at the origin
function drawItemArt(type, ph) {
  switch (type) {
    case 'coin': {
      const sc = Math.abs(Math.cos(t * 3 + ph)) * 0.85 + 0.15;
      ctx.fillStyle = '#f5c542'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, -12, 12 * sc, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#d49a1c'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, -12, 7.5 * sc, 7.5, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.ellipse(-4 * sc, -17, 2.5 * sc, 3, 0.5, 0, TAU); ctx.fill();
      break;
    }
    case 'frank': {
      // an alabaster jar of frankincense with fragrant smoke
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      for (let k = 0; k < 2; k++) {
        const w = Math.sin(t * 3 + ph + k * 2) * 4;
        ctx.beginPath(); ctx.moveTo(k * 4 - 2, -32); ctx.quadraticCurveTo(w - 6 + k * 6, -42, k * 6 - 2 - w, -52); ctx.stroke();
      }
      ctx.fillStyle = '#f1e6cc'; ctx.strokeStyle = '#b7a37a'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-6, -30); ctx.quadraticCurveTo(-15, -22, -12, -8); ctx.quadraticCurveTo(-10, 0, 0, 0);
      ctx.quadraticCurveTo(10, 0, 12, -8); ctx.quadraticCurveTo(15, -22, 6, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0a526'; ctx.fillRect(-12, -16, 24, 4);
      ctx.fillStyle = '#c98e1b'; roundRect(-7, -34, 14, 6, 3); ctx.fill();
      break;
    }
    case 'myrrh': {
      ctx.fillStyle = '#9b59b6'; ctx.strokeStyle = '#6c3483'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-4, -30); ctx.lineTo(-4, -22); ctx.quadraticCurveTo(-12, -18, -11, -6); ctx.quadraticCurveTo(-10, 0, 0, 0);
      ctx.quadraticCurveTo(10, 0, 11, -6); ctx.quadraticCurveTo(12, -18, 4, -22); ctx.lineTo(4, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a5a30'; roundRect(-5, -36, 10, 7, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(-5, -12, 2, 5, 0.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f2c230'; ctx.fillRect(-10, -12, 20, 3);
      break;
    }
    case 'water': {
      ctx.fillStyle = '#5b9bd5'; ctx.strokeStyle = '#2f6aa3'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-5, -30); ctx.quadraticCurveTo(-14, -24, -13, -10); ctx.quadraticCurveTo(-12, 0, 0, 0);
      ctx.quadraticCurveTo(12, 0, 13, -10); ctx.quadraticCurveTo(14, -24, 5, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(14, -18, 6, -1.4, 1.4); ctx.stroke();   // handle
      ctx.fillStyle = '#cfe8ff';
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.quadraticCurveTo(5, -14, 0, -10); ctx.quadraticCurveTo(-5, -14, 0, -22); ctx.fill();
      ctx.fillStyle = '#2f6aa3'; roundRect(-6, -33, 12, 5, 2); ctx.fill();
      break;
    }
    case 'gold': {
      // a little treasure chest full of gold
      ctx.fillStyle = '#8a5a30'; ctx.strokeStyle = '#5c3a1c'; ctx.lineWidth = 1.8;
      roundRect(-15, -18, 30, 18, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.arc(-7, -19, 5, 0, TAU); ctx.arc(1, -22, 5, 0, TAU); ctx.arc(8, -19, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e0a526'; ctx.fillRect(-15, -12, 30, 3); ctx.fillRect(-2, -12, 4, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(0, -24, 1.5, 0, TAU); ctx.fill();
      break;
    }
  }
}

function drawItem(it) {
  const sx = it.x - dist;
  if (sx < -offX - 60 || sx > W + offX + 60) return;
  const s = laneS(it.lane) * 1.05;
  const y = laneY(it.lane);
  ctx.save();
  ctx.translate(sx, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(20,14,40,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 4, 0, 0, TAU); ctx.fill();
  const bob = -14 + Math.sin(t * 3 + it.phase) * 4;
  ctx.translate(0, bob);
  const g = ctx.createRadialGradient(0, -14, 2, 0, -14, 26);
  g.addColorStop(0, 'rgba(255,240,170,0.55)'); g.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -14, 26, 0, TAU); ctx.fill();
  drawItemArt(it.type, it.phase);
  ctx.restore();
}

// ============================================================
//  Particles and floating score text
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].t -= dt;
    if (floaters[i].t <= 0) floaters.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '700 18px Fredoka, sans-serif';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.t / 0.4, 0, 1);
    const y = f.y - (1.1 - f.t) * 40;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,20,60,0.7)'; ctx.lineJoin = 'round';
    ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  The star and its beam
// ============================================================
function starTarget() {
  const r = range();
  const u = starT;
  const fx = 0.62 * Math.sin(u) + 0.38 * Math.sin(u * 1.73 + starPh);
  return {
    x: r.c + r.half * cfg.amp * fx,
    y: 255 + 70 * Math.sin(u * 0.77 + starPh * 2),
  };
}

// The lit patch of sand the star points at
function spot() {
  const r = range();
  const hs = lerp(1.12, 0.9, clamp((star.y - 185) / 140, 0, 1));
  return { x: star.x, hw: clamp(r.half * cfg.hwF, 40, 130) * hs };
}

function updateStar(dt) {
  let tx, ty, ta = 1, tl = 50;
  const st = state === 'pause' ? pausedFrom : state;
  if (st === 'scene' && scene && scene.type === 'arrive') {
    tx = houseScreenX(); ty = 330; tl = 0;
  } else {
    if (st === 'play' || st === 'title') starT += dt * cfg.starSpeed * (stormA > 0.5 ? 0.5 : 1);
    const p = starTarget();
    tx = p.x; ty = p.y;
    if (st === 'scene' && scene && scene.type === 'herod' && scene.beat === 0) ta = 0.12;   // lost from sight in Jerusalem
    if (st === 'scene' && scene && scene.type === 'dream') ta = 0.45;
    if (st === 'fail') ta = 0.25;
  }
  const k = Math.min(1, dt * (st === 'scene' ? 1.6 : 6));
  star.x += (tx - star.x) * k;
  star.y += (ty - star.y) * k;
  star.lean += (tl - star.lean) * Math.min(1, dt * 2);
  star.a += (ta - star.a) * Math.min(1, dt * 2.5);
}

function drawStarOfBethlehem() {
  const a = star.a * (1 - 0.97 * stormA);
  if (a <= 0.01) return;
  const x = star.x - star.lean, y = star.y;
  ctx.save();
  ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 2, x, y, 120);
  g.addColorStop(0, 'rgba(255,252,225,0.95)');
  g.addColorStop(0.18, 'rgba(255,236,160,0.45)');
  g.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 120, 0, TAU); ctx.fill();
  const tw = 1 + 0.1 * Math.sin(t * 5);
  const spike = (ang, len, wid) => {
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.lineTo(x + Math.cos(ang + Math.PI / 2) * wid, y + Math.sin(ang + Math.PI / 2) * wid);
    ctx.lineTo(x - Math.cos(ang) * 2, y - Math.sin(ang) * 2);
    ctx.lineTo(x + Math.cos(ang - Math.PI / 2) * wid, y + Math.sin(ang - Math.PI / 2) * wid);
    ctx.closePath(); ctx.fill();
  };
  ctx.fillStyle = 'rgba(255,250,225,0.95)';
  spike(-Math.PI / 2, 58 * tw, 5);
  spike(Math.PI / 2, 80 * tw, 5);
  spike(0, 46 * tw, 5);
  spike(Math.PI, 46 * tw, 5);
  ctx.fillStyle = 'rgba(255,240,190,0.8)';
  for (let k = 0; k < 4; k++) spike(Math.PI / 4 + k * Math.PI / 2 + Math.sin(t) * 0.05, 22 * tw, 3);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(x, y, 7.5, 0, TAU); ctx.fill();
  ctx.restore();
}

// The glowing patch of sand (drawn under the caravan)
function drawSpot() {
  const a = star.a * (1 - 0.95 * stormA);
  if (a <= 0.02) return;
  const sp = spot();
  const st = state === 'pause' ? pausedFrom : state;
  if (st === 'scene' && scene && scene.type === 'arrive') return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(sp.x, SPOT_Y);
  ctx.scale(1, 92 / sp.hw);
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, sp.hw);
  const lit = inBeam && st === 'play' ? 0.1 : 0;
  g.addColorStop(0, `rgba(255,236,160,${0.42 + lit})`);
  g.addColorStop(0.7, `rgba(255,226,140,${0.26 + lit})`);
  g.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, sp.hw, 0, TAU); ctx.fill();
  ctx.restore();
}

// The long shimmering beam (drawn over the caravan, softly)
function drawBeam() {
  const a = star.a * (1 - 0.95 * stormA);
  if (a <= 0.02) return;
  const st = state === 'pause' ? pausedFrom : state;
  const arrive = st === 'scene' && scene && scene.type === 'arrive';
  const sp = spot();
  const x0 = star.x - star.lean, y0 = star.y;
  const hw = arrive ? 70 : sp.hw, gx = star.x, gy = arrive ? LANE_Y[0] - 40 : SPOT_Y;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a * (0.85 + 0.15 * Math.sin(t * 4));
  const g = ctx.createLinearGradient(0, y0, 0, gy);
  g.addColorStop(0, 'rgba(255,240,180,0.34)');
  g.addColorStop(0.75, 'rgba(255,225,150,0.12)');
  g.addColorStop(1, 'rgba(255,225,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0 - 7, y0); ctx.lineTo(x0 + 7, y0);
  ctx.lineTo(gx + hw * 0.85, gy); ctx.lineTo(gx - hw * 0.85, gy);
  ctx.closePath(); ctx.fill();
  // bright core
  ctx.fillStyle = 'rgba(255,250,220,0.14)';
  ctx.beginPath();
  ctx.moveTo(x0 - 2, y0); ctx.lineTo(x0 + 2, y0);
  ctx.lineTo(gx + hw * 0.3, gy); ctx.lineTo(gx - hw * 0.3, gy);
  ctx.closePath(); ctx.fill();
  // shimmering motes drifting down the beam
  ctx.fillStyle = 'rgba(255,250,220,0.85)';
  for (let k = 0; k < 16; k++) {
    const f = (t * 0.25 + hash(k) ) % 1;
    const side = (hash(k + 50) - 0.5) * 1.6;
    const px = lerp(x0, gx + side * hw * 0.8, f), py = lerp(y0, gy, f);
    const r = 1.2 + 1.3 * Math.abs(Math.sin(t * 3 + k));
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  Scenery: sky, moon, dunes, sand
// ============================================================
const STARS = Array.from({ length: 150 }, () => ({ fx: Math.random(), fy: Math.random(), r: rand(0.6, 2), ph: rand(0, TAU), sp: rand(1, 3) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, HORIZON);
  g.addColorStop(0, '#060a26');
  g.addColorStop(0.45, '#14215a');
  g.addColorStop(0.8, '#2d3a7c');
  g.addColorStop(1, '#5a4c86');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
  // twinkling stars
  for (const s of STARS) {
    const x = -offX + s.fx * viewW, y = -offY + s.fy * (offY + 560);
    const a = 0.45 + 0.55 * Math.sin(t * s.sp + s.ph) ** 2;
    ctx.globalAlpha = a * (1 - 0.8 * stormA);
    ctx.fillStyle = s.r > 1.6 ? '#fff6d8' : '#dfe8ff';
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon() {
  const mx = W + offX - 78, my = -offY + 150, r = 26;
  ctx.save();
  ctx.globalAlpha = 1 - 0.7 * stormA;
  const g = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 3);
  g.addColorStop(0, 'rgba(255,250,220,0.35)'); g.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, r * 3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx, my, r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#fff4c8'; ctx.fillRect(mx - r, my - r, r * 2, r * 2);
  ctx.fillStyle = '#0d1640';
  ctx.beginPath(); ctx.arc(mx + r * 0.5, my - r * 0.25, r * 0.92, 0, TAU); ctx.fill();
  ctx.restore();
}

function duneY(x, base, amp, factor, seed) {
  const u = x + dist * factor + seed;
  return base - amp * (0.55 * Math.sin(u / 210) + 0.3 * Math.sin(u / 97 + 1.3) + 0.15 * Math.sin(u / 43));
}

function duneLayer(base, amp, factor, col, rim, seed) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x0, HORIZON + 40);
  for (let x = x0; x <= x1 + 12; x += 12) ctx.lineTo(x, duneY(x, base, amp, factor, seed));
  ctx.lineTo(x1 + 12, HORIZON + 40); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rim; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = x0; x <= x1 + 12; x += 12) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, duneY(x, base, amp, factor, seed));
  ctx.stroke();
}

function drawPalmSilhouette(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -30, 2, -60); ctx.stroke();
  ctx.lineWidth = 4;
  for (const a of [-2.6, -2.1, -1.5, -1.0, -0.5]) {
    ctx.beginPath(); ctx.moveTo(2, -60);
    ctx.quadraticCurveTo(2 + Math.cos(a) * 20, -60 + Math.sin(a) * 20 - 6, 2 + Math.cos(a) * 34, -60 + Math.sin(a) * 18 + 10);
    ctx.stroke();
  }
  ctx.restore();
}

function drawDunes() {
  duneLayer(592, 34, 0.08, '#262c5c', 'rgba(170,170,230,0.25)', 0);
  duneLayer(622, 26, 0.2, '#3a3768', 'rgba(190,180,230,0.25)', 400);
  // palms on the middle dunes
  const f = 0.2;
  for (let k = Math.floor((dist * f - offX - 200) / 520); k <= Math.floor((dist * f + W + offX + 200) / 520); k++) {
    if (hash(k) < 0.45) continue;
    const x = k * 520 + hash(k + 9) * 200 - dist * f;
    drawPalmSilhouette(x, duneY(x, 622, 26, 0.2, 400) + 4, 0.7 + hash(k + 3) * 0.3, '#2c2a55');
  }
  duneLayer(652, 18, 0.45, '#56496f', 'rgba(230,200,190,0.3)', 900);
}

function drawGround() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#6f5d78');
  g.addColorStop(0.45, '#98806f');
  g.addColorStop(1, '#b8986e');
  ctx.fillStyle = g;
  ctx.fillRect(x0, HORIZON, x1 - x0, H - HORIZON + offY + 20);
  // gentle caravan tracks along each path
  for (let l = 0; l < 3; l++) {
    ctx.fillStyle = `rgba(255,236,205,${0.05 + l * 0.015})`;
    roundRect(x0, LANE_Y[l] - 12 - l * 2, x1 - x0, 20 + l * 3, 10); ctx.fill();
  }
  // pebbles and tufts of desert grass drifting past
  const gap = 64;
  for (let k = Math.floor((dist + x0) / gap); k <= Math.floor((dist + x1) / gap) + 1; k++) {
    const x = k * gap + hash(k) * 40 - dist;
    const y = lerp(HORIZON + 14, H - 6, hash(k + 17));
    const s = lerp(0.6, 1.2, (y - HORIZON) / (H - HORIZON));
    if (hash(k + 5) < 0.55) {
      ctx.fillStyle = 'rgba(70,55,80,0.35)';
      ctx.beginPath(); ctx.ellipse(x, y, 4 * s, 2.3 * s, 0, 0, TAU); ctx.fill();
    } else if (hash(k + 5) < 0.75) {
      ctx.strokeStyle = 'rgba(110,130,90,0.7)'; ctx.lineWidth = 1.6 * s; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x - 4 * s, y - 8 * s);
      ctx.moveTo(x, y); ctx.lineTo(x, y - 10 * s);
      ctx.moveTo(x, y); ctx.lineTo(x + 4 * s, y - 8 * s);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(255,240,215,0.18)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x - 14 * s, y); ctx.quadraticCurveTo(x, y - 4 * s, x + 14 * s, y); ctx.stroke();
    }
  }
}

// ============================================================
//  Jerusalem, Herod and Bethlehem
// ============================================================
function palaceScreenX() { return herodAt + W * 0.7 - dist; }
function houseScreenX() { return endAt + W * 0.72 - dist; }

function drawPalace(px) {
  if (px < -offX - 700 || px > W + offX + 700) return;
  const base = 690;
  const stone = '#b99a73', stoneDark = '#8f7352', lit = '#ffd27a';
  // city walls either side
  ctx.fillStyle = '#8d7a8a';
  ctx.fillRect(px - 640, base - 70, 1280, 70);
  ctx.fillStyle = '#7a6878';
  for (let x = px - 640; x < px + 640; x += 26) ctx.fillRect(x, base - 82, 14, 12);
  for (const tx of [px - 520, px + 520]) {
    ctx.fillStyle = '#8d7a8a'; ctx.fillRect(tx - 28, base - 120, 56, 120);
    ctx.fillStyle = '#7a6878';
    for (let k = 0; k < 3; k++) ctx.fillRect(tx - 28 + k * 21, base - 132, 14, 12);
    ctx.fillStyle = lit; roundRect(tx - 6, base - 96, 12, 18, [6, 6, 0, 0]); ctx.fill();
  }
  // the palace
  ctx.fillStyle = stone; ctx.strokeStyle = stoneDark; ctx.lineWidth = 2;
  ctx.fillRect(px - 210, base - 150, 420, 150); ctx.strokeRect(px - 210, base - 150, 420, 150);
  for (let x = px - 210; x < px + 210; x += 30) { ctx.fillRect(x, base - 166, 18, 16); }
  for (const tx of [px - 180, px + 180]) {
    ctx.fillStyle = stone;
    ctx.fillRect(tx - 34, base - 230, 68, 230); ctx.strokeRect(tx - 34, base - 230, 68, 230);
    ctx.fillStyle = goldGrad(tx - 34, tx + 34);
    ctx.beginPath(); ctx.moveTo(tx - 36, base - 230); ctx.quadraticCurveTo(tx - 34, base - 280, tx, base - 296);
    ctx.quadraticCurveTo(tx + 34, base - 280, tx + 36, base - 230); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx, base - 296); ctx.lineTo(tx, base - 326); ctx.stroke();
    ctx.fillStyle = '#7b3fa0';
    ctx.beginPath(); ctx.moveTo(tx, base - 326); ctx.lineTo(tx + 24 + Math.sin(t * 3) * 3, base - 318); ctx.lineTo(tx, base - 310); ctx.fill();
    ctx.fillStyle = lit;
    for (const wy of [base - 200, base - 140]) { roundRect(tx - 9, wy, 18, 26, [9, 9, 0, 0]); ctx.fill(); }
  }
  // central dome
  ctx.fillStyle = goldGrad(px - 90, px + 90);
  ctx.beginPath(); ctx.moveTo(px - 90, base - 166); ctx.quadraticCurveTo(px - 86, base - 250, px, base - 262);
  ctx.quadraticCurveTo(px + 86, base - 250, px + 90, base - 166); ctx.closePath(); ctx.fill();
  // windows and a balcony
  ctx.fillStyle = lit;
  for (const wx of [-110, -60, 60, 110]) { roundRect(px + wx - 10, base - 128, 20, 30, [10, 10, 0, 0]); ctx.fill(); }
  // grand gate
  ctx.fillStyle = '#3a2a3a';
  roundRect(px - 40, base - 96, 80, 96, [40, 40, 0, 0]); ctx.fill();
  const gg = ctx.createRadialGradient(px, base - 30, 5, px, base - 30, 60);
  gg.addColorStop(0, 'rgba(255,200,110,0.8)'); gg.addColorStop(1, 'rgba(255,200,110,0)');
  ctx.fillStyle = gg; roundRect(px - 40, base - 96, 80, 96, [40, 40, 0, 0]); ctx.fill();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(px, base - 56, 40, Math.PI, TAU); ctx.stroke();
  // banners

// Ridge of rocks down the middle path and the signpost

  if (!fork) return;
  const fx = fork.x - dist;
  if (fx > W + offX + 150 || fx + 760 < -offX) return;

    ctx.fillStyle = '#a49aa6';
    ctx.beginPath(); ctx.ellipse(x - 5, y - 22 * s, 7 * s, 4 * s, -0.3, 0, TAU); ctx.fill();

  ctx.save();

  ctx.scale(s, s);

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  interior = true;
  scene = null;
  bubble = null;
  const pct = playT > 0 ? Math.round(100 * inBeamT / playT) : 100;
  const gifts = giftPts;
  const light = pct * 10;
  const noBump = bumps === 0 ? 500 : 0;
  const way = cfg.fork && forkChosen ? 500 : 0;
  const levelBonus = level * 500;
  const score = gifts + light + noBump + way + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('followStarBest', best); } catch (e) {} }
  lastScore = { gifts, pct, light, noBump, way, levelBonus, score };
  banner = { key: 'joyShort', y: 230, age: 0 };
  for (let i = 0; i < 60; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(W / 2, 520, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  sfx.win();
  endTimer = 5;
}

function fail() {
  state = 'fail';
  bubble = null;
  showMessage('Lost in the desert…');
  sfx.fail();
  endTimer = 1.6;
}

function showMessage(text, queue = false) {
  if (queue && message.t > 0) { msgQueue.push(text); return; }
  message = { text, t: 2.2 };
}
function say(who, text, dur = 2.4) { bubble = { who, text, t: dur }; }

function startFade(dur, fn) { fade = { t: 0, dur, fn, done: false }; }

// ============================================================
//  Story scenes
// ============================================================
const SCENE_BEATS = { dream: [6.5], herod: [6.5, 4.2], arrive: [3.6] };

function startScene(type) {
  state = 'scene';
  scene = { type, beat: 0, t: 0 };
  bubble = null; banner = null;
  if (type === 'dream') {
    banner = { key: 'dream', y: 250, age: 0 };
    sfx.chime();
  } else if (type === 'herod') {
    caravan.lane = 2;
    say('herod', verseText('herod'), 99);
  } else if (type === 'arrive') {
    banner = { key: 'stoodOver', y: 150, age: 0 };
    sfx.chime();
  }
}

function nextBeat() {
  const sc = scene;
  sc.beat++; sc.t = 0;
  if (sc.type === 'herod' && sc.beat === 1) {
    bubble = null;
    banner = { key: 'wentBefore', y: 450, age: 0 };
    sfx.chime();
  }
  if (sc.beat >= SCENE_BEATS[sc.type].length) endScene();
}

function endScene() {
  const type = scene.type;
  banner = null; bubble = null;
  if (type === 'arrive') { scene.beat = 99; startFade(1.2, win); return; }
  state = 'play';
  scene = null;
  if (type === 'herod') {
    herodDone = true;
    showMessage('On to Bethlehem!');
    say(1, 'Follow the star!', 2.2);
  } else if (type === 'dream') {
    showMessage(`Level ${level}: ${cfg.name}`);
    showMessage('Take the other way at the fork!', true);
    introT = 1.2;
  }
}

function skipBeat() {
  if (state !== 'scene' || !scene || scene.t < 0.5) return;
  if (scene.beat >= SCENE_BEATS[scene.type].length) return;
  nextBeat();
}

function updateScene(dt) {
  const sc = scene;
  sc.t += dt;
  const r = range();
  if (sc.type === 'herod') caravan.tx = clamp(W * 0.3, r.lo, r.hi);
  if (sc.type === 'arrive') caravan.tx = clamp(houseScreenX() - 150 - SP, r.lo, r.hi);
  if (sc.type === 'arrive' && sc.t > 1.5 && Math.random() < dt * 6) {
    spawn(houseScreenX() + rand(-80, 80), rand(560, 690), 0, -20, 1.2, '#fff6d0', 2.5);
  }
  updateCaravan(dt);
  if (banner) banner.age += dt;
  const beats = SCENE_BEATS[sc.type];
  if (sc.beat < beats.length && sc.t >= beats[sc.beat]) nextBeat();
}

// ============================================================
//  Playing
// ============================================================
function updateCaravan(dt) {
  const r = range();
  caravan.tx = clamp(caravan.tx, r.lo, r.hi);
  const prev = caravan.mx;
  caravan.mx += (caravan.tx - caravan.mx) * Math.min(1, dt * 8);
  const vx = dt > 0 ? (caravan.mx - prev) / dt : 0;
  const cs = caravan.camels;
  cs[0].laneF += (caravan.lane - cs[0].laneF) * Math.min(1, dt * 10);
  cs[1].laneF += (cs[0].laneF - cs[1].laneF) * Math.min(1, dt * 7);
  cs[2].laneF += (cs[1].laneF - cs[2].laneF) * Math.min(1, dt * 7);
  const sp = (state === 'play' || state === 'title' ? speed : 0) + Math.abs(vx) * 1.5;
  caravan.moving += (clamp(sp / 70, 0, 1) - caravan.moving) * Math.min(1, dt * 5);
  caravan.walk += (0.8 + sp * 0.04) * dt * (caravan.moving > 0.05 ? 1 : 0);
}

function step(d) {
  const r = range();
  caravan.tx = clamp(caravan.tx + d * stepSize(), r.lo, r.hi);
  sfx.tap(clamp((caravan.tx - r.lo) / (r.hi - r.lo), 0, 1));
}

function changeLane(d) {
  const n = clamp(caravan.lane + d, 0, 2);
  if (n === caravan.lane) return false;
  caravan.lane = n;
  sfx.puff(0.2);
  return true;
}

function bump(o, p) {
  o.hit = true; o.hitT = t;
  bumps++;
  guidance -= BUMP_COST;
  shockT = 1; shakeT = 0.3;
  const msgs = { rock: 'Bump! A rock!', cactus: 'Ouch! Prickly!', dune: 'Oof! Too much sand!', snake: 'Hiss! Sorry, Mr Snake!' };
  showMessage(msgs[o.type]);
  if (o.type === 'snake') sfx.hiss(); else sfx.bounce();
  for (let i = 0; i < 14; i++) spawn(p.x + 30, p.y - 10, rand(-60, 60), rand(-90, -20), 0.7, '#dcc49a', rand(3, 6), 160);
}

function collect(it, p) {
  it.got = true;
  got[it.type]++;
  giftPts += ITEMS[it.type].pts;
  joyT = 0.7;
  if (it.type === 'water') guidance = Math.min(100, guidance + 15);
  const sx = it.x - dist, y = laneY(it.lane) - 30;
  floaters.push({ x: sx, y, text: ITEMS[it.type].label, t: 1.1, color: it.type === 'water' ? '#bfe3ff' : '#ffe27a' });
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU);
    spawn(sx, y, Math.cos(a) * 70, Math.sin(a) * 70 - 20, 0.6, it.type === 'water' ? '#9fd3ff' : '#ffe27a', rand(2, 3.5));
  }
  sfx.collect(it.type);
}

function checkFork() {
  if (!fork || fork.done || fork.pending) return;
  const lead = camelPos(0);
  if (dist + lead.x + 30 < fork.x) return;
  const lane = Math.round(caravan.camels[0].laneF);
  if (lane === 2 - fork.side) {
    fork.done = true;
    forkChosen = true;
    joyT = 1.5;
    showMessage('Another way! +500');
    floaters.push({ x: lead.x, y: lead.y - 120, text: '+500', t: 1.1, color: '#ffe27a' });
    sfx.chime();
    return;
  }
  // Herod's road (or straight into the signpost) just loops back round
  fork.pending = true;
  fork.tries++;
  shockT = 0.8;
  showMessage(lane === 1 ? 'Choose a road!' : 'Not that way!');
  say(0, lane === 1 ? 'Which way?' : 'Not back to Herod!', 2);
  sfx.bounce();
  startFade(1.1, () => {
    dist = fork.x - camelPos(0).x - 700;
    fork.pending = false;
  });
}

function updateStorms(dt) {
  let target = 0;
  for (const s of storms) {
    if (s.st === 0 && dist >= s.at) { s.st = 1; s.t = 0; showMessage('A sandstorm is coming!'); sfx.thunder(); }
    else if (s.st === 1) { s.t += dt; if (s.t > 1.4) { s.st = 2; s.t = 0; say(pick([0, 1, 2]), 'Where did the star go?', 2); } }
    else if (s.st === 2) { s.t += dt; target = 1; if (s.t > cfg.stormDur) s.st = 3; }
  }
  stormA += (target - stormA) * Math.min(1, dt * 2.5);
  if (stormA > 0.05) {
    for (let k = 0; k < 6; k++) {
      if (Math.random() < dt * 40 * stormA) sand.push({ x: W + offX + 20, y: rand(-offY, H), v: rand(500, 900), len: rand(20, 60), life: 1.6 });
    }
  }
  for (let i = sand.length - 1; i >= 0; i--) {
    const s = sand[i];
    s.x -= s.v * dt; s.life -= dt;
    if (s.x < -offX - 80 || s.life <= 0) sand.splice(i, 1);
  }
  sfx.thrust(stormA * 0.9);
}

function updatePlay(dt) {
  playT += dt;
  let target = cfg.speed;
  if (!herodDone) target *= clamp((herodAt - dist) / 400, 0.15, 1);
  else target *= clamp((endAt - dist) / 400, 0.15, 1);
  if (fade) target *= 0.3;
  speed += (target - speed) * Math.min(1, dt * 2.5);
  dist += speed * dt;
  updateStorms(dt);
  updateCaravan(dt);

  // Guidance: fills in the star's light, drains outside it
  const sp = spot();
  inBeam = Math.abs(caravan.mx - sp.x) < sp.hw;
  if (!fade) {
    if (inBeam) { guidance = Math.min(100, guidance + cfg.fill * dt); inBeamT += dt; }
    else guidance -= cfg.drain * dt * (stormA > 0.5 ? 0.6 : 1);
  } else inBeamT += dt;
  if (guidance <= 0) { guidance = 0; fail(); return; }

  // Obstacles and gifts
  for (let i = 0; i < 3; i++) {
    const p = camelPos(i);
    for (const o of obstacles) {
      if (o.hit) continue;
      const sx = o.x - dist;
      if (Math.abs(sx - p.x) > o.w / 2 + 26) continue;
      if (p.lf < o.lane - 0.45 || p.lf > o.lane + o.lanes - 1 + 0.45) continue;
      bump(o, p);
    }
    for (const it of items) {
      if (it.got) continue;
      if (Math.abs(it.x - dist - p.x) < 34 && Math.abs(p.lf - it.lane) < 0.5) collect(it, p);
    }
  }
  if (guidance <= 0) { guidance = 0; fail(); return; }
  checkFork();

  if (!herodDone && dist >= herodAt) { dist = herodAt; speed = 0; startScene('herod'); return; }
  if (herodDone && dist >= endAt) { dist = endAt; speed = 0; startScene('arrive'); return; }

  // Little moments of chatter
  if (introT > 0) {
    introT -= dt;
    if (introT <= 0) say(0, verseText('whereIsHe'), 3.4);
  }
  if (hintT > 0) {
    hintT -= dt;
    if (hintT <= 0) showMessage(matchMedia('(pointer: coarse)').matches ? 'Tap left or right to stay in the light' : '← / → to stay in the light, ↑ / ↓ to change path');
  }
  worryCd = Math.max(0, worryCd - dt);
  if (!inBeam && guidance < 35 && worryCd <= 0 && stormA < 0.3) { say(pick([0, 1, 2]), 'Stay in the light!', 1.8); worryCd = 6; }
  chatT -= dt;
  if (chatT <= 0) {
    chatT = rand(9, 14);
    if (inBeam && !bubble && stormA < 0.1) say(pick([0, 1, 2]), pick(['What a bright star!', 'Onward!', 'Follow the star!', 'Nearly there, friends!']), 2);
  }
}

// ============================================================
//  Input
// ============================================================
const ripples = [];

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'scene' && (e.code === 'Enter' || e.code === 'Space') && !e.repeat) { skipBeat(); return; }
  if (state !== 'play') return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') step(-1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') step(1);
  else if (!e.repeat && (e.code === 'ArrowUp' || e.code === 'KeyW')) changeLane(-1);
  else if (!e.repeat && (e.code === 'ArrowDown' || e.code === 'KeyS')) changeLane(1);
});

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

// A tap on the sand in another path's row changes path; anywhere else steps left or right.
function tapAction(p) {
  if (p.y > HORIZON - 10) {
    let row = 0;
    for (let l = 1; l < 3; l++) if (Math.abs(p.y - (LANE_Y[l] - 22)) < Math.abs(p.y - (LANE_Y[row] - 22))) row = l;
    if (row !== caravan.lane) { changeLane(row < caravan.lane ? -1 : 1); return; }
  }
  step(p.x < caravan.mx ? -1 : 1);
}

// Sliding: keep a finger (or the mouse button) down and slide. Sideways moves
// the caravan with your finger; every LANE_STEP_PX up or down changes path.
// (Copied from the Palm Sunday game's slide control and adapted.)
const drag = { id: null, sx: 0, sy: 0, anchorY: 0, preTx: 0, preLane: 1, slid: false };

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state === 'scene') { skipBeat(); return; }
  if (state !== 'play' || drag.id !== null) return;   // one finger steers
  drag.id = e.pointerId;
  drag.sx = e.clientX; drag.sy = drag.anchorY = e.clientY;
  drag.preTx = caravan.tx; drag.preLane = caravan.lane; drag.slid = false;
  tapAction(p);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  ripples.push({ x: p.x, y: p.y, t: 0 });
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== drag.id || state !== 'play') return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.slid) {
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
    // it's a slide, not a tap: undo what the tap did
    drag.slid = true;
    caravan.tx = drag.preTx; caravan.lane = drag.preLane;
    drag.anchorY = drag.sy;
  }
  const r = range();
  caravan.tx = clamp(drag.preTx + dx * dpr / scale, r.lo, r.hi);
  while (Math.abs(e.clientY - drag.anchorY) >= LANE_STEP_PX) {
    const dir = e.clientY < drag.anchorY ? -1 : 1;
    changeLane(dir);
    drag.anchorY += dir * LANE_STEP_PX;
  }
});

function endDrag(e) {
  sfx.init();   // iOS only unlocks audio on some gestures, so try again when the finger lifts
  if (e.pointerId !== drag.id) return;
  drag.id = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and

canvas.addEventListener('touchstart', stop, { passive: false });

canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);

document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
