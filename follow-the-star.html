// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched by where the caravan is heading
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  // the whistling wind of a sandstorm
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
  // a sparkle for each gift picked up
  collect(kind) {
    if (!this.ctx) return;
    if (kind === 'water') { this.tone(420, 0.2, 'sine', 0.3, 0, 900); return; }
    const base = kind === 'coin' ? 1320 : kind === 'frank' ? 988 : 1175;
    this.tone(base, 0.14, 'triangle', 0.18);
    this.tone(base * 1.5, 0.22, 'triangle', 0.14, 0.07);
  },
  // three bright rising notes for a story moment
  chime() {
    if (!this.ctx) return;
    [880, 1109, 1319].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.16, i * 0.12));
  },
  hiss() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.6);
  },
};

// ============================================================
//  Rendering
// ============================================================
function drawCaravanLane(L) {
  const idx = [2, 1, 0];
  for (const i of idx) {
    const p = camelPos(i);
    if (Math.round(p.lf) !== L) continue;
    drawCamel(p.x, p.y, p.s, MAGI[i], caravan.walk + i * 1.3, caravan.moving);
  }
}

function drawWorld() {
  const st = state === 'pause' ? pausedFrom : state;
  drawSky();
  drawMoon();
  drawStarOfBethlehem();
  drawDunes();
  drawGround();
  drawPalace(palaceScreenX());
  drawHouse(houseScreenX());
  drawForkGround();
  drawSpot();

  // everything on the sand, far path first
  const px = palaceScreenX();
  for (let L = 0; L < 3; L++) {
    for (const o of obstacles) if (o.lane + o.lanes - 1 === L) drawObstacle(o);
    for (const it of items) if (!it.got && it.lane === L) drawItem(it);
    if (L === 0 && Math.abs(px - W / 2) < W + 200) drawHerod(px, LANE_Y[0] + 4, 1.12);
    if (L === 1) drawForkMiddle();
    drawCaravanLane(L);
  }
  drawBeam();

  // which way is the light? (a gentle hint above the caravan)
  if (st === 'play' && !inBeam && stormA < 0.3) {
    const sp = spot();
    const p = camelPos(1);
    const dir = sp.x < caravan.mx ? -1 : 1;
    const ax = p.x + dir * 40, ay = p.y - 175 * CS;
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 8);
    ctx.fillStyle = '#ffe27a'; ctx.strokeStyle = 'rgba(60,40,0,0.6)'; ctx.lineWidth = 2;
    for (let k = 0; k < 2; k++) {
      const x = ax + dir * k * 16;
      ctx.beginPath(); ctx.moveTo(x + dir * 10, ay); ctx.lineTo(x - dir * 4, ay - 10); ctx.lineTo(x - dir * 4, ay + 10); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  if (scene && scene.type === 'dream') {
    const p = camelPos(1);
    drawAngel(p.x + 30, 480, clamp(scene.t / 1, 0, 1));
  }

  // sandstorm
  if (stormA > 0.01) {
    ctx.fillStyle = `rgba(196,150,96,${0.55 * stormA})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
    ctx.strokeStyle = `rgba(240,210,160,${0.7 * stormA})`;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const s of sand) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.len, s.y + 2); }
    ctx.stroke();
  }
}

function drawBubble() {
  if (!bubble) return;
  let anchor = null, big = false;
  if (typeof bubble.who === 'number') {
    if (interior) return;
    const p = camelPos(bubble.who);
    anchor = { x: p.x, y: p.y - 172 * p.s };
  } else if (bubble.who === 'herod') {
    anchor = { x: palaceScreenX(), y: LANE_Y[0] - 150 };
    big = true;
  }
  if (!anchor) return;
  ctx.save();
  ctx.globalAlpha = clamp(bubble.t / 0.3, 0, 1);
  const fs = big ? 18 : 15;
  ctx.font = `${big ? 700 : 600} ${fs}px Fredoka, sans-serif`;
  const maxW = Math.min(W + offX * 2 - 32, big ? 380 : 300);
  const lines = wrapLines(bubble.text, maxW - 24);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const lh = fs * 1.25;
  const w = tw + 24, h = lines.length * lh + 14;
  const bx = clamp(anchor.x - w / 2, -offX + 8, W + offX - w - 8);
  const by = anchor.y - h - 14;
  ctx.fillStyle = big ? '#f6ecff' : '#ffffff';
  ctx.strokeStyle = big ? '#7b3fa0' : 'rgba(40,40,60,0.6)';
  ctx.lineWidth = big ? 3 : 2;
  roundRect(bx, by, w, h, 14);
  ctx.fill(); ctx.stroke();
  const tx = clamp(anchor.x, bx + 16, bx + w - 16);
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + h); ctx.lineTo(anchor.x, anchor.y - 2); ctx.lineTo(tx + 8, by + h);
  ctx.stroke();
  ctx.fillStyle = big ? '#4a1f6b' : '#3b2f1e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, by + 7 + lh * (i + 0.5) + 1));
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,30,0.9)'; ctx.shadowBlur = 4;

  // Left: level + guidance
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff1c4';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Follow the Star' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('GUIDANCE', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,241,196,0.25)';
  roundRect(80, 38, 120, 13, 6.5); ctx.fill();
  const gl = state === 'title' ? 1 : guidance / 100;
  const gg = ctx.createLinearGradient(80, 0, 200, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
  ctx.fillStyle = gl < 0.25 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (gl > 0) { roundRect(80, 38, 120 * gl, 13, 6.5); ctx.fill(); }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: gifts and the journey map
  if (state !== 'title') {
    const rx = viewW - 12;
    ctx.textAlign = 'right';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff1c4';
    ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('GIFTS', rx, 20);
    ctx.font = '700 17px Fredoka, sans-serif';
    ctx.fillText(`${giftPts}`, rx, 40);
    ctx.shadowBlur = 0;
    // coin icon
    const cw = ctx.measureText(`${giftPts}`).width;
    ctx.fillStyle = '#f5c542'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rx - cw - 12, 34, 7, 0, TAU); ctx.fill(); ctx.stroke();
    // journey line: start, Jerusalem, Bethlehem
    const x0 = rx - 150, x1 = rx, y = 60;
    ctx.strokeStyle = 'rgba(255,241,196,0.4)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    const f = clamp(dist / endAt, 0, 1);
    ctx.strokeStyle = '#f7c948';
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, f), y); ctx.stroke();
    const jx = lerp(x0, x1, herodAt / endAt);
    drawCrown(jx, y - 5, 10, 8);
    ctx.fillStyle = '#fffbe0';
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 3 : 7;
      ctx.lineTo(x1 + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#caa06a'; ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(lerp(x0, x1, f), y, 5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (interior) drawInterior();
  else drawWorld();
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,240,200,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawBubble();
  drawBanner();
  drawMessage();

  if (fade) {
    const a = 1 - Math.abs(fade.t / fade.dur - 0.5) * 2;
    ctx.fillStyle = `rgba(255,248,225,${clamp(a, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  updateMagi(dt);
  updateStar(dt);
  if (state === 'play') {
    updatePlay(dt);
  } else if (state === 'scene') {
    updateScene(dt);
  } else if (state === 'title') {
    speed = 60; dist += speed * dt;
    updateCaravan(dt);
    const r = range();
    caravan.tx = clamp(star.x, r.lo, r.hi);
  } else if (state === 'fail') {
    speed = 0;
    updateCaravan(dt);
  } else if (state === 'win') {
    if (banner) banner.age += dt;
    if (Math.random() < dt * 10) spawn(W / 2 + rand(-200, 200), rand(300, 700), 0, -20, 1.2, '#fff6d0', 3);
  }
  if (state !== 'play' && state !== 'pause') { stormA = Math.max(0, stormA - dt * 2); sfx.thrust(0); }
  if (fade) {
    fade.t += dt;
    if (!fade.done && fade.t >= fade.dur / 2) { fade.done = true; fade.fn(); }
    if (fade.t >= fade.dur) fade = null;
  }
  shockT = Math.max(0, shockT - dt);
  joyT = Math.max(0, joyT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  if (message.t <= 0 && msgQueue.length) message = { text: msgQueue.shift(), t: 2.2 };
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
