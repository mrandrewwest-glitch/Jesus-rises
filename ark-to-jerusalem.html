<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Bringing the Ark Home</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  .card .new {
    text-align: center;
    background: #fff3cf;
    border-radius: 12px;
    padding: 6px 10px;
    margin: 8px 0;
  }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
  /* card-fit */
  #ovBtn { position: sticky; bottom: 4px; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Bringing the Ark Home</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// Sound theme for the shared music engine (music.js)
Music.theme = { tune: 'doxology', instrument: 'harp', accent: 'pipe', ambience: 'crowd', percussion: true };

// Scripture shown in this game, in every version the menu offers.
const VERSES = {
  // Title card
  danced: { ref: '2 Samuel 6:14', KJV: 'And David danced before the Lord with all his might', NKJV: 'Then David danced before the Lord with all his might', NIV: 'David was dancing before the Lord with all his might', NLT: 'And David danced before the Lord with all his might' },
  // Level cards
  gladness: { ref: '2 Samuel 6:12', KJV: 'So David went and brought up the ark of God from the house of Obededom into the city of David with gladness.', NKJV: 'So David went and brought up the ark of God from the house of Obed-Edom to the City of David with gladness.', NIV: 'So David went to bring up the ark of God from the house of Obed-Edom to the City of David with rejoicing.', NLT: 'So David went there and brought the Ark of God from the house of Obed-edom to the City of David with a great celebration.' },
  poles: { ref: '1 Chronicles 15:15', KJV: 'the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded', NKJV: 'the children of the Levites bore the ark of God on their shoulders, by its poles, as Moses had commanded', NIV: 'the Levites carried the ark of God with the poles on their shoulders, as Moses had commanded', NLT: 'the Levites carried the Ark of God on their shoulders with its carrying poles, just as the Lord had instructed Moses.' },
  played: { ref: '2 Samuel 6:5', KJV: 'David and all the house of Israel played before the Lord on all manner of instruments made of fir wood, even on harps, and on psalteries, and on timbrels, and on cornets, and on cymbals.', NKJV: 'Then David and all the house of Israel played music before the Lord on all kinds of instruments of fir wood, on harps, on stringed instruments, on tambourines, on sistrums, and on cymbals.', NIV: 'David and all Israel were celebrating with all their might before the Lord, with castanets, harps, lyres, timbrels, sistrums and cymbals.', NLT: 'David and all the people of Israel were celebrating before the Lord, singing songs and playing all kinds of musical instruments—lyres, harps, tambourines, castanets, and cymbals.' },
  // Win card
  broughtUp: { ref: '2 Samuel 6:15', KJV: 'So David and all the house of Israel brought up the ark of the Lord with shouting, and with the sound of the trumpet.', NKJV: 'So David and all the house of Israel brought up the ark of the Lord with shouting and with the sound of the trumpet.', NIV: 'he and all Israel were bringing up the ark of the Lord with shouts and the sound of trumpets.', NLT: 'So David and all the people of Israel brought up the Ark of the Lord with shouts of joy and the blowing of rams’ horns.' },
  // The last card
  inPlace: { ref: '2 Samuel 6:17', KJV: 'And they brought in the ark of the Lord, and set it in his place, in the midst of the tabernacle that David had pitched for it', NKJV: 'So they brought the ark of the Lord, and set it in its place in the midst of the tabernacle that David had erected for it.', NIV: 'They brought the ark of the Lord and set it in its place inside the tent that David had pitched for it', NLT: 'They brought the Ark of the Lord and set it in its place inside the special tent David had prepared for it.' },
  // The crowd's shout (bubble)
  might: { ref: '2 Samuel 6:14', KJV: 'with all his might', NKJV: 'with all his might', NIV: 'with all his might', NLT: 'with all his might' },
};
function verseHTML(key, pre = '') {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${pre}${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (f) => f * f * (3 - 2 * f);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
  onResize();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ============================================================
//  Tuning
// ============================================================
const TOPH = 112;          // HUD strip at the top of the screen
const ROAD_Y = 650;        // where the road under the ark sits on screen
const SPEED = 105;         // how fast the procession walks (px/s)
const PRIEST_GAP = 82;     // from the ark's middle to each priest
const POLE = 118;          // half the length of the carrying poles

const LEVELS = [
  { name: 'Setting Out',             secs: 38, bpm: 76,  inst: 0.42, noise: 0.17, tmax: 0.6 , imp: 0.62, potholes: 3, puddles: 0, sheep: 1, hills: 0.10, steps: 0 },
  { name: 'Down the Valley',         secs: 45, bpm: 84,  inst: 0.75, noise: 0.3,  tmax: 0.52, imp: 0.62, potholes: 4, puddles: 2, sheep: 1, hills: 0.16, steps: 0 },
  { name: 'Sheep on the Road',       secs: 50, bpm: 92,  inst: 0.9,  noise: 0.36, tmax: 0.5,  imp: 0.64, potholes: 4, puddles: 2, sheep: 3, hills: 0.2,  steps: 0 },
  { name: 'Up the Steep Hill',       secs: 55, bpm: 100, inst: 1.05, noise: 0.42, tmax: 0.47, imp: 0.66, potholes: 5, puddles: 3, sheep: 2, hills: 0.34, steps: 0 },
  { name: 'Rocky Steps',             secs: 60, bpm: 108, inst: 1.1,  noise: 0.44, tmax: 0.45, imp: 0.68, potholes: 5, puddles: 3, sheep: 3, hills: 0.3,  steps: 2 },
  { name: 'The Gates of Jerusalem',  secs: 66, bpm: 116, inst: 1.22, noise: 0.5,  tmax: 0.43, imp: 0.7,  potholes: 6, puddles: 4, sheep: 4, hills: 0.36, steps: 3 },
];
const NEW_THINGS = [
  '',
  '<b>New: puddles!</b> A priest may slip. Be ready to steady the ark!',
  '<b>New: lots of sheep!</b> <b>Tap a sheep</b> on the road to shoo it away before the priests bump into it.',
  '<b>New: steep hills!</b> Going uphill the back of the ark sinks; going downhill the front sinks.',
  '<b>New: stone steps!</b> Every step gives the ark a little bump.',
  'The longest road and the fastest music. All the way to Jerusalem!',
];

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | pause | win | fail | done
let pausedFrom = 'play';
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('arkHomeBest') || 0; } catch (e) {}

let cfg = LEVELS[0];
let t = 0;
let route = null;          // { len, hs (heights every 4px), obstacles, crowd }
let ark = null;            // { x (world), th, w }
let hearts = 3;
let stopT = 0;             // the priests stopped after a wobble
let joy = 0, joyPts = 0, perfects = 0, goods = 0, streak = 0, bestStreak = 0, shouts = 0;
let levelSum = 0, levelN = 0;
let beatT = 0, beatN = 0;
let danceT = 0, danceMove = 0;
let gust = 0, gustT = 0, gustTarget = 0;
let tapFx = [];            // little pops on the buttons
let particles = [];
let message = { text: '', t: 0 };
let judge = { text: '', t: 0, col: '#fff' };
let shoutT = 0;
let flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let playT = 0, winT = 0, failT = 0;
let told = {};
let camX = 0;

// ============================================================
//  The road to Jerusalem
// ============================================================
function arkScreenX() { return W < 640 ? W * 0.3 : W * 0.34; }

function buildRoute() {
  const len = Math.round(cfg.secs * SPEED);
  const n = Math.ceil((len + 2400) / 4);
  const hs = new Float32Array(n);
  // gentle rolling hills, with steeper ones on later levels
  const a1 = rand(0, TAU), a2 = rand(0, TAU);
  const steep = [];
  if (cfg.hills > 0.25) for (let k = 0; k < 3; k++) steep.push({ at: (0.2 + k * 0.25) * len + rand(-100, 100), len: rand(380, 520), dir: k % 2 ? -1 : 1 });
  const stepsAt = [];
  for (let k = 0; k < cfg.steps; k++) stepsAt.push({ at: (0.3 + k * 0.22) * len + rand(-60, 60), n: 6 });
  let h = 0;
  for (let i = 0; i < n; i++) {
    const x = i * 4;
    let slope = cfg.hills * 0.7 * Math.sin(x / 420 + a1) * Math.sin(x / 1300 + a2);
    if (x < 500) slope *= x / 500;
    for (const s of steep) if (x > s.at && x < s.at + s.len) slope += s.dir * cfg.hills * Math.sin((x - s.at) / s.len * Math.PI);
    if (x > len - 300) slope *= Math.max(0, (len - x) / 300);
    h += slope * 4;
    for (const st of stepsAt) {
      const k = Math.floor((x - st.at) / 40);
      if (k >= 0 && k < st.n && (x - st.at) % 40 < 4) h += 9;
    }
    hs[i] = h;
  }
  const obstacles = [];
  const place = (kind, count, minGap = 260) => {
    for (let k = 0; k < count; k++) {
      for (let tries = 0; tries < 40; tries++) {
        const x = rand(500, len - 250);
        if (obstacles.every((o) => Math.abs(o.x - x) > minGap) && stepsAt.every((s) => x < s.at - 60 || x > s.at + 300)) { obstacles.push({ kind, x, hitF: false, hitB: false, shooed: false, run: 0, dy: 0, face: Math.random() < 0.5 ? 1 : -1 }); break; }
      }
    }
  };
  place('sheep', cfg.sheep, 500);
  place('puddle', cfg.puddles);
  place('pothole', cfg.potholes);
  for (const st of stepsAt) obstacles.push({ kind: 'steps', x: st.at, n: st.n, hitF: 0, hitB: 0 });
  obstacles.sort((a, b) => a.x - b.x);
  const crowd = [];
  for (let x = -600; x < len + 900; x += rand(70, 120)) crowd.push({ x, d: CROWD[Math.floor(rand(0, CROWD.length))], inst: pick(['', '', 'harp', 'timbrel', 'horn', 'cymbal']), ph: rand(0, TAU), s: rand(0.75, 0.9) });
  route = { len, hs, obstacles, crowd, stepsAt };
}

function roadH(x) {
  const i = clamp(x / 4, 0, route.hs.length - 1.001);
  const i0 = Math.floor(i);
  return lerp(route.hs[i0], route.hs[i0 + 1], i - i0);
}
function roadSlope(x) { return (roadH(x + 30) - roadH(x - 30)) / 60; }
// screen-space y of the road at world x (the road under the ark stays at ROAD_Y)
function roadY(x) { return ROAD_Y - (roadH(x) - roadH(ark.x)); }

function onResize() {}
// messages sit just under the meters
function MSG_Y() { return TOPH + 16 + 112; }

// ============================================================
//  Level flow
// ============================================================
function resetLevel() {
  cfg = LEVELS[level - 1];
  ark = { x: 0, th: 0, w: 0 };
  buildRoute();
  hearts = 3; stopT = 0;
  joy = 0; joyPts = 0; perfects = 0; goods = 0; streak = 0; bestStreak = 0; shouts = 0;
  levelSum = 0; levelN = 0;
  beatT = 0; beatN = 0; danceT = 0; danceMove = 0;
  gust = 0; gustT = 0; gustTarget = 0;
  tapFx = []; particles = [];
  judge = { text: '', t: 0, col: '#fff' };
  shoutT = 0; flashT = shakeT = 0; endTimer = 0;
  playT = 0; winT = 0; failT = 0;
  told = {};
  keys.clear();
}

function startLevel() {
  resetLevel();
  hideOverlay();
  state = 'play';
  syncAmbience();
  sfx.levelStart();
  showMessage(`Level ${level}: ${cfg.name}`, 2.2);
  if (level === 1) setTimeout(() => { if (state === 'play' && level === 1) showMessage('Tap the side that dips to lift it!', 3); }, 2400);
}

// ============================================================
//  Keeping the ark level
// ============================================================
function lift(side) {
  if (state !== 'play') return;
  // side -1: lift the left (back) end; +1: lift the right (front) end
  ark.w += side < 0 ? cfg.imp : -cfg.imp;
  tapFx.push({ side, t: 0.3 });
  sfx.lift(side);
}

function updateArk(dt) {
  if (stopT > 0) {
    stopT -= dt;
    ark.th *= Math.pow(0.02, dt); ark.w = 0;
    return;
  }
  ark.x += SPEED * dt;
  // a changing breeze and unsteady feet
  gustT -= dt;
  if (gustT <= 0) { gustT = rand(0.8, 2); gustTarget = rand(-1, 1) * cfg.noise; }
  gust = lerp(gust, gustTarget, 1 - Math.pow(0.2, dt));
  const slope = roadSlope(ark.x);
  const shoutCalm = shoutT > 0 ? 0.3 : 1;
  // uphill (the road rises to the right) makes the back (left) end sink
  const acc = (cfg.inst * ark.th * 1.6 + gust - slope * 2.2) * shoutCalm;
  ark.w += acc * dt;
  ark.w *= Math.pow(0.35, dt);
  ark.th += ark.w * dt;
  levelSum += 1 - Math.min(1, Math.abs(ark.th) / cfg.tmax); levelN++;
  if (Math.abs(ark.th) > cfg.tmax * 0.62 && !told.lift) { told.lift = true; showMessage(ark.th > 0 ? 'The front is dipping! Tap RIGHT' : 'The back is dipping! Tap LEFT', 2); }
  if (Math.abs(slope) > 0.2 && !told.hill) { told.hill = true; showMessage(slope > 0 ? 'Uphill! The back end sinks' : 'Downhill! The front end sinks', 2.2); }
  if (Math.abs(ark.th) >= cfg.tmax) wobble();
}

// The ark tipped too far: the priests stop and steady it
function wobble() {
  hearts--;
  stopT = 1.6;
  shakeT = 0.35;
  streak = 0;
  sfx.whoa();
  showMessage(hearts > 0 ? 'Whoa! The priests stop to steady the ark' : 'The ark tipped too far!', 2.2);
  if (hearts <= 0) fail();
}

// Bumps from the road: each priest feels the hole when he reaches it
function updateObstacles(dt) {
  const fx = ark.x + PRIEST_GAP, bx = ark.x - PRIEST_GAP;
  for (const o of route.obstacles) {
    if (o.kind === 'pothole' || o.kind === 'puddle') {
      const J = o.kind === 'puddle' ? 0.55 : 0.4;
      if (!o.hitF && fx >= o.x) {
        o.hitF = true;
        if (o.kind === 'puddle') { o.sign = Math.random() < 0.5 ? -1 : 1; ark.w += o.sign * J; splash(o.x); sfx.splash(); if (!told.puddle) { told.puddle = true; showMessage('Splash! A slippery puddle!', 1.8); } }
        else { ark.w += J; sfx.bump(); }
      }
      if (!o.hitB && bx >= o.x) {
        o.hitB = true;
        if (o.kind === 'puddle') { ark.w -= o.sign * J * 0.7; splash(o.x); sfx.splash(); }
        else { ark.w -= J; sfx.bump(); }
      }
    } else if (o.kind === 'steps') {
      for (const [who, px] of [['hitF', fx], ['hitB', bx]]) {
        const k = Math.floor((px - o.x) / 40) + 1;
        if (k > o[who] && k <= o.n && px >= o.x) { o[who] = k; ark.w += who === 'hitF' ? -0.24 : 0.24; sfx.bump(); }
      }
      if (!told.steps && o.x - fx < 260 && o.x > fx) { told.steps = true; showMessage('Stone steps ahead! Bump, bump…', 2); }
    } else if (o.kind === 'sheep') {
      if (o.shooed) { o.run += dt; o.dy = Math.min(o.dy + 180 * dt, 140); continue; }
      if (!told.sheep && o.x - ark.x < W * 0.62) { told.sheep = true; showMessage('A sheep on the road! Tap it to shoo it', 2.4); }
      if (fx >= o.x - 26) {
        o.shooed = true; o.bumped = true;
        ark.w += (Math.random() < 0.5 ? -1 : 1) * 0.9;
        sfx.baa(); sfx.bump();
        streak = 0;
        showMessage('Bump! Baa!', 1.6);
      }
    }
  }
}

function shoo(o) {
  if (o.shooed) return;
  o.shooed = true;
  sfx.baa();
  joyPts += 40;
  for (let k = 0; k < 6; k++) particles.push({ kind: 'star', x: o.x - camX, y: roadY(o.x) - 40, vx: rand(-80, 80), vy: rand(-120, -40), life: 0.7, t: 0, color: '#fff6d0', size: 3, grav: 120 });
}

function splash(x) {
  for (let k = 0; k < 10; k++) particles.push({ x: x - camX, y: roadY(x) - 4, vx: rand(-90, 90), vy: rand(-160, -60), life: 0.6, t: 0, color: '#8fd0f0', size: rand(2, 4), grav: 420 });
}

// ============================================================
//  Dancing to the beat
// ============================================================
function beatLen() { return 60 / cfg.bpm; }
function dance() {
  if (state !== 'play') return;
  const P = beatLen();
  const ph = beatT % P;
  const err = Math.min(ph, P - ph);
  // only one dance step per beat counts
  const nearest = Math.round(beatT / P);
  danceT = 0.35; danceMove = (danceMove + 1) % 4;
  tapFx.push({ side: 0, t: 0.3 });
  if (nearest === judge.lastBeat) { setJudge('Wait for the beat!', '#ffd0c0'); streak = 0; return; }
  judge.lastBeat = nearest;
  if (err < 0.11) { perfects++; streak++; addJoy(8 + Math.min(streak, 6) * 0.5); setJudge('Perfect!', '#fff27a'); sfx.danceHit(1); }
  else if (err < 0.2) { goods++; streak++; addJoy(5); setJudge('Good!', '#c8ffb0'); sfx.danceHit(0.6); }
  else { streak = 0; setJudge('Off the beat', '#ffd0c0'); sfx.offBeat(); }
  bestStreak = Math.max(bestStreak, streak);
}
function setJudge(text, col) { judge.text = text; judge.t = 0.7; judge.col = col; }
function addJoy(n) {
  joyPts += Math.round(n * 6);
  joy += n;
  if (joy >= 100) {
    joy = 0; shouts++;
    shoutT = 2.5;
    joyPts += 200;
    ark.w *= 0.3;
    flashT = 0.25;
    sfx.shout();
    showMessage('SHOUT for joy! The trumpets sound!', 2.2);
  }
}

//  Win / fail
// ============================================================
function win() {
  state = 'win';
  syncAmbience();
  winT = 0;
  const levelBonus = level * 400;
  const heartBonus = hearts * 200;
  const steadyBonus = Math.round((levelN ? levelSum / levelN : 0) * 600);
  const score = joyPts + levelBonus + heartBonus + steadyBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('arkHomeBest', best); } catch (e) {} }
  lastScore = { joyPts, levelBonus, heartBonus, steadyBonus, score };
  showMessage('Welcome home to Jerusalem!', 2.4);
  sfx.win();
  endTimer = 5.5;
}

function fail() {
  state = 'fail';
  syncAmbience();
  failT = 0;
  sfx.fail();
  endTimer = 2.4;
}

const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { startLevel(); return; }
  if (state === 'win' && (e.code === 'Space' || e.code === 'Enter') && !e.repeat && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state === 'play' && !e.repeat) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') lift(-1);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') lift(1);
    else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') dance();
    else if (e.code === 'KeyS' || e.code === 'ArrowDown') { const o = nextSheep(); if (o) shoo(o); }
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toView(e) {
  return { vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}
function nextSheep() {
  return route.obstacles.find((o) => o.kind === 'sheep' && !o.shooed && o.x > ark.x && o.x - camX < W + 40);
}
// The three big buttons along the bottom
function buttons() {
  const y = H - 72, r = W < 640 ? 52 : 60;
  return [
    { side: -1, x: Math.max(70, W * 0.13), y, r },
    { side: 0, x: W / 2, y, r: r + 6 },
    { side: 1, x: W - Math.max(70, W * 0.13), y, r },
  ];
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toView(e);
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 8) { b.action(); return; }
  }
  if (state === 'win' && winT > 2.5) { endTimer = Math.min(endTimer, 0.01); return; }
  if (state !== 'play') return;
  const lx = p.vx - offX, ly = p.vy - offY;
  // a sheep?
  for (const o of route.obstacles) {
    if (o.kind !== 'sheep' || o.shooed) continue;
    const sx = o.x - camX, sy = roadY(o.x) - 26;
    if (Math.hypot(lx - sx, ly - sy) < 62) { shoo(o); return; }
  }
  // left third lifts the left, right third lifts the right, the middle dances
  if (lx < W / 3) lift(-1);
  else if (lx > W * 2 / 3) lift(1);
  else dance();
});

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      Music.init(this.ctx, this.master);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      syncAmbience();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    syncAmbience();
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(freq, dur, vol, q = 0.8, slideTo = null, type = 'bandpass', delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) Music.win(); },
  levelStart() { if (this.ctx) Music.start(); },
  fail() { if (this.ctx) Music.fail(); },
  drum(acc) { this.tone(acc ? 110 : 90, 0.18, 'sine', acc ? 0.4 : 0.28, 0, 50); this.noiseBurst(acc ? 1800 : 1200, 0.08, acc ? 0.12 : 0.07, 1); },
  jingle() { for (let i = 0; i < 3; i++) this.noiseBurst(7000, 0.06, 0.06, 3, null, 'bandpass', i * 0.03); },
  danceHit(v) { if (this.ctx) Music.tap(0.3 + 0.6 * v * Math.random()); this.jingle(); },
  offBeat() { this.tone(260, 0.12, 'triangle', 0.1); },
  lift(side) { this.tone(side < 0 ? 330 : 392, 0.08, 'triangle', 0.1); },
  bump() { this.tone(120, 0.15, 'sine', 0.3, 0, 70); this.noiseBurst(400, 0.12, 0.15, 1); },
  splash() { this.noiseBurst(2400, 0.35, 0.22, 0.8, 600); },
  baa() { this.tone(420, 0.45, 'sawtooth', 0.06, 0, 380); this.tone(430, 0.45, 'sawtooth', 0.05, 0.02, 390); },
  whoa() { this.tone(500, 0.3, 'triangle', 0.18, 0, 260); },
  shout() { if (!this.ctx) return; [392, 523, 659, 784].forEach((f, i) => { this.tone(f, 0.7, 'sawtooth', 0.05, i * 0.08); }); this.noiseBurst(900, 1.2, 0.2, 0.5); },
};

const PRIEST2 = { robe: '#f4f1e6', hair: '#2e1d10', skin: '#d7a070', beard: true, sash: '#3a7bd5', turban: '#ffffff' };

  { robe: '#3f6fb5', hair: '#8a8a8a', skin: '#d9a066', beard: true },
  { robe: '#c46b8c', hair: '#3a2716', skin: '#d7a070', beard: false },

];

function eyes(x, y, lx, ly, closed, big = 1) {
  const dark = '#2b1d12';
  for (const sx of [-6, 6]) {
    if (closed) {
      ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + sx, y - 1, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x + sx, y, 3.6 * big, 4.6 * big, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(x + sx + lx * 1.6, y + ly * 2, 2.1, 0, TAU); ctx.fill();
  }
}

// A standing figure: d = colours, pose = 'creep' | 'stand' | 'hold' | 'call' | 'walk'
function drawFigure(d, x, y, s, opt = {}) {
  const pose = opt.pose || 'stand';
  const face = opt.face || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 0, 20 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s, s);
  const crouch = pose === 'creep' ? 8 : 0;
  ctx.translate(0, crouch * 0.5);
  if (opt.shiver) ctx.translate(Math.sin(t * 60) * 1.6, 0);
  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  // feet
  const stepA = pose === 'walk' ? Math.sin(opt.step || 0) * 5 : 0;
  ctx.fillStyle = '#7a4a28';
  ctx.beginPath(); ctx.ellipse(-7 + stepA, -2, 6, 3.5, 0, 0, TAU); ctx.ellipse(7 - stepA, -2, 6, 3.5, 0, 0, TAU); ctx.fill();
  // robe
  ctx.fillStyle = d.robe; ctx.strokeStyle = shade(d.robe, -40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-17, -2);
  ctx.quadraticCurveTo(-16, -30, -11, -37 + crouch);
  ctx.quadraticCurveTo(0, -41 + crouch, 11, -37 + crouch);
  ctx.quadraticCurveTo(16, -30, 17, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = d.sash || '#c9b07a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-15, -18 + crouch * 0.4); ctx.quadraticCurveTo(0, -15 + crouch * 0.4, 15, -18 + crouch * 0.4); ctx.stroke();
  const sh = -32 + crouch;
  if (pose === 'creep') { arm(-11, sh, -18 * face, sh + 14); arm(11, sh, 22 * face, sh + 6); }
  else if (pose === 'hold') { arm(-11, sh, -14, sh + 20); arm(11 * face, sh, 22 * face, sh - 36); }
  else if (pose === 'call') { arm(-11, sh, -24, sh - 30); arm(11, sh, 24, sh - 30); }
  else if (pose === 'lamp' || pose === 'walk') { arm(11 * face, sh, 30 * face, sh + 14); arm(-11 * face, sh, -15 * face, sh + 20); }
  else if (pose === 'bow') { arm(-11 * face, sh, 18 * face, sh + 2); arm(11 * face, sh, 30 * face, sh); }
  else if (pose === 'run') { const sw = Math.sin(opt.step || 0) * 12; arm(-11, sh, -14 - sw * 0.5, sh + 18); arm(11, sh, 14 + sw * 0.5, sh + 18); }
  else if (pose === 'hug') { arm(-11 * face, sh, 16 * face, sh + 6); arm(11 * face, sh, 28 * face, sh + 4); }
  else if (pose === 'carry') { arm(-11, sh, -16, sh - 30); arm(11, sh, 16, sh - 30); }
  else if (pose === 'dance') { const sw = Math.sin(opt.step || 0); arm(-11, sh, -26, sh - 22 - sw * 10); arm(11, sh, 26, sh - 22 + sw * 10); }
  else if (pose === 'bowdown') { arm(-11, sh, -12, sh + 16); arm(11, sh, 12, sh + 16); }
  else { arm(-11, sh, -15, sh + 20); arm(11, sh, 15, sh + 20); }
  // head
  const hy = -53 + crouch;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (d.helmet) {
    ctx.fillStyle = '#9aa4ad';
    ctx.beginPath(); ctx.arc(0, hy - 3, 17, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#c0392b'; roundRect(-3, hy - 26, 6, 10, 3); ctx.fill();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
    if (!d.beard) { // David's curls
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-12 + k * 6, hy - 13 + Math.abs(k - 2), 4, 0, TAU); ctx.fill(); }
    }
  }
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  if (d.crown) drawCrown(0, hy - 14, 1);
  if (d.band) { ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(0, hy - 1, 15.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
  if (d.turban) { ctx.fillStyle = d.turban; ctx.beginPath(); ctx.ellipse(0, hy - 12, 18, 9, 0, 0, TAU); ctx.fill(); ctx.fillStyle = shade(d.turban, -25); ctx.fillRect(-16, hy - 9, 32, 4); }
  const closed = opt.blink;
  eyes(0, hy - 1, opt.lx != null ? opt.lx : face * 0.6, opt.ly || 0, closed, opt.wide ? 1.2 : 1);
  // mouth
  ctx.lineCap = 'round';
  if (opt.mouth === 'o') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.ellipse(0, hy + 9, 3, 4, 0, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'shh') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.arc(0, hy + 9, 2.4, 0, TAU); ctx.fill(); }
  else if (opt.mouth === 'grin') { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); ctx.moveTo(-6, hy + 6); ctx.arc(0, hy + 6, 6, 0, Math.PI); ctx.closePath(); ctx.fill(); }
  else { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, hy + 6, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (opt.hold) opt.hold(22 * face, sh - 44);
  ctx.restore();
}

function drawCrown(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-13, 4); ctx.lineTo(-14, -8); ctx.lineTo(-7, -2); ctx.lineTo(0, -11); ctx.lineTo(7, -2); ctx.lineTo(14, -8); ctx.lineTo(13, 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
  ctx.restore();
}

// ============================================================
//  Drawing the world
// ============================================================
function drawSky() {
  const L = -offX, R = W + offX, T = -offY;
  const g = ctx.createLinearGradient(0, T, 0, ROAD_Y);
  g.addColorStop(0, '#8fcaf0'); g.addColorStop(0.7, '#cfe9f5'); g.addColorStop(1, '#fff0c8');
  ctx.fillStyle = g; ctx.fillRect(L, T, R - L, H - T);
  // sun
  const sg = ctx.createRadialGradient(W * 0.8, 210, 10, W * 0.8, 210, 120);
  sg.addColorStop(0, 'rgba(255,250,220,0.95)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * 0.8, 210, 120, 0, TAU); ctx.fill();
  // far hills drift slowly
  const par = camX * 0.15;
  ctx.fillStyle = '#c4d9a2';
  ctx.beginPath(); ctx.moveTo(L, H);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, ROAD_Y - 210 + Math.sin((x + par) / 150) * 30 + Math.sin((x + par) / 61) * 10);
  ctx.lineTo(R, H); ctx.fill();
  // Jerusalem on its hill, coming closer
  if (route) {
    const f = clamp(ark.x / route.len, 0, 1);
    const cx = lerp(W + 260, W * 0.78, f) + (state === 'win' || state === 'done' ? -Math.min(winT, 3) * 30 : 0);
    const s = lerp(0.5, 0.9, f);
    drawCity(cx, ROAD_Y - 200, s);
  }
  const par2 = camX * 0.4;
  ctx.fillStyle = '#a9cd84';
  ctx.beginPath(); ctx.moveTo(L, H);
  for (let x = L; x <= R + 20; x += 20) ctx.lineTo(x, ROAD_Y - 120 + Math.sin((x + par2) / 190 + 1) * 22);
  ctx.lineTo(R, H); ctx.fill();
  // olive trees on the near hill
  for (let k = -1; k < 8; k++) {
    const tx = ((k * 230 - par2) % (W + 460) + W + 460) % (W + 460) - 200;
    const ty = ROAD_Y - 120 + Math.sin((tx + par2) / 190 + 1) * 22;
    ctx.fillStyle = '#7a5a3a'; ctx.fillRect(tx - 4, ty - 26, 8, 28);
    ctx.fillStyle = '#7f9a5a'; ctx.beginPath(); ctx.ellipse(tx, ty - 36, 26, 18, 0, 0, TAU); ctx.fill();
  }
}

function drawCity(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#e3cf9e';
  ctx.beginPath(); ctx.ellipse(0, 40, 220, 50, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#d8c08a';
  ctx.fillRect(-160, -40, 320, 60);
  for (let k = 0; k < 9; k++) ctx.fillRect(-160 + k * 38, -52, 20, 14);
  ctx.fillStyle = '#c9ad74';
  ctx.fillRect(-196, -80, 44, 100); ctx.fillRect(152, -80, 44, 100);
  for (const tx of [-196, 152]) for (let k = 0; k < 3; k++) ctx.fillRect(tx + k * 16, -92, 10, 14);
  ctx.fillStyle = '#7a5a3a';
  ctx.beginPath(); ctx.moveTo(-24, 20); ctx.lineTo(-24, -10); ctx.arc(0, -10, 24, Math.PI, TAU); ctx.lineTo(24, 20); ctx.fill();
  ctx.fillStyle = '#efe3c2';
  for (let k = 0; k < 5; k++) { ctx.fillRect(-110 + k * 50, -76 - (k % 2) * 10, 30, 30); }
  ctx.restore();
}

function drawRoad() {
  const L = -offX, R = W + offX;
  // grass under the road
  ctx.fillStyle = '#8fc06a';
  ctx.beginPath(); ctx.moveTo(L, H + 10);
  for (let x = L; x <= R + 8; x += 8) ctx.lineTo(x, roadY(x + camX) - 26);
  ctx.lineTo(R, H + 10); ctx.fill();
  // the dirt road
  ctx.fillStyle = '#d9b77e';
  ctx.beginPath();
  for (let x = L; x <= R + 8; x += 8) ctx.lineTo(x, roadY(x + camX));
  for (let x = R + 8; x >= L; x -= 8) ctx.lineTo(x, roadY(x + camX) + 46);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b8955c'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = L; x <= R + 8; x += 8) ctx.lineTo(x, roadY(x + camX));
  ctx.stroke();
  // pebbles on the road
  for (let k = Math.floor((camX + L) / 53); k < (camX + R) / 53; k++) {
    const wx = k * 53 + hash(k, 2) * 30;
    ctx.fillStyle = '#c6a46c';
    ctx.beginPath(); ctx.ellipse(wx - camX, roadY(wx) + 12 + hash(k, 3) * 26, 4, 2.5, 0, 0, TAU); ctx.fill();
  }
  // stone steps
  for (const st of route.stepsAt) {
    for (let k = 0; k < st.n; k++) {
      const wx = st.at + k * 40;
      const sx = wx - camX;
      if (sx < L - 50 || sx > R + 50) continue;
      ctx.fillStyle = '#b7aa98';
      ctx.fillRect(sx, roadY(wx + 6), 40, 46);
      ctx.fillStyle = '#d2c7b6'; ctx.fillRect(sx, roadY(wx + 6), 40, 6);
    }
  }
  // flowers in the grass
  for (let k = Math.floor((camX + L) / 37); k < (camX + R) / 37; k++) {
    const wx = k * 37 + hash(k, 5) * 20;
    ctx.fillStyle = ['#fff', '#ffd166', '#f28fb1'][k % 3];
    ctx.beginPath(); ctx.arc(wx - camX, roadY(wx) + 60 + hash(k, 6) * 60, 3, 0, TAU); ctx.fill();
  }
}

function drawObstaclesFlat() {
  for (const o of route.obstacles) {
    const sx = o.x - camX;
    if (sx < -offX - 80 || sx > W + offX + 80) continue;
    const y = roadY(o.x);
    if (o.kind === 'pothole') {
      ctx.fillStyle = '#8a6a40'; ctx.beginPath(); ctx.ellipse(sx, y + 14, 26, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6e5230'; ctx.beginPath(); ctx.ellipse(sx, y + 16, 18, 5, 0, 0, TAU); ctx.fill();
    } else if (o.kind === 'puddle') {
      ctx.fillStyle = 'rgba(110,180,230,0.85)'; ctx.beginPath(); ctx.ellipse(sx, y + 16, 38, 10, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(sx - 10, y + 13, 12, 3, 0, 0, TAU); ctx.fill();
    }
  }
}

function drawSheep(o) {
  const sx = o.x - camX + (o.shooed ? o.face * o.run * 160 : 0);
  if (sx < -offX - 80 || sx > W + offX + 80) return;
  const y = roadY(o.x) + 8 - (o.shooed ? o.dy * 0.6 : 0) - (o.shooed ? Math.abs(Math.sin(o.run * 18)) * 8 : 0);
  ctx.save(); ctx.translate(sx, y);
  if (o.shooed) ctx.globalAlpha = clamp(1 - o.run / 1.2, 0, 1);
  ctx.scale(o.face, 1);
  ctx.fillStyle = '#3a3030';
  for (const lx of [-14, -5, 6, 14]) ctx.fillRect(lx, -10, 4, 12);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  for (let k = 0; k < 7; k++) { ctx.moveTo(-20 + k * 7 + 9, -24); ctx.arc(-20 + k * 7, -24 + (k % 2) * 4, 9, 0, TAU); }
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -22, 22, 13, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a3030';
  ctx.beginPath(); ctx.ellipse(24, -30, 9, 11, 0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(27, -32, 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(27.6, -32, 1.3, 0, TAU); ctx.fill();
  ctx.restore();
  if (!o.shooed && state === 'play') {
    const pulse = 0.5 + 0.5 * Math.sin(t * 8);
    ctx.strokeStyle = `rgba(255,230,120,${0.5 + pulse * 0.5})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, y - 22, 40 + pulse * 4, 0, TAU); ctx.stroke();
    ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.strokeText('Tap!', sx, y - 70);
    ctx.fillStyle = '#7a5200'; ctx.fillText('Tap!', sx, y - 70);
  }
}

function drawCrowd(front) {
  for (const c of route.crowd) {
    const sx = c.x - camX;
    if (sx < -offX - 60 || sx > W + offX + 60) continue;
    const isFront = hash(Math.round(c.x), 7) < 0.3;
    if (isFront !== front) continue;
    const y = roadY(c.x) + (front ? 74 : -22);
    const cheer = shoutT > 0 || state === 'win' || state === 'done';
    const jump = cheer ? Math.abs(Math.sin(t * 8 + c.ph)) * 10 : Math.abs(Math.sin(t * Math.PI * cfg.bpm / 60 + c.ph * 0.2)) * 3;
    drawFigure(c.d, sx, y - jump, c.s * (front ? 1.05 : 0.85), { pose: cheer || c.inst === '' ? 'call' : 'stand', mouth: cheer ? 'grin' : 'smile', lx: (ark.x - c.x) > 0 ? 0.8 : -0.8 });
    if (c.inst && !cheer) drawInstrument(c.inst, sx, y - jump - 30 * c.s, c.s);
  }
}

function drawInstrument(kind, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (kind === 'harp') {
    ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, 10); ctx.quadraticCurveTo(-14, -16, 6, -22); ctx.lineTo(10, 10); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = '#fff3cf'; ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-6 + k * 4, 8); ctx.lineTo(-4 + k * 4, -14 + k * 2); ctx.stroke(); }
  } else if (kind === 'timbrel') {
    const a = Math.sin(t * Math.PI * cfg.bpm / 60) * 0.3;
    ctx.rotate(a);
    ctx.fillStyle = '#e8c87a'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -24, 12, 0, TAU); ctx.fill(); ctx.stroke();
  } else if (kind === 'horn') {
    ctx.strokeStyle = '#d9c8a0'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, -10); ctx.quadraticCurveTo(20, -30, 34, -40); ctx.stroke();
  } else if (kind === 'cymbal') {
    const g = Math.abs(Math.sin(t * Math.PI * cfg.bpm / 60)) * 8;
    ctx.fillStyle = '#f2c230';
    ctx.beginPath(); ctx.ellipse(-8 - g, -24, 4, 11, 0, 0, TAU); ctx.ellipse(8 + g, -24, 4, 11, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// The ark of the covenant on its poles, carried by two priests
function drawProcession() {
  const cx = ark.x - camX;
  const th = ark.th;
  const walk = state === 'play' && stopT <= 0 ? t * 9 : 0;
  const cy = ROAD_Y - 84;
  const poleY = (px) => cy + 25 + Math.tan(th) * (px - cx);
  // priests (back one first)
  for (const [k, d] of [[-1, PRIEST2], [1, PRIEST]]) {
    const px = cx + k * PRIEST_GAP;
    const fy = roadY(ark.x + k * PRIEST_GAP);
    const s = 1.3;
    const strain = (k > 0 ? th : -th) > cfg.tmax * 0.55;
    drawFigure(d, px, fy, s, { pose: 'bowdown', step: walk + (k > 0 ? Math.PI : 0), face: 1, lx: 1, mouth: strain ? 'o' : 'smile', wide: strain });
    // arms up to the pole
    // the pole rests on his shoulder; his hands steady it
    const sy = fy - 34 * s, py = poleY(px);
    ctx.strokeStyle = shade(d.robe, -25); ctx.lineWidth = 9; ctx.lineCap = 'round';
    for (const ox of [-16, 18]) {
      ctx.beginPath(); ctx.moveTo(px + ox * 0.6, sy + 4); ctx.lineTo(px + ox, py + 2); ctx.stroke();
      ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(px + ox, py + 2, 5, 0, TAU); ctx.fill();
    }
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(th);
  // carrying poles
  ctx.fillStyle = '#9a6a2e'; ctx.strokeStyle = '#6e4a1e'; ctx.lineWidth = 1.5;
  roundRect(-POLE, 20, POLE * 2, 11, 5); ctx.fill(); ctx.stroke();
  // the ark: a golden chest with the mercy seat and two cherubim
  const gold = ctx.createLinearGradient(0, -46, 0, 26);
  gold.addColorStop(0, '#ffe58a'); gold.addColorStop(1, '#d19a1a');
  ctx.fillStyle = gold; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 2.5;
  roundRect(-58, -30, 116, 58, 6); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f7d660'; ctx.lineWidth = 3;
  roundRect(-50, -22, 100, 42, 4); ctx.stroke();
  ctx.fillStyle = '#c99018'; ctx.fillRect(-64, -38, 128, 10);
  // rings
  ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 3;
  for (const rx of [-46, 46]) { ctx.beginPath(); ctx.arc(rx, 25, 7, 0, TAU); ctx.stroke(); }
  // cherubim facing each other
  for (const dir of [-1, 1]) {
    ctx.save(); ctx.translate(dir * 36, -38); ctx.scale(-dir, 1);
    ctx.fillStyle = '#ffd95a'; ctx.strokeStyle = '#b8861a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -12, 7, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-2, -28, 6, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -16); ctx.quadraticCurveTo(26, -40, 30, -18); ctx.quadraticCurveTo(18, -16, 4, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // a soft glow: the LORD is with His people
  ctx.restore();
  const glow = ctx.createRadialGradient(cx, cy - 20, 10, cx, cy - 20, 120);
  glow.addColorStop(0, `rgba(255,240,170,${0.25 + (shoutT > 0 ? 0.25 : 0)})`); glow.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy - 20, 120, 0, TAU); ctx.fill();
  // lift hints over the dipping end
  if (state === 'play' && Math.abs(th) > cfg.tmax * 0.4) {
    const side = th > 0 ? 1 : -1;
    const hx = cx + side * (POLE - 10), hy = poleY(hx) - 60 - Math.abs(Math.sin(t * 8)) * 8;
    ctx.fillStyle = Math.abs(th) > cfg.tmax * 0.7 ? '#e74c3c' : '#f39c34';
    ctx.beginPath(); ctx.moveTo(hx, hy - 18); ctx.lineTo(hx + 14, hy); ctx.lineTo(hx + 5, hy); ctx.lineTo(hx + 5, hy + 14); ctx.lineTo(hx - 5, hy + 14); ctx.lineTo(hx - 5, hy); ctx.lineTo(hx - 14, hy); ctx.closePath(); ctx.fill();
  }
}

function drawDavid() {
  const x = ark.x - camX + clamp(W * 0.33, 155, 190);
  const wx = x + camX;
  const y = roadY(wx);
  const dancing = danceT > 0 || state === 'win' || state === 'done' || shoutT > 0;
  const hop = dancing ? Math.abs(Math.sin((0.35 - danceT) / 0.35 * Math.PI)) * 22 + (state !== 'play' ? Math.abs(Math.sin(t * 7)) * 14 : 0) : Math.abs(Math.sin(t * Math.PI * cfg.bpm / 60)) * 4;
  ctx.save();
  ctx.translate(x, y - hop);
  if (dancing && danceMove === 2) ctx.scale(-1, 1);
  if (dancing && danceMove === 3) ctx.rotate(Math.sin(t * 12) * 0.12);
  drawFigure(DAVID, 0, 0, 1.25, { pose: dancing ? (danceMove % 2 ? 'call' : 'dance') : 'stand', step: t * 10, face: -1, lx: -0.8, mouth: dancing ? 'grin' : 'smile' });
  // the linen ephod
  ctx.restore();
}

function drawButtons() {
  if (state !== 'play' && state !== 'pause') return;
  const P = beatLen();
  const ph = (beatT % P) / P;
  for (const b of buttons()) {
    const fx = tapFx.find((f) => f.side === b.side);
    const press = fx ? fx.t / 0.3 : 0;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1 - press * 0.08, 1 - press * 0.08);
    const lowSide = b.side !== 0 && Math.sign(ark.th) === b.side && Math.abs(ark.th) > cfg.tmax * 0.35;
    ctx.fillStyle = b.side === 0 ? 'rgba(255,240,200,0.92)' : lowSide ? 'rgba(255,214,150,0.95)' : 'rgba(255,255,255,0.82)';
    ctx.strokeStyle = b.side === 0 ? '#e0a526' : lowSide ? '#e8762a' : '#c9b58a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    if (b.side === 0) {
      // the beat ring closes in on the timbrel
      const rr = b.r + 4 + (1 - ph) * 40;
      ctx.strokeStyle = `rgba(224,120,30,${0.25 + ph * 0.6})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke();
      const flash = ph < 0.12 || ph > 0.92;
      ctx.fillStyle = flash ? '#ffd23f' : '#e8c87a'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, -6, 22, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c0c8d0';
      for (let k = 0; k < 6; k++) { const a = k * TAU / 6; ctx.beginPath(); ctx.arc(Math.cos(a) * 22, -6 + Math.sin(a) * 22, 3.5, 0, TAU); ctx.fill(); }
      ctx.font = '700 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#7a5200';
      ctx.fillText('DANCE', 0, 34);
    } else {
      ctx.fillStyle = lowSide ? '#c0501a' : '#7a5200';
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(18, -2); ctx.lineTo(7, -2); ctx.lineTo(7, 14); ctx.lineTo(-7, 14); ctx.lineTo(-7, -2); ctx.lineTo(-18, -2); ctx.closePath(); ctx.fill();
      ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.side < 0 ? 'LIFT LEFT' : 'LIFT RIGHT', 0, 34);
    }
    ctx.restore();
  }
  if (judge.t > 0) {
    const b = buttons()[1];
    ctx.save();
    ctx.globalAlpha = clamp(judge.t / 0.3, 0, 1);
    ctx.font = '700 22px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,40,10,0.85)';
    const y = b.y - b.r - 50 - (0.7 - judge.t) * 30;
    ctx.strokeText(judge.text, b.x, y); ctx.fillStyle = judge.col; ctx.fillText(judge.text, b.x, y);
    ctx.restore();
  }
}

// Tilt meter, joy meter and the road to Jerusalem
function drawMeters() {
  if (state === 'title') return;
  const top = TOPH - offY + 16;
  const cx = W / 2;
  ctx.save();
  // tilt meter (a spirit level)
  const mw = Math.min(300, W - 60);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.strokeStyle = '#a8741a'; ctx.lineWidth = 3;
  roundRect(cx - mw / 2, top, mw, 30, 15); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(231,76,60,0.35)';
  roundRect(cx - mw / 2 + 3, top + 3, mw * 0.14, 24, 12); ctx.fill();
  roundRect(cx + mw / 2 - 3 - mw * 0.14, top + 3, mw * 0.14, 24, 12); ctx.fill();
  ctx.fillStyle = 'rgba(80,190,100,0.35)';
  roundRect(cx - mw * 0.12, top + 3, mw * 0.24, 24, 12); ctx.fill();
  const f = clamp(ark.th / cfg.tmax, -1, 1);
  const bx = cx + f * (mw / 2 - 20);
  ctx.fillStyle = Math.abs(f) > 0.7 ? '#e74c3c' : Math.abs(f) > 0.35 ? '#f39c34' : '#4cbf5a';
  ctx.beginPath(); ctx.arc(bx, top + 15, 11, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#5a4210';
  ctx.fillText('KEEP IT LEVEL', cx, top + 46);
  // joy meter
  const jy = top + 58;
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; roundRect(cx - mw / 2, jy, mw, 16, 8); ctx.fill();
  const jg = ctx.createLinearGradient(cx - mw / 2, 0, cx + mw / 2, 0);
  jg.addColorStop(0, '#ffb347'); jg.addColorStop(1, '#ff6fa8');
  ctx.fillStyle = shoutT > 0 && Math.sin(t * 20) > 0 ? '#fff27a' : jg;
  roundRect(cx - mw / 2, jy, mw * clamp(joy / 100, 0, 1), 16, 8); ctx.fill();
  ctx.fillStyle = '#5a4210'; ctx.font = '700 12px Fredoka, sans-serif';
  ctx.fillText(streak > 2 ? `JOY · ${streak} in a row!` : 'JOY', cx, jy + 12);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 4);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const r = k % 2 ? p.size * 0.45 : p.size * 1.3; ctx.lineTo(Math.cos(k * Math.PI / 5) * r, Math.sin(k * Math.PI / 5) * r); }
      ctx.fill(); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// The tent David pitched for the ark, at the end of the road
function drawTent() {
  const wx = route.len + 260;
  const sx = wx - camX;
  if (sx > W + offX + 200) return;
  const y = roadY(wx);
  ctx.save(); ctx.translate(sx, y);
  ctx.fillStyle = '#e8dcc0'; ctx.strokeStyle = '#a8916a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-110, 0); ctx.lineTo(-80, -120); ctx.lineTo(80, -120); ctx.lineTo(110, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b5503f'; ctx.fillRect(-84, -126, 168, 14);
  ctx.fillStyle = '#7a4fa0'; ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-22, -84); ctx.lineTo(22, -84); ctx.lineTo(34, 0); ctx.fill();
  ctx.restore();
}

// ============================================================
//  Updating
// ============================================================
function updatePlay(dt) {
  playT += dt;
  const P = beatLen();
  beatT += dt;
  const bn = Math.floor(beatT / P);
  if (bn > beatN) { beatN = bn; sfx.drum(bn % 4 === 0); }
  updateArk(dt);
  if (state !== 'play') return;
  updateObstacles(dt);
  if (!told.dance && playT > (level === 1 ? 7 : 2)) { told.dance = true; showMessage('Tap DANCE on the drum beat!', 2.4); }
  if (ark.x >= route.len) win();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vy += (p.grav || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = tapFx.length - 1; i >= 0; i--) { tapFx[i].t -= dt; if (tapFx[i].t <= 0) tapFx.splice(i, 1); }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  ctx.save();
  const hg = ctx.createLinearGradient(0, 0, 0, TOPH);
  hg.addColorStop(0, 'rgba(255,255,255,0.75)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, viewW, TOPH);
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Bringing the Ark Home' : `Level ${level} · ${cfg.name}`, 12, 26);
  if (state !== 'title') {
    for (let k = 0; k < 3; k++) {
      const x = 22 + k * 24, y = 45;
      ctx.globalAlpha = k < hearts ? 1 : 0.25;
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 12, y - 2, x - 6, y - 11, x, y - 4); ctx.bezierCurveTo(x + 6, y - 11, x + 12, y - 2, x, y + 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`Score ${totalScore + joyPts}`, viewW - 12, 26);
    // the road to Jerusalem
    const f = clamp(ark.x / route.len, 0, 1);
    const w = 120, x0 = viewW - 12 - w, y = 42;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(90,66,16,0.2)'; roundRect(x0, y, w, 10, 5); ctx.fill();
    ctx.fillStyle = '#e0a526'; roundRect(x0, y, w * f, 10, 5); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.font = '600 12px Fredoka, sans-serif';
    ctx.fillText('Jerusalem', viewW - 12, y + 26);
  }
  // Home / pause / mute buttons
  ctx.shadowBlur = 0;
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  const lines = wrapText(message.text, viewW - 40);
  const y0 = typeof MSG_Y === 'function' ? MSG_Y() : TOPH + 34;
  lines.forEach((l, i) => {
    const y = y0 + i * 28;
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,12,8,0.9)';
    ctx.strokeText(l, viewW / 2, y);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(l, viewW / 2, y);
  });
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);
  if (route) {
    camX = ark.x - arkScreenX();
    drawSky();
    drawCrowd(false);
    drawRoad();
    drawTent();
    drawObstaclesFlat();
    for (const o of route.obstacles) if (o.kind === 'sheep') drawSheep(o);
    drawProcession();
    drawDavid();
    drawCrowd(true);
    drawParticles();
    drawMeters();
    drawButtons();
  }
  if (flashT > 0) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = `rgba(255,250,225,${flashT * 1.5})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  drawMessage();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateParticles(dt);
  if (!route) return;
  danceT = Math.max(0, danceT - dt);
  judge.t -= dt;
  shoutT = Math.max(0, shoutT - dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'win' || state === 'done') {
    winT += dt;
    if (winT < 2.4) ark.x += SPEED * dt * (1 - winT / 2.4);
    ark.th *= Math.pow(0.05, dt);
    if (Math.random() < dt * 10) particles.push({ kind: 'star', x: rand(0, W), y: rand(TOPH, ROAD_Y - 200), vx: 0, vy: -20, life: 1.2, t: 0, color: '#fff6d0', size: 3, grav: 0 });
  } else if (state === 'fail') failT += dt;
  else if (state === 'title') ark.x += SPEED * 0.5 * dt;
  if (state === 'title' && ark.x > route.len - 100) ark.x = 300;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
titleScreen();
requestAnimationFrame(frame);
</script>
</body>
