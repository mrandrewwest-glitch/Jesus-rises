<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fcaf0">
<title>Jesus Rises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Jesus Rises</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>

<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game. KJV is filled in; other versions are added later.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  takenUp:  { ref: 'Acts 1:9',   KJV: '...while they beheld, he was taken up; and a cloud received him out of their sight.', NKJV: null, NIV: null, NLT: null },
  rightHand: { ref: 'Mark 16:19', KJV: 'So then after the Lord had spoken unto them, he was received up into heaven, and sat on the right hand of God.', NKJV: null, NIV: null, NLT: null },
  galilee:  { ref: 'Acts 1:11',  KJV: 'Ye men of Galilee, why stand ye gazing up into heaven?', NKJV: null, NIV: null, NLT: null },
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

// ============================================================
//  Tuning
// ============================================================
const G = 60;             // gravity (px/s^2)
const THRUST = 150;       // upward push
const SIDE = 90;          // sideways push
const WIND_DRAG = 0.5;    // how strongly the wind carries the cloud
const AIR_DRAG = 0.2;     // vertical damping
const LAND_VY = 45;       // max descent speed for a gentle landing
const LAND_VX = 30;       // max sideways speed for a gentle landing
const CRASH_V = 150;      // falling faster than this onto the ground = crash
const BURN_UP = 8;        // glory per second while rising
const BURN_SIDE = 3;      // glory per second while steering
const TAP_IMPULSE = 62;   // speed kick from one tap (touch / mouse)
const TAP_COST = 3;       // glory spent per tap
const TAP_GAP = 0.09;     // fastest tap rate: about 11 taps a second
const MAX_RISE = 240;     // taps can't push Him upward faster than this
const PAD_Y = 240;        // top surface of the seat at the Father's right hand

// Jesus's collision box relative to his feet (top of his cloud)
const J_HALF = 30, J_TOP = 68, J_BOTTOM = 16;

const LEVEL_NAMES = [
  'The Mount of Olives',
  'Clouds over Bethany',
  'Gusty Galilee',
  'Storm over Jerusalem',
  'Whirlwind of Elijah',
  'Winds of Pentecost',
];

function makeConfig(n) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  return {
    name: LEVEL_NAMES[n - 1] || `Ascension ${n}`,
    baseWind: dir * Math.min(14 + n * 10, 70),
    gust: n === 1 ? 6 : Math.min(12 + n * 8, 60),
    shear: n >= 3 ? Math.min(20 + (n - 3) * 10, 60) : 0,
    storms: n >= 2 ? Math.min(n - 1, 4) : 0,
    seatW: Math.max(120 - (n - 1) * 12, 66),
    burn: 1 + (n - 1) * 0.1,
  };
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('jesusRisesBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0;
let throneF = 0.6;        // throne position as a fraction of its allowed range
let jesus;
let storms = [];
let particles = [];
let message = { text: '', t: 0 };
let shockT = 0, bounceT = 0, flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let gust = 0, gustTarget = 0, gustTimer = 0;

function newJesus() {
  const x = W / 2;
  return {
    x, y: groundY(x) - J_BOTTOM, vx: 0, vy: 0,
    grounded: true, launched: false, glory: 100,
    face: 'calm', thrust: { up: false, left: false, right: false },
    restMsgCd: 0, hitCd: 0, tapCd: 0, tapFx: 0, tapDir: { up: false, left: false, right: false },
  };
}

// ============================================================
//  World geometry
// ============================================================
function groundY(x) {
  const d = (x - W / 2) / (W * 0.22);
  return H - 100 - 60 * Math.exp(-d * d);
}

function layout() {
  const seatW = cfg.seatW;
  const minTx = 16 + seatW + 125;
  const maxTx = W - 106;
  const tx = lerp(minTx, Math.max(minTx, maxTx), throneF);
  // The seat is at the Father's right hand. He faces us, so that is our left.
  const sx = tx - 95 - 30 - seatW / 2;
  return {
    tx, throneBase: PAD_Y - 6, sx, seatW,
    seatRect: { x: sx - seatW / 2, y: PAD_Y, w: seatW, h: 22, type: 'seat' },
    throneRect: { x: tx - 95, y: PAD_Y - 140, w: 190, h: 156, type: 'throne' },
  };
}

function windAt(y) {
  let w = cfg.baseWind + cfg.gust * gust;
  if (cfg.shear) w += cfg.shear * Math.sin(y / 130 + t * 0.25);
  return w;
}

function updateGust(dt) {
  gustTimer -= dt;
  if (gustTimer <= 0) {
    gustTarget = rand(-1, 1) * (Math.random() < 0.3 ? 1.6 : 1);
    gustTimer = rand(1, 3.5);
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 1.2);
}

// ============================================================
//  Disciples
// ============================================================
const DISCIPLES = [
  { name: 'Peter',       robe: '#3f6fb5', hair: '#8a8a8a', beard: true,  skin: '#d9a066' },
  { name: 'Andrew',      robe: '#6b8e3a', hair: '#4a2f1a', beard: true,  skin: '#c98d56' },
  { name: 'James',       robe: '#b5503f', hair: '#2e1d10', beard: true,  skin: '#d7a070' },
  { name: 'John',        robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
  { name: 'Philip',      robe: '#7a4fa0', hair: '#3a2716', beard: true,  skin: '#c58a55', scarf: '#e8dcc0' },
  { name: 'Bartholomew', robe: '#3c8f86', hair: '#1f140c', beard: true,  skin: '#b87a48' },
  { name: 'Thomas',      robe: '#a0673a', hair: '#3a2515', beard: true,  skin: '#d39a66' },
  { name: 'Matthew',     robe: '#5a6475', hair: '#2a1a0e', beard: true,  skin: '#c88e5a', scarf: '#c9b27a' },
  { name: 'James the Less', robe: '#c46b8c', hair: '#5c3a1c', beard: false, skin: '#dca678' },
  { name: 'Thaddaeus',   robe: '#4b7f4b', hair: '#2d1b0f', beard: true,  skin: '#bf8150' },
  { name: 'Simon',       robe: '#b08a2e', hair: '#1c120b', beard: true,  skin: '#c78f5c', scarf: '#d8c7a0' },
].map((d, i) => ({
  ...d, i,
  mood: 'watch', switchT: 0,
  delay: d.name === 'Peter' ? 0 : rand(0.05, 0.5),
  blinkT: rand(1, 4), blink: 0,
  phase: rand(0, TAU),
}));

// Back row: 5 disciples behind Jesus. Front row: 6 disciples in front, leaving room for him.
function discipleSlots() {
  const slots = [];
  const back = [1, 4, 6, 8, 9];
  const front = [0, 2, 3, 5, 7, 10];
  back.forEach((idx, k) => {
    const x = lerp(55, W - 55, k / 4);
    slots.push({ d: DISCIPLES[idx], x, y: groundY(x) - 16, s: 0.82, row: 0 });
  });
  front.forEach((idx, k) => {
    const x = k < 3 ? lerp(30, W / 2 - 66, k / 2) : lerp(W / 2 + 66, W - 30, (k - 3) / 2);
    slots.push({ d: DISCIPLES[idx], x, y: groundY(x) + 6, s: 1, row: 1 });
  });
  return slots;
}

function crowdMood() {
  if (state === 'title' || !jesus) return 'watch';
  if (state === 'win') return 'joy';
  if (state === 'fail') return 'dismay';
  if (shockT > 0) return 'shock';
  if (jesus.grounded && !jesus.launched) return 'watch';
  if (bounceT > 0) return 'worried';
  if (jesus.glory <= 0 || jesus.vy > 90) return 'worried';
  if (jesus.vy < -15) return 'wow';
  return 'watch';
}

function updateDisciples(dt) {
  const target = crowdMood();
  for (const d of DISCIPLES) {
    let want = target;
    if (d.name === 'Thomas' && (want === 'watch' || want === 'wow')) want = 'doubt';
    if (want !== d.mood) {
      d.switchT += dt;
      if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; }
    } else d.switchT = 0;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
}

function drawDisciple(slot) {
  const { d, x, s } = slot;
  const mood = d.mood;
  let jump = 0;
  if (mood === 'joy') jump = Math.abs(Math.sin(t * 7 + d.phase)) * 12;
  if (mood === 'shock') jump = Math.max(0, Math.sin(t * 30)) * 1.5;

  ctx.save();
  ctx.translate(x, slot.y - jump * s);
  ctx.scale(s, s);
  if (slot.row === 0) ctx.filter = 'brightness(0.92)';

  const sleeve = shade(d.robe, -25);
  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };

  // Look toward Jesus
  let lx = 0, ly = -1;
  if (jesus) {
    const wx = x, wy = slot.y - 52 * s;
    const dx = jesus.x - wx, dy = (jesus.y - 50) - wy;
    const len = Math.hypot(dx, dy) || 1;
    lx = dx / len; ly = dy / len;
  }

  // Arms raised behind the head for joy / pointing up in wonder
  if (mood === 'joy') {
    const wave = Math.sin(t * 9 + d.phase) * 4;
    arm(-11, -32, -24 + wave, -66);
    arm(11, -32, 24 - wave, -66);
  } else if (mood === 'wow' && d.i % 3 === 0) {
    arm(11, -32, 20 + lx * 6, -70);
  }

  // Robe
  ctx.fillStyle = d.robe;
  ctx.strokeStyle = shade(d.robe, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.quadraticCurveTo(-17, -30, -11, -37);
  ctx.quadraticCurveTo(0, -41, 11, -37);
  ctx.quadraticCurveTo(17, -30, 18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9b07a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-16, -17); ctx.quadraticCurveTo(0, -14, 16, -17); ctx.stroke();

  // Resting arms
  if (mood === 'watch' || mood === 'doubt' || (mood === 'wow' && d.i % 3 !== 0)) {
    if (mood === 'doubt') { arm(-11, -32, 4, -26); arm(11, -32, -4, -24); } // folded arms
    else { arm(-11, -32, -15, -12); arm(11, -32, 15, -12); }
  } else if (mood === 'worried') {
    arm(-11, -32, -2, -28); arm(11, -32, 2, -28);           // hands clasped
  }

  // Head
  const hy = -53;
  ctx.fillStyle = d.skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  // Hair / head cloth
  if (d.scarf) {
    ctx.fillStyle = d.scarf;
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(d.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // Beard
  if (d.beard) {
    ctx.fillStyle = d.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + 21, 0, hy + 22);
    ctx.quadraticCurveTo(14, hy + 21, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }

  drawFace(d, mood, hy, lx, ly);

  // Hands over the face come last
  if (mood === 'shock') {
    arm(-11, -32, -15, hy + 4);
    arm(11, -32, 15, hy + 4);
  } else if (mood === 'dismay' && d.i % 2 === 0) {
    arm(11, -32, 2, hy - 3);   // facepalm
    ctx.fillStyle = d.skin;
    roundRect(-9, hy - 8, 20, 9, 4); ctx.fill();
  } else if (mood === 'dismay') {
    arm(-11, -32, -15, -12); arm(11, -32, 15, -12);
  }

  ctx.restore();
}

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink) {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
      ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  Scenery: clouds, streaks, storms
// ============================================================
function drawCloud(cx, cy, w, h, top = '#ffffff', under = '#d8e6f4', puffCount = 0) {
  const n = puffCount || Math.max(3, Math.round(w / 22));
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bulge = Math.sin(f * Math.PI);
    const r = h * (0.42 + 0.38 * bulge) * (0.92 + 0.08 * Math.sin(i * 2.7));
    puffs.push([cx - w / 2 + h * 0.4 + f * (w - h * 0.8), cy - r * 0.3, r]);
  }
  for (const [fill, dy] of [[under, h * 0.18], [top, 0]]) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    for (const [px, py, r] of puffs) { ctx.moveTo(px + r, py + dy); ctx.arc(px, py + dy, r, 0, TAU); }
    ctx.fill();
  }
}

// A flat-topped cloud you can stand on
function drawPlatform(cx, top, w, glow) {
  ctx.fillStyle = '#e3eef9';
  ctx.beginPath();
  const n = Math.max(3, Math.round(w / 20));
  for (let i = 0; i < n; i++) {
    const px = cx - w / 2 + 10 + (i / (n - 1)) * (w - 20);
    const r = 9 + 3 * Math.sin(i * 1.9);
    ctx.moveTo(px + r, top + 16); ctx.arc(px, top + 16, r, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  roundRect(cx - w / 2, top, w, 18, 9); ctx.fill();
  if (glow) {
    ctx.strokeStyle = glow; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w / 2 + 8, top + 1.5); ctx.lineTo(cx + w / 2 - 8, top + 1.5); ctx.stroke();
  }
}

const bgClouds = Array.from({ length: 7 }, () => ({
  f: Math.random(), y: rand(300, 640), w: rand(70, 150), speed: rand(0.3, 0.7),
}));
const streaks = Array.from({ length: 46 }, () => ({ f: Math.random(), y: rand(-200, H - 120), len: rand(0.5, 1.2) }));

function updateScenery(dt) {
  for (const c of bgClouds) {
    c.f += (windAt(c.y) * c.speed * dt) / (W + 300);
    if (c.f > 1) c.f -= 1;
    if (c.f < 0) c.f += 1;
  }
  for (const s of streaks) {
    s.f += (windAt(s.y) * 2.2 * dt) / (W + 200);
    if (s.f > 1) { s.f -= 1; s.y = rand(-offY, H - 120); }
    if (s.f < 0) { s.f += 1; s.y = rand(-offY, H - 120); }
  }
}

function makeStorms(n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const y = n === 1 ? 460 : lerp(340, 590, i / (n - 1));
    list.push({
      x: rand(60, W - 60), y,
      vx: (Math.random() < 0.5 ? -1 : 1) * rand(18, 38 + level * 3),
      w: 108, h: 46, bolt: 0, boltT: rand(1, 4), phase: rand(0, TAU),
    });
  }
  return list;
}

function drawStorm(s) {
  const bob = Math.sin(t * 1.5 + s.phase) * 3;
  const y = s.y + bob;
  if (s.bolt > 0) {
    ctx.strokeStyle = '#fff59a'; ctx.lineWidth = 3; ctx.shadowColor = '#fff59a'; ctx.shadowBlur = 12;
    ctx.beginPath();
    let bx = s.x + s.boltX, by = y + 14;
    ctx.moveTo(bx, by);
    for (let k = 0; k < 4; k++) { bx += (k % 2 ? -1 : 1) * 9; by += 16; ctx.lineTo(bx, by); }
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  drawCloud(s.x, y, s.w + 20, s.h, '#6b7285', '#474d5c');
  // grumpy face
  ctx.strokeStyle = '#2d3140'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s.x - 16, y - 16); ctx.lineTo(s.x - 5, y - 12);
  ctx.moveTo(s.x + 16, y - 16); ctx.lineTo(s.x + 5, y - 12);
  ctx.stroke();
  ctx.fillStyle = '#2d3140';
  ctx.beginPath(); ctx.arc(s.x - 9, y - 7, 2.3, 0, TAU); ctx.arc(s.x + 9, y - 7, 2.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x, y + 5, 5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
}

function updateStorms(dt) {
  for (const s of storms) {
    s.x += s.vx * dt + windAt(s.y) * 0.25 * dt;
    if (s.x < -80) s.x = W + 80;
    if (s.x > W + 80) s.x = -80;
    s.boltT -= dt;
    if (s.boltT <= 0) { s.bolt = 0.18; s.boltX = rand(-30, 30); s.boltT = rand(2, 5); }
    if (s.bolt > 0) s.bolt -= dt;
  }
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0) {
  if (particles.length > 400) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  Jesus
// ============================================================
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.rotate(clamp(j.vx / 400, -0.2, 0.2));

  const up = j.thrust.up || j.face === 'joy';

  if (j.thrust.up || state === 'win') {
    const g = ctx.createRadialGradient(0, -35, 5, 0, -35, 75);
    g.addColorStop(0, 'rgba(255,235,150,0.55)');
    g.addColorStop(1, 'rgba(255,235,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -35, 75, 0, TAU); ctx.fill();
  }

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();

  // Arms: raised when rising, open and welcoming otherwise
  const hands = up ? [[-21, -66], [21, -66]] : [[-20, -22], [20, -22]];
  if (!up && j.thrust.left) hands[1] = [23, -34];
  if (!up && j.thrust.right) hands[0] = [-23, -34];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy + (up ? 4 : 0)); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (j.face === 'oops') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -53, 2.8, 0, TAU); ctx.arc(4, -53, 2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.3, 0, TAU); ctx.arc(4, -53, 1.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
    if (j.face === 'effort') {
      ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6.5, -57.5); ctx.lineTo(-2, -56.5); ctx.moveTo(6.5, -57.5); ctx.lineTo(2, -56.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  if (j.face === 'oops') {
    ctx.fillStyle = '#7a2e22';
    ctx.beginPath(); ctx.ellipse(0, -46, 1.8, 2, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  // His cloud
  drawCloud(0, 4, 74, 19, '#ffffff', '#d8e6f4', 6);

  ctx.restore();
}

function getInput() {
  const inp = {
    up: keys.has('ArrowUp') || keys.has('KeyW') || keys.has('Space'),
    left: keys.has('ArrowLeft') || keys.has('KeyA'),
    right: keys.has('ArrowRight') || keys.has('KeyD'),
  };
  return inp;
}

function updateJesus(dt) {
  const j = jesus;
  const L = layout();
  const inp = getInput();
  const has = j.glory > 0;
  j.thrust.up = inp.up && has;
  j.thrust.left = inp.left && has && !inp.right;
  j.thrust.right = inp.right && has && !inp.left;

  let ax = 0, ay = G;
  if (j.thrust.up) { ay -= THRUST; j.glory -= BURN_UP * cfg.burn * dt; }
  if (j.thrust.left) { ax -= SIDE; j.glory -= BURN_SIDE * cfg.burn * dt; }
  if (j.thrust.right) { ax += SIDE; j.glory -= BURN_SIDE * cfg.burn * dt; }
  j.glory = Math.max(0, j.glory);
  applyTaps(j);

  // Wind carries the cloud, but barely touches it on the ground
  const alt = clamp((groundY(j.x) - (j.y + J_BOTTOM)) / 60, 0, 1);
  ax += (windAt(j.y) - j.vx) * WIND_DRAG * alt;
  ay -= j.vy * AIR_DRAG;

  j.vx += ax * dt;
  j.vy += ay * dt;
  j.x += j.vx * dt;
  j.y += j.vy * dt;

  // A tap shows raised arms / sparkles briefly, without adding continuous thrust
  j.tapCd = Math.max(0, j.tapCd - dt);
  if (j.tapFx > 0) {
    j.tapFx -= dt;
    j.thrust.up = j.thrust.up || j.tapDir.up;
    j.thrust.left = j.thrust.left || j.tapDir.left;
    j.thrust.right = j.thrust.right || j.tapDir.right;
  }

  // Thrust sparkles
  if (j.thrust.up && Math.random() < dt * 40) {
    spawn(j.x + rand(-22, 22), j.y + 16, rand(-15, 15), rand(40, 90), 0.7, Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4));
  }
  if (j.thrust.left && Math.random() < dt * 25) spawn(j.x + 34, j.y + 4, rand(40, 80), rand(-10, 10), 0.5, '#ffffff', rand(3, 5));
  if (j.thrust.right && Math.random() < dt * 25) spawn(j.x - 34, j.y + 4, rand(-80, -40), rand(-10, 10), 0.5, '#ffffff', rand(3, 5));

  // Walls and the top of the sky
  if (j.x < J_HALF + 2) { j.x = J_HALF + 2; j.vx = Math.abs(j.vx) * 0.4; }
  if (j.x > W - J_HALF - 2) { j.x = W - J_HALF - 2; j.vx = -Math.abs(j.vx) * 0.4; }
  if (j.y - J_TOP < 6 - offY) { j.y = 6 - offY + J_TOP; j.vy = Math.abs(j.vy) * 0.3; }

  j.hitCd = Math.max(0, j.hitCd - dt);
  j.restMsgCd = Math.max(0, j.restMsgCd - dt);

  // Heavenly solids
  collide(j, L.throneRect, L);
  if (state !== 'play') return;
  collide(j, L.seatRect, L);
  if (state !== 'play') return;

  // Storm clouds
  for (const s of storms) {
    if (j.hitCd > 0) break;
    if (Math.abs(j.x - s.x) < s.w / 2 + J_HALF - 12 &&
        j.y + J_BOTTOM > s.y - s.h / 2 + 6 && j.y - J_TOP + 10 < s.y + s.h / 2) {
      j.vy = Math.max(j.vy, 0) + 120;
      j.vx += (j.x < s.x ? -1 : 1) * 60;
      j.glory = Math.max(0, j.glory - 6);
      j.hitCd = 1;
      s.bolt = 0.3; s.boltX = j.x - s.x;
      flashT = 0.25; shakeT = 0.35; shockT = 1.2; bounceT = 0.8;
      showMessage('Zap! Storm cloud!');
      sfx.thunder();
    }
  }

  // The ground
  const gy = groundY(j.x);
  if (j.y + J_BOTTOM >= gy) {
    if (j.launched && j.vy > CRASH_V) { fail('crash'); return; }
    j.y = gy - J_BOTTOM;
    if (j.vy > 0) j.vy = 0;
    j.vx *= Math.pow(0.02, dt);
    j.grounded = true;
    if (j.launched && j.glory <= 0) { fail('empty'); return; }
  } else {
    j.grounded = false;
    if (j.y + J_BOTTOM < gy - 30) j.launched = true;
  }

  // Face
  if (bounceT > 0) j.face = 'oops';
  else if (j.thrust.up && j.vy > -20) j.face = 'effort';
  else j.face = 'calm';
}

// Touch / mouse: each tap gives one kick toward where you tapped.
// Holding does nothing, so hovering and landing take rhythm.
function applyTaps(j) {
  while (tapQueue.length) {
    const tp = tapQueue.shift();
    if (j.glory <= 0 || j.tapCd > 0) continue;
    const dx = tp.x - j.x, dy = tp.y - (j.y - 30);
    const len = Math.hypot(dx, dy) || 1;
    let ix = dx / len, iy = Math.min(0, dy / len);   // never pushes Him down
    if (iy === 0 && Math.abs(ix) < 0.3) iy = -1;      // tap right below Him = straight up
    const n = Math.hypot(ix, iy);
    ix /= n; iy /= n;
    j.vx += ix * TAP_IMPULSE * 0.7;
    j.vy = Math.max(j.vy + iy * TAP_IMPULSE, -MAX_RISE);
    j.glory = Math.max(0, j.glory - TAP_COST * cfg.burn);
    j.tapCd = TAP_GAP;
    j.tapFx = 0.18;
    j.tapDir = { up: iy < -0.3, left: ix < -0.3, right: ix > 0.3 };
    for (let i = 0; i < 8; i++) {
      spawn(j.x + rand(-20, 20), j.y + 14, -ix * 60 + rand(-20, 20), -iy * 70 + rand(0, 30), 0.6,
        Math.random() < 0.5 ? '#ffe27a' : '#fff6d0', rand(2, 4));
    }
    sfx.tap(1 - (j.y - PAD_Y) / (groundY(j.x) - PAD_Y));
  }
}

function collide(j, s, L) {
  const l = j.x - J_HALF, r = j.x + J_HALF, top = j.y - J_TOP, bot = j.y + J_BOTTOM;
  if (r <= s.x || l >= s.x + s.w || bot <= s.y || top >= s.y + s.h) return;
  const pTop = bot - s.y, pBot = s.y + s.h - top, pL = r - s.x, pR = s.x + s.w - l;
  const m = Math.min(pTop, pBot, pL, pR);

  if (m === pTop) {
    j.y -= pTop;
    if (s.type === 'seat') { tryLand(j, L); return; }
    if (j.vy > 60) {
      j.vy = -j.vy * 0.4; bounceT = 0.5; sfx.bounce();
    } else j.vy = Math.min(j.vy, 0);
    j.vx *= Math.pow(0.1, 1 / 60);
    if (j.restMsgCd <= 0) { showMessage("That's the Father's throne!"); j.restMsgCd = 3; }
  } else if (m === pBot) {
    j.y += pBot; j.vy = Math.abs(j.vy) * 0.3 + 15;
    if (j.restMsgCd <= 0) { showMessage('Bonk! Go around...'); j.restMsgCd = 2; sfx.bounce(); }
    bounceT = 0.4;
  } else if (m === pL) {
    j.x -= pL; j.vx = -Math.abs(j.vx) * 0.5 - 10;
  } else {
    j.x += pR; j.vx = Math.abs(j.vx) * 0.5 + 10;
  }
}

function tryLand(j, L) {
  const off = Math.abs(j.x - L.sx);
  const centred = off <= L.seatW / 2 - 4;
  const gentle = j.vy <= LAND_VY && Math.abs(j.vx) <= LAND_VX;
  if (centred && gentle) { win(j, L); return; }
  if (j.vy > LAND_VY) {
    // Too hard: bounce off with a penalty
    j.vy = -Math.max(j.vy * 0.45, 30);
    j.glory = Math.max(0, j.glory - 4);
    bounceT = 0.8; shakeT = 0.2;
    showMessage('Too fast! Gently now...');
    sfx.bounce();
    return;
  }
  // Soft, but not quite right: rest on the edge and slide
  j.vy = Math.min(j.vy, 0);
  j.vx *= Math.pow(0.2, 1 / 60);
  j.grounded = true;
  if (j.restMsgCd <= 0) {
    showMessage(centred ? 'Steady... slow down' : 'Shuffle over to the seat!');
    j.restMsgCd = 2.5;
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win(j, L) {
  state = 'win';
  const soft = Math.round(clamp(LAND_VY - Math.max(0, j.vy), 0, LAND_VY) * 10);
  j.vx = 0; j.vy = 0; j.face = 'joy';
  j.thrust = { up: false, left: false, right: false };
  const centreBonus = Math.round((1 - Math.abs(j.x - L.sx) / (L.seatW / 2)) * 300);
  const glory = Math.round(j.glory * 10);
  const levelBonus = level * 500;
  const score = soft + centreBonus + glory + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('jesusRisesBest', best); } catch (e) {} }
  lastScore = { soft, centreBonus, glory, levelBonus, score };
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(40, 180);
    spawn(j.x, j.y - 30, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.8, 1.8),
      ['#ffe27a', '#fff6d0', '#ffffff', '#ffd1e8'][i % 4], rand(2, 4.5), 30);
  }
  showMessage('Seated at the right hand!');
  sfx.win();
  endTimer = 1.8;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  const j = jesus;
  j.face = 'oops';
  j.thrust = { up: false, left: false, right: false };
  if (reason === 'crash') {
    j.y = groundY(j.x) - J_BOTTOM;
    for (let i = 0; i < 40; i++) {
      const a = rand(Math.PI, TAU), sp = rand(30, 140);
      spawn(j.x, j.y + 6, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.6, 1.3), '#ffffff', rand(4, 8), 60);
    }
    shakeT = 0.5;
  }
  j.vx = 0; j.vy = 0;
  sfx.fail();
  endTimer = 1.4;
}

// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, thrustGain: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      this.thrustGain = this.ctx.createGain();
      this.thrustGain.gain.value = 0;
      src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
      src.start();
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  thrust(level) {
    if (!this.thrustGain) return;
    this.thrustGain.gain.setTargetAtTime(level * 0.22, this.ctx.currentTime, 0.06);
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.15);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + 0.2);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  thunder() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + 1.3);
  },
};

// ============================================================
//  Rendering
// ============================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, '#fff3cf');
  g.addColorStop(0.28, '#ffe9b0');
  g.addColorStop(0.5, '#b9e0f7');
  g.addColorStop(1, '#7fc0ec');
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
}

function drawHeaven(L) {
  const { tx, throneBase: base, sx, seatW } = L;

  // Rays of glory
  ctx.save();
  ctx.translate(tx, base - 80);
  ctx.rotate(t * 0.04);
  ctx.fillStyle = 'rgba(255,244,190,0.22)';
  for (let i = 0; i < 16; i++) {
    ctx.rotate(TAU / 16);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -900); ctx.lineTo(40, -900); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Rainbow round about the throne (Rev 4:3)
  const bows = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
  ctx.globalAlpha = 0.35; ctx.lineWidth = 7;
  bows.forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(tx, base, 150 - i * 7, Math.PI, TAU); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // Glow
  const glow = ctx.createRadialGradient(tx, base - 85, 10, tx, base - 85, 150);
  glow.addColorStop(0, 'rgba(255,255,240,0.95)');
  glow.addColorStop(0.4, 'rgba(255,240,180,0.5)');
  glow.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(tx, base - 85, 150, 0, TAU); ctx.fill();

  // Throne
  const gold = ctx.createLinearGradient(tx - 50, 0, tx + 50, 0);
  gold.addColorStop(0, '#c98e1b'); gold.addColorStop(0.5, '#ffd766'); gold.addColorStop(1, '#c98e1b');
  ctx.fillStyle = gold; ctx.strokeStyle = '#9a6a12'; ctx.lineWidth = 2;
  roundRect(tx - 40, base - 135, 80, 115, [32, 32, 4, 4]); ctx.fill(); ctx.stroke();
  roundRect(tx - 58, base - 62, 16, 42, 5); ctx.fill(); ctx.stroke();
  roundRect(tx + 42, base - 62, 16, 42, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(tx, base - 121, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4dabf7'; ctx.beginPath(); ctx.arc(tx - 22, base - 108, 3.5, 0, TAU); ctx.arc(tx + 22, base - 108, 3.5, 0, TAU); ctx.fill();

  // The Father, shown as a seated figure of pure light
  ctx.save();
  ctx.shadowColor = '#fff1a8'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#fffef6';
  ctx.beginPath();
  ctx.moveTo(tx - 18, base - 88);
  ctx.quadraticCurveTo(tx, base - 94, tx + 18, base - 88);
  ctx.lineTo(tx + 36, base - 22);
  ctx.lineTo(tx - 36, base - 22);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(tx, base - 104, 14, 0, TAU); ctx.fill();
  ctx.restore();
  // His right hand extended toward the seat (our left)
  ctx.strokeStyle = '#fffef6'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tx - 14, base - 80); ctx.quadraticCurveTo(tx - 36, base - 66, tx - 60, base - 72); ctx.stroke();
  ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(tx - 62, base - 72, 5, 0, TAU); ctx.fill();

  drawPlatform(tx, base - 20, 190, 'rgba(255,215,100,0.7)');

  // The seat at His right hand
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  const sg = ctx.createRadialGradient(sx, PAD_Y - 25, 5, sx, PAD_Y - 25, 70);
  sg.addColorStop(0, `rgba(255,230,120,${0.35 + pulse * 0.3})`);
  sg.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, PAD_Y - 25, 70, 0, TAU); ctx.fill();

  ctx.fillStyle = gold; ctx.strokeStyle = '#9a6a12'; ctx.lineWidth = 2;
  roundRect(sx - 20, PAD_Y - 66, 40, 60, [16, 16, 3, 3]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b52a3a';
  roundRect(sx - 13, PAD_Y - 56, 26, 40, [10, 10, 3, 3]); ctx.fill();
  drawPlatform(sx, PAD_Y, seatW, `rgba(245,190,40,${0.6 + pulse * 0.4})`);

  if (state === 'play' || state === 'title') {
    ctx.font = '600 14px Fredoka, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a5a00';
    ctx.fillText('Right hand of the Father', sx, PAD_Y - 84 - pulse * 3);
    ctx.beginPath();
    ctx.moveTo(sx - 6, PAD_Y - 78 - pulse * 3); ctx.lineTo(sx + 6, PAD_Y - 78 - pulse * 3); ctx.lineTo(sx, PAD_Y - 71 - pulse * 3);
    ctx.fill();
  }
}

function drawGround() {
  const x0 = -offX - 10, x1 = W + offX + 10;
  const gyAt = (x) => (x < 0 || x > W ? H - 100 : groundY(x));

  // Distant hills
  ctx.fillStyle = '#a7cf8a';
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 20) ctx.lineTo(x, H - 150 + Math.sin(x / 90) * 18 + Math.sin(x / 37) * 6);
  ctx.lineTo(x1, H); ctx.fill();

  // Olive trees swaying in the wind
  const sway = clamp(windAt(H - 180) / 70, -1.2, 1.2) * 6;
  for (const f of [0.07, 0.93, 0.3, 0.7]) {
    const x = W * f, y = gyAt(x) - 4;
    const s = f === 0.3 || f === 0.7 ? 0.7 : 1;
    const wob = sway + Math.sin(t * 2.3 + f * 10) * (1.5 + Math.abs(gust) * 2);
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 6 * s, y - 30 * s, x + wob * 0.5, y - 55 * s); ctx.stroke();
    ctx.fillStyle = '#7d9460';
    ctx.beginPath();
    for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) {
      ctx.moveTo(x + (dx + wob) * s + r * s, y + dy * s); ctx.arc(x + (dx + wob) * s, y + dy * s, r * s, 0, TAU);
    }
    ctx.fill();
  }

  // Mount of Olives
  ctx.fillStyle = '#86b95d';
  ctx.beginPath(); ctx.moveTo(x0, H + 10);
  for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, gyAt(x));
  ctx.lineTo(x1, H + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6a9c45'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 8) (x === x0 ? ctx.moveTo : ctx.lineTo).call(ctx, x, gyAt(x) + 2);
  ctx.stroke();
  ctx.fillStyle = '#6f9e4a';
  ctx.fillRect(x0, H - 40, x1 - x0, 60);
}

function drawStreaks() {
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const s of streaks) {
    const w = windAt(s.y);
    const len = clamp(Math.abs(w) * 0.6, 6, 50) * s.len;
    const x = -offX - 100 + s.f * (viewW + 200);
    const wav = Math.sin(t * 3 + s.y) * 2;
    ctx.moveTo(x, s.y + wav);
    ctx.lineTo(x - Math.sign(w || 1) * len, s.y + wav);
  }
  ctx.stroke();
}

function drawHUD() {
  const j = jesus;
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;

  // Left: level + glory
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a4210';
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'Jesus Rises' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('GLORY', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(58, 38, 130, 13, 6.5); ctx.fill();
  const gl = j ? j.glory / 100 : 1;
  const gg = ctx.createLinearGradient(58, 0, 188, 0);
  gg.addColorStop(0, '#f7c948'); gg.addColorStop(1, '#fff1a8');
  ctx.fillStyle = gl < 0.2 && Math.sin(t * 10) > 0 ? '#ff6b6b' : gg;
  if (gl > 0) { roundRect(58, 38, 130 * gl, 13, 6.5); ctx.fill(); }

  // Pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: wind + speed
  const rx = viewW - 12;
  const w = j ? windAt(j.y) : windAt(500);
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#5a4210';
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('WIND', rx, 20);
  ctx.font = '700 16px Fredoka, sans-serif';
  ctx.fillText(`${Math.abs(Math.round(w))}`, rx, 40);
  ctx.shadowBlur = 0;
  // arrow
  const ax = rx - 64, ay = 33;
  const alen = clamp(Math.abs(w) / 90, 0.1, 1) * 26;
  const dir = Math.sign(w) || 1;
  ctx.strokeStyle = Math.abs(w) > 60 ? '#d9480f' : '#2c7fb8';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax - dir * alen, ay); ctx.lineTo(ax + dir * alen, ay); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ax + dir * (alen + 7), ay); ctx.lineTo(ax + dir * (alen - 3), ay - 7); ctx.lineTo(ax + dir * (alen - 3), ay + 7); ctx.fill();

  if (j && state !== 'title') {
    ctx.shadowBlur = 4;
    ctx.font = '700 15px Fredoka, sans-serif';
    const vy = Math.round(-j.vy), vx = Math.round(j.vx);
    ctx.fillStyle = j.vy <= LAND_VY ? '#2b8a3e' : '#c92a2a';
    ctx.fillText(`${vy >= 0 ? '↑' : '↓'} ${Math.abs(vy)}`, rx, 64);
    ctx.fillStyle = Math.abs(j.vx) <= LAND_VX ? '#2b8a3e' : '#c92a2a';
    ctx.fillText(`↔ ${Math.abs(vx)}`, rx - 58, 64);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(message.text, W / 2, H * 0.44);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, H * 0.44);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  const L = layout();
  drawSky();
  drawHeaven(L);
  for (const c of bgClouds) drawCloud(-offX - 150 + c.f * (viewW + 300), c.y, c.w, c.w * 0.3, 'rgba(255,255,255,0.8)', 'rgba(220,235,250,0.7)');
  drawGround();
  for (const s of storms) drawStorm(s);

  const slots = discipleSlots();
  for (const s of slots) if (s.row === 0) drawDisciple(s);
  if (jesus) drawJesus(jesus);
  drawParticles();
  for (const s of slots) if (s.row === 1) drawDisciple(s);
  drawStreaks();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  drawMessage();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function update(dt) {
  t += dt;
  updateGust(dt);
  updateScenery(dt);
  updateParticles(dt);
  updateDisciples(dt);
  if (state === 'play') {
    updateStorms(dt);
    updateJesus(dt);
  } else if (state === 'win' || state === 'fail') {
    updateStorms(dt);
    if (state === 'win' && Math.random() < dt * 12) {
      spawn(jesus.x + rand(-40, 40), jesus.y - rand(0, 70), 0, -20, 1, '#fff6d0', 3);
    }
  } else if (state === 'title') {
    if (jesus) jesus.x = W / 2, jesus.y = groundY(W / 2) - J_BOTTOM;
  }
  shockT = Math.max(0, shockT - dt);
  bounceT = Math.max(0, bounceT - dt);
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
  const th = state === 'play' && jesus ? (jesus.thrust.up ? 1 : 0) + (jesus.thrust.left || jesus.thrust.right ? 0.4 : 0) : 0;
  sfx.thrust(th);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
