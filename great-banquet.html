// ============================================================
//  Sound (tiny WebAudio synth)
// ============================================================
//  Heavenly music: a synthesised "Hal-le-lu-jah" choir
//  (motif after Handel's Messiah, 1741, public domain)
// ============================================================
const VOWELS = {             // formant frequencies for each sung vowel
  a: [800, 1150, 2900],      // "Hal", "jah"
  e: [500, 1750, 2600],      // "le"
  u: [350, 700, 2500],       // "lu"
  o: [450, 800, 2830],       // "oh"
};
const NOTE_OFFSETS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const semis = NOTE_OFFSETS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}

// Scores: [vowel, beats, soprano, alto, tenor, bass]; a null vowel is a rest
const SCORE_WIN = [
  ['a', 1, 'A4', 'F#4', 'D4', 'D3'], ['e', 0.75, 'A4', 'F#4', 'D4', 'D3'],
  ['u', 0.25, 'B4', 'G4', 'D4', 'D3'], ['a', 1, 'A4', 'F#4', 'D4', 'D3'], [null, 0.5],
  ['a', 1, 'E5', 'C#5', 'E4', 'A2'], ['e', 0.75, 'E5', 'C#5', 'E4', 'A2'],
  ['u', 0.25, 'F#5', 'D5', 'F#4', 'A2'], ['a', 1, 'E5', 'C#5', 'E4', 'A2'], [null, 0.5],
  ['a', 1.25, 'D5', 'B4', 'G4', 'G2'], ['e', 0.5, 'D5', 'B4', 'G4', 'G2'],
  ['u', 0.75, 'C#5', 'A4', 'E4', 'A2'], ['a', 3, 'D5', 'A4', 'F#4', 'D3'],
];
const SCORE_START = [['a', 3, 'D5', 'A4', 'F#4', 'D3']];
const SCORE_FAIL = [['o', 1.2, 'F#4', 'D4', 'A3', 'D3'], ['o', 2.4, 'D4', 'B3', 'F#3', 'B2']];
const TAP_SCALE = ['D4', 'E4', 'F#4', 'A4', 'B4', 'D5', 'E5', 'F#5', 'A5'];

// One choir part sung legato: a few detuned voices through vowel formant filters
function singPart(ac, out, t0, beat, score, part, vol, opts = {}) {
  const total = score.reduce((s, n) => s + n[1], 0) * beat;
  const end = t0 + total;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t0);
  env.connect(out);
  const formants = [0, 1, 2].map((k) => {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = [6, 9, 12][k];
    const g = ac.createGain(); g.gain.value = [1, 0.55, 0.25][k] * 3;
    bp.connect(g); g.connect(env);
    return bp;
  });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 4.8 + Math.random() * 1.2; depth.gain.value = 14;
    lfo.connect(depth); depth.connect(o.detune);
    o.detune.value = (v - 1) * 9;
    formants.forEach((f) => o.connect(f));
    o.start(t0); o.stop(end + 0.6); lfo.start(t0); lfo.stop(end + 0.6);
    voices.push(o);
  }
  let t = t0, first = true;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (!vowel) {
      env.gain.setTargetAtTime(0.0001, t, 0.04);
      first = true; t += d; continue;
    }
    const f = noteFreq(notes[part]);
    voices.forEach((o) => (first ? o.frequency.setValueAtTime(f, t) : o.frequency.setTargetAtTime(f, t, 0.02)));
    VOWELS[vowel].forEach((ff, k) => (first ? formants[k].frequency.setValueAtTime(ff, t) : formants[k].frequency.setTargetAtTime(ff, t, 0.03)));
    // consonant: a quick dip in volume at the start of each syllable
    env.gain.setTargetAtTime(vol * 0.35, t, 0.012);
    env.gain.setTargetAtTime(vol, t + 0.035, first ? 0.05 : 0.025);
    first = false;
    t += d;
  }
  if (opts.swell) env.gain.setTargetAtTime(vol * 1.5, end - score[score.length - 1][1] * beat * 0.8, 0.4);
  if (opts.droop) voices.forEach((o) => o.frequency.setTargetAtTime(noteFreq(score[score.length - 1][2 + part]) * 0.93, end - 0.8, 0.35));
  env.gain.setTargetAtTime(0.0001, end, 0.18);
}

// Pipe organ: stacked sine pipes (8', 4', 2 2/3', 2')
function organ(ac, out, t0, beat, score, vol) {
  let t = t0;
  for (const [vowel, beats, ...notes] of score) {
    const d = beats * beat;
    if (vowel) {
      for (const n of notes) {
        const f = noteFreq(n);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + d - 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + d + 0.08);
        g.connect(out);
        [[1, 1], [2, 0.5], [3, 0.25], [4, 0.2]].forEach(([h, a]) => {
          const o = ac.createOscillator(), og = ac.createGain();
          o.frequency.value = f * h; og.gain.value = a;
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + d + 0.1);
        });
      }
    }
    t += d;
  }
}

// Plays one piece ('win' | 'start' | 'fail'): the choir with a pipe organ beneath
function playHeaven(ac, out, t0, piece) {
  const score = { win: SCORE_WIN, start: SCORE_START, fail: SCORE_FAIL }[piece];
  const beat = piece === 'win' ? 0.42 : piece === 'start' ? 0.45 : 0.5;
  const opts = { swell: piece === 'win', droop: piece === 'fail' };
  const vols = [0.2, 0.14, 0.13, 0.16];
  for (let part = 0; part < 4; part++) singPart(ac, out, t0, beat, score, part, vols[part], opts);
  organ(ac, out, t0, beat, score, 0.045);
}

// A single sung note for each tap, pitched higher the higher Jesus is
function playTapNote(ac, out, t0, height) {
  const n = TAP_SCALE[Math.round(clamp(height, 0, 1) * (TAP_SCALE.length - 1))];
  singPart(ac, out, t0, 0.22, [['a', 1, n, n, n, n]], 0, 0.12);
  organ(ac, out, t0, 0.2, [['a', 1, n]], 0.03);
}

const sfx = {
  ctx: null, master: null, noise: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      const comp = this.ctx.createDynamicsCompressor();   // keeps the full choir from clipping
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0, slideTo = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  win() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'win'); },
  levelStart() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'start'); },
  tap(height) {
    if (!this.ctx) return;
    this.puff(0.12);
    playTapNote(this.ctx, this.master, this.ctx.currentTime + 0.01, height);
  },
  puff(vol = 0.35, freq = 1100, dur = 0.16, delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.7;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.04);
  },
  bounce() { this.tone(220, 0.18, 'sine', 0.35, 0, 110); },
  fail() { if (this.ctx) playHeaven(this.ctx, this.master, this.ctx.currentTime + 0.05, 'fail'); },
  // small extra effects for this game
  knock() { for (let k = 0; k < 3; k++) { this.tone(150, 0.07, 'triangle', 0.35, k * 0.14); this.puff(0.25, 400, 0.06, k * 0.14); } },
  ding() { this.tone(880, 0.3, 'sine', 0.22); this.tone(1320, 0.35, 'sine', 0.14, 0.08); },
  clack() { this.tone(320, 0.06, 'triangle', 0.3); this.tone(460, 0.07, 'triangle', 0.25, 0.08); },
  boing() { this.tone(300, 0.25, 'sine', 0.25, 0, 160); },
  chirp() { this.tone(2400, 0.07, 'sine', 0.14, 0, 3200); this.tone(2600, 0.07, 'sine', 0.12, 0.11, 3400); },
  clink() { this.tone(1760, 0.18, 'triangle', 0.16); this.tone(2640, 0.2, 'sine', 0.08, 0.03); },
  heehaw() { this.tone(560, 0.28, 'sawtooth', 0.05, 0, 400); this.tone(400, 0.32, 'sawtooth', 0.05, 0.3, 560); },
};

// ============================================================
//  Rendering: sky, clouds, hills
// ============================================================
function drawSky(top, mid, bottom) {
  const g = ctx.createLinearGradient(0, -offY, 0, H);
  g.addColorStop(0, top); g.addColorStop(0.45, mid); g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(-offX, -offY, viewW, viewH);
}

const bgClouds = Array.from({ length: 7 }, (_, i) => ({ f: i / 7 + rand(0, 0.1), y: rand(150, 400), w: rand(80, 160), speed: rand(4, 10) }));

function drawClouds(par) {
  for (const c of bgClouds) {
    const span = viewW + 400;
    const x = ((c.f * span - (cam.x * par) + t * c.speed) % span + span) % span - 200 - offX;
    drawCloudShape(x, c.y, c.w, c.w * 0.3);
  }
}

function drawCloudShape(cx, cy, w, h) {
  const n = Math.max(3, Math.round(w / 22));
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const r = h * (0.42 + 0.38 * Math.sin(f * Math.PI));
    const px = cx - w / 2 + h * 0.4 + f * (w - h * 0.8);
    ctx.moveTo(px + r, cy - r * 0.3); ctx.arc(px, cy - r * 0.3, r, 0, TAU);
  }
  ctx.fill();
}

function drawHills(par, base, amp, col, period) {
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 16) {
    const wx = x + cam.x * par;
    ctx.lineTo(x, base + Math.sin(wx / period) * amp + Math.sin(wx / (period * 0.37) + 2) * amp * 0.35);
  }
  ctx.lineTo(x1, H); ctx.closePath(); ctx.fill();
}

function drawTree(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-6, -30, 2, -55); ctx.stroke();
  ctx.fillStyle = '#7d9460';
  ctx.beginPath();
  for (const [dx, dy, r] of [[-18, -60, 18], [0, -72, 20], [18, -60, 17], [-6, -52, 15], [10, -50, 14]]) { ctx.moveTo(dx + r, dy); ctx.arc(dx, dy, r, 0, TAU); }
  ctx.fill();
  ctx.restore();
}

function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// ============================================================
//  Food
// ============================================================
function drawDish(k, x, y, s = 1, plate = true) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (plate) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(0, 12, 30, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fbf7ec'; ctx.strokeStyle = '#d8c9a4'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 8, 30, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  if (k === 'bread') {
    ctx.fillStyle = '#d9a35a'; ctx.strokeStyle = '#a8703a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 13, 0, Math.PI, TAU); ctx.lineTo(22, 6); ctx.quadraticCurveTo(0, 10, -22, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f4d9a0'; ctx.lineWidth = 2;
    ctx.beginPath(); for (const dx of [-9, 0, 9]) { ctx.moveTo(dx - 3, -8); ctx.lineTo(dx + 3, -2); } ctx.stroke();
  } else if (k === 'fish') {
    ctx.fillStyle = '#8fb3c9'; ctx.strokeStyle = '#5b7f96'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(-3, 0, 18, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(25, -8); ctx.lineTo(25, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(-13, -2, 1.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6f95ad'; ctx.beginPath(); ctx.arc(-6, 0, 5, -0.9, 0.9); ctx.stroke();
    ctx.fillStyle = '#9bc26a'; ctx.beginPath(); ctx.ellipse(-2, 7, 6, 2.5, 0.3, 0, TAU); ctx.fill();
  } else if (k === 'grapes') {
    ctx.strokeStyle = '#6b8e3a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(3, -20); ctx.stroke();
    ctx.fillStyle = '#7ab04a'; ctx.beginPath(); ctx.ellipse(8, -16, 7, 4, -0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a4fb0';
    for (const [dx, dy] of [[-8, -8], [0, -9], [8, -8], [-4, -2], [4, -2], [-8, 3], [0, 4], [8, 3], [-3, 9], [4, 9]]) { ctx.beginPath(); ctx.arc(dx, dy, 4.6, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    for (const [dx, dy] of [[-9, -10], [-1, -11], [3, -4]]) { ctx.beginPath(); ctx.arc(dx, dy, 1.4, 0, TAU); ctx.fill(); }
  } else if (k === 'cake') {
    ctx.fillStyle = '#e8b665'; ctx.strokeStyle = '#b0803a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 4, 18, 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillRect(-18, -8, 36, 12); ctx.beginPath(); ctx.moveTo(-18, -8); ctx.lineTo(-18, 4); ctx.moveTo(18, -8); ctx.lineTo(18, 4); ctx.stroke();
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.ellipse(0, -8, 18, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f0a91a';
    for (const dx of [-10, 1, 11]) { ctx.beginPath(); ctx.ellipse(dx, -2, 2.5, 4.5, 0, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, -11, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ============================================================
//  The framing scene
// ============================================================
function frameLayout() {
  const narrow = W < 700;
  const s = narrow ? 1.25 : 1.7;
  const gy = H - 150;
  const jx = clamp(W * 0.17, 66, 230);
  const a = jx + (narrow ? 66 : 110), b = W - (narrow ? 34 : 70);
  return { narrow, s, gy, jx, a, b };
}

function drawFrameScene() {
  drawSky('#ffe6b0', '#fbd9a0', '#f2c98a');
  const x0 = -offX - 10, x1 = W + offX + 10;
  // a courtyard at supper time: warm walls, a vine, lamps
  ctx.fillStyle = '#f1dcae'; ctx.fillRect(x0, H - 470, x1 - x0, 330);
  ctx.fillStyle = '#e6c994'; ctx.fillRect(x0, H - 470, x1 - x0, 16);
  for (let x = x0 + ((-x0) % 150) - 150; x < x1; x += 150) {
    ctx.fillStyle = '#c9a26a';
    roundRect(x + 40, H - 420, 60, 90, [30, 30, 0, 0]); ctx.fill();
    ctx.fillStyle = '#f9c96a'; roundRect(x + 46, H - 414, 48, 84, [24, 24, 0, 0]); ctx.fill();
  }
  // vine along the top
  ctx.strokeStyle = '#6b8e3a'; ctx.lineWidth = 4;
  ctx.beginPath(); for (let x = x0; x <= x1; x += 10) ctx.lineTo(x, H - 468 + Math.sin(x / 40) * 8); ctx.stroke();
  ctx.fillStyle = '#7ab04a';
  for (let x = x0; x <= x1; x += 34) { ctx.beginPath(); ctx.ellipse(x, H - 462 + Math.sin(x / 40) * 8, 9, 5, 0.5, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#8a4fb0';
  for (let x = x0 + 20; x <= x1; x += 110) for (const [dx, dy] of [[0, 0], [5, 0], [2.5, 5], [-2.5, 5], [0, 10]]) { ctx.beginPath(); ctx.arc(x + dx, H - 450 + dy + Math.sin(x / 40) * 8, 3.2, 0, TAU); ctx.fill(); }
  // the floor
  ctx.fillStyle = '#e2c48e'; ctx.fillRect(x0, H - 140, x1 - x0, 140);
  ctx.fillStyle = '#d4b27a'; ctx.fillRect(x0, H - 140, x1 - x0, 6);

  const L = frameLayout();
  const jy = L.gy;
  // Listeners around the supper table look toward Jesus
  const back = listeners.slice(0, 2), front = listeners.slice(2);
  back.forEach((d, k) => { d.x = lerp(L.a + 50, L.b - 40, k); d.y = L.gy - 34 * L.s; d.s = L.s * 0.9; d.facing = -1; d.dim = true; });
  front.forEach((d, k) => { d.x = lerp(L.a + 16, L.b - 10, k / 3); d.y = L.gy; d.s = L.s; d.facing = -1; });
  for (const d of listeners) {
    const dx = L.jx - d.x, dy = (jy - 70) - (d.y - 60);
    const len = Math.hypot(dx, dy) || 1;
    d.lx = dx / len; d.ly = dy / len * 0.4;
  }
  back.forEach(drawPerson);
  // the table and its food
  front.forEach(drawPerson);
  // the supper table in front of them covers their knees
  const ty = L.gy - 16 * L.s;
  ctx.fillStyle = '#fdf8ea'; ctx.strokeStyle = '#d8c9a4'; ctx.lineWidth = 2;
  roundRect(L.a - 24, ty, L.b - L.a + 42, L.gy + 8 - ty, 8); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(L.a - 20, L.gy - 4); ctx.lineTo(L.b + 14, L.gy - 4); ctx.stroke();
  const foods = ['bread', 'grapes', 'fish', 'cake', 'grapes'];
  const nf = L.narrow ? 3 : 5;
  for (let k = 0; k < nf; k++) drawDish(foods[k], lerp(L.a + 40, L.b - 30, (k + 0.5) / nf), ty - 2, L.narrow ? 0.7 : 0.95);
  drawJesus({ x: L.jx, y: jy, s: L.s * 1.1, pose: 'teach', face: state === 'title' ? 'calm' : sceneT > 3.6 ? 'joy' : 'calm' });
}

function updateListeners(dt) {
  // the listeners wonder at the story; one Pharisee is not so sure
  for (const d of listeners) {
    let want = 'watch';
    if (scene === 'frame' && state === 'play') want = sceneT > 3.8 ? 'joy' : sceneT > 3 ? 'wow' : 'watch';
    if (d.doubter && want !== 'watch') want = 'doubt';
    if (want !== d.mood) { d.switchT += dt; if (d.switchT > d.delay) { d.mood = want; d.switchT = 0; } }
  }
}

// ============================================================
//  The excuses
// ============================================================
function excuseLayout() {
  const narrow = W < 700;
  return { narrow, gy: H - 170, doorX: narrow ? W * 0.25 : W * 0.3, vx: narrow ? W * 0.7 : W * 0.66, s: narrow ? 1.25 : 1.35, k: narrow ? 1 : 1.3 };
}

function drawHouseFront(x, base, w, h, col, seed, door = true) {
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 2;
  roundRect(x - w / 2, base - h, w, h, [8, 8, 0, 0]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(col, -18); ctx.fillRect(x - w / 2 - 5, base - h - 8, w + 10, 10);
  if (door) {
    ctx.fillStyle = '#7a4e2c'; roundRect(x - 20, base - 70, 40, 70, [20, 20, 0, 0]); ctx.fill();
    ctx.strokeStyle = '#5a361c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, base - 68); ctx.lineTo(x, base); ctx.stroke();
    ctx.fillStyle = '#e0a526'; ctx.beginPath(); ctx.arc(x + 9, base - 34, 2.5, 0, TAU); ctx.fill();
  }
  const wx = seed > 0.5 ? x - w * 0.3 : x + w * 0.3;
  ctx.fillStyle = '#5a3a24'; roundRect(wx - 11, base - h + 30, 22, 28, [11, 11, 0, 0]); ctx.fill();
  if (seed > 0.3) {
    ctx.fillStyle = seed > 0.65 ? '#d9534f' : '#4d8fc0';
    for (let k = 0; k < 4; k++) { ctx.globalAlpha = k % 2 ? 0.55 : 1; ctx.fillRect(wx - 18 + k * 9, base - h + 22, 9, 8); }
    ctx.globalAlpha = 1;
  }
}

function drawOx(x, y, s, f) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  const bob = Math.abs(Math.sin(t * 10 + x * 0.05)) * 3;
  ctx.translate(0, -bob);
  ctx.fillStyle = '#9a6a3a'; ctx.strokeStyle = '#6a4424'; ctx.lineWidth = 2;
  // legs
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const [lx, ph] of [[-22, 0], [-12, Math.PI], [14, Math.PI], [24, 0]]) {
    ctx.beginPath(); ctx.moveTo(lx, -20); ctx.lineTo(lx + Math.sin(t * 10 + ph) * 5, 0 + bob); ctx.stroke();
  }
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, -32, 32, 18, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2e6d0'; ctx.beginPath(); ctx.ellipse(-6, -28, 10, 8, 0, 0, TAU); ctx.fill();
  // head
  ctx.fillStyle = '#9a6a3a';
  ctx.beginPath(); ctx.ellipse(36, -40, 12, 11, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8b8a0'; ctx.beginPath(); ctx.ellipse(44, -35, 6, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(38, -44, 1.8, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#f2e6d0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(32, -50); ctx.quadraticCurveTo(30, -60, 24, -60); ctx.moveTo(40, -50); ctx.quadraticCurveTo(44, -60, 50, -58); ctx.stroke();
  // yoke
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(24, -54); ctx.lineTo(28, -40); ctx.stroke();
  ctx.restore();
}

function drawExcuseScene() {
  drawSky('#fff1cf', '#bfe3f7', '#a6d7f2');
  drawClouds(0.1);
  cam.x = 0;
  drawHills(0.2, H - 330, 18, '#b7d69a', 140);
  const L = excuseLayout();
  const x0 = -offX - 10, x1 = W + offX + 10;
  ctx.fillStyle = '#e6d3a8'; ctx.fillRect(x0, L.gy - 30, x1 - x0, H - L.gy + 30);
  ctx.fillStyle = '#d9c290'; ctx.fillRect(x0, L.gy + 50, x1 - x0, H);
  const e = excuse;
  if (!e) return;
  // on wide screens the whole picture is drawn a little larger around the middle
  ctx.save();
  ctx.translate(W / 2, L.gy); ctx.scale(L.k, L.k); ctx.translate(-W / 2, -L.gy);
  drawExcusePeople(L, e);
  ctx.restore();
}

function drawExcusePeople(L, e) {
  if (e.phase === 'done') {
    // Back at the master's house
    drawMasterHouse(W / 2 - 40, L.gy - 26);
    master.world = false; master.x = W / 2 + 20; master.y = L.gy - 6; master.s = L.s; master.facing = -1;
    master.mood = 'shock'; master.pose = 'open';
    if (e.t > 1.4) master.mood = 'joy';
    servant.world = false; servant.x = W / 2 - 60; servant.y = L.gy + 10; servant.s = L.s; servant.facing = 1; servant.pose = 'shrug';
    drawPerson(master); drawPerson(servant);
    return;
  }
  const cols = ['#f1dfb8', '#ead3a4', '#f4e6c8'];
  drawHouseFront(L.doorX, L.gy - 26, L.narrow ? 150 : 190, 210, cols[e.idx], 0.4 + e.idx * 0.2);
  const p = e.people[e.idx];
  p.world = false; p.s = L.s; p.y = L.gy + 6;
  if (e.idx === 0) {
    // "I have bought a piece of ground": he adores his new field
    const fx = L.vx;
    ctx.fillStyle = '#9a6a3a'; roundRect(fx - 90, L.gy - 18, 180, 34, 10); ctx.fill();
    ctx.strokeStyle = '#7a4e2c'; ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(fx - 80, L.gy - 10 + k * 8); ctx.quadraticCurveTo(fx, L.gy - 14 + k * 8, fx + 80, L.gy - 10 + k * 8); ctx.stroke(); }
    ctx.fillStyle = '#6b8e3a';
    for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.ellipse(fx - 70 + k * 28, L.gy - 20, 4, 7, 0, 0, TAU); ctx.fill(); }
    // a proud sign and a heart
    ctx.fillStyle = '#b57b44'; ctx.fillRect(fx + 62, L.gy - 90, 6, 76);
    ctx.fillStyle = '#f4e6c8'; ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 2; roundRect(fx + 34, L.gy - 104, 62, 30, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8a3a1a'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MINE!', fx + 65, L.gy - 84);
    p.x = fx - 34; p.facing = 1;
    drawPerson(p);
    heart(fx - 34 + Math.sin(t * 2) * 10, L.gy - 118 * L.s / 1.2 - (t * 20) % 30, 7, 0.8);
  } else if (e.idx === 1) {
    // "Five yoke of oxen": they tug him off to try them out
    const go = e.phase === 'reply' ? Math.sin(t * 3) * 14 : 0;
    const os = L.narrow ? 0.5 : 0.62;
    const sp = L.narrow ? 36 : 50;
    const startX = L.vx - (L.narrow ? 40 : 60) + go;
    for (let k = 4; k >= 0; k--) {
      drawOx(startX + 40 + k * sp, L.gy - 6, os, 1);
      drawOx(startX + 50 + k * sp, L.gy + 8, os, 1);
    }
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(startX + 6, L.gy - 34); ctx.lineTo(startX + 40, L.gy - 26); ctx.stroke();
    p.x = startX - 10; p.facing = 1;
    p.lift = e.phase === 'reply' ? Math.abs(Math.sin(t * 6)) * 6 : 0;
    drawPerson(p);
    if (e.phase === 'reply') for (let k = 0; k < 3; k++) { ctx.fillStyle = 'rgba(200,170,120,0.5)'; ctx.beginPath(); ctx.arc(startX - 20 - k * 16, L.gy + 6 - ((t * 30 + k * 10) % 20), 6 + k * 2, 0, TAU); ctx.fill(); }
  } else {
    // "I have married a wife": a flowery arch and floating hearts
    const ax = L.vx;
    ctx.strokeStyle = '#8fc46a'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(ax - 62, L.gy + 6); ctx.lineTo(ax - 62, L.gy - 110); ctx.arc(ax, L.gy - 110, 62, Math.PI, TAU); ctx.lineTo(ax + 62, L.gy + 6); ctx.stroke();
    for (let k = 0; k < 11; k++) {
      const a = Math.PI + k / 10 * Math.PI;
      ctx.fillStyle = k % 2 ? '#ffd166' : '#ff8fab';
      ctx.beginPath(); ctx.arc(ax + Math.cos(a) * 62, L.gy - 110 + Math.sin(a) * 62, 6, 0, TAU); ctx.fill();
    }
    p.x = ax - 22; p.facing = 1;
    const b = e.bride; b.world = false; b.x = ax + 22; b.y = L.gy + 6; b.s = L.s; b.facing = -1;
    drawPerson(b); drawPerson(p);
    for (let k = 0; k < 4; k++) heart(ax + Math.sin(t * 1.5 + k * 2) * 40, L.gy - 150 - ((t * 25 + k * 40) % 120), 6, 0.9 - ((t * 25 + k * 40) % 120) / 150);
  }
  servant.world = false; servant.x = L.doorX - (L.narrow ? 44 : 56); servant.y = L.gy + 10; servant.s = L.s; servant.facing = 1;
  drawPerson(servant);
}

function heart(x, y, r, a) {
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = '#ff6b8a';
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.5);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
  ctx.restore();
}

// ============================================================
//  The town and the fields
// ============================================================
const HOUSE_COLS = ['#f1dfb8', '#ead3a4', '#f4e6c8', '#e8cfa0', '#f0d9b5', '#efd2b0'];

// The master's house, ready for the supper (x = its left edge in screen space)
function drawMasterHouse(sx, base) {
  const w = HOUSE_R - 20, cx = sx + w / 2 + 10;
  ctx.fillStyle = '#f7e4bf'; ctx.strokeStyle = '#c9a26a'; ctx.lineWidth = 2.5;
  roundRect(sx + 10, base - 270, w, 270, [10, 10, 0, 0]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8c98f'; ctx.fillRect(sx + 2, base - 282, w + 16, 14);
  // upper windows glowing
  for (const dx of [0.22, 0.78]) {
    ctx.fillStyle = '#ffd66b'; roundRect(sx + 10 + w * dx - 16, base - 230, 32, 40, [16, 16, 0, 0]); ctx.fill();
    ctx.strokeStyle = '#b58a3a'; ctx.lineWidth = 2; ctx.stroke();
  }
  // the big open door and the warm light of the feast
  const dx = sx + (DOOR_X - 10);
  const glow = ctx.createRadialGradient(dx, base - 50, 5, dx, base - 50, 90);
  glow.addColorStop(0, 'rgba(255,220,120,0.9)'); glow.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(dx, base - 50, 90, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd98a'; roundRect(dx - 30, base - 104, 60, 104, [30, 30, 0, 0]); ctx.fill();
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 4; ctx.stroke();
  // a glimpse of the long table inside
  ctx.fillStyle = '#fdf8ea'; ctx.fillRect(dx - 26, base - 40, 52, 10);
  ctx.fillStyle = '#d9a35a'; ctx.beginPath(); ctx.arc(dx - 12, base - 43, 5, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#8a4fb0'; ctx.beginPath(); ctx.arc(dx + 10, base - 44, 4, 0, TAU); ctx.fill();
  // garland and lanterns
  ctx.strokeStyle = '#6b8e3a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx + 12, base - 262); ctx.quadraticCurveTo(cx, base - 222, sx + w + 8, base - 262); ctx.stroke();
  for (let k = 0; k <= 6; k++) {
    const f = k / 6, gx = lerp(sx + 12, sx + w + 8, f), gy = base - 262 + Math.sin(f * Math.PI) * 20;
    ctx.fillStyle = ['#ff8fab', '#ffd166', '#f783ac', '#69db7c'][k % 4]; ctx.beginPath(); ctx.arc(gx, gy + 2, 5, 0, TAU); ctx.fill();
  }
  for (const lx of [dx - 50, dx + 50]) {
    ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, base - 150); ctx.lineTo(lx, base - 130); ctx.stroke();
    const lg = 0.7 + 0.3 * Math.sin(t * 5 + lx);
    ctx.fillStyle = `rgba(255,200,80,${lg})`; roundRect(lx - 8, base - 130, 16, 22, 6); ctx.fill();
  }
  // a banner of welcome over the door
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.moveTo(dx - 44, base - 124); ctx.lineTo(dx + 44, base - 124); ctx.lineTo(dx + 38, base - 112); ctx.lineTo(dx + 44, base - 100); ctx.lineTo(dx - 44, base - 100); ctx.lineTo(dx - 38, base - 112); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff3d6'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ALL WELCOME', dx, base - 112);
  ctx.textBaseline = 'alphabetic';
}

function drawTownHouse(sx, base, i) {
  const h = 150 + hash(i) * 70, w = 168;
  const col = HOUSE_COLS[Math.floor(hash(i + 3) * HOUSE_COLS.length)];
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 2;
  roundRect(sx, base - h, w, h, [6, 6, 0, 0]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(col, -18); ctx.fillRect(sx - 4, base - h - 8, w + 8, 10);
  // door, windows, awning, plants
  const dx = sx + 30 + hash(i + 7) * (w - 60);
  ctx.fillStyle = '#7a4e2c'; roundRect(dx - 15, base - 56, 30, 56, [15, 15, 0, 0]); ctx.fill();
  const wx = dx < sx + w / 2 ? dx + 55 : dx - 55;
  ctx.fillStyle = '#5a3a24'; roundRect(wx - 10, base - h + 34, 20, 26, [10, 10, 0, 0]); ctx.fill();
  if (hash(i + 11) > 0.4) {
    const ac = ['#d9534f', '#4d8fc0', '#6b8e3a', '#e0a526'][Math.floor(hash(i + 13) * 4)];
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#fff6e0' : ac; ctx.fillRect(wx - 30 + k * 10, base - h + 24, 10, 9); }
  }
  if (hash(i + 17) > 0.5) {
    ctx.fillStyle = '#b5673a'; roundRect(sx + w - 30, base - 20, 18, 20, 3); ctx.fill();
    ctx.fillStyle = '#6b8e3a'; ctx.beginPath(); ctx.arc(sx + w - 21, base - 26, 11, 0, TAU); ctx.fill();
  }
}

function drawAlley(sx, base) {
  ctx.fillStyle = '#c8b284';
  ctx.beginPath(); ctx.moveTo(sx - 30, base - 150); ctx.lineTo(sx + 30, base - 150); ctx.lineTo(sx + 58, base); ctx.lineTo(sx - 58, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b39c6c'; ctx.fillRect(sx - 30, base - 210, 60, 60);
}

function drawCarpenter(sx, base) {
  const col = '#e6c89a', w = 200, h = 170;
  ctx.fillStyle = col; ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 2;
  roundRect(sx - w / 2, base - h, w, h, [6, 6, 0, 0]); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(col, -18); ctx.fillRect(sx - w / 2 - 4, base - h - 8, w + 8, 10);
  for (let k = 0; k < 10; k++) { ctx.fillStyle = k % 2 ? '#f4e6c8' : '#8a5a2e'; ctx.fillRect(sx - w / 2 + k * 20, base - h + 36, 20, 12); }
  // a saw and hammer sign
  ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.moveTo(sx - 36, base - h + 12); ctx.lineTo(sx + 4, base - h + 12); ctx.lineTo(sx + 4, base - h + 26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a5a2e'; ctx.fillRect(sx + 4, base - h + 10, 10, 18);
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(sx + 24, base - h + 16, 4, 16); ctx.fillStyle = '#6a7580'; ctx.fillRect(sx + 18, base - h + 12, 16, 6);
  // the rack of crutches
  const ready = servant && servant.carry < cfg.carry && folk.some((p) => p.needCrutch && p.state === 'wait');
  if (ready) {
    const g = ctx.createRadialGradient(sx, base - 50, 5, sx, base - 50, 70);
    g.addColorStop(0, `rgba(255,230,120,${0.45 + 0.25 * Math.sin(t * 4)})`); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, base - 50, 70, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#8a5a2e'; ctx.fillRect(sx - 40, base - 30, 80, 8);
  for (let k = 0; k < 4; k++) drawCrutch(sx - 30 + k * 20, base - 104, sx - 24 + k * 20, base - 4);
  ctx.fillStyle = '#5a3a14'; ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Carpenter', sx, base - h + 66);
}

function drawCart(c) {
  const p = c.state === 'cross' ? c.p : 0;
  const sx = c.x - cam.x;
  const y = lerp(LANE - 130, H + 90, p);
  const s = lerp(0.55, 1.35, p);
  if (c.state !== 'cross') {
    // waiting in the alley: just the donkey's ears peek out
    if (c.t < 1.2) { ctx.fillStyle = '#8a8a8a'; ctx.beginPath(); ctx.ellipse(sx - 5, LANE - 170, 3, 9, -0.2, 0, TAU); ctx.ellipse(sx + 5, LANE - 170, 3, 9, 0.2, 0, TAU); ctx.fill(); }
    return;
  }
  ctx.save(); ctx.translate(sx, y); ctx.scale(s, s);
  const bob = Math.abs(Math.sin(t * 8)) * 2;
  // the cart behind
  ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 2;
  roundRect(-38, -84, 76, 40, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8b665'; ctx.beginPath(); ctx.ellipse(-14, -86, 14, 8, 0, 0, TAU); ctx.ellipse(12, -88, 16, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d9534f'; ctx.beginPath(); ctx.arc(0, -94, 7, 0, TAU); ctx.fill();
  for (const wx of [-44, 44]) {
    ctx.fillStyle = '#6b4424'; ctx.beginPath(); ctx.ellipse(wx, -46, 7, 22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b57b44'; ctx.beginPath(); ctx.ellipse(wx, -46, 3, 14, 0, 0, TAU); ctx.fill();
  }
  // the donkey, walking toward us
  ctx.translate(0, -bob);
  ctx.fillStyle = '#9a9a9a'; ctx.strokeStyle = '#6a6a6a';
  ctx.beginPath(); ctx.ellipse(0, -36, 18, 22, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = '#7a7a7a';
  ctx.beginPath(); ctx.moveTo(-9, -18); ctx.lineTo(-10, 0 + Math.sin(t * 8) * 3); ctx.moveTo(9, -18); ctx.lineTo(10, 0 - Math.sin(t * 8) * 3); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.fillStyle = '#a8a8a8'; ctx.beginPath(); ctx.ellipse(0, -52, 13, 16, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8, -74, 4, 12, -0.3, 0, TAU); ctx.ellipse(8, -74, 4, 12, 0.3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.ellipse(0, -44, 9, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.arc(-5, -56, 2, 0, TAU); ctx.arc(5, -56, 2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-3, -44, 1.3, 0, TAU); ctx.arc(3, -44, 1.3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHedge(h) {
  const sx = h.x - cam.x, base = LANE - 22;
  if (sx < -120 || sx > W + 120) return;
  const wig = h.rustle > 0 && h.rustle < 0.6 && !h.done ? Math.sin(t * 40) * 2.5 : 0;
  // the hidden guest behind (only the top of the head shows)
  const p = h.person;
  if (p) {
    p.world = true; p.s = CH; p.facing = -1; p.pose = 'stand';
    const peekUp = cfg.peek ? 40 + Math.sin(t * 2 + h.x) * 5 : 0;
    // head top sits just below the top of the hedge, or peeks over it
    p.y = base - 62 + 69 * p.s - peekUp - (p.peek || 0) * 40;
    p.lx = servant.x < p.x ? -0.6 : 0.6;
    ctx.save();
    ctx.beginPath(); ctx.rect(-offX - 10, -offY - 10, viewW + 20, base + offY + 12); ctx.clip();
    drawPerson(p);
    ctx.restore();
  }
  // the animal pops out
  if (h.pop > 0 && h.animal === 'bird') {
    const f = 1 - h.pop;
    const bx = sx + f * 140, by = base - 80 - f * 180;
    ctx.fillStyle = '#8a5a2e'; ctx.beginPath(); ctx.ellipse(bx, by, 9, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c9874a'; const flap = Math.sin(t * 30) * 8;
    ctx.beginPath(); ctx.moveTo(bx - 2, by); ctx.lineTo(bx - 12, by - 8 - flap); ctx.lineTo(bx + 4, by - 2); ctx.fill();
    ctx.fillStyle = '#e0a526'; ctx.beginPath(); ctx.moveTo(bx + 9, by - 1); ctx.lineTo(bx + 14, by); ctx.lineTo(bx + 9, by + 2); ctx.fill();
  }
  if (h.pop > 0 && h.animal === 'rabbit') {
    const f = 1 - h.pop;
    const rx = sx + 40 + f * 160, ry = LANE + 20 - Math.abs(Math.sin(f * 12)) * 30;
    ctx.fillStyle = '#c8b8a0';
    ctx.beginPath(); ctx.ellipse(rx, ry, 12, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(rx + 10, ry - 7, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rx + 9, ry - 18, 2.5, 8, 0.1, 0, TAU); ctx.ellipse(rx + 13, ry - 17, 2.5, 8, 0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(rx - 12, ry - 2, 4, 0, TAU); ctx.fill();
  }
  // the hedge itself
  ctx.fillStyle = '#5f8f3e';
  ctx.beginPath();
  const n = Math.round(h.w / 26);
  for (let k = 0; k <= n; k++) {
    const hx = sx - h.w / 2 + (k / n) * h.w + wig * (k % 2 ? 1 : -1);
    const r = 22 + 8 * Math.sin(k * 2.1 + h.x);
    ctx.moveTo(hx + r, base - 30); ctx.arc(hx, base - 30, r, 0, TAU);
    ctx.moveTo(hx + r * 0.8, base - 58); ctx.arc(hx, base - 58 + Math.sin(k * 1.3) * 6, r * 0.8, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = '#4d7a30'; ctx.fillRect(sx - h.w / 2 - 10, base - 22, h.w + 20, 26);
  ctx.fillStyle = '#6fa34a';
  for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(sx - h.w / 2 + 14 + k * (h.w - 28) / Math.max(1, n - 1), base - 70 + Math.sin(k * 3 + h.x) * 6, 9, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#fff'; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(sx - h.w / 2 + 20 + k * h.w / 4, base - 40 + Math.sin(k * 5 + h.x) * 16, 2.5, 0, TAU); ctx.fill(); }
  if (!h.done && h.rustle > 0 && h.rustle < 0.6) {
    ctx.strokeStyle = 'rgba(80,120,40,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx - 20, base - 96, 6, Math.PI * 1.1, Math.PI * 1.6); ctx.arc(sx + 20, base - 96, 6, Math.PI * 1.4, Math.PI * 1.9); ctx.stroke();
  }
}

function drawWorldScene() {
  const city = scene === 'city';
  const x0 = -offX - 10, x1 = W + offX + 10;
  if (city) {
    drawSky('#ffe9b8', '#c7e6f7', '#a8d8f2');
    drawClouds(0.1);
    // distant towers and the city wall
    drawHills(0.15, H - 420, 14, '#cbe0b0', 160);
    ctx.fillStyle = '#e3cc9c';
    const wy = H - 390;
    ctx.fillRect(x0, wy, x1 - x0, 140);
    for (let x = x0 - ((cam.x * 0.3) % 36); x < x1; x += 36) ctx.fillRect(x, wy - 14, 20, 16);
    for (let x = x0 - ((cam.x * 0.3) % 300) + 60; x < x1; x += 300) { ctx.fillRect(x, wy - 70, 54, 80); for (let k = 0; k < 3; k++) ctx.fillRect(x + k * 20, wy - 84, 14, 16); }
  } else {
    drawSky('#ffeec4', '#c4e5f8', '#a0d6f2');
    drawClouds(0.1);
    drawHills(0.15, H - 400, 24, '#b7d69a', 160);
    drawHills(0.35, H - 330, 18, '#9cc77a', 110);
    // fields in stripes
    ctx.fillStyle = '#c9d98a'; ctx.fillRect(x0, H - 300, x1 - x0, 90);
    ctx.strokeStyle = 'rgba(120,150,60,0.35)'; ctx.lineWidth = 3;
    for (let x = x0 - ((cam.x * 0.5) % 60); x < x1; x += 60) { ctx.beginPath(); ctx.moveTo(x, H - 300); ctx.lineTo(x - 40, H - 210); ctx.stroke(); }
    for (let k = 0; k < 6; k++) { const tx = ((k * 320 - cam.x * 0.5) % (W + 400) + W + 400) % (W + 400) - 200; drawTree(tx, H - 290, 0.8); }
  }

  // Back of the street: houses (or open fields)
  const base = LANE - 45;
  ctx.fillStyle = city ? '#e0c890' : '#a8c878';
  ctx.fillRect(x0, base - 6, x1 - x0, 8);
  if (city) {
    const first = Math.floor((cam.x - HOUSE_R) / 190) - 1, last = first + Math.ceil(W / 190) + 3;
    for (let i = Math.max(0, first); i <= last; i++) {
      const hx = HOUSE_R + 20 + i * 190;
      if (hx > cfg.cityLen + 200) break;
      const cx = hx + 84;
      if (rack && Math.abs(cx - rack.x) < 170) continue;
      if (carts.some((c) => Math.abs(cx - c.x) < 150)) continue;
      drawTownHouse(hx - cam.x, base, i);
    }
    for (const c of carts) drawAlley(c.x - cam.x, base);
    if (rack) drawCarpenter(rack.x - cam.x, base);
  }
  drawMasterHouse(-cam.x, base);

  // The street / the highway
  ctx.fillStyle = city ? '#e9d7ad' : '#e2cf9c';
  ctx.fillRect(x0, base, x1 - x0, H - base);
  ctx.strokeStyle = city ? 'rgba(170,140,90,0.35)' : 'rgba(170,140,90,0.25)'; ctx.lineWidth = 2;
  if (city) {
    for (let row = 0; row < 4; row++) {
      const y = base + 18 + row * 26;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      const off = (row % 2) * 30 - (cam.x % 60);
      ctx.beginPath(); for (let x = x0 + off; x < x1; x += 60) { ctx.moveTo(x, y); ctx.lineTo(x, y + 26); } ctx.stroke();
    }
  } else {
    for (let x = x0 - (cam.x % 90); x < x1; x += 90) { ctx.beginPath(); ctx.moveTo(x, LANE + 24); ctx.lineTo(x + 40, LANE + 24); ctx.stroke(); }
  }
  ctx.fillStyle = city ? '#d9c290' : '#9cc77a';
  ctx.fillRect(x0, LANE + 55, x1 - x0, H);
  ctx.fillStyle = city ? '#cdb47e' : '#86b95d';
  ctx.fillRect(x0, LANE + 55, x1 - x0, 6);
  if (!city) {
    ctx.fillStyle = '#6fa34a';
    for (let x = x0 - (cam.x % 70); x < x1; x += 70) { ctx.beginPath(); ctx.moveTo(x, LANE + 60); ctx.lineTo(x + 5, LANE + 46); ctx.lineTo(x + 10, LANE + 60); ctx.fill(); }
  }

  // The world's end: a signpost
  const endX = worldLen() - cam.x;
  if (endX < W + 60) {
    ctx.fillStyle = '#8a5a2e'; ctx.fillRect(endX - 4, LANE - 120, 8, 120);
    ctx.fillStyle = '#b57b44'; roundRect(endX - 40, LANE - 118, 60, 22, 4); ctx.fill();
  }

  // Hedges, the master at his door, and everyone waiting by the roadside
  for (const h of hedges) drawHedge(h);
  master.world = true; master.s = CH; master.y = LANE - 8;
  if (!interlude || interlude.kind !== 'room' || interlude.step < 1) master.pose = 'open';
  master.x = DOOR_X + 50;
  drawPerson(master);
  for (const p of folk) if (p.state === 'wait' && p.kind !== 'traveller' && !p.hidden) { p.world = true; p.y = SIT_Y; p.pose = 'sit'; if (onScreen(p)) drawPerson(p); }
  for (const c of carts) if (c.state !== 'cross' || lerp(LANE - 130, H + 90, c.p) < LANE) drawCart(c);
  // Walkers: the servant, his line of guests, travellers
  const walkers = [servant, ...group, ...folk.filter((p) => p.kind === 'traveller' && p.state === 'wait')];
  walkers.sort((a, b) => (a === servant ? 1 : 0) - (b === servant ? 1 : 0));
  for (const p of walkers) { p.world = true; p.y = LANE; if (onScreen(p)) drawPerson(p); }
  for (const c of carts) if (c.state === 'cross' && lerp(LANE - 130, H + 90, c.p) >= LANE) drawCart(c);

  // Arrow to the house when the line is ready to go home
  if (group.length && servant.x > HOME_ZONE + 200 && state === 'play') {
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(t * 5);
    ctx.fillStyle = '#e0a526';
    const ay = LANE + 85, ax = 30;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 22, ay - 16); ctx.lineTo(ax + 22, ay + 16); ctx.closePath(); ctx.fill();
    ctx.font = '700 14px Fredoka, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#8a5a00';
    ctx.fillText('To the feast', ax + 28, ay + 5);
    ctx.restore();
  }
}

function onScreen(p) { const x = p.x - (p.world ? cam.x : 0); return x > -80 && x < W + 80; }

// ============================================================
//  The banquet hall
// ============================================================
function drawHallScene() {
  const L = hallLayout();
  const x0 = -offX - 10, x1 = W + offX + 10;
  const wall = ctx.createLinearGradient(0, -offY, 0, H);
  wall.addColorStop(0, '#f4dcaa'); wall.addColorStop(1, '#e6c48a');
  ctx.fillStyle = wall; ctx.fillRect(x0, -offY, x1 - x0, H + offY);
  // arched windows with the evening sky
  for (let x = x0 + ((-x0) % 170) - 170 + 40; x < x1; x += 170) {
    const sky = ctx.createLinearGradient(0, 150, 0, 290);
    sky.addColorStop(0, '#6b5fa8'); sky.addColorStop(1, '#f7a86b');
    ctx.fillStyle = sky; roundRect(x, 150, 70, 130, [35, 35, 0, 0]); ctx.fill();
    ctx.strokeStyle = '#b58a4a'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(x + 20, 184, 1.8, 0, TAU); ctx.arc(x + 48, 200, 1.4, 0, TAU); ctx.fill();
  }
  // bunting and lamps
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let x = x0; x <= x1; x += 8) ctx.lineTo(x, 138 + Math.sin((x - x0) / (x1 - x0) * Math.PI * 4) * -14); ctx.stroke();
  for (let x = x0 + 10, k = 0; x < x1; x += 34, k++) {
    const y = 138 + Math.sin((x - x0) / (x1 - x0) * Math.PI * 4) * -14;
    ctx.fillStyle = ['#ff8fab', '#ffd166', '#69db7c', '#4dabf7'][k % 4];
    ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 18); ctx.closePath(); ctx.fill();
  }
  // floor
  ctx.fillStyle = '#c9985a'; ctx.fillRect(x0, 720, x1 - x0, H - 720 + 20);
  ctx.strokeStyle = 'rgba(120,80,40,0.35)'; ctx.lineWidth = 2;
  for (let y = 740; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }

  // The host
  drawPerson(master);

  // Tables, row by row, back to front
  for (let r = 0; r < L.rows; r++) {
    const ty = L.tableY[r];
    const seats = hall.seats.filter((st) => st.row === r);
    for (const st of seats) {
      // the seat (a cushioned stool behind the table)
      const hl = hall.phase === 'seat' && !st.guest && (hall.drag || hall.sel || (hall.keyUsed && hall.seats.indexOf(st) === hall.cursor));
      ctx.fillStyle = hl ? `rgba(255,230,120,${0.5 + 0.3 * Math.sin(t * 6)})` : 'rgba(255,255,255,0)';
      if (hl) { ctx.beginPath(); ctx.arc(st.x, ty - 26, 30, 0, TAU); ctx.fill(); }
      const cs = L.s / 0.92;
      ctx.fillStyle = '#9a6a38'; roundRect(st.x - 18 * cs, ty - 46 * cs, 36 * cs, 50 * cs, [12, 12, 2, 2]); ctx.fill();
      ctx.fillStyle = '#c0392b'; roundRect(st.x - 13 * cs, ty - 40 * cs, 26 * cs, 36 * cs, [9, 9, 2, 2]); ctx.fill();
      if (st.guest && !(hall.drag && hall.drag.obj === st.guest) && !st.guest.anim) drawPerson(st.guest);
    }
    // table and cloth
    const tx0 = L.x0 - 18, tx1 = L.x1 + 18;
    ctx.fillStyle = '#fdf8ea'; ctx.strokeStyle = '#d8c9a4'; ctx.lineWidth = 2;
    roundRect(tx0, ty, tx1 - tx0, 16, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f6efdc'; roundRect(tx0 + 4, ty + 14, tx1 - tx0 - 8, 40, [0, 0, 10, 10]); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx0 + 6, ty + 44); ctx.lineTo(tx1 - 6, ty + 44); ctx.stroke();
    // candles along the table
    for (let k = 0; k <= 4; k++) {
      const cx = lerp(tx0 + 20, tx1 - 20, k / 4);
      if (seats.some((st) => Math.abs(st.x - cx) < 20)) continue;
      ctx.fillStyle = '#fff6e0'; ctx.fillRect(cx - 2.5, ty - 18, 5, 18);
      ctx.fillStyle = `rgba(255,190,60,${0.8 + 0.2 * Math.sin(t * 9 + k)})`; ctx.beginPath(); ctx.ellipse(cx, ty - 22, 3, 5, 0, 0, TAU); ctx.fill();
    }
    // served dishes on the table
    for (const st of seats) {
      const g = st.guest;
      if (!g || !g.plates) continue;
      g.plates.forEach((k, j) => drawDish(k, st.x + (j - (g.plates.length - 1) / 2) * 20, ty + 2, L.narrow ? 0.5 : 0.6));
    }
  }

  // Wish bubbles: what each guest is hoping for
  for (const st of hall.seats) {
    const g = st.guest;
    if (!g || !g.wish || g.wishDelay > 0 || g.anim) continue;
    const bx = st.x + 16 * g.s, by = st.ty - 100 * g.s + Math.sin(t * 3 + g.phase) * 2;
    const sel = hall.keyUsed && hall.phase === 'serve' && hall.seats.indexOf(st) === hall.cursor;
    ctx.fillStyle = sel ? '#fff1a8' : '#fffbe8'; ctx.strokeStyle = sel ? '#d9480f' : '#e0a526'; ctx.lineWidth = sel ? 3.5 : 2.5;
    ctx.beginPath(); ctx.arc(bx, by, 22, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx - 14, by + 22, 4, 0, TAU); ctx.fill(); ctx.stroke();
    drawDish(g.wish, bx, by - 2, 0.6, false);
    if (g.need > 1) { ctx.fillStyle = '#d9480f'; ctx.font = '700 12px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('×2', bx + 20, by - 16); }
  }
  // keyboard cursor over a seated guest
  if (hall.keyUsed && hall.phase === 'serve') {
    const st = hall.seats[hall.cursor];
    if (st && st.guest && !st.guest.wish) { ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(st.x, st.ty - 40, 30, 0, TAU); ctx.stroke(); }
  }

  // The queue of guests waiting to sit down
  if (hall.phase === 'seat') {
    let hidden = 0;
    for (const g of hall.queue) {
      if (!queueVisible(g)) { hidden++; continue; }
      if (hall.drag && hall.drag.obj === g) continue;
      if (hall.sel && hall.sel.obj === g) {
        ctx.fillStyle = `rgba(255,230,120,${0.6 + 0.3 * Math.sin(t * 6)})`;
        ctx.beginPath(); ctx.ellipse(g.x, g.y - 2, 26, 8, 0, 0, TAU); ctx.fill();
      }
      drawPerson(g);
    }
    if (hidden) {
      ctx.font = '700 16px Fredoka, sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#6a4a14';
      ctx.fillText(`+${hidden} more`, W - 12, L.qy - 20);
    }
  }
  // Guests hopping into their seats
  for (const g of diners) if (g.anim && g.seat) drawPerson(g);

  // The tray of food
  if (hall.phase === 'serve') {
    const n = hall.dishes.length, sp = L.narrow ? 100 : 130;
    ctx.fillStyle = '#a8703a'; ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 3;
    roundRect(W / 2 - (n * sp) / 2 - 6, L.trayY - 34, n * sp + 12, 66, 18); ctx.fill(); ctx.stroke();
    hall.dishes.forEach((d, k) => {
      if (hall.drag && hall.drag.obj === d) return;
      if (hall.sel && hall.sel.obj === d) {
        ctx.fillStyle = `rgba(255,240,150,${0.6 + 0.3 * Math.sin(t * 6)})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, 38, 0, TAU); ctx.fill();
      }
      drawDish(d.k, d.x, d.y - 4, 1);
      if (hall.keyUsed) { ctx.fillStyle = '#fff3d6'; ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${k + 1}`, d.x - 34, d.y - 18); }
    });
  }
  for (const fl of hall.flying) {
    const st = fl.g.seat;
    const f = ease(clamp(fl.t, 0, 1));
    drawDish(fl.k, lerp(fl.x0, st.x, f), lerp(fl.y0, st.ty, f) - Math.sin(f * Math.PI) * 80, lerp(1, 0.6, f));
  }
  // whatever is being dragged goes on top
  if (hall.drag) {
    const o = hall.drag.obj;
    if (hall.drag.kind === 'guest') drawPerson(o); else drawDish(o.k, o.x, o.y - 4, 1.1);
  }
}

// ============================================================
//  Bubbles, banners, messages, HUD
// ============================================================
function bubbleAnchor(p) {
  if (p === 'jesus') { const L = frameLayout(); return { x: L.jx + 6, y: L.gy - 76 * L.s * 1.1 }; }
  if (!p || p.x === undefined) return null;
  if (p.state === 'in' && scene !== 'seat') return null;
  const x = p.x - (p.world ? cam.x : 0);
  const head = p.pose === 'sit' ? 66 : 80;
  const y = p.y - (head + (p.lift || 0)) * (p.s || 1);
  if (scene === 'excuse') { const L = excuseLayout(); return { x: W / 2 + (x - W / 2) * L.k, y: L.gy + (y - L.gy) * L.k }; }
  return { x, y };
}

function drawSpeech(text, ax, ay, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '700 17px Fredoka, sans-serif';
  const maxW = Math.min(W - 44, 420);
  const lines = wrapText(text, maxW - 26);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = tw + 26, h = lines.length * 21 + 16;
  const bx = clamp(ax - w * 0.35, 10, W - 10 - w);
  const by = clamp(ay - 22 - h, 132, H - 20 - h);
  const tx = clamp(ax, bx + 20, bx + w - 20);
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  if (ay > by + h) {
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 1.5); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h - 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h); ctx.lineTo(ax, Math.max(ay, by + h + 12)); ctx.lineTo(tx + 10, by + h); ctx.stroke();
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(tx - 9, by + h - 5, 18, 4);
  }
  ctx.fillStyle = '#8a5a00';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, bx + 13, by + 8 + 10.5 + i * 21));
  ctx.restore();
}

function drawBubbles() {
  for (const b of bubbles) {
    if (b.t <= 0) continue;
    const a = bubbleAnchor(b.p);
    if (!a || a.x < -40 || a.x > W + 40) continue;
    drawSpeech(b.text, a.x, a.y, clamp(b.t / 0.3, 0, 1));
  }
}

function drawBanner() {
  if (!banner || banner.t <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1) * clamp(banner.age / 0.3, 0, 1);
  const maxW = Math.min(W - 40, 700);
  ctx.font = 'italic 600 19px Fredoka, sans-serif';
  const lines = wrapText(banner.text, maxW - 36);
  const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const w = Math.min(maxW, tw + 36), h = lines.length * 24 + (banner.cite ? 34 : 18);
  const bx = W / 2 - w / 2, by = 116;
  ctx.fillStyle = 'rgba(255,246,220,0.95)'; ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 2.5;
  roundRect(bx, by, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a4a14'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 9 + 12 + i * 24));
  if (banner.cite) {
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = '#9a7a40';
    ctx.fillText(banner.cite, W / 2, by + h - 13);
  }
  ctx.restore();
}

function drawMessage() {
  if (message.t <= 0) return;
  const a = clamp(message.t / 0.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 24px Fredoka, sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
  const y = scene === 'seat' ? 330 : H * 0.36;
  ctx.strokeText(message.text, W / 2, y);
  ctx.fillStyle = '#7a5200';
  ctx.fillText(message.text, W / 2, y);
  ctx.restore();
}

function drawHint() {
  if (!hint || hint.t <= 0 || state !== 'play') return;
  ctx.save();
  ctx.globalAlpha = clamp(hint.t / 0.4, 0, 1) * (0.8 + 0.2 * Math.sin(t * 4));
  ctx.font = `700 ${W < 560 ? 17 : 20}px Fredoka, sans-serif`;
  ctx.textAlign = 'center';
  const lines = wrapText(hint.text, W - 40);
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#5a3a00';
  const baseY = scene === 'seat' ? (hallLayout().rows === 2 ? 742 : 700) : H - 30;
  lines.forEach((l, i) => {
    const y = baseY - (lines.length - 1 - i) * 22;
    ctx.strokeText(l, W / 2, y); ctx.fillText(l, W / 2, y);
  });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 4;
  const dark = '#5a4210';

  // Left: level + how warm the supper still is
  ctx.textAlign = 'left';
  ctx.fillStyle = dark;
  ctx.font = '700 17px Fredoka, sans-serif';
  ctx.fillText(state === 'title' ? 'The Great Banquet' : `Level ${level} · ${cfg.name}`, 12, 26);
  ctx.font = '600 12px Fredoka, sans-serif';
  ctx.fillText('SUPPER', 12, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(90,66,16,0.25)';
  roundRect(66, 38, 122, 13, 6.5); ctx.fill();
  const gl = clamp(warmth / 100, 0, 1);
  const gg = ctx.createLinearGradient(66, 0, 188, 0);
  gg.addColorStop(0, '#f76707'); gg.addColorStop(1, '#ffd43b');
  ctx.fillStyle = gl < 0.2 && Math.sin(t * 10) > 0 ? '#4dabf7' : gg;
  if (gl > 0) { roundRect(66, 38, 122 * gl, 13, 6.5); ctx.fill(); }
  // steam curls while it is still hot
  if (gl > 0.2) {
    ctx.strokeStyle = 'rgba(120,100,80,0.5)'; ctx.lineWidth = 1.5;
    for (let k = 0; k < 2; k++) { const sx = 196 + k * 7; ctx.beginPath(); ctx.moveTo(sx, 50); ctx.quadraticCurveTo(sx + 4 * Math.sin(t * 3 + k), 44, sx, 38 - (t * 6 + k * 3) % 4); ctx.stroke(); }
  }

  // Home / pause / mute buttons
  for (const b of hudButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a4210'; ctx.strokeStyle = '#5a4210'; ctx.lineWidth = 2;
    if (b.icon === 'home') {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 1); ctx.lineTo(b.x, b.y - 8); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill();
      ctx.fillRect(b.x - 5.5, b.y - 2, 11, 9);
    } else if (b.icon === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else if (b.icon === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 3); ctx.lineTo(b.x - 4, b.y - 3); ctx.lineTo(b.x + 1, b.y - 7);
      ctx.lineTo(b.x + 1, b.y + 7); ctx.lineTo(b.x - 4, b.y + 3); ctx.lineTo(b.x - 8, b.y + 3); ctx.fill();
      ctx.beginPath();
      if (b.icon === 'sound') { ctx.arc(b.x + 2, b.y, 6, -0.8, 0.8); }
      else { ctx.moveTo(b.x + 4, b.y - 4); ctx.lineTo(b.x + 9, b.y + 4); ctx.moveTo(b.x + 9, b.y - 4); ctx.lineTo(b.x + 4, b.y + 4); }
      ctx.stroke();
    }
  }

  // Right: seats filled, score, and a little map of the street
  const rx = viewW - 12;
  ctx.textAlign = 'right';
  ctx.shadowBlur = 4;
  ctx.fillStyle = dark;
  ctx.font = '700 15px Fredoka, sans-serif';
  const seated = hall ? hall.seats.filter((s) => s.guest).length : diners.length;
  ctx.fillText(`Seats ${seated}/${cfg.seats}`, rx, 24);
  ctx.font = '600 13px Fredoka, sans-serif';
  ctx.fillText(`Score ${totalScore}`, rx, 44);
  const world = (scene === 'city' || scene === 'hedges') && state !== 'title';
  if (world) {
    const mx1 = rx - 4, mx0 = mx1 - 150, my = 66;
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(90,66,16,0.35)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(mx0, my); ctx.lineTo(mx1, my); ctx.stroke();
    const pos = (x) => mx0 + clamp(x / worldLen(), 0, 1) * (mx1 - mx0);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(mx0 - 6, my - 2); ctx.lineTo(mx0, my - 9); ctx.lineTo(mx0 + 6, my - 2); ctx.fill();
    ctx.fillStyle = '#f7e4bf'; ctx.fillRect(mx0 - 5, my - 2, 10, 8);
    if (rack) { ctx.fillStyle = '#8a5a2e'; ctx.fillRect(pos(rack.x) - 2, my - 8, 4, 16); }
    for (const h of hedges) if (!h.done) { ctx.fillStyle = '#5f8f3e'; ctx.beginPath(); ctx.arc(pos(h.x), my, 4, 0, TAU); ctx.fill(); }
    for (const p of folk) if (p.state === 'wait' && !p.hidden) { ctx.fillStyle = '#f08c00'; ctx.beginPath(); ctx.arc(pos(p.x), my, 4, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#2f6fb0'; ctx.beginPath(); ctx.arc(pos(servant.x), my, 5.5, 0, TAU); ctx.fill();
    // crutches carried
    if (scene === 'city') {
      ctx.save(); ctx.translate(0, 0);
      for (let k = 0; k < servant.carry; k++) drawCrutch(mx0 + 4 + k * 12, 80, mx0 + 8 + k * 12, 102);
      ctx.restore();
      if (group.length) { ctx.shadowBlur = 4; ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = dark; ctx.fillText(`Following: ${group.filter((g) => g.state === 'join').length}`, rx, 96); }
    } else if (group.length) { ctx.shadowBlur = 4; ctx.font = '600 13px Fredoka, sans-serif'; ctx.fillStyle = dark; ctx.fillText(`Following: ${group.filter((g) => g.state === 'join').length}`, rx, 96); }
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = rand(-4, 4) * shakeT * 2; sy = rand(-4, 4) * shakeT * 2; }
  ctx.setTransform(scale, 0, 0, scale, (offX + sx) * scale, (offY + sy) * scale);

  if (scene === 'frame') drawFrameScene();
  else if (scene === 'excuse') drawExcuseScene();
  else if (scene === 'seat' && hall) drawHallScene();
  else drawWorldScene();
  drawParticles();

  // Tap ripples
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - r.t / 0.4)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.t * 70, 0, TAU); ctx.stroke();
  }

  if (state !== 'title') {
    drawBubbles();
    drawBanner();
    drawMessage();
    drawHint();
  }

  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,230,${flashT * 2})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }
  if (fade) {
    const a = fade.t < FADE ? fade.t / FADE : 1 - (fade.t - FADE) / FADE;
    ctx.fillStyle = `rgba(255,246,220,${clamp(a, 0, 1)})`;
    ctx.fillRect(-offX, -offY, viewW, viewH);
  }

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
}

// ============================================================
//  Main loop
// ============================================================
function updatePeople(dt) {
  const all = [servant, master, ...listeners, ...folk, ...diners, ...group];
  if (excuse) all.push(...excuse.people, excuse.bride);
  for (const h of hedges) if (h.person) all.push(h.person);
  for (const d of all) {
    if (!d) continue;
    d.blinkT -= dt;
    if (d.blinkT <= 0) { d.blink = 0.13; d.blinkT = rand(1.5, 5); }
    if (d.blink > 0) d.blink -= dt;
  }
  updateListeners(dt);
}

function update(dt) {
  t += dt;
  updateParticles(dt);
  updatePeople(dt);
  if (fade) {
    fade.t += dt;
    if (fade.t >= FADE && !fade.done) { fade.done = true; setScene(fade.next); }
    if (fade.t >= FADE * 2) fade = null;
  }
  if (state === 'play') {
    sceneT += dt;
    switch (scene) {
      case 'frame': updateFrame(dt); break;
      case 'excuse': updateExcuse(dt); break;
      case 'city': case 'hedges': updateWorld(dt); break;
      case 'seat': updateHall(dt); break;
    }
    // The supper cools while the servant is out gathering guests and serving
    const cooling = (scene === 'city' || scene === 'hedges' || (scene === 'seat' && hall && hall.phase !== 'feast')) && !interlude && !fade;
    if (cooling) {
      warmth -= (100 / cfg.budget) * dt;
      if (warmth <= 0) { warmth = 0; fail('cold'); }
    }
  } else if ((state === 'win' || state === 'fail') && scene === 'seat' && hall) {
    updateHall(dt);
  } else if (state === 'title') {
    sceneT += dt;
  }
  for (const b of bubbles) b.t -= dt;
  bubbles = bubbles.filter((b) => b.t > 0);
  if (banner) { banner.t -= dt; banner.age += dt; }
  if (hint) hint.t -= dt;
  flashT = Math.max(0, flashT - dt);
  shakeT = Math.max(0, shakeT - dt);
  msgCd -= dt;
  message.t -= dt;
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 0.4) ripples.splice(i, 1); }
  endScreens(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'pause') { update(dt / 2); update(dt / 2); }
  render();
  requestAnimationFrame(frame);
}

titleScreen();
requestAnimationFrame(frame);
</script>
</body>
