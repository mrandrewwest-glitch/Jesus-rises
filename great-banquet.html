<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6d98f">
<title>The Great Banquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f1e;
    --gold: #e0a526;
    --gold-dark: #a8741a;
    --card: rgba(255, 252, 240, 0.95);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fcaf0;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;     /* no iOS copy/look-up menu on long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;       /* no rubber-band bounce */
    touch-action: none;              /* no double-tap zoom or pinch zoom */
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(30, 40, 80, 0.22);
    transition: opacity 0.3s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 22px 22px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(60, 40, 0, 0.3), inset 0 0 0 3px rgba(224, 165, 38, 0.5);
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    touch-action: pan-y;             /* the card may still scroll on small screens */
  }
  .card h1 {
    margin: 0 0 2px;
    font-size: 2.3rem;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 12px rgba(255, 210, 90, 0.6);
    letter-spacing: 0.5px;
  }
  .card .sub {
    margin: 0 0 12px;
    font-weight: 600;
    color: #6a5a3c;
  }
  .card .body {
    font-size: 0.98rem;
    line-height: 1.45;
    text-align: left;
  }
  .card .body ul { padding-left: 1.1em; margin: 8px 0; }
  .card .body li { margin: 3px 0; }
  .card .verse {
    font-style: italic;
    text-align: center;
    color: #7a6640;
    font-size: 0.92rem;
    margin: 10px 0 4px;
  }
  .card .credit {
    font-size: 0.72rem;
    color: #9a8a6a;
    margin-top: 8px;
    text-align: center;
  }
  .card .score {
    text-align: center;
    font-size: 1.1rem;
    margin: 8px 0;
  }
  .card .score b { color: var(--gold-dark); }
  kbd {
    background: #fff;
    border: 1px solid #cdbf9d;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85em;
  }
  #ovBtn {
    touch-action: manipulation;
    margin-top: 14px;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(#f7c948, #d9961c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    box-shadow: 0 4px 0 var(--gold-dark), 0 6px 16px rgba(160, 110, 20, 0.4);
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(120, 70, 0, 0.6);
  }
  #ovBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
  #ovHome {
    display: inline-block;
    margin-top: 12px;
    color: #8a6a2a;
    font-weight: 600;
    text-decoration: none;
    touch-action: manipulation;
  }
  #ovHome:hover { text-decoration: underline; }
  #ovBtn2 {
    touch-action: manipulation;
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-dark);
    background: #fff;
    border: 2px solid rgba(224, 165, 38, 0.7);
    border-radius: 999px;
    padding: 8px 22px;
    cursor: pointer;
  }
  #ovBtn2:active { transform: translateY(2px); }
  #ovBtn2.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">The Great Banquet</h1>
    <p class="sub" id="ovSub"></p>
    <div class="body" id="ovBody"></div>
    <button id="ovBtn">Begin</button>
    <button id="ovBtn2" class="hidden"></button>
    <a id="ovHome" href="index.html">&larr; All games</a>
  </div>
</div>


<script src="bible.js"></script>
<script>
'use strict';

// Scripture shown in this game, looked up in the player's chosen version.
// Bible.verse() falls back to the KJV (labelled KJV) when a version is missing.
const VERSES = {
  quickly:  { ref: 'Luke 14:21', KJV: 'Go out quickly into the streets and lanes of the city, and bring in hither the poor, and the maimed, and the halt, and the blind.', NKJV: 'Go out quickly into the streets and lanes of the city, and bring in here the poor and the maimed and the lame and the blind.', NIV: 'Go out quickly into the streets and alleys of the town and bring in the poor, the crippled, the blind and the lame.', NLT: 'Go quickly into the streets and alleys of the town and invite the poor, the crippled, the blind, and the lame.' },   // title card + street banner
  filled:   { ref: 'Luke 14:23', KJV: 'Go out into the highways and hedges, and compel them to come in, that my house may be filled.', NKJV: 'Go out into the highways and hedges, and compel them to come in, that my house may be filled.', NIV: 'Go out to the roads and country lanes and compel them to come in, so that my house will be full.', NLT: 'Go out into the country lanes and behind the hedges and urge anyone you find to come, so that the house will be full.' },   // win card
  consent:  { ref: 'Luke 14:18', KJV: 'And they all with one consent began to make excuse.', NKJV: 'But they all with one accord began to make excuses.', NIV: 'But they all alike began to make excuses.', NLT: 'But they all began making excuses.' },   // fail card
  blessed:  { ref: 'Luke 14:15', KJV: 'Blessed is he that shall eat bread in the kingdom of God.', NKJV: 'Blessed is he who shall eat bread in the kingdom of God!', NIV: 'Blessed is the one who will eat at the feast in the kingdom of God.', NLT: 'What a blessing it will be to attend a banquet in the Kingdom of God!' },   // a listener's bubble
  supper:   { ref: 'Luke 14:16', KJV: 'A certain man made a great supper, and bade many', NKJV: 'A certain man gave a great supper and invited many', NIV: 'A certain man was preparing a great banquet and invited many guests.', NLT: 'A man prepared a great feast and sent out many invitations.' },   // Jesus's bubble
  ready:    { ref: 'Luke 14:17', KJV: 'Come; for all things are now ready.', NKJV: 'Come, for all things are now ready.', NIV: 'Come, for everything is now ready.', NLT: 'Come, the banquet is ready.' },   // servant's bubble
  ground:   { ref: 'Luke 14:18', KJV: 'I have bought a piece of ground, and I must needs go and see it: I pray thee have me excused.', NKJV: 'I have bought a piece of ground, and I must go and see it. I ask you to have me excused.', NIV: 'I have just bought a field, and I must go and see it. Please excuse me.', NLT: 'I have just bought a field and must inspect it. Please excuse me.' },   // first excuse
  oxen:     { ref: 'Luke 14:19', KJV: 'I have bought five yoke of oxen, and I go to prove them: I pray thee have me excused.', NKJV: 'I have bought five yoke of oxen, and I am going to test them. I ask you to have me excused.', NIV: 'I have just bought five yoke of oxen, and I’m on my way to try them out. Please excuse me.', NLT: 'I have just bought five pairs of oxen, and I want to try them out. Please excuse me.' },   // second excuse
  wife:     { ref: 'Luke 14:20', KJV: 'I have married a wife, and therefore I cannot come.', NKJV: 'I have married a wife, and therefore I cannot come.', NIV: 'I just got married, so I can’t come.', NLT: 'I just got married, so I can’t come.' },   // third excuse
  room:     { ref: 'Luke 14:22', KJV: 'Lord, it is done as thou hast commanded, and yet there is room.', NKJV: 'Master, it is done as you commanded, and still there is room.', NIV: 'Sir... what you ordered has been done, but there is still room.', NLT: 'There is still room for more.' },   // servant's bubble
  hedges:   { ref: 'Luke 14:23', KJV: 'Go out into the highways and hedges', NKJV: 'Go out into the highways and hedges', NIV: 'Go out to the roads and country lanes', NLT: 'Go out into the country lanes and behind the hedges' },   // master's bubble
};
function verseHTML(key) {
  const v = Bible.verse(VERSES[key]);
  return `<p class="verse">"${v.text}" &mdash; ${v.cite}</p>`;
}
function creditHTML() {
  return `<p class="credit">${Bible.credits(VERSES).join(' ')}</p>`;
}
function verseText(key) { return Bible.verse(VERSES[key]).text; }

// ============================================================
//  Setup & helpers
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const H = 900;          // logical playfield height
const MIN_W = 480;      // narrowest logical playfield
const MAX_W = 1300;     // widest logical playfield

let dpr = 1, scale = 1, viewW = 600, viewH = 900, W = 600, offX = 0, offY = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const ease = (f) => (f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
  W = Math.min(viewW, MAX_W);
  offX = (viewW - W) / 2;
  offY = viewH - H;   // any extra height becomes sky above the playfield
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

const isTouch = () => matchMedia('(pointer: coarse)').matches;

// ============================================================
//  Tuning
// ============================================================
const CH = 1.45;          // drawing scale for people in the town and fields
const LANE = H - 175;     // feet of everyone walking along the street
const SIT_Y = H - 212;    // feet of people waiting by the roadside
const SERV_V = 215;       // the servant's walking speed (px/s)
const GAP = 50;           // spacing of the growing line of guests
const DOOR_X = 150;       // the master's front door (world x)
const HOUSE_R = 262;      // right-hand edge of the master's house
const HOME_ZONE = HOUSE_R + 40;   // bring guests this close and they go in
const CROSS_T = 3.2;      // time a donkey cart takes to cross the lane
const FADE = 0.35;        // scene fade (each way)

const LEVEL_NAMES = [
  'A Supper for Everyone',
  'Busy Market Lanes',
  'Crowded Streets',
  'Far Hedgerows',
  'The Long Highway',
  'Every Seat Filled',
];

function makeConfig(n) {
  const cityN = [3, 5, 6, 7, 8][n - 1] || 8;
  const total = Math.min(cityN + ([2, 3, 4, 4, 5][n - 1] || 6), 14);
  const cityLen = Math.min(1500 + (n - 1) * 330, 3000);
  const countryLen = Math.min(1350 + (n - 1) * 300, 2700);
  const c = {
    name: LEVEL_NAMES[n - 1] || `Banquet ${n}`,
    cityN, hedgeN: total - cityN, seats: total,
    cityLen, countryLen,
    halt: n === 1 ? 1 : n <= 3 ? 2 : 3,        // people who need a crutch
    blind: n === 1 ? 1 : 2,                    // people who need a hand
    carry: n <= 2 ? 2 : 1,                     // crutches the servant can carry at once
    carts: [0, 1, 2, 2, 3][n - 1] ?? 3,        // donkey-cart crossings in the city
    decoys: Math.min(n, 4),                    // hedges with only a bird or rabbit inside
    shy: n >= 3 ? 2 : 1,                       // calls needed before a hedge-sitter comes out
    peek: n <= 2,                              // hidden guests peek out over the hedge
    dishes: n === 1 ? 2 : n === 2 ? 3 : 4,     // kinds of food on the tray
    seconds: n >= 4 ? 0.35 : 0,                // chance a guest asks for a second dish
  };
  // Time before the supper goes cold, from a rough estimate of the work needed
  // (a quick player needs about est seconds; level 1 gives five times that)
  const est = 6 * total + 4 * c.carts + (countryLen - 1350) / SERV_V;
  c.budget = est * ([5, 3, 2.4, 2.2, 2][n - 1] || 1.85);
  return c;
}

// ============================================================
//  Game state
// ============================================================
let state = 'title';      // title | play | win | fail | pause
let scene = 'frame';      // frame | excuse | city | hedges | seat
let level = 1;
let totalScore = 0;
let best = 0;
try { best = +localStorage.getItem('banquetBest') || 0; } catch (e) {}

let cfg = makeConfig(1);
let t = 0, sceneT = 0;
let cam = { x: 0 };
let warmth = 100;         // the supper cools as time passes
let servant, master;
let group = [];           // guests following the servant
let folk = [];            // people in the current street / field
let carts = [];
let hedges = [];
let rack = null;          // the carpenter's crutch rack
let diners = [];          // everyone who has come in to the supper
let entered = 0;          // guests brought in from the current place
let interlude = null;     // short story beats between the playing parts
let excuse = null;        // the three invited guests and their excuses
let listeners = [];
let hall = null;          // seating and serving at the banquet table
let particles = [];
let ripples = [];
let bubbles = [];
let banner = null, hint = null;
let message = { text: '', t: 0 };
let fade = null;
let flashT = 0, shakeT = 0;
let endTimer = 0;
let lastScore = null;
let failReason = '';
let seenIntro = false;
let stats = null;
let msgCd = 0;
const keys = new Set();

// ============================================================
//  People
// ============================================================
const ROBES = ['#b5503f', '#6b8e3a', '#d9a13a', '#3c8f86', '#a0673a', '#5a6475', '#c46b8c', '#4b7f4b', '#8a6fb0', '#c9874a', '#3f6fb5', '#b08a2e'];
const SKINS = ['#d9a066', '#c98d56', '#e3b184', '#b87a48', '#c58a55', '#8d5a34', '#dca678', '#a86e40'];
const HAIRS = ['#2e1d10', '#4a2f1a', '#8a8a8a', '#6b3f1d', '#1f140c', '#d0d0d0', '#5c3a1c'];
const SCARVES = ['#e8dcc0', '#c9b27a', '#d8c7a0', '#9fc4d8', '#e6b3c4', '#b8d4a0'];

let personCount = 0;
function person(look, extra) {
  return {
    ...look, ...extra, i: personCount++,
    s: CH, pose: 'stand', mood: 'watch', facing: 1, walkT: 0,
    blinkT: rand(1, 4), blink: 0, phase: rand(0, TAU), shake: 0,
    ...(extra || {}),
  };
}

function randomLook() {
  const woman = Math.random() < 0.45;
  const old = Math.random() < 0.3;
  return {
    robe: pick(ROBES), skin: pick(SKINS),
    hair: old ? pick(['#8a8a8a', '#d0d0d0', '#b8b8b8']) : pick(HAIRS),
    beard: !woman && Math.random() < 0.7,
    scarf: woman ? pick(SCARVES) : (Math.random() < 0.25 ? pick(SCARVES) : null),
    woman,
  };
}

const SERVANT_LOOK = { robe: '#4f8fc0', hair: '#3a2415', skin: '#d6a06a', beard: false, headband: '#e0a526', trim: '#e8dcc0' };
const MASTER_LOOK = { robe: '#7a3fa0', trim: '#f2c94c', hair: '#9a9a9a', beard: true, longBeard: true, skin: '#d9a066', scarf: '#f4e7c4', tall: true };

function drawFace(d, mood, hy, lx, ly) {
  const ex = 6, ey = hy - 1;
  const dark = '#2b1d12';
  const mouthY = hy + 9;
  const blink = d.blink > 0 && mood !== 'shock' && mood !== 'joy';
  ctx.lineCap = 'round';

  const eyes = (rx, ry, pr) => {
    for (const sx of [-ex, ex]) {
      if (blink || d.blind) {
        // closed eyes: a blink, or a gentle curve for someone who cannot see
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        if (d.blind) ctx.arc(sx, ey - 1, 3, 0.15 * Math.PI, 0.85 * Math.PI);
        else { ctx.moveTo(sx - 3, ey); ctx.lineTo(sx + 3, ey); }
        ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(sx, ey, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(sx + lx * (rx - pr), ey + ly * (ry - pr), pr, 0, TAU); ctx.fill();
    }
  };
  const brows = (lInner, lOuter, rInner, rOuter) => {
    ctx.strokeStyle = shade(d.hair, -10); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-ex - 4, ey + lOuter); ctx.lineTo(-ex + 3, ey + lInner);
    ctx.moveTo(ex - 3, ey + rInner); ctx.lineTo(ex + 4, ey + rOuter);
    ctx.stroke();
  };
  const mouthFill = (fn) => { ctx.fillStyle = '#7a2e22'; ctx.beginPath(); fn(); ctx.fill(); };
  const mouthLine = (fn) => { ctx.strokeStyle = '#6a2a1e'; ctx.lineWidth = 2; ctx.beginPath(); fn(); ctx.stroke(); };
  const blush = (a = 0.45) => {
    ctx.fillStyle = `rgba(255,120,120,${a})`;
    ctx.beginPath(); ctx.arc(-11, hy + 4, 3, 0, TAU); ctx.arc(11, hy + 4, 3, 0, TAU); ctx.fill();
  };
  const happyEyes = () => {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(-ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(ex + 3.5 * Math.cos(Math.PI * 1.1), ey + 1.5 + 3.5 * Math.sin(Math.PI * 1.1));
    ctx.arc(ex, ey + 1.5, 3.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  };

  switch (mood) {
    case 'watch':
      eyes(3.5, 4.5, 2);
      brows(-7, -7, -7, -7);
      mouthLine(() => ctx.arc(0, mouthY - 3, 4, 0.2 * Math.PI, 0.8 * Math.PI));
      break;
    case 'wow':
      eyes(4, 5.5, 2.1);
      brows(-10, -9, -10, -9);
      mouthFill(() => ctx.ellipse(0, mouthY, 3.2, 4.2, 0, 0, TAU));
      break;
    case 'doubt':
      eyes(3.5, 3.5, 2);
      brows(-7, -6, -10, -12);
      mouthLine(() => { ctx.moveTo(-4, mouthY); ctx.quadraticCurveTo(1, mouthY + 1, 5, mouthY - 2); });
      break;
    case 'worried':
      eyes(3.5, 4.5, 2);
      brows(-10, -6, -10, -6);
      mouthLine(() => {
        ctx.moveTo(-5, mouthY);
        ctx.quadraticCurveTo(-2.5, mouthY - 2, 0, mouthY);
        ctx.quadraticCurveTo(2.5, mouthY + 2, 5, mouthY);
      });
      ctx.fillStyle = '#7cc4f2';
      ctx.beginPath();
      ctx.moveTo(14, hy - 8); ctx.quadraticCurveTo(18, hy - 1, 14, hy); ctx.quadraticCurveTo(10, hy - 1, 14, hy - 8);
      ctx.fill();
      break;
    case 'shock':
      eyes(5, 6, 1.6);
      brows(-12, -12, -12, -12);
      mouthFill(() => ctx.ellipse(0, mouthY + 1, 4.5, 6, 0, 0, TAU));
      break;
    case 'joy':
      if (d.blind) eyes(); else happyEyes();
      mouthFill(() => { ctx.moveTo(-6, mouthY - 3); ctx.arc(0, mouthY - 3, 6, 0, Math.PI); ctx.closePath(); });
      blush();
      break;
    case 'dismay':
      if (d.i % 2 === 0) {
        eyes(3.5, 3.5, 2);
        mouthLine(() => ctx.arc(0, mouthY + 3, 4, 1.2 * Math.PI, 1.8 * Math.PI));
      } else {
        ctx.strokeStyle = dark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-ex - 3, ey - 2); ctx.lineTo(-ex + 2, ey); ctx.lineTo(-ex - 3, ey + 2);
        ctx.moveTo(ex + 3, ey - 2); ctx.lineTo(ex - 2, ey); ctx.lineTo(ex + 3, ey + 2);
        ctx.stroke();
        mouthLine(() => {
          ctx.moveTo(-6, mouthY); ctx.lineTo(-3, mouthY - 2); ctx.lineTo(0, mouthY);
          ctx.lineTo(3, mouthY - 2); ctx.lineTo(6, mouthY);
        });
      }
      break;
    case 'sad':            // waiting by the roadside, hoping someone notices
      eyes(3.2, 3.6, 1.8);
      brows(-9, -5, -9, -5);
      mouthLine(() => ctx.arc(0, mouthY + 3, 3.5, 1.2 * Math.PI, 1.8 * Math.PI));
      break;
    case 'love':           // the happy groom and bride
      happyEyes();
      mouthLine(() => ctx.arc(0, mouthY - 3, 5, 0.15 * Math.PI, 0.85 * Math.PI));
      blush(0.7);
      break;
    case 'munch':          // eating the feast
      happyEyes();
      mouthFill(() => ctx.ellipse(0, mouthY, 3.4, 1.5 + Math.abs(Math.sin(t * 12 + d.phase)) * 2.4, 0, 0, TAU));
      blush();
      break;
  }
}

function drawCrutch(x0, y0, x1, y1) {
  ctx.strokeStyle = '#9a6a38'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const a = Math.atan2(y1 - y0, x1 - x0) + Math.PI / 2;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0 - Math.cos(a) * 7, y0 - Math.sin(a) * 7); ctx.lineTo(x0 + Math.cos(a) * 7, y0 + Math.sin(a) * 7); ctx.stroke();
  const mx = lerp(x0, x1, 0.35), my = lerp(y0, y1, 0.35);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(mx - Math.cos(a) * 4, my - Math.sin(a) * 4); ctx.lineTo(mx + Math.cos(a) * 4, my + Math.sin(a) * 4); ctx.stroke();
}

// A person, side-on-ish: robe, arms, head and a reacting face.
// p.pose: stand walk crutch sit knock open cheer spade reins shrug eat toast teach
// props: crutch (walks with one), needCrutch (bandaged foot), sling, blind (+staff), hold (hand on
// the shoulder ahead), bowl, bundle, crook, carry (crutches under the servant's arm), veil, headband
function drawPerson(p) {
  const s = p.s || 1, pose = p.pose || 'stand', mood = p.mood || 'watch', f = p.facing || 1;
  const ph = p.phase || 0, w = p.walkT || 0;
  const walking = pose === 'walk' || pose === 'crutch';
  let bob = 0, lean = 0;
  if (walking) bob = Math.abs(Math.sin(w)) * (pose === 'walk' ? 3 : 4.5);
  if (pose === 'cheer') bob = Math.abs(Math.sin(t * 6 + ph)) * 10;
  if (pose === 'crutch') lean = Math.sin(w) * 0.05;

  ctx.save();
  ctx.translate(p.x - (p.world ? cam.x : 0), p.y - (bob + (p.lift || 0)) * s);
  ctx.scale(s, s);
  if (lean) ctx.rotate(lean);
  if (p.dim) ctx.filter = 'brightness(0.93)';

  const sit = pose === 'sit';
  const top = sit ? -24 : -37;
  const hem = sit ? -4 : 0;
  const hy = top - 16 + (mood === 'sad' ? 1.5 : 0);
  const robeCol = p.robe;
  const sleeve = shade(robeCol, -25);
  const skin = p.skin;
  const sh = top + 5;

  const arm = (x1, y1, x2, y2) => {
    ctx.strokeStyle = sleeve; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x2, y2, 4, 0, TAU); ctx.fill();
  };
  const foot = (x, y, bandage) => {
    ctx.fillStyle = bandage ? '#f4efe2' : shade(skin, -12);
    ctx.beginPath(); ctx.ellipse(x + f * 2, y, bandage ? 7 : 5.5, bandage ? 4 : 3, 0, 0, TAU); ctx.fill();
    if (bandage) { ctx.strokeStyle = '#cfc5ae'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 2, y - 3); ctx.lineTo(x + 2, y + 3); ctx.moveTo(x + 2, y - 3); ctx.lineTo(x + 6, y + 3); ctx.stroke(); }
  };

  // Veil flows behind the bride
  if (p.veil) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(-14, hy - 12); ctx.quadraticCurveTo(-30 * f, hy + 10, -24 * f, top + 30);
    ctx.lineTo(18 * f, top + 22); ctx.quadraticCurveTo(18, hy - 10, 10, hy - 16); ctx.closePath(); ctx.fill();
  }

  // A staff for the blind, a crook for the shepherd (behind the body)
  if (p.blind && !p.hold && !sit) { ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f * 20, sh + 6); ctx.lineTo(f * 30, 0); ctx.stroke(); }
  if (p.crook) {
    ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-f * 18, 0); ctx.lineTo(-f * 18, top - 34); ctx.arc(-f * 18 + (-f * 7), top - 34, 7, 0, Math.PI, f > 0); ctx.stroke();
  }
  if (p.bundle && !sit) {
    ctx.strokeStyle = '#7a5a34'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(f * 10, sh + 2); ctx.lineTo(-f * 26, top - 16); ctx.stroke();
    ctx.fillStyle = '#c9a26a'; ctx.beginPath(); ctx.arc(-f * 28, top - 12, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-f * 28, top - 21); ctx.lineTo(-f * 28, top - 3); ctx.stroke();
  }
  // Crutches carried by the servant, tucked behind him
  for (let k = 0; k < (p.carry || 0); k++) drawCrutch(-f * (6 + k * 5), top - 6, -f * (20 + k * 5), -2);

  // Feet
  if (sit) {
    foot(f * 24, -2, p.needCrutch); foot(f * 17, -1);
  } else {
    const sw = walking ? Math.sin(w) * 6 : 0;
    foot(-6 + sw, -1, p.needCrutch); foot(6 - sw, -1);
  }

  // Robe
  ctx.fillStyle = robeCol;
  ctx.strokeStyle = shade(robeCol, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, hem);
  ctx.quadraticCurveTo(-17, top + 7, -11, top);
  ctx.quadraticCurveTo(0, top - 4, 11, top);
  ctx.quadraticCurveTo(17, top + 7, 18, hem);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (sit) { ctx.beginPath(); ctx.ellipse(f * 12, -8, 14, 8, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
  if (p.patch) {           // a poor man's patched robe
    ctx.fillStyle = shade(robeCol, 35); ctx.fillRect(-12, top + 12, 7, 7);
    ctx.fillStyle = shade(robeCol, -30); ctx.fillRect(5, hem - 14, 8, 6);
    ctx.strokeStyle = shade(robeCol, -60); ctx.lineWidth = 1;
    ctx.strokeRect(-12, top + 12, 7, 7); ctx.strokeRect(5, hem - 14, 8, 6);
  }
  if (p.trim) {
    ctx.strokeStyle = p.trim; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, top - 1); ctx.lineTo(0, hem - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, hem - 3); ctx.quadraticCurveTo(0, hem - 1, 17, hem - 3); ctx.stroke();
  }
  if (p.apron) {           // the servant's apron
    ctx.fillStyle = '#f4efe2';
    roundRect(-10, top + 18, 20, hem - top - 20, 4); ctx.fill();
  }
  // Belt
  ctx.strokeStyle = p.trim === '#f2c94c' ? '#f2c94c' : '#c9b07a'; ctx.lineWidth = 2.5;
  const by = sit ? top + 13 : top + 20;
  ctx.beginPath(); ctx.moveTo(-16, by); ctx.quadraticCurveTo(0, by + 3, 16, by); ctx.stroke();

  // Arms
  const wave = Math.sin(t * 9 + ph) * 4;
  let crutchHand = null;
  if (p.sling) {           // one arm resting in a sling
    arm(-f * 11, sh, f * 3, sh + 13);
    ctx.fillStyle = '#f4efe2';
    ctx.beginPath(); ctx.moveTo(-f * 12, sh - 2); ctx.lineTo(f * 8, sh + 18); ctx.lineTo(-f * 10, sh + 16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f4efe2'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-f * 12, sh - 2); ctx.lineTo(f * 10, top - 1); ctx.stroke();
  }
  const back = (x2, y2) => { if (!p.sling) arm(-f * 11, sh, x2, y2); };
  switch (pose) {
    case 'cheer': back(-f * (24 - wave), top - 30); arm(f * 11, sh, f * (24 + wave), top - 30); break;
    case 'open': back(-f * 27, sh - 10); arm(f * 11, sh, f * 27, sh - 10); break;
    case 'knock': back(-f * 15, -12); arm(f * 11, sh, f * 26, top - 4 + Math.abs(Math.sin(t * 14)) * 5); break;
    case 'teach': back(-f * 15, -12); arm(f * 11, sh, f * 24, top - 16 + Math.sin(t * 2.4 + ph) * 3); break;
    case 'spade': back(f * 18, sh + 14); arm(f * 11, sh, f * 20, sh + 2); break;
    case 'reins': back(f * 24, sh + 4); arm(f * 11, sh, f * 28, sh + 2); break;
    case 'shrug': back(-f * 24, sh - 6); arm(f * 11, sh, f * 24, sh - 6); break;
    case 'eat': back(-f * 15, -12); arm(f * 11, sh, f * 8, sh + 10 - Math.max(0, Math.sin(t * 5 + ph)) * 18); break;
    case 'toast': back(-f * 15, -12); arm(f * 11, sh, f * 20, top - 26); break;
    case 'sit': back(-f * 4, sh + 12); arm(f * 8, sh, f * 22, -10); break;
    case 'crutch': back(-f * 15 - Math.sin(w) * 4, -12); crutchHand = [f * 16, sh + 16]; arm(f * 11, sh, crutchHand[0], crutchHand[1]); break;
    case 'walk':
      if (p.hold) { back(-f * 15 - Math.sin(w) * 5, -12); arm(f * 11, sh, f * 30, sh - 2); break; }
      back(-f * 15 - Math.sin(w) * 5, -12); arm(f * 11, sh, f * (15 + Math.sin(w) * 5), -12); break;
    default:
      if (p.hold) { back(-f * 15, -12); arm(f * 11, sh, f * 30, sh - 2); break; }
      back(-f * 15, -12); arm(f * 11, sh, f * 15, -12);
  }
  if (p.crutch && !sit) {  // the crutch the servant brought
    const cx = crutchHand ? crutchHand[0] : f * 15;
    drawCrutch(f * 13, sh + 2, cx + f * 6 + Math.sin(w) * 5, 0);
  }
  if (sit && p.needCrutch) { /* nothing to lean on yet */ }
  if (p.bowl && sit) {      // a begging bowl
    ctx.fillStyle = '#b07a44'; ctx.beginPath(); ctx.ellipse(f * 30, -3, 9, 4, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#8a5a2e'; ctx.beginPath(); ctx.ellipse(f * 30, -3, 9, 2.4, 0, 0, TAU); ctx.fill();
  }
  if (p.blind && sit) { ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-f * 22, -2); ctx.lineTo(-f * 6, top - 22); ctx.stroke(); }
  if (pose === 'spade') {   // the new landowner leans on his spade
    ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(f * 20, sh + 2); ctx.lineTo(f * 26, 0); ctx.stroke();
    ctx.fillStyle = '#9aa3ad'; roundRect(f * 26 - 6, -6, 12, 12, 3); ctx.fill();
  }
  if (pose === 'toast') {   // a cup raised at the feast
    ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.moveTo(f * 14, top - 40); ctx.lineTo(f * 26, top - 40); ctx.lineTo(f * 22, top - 28); ctx.lineTo(f * 18, top - 28); ctx.closePath(); ctx.fill();
  }

  // Head (shakes "no" when p.shake is set)
  const hx = p.shake > 0 ? Math.sin(p.shake * 40) * 4 : 0;
  ctx.save();
  ctx.translate(hx, 0);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
  if (p.scarf) {
    ctx.fillStyle = p.scarf;
    if (p.tall) { ctx.beginPath(); ctx.ellipse(0, hy - 16, 15, 10, 0, 0, TAU); ctx.fill(); }
    ctx.beginPath();
    ctx.arc(0, hy - 1, 18, Math.PI * 0.95, Math.PI * 2.05);
    ctx.lineTo(18, hy + 10); ctx.lineTo(13, hy + 4); ctx.lineTo(13, hy - 6);
    ctx.quadraticCurveTo(0, hy - 12, -13, hy - 6); ctx.lineTo(-13, hy + 4); ctx.lineTo(-18, hy + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = p.tall ? '#b58a2a' : shade(p.scarf, -40); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 1, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.arc(0, hy - 2, 16.5, Math.PI * 0.95, Math.PI * 2.05);
    ctx.quadraticCurveTo(6, hy - 11, 0, hy - 10);
    ctx.quadraticCurveTo(-8, hy - 12, -16, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  if (p.headband) { ctx.strokeStyle = p.headband; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, hy - 1, 15.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
  if (p.flower) {           // the bride's flower crown
    for (let k = -2; k <= 2; k++) {
      ctx.fillStyle = ['#ff8fab', '#ffd166', '#ff8fab', '#ffd166', '#ff8fab'][k + 2];
      ctx.beginPath(); ctx.arc(k * 6.5, hy - 14 + Math.abs(k) * 1.6, 3.4, 0, TAU); ctx.fill();
    }
  }
  if (p.hat) {              // a traveller's straw hat
    ctx.fillStyle = '#d8b56a';
    ctx.beginPath(); ctx.ellipse(0, hy - 12, 24, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, hy - 17, 11, 8, 0, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = '#a8803a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-11, hy - 14); ctx.lineTo(11, hy - 14); ctx.stroke();
  }
  if (p.beard) {
    const len = p.longBeard ? 30 : 21;
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.moveTo(-15, hy + 2);
    ctx.quadraticCurveTo(-14, hy + len, 0, hy + len + 1);
    ctx.quadraticCurveTo(14, hy + len, 15, hy + 2);
    ctx.quadraticCurveTo(9, hy + 8, 0, hy + 8);
    ctx.quadraticCurveTo(-9, hy + 8, -15, hy + 2);
    ctx.fill();
  }
  const lx = p.lx !== undefined ? p.lx : f * 0.5;
  const ly = p.ly !== undefined ? p.ly : 0;
  drawFace(p, mood, hy, lx, ly);
  ctx.restore();
  if (pose === 'eat' && Math.sin(t * 5 + ph) > 0.3) {   // a morsel on its way
    ctx.fillStyle = '#d9a35a'; ctx.beginPath(); ctx.arc(f * 8, sh + 6 - Math.max(0, Math.sin(t * 5 + ph)) * 18, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Jesus exactly as in the collection (white robe, red sash, halo), without His cloud, teaching
function drawJesus(j) {
  ctx.save();
  ctx.translate(j.x, j.y);
  ctx.scale(j.s || 1, j.s || 1);
  const teach = j.pose === 'teach';

  // Halo
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
  ctx.shadowColor = '#ffe27a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, -56, 15, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  // Hair (back)
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.ellipse(0, -51, 12.5, 14, 0, 0, TAU); ctx.fill();
  roundRect(-12.5, -52, 25, 16, 6); ctx.fill();

  // Robe with red sash
  ctx.fillStyle = '#fdfcf6'; ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-9, -41);
  ctx.quadraticCurveTo(0, -44, 9, -41);
  ctx.lineTo(15, -2);
  ctx.quadraticCurveTo(0, 2, -15, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(15, -10); ctx.stroke();
  ctx.restore();
  // Feet
  ctx.fillStyle = '#c9905e';
  ctx.beginPath(); ctx.ellipse(-6, 0, 5, 2.6, 0, 0, TAU); ctx.ellipse(7, 0, 5, 2.6, 0, 0, TAU); ctx.fill();

  // Arms: one hand raised as He tells the story, the other open
  const hands = teach ? [[-20, -22], [22, -60 + Math.sin(t * 2.2) * 3]] : [[-20, -22], [20, -22]];
  for (const [hx, hy] of hands) {
    const sx = hx < 0 ? -8 : 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#cfc8b4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.strokeStyle = '#fdfcf6'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(sx, -38); ctx.lineTo(hx * 0.9, hy); ctx.stroke();
    ctx.fillStyle = '#e0a877';
    ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, TAU); ctx.fill();
  }

  // Head
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.arc(0, -52, 10.5, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(0, -53, 11, Math.PI, TAU);
  ctx.quadraticCurveTo(5, -58, 0, -57.5);
  ctx.quadraticCurveTo(-5, -58, -11, -53);
  ctx.fill();
  // beard
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-10, -38, 0, -37);
  ctx.quadraticCurveTo(10, -38, 10, -52);
  ctx.quadraticCurveTo(6, -45, 0, -45.5);
  ctx.quadraticCurveTo(-6, -45, -10, -52);
  ctx.fill();

  // Face
  const dark = '#2b1d12';
  ctx.lineCap = 'round';
  if (j.face === 'joy') {
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.moveTo(4 + 2.4 * Math.cos(Math.PI * 1.1), -52 + 2.4 * Math.sin(Math.PI * 1.1));
    ctx.arc(4, -52, 2.4, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-4, -53, 1.5, 0, TAU); ctx.arc(4, -53, 1.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#e0a877';
  ctx.beginPath(); ctx.ellipse(0, -46, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a2e22'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -47.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  Level setup
// ============================================================
function resetLevelState() {
  cfg = makeConfig(level);
  warmth = 100;
  group = []; folk = []; carts = []; hedges = []; rack = null;
  diners = []; entered = 0; interlude = null; excuse = null; hall = null;
  particles = []; ripples = []; bubbles = [];
  banner = null; hint = null; fade = null;
  flashT = shakeT = 0; endTimer = 0; msgCd = 0;
  stats = { invited: 0, helped: 0, served: 0, wrong: 0 };
  servant = person(SERVANT_LOOK, { apron: true, world: true, carry: 0, tx: null, action: null, busy: 0 });
  master = person(MASTER_LOOK, { world: true, pose: 'open', mood: 'joy', facing: 1 });
  cam.x = 0;
  makeListeners();
}

// ============================================================
//  Speech, banners, hints
// ============================================================
function say(p, text, dur = 3) {
  bubbles = bubbles.filter((b) => b.p !== p);
  bubbles.push({ p, text, t: dur });
}
function setBanner(key, dur = 4) {
  const v = Bible.verse(VERSES[key]);
  banner = { text: v.text, cite: v.cite, t: dur, age: 0 };
}
function setBannerText(text, dur = 3.5) { banner = { text, cite: '', t: dur, age: 0 }; }
function showHint(text, dur = 3.5) { hint = { text, t: dur }; }
function showMessage(text, dur = 2.2) { message = { text, t: dur }; }
function nag(text) { if (msgCd <= 0) { showMessage(text, 1.8); msgCd = 2.2; } }

const JOY_LINES = ['Me? Invited to a feast?', 'A great supper? For us?', 'Oh, how kind!', 'I would love to come!', 'Wonderful! Lead the way!', 'Bless you, friend!', 'Is it really for me?', 'Nobody ever asks me!'];

// ============================================================
//  Scenes
// ============================================================
function fadeTo(next) { if (!fade) fade = { t: 0, next, done: false }; }

function setScene(name) {
  scene = name;
  sceneT = 0;
  particles = [];
  bubbles = [];
  hint = null;
  interlude = null;
  if (name === 'frame') {
    const l = listeners[1];
    say(l, verseText('blessed'), 3.2);
    setBannerText('Jesus is at supper, and tells a story', 3.2);
  } else if (name === 'excuse') {
    excuse = { idx: 0, phase: 'knock', t: 0 };
    makeExcusers();
    setBanner('supper', 4);
    showHint(isTouch() ? 'Tap the door to knock' : 'Tap the door (or press Space) to knock', 5);
  } else if (name === 'city') {
    seenIntro = true;
    makeCity();
    setBanner('quickly', level === 1 ? 6 : 4.5);
    showHint(isTouch() ? 'Tap people by the road to invite them, then lead them back' : 'Tap people (or ← → and Space) to invite them, then lead them back', 6);
  } else if (name === 'hedges') {
    makeCountry();
    setBanner('hedges', 3.5);
    showHint(isTouch() ? 'Tap the hedges and the travellers on the road' : 'Tap hedges and travellers (or ← → and Space)', 5);
  } else if (name === 'seat') {
    makeHall();
    setBannerText('Everyone to the table!', 2.6);
    showHint(isTouch() ? 'Drag each guest to a seat (or tap a seat)' : 'Drag each guest to a seat (or ← → and Space)', 5);
  }
}

// ---------- The framing scene: Jesus at supper, telling the story ----------
function makeListeners() {
  const looks = [
    { robe: '#5a6475', hair: '#2a1a0e', beard: true, skin: '#c88e5a', scarf: '#c9b27a' },
    { robe: '#3c6f9a', hair: '#8a8a8a', beard: true, longBeard: true, skin: '#d9a066', scarf: '#f0e6cc', tall: true },  // the Pharisee who speaks
    { robe: '#b5503f', hair: '#2e1d10', beard: true, skin: '#d7a070' },
    { robe: '#d9a13a', hair: '#6b3f1d', beard: false, skin: '#e3b184' },
    { robe: '#7a4fa0', hair: '#3a2716', beard: true, skin: '#c58a55', scarf: '#e8dcc0' },
    { robe: '#4b7f4b', hair: '#2d1b0f', beard: false, skin: '#bf8150', scarf: '#e6b3c4' },
  ];
  listeners = looks.map((l, k) => person(l, { mood: 'watch', delay: rand(0.05, 0.5), switchT: 0, doubter: k === 0 }));
}

function frameTap() {
  if (sceneT < 0.5) return;
  if (sceneT < 3) { sceneT = 3; return; }          // hurry the listener's line along
  if (sceneT > 3.6) fadeTo('excuse');
}

function updateFrame() {
  if (sceneT >= 3 && !bubbles.some((b) => b.p === 'jesus') && sceneT < 3.2) {
    bubbles = [];
    say('jesus', verseText('supper'), 60);
    showHint(isTouch() ? 'Tap to hear the story' : 'Tap or press Space to hear the story', 60);
  }
}

// ---------- The three excuses ----------
function makeExcusers() {
  excuse.people = [
    person({ robe: '#8a6a3a', hair: '#4a2f1a', beard: true, skin: '#c98d56', hat: true }, { pose: 'spade', mood: 'love', facing: -1 }),
    person({ robe: '#3f6fb5', hair: '#1f140c', beard: true, skin: '#b87a48' }, { pose: 'reins', mood: 'wow', facing: 1 }),
    person({ robe: '#c46b8c', hair: '#2e1d10', beard: false, skin: '#dca678', trim: '#f2c94c' }, { pose: 'shrug', mood: 'love', facing: 1 }),
  ];
  excuse.bride = person({ robe: '#fdf6e8', hair: '#5c3a1c', skin: '#e3b184', woman: true, veil: true, flower: true, trim: '#f2c94c' }, { mood: 'love', facing: -1 });
}

const EXCUSE_KEYS = ['ground', 'oxen', 'wife'];
function excuseTap() {
  const e = excuse;
  if (e.phase === 'knock') {
    e.phase = 'ask'; e.t = 0;
    sfx.knock();
    servant.pose = 'stand';
    say(servant, verseText('ready'), 2.2);
    hint = null;
  } else if (e.phase === 'ask' && e.t > 0.6) {
    e.t = 1.6;       // skip ahead to the reply
  } else if (e.phase === 'reply' && e.t > 0.8) {
    if (e.idx < 2) {
      e.idx++; e.phase = 'knock'; e.t = 0; bubbles = [];
      servant.mood = 'watch';
      showHint(isTouch() ? 'Tap the next door' : 'Tap the next door (or Space)', 3);
    } else {
      e.phase = 'done'; e.t = 0; bubbles = [];
      servant.mood = 'worried';
      say(master, verseText('quickly'), 60);
      showHint(isTouch() ? 'Tap to go out quickly!' : 'Tap or press Space to go out quickly!', 60);
    }
  } else if (e.phase === 'done' && e.t > 0.8) {
    fadeTo('city');
  }
}

function updateExcuse(dt) {
  const e = excuse;
  e.t += dt;
  if (e.phase === 'knock') servant.pose = 'knock';
  if (e.phase === 'ask' && e.t > 1.6) {
    e.phase = 'reply'; e.t = 0;
    const p = e.people[e.idx];
    say(p, verseText(EXCUSE_KEYS[e.idx]), 60);
    servant.mood = 'shock';
    sfx.boing();
    if (e.idx === 2) say(e.bride, 'Hee hee!', 2);
  }
  if (e.phase === 'reply' && e.t > 1.2 && !hint) showHint(isTouch() ? 'Tap to carry on' : 'Tap or press Space to carry on', 60);
  // little comic motions
  const p = e.people[e.idx];
  if (e.idx === 1 && (e.phase === 'reply' || e.phase === 'ask')) p.pose = 'reins';
  if (e.idx === 2) p.mood = 'love';
}

// ---------- The town and the country: inviting and leading guests ----------
function worldLen() { return scene === 'city' ? cfg.cityLen : cfg.countryLen; }

function newGuest(kind, x, extra) {
  const look = randomLook();
  const g = person(look, { world: true, kind, x, y: SIT_Y, pose: 'sit', mood: 'sad', facing: -1, state: 'wait', ...extra });
  if (kind === 'poor') { g.patch = true; g.bowl = true; }
  if (kind === 'maimed') g.sling = true;
  if (kind === 'halt') { g.needCrutch = true; g.patch = Math.random() < 0.5; }
  if (kind === 'blind') g.blind = true;
  return g;
}

function makeCity() {
  const n = cfg.cityN;
  const kinds = [];
  for (let k = 0; k < cfg.halt; k++) kinds.push('halt');
  for (let k = 0; k < cfg.blind; k++) kinds.push('blind');
  while (kinds.length < n) kinds.push(kinds.length % 2 ? 'maimed' : 'poor');
  kinds.length = n;
  for (let k = kinds.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [kinds[k], kinds[j]] = [kinds[j], kinds[k]]; }
  // Evenly spaced slots along the street for the people, the carpenter and the cart crossings
  const count = n + cfg.carts + 1;
  const x0 = HOUSE_R + 250, x1 = cfg.cityLen - 110;
  const slots = Array.from({ length: count }, (_, k) => lerp(x0, x1, count === 1 ? 0.5 : k / (count - 1)));
  const rackSlot = Math.round((count - 1) * 0.3);
  rack = { x: slots[rackSlot] };
  const free = slots.filter((_, k) => k !== rackSlot);
  const cartSlots = new Set();
  while (cartSlots.size < cfg.carts) cartSlots.add(1 + Math.floor(Math.random() * (free.length - 1)));
  folk = []; carts = [];
  let kk = 0;
  free.forEach((x, k) => {
    if (cartSlots.has(k)) carts.push({ x, state: 'wait', t: rand(1.5, 4), p: 0 });
    else folk.push(newGuest(kinds[kk++], x + rand(-30, 30)));
  });
  servant.x = HOUSE_R + 30; servant.y = LANE; servant.facing = 1; servant.tx = null; servant.action = null;
  servant.carry = 0; servant.pose = 'stand'; servant.mood = 'watch'; servant.world = true; servant.s = CH;
  master.world = true; master.s = CH; master.pose = 'open'; master.mood = 'joy';
  master.x = DOOR_X + 46; master.y = LANE - 8; master.facing = 1;
  group = []; entered = 0;
  cam.x = 0;
}

function makeCountry() {
  const n = cfg.hedgeN;
  const walkers = Math.floor(n / 2);
  const hidden = n - walkers;
  const count = hidden + cfg.decoys;
  const x0 = HOUSE_R + 300, x1 = cfg.countryLen - 110;
  const types = [];
  for (let k = 0; k < hidden; k++) types.push('person');
  for (let k = 0; k < cfg.decoys; k++) types.push(k % 2 ? 'rabbit' : 'bird');
  for (let k = types.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [types[k], types[j]] = [types[j], types[k]]; }
  hedges = types.map((ty, k) => {
    const x = lerp(x0, x1, count === 1 ? 0.5 : k / (count - 1)) + rand(-20, 20);
    const h = { x, w: rand(120, 150), animal: ty === 'person' ? null : ty, person: null, done: false, rustle: rand(0, 3), pop: 0 };
    if (ty === 'person') {
      h.person = newGuest('hedge', x + rand(-18, 18), { y: LANE - 30, pose: 'stand', mood: 'watch', calls: 0, hidden: true, hat: Math.random() < 0.5, bundle: Math.random() < 0.4 });
      h.person.patch = Math.random() < 0.5;
    }
    return h;
  });
  folk = [];
  for (let k = 0; k < walkers; k++) {
    const g = newGuest('traveller', lerp(x0 + 150, x1, (k + 0.5) / walkers), {
      y: LANE, pose: 'walk', mood: 'watch', dir: Math.random() < 0.5 ? -1 : 1, v: rand(30, 48), stopped: false,
    });
    g.hat = Math.random() < 0.6; g.bundle = !g.hat || Math.random() < 0.5; g.crook = !g.bundle;
    folk.push(g);
  }
  servant.x = HOUSE_R + 30; servant.facing = 1; servant.tx = null; servant.action = null; servant.carry = 0;
  servant.pose = 'stand'; servant.mood = 'joy'; servant.world = true; servant.s = CH;
  master.world = true; master.s = CH;
  master.x = DOOR_X + 46; master.facing = 1; master.pose = 'open'; master.mood = 'joy';
  group = []; entered = 0;
  cam.x = 0;
}

// Is the lane blocked at x by a crossing donkey cart?
function cartBlocking(c) { return c.state === 'cross' && c.p > 0.22 && c.p < 0.82; }
function blockedMove(x0, x1) {
  for (const c of carts) {
    if (!cartBlocking(c)) continue;
    const l = c.x - 52, r = c.x + 52;
    if (x0 <= l && x1 > l) return l;
    if (x0 >= r && x1 < r) return r;
  }
  return x1;
}

function updateCarts(dt) {
  for (const c of carts) {
    if (c.state === 'wait') {
      c.t -= dt;
      if (c.t <= 0) {
        // the carter waits politely until nobody is in the crossing
        const busy = [servant, ...group].some((p) => Math.abs(p.x - c.x) < 60);
        if (!busy) {
          c.state = 'cross'; c.p = 0;
          if (Math.abs(c.x - cam.x - W / 2) < W * 0.7) sfx.heehaw();
        }
      }
    } else {
      c.p += dt / CROSS_T;
      if (c.p >= 1) { c.state = 'wait'; c.t = rand(2.5, 5.5); }
    }
  }
}

// Tap in the town or the fields: invite someone, fetch a crutch, call into a hedge, or walk
function worldTap(x, y) {
  if (interlude) { skipInterlude(); return; }
  const wx = x + cam.x;
  const sv = servant;
  // a person?
  let bestP = null, bestD = 1e9;
  for (const p of folk) {
    if (p.state !== 'wait') continue;
    const hx = p.x, hy = p.y - (p.pose === 'sit' ? 40 : 50) * p.s;
    const d = Math.hypot(wx - hx, y - hy);
    if (d < 62 && d < bestD) { bestD = d; bestP = p; }
  }
  if (bestP) {
    if (bestP.kind === 'traveller' && !bestP.stopped) {
      bestP.stopped = true; bestP.mood = 'wow'; bestP.pose = 'stand'; bestP.facing = sv.x < bestP.x ? -1 : 1;
      say(bestP, 'Who, me?', 1.6);
    }
    goTo(bestP.x + (sv.x < bestP.x ? -38 : 38), { type: 'invite', p: bestP });
    return;
  }
  // the crutch rack?
  if (rack && Math.abs(wx - rack.x) < 60 && y > LANE - 200 && y < LANE - 20) { goTo(rack.x, { type: 'rack' }); return; }
  // a hedge?
  for (const h of hedges) {
    if (h.done) continue;
    if (Math.abs(wx - h.x) < h.w / 2 + 6 && y > LANE - 150 && y < LANE - 5) { goTo(h.x, { type: 'hedge', h }); return; }
  }
  // otherwise just walk there
  goTo(clamp(wx, 70, worldLen() - 40), null);
}

function goTo(x, action) { servant.tx = x; servant.action = action; }

// Keyboard: Space acts on whatever is nearest the servant
function keyInteract() {
  if (interlude) { skipInterlude(); return; }
  const sv = servant;
  let bestA = null, bestD = 90;
  for (const p of folk) {
    if (p.state !== 'wait') continue;
    const d = Math.abs(p.x - sv.x);
    if (d < bestD) { bestD = d; bestA = { type: 'invite', p }; }
  }
  if (rack && Math.abs(rack.x - sv.x) < Math.min(bestD, 70)) { bestD = Math.abs(rack.x - sv.x); bestA = { type: 'rack' }; }
  for (const h of hedges) {
    if (!h.done && Math.abs(h.x - sv.x) < Math.min(bestD, h.w / 2 + 20)) { bestD = Math.abs(h.x - sv.x); bestA = { type: 'hedge', h }; }
  }
  if (bestA) doAction(bestA);
  else nag(scene === 'city' ? 'Walk up to someone first' : 'Walk up to a hedge or a traveller');
}

function doAction(a) {
  const sv = servant;
  if (a.type === 'invite') invite(a.p);
  else if (a.type === 'rack') {
    if (sv.carry >= cfg.carry) { nag(cfg.carry > 1 ? 'Your arms are full of crutches!' : 'You can carry one crutch at a time'); return; }
    sv.carry = cfg.carry;
    sfx.clack();
    say(sv, cfg.carry > 1 ? 'Two good crutches!' : 'A good strong crutch!', 1.6);
    sparkle(rack.x, LANE - 90, '#e0b070', 10);
  } else if (a.type === 'hedge') callHedge(a.h);
}

function invite(p) {
  const sv = servant;
  if (p.state !== 'wait') return;
  sv.facing = p.x > sv.x ? 1 : -1;
  if (p.kind === 'halt' && p.needCrutch) {
    if (sv.carry <= 0) {
      say(p, 'I would love to come, but I cannot walk so far…', 2.6);
      p.mood = 'worried';
      showHint('Fetch a crutch from the carpenter\'s shop!', 3.5);
      return;
    }
    sv.carry--;
    p.needCrutch = false; p.crutch = true;
    stats.helped++;
    sfx.clack();
  }
  if (p.kind === 'blind') {
    say(sv, 'Take my hand, friend!', 1.8);
    p.hold = true;
    sv.busy = 0.5;
    stats.helped++;
  }
  if (p.kind === 'hedge' && p.hidden) return;
  p.state = 'join';
  p.pose = p.crutch ? 'crutch' : 'walk';
  p.y = LANE; p.mood = 'joy';
  p.stopped = true;
  group.push(p);
  stats.invited++;
  if (p.kind !== 'blind') say(p, pick(JOY_LINES), 1.8);
  else say(p, 'A feast! Lead me there!', 1.8);
  sfx.ding();
  sparkle(p.x, p.y - 60, '#ffe27a', 14);
}

function callHedge(h) {
  const sv = servant;
  sv.facing = h.x > sv.x ? 1 : -1;
  if (h.animal) {
    h.done = true; h.pop = 1;
    showMessage(h.animal === 'bird' ? 'Just a sparrow!' : 'Only a rabbit!', 1.6);
    if (h.animal === 'bird') sfx.chirp(); else sfx.boing();
    return;
  }
  const p = h.person;
  if (!p) return;
  p.calls++;
  if (p.calls < cfg.shy) {
    p.peek = 1; p.mood = 'wow';
    say(sv, 'You there! You are invited to a great supper!', 2);
    say(p, 'Who, me? Surely not…', 2);
    sfx.knock();
    return;
  }
  say(sv, p.calls > 1 ? 'Yes, you! Please come in!' : 'You are invited to a great supper!', 1.8);
  h.person = null; h.done = true; h.pop = 1;
  p.hidden = false;
  folk.push(p);
  invite(p);
}

// Walking, the growing line of guests, and bringing them home
function updateWorld(dt) {
  const sv = servant;
  if (interlude) { updateInterlude(dt); }
  const kl = keys.has('ArrowLeft') || keys.has('KeyA'), kr = keys.has('ArrowRight') || keys.has('KeyD');
  let dir = 0;
  if (!interlude) {
    if (kl !== kr) { dir = kl ? -1 : 1; sv.tx = null; sv.action = null; }
    else if (sv.tx !== null) {
      const d = sv.tx - sv.x;
      if (Math.abs(d) < 3) { sv.tx = null; const a = sv.action; sv.action = null; if (a) doAction(a); }
      else dir = Math.sign(d);
    }
  }
  if (sv.busy > 0) { sv.busy -= dt; dir = 0; }
  const v = SERV_V * (1 - 0.025 * Math.min(group.length, 8));
  let moved = false;
  if (dir) {
    let nx = sv.x + dir * v * dt;
    if (sv.tx !== null && (sv.tx - nx) * dir < 0) nx = sv.tx;
    const bx = blockedMove(sv.x, nx);
    if (bx !== nx) { nag('Whoa! Wait for the cart!'); nx = bx - dir * 0.01; }
    nx = clamp(nx, 60, worldLen() - 40);
    moved = Math.abs(nx - sv.x) > 0.01;
    sv.x = nx; sv.facing = dir;
  }
  if (moved) { sv.walkT += dt * 11; sv.pose = 'walk'; } else if (sv.pose === 'walk') sv.pose = 'stand';

  // The line follows: each guest keeps a little behind the one ahead
  for (let i = 0; i < group.length; i++) {
    const g = group[i];
    if (g.state === 'enter') continue;
    const ahead = i === 0 ? sv : group[i - 1];
    const d = ahead.x - g.x;
    const want = Math.abs(d) - GAP;
    if (want > 0.5) {
      const step = Math.min(v * 1.15 * dt, want);
      g.x = blockedMove(g.x, g.x + Math.sign(d) * step);
      g.facing = Math.sign(d) || g.facing;
      g.walkT += dt * 11;
      g.pose = g.crutch ? 'crutch' : 'walk';
    } else {
      g.pose = g.crutch ? 'crutch' : 'stand';
      if (g.pose === 'crutch') g.walkT = 0;
    }
  }

  // Close to the house: everyone in the line goes in through the door
  if (sv.x < HOME_ZONE && group.some((g) => g.state === 'join')) {
    for (const g of group) if (g.state === 'join') g.state = 'enter';
    master.mood = 'joy';
  }
  for (let i = group.length - 1; i >= 0; i--) {
    const g = group[i];
    if (g.state !== 'enter') continue;
    const d = DOOR_X - g.x;
    g.facing = Math.sign(d) || -1;
    g.x += Math.sign(d) * Math.min(170 * dt, Math.abs(d));
    g.walkT += dt * 11;
    g.pose = g.crutch ? 'crutch' : 'walk';
    if (Math.abs(d) < 4) {
      g.state = 'in';
      group.splice(i, 1);
      folk.splice(folk.indexOf(g), 1);
      diners.push(g);
      entered++;
      sfx.tap(entered / (scene === 'city' ? cfg.cityN : cfg.hedgeN));
      sparkle(DOOR_X, LANE - 60, '#fff6d0', 12);
      showMessage(pick(['Welcome!', 'Come in, come in!', 'A seat for you!', 'Welcome, friend!']), 1.2);
      say(master, 'Welcome!', 1);
    }
  }

  // Travellers stroll along the highway until someone stops them
  for (const p of folk) {
    if (p.kind !== 'traveller' || p.state !== 'wait') continue;
    if (p.stopped) { p.pose = 'stand'; continue; }
    p.x += p.dir * p.v * dt;
    p.walkT += dt * 7;
    p.facing = p.dir;
    if (p.x < HOUSE_R + 250) p.dir = 1;
    if (p.x > worldLen() - 80) p.dir = -1;
  }
  // Waiting folk look up hopefully when the servant comes near
  for (const p of folk) {
    if (p.state !== 'wait' || p.kind === 'traveller' || p.hidden) continue;
    const near = Math.abs(p.x - sv.x) < 170;
    if (p.mood !== 'worried' || !near) p.mood = near ? 'wow' : 'sad';
    p.facing = sv.x < p.x ? -1 : 1;
  }
  for (const h of hedges) {
    h.rustle -= dt;
    if (h.rustle < -0.5) h.rustle = rand(1.5, 4);
    h.pop = Math.max(0, h.pop - dt * 0.8);
    if (h.person) h.person.peek = Math.max(0, (h.person.peek || 0) - dt * 0.25);
  }

  updateCarts(dt);

  // Camera follows the servant
  const target = clamp(sv.x - W * 0.42, 0, Math.max(0, worldLen() - W));
  cam.x += (target - cam.x) * Math.min(1, dt * 6);

  // Everyone from this place is in
  const need = scene === 'city' ? cfg.cityN : cfg.hedgeN;
  if (!interlude && entered >= need) startInterlude(scene === 'city' ? 'room' : 'full');
}

// Short story beats: "yet there is room" -> "go out into the highways and hedges"
function startInterlude(kind) {
  interlude = { kind, t: 0, step: 0 };
  hint = null;
  servant.tx = null; servant.action = null;
  if (kind === 'room') {
    say(servant, verseText('room'), 4);
    servant.mood = 'joy';
  } else {
    showMessage('Every seat will be filled!', 2.4);
  }
  sfx.levelStart();
}
function skipInterlude() {
  const it = interlude;
  if (!it) return;
  if (it.kind === 'room') {
    if (it.step === 0 && it.t > 0.6) it.t = 3.6;
    else if (it.step === 1 && it.t > 4.4) fadeTo('hedges');
  } else if (it.t > 0.6) it.t = 2.2;
}
function updateInterlude(dt) {
  const it = interlude;
  it.t += dt;
  if (it.kind === 'room') {
    if (it.step === 0 && it.t >= 3.6) {
      it.step = 1;
      say(master, verseText('hedges'), 60);
      showHint(isTouch() ? 'Tap to go out again' : 'Tap or press Space to go out again', 60);
    }
    if (it.step === 1 && it.t >= 12) fadeTo('hedges');
  } else if (it.t >= 2.2) fadeTo('seat');
}

// ---------- The banquet: seat every guest, then serve the food ----------
const DISHES = ['bread', 'fish', 'grapes', 'cake'];
const DISH_NAMES = { bread: 'bread', fish: 'fish', grapes: 'grapes', cake: 'honey cake' };
const NO_LINES = ['Hmm, not that one…', 'Maybe something else?', 'Oh! I was hoping for another dish', 'Not quite, friend!'];

function hallLayout() {
  const n = cfg.seats;
  const narrow = W < 700;
  const rows = n > 7 ? 2 : 1;
  const per = rows === 1 ? [n] : [Math.ceil(n / 2), Math.floor(n / 2)];
  const tableY = rows === 1 ? [540] : [455, 660];
  const s = narrow ? 0.92 : 1.4;
  const x0 = narrow ? 26 : 60, x1 = narrow ? W - 26 : W - 150;
  const seats = [];
  per.forEach((m, r) => {
    for (let k = 0; k < m; k++) {
      // the front table is a little offset so heads don't line up behind each other
      const f = (k + 0.5 + (r ? 0.25 : 0)) / (m + (r ? 0.5 : 0));
      seats.push({ x: lerp(x0, x1, f), ty: tableY[r], y: tableY[r] + 10, row: r });
    }
  });
  const host = narrow ? { x: W - 44, y: 330 } : { x: W - 80, y: tableY[0] + 10 };
  return { narrow, rows, tableY, s, x0, x1, seats, host, qy: 858, qs: narrow ? 0.82 : 1.15, trayY: 818 };
}

function makeHall() {
  const L = hallLayout();
  hall = {
    phase: 'seat', seats: L.seats.map((st) => ({ ...st, guest: null })),
    queue: diners.slice(), drag: null, sel: null, cursor: 0, flying: [], feastT: 0,
    dishes: DISHES.slice(0, cfg.dishes).map((k) => ({ k, x: 0, y: 0, back: null })),
  };
  for (const g of diners) {
    g.world = false; g.hold = false; g.dim = false; g.seat = null; g.wish = null; g.plates = [];
    g.mood = 'joy'; g.pose = 'stand'; g.facing = 1;
  }
  master.world = false; master.pose = 'open'; master.mood = 'joy'; master.facing = L.narrow ? 1 : -1;
  layoutQueue(true);
  layoutDishes();
}

function layoutQueue(snap) {
  const L = hallLayout();
  const sp = L.narrow ? 54 : 78;
  hall.queue.forEach((g, k) => {
    g.qx = 44 + k * sp; g.qy = L.qy; g.s = L.qs;
    if (snap) { g.x = g.qx; g.y = g.qy; }
  });
}
function layoutDishes() {
  const L = hallLayout();
  const n = hall.dishes.length, sp = L.narrow ? 100 : 130;
  hall.dishes.forEach((d, k) => { d.hx = W / 2 + (k - (n - 1) / 2) * sp; d.hy = L.trayY; if (!(hall.drag && hall.drag.obj === d) && !d.back) { d.x = d.hx; d.y = d.hy; } });
}

function queueVisible(g) {
  const sp = hallLayout().narrow ? 54 : 78;
  return g.qx <= W - sp * 0.6;
}

function seatGuest(g, seat) {
  if (!g || !seat || seat.guest) return;
  const i = hall.queue.indexOf(g);
  if (i < 0) return;
  hall.queue.splice(i, 1);
  seat.guest = g; g.seat = seat;
  g.anim = { t: 0, x0: g.x, y0: g.y };
  g.s = hallLayout().s;
  g.mood = 'joy';
  hall.sel = null;
  sfx.tap(1 - hall.queue.length / cfg.seats);
  sparkle(seat.x, seat.ty - 60, '#ffe27a', 10);
  if (Math.random() < 0.5) say(g, pick(['What a feast!', 'Thank you!', 'A real seat!', 'Oh my!', 'For me?']), 1.2);
  if (!hall.queue.length) startServing();
  else { const nxt = nextSeat(hall.cursor); if (nxt >= 0) hall.cursor = nxt; }
}

function nextSeat(from, dir = 1, wantGuest = false) {
  const n = hall.seats.length;
  for (let k = 0; k < n; k++) {
    const i = ((from + k * dir) % n + n) % n;
    const st = hall.seats[i];
    if (wantGuest ? (st.guest && st.guest.wish) : !st.guest) return i;
  }
  return -1;
}

function startServing() {
  hall.phase = 'serve';
  hall.sel = null;
  let k = 0;
  for (const st of hall.seats) {
    const g = st.guest;
    g.need = 1 + (Math.random() < cfg.seconds ? 1 : 0);
    g.wish = pick(hall.dishes).k;
    g.wishDelay = 0.4 + k++ * 0.18;
  }
  hall.cursor = 0;
  setBannerText('Now serve the supper!', 2.4);
  showHint(isTouch() ? 'Drag the food each guest is hoping for (or tap food, then guest)' : 'Drag food to guests, or pick a seat with ← → and press 1–' + cfg.dishes, 6);
}

function serve(g, k) {
  if (!g || !g.wish || g.wishDelay > 0 || state !== 'play') return false;
  if (k !== g.wish) {
    g.shake = 0.6;
    say(g, pick(NO_LINES), 1.4);
    stats.wrong++;
    warmth = Math.max(0, warmth - 2);
    sfx.boing();
    return false;
  }
  g.plates.push(k);
  g.need--;
  stats.served++;
  g.munch = 2.2;
  sfx.clink();
  sparkle(g.seat.x, g.seat.ty - 20, '#fff6d0', 10);
  if (g.need > 0) {
    const others = hall.dishes.map((d) => d.k).filter((d) => d !== k);
    g.wish = pick(others.length ? others : [k]);
    g.wishDelay = 1.4;
    say(g, 'Delicious! Is there any more?', 1.4);
  } else {
    g.wish = null;
    if (Math.random() < 0.45) say(g, pick(['Delicious!', 'Mmm!', 'So good!', 'A feast for a king!']), 1.2);
  }
  if (hall.seats.every((st) => st.guest && !st.guest.wish && st.guest.need <= 0)) startFeast();
  return true;
}

function flyDish(d, g) {
  if (!g || !g.wish || g.wishDelay > 0) return;
  hall.flying.push({ k: d.k, x0: d.x, y0: d.y, g, t: 0 });
  hall.sel = null;
}

function startFeast() {
  hall.phase = 'feast';
  hall.feastT = 0;
  hint = null;
  master.pose = 'toast'; master.mood = 'joy';
  say(master, 'My house is filled! Let us feast!', 2.4);
}

function hallGuestAt(x, y) {
  let best = null, bd = 1e9;
  for (const st of hall.seats) {
    const g = st.guest;
    if (!g || g.anim) continue;
    const hy = st.ty - 42 * g.s;
    const d = Math.hypot(x - st.x, (y - hy) * 0.7);
    if (d < 46 && d < bd) { bd = d; best = g; }
    // the wish bubble counts too
    if (g.wish && Math.hypot(x - (st.x + 18), y - (st.ty - 100 * g.s)) < 26) { best = g; bd = 0; }
  }
  return best;
}
function hallSeatAt(x, y, empty = true) {
  let best = null, bd = 1e9;
  for (const st of hall.seats) {
    if (empty && st.guest) continue;
    const d = Math.hypot(x - st.x, (y - (st.ty - 30)) * 0.6);
    if (d < 52 && d < bd) { bd = d; best = st; }
  }
  return best;
}

function hallDown(x, y, id) {
  if (hall.phase === 'seat') {
    for (const g of hall.queue) {
      if (!queueVisible(g)) continue;
      if (Math.abs(x - g.x) < 26 && y > g.y - 80 * g.s && y < g.y + 10) {
        hall.drag = { obj: g, kind: 'guest', ox: g.x - x, oy: g.y - y, sx: x, sy: y, moved: false, id };
        return;
      }
    }
    const st = hallSeatAt(x, y);
    if (st) { seatGuest(hall.sel && hall.sel.kind === 'guest' ? hall.sel.obj : hall.queue[0], st); return; }
  } else if (hall.phase === 'serve') {
    for (const d of hall.dishes) {
      if (Math.hypot(x - d.x, y - d.y) < 42) {
        hall.drag = { obj: d, kind: 'dish', ox: d.x - x, oy: d.y - y, sx: x, sy: y, moved: false, id };
        d.back = null;
        return;
      }
    }
    const g = hallGuestAt(x, y);
    if (g && hall.sel && hall.sel.kind === 'dish') { flyDish(hall.sel.obj, g); return; }
    if (g && g.wish) nag(`Bring the ${DISH_NAMES[g.wish]}!`);
  }
}
function hallMove(x, y, id) {
  const dr = hall && hall.drag;
  if (!dr || dr.id !== id) return;
  dr.obj.x = x + dr.ox; dr.obj.y = y + dr.oy;
  if (Math.hypot(x - dr.sx, y - dr.sy) > 12) dr.moved = true;
}
function hallUp(x, y, id) {
  const dr = hall && hall.drag;
  if (!dr || dr.id !== id) return;
  hall.drag = null;
  const o = dr.obj;
  if (dr.kind === 'guest') {
    if (!dr.moved) { hall.sel = hall.sel && hall.sel.obj === o ? null : { kind: 'guest', obj: o }; o.x = o.qx; o.y = o.qy; return; }
    const st = hallSeatAt(o.x, o.y - 40 * o.s);
    if (st && state === 'play') seatGuest(o, st);
    else o.anim = { t: 0, x0: o.x, y0: o.y, back: true };
  } else {
    if (!dr.moved) { hall.sel = hall.sel && hall.sel.obj === o ? null : { kind: 'dish', obj: o }; o.x = o.hx; o.y = o.hy; return; }
    const g = hallGuestAt(o.x, o.y);
    if (g && state === 'play') serve(g, o.k);
    o.back = { t: 0, x0: o.x, y0: o.y };
  }
}

// Keyboard at the table: ← → choose a seat, Space seats the next guest, 1–4 serve a dish
function hallKey(code) {
  hall.keyUsed = true;
  if (hall.phase === 'seat') {
    if (code === 'ArrowLeft' || code === 'ArrowRight') {
      const nx = nextSeat(hall.cursor + (code === 'ArrowRight' ? 1 : -1), code === 'ArrowRight' ? 1 : -1);
      if (nx >= 0) hall.cursor = nx;
    } else if (code === 'Space' || code === 'Enter') {
      let st = hall.seats[hall.cursor];
      if (st.guest) { const nx = nextSeat(hall.cursor); st = nx >= 0 ? hall.seats[nx] : null; }
      if (st) seatGuest(hall.queue[0], st);
    }
  } else if (hall.phase === 'serve') {
    if (code === 'ArrowLeft' || code === 'ArrowRight') {
      const nx = nextSeat(hall.cursor + (code === 'ArrowRight' ? 1 : -1), code === 'ArrowRight' ? 1 : -1, true);
      if (nx >= 0) hall.cursor = nx;
    } else if (/^Digit[1-4]$/.test(code)) {
      const d = hall.dishes[+code.slice(5) - 1];
      const st = hall.seats[hall.cursor];
      if (d && st && st.guest) flyDish(d, st.guest);
    } else if ((code === 'Space' || code === 'Enter') && hall.sel && hall.sel.kind === 'dish') {
      const st = hall.seats[hall.cursor];
      if (st && st.guest) flyDish(hall.sel.obj, st.guest);
    }
  }
}

function updateHall(dt) {
  const L = hallLayout();
  layoutQueue(false);
  layoutDishes();
  // guests walk to their seat or back into the queue
  for (const g of diners) {
    if (hall.drag && hall.drag.obj === g) continue;
    if (g.anim) {
      g.anim.t += dt / 0.45;
      const tx = g.seat ? g.seat.x : g.qx, ty = g.seat ? g.seat.y : g.qy;
      const f = ease(clamp(g.anim.t, 0, 1));
      g.x = lerp(g.anim.x0, tx, f); g.y = lerp(g.anim.y0, ty, f) - Math.sin(f * Math.PI) * 30;
      if (g.anim.t >= 1) g.anim = null;
    } else if (!g.seat) {
      g.x += (g.qx - g.x) * Math.min(1, dt * 8); g.y = g.qy;
    } else { g.x = g.seat.x; g.y = g.seat.y; }
    if (g.wishDelay > 0) g.wishDelay -= dt;
    if (g.munch > 0) g.munch -= dt;
    g.shake = Math.max(0, (g.shake || 0) - dt);
    g.pose = g.munch > 0 ? 'eat' : hall.phase === 'feast' ? (g.i % 3 === 0 ? 'cheer' : 'eat') : 'stand';
    g.mood = state === 'fail' ? (g.seat ? 'worried' : 'dismay') : g.shake > 0 ? 'doubt' : (g.munch > 0 || (hall.phase === 'feast' && g.i % 3)) ? 'munch' : g.wish && g.wishDelay <= 0 ? 'wow' : 'joy';
    if (g.need === undefined || g.munch > 0 || hall.phase === 'feast') g.facing = 1;
  }
  for (const d of hall.dishes) {
    if (!d.back) continue;
    d.back.t += dt / 0.3;
    const f = ease(clamp(d.back.t, 0, 1));
    d.x = lerp(d.back.x0, d.hx, f); d.y = lerp(d.back.y0, d.hy, f);
    if (d.back.t >= 1) d.back = null;
  }
  for (let i = hall.flying.length - 1; i >= 0; i--) {
    const fl = hall.flying[i];
    fl.t += dt / 0.35;
    if (fl.t >= 1) { hall.flying.splice(i, 1); serve(fl.g, fl.k); }
  }
  master.x = L.host.x; master.y = L.host.y; master.s = L.s * 1.05;
  if (hall.phase === 'feast') {
    hall.feastT += dt;
    if (Math.random() < dt * 14) confetti(rand(0, W), -20);
    if (hall.feastT > 1.8 && state === 'play') win();
  }
}

// ============================================================
//  Win / fail
// ============================================================
function win() {
  state = 'win';
  const invited = stats.invited * 100;
  const helped = stats.helped * 50;
  const served = Math.max(0, stats.served * 50 - stats.wrong * 20);
  const warm = Math.round(warmth * 10);
  const levelBonus = level * 500;
  const score = invited + helped + served + warm + levelBonus;
  totalScore += score;
  if (totalScore > best) { best = totalScore; try { localStorage.setItem('banquetBest', best); } catch (e) {} }
  lastScore = { invited, helped, served, warm, levelBonus, score };
  for (let i = 0; i < 90; i++) confetti(rand(0, W), rand(-60, 300));
  showMessage('Every seat is filled!', 3);
  sfx.win();
  endTimer = 2.8;
}

function fail(reason) {
  state = 'fail';
  failReason = reason;
  servant.mood = 'dismay'; master.mood = 'worried'; master.pose = 'stand';
  for (const g of group) g.mood = 'worried';
  for (const g of diners) g.mood = 'worried';
  hint = null;
  showMessage('Oh dear, the supper went cold!', 2.4);
  sfx.fail();
  endTimer = 1.8;
}

// ============================================================
//  Particles
// ============================================================
function spawn(x, y, vx, vy, life, color, size, grav = 0, kind = 'dot') {
  if (particles.length > 500) return;
  const world = scene === 'city' || scene === 'hedges';
  particles.push({ x, y, vx, vy, life, max: life, color, size, grav, kind, world, rot: rand(0, TAU) });
}
function sparkle(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(30, 120);
    spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 30, rand(0.5, 1.1), Math.random() < 0.5 ? color : '#ffffff', rand(2, 4), 60);
  }
}
function confetti(x, y) {
  spawn(x, y, rand(-40, 40), rand(40, 120), rand(2, 3.5), pick(['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#f783ac', '#ffa94d']), rand(3, 5), 20, 'confetti');
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += dt * 4;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max * 1.5, 0, 1);
    const x = p.x - (p.world ? cam.x : 0);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'confetti') {
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const ovBtn2 = document.getElementById('ovBtn2');

// btn2 / action2 add an optional second, smaller button
function showOverlay(title, sub, body, btn, action, btn2 = null, action2 = null) {

// skipIntro: a retry starts in the streets instead of with the story and the excuses
function startLevel(skipIntro = false) {
  resetLevelState();
  state = 'play';
  hideOverlay();
  if (!skipIntro) seenIntro = false;
  setScene(skipIntro ? 'city' : 'frame');
  showMessage(`Level ${level}: ${cfg.name}`);
  sfx.levelStart();
}

function restartLevel() { startLevel(seenIntro); }

function endScreens(dt) {
  if (endTimer <= 0) return;
  endTimer -= dt;
  if (endTimer > 0) return;
  if (state === 'win') {
    const s = lastScore;
    showOverlay('The house is filled!', `Level ${level} complete — ${cfg.name}`,
      `${verseHTML('filled')}
       <p class="score">Guests invited: <b>${s.invited}</b><br>Helping hands &amp; crutches: <b>${s.helped}</b><br>Dishes served: <b>${s.served}</b><br>Supper still warm: <b>${s.warm}</b><br>Level bonus: <b>${s.levelBonus}</b></p>
       <p class="score" style="font-size:1.3rem">Total: <b>${totalScore}</b> &nbsp;&middot;&nbsp; Best: <b>${best}</b></p>
       ${creditHTML()}`,
      'Next Level', () => { level++; startLevel(false); });
  } else if (state === 'fail') {
    showOverlay('Oh… no', `Level ${level} — ${cfg.name}`,
      `<p style="text-align:center">The supper went cold before every seat was filled. No excuses &mdash; hurry out and try again!</p>
       ${verseHTML('consent')}
       <p class="score">Score so far: <b>${totalScore}</b></p>`,
      'Try Again', () => startLevel(true));

}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
    if (hall) hall.drag = null;
    keys.clear();
    showOverlay('Paused', `Level ${level} — ${cfg.name}`,
      '<p style="text-align:center">Take a breath. Press <kbd>P</kbd> to carry on, or <kbd>R</kbd> to restart the level.</p>',
      'Resume', togglePause, '↻ Restart Level', restartLevel);
  } else if (state === 'pause') {
    state = 'play';
    hideOverlay();
  }
}

// ============================================================
//  Input
// ============================================================
// One tap = one action. x/y are playfield coordinates.
function handleTap(x, y) {
  if (state !== 'play' || fade) return;
  switch (scene) {
    case 'frame': frameTap(); break;
    case 'excuse': excuseTap(); break;
    case 'city': case 'hedges': worldTap(x, y); break;
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  sfx.init();
  if ((e.code === 'Enter' || e.code === 'Space') && ovAction && !e.repeat) { ovAction(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { sfx.toggleMute(); return; }
  if (e.code === 'KeyR' && state === 'pause') { restartLevel(); return; }
  keys.add(e.code);
  if (e.repeat || state !== 'play' || fade) return;
  const act = e.code === 'Space' || e.code === 'Enter';
  if (scene === 'frame' && act) frameTap();
  else if (scene === 'excuse' && act) excuseTap();
  else if ((scene === 'city' || scene === 'hedges') && act) keyInteract();
  else if (scene === 'seat' && hall) hallKey(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function toPlayfield(e) {
  return { x: e.clientX * dpr / scale - offX, y: e.clientY * dpr / scale - offY, vx: e.clientX * dpr / scale, vy: e.clientY * dpr / scale };
}

canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  const p = toPlayfield(e);
  // HUD buttons
  for (const b of hudButtons()) {
    if (Math.hypot(p.vx - b.x, p.vy - b.y) < b.r + 6) { b.action(); return; }
  }
  if (state !== 'play') return;
  ripples.push({ x: p.x, y: p.y, t: 0 });
  if (scene === 'seat' && hall && !fade) { hallDown(p.x, p.y, e.pointerId); return; }
  handleTap(p.x, p.y);
});
window.addEventListener('pointermove', (e) => {
  if (!hall || !hall.drag) return;
  const p = toPlayfield(e);
  hallMove(p.x, p.y, e.pointerId);
});
window.addEventListener('pointerup', (e) => {
  if (!hall || !hall.drag) return;
  const p = toPlayfield(e);
  hallUp(p.x, p.y, e.pointerId);
});
window.addEventListener('pointercancel', (e) => {
  if (!hall || !hall.drag) return;
  const p = toPlayfield(e);
  hallUp(p.x, p.y, e.pointerId);
});
// iOS only unlocks audio on some gestures, so try again when the finger lifts
canvas.addEventListener('pointerup', () => sfx.init());

// iOS Safari ignores user-scalable=no: stop double-tap zoom, pinch zoom and
// the long-press menu from hijacking rapid taps. The viewport tag is untouched.
const stop = (e) => e.preventDefault();
canvas.addEventListener('touchstart', stop, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); sfx.init(); }, { passive: false });
canvas.addEventListener('touchmove', stop, { passive: false });
canvas.addEventListener('dblclick', stop);
canvas.addEventListener('contextmenu', stop);
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });

function goHome() { location.href = 'index.html'; }

function hudButtons() {
  return [
    { x: 26, y: 84, r: 16, icon: 'home', action: goHome },
    { x: 64, y: 84, r: 16, icon: state === 'pause' ? 'play' : 'pause', action: togglePause },
